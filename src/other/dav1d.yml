lang: Assembly/c
homepage: https://code.videolan.org/videolan/dav1d
desc:
  en: dav1d is an AV1 cross-platform decoder, open-source, and focused on speed and correctness
  cn: dav1d 是一个 AV1 跨平台解码器，开源，并致力于速度和正确性
rule:
  darwin/brew:
    cmd: brew install dav1d
    reference: https://formulae.brew.sh/formula/dav1d#default
binlist:
- dav1d
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
