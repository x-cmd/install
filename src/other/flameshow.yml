lang: Python
homepage: https://github.com/laixintao/flameshow
license: MIT
desc:
  cn: 一个在终端中查看火焰图的工具。
  en: A flamegraph viewer in the terminal.
x:
  source: https://github.com/laixintao/flameshow
rule:
  /pip:
    cmd: pip install flameshow
    reference: https://github.com/laixintao/flameshow?tab=readme-ov-file#install
    dsnap: flameshow
  /nix:
    cmd: nix run github:laixintao/flameshow
    reference: https://github.com/laixintao/flameshow?tab=readme-ov-file#install
binlist:
- flameshow

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
