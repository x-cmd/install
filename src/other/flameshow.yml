lang: Python
homepage: https://github.com/laixintao/flameshow
license: MIT
desc:
  cn: 一个在终端中查看火焰图的工具。
  en: A flamegraph viewer in the terminal.
  cs: Prohlížeč flamegraphů v terminálu.
  de: Ein Flamegraph-Viewer im Terminal.
  es: Un visor de flamegraphs en la terminal.
  fr: Un visualiseur de flamegraphs dans le terminal.
  id: Penampil flamegraph di terminal.
  it: Un visualizzatore di flamegraph nel terminale.
  ja: ターミナル内のフレームグラフビューア。
  ko: 터미널의 프레임그래프 뷰어.
  pl: Przeglądarka flamegraphów w terminalu.
  pt: Um visualizador de flamegraphs no terminal.
  ro: Un vizualizator de flamegraph-uri în terminal.
  ru: Просмотрщик флеймграфов в терминале.
  th: เครื่องดูภาพ flamegraph ในเทอร์มินัล
  tr: Terminalde flamegraph görüntüleyici.
  uk: Переглядач флеймграфів у терміналі.
  vi: Trình xem flamegraph trong terminal.
x:
  source: https://github.com/laixintao/flameshow
  pip: flameshow
rule:
  /pip:
    cmd: pip install flameshow
    reference: https://github.com/laixintao/flameshow?tab=readme-ov-file#install
    dsnap: flameshow
  /nix:
    cmd: nix run github:laixintao/flameshow
    reference: https://github.com/laixintao/flameshow?tab=readme-ov-file#install
binlist:
- flameshow

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
