lang: Python
homepage: https://github.com/laixintao/flameshow
license: MIT
desc:
  cn: 一个在终端中查看火焰图的工具。
  en: A flamegraph viewer in the terminal.
x:
  source: https://github.com/laixintao/flameshow
  pip: flameshow
rule:
  /pip:
    cmd: pip install flameshow
    reference: https://github.com/laixintao/flameshow?tab=readme-ov-file#install
    dsnap: flameshow
  /nix:
    cmd: nix run github:laixintao/flameshow
    reference: https://github.com/laixintao/flameshow?tab=readme-ov-file#install
binlist:
- flameshow

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
