lang: Go
homepage: https://github.com/carapace-sh/carapace-bin
license: MIT
desc:
  cn: Carapace-bin 是一个命令行补全工具，能为多个 CLI 命令提供参数补全，并可跨多个 POSIX 和非 POSIX shell 工作。
  en: Carapace-bin provides argument completion for multiple CLI commands (full list), and works across multiple POSIX and non-POSIX shells.
  cs: Carapace-bin poskytuje dokončování argumentů pro více příkazů CLI a funguje v mnoha POSIX i ne-POSIX shellech
  de: Carapace-bin bietet Argumentvervollständigung für mehrere CLI-Befehle und funktioniert in vielen POSIX- und Nicht-POSIX-Shells
  es: Carapace-bin ofrece completado de argumentos para varios comandos de CLI y funciona en múltiples shells POSIX y no POSIX
  fr: Carapace-bin fournit la complétion des arguments pour plusieurs commandes CLI et fonctionne avec plusieurs shells POSIX et non-POSIX
  id: Carapace-bin menyediakan penyelesaian argumen untuk beberapa perintah CLI dan bekerja di berbagai shell POSIX dan non-POSIX
  it: Carapace-bin fornisce il completamento degli argomenti per più comandi CLI e funziona in molte shell POSIX e non POSIX
  ja: Carapace-bin は複数のCLIコマンドの引数補完を提供し、POSIX・非POSIXのさまざまなシェルに対応しています
  ko: Carapace-bin은 여러 CLI 명령에 대한 인자 완성을 제공하고 POSIX 및 비-POSIX 셸에서 동작합니다
  pl: Carapace-bin zapewnia uzupełnianie argumentów dla wielu poleceń CLI i działa w różnych powłokach POSIX i nie-POSIX
  pt: O Carapace-bin oferece completamento de argumentos para vários comandos de CLI e funciona em múltiplos shells POSIX e não-POSIX
  ro: Carapace-bin oferă completarea argumentelor pentru mai multe comenzi CLI și funcționează în numeroase shell-uri POSIX și non-POSIX
  ru: Carapace-bin обеспечивает дополнение аргументов для нескольких CLI-команд и работает в различных оболочках POSIX и не-POSIX
  th: Carapace-bin ให้การเติมข้อโต้แก้อาร์กิวเมนต์สำหรับคำสั่ง CLI หลายรายการ และทำงานได้ในเชลล์แบบ POSIX และไม่ใช่ POSIX หลายแบบ
  tr: Carapace-bin, birden çok CLI komutu için argüman tamamlama sağlar ve çeşitli POSIX ve POSIX olmayan kabuklarda çalışır
  uk: Carapace-bin надає доповнення аргументів для кількох CLI-команд і працює в різних оболонках POSIX та не-POSIX
  vi: Carapace-bin cung cấp hoàn thiện đối số cho nhiều lệnh CLI và hoạt động trên nhiều shell POSIX và không phải POSIX
x:
  source: https://github.com/carapace-sh/carapace-bin
  eget: carapace-sh/carapace-bin
  brew: rsteube/tap/carapace
  zypper: carapace-bin
  scoop: extras/carapace-bin
  yay: carapace-bin
rule:
  /x:
    cmd: x pkg use carapace-bin
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget carapace-sh/carapace-bin
    reference: https://x-cmd.com/mod/eget
  (linux|darwin|win|wsl2)/:
    cmd: x env use carapace-bin
    reference: https://x-cmd.com/mod/env
  /pamac:
    cmd: pamac install carapace-bin
    reference: https://carapace-sh.github.io/carapace-bin/install.html
  darwin/brew:
    cmd: 'brew tap rsteube/homebrew-tap

      brew install rsteube/tap/carapace

      '
    reference: https://carapace-sh.github.io/carapace-bin/install.html
  /zypper:
    cmd: 'zypper ar --gpgcheck-allow-unsigned -f https://yum.fury.io/rsteube/ carapace

      zypper install carapace-bin

      '
    reference: https://carapace-sh.github.io/carapace-bin/install.html
  (win|wsl2)/scoop:
    cmd: 'scoop bucket add extras

      scoop install extras/carapace-bin

      '
    reference: https://carapace-sh.github.io/carapace-bin/install.html
  (win|wsl2)/winget:
    cmd: winget install -e --id rsteube.Carapace
    reference: https://carapace-sh.github.io/carapace-bin/install.html
  /curl:
    cmd: curl termux.carapace.sh | sh
    reference: https://carapace-sh.github.io/carapace-bin/install.html
  arch/yay:
    cmd: yay -S carapace-bin
    reference: https://aur.archlinux.org/packages/carapace-bin
binlist:
- carapace-bin

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 32 MB
          rating: 2
          desc:
            cn: 约 32 MB（估算）
            en: ~32 MB estimated
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
