lang: C
homepage: https://github.com/irssi/irssi
desc:
  cn: Irssi 是一个模块化文本模式聊天客户端。它内置了 IRC 支持。
  en: Irssi is a modular text mode chat client. It comes with IRC support built in.
x:
  source: https://github.com/irssi/irssi
  eget: irssi/irssi
  apt: irssi
  dnf: irssi
  brew: irssi
  pacman: irssi
  apk: irssi
  apt-get: irssi
  yum: irssi
  zypper: irssi
  port: irssi
rule:
  /eget:
    cmd: x eget irssi/irssi
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install irssi
    reference: https://command-not-found.com/irssi
    dsnap: irssi
  ubuntu/apt:
    cmd: sudo apt-get install irssi
    reference: https://command-not-found.com/irssi
    dsnap: irssi
  kali/apt:
    cmd: sudo apt-get install irssi
    reference: https://command-not-found.com/irssi
    dsnap: irssi
  raspbian/apt:
    cmd: sudo apt-get install irssi
    reference: https://command-not-found.com/irssi
  mint/apt:
    cmd: sudo apt-get install irssi
    reference: https://command-not-found.com/irssi
  alpine/apk:
    cmd: sudo apk add irssi
    reference: https://command-not-found.com/irssi
    dsnap: irssi
  arch/pacman:
    cmd: sudo pacman -S irssi
    reference: https://command-not-found.com/irssi
  centos/yum:
    cmd: sudo yum install irssi
    reference: https://command-not-found.com/irssi
  fedora/dnf:
    cmd: sudo dnf install irssi
    reference: https://command-not-found.com/irssi
    dsnap: irssi
  darwin/brew:
    cmd: brew install irssi
    reference: https://formulae.brew.sh/formula/irssi#default
  opensuse/zypper:
    cmd: sudo zypper install irssi
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=irssi
  darwin/port:
    cmd: sudo port install irssi
    reference: https://ports.macports.org/port/irssi/
binlist:
- irssi
license: NOASSERTION
# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # IRC servers
    filesystem:
      read:
        desc:
          cn: 读取 ~/.irssi/config
          en: Reads ~/.irssi/config
        sensitive:
          - "$HOME/.irssi/config"
      write:
        desc:
          cn: 写入 ~/.irssi/log
          en: Writes ~/.irssi/log
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.6 MB
          rating: 1
          desc:
            cn: 约 2.6 MB（估算）
            en: ~2.6 MB estimated
        growth:
          desc:
            cn: 日志随使用增长
            en: Logs grow with usage
      paths:
        data:
          - "$HOME/.irssi/log"
        config:
          - "$HOME/.irssi/config"
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 极低（纯文本渲染）
          en: Negligible (text rendering)
