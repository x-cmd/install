lang: Python
homepage: https://github.com/gnebbia/kb
license: GPL-3.0
desc:
  cn: 极简的命令行知识库管理器
  en: A minimalist command line knowledge base manager
x:
  source: https://github.com/gnebbia/kb
rule:
  /pip:
    cmd: pip install -U kb-manager
    reference: https://github.com/gnebbia/kb?tab=readme-ov-file#installation
    dsnap: kb-manager
  arch/yay:
    cmd: yay -S kb
    reference: https://github.com/gnebbia/kb?tab=readme-ov-file#installation-from-aur
  /brew:
    cmd: 'brew tap gnebbia/kb https://github.com/gnebbia/kb.git

      brew install gnebbia/kb/kb

      '
    reference: https://github.com/gnebbia/kb?tab=readme-ov-file#installation-with-homebrew
binlist:
- kb

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
