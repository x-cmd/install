lang: Python
homepage: https://github.com/gnebbia/kb
license: GPL-3.0
desc:
  cn: 极简的命令行知识库管理器
  en: A minimalist command line knowledge base manager
  cs: Minimální správce znalostní báze pro příkazovou řádku
  de: Ein minimalistischer Knowledge-Base-Manager für die Kommandozeile
  es: Un gestor minimalista de bases de conocimiento para la línea de comandos
  fr: Un gestionnaire de base de connaissances minimaliste en ligne de commande
  id: Manajer basis pengetahuan baris perintah yang minimalistis
  it: Un gestore di base di conoscenza minimalista da riga di comando
  ja: ミニマルなコマンドラインのナレッジベースマネージャー
  ko: 미니멀한 명령줄 지식 베이스 관리자
  pl: Minimalistyczny menedżer bazy wiedzy dla wiersza poleceń
  pt: Um gerenciador de base de conhecimento minimalista de linha de comando
  ro: Un manager minimalist de bază de cunoștințe pentru linia de comandă
  ru: Минималистичный менеджер базы знаний для командной строки
  th: ตัวจัดการฐานความรู้แบบเรียบง่ายสำหรับบรรทัดคำสั่ง
  tr: Minimalist bir komut satırı bilgi tabanı yöneticisi
  uk: Мінімалістичний менеджер бази знань для командного рядка
  vi: Trình quản lý cơ sở tri thức tối giản cho dòng lệnh
x:
  source: https://github.com/gnebbia/kb
  brew: gnebbia/kb/kb
  yay: kb
rule:
  /pip:
    cmd: pip install -U kb-manager
    reference: https://github.com/gnebbia/kb?tab=readme-ov-file#installation
    dsnap: kb-manager
  arch/yay:
    cmd: yay -S kb
    reference: https://github.com/gnebbia/kb?tab=readme-ov-file#installation-from-aur
  /brew:
    cmd: 'brew tap gnebbia/kb https://github.com/gnebbia/kb.git

      brew install gnebbia/kb/kb

      '
    reference: https://github.com/gnebbia/kb?tab=readme-ov-file#installation-with-homebrew
binlist:
- kb

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
