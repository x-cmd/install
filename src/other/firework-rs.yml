lang: Rust
homepage: https://github.com/Wayoung7/firework-rs
license: MIT
desc:
  cn: 一个跨平台的终端 ASCII 艺术烟花模拟器
  en: A cross-platform ascii-art firework simulator in terminal
  cs: Cross-platform simulátor ohňostrojů s ASCII grafikou v terminálu
  de: Ein plattformübergreifender ASCII-Art-Feuerwerkssimulator im Terminal
  es: Un simulador de fuegos artificiales con arte ASCII multiplataforma en la terminal
  fr: Un simulateur de feux d'artifice en art ASCII multiplateforme dans le terminal
  id: Simulator kembang api seni ASCII lintas platform di terminal
  it: Un simulatore di fuochi d'artificio in arte ASCII multipiattaforma nel terminale
  ja: ターミナルで動作するクロスプラットフォームの ASCII アート花火シミュレーター
  ko: 터미널에서 실행되는 크로스 플랫폼 ASCII 아트 폭죽 시뮬레이터
  pl: Wieloplatformowy symulator fajerwerków w grafice ASCII w terminalu
  pt: Um simulador de fogos de artifício em arte ASCII multiplataforma no terminal
  ro: Un simulator de artificii cu artă ASCII, multiplataforma, în terminal
  ru: Кроссплатформенный симулятор фейерверков в ASCII-арт в терминале
  th: ตัวจำลองพลุไฟแบบ ASCII art ข้ามแพลตฟอร์มในเทอร์มินัล
  tr: Terminalde çapraz platform ASCII sanatı havai fişek simülatörü
  uk: Кроссплатформний симулятор фейєрверків у ASCII-графіці в терміналі
  vi: Trình mô phỏng pháo hoa nghệ thuật ASCII đa nền tảng trong terminal
x:
  source: https://github.com/Wayoung7/firework-rs
  eget: Wayoung7/firework-rs
  cargo: firework-rs
rule:
  /eget:
    cmd: x eget Wayoung7/firework-rs
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use firework-rs
    reference: https://x-cmd.com/install/
  (linux|darwin|win|wsl2)/:
    cmd: x env use firework-rs
    reference: https://x-cmd.com/mod/env
  /cargo:
    cmd: cargo install firework-rs
    reference: https://github.com/Wayoung7/firework-rs?tab=readme-ov-file#try-out-a-demo
    dsnap: firework-rs
binlist:
- firework-rs

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 382 KB
          rating: 1
          desc:
            cn: 安装 382 KB
            en: 382 KB install
        download:
          estimate: 382 KB
          desc:
            cn: 约 382 KB 下载 (linux/x64)
            en: ~382 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
