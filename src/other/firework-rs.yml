lang: Rust
homepage: https://github.com/Wayoung7/firework-rs
license: MIT
desc:
  cn: 一个跨平台的终端 ASCII 艺术烟花模拟器
  en: A cross-platform ascii-art firework simulator in terminal
x:
  pkg:
    exist: true
  source: https://github.com/Wayoung7/firework-rs
  eget: https://github.com/Wayoung7/firework-rs
rule:
  /eget:
    cmd: x eget Wayoung7/firework-rs
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use firework-rs
    reference: https://x-cmd.com/install/
  (linux|darwin|win|wsl2)/:
    cmd: x env use firework-rs
    reference: https://x-cmd.com/mod/env
  /cargo:
    cmd: cargo install firework-rs
    reference: https://github.com/Wayoung7/firework-rs?tab=readme-ov-file#try-out-a-demo
    dsnap: firework-rs
binlist:
- firework-rs

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
