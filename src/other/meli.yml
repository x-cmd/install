lang: Rust
homepage: https://git.meli-email.org/meli/meli.git
desc:
  cn: Meli 是一个可配置且可扩展的电子邮件客户端，具有合理的默认设置。
  en: meli is a configurable and extensible e-mail client with sane defaults.
  cs: meli je konfigurovatelný a rozšiřitelný e-mailový klient se sane defaults.
  de: meli ist ein konfigurierbarer und erweiterbarer E-Mail-Client mit sinnvollen Standardwerten.
  es: meli es un cliente de correo electrónico configurable y ampliable con valores predeterminados sensatos.
  fr: meli est un client de messagerie électronique configurable et extensible avec des valeurs par défaut sensées.
  id: meli adalah klien surel yang dapat dikonfigurasi dan diperluas dengan default yang masuk akal.
  it: meli è un client di posta elettronica configurabile ed estensibile con impostazioni predefinite sensate.
  ja: meli は、妥当なデフォルト設定を持つ設定可能で拡張可能なメールクライアントです。
  ko: meli는 합리적인 기본값을 갖춘 설정 및 확장 가능한 이메일 클라이언트입니다.
  pl: meli to konfigurowalny i rozszerzalny klient poczty e-mail z rozsądnymi ustawieniami domyślnymi.
  pt: O meli é um cliente de e-mail configurável e extensível com padrões de fábrica sensatos.
  ro: meli este un client de e-mail configurabil și extensibil cu valori implicite rezonabile.
  ru: meli — настраиваемый и расширяемый почтовый клиент с разумными настройками по умолчанию.
  th: meli คือไคลเอนต์อีเมลที่กำหนดค่าได้และขยายได้ พร้อมค่าเริ่มต้นที่สมเหตุสมผล
  tr: meli, makul varsayılanlara sahip yapılandırılabilir ve genişletilebilir bir e-posta istemcisidir.
  uk: meli — налаштовуваний і розширюваний поштовий клієнт із розумними параметрами за замовчуванням.
  vi: meli là ứng dụng email có thể cấu hình và mở rộng với các giá trị mặc định hợp lý
rule:
  /cargo:
    cmd: cargo install meli
    reference: https://crates.io/crates/meli
    dsnap: meli
  debian/apt:
    cmd: sudo apt install meli
    reference: https://meli-email.org/download.html#debian-official
    dsnap: meli
  darwin/port:
    cmd: sudo port install meli
    reference: https://ports.macports.org/port/meli/
  darwin/brew:
    cmd: brew install meli
    reference: https://formulae.brew.sh/formula/meli#default
  netbsd/pkgsrc:
    cmd: pkgin install meli
    reference: https://pkgsrc.se/mail/meli
  /nix-env:
    cmd: nix-env -iA nixos.meli
    reference: https://search.nixos.org/packages?channel=24.11&show=meli&from=0&size=50&sort=relevance&type=packages&query=meli
  arch/yay:
    cmd: yay -S meli
    reference: https://aur.archlinux.org/packages/meli

x:
  apt: meli
  port: meli
  brew: meli
  yay: meli
  cargo: meli
binlist:
- meli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
