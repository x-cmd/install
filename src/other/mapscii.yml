x:
  source: https://github.com/rastapasta/mapscii
  yay: nodejs-mapscii
  npm: mapscii
rule:
  /x:
    cmd: x pkg use mapscii
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g mapscii
    reference: https://github.com/rastapasta/mapscii
    dsnap: mapscii
  arch/yay:
    cmd: yay -S nodejs-mapscii
    reference: https://aur.archlinux.org/packages/nodejs-mapscii
binlist:
- mapscii

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
