lang: JavaScript
homepage: https://github.com/rastapasta/mapscii
license: MIT
desc:
  cn: ASCII 世界地图渲染器
  en: ASCII world map renderer
x:
  pkg:
    exist: true
  source: https://github.com/rastapasta/mapscii
rule:
  /x:
    cmd: x pkg use mapscii
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g mapscii
    reference: https://github.com/rastapasta/mapscii
    dsnap: mapscii
  arch/yay:
    cmd: yay -S nodejs-mapscii
    reference: https://aur.archlinux.org/packages/nodejs-mapscii
binlist:
- mapscii

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
