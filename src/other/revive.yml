lang: Go
homepage: https://github.com/mgechev/revive
license: MIT
desc:
  cn: Go 语言代码质量检测工具（golint 替代品），可配置且更为美观
  en: Go language code quality detection tool (golint replacement), configurable and more beautiful
x:
  pkg:
    exist: true
  source: https://github.com/mgechev/revive
  eget: https://github.com/mgechev/revive
rule:
  /x:
    cmd: x pkg use revive
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget mgechev/revive
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use revive
    reference: https://github.com/bjw-s/asdf-revive
  /go:
    cmd: go get -u github.com/mgechev/revive
    reference: https://revive.run/docs#installation
    dsnap: github.com/mgechev/revive
binlist:
- revive

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
