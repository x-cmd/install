lang: Go
homepage: https://github.com/mgechev/revive
license: MIT
desc:
  cn: Go 语言代码质量检测工具（golint 替代品），可配置且更为美观
  en: Go language code quality detection tool (golint replacement), configurable and more beautiful
x:
  pkg:
    exist: true
  source: https://github.com/mgechev/revive
  eget: https://github.com/mgechev/revive
rule:
  /x:
    cmd: x pkg use revive
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget mgechev/revive
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use revive
    reference: https://github.com/bjw-s/asdf-revive
  /go:
    cmd: go get -u github.com/mgechev/revive
    reference: https://revive.run/docs#installation
    dsnap: github.com/mgechev/revive
binlist:
- revive

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
