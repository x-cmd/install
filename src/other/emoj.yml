lang: TypeScript
homepage: https://github.com/sindresorhus/emoj
license: MIT
desc:
  cn: 从命令行文本中查找相关表情符号
  en: Find relevant emoji from text on the command-line
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/emoj
rule:
  /x:
    cmd: x pkg use emoj
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global emoj
    reference: https://github.com/sindresorhus/emoj?tab=readme-ov-file#install
    dsnap: emoj
  arch/yay:
    cmd: yay -S emoj
    reference: https://aur.archlinux.org/packages/emoj
binlist:
- emoj

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
