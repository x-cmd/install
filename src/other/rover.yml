lang: Rust
homepage: https://github.com/apollographql/rover
desc:
  cn: Rover 是使用 Apollo GraphOS 管理和维护图形的命令行界面
  en: Rover is the command-line interface for managing and maintaining graphs with Apollo GraphOS
  cs: Rover je rozhraní příkazového řádku pro správu a údržbu grafů pomocí Apollo GraphOS
  de: Rover ist die Kommandozeilenschnittstelle zum Verwalten und Pflegen von Graphen mit Apollo GraphOS
  es: Rover es la interfaz de línea de comandos para gestionar y mantener grafos con Apollo GraphOS
  fr: Rover est l'interface en ligne de commande pour gérer et maintenir des graphes avec Apollo GraphOS
  id: Rover adalah antarmuka baris perintah untuk mengelola dan memelihara graph dengan Apollo GraphOS
  it: Rover è l'interfaccia a riga di comando per gestire e mantenere i grafi con Apollo GraphOS
  ja: Rover は Apollo GraphOS でグラフを管理・保守するためのコマンドラインインターフェースです
  ko: Rover는 Apollo GraphOS로 그래프를 관리하고 유지 보수하는 명령줄 인터페이스입니다
  pl: Rover to interfejs wiersza poleceń do zarządzania i utrzymywania grafów za pomocą Apollo GraphOS
  pt: Rover é a interface de linha de comando para gerenciar e manter grafos com o Apollo GraphOS
  ro: Rover este interfața de linie de comandă pentru gestionarea și întreținerea grafilor cu Apollo GraphOS
  ru: Rover — это интерфейс командной строки для управления и поддержки графов с помощью Apollo GraphOS
  th: Rover คืออินเทอร์เฟซบรรทัดคำสั่งสำหรับจัดการและดูแลรักษากราฟด้วย Apollo GraphOS
  tr: Rover, Apollo GraphOS ile grafikleri yönetmek ve sürdürmek için komut satırı arayüzüdür
  uk: Rover — це інтерфейс командного рядка для керування та підтримки графів за допомогою Apollo GraphOS
  vi: Rover là giao diện dòng lệnh để quản lý và duy trì đồ thị với Apollo GraphOS
x:
  source: https://github.com/apollographql/rover
  eget: apollographql/rover
  brew: rover
rule:
  /eget:
    cmd: x eget apollographql/rover
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install rover
    reference: https://formulae.brew.sh/formula/rover#default
binlist:
- rover
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
