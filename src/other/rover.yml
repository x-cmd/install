lang: Rust
homepage: https://github.com/apollographql/rover
desc:
  cn: Rover 是使用 Apollo GraphOS 管理和维护图形的命令行界面
  en: Rover is the command-line interface for managing and maintaining graphs with Apollo GraphOS
x:
  source: https://github.com/apollographql/rover
  eget: https://github.com/apollographql/rover
rule:
  /eget:
    cmd: x eget apollographql/rover
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install rover
    reference: https://formulae.brew.sh/formula/rover#default
binlist:
- rover
license: NOASSERTION
