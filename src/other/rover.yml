lang: Rust
homepage: https://github.com/apollographql/rover
desc:
  cn: Rover 是使用 Apollo GraphOS 管理和维护图形的命令行界面
  en: Rover is the command-line interface for managing and maintaining graphs with Apollo GraphOS
x:
  source: https://github.com/apollographql/rover
  eget: https://github.com/apollographql/rover
  brew: roverrule:
  /eget:
    cmd: x eget apollographql/rover
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install rover
    reference: https://formulae.brew.sh/formula/rover#default
binlist:
- rover
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
