lang: erlang
homepage: https://github.com/processone/tsung
license: GPL-2.0
desc:
  en: Tsung is multi-protocol distributed load testing tool
  cn: Tsung 是一个多协议分布式负载测试工具
x:
  source: https://github.com/processone/tsung
rule:
  darwin/brew:
    cmd: brew install tsung
    reference: https://formulae.brew.sh/formula/tsung#default
  debian/apt:
    cmd: sudo apt-get install tsung
    reference: https://command-not-found.com/tsung
    dsnap: tsung
  ubuntu/apt:
    cmd: sudo apt-get install tsung
    reference: https://command-not-found.com/tsung
    dsnap: tsung
  kali/apt:
    cmd: sudo apt-get install tsung
    reference: https://command-not-found.com/tsung
    dsnap: tsung
  fedora/dnf:
    cmd: sudo dnf install tsung
    reference: https://command-not-found.com/tsung
  arch/yay:
    cmd: yay -S tsung
    reference: https://command-not-found.com/tsung
binlist:
- tsung

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 166 KB
          rating: 1
          desc:
            cn: 约 166 KB（估算）
            en: ~166 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
