lang: erlang
homepage: https://github.com/processone/tsung
license: GPL-2.0
desc:
  en: Tsung is multi-protocol distributed load testing tool
  cn: Tsung 是一个多协议分布式负载测试工具
x:
  source: https://github.com/processone/tsung
rule:
  darwin/brew:
    cmd: brew install tsung
    reference: https://formulae.brew.sh/formula/tsung#default
  debian/apt:
    cmd: sudo apt-get install tsung
    reference: https://command-not-found.com/tsung
    dsnap: tsung
  ubuntu/apt:
    cmd: sudo apt-get install tsung
    reference: https://command-not-found.com/tsung
    dsnap: tsung
  kali/apt:
    cmd: sudo apt-get install tsung
    reference: https://command-not-found.com/tsung
    dsnap: tsung
  fedora/dnf:
    cmd: sudo dnf install tsung
    reference: https://command-not-found.com/tsung
  arch/yay:
    cmd: yay -S tsung
    reference: https://command-not-found.com/tsung
binlist:
- tsung

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
