lang: Go
homepage: https://github.com/pressly/sup
license: MIT
desc:
  cn: Sup 是一个简单的部署工具，可以在多个主机上并行执行给定的命令集。
  en: Sup is a simple deployment tool that performs given set of commands on multiple hosts in parallel.
x:
  source: https://github.com/pressly/sup
  eget: https://github.com/pressly/sup
rule:
  /eget:
    cmd: x eget pressly/sup
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go get -u github.com/pressly/sup/cmd/sup
    reference: https://github.com/pressly/sup?tab=readme-ov-file#installation
    dsnap: github.com/pressly/sup/cmd/sup
binlist:
- sup

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 97 KB
          rating: 1
          desc:
            cn: 约 97 KB（估算）
            en: ~97 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
