lang: JavaScript
homepage: https://github.com/shelljs/shx#readme
license: MIT
desc:
  cn: shx 让您在 Node.js 项目中轻松使用跨平台的 Unix 命令。
  en: shx makes it easy to use cross-platform Unix commands in your Node.js projects.
x:
  pkg:
    exist: true
  source: https://github.com/shelljs/shx#readme
rule:
  /x:
    cmd: x pkg use shx
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g shx
    reference: https://github.com/shelljs/shx?tab=readme-ov-file#install
    dsnap: shx
binlist:
- shx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
