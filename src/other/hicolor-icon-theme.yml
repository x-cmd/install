lang: Shell
homepage: https://github.com/Distrotech/hicolor-icon-theme
license: GPL-2.0
desc:
  en: Fallback theme for FreeDesktop.org icon themes
  cn: FreeDesktop.org 图标主题的后备主题
x:
  source: https://github.com/Distrotech/hicolor-icon-theme
rule:
  darwin/brew:
    cmd: brew install hicolor-icon-theme
    reference: https://formulae.brew.sh/formula/hicolor-icon-theme#default
binlist:
- hicolor-icon-theme

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
