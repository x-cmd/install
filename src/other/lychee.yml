lang: Rust
homepage: https://github.com/lycheeverse/lychee
license: Apache-2.0
desc:
  cn: 一款用 Rust 编写的快速、异步的链接检查器。
  en: A fast, async link checker written in Rust.
  cs: Rychlý asynchronní kontrolor odkazů napsaný v Rustu.
  de: Ein schneller, asynchroner Link-Prüfer, geschrieben in Rust.
  es: Un comprobador de enlaces rápido y asíncrono escrito en Rust.
  fr: Un vérificateur de liens rapide et asynchrone écrit en Rust.
  id: Pemeriksa tautan cepat dan asinkron yang ditulis dengan Rust.
  it: Un controllore di link veloce e asincrono scritto in Rust.
  ja: Rust で書かれた高速な非同期リンクチェッカー。
  ko: Rust로 작성된 빠른 비동기 링크 검사기.
  pl: Szybki asynchroniczny sprawdzacz linków napisany w Rust.
  pt: Um verificador de links rápido e assíncrono escrito em Rust.
  ro: Un verificator de linkuri rapid și asincron scris în Rust.
  ru: Быстрый асинхронный проверщик ссылок, написанный на Rust.
  th: ตัวตรวจสอบลิงก์ที่เร็วและอะซิงโครนัส เขียนด้วย Rust
  tr: Rust ile yazılmış hızlı, asenkron bir bağlantı denetleyicisi.
  uk: Швидкий асинхронний перевіряч посилань, написаний на Rust.
  vi: Trình kiểm tra liên kết nhanh và bất đồng bộ viết bằng Rust.
x:
  source: https://github.com/lycheeverse/lychee
  eget: lycheeverse/lychee
  brew: lychee
  pacman: lychee
  apk: lychee
  zypper: lychee
  port: lychee
  scoop: lychee
  choco: lychee
  cargo: lychee
rule:
  /eget:
    cmd: x eget lycheeverse/lychee
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S lychee
    reference: https://github.com/lycheeverse/lychee#arch-linux
  opensuse/zypper:
    cmd: zypper install lychee
    reference: https://github.com/lycheeverse/lychee#opensuse-tumbleweed
  darwin/brew:
    cmd: brew install lychee
    reference: https://github.com/lycheeverse/lychee#macos
  darwin/port:
    cmd: sudo port install lychee
    reference: https://github.com/lycheeverse/lychee#macos
  alpine/apk:
    cmd: apk add lychee
    reference: https://github.com/lycheeverse/lychee#alpine-linux
  freebsd/pkg:
    cmd: pkg install lychee
    reference: https://github.com/lycheeverse/lychee#freebsd
  (win|wsl2)/scoop:
    cmd: x scoop install lychee
    reference: https://github.com/lycheeverse/lychee#scoop
  (win|wsl2)/choco:
    cmd: x choco install lychee
    reference: https://github.com/lycheeverse/lychee#chocolatey-windows
  (win|wsl2)/winget:
    cmd: x winget install -e --id lycheeverse.lychee
    reference: https://github.com/lycheeverse/lychee#installation
  /cargo:
    cmd: cargo install lychee
    reference: https://github.com/lycheeverse/lychee#cargo
    dsnap: lychee
  /nix-env:
    cmd: nix-env -iA lychee
    reference: https://github.com/lycheeverse/lychee#nixpkgs
binlist:
- lychee

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
