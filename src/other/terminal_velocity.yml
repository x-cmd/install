lang: Python
homepage: https://github.com/vhp/terminal_velocity
license: GPL-3.0
desc:
  cn: (已存档)一款适用于 UNIX 终端的快速、跨平台笔记应用程序，它是 OS X 应用程序 Notational Velocity 的克隆
  en: (Archived) A fast, cross-platform note-taking application for the UNIX terminal, inspired by Notational Velocity.
x:
  source: https://github.com/vhp/terminal_velocity
  pip: terminal_velocity
rule:
  /pip:
    cmd: pip install terminal_velocity
    reference: https://github.com/vhp/terminal_velocity?tab=readme-ov-file#installation
    dsnap: terminal_velocity
binlist:
- terminal_velocity

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
