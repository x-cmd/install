lang: C
homepage: https://github.com/weechat/weechat
license: GPL-3.0
desc:
  cn: WeeChat 是一个快速、轻量且可扩展的聊天客户端，具有基于文本的用户界面。
  en: WeeChat is a fast, light and extensible chat client, with a text-based user interface.
x:
  source: https://github.com/weechat/weechat
rule:
  arch/pacman:
    cmd: sudo pacman -S weechat
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  debian/apt:
    cmd: sudo apt-get install weechat-curses weechat-plugins
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  ubuntu/apt:
    cmd: sudo apt-get install weechat-curses weechat-plugins
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  kali/apt:
    cmd: sudo apt-get install weechat-curses weechat-plugins
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  raspbian/apt:
    cmd: sudo apt-get install weechat-curses weechat-plugins
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  mint/apt:
    cmd: sudo apt-get install weechat-curses weechat-plugins
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  fedora/dnf:
    cmd: sudo dnf install weechat
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  freebsd/pkg:
    cmd: sudo pkg install weechat
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  gentoo/emerge:
    cmd: sudo emerge weechat
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  opensuse/zypper:
    cmd: sudo zypper in weechat
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
  darwin/brew:
    cmd: brew install weechat
    reference: https://weechat.org/files/doc/weechat/stable/weechat_user.en.html#binary_packages
binlist:
- weechat

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
