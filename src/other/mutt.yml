  raspbian/apt:
    cmd: sudo apt-get install mutt
    reference: https://command-not-found.com/mutt
  mint/apt:
    cmd: sudo apt-get install mutt
    reference: https://command-not-found.com/mutt
  alpine/apk:
    cmd: sudo apk add mutt
    reference: https://command-not-found.com/mutt
  centos/yum:
    cmd: sudo yum install mutt
    reference: https://command-not-found.com/mutt
  fedora/dnf:
    cmd: sudo dnf install mutt
    reference: https://command-not-found.com/mutt

