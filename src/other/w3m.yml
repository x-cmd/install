lang: C
homepage: https://w3m.sourceforge.net/
desc:
  en: A text-based web browser
  cn: 一个基于文本的网页浏览器
rule:
  darwin/brew:
    cmd: brew install w3m
    reference: https://formulae.brew.sh/formula/w3m
  debian/apt:
    cmd: sudo apt-get install w3m
    reference: https://command-not-found.com/w3m
    dsnap: w3m
  ubuntu/apt:
    cmd: sudo apt-get install w3m
    reference: https://command-not-found.com/w3m
    dsnap: w3m
  kali/apt:
    cmd: sudo apt-get install w3m
    reference: https://command-not-found.com/w3m
    dsnap: w3m
  raspbian/apt:
    cmd: sudo apt-get install w3m
    reference: https://command-not-found.com/w3m
  mint/apt:
    cmd: sudo apt-get install w3m
    reference: https://command-not-found.com/w3m
  alpine/apk:
    cmd: sudo apk add w3m
    reference: https://command-not-found.com/w3m
    dsnap: w3m
  arch/pacman:
    cmd: sudo pacman -S w3m
    reference: https://command-not-found.com/w3m
  centos/yum:
    cmd: sudo yum install w3m
    reference: https://command-not-found.com/w3m
  fedora/dnf:
    cmd: sudo dnf install w3m
    reference: https://command-not-found.com/w3m
    dsnap: w3m
binlist:
- w3m
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
