lang: Rust
homepage: https://github.com/sorairolake/qrtool
desc:
  cn: 用于编码或解码二维码的实用程序
  en: An utility for encoding or decoding QR code
x:
  source: https://github.com/sorairolake/qrtool
  eget: https://github.com/sorairolake/qrtool
rule:
  /eget:
    cmd: x eget sorairolake/qrtool
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
    dsnap: qrtool
  /brew:
    cmd: brew install qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
  /nix-env:
    cmd: nix-env -iA nixpkgs.qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
  arch/pacman:
    cmd: pacman -S qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
  opensuse/zypper:
    cmd: zypper install qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
binlist:
- qrtool
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 189 KB
          rating: 1
          desc:
            cn: 约 189 KB（估算）
            en: ~189 KB estimated
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
