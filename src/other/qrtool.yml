lang: Rust
homepage: https://github.com/sorairolake/qrtool
desc:
  cn: 用于编码或解码二维码的实用程序
  en: An utility for encoding or decoding QR code
  cs: Nástroj pro kódování nebo dekódování QR kódů
  de: Ein Werkzeug zum Kodieren oder Dekodieren von QR-Codes
  es: Una utilidad para codificar o decodificar códigos QR
  fr: Un utilitaire pour encoder ou décoder des codes QR
  id: Utilitas untuk mengodekan atau mendekodekan kode QR
  it: Un'utilità per codificare o decodificare codici QR
  ja: QR コードをエンコードまたはデコードするユーティリティ
  ko: QR 코드를 인코딩하거나 디코딩하는 유틸리티
  pl: Narzędzie do kodowania lub dekodowania kodów QR
  pt: Um utilitário para codificar ou decodificar códigos QR
  ro: O utilitar pentru codificarea sau decodificarea codurilor QR
  ru: Утилита для кодирования или декодирования QR-кодов
  th: ยูทิลิตี้สำหรับเข้ารหัสหรือถอดรหัสคิวอาร์โค้ด
  tr: QR kodlarını kodlamak veya çözmek için bir araç
  uk: Утиліта для кодування або декодування QR-кодів
  vi: Tiện ích để mã hóa hoặc giải mã mã QR
x:
  source: https://github.com/sorairolake/qrtool
  eget: sorairolake/qrtool
  brew: qrtool
  pacman: qrtool
  zypper: qrtool
  cargo: qrtool
rule:
  /eget:
    cmd: x eget sorairolake/qrtool
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
    dsnap: qrtool
  /brew:
    cmd: brew install qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
  /nix-env:
    cmd: nix-env -iA nixpkgs.qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
  arch/pacman:
    cmd: pacman -S qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
  opensuse/zypper:
    cmd: zypper install qrtool
    reference: https://github.com/sorairolake/qrtool?tab=readme-ov-file#installation
binlist:
- qrtool
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
