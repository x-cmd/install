lang: Makefile/python
homepage: https://salsa.debian.org/iso-codes-team/iso-codes
desc:
  en: This project provides lists of various ISO standards (countries, languages, language scripts, and currency names) in one place
  cn: 该项目在一个地方提供各种 ISO 标准(国家、语言、语言脚本和货币名称)的列表
rule:
  darwin/brew:
    cmd: brew install iso-codes
    reference: https://formulae.brew.sh/formula/iso-codes#default
binlist:
- iso-codes
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
