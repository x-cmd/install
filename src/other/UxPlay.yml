lang: C
homepage: https://github.com/antimof/UxPlay
license: GPL-3.0
desc:
  cn: 适用于 Linux、macOS 和 Unix 的 AirPlay 镜像和 AirPlay 音频服务器
  en: AirPlay-Mirror and AirPlay-Audio server for Linux, macOS, and Unix
  cs: Server AirPlay-Mirror a AirPlay-Audio pro Linux, macOS a Unix
  de: AirPlay-Mirror- und AirPlay-Audio-Server für Linux, macOS und Unix
  es: Servidor AirPlay-Mirror y AirPlay-Audio para Linux, macOS y Unix
  fr: Serveur AirPlay-Mirror et AirPlay-Audio pour Linux, macOS et Unix
  id: Server AirPlay-Mirror dan AirPlay-Audio untuk Linux, macOS, dan Unix
  it: Server AirPlay-Mirror e AirPlay-Audio per Linux, macOS e Unix
  ja: Linux、macOS、Unix向けのAirPlayミラーおよびAirPlayオーディオサーバー
  ko: Linux, macOS, Unix용 AirPlay 미러 및 AirPlay 오디오 서버
  pl: Serwer AirPlay-Mirror i AirPlay-Audio dla systemów Linux, macOS i Unix
  pt: Servidor AirPlay-Mirror e AirPlay-Audio para Linux, macOS e Unix
  ro: Server AirPlay-Mirror și AirPlay-Audio pentru Linux, macOS și Unix
  ru: Сервер AirPlay-Mirror и AirPlay-Audio для Linux, macOS и Unix
  th: เซิร์ฟเวอร์ AirPlay-Mirror และ AirPlay-Audio สำหรับ Linux, macOS และ Unix
  tr: Linux, macOS ve Unix için AirPlay-Mirror ve AirPlay-Audio sunucusu
  uk: Сервер AirPlay-Mirror та AirPlay-Audio для Linux, macOS і Unix
  vi: Máy chủ AirPlay-Mirror và AirPlay-Audio cho Linux, macOS và Unix
x:
  source: https://github.com/antimof/UxPlay
  apt: uxplay
  dnf: uxplay
  yay: uxplay
rule:
  debian/apt:
    cmd: sudo apt install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  ubuntu/apt:
    cmd: sudo apt install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  freebsd/pkg:
    cmd: sudo pkg install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
  fedora/dnf:
    cmd: sudo dnf install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  arch/yay:
    cmd: yay -S uxplay
    reference: https://aur.archlinux.org/packages/uxplay
binlist:
- UxPlay

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.6 MB
          rating: 1
          desc:
            cn: 约 1.6 MB（估算）
            en: ~1.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
