lang: C
homepage: https://github.com/antimof/UxPlay
license: GPL-3.0
desc:
  cn: 适用于 Linux、macOS 和 Unix 的 AirPlay 镜像和 AirPlay 音频服务器
  en: AirPlay-Mirror and AirPlay-Audio server for Linux, macOS, and Unix
x:
  source: https://github.com/antimof/UxPlay
  apt: uxplay
  dnf: uxplay
  yay: uxplay
  pkg: uxplay
rule:
  debian/apt:
    cmd: sudo apt install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  ubuntu/apt:
    cmd: sudo apt install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  freebsd/pkg:
    cmd: sudo pkg install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
  fedora/dnf:
    cmd: sudo dnf install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  arch/yay:
    cmd: yay -S uxplay
    reference: https://aur.archlinux.org/packages/uxplay
binlist:
- UxPlay

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.6 MB
          rating: 1
          desc:
            cn: 约 1.6 MB（估算）
            en: ~1.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
