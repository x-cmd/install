lang: C
homepage: https://github.com/antimof/UxPlay
license: GPL-3.0
desc:
  cn: 适用于 Linux、macOS 和 Unix 的 AirPlay 镜像和 AirPlay 音频服务器
  en: AirPlay-Mirror and AirPlay-Audio server for Linux, macOS, and Unix
x:
  source: https://github.com/antimof/UxPlay
rule:
  debian/apt:
    cmd: sudo apt install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  ubuntu/apt:
    cmd: sudo apt install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  freebsd/pkg:
    cmd: sudo pkg install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
  fedora/dnf:
    cmd: sudo dnf install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  arch/yay:
    cmd: yay -S uxplay
    reference: https://aur.archlinux.org/packages/uxplay
binlist:
- UxPlay
