lang: C
homepage: https://github.com/antimof/UxPlay
license: GPL-3.0
desc:
  cn: 适用于 Linux、macOS 和 Unix 的 AirPlay 镜像和 AirPlay 音频服务器
  en: AirPlay-Mirror and AirPlay-Audio server for Linux, macOS, and Unix
x:
  source: https://github.com/antimof/UxPlay
rule:
  debian/apt:
    cmd: sudo apt install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  ubuntu/apt:
    cmd: sudo apt install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  freebsd/pkg:
    cmd: sudo pkg install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
  fedora/dnf:
    cmd: sudo dnf install uxplay
    reference: https://github.com/antimof/UxPlay?tab=readme-ov-file#packaging-status-linux-and-bsd-distributions
    dsnap: uxplay
  arch/yay:
    cmd: yay -S uxplay
    reference: https://aur.archlinux.org/packages/uxplay
binlist:
- UxPlay

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
