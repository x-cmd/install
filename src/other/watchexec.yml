lang: Rust
homepage: https://github.com/watchexec/watchexec
license: Apache-2.0
desc:
  cn: watchexec 是一个简单的独立工具，可以监视路径并在检测到修改时运行命令
  en: watchexec is a simple, standalone tool that watches a path and runs a command whenever it detects modifications
x:
  source: https://github.com/watchexec/watchexec
  eget: https://github.com/watchexec/watchexec
  apt: watchexec-cli
  brew: watchexec
  pacman: watchexec
  apk: watchexec
  zypper: watchexec
  emerge: -av
  xbps: watchexec
  scoop: watchexec
  choco: watchexec
  cargo: --locked
  asdf: watchexec
rule:
  /x:
    cmd: x pkg use watchexec
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget watchexec/watchexec
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use watchexec
    reference: https://github.com/nyrst/asdf-watchexec
  /cargo:
    cmd: cargo install --locked watchexec-cli
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
    dsnap: watchexec-cli
  darwin/brew:
    cmd: brew install watchexec
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
  nix/:
    cmd: nix-shell -p watchexec
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
  alpine/apk:
    cmd: sudo apk add watchexec
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
    dsnap: watchexec
  debian/apt:
    cmd: sudo apt install watchexec-cli
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
    dsnap: watchexec-cli
  ubuntu/apt:
    cmd: sudo apt install watchexec-cli
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
    dsnap: watchexec-cli
  arch/pacman:
    cmd: sudo pacman -S watchexec
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
  kali/apt:
    cmd: sudo apt install watchexec-cli
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
    dsnap: watchexec-cli
  raspbian/apt:
    cmd: sudo apt install watchexec-cli
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
  gentoo/emerge:
    cmd: sudo emerge -av watchexec
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
  manjaro/pamac:
    cmd: sudo pamac install watchexec
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
  opensuse/zypper:
    cmd: sudo zypper install watchexec
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
  void/xbps:
    cmd: xbps-install -S watchexec
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
  (win|wsl2)/scoop:
    cmd: x scoop install watchexec
    reference: https://scoop.sh/#/apps?q=watchexec
  (win|wsl2)/choco:
    cmd: x choco install watchexec
    reference: https://community.chocolatey.org/packages?q=watchexec
  win/msys2:
    cmd: sudo pacman -S mingw-w64-x86_64-watchexec
    reference: https://github.com/watchexec/watchexec/blob/main/doc/packages.md
binlist:
- watchexec

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 784 KB
          rating: 1
          desc:
            cn: 约 784 KB（估算）
            en: ~784 KB estimated
        download:
          estimate: 65 B
          desc:
            cn: 约 65 B 下载 (linux/x64)
            en: ~65 B download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
