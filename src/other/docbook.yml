lang: XSLT
homepage: https://github.com/docbook/docbook
desc:
  en: DocBook is a schema (available in several languages including RELAX NG, SGML and XML DTDs, and W3C XML Schema) maintained by the DocBook Technical Committee of OASIS
  cn: DocBook 是 OASIS DocBook 技术委员会维护的一个模式(包括 RELAX NG、 SGML 和 XML DTD 以及 W3C XML Schema 等多种语言)
x:
  source: https://github.com/docbook/docbook
  eget: https://github.com/docbook/docbook
rule:
  /eget:
    cmd: x eget docbook/docbook
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install docbook
    reference: https://formulae.brew.sh/formula/docbook#default
binlist:
- docbook
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
