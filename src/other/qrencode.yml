lang: C
homepage: https://github.com/fukuchi/libqrencode
license: LGPL-2.1
desc:
  cn: 一个用于将数据编码为 QR 码符号的开源命令行工具和库
  en: An open-source command-line tool and library for encoding data into QR code symbols
  cs: Nástroj a knihovna příkazového řádku s otevřeným zdrojovým kódem pro kódování dat do QR symbolů
  de: Ein quelloffenes Kommandozeilenwerkzeug und eine Bibliothek zum Kodieren von Daten in QR-Code-Symbole
  es: Una herramienta de línea de comandos y una biblioteca de código abierto para codificar datos en símbolos de código QR
  fr: Un outil en ligne de commande et une bibliothèque open source pour encoder des données en symboles de code QR
  id: Alat baris perintah dan pustaka sumber terbuka untuk mengodekan data menjadi simbol kode QR
  it: Uno strumento da riga di comando e una libreria open source per codificare dati in simboli di codice QR
  ja: データを QR コードシンボルにエンコードするためのオープンソースのコマンドラインツールとライブラリ
  ko: 데이터를 QR 코드 심볼로 인코딩하는 오픈 소스 명령줄 도구 및 라이브러리
  pl: Narzędzie wiersza poleceń i biblioteka o otwartym kodzie do kodowania danych w symbole kodów QR
  pt: Uma ferramenta de linha de comando e biblioteca de código aberto para codificar dados em símbolos de código QR
  ro: Un instrument de linie de comandă și o bibliotecă open source pentru codificarea datelor în simboluri de cod QR
  ru: Открытый инструмент командной строки и библиотека для кодирования данных в символы QR-кода
  th: เครื่องมือบรรทัดคำสั่งและไลบรารีโอเพนซอร์สสำหรับเข้ารหัสข้อมูลเป็นสัญลักษณ์คิวอาร์โค้ด
  tr: Verileri QR kod sembollerine kodlamak için açık kaynaklı bir komut satırı aracı ve kitaplığı
  uk: Відкритий інструмент командного рядка та бібліотека для кодування даних у символи QR-коду
  vi: Công cụ dòng lệnh và thư viện mã nguồn mở để mã hóa dữ liệu thành ký hiệu mã QR
x:
  source: https://github.com/fukuchi/libqrencode
  apt: qrencode
  dnf: qrencode
  brew: qrencode
  pacman: qrencode
  apt-get: qrencode
  yum: qrencode
rule:
  /x:
    cmd: x pkg use qrencode
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install qrencode
    reference: https://formulae.brew.sh/formula/qrencode#default
  debian/apt:
    cmd: sudo apt-get install qrencode
    reference: https://command-not-found.com/qrencode
    dsnap: qrencode
  ubuntu/apt:
    cmd: sudo apt-get install qrencode
    reference: https://command-not-found.com/qrencode
    dsnap: qrencode
  arch/pacman:
    cmd: sudo pacman -S qrencode
    reference: https://command-not-found.com/qrencode
  kali/apt:
    cmd: sudo apt-get install qrencode
    reference: https://command-not-found.com/qrencode
    dsnap: qrencode
  centos/yum:
    cmd: sudo yum install qrencode
    reference: https://command-not-found.com/qrencode
  fedora/dnf:
    cmd: sudo dnf install qrencode
    reference: https://command-not-found.com/qrencode
    dsnap: qrencode
  raspbian/apt:
    cmd: sudo apt-get install qrencode
    reference: https://command-not-found.com/qrencode
binlist:
- qrencode

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
