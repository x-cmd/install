lang: C
homepage: https://github.com/fukuchi/libqrencode
license: LGPL-2.1
desc:
  cn: 一个用于将数据编码为 QR 码符号的开源命令行工具和库
  en: An open-source command-line tool and library for encoding data into QR code symbols
x:
  pkg:
    exist: true
  source: https://github.com/fukuchi/libqrencode
rule:
  /x:
    cmd: x pkg use qrencode
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install qrencode
    reference: https://formulae.brew.sh/formula/qrencode#default
  debian/apt:
    cmd: sudo apt-get install qrencode
    reference: https://command-not-found.com/qrencode
    dsnap: qrencode
  ubuntu/apt:
    cmd: sudo apt-get install qrencode
    reference: https://command-not-found.com/qrencode
    dsnap: qrencode
  arch/pacman:
    cmd: sudo pacman -S qrencode
    reference: https://command-not-found.com/qrencode
  kali/apt:
    cmd: sudo apt-get install qrencode
    reference: https://command-not-found.com/qrencode
    dsnap: qrencode
  centos/yum:
    cmd: sudo yum install qrencode
    reference: https://command-not-found.com/qrencode
  fedora/dnf:
    cmd: sudo dnf install qrencode
    reference: https://command-not-found.com/qrencode
    dsnap: qrencode
  raspbian/apt:
    cmd: sudo apt-get install qrencode
    reference: https://command-not-found.com/qrencode
binlist:
- qrencode

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
