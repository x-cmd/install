lang: JavaScript
homepage: http://github.com/shelljs/shelljs
license: BSD-3-Clause
desc:
  cn: Node.js 的可移植 Unix shell 命令
  en: Portable Unix shell commands for Node.js
x:
  pkg:
    exist: true
  source: http://github.com/shelljs/shelljs
rule:
  /x:
    cmd: x pkg use shelljs
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g shelljs
    reference: https://www.npmjs.com/package/shelljs
    dsnap: shelljs
binlist:
- shelljs

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
