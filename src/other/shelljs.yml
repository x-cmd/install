lang: JavaScript
homepage: http://github.com/shelljs/shelljs
license: BSD-3-Clause
desc:
  cn: Node.js 的可移植 Unix shell 命令
  en: Portable Unix shell commands for Node.js
  cs: Přenosné unixové příkazy pro Node.js
  de: Portable Unix-Shell-Befehle für Node.js
  es: Comandos shell de Unix portables para Node.js
  fr: Commandes shell Unix portables pour Node.js
  id: Perintah shell Unix portabel untuk Node.js
  it: Comandi shell Unix portabili per Node.js
  ja: Node.js 向けの移植可能な Unix シェルコマンド
  ko: Node.js를 위한 이식 가능한 Unix 셸 명령
  pl: Przenośne polecenia powłoki Unixa dla Node.js
  pt: Comandos shell Unix portáteis para Node.js
  ro: Comenzi shell Unix portabile pentru Node.js
  ru: Переносимые команды Unix-оболочки для Node.js
  th: คำสั่งเชลล์ Unix แบบพกพาสำหรับ Node.js
  tr: Node.js için taşınabilir Unix kabuk komutları
  uk: Переносні команди Unix-оболонки для Node.js
  vi: Các lệnh shell Unix có thể mang theo cho Node.js
x:
  source: http://github.com/shelljs/shelljs
  npm: shelljs
rule:
  /x:
    cmd: x pkg use shelljs
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g shelljs
    reference: https://www.npmjs.com/package/shelljs
    dsnap: shelljs
binlist:
- shelljs

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 17 KB
          rating: 1
          desc:
            cn: 约 17 KB（估算）
            en: ~17 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
