lang: Rust
homepage: https://github.com/osa1/tiny
license: MIT
desc:
  cn: tiny 是用 Rust 编写的 IRC 客户端
  en: tiny is an IRC client written in Rust
x:
  source: https://github.com/osa1/tiny
  eget: https://github.com/osa1/tiny
rule:
  /eget:
    cmd: x eget osa1/tiny
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install --git https://github.com/osa1/tiny
    reference: https://github.com/osa1/tiny?tab=readme-ov-file#installation
    dsnap: tiny
binlist:
- tiny

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
