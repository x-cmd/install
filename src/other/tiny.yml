lang: Rust
homepage: https://github.com/osa1/tiny
license: MIT
desc:
  cn: tiny 是用 Rust 编写的 IRC 客户端
  en: tiny is an IRC client written in Rust
  cs: tiny je IRC klient napsaný v jazyce Rust
  de: tiny ist ein in Rust geschriebener IRC-Client
  es: tiny es un cliente IRC escrito en Rust
  fr: tiny est un client IRC écrit en Rust
  id: tiny adalah klien IRC yang ditulis dengan Rust
  it: tiny è un client IRC scritto in Rust
  ja: tiny は Rust で書かれた IRC クライアントです
  ko: tiny는 Rust로 작성된 IRC 클라이언트입니다
  pl: tiny to klient IRC napisany w Rust
  pt: tiny é um cliente IRC escrito em Rust
  ro: tiny este un client IRC scris în Rust
  ru: tiny — IRC-клиент, написанный на Rust
  th: tiny คือไคลเอนต์ IRC ที่เขียนด้วย Rust
  tr: tiny, Rust ile yazılmış bir IRC istemcisidir
  uk: tiny — IRC-клієнт, написаний на Rust
  vi: tiny là ứng dụng khách IRC được viết bằng Rust
x:
  source: https://github.com/osa1/tiny
  eget: osa1/tiny
rule:
  /eget:
    cmd: x eget osa1/tiny
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install --git https://github.com/osa1/tiny
    reference: https://github.com/osa1/tiny?tab=readme-ov-file#installation
    dsnap: tiny
binlist:
- tiny

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/arm64)
            en: ~1 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
