lang: Shell
homepage: https://github.com/ohmyzsh/ohmyzsh
license: MIT
desc:
  cn: Oh My Zsh 是一个开源、社区驱动的框架，用于管理您的 zsh 配置
  en: Oh My Zsh is an open source, community-driven framework for managing your zsh configuration
  cs: Oh My Zsh je open source framework řízený komunitou pro správu konfigurace zsh
  de: Oh My Zsh ist ein quelloffenes, community-getriebenes Framework zur Verwaltung deiner zsh-Konfiguration
  es: Oh My Zsh es un framework de código abierto y dirigido por la comunidad para gestionar tu configuración de zsh
  fr: Oh My Zsh est un framework open source piloté par la communauté pour gérer votre configuration zsh
  id: Oh My Zsh adalah framework open source yang digerakkan oleh komunitas untuk mengelola konfigurasi zsh Anda
  it: Oh My Zsh è un framework open source guidato dalla community per gestire la tua configurazione zsh
  ja: Oh My Zsh は、zsh の設定を管理するためのオープンソースでコミュニティ主導のフレームワークです
  ko: Oh My Zsh는 zsh 설정을 관리하기 위한 오픈 소스 커뮤니티 중심 프레임워크입니다
  pl: Oh My Zsh to open source'owe, rozwijane przez społeczność środowisko do zarządzania konfiguracją zsh
  pt: Oh My Zsh é um framework de código aberto, mantido pela comunidade, para gerenciar sua configuração do zsh
  ro: Oh My Zsh este un framework open source, dezvoltat de comunitate, pentru gestionarea configurației tale zsh
  ru: Oh My Zsh — это открытый фреймворк, развиваемый сообществом, для управления конфигурацией zsh
  th: Oh My Zsh เป็นเฟรมเวิร์กโอเพนซอร์สที่ขับเคลื่อนโดยชุมชนสำหรับการจัดการค่ากำหนดของ zsh
  tr: Oh My Zsh, zsh yapılandırmanızı yönetmek için açık kaynaklı, topluluk destekli bir çerçevedir
  uk: Oh My Zsh — це відкритий фреймворк, що розвивається спільнотою, для керування конфігурацією zsh
  vi: Oh My Zsh là khung mã nguồn mở do cộng đồng phát triển để quản lý cấu hình zsh của bạn
x:
  source: https://github.com/ohmyzsh/ohmyzsh
  yay: oh-my-zsh-git
rule:
  /curl:
    cmd: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
    reference: https://ohmyz.sh/
  /wget:
    cmd: sh -c "$(wget https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh -O -)"
    reference: https://ohmyz.sh/
  /fetch:
    cmd: sh -c "$(fetch -o - https://install.ohmyz.sh/)"
    reference: https://ohmyz.sh/
  arch/yay:
    cmd: yay -S oh-my-zsh-git
    reference: https://aur.archlinux.org/packages/oh-my-zsh-git
binlist:
- oh-my-zsh

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
