lang: Shell
homepage: https://github.com/ohmyzsh/ohmyzsh
license: MIT
desc:
  cn: Oh My Zsh 是一个开源、社区驱动的框架，用于管理您的 zsh 配置
  en: Oh My Zsh is an open source, community-driven framework for managing your zsh configuration
x:
  source: https://github.com/ohmyzsh/ohmyzsh
rule:
  /curl:
    cmd: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
    reference: https://ohmyz.sh/
  /wget:
    cmd: sh -c "$(wget https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh -O -)"
    reference: https://ohmyz.sh/
  /fetch:
    cmd: sh -c "$(fetch -o - https://install.ohmyz.sh/)"
    reference: https://ohmyz.sh/
  arch/yay:
    cmd: yay -S oh-my-zsh-git
    reference: https://aur.archlinux.org/packages/oh-my-zsh-git
binlist:
- oh-my-zsh

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
