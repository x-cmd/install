lang: Python
homepage: https://github.com/ihabunek/toot
license: GPL-3.0
desc:
  cn: Toot 是一个命令行（CLI）和终端用户界面（TUI）工具，用于从命令行与 Mastodon（及其他兼容）实例进行交互。
  en: Toot is a CLI and TUI tool for interacting with Mastodon (and other compatible) instances from the command line.
  cs: Toot je nástroj CLI a TUI pro interakci s instancemi Mastodon (a dalšími kompatibilními) z příkazové řádky.
  de: Toot ist ein CLI- und TUI-Werkzeug zur Interaktion mit Mastodon-Instanzen (und anderen kompatiblen) über die Kommandozeile.
  es: Toot es una herramienta de CLI y TUI para interactuar con instancias de Mastodon (y otras compatibles) desde la línea de órdenes.
  fr: Toot est un outil CLI et TUI permettant d'interagir avec des instances Mastodon (et d'autres compatibles) depuis la ligne de commande.
  id: Toot adalah alat CLI dan TUI untuk berinteraksi dengan instance Mastodon (dan instance kompatibel lainnya) dari baris perintah.
  it: Toot è uno strumento CLI e TUI per interagire con istanze Mastodon (e altre compatibili) dalla riga di comando.
  ja: Toot は、コマンドラインから Mastodon（およびその他の互換インスタンス）と対話するための CLI および TUI ツールです。
  ko: Toot은(는) 명령줄에서 Mastodon(및 기타 호환 인스턴스)과 상호작용하기 위한 CLI 및 TUI 도구입니다.
  pl: Toot to narzędzie CLI i TUI do interakcji z instancjami Mastodon (i innymi kompatybilnymi) z wiersza poleceń.
  pt: Toot é uma ferramenta de CLI e TUI para interagir com instâncias do Mastodon (e outras compatíveis) a partir da linha de comando.
  ro: Toot este un instrument CLI și TUI pentru a interacționa cu instanțe Mastodon (și altele compatibile) din linia de comandă.
  ru: Toot — инструмент CLI и TUI для взаимодействия с экземплярами Mastodon (и другими совместимыми) из командной строки.
  th: Toot เป็นเครื่องมือ CLI และ TUI สำหรับโต้ตอบกับอินสแตนซ์ Mastodon (และที่เข้ากันได้อื่น ๆ) จากบรรทัดคำสั่ง
  tr: Toot, Mastodon (ve diğer uyumlu) örneklerle komut satırından etkileşmek için bir CLI ve TUI aracıdır.
  uk: Toot — інструмент CLI та TUI для взаємодії з екземплярами Mastodon (та іншими сумісними) з командного рядка.
  vi: Toot là công cụ CLI và TUI để tương tác với các phiên bản Mastodon (và các bản tương thích khác) từ dòng lệnh.
x:
  source: https://github.com/ihabunek/toot
  apt: toot
  brew: toot
  apt-get: toot
rule:
  darwin/brew:
    cmd: brew install toot
    reference: https://toot.bezdomni.net/installation.html#homebrew
  /pipx:
    cmd: pipx install toot
    reference: https://toot.bezdomni.net/installation.html#using-pipx
  debian/brew:
    cmd: sudo apt-get install toot
    reference: https://command-not-found.com/toot
  ubuntu/brew:
    cmd: sudo apt-get install toot
    reference: https://command-not-found.com/toot
  kali/brew:
    cmd: sudo apt-get install toot
    reference: https://command-not-found.com/toot
binlist:
- toot

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 KB
          rating: 1
          desc:
            cn: 约 20 KB（估算）
            en: ~20 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
