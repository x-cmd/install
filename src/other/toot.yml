lang: Python
homepage: https://github.com/ihabunek/toot
license: GPL-3.0
desc:
  cn: Toot 是一个命令行（CLI）和终端用户界面（TUI）工具，用于从命令行与 Mastodon（及其他兼容）实例进行交互。
  en: Toot is a CLI and TUI tool for interacting with Mastodon (and other compatible) instances from the command line.
x:
  source: https://github.com/ihabunek/toot
rule:
  darwin/brew:
    cmd: brew install toot
    reference: https://toot.bezdomni.net/installation.html#homebrew
  /pipx:
    cmd: pipx install toot
    reference: https://toot.bezdomni.net/installation.html#using-pipx
  debian/brew:
    cmd: sudo apt-get install toot
    reference: https://command-not-found.com/toot
  ubuntu/brew:
    cmd: sudo apt-get install toot
    reference: https://command-not-found.com/toot
  kali/brew:
    cmd: sudo apt-get install toot
    reference: https://command-not-found.com/toot
binlist:
- toot

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
