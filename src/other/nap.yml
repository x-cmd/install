lang: Go
homepage: https://github.com/maaslalani/nap
desc:
  cn: 基于终端的代码片段管理器，具有命令行界面 (CLI) 和文本用户界面 (TUI)
  en: A terminal-based code snippet manager with a command-line interface (CLI) and a text-user interface (TUI)
x:
  source: https://github.com/maaslalani/nap
  eget: https://github.com/maaslalani/nap
rule:
  /eget:
    cmd: x eget maaslalani/nap
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install nap
    reference: https://formulae.brew.sh/formula/nap#default
  /nix-env:
    cmd: nix-env -iA nap
    reference: https://github.com/maaslalani/nap#installation
  /go:
    cmd: go install github.com/maaslalani/nap@main
    reference: https://github.com/maaslalani/nap#installation
    dsnap: github.com/maaslalani/nap@main
binlist:
- nap
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
