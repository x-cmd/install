lang: Python
homepage: https://github.com/jarun/googler
license: GPL-3.0
desc:
  cn: 在终端中使用谷歌搜索(已存档)
  en: Google Search, Google Site Search, Google News from the terminal(archived)
x:
  source: https://github.com/jarun/googler
rule:
  /curl:
    cmd: 'sudo curl -o /usr/local/bin/googler https://raw.githubusercontent.com/jarun/googler/v4.3.2/googler && sudo chmod +x /usr/local/bin/googler

      '
    reference: https://github.com/darrikonn/td-cli?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install googler
    reference: https://community.chocolatey.org/packages/googler
  debian/apt:
    cmd: sudo apt-get install googler
    reference: https://command-not-found.com/googler
    dsnap: googler
  ubuntu/apt:
    cmd: sudo apt-get install googler
    reference: https://command-not-found.com/googler
    dsnap: googler
  kali/apt:
    cmd: sudo apt-get install googler
    reference: https://command-not-found.com/googler
    dsnap: googler
  fedora/dnf:
    cmd: sudo dnf install googler
    reference: https://command-not-found.com/googler
  arch/yay:
    cmd: yay -S googler
    reference: https://aur.archlinux.org/packages/googler
binlist:
- googler

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
