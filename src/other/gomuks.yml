lang: Go
homepage: https://github.com/tulir/gomuks
license: AGPL-3.0
desc:
  cn: 用 Go 编写的 Matrix 客户端
  en: A Matrix client written in Go.
x:
  source: https://github.com/tulir/gomuks
  eget: https://github.com/tulir/gomuks
rule:
  /eget:
    cmd: x eget tulir/gomuks
    reference: https://x-cmd.com/mod/eget
  opensuse/zypper:
    cmd: sudo zypper install gomuks
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=gomuks
  darwin/port:
    cmd: sudo port install gomuks
    reference: https://ports.macports.org/port/gomuks/
binlist:
- gomuks

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
