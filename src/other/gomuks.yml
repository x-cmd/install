lang: Go
homepage: https://github.com/tulir/gomuks
license: AGPL-3.0
desc:
  cn: 用 Go 编写的 Matrix 客户端
  en: A Matrix client written in Go.
x:
  source: https://github.com/tulir/gomuks
  eget: https://github.com/tulir/gomuks
rule:
  /eget:
    cmd: x eget tulir/gomuks
    reference: https://x-cmd.com/mod/eget
  opensuse/zypper:
    cmd: sudo zypper install gomuks
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=gomuks
  darwin/port:
    cmd: sudo port install gomuks
    reference: https://ports.macports.org/port/gomuks/
binlist:
- gomuks

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
        download:
          estimate: 77 MB
          desc:
            cn: 约 77 MB 下载 (macos/x64)
            en: ~77 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
