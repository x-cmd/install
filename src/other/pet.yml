lang: Go
homepage: https://github.com/knqyf263/pet
license: MIT
desc:
  cn: pet 是一个简单的命令行片段管理器
  en: pet is a simple command-line snippet manager
  cs: pet je jednoduchý správce úryvků příkazového řádku
  de: pet ist ein einfacher Snippet-Manager für die Kommandozeile
  es: pet es un gestor de fragmentos de línea de comandos sencillo
  fr: pet est un simple gestionnaire de fragments en ligne de commande
  id: pet adalah pengelola potongan baris perintah yang sederhana
  it: pet è un semplice gestore di snippet da riga di comando
  ja: pet はシンプルなコマンドライン用スニペットマネージャーです
  ko: pet은 간단한 명령줄 스니펫 관리자입니다
  pl: pet to prosty menedżer fragmentów wiersza poleceń
  pt: pet é um simples gerenciador de trechos de linha de comando
  ro: pet este un simplu manager de fragmente din linia de comandă
  ru: pet — простой менеджер фрагментов командной строки
  th: pet เป็นตัวจัดการชิ้นส่วนบรรทัดคำสั่งอย่างง่ายดาย
  tr: pet, komut satırı için basit bir parça yöneticisidir
  uk: pet — простий менеджер фрагментів командного рядка
  vi: pet là trình quản lý đoạn lệnh dòng lệnh đơn giản
x:
  source: https://github.com/knqyf263/pet
  eget: knqyf263/pet
  dnf: pet
  brew: knqyf263/pet/pet
  yay: pet-git
rule:
  /eget:
    cmd: x eget knqyf263/pet
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install knqyf263/pet/pet
    reference: https://github.com/knqyf263/pet?tab=readme-ov-file#mac-os-x--homebrew
  fedora/dnf:
    cmd: sudo dnf install pet
    reference: https://github.com/knqyf263/pet?tab=readme-ov-file#fedora-redhat-centos
    dsnap: pet
  rhel/dnf:
    cmd: sudo dnf install pet
    reference: https://github.com/knqyf263/pet?tab=readme-ov-file#fedora-redhat-centos
  centos/dnf:
    cmd: sudo dnf install pet
    reference: https://github.com/knqyf263/pet?tab=readme-ov-file#fedora-redhat-centos
  debian/wget:
    cmd: 'wget https://github.com/knqyf263/pet/releases/download/vx.x.x/pet_1.0.1_linux_amd64.deb && \

      sudo dpkg -i pet_1.0.1_linux_amd64.deb

      '
    reference: https://github.com/knqyf263/pet?tab=readme-ov-file#debian-ubuntu
  ubuntu/wget:
    cmd: 'wget https://github.com/knqyf263/pet/releases/download/vx.x.x/pet_1.0.1_linux_amd64.deb && \

      sudo dpkg -i pet_1.0.1_linux_amd64.deb

      '
    reference: https://github.com/knqyf263/pet?tab=readme-ov-file#debian-ubuntu
  arch/yay:
    cmd: yay -S pet-git
    reference: https://github.com/knqyf263/pet?tab=readme-ov-file#archlinux
binlist:
- pet

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 251 KB
          rating: 1
          desc:
            cn: 约 251 KB（估算）
            en: ~251 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
