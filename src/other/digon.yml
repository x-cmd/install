lang: C++
desc:
  cn: 将 Markdown 风格的表达方式转换为 ASCII 艺术表示形式
  en: Convert Markdown-style expressions to ASCII art representations
homepage: https://github.com/ArthurSonzogni/Diagon
license: MIT
x:
  source: https://github.com/ArthurSonzogni/Diagon
  eget: https://github.com/ArthurSonzogni/Diagon
rule:
  /eget:
    cmd: x eget ArthurSonzogni/Diagon
    reference: https://x-cmd.com/mod/eget
  /snap:
    cmd: sudo snap install diagon
    reference: https://github.com/ArthurSonzogni/Diagon?tab=readme-ov-file#command-line-interface
  arch/yay:
    cmd: yay -S diagon-bin
    reference: https://aur.archlinux.org/packages/diagon-bin
binlist:
- digon

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
