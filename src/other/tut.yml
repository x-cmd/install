lang: Go
homepage: https://tut.anv.nu/
desc:
  cn: tut 是一个用于 Mastodon 的 TUI，具有 Vim 风格的键盘映射。
  en: tut is a TUI for Mastodon with vim inspired keys.
rule:
  netbsd/pkgin:
    cmd: pkgin install tut
    reference: https://tut.anv.nu/install#package-manager
  darwin/brew:
    cmd: brew install tut
    reference: https://tut.anv.nu/install#package-manager
  opensuse/zypper:
    cmd: sudo zypper in tut
    reference: https://tut.anv.nu/install#package-manager
  arch/yay:
    cmd: yay -S tut
    reference: https://aur.archlinux.org/packages/tut
binlist:
- tut
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
