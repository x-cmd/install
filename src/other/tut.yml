lang: Go
homepage: https://tut.anv.nu/
desc:
  cn: tut 是一个用于 Mastodon 的 TUI，具有 Vim 风格的键盘映射。
  en: tut is a TUI for Mastodon with vim inspired keys.
rule:
  netbsd/pkgin:
    cmd: pkgin install tut
    reference: https://tut.anv.nu/install#package-manager
  darwin/brew:
    cmd: brew install tut
    reference: https://tut.anv.nu/install#package-manager
  opensuse/zypper:
    cmd: sudo zypper in tut
    reference: https://tut.anv.nu/install#package-manager
  arch/yay:
    cmd: yay -S tut
    reference: https://aur.archlinux.org/packages/tut
binlist:
- tut
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
