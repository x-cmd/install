lang: Shell
homepage: https://github.com/rcaloras/bash-preexec
license: MIT
desc:
  en: preexec and precmd functions for Bash just like Zsh.
  cn: Bash 的 preexec 和 precmd 函数就像 Zsh 一样。
x:
  pkg:
    exist: true
  source: https://github.com/rcaloras/bash-preexec
rule:
  /x:
    cmd: x pkg use bash-preexec
    reference: https://x-cmd.com/install/
  /curl:
    cmd: 'curl https://raw.githubusercontent.com/rcaloras/bash-preexec/master/bash-preexec.sh -o ~/.bash-preexec.sh

      echo ''[[ -f ~/.bash-preexec.sh ]] && source ~/.bash-preexec.sh'' >> ~/.bashrc

      '
    reference: https://github.com/rcaloras/bash-preexec#install
binlist:
- bash-preexec

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
