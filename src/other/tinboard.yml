lang: Python
homepage: https://github.com/davep/tinboard
license: GPL-3.0
desc:
  cn: 基于终端的 pinboard.in 客户端
  en: A terminal-based client for pinboard.in
x:
  source: https://github.com/davep/tinboard
rule:
  /pipx:
    cmd: pipx install tinboard
    reference: https://github.com/davep/tinboard#installing
  /pip:
    cmd: pip install tinboard
    reference: https://github.com/davep/tinboard#installing
    dsnap: tinboard
  darwin/brew:
    cmd: brew install davep/homebrew/tinboard
    reference: https://github.com/davep/tinboard#installing
binlist:
- tinboard

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
