lang: Python
homepage: https://github.com/davep/tinboard
license: GPL-3.0
desc:
  cn: 基于终端的 pinboard.in 客户端
  en: A terminal-based client for pinboard.in
  cs: Klient pinboard.in pro terminál
  de: Ein Terminal-Client für pinboard.in
  es: Un cliente de pinboard.in para la terminal
  fr: Un client pinboard.in pour le terminal
  id: Klien pinboard.in berbasis terminal
  it: Un client pinboard.in per terminale
  ja: pinboard.in のターミナルクライアント
  ko: 터미널용 pinboard.in 클라이언트
  pl: Klient pinboard.in dla terminala
  pt: Um cliente do pinboard.in para o terminal
  ro: Un client pinboard.in pentru terminal
  ru: Консольный клиент для pinboard.in
  th: ไคลเอนต์ pinboard.in สำหรับเทอร์มินัล
  tr: pinboard.in için bir terminal istemcisi
  uk: Термінальний клієнт для pinboard.in
  vi: Ứng dụng khách cho pinboard.in chạy trên terminal
x:
  source: https://github.com/davep/tinboard
  brew: davep/homebrew/tinboard
  pip: tinboard
rule:
  /pipx:
    cmd: pipx install tinboard
    reference: https://github.com/davep/tinboard#installing
  /pip:
    cmd: pip install tinboard
    reference: https://github.com/davep/tinboard#installing
    dsnap: tinboard
  darwin/brew:
    cmd: brew install davep/homebrew/tinboard
    reference: https://github.com/davep/tinboard#installing
binlist:
- tinboard

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 KB
          rating: 1
          desc:
            cn: 约 6 KB（估算）
            en: ~6 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
