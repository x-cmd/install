lang: C
homepage: https://github.com/nanake/librist
license: BSD-2-Clause
desc:
  en: A library that can be used to easily add the RIST protocol to your application
  cn: 一个可以轻松地将 RIST 协议添加到应用程序中的库
x:
  source: https://github.com/nanake/librist
  brew: librist
rule:
  darwin/brew:
    cmd: brew install librist
    reference: https://formulae.brew.sh/formula/librist#default
binlist:
- librist

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 6.5 MB
          rating: 1
          desc:
            cn: 约 6.5 MB（估算）
            en: ~6.5 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
