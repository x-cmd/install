lang: Go
desc:
  cn: 终端的天气应用程序
  en: weather app for the terminal
homepage: https://github.com/schachmat/wego
license: ISC
x:
  source: https://github.com/schachmat/wego
rule:
  /go:
    cmd: go install github.com/schachmat/wego@latest
    reference: https://github.com/schachmat/wego?tab=readme-ov-file#installation
    dsnap: github.com/schachmat/wego@latest
  arch/yay:
    cmd: yay -S wego
    reference: https://aur.archlinux.org/packages/wego
binlist:
- wego

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
