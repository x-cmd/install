lang: Go
desc:
  cn: 终端的天气应用程序
  en: weather app for the terminal
homepage: https://github.com/schachmat/wego
license: ISC
x:
  source: https://github.com/schachmat/wego
rule:
  /go:
    cmd: go install github.com/schachmat/wego@latest
    reference: https://github.com/schachmat/wego?tab=readme-ov-file#installation
    dsnap: github.com/schachmat/wego@latest
  arch/yay:
    cmd: yay -S wego
    reference: https://aur.archlinux.org/packages/wego
binlist:
- wego

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 303 KB
          rating: 1
          desc:
            cn: 约 303 KB（估算）
            en: ~303 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
