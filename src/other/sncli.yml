lang: Python
homepage: https://github.com/insanum/sncli
license: MIT
desc:
  cn: Simplenote CLI (Simplenote 是一款简单而轻量级的笔记应用程序，旨在提供清晰、直观的笔记管理体验)
  en: Simplenote CLI (Simplenote is a simple and lightweight note-taking application designed to provide a clear and intuitive note management experience)
x:
  source: https://github.com/insanum/sncli
  yay: sncli
  pip: sncli
  git: https://github.com/insanum/sncli.git
rule:
  /x:
    cmd: x pkg use sncli
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install sncli
    reference: https://github.com/insanum/sncli?tab=readme-ov-file#installation
  /pipenv:
    cmd: 'git clone https://github.com/insanum/sncli.git \

      && pipenv install

      '
    reference: https://github.com/insanum/sncli?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S sncli
    reference: https://aur.archlinux.org/packages/sncli
binlist:
- sncli

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
