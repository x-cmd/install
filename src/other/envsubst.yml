lang: Go
homepage: https://github.com/a8m/envsubst
license: MIT
desc:
  cn: 管理 go 的环境变量
  en: Environment variables substitution for Go
x:
  pkg:
    exist: true
  source: https://github.com/a8m/envsubst
  eget: https://github.com/a8m/envsubst
rule:
  /x:
    cmd: x pkg use envsubst
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget a8m/envsubst
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use envsubst
    reference: https://github.com/dex4er/asdf-envsubst
  /curl:
    cmd: 'curl -L https://github.com/a8m/envsubst/releases/download/v1.2.0/envsubst-`uname -s`-`uname -m` -o envsubst \

      && chmod +x envsubst \

      && sudo mv envsubst /usr/local/bin

      '
    reference: https://github.com/a8m/envsubst?tab=readme-ov-file#linux-and-macos
  win/powershell:
    cmd: curl -L https://github.com/a8m/envsubst/releases/download/v1.2.0/envsubst.exe
    reference: https://github.com/a8m/envsubst?tab=readme-ov-file#windows
  /go:
    cmd: go get github.com/a8m/envsubst/cmd/envsubst
    reference: https://github.com/a8m/envsubst?tab=readme-ov-file#with-go
    dsnap: github.com/a8m/envsubst/cmd/envsubst
binlist:
- envsubst

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
