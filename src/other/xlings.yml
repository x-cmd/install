lang: Lua
homepage: https://github.com/d2learn/xlings
license: Apache-2.0
desc:
  cn: 一个用于编程开发、学习和课程搭建的开发者工具集
  en: A Developer's Toolkit for Programming Learning, Development, and Tutorial Creation
  cs: Sada vývojářů pro programování, výuku a tvorbu tutoriálů
  de: Ein Toolkit für Entwickler zum Programmieren, Lernen und Erstellen von Tutorials
  es: Un conjunto de herramientas para desarrolladores para la programación, el aprendizaje y la creación de tutoriales
  fr: Une boîte à outils pour les développeurs pour la programmation, l'apprentissage et la création de tutoriels
  id: Perangkat alienation untuk pemrograman, pembelajaran, dan pembuatan tutorial
  it: Un toolkit per sviluppatori per la programmazione, l'apprendimento e la creazione di tutorial
  ja: プログラミング、学習、チュートリアル作成のための開発者ツールキット
  ko: 프로그래밍, 학습, 튜토리얼 제작을 위한 개발자 도구 모음
  pl: Zestaw narzędzi dla deweloperów do programowania, nauki i tworzenia samouczków
  pt: Um conjunto de ferramentas para desenvolvedores para programação, aprendizado e criação de tutoriais
  ro: Un set de instrumente pentru dezvoltatori pentru programare, învățare și crearea de tutoriale
  ru: Набор инструментов разработчика для программирования, обучения и создания руководств
  th: ชุดเครื่องมือสำหรับนักพัฒนาเพื่อการเขียนโปรแกรม การเรียนรู้ และการสร้างบทเรียน
  tr: Programlama, öğrenme ve eğitim içeriği oluşturma için geliştirici araç seti
  uk: Інструментарій розробника для програмування, навчання та створення посібників
  vi: Bộ công cụ dành cho nhà phát triển về lập trình, học tập và tạo hướng dẫn
x:
  source: https://github.com/d2learn/xlings
  eget: d2learn/xlings
rule:
  /eget:
    cmd: x eget d2learn/xlings
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://d2learn.org/xlings-install.sh | bash
    reference: https://github.com/d2learn/xlings?tab=readme-ov-file#linux
  /wget:
    cmd: wget https://d2learn.org/xlings-install.sh -O - | bash
    reference: https://github.com/d2learn/xlings?tab=readme-ov-file#linux
  win/powershell:
    cmd: x pwsh Invoke-Expression (Invoke-Webrequest 'https://d2learn.org/xlings-install.ps1.txt' -UseBasicParsing).Content
    reference: https://github.com/d2learn/xlings?tab=readme-ov-file#windows---powershell
binlist:
- xlings

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 39 MB
          rating: 2
          desc:
            cn: 安装 39 MB
            en: 39 MB install
        download:
          estimate: 39 MB
          desc:
            cn: 约 39 MB 下载 (linux/x64)
            en: ~39 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
