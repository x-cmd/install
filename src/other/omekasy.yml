lang: Rust
homepage: https://github.com/ikanago/omekasy
license: MIT
desc:
  cn: Omekasy 是一个命令行应用程序，可以将输入中的字母数字字符转换为 Unicode 中定义的各种样式
  en: omekasy is a command line application that converts alphanumeric characters in your input to various styles defined in Unicode
x:
  source: https://github.com/ikanago/omekasy
  eget: https://github.com/ikanago/omekasy
rule:
  /eget:
    cmd: x eget ikanago/omekasy
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install omekasy
    reference: https://github.com/ikanago/omekasy?tab=readme-ov-file#cargo
    dsnap: omekasy
  darwin/brew:
    cmd: brew install omekasy
    reference: https://github.com/ikanago/omekasy?tab=readme-ov-file#homebrew
  arch/yay:
    cmd: yay -S omekasy
    reference: https://aur.archlinux.org/packages/omekasy
binlist:
- omekasy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 464 KB
          rating: 1
          desc:
            cn: 安装 464 KB
            en: 464 KB install
        download:
          estimate: 464 KB
          desc:
            cn: 约 464 KB 下载 (linux/x64)
            en: ~464 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
