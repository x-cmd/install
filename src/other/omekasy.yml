lang: Rust
homepage: https://github.com/ikanago/omekasy
license: MIT
desc:
  cn: Omekasy 是一个命令行应用程序，可以将输入中的字母数字字符转换为 Unicode 中定义的各种样式
  en: omekasy is a command line application that converts alphanumeric characters in your input to various styles defined in Unicode
x:
  source: https://github.com/ikanago/omekasy
  eget: https://github.com/ikanago/omekasy
rule:
  /eget:
    cmd: x eget ikanago/omekasy
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install omekasy
    reference: https://github.com/ikanago/omekasy?tab=readme-ov-file#cargo
    dsnap: omekasy
  darwin/brew:
    cmd: brew install omekasy
    reference: https://github.com/ikanago/omekasy?tab=readme-ov-file#homebrew
  arch/yay:
    cmd: yay -S omekasy
    reference: https://aur.archlinux.org/packages/omekasy
binlist:
- omekasy
