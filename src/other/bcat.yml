lang: JavaScript
homepage: https://github.com/kessler/node-bcat
license: MIT
desc:
  cn: 通过管道连接到浏览器的实用程序
  en: A pipe to browser utility
  cs: Nástroj pro přesměrování výstupu do prohlížeče
  de: Ein Werkzeug, um Ausgaben an den Browser weiterzureichen
  es: Una utilidad para canalizar la salida hacia el navegador
  fr: Un utilitaire pour acheminer la sortie vers le navigateur
  id: Utilitas untuk mengalirkan keluaran ke peramban
  it: Un'utilità per reindirizzare l'output al browser
  ja: ブラウザにパイプで出力するユーティリティ
  ko: 출력을 브라우저로 파이프하는 유틸리티
  pl: Narzędzie do przesyłania wyjścia do przeglądarki
  pt: Um utilitário para canalizar a saída para o navegador
  ro: Un utilitar pentru dirijarea ieșirii către browser
  ru: Утилита для перенаправления вывода в браузер
  th: ยูทิลิตี้สำหรับส่งเอาต์พุตไปยังเบราว์เซอร์ผ่านท่อ
  tr: Çıktıyı tarayıcıya yönlendiren bir araç
  uk: Утиліта для перенаправлення виводу до браузера
  vi: Tiện ích truyền đầu ra tới trình duyệt qua pipe
x:
  source: https://github.com/kessler/node-bcat
  npm: bcat
rule:
  /x:
    cmd: x pkg use bcat
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g bcat
    reference: https://github.com/kessler/node-bcat?tab=readme-ov-file#example
    dsnap: bcat
binlist:
- bcat

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
