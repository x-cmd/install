lang: JavaScript
homepage: https://github.com/kessler/node-bcat
license: MIT
desc:
  cn: 通过管道连接到浏览器的实用程序
  en: A pipe to browser utility
x:
  pkg:
    exist: true
  source: https://github.com/kessler/node-bcat
rule:
  /x:
    cmd: x pkg use bcat
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g bcat
    reference: https://github.com/kessler/node-bcat?tab=readme-ov-file#example
    dsnap: bcat
binlist:
- bcat

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
