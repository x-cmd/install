homepage: https://github.com/jupyterlab/jupyterlab
license: BSD-3-Clause
lang: Python
desc:
  en: JupyterLab computational environment
  cn: JupyterLab 计算环境
x:
  source: https://github.com/jupyterlab/jupyterlab
  eget: https://github.com/jupyterlab/jupyterlab
  pip: jupyterlab
rule:
  /eget:
    cmd: x eget jupyterlab/jupyterlab
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use jupyterlab
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install jupyterlab
    reference: https://jupyter.org/install
    dsnap: jupyterlab
binlist:
- jupyterlab

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 安装 16 MB
            en: 16 MB install
        download:
          estimate: 16 MB
          desc:
            cn: 约 16 MB 下载 (whl)
            en: ~16 MB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
