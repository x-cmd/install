lang: Go
homepage: https://github.com/claudiodangelis/qrcp
license: MIT
desc:
  cn: 无需离开终端，扫描二维码即可通过 wifi 将文件从计算机传输到移动设备
  en: Scan the QR code to transfer files from your computer to your mobile device over wifi without leaving the terminal
x:
  pkg:
    exist: true
  source: https://github.com/claudiodangelis/qrcp
  eget: https://github.com/claudiodangelis/qrcp
rule:
  /x:
    cmd: x pkg use qrcp
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget claudiodangelis/qrcp
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/claudiodangelis/qrcp@latest
    reference: https://github.com/claudiodangelis/qrcp?tab=readme-ov-file#install-the-latest-development-version-with-go
    dsnap: github.com/claudiodangelis/qrcp@latest
  (win|wsl2)/scoop:
    cmd: x scoop install qrcp
    reference: https://github.com/claudiodangelis/qrcp?tab=readme-ov-file#scoop
  (win|wsl2)/choco:
    cmd: x choco install qrcp
    reference: https://github.com/claudiodangelis/qrcp?tab=readme-ov-file#chocolatey
  darwin/brew:
    cmd: brew install qrcp
    reference: https://github.com/claudiodangelis/qrcp?tab=readme-ov-file#homebrew
  arch/yay:
    cmd: yay -S qrcp
    reference: https://aur.archlinux.org/packages/qrcp
binlist:
- qrcp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
