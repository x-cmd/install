lang: c/Objective-C
homepage: https://code.videolan.org/jeeb/aribb24
desc:
  en: A library for ARIB STD-B24, decoding JIS 8 bit characters and parsing MPEG-TS stream
  cn: 一个用于 ARIB STD-B24、 JIS 8 位字符解码和 MPEG-TS 流解析的库
rule:
  darwin/brew:
    cmd: brew install aribb24
    reference: https://formulae.brew.sh/formula/aribb24#default
binlist:
- aribb24
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
