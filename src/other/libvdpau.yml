lang: C
homepage: https://gitlab.freedesktop.org/vdpau/libvdpau
desc:
  en: Open source Video Decode and Presentation API library
  cn: 开源视频解码和演示 API 库
rule:
  darwin/brew:
    cmd: brew install libvdpau
    reference: https://formulae.brew.sh/formula/libvdpau#default
binlist:
- libvdpau
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
