lang: C
homepage: https://gitlab.freedesktop.org/vdpau/libvdpau
desc:
  en: Open source Video Decode and Presentation API library
  cn: 开源视频解码和演示 API 库
rule:
  darwin/brew:
    cmd: brew install libvdpau
    reference: https://formulae.brew.sh/formula/libvdpau#default
binlist:
- libvdpau
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
