lang: Rust
homepage: https://www.chiark.greenend.org.uk/~sgtatham/halibut/
desc:
  cn: Halibut 是一种文档生产系统
  en: Halibut is a documentation production system
rule:
  darwin/brew:
    cmd: brew install halibut
    reference: https://formulae.brew.sh/formula/halibut#default
binlist:
- halibut
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
