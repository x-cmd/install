lang: Rust
homepage: https://www.chiark.greenend.org.uk/~sgtatham/halibut/
desc:
  cn: Halibut 是一种文档生产系统
  en: Halibut is a documentation production system
rule:
  darwin/brew:
    cmd: brew install halibut
    reference: https://formulae.brew.sh/formula/halibut#default

x:
  brew: halibutbinlist:
- halibut
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
