lang: Rust
homepage: https://www.chiark.greenend.org.uk/~sgtatham/halibut/
desc:
  cn: Halibut 是一种文档生产系统
  en: Halibut is a documentation production system
  cs: Halibut je systém pro tvorbu dokumentace
  de: Halibut ist ein System zur Erstellung von Dokumentation
  es: Halibut es un sistema de producción de documentación
  fr: Halibut est un système de production de documentation
  id: Halibut adalah sistem produksi dokumentasi
  it: Halibut è un sistema di produzione di documentazione
  ja: Halibut はドキュメント生成システムです
  ko: Halibut는 문서 생성 시스템입니다
  pl: Halibut to system produkcji dokumentacji
  pt: Halibut é um sistema de produção de documentação
  ro: Halibut este un sistem de producere a documentației
  ru: Halibut — система для создания документации
  th: Halibut คือระบบผลิตเอกสาร
  tr: Halibut bir dokümantasyon üretim sistemidir
  uk: Halibut — це система для створення документації
  vi: Halibut là hệ thống tạo tài liệu
rule:
  darwin/brew:
    cmd: brew install halibut
    reference: https://formulae.brew.sh/formula/halibut#default

x:
  brew: halibut
binlist:
- halibut
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
