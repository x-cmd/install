lang: TypeScript
homepage: https://github.com/ozum/concat-md
license: MIT
desc:
  cn: CLI 和 API 连接 markdown 文件，并根据需要进行修改
  en: CLI and API to concatenate markdown files and modify as necessary
  cs: CLI a API pro spojování souborů markdown a jejich úpravu podle potřeby
  de: CLI und API zum Zusammenführen von Markdown-Dateien und zur bedarfsgerechten Änderung
  es: CLI y API para concatenar archivos markdown y modificarlos según sea necesario
  fr: CLI et API pour concaténer des fichiers markdown et les modifier au besoin
  id: CLI dan API untuk menggabungkan berkas markdown dan mengubahnya seperlunya
  it: CLI e API per concatenare file markdown e modificarli quando necessario
  ja: markdown ファイルを結合し、必要に応じて修正するためのCLIとAPI
  ko: markdown 파일을 이어 붙이고 필요에 따라 수정하는 CLI와 API
  pl: CLI i API do łączenia plików markdown i ich modyfikowania w razie potrzeby
  pt: CLI e API para concatenar arquivos markdown e modificá-los conforme necessário
  ro: CLI și API pentru concatenarea fișierelor markdown și modificarea lor după nevoie
  ru: CLI и API для объединения файлов markdown и их изменения по мере необходимости
  th: CLI และ API สำหรับรวมไฟล์ markdown และปรับแก้ตามความจำเป็น
  tr: Markdown dosyalarını birleştirmek ve gerektiğinde değiştirmek için CLI ve API
  uk: CLI та API для об'єднання файлів markdown та їх зміни за потреби
  vi: CLI và API để nối các tệp markdown và sửa đổi khi cần thiết
x:
  source: https://github.com/ozum/concat-md
  npm: concat-md
rule:
  /x:
    cmd: x pkg use concat-md
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g concat-md
    reference: https://github.com/ozum/concat-md?tab=readme-ov-file#concat-md
    dsnap: concat-md
binlist:
- concat-md

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
