lang: TypeScript
homepage: https://github.com/ozum/concat-md
license: MIT
desc:
  cn: CLI 和 API 连接 markdown 文件，并根据需要进行修改
  en: CLI and API to concatenate markdown files and modify as necessary
x:
  pkg:
    exist: true
  source: https://github.com/ozum/concat-md
rule:
  /x:
    cmd: x pkg use concat-md
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g concat-md
    reference: https://github.com/ozum/concat-md?tab=readme-ov-file#concat-md
    dsnap: concat-md
binlist:
- concat-md

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
