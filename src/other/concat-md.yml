lang: TypeScript
homepage: https://github.com/ozum/concat-md
license: MIT
desc:
  cn: CLI 和 API 连接 markdown 文件，并根据需要进行修改
  en: CLI and API to concatenate markdown files and modify as necessary
x:
  pkg:
    exist: true
  source: https://github.com/ozum/concat-md
rule:
  /x:
    cmd: x pkg use concat-md
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g concat-md
    reference: https://github.com/ozum/concat-md?tab=readme-ov-file#concat-md
    dsnap: concat-md
binlist:
- concat-md

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
