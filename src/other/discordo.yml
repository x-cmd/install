lang: Go
homepage: https://github.com/ayn2op/discordo
license: GPL-3.0
desc:
  cn: Discordo 是一个轻量级的、安全的、功能丰富的 Discord 终端客户端
  en: Discordo is a lightweight, secure, and feature-rich Discord terminal client. Heavily work-in-progress, expect breaking changes
x:
  source: https://github.com/ayn2op/discordo
  brew: --cask
  scoop: discordo
  yay: discordo-git
  pkg: discordo
rule:
  arch/yay:
    cmd: sudo yay -S discordo-git
    reference: https://github.com/ayn2op/discordo?tab=readme-ov-file#package-managers
  freebsd/pkg:
    cmd: pkg install discordo
    reference: https://github.com/ayn2op/discordo?tab=readme-ov-file#package-managers
  nix/:
    cmd: nix-shell -p discordo
    reference: https://github.com/ayn2op/discordo?tab=readme-ov-file#package-managers
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add vvxrtues https://github.com/vvirtues/bucket && \

      x scoop install discordo

      '
    reference: https://github.com/ayn2op/discordo?tab=readme-ov-file#package-managers
  darwin/brew:
    cmd: brew install --cask discord
    reference: https://formulae.brew.sh/cask/discord#default
binlist:
- discordo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 497 KB
          rating: 1
          desc:
            cn: 约 497 KB（估算）
            en: ~497 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
