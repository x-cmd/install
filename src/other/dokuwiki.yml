lang: php
homepage: https://github.com/dokuwiki/dokuwiki
license: GPL-2.0
desc:
  cn: DokuWiki1 是一个简单易用、用途多样并且不依赖数据库的开源维基软件
  en: DokuWiki is a simple to use and highly versatile Open Source wiki software that doesn't require a database
x:
  source: https://github.com/dokuwiki/dokuwiki
  eget: https://github.com/dokuwiki/dokuwiki
rule:
  /eget:
    cmd: x eget dokuwiki/dokuwiki
    reference: https://x-cmd.com/mod/eget
  debian/wget:
    cmd: 'sudo apt update && \

      sudo apt install php libapache2-mod-php php-xml php-json php-mbstring php-zip php-intl php-gd && \

      sudo systemctl restart apache2.service && \

      wget https://download.dokuwiki.org/src/dokuwiki/dokuwiki-stable.tgz && \

      tar xzvf dokuwiki-stable.tgz && \

      sudo mv dokuwiki-*a /var/www/html/dokuwiki && \

      sudo chown -R www-data:www-data /var/www/html/dokuwiki

      '
    reference: https://www.dokuwiki.org/install:debian
  redora/dnf:
    cmd: sudo dnf install httpd php dokuwiki dokuwiki-selinux
    reference: https://www.dokuwiki.org/install:fedora
  ubuntu/apt:
    cmd: sudo apt install dokuwiki
    reference: https://www.dokuwiki.org/install:ubuntu
binlist:
- dokuwiki
