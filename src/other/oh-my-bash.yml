lang: Shell
homepage: https://github.com/ohmybash/oh-my-bash
license: MIT
desc:
  cn: Oh-My-BASH 是一个开源的、社区驱动的框架，用于管理您的 BASH 配置
  en: Oh-My-Bash is an open source, community-driven framework for managing your BASH configuration
  cs: Oh-My-BASH je open source framework řízený komunitou pro správu konfigurace BASH
  de: Oh-My-BASH ist ein quelloffenes, community-getriebenes Framework zur Verwaltung deiner BASH-Konfiguration
  es: Oh-My-Bash es un framework de código abierto y dirigido por la comunidad para gestionar tu configuración de BASH
  fr: Oh-My-Bash est un framework open source piloté par la communauté pour gérer votre configuration BASH
  id: Oh-My-Bash adalah framework open source yang digerakkan oleh komunitas untuk mengelola konfigurasi BASH Anda
  it: Oh-My-Bash è un framework open source guidato dalla community per gestire la tua configurazione BASH
  ja: Oh-My-Bash は、BASH の設定を管理するためのオープンソースでコミュニティ主導のフレームワークです
  ko: Oh-My-Bash는 BASH 설정을 관리하기 위한 오픈 소스 커뮤니티 중심 프레임워크입니다
  pl: Oh-My-Bash to open source'owe, rozwijane przez społeczność środowisko do zarządzania konfiguracją BASH
  pt: Oh-My-Bash é um framework de código aberto, mantido pela comunidade, para gerenciar sua configuração do BASH
  ro: Oh-My-Bash este un framework open source, dezvoltat de comunitate, pentru gestionarea configurației tale BASH
  ru: Oh-My-Bash — это открытый фреймворк, развиваемый сообществом, для управления конфигурацией BASH
  th: Oh-My-Bash เป็นเฟรมเวิร์กโอเพนซอร์สที่ขับเคลื่อนโดยชุมชนสำหรับการจัดการค่ากำหนดของ BASH
  tr: Oh-My-Bash, BASH yapılandırmanızı yönetmek için açık kaynaklı, topluluk destekli bir çerçevedir
  uk: Oh-My-Bash — це відкритий фреймворк, що розвивається спільнотою, для керування конфігурацією BASH
  vi: Oh-My-Bash là khung mã nguồn mở do cộng đồng phát triển để quản lý cấu hình BASH của bạn
x:
  source: https://github.com/ohmybash/oh-my-bash
  yay: oh-my-bash-git
rule:
  /curl:
    cmd: sh -c "$(curl -fsSL https://raw.github.com/ohmybash/oh-my-bash/master/tools/install.sh)"
    reference: https://github.com/ohmybash/oh-my-bash
  /wget:
    cmd: sh -c "$(wget https://raw.githubusercontent.com/ohmybash/oh-my-bash/master/tools/install.sh -O -)"
    reference: https://github.com/ohmybash/oh-my-bash
  arch/yay:
    cmd: yay -S oh-my-bash-git
    reference: https://aur.archlinux.org/packages/oh-my-bash-git
binlist:
- oh-my-bash

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 17 KB
          rating: 1
          desc:
            cn: 约 17 KB（估算）
            en: ~17 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
