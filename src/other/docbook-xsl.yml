lang: XSLT
homepage: https://github.com/docbook/xslt10-stylesheets
desc:
  en: XML vocabulary to create presentation-neutral documents
  cn: 用于创建与表示无关的文档的 XML 词汇表
x:
  source: https://github.com/docbook/xslt10-stylesheets
  eget: https://github.com/docbook/xslt10-stylesheets
rule:
  /eget:
    cmd: x eget docbook/xslt10-stylesheets
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install docbook-xsl
    reference: https://formulae.brew.sh/formula/docbook-xsl#default
binlist:
- docbook-xsl
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
