lang: XSLT
homepage: https://github.com/docbook/xslt10-stylesheets
desc:
  en: XML vocabulary to create presentation-neutral documents
  cn: 用于创建与表示无关的文档的 XML 词汇表
x:
  source: https://github.com/docbook/xslt10-stylesheets
  eget: https://github.com/docbook/xslt10-stylesheets
rule:
  /eget:
    cmd: x eget docbook/xslt10-stylesheets
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install docbook-xsl
    reference: https://formulae.brew.sh/formula/docbook-xsl#default
binlist:
- docbook-xsl
license: NOASSERTION
