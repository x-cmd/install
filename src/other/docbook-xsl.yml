lang: XSLT
homepage: https://github.com/docbook/xslt10-stylesheets
desc:
  en: XML vocabulary to create presentation-neutral documents
  cn: 用于创建与表示无关的文档的 XML 词汇表
x:
  source: https://github.com/docbook/xslt10-stylesheets
  eget: https://github.com/docbook/xslt10-stylesheets
rule:
  /eget:
    cmd: x eget docbook/xslt10-stylesheets
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install docbook-xsl
    reference: https://formulae.brew.sh/formula/docbook-xsl#default
binlist:
- docbook-xsl
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
