lang: JavaScript
homepage: https://github.com/jeffbski/wait-on
license: MIT
desc:
  cn: wait-on 是一个跨平台命令行实用程序和 Node.js API, 它将等待文件、端口、套接字和 http(s) 资源变得可用
  en: wait-on is a cross platform command line utility and Node.js API which will wait for files, ports, sockets, and http(s) resources to become available
x:
  pkg:
    exist: true
  source: https://github.com/jeffbski/wait-on
rule:
  /x:
    cmd: x pkg use wait-on
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g wait-on
    reference: https://github.com/jeffbski/wait-on?tab=readme-ov-file#installation
    dsnap: wait-on
binlist:
- wait-on

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
