lang: Python
homepage: https://github.com/cyrus-and/gdb-dashboard
license: MIT
desc:
  cn: GDB Dashboard 是一个独立的 `.gdbinit` 文件，使用 Python API 编写，提供一个模块化的界面，显示关于正在调试的程序的相关信息。
  en: GDB dashboard is a standalone .gdbinit file written using the Python API that enables a modular interface showing relevant information about the program being debugged.
x:
  source: https://github.com/cyrus-and/gdb-dashboard
rule:
  /wget:
    cmd: wget -P ~ https://github.com/cyrus-and/gdb-dashboard/raw/master/.gdbinit
    reference: https://github.com/cyrus-and/gdb-dashboard?tab=readme-ov-file#quickstart
binlist:
- gdb-dashboard

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
