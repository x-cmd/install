lang: Python
homepage: https://github.com/isamert/scli
license: GPL-3.0
desc:
  cn: scli 是一个简单的终端用户界面，用于 Signal。它使用 signal-cli 和 urwid 库。
  en: scli is a simple terminal user interface for Signal. It uses signal-cli and urwid.
x:
  source: https://github.com/isamert/scli
  eget: isamert/scli
  apt: python3-scli
  apt-get: python3-scli
  yay: scli-git
rule:
  /eget:
    cmd: x eget isamert/scli
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install python3-scli
    reference: https://gitlab.com/packaging/scli/#installation
    dsnap: python3-scli
  ubuntu/apt:
    cmd: sudo apt-get install python3-scli
    reference: https://gitlab.com/packaging/scli/#installation
    dsnap: python3-scli
  arch/yay:
    cmd: yay -S scli-git
    reference: https://aur.archlinux.org/packages/scli-git
binlist:
- scli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 约 11 KB（估算）
            en: ~11 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
