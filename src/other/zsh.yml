lang: C
homepage: https://github.com/jart/zsh
license: NOASSERTION
desc:
  cn: Zsh patched to support Actually Portable Executables git://git.code.sf.net/p/zsh/code (upstream pending)
  en: Zsh patched to support Actually Portable Executables git://git.code.sf.net/p/zsh/code (upstream pending)
x:
  source: https://github.com/jart/zsh
  eget: https://github.com/jart/zsh
rule:
  /eget:
    cmd: x eget jart/zsh
    reference: https://github.com/jart/zsh
binlist:
- zsh

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.1 MB
          rating: 1
          desc:
            cn: 约 5.1 MB（估算）
            en: ~5.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
