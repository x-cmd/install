lang: Rust
homepage: https://github.com/crate-ci/typos
license: Apache-2.0
desc:
  cn: 源代码拼写检查器
  en: Source code spell checker
x:
  source: https://github.com/crate-ci/typos
  eget: https://github.com/crate-ci/typos
  brew: typos-cli
  yay: typos-git
  cargo: typos-cli
  asdf: typos
rule:
  /x:
    cmd: x pkg use typos
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget crate-ci/typos
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use typos
    reference: https://github.com/aschiavon91/asdf-typos
  darwin/brew:
    cmd: brew install typos-cli
    reference: https://github.com/crate-ci/typos?tab=readme-ov-file#install
  /conda:
    cmd: conda install typos
    reference: https://github.com/crate-ci/typos?tab=readme-ov-file#install
  /cargo:
    cmd: cargo install typos-cli
    reference: https://github.com/crate-ci/typos?tab=readme-ov-file#install
    dsnap: typos-cli
  arch/yay:
    cmd: yay -S typos-git
    reference: https://aur.archlinux.org/packages/typos-git
binlist:
- typos

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 约 20 MB（估算）
            en: ~20 MB estimated
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
