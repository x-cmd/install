lang: Rust
homepage: https://github.com/crate-ci/typos
license: Apache-2.0
desc:
  cn: 源代码拼写检查器
  en: Source code spell checker
x:
  pkg:
    exist: true
  source: https://github.com/crate-ci/typos
  eget: https://github.com/crate-ci/typos
rule:
  /x:
    cmd: x pkg use typos
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget crate-ci/typos
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use typos
    reference: https://github.com/aschiavon91/asdf-typos
  darwin/brew:
    cmd: brew install typos-cli
    reference: https://github.com/crate-ci/typos?tab=readme-ov-file#install
  /conda:
    cmd: conda install typos
    reference: https://github.com/crate-ci/typos?tab=readme-ov-file#install
  /cargo:
    cmd: cargo install typos-cli
    reference: https://github.com/crate-ci/typos?tab=readme-ov-file#install
    dsnap: typos-cli
  arch/yay:
    cmd: yay -S typos-git
    reference: https://aur.archlinux.org/packages/typos-git
binlist:
- typos

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
