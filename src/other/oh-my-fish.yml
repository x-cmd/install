lang: Shell
homepage: https://github.com/oh-my-fish/oh-my-fish
license: MIT
desc:
  cn: Fish Shell 框架
  en: The Fish Shell Framework
  cs: Rámec pro Fish Shell
  de: Das Fish-Shell-Framework
  es: El framework de Fish Shell
  fr: Le framework Fish Shell
  id: Kerangka kerja Fish Shell
  it: Il framework Fish Shell
  ja: Fish Shell フレームワーク
  ko: Fish Shell 프레임워크
  pl: Framework dla Fish Shell
  pt: O framework Fish Shell
  ro: Framework-ul Fish Shell
  ru: Фреймворк для Fish Shell
  th: เฟรมเวิร์ก Fish Shell
  tr: Fish Shell çerçevesi
  uk: Фреймворк для Fish Shell
  vi: Khung Fish Shell
x:
  source: https://github.com/oh-my-fish/oh-my-fish
rule:
  /curl:
    cmd: curl https://raw.githubusercontent.com/oh-my-fish/oh-my-fish/master/bin/install | fish
    reference: https://github.com/oh-my-fish/oh-my-fish/blob/master/README.md
binlist:
- oh-my-fish

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
