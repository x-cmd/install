lang: Shell
homepage: https://github.com/oh-my-fish/oh-my-fish
license: MIT
desc:
  cn: Fish Shell 框架
  en: The Fish Shell Framework
x:
  source: https://github.com/oh-my-fish/oh-my-fish
rule:
  /curl:
    cmd: curl https://raw.githubusercontent.com/oh-my-fish/oh-my-fish/master/bin/install | fish
    reference: https://github.com/oh-my-fish/oh-my-fish/blob/master/README.md
binlist:
- oh-my-fish

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
