lang: Rust
homepage: https://github.com/YS-L/flamelens
license: MIT
desc:
  cn: 终端中的交互式火焰图查看器。
  en: An interactive flamegraph viewer in the terminal.
x:
  source: https://github.com/YS-L/flamelens
  eget: https://github.com/YS-L/flamelens
rule:
  /eget:
    cmd: x eget YS-L/flamelens
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S flamelens
    reference: https://github.com/YS-L/flamelens#installation
  /cargo:
    cmd: cargo install flamelens --locked --all-features
    reference: https://github.com/YS-L/flamelens#installation
    dsnap: flamelens
binlist:
- flamelens

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 991 KB
          rating: 1
          desc:
            cn: 安装 991 KB
            en: 991 KB install
        download:
          estimate: 991 KB
          desc:
            cn: 约 991 KB 下载 (linux/x64)
            en: ~991 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
