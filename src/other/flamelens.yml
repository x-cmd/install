lang: Rust
homepage: https://github.com/YS-L/flamelens
license: MIT
desc:
  cn: 终端中的交互式火焰图查看器。
  en: An interactive flamegraph viewer in the terminal.
x:
  source: https://github.com/YS-L/flamelens
  eget: https://github.com/YS-L/flamelens
rule:
  /eget:
    cmd: x eget YS-L/flamelens
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S flamelens
    reference: https://github.com/YS-L/flamelens#installation
  /cargo:
    cmd: cargo install flamelens --locked --all-features
    reference: https://github.com/YS-L/flamelens#installation
    dsnap: flamelens
binlist:
- flamelens

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
