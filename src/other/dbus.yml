lang: C
homepage: https://gitlab.freedesktop.org/dbus/dbus
desc:
  en: Message bus system, providing inter-application communication
  cn: 消息总线系统，提供应用程序之间的通信
rule:
  darwin/brew:
    cmd: brew install dbus
    reference: https://formulae.brew.sh/formula/dbus#default
binlist:
- dbus
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
