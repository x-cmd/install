lang: C
homepage: https://gitlab.freedesktop.org/dbus/dbus
desc:
  en: Message bus system, providing inter-application communication
  cn: 消息总线系统，提供应用程序之间的通信
rule:
  darwin/brew:
    cmd: brew install dbus
    reference: https://formulae.brew.sh/formula/dbus#default
binlist:
- dbus
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
