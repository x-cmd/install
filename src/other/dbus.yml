lang: C
homepage: https://gitlab.freedesktop.org/dbus/dbus
desc:
  en: Message bus system, providing inter-application communication
  cn: 消息总线系统，提供应用程序之间的通信
  cs: Systém sběrnic zpráv, poskytující komunikaci mezi aplikacemi
  de: Message-Bus-System, das die Kommunikation zwischen Anwendungen ermöglicht
  es: Sistema de bus de mensajes que proporciona comunicación entre aplicaciones
  fr: Système de bus de messages, fournissant la communication inter-applications
  id: Sistem bus pesan yang menyediakan komunikasi antaraplikasi
  it: Sistema di bus di messaggi che fornisce la comunicazione tra le applicazioni
  ja: アプリケーション間の通信を提供するメッセージバスシステム
  ko: 애플리케이션 간 통신을 제공하는 메시지 버스 시스템
  pl: System magistrali komunikatów, zapewniający komunikację między aplikacjami
  pt: Sistema de barramento de mensagens que fornece comunicação entre aplicativos
  ro: Sistem de autobuz de mesaje care asigură comunicarea între aplicații
  ru: Система шины сообщений, обеспечивающая взаимодействие между приложениями
  th: ระบบบัสข้อความที่ให้การสื่อสารระหว่างแอปพลิเคชัน
  tr: Uygulamalar arası iletişim sağlayan bir mesaj veri yolu sistemi
  uk: Система шини повідомлень, що забезпечує взаємодію між застосунками
  vi: Hệ thống bus tin nhắn, cung cấp giao tiếp giữa các ứng dụng
rule:
  darwin/brew:
    cmd: brew install dbus
    reference: https://formulae.brew.sh/formula/dbus#default

x:
  brew: dbus
binlist:
- dbus
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
