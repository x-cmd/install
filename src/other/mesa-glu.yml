lang: C++/c
homepage: https://gitlab.freedesktop.org/mesa/glu
desc:
  en: Mesa OpenGL Utility library
  cn: Mesa OpenGL 实用程序库
rule:
  darwin/brew:
    cmd: brew install mesa-glu
    reference: https://formulae.brew.sh/formula/mesa-glu#default
binlist:
- mesa-glu
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
