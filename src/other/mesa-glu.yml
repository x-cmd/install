lang: C++/c
homepage: https://gitlab.freedesktop.org/mesa/glu
desc:
  en: Mesa OpenGL Utility library
  cn: Mesa OpenGL 实用程序库
  cs: Knihovna Mesa OpenGL Utility
  de: Mesa OpenGL Utility-Bibliothek
  es: Biblioteca de utilidades OpenGL de Mesa
  fr: Bibliothèque Mesa OpenGL Utility
  id: Pustaka utilitas Mesa OpenGL
  it: Libreria di utilità OpenGL di Mesa
  ja: Mesa OpenGL ユーティリティライブラリ
  ko: Mesa OpenGL 유틸리티 라이브러리
  pl: Biblioteka narzędzi Mesa OpenGL
  pt: Biblioteca de utilitários Mesa OpenGL
  ro: Bibliotecă de utilitare Mesa OpenGL
  ru: Библиотека утилит Mesa OpenGL
  th: ไลบรารี Mesa OpenGL Utility
  tr: Mesa OpenGL yardımcı kütüphanesi
  uk: Бібліотека утиліт Mesa OpenGL
  vi: Thư viện tiện ích Mesa OpenGL
rule:
  darwin/brew:
    cmd: brew install mesa-glu
    reference: https://formulae.brew.sh/formula/mesa-glu#default

x:
  brew: mesa-glu
binlist:
- mesa-glu
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: none
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
