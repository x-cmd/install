lang: C++/c
homepage: https://gitlab.freedesktop.org/mesa/glu
desc:
  en: Mesa OpenGL Utility library
  cn: Mesa OpenGL 实用程序库
rule:
  darwin/brew:
    cmd: brew install mesa-glu
    reference: https://formulae.brew.sh/formula/mesa-glu#default

x:
  brew: mesa-glu
binlist:
- mesa-glu
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
