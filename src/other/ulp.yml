lang: Python
homepage: https://github.com/victal/ulp
license: MIT
desc:
  cn: Ulp 是一个命令行工具，可用于查找给定输入的 URL 并与之交互。
  en: Ulp is a command-line tool that can be used to find and interact with URLs from a given input.
x:
  pkg:
    exist: true
  source: https://github.com/victal/ulp
rule:
  /x:
    cmd: x pkg use ulp
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install -U ulp
    reference: https://github.com/victal/ulp#installing
    dsnap: ulp
binlist:
- ulp

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
