lang: Shell
homepage: https://github.com/scop/bash-completion
license: GPL-2.0
desc:
  cn: bash-completion  是 Bash Shell 的命令行命令完成的集合
  en: bash-completion is a collection of command line command completions for the Bash shell,
x:
  source: https://github.com/scop/bash-completion
  eget: https://github.com/scop/bash-completion
rule:
  /eget:
    cmd: x eget scop/bash-completion
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install bash-completion
    reference: https://formulae.brew.sh/formula/bash-completion#default
binlist:
- bash-completion

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
