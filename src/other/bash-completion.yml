lang: Shell
homepage: https://github.com/scop/bash-completion
license: GPL-2.0
desc:
  cn: bash-completion  是 Bash Shell 的命令行命令完成的集合
  en: bash-completion is a collection of command line command completions for the Bash shell,
  cs: bash-completion je sbírka dokončování příkazů příkazové řádky pro shell Bash
  de: bash-completion ist eine Sammlung von Befehlszeilen-Completion für die Bash-Shell
  es: bash-completion es una colección de completados de comandos de línea de comandos para el shell Bash
  fr: bash-completion est une collection de complétions de commandes en ligne de commande pour le shell Bash
  id: bash-completion adalah kumpulan penyelesaian perintah baris perintah untuk shell Bash
  it: bash-completion è una raccolta di completamenti dei comandi da riga di comando per la shell Bash
  ja: bash-completion は Bash シェルのためのコマンドライン補完集です
  ko: bash-completion은 Bash 셸을 위한 명령줄 완성 모음입니다
  pl: bash-completion to zbiór uzupełniania poleceń wiersza poleceń dla powłoki Bash
  pt: bash-completion é uma coleção de completação de comandos de linha de comando para o shell Bash
  ro: bash-completion este o colecție de completări de comenzi pentru shell-ul Bash
  ru: bash-completion — набор дополнений командной строки для оболочки Bash
  th: bash-completion คือชุดการเติมคำสั่งบรรทัดคำสั่งสำหรับเชลล์ Bash
  tr: bash-completion, Bash kabuğu için komut satırı tamamlama koleksiyonudur
  uk: bash-completion — набір доповнень командного рядка для оболонки Bash
  vi: bash-completion là bộ sưu tập hoàn thiện lệnh dòng lệnh cho shell Bash
x:
  source: https://github.com/scop/bash-completion
  eget: scop/bash-completion
  brew: bash-completion
rule:
  /eget:
    cmd: x eget scop/bash-completion
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install bash-completion
    reference: https://formulae.brew.sh/formula/bash-completion#default
binlist:
- bash-completion

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 31 KB
          rating: 1
          desc:
            cn: 约 31 KB（估算）
            en: ~31 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
