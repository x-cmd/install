lang: Rust
homepage: https://github.com/xithrius/twitch-tui
license: Apache-2.0
desc:
  cn: twitch-tui 是一个终端用户界面（TUI）工具，用于读取和与 Twitch 聊天用户互动。
  en: twitch-tui is a Terminal User Interface for reading and interacting with Twitch chat users.
x:
  source: https://github.com/xithrius/twitch-tui
rule:
  /cargo:
    cmd: cargo install twitch-tui
    reference: https://xithrius.github.io/twitch-tui/guide/installation.html
    dsnap: twitch-tui
  nix/run:
    cmd: nix run github:Xithrius/twitch-tui
    reference: https://xithrius.github.io/twitch-tui/guide/installation.html
  arch/yay:
    cmd: yay -S twitch-tui-git
    reference: https://aur.archlinux.org/packages/twitch-tui-git
binlist:
- twitch-tui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 370 KB
          rating: 1
          desc:
            cn: 约 370 KB（估算）
            en: ~370 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
