lang: C
homepage: https://git.savannah.gnu.org/cgit/coreutils.git
desc:
  cn: GNU 核心实用程序是 GNU 操作系统的基本文件、shell 和文本操作实用程序
  en: The GNU Core Utilities are the basic file, shell and text manipulation utilities of the GNU operating system
rule:
  darwin/brew:
    cmd: brew install coreutils
    reference: https://formulae.brew.sh/formula/coreutils#default
  debian/apt:
    cmd: sudo apt-get install coreutils
    reference: https://command-not-found.com/true
    dsnap: coreutils
  ubuntu/apt:
    cmd: sudo apt-get install coreutils
    reference: https://command-not-found.com/true
    dsnap: coreutils
  alpine/apk:
    cmd: sudo apk add coreutils
    reference: https://command-not-found.com/true
    dsnap: coreutils
  arch/pacman:
    cmd: sudo pacman -S coreutils
    reference: https://command-not-found.com/true
  kali/apt:
    cmd: sudo apt-get install coreutils
    reference: https://command-not-found.com/true
    dsnap: coreutils
  centos/yum:
    cmd: sudo yum install coreutils
    reference: https://command-not-found.com/true
  fedora/yum:
    cmd: sudo dnf install coreutils
    reference: https://command-not-found.com/true
  raspbian/apt:
    cmd: sudo apt-get install coreutils
    reference: https://command-not-found.com/true
binlist:
- coreutils
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
