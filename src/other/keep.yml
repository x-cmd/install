lang: Python
homepage: https://github.com/orkohunter/keep
license: MIT
desc:
  cn: Meta CLI 工具包：个人 shell 命令管理器和 snippets 管理器
  en: 'A Meta CLI toolkit : Personal shell command keeper and snippets manager'
x:
  pkg:
    exist: true
  source: https://github.com/orkohunter/keep
rule:
  /x:
    cmd: x pkg use keep
    reference: https://x-cmd.com/install/
  /pip:
    cmd: 'git clone https://github.com/keephq/keep.git && cd keep

      pip install .

      '
    reference: https://docs.keephq.dev/cli/installation#clone-and-install-option-1
    dsnap: keep
  /poetry:
    cmd: 'git clone https://github.com/keephq/keep.git && cd keep

      poetry install

      '
    reference: https://docs.keephq.dev/cli/installation#clone-and-install-option-1
  darwin/brew:
    cmd: brew install --cask keep
    reference: https://formulae.brew.sh/cask/keep#default
binlist:
- keep

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
