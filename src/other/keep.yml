lang: Python
homepage: https://github.com/orkohunter/keep
license: MIT
desc:
  cn: Meta CLI 工具包：个人 shell 命令管理器和 snippets 管理器
  en: 'A Meta CLI toolkit : Personal shell command keeper and snippets manager'
x:
  source: https://github.com/orkohunter/keep
  brew: --cask
  pip: .
  git: https://github.com/keephq/keep.git
rule:
  /x:
    cmd: x pkg use keep
    reference: https://x-cmd.com/install/
  /pip:
    cmd: 'git clone https://github.com/keephq/keep.git && cd keep

      pip install .

      '
    reference: https://docs.keephq.dev/cli/installation#clone-and-install-option-1
    dsnap: keep
  /poetry:
    cmd: 'git clone https://github.com/keephq/keep.git && cd keep

      poetry install

      '
    reference: https://docs.keephq.dev/cli/installation#clone-and-install-option-1
  darwin/brew:
    cmd: brew install --cask keep
    reference: https://formulae.brew.sh/cask/keep#default
binlist:
- keep

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
