lang: Go
homepage: https://github.com/pomdtr/sunbeam
license: MIT
desc:
  cn: Sunbeam 是一个通用的命令行启动器
  en: Sunbeam is a general purpose command-line launcher.
x:
  source: https://github.com/pomdtr/sunbeam
  eget: https://github.com/pomdtr/sunbeam
rule:
  /eget:
    cmd: x eget pomdtr/sunbeam
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install pomdtr/tap/sunbeam
    reference: https://sunbeam.pomdtr.me/docs/user-guide/installation.html
  /nix:
    cmd: nix shell github:pomdtr/sunbeam --command sunbeam
    reference: https://sunbeam.pomdtr.me/docs/user-guide/installation.html
  arch/yay:
    cmd: yay -S sunbeam-bin
    reference: https://sunbeam.pomdtr.me/docs/user-guide/installation.html
  /go:
    cmd: go install github.com/pomdtr/sunbeam@main
    reference: https://sunbeam.pomdtr.me/docs/user-guide/installation.html
    dsnap: sunbeam
binlist:
- sunbeam

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
