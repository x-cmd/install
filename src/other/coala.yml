lang: Python
homepage: https://github.com/coala/coala-bears
license: AGPL-3.0
desc:
  cn: 独立于语言且易于扩展的代码分析应用程序
  en: coala provides a unified interface for linting and fixing code with a single configuration file, regardless of the programming languages used
x:
  source: https://github.com/coala/coala-bears
  pip: coala-bears
rule:
  /x:
    cmd: x pkg use coala
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install coala-bears
    reference: https://github.com/coala/coala-bears
binlist:
- coala

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
