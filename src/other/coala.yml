lang: Python
homepage: https://github.com/coala/coala-bears
license: AGPL-3.0
desc:
  cn: 独立于语言且易于扩展的代码分析应用程序
  en: coala provides a unified interface for linting and fixing code with a single configuration file, regardless of the programming languages used
x:
  pkg:
    exist: true
  source: https://github.com/coala/coala-bears
rule:
  /x:
    cmd: x pkg use coala
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install coala-bears
    reference: https://github.com/coala/coala-bears
binlist:
- coala
