lang: Python
homepage: https://github.com/coala/coala-bears
license: AGPL-3.0
desc:
  cn: 独立于语言且易于扩展的代码分析应用程序
  en: coala provides a unified interface for linting and fixing code with a single configuration file, regardless of the programming languages used
x:
  pkg:
    exist: true
  source: https://github.com/coala/coala-bears
rule:
  /x:
    cmd: x pkg use coala
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install coala-bears
    reference: https://github.com/coala/coala-bears
binlist:
- coala

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
