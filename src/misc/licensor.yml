lang: Rust
homepage: https://github.com/raftario/licensor
license: MIT
desc:
  cn: 根据标准输出的 SPDX ID 编写一个许可证
  en: Write a license to standard output given its SPDX ID
x:
  source: https://github.com/raftario/licensor
  eget: https://github.com/raftario/licensor
rule:
  /eget:
    cmd: x eget raftario/licensor
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install licensor
    reference: https://github.com/raftario/licensor?tab=readme-ov-file#cratesio
    dsnap: licensor
  darwin/brew:
    cmd: brew install licensor
    reference: https://github.com/raftario/licensor?tab=readme-ov-file#homebrew
binlist:
- licensor

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 49 KB
          rating: 1
          desc:
            cn: 约 49 KB（估算）
            en: ~49 KB estimated
        download:
          estimate: 465 KB
          desc:
            cn: 约 465 KB 下载 (linux/arm64)
            en: ~465 KB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
