lang: Python
homepage: https://github.com/shobrook/wut
license: MIT
desc:
  cn: 一个 CLI 工具，用于解释你最后一条命令的输出。
  en: CLI that explains the output of your last command.
x:
  source: https://github.com/shobrook/wut
  eget: shobrook/wut
rule:
  /eget:
    cmd: x eget shobrook/wut
    reference: https://x-cmd.com/mod/eget
  /pipx:
    cmd: pipx install wut-cli
    reference: https://github.com/shobrook/wut#installation
binlist:
- wut

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
