lang: Rust
homepage: https://github.com/orhun/halp
license: Apache-2.0
desc:
  en: A CLI tool to get help with CLI tools
  cn: 一个用于获取命令行工具帮助的命令行工具
x:
  source: https://github.com/orhun/halp
  eget: https://github.com/orhun/halp
rule:
  /eget:
    cmd: x eget orhun/halp
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install halp
    reference: https://github.com/orhun/halp?tab=readme-ov-file#cargo
    dsnap: halp
  arch/pacman:
    cmd: pacman -S halp
    reference: https://github.com/orhun/halp?tab=readme-ov-file#arch-linux
  arch/paru:
    cmd: paru -S halp-git
    reference: https://github.com/orhun/halp?tab=readme-ov-file#arch-linux
  arch/yay:
    cmd: yay -S halp-bin
    reference: https://aur.archlinux.org/packages/halp-bin
binlist:
- halp

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
