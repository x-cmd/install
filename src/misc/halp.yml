lang: Rust
homepage: https://github.com/orhun/halp
license: Apache-2.0
desc:
  en: A CLI tool to get help with CLI tools
  cn: 一个用于获取命令行工具帮助的命令行工具
  cs: Nástroj CLI, který vám pomůže s nástroji CLI
  de: Ein CLI-Tool, das Ihnen bei CLI-Tools hilft
  es: Una herramienta de línea de comandos que te ayuda con las herramientas de línea de comandos
  fr: Un outil en ligne de commande qui vous aide avec les outils en ligne de commande
  id: Alat CLI untuk membantu Anda dengan alat CLI
  it: Uno strumento da riga di comando che ti aiuta con gli strumenti da riga di comando
  ja: CLI ツールの使い方を教えてくれる CLI ツール
  ko: CLI 도구를 위한 도움을 제공하는 CLI 도구
  pl: Narzędzie CLI, które pomaga w korzystaniu z narzędzi CLI
  pt: Uma ferramenta de linha de comando que ajuda você com outras ferramentas de linha de comando
  ro: Un instrument CLI care vă ajută cu instrumentele CLI
  ru: CLI-инструмент, помогающий разобраться с другими CLI-инструментами
  th: เครื่องมือ CLI ที่ช่วยคุณใช้เครื่องมือ CLI อื่น ๆ
  tr: CLI araçları hakkında yardım almanızı sağlayan bir CLI aracı
  uk: CLI-інструмент, який допомагає розібратися з іншими CLI-інструментами
  vi: Công cụ CLI giúp bạn sử dụng các công cụ CLI khác
x:
  source: https://github.com/orhun/halp
  eget: orhun/halp
  pacman: halp
  yay: halp-bin
  paru: halp-git
  cargo: halp
rule:
  /eget:
    cmd: x eget orhun/halp
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install halp
    reference: https://github.com/orhun/halp?tab=readme-ov-file#cargo
    dsnap: halp
  arch/pacman:
    cmd: pacman -S halp
    reference: https://github.com/orhun/halp?tab=readme-ov-file#arch-linux
  arch/paru:
    cmd: paru -S halp-git
    reference: https://github.com/orhun/halp?tab=readme-ov-file#arch-linux
  arch/yay:
    cmd: yay -S halp-bin
    reference: https://aur.archlinux.org/packages/halp-bin
binlist:
- halp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 46 KB
          rating: 1
          desc:
            cn: 约 46 KB（估算）
            en: ~46 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
