lang: C
desc:
  cn: bash 和 zsh shell 历史记录建议框 轻松查看、导航、搜索和管理您的命令历史记录
  en: bash and zsh shell history suggestions box Easily view, navigate, search and manage your command history
homepage: https://github.com/dvorka/hstr
license: Apache-2.0
x:
  source: https://github.com/dvorka/hstr
  eget: https://github.com/dvorka/hstr
rule:
  /eget:
    cmd: x eget dvorka/hstr
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S hstr
    reference: https://aur.archlinux.org/packages/hstr
  darwin/brew:
    cmd: brew install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#macos
  darwin/port:
    cmd: sudo port install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#macos
  ubuntu/apt:
    cmd: sudo apt install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#ubuntu
    dsnap: hstr
  fedora/dnf:
    cmd: sudo dnf install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#fedorarhelcentosscientific
    dsnap: hstr
  fedora/yum:
    cmd: sudo yum install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#fedorarhelcentosscientific
  gentoo/emerge:
    cmd: sudo emerge app-shells/hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#gentoo
  alpine/apk:
    cmd: apk add hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#alpine-linux
    dsnap: hstr
binlist:
- hstr

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
