lang: C
desc:
  cn: bash 和 zsh shell 历史记录建议框 轻松查看、导航、搜索和管理您的命令历史记录
  en: bash and zsh shell history suggestions box Easily view, navigate, search and manage your command history
  cs: Pole se historie příkazů pro bash a zsh, snadné zobrazení, procházení, hledání a správa historie příkazů
  de: Vorschlagsbox für die Befehlsverlaufshistorie von bash und zsh, mit der Historie einfach ansehen, navigieren, durchsuchen und verwalten
  es: Cuadro de sugerencias del historial de comandos de bash y zsh para ver, navegar, buscar y gestionar fácilmente tu historial de comandos
  fr: Boîte de suggestions de l'historique des commandes bash et zsh pour voir, parcourir, rechercher et gérer facilement votre historique de commandes
  id: Kotak saran riwayat perintah bash dan zsh untuk mudah melihat, menavigasi, mencari, dan mengelola riwayat perintah Anda
  it: Casella di suggerimenti della cronologia dei comandi bash e zsh per visualizzare, navigare, cercare e gestire facilmente la cronologia dei comandi
  ja: bash と zsh のコマンド履歴の候補ボックス。コマンド履歴を簡単に閲覧、移動、検索、管理できます
  ko: bash 및 zsh 명령 기록 제안 상자 — 명령 기록을 쉽게 보고, 탐색하고, 검색하며, 관리할 수 있습니다
  pl: Pole podpowiedzi historii poleceń bash i zsh, ułatwiające przeglądanie, nawigację, wyszukiwanie i zarządzanie historią poleceń
  pt: Caixa de sugestões do histórico de comandos do bash e zsh para visualizar, navegar, pesquisar e gerenciar seu histórico de comandos facilmente
  ro: Casetă de sugestii pentru istoricul comenzilor bash și zsh, pentru a vedea, naviga, căuta și gestiona cu ușurință istoricul comenzilor
  ru: Блок подсказок истории команд bash и zsh для удобного просмотра, навигации, поиска и управления историей команд
  th: กล่องข้อเสนอประวัติคำสั่งของ bash และ zsh เพื่อดู เรียกดู ค้นหา และจัดการประวัติคำสั่งได้อย่างง่ายดาย
  tr: bash ve zsh komut geçmişi için öneri kutusu; komut geçmişinizi kolayca görün, gezin, arayın ve yönetin
  uk: Блок підказок історії команд bash і zsh для зручного перегляду, навігації, пошуку та керування історією команд
  vi: Hộp gợi ý lịch sử lệnh bash và zsh, giúp bạn dễ dàng xem, duyệt, tìm kiếm và quản lý lịch sử lệnh
homepage: https://github.com/dvorka/hstr
license: Apache-2.0
x:
  source: https://github.com/dvorka/hstr
  eget: dvorka/hstr
  apt: hstr
  dnf: hstr
  brew: hstr
  apk: hstr
  yum: hstr
  port: hstr
  emerge: app-shells/hstr
  yay: hstr
rule:
  /eget:
    cmd: x eget dvorka/hstr
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S hstr
    reference: https://aur.archlinux.org/packages/hstr
  darwin/brew:
    cmd: brew install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#macos
  darwin/port:
    cmd: sudo port install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#macos
  ubuntu/apt:
    cmd: sudo apt install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#ubuntu
    dsnap: hstr
  fedora/dnf:
    cmd: sudo dnf install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#fedorarhelcentosscientific
    dsnap: hstr
  fedora/yum:
    cmd: sudo yum install hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#fedorarhelcentosscientific
  gentoo/emerge:
    cmd: sudo emerge app-shells/hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#gentoo
  alpine/apk:
    cmd: apk add hstr
    reference: https://github.com/dvorka/hstr/blob/master/INSTALLATION.md#alpine-linux
    dsnap: hstr
binlist:
- hstr

