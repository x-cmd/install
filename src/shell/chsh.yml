lang: Shell
homepage: https://github.com/shadow-maint/shadow
desc:
  cn: Shadow-utils 软件包包括将 UNIX 密码文件转换为影子密码格式的必要程序，以及用于管理用户和组帐户的程序
  en: The shadow-utils package includes the necessary programs for converting UNIX password files to the shadow password format, plus programs for managing user and group accounts
x:
  source: https://github.com/shadow-maint/shadow
  eget: shadow-maint/shadow
  apt: passwd
  dnf: util-linux-ng
  pacman: util-linux
  apk: util-linux
  apt-get: passwd
  yum: util-linux-ng
rule:
  /eget:
    cmd: x eget shadow-maint/shadow
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install passwd
    reference: https://command-not-found.com/chsh
    dsnap: passwd
  ubuntu/apt:
    cmd: sudo apt-get install passwd
    reference: https://command-not-found.com/chsh
    dsnap: passwd
  alpine/apk:
    cmd: sudo apk add util-linux
    reference: https://command-not-found.com/chsh
    dsnap: util-linux
  arch/pacman:
    cmd: sudo pacman -S util-linux
    reference: https://command-not-found.com/chsh
  kali/apt:
    cmd: sudo apt-get install passwd
    reference: https://command-not-found.com/chsh
    dsnap: passwd
  centos/yum:
    cmd: sudo yum install util-linux-ng
    reference: https://command-not-found.com/chsh
  fedora/dnf:
    cmd: sudo dnf install util-linux-user
    reference: https://command-not-found.com/chsh
    dsnap: util-linux-user
  raspbian/apt:
    cmd: sudo apt-get install passwd
    reference: https://command-not-found.com/chsh
binlist:
- chsh
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
