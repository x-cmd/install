lang: Haskell
homepage: https://github.com/koalaman/shellcheck
license: GPL-3.0
desc:
  cn: shell 脚本静态分析工具
  en: Static analysis tool for shell scripts
x:
  pkg:
    exist: true
  source: https://github.com/koalaman/shellcheck
  eget: https://github.com/koalaman/shellcheck
rule:
  /x:
    cmd: x pkg use shellcheck
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget koalaman/shellcheck
    reference: https://x-cmd.com/mod/eget
  /cabal:
    cmd: cabal install ShellCheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  /stack:
    cmd: stack install ShellCheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  debian/apt:
    cmd: sudo apt install shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
    dsnap: shellcheck
  ubuntu/apt:
    cmd: sudo apt install shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
    dsnap: shellcheck
  kali/apt:
    cmd: sudo apt install shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
    dsnap: shellcheck
  raspbian/apt:
    cmd: sudo apt install shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  arch/pacman:
    cmd: sudo pacman -S shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  gentoo/emerge:
    cmd: sudo emerge --ask shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  centos/yum:
    cmd: 'sudo yum -y install epel-release \

      && sudo yum install ShellCheck

      '
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  fedora/dnf:
    cmd: sudo dnf install ShellCheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
    dsnap: ShellCheck
  freebsd/pkg:
    cmd: sudo pkg install hs-ShellCheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  darwin/brew:
    cmd: brew install shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  darwin/port:
    cmd: sudo port install shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  openbsd/pkg_add:
    cmd: sudo pkg_add shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  opensuse/zypper:
    cmd: sudo zypper in ShellCheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  solus/eopkg:
    cmd: sudo eopkg install shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  (win|wsl2)/scoop:
    cmd: x scoop install shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  (win|wsl2)/choco:
    cmd: x choco install shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  /conda:
    cmd: conda install -c conda-forge shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
  /snap:
    cmd: sudo snap install --channel=edge shellcheck
    reference: https://github.com/koalaman/shellcheck?tab=readme-ov-file#installing
binlist:
- shellcheck

# already profiled
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 安装 16 MB
            en: 16 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 8 MB
        desc:
          cn: 8 MB
          en: 8 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
