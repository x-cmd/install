lang: 'Python'
homepage: 'https://github.com/nosarthur/gita'
license: 'MIT'
desc:
  cn: 从容管理多个 git 仓库
  en: 'Manage many git repos with sanity 从容管理多个git库'
  cs: Spravujte mnoho git repozitářů s rozumnem
  de: Verwalte viele git-Repos mit gesundem Verstand
  es: Gestiona muchos repositorios git con cordura
  fr: Gérez de nombreux dépôts git avec sang-froid
  id: Kelola banyak repositori git dengan waras
  it: Gestisci molti repository git con senno
  ja: 多くの git リポジトリを冷静に管理できます
  ko: 여러 git 저장소를 합리적으로 관리하세요
  pl: Zarządzaj wieloma repozytoriami git z rozsądkiem
  pt: Gerencie muitos repositórios git com sanidade
  ro: Gestionați multe depozite git cu bun-simț
  ru: Управляйте множеством git-репозиториев с умом
  th: จัดการที่เก็บ git หลายแห่งอย่างมีสติ
  tr: Çok sayıda git deposunu akıllıca yönetin
  uk: Керуйте багатьма git-репозиторіями з розумом
  vi: Quản lý nhiều kho git một cách điềm tĩnh
x:
  source: https://github.com/nosarthur/gita
  eget: nosarthur/gita
rule:
  /eget:
    cmd: x eget nosarthur/gita
    reference: https://github.com/nosarthur/gita
binlist:
  - 'gita'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
