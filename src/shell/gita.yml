lang: 'Python'
homepage: 'https://github.com/nosarthur/gita'
license: 'MIT'
desc:
  cn: 从容管理多个 git 仓库
  en: 'Manage many git repos with sanity 从容管理多个git库'
x:
  source: https://github.com/nosarthur/gita
  eget: https://github.com/nosarthur/gita
rule:
  /eget:
    cmd: x eget nosarthur/gita
    reference: https://github.com/nosarthur/gita
binlist:
  - 'gita'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
