lang: C
homepage: https://github.com/tio/tio
desc:
  cn: 串口设备 I/O 工具
  en: A serial device I/O tool
x:
  source: https://github.com/tio/tio
  eget: https://github.com/tio/tio
rule:
  /eget:
    cmd: x eget tio/tio
    reference: https://github.com/tio/tio
binlist:
- tio
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 257 KB
          rating: 1
          desc:
            cn: 约 257 KB（估算）
            en: ~257 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
