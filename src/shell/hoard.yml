lang: Rust
homepage: https://github.com/Hyde46/hoard
license: MIT
desc:
  en: A command organizer lets you save commands that you often use, but are too complicated or long to remember.
  cn: 命令组织器可以让你保存经常使用的命令，但这些命令太复杂或太长而难以记忆。
x:
  source: https://github.com/Hyde46/hoard
  eget: https://github.com/Hyde46/hoard
rule:
  /eget:
    cmd: x eget Hyde46/hoard
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install hoard-rs
    reference: https://github.com/Hyde46/hoard?tab=readme-ov-file#from-source
    dsnap: hoard-rs
  arch/paru:
    cmd: paru -S hoard
    reference: https://github.com/Hyde46/hoard?tab=readme-ov-file#aur-arch-linux
  arch/yay:
    cmd: yay -S hoard
    reference: https://aur.archlinux.org/packages/hoard
  darwin/brew:
    cmd: 'brew tap Hyde46/hoard

      brew install hoard

      '
    reference: https://github.com/Hyde46/hoard?tab=readme-ov-file#homebrew-macos
  darwin/port:
    cmd: sudo port install hoard-cli
    reference: https://github.com/Hyde46/hoard?tab=readme-ov-file#macports-macos
binlist:
- hoard

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
