lang: 'Go'
homepage: 'https://github.com/stefanlogue/meteor'
license: 'MIT'
desc:
  cn: 高度可配置的 Conventional Commits 提交编写 CLI
  en: 'A highly configurable CLI tool for writing conventional commits'
x:
  source: https://github.com/stefanlogue/meteor
  eget: https://github.com/stefanlogue/meteor
rule:
  /eget:
    cmd: x eget stefanlogue/meteor
    reference: https://github.com/stefanlogue/meteor
binlist:
- 'meteor'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 121 KB
          rating: 1
          desc:
            cn: 约 121 KB（估算）
            en: ~121 KB estimated
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
