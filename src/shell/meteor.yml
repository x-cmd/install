lang: 'Go'
homepage: 'https://github.com/stefanlogue/meteor'
license: 'MIT'
desc:
  cn: 高度可配置的 Conventional Commits 提交编写 CLI
  en: 'A highly configurable CLI tool for writing conventional commits'
  cs: Vysoce konfigurovatelný nástroj CLI pro zápis konvenčních commitů
  de: Ein hochkonfigurierbares CLI-Werkzeug zum Schreiben konventioneller Commits
  es: Una herramienta CLI altamente configurable para escribir commits convencionales
  fr: Un outil CLI hautement configurable pour écrire des commits conventionnels
  id: Alat CLI yang sangat dapat dikonfigurasi untuk menulis commit konvensional
  it: Uno strumento CLI altamente configurabile per scrivere commit convenzionali
  ja: Conventional Commits を書くための高度に設定可能な CLI ツール
  ko: Conventional Commits 작성을 위한 매우 설정 가능한 CLI 도구
  pl: Wysoce konfigurowalne narzędzie CLI do tworzenia konwencjonalnych commitów
  pt: Uma ferramenta CLI altamente configurável para escrever commits convencionais
  ro: Un instrument CLI extrem de configurabil pentru scrierea commit-urilor convenționale
  ru: Высоконастраиваемый инструмент CLI для написания conventional-коммитов
  th: เครื่องมือ CLI ที่ปรับแต่งได้อย่างสูงสำหรับการเขียน conventional commits
  tr: Konvansiyonel commit yazmak için yüksek düzeyde yapılandırılabilir CLI aracı
  uk: Високоналаштовуваний інструмент CLI для написання conventional-комітів
  vi: Công cụ CLI có thể tùy chỉnh cao để viết commit theo quy ước
x:
  source: https://github.com/stefanlogue/meteor
  eget: stefanlogue/meteor
rule:
  /eget:
    cmd: x eget stefanlogue/meteor
    reference: https://github.com/stefanlogue/meteor
binlist:
- 'meteor'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
