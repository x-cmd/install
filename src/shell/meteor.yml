lang: 'Go'
homepage: 'https://github.com/stefanlogue/meteor'
license: 'MIT'
desc:
  cn: 高度可配置的 Conventional Commits 提交编写 CLI
  en: 'A highly configurable CLI tool for writing conventional commits'
x:
  source: https://github.com/stefanlogue/meteor
  eget: https://github.com/stefanlogue/meteor
rule:
  /eget:
    cmd: x eget stefanlogue/meteor
    reference: https://github.com/stefanlogue/meteor
binlist:
  - 'meteor'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
