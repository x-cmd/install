lang: 'Rust'
homepage: 'https://github.com/marlocarlo/omp-manager'
license: 'MIT'
desc:
  cn: Oh My Posh 的安装与管理工具，集中浏览主题、安装字体和配置 Shell
  en: 'Installation and manager for Oh My Posh! The one thing you need to browse themes, install fonts, and configure shells'
x:
  source: https://github.com/marlocarlo/omp-manager
  eget: https://github.com/marlocarlo/omp-manager
rule:
  /eget:
    cmd: x eget marlocarlo/omp-manager
    reference: https://github.com/marlocarlo/omp-manager
binlist:
  - 'omp-manager'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 188 KB
          rating: 1
          desc:
            cn: 约 188 KB（估算）
            en: ~188 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
