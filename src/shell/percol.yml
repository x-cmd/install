lang: Python
homepage: https://github.com/mooz/percol
desc:
  cn: 在 UNIX 上的传统管道概念中添加交互式选择的风格
  en: adds flavor of interactive filtering to the traditional pipe concept of UNIX shell
x:
  pkg:
    exist: true
  source: https://github.com/mooz/percol
rule:
  /x:
    cmd: x pkg use percol
    reference: https://x-cmd.com/install/
  /pip:
    cmd: sudo pip install percol
    reference: https://github.com/mooz/percol?tab=readme-ov-file#installation
    dsnap: percol
  arch/yay:
    cmd: yay -S percol-git
    reference: https://aur.archlinux.org/packages/percol-git
binlist:
- percol
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
