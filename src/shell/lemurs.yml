lang: 'Rust'
homepage: 'https://github.com/coastalwhite/lemurs'
license: 'Apache-2.0'
desc:
  cn: Rust 编写的可定制 TUI 显示/登录管理器
  en: 'A customizable TUI display/login manager written in Rust 🐒'
x:
  source: https://github.com/coastalwhite/lemurs
  eget: https://github.com/coastalwhite/lemurs
rule:
  /eget:
    cmd: x eget coastalwhite/lemurs
    reference: https://github.com/coastalwhite/lemurs
binlist:
- 'lemurs'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 819 KB
          rating: 1
          desc:
            cn: 安装 819 KB
            en: 819 KB install
        download:
          estimate: 819 KB
          desc:
            cn: 约 819 KB 下载 (linux/x64)
            en: ~819 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
