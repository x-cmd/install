lang: 'Rust'
homepage: 'https://github.com/coastalwhite/lemurs'
license: 'Apache-2.0'
desc:
  cn: Rust 编写的可定制 TUI 显示/登录管理器
  en: 'A customizable TUI display/login manager written in Rust 🐒'
  cs: Přizpůsobitelný TUI správce zobrazení/přihlášení napsaný v Rustu 🐒
  de: Ein anpassbarer TUI-Anzeige-/Anmeldemanager, geschrieben in Rust 🐒
  es: Un gestor de pantalla/inicio de sesión TUI personalizable escrito en Rust 🐒
  fr: Un gestionnaire d'affichage/connexion TUI personnalisable écrit en Rust 🐒
  id: Manajer tampilan/login TUI yang dapat dikustomisasi, ditulis dalam Rust 🐒
  it: Un gestore di visualizzazione/accesso TUI personalizzabile scritto in Rust 🐒
  ja: Rust で書かれたカスタマイズ可能な TUI 表示/ログインマネージャー 🐒
  ko: Rust로 작성된 사용자 정의 가능한 TUI 표시/로그인 관리자 🐒
  pl: Konfigurowalny menedżer wyświetlania/logowania TUI napisany w Rust 🐒
  pt: Um gerenciador de exibição/login TUI personalizável escrito em Rust 🐒
  ro: Un manager TUI de afișare/autentificare personalizabil scris în Rust 🐒
  ru: Настраиваемый TUI-менеджер отображения и входа, написанный на Rust 🐒
  th: ตัวจัดการแสดงผล/เข้าสู่ระบบแบบ TUI ที่ปรับแต่งได้ เขียนด้วย Rust 🐒
  tr: Rust ile yazılmış, özelleştirilebilir TUI görüntüleme/giriş yöneticisi 🐒
  uk: Налаштовуваний TUI-менеджер відображення та входу, написаний на Rust 🐒
  vi: Trình quản lý hiển thị/đăng nhập TUI có thể tùy chỉnh, viết bằng Rust 🐒
x:
  source: https://github.com/coastalwhite/lemurs
  eget: coastalwhite/lemurs
rule:
  /eget:
    cmd: x eget coastalwhite/lemurs
    reference: https://github.com/coastalwhite/lemurs
binlist:
- 'lemurs'

