lang: 'Go'
homepage: 'https://github.com/kriuchkov/tock'
license: 'GPL-3.0'
desc:
  cn: 强大的命令行时间跟踪工具，以纯文本记录活动日志，并提供交互式终端界面
  en: 'Tock is a powerful time tracking tool for the command line. It saves activity logs as plaintext files and provides an interactive terminal UI for viewing your time.'
x:
  source: https://github.com/kriuchkov/tock
  eget: https://github.com/kriuchkov/tock
rule:
  /eget:
    cmd: x eget kriuchkov/tock
    reference: https://github.com/kriuchkov/tock
binlist:
- 'tock'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
