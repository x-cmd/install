lang: 'Rust'
homepage: https://github.com/akunzai/gistui
license: 'MIT'
desc:
  cn: 管理 GitHub Gist 的 TUI
  en: 'A terminal UI for managing GitHub Gists'
x:
  source: https://github.com/akunzai/gistui
  eget: https://github.com/akunzai/gistui
rule:
  /cargo:
    cmd: 'cargo install gistui --force'
    reference: https://github.com/akunzai/gistui
  /eget:
    cmd: x eget akunzai/gistui
    reference: https://github.com/akunzai/gistui
binlist:
  - 'gistui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
