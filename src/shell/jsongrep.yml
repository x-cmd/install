lang: 'Rust'
homepage: https://github.com/micahkepe/jsongrep
license: 'MIT'
desc:
  cn: 面向 JSON、YAML、TOML 等序列化格式的路径查询语言
  en: 'A path query language for JSON, YAML, TOML, and other serialization formats.'
x:
  source: https://github.com/micahkepe/jsongrep
  eget: https://github.com/micahkepe/jsongrep
rule:
  /eget:
    cmd: x eget micahkepe/jsongrep
    reference: https://github.com/micahkepe/jsongrep
binlist:
  - 'jsongrep'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 327 KB
          rating: 1
          desc:
            cn: 约 327 KB（估算）
            en: ~327 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
