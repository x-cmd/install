lang: 'Rust'
homepage: https://github.com/micahkepe/jsongrep
license: 'MIT'
desc:
  cn: 面向 JSON、YAML、TOML 等序列化格式的路径查询语言
  en: 'A path query language for JSON, YAML, TOML, and other serialization formats.'
x:
  source: https://github.com/micahkepe/jsongrep
  eget: https://github.com/micahkepe/jsongrep
rule:
  /eget:
    cmd: x eget micahkepe/jsongrep
    reference: https://github.com/micahkepe/jsongrep
binlist:
- 'jsongrep'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
