lang: 'Python'
homepage: 'https://github.com/paulrobello/parllama'
license: 'MIT'
desc:
  cn: Ollama 及其他 LLM 供应商的 TUI 客户端
  en: 'TUI for Ollama and other LLM providers'
x:
  source: https://github.com/paulrobello/parllama
  eget: https://github.com/paulrobello/parllama
rule:
  /eget:
    cmd: x eget paulrobello/parllama
    reference: https://github.com/paulrobello/parllama
binlist:
  - 'parllama'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
