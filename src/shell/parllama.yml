lang: 'Python'
homepage: 'https://github.com/paulrobello/parllama'
license: 'MIT'
desc:
  cn: Ollama 及其他 LLM 供应商的 TUI 客户端
  en: 'TUI for Ollama and other LLM providers'
x:
  source: https://github.com/paulrobello/parllama
  eget: https://github.com/paulrobello/parllama
rule:
  /eget:
    cmd: x eget paulrobello/parllama
    reference: https://github.com/paulrobello/parllama
binlist:
- 'parllama'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 47 KB
          rating: 1
          desc:
            cn: 约 47 KB（估算）
            en: ~47 KB estimated
        download:
          estimate: 245 KB
          desc:
            cn: 约 245 KB 下载 (whl)
            en: ~245 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
