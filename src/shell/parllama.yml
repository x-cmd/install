lang: 'Python'
homepage: 'https://github.com/paulrobello/parllama'
license: 'MIT'
desc:
  cn: Ollama 及其他 LLM 供应商的 TUI 客户端
  en: 'TUI for Ollama and other LLM providers'
  cs: TUI pro Ollama a další poskytovatele LLM
  de: TUI für Ollama und andere LLM-Anbieter
  es: TUI para Ollama y otros proveedores de LLM
  fr: TUI pour Ollama et d'autres fournisseurs de LLM
  id: TUI untuk Ollama dan penyedia LLM lainnya
  it: TUI per Ollama e altri fornitori di LLM
  ja: Ollama やその他の LLM プロバイダー向け TUI
  ko: Ollama 및 기타 LLM 제공업체를 위한 TUI
  pl: TUI dla Ollama i innych dostawców LLM
  pt: TUI para Ollama e outros provedores de LLM
  ro: TUI pentru Ollama și alți furnizori de LLM
  ru: TUI для Ollama и других поставщиков LLM
  th: TUI สำหรับ Ollama และผู้ให้บริการ LLM อื่น ๆ
  tr: Ollama ve diğer LLM sağlayıcıları için TUI
  uk: TUI для Ollama та інших постачальників LLM
  vi: TUI cho Ollama và các nhà cung cấp LLM khác
x:
  source: https://github.com/paulrobello/parllama
  eget: paulrobello/parllama
rule:
  /eget:
    cmd: x eget paulrobello/parllama
    reference: https://github.com/paulrobello/parllama
binlist:
- 'parllama'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 245 KB
          rating: 1
          desc:
            cn: 安装 245 KB
            en: 245 KB install
        download:
          estimate: 245 KB
          desc:
            cn: 约 245 KB 下载 (whl)
            en: ~245 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
