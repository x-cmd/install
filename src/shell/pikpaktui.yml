lang: 'Rust'
homepage: https://github.com/Bengerthelorf/pikpaktui
license: 'Apache-2.0'
desc:
  cn: PikPak 云存储的 TUI 与 CLI 客户端，纯 Rust 实现，支持浏览、下载、上传、流式播放和文件管理
  en: 'A TUI and CLI client for PikPak cloud storage — written in pure Rust. OpenClaw friendly. Browse, download, upload, stream, and manage your files from the terminal.'
x:
  source: https://github.com/Bengerthelorf/pikpaktui
  eget: https://github.com/Bengerthelorf/pikpaktui
rule:
  /eget:
    cmd: x eget Bengerthelorf/pikpaktui
    reference: https://github.com/Bengerthelorf/pikpaktui
binlist:
- 'pikpaktui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
