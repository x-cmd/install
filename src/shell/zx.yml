lang: JavaScript
homepage: https://github.com/google/zx
license: Apache-2.0
desc:
  cn: 能让你用 js 编写各种类型脚本的工具
  en: Tools that allow you to write various types of scripts using js
x:
  pkg:
    exist: true
  source: https://github.com/google/zx
rule:
  /x:
    cmd: x pkg use zx
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g zx
    reference: https://google.github.io/zx/getting-started#install
    dsnap: zx
  arch/yay:
    cmd: yay -S zx
    reference: https://aur.archlinux.org/packages/zx
binlist:
- zx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
