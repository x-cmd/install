lang: JavaScript
homepage: https://github.com/google/zx
license: Apache-2.0
desc:
  cn: 能让你用 js 编写各种类型脚本的工具
  en: Tools that allow you to write various types of scripts using js
  cs: Nástroje, které vám umožní psát různé typy skriptů v JavaScriptu
  de: Werkzeuge, mit denen Sie verschiedene Arten von Skripten in JavaScript schreiben können
  es: Herramientas que te permiten escribir varios tipos de scripts en JavaScript
  fr: Des outils qui vous permettent d'écrire différents types de scripts en JavaScript
  id: Alat yang memungkinkan Anda menulis berbagai jenis skrip menggunakan JavaScript
  it: Strumenti che ti permettono di scrivere vari tipi di script in JavaScript
  ja: JavaScript でさまざまな種類のスクリプトを書くためのツール
  ko: JavaScript로 다양한 종류의 스크립트를 작성할 수 있게 해 주는 도구
  pl: Narzędzia, które pozwalają pisać różne rodzaje skryptów w JavaScript
  pt: Ferramentas que permitem escrever vários tipos de scripts usando JavaScript
  ro: Instrumente care vă permit să scrieți diferite tipuri de scripturi în JavaScript
  ru: Инструменты, позволяющие писать различные типы скриптов на JavaScript
  th: เครื่องมือที่ช่วยให้คุณเขียนสคริปต์หลายประเภทด้วย JavaScript
  tr: JavaScript kullanarak çeşitli türlerde betikler yazmanıza olanak tanıyan araçlar
  uk: Інструменти, які дозволяють писати різні типи скриптів на JavaScript
  vi: Các công cụ cho phép bạn viết nhiều loại script bằng JavaScript
x:
  source: https://github.com/google/zx
  yay: zx
  npm: zx
rule:
  /x:
    cmd: x pkg use zx
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g zx
    reference: https://google.github.io/zx/getting-started#install
    dsnap: zx
  arch/yay:
    cmd: yay -S zx
    reference: https://aur.archlinux.org/packages/zx
binlist:
- zx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
