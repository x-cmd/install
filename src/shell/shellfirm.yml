lang: Rust
homepage: https://shellfirm.vercel.app/
license: Apache-2.0
desc:
  en: shellfirm is a safety guardrail for the terminal — it intercepts risky shell commands with a quick challenge before they run, covering 100+ patterns across git, Kubernetes, Terraform, Docker, cloud and databases, and can also serve as an MCP tool for AI agents; run `shellfirm init` once to install the shell hook.
  cn: shellfirm 是终端的安全护栏：在危险命令执行前用一道小挑战拦下来，覆盖 git、Kubernetes、Terraform、Docker、各云与数据库等 9 类生态的 100+ 条规则，也可作为 MCP 工具供 AI 代理调用；安装后执行一次 `shellfirm init` 装上 shell 钩子。
  cs: shellfirm je bezpečnostní zábrana pro terminál — zachycuje rizikové příkazy shell malou výzvou ještě před jejich spuštěním, pokrývá 100+ vzorů pro git, Kubernetes, Terraform, Docker, cloud a databáze a může sloužit i jako nástroj MCP pro agenty AI; jednou spusťte `shellfirm init` pro instalaci shell hooku.
  de: shellfirm ist eine Sicherheitsbarriere für das Terminal — es fängt riskante Shell-Befehle mit einer kurzen Prüfung ab, bevor sie ausgeführt werden, deckt 100+ Muster für git, Kubernetes, Terraform, Docker, Cloud und Datenbanken ab und kann auch als MCP-Werkzeug für KI-Agenten dienen; führen Sie einmal `shellfirm init` aus, um den Shell-Hook zu installieren.
  es: "shellfirm es una barrera de seguridad para el terminal: intercepta los comandos de shell riesgosos con un breve desafío antes de ejecutarlos, cubre más de 100 patrones de git, Kubernetes, Terraform, Docker, nube y bases de datos, y también puede actuar como herramienta MCP para agentes de IA; ejecuta `shellfirm init` una vez para instalar el hook de shell."
  fr: shellfirm est un garde-fou de sécurité pour le terminal — il intercepte les commandes shell risquées avec un petit défi avant leur exécution, couvre plus de 100 motifs pour git, Kubernetes, Terraform, Docker, le cloud et les bases de données, et peut aussi servir d'outil MCP pour les agents IA ; lancez une fois `shellfirm init` pour installer le hook shell.
  id: shellfirm adalah pagar pengaman terminal — ia mencegat perintah shell yang berisiko dengan tantangan singkat sebelum dijalankan, mencakup 100+ pola untuk git, Kubernetes, Terraform, Docker, cloud, dan basis data, serta dapat berfungsi sebagai alat MCP untuk agen AI; jalankan `shellfirm init` sekali untuk memasang hook shell.
  it: "shellfirm è una barriera di sicurezza per il terminale: intercetta i comandi shell rischiosi con una breve verifica prima di eseguirli, copre oltre 100 pattern per git, Kubernetes, Terraform, Docker, cloud e database e può fungere anche da strumento MCP per gli agenti IA; esegui una volta `shellfirm init` per installare l'hook della shell."
  ja: shellfirm はターミナルの安全ガードレールです。危険なシェルコマンドを実行前に短いチャレンジで遮断し、git、Kubernetes、Terraform、Docker、クラウド、データベースなど 100 以上のパターンに対応します。AI エージェント向けの MCP ツールとしても利用できます。シェルフックを入れるには一度 `shellfirm init` を実行してください。
  ko: shellfirm는 터미널의 안전 가드레일로, 위험한 셸 명령을 실행 전에 짧은 확인으로 차단하며 git, Kubernetes, Terraform, Docker, 클라우드, 데이터베이스 등 100개 이상의 패턴을 다룹니다. AI 에이전트를 위한 MCP 도구로도 사용할 수 있으며, 셸 훅을 설치하려면 `shellfirm init`을 한 번 실행하세요.
  pl: shellfirm to barierka bezpieczeństwa dla terminala — przechwytuje ryzykowne polecenia shell niewielkim wyzwaniem przed ich uruchomieniem, obejmuje ponad 100 wzorców dla git, Kubernetes, Terraform, Dockera, chmury i baz danych, a także może działać jako narzędzie MCP dla agentów AI; raz uruchom `shellfirm init`, aby zainstalować hook shella.
  pt: O shellfirm é uma barreira de segurança para o terminal — intercepta comandos de shell arriscados com um pequeno desafio antes de executá-los, cobre mais de 100 padrões de git, Kubernetes, Terraform, Docker, nuvem e bancos de dados, e também pode servir como ferramenta MCP para agentes de IA; execute `shellfirm init` uma vez para instalar o hook de shell.
  ro: shellfirm este o barieră de securitate pentru terminal — interceptează comenzi shell riscante cu o mică provocare înainte de rularea lor, acoperind 100+ tipare pentru git, Kubernetes, Terraform, Docker, cloud și baze de date, și poate servi drept instrument MCP pentru agenți AI; rulați o dată `shellfirm init` pentru a instala hook-ul shell.
  ru: "shellfirm — это защитный барьер для терминала: он перехватывает опасные shell-команды небольшой проверкой до их выполнения, охватывает более 100 шаблонов для git, Kubernetes, Terraform, Docker, облаков и баз данных, а также может служить инструментом MCP для ИИ-агентов; один раз выполните `shellfirm init`, чтобы установить shell-хук."
  th: shellfirm เป็นแนวป้องกันความปลอดภัยของเทอร์มินัล — มันจะสกัดคำสั่งเชลล์ที่เสี่ยงด้วยคำถามตรวจสอบสั้น ๆ ก่อนที่จะรัน โดยครอบคลุมรูปแบบกว่า 100 รายการสำหรับ git, Kubernetes, Terraform, Docker, คลาวด์ และฐานข้อมูล และยังใช้เป็นเครื่องมือ MCP สำหรับเอเจนต์ AI ได้ ให้รัน `shellfirm init` หนึ่งครั้งเพื่อติดตั้งเชลล์ฮุก
  tr: shellfirm, terminal için bir güvenlik bariyeridir — riskli kabuk komutlarını çalıştırılmadan önce kısa bir doğrulamayla durdurur, git, Kubernetes, Terraform, Docker, bulut ve veritabanları için 100'den fazla deseni kapsar ve yapay zekâ ajanları için MCP aracı olarak da kullanılabilir; kabuk kancasını kurmak için `shellfirm init` komutunu bir kez çalıştırın.
  uk: "shellfirm — це захисний бар'єр для термінала: він перехоплює небезпечні shell-команди невеликою перевіркою до їх виконання, охоплює понад 100 шаблонів для git, Kubernetes, Terraform, Docker, хмар і баз даних, а також може слугувати інструментом MCP для агентів ШІ; один раз виконайте `shellfirm init`, щоб встановити shell-хук."
  vi: shellfirm là hàng rào an toàn cho terminal — nó chặn các lệnh shell rủi ro bằng một thử thách ngắn trước khi chạy, bao phủ hơn 100 mẫu cho git, Kubernetes, Terraform, Docker, cloud và cơ sở dữ liệu, đồng thời có thể dùng làm công cụ MCP cho các tác nhân AI; chạy `shellfirm init` một lần để cài hook shell.
x:
  source: https://github.com/kaplanelad/shellfirm
  eget: kaplanelad/shellfirm
  brew: kaplanelad/tap/shellfirm
  npm: '@shellfirm/cli'
  cargo: shellfirm
rule:
  /eget:
    cmd: x eget kaplanelad/shellfirm
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install -g @shellfirm/cli
    reference: https://github.com/kaplanelad/shellfirm#installation
    dsnap: '@shellfirm/cli'
  /cargo:
    cmd: cargo install shellfirm
    reference: https://github.com/kaplanelad/shellfirm#installation
    dsnap: shellfirm
  darwin/brew:
    cmd: brew tap kaplanelad/tap && brew install shellfirm
    reference: https://github.com/kaplanelad/shellfirm#installation
binlist:
- shellfirm

# complicated
footprint:
  behavior:
    runtime:
      type: ['cli', 'tui']
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取待执行的命令、当前目录与 git 状态用于风险评估，并读取项目策略 .shellfirm.yaml 与自定义检查规则
          en: Reads the command being run, the working directory and git state for risk assessment, plus project policies (.shellfirm.yaml) and custom check rules
        sensitive: []
      write:
        desc:
          cn: 写入 ~/.shellfirm 下的配置与审计日志，并在 shellfirm init 时向 shell rc（~/.zshrc、~/.bashrc、~/.config/fish/config.fish 等）注入钩子
          en: Writes the config and audit log under ~/.shellfirm, and injects hooks into shell rc files (~/.zshrc, ~/.bashrc, ~/.config/fish/config.fish, etc.) when running shellfirm init
        sensitive:
        - "$HOME/.shellfirm/audit.log"
        - "$HOME/.zshrc"
        - "$HOME/.bashrc"
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 约 6 MB 安装 (linux/x64)
            en: ~6 MB install (linux/x64)
        download:
          estimate: 1.6 MB
          desc:
            cn: 约 1.6 MB 下载 (linux/x64 tar.xz)
            en: ~1.6 MB download (linux/x64 tar.xz)
        growth:
          desc:
            cn: 审计日志 ~/.shellfirm/audit.log 按被拦截的命令逐条追加
            en: The audit log ~/.shellfirm/audit.log grows with every intercepted command
      paths:
        data:
          - ~/.shellfirm/audit.log
        config:
          - ~/.shellfirm/
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 约 10 MB 闲置
          en: ~10 MB idle
    cpu:
      workload: ['compute', 'io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 低（每条命令执行前的快速规则匹配）
          en: Low (a quick rule match before every command)
  platform:
    win: partial
    linux: partial
    darwin: full
