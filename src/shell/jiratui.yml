lang: 'Python'
homepage: https://github.com/whyisdifficult/jiratui
license: 'MIT'
desc:
  cn: 从 shell 与 Atlassian Jira 交互的 TUI
  en: 'A Textual User Interface for interacting with Atlassian Jira from your shell'
x:
  source: https://github.com/whyisdifficult/jiratui
  eget: https://github.com/whyisdifficult/jiratui
rule:
  /eget:
    cmd: x eget whyisdifficult/jiratui
    reference: https://github.com/whyisdifficult/jiratui
binlist:
  - 'jiratui'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
