lang: Go
homepage: https://git.rootprojects.org/root/pathman
desc:
  cn: PATH 管理工具，用于管理 Windows 10、Mac 和 Linux 上的 PATH
  en: PATH management tool for managing PATH on Windows 10, Mac and Linux
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use pathman
    reference: https://x-cmd.com/install/
  darwin/curl:
    cmd: curl -s https://webinstall.dev/pathman | bash
    reference: https://git.rootprojects.org/root/pathman#install
  linux/curl:
    cmd: curl -s https://webinstall.dev/pathman | bash
    reference: https://git.rootprojects.org/root/pathman#install
  win/curl:
    cmd: curl.exe -sA "MS" https://webinstall.dev/pathman | powershell
    reference: https://git.rootprojects.org/root/pathman#install
  /npm:
    cmd: npm install -g pathman
    reference: https://git.rootprojects.org/root/pathman#manual-install
binlist:
- pathman
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
