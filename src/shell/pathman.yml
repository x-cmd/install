lang: Go
homepage: https://git.rootprojects.org/root/pathman
desc:
  cn: PATH 管理工具，用于管理 Windows 10、Mac 和 Linux 上的 PATH
  en: PATH management tool for managing PATH on Windows 10, Mac and Linux
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use pathman
    reference: https://x-cmd.com/install/
  darwin/curl:
    cmd: curl -s https://webinstall.dev/pathman | bash
    reference: https://git.rootprojects.org/root/pathman#install
  linux/curl:
    cmd: curl -s https://webinstall.dev/pathman | bash
    reference: https://git.rootprojects.org/root/pathman#install
  win/curl:
    cmd: curl.exe -sA "MS" https://webinstall.dev/pathman | powershell
    reference: https://git.rootprojects.org/root/pathman#install
  /npm:
    cmd: npm install -g pathman
    reference: https://git.rootprojects.org/root/pathman#manual-install
binlist:
- pathman
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
