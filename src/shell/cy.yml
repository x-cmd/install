lang: 'C'
homepage: 'https://github.com/cfoust/cy'
license: 'MIT'
desc:
  cn: 终端中的时间旅行工具
  en: '🤖 time travel in the terminal'
x:
  source: https://github.com/cfoust/cy
  eget: https://github.com/cfoust/cy
rule:
  /eget:
    cmd: x eget cfoust/cy
    reference: https://github.com/cfoust/cy
binlist:
  - 'cy'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4.6 MB
          rating: 1
          desc:
            cn: 约 4.6 MB（估算）
            en: ~4.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
