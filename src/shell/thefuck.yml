lang: Python
homepage: https://github.com/nvbn/thefuck
license: MIT
desc:
  cn: 终端命令纠错工具
  en: Terminal command debugging tool
x:
  pkg:
    exist: true
  source: https://github.com/nvbn/thefuck
rule:
  /x:
    cmd: x pkg use thefuck
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install thefuck
    reference: https://github.com/nvbn/thefuck#installation
  /pip:
    cmd: pip install thefuck
    reference: https://github.com/nvbn/thefuck#installation
    dsnap: thefuck
  mint/pip:
    cmd: 'sudo apt update \

      && sudo apt install python3-dev python3-pip python3-setuptools \

      && pip3 install thefuck --user

      '
    reference: https://github.com/nvbn/thefuck#installation
  ubuntu/pip:
    cmd: 'sudo apt update \

      && sudo apt install python3-dev python3-pip python3-setuptools \

      && pip3 install thefuck --user

      '
    reference: https://github.com/nvbn/thefuck#installation
  freebsd/pkg:
    cmd: pkg install thefuck
    reference: https://github.com/nvbn/thefuck#installation
  chrome/crew:
    cmd: crew install thefuck
    reference: https://github.com/nvbn/thefuck#installation
  arch/pacman:
    cmd: sudo pacman -S thefuck
    reference: https://github.com/nvbn/thefuck#installation
binlist:
- thefuck

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 26 KB
          rating: 1
          desc:
            cn: 约 26 KB（估算）
            en: ~26 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
