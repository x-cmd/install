lang: C
homepage: https://git.savannah.gnu.org/cgit/bash.git
desc:
  cn: Bash 是 GNU 项目的 Bourne Again SHell
  en: Bash is the GNU Project's Bourne Again SHell
  cs: Bash je Bourne Again SHell projektu GNU
  de: Bash ist die Bourne Again SHell des GNU-Projekts
  es: Bash es la Bourne Again SHell del proyecto GNU
  fr: Bash est la Bourne Again SHell du projet GNU
  id: Bash adalah Bourne Again SHell dari proyek GNU
  it: Bash è la Bourne Again SHell del progetto GNU
  ja: Bash は GNU プロジェクトの Bourne Again SHell です
  ko: Bash는 GNU 프로젝트의 Bourne Again SHell입니다
  pl: Bash to Bourne Again SHell projektu GNU
  pt: Bash é a Bourne Again SHell do projeto GNU
  ro: Bash este Bourne Again SHell al proiectului GNU
  ru: Bash — это Bourne Again SHell проекта GNU
  th: Bash คือ Bourne Again SHell ของโครงการ GNU
  tr: Bash, GNU projesinin Bourne Again SHell'idir
  uk: Bash — це Bourne Again SHell проєкту GNU
  vi: Bash là Bourne Again SHell của dự án GNU
rule:
  darwin/brew:
    cmd: brew install bash
    reference: https://formulae.brew.sh/formula/bash#default
  debian/apt:
    cmd: sudo apt-get install bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  ubuntu/apt:
    cmd: sudo apt-get install bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  alpine/apk:
    cmd: sudo apk add bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  arch/pacman:
    cmd: sudo pacman -S bash
    reference: https://command-not-found.com/bash
  kali/apt:
    cmd: sudo apt-get install bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  centos/yum:
    cmd: sudo yum install bash
    reference: https://command-not-found.com/bash
  fedora/dnf:
    cmd: sudo dnf install bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  raspbian/apt:
    cmd: sudo apt-get install bash
    reference: https://command-not-found.com/bash

x:
  apt: bash
  apt-get: bash
  dnf: bash
  yum: bash
  pacman: bash
  apk: bash
  brew: bash
binlist:
- bash
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
