lang: C
homepage: https://git.savannah.gnu.org/cgit/bash.git
desc:
  cn: Bash 是 GNU 项目的 Bourne Again SHell
  en: Bash is the GNU Project's Bourne Again SHell
rule:
  darwin/brew:
    cmd: brew install bash
    reference: https://formulae.brew.sh/formula/bash#default
  debian/apt:
    cmd: sudo apt-get install bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  ubuntu/apt:
    cmd: sudo apt-get install bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  alpine/apk:
    cmd: sudo apk add bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  arch/pacman:
    cmd: sudo pacman -S bash
    reference: https://command-not-found.com/bash
  kali/apt:
    cmd: sudo apt-get install bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  centos/yum:
    cmd: sudo yum install bash
    reference: https://command-not-found.com/bash
  fedora/dnf:
    cmd: sudo dnf install bash
    reference: https://command-not-found.com/bash
    dsnap: bash
  raspbian/apt:
    cmd: sudo apt-get install bash
    reference: https://command-not-found.com/bash
binlist:
- bash
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
