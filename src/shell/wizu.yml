lang: 'Rust'
homepage: https://github.com/sh1zen/wisu
license: 'Apache-2.0'
desc:
  cn: 用 Rust 编写的快速、极简目录树查看器
  en: 'A fast, minimalist directory tree viewer, written in Rust.'
x:
  source: https://github.com/sh1zen/wisu
  eget: https://github.com/sh1zen/wisu
rule:
  /eget:
    cmd: x eget sh1zen/wisu
    reference: https://github.com/sh1zen/wisu
binlist:
  - 'wizu'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
