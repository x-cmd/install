lang: 'Rust'
homepage: https://github.com/sh1zen/wisu
license: 'Apache-2.0'
desc:
  cn: 用 Rust 编写的快速、极简目录树查看器
  en: 'A fast, minimalist directory tree viewer, written in Rust.'
x:
  source: https://github.com/sh1zen/wisu
  eget: sh1zen/wisu
rule:
  /eget:
    cmd: x eget sh1zen/wisu
    reference: https://github.com/sh1zen/wisu
binlist:
  - 'wizu'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
