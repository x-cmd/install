lang: 'Python'
homepage: 'https://github.com/srsudar/eg'
license: 'MIT'
desc:
  cn: 在命令行中提供实用的命令示例
  en: 'Useful examples at the command line.'
x:
  source: https://github.com/srsudar/eg
  eget: srsudar/eg
rule:
  /eget:
    cmd: x eget srsudar/eg
    reference: https://github.com/srsudar/eg
binlist:
  - 'eg'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
