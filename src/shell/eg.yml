lang: 'Python'
homepage: 'https://github.com/srsudar/eg'
license: 'MIT'
desc:
  cn: 在命令行中提供实用的命令示例
  en: 'Useful examples at the command line.'
x:
  source: https://github.com/srsudar/eg
  eget: https://github.com/srsudar/eg
rule:
  /eget:
    cmd: x eget srsudar/eg
    reference: https://github.com/srsudar/eg
binlist:
  - 'eg'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
