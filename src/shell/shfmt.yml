lang: Go
homepage: https://github.com/mvdan/sh
license: BSD-3-Clause
desc:
  cn: shell 解析器、格式化器和解释器
  en: A shell parser, formatter, and interpreter
x:
  pkg:
    exist: true
  source: https://github.com/mvdan/sh
  eget: https://github.com/mvdan/sh
rule:
  /x:
    cmd: x pkg use shfmt
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget mvdan/sh
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install mvdan.cc/sh/v3/cmd/shfmt@latest
    reference: https://github.com/mvdan/sh?tab=readme-ov-file#shfmt
    dsnap: mvdan.cc/sh/v3/cmd/shfmt@latest
binlist:
- shfmt

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
