lang: Go
homepage: https://github.com/mvdan/sh
license: BSD-3-Clause
desc:
  cn: shell 解析器、格式化器和解释器
  en: A shell parser, formatter, and interpreter
  cs: Parser, formátovač a interpret pro shell
  de: Ein Parser, Formatter und Interpreter für Shells
  es: Un analizador, formateador e intérprete para shell
  fr: Un analyseur, formateur et interpréteur pour les shells
  id: Parser, pemformat, dan interpreter untuk shell
  it: Un parser, formattatore e interprete per shell
  ja: シェル用のパーサー、フォーマッタ、インタプリタ
  ko: 셸을 위한 파서, 포매터, 인터프리터
  pl: Parser, formatter i interpreter dla powłok
  pt: Um analisador, formatador e interpretador para shell
  ro: Un parser, formatator și interpretor pentru shell
  ru: Парсер, форматтер и интерпретатор для shell
  th: ตัวแยกวิเคราะห์ ตัวจัดรูปแบบ และตัวตีความสำหรับเชลล์
  tr: Kabuk için ayrıştırıcı, biçimlendirici ve yorumlayıcı
  uk: Парсер, форматувальник та інтерпретатор для shell
  vi: Bộ phân tích, trình định dạng và trình thông dịch cho shell
x:
  source: https://github.com/mvdan/sh
  eget: mvdan/sh
  go: mvdan.cc/sh/v3/cmd/shfmt@latest
rule:
  /x:
    cmd: x pkg use shfmt
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget mvdan/sh
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install mvdan.cc/sh/v3/cmd/shfmt@latest
    reference: https://github.com/mvdan/sh?tab=readme-ov-file#shfmt
    dsnap: mvdan.cc/sh/v3/cmd/shfmt@latest
binlist:
- shfmt

# already profiled
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 3.4 MB
          rating: 1
          desc:
            cn: 安装 3.4 MB
            en: 3.4 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
