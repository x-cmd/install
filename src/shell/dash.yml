lang: C
homepage: http://gondor.apana.org.au/~herbert/dash/
desc:
  cn: DASH 是 /bin/sh 的 POSIX 兼容实现，旨在尽可能小
  en: DASH is a POSIX-compliant implementation of /bin/sh that aims to be as small as possible
rule:
  darwin/brew:
    cmd: brew install dash
    reference: https://formulae.brew.sh/formula/dash#default
  debian/apt:
    cmd: sudo apt-get install dash
    reference: https://command-not-found.com/dash
    dsnap: dash
  ubuntu/apt:
    cmd: sudo apt-get install dash
    reference: https://command-not-found.com/dash
    dsnap: dash
  alpine/apk:
    cmd: sudo apk add dash
    reference: https://command-not-found.com/dash
    dsnap: dash
  arch/pacman:
    cmd: sudo pacman -S dash
    reference: https://command-not-found.com/dash
  kali/apt:
    cmd: sudo apt-get install dash
    reference: https://command-not-found.com/dash
    dsnap: dash
  centos/yum:
    cmd: sudo yum install dash
    reference: https://command-not-found.com/dash
  fedora/dnf:
    cmd: sudo dnf install dash
    reference: https://command-not-found.com/dash
    dsnap: dash
  raspbian/apt:
    cmd: sudo apt-get install dash
    reference: https://command-not-found.com/dash
binlist:
- dash
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
