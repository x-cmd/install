lang: 'TypeScript'
homepage: https://github.com/subsy/ralph-tui
license: 'MIT'
desc:
  cn: 通过预设任务清单编排 AI Agent 协作的终端工具
  en: 'ralph-tui is a terminal tool that works through a defined list of tasks and orchestrates AI agents to work though them.'
x:
  source: https://github.com/subsy/ralph-tui
  eget: https://github.com/subsy/ralph-tui
rule:
  /eget:
    cmd: x eget subsy/ralph-tui
    reference: https://github.com/subsy/ralph-tui
binlist:
  - 'ralph-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 200 KB
          rating: 1
          desc:
            cn: 约 200 KB（估算）
            en: ~200 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
