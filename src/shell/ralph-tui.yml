lang: 'TypeScript'
homepage: https://github.com/subsy/ralph-tui
license: 'MIT'
desc:
  cn: 通过预设任务清单编排 AI Agent 协作的终端工具
  en: 'ralph-tui is a terminal tool that works through a defined list of tasks and orchestrates AI agents to work though them.'
x:
  source: https://github.com/subsy/ralph-tui
  eget: https://github.com/subsy/ralph-tui
rule:
  /eget:
    cmd: x eget subsy/ralph-tui
    reference: https://github.com/subsy/ralph-tui
binlist:
  - 'ralph-tui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
