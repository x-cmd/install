lang: 'Python'
homepage: https://github.com/basnijholt/dotbins
license: 'Apache-2.0'
desc:
  cn: 在 dotfiles 中保持二进制文件更新
  en: 'Keep updated binaries in your dotfiles 🧰'
  cs: Udržujte aktuální binární soubory ve svých dotfiles 🧰
  de: Aktuelle Binärdateien in deinen Dotfiles behalten 🧰
  es: Mantén tus binarios actualizados en tus dotfiles 🧰
  fr: Gardez vos binaires à jour dans vos dotfiles 🧰
  id: Jaga binari tetap mutakhir di dotfiles Anda 🧰
  it: Mantieni i tuoi binari aggiornati nei tuoi dotfiles 🧰
  ja: dotfiles 内のバイナリを最新の状態に保つ 🧰
  ko: dotfiles의 바이너리를 최신 상태로 유지 🧰
  pl: Utrzymuj aktualne pliki binarne w swoich dotfiles 🧰
  pt: Mantenha seus binários atualizados em seus dotfiles 🧰
  ro: Păstrează binarele actualizate în dotfiles-urile tale 🧰
  ru: Поддерживайте бинарные файлы в актуальном состоянии в ваших dotfiles 🧰
  th: ให้ไบนารีใน dotfiles ของคุณอยู่ในเวอร์ชันล่าสุด 🧰
  tr: Dotfiles'ınızda ikili dosyaları güncel tutun 🧰
  uk: Підтримуйте бінарні файли в актуальному стані у ваших dotfiles 🧰
  vi: Giữ cho các tệp nhị phân trong dotfiles của bạn luôn được cập nhật 🧰
x:
  source: https://github.com/basnijholt/dotbins
  eget: basnijholt/dotbins
rule:
  /eget:
    cmd: x eget basnijholt/dotbins
    reference: https://github.com/basnijholt/dotbins
binlist:
  - 'dotbins'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
