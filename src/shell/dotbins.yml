lang: 'Python'
homepage: https://github.com/basnijholt/dotbins
license: 'Apache-2.0'
desc:
  cn: 在 dotfiles 中保持二进制文件更新
  en: 'Keep updated binaries in your dotfiles 🧰'
x:
  source: https://github.com/basnijholt/dotbins
  eget: https://github.com/basnijholt/dotbins
rule:
  /eget:
    cmd: x eget basnijholt/dotbins
    reference: https://github.com/basnijholt/dotbins
binlist:
  - 'dotbins'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
