lang: 'Python'
homepage: https://github.com/basnijholt/dotbins
license: 'Apache-2.0'
desc:
  cn: 在 dotfiles 中保持二进制文件更新
  en: 'Keep updated binaries in your dotfiles 🧰'
x:
  source: https://github.com/basnijholt/dotbins
  eget: https://github.com/basnijholt/dotbins
rule:
  /eget:
    cmd: x eget basnijholt/dotbins
    reference: https://github.com/basnijholt/dotbins
binlist:
  - 'dotbins'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
