lang: Rust
homepage: https://github.com/nushell/nushell
license: MIT
desc:
  cn: Nushell 是一种新型的 shell
  en: Nushell is a new type of shell
x:
  pkg:
    exist: true
  source: https://github.com/nushell/nushell
  eget: https://github.com/nushell/nushell
  brew: nushell
rule:
  /eget:
    cmd: x eget nushell/nushell
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use nushell
    reference: https://x-cmd.com/install/
  (win|wsl2)/scoop:
    cmd: x scoop install nu
    reference: https://scoop.sh/#/apps?q=nu
  (win|wsl2)/choco:
    cmd: x choco install nushell
    reference: https://community.chocolatey.org/packages/nushell
  (win|wsl2)/winget:
    cmd: x winget install nushell
    reference: https://www.nushell.sh/#windows
  /npm:
    cmd: npm install -g nushell
    reference: https://www.nushell.sh/book/installation.html#package-managers
    dsnap: nushell
  darwin/brew:
    cmd: brew install nushell
    reference: https://www.nushell.sh/#get-nu
  linux/brew:
    cmd: brew install nushell
    reference: https://www.nushell.sh/#get-nu
  /nix:
    cmd: nix profile install nixpkgs#nushell
    reference: https://www.nushell.sh/#nix-profile
binlist:
- nushell

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 74 MB
          rating: 3
          desc:
            cn: 安装 74 MB
            en: 74 MB install
        download:
          estimate: 74 MB
          desc:
            cn: 约 74 MB 下载 (linux/x64)
            en: ~74 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
