lang: 'Go'
homepage: https://github.com/ddworken/hishtory
license: 'MIT'
desc:
  cn: 可同步、可查询、带上下文的 shell 历史记录工具
  en: 'Your shell history: synced, queryable, and in context'
x:
  source: https://github.com/ddworken/hishtory
  eget: https://github.com/ddworken/hishtory
rule:
  /eget:
    cmd: x eget ddworken/hishtory
    reference: https://github.com/ddworken/hishtory
binlist:
- 'hishtory'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.8 MB
          rating: 1
          desc:
            cn: 约 1.8 MB（估算）
            en: ~1.8 MB estimated
        download:
          estimate: 46 MB
          desc:
            cn: 约 46 MB 下载 (linux/x64)
            en: ~46 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
