lang: 'Go'
homepage: https://github.com/ddworken/hishtory
license: 'MIT'
desc:
  cn: 可同步、可查询、带上下文的 shell 历史记录工具
  en: 'Your shell history: synced, queryable, and in context'
  cs: "Historie vašího shellu: synchronizovaná, prohledávatelná a s kontextem"
  de: "Ihre Shell-Historie: synchronisiert, durchsuchbar und mit Kontext"
  es: "El historial de tu shell: sincronizado, consultable y con contexto"
  fr: "L'historique de votre shell : synchronisé, interrogeable et contextualisé"
  id: "Riwayat shell Anda: tersinkronisasi, dapat ditelusuri, dan kontekstual"
  it: "La cronologia della tua shell: sincronizzata, interrogabile e contestualizzata"
  ja: "シェルの履歴: 同期可能、検索可能、文脈つき"
  ko: "셸 히스토리: 동기화, 검색, 맥락 제공"
  pl: "Historia Twojej powłoki: zsynchronizowana, możliwa do przeszukiwania i z kontekstem"
  pt: "O histórico do seu shell: sincronizado, pesquisável e com contexto"
  ro: "Istoricul shell-ului tău: sincronizat, interogabil și cu context"
  ru: "История вашей оболочки: синхронизированная, доступная для поиска и с контекстом"
  th: "ประวัติเชลล์ของคุณ: ซิงค์ได้ ค้นหาได้ และมีบริบท"
  tr: "Kabuk geçmişiniz: eşitlenmiş, sorgulanabilir ve bağlamsal"
  uk: "Історія вашої оболонки: синхронізована, доступна для пошуку та з контекстом"
  vi: "Lịch sử shell của bạn: đồng bộ, tra cứu được và có ngữ cảnh"
x:
  source: https://github.com/ddworken/hishtory
  eget: ddworken/hishtory
rule:
  /eget:
    cmd: x eget ddworken/hishtory
    reference: https://github.com/ddworken/hishtory
binlist:
- 'hishtory'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 46 MB
          rating: 2
          desc:
            cn: 安装 46 MB
            en: 46 MB install
        download:
          estimate: 46 MB
          desc:
            cn: 约 46 MB 下载 (linux/x64)
            en: ~46 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
