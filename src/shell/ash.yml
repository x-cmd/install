lang: C
homepage: http://gondor.apana.org.au/~herbert/dash/
desc:
  cn: Almquist Shell（也称为 shell，Ash 和 SH）是最初由 Kenneth Almquist 在 1980 年代后期撰写的轻巧的 Unix shell
  en: Almquist shell (also known as A Shell, ash and sh) is a lightweight Unix shell originally written by Kenneth Almquist in the late 1980s
rule:
  debian/apt:
    cmd: sudo apt-get install ash
    reference: https://command-nott-found.com/ash
    dsnap: ash
  ubuntu/apt:
    cmd: sudo apt-get install ash
    reference: https://command-not-found.com/ash
    dsnap: ash
  kali/apt:
    cmd: sudo apt-get install ash
    reference: https://command-not-found.com/ash
    dsnap: ash
  raspbian/apt:
    cmd: sudo apt-get install ash
    reference: https://command-not-found.com/ash
binlist:
- ash
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
