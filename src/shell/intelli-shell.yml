lang: 'Rust'
homepage: https://github.com/lasantosr/intelli-shell
license: 'Apache-2.0'
desc:
  cn: 为 shell 提供 IntelliSense 般的体验
  en: 'Like IntelliSense, but for shells'
x:
  source: https://github.com/lasantosr/intelli-shell
  eget: https://github.com/lasantosr/intelli-shell
rule:
  /eget:
    cmd: x eget lasantosr/intelli-shell
    reference: https://github.com/lasantosr/intelli-shell
binlist:
- 'intelli-shell'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
