lang: 'Rust'
homepage: https://github.com/lasantosr/intelli-shell
license: 'Apache-2.0'
desc:
  cn: 为 shell 提供 IntelliSense 般的体验
  en: 'Like IntelliSense, but for shells'
  cs: Jako IntelliSense, ale pro shelly
  de: Wie IntelliSense, nur für Shells
  es: Como IntelliSense, pero para shells
  fr: Comme IntelliSense, mais pour les shells
  id: Seperti IntelliSense, tetapi untuk shell
  it: Come IntelliSense, ma per le shell
  ja: IntelliSense のように、ただし shell 用です
  ko: IntelliSense와 같지만, 셸을 위한 것
  pl: Jak IntelliSense, ale dla powłok
  pt: Como o IntelliSense, mas para shells
  ro: Ca IntelliSense, dar pentru shell-uri
  ru: Как IntelliSense, но для оболочек
  th: เหมือน IntelliSense แต่สำหรับเชลล์
  tr: IntelliSense gibi ama kabuklar için
  uk: Як IntelliSense, але для оболонок
  vi: Giống IntelliSense, nhưng dành cho shell
x:
  source: https://github.com/lasantosr/intelli-shell
  eget: lasantosr/intelli-shell
rule:
  /eget:
    cmd: x eget lasantosr/intelli-shell
    reference: https://github.com/lasantosr/intelli-shell
binlist:
- 'intelli-shell'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
