lang: 'Rust'
homepage: https://github.com/lasantosr/intelli-shell
license: 'Apache-2.0'
desc:
  cn: 为 shell 提供 IntelliSense 般的体验
  en: 'Like IntelliSense, but for shells'
x:
  source: https://github.com/lasantosr/intelli-shell
  eget: https://github.com/lasantosr/intelli-shell
rule:
  /eget:
    cmd: x eget lasantosr/intelli-shell
    reference: https://github.com/lasantosr/intelli-shell
binlist:
  - 'intelli-shell'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
