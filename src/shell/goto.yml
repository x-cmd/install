lang: 'Go'
homepage: 'https://github.com/grafviktor/goto'
license: 'MIT'
desc:
  cn: 易用的终端 SSH 管理器，附带高级功能
  en: 'Easy to use terminal SSH manager with advanced features. Binaries included! 😉'
  cs: Snadno použitelný terminálový správce SSH s pokročilými funkcemi. Obsahuje i binární soubory! 😉
  de: Einfach zu bedienender SSH-Manager im Terminal mit erweiterten Funktionen. Binärdateien sind enthalten! 😉
  es: Un gestor SSH de terminal fácil de usar con funciones avanzadas. ¡Incluye binarios! 😉
  fr: Un gestionnaire SSH terminal facile à utiliser avec des fonctions avancées. Les binaires sont inclus ! 😉
  id: Pengelola SSH terminal yang mudah digunakan dengan fitur lanjutan. Binari disertakan! 😉
  it: Un gestore SSH da terminale facile da usare con funzioni avanzate. Binari inclusi! 😉
  ja: 高度な機能を備えた使いやすいターミナル SSH マネージャー。バイナリ同梱! 😉
  ko: 고급 기능을 갖춘 사용하기 쉬운 터미널 SSH 관리자. 바이너리 포함! 😉
  pl: Łatwy w użyciu terminalowy menedżer SSH z zaawansowanymi funkcjami. Zawiera pliki binarne! 😉
  pt: Um gerenciador SSH de terminal fácil de usar com recursos avançados. Binários incluídos! 😉
  ro: Un manager SSH de terminal ușor de folosit cu funcții avansate. Binare incluse! 😉
  ru: Простой в использовании терминальный SSH-менеджер с расширенными возможностями. Бинарные файлы включены! 😉
  th: ตัวจัดการ SSH ในเทอร์มินัลที่ใช้งานง่าย พร้อมฟีเจอร์ขั้นสูง มีไบนารีให้ใช้! 😉
  tr: Gelişmiş özelliklere sahip, kullanımı kolay terminal SSH yöneticisi. İkili dosyalar dahil! 😉
  uk: Простий у використанні термінальний SSH-менеджер із розширеними можливостями. Бінарні файли включено! 😉
  vi: Trình quản lý SSH dòng lệnh dễ dùng với các tính năng nâng cao. Có sẵn tệp nhị phân! 😉
x:
  source: https://github.com/grafviktor/goto
  eget: grafviktor/goto
rule:
  /eget:
    cmd: x eget grafviktor/goto
    reference: https://github.com/grafviktor/goto
binlist:
- 'goto'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
