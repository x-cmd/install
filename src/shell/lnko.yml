lang: 'Lua'
homepage: 'https://github.com/luanvil/lnko'
license: 'GPL-3.0'
desc:
  cn: 简洁的 stow 风格 dotfile 链接器
  en: 'Simple stow-like dotfile linker'
x:
  source: https://github.com/luanvil/lnko
  eget: https://github.com/luanvil/lnko
rule:
  /eget:
    cmd: x eget luanvil/lnko
    reference: https://github.com/luanvil/lnko
binlist:
  - 'lnko'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
