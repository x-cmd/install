lang: 'Lua'
homepage: 'https://github.com/luanvil/lnko'
license: 'GPL-3.0'
desc:
  cn: 简洁的 stow 风格 dotfile 链接器
  en: 'Simple stow-like dotfile linker'
x:
  source: https://github.com/luanvil/lnko
  eget: https://github.com/luanvil/lnko
rule:
  /eget:
    cmd: x eget luanvil/lnko
    reference: https://github.com/luanvil/lnko
binlist:
- 'lnko'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 363 KB
          rating: 1
          desc:
            cn: 安装 363 KB
            en: 363 KB install
        download:
          estimate: 363 KB
          desc:
            cn: 约 363 KB 下载 (linux/x64)
            en: ~363 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
