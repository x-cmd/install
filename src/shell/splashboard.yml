lang: 'Rust'
homepage: https://github.com/unhappychoice/splashboard
license: 'ISC'
desc:
  cn: 基于插件式数据源的可定制终端启动屏
  en: 'A customizable terminal splash screen with plugin-based data sources.'
x:
  source: https://github.com/unhappychoice/splashboard
  eget: unhappychoice/splashboard
rule:
  /eget:
    cmd: x eget unhappychoice/splashboard
    reference: https://github.com/unhappychoice/splashboard
binlist:
  - 'splashboard'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.8 MB
          rating: 1
          desc:
            cn: 约 3.8 MB（估算）
            en: ~3.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
