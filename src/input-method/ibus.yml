lang: C
homepage: https://github.com/ibus/ibus
license: LGPL-2.1
desc:
  cn: IBus 是一个 Linux/Unix 操作系统的开源输入框架
  en: IBus is an open source input framework for Linux/Unix OS
  cs: IBus je open source vstupní framework pro operační systémy Linux/Unix
  de: IBus ist ein Open-Source-Eingabe-Framework für Linux/Unix-Betriebssysteme
  es: IBus es un framework de entrada de código abierto para sistemas operativos Linux/Unix
  fr: IBus est un framework de saisie open source pour les systèmes d'exploitation Linux/Unix
  id: IBus adalah framework input sumber terbuka untuk sistem operasi Linux/Unix
  it: IBus è un framework di input open source per i sistemi operativi Linux/Unix
  ja: IBus は Linux/Unix 向けのオープンソース入力フレームワークです
  ko: IBus는 Linux/Unix 운영 체제용 오픈 소스 입력 프레임워크입니다
  pl: IBus to otwartoźródłowa ramka wprowadzania tekstu dla systemów Linux/Unix
  pt: O IBus é um framework de entrada de código aberto para sistemas operacionais Linux/Unix
  ro: IBus este un cadru de introducere open source pentru sistemele de operare Linux/Unix
  ru: IBus — фреймворк ввода с открытым исходным кодом для операционных систем Linux/Unix
  th: IBus คือเฟรมเวิร์กการป้อนข้อมูลโอเพนซอร์สสำหรับระบบปฏิบัติการ Linux/Unix
  tr: IBus, Linux/Unix işletim sistemleri için açık kaynaklı bir giriş çerçevesidir
  uk: IBus — фреймворк введення з відкритим кодом для операційних систем Linux/Unix
  vi: IBus là khung nhập mã nguồn mở cho hệ điều hành Linux/Unix
x:
  source: https://github.com/ibus/ibus
  eget: ibus/ibus
  apt: ibus-gtk
  dnf: ibus
  pacman: ibus
  apt-get: ibus-gtk
  zypper: ibus-libpinyin
  emerge: ibus-pinyin
rule:
  /eget:
    cmd: x eget ibus/ibus
    reference: https://x-cmd.com/mod/eget
  fedora/dnf:
    cmd: sudo dnf install ibus\*
    reference: https://github.com/ibus/ibus/wiki/ReadMe#fedora-22-and-later
  ubuntu/apt:
    cmd: 'sudo apt-get install ibus-gtk ibus-qt4 ibus-pinyin \

      && im-switch -s ibus

      '
    reference: https://github.com/ibus/ibus/wiki/ReadMe#ubuntu
  gentoo/emerge:
    cmd: sudo emerge -av ibus-pinyin
    reference: https://github.com/ibus/ibus/wiki/ReadMe#gentoo
  arch/pacman:
    cmd: sudo pacman -S ibus
    reference: https://github.com/ibus/ibus/wiki/ReadMe#arch-linux
  opensuse/zypper:
    cmd: sudo zypper in ibus-libpinyin ibus-gtk3 ibus-gtk ibus-qt
    reference: https://github.com/ibus/ibus/wiki/ReadMe#opensuse-131-or-later
binlist:
- ibus

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4.5 MB
          rating: 1
          desc:
            cn: 约 4.5 MB（估算）
            en: ~4.5 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
