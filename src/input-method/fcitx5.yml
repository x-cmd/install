lang: C++
homepage: https://github.com/fcitx/fcitx5
desc:
  cn: 小企鹅输入法是一个支持扩展的输入法框架
  en: Fcitx is an input method framework with extension support
x:
  source: https://github.com/fcitx/fcitx5
  apt: fcitx5
  dnf: fcitx5
  pacman: fcitx5
rule:
  centos/yum:
    cmd: sudo yum install fcitx5
    reference: https://fcitx-im.org/wiki/Install_Fcitx_5#Install_Fcitx_5_from_Linux_distribution
  fedora/dnf:
    cmd: sudo dnf install fcitx5
    reference: https://fcitx-im.org/wiki/Install_Fcitx_5#Install_Fcitx_5_from_Linux_distribution
    dsnap: fcitx5
  arch/pacman:
    cmd: sudo pacman -S fcitx5
    reference: https://fcitx-im.org/wiki/Install_Fcitx_5#Install_Fcitx_5_from_Linux_distribution
  opensuse/zypper:
    cmd: sudo zypper install fcitx5
    reference: https://fcitx-im.org/wiki/Install_Fcitx_5#Install_Fcitx_5_from_Linux_distribution
  debian/apt:
    cmd: sudo apt-get install fcitx5
    reference: https://command-not-found.com/fcitx5
    dsnap: fcitx5
  ubuntu/apt:
    cmd: sudo apt-get install fcitx5
    reference: https://command-not-found.com/fcitx5
    dsnap: fcitx5
  kali/apt:
    cmd: sudo apt-get install fcitx5
    reference: https://command-not-found.com/fcitx5
    dsnap: fcitx5
  /flatpak:
    cmd: sudo flatpak install org.fcitx.Fcitx5
    reference: https://fcitx-im.org/wiki/Install_Fcitx_5#Install_Fcitx_5_from_Flatpak
binlist:
- fcitx5
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3.9 MB
          rating: 1
          desc:
            cn: 约 3.9 MB（估算）
            en: ~3.9 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
