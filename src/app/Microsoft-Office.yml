lang: C++
homepage: https://www.office.com/
desc:
  en: Microsoft Office is a Office automation of Microsoft's Windows-based operating system
  cn: Microsoft Office 是微软公司开发的一套基于 Windows 操作系统的办公软件套装
  cs: Microsoft Office je sada kancelářských aplikací pro operační systém Windows od Microsoftu
  de: Microsoft Office ist eine Bürosoftware-Suite für das Windows-Betriebssystem von Microsoft
  es: Microsoft Office es un conjunto de aplicaciones de oficina para el sistema operativo Windows de Microsoft
  fr: Microsoft Office est une suite bureautique pour le système d'exploitation Windows de Microsoft
  id: Microsoft Office adalah rangkaian aplikasi perkantoran untuk sistem operasi Windows milik Microsoft
  it: Microsoft Office è una suite di applicazioni per ufficio per il sistema operativo Windows di Microsoft
  ja: Microsoft Office は Microsoft の Windows OS 向けのオフィスソフトウェアスイートです
  ko: Microsoft Office는 Microsoft의 Windows 운영 체제용 오피스 소프트웨어 묶음입니다
  pl: Microsoft Office to zestaw aplikacji biurowych dla systemu operacyjnego Windows firmy Microsoft
  pt: O Microsoft Office é um conjunto de aplicativos de escritório para o sistema operacional Windows da Microsoft
  ro: Microsoft Office este o suită de aplicații de birou pentru sistemul de operare Windows al Microsoft
  ru: Microsoft Office — набор офисных приложений для операционной системы Windows от Microsoft
  th: Microsoft Office คือชุดโปรแกรมสำนักงานสำหรับระบบปฏิบัติการ Windows ของ Microsoft
  tr: Microsoft Office, Microsoft'un Windows işletim sistemi için bir ofis yazılımı paketidir
  uk: Microsoft Office — набір офісних застосунків для операційної системи Windows від Microsoft
  vi: Microsoft Office là bộ ứng dụng văn phòng cho hệ điều hành Windows của Microsoft
rule:
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/wpsoffice
    reference: https://scoop.sh/#/apps?q=wps
  (win|wsl2)/choco:
    cmd: x choco install wps-office-free
    reference: https://community.chocolatey.org/packages/wps-office-free
  (win|wsl2)/winget:
    cmd: x winget install Kingsoft.WPSOffice
    reference: https://winget.run/pkg/Kingsoft/WPSOffice
  darwin/brew:
    cmd: brew install --cask microsoft-office
    reference: https://formulae.brew.sh/cask/microsoft-office#default

x:
  scoop: extras/wpsoffice
  choco: wps-office-free
  winget: Kingsoft.WPSOffice
binlist:
- Microsoft-Office
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
