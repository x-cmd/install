lang: JavaScript
homepage: https://www.google.com/chrome/
desc:
  en: Google Chrome is a web browser developed by Google Inc
  cn: Google Chrome 是一款由 Google 公司开发的网页浏览器
  cs: Google Chrome je webový prohlížeč vyvinutý společností Google Inc
  de: Google Chrome ist ein Webbrowser, entwickelt von Google Inc
  es: Google Chrome es un navegador web desarrollado por Google Inc
  fr: Google Chrome est un navigateur web développé par Google Inc
  id: Google Chrome adalah peramban web yang dikembangkan oleh Google Inc
  it: Google Chrome è un browser web sviluppato da Google Inc
  ja: Google Chrome は Google Inc が開発したウェブブラウザです
  ko: Google Chrome는 Google Inc에서 개발한 웹 브라우저입니다
  pl: Google Chrome to przeglądarka internetowa opracowana przez Google Inc
  pt: O Google Chrome é um navegador web desenvolvido pela Google Inc
  ro: Google Chrome este un browser web dezvoltat de Google Inc
  ru: Google Chrome — веб-браузер, разработанный компанией Google Inc
  th: Google Chrome คือเว็บเบราว์เซอร์ที่พัฒนาโดย Google Inc
  tr: Google Chrome, Google Inc tarafından geliştirilen bir web tarayıcısıdır
  uk: Google Chrome — веб-браузер, розроблений компанією Google Inc
  vi: Google Chrome là trình duyệt web do Google Inc phát triển
rule:
  (win|wsl2)/scoop:
    cmd: x scoop install googlechrome
    reference: https://scoop.sh/#/apps?q=Google+Chrome
  (win|wsl2)/choco:
    cmd: x choco install googlechrome
    reference: https://community.chocolatey.org/packages/GoogleChrome
  (win|wsl2)/winget:
    cmd: x winget install Google.Chrome
    reference: https://winget.run/pkg/Google/Chrome
  darwin/brew:
    cmd: brew install --cask google-chrome
    reference: https://formulae.brew.sh/cask/google-chrome#default
  /flatpak:
    cmd: sudo flatpak install flathub com.google.Chrome
    reference: https://flathub.org/apps/com.google.Chrome
  ubuntu/wget:
    cmd: 'wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && \

      sudo dpkg -i google-chrome-stable_current_amd64.deb

      '
    reference: https://linuxtldr.com/installing-google-chrome/
  debian/wget:
    cmd: 'wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && \

      sudo dpkg -i google-chrome-stable_current_amd64.deb

      '
    reference: https://linuxtldr.com/installing-google-chrome/
  /yay:
    cmd: yay -S google-chrome
    reference: https://linuxtldr.com/installing-google-chrome/
  fedora/dnf:
    cmd: sudo dnf install google-chrome-stable
    reference: https://linuxtldr.com/installing-google-chrome/

x:
  dnf: google-chrome-stable
  scoop: googlechrome
  choco: googlechrome
  winget: Google.Chrome
  flatpak: flathub
  yay: google-chrome
binlist:
- Chrome
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
