lang: Go
homepage: https://github.com/obsproject/obs-studio
license: GPL-2.0
desc:
  cn: 免费和开源的视频录制和现场流媒体软件
  en: Free and open source software for video recording and live streaming
x:
  source: https://github.com/obsproject/obs-studio
  eget: https://github.com/obsproject/obs-studio
  apt: obs-studio
  brew: --cask
  pacman: obs-studio
  apt-get: obs-studio
  scoop: extras/obs-studio
  choco: obs-studio
  winget: OBSProject.OBSStudio
  flatpak: flathub
  yay: obs-studio
rule:
  /eget:
    cmd: x eget obsproject/obs-studio
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install --cask obs
    reference: https://formulae.brew.sh/cask/obs#default
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras && x scoop install extras/obs-studio

      '
    reference: https://scoop.sh/#/apps?q=obs
  (win|wsl2)/choco:
    cmd: x choco install obs-studio
    reference: https://community.chocolatey.org/packages/obs-studio
  (win|wsl2)/winget:
    cmd: x winget install OBSProject.OBSStudio
    reference: https://winget.run/pkg/OBSProject/OBSStudio
  debian/apt:
    cmd: sudo apt-get install obs-studio
    reference: https://command-not-found.com/obs
  ubuntu/apt:
    cmd: sudo apt-get install obs-studio
    reference: https://command-not-found.com/obs
  arch/pacman:
    cmd: sudo pacman -S obs-studio
    reference: https://command-not-found.com/obs
  manjaro/pacman:
    cmd: sudo pacman -S obs-studio
    reference: https://command-not-found.com/obs
  kali/apt:
    cmd: sudo apt-get install obs-studio
    reference: https://command-not-found.com/obs
  /flatpak:
    cmd: sudo flatpak install flathub com.obsproject.Studio
    reference: https://flathub.org/apps/com.obsproject.Studio
  arch/yay:
    cmd: yay -S obs-studio
    reference: https://aur.archlinux.org/packages/obs-studio
binlist:
- OBS-Studio

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 431 MB
          rating: 4
          desc:
            cn: 安装 431 MB
            en: 431 MB install
        download:
          estimate: 431 MB
          desc:
            cn: 约 431 MB 下载 (linux/x64)
            en: ~431 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
