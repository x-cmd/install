lang: Rust
homepage: https://github.com/messense/aliyundrive-webdav
license: MIT
desc:
  en: Alibaba Cloud Disk WebDAV service
  cn: 阿里云盘 WebDAV 服务
x:
  source: https://github.com/messense/aliyundrive-webdav
  eget: https://github.com/messense/aliyundrive-webdav
rule:
  /eget:
    cmd: x eget messense/aliyundrive-webdav
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install aliyundrive-webdav
    reference: https://github.com/messense/aliyundrive-webdav?tab=readme-ov-file#%E5%AE%89%E8%A3%85
  /snap:
    cmd: sudo snap install aliyundrive-webdav
    reference: https://github.com/messense/aliyundrive-webdav?tab=readme-ov-file#%E5%AE%89%E8%A3%85
  (win|wsl2)/scoop:
    cmd: x scoop install main/aliyundrive-webdav
    reference: https://scoop.sh/#/apps?q=aliyun
  arch/yay:
    cmd: yay -S aliyundrive-webdav
    reference: https://aur.archlinux.org/packages/aliyundrive-webdav
binlist:
- aliyundrive-webdav

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
