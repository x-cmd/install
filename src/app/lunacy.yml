lang: application
homepage: https://github.com/icons8/lunacy
desc:
  cn: 免费的设计软件，通过人工智能工具和内置图形让您顺顺利利。
  en: Free design software that keeps your flow with AI tools and built-in graphics
  cs: Bezplatný designérský software, který udržuje vaše tempo díky nástrojům AI a vestavěné grafice
  de: Kostenlose Designsoftware, die Ihren Flow mit KI-Werkzeugen und integrierter Grafik am Laufen hält
  es: Software de diseño gratuito que mantiene tu ritmo con herramientas de IA y gráficos integrados
  fr: Un logiciel de design gratuit qui fluidifie votre travail grâce aux outils d'IA et aux graphismes intégrés
  id: Perangkat lunak desain gratis yang menjaga alur kerja Anda dengan alat AI dan grafis bawaan
  it: Software di design gratuito che mantiene il tuo flusso con strumenti AI e grafica integrata
  ja: AIツールと内蔵グラフィックで作業の流れを保つ無料のデザインソフトウェア
  ko: AI 도구와 내장 그래픽으로 작업 흐름을 유지하는 무료 디자인 소프트웨어
  pl: Bezpłatne oprogramowanie do projektowania, które dzięki narzędziom AI i wbudowanej grafice utrzymuje Twój rytm
  pt: Software de design gratuito que mantém seu ritmo com ferramentas de IA e gráficos integrados
  ro: Software de design gratuit care vă menține ritmul cu ajutorul unor instrumente AI și grafici integrate
  ru: Бесплатное дизайнерское ПО, которое помогает сохранять темп работы с помощью ИИ-инструментов и встроенной графики
  th: ซอฟต์แวร์ออกแบบฟรีที่ช่วยให้คุณทำงานได้ลื่นไหลด้วยเครื่องมือ AI และกราฟิกในตัว
  tr: Yapay zeka araçları ve yerleşik grafiklerle akışınızı koruyan ücretsiz tasarım yazılımı
  uk: Безкоштовний дизайнерський ПЗ, що допомагає тримати темп роботи завдяки ІІ-інструментам і вбудованій графіці
  vi: Phần mềm thiết kế miễn phí giúp bạn duy trì nhịp độ với các công cụ AI và đồ họa tích hợp
x:
  source: https://github.com/icons8/lunacy
  snap: lunacy
  scoop: extras/lunacy
  choco: lunacy
  winget: Icons8.Lunacy
  flatpak: flathub
rule:
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/lunacy
    reference: https://scoop.sh/#/apps?q=lunacy&id=57c626b6cf49a0e5d0c03c9e17acc46be00cecb6
  (win|wsl2)/choco:
    cmd: x choco install lunacy
    reference: https://community.chocolatey.org/packages/7zip
  (win|wsl2)/winget:
    cmd: x winget install Icons8.Lunacy
    reference: https://community.chocolatey.org/packages/lunacy
  darwin/brew:
    cmd: brew install --cask lunacy
    reference: https://formulae.brew.sh/cask/lunacy#default
  /flatpak:
    cmd: sudo flatpak install flathub com.icons8.Lunacy
    reference: https://flathub.org/apps/com.icons8.Lunacy
  arch/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/arch
  centos/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/centos
  debian/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/debian
  elementary/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/elementary
  fedora/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/fedora
  neon/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/kde-neon
  kubuntu/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/kubuntu
  manjaro/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/manjaro
  pop/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/pop
  opensuse/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/opensuse
  rhel/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/rhel
  ubuntu/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/ubuntu
binlist:
- lunacy
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: partial
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
