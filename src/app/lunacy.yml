lang: application
homepage: https://github.com/icons8/lunacy
desc:
  cn: 免费的设计软件，通过人工智能工具和内置图形让您顺顺利利。
  en: Free design software that keeps your flow with AI tools and built-in graphics
x:
  source: https://github.com/icons8/lunacy
  brew: --cask
  snap: lunacy
  scoop: extras/lunacy
  choco: lunacy
  winget: Icons8.Lunacy
  flatpak: flathub
rule:
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/lunacy
    reference: https://scoop.sh/#/apps?q=lunacy&id=57c626b6cf49a0e5d0c03c9e17acc46be00cecb6
  (win|wsl2)/choco:
    cmd: x choco install lunacy
    reference: https://community.chocolatey.org/packages/7zip
  (win|wsl2)/winget:
    cmd: x winget install Icons8.Lunacy
    reference: https://community.chocolatey.org/packages/lunacy
  darwin/brew:
    cmd: brew install --cask lunacy
    reference: https://formulae.brew.sh/cask/lunacy#default
  /flatpak:
    cmd: sudo flatpak install flathub com.icons8.Lunacy
    reference: https://flathub.org/apps/com.icons8.Lunacy
  arch/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/arch
  centos/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/centos
  debian/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/debian
  elementary/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/elementary
  fedora/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/fedora
  neon/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/kde-neon
  kubuntu/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/kubuntu
  manjaro/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/manjaro
  pop/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/pop
  opensuse/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/opensuse
  rhel/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/rhel
  ubuntu/snap:
    cmd: sudo snap install lunacy
    reference: https://snapcraft.io/install/lunacy/ubuntu
binlist:
- lunacy
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
