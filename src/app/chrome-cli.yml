lang: Objective-C
homepage: https://github.com/prasmussen/chrome-cli
license: MIT
desc:
  en: Control Google Chrome from the command-line
  cn: 从命令行控制 Google Chrome
  cs: Ovládejte Google Chrome z příkazové řádky
  de: Google Chrome über die Kommandozeile steuern
  es: Controla Google Chrome desde la línea de comandos
  fr: Contrôlez Google Chrome depuis la ligne de commande
  id: Kontrol Google Chrome dari baris perintah
  it: Controlla Google Chrome dalla riga di comando
  ja: コマンドラインから Google Chrome を制御する
  ko: 명령줄에서 Google Chrome 제어하기
  pl: Steruj Google Chrome z wiersza poleceń
  pt: Controle o Google Chrome pela linha de comando
  ro: Controlați Google Chrome din linia de comandă
  ru: Управляйте Google Chrome из командной строки
  th: ควบคุม Google Chrome จากบรรทัดคำสั่ง
  tr: Google Chrome'u komut satırından kontrol edin
  uk: Керуйте Google Chrome з командного рядка
  vi: Điều khiển Google Chrome từ dòng lệnh
x:
  source: https://github.com/prasmussen/chrome-cli
  brew: chrome-cli
rule:
  darwin/brew:
    cmd: brew install chrome-cli
    reference: https://formulae.brew.sh/formula/chrome-cli#default
binlist:
- chrome-cli

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 22 KB
          rating: 1
          desc:
            cn: 约 22 KB（估算）
            en: ~22 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
