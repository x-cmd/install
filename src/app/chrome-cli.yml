lang: Objective-C
homepage: https://github.com/prasmussen/chrome-cli
license: MIT
desc:
  en: Control Google Chrome from the command-line
  cn: 从命令行控制 Google Chrome
x:
  source: https://github.com/prasmussen/chrome-cli
rule:
  darwin/brew:
    cmd: brew install chrome-cli
    reference: https://formulae.brew.sh/formula/chrome-cli#default
binlist:
- chrome-cli

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
