lang: 'null'
homepage: https://github.com/Leonidas-from-XIV/node-xml2js
license: MIT
desc:
  cn: 剪映专业版,全能易用的视频编辑工具
  en: CapCut,Versatile and easy-to-use video editing tool
x:
  source: https://github.com/Leonidas-from-XIV/node-xml2js
rule:
  (win|wsl2)/winget:
    cmd: x winget install ByteDance.JianyingPro
    reference: https://winget.run/pkg/ByteDance/JianyingPro
binlist:
- CapCut

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
