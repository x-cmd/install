lang: 'null'
homepage: https://github.com/Leonidas-from-XIV/node-xml2js
license: MIT
desc:
  cn: 剪映专业版,全能易用的视频编辑工具
  en: CapCut,Versatile and easy-to-use video editing tool
x:
  source: https://github.com/Leonidas-from-XIV/node-xml2js
rule:
  (win|wsl2)/winget:
    cmd: x winget install ByteDance.JianyingPro
    reference: https://winget.run/pkg/ByteDance/JianyingPro
binlist:
- CapCut

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
