lang: Rust
homepage: https://github.com/FedericoBruzzone/tgt
license: Apache-2.0
desc:
  en: A terminal user interface for Telegram
  cn: Telegram 的终端用户界面
x:
  source: https://github.com/FedericoBruzzone/tgt
  eget: https://github.com/FedericoBruzzone/tgt
rule:
  /eget:
    cmd: x eget FedericoBruzzone/tgt
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install tgt
    reference: https://github.com/FedericoBruzzone/tgt?tab=readme-ov-file#usage
    dsnap: tgt
binlist:
- tgt

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 19 MB
          rating: 2
          desc:
            cn: 安装 19 MB
            en: 19 MB install
        download:
          estimate: 19 MB
          desc:
            cn: 约 19 MB 下载 (linux/x64)
            en: ~19 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
