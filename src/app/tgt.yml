lang: Rust
homepage: https://github.com/FedericoBruzzone/tgt
license: Apache-2.0
desc:
  en: A terminal user interface for Telegram
  cn: Telegram 的终端用户界面
x:
  source: https://github.com/FedericoBruzzone/tgt
  eget: https://github.com/FedericoBruzzone/tgt
rule:
  /eget:
    cmd: x eget FedericoBruzzone/tgt
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install tgt
    reference: https://github.com/FedericoBruzzone/tgt?tab=readme-ov-file#usage
    dsnap: tgt
binlist:
- tgt

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 821 KB
          rating: 1
          desc:
            cn: 约 821 KB（估算）
            en: ~821 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
