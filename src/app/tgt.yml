lang: Rust
homepage: https://github.com/FedericoBruzzone/tgt
license: Apache-2.0
desc:
  en: A terminal user interface for Telegram
  cn: Telegram 的终端用户界面
  cs: Uživatelské rozhraní terminálu pro Telegram
  de: Eine Terminal-Benutzeroberfläche für Telegram
  es: Una interfaz de usuario de terminal para Telegram
  fr: Une interface utilisateur en terminal pour Telegram
  id: Antarmuka pengguna terminal untuk Telegram
  it: Un'interfaccia utente a terminale per Telegram
  ja: Telegram のターミナルユーザーインターフェース
  ko: Telegram용 터미널 사용자 인터페이스
  pl: Terminalowy interfejs użytkownika dla Telegrama
  pt: Uma interface de usuário de terminal para o Telegram
  ro: O interfață de utilizator în terminal pentru Telegram
  ru: Терминальный пользовательский интерфейс для Telegram
  th: ส่วนติดต่อผู้ใช้แบบเทอร์มินัลสำหรับ Telegram
  tr: Telegram için terminal kullanıcı arayüzü
  uk: Термінальний користувацький інтерфейс для Telegram
  vi: Giao diện người dùng dạng terminal cho Telegram
x:
  source: https://github.com/FedericoBruzzone/tgt
  eget: FedericoBruzzone/tgt
  cargo: tgt
rule:
  /eget:
    cmd: x eget FedericoBruzzone/tgt
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install tgt
    reference: https://github.com/FedericoBruzzone/tgt?tab=readme-ov-file#usage
    dsnap: tgt
binlist:
- tgt

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 19 MB
          rating: 2
          desc:
            cn: 安装 19 MB
            en: 19 MB install
        download:
          estimate: 19 MB
          desc:
            cn: 约 19 MB 下载 (linux/x64)
            en: ~19 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
