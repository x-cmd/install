lang: C#
homepage: https://github.com/microsoft/PowerToys
license: MIT
desc:
  en: Microsoft PowerToys is a set of utilities for power users to tune and streamline their Windows experience for greater productivity
  cn: MicrosoftPowerToys 是一组工具，供高级用户优化和简化 Windows 体验，以提高生产力
  cs: Microsoft PowerToys je sada nástrojů pro pokročilé uživatele, kteří chtějí vyladit a zjednodušit své používání Windows pro větší produktivitu
  de: Microsoft PowerToys ist eine Sammlung von Dienstprogrammen für Power-User, mit denen sie ihre Windows-Erfahrung für mehr Produktivität anpassen und straffen können
  es: Microsoft PowerToys es un conjunto de utilidades para usuarios avanzados que les permite ajustar y simplificar su experiencia con Windows para ser más productivos
  fr: Microsoft PowerToys est un ensemble d'utilitaires destiné aux utilisateurs avancés, pour ajuster et simplifier leur expérience Windows et gagner en productivité
  id: Microsoft PowerToys adalah kumpulan utilitas bagi pengguna mahir untuk menyesuaikan dan menyederhanakan pengalaman Windows mereka demi produktivitas lebih tinggi
  it: Microsoft PowerToys è un insieme di utilità per utenti esperti che permette di ottimizzare e semplificare l'esperienza con Windows per una maggiore produttività
  ja: Microsoft PowerToys は、ユーザーの生産性を高めるために Windows の体験をカスタマイズし、簡易化するユーティリティの集まりです
  ko: Microsoft PowerToys는 고급 사용자가 Windows 경험을 조정하고 간소화하여 생산성을 높일 수 있도록 하는 유틸리티 모음입니다
  pl: Microsoft PowerToys to zestaw narzędzi dla zaawansowanych użytkowników, pozwalający dostosować i uprościć korzystanie z Windows w celu zwiększenia produktywności
  pt: O Microsoft PowerToys é um conjunto de utilitários para usuários avançados ajustarem e simplificarem sua experiência no Windows para maior produtividade
  ro: Microsoft PowerToys este o mulțime de utilitare pentru utilizatori avansați, pentru a regla și a simplifica experiența cu Windows în vederea unei productivități mai mari
  ru: Microsoft PowerToys — набор утилит для опытных пользователей, позволяющий настроить и упростить работу в Windows для повышения продуктивности
  th: Microsoft PowerToys คือชุดเครื่องมือสำหรับผู้ใช้ขั้นสูง เพื่อปรับแต่งและทำให้ประสบการณ์การใช้ Windows ลื่นไหลขึ้นและเพิ่มประสิทธิภาพ
  tr: Microsoft PowerToys, ileri düzey kullanıcıların daha yüksek üretkenlik için Windows deneyimlerini ayarlamalarını ve sadeleştirmelerini sağlayan bir araç kümesidir
  uk: Microsoft PowerToys — набір утиліт для досвідчених користувачів, щоб налаштувати та спростити роботу в Windows для підвищення продуктивності
  vi: Microsoft PowerToys là bộ tiện ích dành cho người dùng nâng cao, giúp tinh chỉnh và đơn giản hóa trải nghiệm Windows để tăng năng suất
x:
  source: https://github.com/microsoft/PowerToys
  eget: microsoft/PowerToys
  scoop: powertoys
  choco: powertoys
  winget: Microsoft.PowerToys
rule:
  /eget:
    cmd: x eget microsoft/PowerToys
    reference: https://x-cmd.com/mod/eget
  (win|wsl2)/scoop:
    cmd: x scoop install powertoys
    reference: https://scoop.sh/#/apps?q=powertoys
  (win|wsl2)/choco:
    cmd: x choco install powertoys
    reference: https://community.chocolatey.org/packages/powertoys
  (win|wsl2)/winget:
    cmd: x winget install Microsoft.PowerToys -s winget
    reference: https://github.com/microsoft/PowerToys?tab=readme-ov-file#via-winget
binlist:
- PowerToys

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 56 MB
          rating: 3
          desc:
            cn: 约 56 MB（估算）
            en: ~56 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
