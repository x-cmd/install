lang: C
homepage: https://github.com/kenorb-contrib/tg
license: GPL-2.0
desc:
  en: Command-line interface for Telegram
  cn: Telegram 的命令行界面
x:
  source: https://github.com/kenorb-contrib/tg
rule:
  /apt:
    cmd: 'sudo apt-get install libreadline-dev libconfig-dev libssl-dev lua5.2 liblua5.2-dev libevent-dev libjansson-dev libpython-dev libpython3-dev libgcrypt-dev zlib1g-dev lua-lgi make \

      && ./configure \

      && make

      '
    reference: https://github.com/kenorb-contrib/tg?tab=readme-ov-file#linux-and-bsds
  gentoo/emerge:
    cmd: 'sudo emerge -av sys-libs/readline dev-libs/libconfig dev-libs/openssl dev-lang/lua dev-libs/libevent dev-libs/jansson dev-lang/python \

      && ./configure \

      && make

      '
    reference: https://github.com/kenorb-contrib/tg?tab=readme-ov-file#linux-and-bsds
  darwin/brew:
    cmd: 'brew tap ivoputzer/tg && brew install tg

      '
    reference: https://github.com/kenorb-contrib/tg?tab=readme-ov-file#mac-os-x
  arch/yay:
    cmd: 'sudo yay -S telegram-cli-git \

      && ./configure \

      && make

      '
    reference: https://github.com/kenorb-contrib/tg?tab=readme-ov-file#linux-and-bsds
  centos/yum:
    cmd: 'sudo yum install lua-devel openssl-devel libconfig-devel readline-devel libevent-devel jansson-devel python-devel \

      && ./configure \

      && make

      '
    reference: https://github.com/kenorb-contrib/tg?tab=readme-ov-file#linux-and-bsds
  fedora/dnf:
    cmd: 'sudo dnf install lua-devel openssl-devel libconfig-devel readline-devel libevent-devel jansson-devel python-devel libgcrypt-devel \

      && ./configure \

      && make

      '
    reference: https://github.com/kenorb-contrib/tg?tab=readme-ov-file#linux-and-bsds
  freebsd/pkg:
    cmd: sudo pkg install telegram-cli
    reference: https://github.com/kenorb-contrib/tg?tab=readme-ov-file#linux-and-bsds
  openbsd/pkg_add:
    cmd: sudo pkg_add libconfig libexecinfo lua python
    reference: https://github.com/kenorb-contrib/tg?tab=readme-ov-file#linux-and-bsds
  opensuse/zypper:
    cmd: 'sudo zypper in lua-devel libconfig-devel readline-devel libevent-devel libjansson-devel python-devel libopenssl-devel \

      && ./configure \

      && make

      '
    reference: https://github.com/kenorb-contrib/tg?tab=readme-ov-file#linux-and-bsds
binlist:
- telegram-cli
