lang: C++
homepage: https://learn.microsoft.com/en-US/cpp/windows/latest-supported-vc-redist?view=msvc-170
desc:
  cn: Visual C++ Redistributable 安装 Microsoft C 和 C++ （MSVC） 运行时库
  en: The Visual C++ Redistributable installs Microsoft C and C++ (MSVC) runtime libraries
  cs: Visual C++ Redistributable instaluje běhové knihovny Microsoft C a C++ (MSVC)
  de: Visual C++ Redistributable installiert die Laufzeitbibliotheken von Microsoft C und C++ (MSVC)
  es: Visual C++ Redistributable instala las bibliotecas de tiempo de ejecución de Microsoft C y C++ (MSVC)
  fr: Visual C++ Redistributable installe les bibliothèques d'exécution Microsoft C et C++ (MSVC)
  id: Visual C++ Redistributable memasang pustaka runtime Microsoft C dan C++ (MSVC)
  it: Visual C++ Redistributable installa le librerie di runtime Microsoft C e C++ (MSVC)
  ja: Visual C++ Redistributable は Microsoft C および C++ (MSVC) のランタイムライブラリをインストールします
  ko: Visual C++ Redistributable은 Microsoft C 및 C++ (MSVC) 런타임 라이브러리를 설치합니다
  pl: Visual C++ Redistributable instaluje biblioteki uruchomieniowe Microsoft C i C++ (MSVC)
  pt: O Visual C++ Redistributable instala as bibliotecas de tempo de execução do Microsoft C e C++ (MSVC)
  ro: Visual C++ Redistributable instalează bibliotecile de runtime Microsoft C și C++ (MSVC)
  ru: Visual C++ Redistributable устанавливает библиотеки среды выполнения Microsoft C и C++ (MSVC)
  th: Visual C++ Redistributable ติดตั้งไลบรารีรันไทม์ของ Microsoft C และ C++ (MSVC)
  tr: Visual C++ Redistributable, Microsoft C ve C++ (MSVC) çalışma zamanı kitaplıklarını kurar
  uk: Visual C++ Redistributable встановлює бібліотеки середовища виконання Microsoft C і C++ (MSVC)
  vi: Visual C++ Redistributable cài đặt các thư viện runtime Microsoft C và C++ (MSVC)
rule:
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras && x scoop install extras/vcredist2022

      '
    reference: https://scoop.sh/#/apps?q=Visual+Studio+2022
  (win|wsl2)/choco:
    cmd: x choco install vcredist140
    reference: https://community.chocolatey.org/packages/vcredist140
  (win|wsl2)/winget:
    cmd: x winget install Microsoft.VCRedist.2015+.x64
    reference: https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist?view=msvc-170#visual-studio-2015-2017-2019-and-2022

x:
  scoop: extras/vcredist2022
  choco: vcredist140
  winget: Microsoft.VCRedist.2015+.x64
binlist:
- vc-redist
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
