lang: C++
homepage: https://github.com/qt-creator/qt-creator
desc:
  cn: Qt Creator 是一个跨平台的集成开发环境（IDE），供应用程序开发人员为多个桌面、嵌入式和移动设备平台创建应用程序
  en: Qt Creator is a cross-platform, integrated development environment (IDE) for application developers to create applications for multiple desktop, embedded, and mobile device platforms
x:
  source: https://github.com/qt-creator/qt-creator
  eget: https://github.com/qt-creator/qt-creator
rule:
  /eget:
    cmd: x eget qt-creator/qt-creator
    reference: https://x-cmd.com/mod/eget
  (win|wsl2)/choco:
    cmd: x choco install qtcreator
    reference: https://doc.qt.io/qtcreator/creator-how-to-install.html#using-package-managers
  darwin/brew:
    cmd: brew install --cask qt-creator
    reference: https://doc.qt.io/qtcreator/creator-how-to-install.html#using-package-managers
  debian/apt:
    cmd: sudo apt-get install qtcreator
    reference: https://command-not-found.com/qtcreator
  ubuntu/apt:
    cmd: sudo apt-get install qtcreator
    reference: https://command-not-found.com/qtcreator
  arch/pacman:
    cmd: sudo pacman -S qtcreator
    reference: https://command-not-found.com/qtcreator
  kali/apt:
    cmd: sudo apt-get install qtcreator
    reference: https://command-not-found.com/qtcreator
  fedora/pacman:
    cmd: sudo dnf install qt-creator
    reference: https://command-not-found.com/qtcreator
  raspbian/apt:
    cmd: sudo apt-get install qtcreator
    reference: https://command-not-found.com/qtcreator
  arch/yay:
    cmd: yay -S qtcreator
    reference: https://aur.archlinux.org/packages/qtcreator
binlist:
- qtcreator
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
