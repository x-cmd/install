lang: Java
homepage: https://github.com/iterate-ch/cyberduck
license: GPL-3.0
desc:
  cn: 一款适用于 macOS 和 Windows 的自由文件传输客户端
  en: A libre file transfer client for macOS and Windows.
x:
  source: https://github.com/iterate-ch/cyberduck
  brew: duck
  port: duck
  choco: duck
  powershell: duck
  yay: duck
rule:
  darwin/brew:
    cmd: brew install duck
    reference: https://docs.duck.sh/cli/
  darwin/port:
    cmd: sudo port install duck
    reference: https://docs.duck.sh/cli/
  (win|wsl2)/choco:
    cmd: choco install duck
    reference: https://docs.duck.sh/cli/
  arch/yay:
    cmd: yay -S duck
    reference: https://aur.archlinux.org/packages/duck
binlist:
- duck

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 约 50 MB（估算）
            en: ~50 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB（估算）
          en: 80 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
