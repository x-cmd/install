lang: C
homepage: https://github.com/raspberrypi/rpi-imager
desc:
  cn: Raspberry Pi Imager 是一种将 Raspberry Pi 操作系统和其他操作系统安装到 microSD 卡上的快速简便方法，可随时与 Raspberry Pi 一起使用
  en: Raspberry Pi Imager is the quick and easy way to install Raspberry Pi OS and other operating systems to a microSD card, ready to use with your Raspberry Pi
x:
  source: https://github.com/raspberrypi/rpi-imager
  eget: https://github.com/raspberrypi/rpi-imager
rule:
  /eget:
    cmd: x eget raspberrypi/rpi-imager
    reference: https://x-cmd.com/mod/eget
  ubuntu/apt:
    cmd: sudo apt install rpi-imager
    reference: https://www.raspberrypi.com/software/
  debian/apt:
    cmd: sudo apt install rpi-imager
    reference: https://www.raspberrypi.com/software/
binlist:
- Raspberry-Pi-Imager
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
