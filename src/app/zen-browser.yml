lang: C++
homepage: https://github.com/zen-browser/desktop
license: MPL-2.0
desc:
  cn: 一款基于 Firefox 引擎的类 Arc 开源浏览器
  en: A Arc-like open-source browser based on the Firefox engine
  cs: Open-source prohlížeč podobný Arc postavený na jádře Firefox
  de: Ein Arc-ähnlicher quelloffener Browser auf Basis der Firefox-Engine
  es: Un navegador de código abierto similar a Arc basado en el motor de Firefox
  fr: Un navigateur open source inspiré d'Arc basé sur le moteur Firefox
  id: Peramban sumber terbuka mirip Arc yang dibangun di atas mesin Firefox
  it: Un browser open source simile ad Arc basato sul motore Firefox
  ja: Firefox エンジンをベースとした Arc 風のオープンソースブラウザ
  ko: Firefox 엔진 기반의 Arc 스타일 오픈 소스 브라우저
  pl: Przeglądarka open source podobna do Arc, oparta na silniku Firefox
  pt: Um navegador de código aberto semelhante ao Arc baseado no motor do Firefox
  ro: Un browser open source asemănător cu Arc, bazat pe motorul Firefox
  ru: Похожий на Arc браузер с открытым исходным кодом на основе движка Firefox
  th: เบราว์เซอร์โอเพนซอร์สคล้าย Arc ที่สร้างบนเอนจิน Firefox
  tr: Firefox motoru üzerine kurulu, Arc benzeri açık kaynaklı tarayıcı
  uk: Браузер з відкритим кодом, схожий на Arc, на основі рушія Firefox
  vi: Trình duyệt mã nguồn mở lấy cảm hứng từ Arc, dựa trên engine Firefox
x:
  source: https://github.com/zen-browser/desktop
  eget: zen-browser/desktop
  flatpak: flathub
  yay: zen-browser-bin
rule:
  /eget:
    cmd: x eget zen-browser/desktop
    reference: https://x-cmd.com/mod/eget
  /flatpak:
    cmd: flatpak install flathub io.github.zen_browser.zen
    reference: https://flathub.org/apps/io.github.zen_browser.zen
  arch/yay:
    cmd: yay -S zen-browser-bin
    reference: https://aur.archlinux.org/packages/zen-browser
binlist:
- zen-browser

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
