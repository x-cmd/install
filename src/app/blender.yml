lang: C++
homepage: https://github.com/blender/blender
desc:
  cn: 免费、开源、跨平台的专业 3D 创作软件
  en: Free, open-source, cross-platform professional 3D creation software.
  cs: Bezplatný, open-source, multiplatformní profesionální software pro tvorbu 3D.
  de: Freie, quelloffene, plattformübergreifende professionelle 3D-Erstellungssoftware.
  es: Software profesional gratuito, de código abierto y multiplataforma para crear contenido 3D.
  fr: Logiciel professionnel gratuit, open source et multiplateforme de création 3D.
  id: Software pembuatan 3D profesional, gratis, sumber terbuka, dan lintas platform.
  it: Software professionale gratuito, open source e multipiattaforma per la creazione 3D.
  ja: 無料でオープンソースのクロスプラットフォームなプロフェッショナル3D制作ソフトウェア。
  ko: 무료 오픈 소스 크로스 플랫폼 프로페셔널 3D 제작 소프트웨어.
  pl: Bezpłatne, open source'owe, wieloplatformowe profesjonalne oprogramowanie do tworzenia grafik 3D.
  pt: Software profissional gratuito, de código aberto e multiplataforma para criação 3D.
  ro: Software profesional gratuit, open source și multiplă platformă pentru creare 3D.
  ru: Бесплатное, открытое, кроссплатформенное профессиональное ПО для 3D-творчества.
  th: ซอฟต์แวร์สร้างสรรค์ 3D ระดับมืออาชีพ ฟรี โอเพนซอร์ส และรองรับหลายแพลตฟอร์ม
  tr: Ücretsiz, açık kaynaklı, çok platformlu profesyonel 3D oluşturma yazılımı.
  uk: Безкоштовне, відкрите, кросплатформене професійне ПЗ для 3D-творчості.
  vi: Phần mềm chuyên nghiệp, miễn phí, mã nguồn mở và đa nền tảng để tạo nội dung 3D.
x:
  source: https://github.com/blender/blender
  snap: blender
  yay: blender-bin
rule:
  darwin/brew:
    cmd: brew install --cask blender
    reference: https://formulae.brew.sh/cask/blender#default
  ubuntu/snap:
    cmd: snap install blender --classic
    reference: https://docs.blender.org/manual/en/latest/getting_started/installing/linux.html
  debian/snap:
    cmd: snap install blender --classic
    reference: https://docs.blender.org/manual/en/latest/getting_started/installing/linux.html
  fedora/snap:
    cmd: snap install blender --classic
    reference: https://docs.blender.org/manual/en/latest/getting_started/installing/linux.html
  arch/yay:
    cmd: yay -S blender-bin
    reference: https://aur.archlinux.org/packages/blender-bin
binlist:
- blender
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 156 MB
          rating: 3
          desc:
            cn: 约 156 MB（估算）
            en: ~156 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 极低
          en: Negligible
