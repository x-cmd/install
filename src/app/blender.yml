lang: C++
homepage: https://github.com/blender/blender
desc:
  cn: 免费、开源、跨平台的专业 3D 创作软件
  en: Free, open-source, cross-platform professional 3D creation software.
x:
  source: https://github.com/blender/blender
rule:
  darwin/brew:
    cmd: brew install --cask blender
    reference: https://formulae.brew.sh/cask/blender#default
  ubuntu/snap:
    cmd: snap install blender --classic
    reference: https://docs.blender.org/manual/en/latest/getting_started/installing/linux.html
  debian/snap:
    cmd: snap install blender --classic
    reference: https://docs.blender.org/manual/en/latest/getting_started/installing/linux.html
  fedora/snap:
    cmd: snap install blender --classic
    reference: https://docs.blender.org/manual/en/latest/getting_started/installing/linux.html
  arch/yay:
    cmd: yay -S blender-bin
    reference: https://aur.archlinux.org/packages/blender-bin
binlist:
- blender
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 156 MB
          rating: 3
          desc:
            cn: 约 156 MB（估算）
            en: ~156 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 极低
          en: Negligible
