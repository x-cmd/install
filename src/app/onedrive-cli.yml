lang: nix & javascript
homepage: https://www.lunesu.com/onedrive-cli/
desc:
  en: Cross-platform command line interface for OneDrive (Personal)
  cn: OneDrive 的跨平台命令行界面(个人)
rule:
  arch/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/arch
  centos/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/centos
  debian/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/debian
  elementary/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/elementary
  fedora/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/fedora
  neon/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/kde-neon
  kubuntu/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/kubuntu
  manjaro/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/manjaro
  pop/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/pop
  opensuse/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/opensuse
  rhel/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/rhel
  ubuntu/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/ubuntu
binlist:
- onedrive-cli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
