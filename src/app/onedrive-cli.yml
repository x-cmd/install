lang: nix & javascript
homepage: https://www.lunesu.com/onedrive-cli/
desc:
  en: Cross-platform command line interface for OneDrive (Personal)
  cn: OneDrive 的跨平台命令行界面(个人)
  cs: Rozhraní příkazové řádky pro OneDrive (osobní) napříč platformami
  de: Plattformübergreifende Kommandozeilenschnittstelle für OneDrive (Persönlich)
  es: Interfaz de línea de comandos multiplataforma para OneDrive (Personal)
  fr: Interface de ligne de commande multiplateforme pour OneDrive (Personnel)
  id: Antarmuka baris perintah lintas platform untuk OneDrive (Personal)
  it: Interfaccia a riga di comando multipiattaforma per OneDrive (Personale)
  ja: OneDrive (個人用) のクロスプラットフォームなコマンドラインインターフェース
  ko: OneDrive(개인용)를 위한 크로스 플랫폼 명령줄 인터페이스
  pl: Wieloplatformowy interfejs wiersza poleceń dla OneDrive (Osobiste)
  pt: Interface de linha de comando multiplataforma para o OneDrive (Pessoal)
  ro: Interfață de linie de comandă multiplă platformă pentru OneDrive (Personal)
  ru: Кроссплатформенный интерфейс командной строки для OneDrive (личный)
  th: อินเทอร์เฟซบรรทัดคำสั่งแบบครอสแพลตฟอร์มสำหรับ OneDrive (ส่วนตัว)
  tr: OneDrive (Kişisel) için çok platformlu komut satırı arayüzü
  uk: Кросплатформенний інтерфейс командного рядка для OneDrive (особистий)
  vi: Giao diện dòng lệnh đa nền tảng cho OneDrive (Cá nhân)
rule:
  arch/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/arch
  centos/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/centos
  debian/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/debian
  elementary/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/elementary
  fedora/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/fedora
  neon/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/kde-neon
  kubuntu/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/kubuntu
  manjaro/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/manjaro
  pop/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/pop
  opensuse/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/opensuse
  rhel/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/rhel
  ubuntu/snap:
    cmd: sudo snap install onedrive-cli
    reference: https://snapcraft.io/install/onedrive-cli/ubuntu

x:
  snap: onedrive-cli
binlist:
- onedrive-cli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
