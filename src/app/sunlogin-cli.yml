lang: Shell
homepage: https://sunlogin.oray.com/
desc:
  cn: 贝锐向日葵远程控制软件，支持移动设备、Windows、Mac、Linux 等系统远程控制。
  en: sunlogin remote control software that supports remote control of mobile devices, Windows, Mac, Linux and other systems.(GUI version)
rule:
  debian/wget:
    cmd: wget https://down.oray.com/sunlogin/linux/sunloginclientshell-10.1.1.28779-amd64.deb
    reference: https://sunlogin.oray.com/download/linux?type=personal
  ubuntu/wget:
    cmd: wget https://down.oray.com/sunlogin/linux/sunloginclientshell-10.1.1.28779-amd64.deb
    reference: https://sunlogin.oray.com/download/linux?type=personal
  centos/wget:
    cmd: wget https://down.oray.com/sunlogin/linux/sunloginclientshell-10.1.1.28779.x86_64.rpm
    reference: https://sunlogin.oray.com/download/linux?type=personal
  arch/yay:
    cmd: yay -S sunloginclient
    reference: https://aur.archlinux.org/packages/sunloginclient
binlist:
- sunlogin-cli
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
