lang: C++
homepage: https://store.steampowered.com/
desc:
  en: Steam is Valve's digital distribution platform for video games
  cn: Steam 是 Valve 公司在推出的电子游戏数字发行平台
rule:
  /flatpak:
    cmd: flatpak install flathub com.valvesoftware.Steam
    reference: https://flathub.org/apps/com.valvesoftware.Steam
  arch/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/arch
  centos/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/centos
  debian/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/debian
  elementary/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/elementary
  fedora/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/fedora
  neon/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/kde-neon
  kubuntu/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/kubuntu
  manjaro/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/manjaro
  pop/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/pop
  opensuse/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/opensuse
  rhel/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/rhel
  ubuntu/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/ubuntu
  kali/snap:
    cmd: sudo snap install steam
    reference: https://snapcraft.io/install/steam/ubuntu
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add games && x scoop install games/steam

      '
    reference: https://scoop.sh/#/apps?q=steam
  (win|wsl2)/choco:
    cmd: x choco install steam
    reference: https://community.chocolatey.org/packages/steam
  (win|wsl2)/winget:
    cmd: x winget install Valve.Steam
    reference: https://winget.run/pkg/Valve/Steam
  darwin/brew:
    cmd: brew install --cask steam
    reference: https://formulae.brew.sh/cask/steam#default
binlist:
- Steam
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
