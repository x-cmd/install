lang: C
homepage: https://github.com/thetumultuousunicornofdarkness/CPU-X
license: GPL-3.0
desc:
  cn: CPU-X 是一个系统分析和监控应用程序(类似于 Windows 中的 CPU-Z) ，但是 CPU-X 是一个为 GNU/Linux 和 FreeBSD 设计的免费开源软件
  en: CPU-X is a system profiling and monitoring application (similar to CPU-Z for Windows), but CPU-X is a Free and Open Source software designed for GNU/Linux and FreeBSD
x:
  source: https://github.com/thetumultuousunicornofdarkness/CPU-X
  eget: https://github.com/thetumultuousunicornofdarkness/CPU-X
rule:
  /eget:
    cmd: x eget thetumultuousunicornofdarkness/CPU-X
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt install cpu-x
    reference: https://github.com/TheTumultuousUnicornOfDarkness/CPU-X?tab=readme-ov-file#from-repositories
  ubuntu/apt:
    cmd: sudo apt install cpu-x
    reference: https://github.com/TheTumultuousUnicornOfDarkness/CPU-X?tab=readme-ov-file#from-repositories
  kali/apt:
    cmd: sudo apt install cpu-x
    reference: https://github.com/TheTumultuousUnicornOfDarkness/CPU-X?tab=readme-ov-file#from-repositories
  mint/apt:
    cmd: sudo apt install cpu-x
    reference: https://github.com/TheTumultuousUnicornOfDarkness/CPU-X?tab=readme-ov-file#from-repositories
  raspbian/apt:
    cmd: sudo apt install cpu-x
    reference: https://github.com/TheTumultuousUnicornOfDarkness/CPU-X?tab=readme-ov-file#from-repositories
  fedora/dnf:
    cmd: sudo dnf install cpu-x
    reference: https://github.com/TheTumultuousUnicornOfDarkness/CPU-X?tab=readme-ov-file#from-repositories
  freebsd/pkg:
    cmd: pkg install cpu-x
    reference: https://github.com/TheTumultuousUnicornOfDarkness/CPU-X?tab=readme-ov-file#from-repositories
  opensuse/zypper:
    cmd: sudo zypper install cpu-x
    reference: https://github.com/TheTumultuousUnicornOfDarkness/CPU-X?tab=readme-ov-file#from-repositories
  solus/eopkg:
    cmd: sudo eopkg install cpu-x
    reference: https://github.com/TheTumultuousUnicornOfDarkness/CPU-X?tab=readme-ov-file#from-repositories
  arch/yay:
    cmd: yay -S cpu-x-git
    reference: https://aur.archlinux.org/packages/cpu-x-git
binlist:
- CPU-X
