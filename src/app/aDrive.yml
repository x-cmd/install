lang: C#
homepage: https://www.aliyundrive.com/
desc:
  en: Alibaba Cloud Disk is a fast, non-intrusive, secure enough, and easy-to-share network disk
  cn: 阿里云盘是一款速度快、不打扰、够安全、易于分享的网盘
  cs: Alibaba Cloud Disk je rychlý, nerušivý, dostatečně bezpečný a snadno sdílený síťový disk
  de: Alibaba Cloud Disk ist ein schnelles, unaufdringliches, ausreichend sicheres und leicht teilbares Netzlaufwerk
  es: Alibaba Cloud Disk es un disco en red rápido, no intrusivo, suficientemente seguro y fácil de compartir
  fr: Alibaba Cloud Disk est un disque réseau rapide, non intrusif, suffisamment sécurisé et facile à partager
  id: Alibaba Cloud Disk adalah disk jaringan yang cepat, tidak mengganggu, cukup aman, dan mudah dibagikan
  it: Alibaba Cloud Disk è un disco di rete veloce, non invadente, abbastanza sicuro e facile da condividere
  ja: Alibaba Cloud Disk は高速で邪魔をせず、十分な安全性と共有しやすさを備えたネットワークディスクです
  ko: Alibaba Cloud Disk은 빠르고 방해하지 않으며 충분히 안전하고 공유하기 쉬운 네트워크 디스크입니다
  pl: Alibaba Cloud Disk to szybki, nieinwazyjny, wystarczająco bezpieczny i łatwy do udostępniania dysk sieciowy
  pt: O Alibaba Cloud Disk é um disco de rede rápido, não intrusivo, seguro o suficiente e fácil de compartilhar
  ro: Alibaba Cloud Disk este o disc de rețea rapid, neinvaziv, suficient de sigur și ușor de partajat
  ru: Alibaba Cloud Disk — быстрый, ненавязчивый, достаточно безопасный и простой для обмена сетевой диск
  th: Alibaba Cloud Disk คือดิสก์เครือข่ายที่เร็ว ไม่รบกวน ปลอดภัยเพียงพอ และแชร์ได้ง่าย
  tr: Alibaba Cloud Disk, hızlı, müdahale etmeyen, yeterince güvenli ve kolayca paylaşılabilen bir ağ diski
  uk: Alibaba Cloud Disk — швидкий, ненав'язливий, достатньо безпечний та простий для обміну мережевий диск
  vi: Alibaba Cloud Disk là ổ đĩa mạng nhanh, không gây phiền, đủ an toàn và dễ dùng chung
rule:
  (win|wsl2)/winget:
    cmd: x winget install Alibaba.aDrive
    reference: https://winget.run/pkg/Alibaba/aDrive
  darwin/brew:
    cmd: brew install --cask adrive
    reference: https://formulae.brew.sh/cask/adrive#default
  arch/yay:
    cmd: yay -S aliyun-adrive-bin
    reference: https://aur.archlinux.org/packages/aliyun-adrive-bin

x:
  winget: Alibaba.aDrive
  yay: aliyun-adrive-bin
binlist:
- aDrive
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 约 30 MB（估算）
            en: ~30 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
