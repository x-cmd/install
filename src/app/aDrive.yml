lang: C#
homepage: https://www.aliyundrive.com/
desc:
  en: Alibaba Cloud Disk is a fast, non-intrusive, secure enough, and easy-to-share network disk
  cn: 阿里云盘是一款速度快、不打扰、够安全、易于分享的网盘
rule:
  (win|wsl2)/winget:
    cmd: x winget install Alibaba.aDrive
    reference: https://winget.run/pkg/Alibaba/aDrive
  darwin/brew:
    cmd: brew install --cask adrive
    reference: https://formulae.brew.sh/cask/adrive#default
  arch/yay:
    cmd: yay -S aliyun-adrive-bin
    reference: https://aur.archlinux.org/packages/aliyun-adrive-bin

x:
  winget: Alibaba.aDrive
  yay: aliyun-adrive-bin
binlist:
- aDrive
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 约 30 MB（估算）
            en: ~30 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
