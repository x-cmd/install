lang: C++
homepage: https://weixin.qq.com/
desc:
  cn: 微信（WeChat）是腾讯公司推出的一个为智能终端提供即时通讯服务的免费应用程序
  en: WeChat is a free application launched by Tencent to provide instant messaging services for smart terminals
rule:
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras && x scoop install extras/wechat

      '
    reference: https://scoop.sh/#/apps?q=wechat
  (win|wsl2)/choco:
    cmd: x choco install wechat
    reference: https://community.chocolatey.org/packages/wechat
  (win|wsl2)/winget:
    cmd: x winget install Tencent.WeChat
    reference: https://winget.run/pkg/Tencent/WeChat
  darwin/brew:
    cmd: brew install --cask wechat
    reference: https://formulae.brew.sh/cask/wechat#default
  arch/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/arch
  centos/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/centos
  debian/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/debian
  elementary/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/elementary
  fedora/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/fedora
  neon/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/kde-neon
  kubuntu/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/kubuntu
  manjaro/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/manjaro
  pop/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/pop
  opensuse/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/opensuse
  rhel/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/rhel
  ubuntu/snap:
    cmd: sudo snap install electronic-wechat
    reference: https://snapcraft.io/install/electronic-wechat/ubuntu
  /flatpak:
    cmd: flatpak install flathub com.tencent.WeChat
    reference: https://flathub.org/apps/com.tencent.WeChat
  arch/yay:
    cmd: yay -S wechat-universal-bwrap
    reference: https://aur.archlinux.org/packages/wechat-universal-b
binlist:
- WeChat
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
