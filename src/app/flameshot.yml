lang: C++
homepage: https://github.com/flameshot-org/flameshot
license: GPL-3.0
desc:
  en: Powerful yet simple to use screenshot software
  cn: 功能强大但易于使用的屏幕截图软件
  cs: Výkonný, ale snadno použitelný software pro pořizování snímků obrazovky
  de: Leistungsstarke, dennoch einfach zu bedienende Screenshot-Software
  es: Software de capturas de pantalla potente y fácil de usar
  fr: Un logiciel de capture d'écran puissant mais simple à utiliser
  id: Perangkat lunak tangkapan layar yang kuat namun mudah digunakan
  it: Software per screenshot potente ma facile da usare
  ja: 強力ながら使いやすいスクリーンショットソフト
  ko: 강력하면서도 사용하기 쉬운 스크린샷 소프트웨어
  pl: Potężne, ale łatwe w obsłudze oprogramowanie do zrzutów ekranu
  pt: Software de captura de tela poderoso e fácil de usar
  ro: Software puternic dar ușor de folosit pentru capturi de ecran
  ru: Мощное, но простое в использовании ПО для создания снимков экрана
  th: ซอฟต์แวร์จับภาพหน้าจอที่ทรงพลังและใช้งานง่าย
  tr: Güçlü ama kullanımı kolay ekran görüntüsü yazılımı
  uk: Потужне, але просте у використанні ПЗ для створення знімків екрана
  vi: Phần mềm chụp ảnh màn hình mạnh mẽ nhưng dễ sử dụng
x:
  source: https://github.com/flameshot-org/flameshot
  eget: flameshot-org/flameshot
  apt: flameshot
  dnf: flameshot
  pacman: flameshot
  snap: flameshot
  zypper: flameshot
  port: flameshot
  scoop: extras/flameshot
  choco: flameshot
  winget: Flameshot.Flameshot
  flatpak: flathub
  yay: flameshot
rule:
  /eget:
    cmd: x eget flameshot-org/flameshot
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install --cask flameshot
    reference: https://github.com/flameshot-org/flameshot#macos
  darwin/port:
    cmd: sudo port selfupdate && sudo port install flameshot
    reference: https://github.com/flameshot-org/flameshot#macos
  debian/apt:
    cmd: sudo apt install flameshot
    reference: https://github.com/flameshot-org/flameshot#packages-from-repository
  ubuntu/apt:
    cmd: sudo apt install flameshot
    reference: https://github.com/flameshot-org/flameshot#packages-from-repository
  opensuse/zypper:
    cmd: sudo zypper install flameshot
    reference: https://github.com/flameshot-org/flameshot#packages-from-repository
  arch/pacman:
    cmd: sudo pacman -S flameshot
    reference: https://github.com/flameshot-org/flameshot#packages-from-repository
  kali/apt:
    cmd: sudo apt install flameshot
    reference: https://github.com/flameshot-org/flameshot#packages-from-repository
  fedora/dnf:
    cmd: sudo dnf install flameshot
    reference: https://github.com/flameshot-org/flameshot#packages-from-repository
  raspbian/apt:
    cmd: sudo apt install flameshot
    reference: https://github.com/flameshot-org/flameshot#packages-from-repository
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras && x scoop install extras/flameshot

      '
    reference: https://scoop.sh/#/apps?q=flameshot
  (win|wsl2)/choco:
    cmd: x choco install flameshot
    reference: https://community.chocolatey.org/packages/flameshot
  (win|wsl2)/winget:
    cmd: x winget install Flameshot.Flameshot
    reference: https://winget.run/pkg/Flameshot/Flameshot
  /flatpak:
    cmd: sudo flatpak install flathub org.flameshot.Flameshot
    reference: https://flathub.org/apps/org.flameshot.Flameshot
  arch/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/arch
  centos/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/centos
  debian/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/debian
  elementary/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/elementary
  fedora/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/fedora
  neon/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/kde-neon
  kubuntu/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/kubuntu
  manjaro/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/manjaro
  pop/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/pop
  opensuse/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/opensuse
  rhel/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/rhel
  ubuntu/snap:
    cmd: sudo snap install flameshot
    reference: https://snapcraft.io/install/flameshot/ubuntu
  arch/yay:
    cmd: yay -S flameshot
    reference: https://aur.archlinux.org/packages/flameshot
binlist:
- flameshot

