lang: C
homepage: https://www.todesk.com/
desc:
  cn: ToDesk 是一款安全免费不限速的远程控制软件
  en: ToDesk, the secure and fast remote control software
rule:
  (win|wsl2)/winget:
    cmd: x winget install Youqu.ToDesk
    reference: https://winget.run/pkg/Youqu/ToDesk
  debian/apt:
    cmd: 'wget https://newdl.todesk.com/linux/todesk-v4.7.2.0-amd64.deb \

      && sudo apt-get install ./todesk-v4.7.2.0-amd64.deb

      '
    reference: https://www.todesk.com/linux.html
  ubuntu/apt:
    cmd: 'wget https://newdl.todesk.com/linux/todesk-v4.7.2.0-amd64.deb \

      && sudo apt-get install ./todesk-v4.7.2.0-amd64.deb

      '
    reference: https://www.todesk.com/linux.html
  mint/apt:
    cmd: 'wget https://newdl.todesk.com/linux/todesk-v4.7.2.0-amd64.deb \

      && sudo apt-get install ./todesk-v4.7.2.0-amd64.deb

      '
    reference: https://www.todesk.com/linux.html
  arch/pacman:
    cmd: 'curl -OL https://newdl.todesk.com/linux/todesk_4.1.0_x86_64.pkg.tar.zst  \

      && sudo pacman -U todesk_4.1.0_x86_64.pkg.tar.zst

      '
    reference: https://www.todesk.com/linux.html
  fedora/rpm:
    cmd: 'curl -OL https://newdl.todesk.com/linux/todesk-v4.7.2.0-x86_64.rpm  \

      && sudo rpm -Uvh todesk-v4.7.2.0-x86_64.rpm

      '
    reference: https://www.todesk.com/linux.html
  rhel/rpm:
    cmd: 'curl -OL https://newdl.todesk.com/linux/todesk-v4.7.2.0-x86_64.rpm  \

      && sudo rpm -Uvh todesk-v4.7.2.0-x86_64.rpm

      '
    reference: https://www.todesk.com/linux.html
  centos/rpm:
    cmd: 'curl -OL https://newdl.todesk.com/linux/todesk-v4.7.2.0-c7-x86_64.rpm  \

      && sudo rpm -Uvh todesk-v4.7.2.0-c7-x86_64.rpm

      '
    reference: https://www.todesk.com/linux.html
  raspbian/apt:
    cmd: 'wget https://newdl.todesk.com/linux/todesk_4.1.0_armv7l.deb \

      && sudo apt-get install ./todesk_4.1.0_armv7l.deb

      '
    reference: https://www.todesk.com/linux.html
  arch/yay:
    cmd: yay -S todesk-appimage
    reference: https://aur.archlinux.org/packages/todesk-app
binlist:
- ToDesk
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
