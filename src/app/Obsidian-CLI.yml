lang: Go
homepage: https://github.com/Yakitrak/obsidian-cli
license: MIT
desc:
  cn: Obsidian 是一个功能强大且可扩展的知识库应用程序，可以在纯文本注释的本地文件夹之上工作
  en: Obsidian is a powerful and extensible knowledge base application that works on top of your local folder of plain text notes
x:
  source: https://github.com/Yakitrak/obsidian-cli
  eget: https://github.com/Yakitrak/obsidian-cli
rule:
  /eget:
    cmd: x eget Yakitrak/obsidian-cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew tap yakitrak/yakitrak && brew install yakitrak/yakitrak/obs
    reference: https://yakitrak.github.io/obs/docs/install/mac-and-linux
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add scoop-yakitrak https://github.com/yakitrak/scoop-yakitrak.git \

      && x scoop install obs

      '
    reference: https://yakitrak.github.io/obs/docs/install/windows
  /flatpak:
    cmd: flatpak install flathub md.obsidian.Obsidian
    reference: https://flathub.org/apps/md.obsidian.Obsidian
binlist:
- Obsidian-CLI

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
