lang: Go
homepage: https://github.com/Yakitrak/obsidian-cli
license: MIT
desc:
  cn: Obsidian 是一个功能强大且可扩展的知识库应用程序，可以在纯文本注释的本地文件夹之上工作
  en: Obsidian is a powerful and extensible knowledge base application that works on top of your local folder of plain text notes
  cs: Obsidian je výkonná a rozšiřitelná aplikace pro správu znalostí, která pracuje nad místní složkou s textovými poznámkami
  de: Obsidian ist eine leistungsstarke und erweiterbare Wissensdatenbank-Anwendung, die auf einem lokalen Ordner mit reinen Textnotizen arbeitet
  es: Obsidian es una aplicación de base de conocimiento potente y extensible que trabaja sobre tu carpeta local de notas de texto plano
  fr: Obsidian est une application de base de connaissances puissante et extensible qui fonctionne sur votre dossier local de notes en texte brut
  id: Obsidian adalah aplikasi basis pengetahuan yang kuat dan dapat diperluas yang bekerja di atas folder lokal berisi catatan teks biasa
  it: Obsidian è un'applicazione di base della conoscenza potente ed estensibile che lavora sulla tua cartella locale di note in testo semplice
  ja: Obsidian は、ローカルのプレーンテキストノートのフォルダーを土台に動作する、強力で拡張可能なナレッジベースアプリケーションです
  ko: Obsidian는 로컬 일반 텍스트 노트 폴더 위에서 동작하는 강력하고 확장 가능한 지식 기반 애플리케이션입니다
  pl: Obsidian to potężna i rozszerzalna aplikacja bazy wiedzy działająca na lokalnym folderze z notatkami w zwykłym tekście
  pt: Obsidian é um aplicativo de base de conhecimento poderoso e extensível que funciona sobre sua pasta local de notas em texto simples
  ro: Obsidian este o aplicație puternică și extensibilă de bază de cunoștințe care lucrează peste folderul local cu note în text simplu
  ru: Obsidian — мощное и расширяемое приложение для базы знаний, работающее поверх локальной папки с текстовыми заметками в простом тексте
  th: Obsidian คือแอปพลิเคชันฐานความรู้ที่ทรงพลังและขยายได้ ที่ทำงานบนโฟลเดอร์ข้อความธรรมดาในเครื่องของคุณ
  tr: Obsidian, düz metin notlarınızın bulunduğu yerel klasörünüz üzerinde çalışan güçlü ve genişletilebilir bir bilgi tabanı uygulamasıdır
  uk: Obsidian — потужний і розширюваний застосунок бази знань, що працює поверх локальної теки з текстовими нотатками у простому тексті
  vi: Obsidian là ứng dụng cơ sở tri thức mạnh mẽ và có thể mở rộng, hoạt động trên thư mục ghi chú văn bản thuần cục bộ của bạn
x:
  source: https://github.com/Yakitrak/obsidian-cli
  eget: Yakitrak/obsidian-cli
  brew: yakitrak/yakitrak/obs
  scoop: obs
  flatpak: flathub
rule:
  /eget:
    cmd: x eget Yakitrak/obsidian-cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew tap yakitrak/yakitrak && brew install yakitrak/yakitrak/obs
    reference: https://yakitrak.github.io/obs/docs/install/mac-and-linux
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add scoop-yakitrak https://github.com/yakitrak/scoop-yakitrak.git \

      && x scoop install obs

      '
    reference: https://yakitrak.github.io/obs/docs/install/windows
  /flatpak:
    cmd: flatpak install flathub md.obsidian.Obsidian
    reference: https://flathub.org/apps/md.obsidian.Obsidian
binlist:
- Obsidian-CLI

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
