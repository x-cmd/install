lang: C#
homepage: https://discord.com/
desc:
  en: Discord is a chat software
  cn: Discord 是一款聊天软件
  cs: Discord je chatovací software
  de: Discord ist eine Chat-Software
  es: Discord es un software de chat
  fr: Discord est un logiciel de messagerie instantanée
  id: Discord adalah perangkat lunak obrolan
  it: Discord è un software di chat
  ja: Discord はチャットソフトウェアです
  ko: Discord는 채팅 소프트웨어입니다
  pl: Discord to oprogramowanie do czatu
  pt: O Discord é um software de chat
  ro: Discord este un software de chat
  ru: Discord — программа для чата
  th: Discord คือซอฟต์แวร์สำหรับแชท
  tr: Discord bir sohbet yazılımıdır
  uk: Discord — програма для чату
  vi: Discord là phần mềm trò chuyện
rule:
  darwin/brew:
    cmd: brew install --cask discord
    reference: https://formulae.brew.sh/cask/discord#default
  /flatpak:
    cmd: sudo flatpak install flathub com.discordapp.Discord
    reference: https://flathub.org/apps/com.discordapp.Discord
  arch/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/arch
  centos/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/centos
  debian/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/debian
  elementary/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/elementary
  fedora/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/fedora
  neon/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/kde-neon
  kubuntu/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/kubuntu
  manjaro/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/manjaro
  pop/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/pop
  opensuse/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/opensuse
  rhel/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/rhel
  ubuntu/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/ubuntu
  kali/snap:
    cmd: sudo snap install discord
    reference: https://snapcraft.io/install/discord/ubuntu
  (win|wsl2)/scoop:
    cmd: x scoop install extras/discord
    reference: https://scoop.sh/#/apps?q=discord
  (win|wsl2)/choco:
    cmd: x choco install discord
    reference: https://community.chocolatey.org/packages/discord
  (win|wsl2)/winget:
    cmd: x winget install Discord.Discord
    reference: https://winget.run/pkg/Discord/Discord
  arch/yay:
    cmd: yay -S discord_arch_electron
    reference: https://aur.archlinux.org/packages/discord_arch_electron

x:
  scoop: extras/discord
  choco: discord
  winget: Discord.Discord
  snap: discord
  flatpak: flathub
  yay: discord_arch_electron
binlist:
- Discord
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 约 30 MB（估算）
            en: ~30 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
