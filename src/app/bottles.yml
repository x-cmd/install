lang: Python
homepage: https://github.com/bottlesdevs/Bottles
license: GPL-3.0
desc:
  cn: Bottles 是一个应用程序，可以让你在喜欢的 Linux 发行版上轻松管理 Windows 应用程序。
  en: Bottles is an application that allows you to easily manage Windows prefixes on your favorite Linux distribution.
x:
  source: https://github.com/bottlesdevs/Bottles
  flatpak: flathub
  yay: bottles
rule:
  /flatpak:
    cmd: flatpak install flathub com.usebottles.bottles
    reference: https://flathub.org/apps/com.usebottles.bottles
  arch/yay:
    cmd: yay -S bottles
    reference: https://aur.archlinux.org/packages/bottles
binlist:
- bottles
# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # 下载 runner/proton
    filesystem:
      read:
        desc:
          cn: 读取 ~/.local/share/bottles
          en: Reads ~/.local/share/bottles
        sensitive: []
      write:
        desc:
          cn: 写入 bottle prefix
          en: Writes bottle prefixes
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 135 KB
          rating: 1
          desc:
            cn: 约 135 KB（估算）
            en: ~135 KB estimated
        growth:
          desc:
            cn: 每个 bottle 占用数 GB
            en: Each bottle consumes several GB
      paths:
        data:
          - "$HOME/.local/share/bottles"
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 1 GB
        desc:
          cn: 运行 Windows 应用时
          en: 1 GB when running Windows apps
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 运行 wine/proton 时占用多核
          en: Saturates cores when running wine/proton
