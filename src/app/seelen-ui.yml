lang: Rust
homepage: https://github.com/eythaann/Seelen-UI
license: AGPL-3.0
desc:
  cn: SeelenUI 是一个专注于自定义和生产力的工具，旨在增强您的 Windows 桌面体验
  en: Seelen UI is a tool designed to enhance your Windows desktop experience with a focus on customization and productivity
  cs: Seelen UI je nástroj navržený ke zlepšení vašeho desktopového zážitku v systému Windows, s důrazem na přizpůsobení a produktivitu
  de: Seelen UI ist ein Werkzeug, das Ihre Windows-Desktop-Erfahrung mit Fokus auf Anpassung und Produktivität verbessert
  es: Seelen UI es una herramienta diseñada para mejorar tu experiencia de escritorio en Windows con un enfoque en la personalización y la productividad
  fr: Seelen UI est un outil conçu pour améliorer votre expérience du bureau Windows, en mettre l'accent sur la personnalisation et la productivité
  id: Seelen UI adalah alat yang dirancang untuk meningkatkan pengalaman desktop Windows Anda dengan fokus pada kustomisasi dan produktivitas
  it: Seelen UI è uno strumento progettato per migliorare la tua esperienza desktop su Windows con un focus su personalizzazione e produttività
  ja: Seelen UIは、カスタマイゼーションと生産性に重点を置き、Windowsのデスクトップ体験を向上させるために設計されたツールです
  ko: Seelen UI는 사용자 지정과 생산성에 초점을 맞춰 Windows 데스크톱 경험을 개선하도록 설계된 도구입니다
  pl: Seelen UI to narzędzie zaprojektowane z myślą o ulepszzeniu środowiska pulpitu Windows, ze szczególnym naciskiem na dostosowywanie i wydajność
  pt: Seelen UI é uma ferramenta criada para aprimorar sua experiência no desktop Windows, com foco em personalização e produtividade
  ro: Seelen UI este o unealtă concepută pentru a vă îmbunătăți experiența pe desktopul Windows, cu accent pe personalizare și productivitate
  ru: Seelen UI — инструмент, созданный для улучшения работы с Windows, с акцентом на настройку и продуктивность
  th: Seelen UI คือเครื่องมือที่ออกแบบมาเพื่อยกระดับประสบการณ์เดสก์ท็อป Windows ของคุณ โดยเน้นการปรับแต่งและประสิทธิภาพการทำงาน
  tr: Seelen UI, özelleştirme ve üretkenliğe odaklanarak Windows masaüstü deneyiminizi geliştirmek için tasarlanmış bir araçtır
  uk: Seelen UI — інструмент, створений для покращення роботи з Windows, із наголосом на налаштування та продуктивність
  vi: Seelen UI là công cụ được thiết kế để nâng cao trải nghiệm desktop Windows của bạn, tập trung vào tùy biến và năng suất
x:
  source: https://github.com/eythaann/Seelen-UI
  eget: eythaann/Seelen-UI
  winget: Seelen.SeelenUI
rule:
  /eget:
    cmd: x eget eythaann/Seelen-UI
    reference: https://x-cmd.com/mod/eget
  (win|wsl2)/winget:
    cmd: x winget install --id Seelen.SeelenUI
    reference: https://github.com/eythaann/seelen-ui?tab=readme-ov-file#winget
binlist:
- seelen-ui

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 40 MB
          rating: 2
          desc:
            cn: 安装 40 MB
            en: 40 MB install
        download:
          estimate: 40 MB
          desc:
            cn: 约 40 MB 下载 (macos/x64)
            en: ~40 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: none
