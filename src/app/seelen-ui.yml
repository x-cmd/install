lang: Rust
homepage: https://github.com/eythaann/Seelen-UI
license: AGPL-3.0
desc:
  cn: SeelenUI 是一个专注于自定义和生产力的工具，旨在增强您的 Windows 桌面体验
  en: Seelen UI is a tool designed to enhance your Windows desktop experience with a focus on customization and productivity
x:
  source: https://github.com/eythaann/Seelen-UI
  eget: https://github.com/eythaann/Seelen-UI
rule:
  /eget:
    cmd: x eget eythaann/Seelen-UI
    reference: https://x-cmd.com/mod/eget
  (win|wsl2)/winget:
    cmd: x winget install --id Seelen.SeelenUI
    reference: https://github.com/eythaann/seelen-ui?tab=readme-ov-file#winget
binlist:
- seelen-ui

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 40 MB
          rating: 2
          desc:
            cn: 安装 40 MB
            en: 40 MB install
        download:
          estimate: 40 MB
          desc:
            cn: 约 40 MB 下载 (macos/x64)
            en: ~40 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
