lang: Objective-C
homepage: https://iterm2.com/
desc:
  cn: iTerm2 是一个适用于 macOS 的终端模拟器，具有强大的功能。
  en: iTerm2 is a terminal emulator for Mac OS X that does amazing things.
rule:
  darwin/brew:
    cmd: brew install --cask iterm2
    reference: https://formulae.brew.sh/cask/iterm2#default
binlist:
- iterm2
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
