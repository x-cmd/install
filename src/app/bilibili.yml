lang: Swift
homepage: https://app.bilibili.com/
desc:
  cn: 哔哩哔哩官方客户端
  en: Bilibili Official Client
  cs: Oficiální klient Bilibili
  de: Offizieller Bilibili-Client
  es: Cliente oficial de Bilibili
  fr: Client officiel de Bilibili
  id: Klien resmi Bilibili
  it: Client ufficiale di Bilibili
  ja: Bilibili 公式クライアント
  ko: Bilibili 공식 클라이언트
  pl: Oficjalny klient Bilibili
  pt: Cliente oficial do Bilibili
  ro: Clientul oficial Bilibili
  ru: Официальный клиент Bilibili
  th: ไคลเอนต์ทางการของ Bilibili
  tr: Resmi Bilibili istemcisi
  uk: Офіційний клієнт Bilibili
  vi: Ứng dụng chính thức của Bilibili
rule:
  darwin/brew:
    cmd: brew install --cask bilibili
    reference: https://formulae.brew.sh/cask/bilibili#default
  arch/yay:
    cmd: yay -S bilibili-bin
    reference: https://aur.archlinux.org/packages/bilibili-bin

x:
  yay: bilibili-bin
binlist:
- bilibili
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
