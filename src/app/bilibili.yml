lang: Swift
homepage: https://app.bilibili.com/
desc:
  cn: 哔哩哔哩官方客户端
  en: Bilibili Official Client
rule:
  darwin/brew:
    cmd: brew install --cask bilibili
    reference: https://formulae.brew.sh/cask/bilibili#default
  arch/yay:
    cmd: yay -S bilibili-bin
    reference: https://aur.archlinux.org/packages/bilibili-bin
binlist:
- bilibili
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
