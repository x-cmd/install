lang: C++
homepage: https://7-zip.org
desc:
  en: 7-Zip is a file archiver with a high compression ratio
  cn: 7-Zip 是一款拥有极高压缩比的开源压缩软件
  cs: 7-Zip je archivátor souborů s vysokým kompresním poměrem
  de: 7-Zip ist ein Dateiarchivierer mit hohem Kompressionsverhältnis
  es: 7-Zip es un archivador de archivos con una alta relación de compresión
  fr: 7-Zip est un archiveur de fichiers avec un taux de compression élevé
  id: 7-Zip adalah pengarsip file dengan rasio kompresi tinggi
  it: 7-Zip è un archiviazione di file con un elevato rapporto di compressione
  ja: 7-Zip は高い圧縮率を持つファイルアーカイバです
  ko: 7-Zip은 높은 압축률을 제공하는 파일 아카이버입니다
  pl: 7-Zip to archiwator plików o wysokim współczynniku kompresji
  pt: O 7-Zip é um arquivador de arquivos com alta taxa de compressão
  ro: 7-Zip este un arhivator de fișiere cu un raport de compresie ridicat
  ru: 7-Zip — это архиватор файлов с высокой степенью сжатия
  th: 7-Zip คือโปรแกรมเก็บไฟล์ที่มีอัตราการบีบอัดสูง
  tr: 7-Zip, yüksek sıkıştırma oranına sahip bir dosya arşivleyicisidir
  uk: 7-Zip — це архіватор файлів із високим коефіцієнтом стиснення
  vi: 7-Zip là trình lưu trữ tệp với tỷ lệ nén cao
rule:
  (win|wsl2)/scoop:
    cmd: x scoop install 7zip
    reference: https://scoop.sh/#/apps?q=7zip
  (win|wsl2)/choco:
    cmd: x choco install 7zip
    reference: https://community.chocolatey.org/packages/7zip
  (win|wsl2)/winget:
    cmd: x winget install 7zip.7zip
    reference: https://winget.run/pkg/7zip/7zip
  darwin/brew:
    cmd: brew install sevenzip
    reference: https://formulae.brew.sh/formula/sevenzip#default
  arch/yay:
    cmd: yay -S p7zip-full-bin
    reference: https://aur.archlinux.org/packages/p7zip-full-bin

# complicated

x:
  scoop: 7zip
  choco: 7zip
  winget: 7zip.7zip
  brew: sevenzip
  yay: p7zip-full-bin
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
