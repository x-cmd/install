lang: C++
homepage: https://pan.baidu.com/
desc:
  en: Baidu Netdisk is a cloud service product launched by Baidu, users can use photos, documents, music, and address book data in various devices to share and communicate in many circles of friends
  cn: 百度网盘是百度公司推出的一款云服务产品,用户可以将照片、文档、音乐、通讯录数据在各类设备中使用，在众多朋友圈里分享与交流
rule:
  (win|wsl2)/winget:
    cmd: x winget install Baidu.BaiduNetdisk
    reference: https://winget.run/pkg/Baidu/BaiduNetdisk
  darwin/brew:
    cmd: brew install --cask baidunetdisk
    reference: https://formulae.brew.sh/cask/baidunetdisk#default
  /flatpak:
    cmd: sudo flatpak install flathub com.baidu.NetDisk
    reference: https://flathub.org/apps/com.baidu.NetDisk
  arch/yay:
    cmd: yay -S baidunetdisk-bin
    reference: https://aur.archlinux.org/packages/baidunetdisk-bin
binlist:
- BaiduNetdisk
license: NOASSERTION
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true   # Baidu cloud
    filesystem:
      read:
        desc:
          cn: 读取用户文件
          en: Reads user files
        sensitive: []
      write:
        desc:
          cn: 同步文件到云端
          en: Syncs files to cloud
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 100 MB
          rating: 3
          desc:
            cn: 安装 ~100 MB
            en: ~100 MB install
        growth:
          desc:
            cn: 缓存随同步文件增长
            en: Cache grows with synced files
      paths:
        data:
          - "$HOME/BaiduNetdisk"
        config: []
    memory:
      idle:
        estimate: 200 MB
        desc:
          cn: ~200 MB GUI
          en: ~200 MB GUI
      peak:
        estimate: 1 GB
        desc:
          cn: 同步大文件时
          en: During large file sync
    cpu:
      workload: [io, compute]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 5
        desc:
          cn: 上传/下载时占用
          en: Spike on upload/download
