lang: TypeScript
homepage: https://github.com/microsoft/vscode
license: MIT
desc:
  cn: Visual Studio Code 是一个轻量级但功能强大的源代码编辑器，可以在桌面上运行，适用于 Windows、 macOS 和 Linux
  en: Visual Studio Code is a lightweight but powerful source code editor which runs on your desktop and is available for Windows, macOS and Linux
  cs: Visual Studio Code je lehký, ale výkonný editor zdrojového kódu, který běží na vaší ploše a je dostupný pro Windows, macOS a Linux
  de: Visual Studio Code ist ein schlanker, aber leistungsstarker Quellcode-Editor, der auf Ihrem Desktop läuft und für Windows, macOS und Linux verfügbar ist
  es: Visual Studio Code es un editor de código fuente ligero pero potente que se ejecuta en tu escritorio y está disponible para Windows, macOS y Linux
  fr: Visual Studio Code est un éditeur de code source léger mais puissant qui s'exécute sur votre bureau et est disponible pour Windows, macOS et Linux
  id: Visual Studio Code adalah editor kode sumber yang ringan namun powerful, berjalan di desktop Anda dan tersedia untuk Windows, macOS, dan Linux
  it: Visual Studio Code è un editor di codice sorgente leggero ma potente che gira sul desktop ed è disponibile per Windows, macOS e Linux
  ja: Visual Studio Code はデスクトップで動作する軽量だが強力なソースコードエディタで、Windows、macOS、Linux に対応しています
  ko: Visual Studio Code는 데스크톱에서 실행되는 가볍지만 강력한 소스 코드 편집기로 Windows, macOS, Linux에서 사용할 수 있습니다
  pl: Visual Studio Code to lekki, ale potężny edytor kodu źródłowego działający na pulpicie, dostępny w systemach Windows, macOS i Linux
  pt: O Visual Studio Code é um editor de código-fonte leve, mas poderoso, que roda na sua área de trabalho e está disponível para Windows, macOS e Linux
  ro: Visual Studio Code este un editor de cod sursă ușor, dar puternic, care rulează pe desktop și este disponibil pentru Windows, macOS și Linux
  ru: Visual Studio Code — лёгкий, но мощный редактор исходного кода, работающий на вашем компьютере и доступный для Windows, macOS и Linux
  th: Visual Studio Code คือโปรแกรมแก้ไขซอร์สโค้ดที่เบากว่าแต่ทรงพลัง รันบนเดสก์ท็อปของคุณ และใช้งานได้บน Windows, macOS และ Linux
  tr: Visual Studio Code, masaüstünüzde çalışan ve Windows, macOS ile Linux için kullanılabilen hafif ama güçlü bir kaynak kod düzenleyicisidir
  uk: Visual Studio Code — легкий, але потужний редактор вихідного коду, що працює на вашому комп'ютері та доступний для Windows, macOS і Linux
  vi: Visual Studio Code là trình soạn thảo mã nguồn nhẹ nhưng mạnh mẽ, chạy trên máy tính của bạn và hỗ trợ Windows, macOS và Linux
x:
  source: https://github.com/microsoft/vscode
  pacman: code
  snap: code
  scoop: extras/vscode
  choco: vscode
  winget: Microsoft.VisualStudioCode
  flatpak: flathub
  yay: visual-studio-code-bin
rule:
  /flatpak:
    cmd: flatpak install flathub com.visualstudio.code
    reference: https://flathub.org/apps/com.visualstudio.code
  arch/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/arch
  centos/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/centos
  debian/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/debian
  elementary/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/elementary
  fedora/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/fedora
  neon/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/kde-neon
  kubuntu/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/kubuntu
  manjaro/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/manjaro
  pop/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/pop
  opensuse/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/opensuse
  rhel/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/rhel
  ubuntu/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/ubuntu
  kali/snap:
    cmd: sudo snap install code --classic
    reference: https://snapcraft.io/install/code/ubuntu
  raspbian/snap:
    cmd: sudo snap-get install snap
    reference: https://snapcraft.io/install/code/raspbian
  arch/pacman:
    cmd: sudo pacman -S code
    reference: https://command-not-found.com/code
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras && x scoop install extras/vscode

      '
    reference: https://scoop.sh/#/apps?q=vscode
  (win|wsl2)/choco:
    cmd: x choco install vscode
    reference: https://community.chocolatey.org/packages/vscode
  (win|wsl2)/winget:
    cmd: x winget install Microsoft.VisualStudioCode
    reference: https://winget.run/pkg/Microsoft/VisualStudioCode
  darwin/brew:
    cmd: brew install --cask visual-studio-code
    reference: https://formulae.brew.sh/cask/visual-studio-code#default
  arch/yay:
    cmd: yay -S visual-studio-code-bin
    reference: https://aur.archlinux.org/packages/visual-studio-code
binlist:
- Visual-Studio-Code

# already profiled
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件、扩展设置
          en: Reads config files, extension settings
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.2 GB
          rating: 5
          desc:
            cn: 安装 1.2 GB（Electron 运行时）
            en: 1.2 GB install (Electron runtime)
        download:
          estimate: 227 MB
          desc:
            cn: 约 227 MB 下载 (linux/x64 .deb)
            en: ~227 MB download (linux/x64 .deb)
      paths:
        data:
          - ~/.vscode/extensions
          - ~/.config/Code
        config: []
    memory:
      idle:
        estimate: 300 MB
        desc:
          cn: 300 MB（公开数据，未实测）
          en: 300 MB (public data, not measured here)
    cpu:
      workload: ['compute', 'io']
      processes: 4
      peak:
        rating: 4
        desc:
          cn: 高
          en: Heavy
