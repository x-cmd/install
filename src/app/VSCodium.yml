lang: application
homepage: https://github.com/VSCodium/vscodium
license: MIT
desc:
  cn: VSCodium 是 Microsoft 编辑器 VS Code 的社区驱动、免费许可的二进制发行版
  en: VSCodium is a community-driven, freely-licensed binary distribution of Microsoft’s editor VS Code
  cs: VSCodium je komunitou řízená, volně licencovaná binární distribuce editoru Microsoft VS Code
  de: VSCodium ist eine von der Community getragene, frei lizenzierte Binärdistribution des Microsoft-Editors VS Code
  es: VSCodium es una distribución binaria del editor VS Code de Microsoft, desarrollada por la comunidad y con licencia libre
  fr: VSCodium est une distribution binaire communautaire et librement sous licence de l'éditeur VS Code de Microsoft
  id: VSCodium adalah distribusi biner yang dikelola komunitas dan berlisensi bebas dari editor VS Code milik Microsoft
  it: VSCodium è una distribuzione binaria community-driven e con licenza libera dell'editor VS Code di Microsoft
  ja: VSCodium は Microsoft のエディタ VS Code をコミュニティ主导で自由にライセンス供与されたバイナリ配布版です
  ko: VSCodium는 Microsoft 편집기 VS Code를 커뮤니티 주도로 자유 라이선스한 바이너리 배포판입니다
  pl: VSCodium to dystrybucja binarna edytora Microsoft VS Code, tworzona przez społeczność na wolnej licencji
  pt: O VSCodium é uma distribuição binária do editor VS Code da Microsoft, conduzida pela comunidade e com licença livre
  ro: VSCodium este o distribuție binară a editorului VS Code de la Microsoft, dezvoltată de comunitate și cu licență liberă
  ru: VSCodium — распространяемый сообществом бинарный дистрибутив редактора Microsoft VS Code со свободной лицензией
  th: VSCodium คือไบนารีดิสทริบิวชันของโปรแกรมแก้ไข VS Code ของ Microsoft ที่พัฒนาโดยชุมชนและใช้สัญญาอนุญาตเสรี
  tr: VSCodium, Microsoft'un VS Code düzenleyicisinin topluluk destekli, özgür lisanslı ikili dağıtımıdır
  uk: VSCodium — бінарний дистрибутив редактора Microsoft VS Code, який розвивається спільнотою та має вільну ліцензію
  vi: VSCodium là bản phân phối nhị phân của trình soạn thảo VS Code của Microsoft, do cộng đồng phát triển và dùng giấy phép tự do
x:
  source: https://github.com/VSCodium/vscodium
  eget: VSCodium/vscodium
  apt: codium
  dnf: codium
  snap: codium
  zypper: codium
  port: codium
  scoop: vscodium
  choco: vscodium
  winget: vscodium
  flatpak: flathub
  aura: vscodium-bin
  yay: vscodium-bin
rule:
  /eget:
    cmd: x eget VSCodium/vscodium
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install --cask vscodium
    reference: https://vscodium.com/#install-with-brew-mac
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install vscodium
    reference: https://vscodium.com/#install-with-chocolatey-windows
  (win|wsl2)/choco:
    cmd: x choco install vscodium
    reference: https://vscodium.com/#install-with-chocolatey-windows
  (win|wsl2)/winget:
    cmd: x winget install vscodium
    reference: https://vscodium.com/#install-with-windows-package-manager-winget
  linux/snap:
    cmd: sudo snap install codium --classic
    reference: https://vscodium.com/#install-with-snap-linux
  darwin/port:
    cmd: sudo port install codium
    reference: https://vscodium.com/#install-on-parrot-os
  /nix-env:
    cmd: sudo nix-env -iA nixpkgs.vscodium
    reference: https://vscodium.com/#install-on-nix-os
  arch/aura:
    cmd: sudo aura -A vscodium-bin
    reference: https://vscodium.com/#install-on-arch-linux
  arch/yay:
    cmd: yay -S vscodium-bin
    reference: https://vscodium.com/#install-on-arch-linux
  debian/apt:
    cmd: 'wget -qO - https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg \

      | gpg --dearmor \

      | sudo dd of=/usr/share/keyrings/vscodium-archive-keyring.gpg

      echo ''deb [ signed-by=/usr/share/keyrings/vscodium-archive-keyring.gpg ] https://download.vscodium.com/debs vscodium main'' \

      | sudo tee /etc/apt/sources.list.d/vscodium.list

      sudo apt update && sudo apt install codium

      '
    reference: https://vscodium.com/#install-on-debian-ubuntu-deb-package
  ubuntu/apt:
    cmd: 'wget -qO - https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg \

      | gpg --dearmor \

      | sudo dd of=/usr/share/keyrings/vscodium-archive-keyring.gpg

      echo ''deb [ signed-by=/usr/share/keyrings/vscodium-archive-keyring.gpg ] https://download.vscodium.com/debs vscodium main'' \

      | sudo tee /etc/apt/sources.list.d/vscodium.list

      sudo apt update && sudo apt install codium

      '
    reference: https://vscodium.com/#install-on-debian-ubuntu-deb-package
  fedora/dnf:
    cmd: 'sudo rpmkeys --import https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg && \

      printf "[gitlab.com_paulcarroty_vscodium_repo]\nname=download.vscodium.com\nbaseurl=https://download.vscodium.com/rpms/\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg\nmetadata_expire=1h" | sudo tee -a /etc/yum.repos.d/vscodium.repo && \

      sudo dnf install codium

      '
    reference: https://vscodium.com/#install-on-fedora-rhel-centos-rockylinux-opensuse-rpm-package
  rhel/dnf:
    cmd: 'sudo rpmkeys --import https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg && \

      printf "[gitlab.com_paulcarroty_vscodium_repo]\nname=download.vscodium.com\nbaseurl=https://download.vscodium.com/rpms/\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg\nmetadata_expire=1h" | sudo tee -a /etc/yum.repos.d/vscodium.repo && \

      sudo dnf install codium

      '
    reference: https://vscodium.com/#install-on-fedora-rhel-centos-rockylinux-opensuse-rpm-package
  centos/dnf:
    cmd: 'sudo rpmkeys --import https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg && \

      printf "[gitlab.com_paulcarroty_vscodium_repo]\nname=download.vscodium.com\nbaseurl=https://download.vscodium.com/rpms/\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg\nmetadata_expire=1h" | sudo tee -a /etc/yum.repos.d/vscodium.repo && \

      sudo dnf install codium

      '
    reference: https://vscodium.com/#install-on-fedora-rhel-centos-rockylinux-opensuse-rpm-package
  rocky/dnf:
    cmd: 'sudo rpmkeys --import https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg && \

      printf "[gitlab.com_paulcarroty_vscodium_repo]\nname=download.vscodium.com\nbaseurl=https://download.vscodium.com/rpms/\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg\nmetadata_expire=1h" | sudo tee -a /etc/yum.repos.d/vscodium.repo && \

      sudo dnf install codium

      '
    reference: https://vscodium.com/#install-on-fedora-rhel-centos-rockylinux-opensuse-rpm-package
  opehsuse/dnf:
    cmd: 'sudo rpmkeys --import https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg && \

      printf "[gitlab.com_paulcarroty_vscodium_repo]\nname=gitlab.com_paulcarroty_vscodium_repo\nbaseurl=https://download.vscodium.com/rpms/\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg\nmetadata_expire=1h" | sudo tee -a /etc/zypp/repos.d/vscodium.repo && \

      sudo zypper in codium

      '
    reference: https://vscodium.com/#install-on-fedora-rhel-centos-rockylinux-opensuse-rpm-package
  gentoo/emerge:
    cmd: sudo emerge -av vscodium
    reference: https://vscodium.com/#install-on-gentoo-funtoo-linux-ebuild
  funtoo/emerge:
    cmd: sudo emerge -av vscodium-bin
    reference: https://vscodium.com/#install-on-gentoo-funtoo-linux-ebuild
  /flatpak:
    cmd: sudo flatpak install flathub com.vscodium.codium
    reference: https://vscodium.com/#flatpak-option-linux
binlist:
- VSCodium

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
