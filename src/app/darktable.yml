lang: C
homepage: https://github.com/darktable-org/darktable
license: GPL-3.0
desc:
  cn: darktable 是一个开源的摄影工作流应用程序和 RAW 图像开发工具。
  en: darktable is an open source photography workflow application and raw developer.
  cs: darktable je open source aplikace pro pracovní postupy fotografování a vývoj RAW snímků.
  de: darktable ist eine quelloffene Anwendung für den fotografischen Workflow und die RAW-Entwicklung.
  es: darktable es una aplicación de código abierto para flujos de trabajo fotográfico y revelado RAW.
  fr: darktable est une application open source de flux de travail photographique et de développement RAW.
  id: darktable adalah aplikasi alur kerja fotografi sumber terbuka dan pengembang RAW.
  it: darktable è un'applicazione open source per il flusso di lavoro fotografico e lo sviluppo RAW.
  ja: darktableは、写真ワークフローアプリケーション兼RAW現像ソフトのオープンソースです。
  ko: darktable는 사진 워크플로 및 RAW 개발을 위한 오픈 소스 애플리케이션입니다.
  pl: darktable to aplikacja open source do obiegu pracy fotograficznej i rozwoju plików RAW.
  pt: O darktable é um aplicativo de código aberto para fluxo de trabalho fotográfico e desenvolvimento RAW.
  ro: darktable este o aplicație open source pentru fluxul de lucru foto și dezvoltarea fișierelor RAW.
  ru: darktable — это приложение с открытым исходным кодом для фотографического рабочего процесса и обработки RAW.
  th: darktable เป็นแอปพลิเคชันเวิร์กโฟลโฟโตแกราฟีแบบโอเพนซอร์สและตัวพัฒนาไฟล์ RAW
  tr: darktable, fotoğraf iş akışı ve RAW geliştirme için açık kaynaklı bir uygulamadır.
  uk: darktable — застосунок з відкритим кодом для фотографічного робочого процесу та розробки RAW.
  vi: darktable là ứng dụng mã nguồn mở cho quy trình nhiếp ảnh và phát triển ảnh RAW.
x:
  source: https://github.com/darktable-org/darktable
  eget: darktable-org/darktable
  apt: darktable
  dnf: darktable
  zypper: darktable
  port: darktable
  flatpak: flathub
  yay: darktable-git
rule:
  /eget:
    cmd: x eget darktable-org/darktable
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt install darktable
    reference: https://software.opensuse.org/download.html?project=graphics:darktable&package=darktable
  fedora/dnf:
    cmd: sudo dnf install darktable
    reference: https://software.opensuse.org/download.html?project=graphics:darktable&package=darktable
  opensuse/zypper:
    cmd: sudo zypper install darktable
    reference: https://software.opensuse.org/download.html?project=graphics:darktable&package=darktable
  ubuntu/apt:
    cmd: sudo apt install darktable
    reference: https://software.opensuse.org/download.html?project=graphics:darktable&package=darktable
  /flatpak:
    cmd: flatpak install flathub org.darktable.Darktable
    reference: https://flathub.org/apps/org.darktable.Darktable
  darwin/brew:
    cmd: brew install --cask darktable
    reference: https://www.darktable.org/install/
  darwin/port:
    cmd: sudo port install darktable +quartz
    reference: https://www.darktable.org/install/
  arch/yay:
    cmd: yay -S darktable-git
    reference: https://aur.archlinux.org/packages/darktable-git
binlist:
- darktable

