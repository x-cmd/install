lang: Go
homepage: https://github.com/tickstep/aliyunpan
license: Apache-2.0
desc:
  en: The command-line client of Alibaba Cloud Disk supports JavaScript plug-ins and synchronous backups
  cn: 阿里云盘命令行客户端，支持 JavaScript 插件，支持同步备份功能
  cs: Příkazový klient Alibaba Cloud Disk podporuje pluginy JavaScriptu a synchronizované zálohy
  de: Die Kommandozeilenanwendung von Alibaba Cloud Disk unterstützt JavaScript-Plugins und synchrone Backups
  es: El cliente de línea de comandos de Alibaba Cloud Disk admite complementos de JavaScript y copias de seguridad sincronizadas
  fr: Le client en ligne de commande d'Alibaba Cloud Disk prend en charge les plugins JavaScript et les sauvegardes synchronisées
  id: Klien baris perintah Alibaba Cloud Disk mendukung plugin JavaScript dan cadangan tersinkronisasi
  it: Il client della riga di comando di Alibaba Cloud Disk supporta i plugin JavaScript e i backup sincronizzati
  ja: Alibaba Cloud Disk のコマンドラインクライアントは JavaScript プラグインと同期バックアップに対応しています
  ko: Alibaba Cloud Disk의 명령줄 클라이언트는 JavaScript 플러그인과 동기화 백업을 지원합니다
  pl: Klient wiersza poleceń Alibaba Cloud Disk obsługuje wtyczki JavaScript i synchronizowane kopie zapasowe
  pt: O cliente de linha de comando do Alibaba Cloud Disk oferece suporte a plug-ins JavaScript e backups sincronizados
  ro: Clientul de linie de comandă al Alibaba Cloud Disk acceptă pluginuri JavaScript și copii de rezervă sincronizate
  ru: Командный клиент Alibaba Cloud Disk поддерживает плагины JavaScript и синхронное резервное копирование
  th: ไคลเอนต์บรรทัดคำสั่งของ Alibaba Cloud Disk รองรับปลั๊กอิน JavaScript และการสำรองข้อมูลแบบซิงค์
  tr: Alibaba Cloud Disk komut satırı istemcisi JavaScript eklentilerini ve eşzamanlı yedeklemeyi destekler
  uk: Командний клієнт Alibaba Cloud Disk підтримує плагіни JavaScript і синхронне резервне копіювання
  vi: Máy khách dòng lệnh của Alibaba Cloud Disk hỗ trợ plugin JavaScript và sao lưu đồng bộ
x:
  source: https://github.com/tickstep/aliyunpan
  eget: tickstep/aliyunpan
  dnf: aliyunpan
  brew: aliyunpan
  yum: aliyunpan
  scoop: main/aliyun
  winget: tickstep.aliyunpan
  yay: aliyunpan-go
rule:
  /eget:
    cmd: x eget tickstep/aliyunpan
    reference: https://x-cmd.com/mod/eget
  /wget:
    cmd: 'wget https://github.com/tickstep/aliyunpan/releases/download/v0.2.8/aliyunpan-v0.2.8-linux-amd64.zip \

      && unzip aliyunpan-v0.2.8-linux-amd64.zip \

      && cd aliyunpan-v0.2.8-linux-amd64 \

      && ./aliyunpan

      '
    reference: https://github.com/tickstep/aliyunpan?tab=readme-ov-file#%E7%9B%B4%E6%8E%A5%E4%B8%8B%E8%BD%BD%E5%AE%89%E8%A3%85
  /apt:
    cmd: sudo curl -fsSL http://file.tickstep.com/apt/pgp | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/tickstep-packages-archive-keyring.gpg > /dev/null && echo "deb [signed-by=/etc/apt/trusted.gpg.d/tickstep-packages-archive-keyring.gpg arch=amd64,arm64] http://file.tickstep.com/apt aliyunpan main" | sudo tee /etc/apt/sources.list.d/tickstep-aliyunpan.list > /dev/null && sudo apt-get update && sudo apt-get install -y aliyunpan
    reference: https://github.com/tickstep/aliyunpan?tab=readme-ov-file#apt%E5%AE%89%E8%A3%85
  /yum:
    cmd: sudo curl -fsSL http://file.tickstep.com/rpm/aliyunpan/aliyunpan.repo | sudo tee /etc/yum.repos.d/tickstep-aliyunpan.repo > /dev/null && sudo yum install aliyunpan -y
    reference: https://github.com/tickstep/aliyunpan?tab=readme-ov-file#yum%E5%AE%89%E8%A3%85
  darwin/brew:
    cmd: brew install aliyunpan
    reference: https://github.com/tickstep/aliyunpan?tab=readme-ov-file#brew%E5%AE%89%E8%A3%85
  (win|wsl2)/winget:
    cmd: x winget install tickstep.aliyunpan --silent
    reference: https://github.com/tickstep/aliyunpan?tab=readme-ov-file#winget%E5%AE%89%E8%A3%85
  (win|wsl2)/scoop:
    cmd: x scoop install main/aliyun
    reference: https://scoop.sh/#/apps?q=aliyun
  arch/yay:
    cmd: yay -S aliyunpan-go
    reference: https://aur.archlinux.org/packages/aliyunpan-go
binlist:
- aliyunpan

