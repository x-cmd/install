lang: TyperScript
homepage: https://github.com/immich-app/immich
license: AGPL-3.0
desc:
  cn: 高性能的照片和视频自托管解决方案
  en: High performance self-hosted photo and video management solution
x:
  source: https://github.com/immich-app/immich
  eget: immich-app/immich
rule:
  /eget:
    cmd: x eget immich-app/immich
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -o- https://raw.githubusercontent.com/immich-app/immich/main/install.sh | bash
    reference: https://immich.app/docs/install/script
binlist:
- immich

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 430 KB
          rating: 1
          desc:
            cn: 约 430 KB（估算）
            en: ~430 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
