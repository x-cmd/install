lang: TyperScript
homepage: https://github.com/immich-app/immich
license: AGPL-3.0
desc:
  cn: 高性能的照片和视频自托管解决方案
  en: High performance self-hosted photo and video management solution
  cs: Vysoce výkonné řešení pro vlastní správu fotografií a videí
  de: Hochleistungsfähige Self-Hosted-Lösung zur Verwaltung von Fotos und Videos
  es: Solución de gestión de fotos y vídeos autohospedada y de alto rendimiento
  fr: Solution d'hébergement autonome de gestion des photos et vidéos performante
  id: Solusi manajemen foto dan video self-hosted berkinerja tinggi
  it: Soluzione self-hosted ad alte prestazioni per la gestione di foto e video
  ja: 高性能なセルフホスト型の写真・動画管理ソリューション
  ko: 고성능 셀프호스팅 사진 및 동영상 관리 솔루션
  pl: Wydajne, samodzielnie hostowane rozwiązanie do zarządzania zdjęciami i wideo
  pt: Solução de gerenciamento de fotos e vídeos auto-hospedada e de alto desempenho
  ro: Soluție de găzduire proprie, de înaltă performanță, pentru gestionarea fotografiilor și videoclipurilor
  ru: Высокопроизводительное решение для самостоятельного размещения и управления фото и видео
  th: โซลูชันจัดการรูปภาพและวิดีโอแบบซีล์ฟโฮสต์ที่มีประสิทธิภาพสูง
  tr: Yüksek performanslı, self-hosted fotoğraf ve video yönetimi çözümü
  uk: Високопродуктивне рішення для самостійного розміщення та керування фото й відео
  vi: Giải pháp quản lý ảnh và video tự lưu trữ, hiệu năng cao
x:
  source: https://github.com/immich-app/immich
  eget: immich-app/immich
rule:
  /eget:
    cmd: x eget immich-app/immich
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -o- https://raw.githubusercontent.com/immich-app/immich/main/install.sh | bash
    reference: https://immich.app/docs/install/script
binlist:
- immich

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 430 KB
          rating: 1
          desc:
            cn: 约 430 KB（估算）
            en: ~430 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
