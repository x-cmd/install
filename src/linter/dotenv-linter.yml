lang: Rust
homepage: https://github.com/dotenv-linter/dotenv-linter
license: MIT
desc:
  cn: dotenv-linter 可以检查/修复/比较 .env 文件是否存在可能导致应用程序故障的问题
  en: dotenv-linter can check / fix / compare .env files for problems that may cause the application to malfunction
x:
  pkg:
    exist: true
  source: https://github.com/dotenv-linter/dotenv-linter
  eget: https://github.com/dotenv-linter/dotenv-linter
rule:
  /x:
    cmd: x pkg use dotenv-linter
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dotenv-linter/dotenv-linter
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S dotenv-linter-bin
    reference: https://aur.archlinux.org/packages/dotenv-linter-bin
  /curl:
    cmd: curl -sSfL https://git.io/JLbXn | sh -s
    reference: https://github.com/dotenv-linter/dotenv-linter?tab=readme-ov-file#pre-compiled-binary
  /wget:
    cmd: wget -q -O - https://git.io/JLbXn | sh -s
    reference: https://github.com/dotenv-linter/dotenv-linter?tab=readme-ov-file#pre-compiled-binary
binlist:
- dotenv-linter

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 269 KB
          rating: 1
          desc:
            cn: 约 269 KB（估算）
            en: ~269 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
