lang: TypeScript
homepage: https://github.com/streetsidesoftware/cspell
license: MIT
desc:
  cn: CSpell 代码拼写检查器
  en: CSpell a spell checker for code
x:
  pkg:
    exist: true
  source: https://github.com/streetsidesoftware/cspell
rule:
  /x:
    cmd: x pkg use cspell
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g cspell@latest
    reference: https://cspell.org/docs/installation/#npm-global
    dsnap: cspell
binlist:
- cspell
