lang: TypeScript
homepage: https://github.com/streetsidesoftware/cspell
license: MIT
desc:
  cn: CSpell 代码拼写检查器
  en: CSpell a spell checker for code
x:
  pkg:
    exist: true
  source: https://github.com/streetsidesoftware/cspell
rule:
  /x:
    cmd: x pkg use cspell
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g cspell@latest
    reference: https://cspell.org/docs/installation/#npm-global
    dsnap: cspell
binlist:
- cspell

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
