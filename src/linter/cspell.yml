lang: TypeScript
homepage: https://github.com/streetsidesoftware/cspell
license: MIT
desc:
  cn: CSpell 代码拼写检查器
  en: CSpell a spell checker for code
  cs: CSpell je kontrola pravopisu pro kód
  de: CSpell ist ein Rechtschreibprüfer für Code
  es: CSpell es un corrector ortográfico para código
  fr: CSpell est un correcteur orthographique pour le code
  id: CSpell adalah pemeriksa ejaan untuk kode
  it: CSpell è un correttore ortografico per il codice
  ja: CSpell はコード向けのスペルチェッカーです
  ko: CSpell은 코드를 위한 철자 검사기입니다
  pl: CSpell to sprawdzacz pisowni dla kodu
  pt: CSpell é um verificador ortográfico para código
  ro: CSpell este un verificator ortografic pentru cod
  ru: CSpell — это проверка орфографии для кода
  th: CSpell คือตัวตรวจการสะกดสำหรับโค้ด
  tr: CSpell, kod için bir yazım denetleyicisidir
  uk: CSpell — це перевіряч орфографії для коду
  vi: CSpell là trình kiểm tra chính tả cho mã nguồn
x:
  source: https://github.com/streetsidesoftware/cspell
  npm: cspell@latest
rule:
  /x:
    cmd: x pkg use cspell
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g cspell@latest
    reference: https://cspell.org/docs/installation/#npm-global
    dsnap: cspell
binlist:
- cspell

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 223 KB
          rating: 1
          desc:
            cn: 约 223 KB（估算）
            en: ~223 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
