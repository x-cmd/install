lang: TypeScript
homepage: https://github.com/streetsidesoftware/cspell
license: MIT
desc:
  cn: CSpell 代码拼写检查器
  en: CSpell a spell checker for code
x:
  pkg:
    exist: true
  source: https://github.com/streetsidesoftware/cspell
rule:
  /x:
    cmd: x pkg use cspell
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g cspell@latest
    reference: https://cspell.org/docs/installation/#npm-global
    dsnap: cspell
binlist:
- cspell

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 223 KB
          rating: 1
          desc:
            cn: 约 223 KB（估算）
            en: ~223 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
