lang: Python
homepage: https://github.com/tconbeer/sqlfmt
desc:
  cn: SQL 的格式化工具
  en: SQL formatting tool
x:
  pkg:
    exist: true
  source: https://github.com/tconbeer/sqlfmt
  eget: https://github.com/tconbeer/sqlfmt
rule:
  /eget:
    cmd: x eget tconbeer/sqlfmt
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use sqlfmt
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S python-shandy-sqlfmt
    reference: https://aur.archlinux.org/packages/python-shandy-sqlfmt
  /pipx:
    cmd: pipx install shandy-sqlfmt
    reference: https://github.com/tconbeer/sqlfmt?tab=readme-ov-file#install-using-pipx-recommended
binlist:
- sqlfmt
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
