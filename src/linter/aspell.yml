lang: rescript
homepage: https://github.com/GNUAspell/aspell
license: LGPL-2.1
desc:
  cn: GNU Aspell 是一个自由和开源的拼写检查器，旨在最终取代 Ispell
  en: GNU Aspell is a Free and Open Source spell checker designed to eventually replace Ispell
  cs: GNU Aspell je svobodný kontrolor pravopisu s otevřeným zdrojovým kódem, navržený k postupnému nahrazení Ispell
  de: GNU Aspell ist ein freier und quelloffener Rechtschreibprüfer, der darauf abzielt, Ispell langfristig zu ersetzen
  es: GNU Aspell es un corrector ortográfico libre y de código abierto diseñado para acabar sustituyendo a Ispell
  fr: GNU Aspell est un correcteur orthographique libre et open source conçu pour remplacer à terme Ispell
  id: GNU Aspell adalah pemeriksa ejaan gratis dan sumber terbuka yang dirancang untuk akhirnya menggantikan Ispell
  it: GNU Aspell è un correttore ortografico libero e open source progettato per sostituire definitivamente Ispell
  ja: GNU Aspell は Ispell の置き換えを目的にした、自由でオープンソースのスペルチェッカーです
  ko: GNU Aspell은 Ispell을 결국 대체하기 위해 설계된 자유 및 오픈 소스 철자 검사기입니다
  pl: GNU Aspell to wolny i otwartoźródłowy sprawdzacz pisowni, zaprojektowany w celu ostatecznego zastąpienia Ispell
  pt: GNU Aspell é um verificador ortográfico livre e de código aberto projetado para substituir eventualmente o Ispell
  ro: GNU Aspell este un verificator ortografic liber și open source, conceput pentru a înlocui în cele din urmă Ispell
  ru: GNU Aspell — это свободная программная проверка орфографии с открытым исходным кодом, созданная для постепенной замены Ispell
  th: GNU Aspell เป็นตัวตรวจการสะกดที่เสรีและมีซอร์สโค้ดเปิด ออกแบบมาเพื่อค่อย ๆ แทนที่ Ispell
  tr: GNU Aspell, nihayetinde Ispell'in yerini almayı amaçlayan özgür ve açık kaynaklı bir yazım denetleyicisidir
  uk: GNU Aspell — це вільний та з відкритим кодом перевіряч орфографії, створений для поступової заміни Ispell
  vi: GNU Aspell là trình kiểm tra chính tả miễn phí và mã nguồn mở, được thiết kế để dần thay thế Ispell
x:
  source: https://github.com/GNUAspell/aspell
  eget: GNUAspell/aspell
  brew: aspell
  scoop: aspell
rule:
  /eget:
    cmd: x eget GNUAspell/aspell
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install aspell
    reference: https://formulae.brew.sh/formula/aspell#default
  (win|wsl2)/scoop:
    cmd: x scoop install aspell
    reference: https://scoop.sh/#/apps?q=aspell
binlist:
- aspell

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.8 MB
          rating: 1
          desc:
            cn: 约 1.8 MB（估算）
            en: ~1.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
