lang: rescript
homepage: https://github.com/GNUAspell/aspell
license: LGPL-2.1
desc:
  cn: GNU Aspell 是一个自由和开源的拼写检查器，旨在最终取代 Ispell
  en: GNU Aspell is a Free and Open Source spell checker designed to eventually replace Ispell
x:
  source: https://github.com/GNUAspell/aspell
  eget: https://github.com/GNUAspell/aspell
  brew: aspell
rule:
  /eget:
    cmd: x eget GNUAspell/aspell
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install aspell
    reference: https://formulae.brew.sh/formula/aspell#default
  (win|wsl2)/scoop:
    cmd: x scoop install aspell
    reference: https://scoop.sh/#/apps?q=aspell
binlist:
- aspell

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.8 MB
          rating: 1
          desc:
            cn: 约 1.8 MB（估算）
            en: ~1.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
