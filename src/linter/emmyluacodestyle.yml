lang: C++
homepage: https://github.com/CppCXY/EmmyLuaCodeStyle
license: MIT
desc:
  cn: 快速、强大且功能丰富的 Lua 格式化和检查工具
  en: fast, powerful, and feature-rich Lua formatting and checking tool
x:
  pkg:
    exist: true
  source: https://github.com/CppCXY/EmmyLuaCodeStyle
  eget: https://github.com/CppCXY/EmmyLuaCodeStyle
rule:
  /eget:
    cmd: x eget CppCXY/EmmyLuaCodeStyle
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use emmyluacodestyle
    reference: https://x-cmd.com/install/
  (linux|darwin|win|wsl2)/:
    cmd: x env use emmyluacodestyle
    reference: https://x-cmd.com/mod/env
binlist:
- emmyluacodestyle

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
