lang: Rust
desc:
  cn: 一个非常快的 Python linter 和代码格式化程序
  en: A very fast Python linter and code formatter
  cs: Velmi rychlý Python linter a formátovač kódu
  de: Ein sehr schneller Python-Linter und Codeformatter
  es: Un linter y formateador de código Python muy rápido
  fr: Un linter et formateur de code Python très rapide
  id: Linter dan pemformat kode Python yang sangat cepat
  it: Un linter e formattatore di codice Python molto veloce
  ja: 非常に高速な Python linter 兼コードフォーマッタ
  ko: 매우 빠른 Python linter이자 코드 포매터
  pl: Bardzo szybki linter i formater kodu Python
  pt: Um linter e formatador de código Python muito rápido
  ro: Un linter și formatator de cod Python foarte rapid
  ru: Очень быстрый линтер и форматтер кода Python
  th: ตัว lint และจัดรูปแบบโค้ด Python ที่เร็วมาก
  tr: Çok hızlı bir Python linter ve kod biçimlendiricisi
  uk: Дуже швидкий лінтер і форматтер коду Python
  vi: Trình lint và định dạng mã Python rất nhanh
homepage: https://github.com/astral-sh/ruff
license: MIT
x:
  source: https://github.com/astral-sh/ruff
  eget: astral-sh/ruff
  brew: ruff
  pip: ruff
rule:
  /x:
    cmd: x pkg use ruff
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget astral-sh/ruff
    reference: https://x-cmd.com/mod/eget
  (linux|darwin)/curl:
    cmd: curl -sSf https://install.astral.sh/ruff | sh
    reference: https://docs.astral.sh/ruff/installation/#installing-ruff
  win/:
    cmd: powershell -c "irm https://astral.sh/ruff/install.ps1 | iex"
    reference: https://docs.astral.sh/ruff/installation/#installing-ruff
  /pipx:
    cmd: pipx install ruff
    reference: https://docs.astral.sh/ruff/installation/#installing-ruff
  /pip:
    cmd: pip install ruff
    reference: https://docs.astral.sh/ruff/installation/#installing-ruff
    dsnap: ruff
  /brew:
    cmd: brew install ruff
    reference: https://docs.astral.sh/ruff/installation/#installing-ruff
  /conda:
    cmd: conda install -c conda-forge ruff
    reference: https://docs.astral.sh/ruff/installation/#installing-ruff
binlist:
- ruff

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 MB
          rating: 2
          desc:
            cn: 安装 23 MB
            en: 23 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 11 MB
        desc:
          cn: 11 MB
          en: 11 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
