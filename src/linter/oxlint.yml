lang: Rust
homepage: https://github.com/oxc-project/oxc
license: MIT
desc:
  cn: Oxlint 旨在捕获错误或无用的代码，默认情况下不需要任何配置
  en: Oxlint is designed to catch erroneous or useless code without requiring any configurations by default
x:
  source: https://github.com/oxc-project/oxc
  eget: oxc-project/oxc
  yay: oxlint
rule:
  /eget:
    cmd: x eget oxc-project/oxc
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use oxlint
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S oxlint
    reference: https://aur.archlinux.org/packages/oxlint
  /npm:
    cmd: npm add -g oxlint
    reference: https://oxc-project.github.io/docs/guide/usage/linter.html#installation
    dsnap: oxlint
  /npx:
    cmd: npx oxlint@latest
    reference: https://oxc-project.github.io/docs/guide/usage/linter.html#installation
binlist:
- oxlint

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
