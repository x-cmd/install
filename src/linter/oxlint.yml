lang: Rust
homepage: https://github.com/oxc-project/oxc
license: MIT
desc:
  cn: Oxlint 旨在捕获错误或无用的代码，默认情况下不需要任何配置
  en: Oxlint is designed to catch erroneous or useless code without requiring any configurations by default
  cs: Oxlint je navržen tak, aby zachytil chybný nebo zbytečný kód bez jakékoli výchozí konfigurace
  de: Oxlint ist darauf ausgelegt, fehlerhaften oder nutzlosen Code zu erkennen, ohne standardmäßig Konfigurationen zu benötigen
  es: Oxlint está diseñado para detectar código erróneo o inútil sin necesidad de configuraciones por defecto
  fr: Oxlint est conçu pour détecter le code erroné ou inutile sans aucune configuration par défaut
  id: Oxlint dirancang untuk menangkap kode yang salah atau tidak berguna tanpa memerlukan konfigurasi apa pun secara bawaan
  it: Oxlint è progettato per individuare codice errato o inutile senza richiedere alcuna configurazione per impostazione predefinita
  ja: Oxlint は、デフォルトで設定を必要とせず、誤ったコードや無用なコードを検出するように設計されています
  ko: Oxlint는 기본적으로 어떤 설정도 요구하지 않고 잘못되거나 쓸모없는 코드를 잡아내도록 설계되었습니다
  pl: Oxlint jest zaprojektowany do wykrywania błędnego lub zbędnego kodu bez wymagania jakiejkolwiek konfiguracji domyślnie
  pt: Oxlint foi projetado para detectar código errôneo ou inútil sem exigir nenhuma configuração por padrão
  ro: Oxlint este conceput pentru a detecta cod eronat sau inutil fără a necesita nicio configurație în mod implicit
  ru: Oxlint создан для обнаружения ошибочного или бесполезного кода и по умолчанию не требует никакой настройки
  th: Oxlint ถูกออกแบบมาเพื่อจับโค้ดที่ผิดพลาดหรือไม่มีประโยชน์ โดยไม่ต้องมีการตั้งค่าใด ๆ โดยค่าเริ่มต้น
  tr: Oxlint, varsayılan olarak herhangi bir yapılandırma gerektirmeden hatalı veya işe yaramaz kodları yakalamak için tasarlanmıştır
  uk: Oxlint створено для виявлення помилкового або зайвого коду і за замовчуванням не потребує жодної настройки
  vi: Oxlint được thiết kế để phát hiện mã sai hoặc vô dụng mà không cần bất kỳ cấu hình nào theo mặc định
x:
  source: https://github.com/oxc-project/oxc
  eget: oxc-project/oxc
  yay: oxlint
rule:
  /eget:
    cmd: x eget oxc-project/oxc
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use oxlint
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S oxlint
    reference: https://aur.archlinux.org/packages/oxlint
  /npm:
    cmd: npm add -g oxlint
    reference: https://oxc-project.github.io/docs/guide/usage/linter.html#installation
    dsnap: oxlint
  /npx:
    cmd: npx oxlint@latest
    reference: https://oxc-project.github.io/docs/guide/usage/linter.html#installation
binlist:
- oxlint

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
