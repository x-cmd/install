lang: Rust
homepage: https://github.com/oxc-project/oxc
license: MIT
desc:
  cn: Oxlint 旨在捕获错误或无用的代码，默认情况下不需要任何配置
  en: Oxlint is designed to catch erroneous or useless code without requiring any configurations by default
x:
  pkg:
    exist: true
  source: https://github.com/oxc-project/oxc
  eget: https://github.com/oxc-project/oxc
rule:
  /eget:
    cmd: x eget oxc-project/oxc
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use oxlint
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S oxlint
    reference: https://aur.archlinux.org/packages/oxlint
  /npm:
    cmd: npm add -g oxlint
    reference: https://oxc-project.github.io/docs/guide/usage/linter.html#installation
    dsnap: oxlint
  /npx:
    cmd: npx oxlint@latest
    reference: https://oxc-project.github.io/docs/guide/usage/linter.html#installation
binlist:
- oxlint

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
