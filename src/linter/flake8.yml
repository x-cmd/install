lang: Python
homepage: https://github.com/pycqa/flake8
desc:
  cn: flake8 是一个 python 工具，它将 pycodestyle、pyflakes、mccabe 和第三方插件粘合在一起，用于检查某些 python 代码的风格和质量
  en: flake8 is a python tool that glues together pycodestyle, pyflakes, mccabe, and third-party plugins to check the style and quality of some python code
x:
  source: https://github.com/pycqa/flake8
rule:
  /pip:
    cmd: python -m pip install flake8
    reference: https://flake8.pycqa.org/en/latest/index.html#quickstart
    dsnap: flake8
binlist:
- flake8
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
