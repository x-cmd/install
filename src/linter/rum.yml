lang: 'Go'
homepage: https://github.com/thekarel/rum
license: 'MIT'
desc:
  cn: 列出、搜索并运行 package.json 脚本的 TUI
  en: 'TUI to list, search and run package.json scripts 🥃'
  cs: TUI pro výpis, vyhledávání a spouštění skriptů z package.json
  de: TUI zum Auflisten, Suchen und Ausführen von package.json-Skripten
  es: TUI para listar, buscar y ejecutar scripts de package.json
  fr: TUI pour lister, rechercher et exécuter les scripts package.json
  id: TUI untuk melihat, mencari, dan menjalankan skrip package.json
  it: TUI per elencare, cercare ed eseguire gli script di package.json
  ja: package.json のスクリプトを一覧・検索・実行する TUI
  ko: package.json 스크립트를 나열하고 검색하고 실행하는 TUI
  pl: TUI do listowania, wyszukiwania i uruchamiania skryptów z package.json
  pt: TUI para listar, pesquisar e executar scripts do package.json
  ro: TUI pentru listarea, căutarea și rularea scripturilor din package.json
  ru: TUI для вывода, поиска и запуска скриптов package.json
  th: TUI สำหรับแสดงรายการ ค้นหา และรันสคริปต์ใน package.json
  tr: package.json betiklerini listelemek, aramak ve çalıştırmak için TUI
  uk: TUI для виведення, пошуку та запуску скриптів package.json
  vi: Giao diện TUI để liệt kê, tìm kiếm và chạy các script trong package.json
x:
  source: https://github.com/thekarel/rum
  eget: thekarel/rum
rule:
  /eget:
    cmd: x eget thekarel/rum
    reference: https://github.com/thekarel/rum
binlist:
- 'rum'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
