lang: 'Go'
homepage: https://github.com/thekarel/rum
license: 'MIT'
desc:
  cn: 列出、搜索并运行 package.json 脚本的 TUI
  en: 'TUI to list, search and run package.json scripts 🥃'
x:
  source: https://github.com/thekarel/rum
  eget: https://github.com/thekarel/rum
rule:
  /eget:
    cmd: x eget thekarel/rum
    reference: https://github.com/thekarel/rum
binlist:
- 'rum'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
