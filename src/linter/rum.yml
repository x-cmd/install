lang: 'Go'
homepage: https://github.com/thekarel/rum
license: 'MIT'
desc:
  cn: 列出、搜索并运行 package.json 脚本的 TUI
  en: 'TUI to list, search and run package.json scripts 🥃'
x:
  source: https://github.com/thekarel/rum
  eget: https://github.com/thekarel/rum
rule:
  /eget:
    cmd: x eget thekarel/rum
    reference: https://github.com/thekarel/rum
binlist:
  - 'rum'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
