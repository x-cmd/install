lang: Go
homepage: https://github.com/mvdan/gofumpt
license: BSD-3-Clause
desc:
  cn: 更为严格的 gofumpt
  en: A stricter gofmt
x:
  pkg:
    exist: true
  source: https://github.com/mvdan/gofumpt
  eget: https://github.com/mvdan/gofumpt
rule:
  /x:
    cmd: x pkg use gofumpt
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget mvdan/gofumpt
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S gofumpt-git
    reference: https://aur.archlinux.org/packages/gofumpt-git
  /asdf:
    cmd: x asdf use gofumpt
    reference: https://github.com/looztra/asdf-gofumpt
  /go:
    cmd: go install mvdan.cc/gofumpt@latest
    reference: https://github.com/mvdan/gofumpt?tab=readme-ov-file#gofumpt
    dsnap: mvdan.cc/gofumpt@latest
binlist:
- gofumpt

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
