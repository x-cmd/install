lang: Rust
homepage: https://github.com/hisbaan/didyoumean
license: GPL-3.0
desc:
  cn: DidYouMean（或 dym）是一个用 Rust 编写的命令行拼写校正器，利用 Damerau-Levenshtein 距离的简化版本
  en: DidYouMean (or dym) is a command-line spelling corrector written in rust utilizing a simplified version of Damerau-Levenshtein distance
x:
  source: https://github.com/hisbaan/didyoumean
  eget: https://github.com/hisbaan/didyoumean
rule:
  /eget:
    cmd: x eget hisbaan/didyoumean
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S didyoumean
    reference: https://aur.archlinux.org/packages/didyoumean
  /cargo:
    cmd: cargo install didyoumean
    reference: https://github.com/hisbaan/didyoumean?tab=readme-ov-file#cargo
    dsnap: didyoumean
  darwin/brew:
    cmd: 'brew tap hisbaan/tap \

      && brew install didyoumean

      '
    reference: https://github.com/hisbaan/didyoumean?tab=readme-ov-file#homebrew-macos
  /nixpkgs:
    cmd: nix-env install -iA nixpkgs.didyoumean
    reference: https://github.com/hisbaan/didyoumean?tab=readme-ov-file#nixos
binlist:
- didyoumean

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
