lang: JavaScript
homepage: https://github.com/lint-staged
desc:
  cn: 在 git 暂存文件上运行 linters
  en: Run linters on git staged files
rule:
  /npm:
    cmd: npm install --save-dev lint-staged
    reference: https://github.com/lint-staged/lint-staged?tab=readme-ov-file#installation-and-setup
    dsnap: lint-staged
binlist:
- lint-staged
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
