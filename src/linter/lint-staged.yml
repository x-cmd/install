lang: JavaScript
homepage: https://github.com/lint-staged
desc:
  cn: 在 git 暂存文件上运行 linters
  en: Run linters on git staged files
rule:
  /npm:
    cmd: npm install --save-dev lint-staged
    reference: https://github.com/lint-staged/lint-staged?tab=readme-ov-file#installation-and-setup
    dsnap: lint-staged
binlist:
- lint-staged
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
