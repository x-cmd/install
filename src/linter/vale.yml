lang: Go
homepage: https://github.com/errata-ai/vale
license: MIT
desc:
  cn: 文本质量检查工具（类似代码的 linting），用于在写作过程中识别和修复文本中的问题，比如语法错误、风格问题、一致性和标准性问题等
  en: A markup-aware linter for prose built with speed and extensibility in mind
x:
  pkg:
    exist: true
  source: https://github.com/errata-ai/vale
  eget: https://github.com/errata-ai/vale
rule:
  /x:
    cmd: x pkg use vale
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget errata-ai/vale
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use vale
    reference: https://github.com/pdemagny/asdf-vale
  darwin/brew:
    cmd: brew install vale
    reference: https://vale.sh/docs/vale-cli/installation/#package-managers
  /wget:
    cmd: 'wget https://github.com/errata-ai/vale/releases/download/v2.28.0/vale_2.28.0_Linux_64-bit.tar.gz \

      && mkdir bin \

      && tar -xvzf vale_2.28.0_Linux_64-bit.tar.gz -C bin \

      && export PATH=./bin:"$PATH"

      '
    reference: https://vale.sh/docs/vale-cli/installation/#github-releases
  (win|wsl2)/choco:
    cmd: x choco install vale
    reference: https://vale.sh/docs/vale-cli/installation/#package-managers
binlist:
- vale
