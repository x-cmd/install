lang: Rust
homepage: https://github.com/ast-grep/ast-grep
license: MIT
desc:
  cn: ast-grep(sg) 是一个快速、多语言的工具，用于大规模的代码结构化搜索、 lint 和重写
  en: ast-grep(sg) is a fast and polyglot tool for code structural search, lint, rewriting at large scale
x:
  source: https://github.com/ast-grep/ast-grep
  eget: https://github.com/ast-grep/ast-grep
  brew: ast-grep
  scoop: ast-grep
  yay: ast-grep-bin
  pip: ast-grep-cli
  cargo: ast-grep
rule:
  /eget:
    cmd: x eget ast-grep/ast-grep
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S ast-grep-bin
    reference: https://aur.archlinux.org/packages/ast-grep-bin
  darwin/brew:
    cmd: brew install ast-grep
    reference: https://ast-grep.github.io/guide/quick-start.html#installation
  /cargo:
    cmd: cargo install ast-grep
    reference: https://ast-grep.github.io/guide/quick-start.html#installation
    dsnap: ast-grep
  /npm:
    cmd: npm i @ast-grep/cli -g
    reference: https://ast-grep.github.io/guide/quick-start.html#installation
  /pip:
    cmd: pip install ast-grep-cli
    reference: https://ast-grep.github.io/guide/quick-start.html#installation
  (win|wsl2)/scoop:
    cmd: x scoop install ast-grep
    reference: https://scoop.sh/#/apps?q=ast-grep
binlist:
- ast-grep

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
