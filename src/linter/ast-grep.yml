lang: Rust
homepage: https://github.com/ast-grep/ast-grep
license: MIT
desc:
  cn: ast-grep(sg) 是一个快速、多语言的工具，用于大规模的代码结构化搜索、 lint 和重写
  en: ast-grep(sg) is a fast and polyglot tool for code structural search, lint, rewriting at large scale
  cs: ast-grep(sg) je rychlý a vícejazyčný nástroj pro strukturální vyhledávání v kódu, lint a přepisování ve velkém měřítku
  de: ast-grep(sg) ist ein schnelles, mehrsprachiges Werkzeug für strukturelle Code-Suche, Linting und großmaßstäbliches Umschreiben
  es: ast-grep(sg) es una herramienta rápida y multilingüe para la búsqueda estructural de código, el lint y la reescritura a gran escala
  fr: ast-grep(sg) est un outil rapide et multilingue pour la recherche structurelle de code, le lint et la réécriture à grande échelle
  id: ast-grep(sg) adalah alat cepat dan poliglot untuk pencarian struktural kode, lint, dan penulisan ulang dalam skala besar
  it: ast-grep(sg) è uno strumento veloce e poliglotta per la ricerca strutturale nel codice, il lint e la riscrittura su larga scala
  ja: ast-grep(sg) は、大規模なコードの構造化検索、lint、書き換えのための高速なマルチ言語ツールです
  ko: ast-grep(sg)는 대규모 코드 구조 검색, 린팅 및 재작성을 위한 빠르고 다국어 도구입니다
  pl: ast-grep(sg) to szybkie i wielojęzyczne narzędzie do strukturalnego wyszukiwania w kodzie, lintowania i przepisywania na dużą skalę
  pt: ast-grep(sg) é uma ferramenta rápida e multilíngue para busca estrutural de código, lint e reescrita em grande escala
  ro: ast-grep(sg) este un instrument rapid și poliglot pentru căutare structurală în cod, lint și rescriere la scară largă
  ru: ast-grep(sg) — это быстрый многоязычный инструмент для структурного поиска в коде, линтинга и массового переписывания
  th: ast-grep(sg) คือเครื่องมือที่รวดเร็วและรองรับหลายภาษา สำหรับค้นหาโครงสร้างโค้ด ตรวจ lint และเขียนโค้ดใหม่ในระดับขนาดใหญ่
  tr: ast-grep(sg), büyük ölçekte kodda yapısal arama, lint ve yeniden yazma için hızlı ve çok dilli bir araçtır
  uk: ast-grep(sg) — це швидкий багатомовний інструмент для структурного пошуку в коді, лінтингу та масового переписування
  vi: ast-grep(sg) là công cụ nhanh và đa ngôn ngữ cho tìm kiếm cấu trúc mã, lint và viết lại ở quy mô lớn
x:
  source: https://github.com/ast-grep/ast-grep
  eget: ast-grep/ast-grep
  brew: ast-grep
  scoop: ast-grep
  yay: ast-grep-bin
  pip: ast-grep-cli
  cargo: ast-grep
rule:
  /eget:
    cmd: x eget ast-grep/ast-grep
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S ast-grep-bin
    reference: https://aur.archlinux.org/packages/ast-grep-bin
  darwin/brew:
    cmd: brew install ast-grep
    reference: https://ast-grep.github.io/guide/quick-start.html#installation
  /cargo:
    cmd: cargo install ast-grep
    reference: https://ast-grep.github.io/guide/quick-start.html#installation
    dsnap: ast-grep
  /npm:
    cmd: npm i @ast-grep/cli -g
    reference: https://ast-grep.github.io/guide/quick-start.html#installation
  /pip:
    cmd: pip install ast-grep-cli
    reference: https://ast-grep.github.io/guide/quick-start.html#installation
  (win|wsl2)/scoop:
    cmd: x scoop install ast-grep
    reference: https://scoop.sh/#/apps?q=ast-grep
binlist:
- ast-grep

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
