homepage: https://github.com/prettier/prettier
license: MIT
lang: JavaScript
desc:
  cn: Prettier 是一个固执, 严格的代码格式化工具
  en: Prettier is an opinionated code formatter
x:
  pkg:
    exist: true
  source: https://github.com/prettier/prettier
rule:
  /x:
    cmd: x pkg use prettier
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g prettier
    reference: https://prettier.io/docs/en/install
    dsnap: prettier
  darwin/brew:
    cmd: brew install prettier
    reference: https://formulae.brew.sh/formula/prettier#default
binlist:
- prettier

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 87 KB
          rating: 1
          desc:
            cn: 约 87 KB（估算）
            en: ~87 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
