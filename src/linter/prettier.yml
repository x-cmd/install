homepage: https://github.com/prettier/prettier
license: MIT
lang: JavaScript
desc:
  cn: Prettier 是一个固执, 严格的代码格式化工具
  en: Prettier is an opinionated code formatter
x:
  pkg:
    exist: true
  source: https://github.com/prettier/prettier
rule:
  /x:
    cmd: x pkg use prettier
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g prettier
    reference: https://prettier.io/docs/en/install
    dsnap: prettier
  darwin/brew:
    cmd: brew install prettier
    reference: https://formulae.brew.sh/formula/prettier#default
binlist:
- prettier

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
