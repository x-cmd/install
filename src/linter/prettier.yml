homepage: https://github.com/prettier/prettier
license: MIT
lang: JavaScript
desc:
  cn: Prettier 是一个固执, 严格的代码格式化工具
  en: Prettier is an opinionated code formatter
  cs: Prettier je formátovač kódu s vlastním názorem
  de: Prettier ist ein opinionierter Codeformatter
  es: Prettier es un formateador de código con opiniones firmes
  fr: Prettier est un formateur de code aux avis tranchés
  id: Prettier adalah pemformat kode yang beropini kuat
  it: Prettier è un formattatore di codice dalle opinioni decise
  ja: Prettier は固执なコードフォーマッタです
  ko: Prettier는 자체 스타일이 강한 코드 포매터입니다
  pl: Prettier to formatter kodu o wyraźnych poglądach
  pt: Prettier é um formatador de código com opiniões fortes
  ro: Prettier este un formatator de cod cu opinii bine conturate
  ru: Prettier — форматтер кода с собственными строгими правилами
  th: Prettier คือตัวจัดรูปแบบโค้ดที่ยึดความคิดเห็นของตนอย่างชัดเจน
  tr: Prettier, kendi görüşünü dayanan bir kod biçimlendiricidir
  uk: Prettier — форматтер коду з власними суворими правилами
  vi: Prettier là công cụ định dạng mã theo quan điểm riêng
x:
  source: https://github.com/prettier/prettier
  brew: prettier
  npm: prettier
rule:
  /x:
    cmd: x pkg use prettier
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g prettier
    reference: https://prettier.io/docs/en/install
    dsnap: prettier
  darwin/brew:
    cmd: brew install prettier
    reference: https://formulae.brew.sh/formula/prettier#default
binlist:
- prettier

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 87 KB
          rating: 1
          desc:
            cn: 约 87 KB（估算）
            en: ~87 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
