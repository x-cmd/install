lang: Go
homepage: https://github.com/golangci/golangci-lint
license: GPL-3.0
desc:
  cn: golangci-lint 是一个快速的 Go linter 运行器
  en: golangci-lint is a fast Go linters runner
  cs: golangci-lint je rychlý běhový prostředí pro Go lintery
  de: golangci-lint ist ein schneller Runner für Go-Linter
  es: golangci-lint es un ejecutor rápido de linters de Go
  fr: golangci-lint est un exécuteur rapide de linters Go
  id: golangci-lint adalah runner cepat untuk linter Go
  it: golangci-lint è un veloce runner per i linter Go
  ja: golangci-lint は高速な Go linter ランナーです
  ko: golangci-lint는 빠른 Go linter 러너입니다
  pl: golangci-lint to szybka obsługa linterów Go
  pt: golangci-lint é um executor rápido de linters Go
  ro: golangci-lint este un executant rapid de linters Go
  ru: golangci-lint — быстрый раннер линтеров Go
  th: golangci-lint คือตัวรัน linter ของ Go ที่ทำงานได้เร็ว
  tr: golangci-lint, Go linter'ları için hızlı bir çalıştırıcıdır
  uk: golangci-lint — швидкий раннер лінтерів Go
  vi: golangci-lint là trình chạy linter Go nhanh
x:
  source: https://github.com/golangci/golangci-lint
  eget: golangci/golangci-lint
  brew: golangci-lint
  port: golangci-lint
  yay: golangci-lint-bin
  go: github.com/golangci/golangci-lint/cmd/golangci-lint
rule:
  /x:
    cmd: x pkg use golangci-lint
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget golangci/golangci-lint
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S golangci-lint-bin
    reference: https://aur.archlinux.org/packages/golangci-lint-bin
  /curl:
    cmd: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin
    reference: https://golangci-lint.run/usage/install/#local-installation
  darwin/brew:
    cmd: brew install golangci-lint
    reference: https://golangci-lint.run/usage/install/#macos
  darwin/port:
    cmd: sudo port install golangci-lint
    reference: https://golangci-lint.run/usage/install/#macos
  /go:
    cmd: go install github.com/golangci/golangci-lint/cmd/golangci-lint
    reference: https://golangci-lint.run/usage/install/#install-from-source
    dsnap: golangci-lint
binlist:
- golangci-lint

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
