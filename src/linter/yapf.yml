lang: Python
homepage: https://github.com/google/yapf
license: Apache-2.0
desc:
  cn: Python 文件的格式化程序
  en: A formatter for Python files
  cs: Formátovač pro soubory Python
  de: Ein Formatter für Python-Dateien
  es: Un formateador para archivos Python
  fr: Un formateur pour les fichiers Python
  id: Pemformat untuk berkas Python
  it: Un formattatore per file Python
  ja: Python ファイルのフォーマッタ
  ko: Python 파일용 포매터
  pl: Formatter plików Python
  pt: Um formatador para arquivos Python
  ro: Un formatator pentru fișiere Python
  ru: Форматтер для файлов Python
  th: ตัวจัดรูปแบบสำหรับไฟล์ Python
  tr: Python dosyaları için bir biçimlendirici
  uk: Форматтер для файлів Python
  vi: Công cụ định dạng cho các tệp Python
x:
  source: https://github.com/google/yapf
  pip: yapf
rule:
  /x:
    cmd: x pkg use yapf
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install yapf
    reference: https://github.com/google/yapf?tab=readme-ov-file#installation
    dsnap: yapf
binlist:
- yapf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 39 KB
          rating: 1
          desc:
            cn: 约 39 KB（估算）
            en: ~39 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
