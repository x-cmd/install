lang: Python
homepage: https://github.com/google/yapf
license: Apache-2.0
desc:
  cn: Python 文件的格式化程序
  en: A formatter for Python files
x:
  pkg:
    exist: true
  source: https://github.com/google/yapf
rule:
  /x:
    cmd: x pkg use yapf
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install yapf
    reference: https://github.com/google/yapf?tab=readme-ov-file#installation
    dsnap: yapf
binlist:
- yapf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 39 KB
          rating: 1
          desc:
            cn: 约 39 KB（估算）
            en: ~39 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
