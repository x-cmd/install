lang: Rust
homepage: https://github.com/dprint/dprint
license: MIT
desc:
  cn: 用 Rust 编写的可插入且可配置的代码格式化平台
  en: Pluggable and configurable code formatting platform written in Rust
x:
  source: https://github.com/dprint/dprint
  eget: https://github.com/dprint/dprint
rule:
  /eget:
    cmd: x eget dprint/dprint
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S dprint
    reference: https://aur.archlinux.org/packages/dprint
  /asdf:
    cmd: x asdf use dprint
    reference: https://github.com/asdf-community/asdf-dprint
  /curl:
    cmd: curl -fsSL https://dprint.dev/install.sh | sh
    reference: https://dprint.dev/install/
  win/powershell:
    cmd: x pwsh iwr https://dprint.dev/install.ps1 -useb | iex
    reference: https://dprint.dev/install/
  darwin/brew:
    cmd: brew install dprint
    reference: https://dprint.dev/install/
  (win|wsl2)/scoop:
    cmd: x scoop install dprint
    reference: https://dprint.dev/install/
  /cargo:
    cmd: cargo install --locked dprint
    reference: https://dprint.dev/install/
    dsnap: dprint
  /npm:
    cmd: npm install -g dprint
    reference: https://dprint.dev/install/
binlist:
- dprint

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
