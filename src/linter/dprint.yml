lang: Rust
homepage: https://github.com/dprint/dprint
license: MIT
desc:
  cn: 用 Rust 编写的可插入且可配置的代码格式化平台
  en: Pluggable and configurable code formatting platform written in Rust
  cs: Připojitelná a konfigurovatelná platforma pro formátování kódu napsaná v Rust
  de: Erweiterbare und konfigurierbare Codeformatierungsplattform, geschrieben in Rust
  es: Plataforma de formateo de código enchufable y configurable escrita en Rust
  fr: Plateforme de formatage de code pluggable et configurable écrite en Rust
  id: Platform pemformatan kode yang dapat diplu dan dikonfigurasi, ditulis dengan Rust
  it: Piattaforma di formattazione del codice pluggable e configurabile, scritta in Rust
  ja: Rust で書かれた、プラグイン可能な設定可能コードフォーマットプラットフォーム
  ko: Rust로 작성된 플러그인 가능하고 설정 가능한 코드 포매팅 플랫폼
  pl: Rozszerzalna i konfigurowalna platforma do formatowania kodu napisana w Rust
  pt: Plataforma extensível e configurável de formatação de código escrita em Rust
  ro: Platformă de formatare a codului extensibilă și configurabilă, scrisă în Rust
  ru: Расширяемая и настраиваемая платформа форматирования кода, написанная на Rust
  th: แพลตฟอร์มจัดรูปแบบโค้ดที่เสริมส่วนได้และกำหนดค่าได้ เขียนด้วย Rust
  tr: Rust ile yazılmış, eklenti tabanlı ve yapılandırılabilir kod biçimlendirme platformu
  uk: Розширювана та налаштовувана платформа форматування коду, написана на Rust
  vi: Nền tảng định dạng mã nguồn có thể cắm ghép và cấu hình được, viết bằng Rust
x:
  source: https://github.com/dprint/dprint
  eget: dprint/dprint
  brew: dprint
  scoop: dprint
  yay: dprint
  npm: dprint
  asdf: dprint
rule:
  /eget:
    cmd: x eget dprint/dprint
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S dprint
    reference: https://aur.archlinux.org/packages/dprint
  /asdf:
    cmd: x asdf use dprint
    reference: https://github.com/asdf-community/asdf-dprint
  /curl:
    cmd: curl -fsSL https://dprint.dev/install.sh | sh
    reference: https://dprint.dev/install/
  win/powershell:
    cmd: x pwsh iwr https://dprint.dev/install.ps1 -useb | iex
    reference: https://dprint.dev/install/
  darwin/brew:
    cmd: brew install dprint
    reference: https://dprint.dev/install/
  (win|wsl2)/scoop:
    cmd: x scoop install dprint
    reference: https://dprint.dev/install/
  /cargo:
    cmd: cargo install --locked dprint
    reference: https://dprint.dev/install/
    dsnap: dprint
  /npm:
    cmd: npm install -g dprint
    reference: https://dprint.dev/install/
binlist:
- dprint

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
