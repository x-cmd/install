lang: JavaScript
homepage: https://github.com/Unitech/pm2
desc:
  cn: Node.js 应用程序的生产流程管理器，具有内置负载均衡器
  en: Node.js Production Process Manager with a built-in Load Balancer
x:
  pkg:
    exist: true
  source: https://github.com/Unitech/pm2
rule:
  /x:
    cmd: x pkg use pm2
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g pm2
    reference: https://github.com/Unitech/pm2?tab=readme-ov-file#installing-pm2
    dsnap: pm2
binlist:
- pm2
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
