lang: JavaScript
homepage: https://github.com/antfu/taze
license: MIT
desc:
  cn: npm 依赖升级管理工具
  en: npm dependency upgrade manager
x:
  source: https://github.com/antfu/taze
rule:
  /npm:
    cmd: npm install -g taze
    reference: https://github.com/antfu/taze?tab=readme-ov-file#features
    dsnap: taze
  /npx:
    cmd: npx taze
    reference: https://github.com/antfu/taze?tab=readme-ov-file#features
binlist:
- taze

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
