lang: JavaScript
homepage: https://github.com/antfu/taze
license: MIT
desc:
  cn: npm 依赖升级管理工具
  en: npm dependency upgrade manager
x:
  source: https://github.com/antfu/taze
rule:
  /npm:
    cmd: npm install -g taze
    reference: https://github.com/antfu/taze?tab=readme-ov-file#features
    dsnap: taze
  /npx:
    cmd: npx taze
    reference: https://github.com/antfu/taze?tab=readme-ov-file#features
binlist:
- taze

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 KB
          rating: 1
          desc:
            cn: 约 13 KB（估算）
            en: ~13 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
