lang: Shell
homepage: https://github.com/nvm-sh
desc:
  cn: nvm 是 Node.js 的版本管理器，设计为按用户安装并按 shell 调用
  en: nvm is a version manager for node.js, designed to be installed per-user, and invoked per-shell
rule:
  /curl:
    cmd: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
    reference: https://github.com/nvm-sh/nvm#install--update-script
  /wget:
    cmd: wget -qO- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.5/install.sh | bash
    reference: https://github.com/nvm-sh/nvm#install--update-script
binlist:
- nvm
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
