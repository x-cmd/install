lang: JavaScript
homepage: https://github.com/open-cli-tools/concurrently#readme
license: MIT
desc:
  en: Run npm commands concurrently
  cn: 并行运行 npm 命令
  cs: Spouští npm příkazy současně
  de: npm-Befehle parallel ausführen
  es: Ejecutar comandos npm de forma concurrente
  fr: Exécuter les commandes npm simultanément
  id: Menjalankan perintah npm secara bersamaan
  it: Esegui i comandi npm contemporaneamente
  ja: npm コマンドを並行して実行する
  ko: npm 명령을 동시에 실행
  pl: Uruchamiaj polecenia npm równolegle
  pt: Executar comandos npm simultaneamente
  ro: Rulează comenzi npm concurent
  ru: Запускать команды npm одновременно
  th: เรียกคำสั่ง npm พร้อมกัน
  tr: npm komutlarını eşzamanlı olarak çalıştırır
  uk: Виконувати команди npm одночасно
  vi: Chạy các lệnh npm đồng thời
x:
  source: https://github.com/open-cli-tools/concurrently#readme
  yay: concurrently
rule:
  /x:
    cmd: x pkg use concurrently
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm i -g concurrently
    reference: https://github.com/open-cli-tools/concurrently?tab=readme-ov-file#installation
    dsnap: concurrently
  arch/yay:
    cmd: yay -S concurrently
    reference: https://aur.archlinux.org/packages/concurrently
binlist:
- concurrently

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
