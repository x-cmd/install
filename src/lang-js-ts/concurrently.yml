lang: JavaScript
homepage: https://github.com/open-cli-tools/concurrently#readme
license: MIT
desc:
  en: Run npm commands concurrently
  cn: 并行运行 npm 命令
x:
  source: https://github.com/open-cli-tools/concurrently#readme
  yay: concurrently
rule:
  /x:
    cmd: x pkg use concurrently
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm i -g concurrently
    reference: https://github.com/open-cli-tools/concurrently?tab=readme-ov-file#installation
    dsnap: concurrently
  arch/yay:
    cmd: yay -S concurrently
    reference: https://aur.archlinux.org/packages/concurrently
binlist:
- concurrently

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
