lang: JavaScript
homepage: https://github.com/open-cli-tools/concurrently#readme
license: MIT
desc:
  en: Run npm commands concurrently
  cn: 并行运行 npm 命令
x:
  pkg:
    exist: true
  source: https://github.com/open-cli-tools/concurrently#readme
rule:
  /x:
    cmd: x pkg use concurrently
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm i -g concurrently
    reference: https://github.com/open-cli-tools/concurrently?tab=readme-ov-file#installation
    dsnap: concurrently
  arch/yay:
    cmd: yay -S concurrently
    reference: https://aur.archlinux.org/packages/concurrently
binlist:
- concurrently

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
