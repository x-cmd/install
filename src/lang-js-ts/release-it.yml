lang: JavaScript
homepage: https://github.com/release-it/release-it
license: MIT
desc:
  cn: 自动化版本控制和包发布
  en: Automate versioning and package publishing
x:
  source: https://github.com/release-it/release-it
rule:
  /npm:
    cmd: npm install -D release-it
    reference: https://github.com/release-it/release-it?tab=readme-ov-file#installation
    dsnap: release-it
  arch/yay:
    cmd: yay -S release-it
    reference: https://aur.archlinux.org/packages/release-it
binlist:
- release-it

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
