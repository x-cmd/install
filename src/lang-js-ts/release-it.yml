lang: JavaScript
homepage: https://github.com/release-it/release-it
license: MIT
desc:
  cn: 自动化版本控制和包发布
  en: Automate versioning and package publishing
x:
  source: https://github.com/release-it/release-it
  yay: release-it
  npm: -D
rule:
  /npm:
    cmd: npm install -D release-it
    reference: https://github.com/release-it/release-it?tab=readme-ov-file#installation
    dsnap: release-it
  arch/yay:
    cmd: yay -S release-it
    reference: https://aur.archlinux.org/packages/release-it
binlist:
- release-it

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 KB
          rating: 1
          desc:
            cn: 约 15 KB（估算）
            en: ~15 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
