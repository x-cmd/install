lang: JavaScript
homepage: https://github.com/eslint/eslint
license: MIT
desc:
  en: ESLint is a tool for identifying and reporting on patterns found in ECMAScript/JavaScript code
  cn: ESLint 是一个识别和报告 ECMAScript/JavaScript 代码中的模式的工具
x:
  pkg:
    exist: true
  source: https://github.com/eslint/eslint
rule:
  /x:
    cmd: x pkg use eslint
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g eslint
    reference: https://www.npmjs.com/package/eslint#installation-and-usage
    dsnap: eslint
  darwin/brew:
    cmd: brew install eslint
    reference: https://formulae.brew.sh/formula/eslint#default
binlist:
- eslint

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
