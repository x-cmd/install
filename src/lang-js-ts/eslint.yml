lang: JavaScript
homepage: https://github.com/eslint/eslint
license: MIT
desc:
  en: ESLint is a tool for identifying and reporting on patterns found in ECMAScript/JavaScript code
  cn: ESLint 是一个识别和报告 ECMAScript/JavaScript 代码中的模式的工具
  cs: ESLint je nástroj pro identifikaci a hlášení vzorců nalezených v kódu ECMAScript/JavaScript
  de: ESLint ist ein Werkzeug zum Erkennen und Melden von Mustern in ECMAScript-/JavaScript-Code
  es: ESLint es una herramienta para identificar e informar sobre los patrones encontrados en el código ECMAScript/JavaScript
  fr: ESLint est un outil permettant d'identifier et de signaler les motifs présents dans le code ECMAScript/JavaScript
  id: ESLint adalah alat untuk mengidentifikasi dan melaporkan pola yang ditemukan dalam kode ECMAScript/JavaScript
  it: ESLint è uno strumento per identificare e segnalare i pattern presenti nel codice ECMAScript/JavaScript
  ja: ESLint は ECMAScript/JavaScript コード内で見つかったパターンを識別し報告するツールです
  ko: ESLint는 ECMAScript/JavaScript 코드에서 발견된 패턴을 식별하고 보고하는 도구입니다
  pl: ESLint to narzędzie do identyfikowania i raportowania wzorców znalezionych w kodzie ECMAScript/JavaScript
  pt: ESLint é uma ferramenta para identificar e relatar padrões encontrados em código ECMAScript/JavaScript
  ro: ESLint este o instrument pentru identificarea și raportarea tiparelor găsite în codul ECMAScript/JavaScript
  ru: ESLint — это инструмент для обнаружения и отчётов о шаблонах в коде ECMAScript/JavaScript
  th: ESLint เป็นเครื่องมือสำหรับระบุและรายงานรูปแบบที่พบในโค้ด ECMAScript/JavaScript
  tr: ESLint, ECMAScript/JavaScript kodunda bulunan kalıpları belirleyip bildiren bir araçtır
  uk: ESLint — це інструмент для виявлення та звітності про шаблони, знайдені в коді ECMAScript/JavaScript
  vi: ESLint là công cụ để nhận diện và báo cáo các mẫu được tìm thấy trong mã ECMAScript/JavaScript
x:
  source: https://github.com/eslint/eslint
  brew: eslint
  npm: eslint
rule:
  /x:
    cmd: x pkg use eslint
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g eslint
    reference: https://www.npmjs.com/package/eslint#installation-and-usage
    dsnap: eslint
  darwin/brew:
    cmd: brew install eslint
    reference: https://formulae.brew.sh/formula/eslint#default
binlist:
- eslint

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 557 KB
          rating: 1
          desc:
            cn: 约 557 KB（估算）
            en: ~557 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
