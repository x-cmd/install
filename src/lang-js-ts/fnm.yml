lang: Rust
homepage: https://github.com/Schniz/fnm
license: GPL-3.0
desc:
  cn: 快速简单的 Node.js 版本管理器，用 Rust 构建
  en: Fast and simple Node.js version manager, built in Rust
  cs: Rychlý a jednoduchý správce verzí Node.js, napsaný v Rustu
  de: Schneller und einfacher Node.js-Versionsmanager, in Rust geschrieben
  es: Gestor de versiones de Node.js rápido y sencillo, escrito en Rust
  fr: Un gestionnaire de versions de Node.js rapide et simple, écrit en Rust
  id: Pengelola versi Node.js yang cepat dan sederhana, dibuat dengan Rust
  it: Un gestore delle versioni di Node.js veloce e semplice, scritto in Rust
  ja: Rust で書かれた高速でシンプルな Node.js バージョンマネージャー
  ko: Rust로 만든 빠르고 간단한 Node.js 버전 관리자
  pl: Szybki i prosty menedżer wersji Node.js, napisany w Rust
  pt: Um gerenciador de versões do Node.js rápido e simples, escrito em Rust
  ro: Un manager de versiuni Node.js rapid și simplu, scris în Rust
  ru: Быстрый и простой менеджер версий Node.js, написанный на Rust
  th: ตัวจัดการเวอร์ชัน Node.js ที่เร็วและเรียบง่าย เขียนด้วย Rust
  tr: Rust ile yazılmış hızlı ve basit bir Node.js sürüm yöneticisi
  uk: Швидкий і простий менеджер версій Node.js, написаний на Rust
  vi: Trình quản lý phiên bản Node.js nhanh và đơn giản, viết bằng Rust
x:
  source: https://github.com/Schniz/fnm
  eget: Schniz/fnm
  brew: fnm
  scoop: fnm
  choco: fnm
  winget: Schniz.fnm
  yay: fnm-bin
  cargo: fnm
rule:
  /eget:
    cmd: x eget Schniz/fnm
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://fnm.vercel.app/install | bash
    reference: https://github.com/Schniz/fnm?tab=readme-ov-file#using-a-script-macoslinux
  darwin/brew:
    cmd: brew install fnm
    reference: https://github.com/Schniz/fnm?tab=readme-ov-file#using-homebrew-macoslinux
  (win|wsl2)/scoop:
    cmd: x scoop install fnm
    reference: https://github.com/Schniz/fnm?tab=readme-ov-file#using-scoop-windows
  (win|wsl2)/choco:
    cmd: x choco install fnm
    reference: https://github.com/Schniz/fnm?tab=readme-ov-file#using-chocolatey-windows
  (win|wsl2)/winget:
    cmd: x winget install Schniz.fnm
    reference: https://github.com/Schniz/fnm?tab=readme-ov-file#using-winget-windows
  arch/yay:
    cmd: yay -S fnm-bin
    reference: https://aur.archlinux.org/packages/fnm-bin
  /cargo:
    cmd: cargo install fnm
    reference: https://github.com/Schniz/fnm?tab=readme-ov-file#using-cargo-linuxmacoswindows
    dsnap: fnm
binlist:
- fnm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/arm64)
            en: ~3 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
