lang: JavaScript
homepage: https://github.com/angular/angular-cli
license: MIT
desc:
  cn: 用于直接从命令 shell 初始化、开发、搭建和维护 Angular 应用程序的 CLI
  en: CLI for initializing, developing, building, and maintaining Angular applications directly from the command shell
x:
  source: https://github.com/angular/angular-cli
rule:
  /npm:
    cmd: npm install -g @angular/cli
    reference: https://angular.io/cli
    dsnap: '@angular/cli'
  darwin/brew:
    cmd: brew install angular-cli
    reference: https://formulae.brew.sh/formula/angular-cli#default
  arch/yay:
    cmd: yay -S angular-cli
    reference: https://aur.archlinux.org/packages/angular-cli
binlist:
- angular

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
