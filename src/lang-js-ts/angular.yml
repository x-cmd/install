lang: JavaScript
homepage: https://github.com/angular/angular-cli
license: MIT
desc:
  cn: 用于直接从命令 shell 初始化、开发、搭建和维护 Angular 应用程序的 CLI
  en: CLI for initializing, developing, building, and maintaining Angular applications directly from the command shell
  cs: CLI pro inicializaci, vývoj, sestavení a údržbu aplikací Angular přímo z příkazového řádku
  de: CLI zum Initialisieren, Entwickeln, Bauen und Warten von Angular-Anwendungen direkt aus der Kommandozeile
  es: CLI para inicializar, desarrollar, compilar y mantener aplicaciones Angular directamente desde la línea de comandos
  fr: CLI pour initialiser, développer, construire et maintenir des applications Angular directement depuis le shell de commandes
  id: CLI untuk menginisialisasi, mengembangkan, membangun, dan mengelola aplikasi Angular langsung dari shell perintah
  it: CLI per inizializzare, sviluppare, compilare e mantenere le applicazioni Angular direttamente dalla riga di comando
  ja: コマンドシェルから直接 Angular アプリケーションの初期化、開発、ビルド、保守を行う CLI
  ko: 명령 셸에서 직접 Angular 애플리케이션을 초기화, 개발, 빌드, 관리하는 CLI
  pl: CLI do inicjalizacji, tworzenia, budowania i utrzymywania aplikacji Angular bezpośrednio z wiersza poleceń
  pt: CLI para inicializar, desenvolver, compilar e manter aplicações Angular diretamente do shell de comandos
  ro: CLI pentru inițierea, dezvoltarea, construirea și întreținerea aplicațiilor Angular direct din linia de comandă
  ru: CLI для инициализации, разработки, сборки и сопровождения приложений Angular прямо из командной оболочки
  th: CLI สำหรับเริ่มต้น พัฒนา สร้าง และดูแลแอป Angular โดยตรงจากเชลล์คำสั่ง
  tr: Angular uygulamalarını doğrudan komut kabuğundan başlatmak, geliştirmek, derlemek ve bakımını yapmak için CLI
  uk: CLI для ініціалізації, розробки, збирання та супроводу застосунків Angular безпосередньо з командної оболонки
  vi: CLI để khởi tạo, phát triển, build và bảo trì các ứng dụng Angular trực tiếp từ dòng lệnh
x:
  source: https://github.com/angular/angular-cli
  brew: angular-cli
  yay: angular-cli
  npm: "@angular/cli"
rule:
  /npm:
    cmd: npm install -g @angular/cli
    reference: https://angular.io/cli
    dsnap: '@angular/cli'
  darwin/brew:
    cmd: brew install angular-cli
    reference: https://formulae.brew.sh/formula/angular-cli#default
  arch/yay:
    cmd: yay -S angular-cli
    reference: https://aur.archlinux.org/packages/angular-cli
binlist:
- angular

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
