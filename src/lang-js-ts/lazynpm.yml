lang: Go
homepage: https://github.com/jesseduffield/lazynpm
license: MIT
desc:
  cn: 一个简单的 npm 命令 TUI
  en: A simple TUI for npm commands.
x:
  source: https://github.com/jesseduffield/lazynpm
  eget: https://github.com/jesseduffield/lazynpm
rule:
  /eget:
    cmd: x eget jesseduffield/lazynpm
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install jesseduffield/lazynpm/lazynpm
    reference: https://github.com/jesseduffield/lazynpm?tab=readme-ov-file#homebrew
  arch/yay:
    cmd: yay -S lazynpm
    reference: https://aur.archlinux.org/packages/lazynpm
  /go:
    cmd: go install github.com/jesseduffield/lazynpm@latest
    reference: https://github.com/jesseduffield/lazynpm?tab=readme-ov-file#go
    dsnap: lazynpm
binlist:
- lazynpm

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
