lang: JavaScript
homepage: https://github.com/hxxft/lynx-cli
desc:
  cn: Lynx 是一个使用 Javascript 来编写 Android 和 iOS 原生应用的框架
  en: Lynx is a framework that uses JavaScript to build native Android and iOS applications.
x:
  source: https://github.com/hxxft/lynx-cli
rule:
  /npm:
    cmd: npm install -g lynx-cli
    reference: https://github.com/hxxft/lynx-cli?tab=readme-ov-file#%E5%AE%89%E8%A3%85
    dsnap: lynx-cli
binlist:
- lynx-cli
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
