lang: JavaScript
homepage: https://github.com/hxxft/lynx-cli
desc:
  cn: Lynx 是一个使用 Javascript 来编写 Android 和 iOS 原生应用的框架
  en: Lynx is a framework that uses JavaScript to build native Android and iOS applications.
x:
  source: https://github.com/hxxft/lynx-cli
rule:
  /npm:
    cmd: npm install -g lynx-cli
    reference: https://github.com/hxxft/lynx-cli?tab=readme-ov-file#%E5%AE%89%E8%A3%85
    dsnap: lynx-cli
binlist:
- lynx-cli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
