lang: JavaScript
homepage: https://github.com/sindresorhus/np
license: MIT
desc:
  cn: 更好的 npm 发布
  en: A better npm publish
  cs: Lepší publishing pro npm
  de: Besseres npm-Publishing
  es: Una publicación de npm mejor
  fr: Une meilleure publication npm
  id: Publikasi npm yang lebih baik
  it: Un publishing npm migliore
  ja: より良い npm 公開
  ko: 더 나은 npm 게시
  pl: Lepsze publikowanie npm
  pt: Uma publicação npm melhor
  ro: O publicare npm mai bună
  ru: Более удобная публикация в npm
  th: การเผยแพร่ npm ที่ดีกว่า
  tr: Daha iyi bir npm yayımlama
  uk: Краща публікація в npm
