lang: Rust
homepage: https://github.com/volta-cli/volta
desc:
  cn: Volta 是一种管理 JavaScript 命令行工具的简单方法
  en: Volta is a hassle-free way to manage your JavaScript command-line tools
  cs: Volta je bezproblémový způsob správy vašich nástrojů příkazového řádku pro JavaScript
  de: Volta ist eine unkomplizierte Art, Ihre JavaScript-Befehlszeilenwerkzeuge zu verwalten
  es: Volta es una forma sin complicaciones de gestionar tus herramientas de línea de comandos de JavaScript
  fr: Volta est un moyen simple de gérer vos outils en ligne de commande JavaScript
  id: Volta adalah cara hassle-free untuk mengelola alat baris perintah JavaScript Anda
  it: Volta è un modo senza complicazioni per gestire i tuoi strumenti da riga di comando JavaScript
  ja: Volta は JavaScript のコマンドラインツールを不堪なく管理する方法です
  ko: Volta는 JavaScript 명령줄 도구를 번거로움 없이 관리하는 방법입니다
  pl: Volta to bezproblemowy sposób zarządzania narzędziami wiersza poleceń JavaScript
  pt: Volta é uma forma sem complicação de gerenciar suas ferramentas de linha de comando JavaScript
  ro: Volta este o modalitate fără bătăi de cap de a vă gestiona instrumentele din linia de comandă JavaScript
  ru: Volta — простой способ управлять консольными инструментами JavaScript
  th: Volta เป็นวิธีจัดการเครื่องมือบรรทัดคำสั่ง JavaScript ของคุณแบบไม่ยุ่งยาก
  tr: Volta, JavaScript komut satırı araçlarınızı yönetmenin sorunsuz bir yoludur
  uk: Volta — простий спосіб керувати вашими консольними інструментами JavaScript
  vi: Volta là cách đơn giản để quản lý các công cụ dòng lệnh JavaScript của bạn
x:
  source: https://github.com/volta-cli/volta
  eget: volta-cli/volta
  brew: volta
  scoop: volta
  choco: volta
  winget: Volta.Volta
  yay: volta-bin
rule:
  /eget:
    cmd: x eget volta-cli/volta
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl https://get.volta.sh | bash
    reference: https://docs.volta.sh/guide/getting-started
  (win|wsl2)/scoop:
    cmd: x scoop install volta
    reference: https://scoop.sh/#/apps?q=volta
  (win|wsl2)/choco:
    cmd: x choco install volta
    reference: https://community.chocolatey.org/packages/volta
  (win|wsl2)/winget:
    cmd: x winget install Volta.Volta
    reference: https://winget.run/pkg/Volta/Volta
  darwin/brew:
    cmd: brew install volta
    reference: https://formulae.brew.sh/formula/volta#default
  arch/yay:
    cmd: yay -S volta-bin
    reference: https://aur.archlinux.org/packages/volta-bin
binlist:
- volta
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/arm64)
            en: ~9 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
