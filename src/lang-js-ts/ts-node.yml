lang: TypeScript
homepage: https://github.com/TypeStrong/ts-node
license: MIT
desc:
  cn: Node.js 的 TypeScript 执行和 REPL
  en: TypeScript execution and REPL for node.js
x:
  pkg:
    exist: true
  source: https://github.com/TypeStrong/ts-node
rule:
  /x:
    cmd: x pkg use ts-node
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g ts-node
    reference: https://github.com/TypeStrong/ts-node?tab=readme-ov-file#installation
    dsnap: ts-node
binlist:
- ts-node

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
