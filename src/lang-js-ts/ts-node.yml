lang: TypeScript
homepage: https://github.com/TypeStrong/ts-node
license: MIT
desc:
  cn: Node.js 的 TypeScript 执行和 REPL
  en: TypeScript execution and REPL for node.js
x:
  source: https://github.com/TypeStrong/ts-node
  npm: ts-node
rule:
  /x:
    cmd: x pkg use ts-node
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g ts-node
    reference: https://github.com/TypeStrong/ts-node?tab=readme-ov-file#installation
    dsnap: ts-node
binlist:
- ts-node

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 KB
          rating: 1
          desc:
            cn: 约 20 KB（估算）
            en: ~20 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
