lang: JavaScript
homepage: https://github.com/remy/nodemon/
license: MIT
desc:
  cn: nodemon 是一个 Node.js 开发工具，当代码文件发生变化时，它会自动重启 Node.js 应用，帮助开发者提升开发效率
  en: nodemon is a Node.js development tool that automatically restarts your Node.js application whenever you make changes to your code files, saving you time and effort during development.
x:
  pkg:
    exist: true
  source: https://github.com/remy/nodemon
rule:
  /x:
    cmd: x pkg use nodemon
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g nodemon
    reference: https://github.com/remy/nodemon?tab=readme-ov-file#installation
    dsnap: nodemon
  arch/yay:
    cmd: yay -S nodejs-nodemon
    reference: https://aur.archlinux.org/packages/nodejs-nodemon
binlist:
- nodemon

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
