lang: JavaScript
homepage: https://github.com/webhintio/hint
license: Apache-2.0
desc:
  cn: 一个可自定义的 linting 工具，通过检查代码的最佳实践和常见错误，帮助您提高网站的可访问性、速度、跨浏览器兼容性等
  en: A customizable linting tool that helps you improve your website's accessibility, speed, cross-browser compatibility, and more by checking your code for best practices and common errors
x:
  pkg:
    exist: true
  source: https://github.com/webhintio/hint
  eget: https://github.com/webhintio/hint
rule:
  /eget:
    cmd: x eget webhintio/hint
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use hint
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install hint
    reference: https://webhint.io/docs/user-guide/#install-webhint
    dsnap: hint
binlist:
- hint

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 99 KB
          rating: 1
          desc:
            cn: 约 99 KB（估算）
            en: ~99 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
