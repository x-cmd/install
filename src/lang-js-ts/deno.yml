lang: Rust
homepage: https://github.com/denoland/deno
license: MIT
desc:
  cn: Deno 是一个 JavaScript、TypeScript 和 WebAssembly 运行时，具有安全的默认设置和出色的开发人员体验
  en: Deno is a JavaScript, TypeScript, and WebAssembly runtime with secure defaults and a great developer experience
x:
  pkg:
    exist: true
  source: https://github.com/denoland/deno
  eget: https://github.com/denoland/deno
rule:
  /x:
    cmd: x pkg use deno
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget denoland/deno
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use deno
    reference: https://github.com/asdf-community/asdf-deno
  /curl:
    cmd: curl -fsSL https://deno.land/install.sh | sh
    reference: https://github.com/denoland/deno/#install
  darwin/brew:
    cmd: brew install deno
    reference: https://github.com/denoland/deno/#install
  (win|wsl2)/winget:
    cmd: x winget install DenoLand.Deno
    reference: https://github.com/denoland/deno/#install
  (win|wsl2)/scoop:
    cmd: x scoop install deno
    reference: https://github.com/denoland/deno/#install
  (win|wsl2)/choco:
    cmd: x choco install deno
    reference: https://github.com/denoland/deno/#install
binlist:
- deno

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 91 MB
          rating: 3
          desc:
            cn: 安装 91 MB
            en: 91 MB install
        download:
          estimate: 40 MB
          desc:
            cn: 约 40 MB 下载 (linux/x64)
            en: ~40 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 11 MB
        desc:
          cn: 11 MB
          en: 11 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
