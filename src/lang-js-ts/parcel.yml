lang: JavaScript
homepage: https://github.com/parcel-bundler/parcel
license: MIT
desc:
  cn: Parcel 是一个零配置的网络构建工具
  en: Parcel is a zero configuration build tool for the web
x:
  source: https://github.com/parcel-bundler/parcel
rule:
  /yarn:
    cmd: yarn add parcel
    reference: https://parceljs.org/
binlist:
- parcel

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 258 KB
          rating: 1
          desc:
            cn: 约 258 KB（估算）
            en: ~258 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
