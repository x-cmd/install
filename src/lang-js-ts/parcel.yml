lang: JavaScript
homepage: https://github.com/parcel-bundler/parcel
license: MIT
desc:
  cn: Parcel 是一个零配置的网络构建工具
  en: Parcel is a zero configuration build tool for the web
x:
  source: https://github.com/parcel-bundler/parcel
rule:
  /yarn:
    cmd: yarn add parcel
    reference: https://parceljs.org/
binlist:
- parcel

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
