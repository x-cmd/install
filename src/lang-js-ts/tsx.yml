homepage: https://github.com/privatenumber/tsx#readme
license: MIT
lang: JavaScript
desc:
  en: A CLI for running TypeScript and ESM seamlessly (tsx is a standalone binary designed to replace node)
  cn: 一个用于无缝运行 TypeScript 和 ESM 的 CLI（tsx 是一个独立的二进制文件，设计用于替代 node）
x:
  pkg:
    exist: true
  source: https://github.com/privatenumber/tsx#readme
rule:
  /x:
    cmd: x pkg use tsx
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global tsx
    reference: https://github.com/privatenumber/tsx?tab=readme-ov-file#global-installation
    dsnap: tsx
binlist:
- tsx

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
