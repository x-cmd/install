homepage: https://github.com/privatenumber/tsx#readme
license: MIT
lang: JavaScript
desc:
  en: A CLI for running TypeScript and ESM seamlessly (tsx is a standalone binary designed to replace node)
  cn: 一个用于无缝运行 TypeScript 和 ESM 的 CLI（tsx 是一个独立的二进制文件，设计用于替代 node）
x:
  source: https://github.com/privatenumber/tsx#readme
rule:
  /x:
    cmd: x pkg use tsx
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global tsx
    reference: https://github.com/privatenumber/tsx?tab=readme-ov-file#global-installation
    dsnap: tsx
binlist:
- tsx

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
