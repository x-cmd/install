lang: Go
homepage: https://github.com/aquasecurity/tfsec
license: MIT
desc:
  cn: tfsec 是一款针对 Terraform 代码的静态分析安全扫描器
  en: tfsec is a static analysis security scanner for your Terraform code
x:
  pkg:
    exist: true
  source: https://github.com/aquasecurity/tfsec
  eget: https://github.com/aquasecurity/tfsec
rule:
  /x:
    cmd: x pkg use tfsec
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget aquasecurity/tfsec
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tfsec
    reference: https://aquasecurity.github.io/tfsec/latest/guides/installation/
  linux/brew:
    cmd: brew install tfsec
    reference: https://aquasecurity.github.io/tfsec/latest/guides/installation/
  (win|wsl2)/scoop:
    cmd: x scoop install tfsec
    reference: https://aquasecurity.github.io/tfsec/latest/guides/installation/
  (win|wsl2)/choco:
    cmd: x choco install tfsec
    reference: https://aquasecurity.github.io/tfsec/latest/guides/installation/
  /go:
    cmd: go install github.com/aquasecurity/tfsec/cmd/tfsec@latest
    reference: https://aquasecurity.github.io/tfsec/latest/guides/installation/
    dsnap: github.com/aquasecurity/tfsec/cmd/tfsec@latest
  arch/yay:
    cmd: yay -S tfsec-bin
    reference: https://aur.archlinux.org/packages/tfsec-bin
binlist:
- tfsec

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
