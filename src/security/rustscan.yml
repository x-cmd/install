lang: Rust
homepage: https://github.com/RustScan/RustScan
license: GPL-3.0
desc:
  cn: 现代端口扫描器
  en: The Modern Port Scanner
x:
  pkg:
    exist: true
  source: https://github.com/RustScan/RustScan
rule:
  /x:
    cmd: x pkg use rustscan
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install rustscan
    reference: https://github.com/RustScan/RustScan/wiki/Installation-Guide#-homebrew
binlist:
- rustscan

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 109 KB
          rating: 1
          desc:
            cn: 约 109 KB（估算）
            en: ~109 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
