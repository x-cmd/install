lang: Rust
homepage: https://github.com/bee-san/RustScan
license: GPL-3.0
desc:
  cn: 现代端口扫描器
  en: The Modern Port Scanner
  cs: Moderní skener portů
  de: Der moderne Portscanner
  es: El escáner de puertos moderno
  fr: Le scanner de ports moderne
  id: Pemindai port modern
  it: Il moderno scanner di porte
  ja: モダンなポートスキャナー
  ko: 현대적인 포트 스캐너
  pl: Nowoczesny skaner portów
  pt: O scanner de portas moderno
  ro: Scannerul de porturi modern
  ru: Современный сканер портов
  th: เครื่องสแกนพอร์ตยุคใหม่
  tr: Modern port tarayıcı
  uk: Сучасний сканер портів
  vi: Máy quét cổng hiện đại
x:
  source: https://github.com/bee-san/RustScan
  brew: rustscan
rule:
  /x:
    cmd: x pkg use rustscan
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install rustscan
    reference: https://github.com/bee-san/RustScan/wiki/Installation-Guide#-homebrew
binlist:
- rustscan

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 109 KB
          rating: 1
          desc:
            cn: 约 109 KB（估算）
            en: ~109 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
