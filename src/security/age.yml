lang: Go
homepage: https://github.com/FiloSottile/age
license: BSD-3-Clause
desc:
  en: age is a simple, modern and secure file encryption tool, format, and Go library
  cn: age 是一个简单、现代和安全的文件加密工具、格式和 Go 库
x:
  pkg:
    exist: true
  source: https://github.com/FiloSottile/age
  eget: https://github.com/FiloSottile/age
rule:
  /eget:
    cmd: x eget FiloSottile/age
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use age
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install age
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
  darwin/port:
    cmd: sudo port install age
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
  arch/pacman:
    cmd: sudo pacman -S age
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
  fedora/dnf:
    cmd: sudo dnf install age
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
    dsnap: age
  ubuntu/apt:
    cmd: sudo apt install age
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
    dsnap: age
  debian/apt:
    cmd: sudo apt install age
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
    dsnap: age
  gentoo/emerge:
    cmd: sudo emerge app-crypt/age
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
  alpine/apk:
    cmd: sudo apk add age
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
    dsnap: age
  nix/nixpkgs:
    cmd: nix-env -i age
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras \

      && x scoop install extras/age

      '
    reference: https://scoop.sh/#/apps?q=age
  (win|wsl2)/choco:
    cmd: x choco install age.portable
    reference: https://github.com/FiloSottile/age?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S age
    reference: https://aur.archlinux.org/packages/age
binlist:
- age

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
