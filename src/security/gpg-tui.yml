lang: Rust
homepage: https://github.com/orhun/gpg-tui
license: MIT
desc:
  en: gpg-tui is a Terminal User Interface for GnuPG
  cn: gpg-tui 是 GnuPG 的终端用户界面
  cs: gpg-tui je textové uživatelské rozhraní pro GnuPG
  de: gpg-tui ist eine Terminal-Benutzeroberfläche für GnuPG
  es: gpg-tui es una interfaz de usuario de terminal para GnuPG
  fr: gpg-tui est une interface utilisateur en terminal pour GnuPG
  id: gpg-tui adalah antarmuka pengguna terminal untuk GnuPG
  it: gpg-tui è un'interfaccia utente da terminale per GnuPG
  ja: gpg-tui は GnuPG の端末ユーザーインターフェースです
  ko: gpg-tui는 GnuPG용 터미널 사용자 인터페이스입니다
  pl: gpg-tui to terminalowy interfejs użytkownika dla GnuPG
  pt: gpg-tui é uma interface de usuário de terminal para o GnuPG
  ro: gpg-tui este o interfață de utilizator în terminal pentru GnuPG
  ru: gpg-tui — это терминальный пользовательский интерфейс для GnuPG
  th: gpg-tui คืออินเทอร์เฟซผู้ใช้แบบเทอร์มินัลสำหรับ GnuPG
  tr: gpg-tui, GnuPG için bir Terminal Kullanıcı Arayüzüdür
  uk: gpg-tui — це термінальний користувацький інтерфейс для GnuPG
  vi: gpg-tui là giao diện người dùng dòng lệnh cho GnuPG
x:
  source: https://github.com/orhun/gpg-tui
  brew: gpg-tui
  pacman: gpg-tui
  apk: gpg-tui
  yay: gpg-tui-git
  paru: gpg-tui-git
  cargo: gpg-tui
rule:
  /cargo:
    cmd: cargo install gpg-tui
    reference: https://github.com/orhun/gpg-tui?tab=readme-ov-file#cargo
    dsnap: gpg-tui
  arch/pacman:
    cmd: pacman -S gpg-tui
    reference: https://github.com/orhun/gpg-tui?tab=readme-ov-file#arch-linux
  arch/paru:
    cmd: paru -S gpg-tui-git
    reference: https://github.com/orhun/gpg-tui?tab=readme-ov-file#aur
  arch/yay:
    cmd: yay -S gpg-tui-git
    reference: https://aur.archlinux.org/packages/gpg-tui-git
  alpine/apk:
    cmd: apk add gpg-tui
    reference: https://github.com/orhun/gpg-tui?tab=readme-ov-file#alpine-linux
    dsnap: gpg-tui
  darwin/brew:
    cmd: brew install gpg-tui
    reference: https://github.com/orhun/gpg-tui?tab=readme-ov-file#homebrew
  netbsd/pkgin:
    cmd: pkgin install gpg-tui
    reference: https://github.com/orhun/gpg-tui?tab=readme-ov-file#netbsd
binlist:
- gpg-tui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
