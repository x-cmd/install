lang: Rust
homepage: https://github.com/orhun/flawz
license: Apache-2.0
desc:
  cn: flawz 是一个终端用户界面（TUI），用于浏览安全漏洞（也称为 CVE）。
  en: flawz is a Terminal User Interface (TUI) for browsing security vulnerabilities (also known as CVEs)
x:
  source: https://github.com/orhun/flawz
  eget: https://github.com/orhun/flawz
rule:
  /eget:
    cmd: x eget orhun/flawz
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install flawz
    reference: https://github.com/orhun/flawz?tab=readme-ov-file#cargo
    dsnap: flawz
  arch/pacman:
    cmd: sudo pacman -S flawz
    reference: https://github.com/orhun/flawz?tab=readme-ov-file#arch-linux
  alpine/apk:
    cmd: apk add flawz
    reference: https://github.com/orhun/flawz?tab=readme-ov-file#alpine-linux
    dsnap: flawz
  darwin/brew:
    cmd: brew install flawz
    reference: https://github.com/orhun/flawz?tab=readme-ov-file#homebrew
  /nixpkgs:
    cmd: 'nix-channel --add https://nixos.org/channels/nixpkgs-unstable && \

      nix-channel --update nixpkgs && \

      nix-env -iA nixpkgs.flawz

      '
    reference: https://github.com/orhun/flawz?tab=readme-ov-file#nixpkgs
  /nix-env:
    cmd: 'nix-channel --add https://nixos.org/channels/nixos-unstable && \

      nix-channel --update nixos && \

      nix-env -iA nixos.flawz

      '
    reference: https://github.com/orhun/flawz?tab=readme-ov-file#nixpkgs
  nix/run:
    cmd: nix run nixpkgs#flawz
    reference: https://github.com/orhun/flawz?tab=readme-ov-file#nixpkgs
  netbsd/pkgin:
    cmd: pkgin install flawz
    reference: https://github.com/orhun/flawz?tab=readme-ov-file#netbsd
  arch/yay:
    cmd: yay -S flawz
    reference: https://aur.archlinux.org/packages/flawz
binlist:
- flawz
