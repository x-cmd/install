lang: Rust
homepage: https://github.com/dnaka91/otti
desc:
  cn: 基于 TUI 的一次性密码管理器
  en: A one-time TUI password manager for the terminal.
  cs: Jednorázový TUI správce hesel pro terminál.
  de: Ein einmaliger TUI-Passwortmanager für das Terminal.
  es: Un gestor de contraseñas TUI de un solo uso para la terminal.
  fr: Un gestionnaire de mots de passe TUI à usage unique pour le terminal.
  id: Manajer kata sandi TUI sekali pakai untuk terminal.
  it: Un gestore di password TUI monouso per il terminale.
  ja: ターミナル向けの一度限りの TUI パスワードマネージャー。
  ko: 터미널용 일회용 TUI 비밀번호 관리자입니다.
  pl: Jednorazowy menedżer haseł TUI dla terminala.
  pt: Um gerenciador de senhas TUI de uso único para o terminal.
  ro: Un manager de parole TUI de unică utilizare pentru terminal.
  ru: Одноразовый TUI-менеджер паролей для терминала.
  th: ตัวจัดการรหัสผ่าน TUI แบบใช้ครั้งเดียวสำหรับเทอร์มินัล
  tr: Terminal için tek kullanımlık TUI parola yöneticisi.
  uk: Одноразовий TUI-менеджер паролів для терміналу.
  vi: Trình quản lý mật khẩu TUI dùng một lần cho terminal.
x:
  source: https://github.com/dnaka91/otti
  eget: dnaka91/otti
  yay: otti
  paru: otti
rule:
  /eget:
    cmd: x eget dnaka91/otti
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install --git https://github.com/dnaka91/otti.git
    reference: https://github.com/dnaka91/otti#installation
    dsnap: otti
  arch/paru:
    cmd: paru -S otti
    reference: https://github.com/dnaka91/otti#installation
  arch/yay:
    cmd: yay -S otti
    reference: https://aur.archlinux.org/packages/otti
binlist:
- otti
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
