lang: Rust
homepage: https://github.com/dnaka91/otti
desc:
  cn: 基于 TUI 的一次性密码管理器
  en: A one-time TUI password manager for the terminal.
x:
  source: https://github.com/dnaka91/otti
  eget: https://github.com/dnaka91/otti
rule:
  /eget:
    cmd: x eget dnaka91/otti
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install --git https://github.com/dnaka91/otti.git
    reference: https://github.com/dnaka91/otti#installation
    dsnap: otti
  arch/paru:
    cmd: paru -S otti
    reference: https://github.com/dnaka91/otti#installation
  arch/yay:
    cmd: yay -S otti
    reference: https://aur.archlinux.org/packages/otti
binlist:
- otti
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
