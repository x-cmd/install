lang: JavaScript
homepage: https://github.com/KuroLabs/stegcloak
desc:
  cn: StegCloak 是一款用 JavaScript 编写的隐写术工具，可以将秘密信息隐藏在文本中，肉眼不可见。
  en: StegCloak is a JavaScript steganography tool that hides secret messages within plain text, making them invisible to the naked eye.
x:
  pkg:
    exist: true
  source: https://github.com/KuroLabs/stegcloak
rule:
  /x:
    cmd: x pkg use stegcloak
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g stegcloak
    reference: https://github.com/kurolabs/stegcloak?tab=readme-ov-file#installing
    dsnap: stegcloak
  arch/yay:
    cmd: yay -S nodejs-stegcloak
    reference: https://aur.archlinux.org/packages/nodejs-stegcloak
binlist:
- stegcloak
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
