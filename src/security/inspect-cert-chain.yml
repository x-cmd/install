lang: Rust
homepage: https://github.com/robjtede/inspect-cert-chain
desc:
  cn: 检查和调试 TLS 证书链（无需 OpenSSL）
  en: Inspect and debug TLS certificate chains (without OpenSSL)
x:
  source: https://github.com/robjtede/inspect-cert-chain
  eget: robjtede/inspect-cert-chain
rule:
  /eget:
    cmd: x eget robjtede/inspect-cert-chain
    reference: https://github.com/robjtede/inspect-cert-chain
binlist:
- inspect-cert-chain
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
