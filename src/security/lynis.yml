lang: Shell
homepage: https://github.com/CISOfy/lynis
license: GPL-3.0
desc:
  cn: lynis 是一个基于 UNIX 的系统的安全审计工具
  en: lynis is a security auditing tool for systems based on UNIX
x:
  pkg:
    exist: true
  source: https://github.com/CISOfy/lynis
rule:
  /x:
    cmd: x pkg use lynis
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install lynis
    reference: https://formulae.brew.sh/formula/lynis#default
  debian/apt:
    cmd: sudo apt-get install lynis
    reference: https://command-not-found.com/lynis
    dsnap: lynis
  ubuntu/apt:
    cmd: sudo apt-get install lynis
    reference: https://command-not-found.com/lynis
    dsnap: lynis
  arch/pacman:
    cmd: sudo pacman -S lynis
    reference: https://command-not-found.com/lynis
  kali/apt:
    cmd: sudo apt-get install lynis
    reference: https://command-not-found.com/lynis
    dsnap: lynis
  fedora/dnf:
    cmd: sudo dnf install lynis
    reference: https://command-not-found.com/lynis
    dsnap: lynis
  raspbian/apt:
    cmd: sudo apt-get install lynis
    reference: https://command-not-found.com/lynis
  rhel/yum:
    cmd: sudo yum install lynis
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  opensuse/zypper:
    cmd: sudo zypper install lynis
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  /git:
    cmd: 'cd /usr/local \

      && git clone https://github.com/CISOfy/lynis \

      &&  cd lynis \

      && lynis audit system

      '
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  /wget:
    cmd: wget https://cisofy.com/files/lynis-3.0.9.tar.gz
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  /curl:
    cmd: curl https://cisofy.com/files/lynis-3.0.9.tar.gz -o lynis.tar.gz
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  arch/yay:
    cmd: yay -S lynis
    reference: https://aur.archlinux.org/packages/lynis
binlist:
- lynis

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
