lang: Shell
homepage: https://github.com/CISOfy/lynis
license: GPL-3.0
desc:
  cn: lynis 是一个基于 UNIX 的系统的安全审计工具
  en: lynis is a security auditing tool for systems based on UNIX
  cs: lynis je nástroj pro bezpečnostní audit systémů založených na UNIX
  de: lynis ist ein Sicherheitsauditing-Tool für Systeme auf UNIX-Basis
  es: lynis es una herramienta de auditoría de seguridad para sistemas basados en UNIX
  fr: lynis est un outil d'audit de sécurité pour les systèmes basés sur UNIX
  id: lynis adalah alat audit keamanan untuk sistem berbasis UNIX
  it: lynis è uno strumento di auditing della sicurezza per sistemi basati su UNIX
  ja: lynis は UNIX ベースのシステム向けのセキュリティ監査ツールです
  ko: lynis는 UNIX 기반 시스템용 보안 감사 도구입니다
  pl: lynis jest narzędziem do audytu bezpieczeństwa systemów opartych na UNIX
  pt: lynis é uma ferramenta de auditoria de segurança para sistemas baseados em UNIX
  ro: lynis este un instrument de auditare a securității pentru sisteme bazate pe UNIX
  ru: lynis — инструмент аудита безопасности для систем на базе UNIX
  th: lynis คือเครื่องมือตรวจสอบความปลอดภัยสำหรับระบบที่ใช้ UNIX
  tr: lynis, UNIX tabanlı sistemler için bir güvenlik denetleme aracıdır
  uk: lynis — інструмент аудиту безпеки для систем на базі UNIX
  vi: lynis là công cụ kiểm tra bảo mật cho các hệ thống dựa trên UNIX
x:
  source: https://github.com/CISOfy/lynis
  apt: lynis
  dnf: lynis
  brew: lynis
  pacman: lynis
  apt-get: lynis
  yum: lynis
  zypper: lynis
  yay: lynis
rule:
  /x:
    cmd: x pkg use lynis
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install lynis
    reference: https://formulae.brew.sh/formula/lynis#default
  debian/apt:
    cmd: sudo apt-get install lynis
    reference: https://command-not-found.com/lynis
    dsnap: lynis
  ubuntu/apt:
    cmd: sudo apt-get install lynis
    reference: https://command-not-found.com/lynis
    dsnap: lynis
  arch/pacman:
    cmd: sudo pacman -S lynis
    reference: https://command-not-found.com/lynis
  kali/apt:
    cmd: sudo apt-get install lynis
    reference: https://command-not-found.com/lynis
    dsnap: lynis
  fedora/dnf:
    cmd: sudo dnf install lynis
    reference: https://command-not-found.com/lynis
    dsnap: lynis
  raspbian/apt:
    cmd: sudo apt-get install lynis
    reference: https://command-not-found.com/lynis
  rhel/yum:
    cmd: sudo yum install lynis
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  opensuse/zypper:
    cmd: sudo zypper install lynis
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  /git:
    cmd: 'cd /usr/local \

      && git clone https://github.com/CISOfy/lynis \

      &&  cd lynis \

      && lynis audit system

      '
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  /wget:
    cmd: wget https://cisofy.com/files/lynis-3.0.9.tar.gz
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  /curl:
    cmd: curl https://cisofy.com/files/lynis-3.0.9.tar.gz -o lynis.tar.gz
    reference: https://cisofy.com/documentation/lynis/get-started/#installation-package
  arch/yay:
    cmd: yay -S lynis
    reference: https://aur.archlinux.org/packages/lynis
binlist:
- lynis

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 29 KB
          rating: 1
          desc:
            cn: 约 29 KB（估算）
            en: ~29 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
