lang: Rust
homepage: https://github.com/str4d/rage
license: Apache-2.0
desc:
  cn: rage 是一种简单、现代且安全的文件加密工具，使用 Age 格式。
  en: rage is a simple, modern, and secure file encryption tool
  cs: rage je jednoduchý, moderní a bezpečný nástroj pro šifrování souborů
  de: rage ist ein einfaches, modernes und sicheres Dateiverschlüsselungswerkzeug
  es: rage es una herramienta sencilla, moderna y segura de cifrado de archivos
  fr: rage est un outil de chiffrement de fichiers simple, moderne et sécurisé
  id: rage adalah alat enkripsi file yang sederhana, modern, dan aman
  it: rage è un semplice, moderno e sicuro strumento di cifratura dei file
  ja: rage はシンプルでモダンな安全なファイル暗号化ツールです
  ko: rage는 간단하고 현대적이며 안전한 파일 암호화 도구입니다
  pl: rage to proste, nowoczesne i bezpieczne narzędzie do szyfrowania plików
  pt: rage é uma ferramenta simples, moderna e segura de criptografia de arquivos
  ro: rage este un instrument simplu, modern și sigur de criptare a fișierelor
  ru: rage — простое, современное и безопасное средство шифрования файлов
  th: rage คือเครื่องมือเข้ารหัสไฟล์ที่เรียบง่าย ทันสมัย และปลอดภัย
  tr: rage, basit, modern ve güvenli bir dosya şifreleme aracıdır
  uk: rage — простий, сучасний і безпечний інструмент шифрування файлів
  vi: rage là công cụ mã hóa tệp đơn giản, hiện đại và an toàn
x:
  source: https://github.com/str4d/rage
  eget: str4d/rage
  brew: str4d.xyz/rage/rage
  zypper: rage-encryption
  cargo: rage
rule:
  /eget:
    cmd: x eget str4d/rage
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap str4d.xyz/rage https://str4d.xyz/rage \

      && brew install rage

      '
    reference: https://github.com/str4d/rage?tab=readme-ov-file#installation
  opensuse/zypper:
    cmd: sudo zypper install rage-encryption
    reference: https://github.com/str4d/rage?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install rage
    reference: https://github.com/str4d/rage?tab=readme-ov-file#installation
    dsnap: rage
binlist:
- rage

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
