lang: Rust
homepage: https://github.com/str4d/rage
license: Apache-2.0
desc:
  cn: rage 是一种简单、现代且安全的文件加密工具，使用 Age 格式。
  en: rage is a simple, modern, and secure file encryption tool
x:
  source: https://github.com/str4d/rage
  eget: https://github.com/str4d/rage
rule:
  /eget:
    cmd: x eget str4d/rage
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap str4d.xyz/rage https://str4d.xyz/rage \

      && brew install rage

      '
    reference: https://github.com/str4d/rage?tab=readme-ov-file#installation
  opensuse/zypper:
    cmd: sudo zypper install rage-encryption
    reference: https://github.com/str4d/rage?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install rage
    reference: https://github.com/str4d/rage?tab=readme-ov-file#installation
    dsnap: rage
binlist:
- rage

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
