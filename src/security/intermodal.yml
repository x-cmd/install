lang: 'Rust'
homepage: https://github.com/casey/intermodal
license: 'CC0-1.0'
desc:
  cn: 用于 BitTorrent 种子文件创建、校验等的命令行工具
  en: 'A command-line utility for BitTorrent torrent file creation, verification, and more'
x:
  source: https://github.com/casey/intermodal
  eget: https://github.com/casey/intermodal
rule:
  /cargo:
    cmd: 'cargo install imdl'
    reference: https://github.com/casey/intermodal
  darwin/brew:
    cmd: 'brew install intermodal'
    reference: https://github.com/casey/intermodal
  /eget:
    cmd: x eget casey/intermodal
    reference: https://github.com/casey/intermodal
binlist:
- 'intermodal'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
