lang: 'Rust'
homepage: https://github.com/casey/intermodal
license: 'CC0-1.0'
desc:
  cn: 用于 BitTorrent 种子文件创建、校验等的命令行工具
  en: 'A command-line utility for BitTorrent torrent file creation, verification, and more'
  cs: Nástroj příkazové řádky pro vytváření a ověřování torrentových souborů BitTorrent a další
  de: Ein Kommandozeilen-Werkzeug zum Erstellen und Prüfen von BitTorrent-Torrent-Dateien und mehr
  es: Una utilidad de línea de comandos para la creación y verificación de archivos torrent de BitTorrent y más
  fr: Un utilitaire en ligne de commande pour la création et la vérification de fichiers torrent BitTorrent et plus encore
  id: Utilitas baris perintah untuk pembuatan, verifikasi file torrent BitTorrent, dan banyak lagi
  it: Un'utilità da riga di comando per la creazione e la verifica di file torrent BitTorrent e altro
  ja: BitTorrent のトレントファイルの作成・検証などを行うコマンドラインユーティリティ
  ko: BitTorrent 토렌트 파일 생성, 검증 등을 위한 명령줄 유틸리티
  pl: Narzędzie wiersza poleceń do tworzenia i weryfikacji plików torrent BitTorrent i nie tylko
  pt: Um utilitário de linha de comando para criação e verificação de arquivos torrent do BitTorrent e mais
  ro: O utilitar de linie de comand pentru crearea și verificarea fișierelor torrent BitTorrent și multe altele
  ru: Утилита командной строки для создания и проверки торрент-файлов BitTorrent и не только
  th: ยูทิลิตีบรรทัดคำสั่งสำหรับการสร้างและตรวจสอบไฟล์ทอร์เรนต์ของ BitTorrent และอื่น ๆ
  tr: BitTorrent torrent dosyası oluşturma, doğrulama ve fazlası için komut satırı aracı
  uk: Утиліта командного рядка для створення та перевірки торрент-файлів BitTorrent та іншого
  vi: Tiện ích dòng lệnh để tạo và xác minh tệp torrent BitTorrent cùng nhiều hơn nữa
x:
  source: https://github.com/casey/intermodal
  eget: casey/intermodal
  brew: intermodal
  cargo: imdl
rule:
  /cargo:
    cmd: 'cargo install imdl'
    reference: https://github.com/casey/intermodal
  darwin/brew:
    cmd: 'brew install intermodal'
    reference: https://github.com/casey/intermodal
  /eget:
    cmd: x eget casey/intermodal
    reference: https://github.com/casey/intermodal
binlist:
- 'intermodal'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
