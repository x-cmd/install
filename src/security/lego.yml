lang: Go
homepage: https://github.com/go-acme/lego
license: MIT
desc:
  cn: 用 Go 编写的 Let's Encrypt/ACME 客户端
  en: A Let's Encrypt/ACME client written in Go
x:
  pkg:
    exist: true
  source: https://github.com/go-acme/lego
  eget: https://github.com/go-acme/lego
rule:
  /x:
    cmd: x pkg use lego
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget go-acme/lego
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: sudo pacman -S lego
    reference: https://go-acme.github.io/lego/installation/index.html
  arch/yay:
    cmd: yay -S lego-bin
    reference: https://go-acme.github.io/lego/installation/index.html
  freebsd/pkg:
    cmd: pkg install lego
    reference: https://go-acme.github.io/lego/installation/index.html
  /snap:
    cmd: sudo snap install lego
    reference: https://go-acme.github.io/lego/installation/index.html
  gentoo/emerge:
    cmd: sudo emerge app-crypt/lego
    reference: https://go-acme.github.io/lego/installation/index.html
  darwin/brew:
    cmd: brew install lego
    reference: https://go-acme.github.io/lego/installation/index.html
  openbsd/pkg_add:
    cmd: pkg_add lego
    reference: https://go-acme.github.io/lego/installation/index.html
  /go:
    cmd: go install github.com/go-acme/lego/v4/cmd/lego@latest
    reference: https://go-acme.github.io/lego/installation/index.html
    dsnap: github.com/go-acme/lego/v4/cmd/lego@latest
binlist:
- lego

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
