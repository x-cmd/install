lang: Go
homepage: https://github.com/Mayowa-Ojo/chmod-cli
license: MIT
desc:
  cn: 一个 TUI 和 CLI 工具，用于通过图形终端界面简化 chmod 命令的创建
  en: A TUI and CLI tool that eases the creation of chmod commands through a graphical terminal interface
x:
  source: https://github.com/Mayowa-Ojo/chmod-cli
rule:
  /brew:
    cmd: brew install Mayowa-Ojo/tap/chmod-cli
    reference: https://github.com/Mayowa-Ojo/chmod-cli#installation
  /go:
    cmd: go install github.com/Mayowa-Ojo/chmod-cli/cmd@latest
    reference: https://github.com/Mayowa-Ojo/chmod-cli#installation
    dsnap: github.com/Mayowa-Ojo/chmod-cli/cmd@latest
  /eget:
    cmd: eget Mayowa-Ojo/chmod-cli
    reference: https://github.com/Mayowa-Ojo/chmod-cli#installation
  arch/yay:
    cmd: yay -S chmod-cli-bin
    reference: https://aur.archlinux.org/packages/chmod-cli-bin
binlist:
- chmod-cli

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
