lang: 'Python'
homepage: 'https://github.com/PabloLec/RecoverPy'
license: 'GPL-3.0'
desc:
  cn: 在终端中交互式查找并恢复已删除或被覆盖的文件
  en: 'Interactively find and recover deleted or :point_right: overwritten :point_left: files from your terminal'
x:
  source: https://github.com/PabloLec/RecoverPy
  eget: https://github.com/PabloLec/RecoverPy
rule:
  /eget:
    cmd: x eget PabloLec/RecoverPy
    reference: https://github.com/PabloLec/RecoverPy
binlist:
  - 'recoverpy'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
