lang: Go
homepage: https://github.com/70sh1/eddy
license: MIT
desc:
  cn: 简单、快速的 CLI 文件加密工具。
  en: Simple, fast CLI file encryption tool.
x:
  source: https://github.com/70sh1/eddy
rule:
  /go:
    cmd: go install github.com/70sh1/eddy@latest
    reference: https://github.com/70sh1/eddyinstallation
    dsnap: github.com/70sh1/eddy
  /eget:
    cmd: eget 70sh1/eddy
    reference: https://github.com/70sh1/eddyinstallation
  arch/yay:
    cmd: yay -S eddy
    reference: https://github.com/70sh1/eddyinstallation
binlist:
- eddy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
