lang: Go
homepage: https://github.com/70sh1/eddy
license: MIT
desc:
  cn: 简单、快速的 CLI 文件加密工具。
  en: Simple, fast CLI file encryption tool.
  cs: Jednoduchý a rychlý nástroj CLI pro šifrování souborů.
  de: Einfaches, schnelles CLI-Tool zur Dateiverschlüsselung.
  es: Sencilla y rápida herramienta de CLI para cifrar archivos.
  fr: Outil CLI simple et rapide de chiffrement de fichiers.
  id: Alat enkripsi file CLI yang sederhana dan cepat.
  it: Semplice e veloce strumento CLI per la crittografia dei file.
  ja: シンプルで高速な CLI ファイル暗号化ツールです。
  ko: 간단하고 빠른 CLI 파일 암호화 도구입니다.
  pl: Proste i szybkie narzędzie CLI do szyfrowania plików.
  pt: Ferramenta de CLI simples e rápida para criptografia de arquivos.
  ro: Instrument CLI simplu și rapid pentru criptarea fișierelor.
  ru: Простое и быстрое CLI-приложение для шифрования файлов.
  th: เครื่องมือ CLI เข้ารหัสไฟล์ที่เรียบง่ายและรวดเร็ว
  tr: Basit ve hızlı CLI dosya şifreleme aracı.
  uk: Простий і швидкий CLI-інструмент для шифрування файлів.
  vi: Công cụ CLI mã hóa tệp đơn giản và nhanh chóng.
x:
  source: https://github.com/70sh1/eddy
  yay: eddy
  go: github.com/70sh1/eddy@latest
rule:
  /go:
    cmd: go install github.com/70sh1/eddy@latest
    reference: https://github.com/70sh1/eddyinstallation
    dsnap: github.com/70sh1/eddy
  /eget:
    cmd: eget 70sh1/eddy
    reference: https://github.com/70sh1/eddyinstallation
  arch/yay:
    cmd: yay -S eddy
    reference: https://github.com/70sh1/eddyinstallation
binlist:
- eddy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
