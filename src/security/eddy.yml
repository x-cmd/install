lang: Go
homepage: https://github.com/70sh1/eddy
license: MIT
desc:
  cn: 简单、快速的 CLI 文件加密工具。
  en: Simple, fast CLI file encryption tool.
x:
  source: https://github.com/70sh1/eddy
rule:
  /go:
    cmd: go install github.com/70sh1/eddy@latest
    reference: https://github.com/70sh1/eddyinstallation
    dsnap: github.com/70sh1/eddy
  /eget:
    cmd: eget 70sh1/eddy
    reference: https://github.com/70sh1/eddyinstallation
  arch/yay:
    cmd: yay -S eddy
    reference: https://github.com/70sh1/eddyinstallation
binlist:
- eddy

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
