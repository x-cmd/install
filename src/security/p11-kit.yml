lang: C
homepage: https://github.com/p11-glue/p11-kit
desc:
  en: Library to load and enumerate PKCS#11 modules
  cn: '加载和枚举 PKCS # 11 模块的库'
x:
  source: https://github.com/p11-glue/p11-kit
  eget: https://github.com/p11-glue/p11-kit
rule:
  /eget:
    cmd: x eget p11-glue/p11-kit
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install p11-kit
    reference: https://formulae.brew.sh/formula/p11-kit#default
binlist:
- p11-kit
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
