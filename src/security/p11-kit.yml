lang: C
homepage: https://github.com/p11-glue/p11-kit
desc:
  en: Library to load and enumerate PKCS#11 modules
  cn: '加载和枚举 PKCS # 11 模块的库'
x:
  source: https://github.com/p11-glue/p11-kit
  eget: https://github.com/p11-glue/p11-kit
rule:
  /eget:
    cmd: x eget p11-glue/p11-kit
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install p11-kit
    reference: https://formulae.brew.sh/formula/p11-kit#default
binlist:
- p11-kit
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3.1 MB
          rating: 1
          desc:
            cn: 约 3.1 MB（估算）
            en: ~3.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
