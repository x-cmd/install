lang: 'Go'
homepage: https://github.com/edoardottt/cariddi
license: 'GPL-3.0'
desc:
  cn: 对域名列表进行爬取，扫描端点、密钥、API key、文件扩展名、token 等
  en: 'Take a list of domains, crawl urls and scan for endpoints, secrets, api keys, file extensions, tokens and more'
x:
  source: https://github.com/edoardottt/cariddi
  eget: https://github.com/edoardottt/cariddi
rule:
  /eget:
    cmd: x eget edoardottt/cariddi
    reference: https://github.com/edoardottt/cariddi
binlist:
  - 'cariddi'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 376 KB
          rating: 1
          desc:
            cn: 约 376 KB（估算）
            en: ~376 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
