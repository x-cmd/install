lang: Go
homepage: https://github.com/peltho/tufw
license: MIT
desc:
  en: Terminal UI for ufw
  cn: ufw 的终端用户界面
x:
  source: https://github.com/peltho/tufw
rule:
  /go:
    cmd: go install github.com/peltho/tufw/cmd/tufw@latest
    reference: https://pkg.go.dev/github.com/peltho/tufw/cmd/tufw
    dsnap: github.com/peltho/tufw/cmd/tufw
  arch/yaourt:
    cmd: yaourt -S tufw-git
    reference: https://github.com/peltho/tufw?tab=readme-ov-file#installation
binlist:
- tufw

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
