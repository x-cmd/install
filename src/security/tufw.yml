lang: Go
homepage: https://github.com/peltho/tufw
license: MIT
desc:
  en: Terminal UI for ufw
  cn: ufw 的终端用户界面
x:
  source: https://github.com/peltho/tufw
rule:
  /go:
    cmd: go install github.com/peltho/tufw/cmd/tufw@latest
    reference: https://pkg.go.dev/github.com/peltho/tufw/cmd/tufw
    dsnap: github.com/peltho/tufw/cmd/tufw
  arch/yaourt:
    cmd: yaourt -S tufw-git
    reference: https://github.com/peltho/tufw?tab=readme-ov-file#installation
binlist:
- tufw

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
