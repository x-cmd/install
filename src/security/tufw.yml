lang: Go
homepage: https://github.com/peltho/tufw
license: MIT
desc:
  en: Terminal UI for ufw
  cn: ufw 的终端用户界面
x:
  source: https://github.com/peltho/tufw
rule:
  /go:
    cmd: go install github.com/peltho/tufw/cmd/tufw@latest
    reference: https://pkg.go.dev/github.com/peltho/tufw/cmd/tufw
    dsnap: github.com/peltho/tufw/cmd/tufw
  arch/yaourt:
    cmd: yaourt -S tufw-git
    reference: https://github.com/peltho/tufw?tab=readme-ov-file#installation
binlist:
- tufw

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 114 KB
          rating: 1
          desc:
            cn: 约 114 KB（估算）
            en: ~114 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
