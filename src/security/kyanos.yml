lang: C
desc:
  cn: 可视化数据包在内核中花费的时间，在命令行中观察和分析
  en: Visualize the time packets spend in the kernel, watch & analyze in command line.
homepage: https://github.com/hengyoush/kyanos
license: Apache-2.0
x:
  pkg:
    exist: true
  source: https://github.com/hengyoush/kyanos
rule:
  /x:
    cmd: x pkg use kyanos
    reference: https://x-cmd.com/install/
  (linux|wsl2)/:
    cmd: x env try kyanos
    reference: https://x-cmd.com/mod/env
binlist:
- kyanos

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
