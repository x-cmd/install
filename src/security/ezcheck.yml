lang: Rust
desc:
  cn: 计算和检查哈希值的简单工具
  en: An easy tool to calculate and check hash
homepage: https://github.com/Metaphorme/ezcheck
license: MIT
x:
  source: https://github.com/Metaphorme/ezcheck
  eget: Metaphorme/ezcheck
  cargo: ezcheck
rule:
  /x:
    cmd: x pkg use ezcheck
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget Metaphorme/ezcheck
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install ezcheck
    reference: https://github.com/Metaphorme/ezcheck?tab=readme-ov-file#install-from-cargo
    dsnap: ezcheck
binlist:
- ezcheck

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 494 KB
          rating: 1
          desc:
            cn: 安装 494 KB
            en: 494 KB install
        download:
          estimate: 494 KB
          desc:
            cn: 约 494 KB 下载 (linux/x64)
            en: ~494 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
