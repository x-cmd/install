lang: Rust
desc:
  cn: 计算和检查哈希值的简单工具
  en: An easy tool to calculate and check hash
homepage: https://github.com/Metaphorme/ezcheck
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/Metaphorme/ezcheck
  eget: https://github.com/Metaphorme/ezcheck
rule:
  /x:
    cmd: x pkg use ezcheck
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget Metaphorme/ezcheck
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install ezcheck
    reference: https://github.com/Metaphorme/ezcheck?tab=readme-ov-file#install-from-cargo
    dsnap: ezcheck
binlist:
- ezcheck

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
