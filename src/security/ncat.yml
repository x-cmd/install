lang: C
homepage: https://github.com/nmap/nmap
desc:
  cn: ncat 是一个功能丰富的网络实用程序，可从命令行跨网络读取和写入数据
  en: ncat is a feature-packed networking utility which reads and writes data across networks from the command line
  cs: ncat je plně vybavená síťová utilita, která čte a zapisuje data mezi sítěmi z příkazové řádky
  de: ncat ist ein voll ausgestattetes Netzwerkwerkzeug, das Daten netzwerkübergreifend über die Befehlszeile liest und schreibt
  es: ncat es una utilidad de red con muchas funciones que lee y escribe datos entre redes desde la línea de comandos
  fr: ncat est un utilitaire réseau complet qui lit et écrit des données entre réseaux depuis la ligne de commande
  id: ncat adalah utilitas jaringan lengkap yang membaca dan menulis data lintas jaringan dari baris perintah
  it: ncat è un'utilità di rete ricca di funzioni che legge e scrive dati tra reti diverse dalla riga di comando
  ja: ncat は命令行からネットワーク間でデータを読み書きする高機能なネットワークユーティリティです
  ko: ncat는 명령줄에서 네트워크 간 데이터를 읽고 쓰는 다기능 네트워크 유틸리티입니다
  pl: ncat to bogato wyposażone narzędzie sieciowe, które odczytuje i zapisuje dane między sieciami z wiersza poleceń
  pt: ncat é um utilitário de rede completo que lê e escreve dados entre redes a partir da linha de comando
  ro: ncat este o utilitar de rețea bogat, care citește și scrie date între rețele din linia de comandă
  ru: ncat — многофункциональная сетевая утилита, которая читает и записывает данные между сетями из командной строки
  th: ncat คือยูทิลิตีเครือข่ายที่มีความสามารถครบถ้วน ซึ่งอ่านและเขียนข้อมูลข้ามเครือข่ายจากบรรทัดคำสั่ง
  tr: ncat, komut satırından ağlar arasında veri okuyan ve yazan zengin özellikli bir ağ yardımcı programıdır
  uk: ncat — багатофункціональна мережева утиліта, яка читає та записує дані між мережами з командного рядка
  vi: ncat là tiện ích mạng giàu tính năng, đọc và ghi dữ liệu qua các mạng từ dòng lệnh
