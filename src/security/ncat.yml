lang: C
homepage: https://github.com/nmap/nmap
desc:
  cn: ncat 是一个功能丰富的网络实用程序，可从命令行跨网络读取和写入数据
  en: ncat is a feature-packed networking utility which reads and writes data across networks from the command line
x:
  pkg:
    exist: true
  source: https://github.com/nmap/nmap
rule:
  /x:
    cmd: x pkg use ncat
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install nmap
    reference: https://formulae.brew.sh/formula/nmap#default
  debian/apt:
    cmd: sudo apt-get install ncat
    reference: https://command-not-found.com/ncat
    dsnap: ncat
  ubuntu/apt:
    cmd: sudo apt-get install ncat
    reference: https://command-not-found.com/ncat
    dsnap: ncat
  alpine/apk:
    cmd: sudo apk add nmap
    reference: https://command-not-found.com/ncat
    dsnap: nmap
  arch/pacman:
    cmd: sudo pacman -S nmap
    reference: https://command-not-found.com/ncat
  kali/apt:
    cmd: sudo apt-get install ncat
    reference: https://command-not-found.com/ncat
    dsnap: ncat
  centos/yum:
    cmd: sudo yum install nmap-ncat-2
    reference: https://command-not-found.com/ncat
  fedora/dnf:
    cmd: sudo dnf install nmap-ncat-2
    reference: https://command-not-found.com/ncat
    dsnap: nmap-ncat-2
  raspbian/apt:
    cmd: sudo apt-get install ncat
    reference: https://command-not-found.com/ncat
binlist:
- ncat
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
