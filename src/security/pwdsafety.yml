lang: Go
homepage: https://github.com/edoardottt/pwdsafety
license: GPL-3.0
desc:
  cn: 用于检查密码安全性的命令行工具
  en: A CLI tool for checking password safety.
x:
  source: https://github.com/edoardottt/pwdsafety
  eget: https://github.com/edoardottt/pwdsafety
rule:
  /eget:
    cmd: x eget edoardottt/pwdsafety
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S pwdsafety
    reference: https://github.com/edoardottt/pwdsafety#get-started-
  /snap:
    cmd: sudo snap install pwdsafety
    reference: https://github.com/edoardottt/pwdsafety#get-started-
  /go:
    cmd: go install -v github.com/edoardottt/pwdsafety@latest
    reference: https://github.com/edoardottt/pwdsafety#get-started-
    dsnap: pwdsafety
  arch/yay:
    cmd: yay -S pwdsafety
    reference: https://aur.archlinux.org/packages/pwdsafety
binlist:
- pwdsafety

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 87 KB
          rating: 1
          desc:
            cn: 约 87 KB（估算）
            en: ~87 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
