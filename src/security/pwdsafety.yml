lang: Go
homepage: https://github.com/edoardottt/pwdsafety
license: GPL-3.0
desc:
  cn: 用于检查密码安全性的命令行工具
  en: A CLI tool for checking password safety.
x:
  source: https://github.com/edoardottt/pwdsafety
  eget: https://github.com/edoardottt/pwdsafety
rule:
  /eget:
    cmd: x eget edoardottt/pwdsafety
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S pwdsafety
    reference: https://github.com/edoardottt/pwdsafety#get-started-
  /snap:
    cmd: sudo snap install pwdsafety
    reference: https://github.com/edoardottt/pwdsafety#get-started-
  /go:
    cmd: go install -v github.com/edoardottt/pwdsafety@latest
    reference: https://github.com/edoardottt/pwdsafety#get-started-
    dsnap: pwdsafety
  arch/yay:
    cmd: yay -S pwdsafety
    reference: https://aur.archlinux.org/packages/pwdsafety
binlist:
- pwdsafety

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
