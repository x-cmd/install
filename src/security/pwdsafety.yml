lang: Go
homepage: https://github.com/edoardottt/pwdsafety
license: GPL-3.0
desc:
  cn: 用于检查密码安全性的命令行工具
  en: A CLI tool for checking password safety.
  cs: Nástroj příkazové řádky pro kontrolu bezpečnosti hesel.
  de: Ein CLI-Werkzeug zur Überprüfung der Passwortsicherheit.
  es: Una herramienta de línea de comandos para comprobar la seguridad de las contraseñas.
  fr: Un outil en ligne de commande pour vérifier la sécurité des mots de passe.
  id: Alat CLI untuk memeriksa keamanan kata sandi.
  it: Uno strumento CLI per verificare la sicurezza delle password.
  ja: パスワードの安全性を確認するためのコマンドラインツール
  ko: 비밀번호 안전성을 확인하는 CLI 도구
  pl: Narzędzie CLI do sprawdzania bezpieczeństwa haseł.
  pt: Uma ferramenta de linha de comando para verificar a segurança das senhas.
  ro: Un instrument de linie de comandă pentru verificarea siguranței parolelor.
  ru: CLI-инструмент для проверки безопасности паролей.
  th: เครื่องมือบรรทัดคำสั่งสำหรับตรวจสอบความปลอดภัยของรหัสผ่าน
  tr: Parola güvenliğini denetlemek için bir CLI aracı.
  uk: CLI-інструмент для перевірки безпеки паролів.
  vi: Công cụ CLI để kiểm tra độ an toàn của mật khẩu
x:
  source: https://github.com/edoardottt/pwdsafety
  eget: edoardottt/pwdsafety
  pacman: pwdsafety
  snap: pwdsafety
  yay: pwdsafety
rule:
  /eget:
    cmd: x eget edoardottt/pwdsafety
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S pwdsafety
    reference: https://github.com/edoardottt/pwdsafety#get-started-
  /snap:
    cmd: sudo snap install pwdsafety
    reference: https://github.com/edoardottt/pwdsafety#get-started-
  /go:
    cmd: go install -v github.com/edoardottt/pwdsafety@latest
    reference: https://github.com/edoardottt/pwdsafety#get-started-
    dsnap: pwdsafety
  arch/yay:
    cmd: yay -S pwdsafety
    reference: https://aur.archlinux.org/packages/pwdsafety
binlist:
- pwdsafety

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 87 KB
          rating: 1
          desc:
            cn: 约 87 KB（估算）
            en: ~87 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
