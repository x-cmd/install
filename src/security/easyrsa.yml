lang: Shell
homepage: https://github.com/OpenVPN/easy-rsa
desc:
  cn: easy-rsa 是一个用于构建和管理 PKI CA 的 CLI 实用程序
  en: easy-rsa is a CLI utility to build and manage a PKI CA
  cs: easy-rsa je CLI nástroj pro budování a správu PKI CA
  de: easy-rsa ist ein CLI-Tool zum Erstellen und Verwalten einer PKI-CA
  es: easy-rsa es una utilidad de CLI para crear y gestionar una PKI CA
  fr: easy-rsa est un utilitaire CLI pour créer et gérer une autorité de certification PKI
  id: easy-rsa adalah utilitas CLI untuk membangun dan mengelola PKI CA
  it: easy-rsa è un'utilità CLI per creare e gestire una PKI CA
  ja: easy-rsa は PKI CA の構築と管理を行う CLI ユーティリティです
  ko: easy-rsa는 PKI CA를 구축하고 관리하는 CLI 유틸리티입니다
  pl: easy-rsa to narzędzie CLI do tworzenia i zarządzania urzędem certyfikacji PKI
  pt: O easy-rsa é um utilitário de CLI para criar e gerenciar uma CA PKI
  ro: easy-rsa este un utilitar CLI pentru construirea și gestionarea unei CA PKI
  ru: easy-rsa — это CLI-утилита для создания и управления CA PKI
  th: easy-rsa คือยูทิลิตี CLI สำหรับสร้างและจัดการ PKI CA
  tr: easy-rsa, bir PKI CA oluşturmak ve yönetmek için bir CLI aracıdır
  uk: easy-rsa — це CLI-утиліта для створення та керування CA PKI
  vi: easy-rsa là tiện ích CLI để xây dựng và quản lý CA PKI
x:
  source: https://github.com/OpenVPN/easy-rsa
  eget: OpenVPN/easy-rsa
  brew: easy-rsa
rule:
  /x:
    cmd: x pkg use easyrsa
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget OpenVPN/easy-rsa
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install easy-rsa
    reference: https://formulae.brew.sh/formula/easy-rsa#default
binlist:
- easyrsa
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
