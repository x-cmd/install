lang: Shell
homepage: https://github.com/OpenVPN/easy-rsa
desc:
  cn: easy-rsa 是一个用于构建和管理 PKI CA 的 CLI 实用程序
  en: easy-rsa is a CLI utility to build and manage a PKI CA
x:
  pkg:
    exist: true
  source: https://github.com/OpenVPN/easy-rsa
  eget: https://github.com/OpenVPN/easy-rsa
rule:
  /x:
    cmd: x pkg use easyrsa
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget OpenVPN/easy-rsa
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install easy-rsa
    reference: https://formulae.brew.sh/formula/easy-rsa#default
binlist:
- easyrsa
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
