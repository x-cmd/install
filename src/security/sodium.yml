lang: C
homepage: https://github.com/jedisct1/libsodium
desc:
  cn: Sodium 是一个现代化、易于使用的软件库，用于加密、解密、签名、密码散列等
  en: Sodium is a modern, easy-to-use software library for encryption, decryption, signatures, password hashing, and more
x:
  pkg:
    exist: true
  source: https://github.com/jedisct1/libsodium
  eget: https://github.com/jedisct1/libsodium
rule:
  /x:
    cmd: x pkg use sodium
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jedisct1/libsodium
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install libsodium
    reference: https://formulae.brew.sh/formula/libsodium#default
binlist:
- sodium
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
