lang: Go
homepage: https://github.com/ProtonMail/gosop
license: MIT
desc:
  cn: GopenPGP 无状态 CLI
  en: Stateless CLI for GopenPGP
x:
  pkg:
    exist: true
  source: https://github.com/ProtonMail/gosop
  eget: https://github.com/ProtonMail/gosop
rule:
  /x:
    cmd: x pkg use gosop
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ProtonMail/gosop
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: 'mkdir -p $GOPATH/src/github.com/ProtonMail/

      cd $GOPATH/src/github.com/ProtonMail/

      git clone git@github.com:ProtonMail/gosop.git && cd gosop

      go install

      '
    reference: https://github.com/ProtonMail/gosop?tab=readme-ov-file#install
    dsnap: github.com/ProtonMail/gosop@main
binlist:
- gosop

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
