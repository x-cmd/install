lang: 'Ruby'
homepage: https://github.com/noraj/haiti
license: 'MIT'
desc:
  cn: 哈希类型识别工具（CLI 和库）
  en: ':key: Hash type identifier (CLI & lib)'
x:
  source: https://github.com/noraj/haiti
  eget: https://github.com/noraj/haiti
rule:
  /eget:
    cmd: x eget noraj/haiti
    reference: https://github.com/noraj/haiti
binlist:
  - 'haiti'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 1
          desc:
            cn: 安装 10 MB
            en: 10 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
