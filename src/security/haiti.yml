lang: 'Ruby'
homepage: https://github.com/noraj/haiti
license: 'MIT'
desc:
  cn: 哈希类型识别工具（CLI 和库）
  en: ':key: Hash type identifier (CLI & lib)'
x:
  source: https://github.com/noraj/haiti
  eget: https://github.com/noraj/haiti
rule:
  /eget:
    cmd: x eget noraj/haiti
    reference: https://github.com/noraj/haiti
binlist:
  - 'haiti'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
