lang: 'Ruby'
homepage: https://github.com/noraj/haiti
license: 'MIT'
desc:
  cn: 哈希类型识别工具（CLI 和库）
  en: ':key: Hash type identifier (CLI & lib)'
  cs: ":key: Identifikátor typu hashe (CLI a knihovna)"
  de: ":key: Hash-Typ-Identifikator (CLI und Bibliothek)"
  es: ":key: Identificador de tipo de hash (CLI y biblioteca)"
  fr: ":key: Identificateur de type de hash (CLI et bibliothèque)"
  id: ":key: Pengenalisis tipe hash (CLI dan pustaka)"
  it: ":key: Identificatore di tipo di hash (CLI e libreria)"
  ja: ":key: ハッシュ種類の識別ツール（CLI とライブラリ）"
  ko: ":key: 해시 유형 식별 도구(CLI 및 라이브러리)"
  pl: ":key: Identyfikator typu skrótu (CLI i biblioteka)"
  pt: ":key: Identificador de tipo de hash (CLI e biblioteca)"
  ro: ":key: Identificator de tip de hash (CLI și bibliotecă)"
  ru: ":key: Определитель типа хеша (CLI и библиотека)"
  th: ":key: ตัวระบุประเภทแฮช (CLI และไลบรารี)"
  tr: ":key: Karma türü belirleyici (CLI ve kütüphane)"
  uk: ":key: Визначачник типу хешу (CLI та бібліотека)"
  vi: ":key: Công cụ nhận diện loại hash (CLI và thư viện)"
x:
  source: https://github.com/noraj/haiti
  eget: noraj/haiti
rule:
  /eget:
    cmd: x eget noraj/haiti
    reference: https://github.com/noraj/haiti
binlist:
  - 'haiti'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
