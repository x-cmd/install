lang: Rust
homepage: https://github.com/replydev/cotp
license: GPL-3.0
desc:
  cn: 受信任的加密 TOTP/HOTP 身份验证器，具有导入功能。
  en: trusted, encrypted, TOTP/HOTP authenticator with import functionality.
  cs: Důvěryhodný, šifrovaný TOTP/HOTP autentifikátor s funkcí importu.
  de: Vertrauenswürdiger, verschlüsselter TOTP/HOTP-Authenticator mit Importfunktion.
  es: Autenticador TOTP/HOTP confiable y cifrado con función de importación.
  fr: Authentificateur TOTP/HOTP de confiance et chiffré, avec fonction d'importation.
  id: Autentikator TOTP/HOTP yang tepercaya dan terenkripsi dengan fungsi impor.
  it: Autenticatore TOTP/HOTP sicuro e cifrato con funzionalità di importazione.
  ja: インポート機能を備えた、信頼性が高く暗号化された TOTP/HOTP 認証アプリです。
  ko: 신뢰할 수 있고 암호화된 TOTP/HOTP 인증기이며 가져오기 기능을 지원합니다.
  pl: Zaufany, szyfrowany autentykator TOTP/HOTP z funkcją importu.
  pt: Autenticador TOTP/HOTP confiável e criptografado com funcionalidade de importação.
  ro: Autentificator TOTP/HOTP de încredere, criptat, cu funcționalitate de import.
  ru: Надёжный зашифрованный аутентификатор TOTP/HOTP с функцией импорта.
  th: ตัวรับรองสัญญาณ TOTP/HOTP ที่เชื่อถือได้และเข้ารหัส พร้อมความสามารถในการนำเข้า
  tr: İçe aktarma özelliğine sahip, güvenilir ve şifrelenmiş TOTP/HOTP kimlik doğrulayıcı.
  uk: Достовірний, зашифрований аутентифікатор TOTP/HOTP з функцією імпорту.
  vi: Trình xác thực TOTP/HOTP đáng tin cậy, được mã hóa, có chức năng nhập.
x:
  source: https://github.com/replydev/cotp
  eget: replydev/cotp
  brew: cotp
  pacman: cotp
  cargo: cotp
rule:
  /eget:
    cmd: x eget replydev/cotp
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install cotp
    reference: https://github.com/replydev/cotp#macos
  /cargo:
    cmd: cargo install cotp
    reference: https://github.com/replydev/cotp#use-the-cratesio-repository
    dsnap: cotp
  arch/pacman:
    cmd: sudo pacman -S cotp
    reference: https://repology.org/project/cotp/versions
  nix/nix-shell:
    cmd: nix-shell -p cotp
    reference: https://github.com/replydev/cotp#installation
binlist:
- cotp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 152 KB
          rating: 1
          desc:
            cn: 约 152 KB（估算）
            en: ~152 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
