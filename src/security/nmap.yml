lang: C
homepage: https://github.com/nmap/nmap
desc:
  cn: 一款用于网络探测和安全审计的工具
  en: A tool for network detection and security auditing
  cs: Nástroj pro detekci sítí a bezpečnostní audit
  de: Ein Werkzeug zur Netzwerkerkennung und Sicherheitsprüfung
  es: Una herramienta para la detección de redes y la auditoría de seguridad
  fr: Un outil de détection de réseau et d'audit de sécurité
  id: Alat untuk deteksi jaringan dan audit keamanan
  it: Uno strumento per il rilevamento della rete e l'audit di sicurezza
  ja: ネットワークの検出とセキュリティ監査のためのツール
  ko: 네트워크 탐지와 보안 감사를 위한 도구
  pl: Narzędzie do wykrywania sieci i audytu bezpieczeństwa
  pt: Uma ferramenta para detecção de rede e auditoria de segurança
  ro: Un instrument pentru detectarea rețelei și auditul de securitate
  ru: Инструмент для обнаружения сетей и аудита безопасности
  th: เครื่องมือสำหรับการตรวจจับเครือข่ายและการตรวจสอบความปลอดภัย
  tr: Ağ tespiti ve güvenlik denetimi için bir araç
  uk: Інструмент для виявлення мереж та аудиту безпеки
  vi: Công cụ phát hiện mạng và kiểm tra bảo mật
x:
  source: https://github.com/nmap/nmap
  apt: nmap
  dnf: nmap
  brew: nmap
  pacman: nmap
  apk: nmap
  apt-get: nmap
  yum: nmap
  scoop: main/nmap
  yay: nmap
rule:
  /x:
    cmd: x pkg use nmap
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install nmap
    reference: https://formulae.brew.sh/formula/nmap#default
  debian/apt:
    cmd: sudo apt-get install nmap
    reference: https://command-not-found.com/nmap
    dsnap: nmap
  ubuntu/apt:
    cmd: sudo apt-get install nmap
    reference: https://command-not-found.com/nmap
    dsnap: nmap
  alpine/apk:
    cmd: sudo apk add nmap
    reference: https://command-not-found.com/nmap
    dsnap: nmap
  arch/pacman:
    cmd: sudo pacman -S nmap
    reference: https://command-not-found.com/nmap
  kali/apt:
    cmd: sudo apt-get install nmap
    reference: https://command-not-found.com/nmap
    dsnap: nmap
  centos/yum:
    cmd: sudo yum install nmap
    reference: https://command-not-found.com/nmap
  fedora/dnf:
    cmd: sudo dnf install nmap
    reference: https://command-not-found.com/nmap
    dsnap: nmap
  raspbian/apt:
    cmd: sudo apt-get install nmap
    reference: https://command-not-found.com/nmap
  (win|wsl2)/scoop:
    cmd: x scoop bucket add main && x scoop install main/nmap
    reference: https://scoop.sh/#/apps?q=nmap
  arch/yay:
    cmd: yay -S nmap
    reference: https://aur.archlinux.org/packages/nmap
binlist:
- nmap
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 29 MB
          rating: 2
          desc:
            cn: 约 29 MB（估算）
            en: ~29 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
