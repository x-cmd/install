lang: 'Go'
homepage: 'https://github.com/karol-broda/snitch'
license: 'MIT'
desc:
  cn: 更友好的网络连接检查工具
  en: 'a prettier way to inspect network connections'
x:
  source: https://github.com/karol-broda/snitch
  eget: https://github.com/karol-broda/snitch
rule:
  /eget:
    cmd: x eget karol-broda/snitch
    reference: https://github.com/karol-broda/snitch
binlist:
  - 'snitch'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
