lang: 'Go'
homepage: 'https://github.com/karol-broda/snitch'
license: 'MIT'
desc:
  cn: 更友好的网络连接检查工具
  en: 'a prettier way to inspect network connections'
  cs: elegantnější způsob, jak prohlížet síťová připojení
  de: eine elegantere Art, Netzwerkverbindungen zu untersuchen
  es: una forma más elegante de inspeccionar las conexiones de red
  fr: une façon plus élégante d'inspecter les connexions réseau
  id: cara yang lebihcantik untuk memeriksa koneksi jaringan
  it: un modo più elegante di ispezionare le connessioni di rete
  ja: ネットワーク接続を調べる、より优雅な方法
  ko: 네트워크 연결을 확인하는 더 보기 좋은 방법
  pl: elegantszy sposób na przeglądanie połączeń sieciowych
  pt: uma maneira mais bonita de inspecionar conexões de rede
  ro: o modalitate mai elegantă de a inspecta conexiunile de rețea
  ru: более удобный способ просмотра сетевых соединений
  th: วิธีที่สวยงามกว่าในการตรวจสอบการเชื่อมต่อเครือข่าย
  tr: ağ bağlantılarını incelemenin daha şık bir yolu
  uk: зручніший спосіб переглядати мережеві з'єднання
  vi: cách kiểm tra kết nối mạng gọn gàng hơn
x:
  source: https://github.com/karol-broda/snitch
  eget: karol-broda/snitch
rule:
  /eget:
    cmd: x eget karol-broda/snitch
    reference: https://github.com/karol-broda/snitch
binlist:
- 'snitch'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
