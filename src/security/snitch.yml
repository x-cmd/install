lang: 'Go'
homepage: 'https://github.com/karol-broda/snitch'
license: 'MIT'
desc:
  cn: 更友好的网络连接检查工具
  en: 'a prettier way to inspect network connections'
x:
  source: https://github.com/karol-broda/snitch
  eget: https://github.com/karol-broda/snitch
rule:
  /eget:
    cmd: x eget karol-broda/snitch
    reference: https://github.com/karol-broda/snitch
binlist:
- 'snitch'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 765 KB
          rating: 1
          desc:
            cn: 约 765 KB（估算）
            en: ~765 KB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
