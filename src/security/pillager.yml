lang: Go
homepage: https://github.com/brittonhayes/pillager
license: MIT
desc:
  cn: 掠夺文件系统以查找敏感信息。
  en: Pillage filesystems for sensitive information.
x:
  source: https://github.com/brittonhayes/pillager
rule:
  /brew:
    cmd: 'brew tap brittonhayes/homebrew-pillager \

      && brew install pillager

      '
    reference: https://github.com/brittonhayes/pillager#installation
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add pillager https://github.com/brittonhayes/pillager-scoop.git \

      && x scoop install pillager

      '
    reference: https://github.com/brittonhayes/pillager#installation
  /eget:
    cmd: eget brittonhayes/pillager
    reference: https://github.com/brittonhayes/pillager#installation
  /go:
    cmd: go install github.com/brittonhayes/pillager@latest
    reference: https://github.com/brittonhayes/pillager#installation
    dsnap: github.com/brittonhayes/pillager
  arch/yay:
    cmd: yay -S pillager-bin
    reference: https://aur.archlinux.org/packages/pillager-bin
binlist:
- pillager

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
