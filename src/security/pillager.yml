lang: Go
homepage: https://github.com/brittonhayes/pillager
license: MIT
desc:
  cn: 掠夺文件系统以查找敏感信息。
  en: Pillage filesystems for sensitive information.
  cs: Prohledává systémy souborů hledáním citlivých informací.
  de: Durchsucht Dateisysteme nach sensiblen Informationen.
  es: Registra los sistemas de archivos en busca de información sensible.
  fr: Pille les systèmes de fichiers à la recherche d'informations sensibles.
  id: Menelusuri sistem berkas untuk mencari informasi sensitif.
  it: Ispeziona i file system alla ricerca di informazioni sensibili.
  ja: ファイルシステムをスクレイプして機密情報を探します。
  ko: 민감한 정보를 찾기 위해 파일 시스템을 검색합니다.
  pl: Przeszukuje systemy plików w poszukiwaniu informacji wrażliwych.
  pt: Vasculha sistemas de arquivos em busca de informações sensíveis.
  ro: Scanează sistemele de fișiere pentru informații sensibile.
  ru: Обыскивает файловые системы в поисках конфиденциальной информации.
  th: สแกนระบบไฟล์เพื่อค้นหาข้อมูลอ่อนไหว
  tr: Hassas bilgi aramak için dosya sistemlerini tarar.
  uk: Обшукує файлові системи в пошуках конфіденційної інформації.
  vi: Lùm các hệ thống tệp để tìm thông tin nhạy cảm
x:
  source: https://github.com/brittonhayes/pillager
  brew: pillager
  scoop: pillager
  yay: pillager-bin
  go: github.com/brittonhayes/pillager@latest
rule:
  /brew:
    cmd: 'brew tap brittonhayes/homebrew-pillager \

      && brew install pillager

      '
    reference: https://github.com/brittonhayes/pillager#installation
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add pillager https://github.com/brittonhayes/pillager-scoop.git \

      && x scoop install pillager

      '
    reference: https://github.com/brittonhayes/pillager#installation
  /eget:
    cmd: eget brittonhayes/pillager
    reference: https://github.com/brittonhayes/pillager#installation
  /go:
    cmd: go install github.com/brittonhayes/pillager@latest
    reference: https://github.com/brittonhayes/pillager#installation
    dsnap: github.com/brittonhayes/pillager
  arch/yay:
    cmd: yay -S pillager-bin
    reference: https://aur.archlinux.org/packages/pillager-bin
binlist:
- pillager

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
