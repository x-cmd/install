lang: Python
homepage: https://github.com/elceef/dnstwist
license: Apache-2.0
desc:
  cn: 用于检测同形异义网络钓鱼攻击、拼写错误抢注和品牌假冒的域名排列引擎
  en: Domain name permutation engine for detecting homograph phishing attacks, typo squatting, and brand impersonation
x:
  pkg:
    exist: true
  source: https://github.com/elceef/dnstwist
rule:
  /x:
    cmd: x pkg use dnstwist
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  darwin/brew:
    cmd: brew install dnstwist
    reference: https://formulae.brew.sh/formula/dnstwist#default
  debian/apt:
    cmd: sudo apt install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  ubuntu/apt:
    cmd: sudo apt install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  kali/apt:
    cmd: sudo apt install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  fedora/dnf:
    cmd: sudo dnf install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  arch/yay:
    cmd: yay -S dnstwist
    reference: https://aur.archlinux.org/packages/dnstwist
binlist:
- dnstwist

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
