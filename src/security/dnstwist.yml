lang: Python
homepage: https://github.com/elceef/dnstwist
license: Apache-2.0
desc:
  cn: 用于检测同形异义网络钓鱼攻击、拼写错误抢注和品牌假冒的域名排列引擎
  en: Domain name permutation engine for detecting homograph phishing attacks, typo squatting, and brand impersonation
  cs: Generátor permutací doménových jmen pro detekci homografických phishingových útoků, typosquattingu a zneužívání značkových jmen
  de: Domainname-Permutations-Engine zum Erkennen homographischer Phishing-Angriffe, von Typosquatting und Markenmissbrauch
  es: Motor de permutaciones de nombres de dominio para detectar ataques de phishing homográficos, typosquatting e imitación de marca
  fr: Moteur de permutation de noms de domaine pour détecter les attaques de phishing homographes, le typosquatting et l'usurpation de marque
  id: Mesin permutasi nama domain untuk mendeteksi serangan phishing homograf, typosquatting, dan pemerasan merek
  it: Motore di permutazione dei nomi di dominio per rilevare attacchi di phishing omografici, typosquatting e impersonazione di brand
  ja: ホモグラフ型フィッシング攻撃、タイプスカッティング、ブランド偽装を検出するためのドメイン名排列エンジン
  ko: 동형 문자 phishing 공격, 타이포스quatting, 브랜드 사칭을 탐지하는 도메인 이름 순열 엔진
  pl: Silnik permutacji nazw domen do wykrywania ataków phishing z wykorzystaniem znaków homograficznych, typosquattingu i podszywania się pod marki
  pt: Motor de permutação de nomes de domínio para detectar ataques de phishing homográfico, typosquatting e falsificação de marca
  ro: Motor de permutări de nume de domeniu pentru detectarea atacurilor de phishing omografic, a typosquatting-ului și a impersonării de marcă
  ru: Движок перестановок доменных имён для обнаружения омоглифических фишинговых атак, тайпсквоттинга и подмены брендов
  th: เครื่องยนต์สร้างการเรียงชื่อโดเมนสำหรับตรวจจับการโจมตีฟิชชิงแบบโฮโมกราฟ, การแย่งชื่อแบบ typosquatting และการปลอมตัวแบรนด์
  tr: Homografik kimlik avı saldırılarını, typosquatting'i ve marka taklidini tespit etmek için alan adı permütasyon motoru
  uk: Движун перестановок доменних імен для виявлення омогліфічних фішингових атак, тайпсквотінгу та підроблення брендів
  vi: Công cụ hoán vị tên miền để phát hiện tấn công phishing đồng âm, typosquatting và giả mạo thương hiệu
x:
  source: https://github.com/elceef/dnstwist
  apt: dnstwist
  dnf: dnstwist
  brew: dnstwist
  yay: dnstwist
  pip: dnstwist
rule:
  /x:
    cmd: x pkg use dnstwist
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  darwin/brew:
    cmd: brew install dnstwist
    reference: https://formulae.brew.sh/formula/dnstwist#default
  debian/apt:
    cmd: sudo apt install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  ubuntu/apt:
    cmd: sudo apt install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  kali/apt:
    cmd: sudo apt install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  fedora/dnf:
    cmd: sudo dnf install dnstwist
    reference: https://github.com/elceef/dnstwist#installation
    dsnap: dnstwist
  arch/yay:
    cmd: yay -S dnstwist
    reference: https://aur.archlinux.org/packages/dnstwist
binlist:
- dnstwist

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
