lang: Python
homepage: https://github.com/secdev/scapy
license: GPL-2.0
desc:
  cn: Scapy 是一个用 Python 编写的强大的交互式数据包操作库
  en: Scapy is a powerful interactive packet manipulation library written in Python
x:
  pkg:
    exist: true
  source: https://github.com/secdev/scapy
rule:
  /x:
    cmd: x pkg use scapy
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install scapy
    reference: https://scapy.readthedocs.io/en/latest/installation.html#latest-release
    dsnap: scapy
  debian/apt:
    cmd: 'sudo apt-get install libpcap-dev \

      && sudo apt install python3-scapy

      '
    reference: https://scapy.readthedocs.io/en/latest/installation.html#debian-ubuntu-fedora
    dsnap: python3-scapy
  ubuntu/apt:
    cmd: 'sudo apt-get install libpcap-dev \

      && sudo apt install python3-scapy

      '
    reference: https://scapy.readthedocs.io/en/latest/installation.html#debian-ubuntu-fedora
    dsnap: python3-scapy
  fedora/yum:
    cmd: 'sudo yum install libpcap-devel \

      && sudo yum install python3-scapy

      '
    reference: https://scapy.readthedocs.io/en/latest/installation.html#debian-ubuntu-fedora
binlist:
- scapy

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 485 KB
          rating: 1
          desc:
            cn: 约 485 KB（估算）
            en: ~485 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
