lang: 'Python'
homepage: https://github.com/pwndbg/pwndbg
license: 'MIT'
desc:
  cn: 让 GDB 和 LLDB 的漏洞利用开发与逆向工程更简单
  en: 'Exploit Development and Reverse Engineering with GDB & LLDB Made Easy'
x:
  source: https://github.com/pwndbg/pwndbg
  eget: https://github.com/pwndbg/pwndbg
rule:
  /eget:
    cmd: x eget pwndbg/pwndbg
    reference: https://github.com/pwndbg/pwndbg
binlist:
  - 'pwndbg'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 238 KB
          rating: 1
          desc:
            cn: 约 238 KB（估算）
            en: ~238 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
