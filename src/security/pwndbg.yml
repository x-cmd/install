lang: 'Python'
homepage: https://github.com/pwndbg/pwndbg
license: 'MIT'
desc:
  cn: 让 GDB 和 LLDB 的漏洞利用开发与逆向工程更简单
  en: 'Exploit Development and Reverse Engineering with GDB & LLDB Made Easy'
x:
  source: https://github.com/pwndbg/pwndbg
  eget: https://github.com/pwndbg/pwndbg
rule:
  /eget:
    cmd: x eget pwndbg/pwndbg
    reference: https://github.com/pwndbg/pwndbg
binlist:
  - 'pwndbg'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
