lang: 'Python'
homepage: https://github.com/pwndbg/pwndbg
license: 'MIT'
desc:
  cn: 让 GDB 和 LLDB 的漏洞利用开发与逆向工程更简单
  en: 'Exploit Development and Reverse Engineering with GDB & LLDB Made Easy'
x:
  source: https://github.com/pwndbg/pwndbg
  eget: https://github.com/pwndbg/pwndbg
rule:
  /eget:
    cmd: x eget pwndbg/pwndbg
    reference: https://github.com/pwndbg/pwndbg
binlist:
- 'pwndbg'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 130 MB
          rating: 3
          desc:
            cn: 安装 130 MB
            en: 130 MB install
        download:
          estimate: 130 MB
          desc:
            cn: 约 130 MB 下载 (macos/x64)
            en: ~130 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
