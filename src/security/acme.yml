lang: Shell
homepage: https://github.com/acmesh-official/acme.sh
license: GPL-3.0
desc:
  cn: 一个实现 ACME 客户端协议的纯 Unix shell 脚本
  en: A pure Unix shell script implementing ACME client protocol
  cs: Čistý Unix shell skript implementující klientský protokol ACME
  de: Ein reines Unix-Shell-Skript, das das ACME-Clientprotokoll implementiert
  es: Un script de shell Unix puro que implementa el protocolo de cliente ACME
  fr: Un script shell Unix pur implémentant le protocole client ACME
  id: Skrip shell Unix murni yang mengimplementasikan protokol klien ACME
  it: Uno script shell Unix puro che implementa il protocollo client ACME
  ja: ACME クライアントプロトコルを実装した純 Unix シェルスクリプトです
  ko: ACME 클라이언트 프로토콜을 구현한 순수 Unix 셸 스크립트
  pl: Czysty skrypt powłoki Unixa implementujący protokół klienta ACME
  pt: Um script de shell Unix puro que implementa o protocolo de cliente ACME
  ro: Un script shell Unix pur care implementează protocolul client ACME
  ru: Чистый Unix shell-скрипт, реализующий клиентский протокол ACME
  th: สคริปต์เชลล์ Unix บริสุทธิ์ที่ใช้งานโปรโตคอลไคลเอนต์ ACME
  tr: ACME istemci protokolünü uygulayan saf Unix kabuk betiği
  uk: Чистий Unix shell-скрипт, що реалізує клієнтський протокол ACME
  vi: Kịch bản shell Unix thuần túy hiện thực giao thức client ACME
x:
  source: https://github.com/acmesh-official/acme.sh
rule:
  /curl:
    cmd: curl https://get.acme.sh | sh -s email=my@example.com
    reference: https://github.com/acmesh-official/acme.sh?tab=readme-ov-file#1-install-online
  /wget:
    cmd: wget -O -  https://get.acme.sh | sh -s email=my@example.com
    reference: https://github.com/acmesh-official/acme.sh?tab=readme-ov-file#1-install-online
binlist:
- acme

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
