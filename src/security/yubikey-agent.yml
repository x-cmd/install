lang: Go
homepage: https://github.com/FiloSottile/yubikey-agent
license: BSD-3-Clause
desc:
  en: yubikey-agent is a seamless ssh-agent for YubiKeys
  cn: Yubikey-agent 是 YubiKeys 的一个无缝 ssh-agent
x:
  source: https://github.com/FiloSottile/yubikey-agent
rule:
  arch/yay:
    cmd: yay -S yubikey-agent
    reference: https://aur.archlinux.org/packages/yubikey-agent
  darwin/brew:
    cmd: brew install yubikey-agent
    reference: https://github.com/FiloSottile/yubikey-agent?tab=readme-ov-file#macos
binlist:
- yubikey-agent

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
