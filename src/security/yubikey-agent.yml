lang: Go
homepage: https://github.com/FiloSottile/yubikey-agent
license: BSD-3-Clause
desc:
  en: yubikey-agent is a seamless ssh-agent for YubiKeys
  cn: Yubikey-agent 是 YubiKeys 的一个无缝 ssh-agent
x:
  source: https://github.com/FiloSottile/yubikey-agent
  brew: yubikey-agent
rule:
  arch/yay:
    cmd: yay -S yubikey-agent
    reference: https://aur.archlinux.org/packages/yubikey-agent
  darwin/brew:
    cmd: brew install yubikey-agent
    reference: https://github.com/FiloSottile/yubikey-agent?tab=readme-ov-file#macos
binlist:
- yubikey-agent

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 44 KB
          rating: 1
          desc:
            cn: 约 44 KB（估算）
            en: ~44 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
