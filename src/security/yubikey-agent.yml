lang: Go
homepage: https://github.com/FiloSottile/yubikey-agent
license: BSD-3-Clause
desc:
  en: yubikey-agent is a seamless ssh-agent for YubiKeys
  cn: Yubikey-agent 是 YubiKeys 的一个无缝 ssh-agent
x:
  source: https://github.com/FiloSottile/yubikey-agent
rule:
  arch/yay:
    cmd: yay -S yubikey-agent
    reference: https://aur.archlinux.org/packages/yubikey-agent
  darwin/brew:
    cmd: brew install yubikey-agent
    reference: https://github.com/FiloSottile/yubikey-agent?tab=readme-ov-file#macos
binlist:
- yubikey-agent
