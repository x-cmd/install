lang: Go
homepage: https://github.com/ossf/scorecard
license: Apache-2.0
desc:
  cn: OpenSSF 记分卡 - 开源的安全健康指标
  en: OpenSSF Scorecard - Security health metrics for Open Source
  cs: OpenSSF Scorecard - metriky zdraví zabezpečení open source
  de: OpenSSF Scorecard - Sicherheits-Metriken für Open Source
  es: OpenSSF Scorecard - métricas de seguridad de código abierto
  fr: OpenSSF Scorecard - métriques de sécurité pour l'open source
  id: OpenSSF Scorecard - metrik keamanan sumber terbuka
  it: OpenSSF Scorecard - metriche di sicurezza per l'open source
  ja: OpenSSF Scorecard - オープンソースのセキュリティヘルスメトリクス
  ko: OpenSSF Scorecard - 오픈 소스 보안 건강 지표
  pl: OpenSSF Scorecard - metryki bezpieczeństwa oprogramowania open source
  pt: OpenSSF Scorecard - métricas de segurança de código aberto
  ro: OpenSSF Scorecard - metrici de securitate pentru open source
  ru: OpenSSF Scorecard - метрики безопасности открытого ПО
  th: OpenSSF Scorecard - เมตริกความปลอดภัยของซอฟต์แวร์โอเพนซอร์ส
  tr: OpenSSF Scorecard - açık kaynak için güvenlik sağlığı metrikleri
  uk: OpenSSF Scorecard - метрики безпеки відкритого ПЗ
  vi: OpenSSF Scorecard - số liệu bảo mật của mã nguồn mở
x:
  source: https://github.com/ossf/scorecard
  eget: ossf/scorecard
  brew: scorecard
  yay: scorecard-bin
rule:
  /x:
    cmd: x pkg use scorecard
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ossf/scorecard
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install scorecard
    reference: https://github.com/ossf/scorecard?tab=readme-ov-file#installation
  /nix-shell:
    cmd: nix-shell -p nixpkgs.scorecard
    reference: https://github.com/ossf/scorecard?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S scorecard-bin
    reference: https://aur.archlinux.org/packages/scorecard-bin
binlist:
- scorecard

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 MB
          rating: 2
          desc:
            cn: 安装 25 MB
            en: 25 MB install
        download:
          estimate: 25 MB
          desc:
            cn: 约 25 MB 下载 (linux/x64)
            en: ~25 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
