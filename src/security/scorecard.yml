lang: Go
homepage: https://github.com/ossf/scorecard
license: Apache-2.0
desc:
  cn: OpenSSF 记分卡 - 开源的安全健康指标
  en: OpenSSF Scorecard - Security health metrics for Open Source
x:
  pkg:
    exist: true
  source: https://github.com/ossf/scorecard
  eget: https://github.com/ossf/scorecard
rule:
  /x:
    cmd: x pkg use scorecard
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ossf/scorecard
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install scorecard
    reference: https://github.com/ossf/scorecard?tab=readme-ov-file#installation
  /nix-shell:
    cmd: nix-shell -p nixpkgs.scorecard
    reference: https://github.com/ossf/scorecard?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S scorecard-bin
    reference: https://aur.archlinux.org/packages/scorecard-bin
binlist:
- scorecard

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
