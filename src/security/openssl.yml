lang: C
homepage: https://github.com/openssl/openssl
license: Apache-2.0
desc:
  cn: openssl 是目前最流行的 SSL 密码库工具，其提供了一个通用、健壮、功能完备的工具套件
  en: openssl is the most popular SSL cryptographic library tool available today, providing a versatile, robust, and full-featured toolkit
x:
  pkg:
    exist: true
  source: https://github.com/openssl/openssl
  eget: https://github.com/openssl/openssl
rule:
  /eget:
    cmd: x eget openssl/openssl
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use openssl
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install openssl@3.0
    reference: https://formulae.brew.sh/formula/openssl@3.0#default
  debian/apt:
    cmd: sudo apt-get install openssl
    reference: https://command-not-found.com/openssl
    dsnap: openssl
  ubuntu/apt:
    cmd: sudo apt-get install openssl
    reference: https://command-not-found.com/openssl
    dsnap: openssl
  alpine/apk:
    cmd: sudo apk add openssl
    reference: https://command-not-found.com/openssl
    dsnap: openssl
  arch/pacman:
    cmd: sudo pacman -S openssl
    reference: https://command-not-found.com/openssl
  kali/apt:
    cmd: sudo apt-get install openssl
    reference: https://command-not-found.com/openssl
    dsnap: openssl
  centos/yum:
    cmd: sudo yum install openssl
    reference: https://command-not-found.com/openssl
  fedora/dnf:
    cmd: sudo dnf install openssl
    reference: https://command-not-found.com/openssl
    dsnap: openssl
  raspbian/apt:
    cmd: sudo apt-get install openssl
    reference: https://command-not-found.com/openssl
binlist:
- openssl

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
