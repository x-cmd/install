lang: Go
homepage: https://github.com/OJ/gobuster
license: Apache-2.0
desc:
  cn: Gobuster 是一个用于暴力破解的工具
  en: Gobuster is a tool used to brute-force
x:
  source: https://github.com/OJ/gobuster
  eget: https://github.com/OJ/gobuster
rule:
  /eget:
    cmd: x eget OJ/gobuster
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/OJ/gobuster/v3@latest
    reference: https://github.com/OJ/gobuster?tab=readme-ov-file#easy-installation
    dsnap: github.com/OJ/gobuster/v3
  arch/yay:
    cmd: yay -S gobuster-git
    reference: https://aur.archlinux.org/packages/gobuster-git
binlist:
- gobuster

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 约 1.4 MB（估算）
            en: ~1.4 MB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
