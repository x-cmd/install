lang: Go
homepage: https://github.com/OJ/gobuster
license: Apache-2.0
desc:
  cn: Gobuster 是一个用于暴力破解的工具
  en: Gobuster is a tool used to brute-force
  cs: Gobuster je nástroj používaný k hrubému sílení
  de: Gobuster ist ein Werkzeug zum Brute-Force
  es: Gobuster es una herramienta utilizada para la fuerza bruta
  fr: Gobuster est un outil utilisé pour le brute-force
  id: Gobuster adalah alat yang digunakan untuk brute-force
  it: Gobuster è uno strumento utilizzato per il brute-force
  ja: Gobuster はブルートフォース攻撃に使用されるツールです
  ko: Gobuster는 무차별 대입 공격에 사용되는 도구입니다
  pl: Gobuster to narzędzie używane do ataków brute-force
  pt: O Gobuster é uma ferramenta usada para força bruta
  ro: Gobuster este un instrument folosit pentru forță brută
  ru: Gobuster — это инструмент для перебора паролей
  th: Gobuster คือเครื่องมือที่ใช้สำหรับการเดารหัสผ่านแบบ brute-force
  tr: Gobuster, kaba kuvvet (brute-force) saldırıları için kullanılan bir araçtır
  uk: Gobuster — це інструмент для брутфорсу
  vi: Gobuster là công cụ được dùng để dò mật khẩu theo kiểu brute-force
x:
  source: https://github.com/OJ/gobuster
  eget: OJ/gobuster
  yay: gobuster-git
  go: github.com/OJ/gobuster/v3@latest
rule:
  /eget:
    cmd: x eget OJ/gobuster
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/OJ/gobuster/v3@latest
    reference: https://github.com/OJ/gobuster?tab=readme-ov-file#easy-installation
    dsnap: github.com/OJ/gobuster/v3
  arch/yay:
    cmd: yay -S gobuster-git
    reference: https://aur.archlinux.org/packages/gobuster-git
binlist:
- gobuster

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
