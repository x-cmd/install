lang: 'Rust'
homepage: https://github.com/woodruffw/zizmor
license: 'MIT'
desc:
  cn: GitHub Actions 的静态分析工具
  en: 'Static analysis for GitHub Actions'
  cs: Statická analýza pro GitHub Actions
  de: Statische Analyse für GitHub Actions
  es: Análisis estático para GitHub Actions
  fr: Analyse statique pour GitHub Actions
  id: Analisis statis untuk GitHub Actions
  it: Analisi statica per GitHub Actions
  ja: GitHub Actions の静的解析
  ko: GitHub Actions를 위한 정적 분석
  pl: Analiza statyczna dla GitHub Actions
  pt: Análise estática para GitHub Actions
  ro: Analiză statică pentru GitHub Actions
  ru: Статический анализ для GitHub Actions
  th: การวิเคราะห์แบบคงที่สำหรับ GitHub Actions
  tr: GitHub Actions için statik analiz
  uk: Статичний аналіз для GitHub Actions
  vi: Phân tích tĩnh cho GitHub Actions
x:
  source: https://github.com/woodruffw/zizmor
  eget: woodruffw/zizmor
rule:
  /eget:
    cmd: x eget woodruffw/zizmor
    reference: https://github.com/woodruffw/zizmor
binlist:
  - 'zizmor'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 1.8 MB
          rating: 1
          desc:
            cn: 约 1.8 MB（估算）
            en: ~1.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
