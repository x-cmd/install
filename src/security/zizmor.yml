lang: 'Rust'
homepage: https://github.com/woodruffw/zizmor
license: 'MIT'
desc:
  cn: GitHub Actions 的静态分析工具
  en: 'Static analysis for GitHub Actions'
x:
  source: https://github.com/woodruffw/zizmor
  eget: https://github.com/woodruffw/zizmor
rule:
  /eget:
    cmd: x eget woodruffw/zizmor
    reference: https://github.com/woodruffw/zizmor
binlist:
  - 'zizmor'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.8 MB
          rating: 1
          desc:
            cn: 约 1.8 MB（估算）
            en: ~1.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
