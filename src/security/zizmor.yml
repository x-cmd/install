lang: 'Rust'
homepage: https://github.com/woodruffw/zizmor
license: 'MIT'
desc:
  cn: GitHub Actions 的静态分析工具
  en: 'Static analysis for GitHub Actions'
x:
  source: https://github.com/woodruffw/zizmor
  eget: https://github.com/woodruffw/zizmor
rule:
  /eget:
    cmd: x eget woodruffw/zizmor
    reference: https://github.com/woodruffw/zizmor
binlist:
  - 'zizmor'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
