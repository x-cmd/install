lang: 'Go'
homepage: https://github.com/sa7mon/S3Scanner
license: 'MIT'
desc:
  cn: 扫描 S3 兼容 API 上配置错误的 S3 存储桶
  en: 'Scan for misconfigured S3 buckets across S3-compatible APIs!'
x:
  source: https://github.com/sa7mon/S3Scanner
  eget: https://github.com/sa7mon/S3Scanner
rule:
  darwin/brew:
    cmd: 'brew install s3scanner'
    reference: https://github.com/sa7mon/S3Scanner
  debian/apt:
    cmd: 'apt install s3scanner'
    reference: https://github.com/sa7mon/S3Scanner
  /eget:
    cmd: x eget sa7mon/S3Scanner
    reference: https://github.com/sa7mon/S3Scanner
binlist:
- 's3scanner'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 294 KB
          rating: 1
          desc:
            cn: 约 294 KB（估算）
            en: ~294 KB estimated
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
