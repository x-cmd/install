lang: 'Go'
homepage: https://github.com/sa7mon/S3Scanner
license: 'MIT'
desc:
  cn: 扫描 S3 兼容 API 上配置错误的 S3 存储桶
  en: 'Scan for misconfigured S3 buckets across S3-compatible APIs!'
x:
  source: https://github.com/sa7mon/S3Scanner
  eget: https://github.com/sa7mon/S3Scanner
rule:
  darwin/brew:
    cmd: 'brew install s3scanner'
    reference: https://github.com/sa7mon/S3Scanner
  debian/apt:
    cmd: 'apt install s3scanner'
    reference: https://github.com/sa7mon/S3Scanner
  /eget:
    cmd: x eget sa7mon/S3Scanner
    reference: https://github.com/sa7mon/S3Scanner
binlist:
  - 's3scanner'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
