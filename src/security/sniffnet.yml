lang: Rust
homepage: https://github.com/GyulyVGC/sniffnet
license: Apache-2.0
desc:
  cn: 用于轻松监控您的互联网流量的应用程序
  en: Application to comfortably monitor your Internet traffic
x:
  source: https://github.com/GyulyVGC/sniffnet
  eget: https://github.com/GyulyVGC/sniffnet
rule:
  /eget:
    cmd: x eget GyulyVGC/sniffnet
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install sniffnet --locked
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
    dsnap: sniffnet
  darwin/brew:
    cmd: brew install sniffnet
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
  linux/pacman:
    cmd: pacman -S sniffnet
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
  linux/pkg:
    cmd: pkg install sniffnet
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
binlist:
- sniffnet

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.2 MB
          rating: 1
          desc:
            cn: 约 1.2 MB（估算）
            en: ~1.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
