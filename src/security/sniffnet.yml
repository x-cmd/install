lang: Rust
homepage: https://github.com/GyulyVGC/sniffnet
license: Apache-2.0
desc:
  cn: 用于轻松监控您的互联网流量的应用程序
  en: Application to comfortably monitor your Internet traffic
x:
  source: https://github.com/GyulyVGC/sniffnet
  eget: https://github.com/GyulyVGC/sniffnet
  brew: sniffnet
  pacman: sniffnet
  cargo: sniffnet
rule:
  /eget:
    cmd: x eget GyulyVGC/sniffnet
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install sniffnet --locked
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
    dsnap: sniffnet
  darwin/brew:
    cmd: brew install sniffnet
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
  linux/pacman:
    cmd: pacman -S sniffnet
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
  linux/pkg:
    cmd: pkg install sniffnet
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
binlist:
- sniffnet

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
