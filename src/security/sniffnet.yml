lang: Rust
homepage: https://github.com/GyulyVGC/sniffnet
license: Apache-2.0
desc:
  cn: 用于轻松监控您的互联网流量的应用程序
  en: Application to comfortably monitor your Internet traffic
  cs: Aplikace pro pohodlné monitorování vašeho internetového provozu
  de: Anwendung zur bequemen Überwachung des Internetverkehrs
  es: Aplicación para controlar cómodamente tu tráfico de Internet
  fr: Application pour surveiller confortablement votre trafic Internet
  id: Aplikasi untuk memantau lalu lintas internet Anda dengan nyaman
  it: Applicazione per monitorare comodamente il tuo traffico Internet
  ja: インターネットトラフィックを快適監視するアプリケーション
  ko: 인터넷 트래픽을 편리하게 모니터링하는 애플리케이션
  pl: Aplikacja do wygodnego monitorowania ruchu internetowego
  pt: Aplicativo para monitorar confortavelmente seu tráfego de Internet
  ro: Aplicație pentru monitorizarea confortabilă a traficului dvs. de Internet
  ru: Приложение для удобного мониторинга вашего интернет-трафика
  th: แอปพลิเคชันสำหรับติดตามการใช้งานอินเทอร์เน็ตอย่างสบายใจ
  tr: İnternet trafiğinizi rahatça izlemek için uygulama
  uk: Застосунок для зручного моніторингу вашого інтернет-трафіку
  vi: Ứng dụng để dễ dàng theo dõi lưu lượng Internet của bạn
x:
  source: https://github.com/GyulyVGC/sniffnet
  eget: GyulyVGC/sniffnet
  brew: sniffnet
  pacman: sniffnet
  cargo: sniffnet
rule:
  /eget:
    cmd: x eget GyulyVGC/sniffnet
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install sniffnet --locked
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
    dsnap: sniffnet
  darwin/brew:
    cmd: brew install sniffnet
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
  linux/pacman:
    cmd: pacman -S sniffnet
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
  linux/pkg:
    cmd: pkg install sniffnet
    reference: https://github.com/GyulyVGC/sniffnet?tab=readme-ov-file#download
binlist:
- sniffnet

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
