lang: Python
homepage: https://github.com/Yubico/yubikey-manager
license: BSD-2-Clause
desc:
  cn: 由 Yubico 开发的工具，用于配置和管理 YubiKey 设备。它提供了一个界面来更改 YubiKey 上的设置，包括 PIN 管理、FIDO2、OTP 和 PIV 功能。此工具支持多种操作系统，使用户能够自定义 YubiKey 的安全功能，以满足特定的安全需求。
  en: A tool developed by Yubico for configuring and managing YubiKey devices. It provides an interface for changing settings on the YubiKey, including PIN management, FIDO2, OTP, and PIV functionality. This tool supports multiple operating systems, allowing users to customize the security features of the YubiKey to meet specific security needs.
  cs: Nástroj vyvinutý společností Yubico pro konfiguraci a správu zařízení YubiKey. Poskytuje rozhraní pro změnu nastavení YubiKey, včetně správy PIN, FIDO2, OTP a funkci PIV. Tento nástroj podporuje více operačních systémů a umožňuje uživatelům přizpůsobit bezpečnostní funkce YubiKey konkrétním bezpečnostním potřebám.
  de: Ein von Yubico entwickeltes Tool zum Konfigurieren und Verwalten von YubiKey-Geräten. Es bietet eine Schnittstelle zum Ändern der YubiKey-Einstellungen, einschließlich PIN-Verwaltung, FIDO2, OTP und PIV-Funktionalität. Dieses Tool unterstützt mehrere Betriebssysteme und ermöglicht es Benutzern, die Sicherheitsfunktionen des YubiKey an bestimmte Sicherheitsanforderungen anzupassen.
  es: Una herramienta desarrollada por Yubico para configurar y gestionar dispositivos YubiKey. Proporciona una interfaz para cambiar la configuración del YubiKey, incluida la gestión del PIN, FIDO2, OTP y la funcionalidad PIV. Esta herramienta admite varios sistemas operativos, lo que permite a los usuarios personalizar las funciones de seguridad del YubiKey para satisfacer necesidades de seguridad específicas.
  fr: Un outil développé par Yubico pour configurer et gérer les appareils YubiKey. Il fournit une interface pour modifier les paramètres du YubiKey, notamment la gestion du PIN, FIDO2, OTP et les fonctionnalités PIV. Cet outil prend en charge plusieurs systèmes d'exploitation, ce qui permet aux utilisateurs de personnaliser les fonctions de sécurité du YubiKey selon leurs besoins de sécurité spécifiques.
  id: Alat yang dikembangkan oleh Yubico untuk mengonfigurasi dan mengelola perangkat YubiKey. Alat ini menyediakan antarmuka untuk mengubah pengaturan pada YubiKey, termasuk manajemen PIN, FIDO2, OTP, dan fungsi PIV. Alat ini mendukung berbagai sistem operasi, sehingga pengguna dapat menyesuaikan fitur keamanan YubiKey untuk memenuhi kebutuhan keamanan tertentu.
  it: Uno strumento sviluppato da Yubico per configurare e gestire i dispositivi YubiKey. Fornisce un'interfaccia per modificare le impostazioni del YubiKey, inclusa la gestione del PIN, FIDO2, OTP e le funzionalità PIV. Questo strumento supporta diversi sistem operativi, consentendo agli utenti di personalizzare le funzioni di sicurezza del YubiKey per soddisfare specifiche esigenze di sicurezza.
  ja: Yubico が開発した YubiKey デバイスの設定と管理のためのツールです。PIN 管理、FIDO2、OTP、PIV 機能を含む YubiKey の設定変更用のインターフェースを提供します。複数のオペレーティングシステムに対応しており、ユーザーは特定のセキュリティニーズに合わせて YubiKey のセキュリティ機能をカスタマイズできます。
  ko: Yubico가 개발한 YubiKey 기기 설정 및 관리 도구입니다. PIN 관리, FIDO2, OTP, PIV 기능을 포함한 YubiKey 설정 변경 인터페이스를 제공합니다. 여러 운영 체제를 지원하므로 사용자는 특정 보안 요구사항에 맞게 YubiKey의 보안 기능을 사용자 지정할 수 있습니다.
  pl: Narzędzie opracowane przez Yubico do konfiguracji i zarządzania urządzeniami YubiKey. Zapewnia interfejs do zmiany ustawień YubiKey, w tym zarządzania PIN, FIDO2, OTP i funkcji PIV. To narzędzie obsługuje wiele systemów operacyjnych, umożliwiając użytkownikom dostosowanie funkcji bezpieczeństwa YubiKey do konkretnych potrzeb.
  pt: Uma ferramenta desenvolvida pela Yubico para configurar e gerenciar dispositivos YubiKey. Fornece uma interface para alterar as configurações do YubiKey, incluindo gerenciamento de PIN, FIDO2, OTP e funcionalidade PIV. Esta ferramenta oferece suporte a vários sistemas operacionais, permitindo que os usuários personalizem os recursos de segurança do YubiKey para atender a necessidades de segurança específicas.
  ro: Un instrument dezvoltat de Yubico pentru configurarea și gestionarea dispozitivelor YubiKey. Oferă o interfață pentru modificarea setărilor YubiKey, inclusiv gestionarea PIN, FIDO2, OTP și funcționalitatea PIV. Acest instrument acceptă mai multe sisteme de operare, permițând utilizatorilor să personalizeze funcțiile de securitate ale YubiKey pentru a satisface nevoile de securitate specifice.
  ru: Инструмент, разработанный Yubico для настройки и управления устройствами YubiKey. Он предоставляет интерфейс для изменения настроек YubiKey, включая управление PIN, FIDO2, OTP и функциональность PIV. Этот инструмент поддерживает несколько операционных систем, позволяя пользователям настраивать функции безопасности YubiKey под конкретные требования.
  th: เครื่องมือที่พัฒนาโดย Yubico สำหรับการกำหนดค่าและจัดการอุปกรณ์ YubiKey โดยมีอินเทอร์เฟซสำหรับการเปลี่ยนการตั้งค่าบน YubiKey รวมถึงการจัดการ PIN, FIDO2, OTP และฟีเจอร์ PIV เครื่องมือนี้รองรับระบบปฏิบัติการหลายแบบ ช่วยให้ผู้ใช้ปรับแต่งคุณสมบัติด้านความปลอดภัยของ YubiKey ให้ตรงกับความต้องการด้านความปลอดภัยเฉพาะ
  tr: YubiKey cihazlarını yapılandırmak ve yönetmek için Yubico tarafından geliştirilen bir araç. PIN yönetimi, FIDO2, OTP ve PIV işlevleri dahil olmak üzere YubiKey üzerindeki ayarları değiştirmek için bir arayüz sunar. Bu araç birden fazla işletim sistemini destekler ve kullanıcıların YubiKey'in güvenlik özelliklerini belirli güvenlik ihtiyaçlarına göre özelleştirmesine olanak tanır.
  uk: Інструмент, розроблений Yubico для налаштування та керування пристроями YubiKey. Він надає інтерфейс для зміни налаштувань YubiKey, зокрема керування PIN, FIDO2, OTP та функції PIV. Цей інструмент підтримує кілька операційних систем, даючи змогу користувачам налаштувати функції безпеки YubiKey під конкретні потреби.
  vi: Công cụ do Yubico phát triển để cấu hình và quản lý thiết bị YubiKey. Công cụ cung cấp giao diện để thay đổi cài đặt trên YubiKey, bao gồm quản lý PIN, FIDO2, OTP và chức năng PIV. Công cụ này hỗ trợ nhiều hệ điều hành, cho phép người dùng tùy chỉnh các tính năng bảo mật của YubiKey để đáp ứng nhu cầu bảo mật cụ thể.
x:
  source: https://github.com/Yubico/yubikey-manager
  eget: Yubico/yubikey-manager
rule:
  /eget:
    cmd: x eget Yubico/yubikey-manager
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install --user yubikey-manager
    reference: https://github.com/Yubico/yubikey-manager?tab=readme-ov-file#installation
    dsnap: yubikey-manager
  darwin/brew:
    cmd: brew install --cask yubico-yubikey-manager
    reference: https://formulae.brew.sh/cask/yubico-yubikey-manager#default
binlist:
- yubikey-manager

