lang: Rust
homepage: https://github.com/ctsrc/Pgen
license: ISC
desc:
  en: Command-line passphrase generator
  cn: 命令行密码生成器
x:
  source: https://github.com/ctsrc/Pgen
rule:
  /cargo:
    cmd: cargo install pgen
    reference: https://github.com/ctsrc/Pgen?tab=readme-ov-file#installation
    dsnap: pgen
binlist:
- pgen

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
