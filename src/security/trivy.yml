lang: Go
homepage: https://github.com/aquasecurity/trivy
license: Apache-2.0
desc:
  cn: 查找容器、Kubernetes、代码存储库、云等中的漏洞、错误配置、秘密、SBOM
  en: Find vulnerabilities, security issues, and secrets in containers, Kubernetes, code repositories, cloud
x:
  pkg:
    exist: true
  source: https://github.com/aquasecurity/trivy
  eget: https://github.com/aquasecurity/trivy
rule:
  /x:
    cmd: x pkg use trivy
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget aquasecurity/trivy
    reference: https://x-cmd.com/mod/eget
  centos/yum:
    cmd: sudo yum -y install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#rhelcentos-official
  rhel/yum:
    cmd: sudo yum -y install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#rhelcentos-official
  /rpm:
    cmd: rpm -ivh https://github.com/aquasecurity/trivy/releases/download/v0.49.1/trivy_0.49.1_Linux-64bit.rpm
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#rhelcentos-official
  debian/apt:
    cmd: sudo apt-get install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#debianubuntu-official
    dsnap: trivy
  ubuntu/apt:
    cmd: sudo apt-get install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#debianubuntu-official
    dsnap: trivy
  /deb:
    cmd: 'wget https://github.com/aquasecurity/trivy/releases/download/v0.49.1/trivy_0.49.1_Linux-64bit.deb \

      && sudo dpkg -i trivy_0.49.1_Linux-64bit.deb

      '
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#debianubuntu-official
  darwin/brew:
    cmd: brew install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#homebrew-official
  darwin/port:
    cmd: sudo port install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#macports-community
  /asdf:
    cmd: x asdf use trivy
    reference: https://github.com/zufardhiyaulhaq/asdf-trivy?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S trivy-bin
    reference: https://aur.archlinux.org/packages/trivy-bin
binlist:
- trivy

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
