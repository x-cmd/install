lang: Go
homepage: https://github.com/aquasecurity/trivy
license: Apache-2.0
desc:
  cn: 查找容器、Kubernetes、代码存储库、云等中的漏洞、错误配置、秘密、SBOM
  en: Find vulnerabilities, security issues, and secrets in containers, Kubernetes, code repositories, cloud
  cs: Najděte zranitelnosti, bezpečnostní problémy a tajné údaje v kontejnerech, Kubernetes, repozitářích kódu a cloudu
  de: Finden Sie Schwachstellen, Sicherheitsprobleme und Geheimnisse in Containern, Kubernetes, Code-Repositories und der Cloud
  es: Encuentra vulnerabilidades, problemas de seguridad y secretos en contenedores, Kubernetes, repositorios de código y la nube
  fr: Trouvez les vulnérabilités, problèmes de sécurité et secrets dans les conteneurs, Kubernetes, dépôts de code et le cloud
  id: Temukan kerentanan, masalah keamanan, dan rahasia dalam kontainer, Kubernetes, repositori kode, dan cloud
  it: Trova vulnerabilità, problemi di sicurezza e segreti in container, Kubernetes, repository di codice e cloud
  ja: コンテナ、Kubernetes、コードリポジトリ、クラウドの中で脆弱性、セキュリティ問題、シークレットを検索
  ko: 컨테이너, Kubernetes, 코드 저장소, 클라우드에서 취약점, 보안 문제, 비밀 정보를 찾아냅니다
  pl: Znajdź podatności, problemy bezpieczeństwa i sekrety w kontenerach, Kubernetes, repozytoriach kodu i chmurze
  pt: Encontre vulnerabilidades, problemas de segurança e segredos em contêineres, Kubernetes, repositórios de código e na nuvem
  ro: Găsiți vulnerabilități, probleme de securitate și secrete în containere, Kubernetes, depozite de cod și cloud
  ru: Поиск уязвимостей, проблем безопасности и секретов в контейнерах, Kubernetes, репозиториях кода и облаке
  th: ค้นหาช่องโหว่ ปัญหาความปลอดภัย และข้อมูลลับในคอนเทนเนอร์ Kubernetes คลังโค้ด และคลาวด์
  tr: Konteynerlerde, Kubernetes'ta, kod depolarında ve bulutta güvenlik açıklarını, güvenlik sorunlarını ve sırları bulun
  uk: Пошук уразливостей, проблем безпеки та секретів у контейнерах, Kubernetes, репозиторіях коду та хмарі
  vi: Tìm lỗ hổng, sự cố bảo mật và bí mật trong container, Kubernetes, kho mã và đám mây
x:
  source: https://github.com/aquasecurity/trivy
  eget: aquasecurity/trivy
  apt: trivy
  brew: trivy
  apt-get: trivy
  port: trivy
  yay: trivy-bin
  asdf: trivy
rule:
  /x:
    cmd: x pkg use trivy
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget aquasecurity/trivy
    reference: https://x-cmd.com/mod/eget
  centos/yum:
    cmd: sudo yum -y install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#rhelcentos-official
  rhel/yum:
    cmd: sudo yum -y install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#rhelcentos-official
  /rpm:
    cmd: rpm -ivh https://github.com/aquasecurity/trivy/releases/download/v0.49.1/trivy_0.49.1_Linux-64bit.rpm
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#rhelcentos-official
  debian/apt:
    cmd: sudo apt-get install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#debianubuntu-official
    dsnap: trivy
  ubuntu/apt:
    cmd: sudo apt-get install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#debianubuntu-official
    dsnap: trivy
  /deb:
    cmd: 'wget https://github.com/aquasecurity/trivy/releases/download/v0.49.1/trivy_0.49.1_Linux-64bit.deb \

      && sudo dpkg -i trivy_0.49.1_Linux-64bit.deb

      '
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#debianubuntu-official
  darwin/brew:
    cmd: brew install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#homebrew-official
  darwin/port:
    cmd: sudo port install trivy
    reference: https://aquasecurity.github.io/trivy/v0.49/getting-started/installation/#macports-community
  /asdf:
    cmd: x asdf use trivy
    reference: https://github.com/zufardhiyaulhaq/asdf-trivy?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S trivy-bin
    reference: https://aur.archlinux.org/packages/trivy-bin
binlist:
- trivy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
