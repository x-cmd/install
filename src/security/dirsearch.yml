lang: Python
homepage: https://github.com/maurosoria/dirsearch
desc:
  cn: Web 路径扫描器
  en: Web path scanner
x:
  source: https://github.com/maurosoria/dirsearch
  eget: https://github.com/maurosoria/dirsearch
rule:
  /eget:
    cmd: x eget maurosoria/dirsearch
    reference: https://github.com/maurosoria/dirsearch
binlist:
- dirsearch
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 48 MB
          rating: 2
          desc:
            cn: 安装 48 MB
            en: 48 MB install
        download:
          estimate: 48 MB
          desc:
            cn: 约 48 MB 下载 (linux/x64)
            en: ~48 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
