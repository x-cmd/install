lang: Rust
homepage: https://github.com/brxken128/dexios
license: BSD-2-Clause
desc:
  cn: Dexios 是一个命令行文件加密实用程序，适合在将文件上传到云服务之前对其进行加密
  en: Dexios is a command-line file encryption utility, suitable for encrypting files before uploading them to a cloud service
x:
  source: https://github.com/brxken128/dexios
  eget: https://github.com/brxken128/dexios
rule:
  /eget:
    cmd: x eget brxken128/dexios
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install dexios --locked
    reference: https://github.com/brxken128/dexios/?tab=readme-ov-file#dexios---what-is-it
    dsnap: dexios
  arch/yay:
    cmd: yay -S dexios-bin
    reference: https://aur.archlinux.org/packages/dexios-bin
binlist:
- dexios

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
