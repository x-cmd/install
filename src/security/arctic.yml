lang: TypeScript
homepage: https://github.com/pilcrowonpaper/arctic
license: MIT
desc:
  cn: Arctic 是一组用于流行服务提供商的 OAuth 2.0 客户端，只支持授权码流程。
  en: Arctic is a collection of OAuth 2.0 clients for popular providers. Only the authorization code flow is supported.
x:
  source: https://github.com/pilcrowonpaper/arctic
rule:
  /npm:
    cmd: npm install arctic
    reference: https://github.com/pilcrowonpaper/arctic?tab=readme-ov-file#arctic
    dsnap: arctic
binlist:
- arctic

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
