lang: Go
homepage: https://github.com/google/osv-scanner
license: Apache-2.0
desc:
  cn: 用 Go 编写的漏洞扫描器，使用 https://osv.dev 提供的数据
  en: Vulnerability scanner written in Go which uses the data provided by
x:
  pkg:
    exist: true
  source: https://github.com/google/osv-scanner
  eget: https://github.com/google/osv-scanner
rule:
  /x:
    cmd: x pkg use osv-scanner
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget google/osv-scanner
    reference: https://x-cmd.com/mod/eget
  (linux|darwin|win|wsl2)/:
    cmd: x env use osv-scanner
    reference: https://x-cmd.com/mod/env
  /go:
    cmd: go install github.com/google/osv-scanner/cmd/osv-scanner@v1
    reference: https://google.github.io/osv-scanner/installation/
    dsnap: github.com/google/osv-scanner/cmd/osv-scanner@v1
  darwin/brew:
    cmd: brew install osv-scanner
    reference: https://google.github.io/osv-scanner/installation/
  (win|wsl2)/scoop:
    cmd: scoop install osv-scanner
    reference: https://google.github.io/osv-scanner/installation/
  /pacman:
    cmd: pacman -S osv-scanner
    reference: https://google.github.io/osv-scanner/installation/
  /apk:
    cmd: apk add osv-scanner
    reference: https://google.github.io/osv-scanner/installation/
  /pkg:
    cmd: pkg install osv-scanner
    reference: https://google.github.io/osv-scanner/installation/
  /pkg_add:
    cmd: pkg_add osv-scanner
    reference: https://google.github.io/osv-scanner/installation/
binlist:
- osv-scanner

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
