  id: Bcrypt adalah utilitas enkripsi file lintas platform
  it: Bcrypt è un'utilità di cifratura dei file multipiattaforma
  ja: Bcrypt はクロスプラットフォームのファイル暗号化ユーティリティです
  ko: Bcrypt는 크로스 플랫폼 파일 암호화 유틸리티입니다
  pl: Bcrypt to wieloplatformowe narzędzie do szyfrowania plików
  pt: O Bcrypt é um utilitário de criptografia de arquivos multiplataforma
  ro: Bcrypt este o utilitate de criptare a fișierelor multiplatformă
  ru: Bcrypt — кроссплатформенная утилита для шифрования файлов
  th: Bcrypt เป็นยูทิลิตีเข้ารหัสไฟล์ข้ามแพลตฟอร์ม
