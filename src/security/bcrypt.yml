lang: Python
homepage: https://bcrypt.sourceforge.net/
desc:
  cn: Bcrypt 是一个跨平台的文件加密实用程序
  en: Bcrypt is a cross platform file encryption utility
  cs: Bcrypt je multiplatformní nástroj pro šifrování souborů
  de: Bcrypt ist ein plattformübergreifendes Dateiverschlüsselungswerkzeug
  es: Bcrypt es una utilidad de cifrado de archivos multiplataforma
