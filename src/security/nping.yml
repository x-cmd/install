lang: C
homepage: https://github.com/nmap/nmap
desc:
  cn: 一款网络探测和分析工具，属于 Nmap 工具套件的一部分
  en: A network detection and analysis tool that is part of the Nmap tool suite
x:
  pkg:
    exist: true
  source: https://github.com/nmap/nmap
rule:
  /x:
    cmd: x pkg use nping
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install nmap
    reference: https://command-not-found.com/nping
  debian/apt:
    cmd: sudo apt-get install nmap
    reference: https://command-not-found.com/nping
    dsnap: nmap
  ubuntu/apt:
    cmd: sudo apt-get install nmap
    reference: https://command-not-found.com/nping
    dsnap: nmap
  alpine/apk:
    cmd: sudo apk add nmap
    reference: https://command-not-found.com/nping
    dsnap: nmap
  arch/pacman:
    cmd: sudo pacman -S nmap
    reference: https://command-not-found.com/nping
  kali/apt:
    cmd: sudo apt-get install nmap
    reference: https://command-not-found.com/nping
    dsnap: nmap
  fedora/dnf:
    cmd: sudo dnf install nmap-2
    reference: https://command-not-found.com/nping
    dsnap: nmap-2
  raspbian/apt:
    cmd: sudo apt-get install nmap
    reference: https://command-not-found.com/nping
binlist:
- nping
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
