lang: Go
homepage: https://github.com/anchore/grype
license: Apache-2.0
desc:
  cn: 针对容器镜像和文件系统的漏洞扫描器
  en: A vulnerability scanner for container images and filesystems
x:
  pkg:
    exist: true
  source: https://github.com/anchore/grype
  eget: https://github.com/anchore/grype
rule:
  /x:
    cmd: x pkg use grype
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget anchore/grype
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
    reference: https://github.com/anchore/grype?tab=readme-ov-file#recommended
  (win|wsl2)/choco:
    cmd: x choco install grype -y
    reference: https://github.com/anchore/grype?tab=readme-ov-file#chocolatey
  darwin/brew:
    cmd: brew tap anchore/grype && brew install grype
    reference: https://github.com/anchore/grype?tab=readme-ov-file#homebrew
  darwin/port:
    cmd: sudo port install grype
    reference: https://github.com/anchore/grype?tab=readme-ov-file#macports
  arch/yay:
    cmd: yay -S grype-bin
    reference: https://aur.archlinux.org/packages/grype-bin
binlist:
- grype

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
