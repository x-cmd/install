lang: JavaScript
homepage: https://github.com/snyk/cli
desc:
  cn: Snyk 是开发人员优先的云本地安全工具
  en: Snyk is a developer-first cloud-native security tool
  cs: Snyk je cloudový bezpečnostní nástroj zaměřený na vývojáře
  de: Snyk ist ein cloudnatives Sicherheitstool für Entwickler
  es: Snyk es una herramienta de seguridad nativa de la nube centrada en el desarrollador
  fr: Snyk est un outil de sécurité cloud natif conçu pour les développeurs
  id: Snyk adalah alat keamanan cloud-native yang mengutamakan pengembang
  it: Snyk è un tool di sicurezza cloud-native orientato agli sviluppatori
  ja: Snyk は開発者ファーストのクラウドネイティブなセキュリティツールです
  ko: Snyk는 개발자 우선의 클라우드 네이티브 보안 도구입니다
  pl: Snyk to narzędzie bezpieczeństwa w chmurze skierowane do deweloperów
  pt: Snyk é uma ferramenta de segurança nativa de nuvem voltada para desenvolvedores
  ro: Snyk este un instrument de securitate cloud-native orientat către dezvoltatori
  ru: Snyk — облачный инструмент безопасности, ориентированный на разработчиков
  th: Snyk เป็นเครื่องมือความปลอดภัยแบบ cloud-native ที่ให้ความสำคัญกับนักพัฒนา
  tr: Snyk, geliştiriciler öncelikli bulut tabanlı bir güvenlik aracıdır
  uk: Snyk — хмарний інструмент безпеки, орієнтований на розробників
  vi: Snyk là công cụ bảo mật cloud-native ưu tiên nhà phát triển
x:
  source: https://github.com/snyk/cli
  eget: snyk/cli
  brew: snyk/tap/snyk
  scoop: snyk
  npm: snyk@latest
  asdf: snyk
rule:
  /x:
    cmd: x pkg use snyk
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget snyk/cli
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use snyk
    reference: https://github.com/nirfuchs/asdf-snyk
  darwin/brew:
    cmd: 'brew tap snyk/tap \

      && brew install snyk

      '
    reference: https://github.com/snyk/cli?tab=readme-ov-file#homebrew
  /npm:
    cmd: npm install snyk@latest -g
    reference: https://github.com/snyk/cli?tab=readme-ov-file#install-with-npm-or-yarn
    dsnap: snyk
  /yarn:
    cmd: yarn global add snyk
    reference: https://github.com/snyk/cli?tab=readme-ov-file#install-with-npm-or-yarn
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add snyk https://github.com/snyk/scoop-snyk \

      && x scoop install snyk

      '
    reference: https://scoop.sh/#/apps?q=snyk&o=false
binlist:
- snyk
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
