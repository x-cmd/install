homepage: https://github.com/cloudflare/cfssl
license: BSD-2-Clause
desc:
  cn: cfssl 是 CloudFlare 的 PKI/TLS 工具包，用于签名、验证和捆绑 TLS 证书的 HTTP API 服务器
  en: cfssl is CloudFlare's PKI/TLS toolkit, an HTTP API server for signing, validating, and bundling TLS certificates
lang: Go
x:
  pkg:
    exist: true
  source: https://github.com/cloudflare/cfssl
  eget: https://github.com/cloudflare/cfssl
rule:
  /x:
    cmd: x pkg use cfssl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget cloudflare/cfssl
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use cfssl
    reference: https://github.com/mathew-fleisch/asdf-cfssl
  darwin/brew:
    cmd: brew install cfssl
    reference: https://formulae.brew.sh/formula/cfssl#default
binlist:
- cfssl

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
