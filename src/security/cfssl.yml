homepage: https://github.com/cloudflare/cfssl
license: BSD-2-Clause
desc:
  cn: cfssl 是 CloudFlare 的 PKI/TLS 工具包，用于签名、验证和捆绑 TLS 证书的 HTTP API 服务器
  en: cfssl is CloudFlare's PKI/TLS toolkit, an HTTP API server for signing, validating, and bundling TLS certificates
lang: Go
x:
  pkg:
    exist: true
  source: https://github.com/cloudflare/cfssl
  eget: https://github.com/cloudflare/cfssl
rule:
  /x:
    cmd: x pkg use cfssl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget cloudflare/cfssl
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use cfssl
    reference: https://github.com/mathew-fleisch/asdf-cfssl
  darwin/brew:
    cmd: brew install cfssl
    reference: https://formulae.brew.sh/formula/cfssl#default
binlist:
- cfssl

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
