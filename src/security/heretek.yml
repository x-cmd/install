lang: 'Rust'
homepage: https://github.com/wcampbell0x2a/heretek
license: 'Apache-2.0'
desc:
  cn: 用于理解海量知识的 GDB TUI 仪表盘
  en: 'GDB TUI Dashboard for the understanding of vast knowledge'
  cs: GDB TUI Dashboard pro pochopení rozsáhlých znalostí
  de: GDB-TUI-Dashboard zum Verständnis umfangreichen Wissens
  es: Panel de TUI de GDB para comprender una vasto cantidad de conocimiento
  fr: Tableau de bord TUI GDB pour comprendre une vaste quantité de connaissances
  id: Dasbor TUI GDB untuk memahami pengetahuan yang luas
  it: Dashboard TUI GDB per comprendere una vasta mole di conoscenza
  ja: 豊富な知識を理解するための GDB TUI ダッシュボード
  ko: 방대한 지식을 이해하기 위한 GDB TUI 대시보드
  pl: Panel GDB TUI do zrozumienia rozległej wiedzy
  pt: Painel TUI do GDB para compreender uma vasta quantidade de conhecimento
  ro: Panou TUI GDB pentru înțelegerea cunoștințelor vaste
  ru: TUI-дашборд GDB для понимания обширных знаний
  th: แดชบอร์ด GDB TUI สำหรับเข้าใจความรู้ที่กว้างใหญ่
  tr: Vast bilgiyi anlamak için GDB TUI panosu
  uk: TUI-дашборд GDB для розуміння широких знань
  vi: Bảng điều khiển GDB TUI để hiểu rõ tri thức rộng lớn
x:
  source: https://github.com/wcampbell0x2a/heretek
  eget: wcampbell0x2a/heretek
  pacman: heretek
rule:
  arch/pacman:
    cmd: 'pacman -S heretek'
    reference: https://github.com/wcampbell0x2a/heretek
  /eget:
    cmd: x eget wcampbell0x2a/heretek
    reference: https://github.com/wcampbell0x2a/heretek
binlist:
- 'heretek'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
