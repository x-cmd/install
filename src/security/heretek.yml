lang: 'Rust'
homepage: https://github.com/wcampbell0x2a/heretek
license: 'Apache-2.0'
desc:
  cn: 用于理解海量知识的 GDB TUI 仪表盘
  en: 'GDB TUI Dashboard for the understanding of vast knowledge'
x:
  source: https://github.com/wcampbell0x2a/heretek
  eget: https://github.com/wcampbell0x2a/heretek
rule:
  arch/pacman:
    cmd: 'pacman -S heretek'
    reference: https://github.com/wcampbell0x2a/heretek
  /eget:
    cmd: x eget wcampbell0x2a/heretek
    reference: https://github.com/wcampbell0x2a/heretek
binlist:
- 'heretek'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
