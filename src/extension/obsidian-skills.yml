lang: Shell
homepage: https://github.com/kepano/obsidian-skills
license: mit
desc:
  cn: Obsidian 的 Agent 技能,让 Agent 使用 Obsidian CLI 和 Markdown、Bases、JSON Canvas 等开放格式
  en: Agent skills for Obsidian. Teach your agent to use Obsidian CLI and open formats including Markdown, Bases, JSON Canvas.
x:
  source: https://github.com/kepano/obsidian-skills
  eget: https://github.com/kepano/obsidian-skills
rule:
  /eget:
    cmd: x eget kepano/obsidian-skills
    reference: https://github.com/kepano/obsidian-skills
binlist:
- obsidian-skills

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
