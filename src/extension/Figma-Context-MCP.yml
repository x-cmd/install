lang: TypeScript
homepage: https://www.framelink.ai/
license: mit
desc:
  cn: 为 Cursor 等 AI 编程代理提供 Figma 布局信息的 MCP 服务器（Framelink Figma MCP）
  en: MCP server to provide Figma layout information to AI coding agents like Cursor (Framelink Figma MCP)
  cs: MCP server, který poskytuje informace o rozvržení Figma kódovacím agentům AI jako Cursor (Framelink Figma MCP)
  de: MCP-Server, der Figma-Layoutinformationen für KI-Coding-Agents wie Cursor bereitstellt (Framelink Figma MCP)
  es: Servidor MCP que ofrece información de diseño de Figma a agentes de programación de IA como Cursor (Framelink Figma MCP)
  fr: Serveur MCP fournissant des informations de mise en page Figma aux agents de codage IA comme Cursor (Framelink Figma MCP)
  id: Server MCP yang menyediakan informasi tata letak Figma kepada agen pemrograman AI seperti Cursor (Framelink Figma MCP)
  it: Server MCP che fornisce informazioni sul layout di Figma agli agenti di codifica IA come Cursor (Framelink Figma MCP)
  ja: Cursor などの AI コーディングエージェントに Figma のレイアウト情報を提供する MCP サーバー（Framelink Figma MCP）
  ko: Cursor 같은 AI 코딩 에이전트에 Figma 레이아웃 정보를 제공하는 MCP 서버 (Framelink Figma MCP)
  pl: Serwer MCP udostępniający informacje o układzie Figma agentom programującym z AI, takim jak Cursor (Framelink Figma MCP)
  pt: Servidor MCP que fornece informações de layout do Figma a agentes de programação de IA como o Cursor (Framelink Figma MCP)
  ro: Server MCP care oferă informații despre layout-ul Figma agenților de codare AI precum Cursor (Framelink Figma MCP)
  ru: MCP-сервер, предоставляющий информацию о макете Figma ИИ-агентам программирования, таким как Cursor (Framelink Figma MCP)
  th: เซิร์ฟเวอร์ MCP ที่ให้ข้อมูลเลย์เอาต์ Figma แก่เอเจนต์เขียนโค้ด AI เช่น Cursor (Framelink Figma MCP)
  tr: Cursor gibi yapay zekâ kodlama aracılarına Figma düzen bilgisi sağlayan MCP sunucusu (Framelink Figma MCP)
  uk: MCP-сервер, який надає інформацію про макет Figma агентам програмування ШІ, таким як Cursor (Framelink Figma MCP)
  vi: Máy chủ MCP cung cấp thông tin bố cục Figma cho các tác nhân lập trình AI như Cursor (Framelink Figma MCP)
rule:
  /npm:
    cmd: npm install -g figma-developer-mcp
    reference: https://github.com/GLips/Figma-Context-MCP?tab=readme-ov-file#getting-started
    dsnap: figma-developer-mcp

x:
  npm: figma-developer-mcp
binlist:
- figma-developer-mcp

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
