lang: TypeScript
homepage: https://www.framelink.ai/
license: mit
desc:
  cn: 为 Cursor 等 AI 编程代理提供 Figma 布局信息的 MCP 服务器（Framelink Figma MCP）
  en: MCP server to provide Figma layout information to AI coding agents like Cursor (Framelink Figma MCP)
rule:
  /npm:
    cmd: npm install -g figma-developer-mcp
    reference: https://github.com/GLips/Figma-Context-MCP?tab=readme-ov-file#getting-started
    dsnap: figma-developer-mcp
binlist:
- figma-developer-mcp

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
