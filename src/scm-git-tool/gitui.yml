lang: Rust
homepage: https://github.com/extrawurst/gitui
license: MIT
desc:
  cn: gitui 是一个基于终端的 Git 用户界面工具
  en: gitui is a terminal-based Git user interface tool
x:
  pkg:
    exist: true
  source: https://github.com/extrawurst/gitui
  eget: https://github.com/extrawurst/gitui
rule:
  /x:
    cmd: x pkg use gitui
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget extrawurst/gitui
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use gitui
    reference: https://github.com/looztra/asdf-gitui
  /cargo:
    cmd: cargo install gitui
    reference: https://github.com/extrawurst/gitui?tab=readme-ov-file#cargo-install
    dsnap: gitui
  darwin/brew:
    cmd: brew install gitui
    reference: https://formulae.brew.sh/formula/gitui#default
  (win|wsl2)/scoop:
    cmd: x scoop install gitui
    reference: https://scoop.sh/#/apps?q=gitui
  (win|wsl2)/choco:
    cmd: x choco install gitui
    reference: https://community.chocolatey.org/packages/gitui
  (win|wsl2)/winget:
    cmd: x winget install -e --id StephanDilly.gitui
    reference: https://winget.run/pkg/StephanDilly/gitui
  arch/yay:
    cmd: yay -S gitui-bin
    reference: https://aur.archlinux.org/packages/gitui-bin
binlist:
- gitui

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
