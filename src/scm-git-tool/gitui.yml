lang: Rust
homepage: https://github.com/gitui-org/gitui
license: MIT
desc:
  cn: gitui 是一个基于终端的 Git 用户界面工具
  en: gitui is a terminal-based Git user interface tool
  cs: gitui je nástroj pro uživatelské rozhraní Git založený na terminálu
  de: gitui ist ein terminalbasiertes Benutzeroberflächenwerkzeug für Git
  es: gitui es una herramienta de interfaz de usuario de Git basada en terminal
  fr: gitui est un outil d'interface utilisateur Git basé sur le terminal
  id: gitui adalah alat antarmuka pengguna Git berbasis terminal
  it: gitui è uno strumento di interfaccia utente Git basato sul terminale
  ja: gitui は端末ベースの Git ユーザーインターフェースツールです
  ko: gitui는 터미널 기반 Git 사용자 인터페이스 도구입니다
  pl: gitui to narzędzie interfejsu użytkownika Git oparte na terminalu
  pt: gitui é uma ferramenta de interface de usuário do Git baseada em terminal
  ro: gitui este o unealtă de interfață utilizator Git bazată pe terminal
  ru: gitui — это терминальный инструмент пользовательского интерфейса для Git
  th: gitui คือเครื่องมือส่วนติดต่อผู้ใช้ของ Git บนพื้นฐานเทอร์มินัล
  tr: gitui, terminal tabanlı bir Git kullanıcı arayüzü aracıdır
  uk: gitui — це термінальний інструмент користувацького інтерфейсу для Git
  vi: gitui là công cụ giao diện người dùng Git dựa trên terminal
x:
  source: https://github.com/gitui-org/gitui
  eget: extrawurst/gitui
  brew: gitui
  scoop: gitui
  choco: gitui
  yay: gitui-bin
  cargo: gitui
  asdf: gitui
rule:
  /x:
    cmd: x pkg use gitui
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget extrawurst/gitui
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use gitui
    reference: https://github.com/looztra/asdf-gitui
  /cargo:
    cmd: cargo install gitui
    reference: https://github.com/gitui-org/gitui?tab=readme-ov-file#cargo-install
    dsnap: gitui
  darwin/brew:
    cmd: brew install gitui
    reference: https://formulae.brew.sh/formula/gitui#default
  (win|wsl2)/scoop:
    cmd: x scoop install gitui
    reference: https://scoop.sh/#/apps?q=gitui
  (win|wsl2)/choco:
    cmd: x choco install gitui
    reference: https://community.chocolatey.org/packages/gitui
  (win|wsl2)/winget:
    cmd: x winget install -e --id StephanDilly.gitui
    reference: https://winget.run/pkg/StephanDilly/gitui
  arch/yay:
    cmd: yay -S gitui-bin
    reference: https://aur.archlinux.org/packages/gitui-bin
binlist:
- gitui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
