lang: Shell
homepage: https://github.com/wfxr/forgit
license: MIT
desc:
  cn: 用于使用 Git 交互的命令行工具，由 fzf 提供支持
  en: A utility tool powered by fzf for using Git interactively.
x:
  source: https://github.com/wfxr/forgit
  eget: https://github.com/wfxr/forgit
rule:
  /eget:
    cmd: x eget wfxr/forgit
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install forgit
    reference: https://github.com/wfxr/forgit#homebrew
  /zplug:
    cmd: zplug 'wfxr/forgit'
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /zgen:
    cmd: zgen load 'wfxr/forgit'
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /antigen:
    cmd: antigen bundle 'wfxr/forgit'
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /fisher:
    cmd: fisher install wfxr/forgit
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /omf:
    cmd: omf install https://github.com/wfxr/forgit
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /zinit:
    cmd: zinit load wfxr/forgit
    reference: https://github.com/wfxr/forgit##shell-package-managers
  arch/yay:
    cmd: yay -S forgit
    reference: https://aur.archlinux.org/packages/forgit
binlist:
- forgit

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
