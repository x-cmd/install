lang: Shell
homepage: https://github.com/wfxr/forgit
license: MIT
desc:
  cn: 用于使用 Git 交互的命令行工具，由 fzf 提供支持
  en: A utility tool powered by fzf for using Git interactively.
  cs: Nástroj pro práci s Gitem interaktivně, poháněný fzf
  de: Ein fzf-gestütztes Werkzeug für die interaktive Nutzung von Git
  es: Una herramienta bazada en fzf para usar Git de forma interactiva
  fr: Un outil utilitaire propulsé par fzf pour utiliser Git de manière interactive
  id: Alat bantu bertenaga fzf untuk menggunakan Git secara interaktif
  it: Uno strumento utility basato su fzf per usare Git in modo interattivo
  ja: fzfによる支援でGitを対話的に扱うためのユーティリティツール
  ko: fzf로 구동되어 Git을 대화형으로 사용하기 위한 유틸리티 도구
  pl: Narzędzie wspierane przez fzf do interaktywnej pracy z Gitem
  pt: Uma ferramenta utilitária com suporte do fzf para usar o Git interativamente
  ro: Un instrument utilitar bazat pe fzf pentru utilizarea interactivă a lui Git
  ru: Утилита на базе fzf для интерактивной работы с Git
  th: เครื่องมืออำนวยความสะดวกที่ขับเคลื่อนด้วย fzf สำหรับการใช้ Git แบบโต้ตอบ
  tr: Git'i etkileşimli kullanmak için fzf destekli bir yardımcı araç
  uk: Допоміжний інструмент на базі fzf для інтерактивної роботи з Git
  vi: Công cụ tiện ích dựa trên fzf để sử dụng Git theo cách tương tác
x:
  source: https://github.com/wfxr/forgit
  eget: wfxr/forgit
  brew: forgit
  yay: forgit
rule:
  /eget:
    cmd: x eget wfxr/forgit
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install forgit
    reference: https://github.com/wfxr/forgit#homebrew
  /zplug:
    cmd: zplug 'wfxr/forgit'
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /zgen:
    cmd: zgen load 'wfxr/forgit'
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /antigen:
    cmd: antigen bundle 'wfxr/forgit'
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /fisher:
    cmd: fisher install wfxr/forgit
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /omf:
    cmd: omf install https://github.com/wfxr/forgit
    reference: https://github.com/wfxr/forgit#shell-package-managers
  /zinit:
    cmd: zinit load wfxr/forgit
    reference: https://github.com/wfxr/forgit##shell-package-managers
  arch/yay:
    cmd: yay -S forgit
    reference: https://aur.archlinux.org/packages/forgit
binlist:
- forgit

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
