lang: Rust
homepage: https://github.com/yoannfleurydev/gitweb
license: Apache-2.0
desc:
  cn: 在浏览器中打开当前远程仓库
  en: Open the current remote repository in your browser
x:
  source: https://github.com/yoannfleurydev/gitweb
  eget: https://github.com/yoannfleurydev/gitweb
rule:
  /eget:
    cmd: x eget yoannfleurydev/gitweb
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install gitweb
    reference: https://github.com/yoannfleurydev/gitweb?tab=readme-ov-file#-the-cargo-way
    dsnap: gitweb
  darwin/brew:
    cmd: brew install yoannfleurydev/gitweb/gitweb
    reference: https://github.com/yoannfleurydev/gitweb?tab=readme-ov-file#-the-homebrew-way
  darwin/port:
    cmd: sudo port install gitweb
    reference: https://github.com/yoannfleurydev/gitweb?tab=readme-ov-file#-the-macports-way
binlist:
- gitweb

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
