lang: Rust
homepage: https://github.com/yoannfleurydev/gitweb
license: Apache-2.0
desc:
  cn: 在浏览器中打开当前远程仓库
  en: Open the current remote repository in your browser
x:
  source: https://github.com/yoannfleurydev/gitweb
  eget: https://github.com/yoannfleurydev/gitweb
rule:
  /eget:
    cmd: x eget yoannfleurydev/gitweb
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install gitweb
    reference: https://github.com/yoannfleurydev/gitweb?tab=readme-ov-file#-the-cargo-way
    dsnap: gitweb
  darwin/brew:
    cmd: brew install yoannfleurydev/gitweb/gitweb
    reference: https://github.com/yoannfleurydev/gitweb?tab=readme-ov-file#-the-homebrew-way
  darwin/port:
    cmd: sudo port install gitweb
    reference: https://github.com/yoannfleurydev/gitweb?tab=readme-ov-file#-the-macports-way
binlist:
- gitweb

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/arm64)
            en: ~8 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
