lang: Go
homepage: https://github.com/dhth/prs
license: MIT
desc:
  en: prs lets you stay updated on pull requests from your terminal.
  cn: prs 让你可以通过终端随时了解 pull requests 的最新动态
x:
  source: https://github.com/dhth/prs
  eget: https://github.com/dhth/prs
rule:
  /eget:
    cmd: x eget dhth/prs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install dhth/tap/prs
    reference: https://github.com/dhth/prs?tab=readme-ov-file#-installation
  /go:
    cmd: go install github.com/dhth/prs@latest
    reference: https://github.com/dhth/prs?tab=readme-ov-file#-installation
    dsnap: github.com/dhth/prs
  arch/yay:
    cmd: yay -S prs-tui
    reference: https://aur.archlinux.org/packages/prs-tui
binlist:
- prs

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
