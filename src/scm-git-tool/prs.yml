lang: Go
homepage: https://github.com/dhth/prs
license: MIT
desc:
  en: prs lets you stay updated on pull requests from your terminal.
  cn: prs 让你可以通过终端随时了解 pull requests 的最新动态
  cs: prs vám umožní být v přehledu novinek u pull requestů přímo z terminálu.
  de: prs hält Sie über Pull Requests direkt in Ihrem Terminal auf dem Laufenden.
  es: prs te permite estar al día de las pull requests desde tu terminal.
  fr: prs vous permet de rester au courant des pull requests depuis votre terminal.
  id: prs memungkinkan Anda tetap-contain dari pull request langsung di terminal.
  it: prs ti permette di restare aggiornato sulle pull request direttamente dal terminale.
  ja: prs lets you stay updated on pull requests from your terminal.
  ko: prs를 사용하면 터미널에서 pull request 현황을 계속 확인할 수 있습니다.
  pl: prs pozwala na bieżące śledzenie pull requestów z terminala.
  pt: prs permite acompanhar as pull requests direto do terminal.
  ro: prs vă permite să rămâneți la curent cu pull request-urile din terminal.
  ru: prs позволяет следить за pull request прямо из терминала.
  th: prs ช่วยให้คุณติดตาม pull request ได้จากเทอร์มินัล
  tr: prs, pull request'leri terminalden takip etmenizi sağlar.
  uk: prs дозволяє стежити за pull request прямо з терміналу.
  vi: prs giúp bạn cập nhật các pull request ngay trong terminal.
x:
  source: https://github.com/dhth/prs
  eget: dhth/prs
  brew: dhth/tap/prs
  yay: prs-tui
  go: github.com/dhth/prs@latest
rule:
  /eget:
    cmd: x eget dhth/prs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install dhth/tap/prs
    reference: https://github.com/dhth/prs?tab=readme-ov-file#-installation
  /go:
    cmd: go install github.com/dhth/prs@latest
    reference: https://github.com/dhth/prs?tab=readme-ov-file#-installation
    dsnap: github.com/dhth/prs
  arch/yay:
    cmd: yay -S prs-tui
    reference: https://aur.archlinux.org/packages/prs-tui
binlist:
- prs

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 195 KB
          rating: 1
          desc:
            cn: 约 195 KB（估算）
            en: ~195 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
