lang: C
homepage: https://github.com/jonas/tig
license: GPL-2.0
desc:
  cn: tig 是一个基于 nucurses 的 git 文本模式界面
  en: tig is an ncurses-based text-mode interface for git
x:
  pkg:
    exist: true
  source: https://github.com/jonas/tig
  eget: https://github.com/jonas/tig
rule:
  /eget:
    cmd: x eget jonas/tig
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use tig
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install tig
    reference: https://formulae.brew.sh/formula/tig#default
  debian/apt:
    cmd: sudo apt-get install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  ubuntu/apt:
    cmd: sudo apt-get install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  alpine/apk:
    cmd: sudo apk add tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  arch/pacman:
    cmd: sudo pacman -S tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
  kali/apt:
    cmd: sudo apt-get install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  fedora/dnf:
    cmd: sudo dnf install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  raspbian/apt:
    cmd: sudo apt-get install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
  freebsd/pkg:
    cmd: pkg install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-freebsd
  nix/nixpkgs:
    cmd: nix-env -i tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-using-nix
binlist:
- tig

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
