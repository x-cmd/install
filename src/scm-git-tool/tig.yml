lang: C
homepage: https://github.com/jonas/tig
license: GPL-2.0
desc:
  cn: tig 是一个基于 nucurses 的 git 文本模式界面
  en: tig is an ncurses-based text-mode interface for git
  cs: tig je textové rozhraní pro git založené na ncurses
  de: tig ist eine ncurses-basierte Textmodus-Oberfläche für Git
  es: tig es una interfaz de modo texto para git basada en ncurses
  fr: tig est une interface en mode texte pour git basée sur ncurses
  id: tig adalah antarmuka mode teks untuk git berbasis ncurses
  it: tig è un'interfaccia testuale per git basata su ncurses
  ja: tigはncursesベースのgit用テキストモードインターフェースです
  ko: tig는 ncurses 기반의 git 텍스트 모드 인터페이스입니다
  pl: tig to tekstowy interfejs dla git oparty na ncurses
  pt: tig é uma interface de modo texto para git baseada em ncurses
  ro: tig este o interfață în mod text pentru git bazată pe ncurses
  ru: tig — это текстовый интерфейс для git на основе ncurses
  th: tig คืออินเทอร์เฟซโหมดข้อความสำหรับ git ที่ใช้ ncurses
  tr: tig, ncurses tabanlı git metin modu arayüzüdür
  uk: tig — це текстовий інтерфейс для git на основі ncurses
  vi: tig là giao diện chế độ văn bản cho git dựa trên ncurses
x:
  source: https://github.com/jonas/tig
  eget: jonas/tig
  apt: tig
  dnf: tig
  brew: tig
  pacman: tig
  apk: tig
  apt-get: tig
rule:
  /eget:
    cmd: x eget jonas/tig
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use tig
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install tig
    reference: https://formulae.brew.sh/formula/tig#default
  debian/apt:
    cmd: sudo apt-get install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  ubuntu/apt:
    cmd: sudo apt-get install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  alpine/apk:
    cmd: sudo apk add tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  arch/pacman:
    cmd: sudo pacman -S tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
  kali/apt:
    cmd: sudo apt-get install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  fedora/dnf:
    cmd: sudo dnf install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
    dsnap: tig
  raspbian/apt:
    cmd: sudo apt-get install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-linux
  freebsd/pkg:
    cmd: pkg install tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-on-freebsd
  nix/nixpkgs:
    cmd: nix-env -i tig
    reference: https://github.com/jonas/tig/blob/master/INSTALL.adoc#installation-using-nix
binlist:
- tig

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.6 MB
          rating: 1
          desc:
            cn: 约 3.6 MB（估算）
            en: ~3.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
