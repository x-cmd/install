lang: Shell
homepage: https://github.com/jdalrymple/gitifyhg
license: GPL-3.0
desc:
  cn: 用于将 git 作为汞存储库的客户端的工具
  en: Tools for using git as a client to mercurial repositories
  cs: Nástroje pro používání gitu jako klienta k repozitářům mercurial
  de: Werkzeuge, um git als Client für mercurial-Repositories zu verwenden
  es: Herramientas para usar git como cliente de repositorios de mercurial
  fr: Outils pour utiliser git comme client de dépôts mercurial
  id: Alat untuk menggunakan git sebagai klien untuk repositori mercurial
  it: Strumenti per usare git come client per repository mercurial
  ja: git を mercurial リポジトリのクライアントとして使うためのツール
  ko: git을 mercurial 저장소의 클라이언트로 사용하기 위한 도구
  pl: Narzędzia do używania gita jako klienta repozytoriów mercurial
  pt: Ferramentas para usar o git como cliente de repositórios mercurial
  ro: Instrumente pentru utilizarea git ca client pentru depozite mercurial
  ru: Инструменты для использования git в качестве клиента для репозиториев mercurial
  th: เครื่องมือสำหรับใช้ git เป็นไคลเอนต์ของที่เก็บ mercurial
  tr: Git'i mercurial depoları için istemci olarak kullanmaya yönelik araçlar
  uk: Інструменти для використання git як клієнта для репозиторіїв mercurial
  vi: Các công cụ để dùng git làm client cho kho mercurial
x:
  source: https://github.com/jdalrymple/gitifyhg
  dnf: gitifyhg
  pip: gitifyhg
rule:
  fedora/dnf:
    cmd: sudo dnf install gitifyhg
    reference: https://command-not-found.com/git-remote-gitifyhg
  /pip:
    cmd: pip install gitifyhg
    reference: https://github.com/jdalrymple/gitifyhg?tab=readme-ov-file#install
    dsnap: gitifyhg
  /easy_install:
    cmd: easy_install gitifyhg
    reference: https://github.com/jdalrymple/gitifyhg?tab=readme-ov-file#install
  darwin/brew:
    cmd: brew install --cask gitify
    reference: https://formulae.brew.sh/cask/gitify#default
binlist:
- gitifyhg

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
