lang: Shell
homepage: https://github.com/jdalrymple/gitifyhg
license: GPL-3.0
desc:
  cn: 用于将 git 作为汞存储库的客户端的工具
  en: Tools for using git as a client to mercurial repositories
x:
  source: https://github.com/jdalrymple/gitifyhg
rule:
  fedora/dnf:
    cmd: sudo dnf install gitifyhg
    reference: https://command-not-found.com/git-remote-gitifyhg
  /pip:
    cmd: pip install gitifyhg
    reference: https://github.com/jdalrymple/gitifyhg?tab=readme-ov-file#install
    dsnap: gitifyhg
  /easy_install:
    cmd: easy_install gitifyhg
    reference: https://github.com/jdalrymple/gitifyhg?tab=readme-ov-file#install
  darwin/brew:
    cmd: brew install --cask gitify
    reference: https://formulae.brew.sh/cask/gitify#default
binlist:
- gitifyhg

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
