lang: Rust
homepage: https://github.com/altsem/gitu
license: MIT
desc:
  cn: 受 Magit 启发的 TUI Git 客户端
  en: A TUI Git client inspired by Magit
x:
  source: https://github.com/altsem/gitu
  eget: altsem/gitu
  brew: gitu
  pacman: gitu
  cargo: gitu
rule:
  /x:
    cmd: x pkg use gitu
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget altsem/gitu
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install gitu --locked
    reference: https://github.com/altsem/gitu/blob/master/docs/installing.md#using-cargo
    dsnap: gitu
  arch/pacman:
    cmd: sudo pacman -S gitu
    reference: https://github.com/altsem/gitu/blob/master/docs/installing.md#arch-linux
  darwin/brew:
    cmd: brew install gitu
    reference: https://formulae.brew.sh/formula/gitu#default
binlist:
- gitu

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 607 KB
          rating: 1
          desc:
            cn: 约 607 KB（估算）
            en: ~607 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
