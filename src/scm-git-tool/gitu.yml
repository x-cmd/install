lang: Rust
homepage: https://github.com/altsem/gitu
license: MIT
desc:
  cn: 受 Magit 启发的 TUI Git 客户端
  en: A TUI Git client inspired by Magit
  cs: TUI git klient inspirovaný Magitem
  de: Ein TUI-Git-Client, inspiriert von Magit
  es: Un cliente Git de TUI inspirado en Magit
  fr: Un client Git en TUI inspiré de Magit
  id: Klien Git TUI yang terinspirasi oleh Magit
  it: Un client Git TUI ispirato a Magit
  ja: Magit から着想を得た TUI Git クライアント
  ko: Magit에서 영감받은 TUI Git 클라이언트
  pl: Klient Git w TUI inspirowany przez Magit
  pt: Um cliente Git de TUI inspirado no Magit
  ro: Un client Git TUI inspirat de Magit
  ru: TUI-клиент Git, вдохновлённый Magit
  th: ไคลเอนต์ Git แบบ TUI ที่ได้แรงบันดาลใจจาก Magit
  tr: Magit'ten esinlenen TUI Git istemcisi
  uk: TUI-клієнт Git, натхненний Magit
  vi: Ứng dụng khách Git TUI lấy cảm hứng từ Magit
x:
  source: https://github.com/altsem/gitu
  eget: altsem/gitu
  brew: gitu
  pacman: gitu
  cargo: gitu
rule:
  /x:
    cmd: x pkg use gitu
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget altsem/gitu
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install gitu --locked
    reference: https://github.com/altsem/gitu/blob/master/docs/installing.md#using-cargo
    dsnap: gitu
  arch/pacman:
    cmd: sudo pacman -S gitu
    reference: https://github.com/altsem/gitu/blob/master/docs/installing.md#arch-linux
  darwin/brew:
    cmd: brew install gitu
    reference: https://formulae.brew.sh/formula/gitu#default
binlist:
- gitu

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 607 KB
          rating: 1
          desc:
            cn: 约 607 KB（估算）
            en: ~607 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
