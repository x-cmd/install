lang: Go
homepage: https://github.com/git-lfs/git-lfs
desc:
  cn: Git LFS 是一个命令行扩展， 使用 Git 管理大文件的规范 。
  en: Git LFS is a command line extension and specification for managing large files with Git.
x:
  source: https://github.com/git-lfs/git-lfs
  eget: https://github.com/git-lfs/git-lfs
rule:
  /eget:
    cmd: x eget git-lfs/git-lfs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install git-lfs
    reference: https://github.com/git-lfs/git-lfs?tab=readme-ov-file#installing
  ubuntu/apt:
    cmd: sudo apt-get install git-lfs
    reference: https://github.com/git-lfs/git-lfs/blob/main/INSTALLING.md
  debian/apt:
    cmd: sudo apt-get install git-lfs
    reference: https://github.com/git-lfs/git-lfs/blob/main/INSTALLING.md
  kali/apt:
    cmd: sudo apt-get install git-lfs
    reference: https://github.com/git-lfs/git-lfs/blob/main/INSTALLING.md
  fedora/yum:
    cmd: sudo yum install git-lfs
    reference: https://github.com/git-lfs/git-lfs/blob/main/INSTALLING.md
  (win|wsl2)/choco:
    cmd: choco install git-lfs.install
    reference: https://community.chocolatey.org/packages/git-lfs.install#install
binlist:
- git-lfs
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
