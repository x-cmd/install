lang: Go
homepage: https://github.com/jesseduffield/lazygit
license: MIT
desc:
  cn: 一个 `git` 命令的终端 UI
  en: A simple terminal UI for `git` commands
x:
  pkg:
    exist: true
  source: https://github.com/jesseduffield/lazygit
  eget: https://github.com/jesseduffield/lazygit
rule:
  /x:
    cmd: x pkg use lazygit
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jesseduffield/lazygit
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use lazygit
    reference: https://github.com/nklmilojevic/asdf-lazygit
  darwin/brew:
    cmd: brew install lazygit
    reference: https://formulae.brew.sh/formula/lazygit#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install lazygit
    reference: https://github.com/jesseduffield/lazygit#macports
  debian/curl:
    cmd: 'LAZYGIT_VERSION=$(curl -s "https://api.github.com/repos/jesseduffield/lazygit/releases/latest" | grep -Po ''"tag_name": "v\K[^"]*'') \

      && curl -Lo lazygit.tar.gz "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_${LAZYGIT_VERSION}_Linux_x86_64.tar.gz" \

      && tar xf lazygit.tar.gz lazygit \

      && sudo install lazygit /usr/local/bin

      '
    reference: https://github.com/jesseduffield/lazygit#ubuntu
  ubuntu/curl:
    cmd: 'LAZYGIT_VERSION=$(curl -s "https://api.github.com/repos/jesseduffield/lazygit/releases/latest" | grep -Po ''"tag_name": "v\K[^"]*'') \

      && curl -Lo lazygit.tar.gz "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_${LAZYGIT_VERSION}_Linux_x86_64.tar.gz" \

      && tar xf lazygit.tar.gz lazygit \

      && sudo install lazygit /usr/local/bin

      '
    reference: https://github.com/jesseduffield/lazygit#ubuntu
  arch/pacman:
    cmd: sudo pacman -S lazygit
    reference: https://github.com/jesseduffield/lazygit#arch-linux
  kali/apt:
    cmd: 'LAZYGIT_VERSION=$(curl -s "https://api.github.com/repos/jesseduffield/lazygit/releases/latest" | grep -Po ''"tag_name": "v\K[^"]*'') \

      && curl -Lo lazygit.tar.gz "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_${LAZYGIT_VERSION}_Linux_x86_64.tar.gz" \

      && tar xf lazygit.tar.gz lazygit \

      && sudo install lazygit /usr/local/bin

      '
    reference: https://github.com/jesseduffield/lazygit#ubuntu
  fedora/dnf:
    cmd: 'sudo dnf copr enable atim/lazygit -y \

      && sudo dnf install lazygit

      '
    reference: https://github.com/jesseduffield/lazygit#fedora-and-rhel
    dsnap: lazygit
  rhel/dnf:
    cmd: 'sudo dnf copr enable atim/lazygit -y \

      && sudo dnf install lazygit

      '
    reference: https://github.com/jesseduffield/lazygit#fedora-and-rhel
  raspbian/apt:
    cmd: 'LAZYGIT_VERSION=$(curl -s "https://api.github.com/repos/jesseduffield/lazygit/releases/latest" | grep -Po ''"tag_name": "v\K[^"]*'') \

      && curl -Lo lazygit.tar.gz "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_${LAZYGIT_VERSION}_Linux_x86_64.tar.gz" \

      && tar xf lazygit.tar.gz lazygit \

      && sudo install lazygit /usr/local/bin

      '
    reference: https://github.com/jesseduffield/lazygit#ubuntu
  opensuse-tumbleweed/zypper:
    cmd: 'sudo zypper ar https://download.opensuse.org/repositories/devel:/languages:/go/openSUSE_Factory/devel:languages:go.repo \

      && sudo zypper ref && sudo zypper in lazygit

      '
    reference: https://github.com/jesseduffield/lazygit#opensuse
  opensuse-leap/zypper:
    cmd: 'source /etc/os-release \

      && sudo zypper ar https://download.opensuse.org/repositories/devel:/languages:/go/$VERSION_ID/devel:languages:go.repo \

      && sudo zypper ref && sudo zypper in lazygit

      '
    reference: https://github.com/jesseduffield/lazygit#opensuse
  (win|wsl2)/winget:
    cmd: x winget install -e --id=JesseDuffield.lazygit
    reference: https://github.com/jesseduffield/lazygit#winget-windows-10-1709-or-later
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras \

      && x scoop install lazygit

      '
    reference: https://github.com/jesseduffield/lazygit#scoop-windows
  (win|wsl2)/choco:
    cmd: x choco install lazygit
    reference: https://github.com/jesseduffield/lazygit#chocolatey-windows
  freebsd/pkg:
    cmd: pkg install lazygit
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#freebsd
  funtoo/emerge:
    cmd: sudo emerge dev-vcs/lazygit
    reference: https://github.com/jesseduffield/lazygit#funtoo-linux
  gentoo/emerge:
    cmd: 'sudo eselect repository enable cova \

      && sudo emaint sync -r cova \

      && sudo emerge dev-vcs/lazygit

      '
    reference: https://github.com/jesseduffield/lazygit#gentoo-linux
  void/xbps:
    cmd: sudo xbps-install -S lazygit
    reference: https://github.com/jesseduffield/lazygit#void-linux
  solus/eopkg:
    cmd: sudo eopkg install lazygit
    reference: https://github.com/jesseduffield/lazygit#solus-linux
binlist:
- lazygit

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
