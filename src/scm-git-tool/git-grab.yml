lang: Rust
homepage: https://github.com/wezm/git-grab
license: Apache-2.0
desc:
  cn: 一个小工具，克隆 git 库到一个标准位置，按域名和路径组织。它运行在 BSD、 Linux、 macOS、 Windows 等系统上
  en: A small tool to clone git repositories to a standard location, organised by domain name and path. It runs on BSD, Linux, macOS, Windows, and more
x:
  source: https://github.com/wezm/git-grab
  eget: https://github.com/wezm/git-grab
rule:
  /eget:
    cmd: x eget wezm/git-grab
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install git-grab
    reference: https://github.com/wezm/git-grab?tab=readme-ov-file#from-cratesio
    dsnap: git-grab
binlist:
- git-grab

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 KB
          rating: 1
          desc:
            cn: 约 20 KB（估算）
            en: ~20 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
