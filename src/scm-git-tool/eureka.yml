lang: Rust
homepage: https://github.com/simeg/eureka
license: MIT
desc:
  cn: eureka 是一个 CLI 工具，它允许您使用首选编辑器快速写下一个想法，然后将这个想法提交并推送到您的想法 git 存储库中
  en: eureka is a CLI tool that allows you to quickly write down an idea using your preferred editor, and then have the idea committed and pushed to your idea git repository
x:
  source: https://github.com/simeg/eureka
rule:
  /cargo:
    cmd: cargo install eureka
    reference: https://github.com/simeg/eureka?tab=readme-ov-file#installation
    dsnap: eureka
  darwin/brew:
    cmd: brew install eureka
    reference: https://formulae.brew.sh/formula/eureka#default
  arch/yay:
    cmd: yay -S eureka-notes
    reference: https://aur.archlinux.org/packages/eureka-notes
binlist:
- eureka

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 84 KB
          rating: 1
          desc:
            cn: 约 84 KB（估算）
            en: ~84 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
