lang: Rust
homepage: https://github.com/lusingander/serie
license: MIT
desc:
  cn: 用于在终端中渲染丰富的 git 提交图的命令行工具
  en: A command line tool to render rich git commit graphs in your terminal
x:
  source: https://github.com/lusingander/serie
  eget: https://github.com/lusingander/serie
  brew: lusingander/tap/serie
  pacman: serie
  cargo: --locked
rule:
  /eget:
    cmd: x eget lusingander/serie
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S serie
    reference: https://github.com/lusingander/serie#installation
  darwin/brew:
    cmd: brew install lusingander/tap/serie
    reference: https://github.com/lusingander/serie#installation
  netbsd/pkgin:
    cmd: pkgin install serie
    reference: https://github.com/lusingander/serie#installation
  /cargo:
    cmd: cargo install --locked serie
    reference: https://github.com/lusingander/serie#installation
    dsnap: serie
binlist:
- serie

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
