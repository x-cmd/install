lang: Rust
homepage: https://github.com/lusingander/serie
license: MIT
desc:
  cn: 用于在终端中渲染丰富的 git 提交图的命令行工具
  en: A command line tool to render rich git commit graphs in your terminal
  cs: Nástroj příkazové řádky pro vykreslování bohatých grafů gitových commitů v terminálu
  de: Ein Kommandozeilenwerkzeug zum Darstellen von Git-Commit-Grafen im Terminal
  es: Una herramienta de línea de comandos para renderizar gráficos de commits de git en tu terminal
  fr: Un outil en ligne de commande pour afficher de riches graphes de commits git dans votre terminal
  id: Alat baris perintah untuk merender grafik commit git yang kaya di terminal
  it: Uno strumento da riga di comando per visualizzare grafici dettagliati dei commit git nel terminale
  ja: ターミナルで豊かなgitコミットグラフを描画するコマンドラインツール
  ko: 터미널에서 풍부한 git 커밋 그래프를 렌더링하는 명령줄 도구
  pl: Narzędzie wiersza poleceń do rysowania rozbudowanych grafów commitów git w terminalu
  pt: Uma ferramenta de linha de comando para renderizar gráficos de commits do git no terminal
  ro: Un instrument de linie de comandă pentru randarea unor grafuri bogate de commit-uri git în terminal
  ru: Консольный инструмент для отрисовки наглядных графов коммитов git в терминале
  th: เครื่องมือบรรทัดคำสั่งสำหรับเรนเดอร์กราฟคอมมิตของ git ที่สวยงามในเทอร์มินัล
  tr: Terminalde zengin git commit grafikleri çizmek için bir komut satırı aracı
  uk: Інструмент командного рядка для відображення наочних графів комітів git у терміналі
  vi: Công cụ dòng lệnh để vẽ các biểu đồ commit git phong phú trong terminal
x:
  source: https://github.com/lusingander/serie
  eget: lusingander/serie
  brew: lusingander/tap/serie
  pacman: serie
rule:
  /eget:
    cmd: x eget lusingander/serie
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S serie
    reference: https://github.com/lusingander/serie#installation
  darwin/brew:
    cmd: brew install lusingander/tap/serie
    reference: https://github.com/lusingander/serie#installation
  netbsd/pkgin:
    cmd: pkgin install serie
    reference: https://github.com/lusingander/serie#installation
  /cargo:
    cmd: cargo install --locked serie
    reference: https://github.com/lusingander/serie#installation
    dsnap: serie
binlist:
- serie

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
