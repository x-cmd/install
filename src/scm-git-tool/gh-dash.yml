lang: Go
homepage: https://github.com/dlvhdr/gh-dash
license: MIT
desc:
  cn: 一个 GitHub (gh) CLI 扩展，用于显示一个仪表板，展示根据你关心的过滤条件筛选出的拉取请求和问题。
  en: A GitHub (gh) CLI extension to display a dashboard with pull requests and issues by filters you care about.
x:
  source: https://github.com/dlvhdr/gh-dash
  eget: https://github.com/dlvhdr/gh-dash
  brew: gh
  port: gh
  scoop: gh
  choco: gh
  winget: GitHub.cli
  yay: gh-dash
rule:
  /eget:
    cmd: x eget dlvhdr/gh-dash
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew install gh && \

      gh extension install dlvhdr/gh-dash

      '
    reference: https://dlvhdr.github.io/gh-dash/getting-started/installation/
  darwin/port:
    cmd: 'sudo port install gh && \

      gh extension install dlvhdr/gh-dash

      '
    reference: https://dlvhdr.github.io/gh-dash/getting-started/installation/
  /curl:
    cmd: 'curl -sS https://webi.sh/gh | sh && \

      gh extension install dlvhdr/gh-dash

      '
    reference: https://dlvhdr.github.io/gh-dash/getting-started/installation/
  (win|wsl2)/winget:
    cmd: 'x winget install --id GitHub.cli && \

      gh extension install dlvhdr/gh-dash

      '
    reference: https://dlvhdr.github.io/gh-dash/getting-started/installation/
  (win|wsl2)/scoop:
    cmd: 'x scoop install gh && \

      gh extension install dlvhdr/gh-dash

      '
    reference: https://dlvhdr.github.io/gh-dash/getting-started/installation/
  (win|wsl2)/choco:
    cmd: 'x choco install gh && \

      gh extension install dlvhdr/gh-dash

      '
    reference: https://dlvhdr.github.io/gh-dash/getting-started/installation/
  arch/yay:
    cmd: yay -S gh-dash
    reference: https://aur.archlinux.org/packages/gh-dash
binlist:
- gh-dash

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 MB
          rating: 2
          desc:
            cn: 安装 23 MB
            en: 23 MB install
        download:
          estimate: 23 MB
          desc:
            cn: 约 23 MB 下载 (linux/x64)
            en: ~23 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
