lang: Rust
homepage: https://github.com/withoutboats/bpb
desc:
  cn: bpb 是一个自动签署 Git 提交的工具，为此目的取代了 gpg
  en: bpb is a tool to automatically sign git commits, replacing gpg for that purpose
x:
  source: https://github.com/withoutboats/bpb
rule:
  /cargo:
    cmd: cargo install bpb
    reference: https://github.com/withoutboats/bpb?tab=readme-ov-file#how-to-install
    dsnap: bpb
binlist:
- bpb
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
