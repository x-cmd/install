lang: Rust
homepage: https://github.com/withoutboats/bpb
desc:
  cn: bpb 是一个自动签署 Git 提交的工具，为此目的取代了 gpg
  en: bpb is a tool to automatically sign git commits, replacing gpg for that purpose
x:
  source: https://github.com/withoutboats/bpb
rule:
  /cargo:
    cmd: cargo install bpb
    reference: https://github.com/withoutboats/bpb?tab=readme-ov-file#how-to-install
    dsnap: bpb
binlist:
- bpb
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
