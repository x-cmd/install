lang: Rust
homepage: https://github.com/clog-tool/clog-cli
license: MIT
desc:
  cn: clog 根据本地 git 元数据自动创建更改日志
  en: clog creates a changelog automatically from your local git metadata
x:
  source: https://github.com/clog-tool/clog-cli
  eget: https://github.com/clog-tool/clog-cli
rule:
  /eget:
    cmd: x eget clog-tool/clog-cli
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install clog-cli
    reference: https://github.com/clog-tool/clog-cli?tab=readme-ov-file#cargo-install
    dsnap: clog-cli
  arch/yay:
    cmd: yay -S clog-bin
    reference: https://aur.archlinux.org/packages/clog-bin
binlist:
- clog-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
