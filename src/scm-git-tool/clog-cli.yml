lang: Rust
homepage: https://github.com/clog-tool/clog-cli
license: MIT
desc:
  cn: clog 根据本地 git 元数据自动创建更改日志
  en: clog creates a changelog automatically from your local git metadata
x:
  source: https://github.com/clog-tool/clog-cli
  eget: https://github.com/clog-tool/clog-cli
  yay: clog-bin
  cargo: clog-cli
rule:
  /eget:
    cmd: x eget clog-tool/clog-cli
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install clog-cli
    reference: https://github.com/clog-tool/clog-cli?tab=readme-ov-file#cargo-install
    dsnap: clog-cli
  arch/yay:
    cmd: yay -S clog-bin
    reference: https://aur.archlinux.org/packages/clog-bin
binlist:
- clog-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
