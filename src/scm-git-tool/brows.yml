lang: Go
homepage: https://github.com/rubysolo/brows
license: MIT
desc:
  cn: 一个用于在终端中浏览 GitHub releases 的命令行工具
  en: A GitHub releases browser for the terminal
x:
  source: https://github.com/rubysolo/brows
  eget: https://github.com/rubysolo/brows
rule:
  /eget:
    cmd: x eget rubysolo/brows
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install rubysolo/tools/brows
    reference: https://github.com/rubysolo/brows#installation
  linux/brew:
    cmd: brew install rubysolo/tools/brows
    reference: https://github.com/rubysolo/brows#installation
binlist:
- brows
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true   # GitHub API
    filesystem:
      read:
        desc:
          cn: 读取 GitHub/GitLab 用户和仓库数据
          en: Reads GitHub/GitLab user and repo data
        sensitive:
          - "$HOME/.config/gh/hosts.yml"
          - "$HOME/.netrc"
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 安装 ~20 MB
            en: ~20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: ~20 MB
          en: ~20 MB
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 列出大量仓库时短暂占用
          en: Brief spike when listing many repos
