lang: Go
homepage: https://github.com/rubysolo/brows
license: MIT
desc:
  cn: 一个用于在终端中浏览 GitHub releases 的命令行工具
  en: A GitHub releases browser for the terminal
  cs: Prohlížeč GitHub releases pro terminál
  de: Ein GitHub-Releases-Browser für das Terminal
  es: Un navegador de releases de GitHub para el terminal
  fr: Un navigateur de versions GitHub pour le terminal
  id: Peramban rilis GitHub untuk terminal
  it: Un browser delle release di GitHub per il terminale
  ja: ターミナル用の GitHub リリースブラウザ
  ko: 터미널용 GitHub 릴리스 브라우저
  pl: Przeglądarka wydań GitHub dla terminala
  pt: Um navegador de lançamentos do GitHub para o terminal
  ro: Un browser de versiuni GitHub pentru terminal
  ru: Браузер релизов GitHub для терминала
  th: เบราว์เซอร์รีลีส GitHub สำหรับเทอร์มินัล
  tr: Terminal için bir GitHub sürüm tarayıcısı
  uk: Браузер релізів GitHub для термінала
  vi: Trình duyệt bản phát hành GitHub cho terminal
x:
  source: https://github.com/rubysolo/brows
  eget: rubysolo/brows
  brew: rubysolo/tools/brows
rule:
  /eget:
    cmd: x eget rubysolo/brows
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install rubysolo/tools/brows
    reference: https://github.com/rubysolo/brows#installation
  linux/brew:
    cmd: brew install rubysolo/tools/brows
    reference: https://github.com/rubysolo/brows#installation
binlist:
- brows
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # GitHub API
    filesystem:
      read:
        desc:
          cn: 读取 GitHub/GitLab 用户和仓库数据
          en: Reads GitHub/GitLab user and repo data
        sensitive:
        - "$HOME/.config/gh/hosts.yml"
        - "$HOME/.netrc"
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 列出大量仓库时短暂占用
          en: Brief spike when listing many repos
  platform:
    win: full
    linux: full
    darwin: full
