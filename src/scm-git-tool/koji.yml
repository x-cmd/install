lang: Rust
homepage: https://github.com/cococonscious/koji
license: MIT
desc:
  cn: 用于创建常规提交的交互式 CLI
  en: An interactive CLI for creating conventional commits
x:
  source: https://github.com/cococonscious/koji
  eget: https://github.com/cococonscious/koji
rule:
  /eget:
    cmd: x eget cococonscious/koji
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sS https://webinstall.dev/koji | bash
    reference: https://github.com/cococonscious/koji?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install --locked koji
    reference: https://github.com/cococonscious/koji?tab=readme-ov-file#installation
    dsnap: koji
  arch/yay:
    cmd: yay -S git-koji-bin
    reference: https://aur.archlinux.org/packages/git-koji-bin
binlist:
- koji

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 105 KB
          rating: 1
          desc:
            cn: 约 105 KB（估算）
            en: ~105 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
