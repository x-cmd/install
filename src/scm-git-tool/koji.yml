lang: Rust
homepage: https://github.com/cococonscious/koji
license: MIT
desc:
  cn: 用于创建常规提交的交互式 CLI
  en: An interactive CLI for creating conventional commits
  cs: Interaktivní CLI pro vytváření konvenčních commitů
  de: Eine interaktive CLI zum Erstellen konventioneller Commits
  es: Una CLI interactiva para crear commits convencionales
  fr: Une CLI interactive pour créer des commits conventionnels
  id: CLI interaktif untuk membuat commit konvensional
  it: Una CLI interattiva per creare commit convenzionali
  ja: conventional commit を作成するための対話型 CLI
  ko: convention commit 생성을 위한 대화형 CLI
  pl: Interaktywne CLI do tworzenia konwencjonalnych commitów
  pt: Uma CLI interativa para criar commits convencionais
  ro: O CLI interactiv pentru crearea commiturilor convenționale
  ru: Интерактивный CLI для создания конвенциональных коммитов
  th: CLI แบบโต้ตอบสำหรับสร้าง conventional commit
  tr: Konvansiyonel commit'ler oluşturmak için etkileşimli CLI
  uk: Інтерактивний CLI для створення конвенційних комітів
  vi: CLI tương tác để tạo commit theo quy ước
x:
  source: https://github.com/cococonscious/koji
  eget: cococonscious/koji
  yay: git-koji-bin
rule:
  /eget:
    cmd: x eget cococonscious/koji
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sS https://webinstall.dev/koji | bash
    reference: https://github.com/cococonscious/koji?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install --locked koji
    reference: https://github.com/cococonscious/koji?tab=readme-ov-file#installation
    dsnap: koji
  arch/yay:
    cmd: yay -S git-koji-bin
    reference: https://aur.archlinux.org/packages/git-koji-bin
binlist:
- koji

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
