lang: Rust
homepage: https://github.com/arxanas/git-branchless
license: Apache-2.0
desc:
  cn: Git-branchless 是一套在各方面增强 Git 的工具
  en: git-branchless is a suite of tools which enhances Git in several ways
  cs: git-branchless je sada nástrojů, které několika způsoby rozšiřují Git
  de: git-branchless ist eine Sammlung von Werkzeugen, die Git auf verschiedene Weise verbessern
  es: git-branchless es un conjunto de herramientas que mejora Git de varias maneras
  fr: git-branchless est une suite d'outils qui améliore Git de plusieurs façons
  id: git-branchless adalah rangkaian alat yang meningkatkan Git dengan berbagai cara
  it: git-branchless è una suite di strumenti che migliora Git in diversi modi
  ja: git-branchlessは、多方面でGitを拡張するツール群です
  ko: git-branchless는 여러 가지 방식으로 Git을 개선하는 도구 모음입니다
  pl: git-branchless to zestaw narzędzi, które na różne sposoby rozszerzają Git
  pt: git-branchless é um conjunto de ferramentas que aprimora o Git de várias formas
  ro: git-branchless este o suită de instrumente care îmbunătățește Git în mai multe moduri
  ru: git-branchless — это набор инструментов, расширяющих Git несколькими способами
  th: git-branchless คือชุดเครื่องมือที่ช่วยเสริมความสามารถของ Git หลายด้าน
  tr: git-branchless, Git'i çeşitli açılardan geliştiren bir araç paketidir
  uk: git-branchless — це набір інструментів, які розширюють Git кількома способами
  vi: git-branchless là bộ công cụ mở rộng Git theo nhiều cách
x:
  source: https://github.com/arxanas/git-branchless
  eget: arxanas/git-branchless
  brew: git-branchless
  scoop: git-branchless
  cargo: git-branchless
rule:
  /eget:
    cmd: x eget arxanas/git-branchless
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install git-branchless
    reference: https://formulae.brew.sh/formula/git-branchless#default
  /cargo:
    cmd: cargo install git-branchless
    reference: https://github.com/arxanas/git-branchless/wiki/Installation#installation
    dsnap: git-branchless
  (win|wsl2)/scoop:
    cmd: x scoop install git-branchless
    reference: https://scoop.sh/#/apps?q=git-branchless
binlist:
- git-branchless

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
