lang: Rust
homepage: https://github.com/convco/convco
license: MIT
desc:
  cn: 传统的提交、更改日志、版本控制、验证
  en: Conventional commits, changelog, versioning, validation
x:
  source: https://github.com/convco/convco
  eget: convco/convco
  brew: convco
  cargo: convco
rule:
  /eget:
    cmd: x eget convco/convco
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install convco
    reference: https://github.com/convco/convco?tab=readme-ov-file#installation
    dsnap: convco
  darwin/brew:
    cmd: brew install convco
    reference: https://convco.github.io/
binlist:
- convco

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
