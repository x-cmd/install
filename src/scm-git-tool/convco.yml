lang: Rust
homepage: https://github.com/convco/convco
license: MIT
desc:
  cn: 传统的提交、更改日志、版本控制、验证
  en: Conventional commits, changelog, versioning, validation
x:
  source: https://github.com/convco/convco
  eget: https://github.com/convco/convco
rule:
  /eget:
    cmd: x eget convco/convco
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install convco
    reference: https://github.com/convco/convco?tab=readme-ov-file#installation
    dsnap: convco
  darwin/brew:
    cmd: brew install convco
    reference: https://convco.github.io/
binlist:
- convco

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
