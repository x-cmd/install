lang: 'Go'
homepage: 'https://github.com/textfuel/lazyjira'
license: 'MIT'
desc:
  cn: lazygit 风格的 Jira 客户端
  en: 'Lazygit but for Jira'
  cs: Lazygit, ale pro Jira
  de: Lazygit, aber für Jira
  es: Lazygit pero para Jira
  fr: Lazygit mais pour Jira
  id: Lazygit tapi untuk Jira
  it: Lazygit ma per Jira
  ja: Jira向けのLazygit
  ko: Jira를 위한 Lazygit
  pl: Lazygit, ale dla Jira
  pt: Lazygit, mas para Jira
  ro: Lazygit, dar pentru Jira
  ru: Lazygit, но для Jira
  th: Lazygit แต่สำหรับ Jira
  tr: Lazygit ama Jira için
  uk: Lazygit, але для Jira
  vi: Lazygit nhưng dành cho Jira
x:
  source: https://github.com/textfuel/lazyjira
  eget: textfuel/lazyjira
rule:
  /eget:
    cmd: x eget textfuel/lazyjira
    reference: https://github.com/textfuel/lazyjira
binlist:
- 'lazyjira'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
