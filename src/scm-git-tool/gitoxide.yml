lang: Rust
homepage: https://github.com/Byron/gitoxide
license: Apache-2.0
desc:
  cn: gitoxide 是用 Rust 编写的 git 实现，用于开发面向未来的应用程序，这些应用程序力求正确性和性能，同时提供令人愉快且不足为奇的开发人员体验
  en: gitoxide is an implementation of git written in Rust for developing future-proof applications which strive for correctness and performance while providing a pleasant and unsurprising developer experience
x:
  source: https://github.com/Byron/gitoxide
rule:
  darwin/brew:
    cmd: brew install gitoxide
    reference: https://formulae.brew.sh/formula/gitoxide#default
  arch/pacman:
    cmd: sudo pacman -S gitoxide
    reference: https://github.com/Byron/gitoxide#download-from-arch-repository
binlist:
- gitoxide

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 约 13 MB（估算）
            en: ~13 MB estimated
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (macos/arm64)
            en: ~11 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: full
