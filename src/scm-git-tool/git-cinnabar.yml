lang: Rust
homepage: https://github.com/glandium/git-cinnabar
license: GPL-2.0
desc:
  cn: Git-cinnabar 是一个与仓库交互的 git 远程助手
  en: Git-cinnabar is a git remote helper to interact with mercurial repositories
  cs: Git-cinnabar je git remote helper pro práci s repozitáři mercurial
  de: Git-cinnabar ist ein git remote helper zur Interaktion mit mercurial-Repositories
  es: Git-cinnabar es un helper remoto de git para interactuar con repositorios de mercurial
  fr: Git-cinnabar est un assistant git distant pour interagir avec les dépôts mercurial
  id: Git-cinnabar adalah remote helper git untuk berinteraksi dengan repositori mercurial
  it: Git-cinnabar è un remote helper git per interagire con i repository mercurial
  ja: Git-cinnabarはmercurialリポジトリと対話するためのgitリモートヘルパーです
  ko: Git-cinnabar는 mercurial 저장소와 상호작용하기 위한 git 원격 헬퍼입니다
  pl: Git-cinnabar to zdalny helper git do pracy z repozytoriami mercurial
  pt: Git-cinnabar é um auxiliar remoto do git para interagir com repositórios do mercurial
  ro: Git-cinnabar este un helper git remote pentru interacțiunea cu depozite mercurial
  ru: Git-cinnabar — это удалённый помощник git для работы с репозиториями mercurial
  th: Git-cinnabar คือ remote helper ของ git สำหรับโต้ตอบกับ repository ของ mercurial
  tr: Git-cinnabar, mercurial depolarıyla etkileşim kurmak için bir git remote helper'dır
  uk: Git-cinnabar — це віддалений помічник git для взаємодії з репозиторіями mercurial
  vi: Git-cinnabar là trợ giúp git từ xa để tương tác với kho mercurial
x:
  source: https://github.com/glandium/git-cinnabar
  eget: glandium/git-cinnabar
  dnf: git-cinnabar
  brew: git-cinnabar
  yay: git-cinnabar-git
  cargo: git-cinnabar
rule:
  /eget:
    cmd: x eget glandium/git-cinnabar
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install git-cinnabar
    reference: https://formulae.brew.sh/formula/git-cinnabar#default
  fedora/dnf:
    cmd: sudo dnf install git-cinnabar
    reference: https://command-not-found.com/git-cinnabar
  /cargo:
    cmd: cargo install git-cinnabar
    reference: https://github.com/glandium/git-cinnabar?tab=readme-ov-file#cargo
    dsnap: git-cinnabar
  arch/yay:
    cmd: yay -S git-cinnabar-git
    reference: https://aur.archlinux.org/packages/git-cinnabar-git
binlist:
- git-cinnabar

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
