lang: Haskell
homepage: https://git-annex.branchable.com/
desc:
  cn: git-annex 是 git 用户命令行界面管理工具
  en: git-annex is a command line interface management tool for git users
rule:
  darwin/brew:
    cmd: brew install git-annex
    reference: https://formulae.brew.sh/formula/git-annex#default
  debian/apt:
    cmd: sudo apt-get install git-annex
    reference: https://command-not-found.com/git-remote-tor-annex
    dsnap: git-annex
  ubuntu/apt:
    cmd: sudo apt-get install git-annex
    reference: https://command-not-found.com/git-remote-tor-annex
    dsnap: git-annex
  arch/pacman:
    cmd: sudo pacman -S git-annex
    reference: https://command-not-found.com/git-remote-tor-annex
  kali/apt:
    cmd: sudo apt-get install git-annex
    reference: https://command-not-found.com/git-remote-tor-annex
    dsnap: git-annex
  fedora/dnf:
    cmd: sudo dnf install git-annex
    reference: https://command-not-found.com/git-remote-tor-annex
    dsnap: git-annex
  raspbian/apt:
    cmd: sudo apt-get install git-annex
    reference: https://command-not-found.com/git-remote-tor-annex
binlist:
- git-annex
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
