lang: 'Go'
homepage: 'https://github.com/dlvhdr/diffnav'
license: 'MIT'
desc:
  cn: 基于 delta 的 git diff 分页器，带 GitHub 风格的文件树
  en: 'A git diff pager based on delta but with a file tree, à la GitHub.'
x:
  source: https://github.com/dlvhdr/diffnav
  eget: https://github.com/dlvhdr/diffnav
rule:
  darwin/brew:
    cmd: 'brew install --cask font-<FONT NAME>-nerd-font'
    reference: https://github.com/dlvhdr/diffnav
  /eget:
    cmd: x eget dlvhdr/diffnav
    reference: https://github.com/dlvhdr/diffnav
binlist:
  - 'diffnav'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
