lang: 'Go'
homepage: 'https://github.com/dlvhdr/diffnav'
license: 'MIT'
desc:
  cn: 基于 delta 的 git diff 分页器，带 GitHub 风格的文件树
  en: 'A git diff pager based on delta but with a file tree, à la GitHub.'
  cs: Paginator git diff založený na delta, ale s file stromem ve stylu GitHubu
  de: Ein git diff Pager auf Basis von delta, aber mit einem Dateibaum im GitHub-Stil
  es: Un paginador de git diff basado en delta pero con un árbol de archivos al estilo de GitHub
  fr: Un pagineur git diff basé sur delta, mais avec une arborescence de fichiers à la GitHub
  id: Pager git diff berbasis delta tetapi dengan pohon berkas ala GitHub
  it: Un pager per git diff basato su delta ma con un albero dei file in stile GitHub
  ja: deltaベースのgit diffページャー、GitHub風のファイルツリー付き
  ko: delta를 기반으로 한 git diff 페이지저, GitHub 스타일 파일 트리 제공
  pl: Paginator git diff oparty na delta, ale z drzewem plików w stylu GitHuba
  pt: Um paginador de git diff baseado no delta, mas com uma árvore de arquivos ao estilo do GitHub
  ro: Un pager pentru git diff bazat pe delta, dar cu un arbore de fișiere în stil GitHub
  ru: Пейджер git diff на основе delta, но с деревом файлов в стиле GitHub
  th: ตัวแบ่งหน้า git diff ที่ใช้ delta แต่มีแผนผังไฟล์แบบ GitHub
  tr: delta tabanlı, GitHub tarzı dosya ağacı içeren bir git diff sayfalayıcı
  uk: Пейджер git diff на основі delta, але з деревом файлів у стилі GitHub
  vi: Bộ phân trang git diff dựa trên delta nhưng có cây thư mục kiểu GitHub
x:
  source: https://github.com/dlvhdr/diffnav
  eget: dlvhdr/diffnav
rule:
  darwin/brew:
    cmd: 'brew install --cask font-<FONT NAME>-nerd-font'
    reference: https://github.com/dlvhdr/diffnav
  /eget:
    cmd: x eget dlvhdr/diffnav
    reference: https://github.com/dlvhdr/diffnav
binlist:
- 'diffnav'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
