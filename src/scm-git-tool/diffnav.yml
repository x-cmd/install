lang: 'Go'
homepage: 'https://github.com/dlvhdr/diffnav'
license: 'MIT'
desc:
  cn: 基于 delta 的 git diff 分页器，带 GitHub 风格的文件树
  en: 'A git diff pager based on delta but with a file tree, à la GitHub.'
x:
  source: https://github.com/dlvhdr/diffnav
  eget: https://github.com/dlvhdr/diffnav
rule:
  darwin/brew:
    cmd: 'brew install --cask font-<FONT NAME>-nerd-font'
    reference: https://github.com/dlvhdr/diffnav
  /eget:
    cmd: x eget dlvhdr/diffnav
    reference: https://github.com/dlvhdr/diffnav
binlist:
- 'diffnav'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
