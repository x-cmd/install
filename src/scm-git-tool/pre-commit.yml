lang: Python
homepage: https://github.com/pre-commit/pre-commit
license: MIT
desc:
  cn: 用于管理和维护多语言预提交挂钩的框架
  en: A framework for managing and maintaining multi-language pre-commit hooks.
  cs: Rámec pro správu a údržbu předcommitových hooků ve více jazycích.
  de: Ein Framework zur Verwaltung und Pflege von Pre-Commit-Hooks in mehreren Sprachen.
  es: Un framework para gestionar y mantener hooks de pre-commit en varios lenguajes.
  fr: Un framework pour gérer et maintenir des hooks pre-commit multilingues.
  id: Framework untuk mengelola dan memelihara hook pre-commit multibahasa.
  it: Un framework per gestire e mantenere hook pre-commit multilingue.
  ja: 多言語のpre-commitフックを管理・保守するためのフレームワーク。
  ko: 다국어 pre-commit 훅을 관리하고 유지하는 프레임워크.
  pl: Framework do zarządzania i utrzymania hooków pre-commit w wielu językach.
  pt: Um framework para gerenciar e manter hooks de pre-commit em várias linguagens.
  ro: Un cadru pentru gestionarea și întreținerea hook-urilor pre-commit în mai multe limbi.
  ru: Фреймворк для управления и поддержки pre-commit хуков на разных языках.
  th: เฟรมเวิร์กสำหรับจัดการและดูแล pre-commit hook แบบหลายภาษา
  tr: Çok dilli pre-commit hook'larını yönetmek ve bakımını yapmak için bir çerçeve.
  uk: Фреймворк для керування та підтримки pre-commit хуків різними мовами.
  vi: Một framework để quản lý và bảo trì các hook pre-commit đa ngôn ngữ.
x:
  source: https://github.com/pre-commit/pre-commit
  eget: pre-commit/pre-commit
  brew: pre-commit
  pip: pre-commit
  asdf: pre-commit
rule:
  /x:
    cmd: x pkg use pre-commit
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget pre-commit/pre-commit
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use pre-commit
    reference: https://github.com/jonathanmorley/asdf-pre-commit
  /pip:
    cmd: pip install pre-commit
    reference: https://pre-commit.com/#installation
    dsnap: pre-commit
  darwin/brew:
    cmd: brew install pre-commit
    reference: https://formulae.brew.sh/formula/pre-commit#default
binlist:
- pre-commit

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 29 KB
          rating: 1
          desc:
            cn: 约 29 KB（估算）
            en: ~29 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
