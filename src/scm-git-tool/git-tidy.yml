lang: Rust
homepage: https://github.com/drewwyatt/git-tidy
license: MIT
desc:
  cn: 整理陈旧的 git 分支
  en: Tidy up stale git branches
x:
  source: https://github.com/drewwyatt/git-tidy
  eget: https://github.com/drewwyatt/git-tidy
rule:
  /eget:
    cmd: x eget drewwyatt/git-tidy
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap drewwyatt/tap \

      && brew install git-tidy

      '
    reference: https://github.com/drewwyatt/git-tidy?tab=readme-ov-file#homebrew
  /cargo:
    cmd: cargo install git-tidy
    reference: https://github.com/drewwyatt/git-tidy?tab=readme-ov-file#cargo
    dsnap: git-tidy
binlist:
- git-tidy

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
