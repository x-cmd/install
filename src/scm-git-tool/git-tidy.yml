lang: Rust
homepage: https://github.com/drewwyatt/git-tidy
license: MIT
desc:
  cn: 整理陈旧的 git 分支
  en: Tidy up stale git branches
  cs: Uklidí zastarované git větve
  de: Räumt veraltete Git-Branches auf
  es: Ordena las ramas de git obsoletas
  fr: Range les branches git obsolètes
  id: Merapikan cabang git yang lama
  it: Riorganizza i rami git obsoleti
  ja: 古い git ブランチを整理する
  ko: 오래된 git 브랜치를 정리합니다
  pl: Porządkuje nieaktualne gałęzie git
  pt: Organiza as ramas git obsoletas
  ro: Curăță ramurile git învechite
  ru: Приводит в порядок устаревшие ветки git
  th: จัดระเบียบสาขา git ที่ล้าสมัย
  tr: Eski git dallarını düzenler
  uk: Прибирає застарілі гілки git
  vi: Dọn dẹp các nhánh git cũ
x:
  source: https://github.com/drewwyatt/git-tidy
  eget: drewwyatt/git-tidy
  brew: drewwyatt/tap/git-tidy
  cargo: git-tidy
rule:
  /eget:
    cmd: x eget drewwyatt/git-tidy
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap drewwyatt/tap \

      && brew install git-tidy

      '
    reference: https://github.com/drewwyatt/git-tidy?tab=readme-ov-file#homebrew
  /cargo:
    cmd: cargo install git-tidy
    reference: https://github.com/drewwyatt/git-tidy?tab=readme-ov-file#cargo
    dsnap: git-tidy
binlist:
- git-tidy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 KB
          rating: 1
          desc:
            cn: 约 10 KB（估算）
            en: ~10 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
