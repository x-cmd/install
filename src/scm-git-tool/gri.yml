lang: 'Python'
homepage: 'https://github.com/pycontribs/gri'
license: 'MIT'
desc:
  cn: Git/Gerrit 审查界面，便于管理来自多服务器的变更请求
  en: 'Git/Gerrit Review Interface helps you manage change requests from multiple servers.'
x:
  source: https://github.com/pycontribs/gri
  eget: https://github.com/pycontribs/gri
rule:
  /eget:
    cmd: x eget pycontribs/gri
    reference: https://github.com/pycontribs/gri
binlist:
  - 'gri'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
