lang: 'Python'
homepage: 'https://github.com/pycontribs/gri'
license: 'MIT'
desc:
  cn: Git/Gerrit 审查界面，便于管理来自多服务器的变更请求
  en: 'Git/Gerrit Review Interface helps you manage change requests from multiple servers.'
x:
  source: https://github.com/pycontribs/gri
  eget: https://github.com/pycontribs/gri
rule:
  /eget:
    cmd: x eget pycontribs/gri
    reference: https://github.com/pycontribs/gri
binlist:
  - 'gri'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
