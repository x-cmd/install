lang: 'Rust'
homepage: https://github.com/Fguedes90/lazycelery
license: 'MIT'
desc:
  cn: 监控和管理 Celery worker 与任务的 TUI，灵感来自 lazydocker 和 lazygit
  en: 'Terminal UI for monitoring and managing Celery workers and tasks, inspired by lazydocker and lazygit'
x:
  source: https://github.com/Fguedes90/lazycelery
  eget: https://github.com/Fguedes90/lazycelery
rule:
  /eget:
    cmd: x eget Fguedes90/lazycelery
    reference: https://github.com/Fguedes90/lazycelery
binlist:
  - 'lazycelery'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
  listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 305 KB
          rating: 1
          desc:
            cn: 约 305 KB（估算）
            en: ~305 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
