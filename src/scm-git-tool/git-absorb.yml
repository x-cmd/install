lang: Rust
homepage: https://github.com/tummychow/git-absorb
license: BSD-3-Clause
desc:
  cn: git absorb 会自动识别哪些提交是可以安全修改的，哪些阶段性更改属于每个提交。然后它将编写修复程序
  en: git absorb will automatically identify which commits are safe to modify, and which staged changes belong to each of those commits. It will then write fixup
x:
  source: https://github.com/tummychow/git-absorb
  eget: tummychow/git-absorb
  apt: git-absorb
  dnf: git-absorb
  brew: git-absorb
  pacman: git-absorb
  cargo: git-absorb
rule:
  /eget:
    cmd: x eget tummychow/git-absorb
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#compiling-from-source
    dsnap: git-absorb
  darwin/brew:
    cmd: brew install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
  arch/pacman:
    cmd: sudo pacman -S git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
  debian/apt:
    cmd: sudo apt install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
    dsnap: git-absorb
  ubuntu/apt:
    cmd: sudo apt install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
    dsnap: git-absorb
  fedora/dnf:
    cmd: sudo dnf install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
    dsnap: git-absorb
binlist:
- git-absorb

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
