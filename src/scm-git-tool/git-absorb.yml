lang: Rust
homepage: https://github.com/tummychow/git-absorb
license: BSD-3-Clause
desc:
  cn: git absorb 会自动识别哪些提交是可以安全修改的，哪些阶段性更改属于每个提交。然后它将编写修复程序
  en: git absorb will automatically identify which commits are safe to modify, and which staged changes belong to each of those commits. It will then write fixup
  cs: git absorb automaticky zjistí, které commity je bezpečné upravovat a které změny ve stagingu patří ke každému z nich, a poté vytvoří fixup commity
  de: git absorb erkennt automatisch, welche Commits sicher geändert werden können und welche gestagten Änderungen zu jedem davon gehören, und schreibt dann Fixup-Commits
  es: git absorb identifica automáticamente qué commits es seguro modificar y qué cambios preparados pertenecen a cada uno de ellos, y luego escribe los commits de corrección
  fr: git absorb identifie automatiquement les commits qu'il est sûr de modifier et les changements indexés qui appartiennent à chacun d'eux, puis écrit les commits de correction
  id: git absorb secara otomatis mengidentifikasi commit mana yang aman untuk dimodifikasi dan perubahan bertahap mana yang milik masing-masing commit, lalu menulis commit fixup
  it: git absorb identifica automaticamente quali commit è sicuro modificare e quali modifiche in stage appartengono a ciascuno di essi, quindi scrive i commit di correzione
  ja: git absorbは安全に修正できるコミットと、それぞれのコミットに属するステージ済みの変更を自動的に識別し、fixupコミットを書き出します
  ko: git absorb는 안전하게 수정할 수 있는 커밋과 각 커밋에 속하는 스테이징된 변경을 자동으로 식별한 뒤 fixup 커밋을 작성합니다
  pl: git absorb automatycznie wykrywa, które commity można bezpiecznie modyfikować i które zmiany w indeksie należą do każdego z nich, a następnie tworzy commity fixup
  pt: git absorb identifica automaticamente quais commits podem ser modificados com segurança e quais alterações preparadas pertencem a cada um deles, e então escreve os commits de correção
  ro: git absorb identifică automat care commituri pot fi modificate în siguranță și care modificări în staging aparțin fiecăruia dintre ele, apoi scrie commiturile de corectare
  ru: git absorb автоматически определяет, какие коммиты безопасно изменять, и какие проиндексированные изменения относятся к каждому из них, а затем создаёт fixup-коммиты
  th: git absorb จะระบุอัตโนมัติว่าคอมมิตใดแก้ไขได้อย่างปลอดภัย และการเปลี่ยนแปลงที่ staged ของแต่ละคอมมิตเป็นของใด จากนั้นจะเขียน commit fixup
  tr: git absorb, hangi commit'lerin güvenle değiştirilebileceğini ve hangi hazırlanmış değişikliklerin her birine ait olduğunu otomatik olarak belirler ve ardından fixup commit'leri yazar
  uk: git absorb автоматично визначає, які коміти можна безпечно змінювати, і які проіндексовані зміни належать кожному з них, а потім створює fixup-коміти
  vi: git absorb tự động nhận diện những commit nào có thể sửa an toàn và những thay đổi đã staged thuộc về từng commit, rồi viết các commit fixup
x:
  source: https://github.com/tummychow/git-absorb
  eget: tummychow/git-absorb
  apt: git-absorb
  dnf: git-absorb
  brew: git-absorb
  pacman: git-absorb
  cargo: git-absorb
rule:
  /eget:
    cmd: x eget tummychow/git-absorb
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#compiling-from-source
    dsnap: git-absorb
  darwin/brew:
    cmd: brew install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
  arch/pacman:
    cmd: sudo pacman -S git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
  debian/apt:
    cmd: sudo apt install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
    dsnap: git-absorb
  ubuntu/apt:
    cmd: sudo apt install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
    dsnap: git-absorb
  fedora/dnf:
    cmd: sudo dnf install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
    dsnap: git-absorb
binlist:
- git-absorb

