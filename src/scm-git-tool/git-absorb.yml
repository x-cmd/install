lang: Rust
homepage: https://github.com/tummychow/git-absorb
license: BSD-3-Clause
desc:
  cn: git absorb 会自动识别哪些提交是可以安全修改的，哪些阶段性更改属于每个提交。然后它将编写修复程序
  en: git absorb will automatically identify which commits are safe to modify, and which staged changes belong to each of those commits. It will then write fixup
x:
  source: https://github.com/tummychow/git-absorb
  eget: https://github.com/tummychow/git-absorb
rule:
  /eget:
    cmd: x eget tummychow/git-absorb
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#compiling-from-source
    dsnap: git-absorb
  darwin/brew:
    cmd: brew install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
  arch/pacman:
    cmd: sudo pacman -S git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
  debian/apt:
    cmd: sudo apt install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
    dsnap: git-absorb
  ubuntu/apt:
    cmd: sudo apt install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
    dsnap: git-absorb
  fedora/dnf:
    cmd: sudo dnf install git-absorb
    reference: https://github.com/tummychow/git-absorb?tab=readme-ov-file#installing
    dsnap: git-absorb
binlist:
- git-absorb

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
