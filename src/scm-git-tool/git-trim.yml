lang: Rust
homepage: https://github.com/foriequal0/git-trim
license: MIT
desc:
  cn: git-trim 是 git fetch --prune 缺少的伴侣，也是 <bash oneliner HERE> 的正确、更安全、更快的替代品
  en: git-trim is a missing companion to the git fetch --prune and a proper, safer, faster alternative to your <bash oneliner HERE>
x:
  source: https://github.com/foriequal0/git-trim
  eget: https://github.com/foriequal0/git-trim
rule:
  /eget:
    cmd: x eget foriequal0/git-trim
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install git-trim
    reference: https://github.com/foriequal0/git-trim?tab=readme-ov-file#installation
    dsnap: git-trim
  darwin/brew:
    cmd: brew install git-trim
    reference: https://formulae.brew.sh/formula/git-trim#default
  arch/yay:
    cmd: yay -S git-trim
    reference: https://aur.archlinux.org/packages/git-trim
binlist:
- git-trim

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
