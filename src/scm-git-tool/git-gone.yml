lang: Rust
homepage: https://crates.io/crates/git-gone
desc:
  cn: 清理提取请求的陈旧 Git 分支
  en: Cleanup stale Git branches of pull requests
rule:
  /cargo:
    cmd: cargo install git-gone
    reference: https://crates.io/crates/git-gone
    dsnap: git-gone
  arch/yay:
    cmd: yay -S git-gone
    reference: https://aur.archlinux.org/packages/git-gone
binlist:
- git-gone
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
