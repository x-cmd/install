lang: Rust
homepage: https://crates.io/crates/git-gone
desc:
  cn: 清理提取请求的陈旧 Git 分支
  en: Cleanup stale Git branches of pull requests
  cs: Vyčistí zastarované Git větve pull requestů
  de: Bereinigt veraltete Git-Branches von Pull Requests
  es: Limpia las ramas Git obsoletas de las pull requests
  fr: Nettoie les branches Git obsolètes des pull requests
  id: Membersihkan cabang Git lama dari pull request
  it: Pulisce i rami Git obsoleti delle pull request
  ja: プルリクエストの古い Git ブランチを整理する
  ko: 풀 리퀘스트의 오래된 Git 브랜치를 정리합니다
  pl: Czyści nieaktualne gałęzie Git z pull requestów
  pt: Limpa branches Git obsoletos de pull requests
  ro: Curăță ramurile Git învechite ale pull requesturilor
  ru: Очищает устаревшие ветки Git из pull request'ов
  th: ล้างสาขา Git ที่ล้าสมัยของ pull request
  tr: Pull request'lerin eskimiş Git dallarını temizler
  uk: Очищає застарілі гілки Git із pull request'ів
  vi: Dọn các nhánh Git cũ của pull request
rule:
  /cargo:
    cmd: cargo install git-gone
    reference: https://crates.io/crates/git-gone
    dsnap: git-gone
  arch/yay:
    cmd: yay -S git-gone
    reference: https://aur.archlinux.org/packages/git-gone

x:
  yay: git-gone
  cargo: git-gone
binlist:
- git-gone
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
