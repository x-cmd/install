lang: 'Rust'
homepage: 'https://github.com/unhappychoice/gitlogue'
license: 'ISC'
desc:
  cn: 终端中的电影感 Git 提交回放工具，将提交历史变成动画故事
  en: 'A cinematic Git commit replay tool for the terminal, turning your Git history into a living, animated story.'
x:
  source: https://github.com/unhappychoice/gitlogue
  eget: unhappychoice/gitlogue
rule:
  /eget:
    cmd: x eget unhappychoice/gitlogue
    reference: https://github.com/unhappychoice/gitlogue
binlist:
  - 'gitlogue'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 480 KB
          rating: 1
          desc:
            cn: 约 480 KB（估算）
            en: ~480 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
