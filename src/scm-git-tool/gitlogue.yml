lang: 'Rust'
homepage: 'https://github.com/unhappychoice/gitlogue'
license: 'ISC'
desc:
  cn: 终端中的电影感 Git 提交回放工具，将提交历史变成动画故事
  en: 'A cinematic Git commit replay tool for the terminal, turning your Git history into a living, animated story.'
x:
  source: https://github.com/unhappychoice/gitlogue
  eget: https://github.com/unhappychoice/gitlogue
rule:
  /eget:
    cmd: x eget unhappychoice/gitlogue
    reference: https://github.com/unhappychoice/gitlogue
binlist:
  - 'gitlogue'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
