lang: Rust
homepage: https://github.com/jj-vcs/jj
license: Apache-2.0
desc:
  cn: 既简单又强大的与 Git 兼容的 VCS
  en: A Git-compatible VCS that is both simple and powerful
  cs: VCS kompatibilní s Git, které je zároveň jednoduché a výkonné
  de: Ein Git-kompatibles VCS, das sowohl einfach als auch leistungsstark ist
  es: Un VCS compatible con Git que es a la vez sencillo y potente
  fr: Un VCS compatible avec Git, à la fois simple et puissant
  id: VCS yang kompatibel dengan Git, sederhana namun kuat
  it: Un VCS compatibile con Git, sia semplice che potente
  ja: 簡素さと強力さを両立した Git 互換の VCS
  ko: 단순하면서도 강력한 Git 호환 VCS
  pl: VCS zgodny z Git, który jest jednocześnie prosty i potężny
  pt: Um VCS compatível com Git que é ao mesmo tempo simples e poderoso
  ro: Un VCS compatibil cu Git, atât simplu, cât și puternic
  ru: Совместимая с Git система контроля версий, которая одновременно проста и мощна
  th: ระบบควบคุมเวอร์ชันที่เข้ากันได้กับ Git ทั้งเรียบง่ายและทรงพลัง
  tr: Hem basit hem de güçlü olan Git uyumlu bir VCS
  uk: Система контролю версій, сумісна з Git, яка є одночасно простою і потужною
  vi: Hệ thống quản lý phiên bản tương thích với Git, vừa đơn giản vừa mạnh mẽ
x:
  source: https://github.com/jj-vcs/jj
  eget: jj-vcs/jj
  brew: jj
  pacman: jujutsu
  scoop: main/jj
  yay: jujutsu-git
rule:
  /x:
    cmd: x pkg use jj
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jj-vcs/jj
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo binstall --strategies crate-meta-data jj-cli
    reference: https://jj-vcs.github.io/jj/latest/install-and-setup/#cargo-binstall
    dsnap: jj-cli
  arch/pacman:
    cmd: sudo pacman -S jujutsu
    reference: https://jj-vcs.github.io/jj/latest/install-and-setup/#arch-linux
  arch/yay:
    cmd: yay -S jujutsu-git
    reference: https://jj-vcs.github.io/jj/latest/install-and-setup/#arch-linux
  darwin/brew:
    cmd: brew install jj
    reference: https://jj-vcs.github.io/jj/latest/install-and-setup/#homebrew
  gentoo/emerge:
    cmd: sudo emerge -av dev-vcs/jj
    reference: https://jj-vcs.github.io/jj/latest/install-and-setup/#gentoo-linux
  (win|wsl2)/scoop:
    cmd: x scoop install main/jj
    reference: https://scoop.sh/#/apps?q=jj&id=c8cb53bd4c375b583d1517ed887b0fae5e92bbb7
binlist:
- jj

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 安装 30 MB
            en: 30 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 19 MB
        desc:
          cn: 19 MB
          en: 19 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
