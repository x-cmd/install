lang: 'Go'
homepage: https://github.com/chmouel/lazyworktree
license: 'Apache-2.0'
desc:
  cn: 终端下便捷的 Git worktree 管理 CLI 和 TUI
  en: 'Easy Git worktree management CLI and TUI for the terminal.'
  cs: Snadné CLI a TUI pro správu Git worktree v terminálu.
  de: Einfache CLI und TUI zur Verwaltung von Git-Worktrees im Terminal.
  es: CLI y TUI sencillos para gestionar worktrees de Git en la terminal.
  fr: CLI et TUI simples pour gérer les worktrees Git dans le terminal.
  id: CLI dan TUI mudah untuk mengelola worktree Git di terminal.
  it: CLI e TUI semplici per gestire i worktree Git nel terminale.
  ja: ターミナルでGitワークツリーを易于管理するCLIとTUI。
  ko: 터미널에서 Git 워크트리를 편리하게 관리하는 CLI와 TUI.
  pl: Prosty CLI i TUI do zarządzania worktree Git w terminalu.
  pt: CLI e TUI simples para gerenciar worktrees do Git no terminal.
  ro: CLI și TUI simple pentru gestionarea worktree-urilor Git în terminal.
  ru: Простой CLI и TUI для управления worktree Git в терминале.
  th: CLI และ TUI ที่ใช้งานง่ายสำหรับจัดการ Git worktree ในเทอร์มินัล
  tr: Terminalde Git worktree yönetimi için kullanışlı CLI ve TUI.
  uk: Зручний CLI та TUI для керування Git worktree у терміналі.
  vi: CLI và TUI dễ dùng để quản lý Git worktree trong terminal.
x:
  source: https://github.com/chmouel/lazyworktree
  eget: chmouel/lazyworktree
rule:
  /eget:
    cmd: x eget chmouel/lazyworktree
    reference: https://github.com/chmouel/lazyworktree
binlist:
- 'lazyworktree'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7.2 MB
          rating: 1
          desc:
            cn: 约 7.2 MB（估算）
            en: ~7.2 MB estimated
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
