lang: 'Go'
homepage: https://github.com/chmouel/lazyworktree
license: 'Apache-2.0'
desc:
  cn: 终端下便捷的 Git worktree 管理 CLI 和 TUI
  en: 'Easy Git worktree management CLI and TUI for the terminal.'
x:
  source: https://github.com/chmouel/lazyworktree
  eget: https://github.com/chmouel/lazyworktree
rule:
  /eget:
    cmd: x eget chmouel/lazyworktree
    reference: https://github.com/chmouel/lazyworktree
binlist:
  - 'lazyworktree'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7.2 MB
          rating: 1
          desc:
            cn: 约 7.2 MB（估算）
            en: ~7.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
