lang: Rust
homepage: https://github.com/reemus-dev/gitnr
license: MIT
desc:
  en: A cross-platform CLI utility to create .gitignore files using templates.
  cn: 一个跨平台 CLI 实用程序，使用模板创建 .gitignore 文件
  cs: Cross-platform CLI utilita pro vytváření souborů .gitignore z šablon.
  de: Ein plattformübergreifendes CLI-Dienstprogramm zum Erstellen von .gitignore-Dateien aus Vorlagen.
  es: Una utilidad CLI multiplataforma para crear archivos .gitignore usando plantillas.
  fr: Un utilitaire CLI multiplateforme pour créer des fichiers .gitignore à partir de modèles.
  id: Utilitas CLI lintas platform untuk membuat berkas .gitignore menggunakan templat.
  it: Un'utilità CLI multipiattaforma per creare file .gitignore usando modelli.
  ja: テンプレートを使って .gitignore ファイルを作成するクロスプラットフォームの CLI ユーティリティ。
  ko: 템플릿을 사용하여 .gitignore 파일을 만드는 크로스 플랫폼 CLI 유틸리티
  pl: Narzędzie CLI działające na różnych platformach, tworzące pliki .gitignore z szablonów.
  pt: Um utilitário CLI multiplataforma para criar arquivos .gitignore usando modelos.
  ro: O utilitar CLI multiplatformă pentru crearea fișierelor .gitignore folosind șabloane.
  ru: Кроссплатформенная CLI-утилита для создания файлов .gitignore по шаблонам.
  th: ยูทิลิตี้ CLI ข้ามแพลตฟอร์มสำหรับสร้างไฟล์ .gitignore จากเทมเพลต
  tr: Şablonları kullanarak .gitignore dosyaları oluşturan platformlar arası bir CLI aracı.
  uk: Кроссплатформна CLI-утиліта для створення файлів .gitignore за шаблонами.
  vi: Tiện ích CLI đa nền tảng để tạo tệp .gitignore bằng các mẫu.
x:
  source: https://github.com/reemus-dev/gitnr
  eget: reemus-dev/gitnr
  yay: gitnr
  cargo: gitnr
rule:
  /eget:
    cmd: x eget reemus-dev/gitnr
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -s https://raw.githubusercontent.com/reemus-dev/gitnr/main/scripts/install.sh | bash -s -- -u
    reference: https://github.com/reemus-dev/gitnr?tab=readme-ov-file#install--update
  win/powershell:
    cmd: x pwsh 'Set-ExecutionPolicy Unrestricted -Scope Process; iex (iwr "https://raw.githubusercontent.com/reemus-dev/gitnr/main/scripts/install.ps1").Content'
    reference: https://github.com/reemus-dev/gitnr?tab=readme-ov-file#windows
  /cargo:
    cmd: cargo install gitnr
    reference: https://github.com/reemus-dev/gitnr?tab=readme-ov-file#cargo
    dsnap: gitnr
  /cargo-binstall:
    cmd: cargo-binstall gitnr
    reference: https://github.com/reemus-dev/gitnr?tab=readme-ov-file#cargo-binstall
  netbsd/pkgin:
    cmd: pkgin install gitnr
    reference: https://github.com/reemus-dev/gitnr?tab=readme-ov-file#netbsd
  arch/yay:
    cmd: yay -S gitnr
    reference: https://aur.archlinux.org/packages/gitnr
binlist:
- gitnr

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
