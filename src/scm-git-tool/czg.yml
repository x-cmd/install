lang: TypeScript
homepage: https://github.com/Zhengqbbb/cz-git
license: MIT
desc:
  cn: 生成标准化 git 提交消息的交互式 CLI
  en: Interactive CLI that generate standardized git commit messages
  cs: Interaktivní CLI, které generuje standardizované zprávy git commitů
  de: Interaktives CLI zum Erzeugen standardisierter Git-Commit-Nachrichten
  es: CLI interactiva que genera mensajes de commit de git estandarizados
  fr: CLI interactive qui génère des messages de commit git standardisés
  id: CLI interaktif yang menghasilkan pesan commit git yang standar
  it: CLI interattiva che genera messaggi di commit git standardizzati
  ja: 標準化されたgitコミットメッセージを生成するインタラクティブCLI
  ko: 표준화된 git 커밋 메시지를 생성하는 대화형 CLI
  pl: Interaktywne CLI generujące standaryzowane wiadomości commitów git
  pt: CLI interativo que gera mensagens de commit do git padronizadas
  ro: CLI interactiv care generează mesaje de commit git standardizate
  ru: Интерактивный CLI для создания стандартизированных сообщений коммитов git
  th: CLI แบบโต้ตอบที่สร้างข้อความ commit ของ git มาตรฐาน
  tr: Standartlaştırılmış git commit mesajları oluşturan etkileşimli CLI
  uk: Інтерактивний CLI для створення стандартизованих повідомлень комітів git
  vi: CLI tương tác tạo thông báo commit git theo tiêu chuẩn
x:
  source: https://github.com/Zhengqbbb/cz-git
  brew: czg
  npm: czg
rule:
  /x:
    cmd: x pkg use czg
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g czg
    reference: https://www.npmjs.com/package/czg#installation
    dsnap: czg
  darwin/brew:
    cmd: brew install czg
    reference: https://formulae.brew.sh/formula/czg#default
binlist:
- czg

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
