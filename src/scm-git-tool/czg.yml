lang: TypeScript
homepage: https://github.com/Zhengqbbb/cz-git
license: MIT
desc:
  cn: 生成标准化 git 提交消息的交互式 CLI
  en: Interactive CLI that generate standardized git commit messages
x:
  pkg:
    exist: true
  source: https://github.com/Zhengqbbb/cz-git
rule:
  /x:
    cmd: x pkg use czg
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g czg
    reference: https://www.npmjs.com/package/czg#installation
    dsnap: czg
  darwin/brew:
    cmd: brew install czg
    reference: https://formulae.brew.sh/formula/czg#default
binlist:
- czg

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
