lang: C
homepage: https://git-scm.com/
desc:
  cn: Git 是一个免费的开源分散式版本控制，旨在以快速高效的方式处理从小到大的各种项目
  en: Git is a free and open source distributed version control system designed to handle everything from small to very large projects with speed and efficiency
rule:
  darwin/brew:
    cmd: brew install git
    reference: https://formulae.brew.sh/formula/git#default
  debian/apt:
    cmd: sudo apt-get install git
    reference: https://command-not-found.com/git
    dsnap: git
  ubuntu/apt:
    cmd: sudo apt-get install git
    reference: https://command-not-found.com/git
    dsnap: git
  alpine/apk:
    cmd: sudo apk add git
    reference: https://command-not-found.com/git
    dsnap: git
  arch/pacman:
    cmd: sudo pacman -S git
    reference: https://command-not-found.com/git
  kali/apt:
    cmd: sudo apt-get install git
    reference: https://command-not-found.com/git
    dsnap: git
  centos/yum:
    cmd: sudo yum install git
    reference: https://command-not-found.com/git
  fedora/dnf:
    cmd: sudo dnf install git
    reference: https://command-not-found.com/git
    dsnap: git
  raspbian/apt:
    cmd: sudo apt-get install git
    reference: https://command-not-found.com/git
  gentoo/emerge:
    cmd: sudo emerge --ask --verbose dev-vcs/git
    reference: https://git-scm.com/download/linux
  opensuse/zypper:
    cmd: sudo zypper install git
    reference: https://git-scm.com/download/linux
  opensuse-tumbleweed/zypper:
    cmd: sudo zypper install git-core
    reference: https://git-scm.com/download/linux
  mageia/urpmi:
    cmd: sudo urpmi git
    reference: https://git-scm.com/download/linux
  nix/nixpkgs:
    cmd: nix-env -i git
    reference: https://git-scm.com/download/linux
  freebsd/pkg:
    cmd: pkg install git
    reference: https://git-scm.com/download/linux
  opencsw/pkgutil:
    cmd: pkgutil -i git
    reference: https://git-scm.com/download/linux
  solaris/pkg:
    cmd: pkg install developer/versioning/git
    reference: https://git-scm.com/download/linux
  openbsd/pkg_add:
    cmd: pkg_add git
    reference: https://git-scm.com/download/linux
  slitaz/tazpkg:
    cmd: tazpkg get-install git
    reference: https://git-scm.com/download/linux
binlist:
- git
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
