lang: 'TypeScript'
homepage: 'https://github.com/remorses/critique'
license: 'MIT'
desc:
  cn: 用于审查 git 改动的 TUI
  en: 'TUI for reviewing git changes'
x:
  source: https://github.com/remorses/critique
  eget: https://github.com/remorses/critique
rule:
  /eget:
    cmd: x eget remorses/critique
    reference: https://github.com/remorses/critique
binlist:
  - 'critique'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 36 KB
          rating: 1
          desc:
            cn: 约 36 KB（估算）
            en: ~36 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
