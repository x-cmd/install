lang: 'TypeScript'
homepage: 'https://github.com/remorses/critique'
license: 'MIT'
desc:
  cn: 用于审查 git 改动的 TUI
  en: 'TUI for reviewing git changes'
x:
  source: https://github.com/remorses/critique
  eget: https://github.com/remorses/critique
rule:
  /eget:
    cmd: x eget remorses/critique
    reference: https://github.com/remorses/critique
binlist:
  - 'critique'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
