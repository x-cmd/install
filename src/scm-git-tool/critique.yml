lang: 'TypeScript'
homepage: 'https://github.com/remorses/critique'
license: 'MIT'
desc:
  cn: 用于审查 git 改动的 TUI
  en: 'TUI for reviewing git changes'
  cs: TUI pro kontrolu git změn
  de: TUI zum Prüfen von git-Änderungen
  es: TUI para revisar cambios en git
  fr: Une TUI pour examiner les modifications git
  id: TUI untuk meninjau perubahan git
  it: TUI per rivedere le modifiche git
  ja: git の変更をレビューするための TUI
  ko: git 변경 사항을 검토하기 위한 TUI
  pl: TUI do przeglądania zmian git
  pt: TUI para revisar alterações do git
  ro: TUI pentru revizuirea modificărilor git
  ru: TUI для просмотра изменений git
  th: TUI สำหรับตรวจทานการเปลี่ยนแปลงของ git
  tr: Git değişikliklerini incelemek için TUI
  uk: TUI для перегляду змін git
  vi: Giao diện TUI để xem lại các thay đổi git
x:
  source: https://github.com/remorses/critique
  eget: remorses/critique
rule:
  /eget:
    cmd: x eget remorses/critique
    reference: https://github.com/remorses/critique
binlist:
  - 'critique'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 36 KB
          rating: 1
          desc:
            cn: 约 36 KB（估算）
            en: ~36 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
