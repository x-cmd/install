lang: Rust
homepage: https://github.com/newdee/git-commit-helper
license: MIT
desc:
  cn: 使用人工智能自动生成并提交 Git 消息
  en: Auto generate && commit git messages with AI
  cs: Automaticky generovat a commitovat zprávy git s pomocí AI
  de: Git-Nachrichten mit KI automatisch generieren und committen
  es: Genera y confirma automáticamente mensajes de git con IA
  fr: Générer et valider automatiquement des messages git grâce à l'IA
  id: Otomatis membuat dan melakukan commit pada pesan git dengan AI
  it: Genera e committa automaticamente i messaggi git con l'AI
  ja: AIを使ってgitメッセージを自動生成・コミットします
  ko: AI로 git 메시지를 자동 생성하고 커밋합니다
  pl: Automatyczne generowanie i commitowanie wiadomości git przy użyciu AI
  pt: Gere e faz commit de mensagens do git automaticamente com IA
  ro: Generează și face commit automat mesajelor git cu AI
  ru: Автоматически создаёт и коммитит сообщения git с помощью ИИ
  th: สร้างและ commit ข้อความ git โดยอัตโนมัติด้วย AI
  tr: Yapay zeka ile git mesajlarını otomatik olarak oluşturur ve commit'ler
  uk: Автоматично створює та комітить повідомлення git за допомогою ШІ
  vi: Tự động tạo và commit thông báo git bằng AI
x:
  source: https://github.com/newdee/git-commit-helper
  eget: newdee/git-commit-helper
  yay: git-commit-helper
  cargo: git-commit-helper
rule:
  /eget:
    cmd: x eget newdee/git-commit-helper
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install git-commit-helper
    reference: https://github.com/newdee/git-commit-helper?tab=readme-ov-file#install
    dsnap: git-commit-helper
  arch/yay:
    cmd: yay -S git-commit-helper
    reference: https://aur.archlinux.org/packages/git-commit-helper
binlist:
- git-commit-helper

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
