lang: Rust
homepage: https://github.com/newdee/git-commit-helper
license: MIT
desc:
  cn: 使用人工智能自动生成并提交 Git 消息
  en: Auto generate && commit git messages with AI
x:
  source: https://github.com/newdee/git-commit-helper
  eget: https://github.com/newdee/git-commit-helper
rule:
  /eget:
    cmd: x eget newdee/git-commit-helper
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install git-commit-helper
    reference: https://github.com/newdee/git-commit-helper?tab=readme-ov-file#install
    dsnap: git-commit-helper
  arch/yay:
    cmd: yay -S git-commit-helper
    reference: https://aur.archlinux.org/packages/git-commit-helper
binlist:
- git-commit-helper

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
