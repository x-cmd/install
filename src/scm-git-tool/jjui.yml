lang: 'Go'
homepage: https://github.com/idursun/jjui
license: 'MIT'
desc:
  cn: 面向 Jujutsu 版本控制系统的 TUI
  en: 'jjui is a TUI designed for interacting with the Jujutsu version control system.'
x:
  source: https://github.com/idursun/jjui
  eget: https://github.com/idursun/jjui
rule:
  /eget:
    cmd: x eget idursun/jjui
    reference: https://github.com/idursun/jjui
binlist:
  - 'jjui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
