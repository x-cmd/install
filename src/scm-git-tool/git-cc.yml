lang: Go
homepage: https://github.com/SKalt/git-cc
desc:
  en: a git extension to help write conventional commits
  cn: 帮助编写常规提交的 git 扩展
  cs: git rozšíření, které pomáhá psát konvenční commity
  de: Eine git-Erweiterung zum Schreiben konventioneller Commits
  es: Una extensión de git para ayudar a escribir commits convencionales
  fr: Une extension git qui facilite l'écriture de commits conventionnels
  id: Ekstensi git untuk membantu menulis commit konvensional
  it: Un'estensione di git che aiuta a scrivere commit convenzionali
  ja: 慣習的なコミットの作成を支援するgit拡張機能
  ko: 규약 커밋 작성을 도와주는 git 확장
  pl: Rozszerzenie git ułatwiające pisanie konwencjonalnych commitów
  pt: Uma extensão do git para ajudar a escrever commits convencionais
  ro: O extensie git care ajută la scrierea commiturilor convenționale
  ru: Расширение для git, помогающее писать конвенциональные коммиты
  th: ส่วนขยายของ git ที่ช่วยเขียน commit ตามแบบแผน
  tr: Geleneksel commit'ler yazmaya yardımcı olan bir git eklentisi
  uk: Розширення git, що допомагає писати конвенційні коміти
  vi: Tiện ích mở rộng git giúp viết commit theo quy ước
x:
  source: https://github.com/SKalt/git-cc
  eget: SKalt/git-cc
  brew: skalt/git-cc/git-cc
  yay: git-cc
rule:
  /eget:
    cmd: x eget SKalt/git-cc
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap skalt/git-cc

      brew install git-cc

      '
    reference: https://github.com/SKalt/git-cc?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S git-cc
    reference: https://aur.archlinux.org/packages/git-cc
binlist:
- git-cc
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
