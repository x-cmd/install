lang: Go
homepage: https://github.com/SKalt/git-cc
desc:
  en: a git extension to help write conventional commits
  cn: 帮助编写常规提交的 git 扩展
x:
  source: https://github.com/SKalt/git-cc
  eget: https://github.com/SKalt/git-cc
rule:
  /eget:
    cmd: x eget SKalt/git-cc
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap skalt/git-cc

      brew install git-cc

      '
    reference: https://github.com/SKalt/git-cc?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S git-cc
    reference: https://aur.archlinux.org/packages/git-cc
binlist:
- git-cc
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 254 KB
          rating: 1
          desc:
            cn: 约 254 KB（估算）
            en: ~254 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
