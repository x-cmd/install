lang: Python
homepage: https://github.com/stefanha/git-publish
license: MIT
desc:
  cn: 准备和存储修订补丁作为 git 标记
  en: Prepare and store patch revisions as git tags
x:
  source: https://github.com/stefanha/git-publish
rule:
  debian/apt:
    cmd: sudo apt-get install git-publish
    reference: https://command-not-found.com/git-publish
    dsnap: git-publish
  ubuntu/apt:
    cmd: sudo apt-get install git-publish
    reference: https://command-not-found.com/git-publish
    dsnap: git-publish
  kali/apt:
    cmd: sudo apt-get install git-publish
    reference: https://command-not-found.com/git-publish
    dsnap: git-publish
  fedora/dnf:
    cmd: sudo dnf install git
    reference: https://command-not-found.com/git-publish
  centos/yum:
    cmd: sudo yum install git-publish
    reference: https://github.com/stefanha/git-publish?tab=readme-ov-file#packages
  rhel/yum:
    cmd: sudo yum install git-publish
    reference: https://github.com/stefanha/git-publish?tab=readme-ov-file#packages
  arch/yay:
    cmd: yay -S git-publish
    reference: https://aur.archlinux.org/packages/git-publish
binlist:
- git-publish

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
