lang: Python
homepage: https://github.com/stefanha/git-publish
license: MIT
desc:
  cn: 准备和存储修订补丁作为 git 标记
  en: Prepare and store patch revisions as git tags
x:
  source: https://github.com/stefanha/git-publish
  apt: git-publish
  dnf: git
  apt-get: git-publish
  yum: git-publish
  yay: git-publish
rule:
  debian/apt:
    cmd: sudo apt-get install git-publish
    reference: https://command-not-found.com/git-publish
    dsnap: git-publish
  ubuntu/apt:
    cmd: sudo apt-get install git-publish
    reference: https://command-not-found.com/git-publish
    dsnap: git-publish
  kali/apt:
    cmd: sudo apt-get install git-publish
    reference: https://command-not-found.com/git-publish
    dsnap: git-publish
  fedora/dnf:
    cmd: sudo dnf install git
    reference: https://command-not-found.com/git-publish
  centos/yum:
    cmd: sudo yum install git-publish
    reference: https://github.com/stefanha/git-publish?tab=readme-ov-file#packages
  rhel/yum:
    cmd: sudo yum install git-publish
    reference: https://github.com/stefanha/git-publish?tab=readme-ov-file#packages
  arch/yay:
    cmd: yay -S git-publish
    reference: https://aur.archlinux.org/packages/git-publish
binlist:
- git-publish

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
