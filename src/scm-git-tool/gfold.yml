lang: Rust
homepage: https://github.com/nickgerace/gfold
license: Apache-2.0
desc:
  cn: 用于跟踪目录中多个 Git 存储库的命令行工具。
  en: A CLI tool that helps you keep track of multiple Git repositories.
x:
  source: https://github.com/nickgerace/gfold
  eget: https://github.com/nickgerace/gfold
rule:
  /eget:
    cmd: x eget nickgerace/gfold
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: sudo pacman -S gfold
    reference: https://github.com/nickgerace/gfold#installation
  alpine/apk:
    cmd: apk add gfold
    reference: https://github.com/nickgerace/gfold#installation
  nix/nix-env:
    cmd: nix-env --install gfold
    reference: https://github.com/nickgerace/gfold#nix-and-nixos
  darwin/brew:
    cmd: brew install gfold
    reference: https://github.com/nickgerace/gfold#installation
  darwin/port:
    cmd: sudo port install gfold
    reference: https://github.com/nickgerace/gfold#installation
  freebsd/pkg:
    cmd: pkg install devel/gfold
    reference: https://github.com/nickgerace/gfold#installation
  /cargo:
    cmd: cargo install gfold
    reference: https://github.com/nickgerace/gfold#installation
    dsnap: gfold
binlist:
- gfold

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
