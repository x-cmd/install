lang: Rust
homepage: https://github.com/rustworkshop/gitopolis
license: AGPL-3.0
desc:
  cn: 轻松管理多个 GIT 存储库
  en: Manage multiple git repositories with ease
x:
  source: https://github.com/rustworkshop/gitopolis
  eget: rustworkshop/gitopolis
  yay: gitopolis
rule:
  /eget:
    cmd: x eget rustworkshop/gitopolis
    reference: https://x-cmd.com/mod/eget
  linux/curl:
    cmd: curl https://github.com/rustworkshop/gitopolis/releases/download/v1.3.1/gitopolis-linux-x86_64.tar.gz
    reference: https://github.com/rustworkshop/gitopolis/releases/tag/v1.3.1
  win/curl:
    cmd: curl https://github.com/rustworkshop/gitopolis/releases/download/v1.3.1/gitopolis-windows-x86_64.zip
    reference: https://github.com/rustworkshop/gitopolis/releases/tag/v1.3.1
  arch/yay:
    cmd: yay -S gitopolis
    reference: https://aur.archlinux.org/packages/gitopolis
binlist:
- gitopolis

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 151 KB
          rating: 1
          desc:
            cn: 约 151 KB（估算）
            en: ~151 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
