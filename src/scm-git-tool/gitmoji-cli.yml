lang: JavaScript
homepage: https://github.com/carloscuesta/gitmoji-cli
license: MIT
desc:
  cn: gitmoji 交互式命令行工具，用于在提交时使用表情符号。
  en: A gitmoji client for using emojis on commit messages
  cs: gitmoji klient pro používání emoji ve zprávách commitů
  de: Ein gitmoji-Client zur Verwendung von Emojis in Commit-Nachrichten
  es: Un cliente de gitmoji para usar emojis en los mensajes de commit
  fr: Un client gitmoji pour utiliser des emojis dans les messages de commit
  id: Klien gitmoji untuk menggunakan emoji pada pesan commit
  it: Un client gitmoji per usare le emoji nei messaggi di commit
  ja: コミットメッセージで絵文字を使うための gitmoji クライアント
  ko: 커밋 메시지에서 이모지를 사용하기 위한 gitmoji 클라이언트
  pl: Klient gitmoji do używania emoji w komunikatach commitów
  pt: Um cliente gitmoji para usar emojis nas mensagens de commit
  ro: Un client gitmoji pentru folosirea emoji-urilor în mesajele de commit
  ru: Клиент gitmoji для использования эмодзи в сообщениях коммитов
  th: ไคลเอนต์ gitmoji สำหรับใช้อีโมจิในข้อความคอมมิต
  tr: Commit mesajlarında emoji kullanmak için bir gitmoji istemcisi
  uk: Клієнт gitmoji для використання емодзі у повідомленнях комітів
  vi: Client gitmoji để dùng emoji trong thông điệp commit
x:
  source: https://github.com/carloscuesta/gitmoji-cli
  eget: carloscuesta/gitmoji-cli
  brew: gitmoji
  yay: nodejs-gitmoji-cli
rule:
  /eget:
    cmd: x eget carloscuesta/gitmoji-cli
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm i -g gitmoji-cli
    reference: https://github.com/carloscuesta/gitmoji-cli?tab=readme-ov-file#npm
    dsnap: gitmoji-cli
  darwin/brew:
    cmd: brew install gitmoji
    reference: https://github.com/carloscuesta/gitmoji-cli?tab=readme-ov-file#brew
  arch/yay:
    cmd: yay -S nodejs-gitmoji-cli
    reference: https://aur.archlinux.org/packages/nodejs-gitmoji-cli
binlist:
- gitmoji-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 71 MB
          rating: 3
          desc:
            cn: 安装 71 MB
            en: 71 MB install
        download:
          estimate: 71 MB
          desc:
            cn: 约 71 MB 下载 (linux/arm64)
            en: ~71 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
