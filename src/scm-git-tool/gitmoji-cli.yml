lang: JavaScript
homepage: https://github.com/carloscuesta/gitmoji-cli
license: MIT
desc:
  cn: gitmoji 交互式命令行工具，用于在提交时使用表情符号。
  en: A gitmoji client for using emojis on commit messages
x:
  source: https://github.com/carloscuesta/gitmoji-cli
  eget: https://github.com/carloscuesta/gitmoji-cli
rule:
  /eget:
    cmd: x eget carloscuesta/gitmoji-cli
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm i -g gitmoji-cli
    reference: https://github.com/carloscuesta/gitmoji-cli?tab=readme-ov-file#npm
    dsnap: gitmoji-cli
  darwin/brew:
    cmd: brew install gitmoji
    reference: https://github.com/carloscuesta/gitmoji-cli?tab=readme-ov-file#brew
  arch/yay:
    cmd: yay -S nodejs-gitmoji-cli
    reference: https://aur.archlinux.org/packages/nodejs-gitmoji-cli
binlist:
- gitmoji-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
        download:
          estimate: 71 MB
          desc:
            cn: 约 71 MB 下载 (linux/arm64)
            en: ~71 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
