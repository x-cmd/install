lang: Go
homepage: https://github.com/rgburke/grv
license: GPL-3.0
desc:
  cn: GRV 是一个基于终端的界面，用于查看 Git 仓库。
  en: GRV is a terminal based interface for viewing Git repositories.
x:
  source: https://github.com/rgburke/grv
  eget: https://github.com/rgburke/grv
rule:
  /eget:
    cmd: x eget rgburke/grv
    reference: https://x-cmd.com/mod/eget
  /wget:
    cmd: 'wget -O grv https://github.com/rgburke/grv/releases/download/v0.3.2/grv_v0.3.2_linux64 && \

      chmod +x ./grv && \

      ./grv -repoFilePath /path/to/repo

      '
    reference: https://github.com/rgburke/grv?tab=readme-ov-file#linux
  darwin/brew:
    cmd: brew install grv
    reference: https://github.com/rgburke/grv?tab=readme-ov-file#mac
  freebsd/pkg:
    cmd: pkg install grv
    reference: https://github.com/rgburke/grv?tab=readme-ov-file#freebsd
  arch/yay:
    cmd: yay -S grv
    reference: https://aur.archlinux.org/packages/grv
binlist:
- grv

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.3 MB
          rating: 1
          desc:
            cn: 约 2.3 MB（估算）
            en: ~2.3 MB estimated
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
