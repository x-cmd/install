lang: Go
homepage: https://github.com/rgburke/grv
license: GPL-3.0
desc:
  cn: GRV 是一个基于终端的界面，用于查看 Git 仓库。
  en: GRV is a terminal based interface for viewing Git repositories.
  cs: GRV je rozhraní založené na terminálu pro prohlížení Git repozitářů.
  de: GRV ist eine terminalbasierte Benutzeroberfläche zum Anzeigen von Git-Repositorys.
  es: GRV es una interfaz basada en terminal para ver repositorios de Git.
  fr: GRV est une interface basée sur le terminal pour consulter les dépôts Git.
  id: GRV adalah antarmuka berbasis terminal untuk melihat repositori Git.
  it: GRV è un'interfaccia basata sul terminale per visualizzare i repository Git.
  ja: GRV は Git リポジトリを表示するための端末ベースのインターフェースです。
  ko: GRV는 Git 저장소를 확인하기 위한 터미널 기반 인터페이스입니다.
  pl: GRV to oparte na terminalu interfejs do przeglądania repozytoriów Git.
  pt: O GRV é uma interface baseada em terminal para visualizar repositórios Git.
  ro: GRV este o interfață bazată pe terminal pentru vizualizarea depozitelor Git.
  ru: GRV — это интерфейс на основе терминала для просмотра репозиториев Git.
  th: GRV คือส่วนติดต่อผู้ใช้บนพื้นฐานเทอร์มินัลสำหรับดูที่เก็บข้อมูล Git
  tr: GRV, Git depolarını görüntülemek için terminal tabanlı bir arayüzdür.
  uk: GRV — це інтерфейс на основі терміналу для перегляду репозиторіїв Git.
  vi: GRV là giao diện dựa trên terminal để xem các kho lưu trữ Git
x:
  source: https://github.com/rgburke/grv
  eget: rgburke/grv
  brew: grv
  yay: grv
rule:
  /eget:
    cmd: x eget rgburke/grv
    reference: https://x-cmd.com/mod/eget
  /wget:
    cmd: 'wget -O grv https://github.com/rgburke/grv/releases/download/v0.3.2/grv_v0.3.2_linux64 && \

      chmod +x ./grv && \

      ./grv -repoFilePath /path/to/repo

      '
    reference: https://github.com/rgburke/grv?tab=readme-ov-file#linux
  darwin/brew:
    cmd: brew install grv
    reference: https://github.com/rgburke/grv?tab=readme-ov-file#mac
  freebsd/pkg:
    cmd: pkg install grv
    reference: https://github.com/rgburke/grv?tab=readme-ov-file#freebsd
  arch/yay:
    cmd: yay -S grv
    reference: https://aur.archlinux.org/packages/grv
binlist:
- grv

# complicated
