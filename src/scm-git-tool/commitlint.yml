homepage: https://github.com/conventional-changelog/commitlint
license: MIT
lang: JavaScript
desc:
  cn: 校验 git commit 提交信息
  en: Lint your git commit messages
x:
  source: https://github.com/conventional-changelog/commitlint
  brew: commitlint
rule:
  /x:
    cmd: x pkg use commitlint
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install commitlint
    reference: https://formulae.brew.sh/formula/commitlint#default
  win/npm:
    cmd: npm install --save-dev @commitlint/config-conventional @commitlint/cli
    reference: https://commitlint.js.org/#/guides-local-setup?id=install-commitlint
binlist:
- commitlint

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 KB
          rating: 1
          desc:
            cn: 约 23 KB（估算）
            en: ~23 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
