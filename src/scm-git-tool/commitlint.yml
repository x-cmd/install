homepage: https://github.com/conventional-changelog/commitlint
license: MIT
lang: JavaScript
desc:
  cn: 校验 git commit 提交信息
  en: Lint your git commit messages
x:
  pkg:
    exist: true
  source: https://github.com/conventional-changelog/commitlint
rule:
  /x:
    cmd: x pkg use commitlint
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install commitlint
    reference: https://formulae.brew.sh/formula/commitlint#default
  win/npm:
    cmd: npm install --save-dev @commitlint/config-conventional @commitlint/cli
    reference: https://commitlint.js.org/#/guides-local-setup?id=install-commitlint
binlist:
- commitlint

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
