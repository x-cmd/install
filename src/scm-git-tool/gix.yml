lang: Rust
homepage: https://github.com/Byron/gitoxide
license: Apache-2.0
desc:
  cn: 一个惯用、精简、快速和安全的纯 Rust 实现的 Git
  en: An idiomatic, lean, fast & safe pure Rust implementation of Git
x:
  pkg:
    exist: true
  source: https://github.com/Byron/gitoxide
rule:
  /x:
    cmd: x pkg use gix
    reference: https://x-cmd.com/install/
  arch/pacman:
    cmd: sudo pacman -S gitoxide
    reference: https://github.com/Byron/gitoxide?tab=readme-ov-file#download-from-arch-repository
  /cargo:
    cmd: cargo install gitoxide
    reference: https://github.com/Byron/gitoxide?tab=readme-ov-file#from-source-via-cargo
    dsnap: gitoxide
binlist:
- gix

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
