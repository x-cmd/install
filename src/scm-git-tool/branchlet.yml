lang: 'TypeScript'
homepage: https://github.com/raghavpillai/branchlet
license: 'MIT'
desc:
  cn: 简洁的 CLI Git worktree 管理器
  en: 'Branchlet: A simple CLI Git worktree manager'
  cs: "Branchlet: jednoduchý CLI správce git worktree"
  de: "Branchlet: Ein einfacher CLI-Manager für git worktrees"
  es: "Branchlet: un gestor de worktrees de git sencillo basado en CLI"
  fr: "Branchlet : un gestionnaire de worktrees git simple en ligne de commande"
  id: "Branchlet: pengelola worktree git berbasis CLI yang sederhana"
  it: "Branchlet: un semplice gestore di worktree git da CLI"
  ja: "Branchlet: シンプルな CLI Git worktree マネージャー"
  ko: "Branchlet: 심플한 CLI Git worktree 관리자"
  pl: "Branchlet: prosty menedżer git worktree z wiersza poleceń"
  pt: "Branchlet: um gerenciador de worktree do git simples baseado em CLI"
  ro: "Branchlet: un manager simplu de worktree git din linia de comandă"
  ru: "Branchlet: простой CLI-менеджер git worktree"
  th: "Branchlet: เครื่องมือจัดการ Git worktree แบบ CLI ที่เรียบง่าย"
  tr: "Branchlet: basit bir CLI Git worktree yöneticisi"
  uk: "Branchlet: простий CLI-менеджер git worktree"
  vi: "Branchlet: trình quản lý git worktree đơn giản dựa trên CLI"
x:
  source: https://github.com/raghavpillai/branchlet
  eget: raghavpillai/branchlet
rule:
  /eget:
    cmd: x eget raghavpillai/branchlet
    reference: https://github.com/raghavpillai/branchlet
binlist:
  - 'branchlet'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 约 11 KB（估算）
            en: ~11 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
