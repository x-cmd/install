lang: 'TypeScript'
homepage: https://github.com/raghavpillai/branchlet
license: 'MIT'
desc:
  cn: 简洁的 CLI Git worktree 管理器
  en: 'Branchlet: A simple CLI Git worktree manager'
x:
  source: https://github.com/raghavpillai/branchlet
  eget: https://github.com/raghavpillai/branchlet
rule:
  /eget:
    cmd: x eget raghavpillai/branchlet
    reference: https://github.com/raghavpillai/branchlet
binlist:
  - 'branchlet'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 约 11 KB（估算）
            en: ~11 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
