lang: 'Go'
homepage: 'https://github.com/sinclairtarget/git-who'
license: 'MIT'
desc:
  cn: 文件树级别的 git blame
  en: 'Git blame for file trees'
  cs: Git blame pro stromy souborů
  de: Git blame für Dateibäume
  es: Git blame para árboles de archivos
  fr: Git blame pour les arborescences de fichiers
  id: Git blame untuk pohon berkas
  it: Git blame per gli alberi di file
  ja: ファイルツリー向けの Git blame
  ko: 파일 트리를 위한 Git blame
  pl: Git blame dla drzew plików
  pt: Git blame para árvores de arquivos
  ro: Git blame pentru arbori de fișiere
  ru: Git blame для деревьев файлов
  th: Git blame สำหรับแผนผังไฟล์
  tr: Dosya ağaçları için Git blame
  uk: Git blame для дерев файлів
  vi: Git blame cho cây tệp
x:
  source: https://github.com/sinclairtarget/git-who
  eget: sinclairtarget/git-who
rule:
  /eget:
    cmd: x eget sinclairtarget/git-who
    reference: https://github.com/sinclairtarget/git-who
binlist:
- 'git-who'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
