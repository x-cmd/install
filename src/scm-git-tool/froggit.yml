lang: 'Go'
homepage: https://github.com/thewizardshell/froggit
license: 'MIT'
desc:
  cn: 通过可视化反馈和键盘操作简化 Git 工作流
  en: 'Simplify your Git workflow with visual feedback, keyboard-driven controls, and a streamlined experience.'
  cs: Zjednodušte svůj Git workflow pomocí vizuální odezvy, ovládání z klávesnice a zjednodušeného zážitku
  de: Vereinfachen Sie Ihren Git-Workflow mit visueller Rückmeldung, tastaturbasierten Steuerungen und einem reibungslosen Erlebnis
  es: Simplifica tu flujo de trabajo de Git con comentarios visuales, controles basados en teclado y una experiencia fluida
  fr: Simplifiez votre flux de travail Git avec un retour visuel, des commandes au clavier et une expérience fluide
  id: Sederhanakan alur kerja Git Anda dengan umpan balik visual, kontrol berbasis keyboard, dan pengalaman yang ringkas
  it: Semplifica il tuo flusso di lavoro Git con feedback visivo, controlli da tastiera e un'esperienza snellita
  ja: 視覚的なフィードバック、キーボード操作、スマートな体験でGitワークフローを簡素化します
  ko: 시각적 피드백과 키보드 중심 조작, 간결한 경험으로 Git 워크플로를 단순화하세요
  pl: Uprość przepływ pracy w Git dzięki wizualnemu feedbackowi, sterowaniu klawiaturą i dopracowanemu doświadczeniu
  pt: Simplifique seu fluxo de trabalho do Git com retorno visual, controles baseados em teclado e uma experiência simplificada
  ro: Simplificați fluxul de lucru cu Git prin feedback vizual, controale bazate pe tastatură și o experiență fluidă
  ru: Упростите рабочий процесс с Git за счёт визуальной обратной связи, управления с клавиатуры и продуманного опыта
  th: ทำให้เวิร์กโฟลว์ Git ของคุณง่ายขึ้นด้วยข้อมูลย้อนกลับแบบภาพ การควบคุมด้วยคีย์บอร์ด และประสบการณ์ที่ลื่นไหล
  tr: Görsel geri bildirim, klavye kontrolleri ve akıcı bir deneyimle Git iş akışınızı sadeleştirin
  uk: Спростіть робочий процес із Git завдяки візуальному зворотному зв'язку, керуванню з клавіатури та продуманому досвіду
  vi: Đơn giản hóa quy trình Git của bạn với phản hồi trực quan, điều khiển bằng bàn phím và trải nghiệm gọn gàng
x:
  source: https://github.com/thewizardshell/froggit
  eget: thewizardshell/froggit
rule:
  /eget:
    cmd: x eget thewizardshell/froggit
    reference: https://github.com/thewizardshell/froggit
binlist:
- 'froggit'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
