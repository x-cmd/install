lang: 'Go'
homepage: https://github.com/thewizardshell/froggit
license: 'MIT'
desc:
  cn: 通过可视化反馈和键盘操作简化 Git 工作流
  en: 'Simplify your Git workflow with visual feedback, keyboard-driven controls, and a streamlined experience.'
x:
  source: https://github.com/thewizardshell/froggit
  eget: https://github.com/thewizardshell/froggit
rule:
  /eget:
    cmd: x eget thewizardshell/froggit
    reference: https://github.com/thewizardshell/froggit
binlist:
  - 'froggit'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 329 KB
          rating: 1
          desc:
            cn: 约 329 KB（估算）
            en: ~329 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
