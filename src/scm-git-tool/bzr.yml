lang: Python
homepage: https://github.com/breezy-team/breezy
license: GPL-2.0
desc:
  cn: Bazaar (bzr) 是一个分散的修订控制系统，旨在易于开发人员和最终用户
  en: Bazaar (bzr) is a decentralized revision control system, designed to be easy for developers and end users alike
x:
  source: https://github.com/breezy-team/breezy
rule:
  /pip:
    cmd: pip install bzr
    reference: https://pypi.org/project/bzr/
    dsnap: bzr
  darwin/bzr:
    cmd: sudo port install bzr
    reference: https://ports.macports.org/port/bzr/
  debian/apt:
    cmd: sudo apt-get install bzr
    reference: https://command-not-found.com/bzr.bzr
    dsnap: bzr
  ubuntu/apt:
    cmd: sudo apt-get install bzr
    reference: https://command-not-found.com/bzr.bzr
    dsnap: bzr
  alpine/apk:
    cmd: sudo apk add bzr
    reference: https://command-not-found.com/bzr.bzr
    dsnap: bzr
  arch/pacman:
    cmd: sudo pacman -S bzr
    reference: https://command-not-found.com/bzr.bzr
  kali/apt:
    cmd: sudo apt-get install bzr
    reference: https://command-not-found.com/bzr.bzr
    dsnap: bzr
  centos/yum:
    cmd: sudo yum install bzr
    reference: https://command-not-found.com/bzr.bzr
  fedora/dnf:
    cmd: sudo dnf install bzr
    reference: https://command-not-found.com/bzr.bzr
    dsnap: bzr
  raspbian/apt:
    cmd: sudo apt-get install bzr
    reference: https://command-not-found.com/bzr.bzr
binlist:
- bzr

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
