lang: Go
homepage: https://github.com/github/git-sizer
license: MIT
desc:
  cn: 计算 Git 存储库的各种大小指标，标记那些可能导致问题的指标
  en: Compute various size metrics for a Git repository, flagging those that might cause problems
x:
  source: https://github.com/github/git-sizer
  eget: https://github.com/github/git-sizer
rule:
  /eget:
    cmd: x eget github/git-sizer
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install git-sizer
    reference: https://formulae.brew.sh/formula/git-sizer#default
  debian/apt:
    cmd: sudo apt-get install git-sizer
    reference: https://command-not-found.com/git-sizer
  ubuntu/apt:
    cmd: sudo apt-get install git-sizer
    reference: https://command-not-found.com/git-sizer
  kali/apt:
    cmd: sudo apt-get install git-sizer
    reference: https://command-not-found.com/git-sizer
    dsnap: git-sizer
  arch/yay:
    cmd: yay -S git-sizer-git
    reference: https://aur.archlinux.org/packages/git-sizer-git
binlist:
- git-sizer

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.5 MB
          rating: 1
          desc:
            cn: 安装 3.5 MB
            en: 3.5 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
