lang: 'Go'
homepage: 'https://github.com/x-motemen/ghq'
license: 'MIT'
desc:
  cn: 轻松管理远程仓库
  en: 'Remote repository management made easy'
x:
  source: https://github.com/x-motemen/ghq
  eget: https://github.com/x-motemen/ghq
rule:
  /eget:
    cmd: x eget x-motemen/ghq
    reference: https://github.com/x-motemen/ghq
binlist:
  - 'ghq'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 462 KB
          rating: 1
          desc:
            cn: 约 462 KB（估算）
            en: ~462 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
