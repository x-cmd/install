lang: 'Go'
homepage: 'https://github.com/x-motemen/ghq'
license: 'MIT'
desc:
  cn: 轻松管理远程仓库
  en: 'Remote repository management made easy'
x:
  source: https://github.com/x-motemen/ghq
  eget: https://github.com/x-motemen/ghq
rule:
  /eget:
    cmd: x eget x-motemen/ghq
    reference: https://github.com/x-motemen/ghq
binlist:
- 'ghq'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
