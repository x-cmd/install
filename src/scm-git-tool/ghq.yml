lang: 'Go'
homepage: 'https://github.com/x-motemen/ghq'
license: 'MIT'
desc:
  cn: 轻松管理远程仓库
  en: 'Remote repository management made easy'
  cs: Snadná správa vzdálených repozitářů
  de: Einfache Verwaltung von Remote-Repositories
  es: Gestión sencilla de repositorios remotos
  fr: Gestion simplifiée des dépôts distants
  id: Manajemen repositori jarak jauh yang mudah
  it: Gestione semplice dei repository remoti
  ja: リモートリポジトリの管理を簡単にする
  ko: 원격 저장소를 쉽게 관리
  pl: Łatwe zarządzanie zdalnymi repozytoriami
  pt: Gerenciamento de repositórios remotos facilitado
  ro: Managementul ușor al depozitelor remote
  ru: Простое управление удалёнными репозиториями
  th: จัดการ repository ระยะไกลได้อย่างง่ายดาย
  tr: Uzak depo yönetimini kolaylaştırır
  uk: Легке керування віддаленими репозиторіями
  vi: Dễ dàng quản lý kho từ xa
x:
  source: https://github.com/x-motemen/ghq
  eget: x-motemen/ghq
rule:
  /eget:
    cmd: x eget x-motemen/ghq
    reference: https://github.com/x-motemen/ghq
binlist:
- 'ghq'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
