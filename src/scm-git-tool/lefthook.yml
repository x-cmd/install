lang: Go
homepage: https://github.com/evilmartians/lefthook
license: MIT
desc:
  cn: 快速而强大的 Git hooks 管理器适用于任何类型的项目
  en: Fast and powerful Git hooks manager for any type of projects
  cs: Rychlý a výkonný správce Git hooks pro jakýkoli typ projektů
  de: Schneller und leistungsstarker Git-Hooks-Manager für jede Art von Projekten
  es: Gestor de hooks de Git rápido y potente para cualquier tipo de proyecto
  fr: Gestionnaire de hooks Git rapide et puissant pour tout type de projet
  id: Pengelola hook Git yang cepat dan kuat untuk semua jenis proyek
  it: Gestore di hook Git veloce e potente per qualsiasi tipo di progetto
  ja: あらゆる类型的プロジェクトに対応する高速で強力なGitフックマネージャー
  ko: 모든 유형의 프로젝트에 맞는 빠르고 강력한 Git 훅 관리자
  pl: Szybki i potężny menedżer hooków Git dla każdego typu projektów
  pt: Gerenciador de hooks do Git rápido e poderoso para qualquer tipo de projeto
  ro: Manager rapid și puternic de hook-uri Git pentru orice tip de proiect
  ru: Быстрый и мощный менеджер Git-хуков для любых типов проектов
  th: ตัวจัดการ Git hook ที่รวดเร็วและมีประสิทธิภาพสำหรับทุกประเภทโครงการ
  tr: Her türden proje için hızlı ve güçlü Git hook yöneticisi
  uk: Швидкий і потужний менеджер Git-хуків для будь-яких типів проєктів
  vi: Trình quản lý hook Git nhanh và mạnh mẽ cho mọi loại dự án
x:
  source: https://github.com/evilmartians/lefthook
  eget: evilmartians/lefthook
  apt: lefthook
  dnf: lefthook
  brew: lefthook
  yum: lefthook
  scoop: lefthook
  winget: evilmartians.lefthook
  yay: lefthook
  npm: lefthook
  asdf: lefthook
rule:
  /x:
    cmd: x pkg use lefthook
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget evilmartians/lefthook
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use lefthook
    reference: https://github.com/jtzero/asdf-lefthook
  darwin/brew:
    cmd: brew install lefthook
    reference: https://formulae.brew.sh/formula/lefthook#default
  ubuntu/apt:
    cmd: 'curl -1sLf ''https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.deb.sh'' | sudo -E bash \

      && sudo apt install lefthook

      '
    reference: https://formulae.brew.sh/formula/lefthook#default
    dsnap: lefthook
  debian/apt:
    cmd: 'curl -1sLf ''https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.deb.sh'' | sudo -E bash \

      && sudo apt install lefthook

      '
    reference: https://formulae.brew.sh/formula/lefthook#default
    dsnap: lefthook
  fedora/yum:
    cmd: 'curl -1sLf ''https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.rpm.sh'' | sudo -E bash \

      && sudo yum install lefthook

      '
    reference: https://formulae.brew.sh/formula/lefthook#default
  centos/yum:
    cmd: 'curl -1sLf ''https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.rpm.sh'' | sudo -E bash \

      && sudo yum install lefthook

      '
    reference: https://formulae.brew.sh/formula/lefthook#default
  /npm:
    cmd: npm install lefthook --save-dev
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md
    dsnap: lefthook
  /pip:
    cmd: python3 -m pip install --user lefthook
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md
    dsnap: lefthook
  /snap:
    cmd: snap install --classic lefthook
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md
  arch/yay:
    cmd: sudo yay -S lefthook
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md
  (win|wsl2)/scoop:
    cmd: x scoop install lefthook
    reference: https://scoop.sh/#/apps?q=lefthook
  (win|wsl2)/winget:
    cmd: x winget install evilmartians.lefthook
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md#-winget-for-windows
binlist:
- lefthook
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 lefthook.yml, .git/
          en: Reads lefthook.yml, .git/
        sensitive: []
      write:
        desc:
          cn: 安装 git hooks 到 .git/hooks/
          en: Installs git hooks to .git/hooks/
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 安装 14 MB
            en: 14 MB install
        download:
          estimate: 14 MB
          desc:
            cn: 约 14 MB 下载 (linux/x64)
            en: ~14 MB download (linux/x64)
      paths:
        data: []
        config:
        - "lefthook.yml"
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 运行用户配置的 hooks 时短暂占用
          en: Brief spike when running user-configured hooks
  platform:
    win: full
    linux: full
    darwin: full
