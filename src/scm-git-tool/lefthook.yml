lang: Go
homepage: https://github.com/evilmartians/lefthook
license: MIT
desc:
  cn: 快速而强大的 Git hooks 管理器适用于任何类型的项目
  en: Fast and powerful Git hooks manager for any type of projects
x:
  pkg:
    exist: true
  source: https://github.com/evilmartians/lefthook
  eget: https://github.com/evilmartians/lefthook
rule:
  /x:
    cmd: x pkg use lefthook
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget evilmartians/lefthook
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use lefthook
    reference: https://github.com/jtzero/asdf-lefthook
  darwin/brew:
    cmd: brew install lefthook
    reference: https://formulae.brew.sh/formula/lefthook#default
  ubuntu/apt:
    cmd: 'curl -1sLf ''https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.deb.sh'' | sudo -E bash \

      && sudo apt install lefthook

      '
    reference: https://formulae.brew.sh/formula/lefthook#default
    dsnap: lefthook
  debian/apt:
    cmd: 'curl -1sLf ''https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.deb.sh'' | sudo -E bash \

      && sudo apt install lefthook

      '
    reference: https://formulae.brew.sh/formula/lefthook#default
    dsnap: lefthook
  fedora/yum:
    cmd: 'curl -1sLf ''https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.rpm.sh'' | sudo -E bash \

      && sudo yum install lefthook

      '
    reference: https://formulae.brew.sh/formula/lefthook#default
  centos/yum:
    cmd: 'curl -1sLf ''https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.rpm.sh'' | sudo -E bash \

      && sudo yum install lefthook

      '
    reference: https://formulae.brew.sh/formula/lefthook#default
  /npm:
    cmd: npm install lefthook --save-dev
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md
    dsnap: lefthook
  /pip:
    cmd: python3 -m pip install --user lefthook
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md
    dsnap: lefthook
  /snap:
    cmd: snap install --classic lefthook
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md
  arch/yay:
    cmd: sudo yay -S lefthook
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md
  (win|wsl2)/scoop:
    cmd: x scoop install lefthook
    reference: https://scoop.sh/#/apps?q=lefthook
  (win|wsl2)/winget:
    cmd: x winget install evilmartians.lefthook
    reference: https://github.com/evilmartians/lefthook/blob/master/docs/install.md#-winget-for-windows
binlist:
- lefthook
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取 lefthook.yml, .git/
          en: Reads lefthook.yml, .git/
        sensitive: []
      write:
        desc:
          cn: 安装 git hooks 到 .git/hooks/
          en: Installs git hooks to .git/hooks/
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 安装 ~20 MB
            en: ~20 MB install
      paths:
        data: []
        config:
          - "lefthook.yml"
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: ~20 MB
          en: ~20 MB
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 3
        desc:
          cn: 运行用户配置的 hooks 时短暂占用
          en: Brief spike when running user-configured hooks
