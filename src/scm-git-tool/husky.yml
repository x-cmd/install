lang: JavaScript
homepage: https://github.com/typicode/husky
license: MIT
desc:
  cn: Git hooks 管理工具
  en: Git hooks made easy
x:
  source: https://github.com/typicode/husky
rule:
  /npx:
    cmd: npx husky init
    reference: https://github.com/typicode/husky?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S husky
    reference: https://aur.archlinux.org/packages/husky
binlist:
- husky

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
