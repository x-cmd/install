lang: JavaScript
homepage: https://github.com/typicode/husky
license: MIT
desc:
  cn: Git hooks 管理工具
  en: Git hooks made easy
x:
  source: https://github.com/typicode/husky
  yay: husky
rule:
  /npx:
    cmd: npx husky init
    reference: https://github.com/typicode/husky?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S husky
    reference: https://aur.archlinux.org/packages/husky
binlist:
- husky

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
