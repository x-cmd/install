lang: Rust
homepage: https://github.com/cocogitto/cocogitto
license: MIT
desc:
  cn: Cocogitto 是用于常规 Commit 和 Semver 规范的 CLI 和 GitOps 工具箱
  en: Cocogitto is a CLI and GitOps toolbox for the Conventional Commits and Semver specifications
  cs: Cocogitto je CLI a sada nástrojů GitOps pro specifikace Conventional Commits a Semver
  de: Cocogitto ist eine CLI- und GitOps-Toolbox für die Spezifikationen Conventional Commits und Semver
  es: Cocogitto es una caja de herramientas CLI y GitOps para las especificaciones Conventional Commits y Semver
  fr: Cocogitto est une boîte à outils CLI et GitOps pour les spécifications Conventional Commits et Semver
  id: Cocogitto adalah kotak alat CLI dan GitOps untuk spesifikasi Conventional Commits dan Semver
  it: Cocogitto è una toolbox CLI e GitOps per le specifiche Conventional Commits e Semver
  ja: Cocogitto は Conventional Commits 仕様と Semver 仕様に対応した CLI および GitOps ツールボックスです
  ko: Cocogitto는 Conventional Commits 및 Semver 명세를 위한 CLI 및 GitOps 툴박스입니다
  pl: Cocogitto to zestaw narzędzi CLI i GitOps dla specyfikacji Conventional Commits oraz Semver
  pt: Cocogitto é uma caixa de ferramentas CLI e GitOps para as especificações Conventional Commits e Semver
  ro: Cocogitto este o trusă de instrumente CLI și GitOps pentru specificațiile Conventional Commits și Semver
  ru: Cocogitto — набор инструментов CLI и GitOps для спецификаций Conventional Commits и Semver
  th: Cocogitto คือกล่องเครื่องมือ CLI และ GitOps สำหรับข้อกำหนด Conventional Commits และ Semver
  tr: Cocogitto, Conventional Commits ve Semver spesifikasyonları için bir CLI ve GitOps araç kutusudur
  uk: Cocogitto — набір інструментів CLI та GitOps для специфікацій Conventional Commits і Semver
  vi: Cocogitto là bộ công cụ CLI và GitOps cho các đặc tả Conventional Commits và Semver
x:
  source: https://github.com/cocogitto/cocogitto
  eget: cocogitto/cocogitto
  brew: cocogitto
  pacman: cocogitto
  xbps: cocogitto
rule:
  /eget:
    cmd: x eget cocogitto/cocogitto
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install cocogitto
    reference: https://github.com/cocogitto/cocogitto?tab=readme-ov-file#macos
  arch/pacman:
    cmd: sudo pacman -S cocogitto
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#arch-linux
  nix/nix-env:
    cmd: nix-env -iA cocogitto
    reference: https://github.com/cocogitto/cocogitto?tab=readme-ov-file#nixos
  void/xbps:
    cmd: sudo xbps-install cocogitto
    reference: https://github.com/cocogitto/cocogitto?tab=readme-ov-file#void-linux
  /cargo:
    cmd: cargo install --locked cocogitto
    reference: https://github.com/cocogitto/cocogitto?tab=readme-ov-file#cargo
    dsnap: cocogitto
binlist:
- cocogitto

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
