lang: Rust
homepage: https://github.com/cocogitto/cocogitto
license: MIT
desc:
  cn: Cocogitto 是用于常规 Commit 和 Semver 规范的 CLI 和 GitOps 工具箱
  en: Cocogitto is a CLI and GitOps toolbox for the Conventional Commits and Semver specifications
x:
  source: https://github.com/cocogitto/cocogitto
  eget: https://github.com/cocogitto/cocogitto
rule:
  /eget:
    cmd: x eget cocogitto/cocogitto
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install cocogitto
    reference: https://github.com/cocogitto/cocogitto?tab=readme-ov-file#macos
  arch/pacman:
    cmd: sudo pacman -S cocogitto
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#arch-linux
  nix/nix-env:
    cmd: nix-env -iA cocogitto
    reference: https://github.com/cocogitto/cocogitto?tab=readme-ov-file#nixos
  void/xbps:
    cmd: sudo xbps-install cocogitto
    reference: https://github.com/cocogitto/cocogitto?tab=readme-ov-file#void-linux
  /cargo:
    cmd: cargo install --locked cocogitto
    reference: https://github.com/cocogitto/cocogitto?tab=readme-ov-file#cargo
    dsnap: cocogitto
binlist:
- cocogitto

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
