lang: 'Rust'
homepage: 'https://github.com/KernelFreeze/kite-tui'
license: 'MIT'
desc:
  cn: Kagi News 的终端阅读器
  en: 'A terminal reader for Kagi News.'
x:
  source: https://github.com/KernelFreeze/kite-tui
  eget: https://github.com/KernelFreeze/kite-tui
rule:
  /eget:
    cmd: x eget KernelFreeze/kite-tui
    reference: https://github.com/KernelFreeze/kite-tui
binlist:
  - 'kite-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 185 KB
          rating: 1
          desc:
            cn: 约 185 KB（估算）
            en: ~185 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
