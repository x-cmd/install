lang: 'Rust'
homepage: 'https://github.com/KernelFreeze/kite-tui'
license: 'MIT'
desc:
  cn: Kagi News 的终端阅读器
  en: 'A terminal reader for Kagi News.'
  cs: Terminálová čtečka pro Kagi News.
  de: Ein Terminal-Leser für Kagi News.
  es: Un lector de terminal para Kagi News.
  fr: Un lecteur terminal pour Kagi News.
  id: Pembaca terminal untuk Kagi News.
  it: Un lettore da terminale per Kagi News.
  ja: Kagi News 用のターミナルリーダー。
  ko: Kagi News용 터미널 리더.
  pl: Terminalowy czytnik dla Kagi News.
  pt: Um leitor de terminal para o Kagi News.
  ro: Un cititor de terminal pentru Kagi News.
  ru: Терминальная читалка для Kagi News.
  th: โปรแกรมอ่านข่าวแบบเทอร์มินัลสำหรับ Kagi News
  tr: Kagi News için bir terminal okuyucu.
  uk: Термінальний читач для Kagi News.
  vi: Trình đọc terminal cho Kagi News.
x:
  source: https://github.com/KernelFreeze/kite-tui
  eget: KernelFreeze/kite-tui
rule:
  /eget:
    cmd: x eget KernelFreeze/kite-tui
    reference: https://github.com/KernelFreeze/kite-tui
binlist:
- 'kite-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
