lang: 'Go'
homepage: 'https://github.com/chojs23/ec'
license: 'MIT'
desc:
  cn: 类 Vim 工作流的终端原生 git 三方合并工具
  en: 'Easy terminal-native 3-way git mergetool vim-like workflow'
x:
  source: https://github.com/chojs23/ec
  eget: https://github.com/chojs23/ec
rule:
  /eget:
    cmd: x eget chojs23/ec
    reference: https://github.com/chojs23/ec
binlist:
  - 'ec'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
