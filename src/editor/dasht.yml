lang: Shell
homepage: https://github.com/sunaku/dasht
desc:
  cn: dasht 是一组用于搜索、浏览和管理 API 文档的 shell 脚本（提供 200 多个离线文档集，感谢 macOS 上的 Dash），让你可以在终端中轻松访问和使用这些文档。
  en: dasht is a collection of shell scripts for searching, browsing, and managing API documentation (in the form of 200+ offline documentation sets, courtesy of Dash for macOS) all from the comfort of your own terminal!
x:
  source: https://github.com/sunaku/dasht
  brew: dasht
rule:
  arch/yay:
    cmd: yay -S dasht
    reference: https://aur.archlinux.org/packages/dasht
  darwin/brew:
    cmd: brew install dasht
    reference: https://formulae.brew.sh/formula/dasht#default
binlist:
- dasht
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
