lang: 'Rust'
homepage: https://github.com/printfn/fend
license: 'MIT'
desc:
  cn: 支持任意精度与单位换算的计算器
  en: 'Arbitrary-precision unit-aware calculator'
x:
  source: https://github.com/printfn/fend
  eget: https://github.com/printfn/fend
  brew: fend
  cargo: fend'
rule:
  /cargo:
    cmd: 'cargo install fend'
    reference: https://github.com/printfn/fend
  darwin/brew:
    cmd: 'brew install fend'
    reference: https://github.com/printfn/fend
  /eget:
    cmd: x eget printfn/fend
    reference: https://github.com/printfn/fend
binlist:
- 'fend'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
