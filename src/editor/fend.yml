lang: 'Rust'
homepage: https://github.com/printfn/fend
license: 'MIT'
desc:
  cn: 支持任意精度与单位换算的计算器
  en: 'Arbitrary-precision unit-aware calculator'
x:
  source: https://github.com/printfn/fend
  eget: https://github.com/printfn/fend
rule:
  /cargo:
    cmd: 'cargo install fend'
    reference: https://github.com/printfn/fend
  darwin/brew:
    cmd: 'brew install fend'
    reference: https://github.com/printfn/fend
  /eget:
    cmd: x eget printfn/fend
    reference: https://github.com/printfn/fend
binlist:
  - 'fend'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 598 KB
          rating: 1
          desc:
            cn: 约 598 KB（估算）
            en: ~598 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
