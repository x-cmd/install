lang: 'Rust'
homepage: https://github.com/SoptikHa2/desed
license: 'GPL-3.0'
desc:
  cn: sed 脚本调试器，在终端中解析并调试 sed 脚本
  en: 'Debugger for Sed: demystify and debug your sed scripts, from comfort of your terminal.'
x:
  source: https://github.com/SoptikHa2/desed
  eget: https://github.com/SoptikHa2/desed
rule:
  /eget:
    cmd: x eget SoptikHa2/desed
    reference: https://github.com/SoptikHa2/desed
binlist:
  - 'desed'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
