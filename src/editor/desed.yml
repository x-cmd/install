lang: 'Rust'
homepage: https://github.com/SoptikHa2/desed
license: 'GPL-3.0'
desc:
  cn: sed 脚本调试器，在终端中解析并调试 sed 脚本
  en: 'Debugger for Sed: demystify and debug your sed scripts, from comfort of your terminal.'
x:
  source: https://github.com/SoptikHa2/desed
  eget: https://github.com/SoptikHa2/desed
rule:
  /eget:
    cmd: x eget SoptikHa2/desed
    reference: https://github.com/SoptikHa2/desed
binlist:
  - 'desed'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 75 KB
          rating: 1
          desc:
            cn: 约 75 KB（估算）
            en: ~75 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
