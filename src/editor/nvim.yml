lang: C
homepage: https://github.com/neovim/neovim
desc:
  cn: Neovim 是 Vim 传统上的一次重构，有时也是一次重写（redactor），它并不是一次完全的重写，而是对 Vim 的延续和扩展。
  en: Neovim is a refactor, and sometimes redactor, in the tradition of Vim (which itself derives from Stevie). It is not a rewrite but a continuation and extension of Vim.
  cs: Neovim je refaktorizací, někdy i přepsáním v tradici Vim (který sám pochází ze Stevie). Není to přepsaní, ale pokračování a rozšíření Vim.
  de: Neovim ist eine Refaktorisierung und manchmal ein Rewrite in der Tradition von Vim (das selbst von Stevie stammt). Es ist kein Rewrite, sondern eine Fortführung und Erweiterung von Vim.
  es: Neovim es una refactorización, y a veces una reescritura, en la tradición de Vim (que a su vez deriva de Stevie). No es una reescritura, sino una continuación y extensión de Vim.
  fr: Neovim est une refactorisation, et parfois une réécriture, dans la tradition de Vim (qui dérive lui-même de Stevie). Ce n'est pas une réécriture, mais une continuation et une extension de Vim.
  id: Neovim merupakan refactorisasi, dan kadang penulisan ulang, dalam tradisi Vim (yang sendiri berasal dari Stevie). Ini bukan penulisan ulang, melainkan kelanjutan dan perluasan dari Vim.
  it: Neovim è un refactoring, e a volte una riscrittura, nella tradizione di Vim (che a sua volta deriva da Stevie). Non è una riscrittura, ma una continuazione ed estensione di Vim.
  ja: Neovim は Vim の伝統（Vim 自体が Stevie に由来）に基づくリファクタリングであり、しばしば書き換えでもあります。完全な書き換えではなく、Vim の継続と拡張です。
  ko: Neovim은 Vim의 전통(그 자체로 Stevie에서 유래)을 따르는 리팩터링이며, 때로는 재작성이기도 합니다. 완전한 재작성이 아니라 Vim의 계승과 확장입니다.
  pl: Neovim to refaktoryzacja, a czasem przepisanie w tradycji Vim (który sam wywodzi się ze Stevie). To nie jest przepisanie, lecz kontynuacja i rozszerzenie Vim.
  pt: Neovim é uma refatoração, e às vezes uma reescrita, na tradição do Vim (que por sua vez deriva do Stevie). Não é uma reescrita, mas uma continuação e extensão do Vim.
  ro: Neovim este o refactorizare și, uneori, o rescriere, în tradiția lui Vim (care la rândul său derivă din Stevie). Nu este o rescriere, ci o continuare și o extindere a lui Vim.
  ru: Neovim — это рефакторинг, а иногда и переписывание в традиции Vim (который сам происходит от Stevie). Это не переписывание, а продолжение и расширение Vim.
  th: Neovim เป็นการรีแฟกเตอร์ และบางครั้งเป็นการเขียนใหม่ ตามธรรมเนียมของ Vim (ซึ่งตัวมันเองสืบทอดมาจาก Stevie) ไม่ใช่การเขียนใหม่ทั้งหมด แต่เป็นการสานต่อและขยาย Vim
  tr: Neovim, Vim geleneğinde (Vim'in kendisi Stevie'den türemiştir) bir yeniden düzenleme ve bazen bir yeniden yazımdır. Tam bir yeniden yazım değil, Vim'in devamı ve genişletilmesidir.
  uk: Neovim — це рефакторинг, а іноді й переписування в традиції Vim (який сам походить від Stevie). Це не переписування, а продовження та розширення Vim.
  vi: Neovim là một đợt tái cấu trúc, đôi khi là viết lại, theo truyền thống của Vim (bản thân Vim bắt nguồn từ Stevie). Nó không phải là viết lại hoàn toàn mà là sự tiếp nối và mở rộng của Vim.
x:
  source: https://github.com/neovim/neovim
  eget: neovim/neovim
  apt: neovim
  brew: neovim
  pacman: neovim
  apk: neovim
  apt-get: neovim
  zypper: neovim
  port: neovim
  xbps: neovim
  eopkg: neovim
  scoop: neovim
  choco: neovim
  winget: Neovim.Neovim
  flatpak: flathub
  nix: nixpkgs#neovim
rule:
  /eget:
    cmd: x eget neovim/neovim
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use nvim
    reference: https://x-cmd.com/install/
  (win|wsl2)/scoop:
    cmd: x scoop bucket add main && x scoop install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#scoop
  (win|wsl2)/choco:
    cmd: x choco install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#chocolatey
  (win|wsl2)/winget:
    cmd: x winget install Neovim.Neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#winget
  darwin/brew:
    cmd: brew install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#homebrew-on-macos-or-linux
  linux/brew:
    cmd: brew install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#homebrew-on-macos-or-linux
  darwin/port:
    cmd: sudo port selfupdate && sudo port install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#macports
  arch/pacman:
    cmd: sudo pacman -S neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#arch-linux
  centos/pacman:
    cmd: 'sudo yum install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm && \

      sudo yum install -y neovim python3-neovim

      '
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#centos-8--rhel-8
  clear/swupd:
    cmd: sudo swupd bundle-add neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#clear-linux-os
  debian/apt:
    cmd: sudo apt-get install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#debian
    dsnap: neovim
  exherbo/cave:
    cmd: cave resolve app-editors/neovim --take dev-python/neovim-python --take app-editors/neovim-qt
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#exherbo-linux
  fedora/dnf:
    cmd: sudo dnf install -y neovim python3-neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#fedora
    dsnap: neovim
  /flatpak:
    cmd: sudo flatpak install flathub io.neovim.nvim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#flatpak
  gentoo/emerge:
    cmd: sudo emerge -a app-editors/neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#gentoo-linux
  guixos/guix:
    cmd: guix install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#gnu-guix
  gobo/compile:
    cmd: sudo -H Compile NeoVim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#gobolinux
  /nix-env:
    cmd: nix-env -iA nixpkgs.neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#nix--nixos
  nix/flakes:
    cmd: nix profile install nixpkgs#neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#nix--nixos
  mageia/urpmi:
    cmd: urpmi neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#mageia-7
  opensuse/zypper:
    cmd: sudo zypper in neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#opensuse
  pld/poldek:
    cmd: poldek -u neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#pld-linux
  solus/eopkg:
    cmd: sudo eopkg install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#solus
  ubuntu/apt:
    cmd: sudo apt install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#ubuntu
    dsnap: neovim
  void/xbps:
    cmd: sudo xbps-install -S neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#void-linux
  alpine/apk:
    cmd: sudo apk add neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#alpine-linux
    dsnap: neovim
  freebsd/pkg:
    cmd: pkg install neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#freebsd
  openbsd/pkg_add:
    cmd: pkg_add neovim
    reference: https://github.com/neovim/neovim/blob/master/INSTALL.md#openbsd
binlist:
- nvim
license: NOASSERTION

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
