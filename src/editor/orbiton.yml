lang: Go
homepage: https://github.com/xyproto/orbiton
license: BSD-3-Clause
desc:
  en: Orbiton is a text editor and a simple IDE
  cn: Orbiton 是一款文本编辑器和简易的集成开发环境（IDE）。
x:
  source: https://github.com/xyproto/orbiton
  eget: https://github.com/xyproto/orbiton
  brew: orbiton
  pacman: orbiton
rule:
  /eget:
    cmd: x eget xyproto/orbiton
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S orbiton
    reference: https://github.com/xyproto/orbiton?tab=readme-ov-file#packaging-status
  darwin/brew:
    cmd: brew install orbiton
    reference: https://github.com/xyproto/orbiton?tab=readme-ov-file#packaging-status
  /go:
    cmd: go install github.com/xyproto/orbiton/v2@latest && mv -i ~/go/bin/orbiton ~/go/bin/o
    reference: https://github.com/xyproto/orbiton?tab=readme-ov-file#quick-start
    dsnap: github.com/xyproto/orbiton/v2
binlist:
- orbiton

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
