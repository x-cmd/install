lang: Nim
homepage: https://github.com/fox0430/moe
license: GPL-3.0
desc:
  en: A command line based editor inspired by Vim written in Nim
  cn: 一个受到 Vim 启发、用 Nim 语言编写的基于命令行的编辑器
x:
  source: https://github.com/fox0430/moe
rule:
  arch/yay:
    cmd: yay -S moe-nim
    reference: https://aur.archlinux.org/packages/moe-nim
  /nimble:
    cmd: nimble install moe
    reference: https://github.com/fox0430/moe?tab=readme-ov-file#install
binlist:
- moe

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
