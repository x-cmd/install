lang: Nim
homepage: https://github.com/fox0430/moe
license: GPL-3.0
desc:
  en: A command line based editor inspired by Vim written in Nim
  cn: 一个受到 Vim 启发、用 Nim 语言编写的基于命令行的编辑器
x:
  source: https://github.com/fox0430/moe
rule:
  arch/yay:
    cmd: yay -S moe-nim
    reference: https://aur.archlinux.org/packages/moe-nim
  /nimble:
    cmd: nimble install moe
    reference: https://github.com/fox0430/moe?tab=readme-ov-file#install
binlist:
- moe

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
