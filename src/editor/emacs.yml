lang: Emacs Lisp
homepage: https://git.savannah.gnu.org/cgit/emacs.git
desc:
  cn: GNU Emacs 是一个可扩展、可定制、免费的文本编辑器
  en: GNU Emacs is an extensible, customizable, free/libre text editor
rule:
  /guix:
    cmd: guix package -i emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
  debian/apt:
    cmd: sudo apt-get install emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
    dsnap: emacs
  ubuntu/apt:
    cmd: sudo apt-get install emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
    dsnap: emacs
  arch/pacman:
    cmd: sudo pacman -S emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
  fefora/dnf:
    cmd: sudo dnf install emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
  opensuse/zypper:
    cmd: sudo zypper install emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
  darwin/brew:
    cmd: brew install --cask emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#nonfree
  darwin/port:
    cmd: sudo port install emacs-app
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#nonfree
  win-x64/pacman:
    cmd: pacman -S mingw-w64-x86_64-emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#nonfree
  win-i686/pacman:
    cmd: pacman -S mingw-w64-i686-emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#nonfree
  alpine/apk:
    cmd: sudo apk add emacs
    reference: https://command-not-found.com/emacs
    dsnap: emacs
  kali/apt:
    cmd: sudo apt-get install emacs
    reference: https://command-not-found.com/emacs
    dsnap: emacs
  centos/yum:
    cmd: sudo yum install emacs-1
    reference: https://command-not-found.com/emacs
  fedora/dnf:
    cmd: sudo yum install emacs-1
    reference: https://command-not-found.com/emacs
    dsnap: emacs
  raspbian/apt:
    cmd: sudo apt-get install emacs
    reference: https://command-not-found.com/emacs
binlist:
- emacs
license: NOASSERTION
footprint:
  behavior:
    runtime:
      type: [cli, tui, gui]
    network:
      local: true
      internet: true        # package fetching
    filesystem:
      read:
        desc:
          cn: 读取 ~/.emacs.d, 包目录；编辑文件
          en: Reads ~/.emacs.d, package directory; edits files
        sensitive:
          - "~/.authinfo.gpg"
          - "~/.emacs.d/.authinfo"
      write:
        desc:
          cn: 写入 ~/.emacs.d, autosave 文件，编辑缓冲区
          en: Writes ~/.emacs.d, autosave files, edit buffers
        sensitive:
          - "~/.authinfo.gpg"
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 安装 ~50 MB（含依赖）
            en: ~50 MB install (with deps)
        growth:
          desc:
            cn: ~/.emacs.d 随使用增长（包、历史）
            en: ~/.emacs.d grows with usage (packages, history)
      paths:
        data:
          - "~/.emacs.d/"
        config:
          - "~/.emacs"
          - "~/.emacs.d/init.el"
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
      peak:
        estimate: 200 MB
        desc:
          cn: ~200 MB（多 buffer + 模式）
          en: ~200 MB (multiple buffers + modes)
    cpu:
      workload: [compute, io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 4
        desc:
          cn: 复杂模式（如 lisp 编译）时占用
          en: Spike during complex modes (e.g., lisp compilation)
