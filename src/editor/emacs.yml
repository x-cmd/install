lang: Emacs Lisp
homepage: https://git.savannah.gnu.org/cgit/emacs.git
desc:
  cn: GNU Emacs 是一个可扩展、可定制、免费的文本编辑器
  en: GNU Emacs is an extensible, customizable, free/libre text editor
  cs: GNU Emacs je rozšiřitelný, přizpůsobitelný, svobodný textový editor
  de: GNU Emacs ist ein erweiterbarer, anpassbarer freier/libre Texteditor
  es: GNU Emacs es un editor de texto ampliable, personalizable y libre
  fr: GNU Emacs est un éditeur de texte extensible, personnalisable et libre
  id: GNU Emacs adalah editor teks yang dapat diperluas, dapat dikustomisasi, dan bebas
  it: GNU Emacs è un editor di testo estensibile, personalizzabile e libero
  ja: GNU Emacs は拡張可能でカスタマイズ可能な自由なテキストエディタです
  ko: GNU Emacs는 확장 가능하고 사용자 지정이 가능한 자유로운 텍스트 편집기입니다
  pl: GNU Emacs to rozszerzalny, konfigurowalny, wolny edytor tekstu
  pt: GNU Emacs é um editor de texto extensível, customizável e livre
  ro: GNU Emacs este un editor de text extensibil, personalizabil și liber
  ru: GNU Emacs — расширяемый, настраиваемый свободный текстовый редактор
  th: GNU Emacs เป็นโปรแกรมแก้ไขข้อความที่ขยายได้ ปรับแต่งได้ และเป็นซอฟต์แวร์อิสระ
  tr: GNU Emacs genişletilebilir, özelleştirilebilir, özgür bir metin düzenleyicisidir
  uk: GNU Emacs — розширюваний, налаштовуваний вільний текстовий редактор
  vi: GNU Emacs là trình soạn thảo văn bản mở rộng được, tùy biến được và tự do
rule:
  /guix:
    cmd: guix package -i emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
  debian/apt:
    cmd: sudo apt-get install emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
    dsnap: emacs
  ubuntu/apt:
    cmd: sudo apt-get install emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
    dsnap: emacs
  arch/pacman:
    cmd: sudo pacman -S emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
  fefora/dnf:
    cmd: sudo dnf install emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
  opensuse/zypper:
    cmd: sudo zypper install emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#gnu-linux
  darwin/brew:
    cmd: brew install --cask emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#nonfree
  darwin/port:
    cmd: sudo port install emacs-app
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#nonfree
  win-x64/pacman:
    cmd: pacman -S mingw-w64-x86_64-emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#nonfree
  win-i686/pacman:
    cmd: pacman -S mingw-w64-i686-emacs
    reference: https://www.gnu.org/savannah-checkouts/gnu/emacs/download.html#nonfree
  alpine/apk:
    cmd: sudo apk add emacs
    reference: https://command-not-found.com/emacs
    dsnap: emacs
  kali/apt:
    cmd: sudo apt-get install emacs
    reference: https://command-not-found.com/emacs
    dsnap: emacs
  centos/yum:
    cmd: sudo yum install emacs-1
    reference: https://command-not-found.com/emacs
  fedora/dnf:
    cmd: sudo yum install emacs-1
    reference: https://command-not-found.com/emacs
    dsnap: emacs
  raspbian/apt:
    cmd: sudo apt-get install emacs
    reference: https://command-not-found.com/emacs

x:
  apt: emacs
  apt-get: emacs
  dnf: emacs
  yum: emacs-1
  zypper: emacs
  pacman: emacs
  apk: emacs
  port: emacs-app
  guix: emacs
binlist:
- emacs
license: NOASSERTION
# complicated
footprint:
  behavior:
    runtime:
      type: [cli, tui, gui]
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true        # package fetching
    filesystem:
      read:
        desc:
          cn: 读取 ~/.emacs.d, 包目录；编辑文件
          en: Reads ~/.emacs.d, package directory; edits files
        sensitive:
          - "~/.authinfo.gpg"
          - "~/.emacs.d/.authinfo"
      write:
        desc:
          cn: 写入 ~/.emacs.d, autosave 文件，编辑缓冲区
          en: Writes ~/.emacs.d, autosave files, edit buffers
        sensitive:
          - "~/.authinfo.gpg"
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 38 MB
          rating: 2
          desc:
            cn: 安装 38 MB (apt emacs-nox + el)
            en: 38 MB install (apt emacs-nox + el)
        download:
          estimate: 40 MB
          desc:
            cn: 约 40 MB 下载 (apt)
            en: ~40 MB download (apt)
        growth:
          desc:
            cn: ~/.emacs.d 随使用增长（包、历史）
            en: ~/.emacs.d grows with usage (packages, history)
      paths:
        data:
          - "~/.emacs.d/"
        config:
          - "~/.emacs"
          - "~/.emacs.d/init.el"
    memory:
      idle:
        estimate: 18 MB
        desc:
          cn: 18 MB（实测，RSS=18148 KB）
          en: 18 MB (measured, RSS=18148 KB)
      peak:
        estimate: 200 MB
        desc:
          cn: ~200 MB（多 buffer + 模式）
          en: ~200 MB (multiple buffers + modes)
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 4
        desc:
          cn: 复杂模式（如 lisp 编译）时占用
          en: Spike during complex modes (e.g., lisp compilation)
