lang: 'Go'
homepage: 'https://github.com/lusingander/gotip'
license: 'MIT'
desc:
  cn: Go 测试交互式选择器
  en: 'Go Test Interactive Picker 🧪'
x:
  source: https://github.com/lusingander/gotip
  eget: https://github.com/lusingander/gotip
rule:
  /eget:
    cmd: x eget lusingander/gotip
    reference: https://github.com/lusingander/gotip
binlist:
  - 'gotip'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 360 KB
          rating: 1
          desc:
            cn: 约 360 KB（估算）
            en: ~360 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
