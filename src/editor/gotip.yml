license: 'MIT'
desc:
  cn: Go 测试交互式选择器
  en: 'Go Test Interactive Picker 🧪'
  cs: Interaktivní výběr testů Go
  de: Interaktiver Go-Test-Auswähler 🧪
  es: Selector interactivo de pruebas de Go 🧪
  fr: Sélecteur interactif de tests Go 🧪
  id: Pemilih interaktif untuk pengujian Go 🧪
  it: Selettore interattivo dei test Go 🧪
  ja: Go テストの対話式ピッカー 🧪
  ko: Go 테스트 대화형 선택기 🧪
  pl: Interaktywny wybór testów Go 🧪
  pt: Seletor interativo de testes Go 🧪
  ro: Selector interactiv pentru teste Go 🧪
  ru: Интерактивный выбор тестов Go 🧪
  th: ตัวเลือกทดสอบ Go แบบโต้ตอบ 🧪
  tr: Go testleri için etkileşimli seçici 🧪
  uk: Інтерактивний вибір тестів Go 🧪
  vi: Bộ chọn thử nghiệm Go tương tác 🧪
x:
  source: https://github.com/lusingander/gotip
  eget: lusingander/gotip
rule:
  /eget:
    cmd: x eget lusingander/gotip
    reference: https://github.com/lusingander/gotip
binlist:
  - 'gotip'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 360 KB
          rating: 1
          desc:
            cn: 约 360 KB（估算）
            en: ~360 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
