lang: 'Go'
homepage: 'https://github.com/lusingander/gotip'
license: 'MIT'
desc:
  cn: Go 测试交互式选择器
  en: 'Go Test Interactive Picker 🧪'
x:
  source: https://github.com/lusingander/gotip
  eget: https://github.com/lusingander/gotip
rule:
  /eget:
    cmd: x eget lusingander/gotip
    reference: https://github.com/lusingander/gotip
binlist:
  - 'gotip'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
