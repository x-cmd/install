lang: 'Python'
homepage: https://github.com/peternaame-boop/ytm-player
license: 'MIT'
desc:
  cn: 支持 Vim 键位、同步歌词和跨平台媒体键的 YouTube Music TUI 客户端
  en: 'YouTube Music TUI client with vim keybindings, synced lyrics, and cross-platform media keys'
x:
  source: https://github.com/peternaame-boop/ytm-player
  eget: https://github.com/peternaame-boop/ytm-player
rule:
  /eget:
    cmd: x eget peternaame-boop/ytm-player
    reference: https://github.com/peternaame-boop/ytm-player
binlist:
- 'ytm-player'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 319 KB
          rating: 1
          desc:
            cn: 安装 319 KB
            en: 319 KB install
        download:
          estimate: 319 KB
          desc:
            cn: 约 319 KB 下载 (whl)
            en: ~319 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
