lang: 'Python'
homepage: https://github.com/peternaame-boop/ytm-player
license: 'MIT'
desc:
  cn: 支持 Vim 键位、同步歌词和跨平台媒体键的 YouTube Music TUI 客户端
  en: 'YouTube Music TUI client with vim keybindings, synced lyrics, and cross-platform media keys'
x:
  source: https://github.com/peternaame-boop/ytm-player
  eget: https://github.com/peternaame-boop/ytm-player
rule:
  /eget:
    cmd: x eget peternaame-boop/ytm-player
    reference: https://github.com/peternaame-boop/ytm-player
binlist:
  - 'ytm-player'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 112 KB
          rating: 1
          desc:
            cn: 约 112 KB（估算）
            en: ~112 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
