lang: 'Rust'
homepage: 'https://github.com/DVDTSB/hexhog'
license: 'MIT'
desc:
  cn: 十六进制查看器/编辑器
  en: 'hex viewer/editor'
x:
  source: https://github.com/DVDTSB/hexhog
  eget: https://github.com/DVDTSB/hexhog
rule:
  /eget:
    cmd: x eget DVDTSB/hexhog
    reference: https://github.com/DVDTSB/hexhog
binlist:
  - 'hexhog'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
