lang: 'Rust'
homepage: 'https://github.com/DVDTSB/hexhog'
license: 'MIT'
desc:
  cn: 十六进制查看器/编辑器
  en: 'hex viewer/editor'
x:
  source: https://github.com/DVDTSB/hexhog
  eget: https://github.com/DVDTSB/hexhog
rule:
  /eget:
    cmd: x eget DVDTSB/hexhog
    reference: https://github.com/DVDTSB/hexhog
binlist:
  - 'hexhog'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 KB
          rating: 1
          desc:
            cn: 约 30 KB（估算）
            en: ~30 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
