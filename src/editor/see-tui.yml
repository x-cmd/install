lang: 'Rust'
homepage: 'https://github.com/NustyFrozen/SEE'
license: 'GPL-3.0'
desc:
  cn: 基于 TUI 的服务日志查询工具(systemd)
  en: 'see (Service Event Extraction) is a TUI based tool to lookup logs from services (systemd)'
x:
  source: https://github.com/NustyFrozen/SEE
  eget: https://github.com/NustyFrozen/SEE
rule:
  /cargo:
    cmd: 'cargo install seetui'
    reference: https://github.com/NustyFrozen/SEE
  /eget:
    cmd: x eget NustyFrozen/SEE
    reference: https://github.com/NustyFrozen/SEE
binlist:
  - 'see-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
