lang: 'Rust'
homepage: https://github.com/elio-fm/elio
license: 'MIT'
desc:
  cn: 功能齐全的终端文件管理器，支持丰富预览、内联图片与批量操作
  en: 'Snappy, batteries-included terminal file manager with rich previews, inline images, bulk actions, and trash support'
x:
  source: https://github.com/elio-fm/elio
  eget: https://github.com/elio-fm/elio
rule:
  /eget:
    cmd: x eget elio-fm/elio
    reference: https://github.com/elio-fm/elio
binlist:
- 'elio'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
