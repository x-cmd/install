lang: 'Rust'
homepage: https://github.com/elio-fm/elio
license: 'MIT'
desc:
  cn: 功能齐全的终端文件管理器，支持丰富预览、内联图片与批量操作
  en: 'Snappy, batteries-included terminal file manager with rich previews, inline images, bulk actions, and trash support'
x:
  source: https://github.com/elio-fm/elio
  eget: https://github.com/elio-fm/elio
rule:
  /eget:
    cmd: x eget elio-fm/elio
    reference: https://github.com/elio-fm/elio
binlist:
  - 'elio'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
