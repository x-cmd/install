lang: 'Zig'
homepage: 'https://github.com/18alantom/fex'
license: 'GPL-3.0'
desc:
  cn: 注重快速导航的命令行文件浏览器
  en: 'A command-line file explorer prioritizing quick navigation.'
x:
  source: https://github.com/18alantom/fex
  eget: 18alantom/fex
rule:
  /eget:
    cmd: x eget 18alantom/fex
    reference: https://github.com/18alantom/fex
binlist:
  - 'fex'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 82 KB
          rating: 1
          desc:
            cn: 约 82 KB（估算）
            en: ~82 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
