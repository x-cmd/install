lang: 'Zig'
homepage: 'https://github.com/18alantom/fex'
license: 'GPL-3.0'
desc:
  cn: 注重快速导航的命令行文件浏览器
  en: 'A command-line file explorer prioritizing quick navigation.'
  cs: Průzkumník souborů v příkazové řádce, který klade důraz na rychlou navigaci.
  de: Ein Datei-Explorer für die Kommandozeile, der auf schnelle Navigation Wert legt.
  es: Un explorador de archivos de línea de comandos que prioriza la navegación rápida.
  fr: Un explorateur de fichiers en ligne de commande privilégiant la navigation rapide.
  id: Penjelajah file baris perintah yang mengutamakan navigasi cepat.
  it: Un file explorer da riga di comando che privilegia la navigazione rapida.
  ja: 素早い移動を重視したコマンドライン的文件ブラウザー
  ko: 빠른 탐색을 중시하는 명령줄 파일 탐색기
  pl: Eksplorer plików w wierszu poleceń, stawiający na szybką nawigację.
  pt: Um explorador de arquivos de linha de comando que prioriza a navegação rápida.
  ro: Un explorator de fișiere în linia de comandă care pune accent pe navigarea rapidă.
  ru: Файловый обозреватель для командной строки, ориентированный на быструю навигацию.
  th: ตัวสำรวจไฟล์บนบรรทัดคำสั่งที่ให้ความสำคัญกับการนำทางอย่างรวดเร็ว
  tr: Hızlı gezinmeyi önceleyen komut satırı dosya gezgini
  uk: Файловий провідник для командного рядка, що робить акцент на швидкій навігації.
  vi: Trình duyệt tệp dòng lệnh ưu tiên điều hướng nhanh
x:
  source: https://github.com/18alantom/fex
  eget: 18alantom/fex
rule:
  /eget:
    cmd: x eget 18alantom/fex
    reference: https://github.com/18alantom/fex
binlist:
  - 'fex'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 82 KB
          rating: 1
          desc:
            cn: 约 82 KB（估算）
            en: ~82 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
