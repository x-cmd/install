lang: 'Zig'
homepage: https://github.com/neurocyte/flow
license: 'MIT'
desc:
  cn: Flow Control：面向程序员的文本编辑器
  en: 'Flow Control: a programmer''s text editor'
  cs: "Flow Control: textový editor pro programátory"
  de: "Flow Control: ein Texteditor für Programmierer"
  es: "Flow Control: un editor de texto para programadores"
  fr: "Flow Control : un éditeur de texte pour les programmeurs"
  id: "Flow Control: editor teks untuk programmer"
  it: "Flow Control: un editor di testo per programmatori"
  ja: "Flow Control: プログラマー向けのテキストエディタ"
  ko: "Flow Control: 프로그래머를 위한 텍스트 편집기"
  pl: "Flow Control: edytor tekstu dla programistów"
  pt: "Flow Control: um editor de texto para programadores"
  ro: "Flow Control: un editor de text pentru programatori"
  ru: "Flow Control: текстовый редактор для программистов"
  th: "Flow Control: โปรแกรมแก้ไขข้อความสำหรับโปรแกรมเมอร์"
  tr: "Flow Control: programcılar için metin düzenleyici"
  uk: "Flow Control: текстовий редактор для програмістів"
  vi: "Flow Control: trình soạn thảo văn bản dành cho lập trình viên"
x:
  source: https://github.com/neurocyte/flow
  eget: neurocyte/flow
rule:
  /eget:
    cmd: x eget neurocyte/flow
    reference: https://github.com/neurocyte/flow
binlist:
  - 'flowcontrol'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
