lang: 'Zig'
homepage: https://github.com/neurocyte/flow
license: 'MIT'
desc:
  cn: Flow Control：面向程序员的文本编辑器
  en: 'Flow Control: a programmer''s text editor'
x:
  source: https://github.com/neurocyte/flow
  eget: neurocyte/flow
rule:
  /eget:
    cmd: x eget neurocyte/flow
    reference: https://github.com/neurocyte/flow
binlist:
  - 'flowcontrol'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
