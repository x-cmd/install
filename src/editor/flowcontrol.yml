lang: 'Zig'
homepage: https://github.com/neurocyte/flow
license: 'MIT'
desc:
  cn: Flow Control：面向程序员的文本编辑器
  en: 'Flow Control: a programmer''s text editor'
x:
  source: https://github.com/neurocyte/flow
  eget: https://github.com/neurocyte/flow
rule:
  /eget:
    cmd: x eget neurocyte/flow
    reference: https://github.com/neurocyte/flow
binlist:
  - 'flowcontrol'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
