lang: 'Go'
homepage: 'https://github.com/maaslalani/sheets'
license: 'MIT'
desc:
  cn: 基于终端的电子表格工具
  en: 'Terminal based spreadsheet tool'
  cs: Nástroj pro tabulkové sešity v terminálu
  de: Tabellenkalkulations-Tool auf Terminalbasis
  es: Herramienta de hojas de cálculo basada en terminal
  fr: Outil de tableur basé sur le terminal
  id: Alat spreadsheet berbasis terminal
  it: Strumento di foglio di calcolo basato sul terminale
  ja: ターミナルベースの表計算ツール
  ko: 터미널 기반 스프레드시트 도구
  pl: Narzędzie arkusza kalkulacyjnego oparte na terminalu
  pt: Ferramenta de planilha baseada em terminal
  ro: Instrument de foaie de calcul bazat pe terminal
  ru: Электронная таблица, работающая в терминале
  th: เครื่องมือสเปรดชีตบนเทอร์มินัล
  tr: Terminal tabanlı elektronik tablo aracı
  uk: Табличний редактор, що працює в терміналі
  vi: Công cụ bảng tính chạy trên terminal
x:
  source: https://github.com/maaslalani/sheets
  eget: maaslalani/sheets
rule:
  /eget:
    cmd: x eget maaslalani/sheets
    reference: https://github.com/maaslalani/sheets
binlist:
- 'sheets'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
