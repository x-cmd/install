lang: 'Go'
homepage: 'https://github.com/maaslalani/sheets'
license: 'MIT'
desc:
  cn: 基于终端的电子表格工具
  en: 'Terminal based spreadsheet tool'
x:
  source: https://github.com/maaslalani/sheets
  eget: https://github.com/maaslalani/sheets
rule:
  /eget:
    cmd: x eget maaslalani/sheets
    reference: https://github.com/maaslalani/sheets
binlist:
  - 'sheets'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
