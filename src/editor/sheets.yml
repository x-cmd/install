lang: 'Go'
homepage: 'https://github.com/maaslalani/sheets'
license: 'MIT'
desc:
  cn: 基于终端的电子表格工具
  en: 'Terminal based spreadsheet tool'
x:
  source: https://github.com/maaslalani/sheets
  eget: https://github.com/maaslalani/sheets
rule:
  /eget:
    cmd: x eget maaslalani/sheets
    reference: https://github.com/maaslalani/sheets
binlist:
  - 'sheets'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 581 KB
          rating: 1
          desc:
            cn: 约 581 KB（估算）
            en: ~581 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
