lang: Rust
homepage: https://github.com/microsoft/edit
license: MIT
desc:
  cn: 微软开源的轻量级命令行文本编辑器，向 MS-DOS Editor 致敬，界面类似 VS Code
  en: A lightweight open-source command-line text editor from Microsoft, a homage to MS-DOS Editor with a VS Code-like interface
x:
  source: https://github.com/microsoft/edit
  eget: https://github.com/microsoft/edit
  brew: msedit
  winget: Microsoft.Edit
rule:
  /eget:
    cmd: x eget microsoft/edit
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install msedit
    reference: https://formulae.brew.sh/formula/msedit
  linux/brew:
    cmd: brew install msedit
    reference: https://formulae.brew.sh/formula/msedit
  (win|wsl2)/winget:
    cmd: x winget install Microsoft.Edit
    reference: https://github.com/microsoft/edit#windows
binlist:
  - edit

footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 1
          desc:
            cn: 安装 10 MB
            en: 10 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible