lang: 'Rust'
homepage: 'https://github.com/ndd7xv/heh'
license: 'MIT'
desc:
  cn: 按 nibble 编辑字节的终端 UI
  en: 'A terminal UI to edit bytes by the nibble.'
x:
  source: https://github.com/ndd7xv/heh
  eget: https://github.com/ndd7xv/heh
rule:
  /eget:
    cmd: x eget ndd7xv/heh
    reference: https://github.com/ndd7xv/heh
binlist:
  - 'heh'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 104 KB
          rating: 1
          desc:
            cn: 约 104 KB（估算）
            en: ~104 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
