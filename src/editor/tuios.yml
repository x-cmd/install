x:
  source: https://github.com/Gaurav-Gosain/tuios
  eget: Gaurav-Gosain/tuios
rule:
  /eget:
    cmd: x eget Gaurav-Gosain/tuios
    reference: https://github.com/Gaurav-Gosain/tuios
binlist:
- 'tuios'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 MB
          rating: 2
          desc:
            cn: 约 28 MB（估算）
            en: ~28 MB estimated
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
