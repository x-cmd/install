lang: Rust
homepage: https://github.com/curlpipe/ox
license: GPL-2.0
desc:
  en: Ox is a text editor that can be used to write everything from text to code
  cn: Ox 是一款文本编辑器，可以用来编写从文本到代码的各种内容。
x:
  source: https://github.com/curlpipe/ox
  eget: https://github.com/curlpipe/ox
rule:
  /eget:
    cmd: x eget curlpipe/ox
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install ox
    reference: https://github.com/curlpipe/ox?tab=readme-ov-file#macos
  darwin/port:
    cmd: 'sudo port selfupdate

      sudo port install ox

      '
    reference: https://github.com/curlpipe/ox?tab=readme-ov-file#macos
  /cargo:
    cmd: cargo install --git https://github.com/curlpipe/ox
    reference: https://github.com/curlpipe/ox?tab=readme-ov-file#manual
    dsnap: ox
binlist:
- ox

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
