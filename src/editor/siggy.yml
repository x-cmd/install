lang: 'Rust'
homepage: https://github.com/johnsideserf/siggy
license: 'GPL-3.0'
desc:
  cn: 支持 Vim 键位的终端 Signal 客户端
  en: 'Terminal-based Signal messenger client with vim keybindings'
x:
  source: https://github.com/johnsideserf/siggy
  eget: https://github.com/johnsideserf/siggy
rule:
  /eget:
    cmd: x eget johnsideserf/siggy
    reference: https://github.com/johnsideserf/siggy
binlist:
- 'siggy'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
