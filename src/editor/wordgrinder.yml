lang: Lua
homepage: https://github.com/davidgiven/wordgrinder
desc:
  cn: 让你专注写作、不挡道的文字处理器
  en: A word processor which gets the hell out of your way and lets you get some work done.
x:
  source: https://github.com/davidgiven/wordgrinder
  eget: https://github.com/davidgiven/wordgrinder
rule:
  /eget:
    cmd: x eget davidgiven/wordgrinder
    reference: https://github.com/davidgiven/wordgrinder
binlist:
- wordgrinder
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
