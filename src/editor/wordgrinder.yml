lang: Lua
homepage: https://github.com/davidgiven/wordgrinder
desc:
  cn: 让你专注写作、不挡道的文字处理器
  en: A word processor which gets the hell out of your way and lets you get some work done.
  cs: Textový procesor, který vám překáží nanejvýš a nechá vás soustředit na práci.
  de: Ein Textverarbeitungsprogramm, das Ihnen aus dem Weg geht und Sie arbeiten lässt.
  es: Un procesador de texto que no se estorba y te deja hacer trabajo de verdad.
  fr: Un traitement de texte qui s'efface pour vous laisser travailler tranquillement.
  id: Pengolah kata yang tidak mengganggu Anda dan membiarkan Anda menyelesaikan pekerjaan.
  it: Un elaboratore di testi che si fa da parte e vi lascia lavorare in pace.
  ja: 邪魔をせず作業に集中させてくれるワープロソフト
  ko: 방해하지 않고 일에 집중하게 해 주는 워드 프로세서
  pl: Edytor tekstu, który nie przeszkadza i pozwala Ci spokojnie pracować.
  pt: Um processador de texto que sai do seu caminho e deixa você fazer seu trabalho.
  ro: Un procesor de texte care vă lasă în pace și vă permite să lucrați efectiv.
  ru: Текстовый процессор, который не мешает и позволяет вам спокойно работать.
  th: โปรแกรมประมวลผลคำที่ไม่กวนกวนคุณ และปล่อยให้คุณได้ทำงานได้จริง
  tr: Yolunuzdan çekilip size işinizi yaptıran bir metin düzenleyici.
  uk: Текстовий процесор, який не заважає і дозволяє вам спокійно працювати.
  vi: Trình soạn thảo văn bản biến mất khỏi tầm nhìn và giúp bạn tập trung làm việc.
x:
  source: https://github.com/davidgiven/wordgrinder
  eget: davidgiven/wordgrinder
rule:
  /eget:
    cmd: x eget davidgiven/wordgrinder
    reference: https://github.com/davidgiven/wordgrinder
binlist:
- wordgrinder
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
