lang: 'C#'
homepage: 'https://github.com/timkicker/podliner'
license: 'GPL-3.0'
desc:
  cn: 任意终端中的播客工具,快速、清爽、离线可用
  en: 'Podcasts in any terminal. Fast, clean, offline.'
x:
  source: https://github.com/timkicker/podliner
  eget: https://github.com/timkicker/podliner
rule:
  debian/apt:
    cmd: 'sudo apt-get install -y vlc mpv ffmpeg'
    reference: https://github.com/timkicker/podliner
  arch/pacman:
    cmd: 'yay -S podliner-bin'
    reference: https://github.com/timkicker/podliner
  /eget:
    cmd: x eget timkicker/podliner
    reference: https://github.com/timkicker/podliner
binlist:
- 'podliner'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 32 MB
          rating: 2
          desc:
            cn: 安装 32 MB
            en: 32 MB install
        download:
          estimate: 32 MB
          desc:
            cn: 约 32 MB 下载 (linux/x64)
            en: ~32 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
