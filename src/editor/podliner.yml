lang: 'C#'
homepage: 'https://github.com/timkicker/podliner'
license: 'GPL-3.0'
desc:
  cn: 任意终端中的播客工具,快速、清爽、离线可用
  en: 'Podcasts in any terminal. Fast, clean, offline.'
x:
  source: https://github.com/timkicker/podliner
  eget: https://github.com/timkicker/podliner
rule:
  debian/apt:
    cmd: 'sudo apt-get install -y vlc mpv ffmpeg'
    reference: https://github.com/timkicker/podliner
  arch/pacman:
    cmd: 'yay -S podliner-bin'
    reference: https://github.com/timkicker/podliner
  /eget:
    cmd: x eget timkicker/podliner
    reference: https://github.com/timkicker/podliner
binlist:
  - 'podliner'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
