lang: 'C#'
homepage: 'https://github.com/timkicker/podliner'
license: 'GPL-3.0'
desc:
  cn: 任意终端中的播客工具,快速、清爽、离线可用
  en: 'Podcasts in any terminal. Fast, clean, offline.'
  cs: Podcasty v jakémkoli terminálu. Rychlé, čisté, offline.
  de: Podcasts in jedem Terminal. Schnell, sauber, offline.
  es: Pódcast en cualquier terminal. Rápido, limpio, sin conexión.
  fr: Des podcasts dans n'importe quel terminal. Rapide, propre, hors ligne.
  id: Podcast di terminal mana pun. Cepat, bersih, luring.
  it: Podcast in qualsiasi terminale. Veloce, pulito, offline.
  ja: どんなターミナルでも podcast を。高速できれい、オフラインでも使える。
  ko: 어떤 터미널에서나 팟캐스트를. 빠르고 깔끔하며 오프라인으로 동작합니다.
  pl: Podcasty w dowolnym terminalu. Szybko, czysto, offline.
  pt: Podcasts em qualquer terminal. Rápido, limpo, offline.
  ro: Podcasts în orice terminal. Rapid, curat, offline.
  ru: Подкасты в любом терминале. Быстро, чисто, офлайн.
  th: พอดแคสต์ในเทอร์มินัลใดก็ได้ เร็ว สะอาด ใช้งานออฟไลน์ได้
  tr: Her terminalde podcast. Hızlı, temiz, çevrimdışı.
  uk: Подкасти в будь-якому терміналі. Швидко, чисто, офлайн.
  vi: Podcast trong mọi terminal. Nhanh, gọn, hoạt động ngoại tuyến.
x:
  source: https://github.com/timkicker/podliner
  eget: timkicker/podliner
  yay: podliner-bin
rule:
  debian/apt:
    cmd: 'sudo apt-get install -y vlc mpv ffmpeg'
    reference: https://github.com/timkicker/podliner
  arch/pacman:
    cmd: 'yay -S podliner-bin'
    reference: https://github.com/timkicker/podliner
  /eget:
    cmd: x eget timkicker/podliner
    reference: https://github.com/timkicker/podliner
binlist:
- 'podliner'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 32 MB
          rating: 2
          desc:
            cn: 安装 32 MB
            en: 32 MB install
        download:
          estimate: 32 MB
          desc:
            cn: 约 32 MB 下载 (linux/x64)
            en: ~32 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
