lang: 'C++'
homepage: 'https://github.com/NikolaDucak/caps-log'
license: 'MIT'
desc:
  cn: 小巧的 TUI 日记工具
  en: 'A small TUI journaling tool. 📖'
x:
  source: https://github.com/NikolaDucak/caps-log
  eget: https://github.com/NikolaDucak/caps-log
rule:
  /eget:
    cmd: x eget NikolaDucak/caps-log
    reference: https://github.com/NikolaDucak/caps-log
binlist:
  - 'caps-log'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 455 KB
          rating: 1
          desc:
            cn: 约 455 KB（估算）
            en: ~455 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
