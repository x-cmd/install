lang: 'C++'
homepage: 'https://github.com/NikolaDucak/caps-log'
license: 'MIT'
desc:
  cn: 小巧的 TUI 日记工具
  en: 'A small TUI journaling tool. 📖'
  cs: Malý nástroj na psaní deníku v TUI. 📖
  de: Ein kleines TUI-Journal-Tool. 📖
  es: Una pequeña herramienta de diario TUI. 📖
  fr: Un petit outil de journalisation TUI. 📖
  id: Alat jurnal TUI berukuran kecil. 📖
  it: Un piccolo strumento journaling TUI. 📖
  ja: 小さな TUI 日記ツール。📖
  ko: 작은 TUI 저널 도구. 📖
  pl: Małe narzędzie do prowadzenia dziennika w TUI. 📖
  pt: Uma pequena ferramenta de diário TUI. 📖
  ro: Un mic instrument de jurnalizare TUI. 📖
  ru: Небольшой инструмент для ведения дневника в терминале. 📖
  th: เครื่องมือบันทึกประจำวันแบบ TUI ขนาดเล็ก 📖
  tr: Küçük bir TUI günlük aracı. 📖
  uk: Невеликий інструмент для ведення щоденника в терміналі. 📖
  vi: Công cụ nhật ký TUI nhỏ gọn. 📖
x:
  source: https://github.com/NikolaDucak/caps-log
  eget: NikolaDucak/caps-log
rule:
  /eget:
    cmd: x eget NikolaDucak/caps-log
    reference: https://github.com/NikolaDucak/caps-log
binlist:
- 'caps-log'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
