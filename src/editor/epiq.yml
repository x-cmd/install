lang: TypeScript
homepage: https://github.com/ljtn/epiq
desc:
  cn: 本地优先、基于 git 的分布式 CLI 原生 issue 跟踪器
  en: Local first cli-native issue tracker - distributed and backed by git
x:
  source: https://github.com/ljtn/epiq
  eget: https://github.com/ljtn/epiq
rule:
  /eget:
    cmd: x eget ljtn/epiq
    reference: https://github.com/ljtn/epiq
binlist:
- epiq
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
