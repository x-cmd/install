lang: TypeScript
homepage: https://github.com/ljtn/epiq
desc:
  cn: 本地优先、基于 git 的分布式 CLI 原生 issue 跟踪器
  en: Local first cli-native issue tracker - distributed and backed by git
x:
  source: https://github.com/ljtn/epiq
  eget: https://github.com/ljtn/epiq
rule:
  /eget:
    cmd: x eget ljtn/epiq
    reference: https://github.com/ljtn/epiq
binlist:
- epiq
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 135 MB
          rating: 3
          desc:
            cn: 安装 135 MB
            en: 135 MB install
        download:
          estimate: 135 MB
          desc:
            cn: 约 135 MB 下载 (linux/x64)
            en: ~135 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
