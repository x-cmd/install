lang: JavaScript
homepage: https://github.com/docsifyjs/docsify-cli#readme
license: MIT
desc:
  cn: 文档生成器，支持热加载
  en: Document generator, supports hot loading
x:
  pkg:
    exist: true
  source: https://github.com/docsifyjs/docsify-cli#readme
rule:
  /x:
    cmd: x pkg use docsify-cli
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S docsify-cli
    reference: https://aur.archlinux.org/packages/docsify-cli
  /npm:
    cmd: npm i docsify-cli -g
    reference: https://github.com/docsifyjs/docsify-cli?tab=readme-ov-file#installation
    dsnap: docsify-cli
binlist:
- docsify-cli

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
