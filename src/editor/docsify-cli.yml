lang: JavaScript
homepage: https://github.com/docsifyjs/docsify-cli#readme
license: MIT
desc:
  cn: 文档生成器，支持热加载
  en: Document generator, supports hot loading
x:
  source: https://github.com/docsifyjs/docsify-cli#readme
  yay: docsify-cli
rule:
  /x:
    cmd: x pkg use docsify-cli
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S docsify-cli
    reference: https://aur.archlinux.org/packages/docsify-cli
  /npm:
    cmd: npm i docsify-cli -g
    reference: https://github.com/docsifyjs/docsify-cli?tab=readme-ov-file#installation
    dsnap: docsify-cli
binlist:
- docsify-cli

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
