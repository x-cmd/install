lang: Rust
homepage: https://github.com/emilien-jegou/oyui
desc:
  cn: 面向 Jujutsu (jj) 和 Git 的现代 TUI 合并工具与交互式 diff 编辑器
  en: Modern TUI merge tool and interactive diff editor for Jujutsu (jj) and Git
x:
  source: https://github.com/emilien-jegou/oyui
  eget: https://github.com/emilien-jegou/oyui
rule:
  /eget:
    cmd: x eget emilien-jegou/oyui
    reference: https://github.com/emilien-jegou/oyui
binlist:
- oyui
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
