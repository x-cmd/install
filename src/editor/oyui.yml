  th: เครื่องมือรวมแบบ TUI สมัยใหม่และตัวแก้ไข diff แบบโต้ตอบสำหรับ Jujutsu (jj) และ Git
  tr: Jujutsu (jj) ve Git için modern TUI birleştirme aracı ve etkileşimli diff düzenleyici
  uk: Сучасний TUI-інструмент для злиття та інтерактивний редактор diff для Jujutsu (jj) і Git
  vi: Công cụ hợp nhất TUI hiện đại và trình chỉnh sửa diff tương tác cho Jujutsu (jj) và Git
x:
  source: https://github.com/emilien-jegou/oyui
  eget: emilien-jegou/oyui
rule:
