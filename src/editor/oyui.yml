lang: Rust
homepage: https://github.com/emilien-jegou/oyui
desc:
  cn: 面向 Jujutsu (jj) 和 Git 的现代 TUI 合并工具与交互式 diff 编辑器
  en: Modern TUI merge tool and interactive diff editor for Jujutsu (jj) and Git
x:
  source: https://github.com/emilien-jegou/oyui
  eget: https://github.com/emilien-jegou/oyui
rule:
  /eget:
    cmd: x eget emilien-jegou/oyui
    reference: https://github.com/emilien-jegou/oyui
binlist:
- oyui
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 456 KB
          rating: 1
          desc:
            cn: 约 456 KB（估算）
            en: ~456 KB estimated
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
