lang: 'Rust'
homepage: 'https://github.com/ck-zhang/reddix'
license: 'MIT'
desc:
  cn: 为终端优化的 Reddit 客户端
  en: 'Reddix – Reddit, refined for the terminal.'
x:
  source: https://github.com/ck-zhang/reddix
  eget: https://github.com/ck-zhang/reddix
rule:
  /eget:
    cmd: x eget ck-zhang/reddix
    reference: https://github.com/ck-zhang/reddix
binlist:
- 'reddix'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
