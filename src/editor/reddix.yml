lang: 'Rust'
homepage: 'https://github.com/ck-zhang/reddix'
license: 'MIT'
desc:
  cn: 为终端优化的 Reddit 客户端
  en: 'Reddix – Reddit, refined for the terminal.'
x:
  source: https://github.com/ck-zhang/reddix
  eget: https://github.com/ck-zhang/reddix
rule:
  /eget:
    cmd: x eget ck-zhang/reddix
    reference: https://github.com/ck-zhang/reddix
binlist:
  - 'reddix'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
