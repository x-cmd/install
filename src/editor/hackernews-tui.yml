lang: 'Rust'
homepage: 'https://github.com/aome510/hackernews-TUI'
license: 'MIT'
desc:
  cn: 浏览 Hacker News 的终端 UI
  en: 'A Terminal UI to browse Hacker News'
x:
  source: https://github.com/aome510/hackernews-TUI
  eget: https://github.com/aome510/hackernews-TUI
rule:
  /cargo:
    cmd: 'cargo install hackernews_tui --locked'
    reference: https://github.com/aome510/hackernews-TUI
  arch/pacman:
    cmd: 'yay -S hackernews_tui'
    reference: https://github.com/aome510/hackernews-TUI
  /eget:
    cmd: x eget aome510/hackernews-TUI
    reference: https://github.com/aome510/hackernews-TUI
binlist:
- 'hackernews-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
