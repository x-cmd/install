lang: 'Rust'
homepage: 'https://github.com/aome510/hackernews-TUI'
license: 'MIT'
desc:
  cn: 浏览 Hacker News 的终端 UI
  en: 'A Terminal UI to browse Hacker News'
x:
  source: https://github.com/aome510/hackernews-TUI
  eget: https://github.com/aome510/hackernews-TUI
rule:
  /cargo:
    cmd: 'cargo install hackernews_tui --locked'
    reference: https://github.com/aome510/hackernews-TUI
  arch/pacman:
    cmd: 'yay -S hackernews_tui'
    reference: https://github.com/aome510/hackernews-TUI
  /eget:
    cmd: x eget aome510/hackernews-TUI
    reference: https://github.com/aome510/hackernews-TUI
binlist:
  - 'hackernews-tui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
