lang: TypeScript
homepage: https://github.com/upstash/context7
license: mit
desc:
  cn: 为 LLM 与 AI 代码编辑器提供最新代码文档的平台
  en: Context7 Platform -- Up-to-date code documentation for LLMs and AI code editors
x:
  source: https://github.com/upstash/context7
rule:
  /npm:
    cmd: npm install -g @upstash/context7-mcp
    reference: https://www.npmjs.com/package/@upstash/context7-mcp
    dsnap: '@upstash/context7-mcp'
binlist:
- context7

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
