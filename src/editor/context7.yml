lang: TypeScript
homepage: https://github.com/upstash/context7
license: mit
desc:
  cn: 为 LLM 与 AI 代码编辑器提供最新代码文档的平台
  en: Context7 Platform -- Up-to-date code documentation for LLMs and AI code editors
x:
  source: https://github.com/upstash/context7
rule:
  /npm:
    cmd: npm install -g @upstash/context7-mcp
    reference: https://www.npmjs.com/package/@upstash/context7-mcp
    dsnap: '@upstash/context7-mcp'
binlist:
- context7

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
