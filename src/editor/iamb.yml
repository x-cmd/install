lang: 'Rust'
homepage: https://github.com/ulyssa/iamb
license: 'Apache-2.0'
desc:
  cn: 面向 Vim 用户的 Matrix 客户端
  en: 'A Matrix client for Vim addicts'
x:
  source: https://github.com/ulyssa/iamb
  eget: https://github.com/ulyssa/iamb
rule:
  /eget:
    cmd: x eget ulyssa/iamb
    reference: https://github.com/ulyssa/iamb
binlist:
  - 'iamb'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 781 KB
          rating: 1
          desc:
            cn: 约 781 KB（估算）
            en: ~781 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
