lang: 'Rust'
homepage: https://github.com/ulyssa/iamb
license: 'Apache-2.0'
desc:
  cn: 面向 Vim 用户的 Matrix 客户端
  en: 'A Matrix client for Vim addicts'
x:
  source: https://github.com/ulyssa/iamb
  eget: https://github.com/ulyssa/iamb
rule:
  /eget:
    cmd: x eget ulyssa/iamb
    reference: https://github.com/ulyssa/iamb
binlist:
  - 'iamb'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
