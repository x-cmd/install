lang: 'Rust'
homepage: https://github.com/ulyssa/iamb
license: 'Apache-2.0'
desc:
  cn: 面向 Vim 用户的 Matrix 客户端
  en: 'A Matrix client for Vim addicts'
  cs: Matrix klient pro závislé na Vim
  de: Ein Matrix-Client für Vim-Enthusiasten
  es: Un cliente de Matrix para aficionados a Vim
