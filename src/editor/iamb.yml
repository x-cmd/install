  it: Un client Matrix per gli appassionati di Vim
  ja: Vim中毒者向けの Matrix クライアント
  ko: Vim 매니아를 위한 Matrix 클라이언트
  pl: Klient Matrix dla fanatyków Vima
  pt: Um cliente Matrix para viciados do Vim
  ro: Un client Matrix pentru fanii Vim
  ru: Клиент Matrix для поклонников Vim
  th: ไคลเอนต์ Matrix สำหรับคนหลงใจ Vim
  tr: Vim bağımlıları için bir Matrix istemcisi
  uk: Клієнт Matrix для шанувальників Vim
  vi: Ứng dụng Matrix cho những người nghiện Vim
x:
  source: https://github.com/ulyssa/iamb
  eget: ulyssa/iamb
rule:
  /eget:
    cmd: x eget ulyssa/iamb
    reference: https://github.com/ulyssa/iamb
binlist:
  - 'iamb'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 781 KB
          rating: 1
          desc:
            cn: 约 781 KB（估算）
            en: ~781 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
