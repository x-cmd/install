lang: Rust
homepage: https://github.com/ronilan/rusticon
desc:
  cn: Rust 编写的终端中鼠标驱动的 SVG favicon 编辑器
  en: A mouse driven SVG favicon editor for your terminal (written in Rust)
x:
  source: https://github.com/ronilan/rusticon
  eget: https://github.com/ronilan/rusticon
rule:
  /eget:
    cmd: x eget ronilan/rusticon
    reference: https://github.com/ronilan/rusticon
binlist:
- rusticon
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
