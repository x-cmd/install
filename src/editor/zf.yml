lang: 'Zig'
homepage: 'https://github.com/natecraddock/zf'
license: 'MIT'
desc:
  cn: 用于过滤文件路径的命令行模糊查找器和 zig 模块
  en: 'a commandline fuzzy finder and zig module designed for filtering filepaths'
x:
  source: https://github.com/natecraddock/zf
  eget: https://github.com/natecraddock/zf
rule:
  /eget:
    cmd: x eget natecraddock/zf
    reference: https://github.com/natecraddock/zf
binlist:
  - 'zf'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
