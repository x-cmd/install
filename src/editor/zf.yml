lang: 'Zig'
homepage: 'https://github.com/natecraddock/zf'
license: 'MIT'
desc:
  cn: 用于过滤文件路径的命令行模糊查找器和 zig 模块
  en: 'a commandline fuzzy finder and zig module designed for filtering filepaths'
x:
  source: https://github.com/natecraddock/zf
  eget: https://github.com/natecraddock/zf
rule:
  /eget:
    cmd: x eget natecraddock/zf
    reference: https://github.com/natecraddock/zf
binlist:
- 'zf'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 591 KB
          rating: 1
          desc:
            cn: 安装 591 KB
            en: 591 KB install
        download:
          estimate: 591 KB
          desc:
            cn: 约 591 KB 下载 (linux/x64)
            en: ~591 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
