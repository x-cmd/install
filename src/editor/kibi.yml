lang: Rust
homepage: https://github.com/ilai-deutel/kibi
license: Apache-2.0
desc:
  en: A text editor in ≤1024 lines of code, written in Rust
  cn: 用 Rust 编写的不超过 1024 行代码的文本编辑器
x:
  source: https://github.com/ilai-deutel/kibi
  dnf: kibi
  apk: kibi
  cargo: kibi
  yay: kibi
rule:
  /cargo:
    cmd: cargo install kibi
    reference: https://github.com/ilai-deutel/kibi?tab=readme-ov-file#installation
    dsnap: kibi
  arch/yay:
    cmd: yay -Syu kibi
    reference: https://github.com/ilai-deutel/kibi?tab=readme-ov-file#installation
  fedora/dnf:
    cmd: 'dnf copr enable atim/kibi -y

      dnf install kibi

      '
    reference: https://github.com/ilai-deutel/kibi?tab=readme-ov-file#installation
    dsnap: kibi
  netbsd/pkgin:
    cmd: pkgin install kibi
    reference: https://github.com/ilai-deutel/kibi?tab=readme-ov-file#installation
  alpine/apk:
    cmd: apk add kibi
    reference: https://github.com/ilai-deutel/kibi?tab=readme-ov-file#installation
    dsnap: kibi
binlist:
- kibi

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 226 KB
          rating: 1
          desc:
            cn: 安装 226 KB
            en: 226 KB install
        download:
          estimate: 226 KB
          desc:
            cn: 约 226 KB 下载 (linux/x64)
            en: ~226 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
