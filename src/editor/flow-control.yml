lang: Zig
homepage: https://github.com/neurocyte/flow
license: MIT
desc:
  en: A programmer's text editor
  cn: 程序员的文本编辑器
x:
  source: https://github.com/neurocyte/flow
  eget: https://github.com/neurocyte/flow
rule:
  /eget:
    cmd: x eget neurocyte/flow
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://flow-control.dev/install | sh
    reference: https://github.com/neurocyte/flow?tab=readme-ov-file#download--install
  arch/pacman:
    cmd: pacman -S flow-control
    reference: https://github.com/neurocyte/flow?tab=readme-ov-file#download--install
  darwin/brew:
    cmd: brew install flow-control
    reference: https://github.com/neurocyte/flow?tab=readme-ov-file#download--install
binlist:
- flow-control

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
