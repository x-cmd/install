lang: Zig
homepage: https://github.com/neurocyte/flow
license: MIT
desc:
  en: A programmer's text editor
  cn: 程序员的文本编辑器
  cs: Textový editor pro programátory
  de: Ein Texteditor für Programmierer
  es: Un editor de texto para programadores
  fr: Un éditeur de texte pour les programmeurs
  id: Editor teks untuk programmer
  it: Un editor di testo per programmatori
  ja: プログラマー向けのテキストエディタ
  ko: 프로그래머를 위한 텍스트 편집기
  pl: Edytor tekstu dla programistów
  pt: Um editor de texto para programadores
  ro: Un editor de text pentru programatori
  ru: Текстовый редактор для программистов
  th: โปรแกรมแก้ไขข้อความสำหรับโปรแกรมเมอร์
  tr: Programcılar için metin düzenleyici
  uk: Текстовий редактор для програмістів
  vi: Trình soạn thảo văn bản dành cho lập trình viên
x:
  source: https://github.com/neurocyte/flow
  eget: neurocyte/flow
  brew: flow-control
  pacman: flow-control
rule:
  /eget:
    cmd: x eget neurocyte/flow
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://flow-control.dev/install | sh
    reference: https://github.com/neurocyte/flow?tab=readme-ov-file#download--install
  arch/pacman:
    cmd: pacman -S flow-control
    reference: https://github.com/neurocyte/flow?tab=readme-ov-file#download--install
  darwin/brew:
    cmd: brew install flow-control
    reference: https://github.com/neurocyte/flow?tab=readme-ov-file#download--install
binlist:
- flow-control

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
