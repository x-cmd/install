lang: 'Python'
homepage: 'https://pypi.org/project/textual-paint/'
license: 'MIT'
desc:
  cn: 在终端里复刻 MS Paint 的字符艺术编辑器，基于 Textual 框架
  en: ':art: MS Paint in your terminal.'
rule:
  /pip:
    cmd: 'pip install textual-paint'
    reference: https://pypi.org/project/textual-paint/
    dsnap: textual-paint

x:
  pip: textual-paint'
binlist:
  - 'textual-paint'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
