lang: 'Python'
homepage: 'https://pypi.org/project/textual-paint/'
license: 'MIT'
desc:
  cn: 在终端里复刻 MS Paint 的字符艺术编辑器，基于 Textual 框架
  en: ':art: MS Paint in your terminal.'
rule:
  /pip:
    cmd: 'pip install textual-paint'
    reference: https://pypi.org/project/textual-paint/
    dsnap: textual-paint
binlist:
  - 'textual-paint'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
