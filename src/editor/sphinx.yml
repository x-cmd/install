lang: Python
homepage: https://github.com/sphinx-doc/sphinx
desc:
  cn: Sphinx 可以轻松创建智能且美观的文档。
  en: Sphinx makes it easy to create intelligent and beautiful documentation.
  cs: Sphinx usnadňuje vytváření chytré a krásné dokumentace.
  de: Sphinx erleichtert das Erstellen intelligenter und schöner Dokumentation.
  es: Sphinx facilita crear documentación inteligente y bella.
  fr: Sphinx facilite la création d'une documentation intelligente et soignée.
  id: Sphinx memudahkan pembuatan dokumentasi yang cerdas dan indah.
  it: Sphinx rende facile creare documentazione intelligente e bella.
  ja: Sphinx は知的で美しいドキュメントの作成を簡単にしてくれる。
  ko: Sphinx는 똑똑하고 아름다운 문서를 쉽게 만들 수 있게 해준다.
  pl: Sphinx ułatwia tworzenie inteligentnej i pięknej dokumentacji.
  pt: O Sphinx facilita criar documentação inteligente e bonita.
  ro: Sphinx face ușoară crearea unei documentații inteligente și frumoase.
  ru: Sphinx упрощает создание умной и красивой документации.
  th: Sphinx ช่วยให้สร้างเอกสารอัจฉริยะและสวยงามได้อย่างง่ายดาย
  tr: Sphinx akıllı ve güzel belgeler oluşturmayı kolaylaştırır.
  uk: Sphinx полегшує створення розумної та красивої документації.
  vi: Sphinx giúp dễ dàng tạo tài liệu thông minh và đẹp mắt.
x:
  source: https://github.com/sphinx-doc/sphinx
  apt: python3-sphinx
  dnf: python-sphinx
  brew: sphinx-doc
  apt-get: python3-sphinx
  yum: python-sphinx
  port: py39-sphinx
  choco: sphinx
rule:
  /x:
    cmd: x pkg use sphinx
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install -U sphinx
    reference: https://www.sphinx-doc.org/en/master/usage/installation.html#installation-from-pypi
    dsnap: sphinx
  debian/apt:
    cmd: sudo apt-get install python3-sphinx
    reference: https://www.sphinx-doc.org/en/master/usage/installation.html#debian-ubuntu
    dsnap: python3-sphinx
  ubuntu/apt:
    cmd: sudo apt-get install python3-sphinx
    reference: https://www.sphinx-doc.org/en/master/usage/installation.html#debian-ubuntu
    dsnap: python3-sphinx
  rhel/yum:
    cmd: sudo yum install python-sphinx
    reference: https://www.sphinx-doc.org/en/master/usage/installation.html#rhel-centos
  centos/yum:
    cmd: sudo yum install python-sphinx
    reference: https://www.sphinx-doc.org/en/master/usage/installation.html#rhel-centos
  darwin/brew:
    cmd: brew install sphinx-doc
    reference: https://www.sphinx-doc.org/en/master/usage/installation.html#macos
  darwin/port:
    cmd: sudo port selfupdate && sudo port install py39-sphinx
    reference: https://www.sphinx-doc.org/en/master/usage/installation.html#macports
  (win|wsl2)/choco:
    cmd: x choco install sphinx
    reference: https://www.sphinx-doc.org/en/master/usage/installation.html#chocolatey
binlist:
- sphinx
license: NOASSERTION

# complicated
footprint:
