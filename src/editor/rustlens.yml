lang: 'Rust'
homepage: https://github.com/yashksaini-coder/Rustlens
license: 'MIT'
desc:
  cn: 解析 Rust 源码,在终端中交互浏览函数、结构体、枚举、trait 等
  en: 'Your Rust codebase, revealed It parses your Rust source files and provides an interactive interface to browse functions, structs, enums, traits, and more — all inside your terminal.'
x:
  source: https://github.com/yashksaini-coder/Rustlens
  eget: https://github.com/yashksaini-coder/Rustlens
rule:
  /eget:
    cmd: x eget yashksaini-coder/Rustlens
    reference: https://github.com/yashksaini-coder/Rustlens
binlist:
- 'rustlens'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
