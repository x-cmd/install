lang: 'C++'
homepage: https://github.com/mawww/kakoune
license: 'Unlicense'
desc:
  cn: 面向更优代码编辑器的实验性项目
  en: 'mawww''s experiment for a better code editor'
x:
  source: https://github.com/mawww/kakoune
  eget: https://github.com/mawww/kakoune
rule:
  /eget:
    cmd: x eget mawww/kakoune
    reference: https://github.com/mawww/kakoune
binlist:
  - 'kakoune'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.6 MB
          rating: 1
          desc:
            cn: 约 2.6 MB（估算）
            en: ~2.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
