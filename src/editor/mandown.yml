lang: 'C'
homepage: 'https://github.com/Titor8115/mandown'
license: 'GPL-3.0'
desc:
  cn: 受 man 启发的 Markdown 查看器
  en: 'man-page inspired Markdown viewer'
x:
  source: https://github.com/Titor8115/mandown
  eget: https://github.com/Titor8115/mandown
rule:
  /eget:
    cmd: x eget Titor8115/mandown
    reference: https://github.com/Titor8115/mandown
binlist:
  - 'mandown'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
