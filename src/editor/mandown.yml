lang: 'C'
homepage: 'https://github.com/Titor8115/mandown'
license: 'GPL-3.0'
desc:
  cn: 受 man 启发的 Markdown 查看器
  en: 'man-page inspired Markdown viewer'
x:
  source: https://github.com/Titor8115/mandown
  eget: Titor8115/mandown
rule:
  /eget:
    cmd: x eget Titor8115/mandown
    reference: https://github.com/Titor8115/mandown
binlist:
  - 'mandown'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 160 KB
          rating: 1
          desc:
            cn: 约 160 KB（估算）
            en: ~160 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
