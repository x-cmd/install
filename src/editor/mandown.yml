lang: 'C'
homepage: 'https://github.com/Titor8115/mandown'
license: 'GPL-3.0'
desc:
  cn: 受 man 启发的 Markdown 查看器
  en: 'man-page inspired Markdown viewer'
  cs: Prohlížeč Markdown inspirovaný man stránkami
  de: Ein Markdown-Betrachter im Stil von man-Seiten
  es: un visor de Markdown inspirado en las páginas man
  fr: une visionneuse Markdown inspirée des pages man
  id: Penampil Markdown terinspirasi halaman man
  it: un visualizzatore Markdown ispirato alle pagine man
  ja: man ページにインスパイアされた Markdown ビューア
  ko: man 페이지를 참고한 Markdown 뷰어
  pl: Przeglądarka Markdown inspirowana stronami man
  pt: um visualizador de Markdown inspirado nas páginas man
  ro: o vizualizator Markdown inspirat de paginile man
  ru: Просмотрщик Markdown, вдохновлённый страницами man
  th: โปรแกรมดู Markdown ได้แรงบันดาลใจจาก man page
  tr: man sayfalarından esinlenen bir Markdown görüntüleyici
  uk: Переглядач Markdown, натхненний сторінками man
  vi: Trình xem Markdown lấy cảm hứng từ trang man
x:
  source: https://github.com/Titor8115/mandown
  eget: Titor8115/mandown
rule:
  /eget:
    cmd: x eget Titor8115/mandown
    reference: https://github.com/Titor8115/mandown
binlist:
  - 'mandown'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 160 KB
          rating: 1
          desc:
            cn: 约 160 KB（估算）
            en: ~160 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
