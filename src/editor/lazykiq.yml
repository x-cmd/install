lang: 'Go'
homepage: https://github.com/kpumuk/lazykiq
license: 'MIT'
desc:
  cn: Sidekiq 的富终端 UI
  en: 'rich terminal UI for Sidekiq'
x:
  source: https://github.com/kpumuk/lazykiq
  eget: https://github.com/kpumuk/lazykiq
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/kpumuk/lazykiq
  /eget:
    cmd: x eget kpumuk/lazykiq
    reference: https://github.com/kpumuk/lazykiq
binlist:
- 'lazykiq'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
