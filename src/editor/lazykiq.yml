lang: 'Go'
homepage: https://github.com/kpumuk/lazykiq
license: 'MIT'
desc:
  cn: Sidekiq 的富终端 UI
  en: 'rich terminal UI for Sidekiq'
x:
  source: https://github.com/kpumuk/lazykiq
  eget: https://github.com/kpumuk/lazykiq
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/kpumuk/lazykiq
  /eget:
    cmd: x eget kpumuk/lazykiq
    reference: https://github.com/kpumuk/lazykiq
binlist:
  - 'lazykiq'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
