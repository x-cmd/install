lang: 'Rust'
homepage: 'https://github.com/tlipinski/rura'
license: 'MIT'
desc:
  cn: 用于构建 shell 管道的交互式 TUI 草稿本
  en: 'Interactive TUI scratchpad for building shell pipelines'
x:
  source: https://github.com/tlipinski/rura
  eget: https://github.com/tlipinski/rura
rule:
  /eget:
    cmd: x eget tlipinski/rura
    reference: https://github.com/tlipinski/rura
binlist:
- 'rura'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 284 KB
          rating: 1
          desc:
            cn: 约 284 KB（估算）
            en: ~284 KB estimated
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
