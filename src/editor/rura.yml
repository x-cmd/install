lang: 'Rust'
homepage: 'https://github.com/tlipinski/rura'
license: 'MIT'
desc:
  cn: 用于构建 shell 管道的交互式 TUI 草稿本
  en: 'Interactive TUI scratchpad for building shell pipelines'
x:
  source: https://github.com/tlipinski/rura
  eget: https://github.com/tlipinski/rura
rule:
  /eget:
    cmd: x eget tlipinski/rura
    reference: https://github.com/tlipinski/rura
binlist:
  - 'rura'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
