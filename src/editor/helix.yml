lang: Rust
homepage: https://github.com/helix-editor/helix
license: MPL-2.0
desc:
  cn: 一款后现代的多模态文本编辑器，支持多窗口编辑
  en: A post-modern multimodal text editor that supports multi window editing
  cs: Postmoderní multimodální textový editor s podporou editace ve více oknech
  de: Ein postmoderner multimodaler Texteditor, der die Bearbeitung in mehreren Fenstern unterstützt
  es: Un editor de texto multimodal posmoderno que admite edición en varias ventanas
  fr: Un éditeur de texte multimodal postmoderne prenant en charge l'édition multi-fenêtre
  id: Editor teks multimodal postmodern yang mendukung pengeditan multi jendela
  it: Un editor di testo multimodale post-moderno che supporta l'editing multi-finestra
  ja: マルチウィンドウ編集に対応したポストモダンのマルチモーダルテキストエディタ
  ko: 다중 창 편집을 지원하는 포스트모던 멀티모달 텍스트 편집기
  pl: Postmoderny multimodalny edytor tekstu z obsługą edycji w wielu oknach
  pt: Um editor de texto multimodal pós-moderno que suporta edição em várias janelas
  ro: Un editor de text multimodal postmodern care acceptă editarea în mai multe ferestre
  ru: Постмодернистский мультимодальный текстовый редактор с поддержкой редактирования в нескольких окнах
  th: โปรแกรมแก้ไขข้อความมัลติโมดัลยุคโพสต์โมเดิร์นที่รองรับการแก้ไขแบบหลายหน้าต่าง
  tr: Çoklu pencere düzenlemeyi destekleyen postmodern, çok modlu bir metin düzenleyici
  uk: Постмодерністський мультимодальний текстовий редактор із підтримкою редагування у кількох вікнах
  vi: Trình soạn thảo văn bản đa phương thức hậu hiện đại, hỗ trợ chỉnh sửa nhiều cửa sổ
x:
  source: https://github.com/helix-editor/helix
  eget: helix-editor/helix
  apt: helix
  dnf: helix
  brew: helix
  pacman: helix
  scoop: helix
  choco: helix
  winget: Helix.Helix
rule:
  /eget:
    cmd: x eget helix-editor/helix
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use helix
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install helix
    reference: https://docs.helix-editor.com/install.html#macos
  debian/apt:
    cmd: 'sudo add-apt-repository ppa:maveonair/helix-editor \

      && sudo apt update \

      && sudo apt install helix

      '
    reference: https://docs.helix-editor.com/install.html#ubuntu
    dsnap: helix
  ubuntu/apt:
    cmd: 'sudo add-apt-repository ppa:maveonair/helix-editor \

      && sudo apt update \

      && sudo apt install helix

      '
    reference: https://docs.helix-editor.com/install.html#ubuntu
    dsnap: helix
  arch/pacman:
    cmd: sudo pacman -S helix
    reference: https://docs.helix-editor.com/install.html#arch-linux-extra
  kali/apt:
    cmd: 'sudo add-apt-repository ppa:maveonair/helix-editor \

      && sudo apt update \

      && sudo apt install helix

      '
    reference: https://docs.helix-editor.com/install.html#ubuntu
    dsnap: helix
  fedora/dnf:
    cmd: 'sudo dnf copr enable varlad/helix \

      && sudo dnf install helix

      '
    reference: https://docs.helix-editor.com/install.html#fedorarhel
    dsnap: helix
  rhel/dnf:
    cmd: 'sudo dnf copr enable varlad/helix \

      && sudo dnf install helix

      '
    reference: https://docs.helix-editor.com/install.html#fedorarhel
  raspbian/apt:
    cmd: 'sudo add-apt-repository ppa:maveonair/helix-editor \

      && sudo apt update \

      && sudo apt install helix

      '
    reference: https://docs.helix-editor.com/install.html#ubuntu
  (win|wsl2)/winget:
    cmd: x winget install Helix.Helix
    reference: https://docs.helix-editor.com/install.html#winget
  (win|wsl2)/scoop:
    cmd: x scoop install helix
    reference: https://docs.helix-editor.com/install.html#scoop
  (win|wsl2)/choco:
    cmd: x choco install helix
    reference: https://docs.helix-editor.com/install.html#chocolatey
  nix/cachix:
    cmd: cachix use helix
    reference: https://docs.helix-editor.com/install.html#nixos
  /snap:
    cmd: snap install --classic helix
    reference: https://docs.helix-editor.com/install.html#snap
  win/msys2:
    cmd: sudo pacman -S mingw-w64-ucrt-x86_64-helix
    reference: https://docs.helix-editor.com/install.html#msys2
binlist:
- helix

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 安装 16 MB
            en: 16 MB install
        download:
          estimate: 16 MB
          desc:
            cn: 约 16 MB 下载 (linux/x64)
            en: ~16 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
