lang: Rust
homepage: https://github.com/helix-editor/helix
license: MPL-2.0
desc:
  cn: 一款后现代的多模态文本编辑器，支持多窗口编辑
  en: A post-modern multimodal text editor that supports multi window editing
x:
  pkg:
    exist: true
  source: https://github.com/helix-editor/helix
  eget: https://github.com/helix-editor/helix
rule:
  /eget:
    cmd: x eget helix-editor/helix
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use helix
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install helix
    reference: https://docs.helix-editor.com/install.html#macos
  debian/apt:
    cmd: 'sudo add-apt-repository ppa:maveonair/helix-editor \

      && sudo apt update \

      && sudo apt install helix

      '
    reference: https://docs.helix-editor.com/install.html#ubuntu
    dsnap: helix
  ubuntu/apt:
    cmd: 'sudo add-apt-repository ppa:maveonair/helix-editor \

      && sudo apt update \

      && sudo apt install helix

      '
    reference: https://docs.helix-editor.com/install.html#ubuntu
    dsnap: helix
  arch/pacman:
    cmd: sudo pacman -S helix
    reference: https://docs.helix-editor.com/install.html#arch-linux-extra
  kali/apt:
    cmd: 'sudo add-apt-repository ppa:maveonair/helix-editor \

      && sudo apt update \

      && sudo apt install helix

      '
    reference: https://docs.helix-editor.com/install.html#ubuntu
    dsnap: helix
  fedora/dnf:
    cmd: 'sudo dnf copr enable varlad/helix \

      && sudo dnf install helix

      '
    reference: https://docs.helix-editor.com/install.html#fedorarhel
    dsnap: helix
  rhel/dnf:
    cmd: 'sudo dnf copr enable varlad/helix \

      && sudo dnf install helix

      '
    reference: https://docs.helix-editor.com/install.html#fedorarhel
  raspbian/apt:
    cmd: 'sudo add-apt-repository ppa:maveonair/helix-editor \

      && sudo apt update \

      && sudo apt install helix

      '
    reference: https://docs.helix-editor.com/install.html#ubuntu
  (win|wsl2)/winget:
    cmd: x winget install Helix.Helix
    reference: https://docs.helix-editor.com/install.html#winget
  (win|wsl2)/scoop:
    cmd: x scoop install helix
    reference: https://docs.helix-editor.com/install.html#scoop
  (win|wsl2)/choco:
    cmd: x choco install helix
    reference: https://docs.helix-editor.com/install.html#chocolatey
  nix/cachix:
    cmd: cachix use helix
    reference: https://docs.helix-editor.com/install.html#nixos
  /snap:
    cmd: snap install --classic helix
    reference: https://docs.helix-editor.com/install.html#snap
  win/msys2:
    cmd: sudo pacman -S mingw-w64-ucrt-x86_64-helix
    reference: https://docs.helix-editor.com/install.html#msys2
binlist:
- helix

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
