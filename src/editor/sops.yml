lang: Go
homepage: https://github.com/mozilla/sops
license: MPL-2.0
desc:
  cn: 加密文件编辑器
  en: Encrypted file editor
x:
  pkg:
    exist: true
  source: https://github.com/mozilla/sops
rule:
  /x:
    cmd: x pkg use sops
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S sops-git
    reference: https://aur.archlinux.org/packages/sops-git
  /asdf:
    cmd: x asdf use sops
    reference: https://github.com/feniix/asdf-sops
  /git:
    cmd: 'mkdir -p $GOPATH/src/github.com/getsops/sops/ \

      && git clone https://github.com/getsops/sops.git $GOPATH/src/github.com/getsops/sops/  \

      && cd $GOPATH/src/github.com/getsops/sops/  \

      && make install

      '
    reference: https://github.com/getsops/sops?tab=readme-ov-file#12development-branch
binlist:
- sops

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
