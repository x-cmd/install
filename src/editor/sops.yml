lang: Go
homepage: https://github.com/mozilla/sops
license: MPL-2.0
desc:
  cn: 加密文件编辑器
  en: Encrypted file editor
x:
  pkg:
    exist: true
  source: https://github.com/mozilla/sops
rule:
  /x:
    cmd: x pkg use sops
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S sops-git
    reference: https://aur.archlinux.org/packages/sops-git
  /asdf:
    cmd: x asdf use sops
    reference: https://github.com/feniix/asdf-sops
  /git:
    cmd: 'mkdir -p $GOPATH/src/github.com/getsops/sops/ \

      && git clone https://github.com/getsops/sops.git $GOPATH/src/github.com/getsops/sops/  \

      && cd $GOPATH/src/github.com/getsops/sops/  \

      && make install

      '
    reference: https://github.com/getsops/sops?tab=readme-ov-file#12development-branch
binlist:
- sops

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 安装 50 MB
            en: 50 MB install
        download:
          estimate: 50 MB
          desc:
            cn: 约 50 MB 下载 (linux/x64)
            en: ~50 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
