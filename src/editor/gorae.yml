lang: 'Go'
homepage: 'https://github.com/Han8931/gorae'
license: 'MIT'
desc:
  cn: 整理 PDF/EPUB 文档的终端 TUI，支持类 Vim 导航与全文搜索
  en: 'gorae is a terminal TUI program for organizing PDF/EPUB documents, featuring vim-like navigation, metadata management and full-text search.'
x:
  source: https://github.com/Han8931/gorae
  eget: https://github.com/Han8931/gorae
rule:
  arch/pacman:
    cmd: 'yay -S gorae'
    reference: https://github.com/Han8931/gorae
  /eget:
    cmd: x eget Han8931/gorae
    reference: https://github.com/Han8931/gorae
binlist:
  - 'gorae'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 约 1.4 MB（估算）
            en: ~1.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
