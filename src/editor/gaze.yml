lang: Go
homepage: https://github.com/wtetsu/gaze
license: MIT
desc:
  en: Run the relevant command immediately after saving the file.
  cn: 在保存文件后立即运行相关命令
x:
  source: https://github.com/wtetsu/gaze
  eget: https://github.com/wtetsu/gaze
rule:
  /eget:
    cmd: x eget wtetsu/gaze
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install gaze
    reference: https://github.com/wtetsu/gaze?tab=readme-ov-file#homebrew-macos
binlist:
- gaze

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 245 KB
          rating: 1
          desc:
            cn: 约 245 KB（估算）
            en: ~245 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
