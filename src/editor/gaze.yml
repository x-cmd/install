lang: Go
homepage: https://github.com/wtetsu/gaze
license: MIT
desc:
  en: Run the relevant command immediately after saving the file.
  cn: 在保存文件后立即运行相关命令
  cs: Spusť příslušný příkaz ihned po uložení souboru.
  de: Den relevanten Befehl sofort nach dem Speichern der Datei ausführen.
  es: Ejecuta el comando relevante inmediatamente después de guardar el archivo.
  fr: Exécute la commande pertinente juste après l'enregistrement du fichier.
  id: Jalankan perintah terkait segera setelah menyimpan file.
  it: Esegui il comando pertinente subito dopo aver salvato il file.
  ja: ファイルを保存した直後に対応するコマンドを実行します。
  ko: 파일을 저장한 직후 관련 명령을 실행합니다.
  pl: Uruchom odpowiednie polecenie natychmiast po zapisaniu pliku.
  pt: Executa o comando relevante imediatamente após salvar o arquivo.
  ro: Rulează comanda relevantă imediat după salvarea fișierului.
  ru: Запускать соответствующую команду сразу после сохранения файла.
  th: เรียกคำสั่งที่เกี่ยวข้องทันทีหลังบันทึกไฟล์
  tr: Dosyayı kaydettikten hemen sonra ilgili komutu çalıştırır.
  uk: Запускати відповідну команду одразу після збереження файлу.
  vi: Chạy lệnh liên quan ngay sau khi lưu tệp.
x:
  source: https://github.com/wtetsu/gaze
  eget: wtetsu/gaze
  brew: gaze
rule:
  /eget:
    cmd: x eget wtetsu/gaze
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install gaze
    reference: https://github.com/wtetsu/gaze?tab=readme-ov-file#homebrew-macos
binlist:
- gaze

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/arm64)
            en: ~1 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
