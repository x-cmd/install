lang: 'Python'
homepage: https://github.com/joouha/euporie
license: 'MIT'
desc:
  cn: 终端中的 Jupyter 笔记本
  en: 'Jupyter notebooks in the terminal'
x:
  source: https://github.com/joouha/euporie
  eget: https://github.com/joouha/euporie
rule:
  /eget:
    cmd: x eget joouha/euporie
    reference: https://github.com/joouha/euporie
binlist:
  - 'euporie'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
