lang: 'Python'
homepage: https://github.com/joouha/euporie
license: 'MIT'
desc:
  cn: 终端中的 Jupyter 笔记本
  en: 'Jupyter notebooks in the terminal'
x:
  source: https://github.com/joouha/euporie
  eget: https://github.com/joouha/euporie
rule:
  /eget:
    cmd: x eget joouha/euporie
    reference: https://github.com/joouha/euporie
binlist:
  - 'euporie'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 151 KB
          rating: 1
          desc:
            cn: 约 151 KB（估算）
            en: ~151 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
