lang: 'Rust'
homepage: 'https://github.com/huseyinbabal/taws'
license: 'MIT'
desc:
  cn: 基于终端的 AWS 资源查看与管理工具
  en: 'Terminal UI for AWS (taws) - A terminal-based AWS resource viewer and manager'
x:
  source: https://github.com/huseyinbabal/taws
  eget: huseyinbabal/taws
rule:
  /eget:
    cmd: x eget huseyinbabal/taws
    reference: https://github.com/huseyinbabal/taws
binlist:
- 'taws'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
