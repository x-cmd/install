lang: C
homepage: https://github.com/vim/vim
license: Vim
desc:
  cn: Vim 是旧的 UNIX 编辑器 Vi 的一个大大改进的版本
  en: Vim is a greatly improved version of the good old UNIX editor Vi
  cs: Vim je greatly vylepšená verze starého dobrého editoru UNIX Vi
  de: Vim ist eine stark verbesserte Version des guten alten UNIX-Editors Vi
  es: Vim es una versión muy mejorada del buen y viejo editor de UNIX Vi
  fr: Vim est une version bien améliorée du venerable éditeur UNIX Vi
  id: Vim adalah versi yang jauh lebih baik dari editor UNIX lama yang bagus, Vi
  it: Vim è una versione molto migliorata del vecchio editor UNIX Vi
  ja: Vim は古き良き UNIX エディタ Vi の大きく改良されたバージョンです
  ko: Vim은 오래된 UNIX 편집기 Vi를 크게 개선한 버전입니다
  pl: Vim to znacznie ulepszona wersja starego dobrego edytora UNIX Vi
  pt: Vim é uma versão muito aprimorada do antigo e bom editor UNIX Vi
  ro: Vim este o versiune mult îmbunătățită a bătrânului editor UNIX Vi
  ru: Vim — значительно улучшенная версия старого доброго редактора UNIX Vi
  th: Vim เป็นเวอร์ชันที่ดีขึ้นมากของโปรแกรมแก้ไขข้อความ UNIX รุ่นเก่าอย่าง Vi
  tr: Vim, eski UNIX düzenleyicisi Vi'nin büyük ölçüde geliştirilmiş bir sürümüdür
  uk: Vim — значно покращена версія старого доброго редактора UNIX Vi
  vi: Vim là phiên bản được cải tiến đáng kể của trình soạn thảo UNIX Vi xưa cũ
x:
  source: https://github.com/vim/vim
  apt: vim
  dnf: vim
  brew: vim
  pacman: vim
  apk: vim
  apt-get: vim
  yum: vim
  zypper: vim
  emerge: app-editors/vim
  asdf: vim
rule:
  /asdf:
    cmd: x asdf use vim
    reference: https://github.com/tsuyoshicho/asdf-vim
  darwin/brew:
    cmd: brew install vim
    reference: https://formulae.brew.sh/formula/vim#default
  debian/apt:
    cmd: sudo apt-get install vim
    reference: https://command-not-found.com/vim
    dsnap: vim
  ubuntu/apt:
    cmd: sudo apt-get install vim
    reference: https://command-not-found.com/vim
    dsnap: vim
  alpine/apk:
    cmd: apk add vim
    reference: https://command-not-found.com/vim
    dsnap: vim
  arch/pacman:
    cmd: sudo pacman -S vim
    reference: https://command-not-found.com/vim
  kali/apt:
    cmd: sudo apt-get install vim
    reference: https://command-not-found.com/vim
    dsnap: vim
  centos/yum:
    cmd: sudo yum install vim
    reference: https://command-not-found.com/vim
  fedora/dnf:
    cmd: sudo dnf install vim
    reference: https://command-not-found.com/vim
    dsnap: vim
  raspbian/apt:
    cmd: sudo apt-get install vim
    reference: https://command-not-found.com/vim
  gentoo/emerge:
    cmd: sudo emerge --ask app-editors/vim
    reference: https://wiki.gentoo.org/wiki/Vim
  opensuse/zypper:
    cmd: sudo zypper install vim
    reference: https://www.cyberciti.biz/faq/how-to-install-vim-on-opensuse-suse-linux-using-zypper/
  freebsd/pkg:
    cmd: pkg install vim
    reference: https://www.cyberciti.biz/faq/howto-install-vim-text-editor-under-freebsd/
  openbsd/pkg_add:
    cmd: pkg_add vim
    reference: https://rodolfo.io/openbsd/vim/2015/02/20/install-vim-openbsd.html
binlist:
- vim

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 ~/.vimrc, ~/.vim/
          en: Reads ~/.vimrc, ~/.vim/
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB (apt vim-nox)
            en: 4 MB install (apt vim-nox)
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (apt)
            en: ~4 MB download (apt)
      paths:
        data: []
        config:
          - ~/.vimrc
          - ~/.vim/
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（实测，RSS=9720 KB）
          en: 10 MB (measured, RSS=9720 KB)
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
