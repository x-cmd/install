lang: Go
homepage: https://github.com/Yakitrak/obsidian-cli
license: MIT
desc:
  cn: 在终端中与 Obsidian 交互。打开、搜索、创建、更新、移动和删除笔记
  en: Interact with Obsidian in the terminal. Open, search, create, update, move and delete notes
  cs: Pracujte s Obsidianem v terminálu. Otevírejte, hledejte, vytvářejte, upravujte, přesouvejte a mažte poznámky
  de: Arbeite mit Obsidian im Terminal. Notizen öffnen, suchen, erstellen, aktualisieren, verschieben und löschen
  es: Interactúa con Obsidian en la terminal. Abre, busca, crea, actualiza, mueve y elimina notas
  fr: Interagissez avec Obsidian dans le terminal. Ouvrez, recherchez, créez, mettez à jour, déplacez et supprimez des notes
  id: Bekerja dengan Obsidian di terminal. Buka, cari, buat, perbarui, pindahkan, dan hapus catatan
  it: Interagisci con Obsidian nel terminale. Apri, cerca, crea, aggiorna, sposta ed elimina note
  ja: ターミナルで Obsidian を操作します。ノートを開く、検索、作成、更新、移動、削除できます
  ko: 터미널에서 Obsidian과 상호작용하세요. 노트 열기, 검색, 만들기, 업데이트, 이동, 삭제
  pl: Interakcja z Obsidian w terminalu. Otwieraj, szukaj, twórz, aktualizuj, przenosz i usuwaj notatki
  pt: Interaja com o Obsidian no terminal. Abra, pesquise, crie, atualize, mova e exclua notas
  ro: Interacționează cu Obsidian în terminal. Deschide, caută, creează, actualizează, mută și șterge notițe
  ru: Взаимодействуйте с Obsidian в терминале. Открывайте, ищите, создавайте, обновляйте, перемещайте и удаляйте заметки
  th: โต้ตอบกับ Obsidian ในเทอร์มินัล เปิด ค้นหา สร้าง อัปเดต ย้าย และลบโน้ต
  tr: Terminalde Obsidian ile etkileşim kurun. Notları açın, arayın, oluşturun, güncelleyin, taşıyın ve silin
  uk: Взаємодійствуйте з Obsidian у терміналі. Відкривайте, шукайте, створюйте, оновлюйте, переміщуйте та видаляйте нотатки
  vi: Tương tác với Obsidian trong terminal. Mở, tìm kiếm, tạo, cập nhật, di chuyển và xóa ghi chú
x:
  source: https://github.com/Yakitrak/obsidian-cli
  eget: Yakitrak/obsidian-cli
  brew: yakitrak/yakitrak/obs
  scoop: obs
  yay: obsidian-cli-git
rule:
  /eget:
    cmd: x eget Yakitrak/obsidian-cli
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use obs
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S obsidian-cli-git
    reference: https://aur.archlinux.org/packages/obsidian-cli-git
  darwin/brew:
    cmd: 'brew tap yakitrak/yakitrak && \

      brew install yakitrak/yakitrak/obs

      '
    reference: https://yakitrak.github.io/obs/docs/install/mac-and-linux
  linux/brew:
    cmd: 'brew tap yakitrak/yakitrak && \

      brew install yakitrak/yakitrak/obs

      '
    reference: https://yakitrak.github.io/obs/docs/install/mac-and-linux
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add scoop-yakitrak https://github.com/yakitrak/scoop-yakitrak.git && \

      x scoop install obs

      '
    reference: https://yakitrak.github.io/obs/docs/install/windows
binlist:
- obs

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
