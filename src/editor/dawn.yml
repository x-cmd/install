lang: 'C'
homepage: 'https://github.com/andrewmd5/dawn'
license: 'MIT'
desc:
  cn: 无干扰的写作环境，随时开始创作
  en: 'A distraction-free writing environment; draft anything, write now.'
x:
  source: https://github.com/andrewmd5/dawn
  eget: https://github.com/andrewmd5/dawn
rule:
  /eget:
    cmd: x eget andrewmd5/dawn
    reference: https://github.com/andrewmd5/dawn
binlist:
- 'dawn'

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.9 MB
          rating: 1
          desc:
            cn: 安装 1.9 MB
            en: 1.9 MB install
        download:
          estimate: 727 KB
          desc:
            cn: 约 727 KB 下载 (linux/x64)
            en: ~727 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
