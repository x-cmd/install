lang: 'C'
homepage: 'https://github.com/andrewmd5/dawn'
license: 'MIT'
desc:
  cn: 无干扰的写作环境，随时开始创作
  en: 'A distraction-free writing environment; draft anything, write now.'
  cs: Prostředí pro psaní bez rozptýlení; začněte psát cokoliv, pište hned.
  de: Eine ablenkungsfreie Schreibumgebung; alles entwerfen, jetzt schreiben.
  es: Un entorno de escritura sin distracciones; redacta cualquier cosa, escribe ahora.
  fr: Un environnement d'écriture sans distraction ; rédigez n'importe quoi, écrivez maintenant.
  id: Lingkungan menulis tanpa gangguan; draf apa saja, tulis sekarang.
  it: Un ambiente di scrittura senza distrazioni; abbozza qualsiasi cosa, scrivi adesso.
  ja: 集中できる執筆環境。何でも下書きして、今すぐ書き始めましょう。
  ko: 방해 없는 글쓰기 환경. 무엇이든 초안을 쓰고 지금 바로 쓰세요.
  pl: Środowisko do pisania bez rozpraszaczy; napisz szkic czegokolwiek, pisz teraz.
  pt: Um ambiente de escrita sem distrações; rascunhe qualquer coisa, escreva agora.
  ro: Un mediu de scriere fără distracții; redactează orice, scrie acum.
  ru: Среда для письма без отвлечений; набросайте что угодно, пишите прямо сейчас.
  th: สภาพแวดล้อมการเขียนที่ไม่มีสิ่งรบกวน ร่างอะไรก็ได้ เขียนได้เลยตอนนี้
  tr: Dikkat dağıtmayan bir yazma ortamı; her şeyi taslakla, şimdi yaz.
  uk: Середовище для письма без відволікань; напишіть будь-який чернетковий запис, пишіть просто зараз.
  vi: Môi trường viết lái không bị phân tâm; soạn thảo bất cứ điều gì, viết ngay bây giờ.
x:
  source: https://github.com/andrewmd5/dawn
  eget: andrewmd5/dawn
rule:
  /eget:
    cmd: x eget andrewmd5/dawn
    reference: https://github.com/andrewmd5/dawn
binlist:
- 'dawn'

