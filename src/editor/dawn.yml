lang: 'C'
homepage: 'https://github.com/andrewmd5/dawn'
license: 'MIT'
desc:
  cn: 无干扰的写作环境，随时开始创作
  en: 'A distraction-free writing environment; draft anything, write now.'
x:
  source: https://github.com/andrewmd5/dawn
  eget: https://github.com/andrewmd5/dawn
rule:
  /eget:
    cmd: x eget andrewmd5/dawn
    reference: https://github.com/andrewmd5/dawn
binlist:
  - 'dawn'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
