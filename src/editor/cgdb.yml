lang: C
homepage: https://github.com/cgdb/cgdb
license: GPL-2.0
desc:
  cn: cgdb 是一个非常轻量级的控制台前端，用于 GNU 调试器（GDB）。
  en: cgdb is a lightweight curses (terminal-based) interface to the GNU Debugger (GDB).
x:
  source: https://github.com/cgdb/cgdb
rule:
  darwin/brew:
    cmd: brew install cgdb
    reference: https://formulae.brew.sh/formula/cgdb#default
  debian/apt:
    cmd: sudo apt-get install cgdb
    reference: https://command-not-found.com/cgdb
    dsnap: cgdb
  ubuntu/apt:
    cmd: sudo apt-get install cgdb
    reference: https://command-not-found.com/cgdb
    dsnap: cgdb
  kali/apt:
    cmd: sudo apt-get install cgdb
    reference: https://command-not-found.com/cgdb
    dsnap: cgdb
  raspbian/apt:
    cmd: sudo apt-get install cgdb
    reference: https://command-not-found.com/cgdb
  mint/apt:
    cmd: sudo apt-get install cgdb
    reference: https://command-not-found.com/cgdb
  alpine/apk:
    cmd: apk add cgdb
    reference: https://command-not-found.com/cgdb
    dsnap: cgdb
  arch/pacman:
    cmd: sudo pacman -S cgdb
    reference: https://command-not-found.com/cgdb
  fedora/dnf:
    cmd: sudo dnf install cgdb
    reference: https://command-not-found.com/cgdb
    dsnap: cgdb
  opensuse/zypper:
    cmd: sudo zypper install cgdb
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=cgdb
binlist:
- cgdb

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
