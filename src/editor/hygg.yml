lang: 'Rust'
homepage: https://github.com/kruserr/hygg
license: 'AGPL-3.0'
desc:
  cn: 极简的 Vim 风格 TUI 文档阅读器,让阅读更简单
  en: '📚 Simplifying the way you read. Minimalistic Vim-like TUI document reader.'
x:
  source: https://github.com/kruserr/hygg
  eget: https://github.com/kruserr/hygg
rule:
  /eget:
    cmd: x eget kruserr/hygg
    reference: https://github.com/kruserr/hygg
binlist:
  - 'hygg'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.6 MB
          rating: 1
          desc:
            cn: 约 2.6 MB（估算）
            en: ~2.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
