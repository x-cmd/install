lang: 'Rust'
homepage: https://github.com/kruserr/hygg
license: 'AGPL-3.0'
desc:
  cn: 极简的 Vim 风格 TUI 文档阅读器,让阅读更简单
  en: '📚 Simplifying the way you read. Minimalistic Vim-like TUI document reader.'
x:
  source: https://github.com/kruserr/hygg
  eget: https://github.com/kruserr/hygg
rule:
  /eget:
    cmd: x eget kruserr/hygg
    reference: https://github.com/kruserr/hygg
binlist:
  - 'hygg'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
