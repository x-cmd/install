lang: C
homepage: https://gitlab.com/craigbarnes/dte
desc:
  en: A small, configurable terminal text editor
  cn: 一个小型、可配置的终端文本编辑器
  cs: Malý, konfigurovatelný textový editor pro terminál
  de: Ein kleiner, konfigurierbarer Texteditor für das Terminal
  es: Un pequeño editor de texto configurable para el terminal
  fr: Un petit éditeur de texte configurable pour le terminal
  id: Editor teks terminal kecil yang dapat dikonfigurasi
  it: Un piccolo editor di testo configurabile per il terminale
  ja: 小さく設定可能なターミナルテキストエディタ
  ko: 작고 사용자 설정 가능한 터미널 텍스트 편집기
  pl: Mały, konfigurowalny edytor tekstu dla terminala
  pt: Um pequeno editor de texto configurável para o terminal
  ro: Un mic editor de text configurabil pentru terminal
  ru: Небольшой настраиваемый текстовый редактор для терминала
  th: โปรแกรมแก้ไขข้อความสำหรับเทอร์มินัลขนาดเล็กที่กำหนดค่าได้
  tr: Terminal için küçük ve yapılandırılabilir bir metin düzenleyici
  uk: Невеликий налаштовуваний текстовий редактор для термінала
  vi: Trình soạn thảo văn bản nhỏ gọn, có thể cấu hình cho terminal
rule:
  debian/apt:
    cmd: sudo apt install dte
    reference: https://gitlab.com/craigbarnes/dte#installing
    dsnap: dte
  ubuntu/apt:
    cmd: sudo apt install dte
    reference: https://gitlab.com/craigbarnes/dte#installing
    dsnap: dte
  arch/pacman:
    cmd: sudo pacman -S dte
    reference: https://gitlab.com/craigbarnes/dte#installing
  freebsd/pkg:
    cmd: pkg install dte
    reference: https://gitlab.com/craigbarnes/dte#installing
  openbsd/pkg_add:
    cmd: pkg_add dte
    reference: https://gitlab.com/craigbarnes/dte#installing
  termux/pkg:
    cmd: pkg install dte
    reference: https://gitlab.com/craigbarnes/dte#installing

x:
  apt: dte
  pacman: dte
binlist:
- dte
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
