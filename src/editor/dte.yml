lang: C
homepage: https://gitlab.com/craigbarnes/dte
desc:
  en: A small, configurable terminal text editor
  cn: 一个小型、可配置的终端文本编辑器
rule:
  debian/apt:
    cmd: sudo apt install dte
    reference: https://gitlab.com/craigbarnes/dte#installing
    dsnap: dte
  ubuntu/apt:
    cmd: sudo apt install dte
    reference: https://gitlab.com/craigbarnes/dte#installing
    dsnap: dte
  arch/pacman:
    cmd: sudo pacman -S dte
    reference: https://gitlab.com/craigbarnes/dte#installing
  freebsd/pkg:
    cmd: pkg install dte
    reference: https://gitlab.com/craigbarnes/dte#installing
  openbsd/pkg_add:
    cmd: pkg_add dte
    reference: https://gitlab.com/craigbarnes/dte#installing
  termux/pkg:
    cmd: pkg install dte
    reference: https://gitlab.com/craigbarnes/dte#installing
binlist:
- dte
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
