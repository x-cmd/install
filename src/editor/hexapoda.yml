lang: 'Rust'
homepage: https://github.com/simonomi/hexapoda
license: 'GPL-3.0'
desc:
  cn: 多彩的模态式十六进制编辑器
  en: 'a colorful modal hex editor'
x:
  source: https://github.com/simonomi/hexapoda
  eget: https://github.com/simonomi/hexapoda
rule:
  /cargo:
    cmd: 'cargo install hexapoda'
    reference: https://github.com/simonomi/hexapoda
  /eget:
    cmd: x eget simonomi/hexapoda
    reference: https://github.com/simonomi/hexapoda
binlist:
- 'hexapoda'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 791 KB
          rating: 1
          desc:
            cn: 安装 791 KB
            en: 791 KB install
        download:
          estimate: 791 KB
          desc:
            cn: 约 791 KB 下载 (linux/x64)
            en: ~791 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
