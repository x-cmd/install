lang: 'Rust'
homepage: https://github.com/simonomi/hexapoda
license: 'GPL-3.0'
desc:
  cn: 多彩的模态式十六进制编辑器
  en: 'a colorful modal hex editor'
x:
  source: https://github.com/simonomi/hexapoda
  eget: https://github.com/simonomi/hexapoda
rule:
  /cargo:
    cmd: 'cargo install hexapoda'
    reference: https://github.com/simonomi/hexapoda
  /eget:
    cmd: x eget simonomi/hexapoda
    reference: https://github.com/simonomi/hexapoda
binlist:
  - 'hexapoda'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
