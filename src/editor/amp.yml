lang: Rust
homepage: https://github.com/jmacdonald/amp
desc:
  en: A complete text editor for your terminal
  cn: 为你的终端提供的完整文本编辑器
  cs: Kompletní textový editor pro váš terminál
  de: Ein vollständiger Texteditor für Ihr Terminal
  es: Un editor de texto completo para tu terminal
  fr: Un éditeur de texte complet pour votre terminal
  id: Editor teks lengkap untuk terminal Anda
  it: Un editor di testo completo per il tuo terminale
  ja: ターミナル用の完全なテキストエディタ
  ko: 터미널을 위한 완전한 텍스트 편집기
  pl: Pełny edytor tekstu dla Twojego terminala
  pt: Um editor de texto completo para o seu terminal
  ro: Un editor de text complet pentru terminalul tău
  ru: Полноценный текстовый редактор для вашего терминала
  th: โปรแกรมแก้ไขข้อความแบบครบถ้วนสำหรับเทอร์มินัลของคุณ
  tr: Terminaliniz için eksiksiz bir metin düzenleyici
  uk: Повноцінний текстовий редактор для вашого термінала
  vi: Trình soạn thảo văn bản đầy đủ cho terminal của bạn
x:
  source: https://github.com/jmacdonald/amp
  eget: jmacdonald/amp
  brew: amp
  cargo: amp
rule:
  /eget:
    cmd: x eget jmacdonald/amp
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install amp
    reference: https://amp.rs/docs/installation/
  /cargo:
    cmd: cargo install amp
    reference: https://amp.rs/docs/installation/
    dsnap: amp
binlist:
- amp
license: NOASSERTION

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 安装 8.0 MB
            en: 8.0 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
