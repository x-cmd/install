lang: 'Go'
homepage: https://github.com/hymkor/csvi
license: 'MIT'
desc:
  cn: 终端 CSV 编辑器
  en: 'Csvi - A terminal CSV editor'
x:
  source: https://github.com/hymkor/csvi
  eget: https://github.com/hymkor/csvi
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/hymkor/csvi
  /eget:
    cmd: x eget hymkor/csvi
    reference: https://github.com/hymkor/csvi
binlist:
  - 'csvi'

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.3 MB
          rating: 1
          desc:
            cn: 安装 3.3 MB
            en: 3.3 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
