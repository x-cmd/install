lang: 'Go'
homepage: https://github.com/hymkor/csvi
license: 'MIT'
desc:
  cn: 终端 CSV 编辑器
  en: 'Csvi - A terminal CSV editor'
  cs: Csvi - terminálový editor CSV
  de: Csvi - ein CSV-Editor für das Terminal
  es: Csvi - un editor de CSV para el terminal
  fr: Csvi - un éditeur CSV pour le terminal
  id: Csvi - editor CSV terminal
  it: Csvi - un editor CSV da terminale
  ja: Csvi - 端末向け CSV エディタ
  ko: Csvi - 터미널용 CSV 편집기
  pl: Csvi - terminalowy edytor CSV
  pt: Csvi - um editor de CSV para o terminal
  ro: Csvi - un editor CSV pentru terminal
  ru: Csvi — CSV-редактор для терминала
  th: Csvi - โปรแกรมแก้ไข CSV สำหรับเทอร์มินัล
  tr: Csvi - terminal için CSV düzenleyici
  uk: Csvi — CSV-редактор для термінала
  vi: Csvi - trình soạn thảo CSV cho terminal
x:
  source: https://github.com/hymkor/csvi
  eget: hymkor/csvi
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/hymkor/csvi
  /eget:
    cmd: x eget hymkor/csvi
    reference: https://github.com/hymkor/csvi
binlist:
- 'csvi'

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.3 MB
          rating: 1
          desc:
            cn: 安装 3.3 MB
            en: 3.3 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
