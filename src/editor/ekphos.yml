lang: 'Rust'
homepage: https://github.com/hanebox/ekphos
license: 'MIT'
desc:
  cn: 受 Obsidian 启发的轻量快速终端 Markdown 研究工具
  en: 'A lightweight, fast, terminal-based markdown research tool inspired by Obsidian'
x:
  source: https://github.com/hanebox/ekphos
  eget: https://github.com/hanebox/ekphos
rule:
  /eget:
    cmd: x eget hanebox/ekphos
    reference: https://github.com/hanebox/ekphos
binlist:
  - 'ekphos'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.7 MB
          rating: 1
          desc:
            cn: 约 1.7 MB（估算）
            en: ~1.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
