lang: 'Rust'
homepage: https://github.com/hanebox/ekphos
license: 'MIT'
desc:
  cn: 受 Obsidian 启发的轻量快速终端 Markdown 研究工具
  en: 'A lightweight, fast, terminal-based markdown research tool inspired by Obsidian'
  cs: Lehký, rychlý nástroj pro výzkum v Markdownu založený na terminálu, inspirovaný Obsidianem
  de: Ein leichtes, schnelles, terminalbasiertes Markdown-Recherchewerkzeug, inspiriert von Obsidian
  es: Una herramienta de investigación en Markdown basada en terminal, ligera, rápida e inspirada en Obsidian
  fr: Un outil léger et rapide de recherche Markdown en terminal, inspiré d'Obsidian
  id: Alat riset Markdown berbasis terminal yang ringan dan cepat, terinspirasi oleh Obsidian
  it: Un leggero e veloce strumento di ricerca Markdown basato sul terminale, ispirato a Obsidian
  ja: Obsidianに着想を得た、軽量で高速なターミナルベースのMarkdown調査ツール
  ko: Obsidian에서 영감을 받은 가볍고 빠른 터미널 기반 Markdown 조사 도구
  pl: Lekkie, szybkie narzędzie do badania dokumentów w Markdownie działające w terminalu, inspirowane Obsidianem
  pt: Uma ferramenta leve e rápida de pesquisa em Markdown baseada em terminal, inspirada no Obsidian
  ro: Un instrument ușor și rapid de cercetare în Markdown bazat pe terminal, inspirat de Obsidian
  ru: Лёгкий и быстрый терминальный инструмент для исследования Markdown, вдохновлённый Obsidian
  th: เครื่องมือวิจัย Markdown บนเทอร์มินัลที่เบาและรวดเร็ว ได้แรงบันดาลใจจาก Obsidian
  tr: Obsidian'dan esinlenen, hafif ve hızlı, terminal tabanlı Markdown araştırma aracı
  uk: Легкий і швидкий термінальний інструмент для дослідження Markdown, натхненний Obsidian
  vi: Công cụ nghiên cứu Markdown chạy trên terminal, nhẹ và nhanh, lấy cảm hứng từ Obsidian
x:
  source: https://github.com/hanebox/ekphos
  eget: hanebox/ekphos
rule:
  /eget:
    cmd: x eget hanebox/ekphos
    reference: https://github.com/hanebox/ekphos
binlist:
  - 'ekphos'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.7 MB
          rating: 1
          desc:
            cn: 约 1.7 MB（估算）
            en: ~1.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
