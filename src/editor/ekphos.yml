lang: 'Rust'
homepage: https://github.com/hanebox/ekphos
license: 'MIT'
desc:
  cn: 受 Obsidian 启发的轻量快速终端 Markdown 研究工具
  en: 'A lightweight, fast, terminal-based markdown research tool inspired by Obsidian'
x:
  source: https://github.com/hanebox/ekphos
  eget: https://github.com/hanebox/ekphos
rule:
  /eget:
    cmd: x eget hanebox/ekphos
    reference: https://github.com/hanebox/ekphos
binlist:
  - 'ekphos'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
