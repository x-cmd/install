lang: JavaScript
homepage: https://github.com/genjidb/genji
license: MIT
desc:
  cn: Markdown Genji 是创作交互式文档的 Markdown 扩展
  en: Markdown Genji is the markdown extension for authoring interactive documents
  cs: Markdown Genji je rozšíření Markdownu pro psaní interaktivních dokumentů
  de: Markdown Genji ist die Markdown-Erweiterung zum Authoring interaktiver Dokumente
  es: Markdown Genji es la extensión de Markdown para redactar documentos interactivos
  fr: Markdown Genji est l'extension Markdown pour créer des documents interactifs
  id: Markdown Genji adalah ekstensi Markdown untuk menulis dokumen interaktif
  it: Markdown Genji è l'estensione Markdown per creare documenti interattivi
  ja: Markdown Genji はインタラクティブなドキュメントを書くための Markdown 拡張です
  ko: Markdown Genji는 대화형 문서를 작성하기 위한 Markdown 확장입니다
  pl: Markdown Genji to rozszerzenie Markdown do tworzenia dokumentów interaktywnych
  pt: Markdown Genji é a extensão do Markdown para criar documentos interativos
  ro: Markdown Genji este extensia Markdown pentru redactarea documentelor interactive
  ru: Markdown Genji — расширение Markdown для создания интерактивных документов
  th: Markdown Genji คือส่วนขยายของ Markdown สำหรับเขียนเอกสารแบบโต้ตอบ
  tr: Markdown Genji, etkileşimli belgeler oluşturmak için Markdown uzantısıdır
  uk: Markdown Genji — розширення Markdown для створення інтерактивних документів
  vi: Markdown Genji là phần mở rộng của Markdown để viết tài liệu tương tác
x:
  source: https://github.com/genjidb/genji
  npm: genji-theme-vitepress
rule:
  /npm:
    cmd: npm install genji-theme-vitepress
    reference: https://genji-md.dev/getting-started#installing-from-npm
    dsnap: genji-theme-vitepress
binlist:
- genji

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2.2 MB
          rating: 1
          desc:
            cn: 约 2.2 MB（估算）
            en: ~2.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
