lang: JavaScript
homepage: https://github.com/genjidb/genji
license: MIT
desc:
  cn: Markdown Genji 是创作交互式文档的 Markdown 扩展
  en: Markdown Genji is the markdown extension for authoring interactive documents
x:
  source: https://github.com/genjidb/genji
rule:
  /npm:
    cmd: npm install genji-theme-vitepress
    reference: https://genji-md.dev/getting-started#installing-from-npm
    dsnap: genji-theme-vitepress
binlist:
- genji

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2.2 MB
          rating: 1
          desc:
            cn: 约 2.2 MB（估算）
            en: ~2.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
