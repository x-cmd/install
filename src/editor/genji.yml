lang: JavaScript
homepage: https://github.com/genjidb/genji
license: MIT
desc:
  cn: Markdown Genji 是创作交互式文档的 Markdown 扩展
  en: Markdown Genji is the markdown extension for authoring interactive documents
x:
  source: https://github.com/genjidb/genji
rule:
  /npm:
    cmd: npm install genji-theme-vitepress
    reference: https://genji-md.dev/getting-started#installing-from-npm
    dsnap: genji-theme-vitepress
binlist:
- genji

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
