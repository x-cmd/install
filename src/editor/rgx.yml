lang: 'Rust'
homepage: 'https://github.com/brevity1swos/rgx'
license: 'Apache-2.0'
desc:
  cn: 终端中的 regex101:实时匹配、三引擎、捕获组、替换、语法高亮、英文释义、撤销/重做与鼠标支持
  en: 'regex101 for the terminal — real-time matching, 3 engines, capture groups, replace mode, syntax highlighting, plain-English explanations, undo/redo, mouse support. Written in Rust.'
x:
  source: https://github.com/brevity1swos/rgx
  eget: https://github.com/brevity1swos/rgx
rule:
  /eget:
    cmd: x eget brevity1swos/rgx
    reference: https://github.com/brevity1swos/rgx
binlist:
  - 'rgx'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
