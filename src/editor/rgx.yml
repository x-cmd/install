lang: 'Rust'
homepage: 'https://github.com/brevity1swos/rgx'
license: 'Apache-2.0'
desc:
  cn: 终端中的 regex101:实时匹配、三引擎、捕获组、替换、语法高亮、英文释义、撤销/重做与鼠标支持
  en: 'regex101 for the terminal — real-time matching, 3 engines, capture groups, replace mode, syntax highlighting, plain-English explanations, undo/redo, mouse support. Written in Rust.'
  cs: regex101 pro terminál — párování v reálném čase, 3 enginy, zachytávající skupiny, režim nahrazení, zvýrazňování syntaxe, vysvětlení běžnou angličtinou, undo/redo a podpora myši. Napsáno v Rust.
  de: regex101 für das Terminal – Echtzeit-Matching, 3 Engines, Capture-Gruppen, Ersetzungsmodus, Syntaxhervorhebung, Erklärungen in einfachem Englisch, Undo/Redo, Mausunterstützung. Geschrieben in Rust.
  es: "regex101 para la terminal: coincidencia en tiempo real, 3 motores, grupos de captura, modo de reemplazo, resaltado de sintaxis, explicaciones en lenguaje sencillo, deshacer/rehacer y soporte del ratón. Escrito en Rust."
  fr: regex101 pour le terminal — correspondance en temps réel, 3 moteurs, groupes de capture, mode remplacement, coloration syntaxique, explications en langage clair, annuler/rétablir et prise en charge de la souris. Écrit en Rust.
  id: regex101 untuk terminal — pencocokan waktu nyata, 3 mesin, kelompok tangkapan, mode ganti, penyorotan sintaks, penjelasan dalam bahasa Inggris sederhana, undo/redo, dan dukungan mouse. Ditulis dalam Rust.
  it: regex101 per il terminale — corrispondenza in tempo reale, 3 motori, gruppi di cattura, modalità sostituzione, evidenziazione della sintassi, spiegazioni in linguaggio semplice, annulla/ripeti e supporto del mouse. Scritto in Rust.
  ja: ターミナル版 regex101 — リアルタイムマッチ、3 種類のエンジン、キャプチャグループ、置換モード、構文ハイライト、易しい英語での解説、undo/redo、マウス対応。Rust で書かれました。
  ko: 터미널용 regex101 — 실시간 매칭, 3개 엔진, 캡처 그룹, 치환 모드, 구문 강조, 쉬운 영어 설명, 실행 취소/다시 실행, 마우스 지원. Rust로 작성되었습니다.
  pl: regex101 dla terminala — dopasowanie w czasie rzeczywistym, 3 silniki, grupy przechwytywania, tryb zamiany, podświetlanie składni, wyjaśnienia prostym językiem, cofnij/ponów oraz obsługa myszy. Napisane w Rust.
  pt: regex101 para o terminal — correspondência em tempo real, 3 mecanismos, grupos de captura, modo de substituição, realce de sintaxe, explicações em linguagem simples, desfazer/refazer e suporte a mouse. Escrito em Rust.
  ro: regex101 pentru terminal — potrivire în timp real, 3 motoare, grupuri de captură, mod de înlocuire, evidențierea sintaxei, explicații în limbaj simplu, anulează/redo și suport pentru mouse. Scris în Rust.
  ru: regex101 для терминала — сопоставление в реальном времени, 3 движка, группы захвата, режим замены, подсветка синтаксиса, пояснения простым языком, отмена/повтор и поддержка мыши. Написано на Rust.
  th: regex101 สำหรับเทอร์มินัล — จับคู่แบบเรียลไทม์ 3 เอนจิน กลุ่มการจับภาพ โหมดแทนที่ ไฮไลต์ไวยากรณ์ คำอธิบายภาษาอังกฤษอ่านง่าย undo/redo และรองรับเมาส์ เขียนด้วย Rust
  tr: terminal için regex101 — gerçek zamanlı eşleştirme, 3 motor, yakalama grupları, değiştirme modu, sözdizimi vurgulama, sade İngilizce açıklamalar, geri al/yinele ve fare desteği. Rust ile yazıldı.
  uk: regex101 для термінала — зіставлення в реальному часі, 3 рушії, групи захоплення, режим заміни, підсвічування синтаксису, пояснення простою мовою, скасування/повтор і підтримка миші. Написано на Rust.
  vi: regex101 cho terminal — khớp thời gian thực, 3 engine, nhóm bắt giữ, chế độ thay thế, tô sáng cú pháp, giải thích bằng tiếng Anh dễ hiểu, hoàn tác/làm lại và hỗ trợ chuột. Viết bằng Rust.
x:
  source: https://github.com/brevity1swos/rgx
  eget: brevity1swos/rgx
rule:
  /eget:
    cmd: x eget brevity1swos/rgx
    reference: https://github.com/brevity1swos/rgx
binlist:
- 'rgx'

