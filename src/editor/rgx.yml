lang: 'Rust'
homepage: 'https://github.com/brevity1swos/rgx'
license: 'Apache-2.0'
desc:
  cn: 终端中的 regex101:实时匹配、三引擎、捕获组、替换、语法高亮、英文释义、撤销/重做与鼠标支持
  en: 'regex101 for the terminal — real-time matching, 3 engines, capture groups, replace mode, syntax highlighting, plain-English explanations, undo/redo, mouse support. Written in Rust.'
x:
  source: https://github.com/brevity1swos/rgx
  eget: https://github.com/brevity1swos/rgx
rule:
  /eget:
    cmd: x eget brevity1swos/rgx
    reference: https://github.com/brevity1swos/rgx
binlist:
- 'rgx'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
