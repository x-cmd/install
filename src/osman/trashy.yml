lang: Rust
homepage: https://github.com/oberblastmeister/trashy
license: Apache-2.0
desc:
  cn: trashy 是一个用 Rust 写的简单，快速，特色的替代 rm 和 trash-cli
  en: trashy is a simple, fast, and featureful alternative to rm and trash-cli written in rust
x:
  source: https://github.com/oberblastmeister/trashy
rule:
  /paru:
    cmd: sudo paru -S trashy
    reference: https://github.com/oberblastmeister/trashy?tab=readme-ov-file#from-the-aur
  arch/yay:
    cmd: yay -S trashy
    reference: https://aur.archlinux.org/packages/trashy
  /cargo:
    cmd: cargo install trashy
    reference: https://github.com/oberblastmeister/trashy?tab=readme-ov-file#using-cargo
    dsnap: trashy
  /niv-env:
    cmd: niv-env -i trashy
    reference: https://github.com/oberblastmeister/trashy?tab=readme-ov-file#using-nix
  /nix:
    cmd: nix profile install nixpkgs#trashy
    reference: https://github.com/oberblastmeister/trashy?tab=readme-ov-file#using-nix
binlist:
- trashy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 35 KB
          rating: 1
          desc:
            cn: 约 35 KB（估算）
            en: ~35 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
