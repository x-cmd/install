lang: C
homepage: https://github.com/systemd/systemd
license: GPL-2.0
desc:
  cn: Systemd 是 Linux 系统的一套基本构建块
  en: systemd is a suite of basic building blocks for a Linux system
x:
  source: https://github.com/systemd/systemd
rule:
  debian/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  ubuntu/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  arch/pacman:
    cmd: sudo pacman -S systemd
    reference: https://dockerfile.run/systemctl
  kali/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  centos/yum:
    cmd: sudo yum install systemd
    reference: https://dockerfile.run/systemctl
  fedora/dnf:
    cmd: sudo dnf install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  raspbian/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
binlist:
- systemctl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
