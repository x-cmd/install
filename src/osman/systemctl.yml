lang: C
homepage: https://github.com/systemd/systemd
license: GPL-2.0
desc:
  cn: Systemd 是 Linux 系统的一套基本构建块
  en: systemd is a suite of basic building blocks for a Linux system
x:
  source: https://github.com/systemd/systemd
rule:
  debian/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  ubuntu/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  arch/pacman:
    cmd: sudo pacman -S systemd
    reference: https://dockerfile.run/systemctl
  kali/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  centos/yum:
    cmd: sudo yum install systemd
    reference: https://dockerfile.run/systemctl
  fedora/dnf:
    cmd: sudo dnf install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  raspbian/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
binlist:
- systemctl
