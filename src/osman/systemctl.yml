lang: C
homepage: https://github.com/systemd/systemd
license: GPL-2.0
desc:
  cn: Systemd 是 Linux 系统的一套基本构建块
  en: systemd is a suite of basic building blocks for a Linux system
  cs: systemd je sada základních stavebních bloků pro systém Linux
  de: systemd ist eine Suite grundlegender Bausteine für ein Linux-System
  es: systemd es un conjunto de bloques de construcción básicos para un sistema Linux
  fr: systemd est un ensemble de blocs de construction de base pour un système Linux
  id: systemd adalah rangkaian blok bangunan dasar untuk sistem Linux
  it: systemd è un insieme di blocchi fondamentali per un sistema Linux
  ja: systemd は Linux システムのための基本的な構成要素の集合です
  ko: systemd는 Linux 시스템을 위한 기본 구성 요소 모음입니다
  pl: systemd to zestaw podstawowych elementów składowych systemu Linux
  pt: O systemd é um conjunto de blocos de construção básicos para um sistema Linux
  ro: systemd este o suită de blocuri de bază pentru un sistem Linux
  ru: systemd — набор базовых строительных блоков для системы Linux
  th: systemd คือชุดองค์ประกอบพื้นฐานสำหรับระบบ Linux
  tr: systemd, bir Linux sistemi için temel yapı taşlarından oluşan bir pakettir
  uk: systemd — набір базових будівельних блоків для системи Linux
  vi: systemd là một bộ khối xây dựng cơ bản cho hệ thống Linux
x:
  source: https://github.com/systemd/systemd
  apt: systemd
  dnf: systemd
  pacman: systemd
  apt-get: systemd
  yum: systemd
rule:
  debian/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  ubuntu/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  arch/pacman:
    cmd: sudo pacman -S systemd
    reference: https://dockerfile.run/systemctl
  kali/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  centos/yum:
    cmd: sudo yum install systemd
    reference: https://dockerfile.run/systemctl
  fedora/dnf:
    cmd: sudo dnf install systemd
    reference: https://dockerfile.run/systemctl
    dsnap: systemd
  raspbian/apt:
    cmd: sudo apt-get install systemd
    reference: https://dockerfile.run/systemctl
binlist:
- systemctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
