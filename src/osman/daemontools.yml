lang: C
homepage: https://cr.yp.to/daemontools.html
desc:
  cn: Daemontools 是用于管理 UNIX 服务的工具集
  en: Daemontools is a collection of tools for managing UNIX services
rule:
  arch/yay:
    cmd: yay -S daemontools-encore
    reference: https://aur.archlinux.org/packages/daemontools-encore
  darwin/brew:
    cmd: brew install daemontools
    reference: https://formulae.brew.sh/formula/daemontools#default
binlist:
- daemontools
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
