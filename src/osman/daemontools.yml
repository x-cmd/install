lang: C
homepage: https://cr.yp.to/daemontools.html
desc:
  cn: Daemontools 是用于管理 UNIX 服务的工具集
  en: Daemontools is a collection of tools for managing UNIX services
  cs: Daemontools je sada nástrojů pro správu služeb UNIX
  de: Daemontools ist eine Sammlung von Werkzeugen zur Verwaltung von UNIX-Diensten
  es: Daemontools es una colección de herramientas para administrar servicios UNIX
  fr: Daemontools est une collection d'outils pour gérer les services UNIX
  id: Daemontools adalah kumpulan alat untuk mengelola layanan UNIX
  it: Daemontools è una raccolta di strumenti per gestire i servizi UNIX
  ja: DaemontoolsはUNIXサービスの管理のためのツール集です
  ko: Daemontools는 UNIX 서비스 관리를 위한 도구 모음입니다
  pl: Daemontools to zestaw narzędzi do zarządzania usługami UNIX
  pt: Daemontools é uma coleção de ferramentas para gerenciar serviços UNIX
  ro: Daemontools este o colecție de instrumente pentru gestionarea serviciilor UNIX
  ru: Daemontools — это набор инструментов для управления службами UNIX
  th: Daemontools คือชุดเครื่องมือสำหรับจัดการบริการ UNIX
  tr: Daemontools, UNIX servislerini yönetmek için bir araç koleksiyonudur
  uk: Daemontools — це набір інструментів для керування службами UNIX
  vi: Daemontools là bộ công cụ để quản lý dịch vụ UNIX
rule:
  arch/yay:
    cmd: yay -S daemontools-encore
    reference: https://aur.archlinux.org/packages/daemontools-encore
  darwin/brew:
    cmd: brew install daemontools
    reference: https://formulae.brew.sh/formula/daemontools#default

x:
  brew: daemontools
  yay: daemontools-encore
binlist:
- daemontools
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
