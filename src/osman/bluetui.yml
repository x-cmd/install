lang: Rust
homepage: https://github.com/pythops/bluetui
license: GPL-3.0
desc:
  cn: 用于在 Linux 上管理蓝牙的 TUI。
  en: TUI for managing bluetooth on Linux.
  cs: TUI pro správu Bluetoothu v Linuxu.
  de: TUI zur Bluetooth-Verwaltung unter Linux.
  es: TUI para gestionar Bluetooth en Linux.
  fr: TUI pour gérer le Bluetooth sous Linux.
  id: TUI untuk mengelola Bluetooth di Linux.
  it: TUI per gestire il Bluetooth su Linux.
  ja: Linux で Bluetooth を管理するための TUI。
  ko: Linux에서 Bluetooth를 관리하기 위한 TUI.
  pl: TUI do zarządzania Bluetoothem w Linuksie.
  pt: TUI para gerenciar o Bluetooth no Linux.
  ro: TUI pentru gestionarea Bluetoothului pe Linux.
  ru: TUI для управления Bluetooth в Linux.
  th: TUI สำหรับจัดการ Bluetooth บน Linux
  tr: Linux üzerinde Bluetooth yönetimi için TUI.
  uk: TUI для керування Bluetooth у Linux.
  vi: TUI để quản lý Bluetooth trên Linux.
x:
  source: https://github.com/pythops/bluetui
  pacman: bluetui
  yay: bluetui
  cargo: bluetui
rule:
  /cargo:
    cmd: cargo install bluetui
    reference: https://github.com/pythops/bluetui?tab=readme-ov-file#-cratesio
    dsnap: bluetui
  arch/pacman:
    cmd: sudo pacman -S bluetui
    reference: https://github.com/pythops/bluetui?tab=readme-ov-file#-cratesio
  arch/yay:
    cmd: yay -S bluetui
    reference: https://aur.archlinux.org/packages/bluetui
  arch/manjaro:
    cmd: sudo pacman -S bluetui
    reference: https://github.com/pythops/bluetui?tab=readme-ov-file#-cratesio
  gentoo/:
    cmd: \ sudo eselect repository enable lamdness && \ sudo emaint -r lamdness sync && \ sudo emerge -av net-wireless/bluetui
    reference: https://github.com/pythops/bluetui?tab=readme-ov-file#-gentoo
binlist:
- bluetui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
