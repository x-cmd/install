lang: Rust
homepage: https://github.com/jkfran/killport
license: MIT
desc:
  cn: killport 是一个命令行实用程序，用于终止监听特定端口的进程
  en: killport is a command-line utility for killing processes listening on specific ports
x:
  source: https://github.com/jkfran/killport
  eget: https://github.com/jkfran/killport
rule:
  /eget:
    cmd: x eget jkfran/killport
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S killport
    reference: https://aur.archlinux.org/packages/killport
  /cargo:
    cmd: cargo install killport
    reference: https://github.com/jkfran/killport?tab=readme-ov-file#using-cargo
    dsnap: killport
  darwin/brew:
    cmd: brew install killport
    reference: https://github.com/jkfran/killport?tab=readme-ov-file#using-homebrew
  /curl:
    cmd: curl -sL https://bit.ly/killport | sh
    reference: https://github.com/jkfran/killport?tab=readme-ov-file#using-installsh
binlist:
- killport

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
