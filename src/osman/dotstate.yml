lang: 'Rust'
homepage: https://github.com/serkanyersen/dotstate
license: 'MIT'
desc:
  cn: Rust 编写的现代、安全、易用的 dotfile 管理器
  en: 'A modern, secure, and user-friendly dotfile manager built with Rust'
x:
  source: https://github.com/serkanyersen/dotstate
  eget: https://github.com/serkanyersen/dotstate
rule:
  /eget:
    cmd: x eget serkanyersen/dotstate
    reference: https://github.com/serkanyersen/dotstate
binlist:
- 'dotstate'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.8 MB
          rating: 1
          desc:
            cn: 约 1.8 MB（估算）
            en: ~1.8 MB estimated
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
