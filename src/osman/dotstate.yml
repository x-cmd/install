lang: 'Rust'
homepage: https://github.com/serkanyersen/dotstate
license: 'MIT'
desc:
  cn: Rust 编写的现代、安全、易用的 dotfile 管理器
  en: 'A modern, secure, and user-friendly dotfile manager built with Rust'
x:
  source: https://github.com/serkanyersen/dotstate
  eget: https://github.com/serkanyersen/dotstate
rule:
  /eget:
    cmd: x eget serkanyersen/dotstate
    reference: https://github.com/serkanyersen/dotstate
binlist:
  - 'dotstate'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
