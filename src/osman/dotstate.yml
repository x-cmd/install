lang: 'Rust'
homepage: https://github.com/serkanyersen/dotstate
license: 'MIT'
desc:
  cn: Rust 编写的现代、安全、易用的 dotfile 管理器
  en: 'A modern, secure, and user-friendly dotfile manager built with Rust'
  cs: Moderní, bezpečný a uživatelsky přívětivý správce dotfileů napsaný v Rustu
  de: Ein moderner, sicherer und benutzerfreundlicher Dotfile-Manager, geschrieben in Rust
  es: Un gestor de dotfiles moderno, seguro y fácil de usar, escrito en Rust
  fr: Un gestionnaire de dotfiles moderne, sécurisé et simple d'utilisation, écrit en Rust
  id: Manajer dotfile modern, aman, dan ramah pengguna yang dibangun dengan Rust
  it: Un gestore di dotfile moderno, sicuro e intuitivo, scritto in Rust
  ja: Rustで書かれたモダンで安全、使easy dotfileマネージャー
  ko: Rust로 만든 현대적이고 안전하며 사용하기 쉬운 dotfile 관리자
  pl: Nowoczesny, bezpieczny i przyjazny użytkownikowi menedżer plików dotfile napisany w Rust
  pt: Um gerenciador de dotfiles moderno, seguro e fácil de usar, escrito em Rust
  ro: Un manager de dotfiles modern, sigur și ușor de folosit, scris în Rust
  ru: Современный, безопасный и удобный менеджер dotfile-файлов, написанный на Rust
  th: ตัวจัดการ dotfile ที่ทันสมัย ปลอดภัย และใช้งานง่าย สร้างด้วย Rust
  tr: Rust ile yazılmış modern, güvenli ve kullanıcı dostu dotfile yöneticisi
  uk: Сучасний, безпечний і зручний менеджер dotfile-файлів, написаний на Rust
  vi: Trình quản lý dotfile hiện đại, an toàn và dễ dùng, xây dựng bằng Rust
x:
  source: https://github.com/serkanyersen/dotstate
  eget: serkanyersen/dotstate
rule:
  /eget:
    cmd: x eget serkanyersen/dotstate
    reference: https://github.com/serkanyersen/dotstate
binlist:
- 'dotstate'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
