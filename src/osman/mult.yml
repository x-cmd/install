lang: 'Go'
homepage: https://github.com/dhth/mult
license: 'MIT'
desc:
  cn: 多次运行命令并通过 TUI 浏览输出的工具
  en: 'Run a command multiple times and glance at the outputs via a TUI'
x:
  source: https://github.com/dhth/mult
  eget: https://github.com/dhth/mult
rule:
  /eget:
    cmd: x eget dhth/mult
    reference: https://github.com/dhth/mult
binlist:
  - 'mult'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 61 KB
          rating: 1
          desc:
            cn: 约 61 KB（估算）
            en: ~61 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
