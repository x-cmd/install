lang: 'Go'
homepage: https://github.com/dhth/mult
license: 'MIT'
desc:
  cn: 多次运行命令并通过 TUI 浏览输出的工具
  en: 'Run a command multiple times and glance at the outputs via a TUI'
x:
  source: https://github.com/dhth/mult
  eget: https://github.com/dhth/mult
rule:
  /eget:
    cmd: x eget dhth/mult
    reference: https://github.com/dhth/mult
binlist:
  - 'mult'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
