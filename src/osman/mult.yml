lang: 'Go'
homepage: https://github.com/dhth/mult
license: 'MIT'
desc:
  cn: 多次运行命令并通过 TUI 浏览输出的工具
  en: 'Run a command multiple times and glance at the outputs via a TUI'
x:
  source: https://github.com/dhth/mult
  eget: https://github.com/dhth/mult
rule:
  /eget:
    cmd: x eget dhth/mult
    reference: https://github.com/dhth/mult
binlist:
- 'mult'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
