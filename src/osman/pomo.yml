lang: 'Go'
homepage: 'https://github.com/Bahaaio/pomo'
license: 'MIT'
desc:
  cn: 可定制的 TUI 番茄钟，含 ASCII 艺术、进度条、桌面通知与效率统计
  en: 'Customizable TUI Pomodoro timer with ASCII art, progress bar, desktop notifications, and productivity statistics.'
x:
  source: https://github.com/Bahaaio/pomo
  eget: https://github.com/Bahaaio/pomo
rule:
  /eget:
    cmd: x eget Bahaaio/pomo
    reference: https://github.com/Bahaaio/pomo
binlist:
  - 'pomo'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
