lang: Rust
homepage: https://github.com/jdx/rtx
license: MIT
desc:
  cn: Rtx 是用于管理编程语言和工具版本的工具
  en: Rtx is a tool for managing programming language and tool versions
x:
  source: https://github.com/jdx/rtx
  eget: https://github.com/jdx/rtx
rule:
  /eget:
    cmd: x eget jdx/rtx
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install rtx
    reference: https://formulae.brew.sh/formula/rtx#default
binlist:
- rtx-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
