lang: 'Rust'
homepage: https://github.com/kabouzeid/turm
license: 'MIT'
desc:
  cn: Slurm 工作负载管理器的 TUI
  en: 'TUI for the Slurm Workload Manager'
x:
  source: https://github.com/kabouzeid/turm
  eget: https://github.com/kabouzeid/turm
rule:
  /eget:
    cmd: x eget kabouzeid/turm
    reference: https://github.com/kabouzeid/turm
binlist:
  - 'turm'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
