lang: Python
homepage: https://github.com/joknarf/pgtree
license: MIT
desc:
  cn: 用于特定进程的类 Unix 进程层次结构树显示工具。
  en: A unix process hierarchy tree display tool for specific processes.
x:
  source: https://github.com/joknarf/pgtree
  eget: https://github.com/joknarf/pgtree
rule:
  /eget:
    cmd: x eget joknarf/pgtree
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install pgtree
    reference: https://github.com/joknarf/pgtree#installation
    dsnap: pgtree
binlist:
- pgtree

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 安装 7 KB
            en: 7 KB install
        download:
          estimate: 7 KB
          desc:
            cn: 约 7 KB 下载 (deb)
            en: ~7 KB download (deb)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
