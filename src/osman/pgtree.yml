lang: Python
homepage: https://github.com/joknarf/pgtree
license: MIT
desc:
  cn: 用于特定进程的类 Unix 进程层次结构树显示工具。
  en: A unix process hierarchy tree display tool for specific processes.
x:
  source: https://github.com/joknarf/pgtree
  eget: https://github.com/joknarf/pgtree
rule:
  /eget:
    cmd: x eget joknarf/pgtree
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install pgtree
    reference: https://github.com/joknarf/pgtree#installation
    dsnap: pgtree
binlist:
- pgtree

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
