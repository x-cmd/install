lang: 'Go'
homepage: 'https://github.com/termkit/gama'
license: 'GPL-3.0'
desc:
  cn: 用出色 UI 从终端管理 GitHub Actions
  en: 'Manage your GitHub Actions from Terminal with great UI 🧪'
x:
  source: https://github.com/termkit/gama
  eget: https://github.com/termkit/gama
rule:
  /eget:
    cmd: x eget termkit/gama
    reference: https://github.com/termkit/gama
binlist:
- 'gama'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
