lang: 'Rust'
homepage: 'https://github.com/tareqimbasher/cargo-seek'
license: 'MIT'
desc:
  cn: 搜索、添加并安装 cargo crate 的终端界面
  en: 'A terminal user interface for searching, adding and installing cargo crates.'
  cs: Textové uživatelské rozhraní terminálu pro vyhledávání, přidávání a instalování cargo crates.
  de: Eine textbasierte Benutzeroberfläche für das Suchen, Hinzufügen und Installieren von Cargo-Crates.
  es: Una interfaz de usuario de terminal para buscar, agregar e instalar crates de cargo.
  fr: Une interface utilisateur en terminal pour rechercher, ajouter et installer des crates cargo.
  id: Antarmuka pengguna terminal untuk mencari, menambahkan, dan memasang crate cargo.
  it: Un'interfaccia utente a riga di comando per cercare, aggiungere e installare crate cargo.
  ja: cargo crate を検索・追加・インストールするためのターミナルユーザーインターフェース。
  ko: cargo 크레이트를 검색, 추가 및 설치하기 위한 터미널 사용자 인터페이스.
  pl: Tekstowy interfejs terminala do wyszukiwania, dodawania i instalowania crate'ów cargo.
  pt: Uma interface de usuário de terminal para pesquisar, adicionar e instalar crates do cargo.
  ro: O interfață de utilizator în terminal pentru căutarea, adăugarea și instalarea crate-urilor cargo.
  ru: Терминальный пользовательский интерфейс для поиска, добавления и установки crate-ов cargo.
  th: ส่วนติดต่อผู้ใช้แบบเทอร์มินัลสำหรับการค้นหา เพิ่ม และติดตั้ง crate ของ cargo
  tr: Cargo crate'lerini aramak, eklemek ve kurmak için bir terminal kullanıcı arayüzü.
  uk: Термінальний користувацький інтерфейс для пошуку, додавання та встановлення crate-ів cargo.
  vi: Giao diện người dùng dạng terminal để tìm kiếm, thêm và cài đặt các crate của cargo.
x:
  source: https://github.com/tareqimbasher/cargo-seek
  eget: tareqimbasher/cargo-seek
rule:
  /eget:
    cmd: x eget tareqimbasher/cargo-seek
    reference: https://github.com/tareqimbasher/cargo-seek
binlist:
- 'cargo-seek'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
