lang: 'Rust'
homepage: 'https://github.com/tareqimbasher/cargo-seek'
license: 'MIT'
desc:
  cn: 搜索、添加并安装 cargo crate 的终端界面
  en: 'A terminal user interface for searching, adding and installing cargo crates.'
x:
  source: https://github.com/tareqimbasher/cargo-seek
  eget: https://github.com/tareqimbasher/cargo-seek
rule:
  /eget:
    cmd: x eget tareqimbasher/cargo-seek
    reference: https://github.com/tareqimbasher/cargo-seek
binlist:
  - 'cargo-seek'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
