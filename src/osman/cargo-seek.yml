lang: 'Rust'
homepage: 'https://github.com/tareqimbasher/cargo-seek'
license: 'MIT'
desc:
  cn: 搜索、添加并安装 cargo crate 的终端界面
  en: 'A terminal user interface for searching, adding and installing cargo crates.'
x:
  source: https://github.com/tareqimbasher/cargo-seek
  eget: https://github.com/tareqimbasher/cargo-seek
rule:
  /eget:
    cmd: x eget tareqimbasher/cargo-seek
    reference: https://github.com/tareqimbasher/cargo-seek
binlist:
- 'cargo-seek'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 263 KB
          rating: 1
          desc:
            cn: 约 263 KB（估算）
            en: ~263 KB estimated
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
