lang: 'Go'
homepage: https://github.com/bjarneo/cliamp
license: 'MIT'
desc:
  cn: cliamp — 受 Winamp 启发的终端音乐播放器
  en: 'cliamp - Terminal music player inspired by winamp'
x:
  source: https://github.com/bjarneo/cliamp
  eget: https://github.com/bjarneo/cliamp
  brew: bjarneo/cliamp/cliamp'
rule:
  darwin/brew:
    cmd: 'brew install bjarneo/cliamp/cliamp'
    reference: https://github.com/bjarneo/cliamp
  /eget:
    cmd: x eget bjarneo/cliamp
    reference: https://github.com/bjarneo/cliamp
binlist:
- 'cliamp'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 35 MB
          rating: 2
          desc:
            cn: 安装 35 MB
            en: 35 MB install
        download:
          estimate: 35 MB
          desc:
            cn: 约 35 MB 下载 (linux/x64)
            en: ~35 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
