lang: 'Go'
homepage: https://github.com/bjarneo/cliamp
license: 'MIT'
desc:
  cn: cliamp — 受 Winamp 启发的终端音乐播放器
  en: 'cliamp - Terminal music player inspired by winamp'
x:
  source: https://github.com/bjarneo/cliamp
  eget: https://github.com/bjarneo/cliamp
rule:
  darwin/brew:
    cmd: 'brew install bjarneo/cliamp/cliamp'
    reference: https://github.com/bjarneo/cliamp
  /eget:
    cmd: x eget bjarneo/cliamp
    reference: https://github.com/bjarneo/cliamp
binlist:
  - 'cliamp'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
