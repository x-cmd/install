lang: 'Go'
homepage: https://github.com/bjarneo/cliamp
license: 'MIT'
desc:
  cn: cliamp — 受 Winamp 启发的终端音乐播放器
  en: 'cliamp - Terminal music player inspired by winamp'
  cs: cliamp - Terminální hudební přehrávač inspirovaný Winampem
  de: cliamp - Terminal-Musikplayer, inspiriert von Winamp
  es: cliamp - Reproductor de música de terminal inspirado en Winamp
  fr: cliamp - Lecteur de musique pour terminal inspiré de Winamp
  id: cliamp - Pemutar musik terminal yang terinspirasi Winamp
  it: cliamp - Lettore musicale da terminale ispirato a Winamp
  ja: cliamp - Winamp にインスパイアされたターミナル音楽プレーヤー
  ko: cliamp - Winamp에서 영감을 받은 터미널 음악 플레이어
  pl: cliamp - Terminalowy odtwarzacz muzyki inspirowany Winampem
  pt: cliamp - Reprodutor de música de terminal inspirado no Winamp
  ro: cliamp - Player de muzică pentru terminal inspirat de Winamp
  ru: cliamp - Терминальный музыкальный проигрыватель, вдохновлённый Winamp
  th: cliamp - เครื่องเล่นเพลงสำหรับเทอร์มินัลที่ได้แรงบันดาลใจจาก Winamp
  tr: cliamp - Winamp'tan esinlenen terminal müzik çalar
  uk: cliamp - Термінальний музичний програвач, натхненний Winamp
  vi: cliamp - Trình phát nhạc terminal lấy cảm hứng từ Winamp
x:
  source: https://github.com/bjarneo/cliamp
  eget: bjarneo/cliamp
  brew: bjarneo/cliamp/cliamp
rule:
  darwin/brew:
    cmd: 'brew install bjarneo/cliamp/cliamp'
    reference: https://github.com/bjarneo/cliamp
  /eget:
    cmd: x eget bjarneo/cliamp
    reference: https://github.com/bjarneo/cliamp
binlist:
- 'cliamp'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 35 MB
          rating: 2
          desc:
            cn: 安装 35 MB
            en: 35 MB install
        download:
          estimate: 35 MB
          desc:
            cn: 约 35 MB 下载 (linux/x64)
            en: ~35 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
