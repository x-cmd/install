lang: Rust
homepage: https://github.com/jhheider/sanitize
license: Apache-2.0
desc:
  cn: 用 Rust 编写的简单命令行工具将目录清除到特定的白名单
  en: Simple command-line tool to sanitize a directory to a specific whitelist, written in Rust
x:
  source: https://github.com/jhheider/sanitize
rule:
  /cargo:
    cmd: cargo install sanitize
    reference: https://github.com/jhheider/sanitize?tab=readme-ov-file#install
    dsnap: sanitize
  /tea:
    cmd: tea +crates.io/sanitize true
    reference: https://github.com/jhheider/sanitize?tab=readme-ov-file#install
binlist:
- sanitize

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
