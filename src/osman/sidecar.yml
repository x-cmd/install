lang: 'Go'
homepage: 'https://github.com/marcus/sidecar'
license: 'MIT'
desc:
  cn: 配合 CLI Agent 使用的辅助工具，提供 diff、文件树、对话历史和 td 任务管理
  en: 'Use sidecar next to CLI agents for diffs, file trees, conversation history, and task management with td'
x:
  source: https://github.com/marcus/sidecar
  eget: https://github.com/marcus/sidecar
rule:
  /eget:
    cmd: x eget marcus/sidecar
    reference: https://github.com/marcus/sidecar
binlist:
  - 'sidecar'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
