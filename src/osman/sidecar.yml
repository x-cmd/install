lang: 'Go'
homepage: 'https://github.com/marcus/sidecar'
license: 'MIT'
desc:
  cn: 配合 CLI Agent 使用的辅助工具，提供 diff、文件树、对话历史和 td 任务管理
  en: 'Use sidecar next to CLI agents for diffs, file trees, conversation history, and task management with td'
x:
  source: https://github.com/marcus/sidecar
  eget: https://github.com/marcus/sidecar
rule:
  /eget:
    cmd: x eget marcus/sidecar
    reference: https://github.com/marcus/sidecar
binlist:
- 'sidecar'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 58 MB
          rating: 3
          desc:
            cn: 约 58 MB（估算）
            en: ~58 MB estimated
        download:
          estimate: 18 MB
          desc:
            cn: 约 18 MB 下载 (linux/x64)
            en: ~18 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
