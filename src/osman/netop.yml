lang: Rust
homepage: https://github.com/ZingerLittleBee/netop
license: MIT
desc:
  cn: netop 是可以自定义过滤网络流量规则的终端命令行界面。
  en: netop is a terminal command line interface that can customize the filter network traffic rule.
x:
  source: https://github.com/ZingerLittleBee/netop
rule:
  /cargo:
    cmd: sudo cargo install netop
    reference: https://github.com/ZingerLittleBee/netop#installation
    dsnap: netop
  netbsd/pkgin:
    cmd: pkgin install netop
    reference: https://github.com/ZingerLittleBee/netop#installation
  arch/yay:
    cmd: yay -S netop
    reference: https://aur.archlinux.org/packages/netop
binlist:
- netop

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
