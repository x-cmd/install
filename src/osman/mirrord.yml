lang: Rust
homepage: https://github.com/metalbear-co/mirrord
license: MIT
desc:
  cn: 用于连接本地进程和云环境，以在云条件下运行本地代码
  en: Connect your local process and your cloud environment, and run local code in cloud conditions
x:
  source: https://github.com/metalbear-co/mirrord
  eget: https://github.com/metalbear-co/mirrord
  brew: metalbear-co/mirrord/mirrord
  yay: mirrord
rule:
  /x:
    cmd: x pkg use mirrord
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget metalbear-co/mirrord
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install metalbear-co/mirrord/mirrord
    reference: https://github.com/metalbear-co/mirrord#installation-2
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/metalbear-co/mirrord/main/scripts/install.sh | bash
    reference: https://github.com/metalbear-co/mirrord#installation-2
  arch/yay:
    cmd: yay -S mirrord
    reference: https://aur.archlinux.org/packages/mirrord
binlist:
- mirrord

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
