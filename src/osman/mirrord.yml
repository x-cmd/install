lang: Rust
homepage: https://github.com/metalbear-co/mirrord
license: MIT
desc:
  cn: 用于连接本地进程和云环境，以在云条件下运行本地代码
  en: Connect your local process and your cloud environment, and run local code in cloud conditions
x:
  pkg:
    exist: true
  source: https://github.com/metalbear-co/mirrord
  eget: https://github.com/metalbear-co/mirrord
rule:
  /x:
    cmd: x pkg use mirrord
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget metalbear-co/mirrord
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install metalbear-co/mirrord/mirrord
    reference: https://github.com/metalbear-co/mirrord#installation-2
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/metalbear-co/mirrord/main/scripts/install.sh | bash
    reference: https://github.com/metalbear-co/mirrord#installation-2
  arch/yay:
    cmd: yay -S mirrord
    reference: https://aur.archlinux.org/packages/mirrord
binlist:
- mirrord
