lang: Python
homepage: https://github.com/XuehaiPan/nvitop
license: Apache-2.0
desc:
  cn: 一个交互式的 NVIDIA-GPU 进程查看器及更多功能。
  en: An interactive NVIDIA-GPU process viewer and beyond.
x:
  source: https://github.com/XuehaiPan/nvitop
  pip: --upgrade
rule:
  /pipx:
    cmd: pipx install nvitop
    reference: https://github.com/XuehaiPan/nvitop#installation
  /pip:
    cmd: pip3 install --upgrade nvitop
    reference: https://github.com/XuehaiPan/nvitop#installation
    dsnap: nvitop
  /conda:
    cmd: conda install -c conda-forge nvitop
    reference: https://github.com/XuehaiPan/nvitop#installation
binlist:
- nvitop

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 38 KB
          rating: 1
          desc:
            cn: 约 38 KB（估算）
            en: ~38 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
