lang: Python
homepage: https://github.com/XuehaiPan/nvitop
license: Apache-2.0
desc:
  cn: 一个交互式的 NVIDIA-GPU 进程查看器及更多功能。
  en: An interactive NVIDIA-GPU process viewer and beyond.
x:
  source: https://github.com/XuehaiPan/nvitop
rule:
  /pipx:
    cmd: pipx install nvitop
    reference: https://github.com/XuehaiPan/nvitop#installation
  /pip:
    cmd: pip3 install --upgrade nvitop
    reference: https://github.com/XuehaiPan/nvitop#installation
    dsnap: nvitop
  /conda:
    cmd: conda install -c conda-forge nvitop
    reference: https://github.com/XuehaiPan/nvitop#installation
binlist:
- nvitop

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
