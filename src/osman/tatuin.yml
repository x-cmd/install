lang: 'Rust'
homepage: 'https://github.com/panter-dsd/tatuin'
license: 'MIT'
desc:
  cn: 面向多任务提供商的任务聚合 TUI
  en: 'Tatuin (Task Aggregator TUI for N providers)'
  cs: Tatuin (TUI agregátoru úkolů pro N poskytovatelů)
  de: Tatuin (TUI-Aufgabenaggregator für N Anbieter)
  es: Tatuin (TUI agregador de tareas para N proveedores)
  fr: Tatuin (TUI d'agrégation de tâches pour N fournisseurs)
  id: Tatuin (TUI agregator tugas untuk N penyedia)
  it: Tatuin (TUI aggregatore di attività per N provider)
  ja: Tatuin (N 個のプロバイダー向けタスク集約 TUI)
  ko: Tatuin (N개 제공자를 위한 작업 집계 TUI)
  pl: Tatuin (TUI agregator zadań dla N dostawców)
  pt: Tatuin (TUI agregador de tarefas para N provedores)
  ro: Tatuin (TUI agregator de sarcini pentru N furnizori)
  ru: Tatuin (TUI-агрегатор задач для N провайдеров)
  th: Tatuin (TUI รวมงานสำหรับ N ผู้ให้บริการ)
  tr: Tatuin (N sağlayıcı için görev toplayan TUI)
  uk: Tatuin (TUI-агрегатор завдань для N провайдерів)
  vi: Tatuin (TUI tổng hợp tác vụ cho N nhà cung cấp)
x:
  source: https://github.com/panter-dsd/tatuin
  eget: panter-dsd/tatuin
rule:
  /eget:
    cmd: x eget panter-dsd/tatuin
    reference: https://github.com/panter-dsd/tatuin
binlist:
- 'tatuin'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
