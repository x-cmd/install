lang: 'Rust'
homepage: 'https://github.com/panter-dsd/tatuin'
license: 'MIT'
desc:
  cn: 面向多任务提供商的任务聚合 TUI
  en: 'Tatuin (Task Aggregator TUI for N providers)'
x:
  source: https://github.com/panter-dsd/tatuin
  eget: panter-dsd/tatuin
rule:
  /eget:
    cmd: x eget panter-dsd/tatuin
    reference: https://github.com/panter-dsd/tatuin
binlist:
- 'tatuin'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
