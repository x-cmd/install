lang: 'Rust'
homepage: 'https://github.com/panter-dsd/tatuin'
license: 'MIT'
desc:
  cn: 面向多任务提供商的任务聚合 TUI
  en: 'Tatuin (Task Aggregator TUI for N providers)'
x:
  source: https://github.com/panter-dsd/tatuin
  eget: https://github.com/panter-dsd/tatuin
rule:
  /eget:
    cmd: x eget panter-dsd/tatuin
    reference: https://github.com/panter-dsd/tatuin
binlist:
  - 'tatuin'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 497 KB
          rating: 1
          desc:
            cn: 约 497 KB（估算）
            en: ~497 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
