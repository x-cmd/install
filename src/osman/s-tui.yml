lang: Python
homepage: https://github.com/amanusk/s-tui
license: GPL-2.0
desc:
  cn: 基于终端的 CPU 压力和监控实用程序
  en: Stress Terminal UI stress test and monitoring tool
x:
  pkg:
    exist: true
  source: https://github.com/amanusk/s-tui
rule:
  /x:
    cmd: x pkg use s-tui
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S s-tui-git
    reference: https://aur.archlinux.org/packages/s-tui-git
  /pip:
    cmd: pip install s-tui --user
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
    dsnap: s-tui
  /apt:
    cmd: sudo apt install s-tui
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
  /pacman:
    cmd: sudo pacman -S s-tui
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
  /zypper:
    cmd: sudo zypper install s-tui
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
  /dnf:
    cmd: sudo dnf install s-tui
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
binlist:
- s-tui

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
