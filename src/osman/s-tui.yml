lang: Python
homepage: https://github.com/amanusk/s-tui
license: GPL-2.0
desc:
  cn: 基于终端的 CPU 压力和监控实用程序
  en: Stress Terminal UI stress test and monitoring tool
  cs: Nástroj pro stresové testování a monitorování CPU v terminálu
  de: Ein Werkzeug für CPU-Stresstests und -Überwachung im Terminal
  es: Herramienta de prueba de estrés y monitorización de CPU basada en terminal
  fr: Outil de test de charge et de surveillance du CPU pour le terminal
  id: Alat uji beban dan pemantauan CPU berbasis terminal
  it: Strumento di stress test e monitoraggio della CPU basato sul terminale
  ja: ターミナルベースの CPU ストレステストおよびモニタリングツールです。
  ko: 터미널 기반 CPU 스트레스 테스트 및 모니터링 도구입니다.
  pl: Narzędzie terminalowe do testów obciążeniowych i monitorowania procesora
  pt: Ferramenta de teste de estresse e monitoramento de CPU baseada em terminal
  ro: Instrument de testare la încărcare și monitorizare a CPU-ului bazat pe terminal
  ru: Терминальный инструмент для стресс-тестирования и мониторинга CPU
  th: เครื่องมือทดสอบความเครียดและติดตาม CPU แบบเทอร์มินัล
  tr: Terminal tabanlı CPU stres testi ve izleme aracı
  uk: Термінальний інструмент для стрес-тестування та моніторингу CPU
  vi: Công cụ kiểm tra tải và giám sát CPU dựa trên terminal
x:
  source: https://github.com/amanusk/s-tui
  apt: s-tui
  dnf: s-tui
  pacman: s-tui
  zypper: s-tui
  yay: s-tui-git
  pip: s-tui
rule:
  /x:
    cmd: x pkg use s-tui
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S s-tui-git
    reference: https://aur.archlinux.org/packages/s-tui-git
  /pip:
    cmd: pip install s-tui --user
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
    dsnap: s-tui
  /apt:
    cmd: sudo apt install s-tui
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
  /pacman:
    cmd: sudo pacman -S s-tui
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
  /zypper:
    cmd: sudo zypper install s-tui
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
  /dnf:
    cmd: sudo dnf install s-tui
    reference: https://github.com/amanusk/s-tui?tab=readme-ov-file#simple-installation
binlist:
- s-tui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 KB
          rating: 1
          desc:
            cn: 约 17 KB（估算）
            en: ~17 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
