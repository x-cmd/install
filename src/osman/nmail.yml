lang: 'C++'
homepage: 'https://github.com/d99kris/nmail'
license: 'MIT'
desc:
  cn: Linux 与 macOS 的终端邮件客户端
  en: 'Terminal-based email client for Linux and macOS'
x:
  source: https://github.com/d99kris/nmail
  eget: https://github.com/d99kris/nmail
rule:
  /eget:
    cmd: x eget d99kris/nmail
    reference: https://github.com/d99kris/nmail
binlist:
  - 'nmail'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 918 KB
          rating: 1
          desc:
            cn: 约 918 KB（估算）
            en: ~918 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
