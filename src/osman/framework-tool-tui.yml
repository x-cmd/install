lang: 'Rust'
homepage: 'https://github.com/grouzen/framework-tool-tui'
license: 'MIT'
desc:
  cn: Rust 编写的 TUI，用于控制与监控 Framework Computers 硬件
  en: 'A TUI for controlling and monitoring Framework Computers hardware built in Rust'
x:
  source: https://github.com/grouzen/framework-tool-tui
  eget: https://github.com/grouzen/framework-tool-tui
rule:
  /eget:
    cmd: x eget grouzen/framework-tool-tui
    reference: https://github.com/grouzen/framework-tool-tui
binlist:
  - 'framework-tool-tui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
