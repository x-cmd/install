lang: 'Rust'
homepage: 'https://github.com/azat/chdig'
license: 'MIT'
desc:
  cn: 用 TUI 深入探查 ClickHouse
  en: 'Dig into ClickHouse with TUI interface.'
x:
  source: https://github.com/azat/chdig
  eget: https://github.com/azat/chdig
rule:
  /eget:
    cmd: x eget azat/chdig
    reference: https://github.com/azat/chdig
binlist:
  - 'chdig'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
