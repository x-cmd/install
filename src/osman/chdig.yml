lang: 'Rust'
homepage: 'https://github.com/azat/chdig'
license: 'MIT'
desc:
  cn: 用 TUI 深入探查 ClickHouse
  en: 'Dig into ClickHouse with TUI interface.'
  cs: Ponikněte do ClickHouse s rozhraním TUI.
  de: Mit der TUI-Oberfläche in ClickHouse herumstöbern.
  es: Indaga en ClickHouse con la interfaz TUI.
  fr: Explorez ClickHouse avec une interface TUI.
  id: Telusuri ClickHouse dengan antarmuka TUI.
  it: Esplora ClickHouse con l'interfaccia TUI.
  ja: TUI インターフェースで ClickHouse を深掘りする。
  ko: TUI 인터페이스로 ClickHouse를 탐색하세요.
  pl: Zagłęb się w ClickHouse za pomocą interfejsu TUI.
  pt: Explore o ClickHouse com a interface TUI.
  ro: Explorați ClickHouse cu interfața TUI.
  ru: Погружение в ClickHouse с помощью интерфейса TUI.
  th: เจาะลึก ClickHouse ด้วยอินเทอร์เฟซ TUI
  tr: TUI arayüzüyle ClickHouse içinde dolaşın.
  uk: Досліджуйте ClickHouse за допомогою інтерфейсу TUI.
  vi: Khám phá sâu ClickHouse với giao diện TUI.
x:
  source: https://github.com/azat/chdig
  eget: azat/chdig
rule:
  /eget:
    cmd: x eget azat/chdig
    reference: https://github.com/azat/chdig
binlist:
- 'chdig'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (macos/x64)
            en: ~7 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
