lang: Rust
homepage: https://github.com/edmocosta/tuistash
license: Apache-2.0
desc:
  cn: 用于查看 Logstash 的终端用户界面
  en: A terminal user interface for Logstash.
x:
  source: https://github.com/edmocosta/tuistash
  eget: https://github.com/edmocosta/tuistash
rule:
  /eget:
    cmd: x eget edmocosta/tuistash
    reference: https://x-cmd.com/mod/eget
  arch/paru:
    cmd: paru -S tuistash
    reference: https://github.com/edmocosta/tuistash?tab=readme-ov-file#arch-linux
  arch/yay:
    cmd: yay -S tuistash
    reference: https://aur.archlinux.org/packages/tuistash
  /brew:
    cmd: brew install edmocosta/homebrew-tap/tuistash
    reference: https://github.com/edmocosta/tuistash?tab=readme-ov-file#homebrew
  /cargo:
    cmd: 'curl https://sh.rustup.rs -sSf | sh && \

      git clone https://github.com/edmocosta/tuistash.git && \

      cd tuistash && \

      cargo build --release

      '
    reference: https://github.com/edmocosta/tuistash?tab=readme-ov-file#manual
    dsnap: tuistash
binlist:
- tuistash
