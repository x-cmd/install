lang: Rust
homepage: https://github.com/edmocosta/tuistash
license: Apache-2.0
desc:
  cn: 用于查看 Logstash 的终端用户界面
  en: A terminal user interface for Logstash.
  cs: Terminálové uživatelské rozhraní pro Logstash.
  de: Eine Terminal-Benutzeroberfläche für Logstash.
  es: Una interfaz de usuario de terminal para Logstash.
  fr: Une interface utilisateur en terminal pour Logstash.
  id: Antarmuka pengguna berbasis terminal untuk Logstash.
  it: Un'interfaccia utente a terminale per Logstash.
  ja: Logstash 用のターミナルユーザーインターフェース。
  ko: Logstash를 위한 터미널 사용자 인터페이스.
  pl: Terminalowy interfejs użytkownika dla Logstash.
  pt: Uma interface de usuário de terminal para o Logstash.
  ro: O interfață de utilizator în terminal pentru Logstash.
  ru: Терминальный пользовательский интерфейс для Logstash.
  th: ส่วนติดต่อผู้ใช้บนเทอร์มินัลสำหรับ Logstash
  tr: Logstash için terminal kullanıcı arayüzü.
  uk: Термінальний користувацький інтерфейс для Logstash.
  vi: Giao diện người dùng trên terminal cho Logstash.
x:
  source: https://github.com/edmocosta/tuistash
  eget: edmocosta/tuistash
  brew: edmocosta/homebrew-tap/tuistash
  yay: tuistash
  paru: tuistash
rule:
  /eget:
    cmd: x eget edmocosta/tuistash
    reference: https://x-cmd.com/mod/eget
  arch/paru:
    cmd: paru -S tuistash
    reference: https://github.com/edmocosta/tuistash?tab=readme-ov-file#arch-linux
  arch/yay:
    cmd: yay -S tuistash
    reference: https://aur.archlinux.org/packages/tuistash
  /brew:
    cmd: brew install edmocosta/homebrew-tap/tuistash
    reference: https://github.com/edmocosta/tuistash?tab=readme-ov-file#homebrew
  /cargo:
    cmd: 'curl https://sh.rustup.rs -sSf | sh && \

      git clone https://github.com/edmocosta/tuistash.git && \

      cd tuistash && \

      cargo build --release

      '
    reference: https://github.com/edmocosta/tuistash?tab=readme-ov-file#manual
    dsnap: tuistash
binlist:
- tuistash

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
