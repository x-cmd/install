lang: 'Rust'
homepage: https://github.com/Firstp1ck/Pacsea
license: 'MIT'
desc:
  cn: 极速 TUI，搜索、查看并排队 pacman/AUR 软件包
  en: 'Fast TUI for searching, inspecting, and queueing pacman/AUR packages.'
x:
  source: https://github.com/Firstp1ck/Pacsea
  eget: https://github.com/Firstp1ck/Pacsea
rule:
  /eget:
    cmd: x eget Firstp1ck/Pacsea
    reference: https://github.com/Firstp1ck/Pacsea
binlist:
  - 'pacsea'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.1 MB
          rating: 1
          desc:
            cn: 约 6.1 MB（估算）
            en: ~6.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
