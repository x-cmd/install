lang: 'Rust'
homepage: https://github.com/Firstp1ck/Pacsea
license: 'MIT'
desc:
  cn: 极速 TUI，搜索、查看并排队 pacman/AUR 软件包
  en: 'Fast TUI for searching, inspecting, and queueing pacman/AUR packages.'
  cs: Rychlé TUI pro vyhledávání, prohlížení a řazení balíčků pacman/AUR do fronty.
  de: Schnelle TUI zum Suchen, Prüfen und Einreihen von pacman/AUR-Paketen.
  es: TUI rápida para buscar, inspeccionar y poner en cola paquetes de pacman/AUR.
  fr: TUI rapide pour rechercher, inspecter et mettre en file d'attente des paquets pacman/AUR.
  id: TUI cepat untuk mencari, memeriksa, dan mengantre paket pacman/AUR.
  it: TUI veloce per cercare, ispezionare e mettere in coda i pacchetti pacman/AUR.
  ja: pacman/AUR パッケージの検索・確認・キュー登録用の高速な TUI。
  ko: pacman/AUR 패키지를 검색하고 살펴보고 대기열에 넣는 빠른 TUI.
  pl: Szybkie TUI do wyszukiwania, przeglądania i kolejkowania pakietów pacman/AUR.
  pt: TUI rápida para pesquisar, inspecionar e enfileirar pacotes pacman/AUR.
  ro: TUI rapid pentru căutarea, inspectarea și punerea în coadă a pachetelor pacman/AUR.
  ru: Быстрый TUI для поиска, просмотра и постановки в очередь пакетов pacman/AUR.
  th: TUI ที่รวดเร็วสำหรับค้นหา ตรวจสอบ และจัดคิวแพ็กเกจ pacman/AUR
  tr: pacman/AUR paketlerini aramak, incelemek ve kuyruğa almak için hızlı bir TUI.
  uk: Швидкий TUI для пошуку, перегляду та черги в чергу пакетів pacman/AUR.
  vi: TUI nhanh để tìm kiếm, xem xét và xếp hàng các gói pacman/AUR.
x:
  source: https://github.com/Firstp1ck/Pacsea
  eget: Firstp1ck/Pacsea
rule:
  /eget:
    cmd: x eget Firstp1ck/Pacsea
    reference: https://github.com/Firstp1ck/Pacsea
binlist:
  - 'pacsea'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.1 MB
          rating: 1
          desc:
            cn: 约 6.1 MB（估算）
            en: ~6.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
