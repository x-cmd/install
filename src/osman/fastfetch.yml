lang: C
homepage: https://github.com/fastfetch-cli/fastfetch
license: MIT
desc:
  cn: Fastfetch 是一个类似 neofetch 的工具，用于获取系统信息并以漂亮的方式显示它们
  en: Fastfetch is a neofetch-like tool for fetching system information and displaying them in a pretty way
  cs: Fastfetch je nástroj podobný neofetch, který získává systémové informace a zobrazuje je hezky
  de: Fastfetch ist ein neofetch-ähnliches Werkzeug zum Abrufen von Systeminformationen und deren ansprechender Anzeige
  es: Fastfetch es una herramienta similar a neofetch que obtiene información del sistema y la muestra de forma atractiva
  fr: Fastfetch est un outil similaire à neofetch qui récupère les informations système et les affiche de manière soignée
  id: Fastfetch adalah alat mirip neofetch untuk mengambil informasi sistem dan menampilkannya dengan rapi
  it: Fastfetch è uno strumento simile a neofetch che raccoglie informazioni di sistema e le mostra in modo accattivante
  ja: Fastfetchはneofetchに似た、システムの情報を取得してしているのですばやく表示するツール
  ko: Fastfetch는 시스템 정보를 가져와 보기 좋게 표시하는 neofetch 유사 도구입니다
  pl: Fastfetch to narzędzie podobne do neofetch, które pobiera informacje o systemie i wyświetla je w atrakcyjny sposób
  pt: Fastfetch é uma ferramenta semelhante ao neofetch que obtém informações do sistema e as exibe de forma apresentável
  ro: Fastfetch este un instrument asemănător cu neofetch, care adună informații despre sistem și le afișează într-un mod elegant
  ru: Fastfetch — инструмент, похожий на neofetch, который получает сведения о системе и красиво их отображает
  th: Fastfetch เป็นเครื่องมือคล้าย neofetch ที่ดึงข้อมูลระบบและแสดงผลอย่างสวยงาม
  tr: Fastfetch, sistem bilgilerini alıp güzel bir şekilde gösteren neofetch benzeri bir araçtır
  uk: Fastfetch — інструмент, схожий на neofetch, який збирає відомості про систему та красиво їх показує
  vi: Fastfetch là công cụ tương tự neofetch để lấy thông tin hệ thống và hiển thị một cách đẹp mắt
x:
  source: https://github.com/fastfetch-cli/fastfetch
  eget: fastfetch-cli/fastfetch
  apt: fastfetch
  dnf: fastfetch
  brew: fastfetch
  pacman: fastfetch
  zypper: fastfetch
  port: fastfetch
  emerge: app-misc/fastfetch
  scoop: fastfetch
  winget: fastfetch
  yay: fastfetch-git
rule:
  /eget:
    cmd: x eget fastfetch-cli/fastfetch
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use fastfetch
    reference: https://x-cmd.com/install/
  debian/apt:
    cmd: sudo apt install fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#installation
    dsnap: fastfetch
  ubuntu/apt:
    cmd: 'sudo add-apt-repository ppa:zhangsongcui3371/fastfetch && \

      sudo apt update && \

      sudo apt install fastfetch

      '
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#installation
    dsnap: fastfetch
  arch/pacman:
    cmd: sudo pacman -S fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#linux
  arch/yay:
    cmd: yay -S fastfetch-git
    reference: https://aur.archlinux.org/packages/fastfetch-git
  fedora/dnf:
    cmd: sudo dnf install fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#linux
    dsnap: fastfetch
  gentoo/emerge:
    cmd: sudo emerge --ask app-misc/fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#linux
  alpine/apk:
    cmd: apk add --upgrade fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#linux
    dsnap: fastfetch
  nix/nix-shell:
    cmd: nix-shell -p fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#linux
  opensuse/zypper:
    cmd: sudo zypper install fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#linux
  darwin/brew:
    cmd: brew install fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#macos
  darwin/port:
    cmd: sudo port install fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#macos
  (win|wsl2)/scoop:
    cmd: x scoop install fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#windows
  (win|wsl2)/choco:
    cmd: x winget install fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#windows
  msys2/pacman:
    cmd: pacman -S mingw-w64-<subsystem>-<arch>-fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#windows
  freebsd/pkg:
    cmd: pkg install fastfetch
    reference: https://github.com/fastfetch-cli/fastfetch?tab=readme-ov-file#freebsd
binlist:
- fastfetch
# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 /etc/os-release, /proc, /sys, 可选 dmidecode
          en: Reads /etc/os-release, /proc, /sys, optionally dmidecode
        sensitive:
        - "/sys/class/dmi/id/product_serial"
        - "/sys/class/dmi/id/product_uuid"
  resource:
    disk:
      size:
        install:
          estimate: 6.0 MB
          rating: 1
          desc:
            cn: 安装 6.0 MB
            en: 6.0 MB install
        growth:
          desc:
            cn: 几乎不增长
            en: Minimal growth
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config:
        - "$HOME/.config/fastfetch/config.jsonc"
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
      peak:
        estimate: 30 MB
        desc:
          cn: ~30 MB
          en: ~30 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 解析系统信息时短暂占用
          en: Brief spike on system info parsing
  platform:
    win: full
    linux: full
    darwin: full
