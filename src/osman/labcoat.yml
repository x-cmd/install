lang: 'Go'
homepage: 'https://github.com/jhillyerd/labcoat'
license: 'MIT'
desc:
  cn: NixOS 系统部署 TUI
  en: 'NixOS system deployment TUI'
x:
  source: https://github.com/jhillyerd/labcoat
  eget: https://github.com/jhillyerd/labcoat
rule:
  /eget:
    cmd: x eget jhillyerd/labcoat
    reference: https://github.com/jhillyerd/labcoat
binlist:
  - 'labcoat'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 286 KB
          rating: 1
          desc:
            cn: 约 286 KB（估算）
            en: ~286 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
