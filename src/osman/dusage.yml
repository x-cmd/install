lang: 'Rust'
homepage: 'https://github.com/mihaigalos/dusage'
license: 'MIT'
desc:
  cn: 命令行磁盘使用信息工具
  en: '💾 A command line disk usage information tool.'
x:
  source: https://github.com/mihaigalos/dusage
  eget: https://github.com/mihaigalos/dusage
rule:
  /eget:
    cmd: x eget mihaigalos/dusage
    reference: https://github.com/mihaigalos/dusage
binlist:
- 'dusage'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 KB
          rating: 1
          desc:
            cn: 约 20 KB（估算）
            en: ~20 KB estimated
        download:
          estimate: 407 KB
          desc:
            cn: 约 407 KB 下载 (linux/x64)
            en: ~407 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
