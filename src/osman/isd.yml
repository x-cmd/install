lang: Python
homepage: https://github.com/isd-project/isd
desc:
  cn: isd (interactive systemd) — 更好地操作 systemd 单元
  en: isd (interactive systemd) – a better way to work with systemd units
x:
  source: https://github.com/isd-project/isd
  eget: https://github.com/isd-project/isd
rule:
  /eget:
    cmd: x eget isd-project/isd
    reference: https://github.com/isd-project/isd
binlist:
- isd
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 8 KB
          rating: 1
          desc:
            cn: 约 8 KB（估算）
            en: ~8 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
