lang: Python
homepage: https://github.com/isd-project/isd
desc:
  cn: isd (interactive systemd) — 更好地操作 systemd 单元
  en: isd (interactive systemd) – a better way to work with systemd units
x:
  source: https://github.com/isd-project/isd
  eget: https://github.com/isd-project/isd
rule:
  /eget:
    cmd: x eget isd-project/isd
    reference: https://github.com/isd-project/isd
binlist:
- isd
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
