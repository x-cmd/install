lang: 'Go'
homepage: 'https://github.com/clawscli/claws'
license: 'Apache-2.0'
desc:
  cn: 类 k9s 的 AWS 资源管理 TUI，支持 vim 风格导航
  en: 'k9s-inspired TUI for AWS resource management with vim-style navigation'
x:
  source: https://github.com/clawscli/claws
  eget: clawscli/claws
rule:
  /eget:
    cmd: x eget clawscli/claws
    reference: https://github.com/clawscli/claws
binlist:
- 'claws'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
