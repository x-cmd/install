lang: 'Go'
homepage: 'https://github.com/clawscli/claws'
license: 'Apache-2.0'
desc:
  cn: 类 k9s 的 AWS 资源管理 TUI，支持 vim 风格导航
  en: 'k9s-inspired TUI for AWS resource management with vim-style navigation'
  cs: TUI inspirovaný k9s pro správu zdrojů AWS s navigací ve stylu vim
  de: Eine von k9s inspirierte TUI zur AWS-Ressourcenverwaltung mit Navigation im vim-Stil
  es: TUI inspirada en k9s para la gestión de recursos de AWS con navegación al estilo vim
  fr: Une TUI inspirée de k9s pour la gestion des ressources AWS avec une navigation de style vim
  id: TUI terinspirasi k9s untuk manajemen sumber daya AWS dengan navigasi bergaya vim
  it: TUI ispirata a k9s per la gestione delle risorse AWS con navigazione in stile vim
  ja: k9s から着想を得た、vim スタイルのナビゲーションを備えた AWS リソース管理 TUI
  ko: k9s에서 영감을 받은 vim 스타일 탐색을 제공하는 AWS 리소스 관리 TUI
  pl: TUI inspirowany k9s do zarządzania zasobami AWS z nawigacją w stylu vima
  pt: TUI inspirada no k9s para gerenciamento de recursos da AWS com navegação no estilo vim
  ro: TUI inspirată de k9s pentru gestionarea resurselor AWS cu navigare în stil vim
  ru: TUI, вдохновлённый k9s, для управления ресурсами AWS с навигацией в стиле vim
  th: TUI ได้แรงบันดาลใจจาก k9s สำหรับการจัดการทรัพยากร AWS พร้อมการนำทางแบบ vim
  tr: vim tarzı gezinmeyle AWS kaynak yönetimi için k9s esinli TUI
  uk: TUI, натхненний k9s, для керування ресурсами AWS з навігацією у стилі vim
  vi: TUI lấy cảm hứng từ k9s để quản lý tài nguyên AWS với điều hướng kiểu vim
x:
  source: https://github.com/clawscli/claws
  eget: clawscli/claws
rule:
  /eget:
    cmd: x eget clawscli/claws
    reference: https://github.com/clawscli/claws
binlist:
- 'claws'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
