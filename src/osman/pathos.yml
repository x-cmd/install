lang: Go
homepage: https://github.com/chip/pathos
license: MIT
desc:
  cn: 用于编辑 PATH 环境变量的 CLI 工具。
  en: CLI for editing a PATH env variable.
x:
  source: https://github.com/chip/pathos
rule:
  /go:
    cmd: go install github.com/chip/pathos@latest
    reference: https://github.com/chip/pathos#installation
    dsnap: github.com/chip/pathos@latest
binlist:
- pathos

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 19 KB
          rating: 1
          desc:
            cn: 约 19 KB（估算）
            en: ~19 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
