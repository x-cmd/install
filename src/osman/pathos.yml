lang: Go
homepage: https://github.com/chip/pathos
license: MIT
desc:
  cn: 用于编辑 PATH 环境变量的 CLI 工具。
  en: CLI for editing a PATH env variable.
x:
  source: https://github.com/chip/pathos
rule:
  /go:
    cmd: go install github.com/chip/pathos@latest
    reference: https://github.com/chip/pathos#installation
    dsnap: github.com/chip/pathos@latest
binlist:
- pathos

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
