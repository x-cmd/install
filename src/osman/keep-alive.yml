lang: 'Go'
homepage: 'https://github.com/stigoleg/keep-alive'
license: 'MIT'
desc:
  cn: 轻量跨平台工具，防止系统休眠，适合下载、长连接或长时任务
  en: 'Keep-Alive is a lightweight, cross-platform utility to prevent your system from sleeping. Perfect for uninterrupted downloads, active connections, or long-running tasks, like vibe coding.'
x:
  source: https://github.com/stigoleg/keep-alive
  eget: https://github.com/stigoleg/keep-alive
  apt: ydotool'
rule:
  debian/apt:
    cmd: 'sudo apt install ydotool'
    reference: https://github.com/stigoleg/keep-alive
  /eget:
    cmd: x eget stigoleg/keep-alive
    reference: https://github.com/stigoleg/keep-alive
binlist:
- 'keep-alive'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
