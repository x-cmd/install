lang: 'Go'
homepage: 'https://github.com/stigoleg/keep-alive'
license: 'MIT'
desc:
  cn: 轻量跨平台工具，防止系统休眠，适合下载、长连接或长时任务
  en: 'Keep-Alive is a lightweight, cross-platform utility to prevent your system from sleeping. Perfect for uninterrupted downloads, active connections, or long-running tasks, like vibe coding.'
x:
  source: https://github.com/stigoleg/keep-alive
  eget: https://github.com/stigoleg/keep-alive
rule:
  debian/apt:
    cmd: 'sudo apt install ydotool'
    reference: https://github.com/stigoleg/keep-alive
  /eget:
    cmd: x eget stigoleg/keep-alive
    reference: https://github.com/stigoleg/keep-alive
binlist:
  - 'keep-alive'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
