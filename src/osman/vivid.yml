lang: Rust
homepage: https://github.com/sharkdp/vivid
license: Apache-2.0
desc:
  cn: vivid 是一个控制 ls、 tree、 fd、 bfs、dust 和许多其他工具的彩色输出的 LS _ COlors 环境变量的生成器
  en: vivid is a generator for the LS_COLORS environment variable that controls the colorized output of ls, tree, fd, bfs, dust and many other tools
x:
  source: https://github.com/sharkdp/vivid
  eget: https://github.com/sharkdp/vivid
rule:
  /eget:
    cmd: x eget sharkdp/vivid
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install vivid
    reference: https://github.com/sharkdp/vivid?tab=readme-ov-file#from-source
    dsnap: vivid
  darwin/brew:
    cmd: brew install vivid
    reference: https://github.com/sharkdp/vivid?tab=readme-ov-file#on-macos
binlist:
- vivid

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
