lang: Rust
homepage: https://github.com/sharkdp/vivid
license: Apache-2.0
desc:
  cn: vivid 是一个控制 ls、 tree、 fd、 bfs、dust 和许多其他工具的彩色输出的 LS _ COlors 环境变量的生成器
  en: vivid is a generator for the LS_COLORS environment variable that controls the colorized output of ls, tree, fd, bfs, dust and many other tools
x:
  source: https://github.com/sharkdp/vivid
  eget: https://github.com/sharkdp/vivid
  brew: vivid
  cargo: vivid
rule:
  /eget:
    cmd: x eget sharkdp/vivid
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install vivid
    reference: https://github.com/sharkdp/vivid?tab=readme-ov-file#from-source
    dsnap: vivid
  darwin/brew:
    cmd: brew install vivid
    reference: https://github.com/sharkdp/vivid?tab=readme-ov-file#on-macos
binlist:
- vivid

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 444 KB
          rating: 1
          desc:
            cn: 安装 444 KB
            en: 444 KB install
        download:
          estimate: 444 KB
          desc:
            cn: 约 444 KB 下载 (linux/x64)
            en: ~444 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
