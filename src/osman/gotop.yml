lang: Go
homepage: https://github.com/xxxserxxx/gotop
desc:
  cn: 基于终端的图形界面监视器，用于在终端中显示系统资源的使用情况
  en: Terminal based graphical interface monitor
  cs: Monitor systému s grafickým rozhraním založený na terminálu
  de: Terminalbasiertes grafisches Systemmonitoring
  es: Monitor gráfico de recursos del sistema basado en terminal
  fr: Moniteur graphique de ressources système basé sur le terminal
  id: Monitor sistem berbasis terminal dengan antarmuka grafis
  it: Monitor di sistema con interfaccia grafica basato sul terminale
  ja: ターミナルベースのグラフィカルインターフェースでシステムリソースを監視するツール
  ko: 터미널 기반 그래픽 인터페이스 시스템 모니터
  pl: Terminalowy monitor systemu z graficznym interfejsem
  pt: Monitor gráfico de recursos do sistema baseado em terminal
  ro: Monitor grafic de resurse de sistem bazat pe terminal
  ru: Графический монитор системных ресурсов на основе терминала
  th: เครื่องมือติดตามทรัพยากรระบบแบบกราฟิกที่ใช้เทอร์มินัล
  tr: Terminal tabanlı grafik arayüzlü sistem monitörü
  uk: Графічний монітор системних ресурсів на основі терміналу
  vi: Trình giám sát hệ thống có giao diện đồ họa chạy trên terminal
x:
  source: https://github.com/xxxserxxx/gotop
  eget: xxxserxxx/gotop
  brew: gotop
  emerge: gotop
  scoop: gotop
  yay: gotop-bin
rule:
  /x:
    cmd: x pkg use gotop
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget xxxserxxx/gotop
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install gotop
    reference: https://formulae.brew.sh/formula/gotop#default
  arch/yay:
    cmd: yay -S gotop-bin
    reference: https://aur.archlinux.org/packages/gotop-bin
  (win|wsl2)/scoop:
    cmd: x scoop install gotop
    reference: https://github.com/cli/cli#scoop
  gentoo/emerge:
    cmd: 'sudo layman -a guru \

      && sudo emerge gotop

      '
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#gentoo
  nix/nixpkgs:
    cmd: nix-shell -p gotop --run gotop
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#nixnixos
binlist:
- gotop
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
