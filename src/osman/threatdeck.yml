lang: 'Rust'
homepage: https://github.com/gripebomb/threatdeck
license: 'MIT'
desc:
  cn: 基于终端的威胁情报监控和告警平台
  en: 'Terminal-based threat intelligence monitoring and alerting platform'
x:
  source: https://github.com/gripebomb/threatdeck
  eget: https://github.com/gripebomb/threatdeck
rule:
  /eget:
    cmd: x eget gripebomb/threatdeck
    reference: https://github.com/gripebomb/threatdeck
binlist:
  - 'threatdeck'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 748 KB
          rating: 1
          desc:
            cn: 约 748 KB（估算）
            en: ~748 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
