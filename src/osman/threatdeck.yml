lang: 'Rust'
homepage: https://github.com/gripebomb/threatdeck
license: 'MIT'
desc:
  cn: 基于终端的威胁情报监控和告警平台
  en: 'Terminal-based threat intelligence monitoring and alerting platform'
  cs: Platforma pro monitorování hrozeb a upozorňování založená na terminálu
  de: Terminalbasierte Plattform zur Bedrohungsüberwachung und Alarmierung
  es: Plataforma de monitorización de amenazas y alertas basada en terminal
  fr: Plateforme de surveillance des menaces et d'alerte basée sur le terminal
  id: Platform pemantauan intelijenensi ancaman dan peringatan berbasis terminal
  it: Piattaforma di monitoraggio delle minacce e di allerta basata sul terminale
  ja: ターミナルベースの脅威インテリジェンス監視・アラートプラットフォーム
  ko: 터미널 기반 위협 인텔리전스 모니터링 및 알림 플랫폼
  pl: Platforma do monitorowania zagrożeń i alarmowania oparta na terminalu
  pt: Plataforma de monitoramento de ameaças e alertas baseada em terminal
  ro: Platformă de monitorizare a amenințărilor și alertare bazată pe terminal
  ru: Терминальная платформа мониторинга угроз и оповещений
  th: แพลตฟอร์มตรวจสอบข่าวกรองภัยคุกคามและแจ้งเตือนบนเทอร์มินัล
  tr: Terminal tabanlı tehdit istihbaratı izleme ve uyarı platformu
  uk: Термінальна платформа моніторингу загроз і сповіщень
  vi: Nền tảng giám sát tình báo và cảnh báo mối đe dọa dựa trên terminal
x:
  source: https://github.com/gripebomb/threatdeck
  eget: gripebomb/threatdeck
rule:
  /eget:
    cmd: x eget gripebomb/threatdeck
    reference: https://github.com/gripebomb/threatdeck
binlist:
- 'threatdeck'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
