lang: Rust
homepage: https://github.com/sile/erldash
desc:
  cn: Rust 编写的简洁终端 Erlang 仪表盘
  en: A simple, terminal-based Erlang dashboard written in Rust
x:
  source: https://github.com/sile/erldash
  eget: https://github.com/sile/erldash
rule:
  /eget:
    cmd: x eget sile/erldash
    reference: https://github.com/sile/erldash
binlist:
- erldash
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
