lang: Rust
homepage: https://github.com/sile/erldash
desc:
  cn: Rust 编写的简洁终端 Erlang 仪表盘
  en: A simple, terminal-based Erlang dashboard written in Rust
  cs: Jednoduchý terminálový Erlang dashboard napsaný v Rustu
  de: Ein einfaches, terminalbasiertes Erlang-Dashboard, geschrieben in Rust
  es: Un sencillo panel de Erlang basado en terminal, escrito en Rust
  fr: Un tableau de bord Erlang simple basé sur le terminal, écrit en Rust
  id: Dasbor Erlang sederhana berbasis terminal yang ditulis dengan Rust
  it: Una semplice dashboard Erlang basata su terminale, scritta in Rust
  ja: Rustで書かれたシンプルなターミナルベースのErlangダッシュボード
  ko: Rust로 작성한 간단한 터미널 기반 Erlang 대시보드
  pl: Prosty terminalowy panel Erlang napisany w Rust
  pt: Um painel Erlang simples baseado em terminal, escrito em Rust
  ro: Un tablou de bord Erlang simplu, bazat pe terminal, scris în Rust
  ru: Простой терминальный дашборд Erlang, написанный на Rust
  th: แดชบอร์ด Erlang แบบง่ายที่ใช้เทอร์มินัล เขียนด้วย Rust
  tr: Rust ile yazılmış basit, terminal tabanlı bir Erlang panosu
  uk: Простий термінальний дашборд Erlang, написаний на Rust
  vi: bảng điều khiển Erlang đơn giản chạy trên terminal, viết bằng Rust
x:
  source: https://github.com/sile/erldash
  eget: sile/erldash
rule:
  /eget:
    cmd: x eget sile/erldash
    reference: https://github.com/sile/erldash
binlist:
- erldash
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
