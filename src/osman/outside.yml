lang: 'Rust'
homepage: 'https://github.com/BaconIsAVeg/outside'
license: 'AGPL-3.0'
desc:
  cn: 终端多用途天气客户端
  en: 'A multi-purpose weather client for your terminal!'
x:
  source: https://github.com/BaconIsAVeg/outside
  eget: https://github.com/BaconIsAVeg/outside
rule:
  /eget:
    cmd: x eget BaconIsAVeg/outside
    reference: https://github.com/BaconIsAVeg/outside
binlist:
  - 'outside'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
