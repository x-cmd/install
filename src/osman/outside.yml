lang: 'Rust'
homepage: 'https://github.com/BaconIsAVeg/outside'
license: 'AGPL-3.0'
desc:
  cn: 终端多用途天气客户端
  en: 'A multi-purpose weather client for your terminal!'
  cs: Víceúčelový klient počasí pro váš terminál!
  de: Ein vielseitiger Wetter-Client für dein Terminal!
  es: ¡Un cliente meteorológico multipropósito para tu terminal!
  fr: Un client météo polyvalent pour votre terminal !
  id: Klien cuaca serbaguna untuk terminal Anda!
  it: Un client meteo versatile per il tuo terminale!
  ja: ターミナル向け多用途天気クライアント！
  ko: 터미널을 위한 다목적 날씨 클라이언트!
  pl: Wielofunkcyjny klient pogody dla Twojego terminala!
  pt: Um cliente de meteorologia multifuncional para o seu terminal!
  ro: Un client de vreme multifuncțional pentru terminalul tău!
  ru: Многофункциональный погодный клиент для вашего терминала!
  th: ไคลเอนต์สภาพอากาศอเนกประสงค์สำหรับเทอร์มินัลของคุณ!
  tr: Terminaliniz için çok amaçlı bir hava durumu istemcisi!
  uk: Багатофункціональний погодний клієнт для вашого термінала!
  vi: Ứng dụng thời tiết đa năng cho terminal của bạn!
x:
  source: https://github.com/BaconIsAVeg/outside
  eget: BaconIsAVeg/outside
rule:
  /eget:
    cmd: x eget BaconIsAVeg/outside
    reference: https://github.com/BaconIsAVeg/outside
binlist:
- 'outside'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
