lang: JavaScript
homepage: https://github.com/MrRio/vtop
license: MIT
desc:
  cn: 命令行下的图形化活动监视器。
  en: A graphical activity monitor for the command line.
  cs: Grafický monitor aktivity pro příkazový řádek.
  de: Ein grafischer Aktivitätsmonitor für die Kommandozeile.
  es: Un monitor gráfico de actividad para la línea de comandos.
  fr: Un moniteur d'activité graphique pour la ligne de commande.
  id: Pemantau aktivitas grafis untuk baris perintah.
  it: Un monitor grafico dell'attività per la riga di comando.
  ja: コマンドライン用のグラフィックなアクティビティモニター。
  ko: 명령줄을 위한 그래픽 활동 모니터.
  pl: Graficzny monitor aktywności dla wiersza poleceń.
  pt: Um monitor gráfico de atividade para a linha de comando.
  ro: Un monitor grafic de activitate pentru linia de comandă.
  ru: Графический монитор активности для командной строки.
  th: ตัวตรวจสอบกิจกรรมแบบกราฟิกสำหรับบรรทัดคำสั่ง
  tr: Komut satırı için grafik etkinlik izleyici.
  uk: Графічний монітор активності для командного рядка.
  vi: Trình giám sát hoạt động đồ họa cho dòng lệnh.
x:
  source: https://github.com/MrRio/vtop
  yay: vtop
  npm: vtop
rule:
  arch/yay:
    cmd: yay -S vtop
    reference: https://aur.archlinux.org/packages/vtop
  /npm:
    cmd: npm install -g vtop
    reference: https://github.com/MrRio/vtop?tab=readme-ov-file#how-to-install
    dsnap: vtop
binlist:
- vtop

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
