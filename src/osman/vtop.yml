lang: JavaScript
homepage: https://github.com/MrRio/vtop
license: MIT
desc:
  cn: 命令行下的图形化活动监视器。
  en: A graphical activity monitor for the command line.
x:
  source: https://github.com/MrRio/vtop
rule:
  arch/yay:
    cmd: yay -S vtop
    reference: https://aur.archlinux.org/packages/vtop
  /npm:
    cmd: npm install -g vtop
    reference: https://github.com/MrRio/vtop?tab=readme-ov-file#how-to-install
    dsnap: vtop
binlist:
- vtop

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
