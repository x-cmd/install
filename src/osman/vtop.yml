lang: JavaScript
homepage: https://github.com/MrRio/vtop
license: MIT
desc:
  cn: 命令行下的图形化活动监视器。
  en: A graphical activity monitor for the command line.
x:
  source: https://github.com/MrRio/vtop
rule:
  arch/yay:
    cmd: yay -S vtop
    reference: https://aur.archlinux.org/packages/vtop
  /npm:
    cmd: npm install -g vtop
    reference: https://github.com/MrRio/vtop?tab=readme-ov-file#how-to-install
    dsnap: vtop
binlist:
- vtop

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
