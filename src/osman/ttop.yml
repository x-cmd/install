lang: Nim
homepage: https://github.com/inv2004/ttop
license: MIT
desc:
  cn: 一款具有历史数据服务、触发器和类似 top 的 TUI 系统监控工具。
  en: System monitoring tool with historical data service, triggers and top-like TUI
x:
  source: https://github.com/inv2004/ttop
  eget: https://github.com/inv2004/ttop
rule:
  /eget:
    cmd: x eget inv2004/ttop
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S ttop
    reference: https://github.com/inv2004/ttop?tab=readme-ov-file#archaur
binlist:
- ttop

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
