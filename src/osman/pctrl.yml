lang: Rust
homepage: https://github.com/MohamedSherifNoureldin/PCtrl
desc:
  cn: 一个基于终端的进程控制器，提供用户友好的界面来管理进程。
  en: A terminal-based process controller that provides a user-friendly interface to manage processes.
x:
  source: https://github.com/MohamedSherifNoureldin/PCtrl
rule:
  linux/curl:
    cmd: 'curl -O https://github.com/MohamedSherifNoureldin/PCtrl/releases/download/v1.0.0/pctrl_1.0.0_amd64.AppImage \

      && chmod +x pctrl_1.0.0_amd64.AppImage \

      && ./pctrl_1.0.0_amd64.AppImage

      '
    reference: https://github.com/MohamedSherifNoureldin/PCtrl#installation
binlist:
- pctrl
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
