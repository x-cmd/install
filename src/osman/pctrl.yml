lang: Rust
homepage: https://github.com/MohamedSherifNoureldin/PCtrl
desc:
  cn: 一个基于终端的进程控制器，提供用户友好的界面来管理进程。
  en: A terminal-based process controller that provides a user-friendly interface to manage processes.
  cs: Terminálový nástroj pro správu procesů, který poskytuje uživatelsky přívětivé rozhraní.
  de: Ein terminalbasierter Prozesscontroller mit einer benutzerfreundlichen Oberfläche zur Prozessverwaltung.
  es: Un controlador de procesos basado en terminal que ofrece una interfaz fácil de usar para gestionar procesos.
  fr: Un contrôleur de processus basé sur le terminal qui fournit une interface conviviale pour gérer les processus.
  id: Pengontrol proses berbasis terminal yang menyediakan antarmuka ramah pengguna untuk mengelola proses.
  it: Un controller di processi basato sul terminale che offre un'interfaccia intuitiva per gestire i processi.
  ja: プロセスを管理するための親切なインターフェースを持つ、ターミナルベースのプロセスコントローラです。
  ko: 프로세스를 관리하기 위한 사용자 친화적인 인터페이스를 제공하는 터미널 기반 프로세스 컨트롤러입니다.
  pl: Terminalowy kontroler procesów zapewniający przyjazny użytkownikowi interfejs do zarządzania procesami.
  pt: Um controlador de processos baseado em terminal que oferece uma interface amigável para gerenciar processos.
  ro: Un controlor de procese bazat pe terminal care oferă o interfață prietenoasă cu utilizatorul pentru gestionarea proceselor.
  ru: Терминальный контроллер процессов с удобным интерфейсом для управления процессами.
  th: ตัวควบคุมกระบวนการแบบเทอร์มินัลที่มีอินเทอร์เฟซที่ใช้งานง่ายสำหรับการจัดการกระบวนการ
  tr: Süreçleri yönetmek için kullanıcı dostu bir arayüz sunan terminal tabanlı bir süreç denetleyicisi.
  uk: Термінальний контролер процесів із зручним інтерфейсом для керування процесами.
  vi: Bộ điều khiển tiến trình dựa trên terminal với giao diện thân thiện để quản lý tiến trình.
x:
  source: https://github.com/MohamedSherifNoureldin/PCtrl
rule:
  linux/curl:
    cmd: 'curl -O https://github.com/MohamedSherifNoureldin/PCtrl/releases/download/v1.0.0/pctrl_1.0.0_amd64.AppImage \

      && chmod +x pctrl_1.0.0_amd64.AppImage \

      && ./pctrl_1.0.0_amd64.AppImage

      '
    reference: https://github.com/MohamedSherifNoureldin/PCtrl#installation
binlist:
- pctrl
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 112 KB
          rating: 1
          desc:
            cn: 约 112 KB（估算）
            en: ~112 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
