lang: 'Rust'
homepage: https://github.com/dhth/ecscope
license: 'MIT'
desc:
  cn: 从终端监控 AWS ECS 资源
  en: 'monitor AWS ECS resources from the terminal'
x:
  source: https://github.com/dhth/ecscope
  eget: https://github.com/dhth/ecscope
rule:
  /eget:
    cmd: x eget dhth/ecscope
    reference: https://github.com/dhth/ecscope
binlist:
  - 'ecscope'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 142 KB
          rating: 1
          desc:
            cn: 约 142 KB（估算）
            en: ~142 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
