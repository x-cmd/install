lang: 'Rust'
homepage: https://github.com/dhth/ecscope
license: 'MIT'
desc:
  cn: 从终端监控 AWS ECS 资源
  en: 'monitor AWS ECS resources from the terminal'
  cs: Sledování zdrojů AWS ECS z terminálu
  de: Überwachung von AWS ECS-Ressourcen aus dem Terminal
  es: Supervisa los recursos de AWS ECS desde la terminal
  fr: Surveillez les ressources AWS ECS depuis le terminal
  id: Pantau sumber daya AWS ECS dari terminal
  it: Monitora le risorse AWS ECS dal terminale
  ja: ターミナルからAWS ECSリソースを監視
  ko: 터미널에서 AWS ECS 리소스를 모니터링
  pl: Monitorowanie zasobów AWS ECS z terminala
  pt: Monitore os recursos da AWS ECS a partir do terminal
  ro: Monitorizează resursele AWS ECS din terminal
  ru: Мониторинг ресурсов AWS ECS из терминала
  th: ตรวจสอบทรัพยากร AWS ECS จากเทอร์มินัล
  tr: Terminalden AWS ECS kaynaklarını izleyin
  uk: Моніторинг ресурсів AWS ECS із термінала
  vi: Giám sát tài nguyên AWS ECS từ terminal
x:
  source: https://github.com/dhth/ecscope
  eget: dhth/ecscope
rule:
  /eget:
    cmd: x eget dhth/ecscope
    reference: https://github.com/dhth/ecscope
binlist:
- 'ecscope'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
