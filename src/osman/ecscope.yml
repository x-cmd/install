lang: 'Rust'
homepage: https://github.com/dhth/ecscope
license: 'MIT'
desc:
  cn: 从终端监控 AWS ECS 资源
  en: 'monitor AWS ECS resources from the terminal'
x:
  source: https://github.com/dhth/ecscope
  eget: https://github.com/dhth/ecscope
rule:
  /eget:
    cmd: x eget dhth/ecscope
    reference: https://github.com/dhth/ecscope
binlist:
  - 'ecscope'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
