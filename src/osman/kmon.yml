lang: Rust
homepage: https://github.com/orhun/kmon
license: GPL-3.0
desc:
  cn: Linux 内核管理器和活动监视器。
  en: Linux Kernel Manager and Activity Monitor.
x:
  source: https://github.com/orhun/kmon
rule:
  /cargo:
    cmd: cargo install kmon
    reference: https://github.com/orhun/kmon#installation
    dsnap: kmon
  arch/pacman:
    cmd: pacman -S kmon
    reference: https://github.com/orhun/kmon#installation
  arch/paru:
    cmd: paru -S kmon-git
    reference: https://github.com/orhun/kmon#installation
  arch/yay:
    cmd: yay -S kmon-git
    reference: https://aur.archlinux.org/packages/kmon-git
  alpine/apk:
    cmd: apk add kmon
    reference: https://github.com/orhun/kmon#installation
    dsnap: kmon
  nix/nix-env:
    cmd: 'nix-channel --add https://nixos.org/channels/nixos-unstable \

      && nix-channel --update nixos \

      && nix-env -iA nixos.kmon

      '
    reference: https://github.com/orhun/kmon#installation
binlist:
- kmon

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 73 KB
          rating: 1
          desc:
            cn: 约 73 KB（估算）
            en: ~73 KB estimated
        download:
          estimate: 679 KB
          desc:
            cn: 约 679 KB 下载 (linux/x64)
            en: ~679 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
