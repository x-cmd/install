lang: Rust
homepage: https://github.com/orhun/kmon
license: GPL-3.0
desc:
  cn: Linux 内核管理器和活动监视器。
  en: Linux Kernel Manager and Activity Monitor.
x:
  source: https://github.com/orhun/kmon
rule:
  /cargo:
    cmd: cargo install kmon
    reference: https://github.com/orhun/kmon#installation
    dsnap: kmon
  arch/pacman:
    cmd: pacman -S kmon
    reference: https://github.com/orhun/kmon#installation
  arch/paru:
    cmd: paru -S kmon-git
    reference: https://github.com/orhun/kmon#installation
  arch/yay:
    cmd: yay -S kmon-git
    reference: https://aur.archlinux.org/packages/kmon-git
  alpine/apk:
    cmd: apk add kmon
    reference: https://github.com/orhun/kmon#installation
    dsnap: kmon
  nix/nix-env:
    cmd: 'nix-channel --add https://nixos.org/channels/nixos-unstable \

      && nix-channel --update nixos \

      && nix-env -iA nixos.kmon

      '
    reference: https://github.com/orhun/kmon#installation
binlist:
- kmon

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
