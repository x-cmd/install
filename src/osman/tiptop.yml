lang: Python
homepage: https://github.com/nschloe/tiptop
license: MIT
desc:
  cn: 类似 top 命令的命令行系统监控工具
  en: A command-line system monitoring tool in the spirit of top.
x:
  source: https://github.com/nschloe/tiptop
rule:
  arch/yay:
    cmd: yay -S tiptop-cli
    reference: https://aur.archlinux.org/packages/tiptop-cli
  /pip:
    cmd: pip install tiptop
    reference: https://github.com/nschloe/tiptop
    dsnap: tiptop
  /pixi:
    cmd: x pixi global install tiptop
    reference: https://github.com/nschloe/tiptop
  ubuntu/apt:
    cmd: sudo apt install tiptop
    reference: https://github.com/nschloe/tiptop
binlist:
- tiptop

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
