lang: Python
homepage: https://github.com/nschloe/tiptop
license: MIT
desc:
  cn: 类似 top 命令的命令行系统监控工具
  en: A command-line system monitoring tool in the spirit of top.
x:
  source: https://github.com/nschloe/tiptop
  apt: tiptop
  yay: tiptop-cli
  pip: tiptop
rule:
  arch/yay:
    cmd: yay -S tiptop-cli
    reference: https://aur.archlinux.org/packages/tiptop-cli
  /pip:
    cmd: pip install tiptop
    reference: https://github.com/nschloe/tiptop
    dsnap: tiptop
  /pixi:
    cmd: x pixi global install tiptop
    reference: https://github.com/nschloe/tiptop
  ubuntu/apt:
    cmd: sudo apt install tiptop
    reference: https://github.com/nschloe/tiptop
binlist:
- tiptop

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
