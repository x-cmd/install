lang: Go
homepage: https://github.com/pranshuparmar/witr
license: Apache-2.0
desc:
  cn: 解释进程为何在运行——追溯任意进程、端口、容器或文件的来源（CLI 与交互式 TUI）
  en: Why is this running? Trace any process, port, container, or file back to what started it (CLI and interactive TUI)
  cs: Proč to běží? Sledujte jakýkoli proces, port, kontejner nebo soubor zpět k tomu, co jej spustilo (CLI a interaktivní TUI)
  de: Warum läuft das? Jeden Prozess, Port, Container oder jede Datei bis zu ihrem Auslöser zurückverfolgen (CLI und interaktive TUI)
  es: ¿Por qué se está ejecutando? Rastrea cualquier proceso, puerto, contenedor o archivo hasta lo que lo inició (CLI y TUI interactiva)
  fr: Pourquoi cela s'exécute-t-il ? Retracez n'importe quel processus, port, conteneur ou fichier jusqu'à ce qui l'a lancé (CLI et TUI interactive)
  id: Mengapa ini berjalan? Telusuri proses, port, kontainer, atau file apa pun kembali ke apa yang memulainya (CLI dan TUI interaktif)
  it: Perché è in esecuzione? Traccia qualsiasi processo, porta, container o file fino a ciò che lo ha avviato (CLI e TUI interattiva)
  ja: なぜこれが動いているのか？ プロセス、ポート、コンテナ、ファイルを起動元まで追跡します（CLI と対話型 TUI）
  ko: 왜 이것이 실행 중인가? 프로세스, 포트, 컨테이너 또는 파일을 시작한 곳까지 추적합니다 (CLI 및 대화형 TUI)
  pl: Dlaczego to działa? Prześledź dowolny proces, port, kontener lub plik do źródła, które go uruchomiło (CLI i interaktywne TUI)
  pt: Por que isso está rodando? Rastreie qualquer processo, porta, contêiner ou arquivo até o que o iniciou (CLI e TUI interativa)
  ro: De ce rulează asta? Urmărește orice proces, port, container sau fișier până la ceea ce l-a pornit (CLI și TUI interactiv)
  ru: Почему это работает? Проследите любой процесс, порт, контейнер или файл до того, что его запустило (CLI и интерактивный TUI)
  th: ทำไมสิ่งนี้ถึงทำงานอยู่? ตามหากระบวนการ พอร์ต คอนเทนเนอร์ หรือไฟล์ใด ๆ กลับไปยังสิ่งที่เริ่มมัน (CLI และ TUI แบบโต้ตอบ)
  tr: Bu neden çalışıyor? Herhangi bir süreç, port, kapsayıcı veya dosyayı onu başlatan şeye kadar izle (CLI ve etkileşimli TUI)
  uk: Чому це працює? Простежте будь-який процес, порт, контейнер або файл до того, що його запустило (CLI та інтерактивний TUI)
  vi: Tại sao tiến trình này đang chạy? Truy vết mọi tiến trình, cổng, container hoặc tệp về nơi đã khởi động nó (CLI và TUI tương tác)
x:
  source: https://github.com/pranshuparmar/witr
  eget: pranshuparmar/witr
  apt: witr
  brew: witr
  yay: witr-bin
  paru: witr-bin
  go: github.com/pranshuparmar/witr/cmd/witr@latest
rule:
  /eget:
    cmd: x eget use pranshuparmar/witr
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/pranshuparmar/witr/main/install.sh | bash
    reference: https://github.com/pranshuparmar/witr#21-quick-install
  /go:
    cmd: go install github.com/pranshuparmar/witr/cmd/witr@latest
    reference: https://github.com/pranshuparmar/witr#23-source--manual-installation
    dsnap: witr
  darwin/brew:
    cmd: brew install witr
    reference: https://formulae.brew.sh/formula/witr
  (debian|ubuntu)/apt:
    cmd: sudo apt install witr
    reference: https://github.com/pranshuparmar/witr#22-package-managers
  arch/yay:
    cmd: yay -S witr-bin
    reference: https://aur.archlinux.org/packages/witr-bin
  arch/paru:
    cmd: paru -S witr-bin
    reference: https://aur.archlinux.org/packages/witr-bin
  /conda:
    cmd: conda install -c conda-forge witr
    reference: https://github.com/pranshuparmar/witr#22-package-managers
  /pixi:
    cmd: pixi global install witr
    reference: https://github.com/pranshuparmar/witr#22-package-managers
  win/winget:
    cmd: winget install -e --id PranshuParmar.witr
    reference: https://github.com/pranshuparmar/witr#22-package-managers
binlist:
- witr

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 /proc、进程与容器元数据
          en: Reads /proc, process and container metadata
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
