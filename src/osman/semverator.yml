lang: Rust
homepage: https://github.com/jhheider/semverator
desc:
  cn: '用于命令行使用的 texyz/lib: semver.ts 的纯 Rust 实现'
  en: Pure rust implementation of teaxyz/lib:semver.ts for command-line usage
x:
  source: https://github.com/jhheider/semverator
rule:
  /cargo:
    cmd: cargo install semverator
    reference: https://github.com/jhheider/semverator?tab=readme-ov-file#install
    dsnap: semverator
  /tea:
    cmd: tea +crates.io/semverator true
    reference: https://github.com/jhheider/semverator?tab=readme-ov-file#install
binlist:
- semverator
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
