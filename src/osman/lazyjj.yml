license: 'Apache-2.0'
desc:
  cn: Jujutsu/jj 的 TUI
  en: 'TUI for Jujutsu/jj'
  cs: TUI pro Jujutsu/jj
  de: TUI für Jujutsu/jj
  es: TUI para Jujutsu/jj
  fr: TUI pour Jujutsu/jj
  id: TUI untuk Jujutsu/jj
  it: TUI per Jujutsu/jj
  ja: Jujutsu/jj の TUI
