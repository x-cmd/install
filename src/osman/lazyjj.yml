lang: 'Rust'
homepage: 'https://github.com/Cretezy/lazyjj'
license: 'Apache-2.0'
desc:
  cn: Jujutsu/jj 的 TUI
  en: 'TUI for Jujutsu/jj'
x:
  source: https://github.com/Cretezy/lazyjj
  eget: https://github.com/Cretezy/lazyjj
rule:
  /cargo:
    cmd: 'cargo install'
    reference: https://github.com/Cretezy/lazyjj
  /eget:
    cmd: x eget Cretezy/lazyjj
    reference: https://github.com/Cretezy/lazyjj
binlist:
  - 'lazyjj'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 267 KB
          rating: 1
          desc:
            cn: 约 267 KB（估算）
            en: ~267 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
