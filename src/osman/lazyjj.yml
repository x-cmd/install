lang: 'Rust'
homepage: 'https://github.com/Cretezy/lazyjj'
license: 'Apache-2.0'
desc:
  cn: Jujutsu/jj 的 TUI
  en: 'TUI for Jujutsu/jj'
x:
  source: https://github.com/Cretezy/lazyjj
  eget: https://github.com/Cretezy/lazyjj
rule:
  /cargo:
    cmd: 'cargo install'
    reference: https://github.com/Cretezy/lazyjj
  /eget:
    cmd: x eget Cretezy/lazyjj
    reference: https://github.com/Cretezy/lazyjj
binlist:
  - 'lazyjj'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
