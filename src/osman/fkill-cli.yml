lang: JavaScript
homepage: https://github.com/sindresorhus/fkill-cli
license: MIT
desc:
  cn: 绝妙地杀死进程。跨平台
  en: Fabulously kill processes. Cross-platform.
x:
  source: https://github.com/sindresorhus/fkill-cli
  npm: --global
rule:
  /x:
    cmd: x pkg use fkill-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global fkill-cli
    reference: https://github.com/sindresorhus/fkill-cli?tab=readme-ov-file#install
    dsnap: fkill-cli
binlist:
- fkill-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
