lang: Go
homepage: https://github.com/ariasmn/ugm
license: MIT
desc:
  cn: 用于查看机器上 UNIX 用户和组信息的 TUI 命令行工具
  en: A CLI tool with a TUI interface to view information about UNIX users and groups on your machine
  cs: Nástroj CLI s TUI rozhraním pro zobrazení informací o uživatelích a skupinách UNIX ve vašem počítači
  de: Ein CLI-Werkzeug mit TUI-Oberfläche zur Anzeige von Informationen über UNIX-Benutzer und -Gruppen auf Ihrem Rechner
  es: Una herramienta de CLI con interfaz TUI para ver información sobre usuarios y grupos UNIX en tu máquina
  fr: Un outil CLI avec interface TUI pour afficher des informations sur les utilisateurs et groupes UNIX de votre machine
  id: Alat CLI dengan antarmuka TUI untuk melihat informasi tentang pengguna dan grup UNIX di mesin Anda
  it: Uno strumento CLI con interfaccia TUI per visualizzare informazioni su utenti e gruppi UNIX della tua macchina
  ja: TUI 付きの CLI ツールで、マシンの UNIX ユーザーとグループの情報を確認できます
  ko: 기기의 UNIX 사용자와 그룹 정보를 확인하기 위한 TUI 인터페이스를 갖춘 CLI 도구
  pl: Narzędzie CLI z interfejsem TUI do przeglądania informacji o użytkownikach i grupach UNIX na komputerze
  pt: Uma ferramenta de CLI com interface TUI para ver informações sobre usuários e grupos UNIX na sua máquina
  ro: Un instrument CLI cu interfață TUI pentru a vedea informații despre utilizatorii și grupurile UNIX de pe mașina ta
  ru: CLI-инструмент с TUI-интерфейсом для просмотра сведений о пользователях и группах UNIX на вашей машине
  th: เครื่องมือ CLI ที่มีส่วนติดต่อ TUI เพื่อดูข้อมูลผู้ใช้และกลุ่ม UNIX บนเครื่องของคุณ
  tr: Makinenizdeki UNIX kullanıcıları ve grupları hakkında bilgi görmek için TUI arayüzlü bir CLI aracı
  uk: CLI-інструмент із TUI-інтерфейсом для перегляду відомостей про користувачів і групи UNIX на вашій машині
  vi: Công cụ CLI có giao diện TUI để xem thông tin về người dùng và nhóm UNIX trên máy của bạn
x:
  source: https://github.com/ariasmn/ugm
  yay: ugm
  go: github.com/ariasmn/ugm@latest
rule:
  arch/yay:
    cmd: yay -S ugm
    reference: https://aur.archlinux.org/packages/ugm
  /go:
    cmd: go install github.com/ariasmn/ugm@latest
    reference: https://github.com/ariasmn/ugm#installation
    dsnap: github.com/ariasmn/ugm@latest
binlist:
- ugm

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
