lang: Go
homepage: https://github.com/ariasmn/ugm
license: MIT
desc:
  cn: 用于查看机器上 UNIX 用户和组信息的 TUI 命令行工具
  en: A CLI tool with a TUI interface to view information about UNIX users and groups on your machine
x:
  source: https://github.com/ariasmn/ugm
rule:
  arch/yay:
    cmd: yay -S ugm
    reference: https://aur.archlinux.org/packages/ugm
  /go:
    cmd: go install github.com/ariasmn/ugm@latest
    reference: https://github.com/ariasmn/ugm#installation
    dsnap: github.com/ariasmn/ugm@latest
binlist:
- ugm

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 45 KB
          rating: 1
          desc:
            cn: 约 45 KB（估算）
            en: ~45 KB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
