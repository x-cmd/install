lang: 'Go'
homepage: 'https://github.com/ymtdzzz/otel-tui'
license: 'Apache-2.0'
desc:
  cn: 受 otel-desktop-viewer 启发的终端 OpenTelemetry 查看器
  en: 'A terminal OpenTelemetry viewer inspired by otel-desktop-viewer'
x:
  source: https://github.com/ymtdzzz/otel-tui
  eget: https://github.com/ymtdzzz/otel-tui
rule:
  /eget:
    cmd: x eget ymtdzzz/otel-tui
    reference: https://github.com/ymtdzzz/otel-tui
binlist:
- 'otel-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 32 MB
          rating: 2
          desc:
            cn: 安装 32 MB
            en: 32 MB install
        download:
          estimate: 32 MB
          desc:
            cn: 约 32 MB 下载 (linux/x64)
            en: ~32 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
