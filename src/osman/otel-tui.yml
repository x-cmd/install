lang: 'Go'
homepage: 'https://github.com/ymtdzzz/otel-tui'
license: 'Apache-2.0'
desc:
  cn: 受 otel-desktop-viewer 启发的终端 OpenTelemetry 查看器
  en: 'A terminal OpenTelemetry viewer inspired by otel-desktop-viewer'
  cs: Terminálový prohlížeč OpenTelemetry inspirovaný otel-desktop-viewer
  de: Ein Terminal-OpenTelemetry-Viewer, inspiriert von otel-desktop-viewer
  es: Un visor de OpenTelemetry de terminal inspirado en otel-desktop-viewer
  fr: Un visualiseur OpenTelemetry en terminal inspiré de otel-desktop-viewer
  id: Penampil OpenTelemetry terminal terinspirasi oleh otel-desktop-viewer
  it: Un visualizzatore OpenTelemetry da terminale ispirato a otel-desktop-viewer
  ja: otel-desktop-viewer に着想を得たターミナル OpenTelemetry ビューアー
  ko: otel-desktop-viewer에서 영감받은 터미널 OpenTelemetry 뷰어
  pl: Terminalowy przeglądarka OpenTelemetry inspirowana przez otel-desktop-viewer
  pt: Um visualizador OpenTelemetry de terminal inspirado no otel-desktop-viewer
  ro: Un vizualizator OpenTelemetry în terminal inspirat de otel-desktop-viewer
  ru: Терминальный просмотрщик OpenTelemetry, вдохновлённый otel-desktop-viewer
  th: ตัวดู OpenTelemetry บนเทอร์มินัลที่ได้แรงบันดาลใจจาก otel-desktop-viewer
  tr: otel-desktop-viewer'dan esinlenilen terminal OpenTelemetry görüntüleyicisi
  uk: Термінальний переглядач OpenTelemetry, натхненний otel-desktop-viewer
  vi: Trình xem OpenTelemetry trên terminal lấy cảm hứng từ otel-desktop-viewer
x:
  source: https://github.com/ymtdzzz/otel-tui
  eget: ymtdzzz/otel-tui
rule:
  /eget:
    cmd: x eget ymtdzzz/otel-tui
    reference: https://github.com/ymtdzzz/otel-tui
binlist:
- 'otel-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 32 MB
          rating: 2
          desc:
            cn: 安装 32 MB
            en: 32 MB install
        download:
          estimate: 32 MB
          desc:
            cn: 约 32 MB 下载 (linux/x64)
            en: ~32 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
