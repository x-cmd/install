lang: Rust
homepage: https://github.com/proot-me/proot-rs
license: GPL-3.0
desc:
  cn: PRoot 的 Rust 实现，是基于 ptrace 的沙盒
  en: Rust implementation of PRoot, a ptrace-based sandbox
x:
  pkg:
    exist: true
  source: https://github.com/proot-me/proot-rs
rule:
  /x:
    cmd: x pkg use proot
    reference: https://x-cmd.com/install/
  debian/apt:
    cmd: sudo apt-get install proot
    reference: https://command-not-found.com/proot
  ubuntu/apt:
    cmd: sudo apt-get install proot
    reference: https://command-not-found.com/proot
  kali/apt:
    cmd: sudo apt-get install proot
    reference: https://command-not-found.com/proot
    dsnap: proot
  raspbian/apt:
    cmd: sudo apt-get install proot
    reference: https://command-not-found.com/proot
  arch/yay:
    cmd: yay -S proot
    reference: https://aur.archlinux.org/packages/proot
binlist:
- proot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
