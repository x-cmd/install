lang: 'Rust'
homepage: 'https://github.com/snipt/snipt'
license: 'MIT'
desc:
  cn: 强大的文本片段扩展工具
  en: 'Snipt is a powerful text snippet expansion tool!'
  cs: Snipt je výkonný nástroj pro rozšiřování textových úryvků!
  de: Snipt ist ein leistungsstarkes Werkzeug zum Erweitern von Textausschnitten!
  es: ¡Snipt es una potente herramienta de expansión de fragmentos de texto!
  fr: Snipt est un puissant outil d'expansion des extraits de texte !
  id: Snipt adalah alat ekspansi cuplikan teks yang kuat!
  it: Snipt è un potente strumento di espansione dei frammenti di testo!
  ja: Snipt は強力なテキストスニペット展開ツールです!
  ko: Snipt는 강력한 텍스트 조각 확장 도구입니다!
  pl: Snipt to potężne narzędzie do rozwijania fragmentów tekstu!
  pt: O Snipt é uma poderosa ferramenta de expansão de trechos de texto!
  ro: Snipt este un instrument puternic de extindere a fragmentelor de text!
  ru: Snipt — мощный инструмент для разворачивания текстовых фрагментов!
  th: Snipt เป็นเครื่องมือขยายข้อความตัดอักษรที่ทรงพลัง!
  tr: Snipt, metin parçacıklarını genişletmek için güçlü bir araçtır!
  uk: Snipt — потужний інструмент для розгортання текстових фрагментів!
  vi: Snipt là công cụ mở rộng đoạn văn bản mạnh mẽ!
x:
  source: https://github.com/snipt/snipt
  eget: snipt/snipt
rule:
  /eget:
    cmd: x eget snipt/snipt
    reference: https://github.com/snipt/snipt
binlist:
- 'snipt'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
