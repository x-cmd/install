lang: 'Rust'
homepage: 'https://github.com/snipt/snipt'
license: 'MIT'
desc:
  cn: 强大的文本片段扩展工具
  en: 'Snipt is a powerful text snippet expansion tool!'
x:
  source: https://github.com/snipt/snipt
  eget: https://github.com/snipt/snipt
rule:
  /eget:
    cmd: x eget snipt/snipt
    reference: https://github.com/snipt/snipt
binlist:
  - 'snipt'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
