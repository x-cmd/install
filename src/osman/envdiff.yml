lang: 'Go'
homepage: 'https://github.com/GBerghoff/envdiff'
license: 'MIT'
desc:
  cn: 快照与比对环境的 CLI 工具，帮你找出关键差异
  en: 'cli tool to snapshot and diff environments - helping find the differences that matter'
x:
  source: https://github.com/GBerghoff/envdiff
  eget: https://github.com/GBerghoff/envdiff
rule:
  /eget:
    cmd: x eget GBerghoff/envdiff
    reference: https://github.com/GBerghoff/envdiff
binlist:
  - 'envdiff'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
