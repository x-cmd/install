lang: 'Go'
homepage: 'https://github.com/GBerghoff/envdiff'
license: 'MIT'
desc:
  cn: 快照与比对环境的 CLI 工具，帮你找出关键差异
  en: 'cli tool to snapshot and diff environments - helping find the differences that matter'
x:
  source: https://github.com/GBerghoff/envdiff
  eget: https://github.com/GBerghoff/envdiff
rule:
  /eget:
    cmd: x eget GBerghoff/envdiff
    reference: https://github.com/GBerghoff/envdiff
binlist:
  - 'envdiff'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 243 KB
          rating: 1
          desc:
            cn: 约 243 KB（估算）
            en: ~243 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
