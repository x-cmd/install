lang: 'Python'
homepage: https://github.com/juftin/browsr
license: 'MIT'
desc:
  cn: 终端中愉快的文件浏览器，支持所有文件系统
  en: '🗂️ a pleasant file explorer in your terminal supporting all filesystems'
x:
  source: https://github.com/juftin/browsr
  eget: https://github.com/juftin/browsr
rule:
  /eget:
    cmd: x eget juftin/browsr
    reference: https://github.com/juftin/browsr
binlist:
- 'browsr'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
        download:
          estimate: 30 KB
          desc:
            cn: 约 30 KB 下载 (whl)
            en: ~30 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
