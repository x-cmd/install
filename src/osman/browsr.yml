lang: 'Python'
homepage: https://github.com/juftin/browsr
license: 'MIT'
desc:
  cn: 终端中愉快的文件浏览器，支持所有文件系统
  en: '🗂️ a pleasant file explorer in your terminal supporting all filesystems'
x:
  source: https://github.com/juftin/browsr
  eget: https://github.com/juftin/browsr
rule:
  /eget:
    cmd: x eget juftin/browsr
    reference: https://github.com/juftin/browsr
binlist:
  - 'browsr'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
