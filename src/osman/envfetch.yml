lang: Rust
homepage: https://github.com/ankddev/envfetch
license: MIT
desc:
  en: Lightweight cross-platform CLI tool for working with environment variables.
  cn: 用于处理环境变量的轻量级跨平台命令行工具
  cs: Lehký multiplatformní nástroj příkazové řádky pro práci s proměnnými prostředí.
  de: Leichtgewichtiges plattformübergreifendes Kommandozeilenwerkzeug für den Umgang mit Umgebungsvariablen.
  es: Herramienta de línea de comandos multiplataforma y ligera para trabajar con variables de entorno.
  fr: Outil en ligne de commande léger et multiplateforme pour manipuler les variables d'environnement.
  id: Alat CLI lintas platform ringan untuk bekerja dengan variabel lingkungan.
  it: Leggero strumento CLI multipiattaforma per lavorare con le variabili d'ambiente.
  ja: 環境変数を扱うための軽量なクロスプラットフォームCLIツール。
  ko: 환경 변수를 다루기 위한 가벼운 크로스 플랫폼 CLI 도구.
  pl: Lekkie, wieloplatformowe narzędzie wiersza poleceń do pracy ze zmiennymi środowiskowymi.
  pt: Ferramenta de linha de comando leve e multiplataforma para trabalhar com variáveis de ambiente.
  ro: Instrument CLI ușor, multiplatformă, pentru lucrul cu variabilele de mediu.
  ru: Лёгкий кроссплатформенный инструмент командной строки для работы с переменными окружения.
  th: เครื่องมือ CLI ข้ามแพลตฟอร์มแบบเบาสำหรับทำงานกับตัวแปรสภาพแวดล้อม
  tr: Ortam değişkenleriyle çalışmak için hafif, çok platformlu bir komut satırı aracı.
  uk: Легкий кроссплатформенний інструмент командного рядка для роботи зі змінними оточення.
  vi: công cụ CLI đa nền tảng nhẹ để làm việc với biến môi trường.
x:
  source: https://github.com/ankddev/envfetch
  eget: ankddev/envfetch
  scoop: https://gist.githubusercontent.com/ankddev/f6314b552aa021f676fc999ec697f833/raw/envfetch.json
  yay: envfetch
  paru: envfetch
  cargo: envfetch
rule:
  /eget:
    cmd: x eget ankddev/envfetch
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl https://raw.githubusercontent.com/ankddev/envfetch/main/install.sh | sh
    reference: https://github.com/ankddev/envfetch/wiki/2.-Installation
  (win|wsl2)/powershell:
    cmd: x pwsh 'Invoke-RestMethod "https://raw.githubusercontent.com/ankddev/envfetch/main/install.ps1" | Invoke-Expression'
    reference: https://github.com/ankddev/envfetch/wiki/2.-Installation
  arch/paru:
    cmd: paru -S envfetch
    reference: https://github.com/ankddev/envfetch/wiki/2.-Installation
  arch/yay:
    cmd: yay -S envfetch
    reference: https://aur.archlinux.org/packages/envfetch
  (win|wsl2)/scoop:
    cmd: scoop install https://gist.githubusercontent.com/ankddev/f6314b552aa021f676fc999ec697f833/raw/envfetch.json
    reference: https://github.com/ankddev/envfetch/wiki/2.-Installation
  /cargo:
    cmd: cargo install envfetch
    reference: https://github.com/ankddev/envfetch/wiki/2.-Installation
    dsnap: envfetch
binlist:
- envfetch

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 140 KB
          rating: 1
          desc:
            cn: 约 140 KB（估算）
            en: ~140 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
