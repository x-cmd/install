lang: 'Rust'
homepage: 'https://github.com/ikebastuz/wiper'
license: 'MIT'
desc:
  cn: 磁盘分析与清理工具
  en: 'Disk analyser and cleanup tool'
x:
  source: https://github.com/ikebastuz/wiper
  eget: https://github.com/ikebastuz/wiper
rule:
  /eget:
    cmd: x eget ikebastuz/wiper
    reference: https://github.com/ikebastuz/wiper
binlist:
  - 'wiper'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 92 KB
          rating: 1
          desc:
            cn: 约 92 KB（估算）
            en: ~92 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
