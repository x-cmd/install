lang: 'Rust'
homepage: 'https://github.com/ikebastuz/wiper'
license: 'MIT'
desc:
  cn: 磁盘分析与清理工具
  en: 'Disk analyser and cleanup tool'
  cs: Nástroj pro analýzu disku a úklid
  de: Datenträger-Analyse- und Aufräumwerkzeug
  es: Herramienta de análisis y limpieza de disco
  fr: Outil d'analyse et de nettoyage de disque
  id: Alat analisis dan pembersihan disk
  it: Strumento di analisi e pulizia del disco
  ja: ディスクの分析とクリーンアップツール
  ko: 디스크 분석 및 정리 도구
  pl: Narzędzie do analizy i czyszczenia dysku
  pt: Ferramenta de análise e limpeza de disco
  ro: Instrument de analiză și curățare a discului
  ru: Инструмент для анализа и очистки диска
  th: เครื่องมือวิเคราะห์และทำความสะอาดดิสก์
  tr: Disk analizi ve temizleme aracı
  uk: Інструмент для аналізу та очищення диска
  vi: Công cụ phân tích và dọn dẹp ổ đĩa
x:
  source: https://github.com/ikebastuz/wiper
  eget: ikebastuz/wiper
rule:
  /eget:
    cmd: x eget ikebastuz/wiper
    reference: https://github.com/ikebastuz/wiper
binlist:
- 'wiper'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
