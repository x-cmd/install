lang: C
homepage: https://github.com/Atoptool/atop
license: GPL-2.0
desc:
  cn: Atop 是一个用于 Linux 的 ASCII 全屏性能监视器。
  en: Atop is an ASCII full-screen performance monitor for Linux
x:
  source: https://github.com/Atoptool/atop
  apt: atop
  dnf: atop
  brew: atop
  pacman: atop
  apk: atop
rule:
  debian/apt:
    cmd: sudo apt install atop
    reference: https://command-not-found.com/atop
    dsnap: atop
  ubuntu/apt:
    cmd: sudo apt install atop
    reference: https://command-not-found.com/atop
    dsnap: atop
  kali/apt:
    cmd: sudo apt install atop
    reference: https://command-not-found.com/atop
    dsnap: atop
  raspbian/apt:
    cmd: sudo apt install atop
    reference: https://command-not-found.com/atop
  mint/apt:
    cmd: sudo apt install atop
    reference: https://command-not-found.com/atop
  fedora/dnf:
    cmd: sudo dnf install atop
    reference: https://command-not-found.com/atop
    dsnap: atop
  alpine/apk:
    cmd: apk add atop
    reference: https://command-not-found.com/atop
    dsnap: atop
  arch/pacman:
    cmd: sudo pacman -S atop
    reference: https://command-not-found.com/atop
  darwin/brew:
    cmd: brew install atop
    reference: https://formulae.brew.sh/formula/atop#default
  opensuse/zypper:
    cmd: sudo zypper install atop
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=atop
binlist:
- atop

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 约 1.4 MB（估算）
            en: ~1.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
