lang: Go
homepage: https://git.sr.ht/~timharek/yr
desc:
  cn: 一个命令行工具，用于直接在终端中检查天气预报。
  en: A command-line tool for checking weather forecasts directly in the terminal.
  cs: Nástroj příkazové řádky pro kontrolu předpovědi počasí přímo v terminálu.
  de: Ein Kommandozeilenwerkzeug zur direkten Prüfung der Wettervorhersage im Terminal.
  es: Una herramienta de línea de comandos para consultar el pronóstico meteorológico directamente en el terminal.
  fr: Un outil en ligne de commande pour consulter les prévisions météo directement dans le terminal.
  id: Alat baris perintah untuk memeriksa prakiraan cuaca langsung di terminal.
  it: Uno strumento da riga di comando per controllare le previsioni meteorologiche direttamente nel terminale.
  ja: ターミナル上で天気予報を確認するためのコマンドラインツール。
  ko: 터미널에서 바로 일기 예보를 확인할 수 있는 명령줄 도구.
  pl: Narzędzie wiersza poleceń do sprawdzania prognozy pogody bezpośrednio w terminalu.
  pt: Uma ferramenta de linha de comando para consultar previsões do tempo diretamente no terminal.
  ro: Un instrument de linie de comandă pentru verificarea prognozei meteo direct în terminal.
  ru: Командный инструмент для проверки прогноза погоды прямо в терминале.
  th: เครื่องมือบรรทัดคำสั่งสำหรับตรวจสอบพยากรณ์อากาศโดยตรงในเทอร์มินัล
  tr: Hava durumu tahminlerini doğrudan terminalde kontrol etmek için komut satırı aracı.
  uk: Інструмент командного рядка для перевірки прогнозу погоди прямо в терміналі.
  vi: Công cụ dòng lệnh để kiểm tra dự báo thời tiết ngay trong terminal.
rule:
  /go:
    cmd: go install git.sr.ht/~timharek/yr@latest
    reference: https://git.sr.ht/~timharek/yr?ref=terminaltrove#install-cli
    dsnap: git.sr.ht/~timharek/yr
  /brew:
    cmd: brew install timharek/tap/yr
    reference: https://git.sr.ht/~timharek/yr?ref=terminaltrove#install-cli

x:
  brew: timharek/tap/yr
  go: git.sr.ht/~timharek/yr@latest
binlist:
- yr
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
