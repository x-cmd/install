lang: Go
homepage: https://git.sr.ht/~timharek/yr
desc:
  cn: 一个命令行工具，用于直接在终端中检查天气预报。
  en: A command-line tool for checking weather forecasts directly in the terminal.
rule:
  /go:
    cmd: go install git.sr.ht/~timharek/yr@latest
    reference: https://git.sr.ht/~timharek/yr?ref=terminaltrove#install-cli
    dsnap: git.sr.ht/~timharek/yr
  /brew:
    cmd: brew install timharek/tap/yr
    reference: https://git.sr.ht/~timharek/yr?ref=terminaltrove#install-cli

x:
  brew: timharek/tap/yr
  go: git.sr.ht/~timharek/yr@latest
binlist:
- yr
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
