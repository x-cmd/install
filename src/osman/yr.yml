lang: Go
homepage: https://git.sr.ht/~timharek/yr
desc:
  cn: 一个命令行工具，用于直接在终端中检查天气预报。
  en: A command-line tool for checking weather forecasts directly in the terminal.
rule:
  /go:
    cmd: go install git.sr.ht/~timharek/yr@latest
    reference: https://git.sr.ht/~timharek/yr?ref=terminaltrove#install-cli
    dsnap: git.sr.ht/~timharek/yr
  /brew:
    cmd: brew install timharek/tap/yr
    reference: https://git.sr.ht/~timharek/yr?ref=terminaltrove#install-cli
binlist:
- yr
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
