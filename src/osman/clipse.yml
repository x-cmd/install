lang: Go
homepage: https://github.com/savedra1/clipse
license: MIT
desc:
  cn: 可配置的 Unix TUI 剪贴板管理器
  en: Configurable TUI clipboard manager for Unix
x:
  source: https://github.com/savedra1/clipse
  eget: https://github.com/savedra1/clipse
rule:
  /eget:
    cmd: x eget savedra1/clipse
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S clipse
    reference: https://github.com/savedra1/clipse?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/savedra1/clipse@v1.1.0
    reference: https://github.com/savedra1/clipse?tab=readme-ov-file#installation
    dsnap: github.com/savedra1/clipse@v1.1.0

binlist:
  - clipse

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
