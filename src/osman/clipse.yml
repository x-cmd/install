lang: Go
homepage: https://github.com/savedra1/clipse
license: MIT
desc:
  cn: 可配置的 Unix TUI 剪贴板管理器
  en: Configurable TUI clipboard manager for Unix
  cs: Konfigurovatelný TUI správce schránky pro Unix
  de: Konfigurierbarer TUI-Zwischenablage-Manager für Unix
  es: Gestor de portapapeles TUI configurable para Unix
  fr: Gestionnaire de presse-papiers TUI configurable pour Unix
  id: Manajer clipboard TUI yang dapat dikonfigurasi untuk Unix
  it: Gestore clipboard TUI configurabile per Unix
  ja: Unix向けの設定可能なTUIクリップボードマネージャー
  ko: Unix를 위한 설정 가능한 TUI 클립보드 관리자
  pl: Konfigurowalny menedżer schowka TUI dla systemu Unix
  pt: Gerenciador de área de transferência TUI configurável para Unix
  ro: Manager de clipboard TUI configurabil pentru Unix
  ru: Настраиваемый TUI-менеджер буфера обмена для Unix
  th: ตัวจัดการคลิปบอร์ด TUI ที่กำหนดค่าได้สำหรับ Unix
  tr: Unix için yapılandırılabilir TUI pano yöneticisi
  uk: Налаштовуваний TUI-менеджер буфера обміну для Unix
  vi: Trình quản lý bảng tạm TUI có thể cấu hình cho Unix
x:
  source: https://github.com/savedra1/clipse
  eget: savedra1/clipse
  yay: clipse
  go: github.com/savedra1/clipse@v1.1.0
rule:
  /eget:
    cmd: x eget savedra1/clipse
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S clipse
    reference: https://github.com/savedra1/clipse?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/savedra1/clipse@v1.1.0
    reference: https://github.com/savedra1/clipse?tab=readme-ov-file#installation
    dsnap: github.com/savedra1/clipse@v1.1.0

binlist:
- clipse

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
