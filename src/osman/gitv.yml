lang: 'Rust'
homepage: https://github.com/JayanAXHF/gitv
license: 'Unlicense'
desc:
  cn: 终端版 GitHub issues 查看器，可直接查看与管理 issues
  en: 'gitv is a terminal-based viewer for GitHub issues. It allows you to view and manage your GitHub issues directly from the terminal.'
x:
  source: https://github.com/JayanAXHF/gitv
  eget: JayanAXHF/gitv
  cargo: typos-cli
rule:
  /cargo:
    cmd: 'cargo install typos-cli'
    reference: https://github.com/JayanAXHF/gitv
  /eget:
    cmd: x eget JayanAXHF/gitv
    reference: https://github.com/JayanAXHF/gitv
binlist:
- 'gitv'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
