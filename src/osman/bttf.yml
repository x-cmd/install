lang: 'Rust'
homepage: 'https://github.com/BurntSushi/bttf'
license: 'Unlicense'
desc:
  cn: 用于日期时间运算、解析与格式化的命令行工具
  en: 'A command line tool for datetime arithmetic, parsing, formatting and more.'
x:
  source: https://github.com/BurntSushi/bttf
  eget: https://github.com/BurntSushi/bttf
rule:
  /eget:
    cmd: x eget BurntSushi/bttf
    reference: https://github.com/BurntSushi/bttf
binlist:
- 'bttf'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
