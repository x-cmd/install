lang: 'Rust'
homepage: 'https://github.com/BurntSushi/bttf'
license: 'Unlicense'
desc:
  cn: 用于日期时间运算、解析与格式化的命令行工具
  en: 'A command line tool for datetime arithmetic, parsing, formatting and more.'
x:
  source: https://github.com/BurntSushi/bttf
  eget: https://github.com/BurntSushi/bttf
rule:
  /eget:
    cmd: x eget BurntSushi/bttf
    reference: https://github.com/BurntSushi/bttf
binlist:
  - 'bttf'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
