lang: Shell
homepage: https://github.com/OpenVPN/easy-rsa
desc:
  cn: Easy-rsa 是一个用于构建和管理 PKI CA 的 CLI 实用程序
  en: Easy-rsa is a CLI utility to build and manage a PKI CA
x:
  source: https://github.com/OpenVPN/easy-rsa
  eget: https://github.com/OpenVPN/easy-rsa
rule:
  /eget:
    cmd: x eget OpenVPN/easy-rsa
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install easy-rsa
    reference: https://formulae.brew.sh/formula/easy-rsa#default
  debian/apt:
    cmd: sudo apt-get install easy-rsa
    reference: https://command-not-found.com/easyrsa
    dsnap: easy-rsa
  ubuntu/apt:
    cmd: sudo apt-get install easy-rsa
    reference: https://command-not-found.com/easyrsa
    dsnap: easy-rsa
  alpine/apk:
    cmd: sudo apk add easy-rsa
    reference: https://command-not-found.com/easyrsa
    dsnap: easy-rsa
  arch/pacman:
    cmd: sudo pacman -S easy-rsa
    reference: https://command-not-found.com/easyrsa
  arch/yay:
    cmd: yay -S easy-rsa-git
    reference: https://aur.archlinux.org/packages/easy-rsa-git
  kali/apt:
    cmd: sudo apt-get install easy-rsa
    reference: https://command-not-found.com/easyrsa
    dsnap: easy-rsa
  fedora/dnf:
    cmd: sudo dnf install easy-rsa
    reference: https://command-not-found.com/easyrsa
    dsnap: easy-rsa
  raspbian/apt:
    cmd: sudo apt-get install easy-rsa
    reference: https://command-not-found.com/easyrsa
binlist:
- easy-rsa
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli

    network:
      local: no
      internet: no

    filesystem:
      read:
        desc:
          cn: 读取 $EASYRSA_PKI 下的 CA、证书、私钥、CSR、CRL，以及 vars 配置与 openssl-easyrsa.cnf
          en: Reads CA, cert, key, CSR and CRL files under $EASYRSA_PKI, plus the vars config and openssl-easyrsa.cnf
        sensitive:
          - "$EASYRSA_PKI/private/*.key"
          - "$EASYRSA_PKI/reqs/*.req"
          - "$EASYRSA_PKI/pki/passwords.txt"
      write:
        desc:
          cn: 在 $EASYRSA_PKI 下生成证书、私钥、CSR 与 CRL
          en: Writes certificates, private keys, CSRs and CRLs under $EASYRSA_PKI
        sensitive:
          - "$EASYRSA_PKI/private/*.key"
          - "$EASYRSA_PKI/reqs/*.req"

  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 <5 MB
            en: <5 MB install
        growth:
          desc:
            cn: PKI 目录 ($EASYRSA_PKI) 随签发证书量线性增长，无上限（除磁盘空间）
            en: $EASYRSA_PKI grows linearly with issued certs; bounded only by available disk
      paths:
        data:
          - "$EASYRSA_PKI"
        config:
          - "$EASYRSA/vars"
          - "$EASYRSA/openssl-easyrsa.cnf"
        cache: []

    memory:
      idle:
        rating: 2
        desc:
          cn: 空闲时 <30 MB（CLI 解析 + 配置加载）
          en: <30 MB idle (CLI parsing + config load)
      peak:
        rating: 3
        desc:
          cn: 4096-bit 密钥生成时短时尖峰
          en: Brief spike during 4096-bit key generation

    cpu:
      workload: [compute]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 日常使用（签发/撤销证书）几乎不占 CPU
          en: Near-zero CPU under typical use (issue/revoke certs)
      peak:
        rating: 7
        desc:
          cn: 4096-bit build-ca / genrsa 时占满单核数秒至数十秒
          en: Saturates one core for seconds-to-tens-of-seconds during 4096-bit build-ca / genrsa