lang: Rust
homepage: https://github.com/tuna-f1sh/cyme
license: GPL-3.0
desc:
  cn: 用于列出系统 USB 总线和设备的跨平台 CLI 工具
  en: A cross-platform CLI tool designed to list system USB buses and devices.
x:
  source: https://github.com/tuna-f1sh/cyme
rule:
  arch/pacman:
    cmd: sudo pacman -S cyme
    reference: https://github.com/tuna-f1sh/cyme#install
  arch/yay:
    cmd: yay -S cyme-git
    reference: https://aur.archlinux.org/packages/cyme-git
  /nix-env:
    cmd: nix-env -iA cyme
    reference: https://github.com/tuna-f1sh/cyme#install
  /brew:
    cmd: brew install cyme
    reference: https://github.com/tuna-f1sh/cyme#install
  /eget:
    cmd: eget tuna-f1sh/cyme
    reference: https://github.com/tuna-f1sh/cyme#install
binlist:
- cyme

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
