lang: Rust
homepage: https://github.com/tuna-f1sh/cyme
license: GPL-3.0
desc:
  cn: 用于列出系统 USB 总线和设备的跨平台 CLI 工具
  en: A cross-platform CLI tool designed to list system USB buses and devices.
  cs: Nástroj CLI napříč platformami pro výpis systémových sběrnic USB a zařízení.
  de: Ein plattformübergreifendes CLI-Tool zum Auflisten von USB-Bussen und -Geräten des Systems.
  es: Una herramienta CLI multiplataforma para listar los buses y dispositivos USB del sistema.
  fr: Un outil CLI multiplateforme conçu pour lister les bus et périphériques USB du système.
  id: Alat CLI lintas platforma untuk mencantumkan bus dan perangkat USB sistem.
  it: Uno strumento CLI multipiattaforma progettato per elencare i bus e i dispositivi USB di sistema.
  ja: システムのUSBバスとデバイスを一覧表示するクロスプラットフォームなCLIツール。
  ko: 시스템 USB 버스와 장치를 나열하도록 설계된 크로스 플랫폼 CLI 도구.
  pl: Narzędzie CLI działające na różnych platformach, służące do wyświetlania magistral USB i urządzeń systemu.
  pt: Uma ferramenta CLI multiplataforma projetada para listar os barramentos e dispositivos USB do sistema.
  ro: Un instrument CLI multiplatformă conceput pentru a lista autobuzele și dispozitivele USB ale sistemului.
  ru: Кроссплатформенный CLI-инструмент для вывода списка системных шин USB и устройств.
  th: เครื่องมือ CLI แบบข้ามแพลตฟอร์มสำหรับแสดงรายการบัส USB และอุปกรณ์ของระบบ
  tr: Sistem USB veri yollarını ve aygıtlarını listelemek için tasarlanmış platformlar arası CLI aracı.
  uk: Кроссплатформний CLI-інструмент для виведення списку системних шин USB і пристроїв.
  vi: Công cụ CLI đa nền tảng dùng để liệt kê các bus USB và thiết bị của hệ thống.
x:
  source: https://github.com/tuna-f1sh/cyme
  brew: cyme
  pacman: cyme
  yay: cyme-git
rule:
  arch/pacman:
    cmd: sudo pacman -S cyme
    reference: https://github.com/tuna-f1sh/cyme#install
  arch/yay:
    cmd: yay -S cyme-git
    reference: https://aur.archlinux.org/packages/cyme-git
  /nix-env:
    cmd: nix-env -iA cyme
    reference: https://github.com/tuna-f1sh/cyme#install
  /brew:
    cmd: brew install cyme
    reference: https://github.com/tuna-f1sh/cyme#install
  /eget:
    cmd: eget tuna-f1sh/cyme
    reference: https://github.com/tuna-f1sh/cyme#install
binlist:
- cyme

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/arm64)
            en: ~3 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
