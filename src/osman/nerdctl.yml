lang: Go
homepage: https://github.com/containerd/nerdctl
license: Apache-2.0
desc:
  cn: 适用于 Containerd 的 Docker 兼容 CLI
  en: Docker-compatible CLI for containerd
x:
  pkg:
    exist: true
  source: https://github.com/containerd/nerdctl
  eget: https://github.com/containerd/nerdctl
rule:
  /eget:
    cmd: x eget containerd/nerdctl
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use nerdctl
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use nerdctl
    reference: https://github.com/dmpe/asdf-nerdctl
  darwin/brew:
    cmd: brew install nerdctl
    reference: https://github.com/containerd/nerdctl?tab=readme-ov-file#brew
  arch/yay:
    cmd: yay -S nerdctl-git
    reference: https://aur.archlinux.org/packages/nerdctl-git
binlist:
- nerdctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
