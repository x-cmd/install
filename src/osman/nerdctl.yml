lang: Go
homepage: https://github.com/containerd/nerdctl
license: Apache-2.0
desc:
  cn: 适用于 Containerd 的 Docker 兼容 CLI
  en: Docker-compatible CLI for containerd
  cs: CLI kompatibilní s Dockerem pro containerd
  de: Docker-kompatible CLI für containerd
  es: CLI compatible con Docker para containerd
  fr: CLI compatible Docker pour containerd
  id: CLI yang kompatibel dengan Docker untuk containerd
  it: CLI compatibile con Docker per containerd
  ja: containerd 向けの Docker 互換 CLI
  ko: containerd용 Docker 호환 CLI
  pl: CLI zgodne z Dockerem dla containerd
  pt: CLI compatível com Docker para containerd
  ro: CLI compatibil cu Docker pentru containerd
  ru: Docker-совместимый CLI для containerd
  th: CLI ที่เข้ากันได้กับ Docker สำหรับ containerd
  tr: containerd için Docker uyumlu CLI
  uk: Docker-сумісний CLI для containerd
  vi: CLI tương thích Docker cho containerd
x:
  source: https://github.com/containerd/nerdctl
  eget: containerd/nerdctl
  brew: nerdctl
  yay: nerdctl-git
  asdf: nerdctl
rule:
  /eget:
    cmd: x eget containerd/nerdctl
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use nerdctl
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use nerdctl
    reference: https://github.com/dmpe/asdf-nerdctl
  darwin/brew:
    cmd: brew install nerdctl
    reference: https://github.com/containerd/nerdctl?tab=readme-ov-file#brew
  arch/yay:
    cmd: yay -S nerdctl-git
    reference: https://aur.archlinux.org/packages/nerdctl-git
binlist:
- nerdctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
