lang: Shell
homepage: https://github.com/dylanaraps/neofetch
license: MIT
desc:
  cn: 一个用 bash 3.2+ 编写的美化命令行系统信息（操作系统、软件和硬件的信息）显示的工具
  en: A command-line system information tool written in bash 3.2+
  cs: Nástroj příkazového řádku pro zobrazení informací o systému, napsaný v bash 3.2+
  de: Ein Kommandozeilen-Werkzeug zur Anzeige von Systeminformationen, geschrieben in bash 3.2+
  es: Una herramienta de línea de comandos para mostrar información del sistema, escrita en bash 3.2+
  fr: Un outil en ligne de commande affichant les informations système, écrit en bash 3.2+
  id: Alat baris perintah untuk menampilkan informasi sistem yang ditulis dengan bash 3.2+
  it: Uno strumento da riga di comando per visualizzare le informazioni di sistema, scritto in bash 3.2+
  ja: bash 3.2+ で書かれたシステム情報を表示するコマンドラインツール
  ko: bash 3.2+로 작성된 시스템 정보를 표시하는 명령줄 도구
  pl: Narzędzie wiersza poleceń do wyświetlania informacji o systemie, napisane w bash 3.2+
  pt: Uma ferramenta de linha de comando para exibir informações do sistema, escrita em bash 3.2+
  ro: Un instrument de linie de comandă pentru afișarea informațiilor despre sistem, scris în bash 3.2+
  ru: Инструмент командной строки для отображения информации о системе, написанный на bash 3.2+
  th: เครื่องมือบรรทัดคำสั่งแสดงข้อมูลระบบ เขียนด้วย bash 3.2+
  tr: Sistem bilgilerini gösteren, bash 3.2+ ile yazılmış komut satırı aracı
  uk: Інструмент командного рядка для відображення інформації про систему, написаний на bash 3.2+
  vi: Công cụ dòng lệnh hiển thị thông tin hệ thống, được viết bằng bash 3.2+
x:
  source: https://github.com/dylanaraps/neofetch
  apt: neofetch
  dnf: neofetch
  brew: neofetch
  pacman: neofetch
  apk: neofetch
  apt-get: neofetch
  zypper: neofetch
  emerge: app-misc/neofetch
  xbps: neofetch
  scoop: neofetch
  winget: nepnep.neofetch-win
  yay: neofetch
rule:
  darwin/brew:
    cmd: brew install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#macos-homebrew
  debian/apt:
    cmd: sudo apt-get install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#debian
    dsnap: neofetch
  ubuntu/apt:
    cmd: sudo apt install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#ubuntu
    dsnap: neofetch
  alpine/apk:
    cmd: sudo apk add neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#alpine-linux
    dsnap: neofetch
  arch/pacman:
    cmd: sudo pacman -S neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#arch
  arch/yay:
    cmd: yay -S neofetch
    reference: https://aur.archlinux.org/packages/neofetch
  kali/apt:
    cmd: sudo apt install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#ubuntu
    dsnap: neofetch
  centos/dnf:
    cmd: sudo dnf install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#fedora--rhel--centos--mageia--openmandriva
  fedora/dnf:
    cmd: sudo dnf install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#fedora--rhel--centos--mageia--openmandriva
    dsnap: neofetch
  rhel/dnf:
    cmd: sudo dnf install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#fedora--rhel--centos--mageia--openmandriva
  raspbian/apt:
    cmd: sudo apt install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#ubuntu
  gentoo/emerge:
    cmd: sudo emerge app-misc/neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#gentoo--funtoo
  funtoo/emerge:
    cmd: sudo emerge app-misc/neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#gentoo--funtoo
  opensuse/zypper:
    cmd: sudo zypper install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#opensuse-leap-or-tumbleweed
  mageia/dnf:
    cmd: sudo dnf install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#fedora--rhel--centos--mageia--openmandriva
  nix/:
    cmd: sudo nix-env -i neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#nixos
  freebsd/pkg:
    cmd: sudo pkg install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#freebsd
  termux/pkg:
    cmd: sudo pkg install neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#android-termux
  solus/eopkg:
    cmd: sudo eopkg it neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#solus
  void/xbps:
    cmd: sudo xbps-install -S neofetch
    reference: https://github.com/dylanaraps/neofetch/wiki/Installation#void-linux
  (win|wsl2)/scoop:
    cmd: x scoop install neofetch
    reference: https://scoop.sh/#/apps?q=neofetch
  (win|wsl2)/winget:
    cmd: x winget install nepnep.neofetch-win
    reference: https://winget.run/pkg/nepnep/neofetch-win
binlist:
- neofetch

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
