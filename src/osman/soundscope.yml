lang: 'Rust'
homepage: 'https://github.com/bananaofhappiness/soundscope'
license: 'MIT'
desc:
  cn: 用于分析音频频率和响度（LUFS）的 TUI 应用
  en: 'A TUI app for analyzing audio data such as frequencies and loudness (LUFS)'
x:
  source: https://github.com/bananaofhappiness/soundscope
  eget: https://github.com/bananaofhappiness/soundscope
rule:
  /eget:
    cmd: x eget bananaofhappiness/soundscope
    reference: https://github.com/bananaofhappiness/soundscope
binlist:
  - 'soundscope'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
