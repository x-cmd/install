lang: 'Rust'
homepage: 'https://github.com/bananaofhappiness/soundscope'
license: 'MIT'
desc:
  cn: 用于分析音频频率和响度（LUFS）的 TUI 应用
  en: 'A TUI app for analyzing audio data such as frequencies and loudness (LUFS)'
x:
  source: https://github.com/bananaofhappiness/soundscope
  eget: https://github.com/bananaofhappiness/soundscope
rule:
  /eget:
    cmd: x eget bananaofhappiness/soundscope
    reference: https://github.com/bananaofhappiness/soundscope
binlist:
- 'soundscope'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 146 KB
          rating: 1
          desc:
            cn: 约 146 KB（估算）
            en: ~146 KB estimated
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
