lang: C
homepage: https://github.com/htop-dev/htop
license: GPL-2.0
desc:
  cn: htop 是一个跨平台的交互式进程查看器。
  en: htop is a cross-platform interactive process viewer.
  cs: htop je multiplatformní interaktivní prohlížeč procesů.
  de: htop ist ein plattformübergreifender interaktiver Prozessbetrachter.
  es: htop es un visor de procesos interactivo multiplataforma.
  fr: htop est une visionneuse de processus interactive multiplateforme.
  id: htop adalah tampilan proses interaktif lintas platform.
  it: htop è un visualizzatore di processi interattivo e multipiattaforma.
  ja: htop はクロスプラットフォームの対話型プロセスビューアです。
  ko: htop은(는) 크로스 플랫폼 대화형 프로세스 뷰어입니다.
  pl: htop to wieloplatformowy interaktywny podgląd procesów.
  pt: htop é um visualizador de processos interativo multiplataforma.
  ro: htop este un vizualizator de procese interactiv multiplataforma.
  ru: htop — кроссплатформенный интерактивный просмотрщик процессов.
  th: htop เป็นโปรแกรมดูกระบวนการแบบโต้ตอบที่ใช้ข้ามแพลตฟอร์ม
  tr: htop, platformlar arası etkileşimli bir süreç görüntüleyicisidir.
  uk: htop — кроссплатформний інтерактивний переглядач процесів.
  vi: htop là trình xem tiến trình tương tác đa nền tảng.
x:
  source: https://github.com/htop-dev/htop
  eget: htop-dev/htop
  apt: htop
  dnf: htop
  brew: htop
  pacman: htop
  zypper: htop
  emerge: sys-process/htop
  yay: htop-git
rule:
  /eget:
    cmd: x eget htop-dev/htop
    reference: https://x-cmd.com/mod/eget
  gobol/:
    cmd: Compile htop
    reference: https://htop.dev/downloads.html#binaries
  debian/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
    dsnap: htop
  ubuntu/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
    dsnap: htop
  kali/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
    dsnap: htop
  raspbian/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
  mint/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
  fedora/dnf:
    cmd: sudo dnf install htop
    reference: https://htop.dev/downloads.html#binaries
    dsnap: htop
  gentoo/emerge:
    cmd: sudo emerge sys-process/htop
    reference: https://htop.dev/downloads.html#binaries
  arch/pacman:
    cmd: sudo pacman -S htop
    reference: https://htop.dev/downloads.html#binaries
  arch/yay:
    cmd: yay -S htop-git
    reference: https://aur.archlinux.org/packages/htop-git
  darwin/brew:
    cmd: brew install htop
    reference: https://formulae.brew.sh/formula/htop#default
  opensuse/zypper:
    cmd: sudo zypper install htop
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=htop
binlist:
- htop
# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 /proc/* 和 /sys/* 系统状态
          en: Reads /proc/* and /sys/* system state
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.6 MB
          rating: 1
          desc:
            cn: 约 1.6 MB（估算）
            en: ~1.6 MB estimated
        growth:
          desc:
            cn: 几乎不增长（无持久数据）
            en: No persistent data; minimal growth
      paths:
        data: []
        config:
          - "$HOME/.config/htop/htoprc"
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 30 MB
        desc:
          cn: ~30 MB
          en: ~30 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 1
        desc:
          cn: 极低，1s 采样周期
          en: Negligible, 1s sampling
      peak:
        rating: 2
        desc:
          cn: 刷新时短暂占用
          en: Brief spike on refresh
