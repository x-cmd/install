lang: C
homepage: https://github.com/htop-dev/htop
license: GPL-2.0
desc:
  cn: htop 是一个跨平台的交互式进程查看器。
  en: htop is a cross-platform interactive process viewer.
x:
  source: https://github.com/htop-dev/htop
  eget: https://github.com/htop-dev/htop
rule:
  /eget:
    cmd: x eget htop-dev/htop
    reference: https://x-cmd.com/mod/eget
  gobol/:
    cmd: Compile htop
    reference: https://htop.dev/downloads.html#binaries
  debian/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
    dsnap: htop
  ubuntu/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
    dsnap: htop
  kali/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
    dsnap: htop
  raspbian/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
  mint/apt:
    cmd: sudo apt install htop
    reference: https://htop.dev/downloads.html#binaries
  fedora/dnf:
    cmd: sudo dnf install htop
    reference: https://htop.dev/downloads.html#binaries
    dsnap: htop
  gentoo/emerge:
    cmd: sudo emerge sys-process/htop
    reference: https://htop.dev/downloads.html#binaries
  arch/pacman:
    cmd: sudo pacman -S htop
    reference: https://htop.dev/downloads.html#binaries
  arch/yay:
    cmd: yay -S htop-git
    reference: https://aur.archlinux.org/packages/htop-git
  darwin/brew:
    cmd: brew install htop
    reference: https://formulae.brew.sh/formula/htop#default
  opensuse/zypper:
    cmd: sudo zypper install htop
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=htop
binlist:
- htop
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: yes
      internet: no
    filesystem:
      read:
        desc:
          cn: 读取 /proc/* 和 /sys/* 系统状态
          en: Reads /proc/* and /sys/* system state
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 <1 MB
            en: <1 MB install
        growth:
          desc:
            cn: 几乎不增长（无持久数据）
            en: No persistent data; minimal growth
      paths:
        data: []
        config:
          - "$HOME/.config/htop/htoprc"
        cache: []
    memory:
      idle:
        rating: 2
        desc:
          cn: ~30 MB TUI 常驻
          en: ~30 MB TUI resident
      peak:
        rating: 2
        desc:
          cn: ~30 MB
          en: ~30 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 1
        desc:
          cn: 极低，1s 采样周期
          en: Negligible, 1s sampling
      peak:
        rating: 2
        desc:
          cn: 刷新时短暂占用
          en: Brief spike on refresh
