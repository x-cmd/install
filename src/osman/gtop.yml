lang: JavaScript
homepage: https://github.com/aksakalli/gtop
license: MIT
desc:
  en: System monitoring dashboard for terminal
  cn: 终端系统监控仪表盘
x:
  source: https://github.com/aksakalli/gtop
rule:
  /npm:
    cmd: npm install gtop -g
    reference: https://github.com/aksakalli/gtop?tab=readme-ov-file#installation
    dsnap: gtop
binlist:
- gtop

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
