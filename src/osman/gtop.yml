lang: JavaScript
homepage: https://github.com/aksakalli/gtop
license: MIT
desc:
  en: System monitoring dashboard for terminal
  cn: 终端系统监控仪表盘
x:
  source: https://github.com/aksakalli/gtop
rule:
  /npm:
    cmd: npm install gtop -g
    reference: https://github.com/aksakalli/gtop?tab=readme-ov-file#installation
    dsnap: gtop
binlist:
- gtop

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
