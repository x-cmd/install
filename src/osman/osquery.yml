lang: C++
homepage: https://github.com/osquery/osquery
desc:
  cn: osquery 是一个 SQL 驱动的操作系统检测、监视和分析框架
  en: osquery is a SQL powered operating system instrumentation, monitoring, and analytics framework
x:
  source: https://github.com/osquery/osquery
  eget: https://github.com/osquery/osquery
  brew: --caskrule:
  /eget:
    cmd: x eget osquery/osquery
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use osquery
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install --cask osquery
    reference: https://formulae.brew.sh/cask/osquery#default
binlist:
- osquery
license: NOASSERTION

# already profiled
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 193 MB
          rating: 3
          desc:
            cn: 安装 193 MB
            en: 193 MB install
        download:
          estimate: 81 MB
          desc:
            cn: 约 81 MB 下载 (linux/x64)
            en: ~81 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
