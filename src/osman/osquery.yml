lang: C++
homepage: https://github.com/osquery/osquery
desc:
  cn: osquery 是一个 SQL 驱动的操作系统检测、监视和分析框架
  en: osquery is a SQL powered operating system instrumentation, monitoring, and analytics framework
x:
  pkg:
    exist: true
  source: https://github.com/osquery/osquery
  eget: https://github.com/osquery/osquery
rule:
  /eget:
    cmd: x eget osquery/osquery
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use osquery
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install --cask osquery
    reference: https://formulae.brew.sh/cask/osquery#default
binlist:
- osquery
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
