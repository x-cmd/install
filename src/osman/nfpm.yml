lang: Go
homepage: https://github.com/goreleaser/nfpm
license: MIT
desc:
  cn: nFPM 是一个简单的、零依赖项、 deb、 rpm、 apk 和 Arch Linux 打包器
  en: nFPM is a simple, 0-dependencies, deb, rpm, apk, and Arch Linux packager
x:
  source: https://github.com/goreleaser/nfpm
  eget: https://github.com/goreleaser/nfpm
  brew: nfpm
  yay: nfpm
rule:
  /x:
    cmd: x pkg use nfpm
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget goreleaser/nfpm
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install nfpm
    reference: https://nfpm.goreleaser.com/install/#homebrew
  arch/yay:
    cmd: yay -S nfpm
    reference: https://aur.archlinux.org/packages/nfpm
binlist:
- nfpm

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
