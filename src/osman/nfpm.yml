lang: Go
homepage: https://github.com/goreleaser/nfpm
license: MIT
desc:
  cn: nFPM 是一个简单的、零依赖项、 deb、 rpm、 apk 和 Arch Linux 打包器
  en: nFPM is a simple, 0-dependencies, deb, rpm, apk, and Arch Linux packager
x:
  pkg:
    exist: true
  source: https://github.com/goreleaser/nfpm
  eget: https://github.com/goreleaser/nfpm
rule:
  /x:
    cmd: x pkg use nfpm
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget goreleaser/nfpm
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install nfpm
    reference: https://nfpm.goreleaser.com/install/#homebrew
  arch/yay:
    cmd: yay -S nfpm
    reference: https://aur.archlinux.org/packages/nfpm
binlist:
- nfpm

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
