lang: Rust
homepage: https://github.com/pythops/tegratop
license: GPL-3.0
desc:
  en: TUI for monitoring Nvidia jetson boards
  cn: 用于监控 Nvidia Jetson 开发板的 TUI
x:
  source: https://github.com/pythops/tegratop
  yay: tegratop
  cargo: tegratop
rule:
  /cargo:
    cmd: cargo install tegratop
    reference: https://github.com/pythops/tegratop?tab=readme-ov-file#-installation
    dsnap: tegratop
  arch/yay:
    cmd: yay -S tegratop
    reference: https://aur.archlinux.org/packages/tegratop
binlist:
- tegratop

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
