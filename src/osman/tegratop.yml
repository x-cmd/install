lang: Rust
homepage: https://github.com/pythops/tegratop
license: GPL-3.0
desc:
  en: TUI for monitoring Nvidia jetson boards
  cn: 用于监控 Nvidia Jetson 开发板的 TUI
x:
  source: https://github.com/pythops/tegratop
rule:
  /cargo:
    cmd: cargo install tegratop
    reference: https://github.com/pythops/tegratop?tab=readme-ov-file#-installation
    dsnap: tegratop
  arch/yay:
    cmd: yay -S tegratop
    reference: https://aur.archlinux.org/packages/tegratop
binlist:
- tegratop

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
