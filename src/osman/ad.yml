lang: 'Rust'
homepage: https://github.com/sminez/ad
license: 'MIT'
desc:
  cn: 一款可适配的文本编辑器
  en: 'an adaptable text editor'
  cs: přizpůsobivý textový editor
  de: ein anpassbarer Texteditor
  es: un editor de texto adaptable
  fr: un éditeur de texte adaptable
  id: penyunting teks yang dapat disesuaikan
  it: un editor di testo adattabile
  ja: 適応性のあるテキストエディタ
  ko: 조절 가능한 텍스트 편집기
  pl: adaptowalny edytor tekstu
  pt: um editor de texto adaptável
  ro: un editor de text adaptabil
  ru: адаптируемый текстовый редактор
  th: โปรแกรมแก้ไขข้อความที่ปรับตัวได้
  tr: uyarlanabilir bir metin düzenleyici
  uk: адаптований текстовий редактор
  vi: trình soạn thảo văn bản có thể tùy biến
x:
  source: https://github.com/sminez/ad
  eget: sminez/ad
rule:
  /eget:
    cmd: x eget sminez/ad
    reference: https://github.com/sminez/ad
binlist:
  - 'ad'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
