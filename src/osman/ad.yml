lang: 'Rust'
homepage: https://github.com/sminez/ad
license: 'MIT'
desc:
  cn: 一款可适配的文本编辑器
  en: 'an adaptable text editor'
x:
  source: https://github.com/sminez/ad
  eget: https://github.com/sminez/ad
rule:
  /eget:
    cmd: x eget sminez/ad
    reference: https://github.com/sminez/ad
binlist:
  - 'ad'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
