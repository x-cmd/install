lang: Go
homepage: https://github.com/dkorunic/iSMC
license: GPL-3.0
desc:
  cn: 一款苹果系统管理控制器（SMC）的命令行工具，可以解码并显示温度、风扇、电池、电源、电压和电流信息
  en: Apple SMC CLI tool that can decode and display temperature, fans, battery, power, voltage and current information
x:
  pkg:
    exist: true
  source: https://github.com/dkorunic/iSMC
  eget: https://github.com/dkorunic/iSMC
rule:
  /x:
    cmd: x pkg use ismc
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dkorunic/iSMC
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: CGO_ENABLED=1 go install github.com/dkorunic/iSMC@latest
    reference: https://github.com/dkorunic/iSMC#using-go-install
    dsnap: github.com/dkorunic/iSMC@latest
binlist:
- ismc

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (macos/arm64)
            en: ~3 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
