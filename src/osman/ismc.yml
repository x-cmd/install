lang: Go
homepage: https://github.com/dkorunic/iSMC
license: GPL-3.0
desc:
  cn: 一款苹果系统管理控制器（SMC）的命令行工具，可以解码并显示温度、风扇、电池、电源、电压和电流信息
  en: Apple SMC CLI tool that can decode and display temperature, fans, battery, power, voltage and current information
  cs: Nástroj CLI Apple SMC, který dokáže dekódovat a zobrazovat informace o teplotě, ventilátorech, baterii, napájení, napětí a proudu
  de: Apple-SMC-CLI-Tool, das Temperatur-, Lüfter-, Akku-, Strom-, Spannungs- und Strominformationen dekodieren und anzeigen kann
  es: Herramienta CLI de Apple SMC que puede decodificar y mostrar información de temperatura, ventiladores, batería, energía, voltaje y corriente
  fr: Outil CLI Apple SMC capable de décoder et afficher les informations de température, de ventilateurs, de batterie, d'alimentation, de tension et de courant
  id: Alat CLI Apple SMC yang dapat mendekode dan menampilkan informasi suhu, kipas, baterai, daya, tegangan, dan arus
  it: Strumento CLI Apple SMC in grado di decodificare e visualizzare informazioni su temperatura, ventole, batteria, alimentazione, tensione e corrente
  ja: 温度、ファン、バッテリー、電源、電圧、電流の情報をデコードして表示できる Apple SMC 用の CLI ツール
  ko: 온도, 팬, 배터리, 전원, 전압 및 전류 정보를 해독하고 표시할 수 있는 Apple SMC CLI 도구
  pl: Narzędzie CLI Apple SMC, które może dekodować i wyświetlać informacje o temperaturze, wentylatorach, baterii, zasilaniu, napięciu i prądzie
  pt: Ferramenta CLI do Apple SMC que decodifica e exibe informações de temperatura, ventoinhas, bateria, energia, voltagem e corrente
  ro: Instrument CLI Apple SMC care poate decodifica și afișa informații despre temperatură, ventiloare, baterie, alimentare, tensiune și curent
  ru: CLI-инструмент Apple SMC, который умеет декодировать и отображать сведения о температуре, вентиляторах, батарее, питании, напряжении и токе
  th: เครื่องมือ CLI ของ Apple SMC ที่สามารถถอดรหัสและแสดงข้อมูลอุณหภูมิ พัดลม แบตเตอรี่ ไฟเลี้ยง แรงดัน และกระแส
  tr: Sıcaklık, fan, pil, güç, voltaj ve akım bilgilerini çözebilen ve gösteren Apple SMC CLI aracı
  uk: CLI-інструмент Apple SMC, який може декодувати та показувати інформацію про температуру, вентилятори, батарею, живлення, напругу та струм
  vi: Công cụ CLI Apple SMC có thể giải mã và hiển thị thông tin về nhiệt độ, quạt, pin, nguồn, điện áp và dòng điện
x:
  source: https://github.com/dkorunic/iSMC
  eget: dkorunic/iSMC
  go: github.com/dkorunic/iSMC@latest
rule:
  /x:
    cmd: x pkg use ismc
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dkorunic/iSMC
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: CGO_ENABLED=1 go install github.com/dkorunic/iSMC@latest
    reference: https://github.com/dkorunic/iSMC#using-go-install
    dsnap: github.com/dkorunic/iSMC@latest
binlist:
- ismc

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (macos/arm64)
            en: ~3 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
