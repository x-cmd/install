lang: 'Rust'
homepage: https://github.com/Vaishnav-Sabari-Girish/ComChan
license: 'MIT'
desc:
  cn: 极速轻量的串口监控，带串口绘图 TUI 等功能
  en: 'A Blazingly Fast Minimal Serial Monitor with serial plottter TUI and more'
x:
  source: https://github.com/Vaishnav-Sabari-Girish/ComChan
  eget: Vaishnav-Sabari-Girish/ComChan
rule:
  /cargo:
    cmd: 'cargo install'
    reference: https://github.com/Vaishnav-Sabari-Girish/ComChan
  /eget:
    cmd: x eget Vaishnav-Sabari-Girish/ComChan
    reference: https://github.com/Vaishnav-Sabari-Girish/ComChan
binlist:
- 'comchan'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
