lang: 'Rust'
homepage: https://github.com/Vaishnav-Sabari-Girish/ComChan
license: 'MIT'
desc:
  cn: 极速轻量的串口监控，带串口绘图 TUI 等功能
  en: 'A Blazingly Fast Minimal Serial Monitor with serial plottter TUI and more'
x:
  source: https://github.com/Vaishnav-Sabari-Girish/ComChan
  eget: https://github.com/Vaishnav-Sabari-Girish/ComChan
rule:
  /cargo:
    cmd: 'cargo install'
    reference: https://github.com/Vaishnav-Sabari-Girish/ComChan
  /eget:
    cmd: x eget Vaishnav-Sabari-Girish/ComChan
    reference: https://github.com/Vaishnav-Sabari-Girish/ComChan
binlist:
  - 'comchan'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
