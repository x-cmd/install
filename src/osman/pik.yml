lang: Rust
homepage: https://github.com/jacek-kurlit/pik
license: MIT
desc:
  cn: Process Interactive Kill 是一个命令行工具，用于查找并终止进程
  en: Process Interactive Kill is a command line tool that helps to find and kill process
x:
  source: https://github.com/jacek-kurlit/pik
  eget: https://github.com/jacek-kurlit/pik
rule:
  /eget:
    cmd: x eget jacek-kurlit/pik
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S pik
    reference: https://github.com/jacek-kurlit/pik?tab=readme-ov-file#installation
  fedora/dnf:
    cmd: 'dnf copr enable rusty-jack/pik

      dnf install pik

      '
    reference: https://github.com/jacek-kurlit/pik?tab=readme-ov-file#installation
  opensuse-tumbleweed/zypper:
    cmd: zypper install pik
    reference: https://github.com/jacek-kurlit/pik?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install pik
    reference: https://github.com/jacek-kurlit/pik?tab=readme-ov-file#installation
    dsnap: pik
binlist:
- pik

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
