lang: 'Rust'
homepage: 'https://github.com/unhappychoice/gittype'
license: 'MIT'
desc:
  cn: 把源代码变成打字挑战的 CLI 代码打字游戏
  en: 'A CLI code-typing game that turns your source code into typing challenges'
  cs: CLI hra s psaním kódu, která promění váš zdrojový kód na výzvy psaní
  de: Ein CLI-Tipp-Spiel, das Ihren Quellcode in Schreibherausforderungen verwandelt
  es: Un juego de escritura de código en la terminal que convierte tu código fuente en retos de escritura
  fr: Un jeu de frappe de code en CLI qui transforme votre code source en défis de frappe
  id: Permainan mengetik kode CLI yang mengubah kode sumber Anda menjadi tantangan mengetik
  it: Un gioco di digitazione da riga di comando che trasforma il vostro codice sorgente in sfide di digitazione
  ja: ソースコードをタイピングチャレンジに変えるCLIタイピングゲーム
  ko: 소스 코드를 타이핑 챌린지로 바꾸는 CLI 타이핑 게임
  pl: Gra w pisanie kodu w wierszu poleceń, która zamienia twój kod źródłowy w wyzwania pisania
  pt: Um jogo de digitação de código na CLI que transforma seu código-fonte em desafios de digitação
  ro: Un joc de tastare a codului în CLI care transformă codul tău sursă în provocări de tastare
  ru: CLI-игра про набор кода, превращающая ваш исходный код в задания на печать
  th: เกมพิมพ์โค้ดใน CLI ที่เปลี่ยนซอร์สโค้ดของคุณให้เป็นการท้าทายการพิมพ์
  tr: Kaynak kodunuzu yazma meydan okumalarına dönüştüren bir CLI kod yazma oyunu
  uk: CLI-гра з набору коду, яка перетворює ваш вихідний код на завдання з друку
  vi: Trò chơi gõ mã nguồn qua CLI biến mã nguồn của bạn thành các thử thách gõ phím
x:
  source: https://github.com/unhappychoice/gittype
  eget: unhappychoice/gittype
rule:
  /cargo:
    cmd: 'cargo install'
    reference: https://github.com/unhappychoice/gittype
  /eget:
    cmd: x eget unhappychoice/gittype
    reference: https://github.com/unhappychoice/gittype
binlist:
  - 'gittype'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 2.8 MB
          rating: 1
          desc:
            cn: 约 2.8 MB（估算）
            en: ~2.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
