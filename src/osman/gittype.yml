lang: 'Rust'
homepage: 'https://github.com/unhappychoice/gittype'
license: 'MIT'
desc:
  cn: 把源代码变成打字挑战的 CLI 代码打字游戏
  en: 'A CLI code-typing game that turns your source code into typing challenges'
x:
  source: https://github.com/unhappychoice/gittype
  eget: https://github.com/unhappychoice/gittype
rule:
  /cargo:
    cmd: 'cargo install'
    reference: https://github.com/unhappychoice/gittype
  /eget:
    cmd: x eget unhappychoice/gittype
    reference: https://github.com/unhappychoice/gittype
binlist:
  - 'gittype'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.8 MB
          rating: 1
          desc:
            cn: 约 2.8 MB（估算）
            en: ~2.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
