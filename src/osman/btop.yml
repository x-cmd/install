lang: C++
homepage: https://github.com/aristocratos/btop
license: Apache-2.0
desc:
  cn: 资源监视器显示处理器、内存、磁盘、网络和进程的使用情况和统计​​信息。
  en: Resource monitor that shows usage and stats for processor, memory, disks, network and processes
x:
  source: https://github.com/aristocratos/btop
rule:
  opensuse/zypper:
    cmd: sudo zypper in btop
    reference: https://github.com/aristocratos/btop?tab=readme-ov-file#installation
  fedora/dnf:
    cmd: sudo dnf install btop
    reference: https://github.com/aristocratos/btop?tab=readme-ov-file#installation
  rhel/dnf:
    cmd: sudo dnf install epel-release && sudo dnf install btop
    reference: https://github.com/aristocratos/btop?tab=readme-ov-file#installation
  alma/dnf:
    cmd: sudo dnf install epel-release && sudo dnf install btop
    reference: https://github.com/aristocratos/btop?tab=readme-ov-file#installation
  freebsd/pkg:
    cmd: sudo pkg install btop
    reference: https://github.com/aristocratos/btop?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install btop
    reference: https://github.com/aristocratos/btop?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S btop-git
    reference: https://aur.archlinux.org/packages/btop-git
  ubuntu/apt:
    cmd: apt install -y btop
    reference: https://packages.ubuntu.com/resolute/btop
binlist:
  - btop

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
