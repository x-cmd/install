lang: Go
homepage: https://github.com/iann0036/iamlive
license: MIT
desc:
  cn: 使用客户端监控 (CSM) 或嵌入式代理从 AWS、Azure 或 Google Cloud (GCP) 调用生成 IAM 策略
  en: Generate an IAM policy from AWS, Azure, or Google Cloud (GCP) calls using client-side monitoring (CSM) or embedded proxy
x:
  source: https://github.com/iann0036/iamlive
  eget: iann0036/iamlive
  brew: iann0036/iamlive/iamlive
  asdf: iamlive
rule:
  /x:
    cmd: x pkg use iamlive
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget iann0036/iamlive
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use iamlive
    reference: https://github.com/chessmango/asdf-iamlive
  darwin/brew:
    cmd: brew install iann0036/iamlive/iamlive
    reference: https://github.com/iann0036/iamlive?tab=readme-ov-file#homebrew
binlist:
- iamlive
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # AWS STS
    filesystem:
      read:
        desc:
          cn: 读取 AWS IAM policy JSON
          en: Reads AWS IAM policy JSON
        sensitive:
        - "$HOME/.aws/credentials"
      write:
        desc:
          cn: 输出 Terraform IAM policy
          en: Outputs Terraform IAM policy
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 60 MB
        desc:
          cn: ~60 MB
          en: ~60 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 解析大 policy 时短暂占用
          en: Brief spike on large policy parsing
  platform:
    win: full
    linux: full
    darwin: full
