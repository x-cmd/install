lang: Rust
homepage: https://github.com/pythops/impala
license: GPL-3.0
desc:
  cn: 用于在 Linux 上管理 wifi 的 TUI。
  en: TUI for managing wifi on Linux.
x:
  source: https://github.com/pythops/impala
rule:
  /cargo:
    cmd: cargo install impala
    reference: https://github.com/pythops/impala#-installation
    dsnap: impala
  arch/pacman:
    cmd: pacman -S impala
    reference: https://github.com/pythops/impala#-installation
  /nix-env:
    cmd: nix-env -iA nixpkgs.impala
    reference: https://github.com/pythops/impala#-installation
binlist:
- impala

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 257 KB
          rating: 1
          desc:
            cn: 约 257 KB（估算）
            en: ~257 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
