lang: Rust
homepage: https://github.com/pythops/impala
license: GPL-3.0
desc:
  cn: 用于在 Linux 上管理 wifi 的 TUI。
  en: TUI for managing wifi on Linux.
x:
  source: https://github.com/pythops/impala
rule:
  /cargo:
    cmd: cargo install impala
    reference: https://github.com/pythops/impala#-installation
    dsnap: impala
  arch/pacman:
    cmd: pacman -S impala
    reference: https://github.com/pythops/impala#-installation
  /nix-env:
    cmd: nix-env -iA nixpkgs.impala
    reference: https://github.com/pythops/impala#-installation
binlist:
- impala

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
