lang: Python
homepage: https://github.com/noprobelm/tempy
license: MIT
desc:
  en: A simple, visually pleasing weather report in your terminal
  cn: 在终端中显示一个简洁且美观的天气预报
  cs: Jednoduchá a příjemná předpověď počasí ve vašem terminálu
  de: Ein einfacher, optisch ansprechender Wetterbericht in Ihrem Terminal
  es: Un pronóstico del tiempo sencillo y agradable en tu terminal
  fr: Un bulletin météo simple et agréable dans votre terminal
  id: Laporan cuaca yang sederhana dan menyenangkan di terminal Anda
  it: Un bollettino meteo semplice e piacevole nel tuo terminale
  ja: ターミナルに表示する簡潔で美しい天気予報
  ko: 터미널에서 보는 간결하고 보기 좋은 일기 예보
  pl: Prosta i przyjemna prognoza pogody w terminalu
  pt: Uma previsão do tempo simples e agradável no seu terminal
  ro: O prognoză meteo simplă și plăcută în terminalul tău
  ru: Простой и приятный прогноз погоды в терминале
  th: รายงานสภาพอากาศที่เรียบง่ายและสวยงามในเทอร์มินัลของคุณ
  tr: Terminalinizde sade ve göze hitap eden bir hava durumu raporu
  uk: Простий і приємний прогноз погоди у терміналі
  vi: Bản dự báo thời tiết đơn giản và dễ chịu trong terminal của bạn
x:
  source: https://github.com/noprobelm/tempy
  yay: tempy
  pip: git+https://github.com/noprobelm/tempy
rule:
  /pip:
    cmd: pip install git+https://github.com/noprobelm/tempy
    reference: https://github.com/noprobelm/tempy?tab=readme-ov-file#installation
    dsnap: https://github.com/noprobelm/tempy/archive/refs/heads/main.zip
  arch/yay:
    cmd: yay -S tempy
    reference: https://aur.archlinux.org/packages/tempy
binlist:
- tempy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
