lang: Python
homepage: https://github.com/noprobelm/tempy
license: MIT
desc:
  en: A simple, visually pleasing weather report in your terminal
  cn: 在终端中显示一个简洁且美观的天气预报
x:
  source: https://github.com/noprobelm/tempy
  yay: tempy
  pip: git+https://github.com/noprobelm/tempy
rule:
  /pip:
    cmd: pip install git+https://github.com/noprobelm/tempy
    reference: https://github.com/noprobelm/tempy?tab=readme-ov-file#installation
    dsnap: https://github.com/noprobelm/tempy/archive/refs/heads/main.zip
  arch/yay:
    cmd: yay -S tempy
    reference: https://aur.archlinux.org/packages/tempy
binlist:
- tempy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
