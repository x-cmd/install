lang: 'Rust'
homepage: 'https://github.com/huseyinbabal/tredis'
license: 'MIT'
desc:
  cn: 终端版 Redis 数据查看与管理工具
  en: 'Terminal UI for Redis (tredis) - A terminal-based Redis data viewer and manager'
  cs: Terminálové UI pro Redis (tredis) - terminálový prohlížeč a správce dat Redis
  de: Terminal-UI für Redis (tredis) - ein Terminal-basierter Redis-Datenbetrachter und -Verwalter
