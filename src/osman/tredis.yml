lang: 'Rust'
homepage: 'https://github.com/huseyinbabal/tredis'
license: 'MIT'
desc:
  cn: 终端版 Redis 数据查看与管理工具
  en: 'Terminal UI for Redis (tredis) - A terminal-based Redis data viewer and manager'
x:
  source: https://github.com/huseyinbabal/tredis
  eget: https://github.com/huseyinbabal/tredis
rule:
  /eget:
    cmd: x eget huseyinbabal/tredis
    reference: https://github.com/huseyinbabal/tredis
binlist:
  - 'tredis'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 211 KB
          rating: 1
          desc:
            cn: 约 211 KB（估算）
            en: ~211 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
