lang: Rust
homepage: https://github.com/stepchowfun/toast
desc:
  cn: Toast 是一种在容器中工作的工具,将您的开发和持续集成环境集成在一起
  en: Toast is a tool for doing work in containers,containerize your development and continuous integration environments
x:
  source: https://github.com/stepchowfun/toast
  eget: https://github.com/stepchowfun/toast
rule:
  /eget:
    cmd: x eget stepchowfun/toast
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl https://raw.githubusercontent.com/stepchowfun/toast/main/install.sh -LSfs | sh
    reference: https://github.com/stepchowfun/toast?tab=readme-ov-file#installation-on-macos-or-linux-aarch64-or-x86-64
  darwin/brew:
    cmd: brew install toast
    reference: https://formulae.brew.sh/formula/toast#default
binlist:
- toast
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
