lang: Go
homepage: https://github.com/wtfutil/wtf
license: MPL-2.0
desc:
  cn: WTF 是您终端的个人信息仪表板
  en: WTF is the personal information dashboard for your terminal
x:
  pkg:
    exist: true
  source: https://github.com/wtfutil/wtf
  eget: https://github.com/wtfutil/wtf
rule:
  /x:
    cmd: x pkg use wtfutil
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget wtfutil/wtf
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use wtfutil
    reference: https://github.com/NeoHsu/asdf-wtfutil
  darwin/brew:
    cmd: brew install wtfutil
    reference: https://github.com/wtfutil/wtf?tab=readme-ov-file#installing-via-homebrew
  darwin/port:
    cmd: sudo port install wtfutil
    reference: https://github.com/wtfutil/wtf?tab=readme-ov-file#installing-via-macports
  arch/yay:
    cmd: yay -S wtfutil
    reference: https://aur.archlinux.org/packages/wtfutil
  /go:
    cmd: 'export GOPROXY="https://proxy.golang.org,direct"

      export GOSUMDB=off

      export GO111MODULE=on

      go get -u github.com/wtfutil/wtf

      cd $GOPATH/src/github.com/wtfutil/wtf

      make install

      make run

      '
    reference: https://github.com/wtfutil/wtf?tab=readme-ov-file#installing-from-source
    dsnap: github.com/wtfutil/wtf
binlist:
- wtfutil
