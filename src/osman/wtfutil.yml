lang: Go
homepage: https://github.com/wtfutil/wtf
license: MPL-2.0
desc:
  cn: WTF 是您终端的个人信息仪表板
  en: WTF is the personal information dashboard for your terminal
  cs: WTF je osobní informační panel pro váš terminál
  de: WTF ist das persönliche Info-Dashboard für Ihr Terminal
  es: WTF es el panel de información personal para tu terminal
  fr: WTF est le tableau de bord d'informations personnel pour votre terminal
  id: WTF adalah dasbor informasi pribadi untuk terminal Anda
  it: WTF è la dashboard di informazioni personale per il tuo terminale
  ja: WTF はターミナル用の個人情報ダッシュボードです
  ko: WTF는 터미널을 위한 개인 정보 대시보드입니다
  pl: WTF to osobisty pulpit informacyjny dla twojego terminala
  pt: O WTF é o painel de informações pessoal para o seu terminal
  ro: WTF este tabloul de bord personal cu informații pentru terminalul tău
  ru: WTF - личная информационная панель для вашего терминала
  th: WTF คือแดชบอร์ดข้อมูลส่วนตัวสำหรับเทอร์มินัลของคุณ
  tr: WTF, terminaliniz için kişisel bilgi panosudur
  uk: WTF - особиста інформаційна панель для вашого термінала
  vi: WTF là bảng điều khiển thông tin cá nhân cho terminal của bạn
x:
  source: https://github.com/wtfutil/wtf
  eget: wtfutil/wtf
  brew: wtfutil
  port: wtfutil
  yay: wtfutil
  asdf: wtfutil
rule:
  /x:
    cmd: x pkg use wtfutil
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget wtfutil/wtf
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use wtfutil
    reference: https://github.com/NeoHsu/asdf-wtfutil
  darwin/brew:
    cmd: brew install wtfutil
    reference: https://github.com/wtfutil/wtf?tab=readme-ov-file#installing-via-homebrew
  darwin/port:
    cmd: sudo port install wtfutil
    reference: https://github.com/wtfutil/wtf?tab=readme-ov-file#installing-via-macports
  arch/yay:
    cmd: yay -S wtfutil
    reference: https://aur.archlinux.org/packages/wtfutil
  /go:
    cmd: 'export GOPROXY="https://proxy.golang.org,direct"

      export GOSUMDB=off

      export GO111MODULE=on

      go get -u github.com/wtfutil/wtf

      cd $GOPATH/src/github.com/wtfutil/wtf

      make install

      make run

      '
    reference: https://github.com/wtfutil/wtf?tab=readme-ov-file#installing-from-source
    dsnap: github.com/wtfutil/wtf
binlist:
- wtfutil

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
