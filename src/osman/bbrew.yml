lang: 'Go'
homepage: https://github.com/Valkyrie00/bold-brew
license: 'MIT'
desc:
  cn: Bold Brew — Homebrew 的 TUI 管理器
  en: 'Bold Brew (bbrew) - A Homebrew TUI Manager'
  cs: Bold Brew (bbrew) - TUI správce pro Homebrew
  de: Bold Brew (bbrew) - Ein Homebrew-TUI-Manager
  es: Bold Brew (bbrew) - Un gestor TUI para Homebrew
  fr: Bold Brew (bbrew) - Un gestionnaire TUI pour Homebrew
  id: Bold Brew (bbrew) - Manajer TUI untuk Homebrew
  it: Bold Brew (bbrew) - Un gestore TUI per Homebrew
  ja: Bold Brew (bbrew) - Homebrew の TUI マネージャー
  ko: Bold Brew (bbrew) - Homebrew용 TUI 관리자
  pl: Bold Brew (bbrew) - Menedżer TUI dla Homebrew
  pt: Bold Brew (bbrew) - Um gerenciador TUI para Homebrew
  ro: Bold Brew (bbrew) - Un manager TUI pentru Homebrew
  ru: Bold Brew (bbrew) - TUI-менеджер для Homebrew
  th: Bold Brew (bbrew) - ตัวจัดการ TUI สำหรับ Homebrew
  tr: Bold Brew (bbrew) - Homebrew için bir TUI yöneticisi
  uk: Bold Brew (bbrew) - TUI-менеджер для Homebrew
  vi: Bold Brew (bbrew) - Trình quản lý TUI cho Homebrew
x:
  source: https://github.com/Valkyrie00/bold-brew
  eget: Valkyrie00/bold-brew
rule:
  /eget:
    cmd: x eget Valkyrie00/bold-brew
    reference: https://github.com/Valkyrie00/bold-brew
binlist:
  - 'bbrew'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
