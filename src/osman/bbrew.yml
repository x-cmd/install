lang: 'Go'
homepage: https://github.com/Valkyrie00/bold-brew
license: 'MIT'
desc:
  cn: Bold Brew — Homebrew 的 TUI 管理器
  en: 'Bold Brew (bbrew) - A Homebrew TUI Manager'
x:
  source: https://github.com/Valkyrie00/bold-brew
  eget: https://github.com/Valkyrie00/bold-brew
rule:
  /eget:
    cmd: x eget Valkyrie00/bold-brew
    reference: https://github.com/Valkyrie00/bold-brew
binlist:
  - 'bbrew'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
