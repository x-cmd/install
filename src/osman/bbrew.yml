lang: 'Go'
homepage: https://github.com/Valkyrie00/bold-brew
license: 'MIT'
desc:
  cn: Bold Brew — Homebrew 的 TUI 管理器
  en: 'Bold Brew (bbrew) - A Homebrew TUI Manager'
x:
  source: https://github.com/Valkyrie00/bold-brew
  eget: Valkyrie00/bold-brew
rule:
  /eget:
    cmd: x eget Valkyrie00/bold-brew
    reference: https://github.com/Valkyrie00/bold-brew
binlist:
  - 'bbrew'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
