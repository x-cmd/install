lang: Makefile
homepage: https://musl.libc.org/
desc:
  cn: musl 是建立在 C 标准库之上的实现 Linux 系统调用 API，包括 base 中定义的接口 语言标准、POSIX 和广泛认可的扩展
  en: musl is an implementation of the C standard library built on top of the Linux system call API, including interfaces defined in the base language standard, POSIX, and widely agreed-upon extensions
rule:
  /apt:
    cmd: sudo apt-get install musl-tools
    reference: https://command-not-found.com/musl-gcc
  alpine/apk:
    cmd: sudo apk add musl
    reference: https://command-not-found.com/musl-gcc
    dsnap: musl
  arch/pacman:
    cmd: sudo pacman -S musl
    reference: https://command-not-found.com/musl-gcc
  kali/apt:
    cmd: sudo apt-get install musl-tools
    reference: https://command-not-found.com/musl-gcc
    dsnap: musl-tools
binlist:
- musl
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
