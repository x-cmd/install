lang: Makefile
homepage: https://musl.libc.org/
desc:
  cn: musl 是建立在 C 标准库之上的实现 Linux 系统调用 API，包括 base 中定义的接口 语言标准、POSIX 和广泛认可的扩展
  en: musl is an implementation of the C standard library built on top of the Linux system call API, including interfaces defined in the base language standard, POSIX, and widely agreed-upon extensions
rule:
  /apt:
    cmd: sudo apt-get install musl-tools
    reference: https://command-not-found.com/musl-gcc
  alpine/apk:
    cmd: sudo apk add musl
    reference: https://command-not-found.com/musl-gcc
    dsnap: musl
  arch/pacman:
    cmd: sudo pacman -S musl
    reference: https://command-not-found.com/musl-gcc
  kali/apt:
    cmd: sudo apt-get install musl-tools
    reference: https://command-not-found.com/musl-gcc
    dsnap: musl-tools

x:
  apt: musl-tools
  apt-get: musl-tools
  pacman: musl
  apk: musl
binlist:
- musl
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
