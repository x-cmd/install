lang: Python
homepage: https://github.com/nicolargo/glances
desc:
  cn: Glances 是一个开源系统跨平台监控工具
  en: Glances is an open-source system cross-platform monitoring tool
  cs: Glances je open-source multiplatformní monitorovací nástroj systému
  de: Glances ist ein quelloffenes, plattformübergreifendes Systemüberwachungswerkzeug
  es: Glances es una herramienta de monitorización de sistemas multiplataforma y de código abierto
  fr: Glances est un outil de supervision système open source et multiplateforme
  id: Glances adalah alat pemantauan sistem lintas platform sumber terbuka
  it: Glances è uno strumento di monitoraggio di sistema multipiattaforma e open source
  ja: Glances はオープンソースのクロスプラットフォームシステム監視ツールです
  ko: Glances는 오픈 소스 크로스 플랫폼 시스템 모니터링 도구입니다
  pl: Glances to wieloplatformowe, open source narzędzie do monitorowania systemu
  pt: Glances é uma ferramenta de monitoramento de sistema multiplataforma e de código aberto
  ro: Glances este un instrument open source de monitorizare a sistemului, multiplatformă
  ru: Glances — кроссплатформенный инструмент мониторинга системы с открытым исходным кодом
  th: Glances เป็นเครื่องมือตรวจสอบระบบข้ามแพลตฟอร์มแบบโอเพนซอร์ส
  tr: Glances, açık kaynaklı, çok platformlu bir sistem izleme aracıdır
  uk: Glances — кроссплатформенний інструмент моніторингу системи з відкритим кодом
  vi: Glances là công cụ giám sát hệ thống đa nền tảng, mã nguồn mở
x:
  source: https://github.com/nicolargo/glances
  apt: glances
  dnf: glances
  brew: glances
  pacman: glances
  apk: glances
  apt-get: glances
  zypper: python-Glances
  port: glances
  yay: glances-git
rule:
  /x:
    cmd: x pkg use glances
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install glances
    reference: https://github.com/nicolargo/glances?tab=readme-ov-file#homebrew
  darwin/port:
    cmd: sudo port install glances
    reference: https://github.com/nicolargo/glances?tab=readme-ov-file#macports
  /pip:
    cmd: pip install --user glances
    reference: https://github.com/nicolargo/glances?tab=readme-ov-file#pypi-pip-the-standard-way
    dsnap: glances
  freebsd/pkg:
    cmd: pkg install py39-glances
    reference: https://github.com/nicolargo/glances?tab=readme-ov-file#freebsd
  debian/apt:
    cmd: sudo apt-get install glances
    reference: https://command-not-found.com/glances
    dsnap: glances
  ubuntu/apt:
    cmd: sudo apt-get install glances
    reference: https://command-not-found.com/glances
    dsnap: glances
  alpine/apt:
    cmd: apk add glances
    reference: https://command-not-found.com/glances
  arch/pacman:
    cmd: sudo pacman -S glances
    reference: https://command-not-found.com/glances
  arch/yay:
    cmd: yay -S glances-git
    reference: https://aur.archlinux.org/packages/glances-git
  kali/apt:
    cmd: sudo apt-get install glances
    reference: https://command-not-found.com/glances
    dsnap: glances
  raspbian/apt:
    cmd: sudo apt-get install glances
    reference: https://command-not-found.com/glances
  mint/apt:
    cmd: sudo apt-get install glances
    reference: https://command-not-found.com/glances
  fedora/dnf:
    cmd: sudo dnf install glances
    reference: https://command-not-found.com/glances
    dsnap: glances
  opensuse/zypper:
    cmd: sudo zypper install python-Glances
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=python-Glances
binlist:
- glances
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 93 KB
          rating: 1
          desc:
            cn: 约 93 KB（估算）
            en: ~93 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
