lang: Go
desc:
  cn: 用于 shell 命令执行、可视化和警报的工具
  en: A tool for shell commands execution, visualization and alerting
homepage: https://github.com/sqshq/sampler
license: GPL-3.0
x:
  pkg:
    exist: true
  source: https://github.com/sqshq/sampler
  eget: https://github.com/sqshq/sampler
rule:
  /eget:
    cmd: x eget sqshq/sampler
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use sampler
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S sampler
    reference: https://aur.archlinux.org/packages/sampler
  darwin/brew:
    cmd: brew install sampler
    reference: https://github.com/sqshq/sampler?tab=readme-ov-file#macos
  darwin/curl:
    cmd: 'sudo curl -Lo /usr/local/bin/sampler https://github.com/sqshq/sampler/releases/download/v1.1.0/sampler-1.1.0-darwin-amd64

      sudo chmod +x /usr/local/bin/sampler

      '
    reference: https://github.com/sqshq/sampler?tab=readme-ov-file#macos
  darwin/port:
    cmd: sudo port install sampler
    reference: https://github.com/sqshq/sampler?tab=readme-ov-file#macos
  linux/wget:
    cmd: 'sudo wget https://github.com/sqshq/sampler/releases/download/v1.1.0/sampler-1.1.0-linux-amd64 -O /usr/local/bin/sampler

      sudo chmod +x /usr/local/bin/sampler

      '
    reference: https://github.com/sqshq/sampler?tab=readme-ov-file#linux
  (win|wsl2)/choco:
    cmd: choco install sampler
    reference: https://github.com/sqshq/sampler?tab=readme-ov-file#windows-experimental
binlist:
- sampler

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
