lang: Python
homepage: https://github.com/rcaloras/bashhub-client
license: Apache-2.0
desc:
  cn: Bashhub 保存在所有会话和系统中输入的每个终端命令，并提供跨所有命令的强大查询
  en: Bashhub saves every terminal command entered across all sessions and systems and provides powerful querying across all commands
x:
  source: https://github.com/rcaloras/bashhub-client
rule:
  /curl:
    cmd: curl -OL https://bashhub.com/setup && $SHELL setup
    reference: https://bashhub.com/install
binlist:
- bh

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
