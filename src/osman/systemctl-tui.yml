lang: 'Rust'
homepage: 'https://github.com/rgwood/systemctl-tui'
license: 'MIT'
desc:
  cn: 用于与 systemd 服务及其日志交互的快速简洁 TUI
  en: 'A fast, simple TUI for interacting with systemd services and their logs'
x:
  source: https://github.com/rgwood/systemctl-tui
  eget: https://github.com/rgwood/systemctl-tui
rule:
  /cargo:
    cmd: 'cargo install systemctl-tui --locked'
    reference: https://github.com/rgwood/systemctl-tui
  /eget:
    cmd: x eget rgwood/systemctl-tui
    reference: https://github.com/rgwood/systemctl-tui
binlist:
  - 'systemctl-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 395 KB
          rating: 1
          desc:
            cn: 约 395 KB（估算）
            en: ~395 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
