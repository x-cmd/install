lang: 'Rust'
homepage: 'https://github.com/rgwood/systemctl-tui'
license: 'MIT'
desc:
  cn: 用于与 systemd 服务及其日志交互的快速简洁 TUI
  en: 'A fast, simple TUI for interacting with systemd services and their logs'
x:
  source: https://github.com/rgwood/systemctl-tui
  eget: https://github.com/rgwood/systemctl-tui
rule:
  /cargo:
    cmd: 'cargo install systemctl-tui --locked'
    reference: https://github.com/rgwood/systemctl-tui
  /eget:
    cmd: x eget rgwood/systemctl-tui
    reference: https://github.com/rgwood/systemctl-tui
binlist:
- 'systemctl-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
