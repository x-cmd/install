x:
  source: https://github.com/txthinking/joker
  eget: txthinking/joker
rule:
  /x:
    cmd: x pkg use joker
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/joker
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install joker
    reference: https://github.com/txthinking/joker?tab=readme-ov-file#install-via-nami
binlist:
- joker

