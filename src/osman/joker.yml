lang: C
homepage: https://github.com/txthinking/joker
license: GPL-3.0
desc:
  cn: Joker 可以将进程变成守护进程
  en: Joker can turn process into daemon
x:
  pkg:
    exist: true
  source: https://github.com/txthinking/joker
  eget: https://github.com/txthinking/joker
rule:
  /x:
    cmd: x pkg use joker
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/joker
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install joker
    reference: https://github.com/txthinking/joker?tab=readme-ov-file#install-via-nami
binlist:
- joker

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 485 KB
          rating: 1
          desc:
            cn: 安装 485 KB
            en: 485 KB install
        download:
          estimate: 485 KB
          desc:
            cn: 约 485 KB 下载 (linux/x64)
            en: ~485 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
