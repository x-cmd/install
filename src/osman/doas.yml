lang: C
homepage: https://github.com/slicer69/doas
license: BSD-2-Clause
desc:
  cn: OpenBSD doas 的一个端口，运行在 FreeBSD、Linux、NetBSD、illumos、macOS 和 MidnightBSD 上
  en: A port of OpenBSD's doas which runs on FreeBSD, Linux, NetBSD, and illumos
x:
  source: https://github.com/slicer69/doas
rule:
  freebsd/pkg:
    cmd: pkg install doas
    reference: https://github.com/slicer69/doas?tab=readme-ov-file#installation-via-packagesrepositories
  midnightbsd/:
    cmd: mport install doas
    reference: https://github.com/slicer69/doas?tab=readme-ov-file#installation-via-packagesrepositories
  debian/pacstall:
    cmd: pacstall -I doas-git
    reference: https://github.com/slicer69/doas?tab=readme-ov-file#installation-via-packagesrepositories
  ubuntu/pacstall:
    cmd: pacstall -I doas-git
    reference: https://github.com/slicer69/doas?tab=readme-ov-file#installation-via-packagesrepositories
  debian/apt:
    cmd: sudo apt install doas
    reference: https://linuxtldr.com/install-doas/
    dsnap: doas
  ubuntu/apt:
    cmd: sudo apt install doas
    reference: https://linuxtldr.com/install-doas/
    dsnap: doas
  kali/apt:
    cmd: sudo apt install doas
    reference: https://linuxtldr.com/install-doas/
    dsnap: doas
  mint/apt:
    cmd: sudo apt install doas
    reference: https://linuxtldr.com/install-doas/
  zorin/apt:
    cmd: sudo apt install doas
    reference: https://linuxtldr.com/install-doas/
  pop/apt:
    cmd: sudo apt install doas
    reference: https://linuxtldr.com/install-doas/
  rhel/dnf:
    cmd: sudo dnf install opendoas
    reference: https://linuxtldr.com/install-doas/
  fedora/dnf:
    cmd: sudo dnf install opendoas
    reference: https://linuxtldr.com/install-doas/
    dsnap: opendoas
  centos/dnf:
    cmd: sudo dnf install opendoas
    reference: https://linuxtldr.com/install-doas/
  alma/dnf:
    cmd: sudo dnf install opendoas
    reference: https://linuxtldr.com/install-doas/
  arch/pacman:
    cmd: sudo pacman -S opendoas
    reference: https://linuxtldr.com/install-doas/
  arch/yay:
    cmd: yay -S doas
    reference: https://aur.archlinux.org/packages/doas
  manjaro/pacman:
    cmd: sudo pacman -S opendoas
    reference: https://linuxtldr.com/install-doas/
  blackarch/pacman:
    cmd: sudo pacman -S opendoas
    reference: https://linuxtldr.com/install-doas/
  garuda/pacman:
    cmd: sudo pacman -S opendoas
    reference: https://linuxtldr.com/install-doas/
  void/xbps:
    cmd: sudo xbps-install opendoas
    reference: https://linuxtldr.com/install-doas/
  vx/xbps:
    cmd: sudo xbps-install opendoas
    reference: https://linuxtldr.com/install-doas/
  gabee/xbps:
    cmd: sudo xbps-install opendoas
    reference: https://linuxtldr.com/install-doas/
  agarim/xbps:
    cmd: sudo xbps-install opendoas
    reference: https://linuxtldr.com/install-doas/
binlist:
- doas

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
