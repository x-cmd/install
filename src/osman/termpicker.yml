lang: Go
homepage: https://github.com/ChausseBenjamin/termpicker
desc:
  cn: termpicker 是一个颜色选择器，允许用户在 truecolor 终端中直观地选择和预览颜色。
  en: termpicker is a color picker that lets users visually select and preview colors in a truecolor terminal.
  cs: termpicker je výběr barev, který uživatelům umožňuje vizuálně vybírat a náhledovat barvy v terminálu s truecolor.
  de: termpicker ist ein Farbwähler, mit dem Benutzer Farben in einem Truecolor-Terminal visuell auswählen und ansehen können.
  es: termpicker es un selector de color que permite a los usuarios elegir y previsualizar visualmente los colores en un terminal truecolor.
  fr: termpicker est un sélecteur de couleurs qui permet aux utilisateurs de choisir et de prévisualiser visuellement les couleurs dans un terminal truecolor.
  id: termpicker adalah pemilih warna yang memungkinkan pengguna memilih dan melihat pratinjau warna secara visual di terminal truecolor.
  it: termpicker è un selettore di colori che consente agli utenti di scegliere e visualizzare in anteprima i colori in un terminale truecolor.
  ja: termpicker は、truecolor 端末で色を視覚的に選択してプレビューできるカラーピッカーです。
  ko: termpicker는 truecolor 터미널에서 색상을 시각적으로 선택하고 미리 볼 수 있게 하는 색상 선택기입니다.
  pl: termpicker to narzędzie do wybierania kolorów, które pozwala użytkownikom wizualnie wybierać i podglądać kolory w terminalu truecolor.
  pt: termpicker é um seletor de cores que permite aos usuários selecionar e visualizar visualmente as cores em um terminal truecolor.
  ro: termpicker este un selector de culori care le permite utilizatorilor să selecteze vizual și să previzualizeze culorile într-un terminal truecolor.
  ru: termpicker — это средство выбора цвета, позволяющее визуально выбирать и просматривать цвета в терминале с truecolor.
  th: termpicker คือตัวเลือกสีที่ให้ผู้ใช้เลือกและดูตัวอย่างสีได้อย่างเห็นภาพในเทอร์มินัล truecolor
  tr: termpicker, kullanıcıların truecolor terminalde renkleri görsel olarak seçmesini ve önizlemesini sağlayan bir renk seçicidir.
  uk: termpicker — це вибірник кольорів, який дає змогу користувачам візуально вибирати та переглядати кольори в терміналі truecolor.
  vi: termpicker là bộ chọn màu cho phép người dùng chọn và xem trước màu sắc trực quan trong terminal truecolor.
x:
  source: https://github.com/ChausseBenjamin/termpicker
  eget: ChausseBenjamin/termpicker
  yay: termpicker-bin
  go: github.com/ChausseBenjamin/termpicker@latest
rule:
  /eget:
    cmd: x eget ChausseBenjamin/termpicker
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/ChausseBenjamin/termpicker@latest
    reference: https://github.com/ChausseBenjamin/termpicker?tab=readme-ov-file#installation
    dsnap: github.com/ChausseBenjamin/termpicker@latest
  arch/yay:
    cmd: yay -S termpicker-bin
    reference: https://aur.archlinux.org/packages/termpicker-bin
binlist:
- termpicker
license: NOASSERTION

