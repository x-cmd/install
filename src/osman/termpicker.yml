lang: Go
homepage: https://github.com/ChausseBenjamin/termpicker
desc:
  cn: termpicker 是一个颜色选择器，允许用户在 truecolor 终端中直观地选择和预览颜色。
  en: termpicker is a color picker that lets users visually select and preview colors in a truecolor terminal.
x:
  source: https://github.com/ChausseBenjamin/termpicker
  eget: https://github.com/ChausseBenjamin/termpicker
rule:
  /eget:
    cmd: x eget ChausseBenjamin/termpicker
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/ChausseBenjamin/termpicker@latest
    reference: https://github.com/ChausseBenjamin/termpicker?tab=readme-ov-file#installation
    dsnap: github.com/ChausseBenjamin/termpicker@latest
  arch/yay:
    cmd: yay -S termpicker-bin
    reference: https://aur.archlinux.org/packages/termpicker-bin
binlist:
- termpicker
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
