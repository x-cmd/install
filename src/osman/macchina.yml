lang: Rust
desc:
  cn: 用于查看系统信息
  en: View system information
homepage: https://github.com/macchina-cli/macchina
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/macchina-cli/macchina
  eget: https://github.com/macchina-cli/macchina
rule:
  /x:
    cmd: x pkg use macchina
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget macchina-cli/macchina
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo add macchina
    reference: https://crates.io/crates/macchina
    dsnap: macchina
  darwin/brew:
    cmd: brew install macchina
    reference: https://github.com/Macchina-CLI/macchina/wiki/Installation#homebrew
  opensuse/zypper:
    cmd: sudo zypper in macchina
    reference: https://github.com/Macchina-CLI/macchina/wiki/Installation#opensuse-tumbleweed
  arch/yay:
    cmd: yay -S macchina-git
    reference: https://aur.archlinux.org/packages/macchina-git
binlist:
- macchina

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 91 KB
          rating: 1
          desc:
            cn: 约 91 KB（估算）
            en: ~91 KB estimated
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
