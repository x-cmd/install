lang: 'Rust'
homepage: https://github.com/jordond/jolt
license: 'MIT'
desc:
  cn: macOS 与 Linux 的终端电池与能耗监控
  en: '⚡️A terminal-based battery and energy monitor for macOS and Linux.'
x:
  source: https://github.com/jordond/jolt
  eget: https://github.com/jordond/jolt
rule:
  /eget:
    cmd: x eget jordond/jolt
    reference: https://github.com/jordond/jolt
binlist:
  - 'jolt'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
