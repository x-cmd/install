lang: 'Rust'
homepage: https://github.com/jordond/jolt
license: 'MIT'
desc:
  cn: macOS 与 Linux 的终端电池与能耗监控
  en: '⚡️A terminal-based battery and energy monitor for macOS and Linux.'
x:
  source: https://github.com/jordond/jolt
  eget: https://github.com/jordond/jolt
rule:
  /eget:
    cmd: x eget jordond/jolt
    reference: https://github.com/jordond/jolt
binlist:
- 'jolt'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 696 KB
          rating: 1
          desc:
            cn: 约 696 KB（估算）
            en: ~696 KB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
