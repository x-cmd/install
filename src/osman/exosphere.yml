lang: 'Python'
homepage: https://github.com/mrdaemon/exosphere
license: 'MIT'
desc:
  cn: Python 编写的 CLI 与 TUI 应用，为远程 Unix 系统提供补丁报告
  en: 'A simple CLI and TUI driven application that offers patch reporting for remote unix systems, written in Python'
x:
  source: https://github.com/mrdaemon/exosphere
  eget: https://github.com/mrdaemon/exosphere
rule:
  /eget:
    cmd: x eget mrdaemon/exosphere
    reference: https://github.com/mrdaemon/exosphere
binlist:
  - 'exosphere'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
