  id: Aplikasi penjelajah TUI untuk Amazon S3 (AWS S3) 🪣
  it: Applicazione di esplorazione TUI per Amazon S3 (AWS S3) 🪣
  ja: Amazon S3 (AWS S3) を閲覧するための TUI エクスプローラーアプリケーション 🪣
  ko: Amazon S3 (AWS S3)를 탐색하는 TUI 탐색기 애플리케이션 🪣
