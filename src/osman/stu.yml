  th: แอปตัวสำรวจ TUI สำหรับ Amazon S3 (AWS S3) 🪣
  tr: Amazon S3 (AWS S3) için TUI gezgin uygulaması 🪣
  uk: TUI-застосунок-оглядач для Amazon S3 (AWS S3) 🪣
  vi: Ứng dụng trình duyệt TUI cho Amazon S3 (AWS S3) 🪣
x:
  source: https://github.com/lusingander/stu
  eget: lusingander/stu
rule:
  /eget:
    cmd: x eget lusingander/stu
    reference: https://github.com/lusingander/stu
binlist:
- 'stu'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
