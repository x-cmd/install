lang: 'Rust'
homepage: https://github.com/lusingander/stu
license: 'MIT'
desc:
  cn: Amazon S3 的 TUI 浏览器
  en: 'TUI explorer application for Amazon S3 (AWS S3) 🪣'
x:
  source: https://github.com/lusingander/stu
  eget: https://github.com/lusingander/stu
rule:
  /eget:
    cmd: x eget lusingander/stu
    reference: https://github.com/lusingander/stu
binlist:
  - 'stu'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
