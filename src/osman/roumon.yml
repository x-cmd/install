lang: 'Go'
homepage: 'https://github.com/becheran/roumon'
license: 'MIT'
desc:
  cn: 基于 pprof 和 termui 的通用 goroutine 监控工具
  en: 'Universal goroutine monitor using pprof and termui'
x:
  source: https://github.com/becheran/roumon
  eget: https://github.com/becheran/roumon
rule:
  /eget:
    cmd: x eget becheran/roumon
    reference: https://github.com/becheran/roumon
binlist:
- 'roumon'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
