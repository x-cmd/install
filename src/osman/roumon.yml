lang: 'Go'
homepage: 'https://github.com/becheran/roumon'
license: 'MIT'
desc:
  cn: 基于 pprof 和 termui 的通用 goroutine 监控工具
  en: 'Universal goroutine monitor using pprof and termui'
x:
  source: https://github.com/becheran/roumon
  eget: https://github.com/becheran/roumon
rule:
  /eget:
    cmd: x eget becheran/roumon
    reference: https://github.com/becheran/roumon
binlist:
  - 'roumon'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
