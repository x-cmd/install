lang: 'Go'
homepage: 'https://github.com/lfaoro/ssm'
license: 'MIT'
desc:
  cn: 快速、键盘驱动的 TUI，让 ~/.ssh/config 在大规模场景下更好用
  en: 'A fast, keyboard-driven TUI that makes your existing ~/.ssh/config delightful to use at fleet scale.'
x:
  source: https://github.com/lfaoro/ssm
  eget: https://github.com/lfaoro/ssm
rule:
  darwin/brew:
    cmd: 'brew install lfaoro/tap/ssm'
    reference: https://github.com/lfaoro/ssm
  debian/apt:
    cmd: 'sudo apt install ./ssm_*_linux_*.deb'
    reference: https://github.com/lfaoro/ssm
  /eget:
    cmd: x eget lfaoro/ssm
    reference: https://github.com/lfaoro/ssm
binlist:
- 'ssm'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
