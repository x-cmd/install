lang: 'Go'
homepage: 'https://github.com/umlx5h/gtrash'
license: 'MIT'
desc:
  cn: 功能丰富的回收站 CLI 管理器，rm 与 trash-cli 的替代品
  en: 'A Featureful Trash CLI manager: alternative to rm and trash-cli'
  cs: "Funkční správce koše CLI: alternativa k rm a trash-cli"
  de: "Funktionsreicher CLI-Korb-Manager: eine Alternative zu rm und trash-cli"
  es: "Gestor de papelera CLI con muchas funciones: alternativa a rm y trash-cli"
  fr: "Gestionnaire de corbeille CLI complet : alternative à rm et trash-cli"
  id: "Pengelola Sampah CLI lengkap: alternatif untuk rm dan trash-cli"
  it: "Gestore del cestino CLI ricco di funzionalità: alternativa a rm e trash-cli"
  ja: 高機能なCLIゴミ箱マネージャー。rmとtrash-cliの代替
  ko: "기능이 풍부한 CLI 휴지통 관리자: rm 및 trash-cli의 대안"
  pl: "Bogaty w funkcje menedżer kosza CLI: alternatywa dla rm i trash-cli"
  pt: "Gerenciador de lixeira CLI completo: alternativa ao rm e ao trash-cli"
  ro: "Manager coș CLI bogat în funcții: alternative la rm și trash-cli"
  ru: "Функциональный CLI-менеджер корзины: альтернатива rm и trash-cli"
  th: "ตัวจัดการถังขยะแบบ CLI ที่มีความสามารถครบถ้วน: ทางเลือกแทน rm และ trash-cli"
  tr: "Özellik açısından zengin CLI çöp kutusu yöneticisi: rm ve trash-cli'ye alternatif"
  uk: "Функціональний CLI-менеджер кошика: альтернатива rm та trash-cli"
  vi: "Trình quản lý thùng rác CLI đầy đủ tính năng: thay thế cho rm và trash-cli"
x:
  source: https://github.com/umlx5h/gtrash
  eget: umlx5h/gtrash
rule:
  /eget:
    cmd: x eget umlx5h/gtrash
    reference: https://github.com/umlx5h/gtrash
binlist:
- 'gtrash'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
