lang: 'Go'
homepage: 'https://github.com/umlx5h/gtrash'
license: 'MIT'
desc:
  cn: 功能丰富的回收站 CLI 管理器，rm 与 trash-cli 的替代品
  en: 'A Featureful Trash CLI manager: alternative to rm and trash-cli'
x:
  source: https://github.com/umlx5h/gtrash
  eget: https://github.com/umlx5h/gtrash
rule:
  /eget:
    cmd: x eget umlx5h/gtrash
    reference: https://github.com/umlx5h/gtrash
binlist:
  - 'gtrash'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
