lang: Go
homepage: https://github.com/guumaster/hostctl
license: MIT
desc:
  cn: 用于管理 /etc/hosts 的工具
  en: Tools for managing /etc/hosts
x:
  source: https://github.com/guumaster/hostctl
  eget: https://github.com/guumaster/hostctl
  brew: guumaster/tap/hostctl
  scoop: hostctl
  yay: hostctl
  asdf: hostctl
rule:
  /x:
    cmd: x pkg use hostctl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget guumaster/hostctl
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S hostctl
    reference: https://aur.archlinux.org/packages/hostctl
  /nix-env:
    cmd: nix-env -iA nixpkgs.hostctl
    reference: https://guumaster.github.io/hostctl/docs/installation/#nix
  darwin/brew:
    cmd: brew install guumaster/tap/hostctl
    reference: https://guumaster.github.io/hostctl/docs/installation/#homebrew
  /asdf:
    cmd: x asdf use hostctl
    reference: https://guumaster.github.io/hostctl/docs/installation/#asdf
  (win|wsl2)/scoop:
    cmd: x scoop install hostctl
    reference: https://guumaster.github.io/hostctl/docs/installation/#scoop
binlist:
- hostctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/arm64)
            en: ~3 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
