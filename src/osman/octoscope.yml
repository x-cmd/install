lang: 'Go'
homepage: https://github.com/gfazioli/octoscope
license: 'MIT'
desc:
  cn: GitHub 终端仪表盘，一眼掌握粉丝、星标、PR 与 issue，自动刷新
  en: 'Terminal dashboard for GitHub — followers, stars, PRs and issues at a glance, auto-refreshed'
x:
  source: https://github.com/gfazioli/octoscope
  eget: https://github.com/gfazioli/octoscope
rule:
  darwin/brew:
    cmd: 'brew install terminal-notifier'
    reference: https://github.com/gfazioli/octoscope
  /go:
    cmd: 'go install'
    reference: https://github.com/gfazioli/octoscope
  /eget:
    cmd: x eget gfazioli/octoscope
    reference: https://github.com/gfazioli/octoscope
binlist:
  - 'octoscope'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
