lang: 'Go'
homepage: https://github.com/gfazioli/octoscope
license: 'MIT'
desc:
  cn: GitHub 终端仪表盘，一眼掌握粉丝、星标、PR 与 issue，自动刷新
  en: 'Terminal dashboard for GitHub — followers, stars, PRs and issues at a glance, auto-refreshed'
x:
  source: https://github.com/gfazioli/octoscope
  eget: https://github.com/gfazioli/octoscope
rule:
  darwin/brew:
    cmd: 'brew install terminal-notifier'
    reference: https://github.com/gfazioli/octoscope
  /go:
    cmd: 'go install'
    reference: https://github.com/gfazioli/octoscope
  /eget:
    cmd: x eget gfazioli/octoscope
    reference: https://github.com/gfazioli/octoscope
binlist:
- 'octoscope'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.7 MB
          rating: 1
          desc:
            cn: 约 3.7 MB（估算）
            en: ~3.7 MB estimated
        download:
          estimate: 18 MB
          desc:
            cn: 约 18 MB 下载 (linux/x64)
            en: ~18 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
