lang: C
homepage: https://github.com/cyring/CoreFreq
license: GPL-2.0
desc:
  cn: CPU 监控和调优软件，专为 64 位处理器设计。
  en: CPU monitoring and tuning software designed for 64-bit processors.
x:
  source: https://github.com/cyring/CoreFreq
rule:
  arch/yay:
    cmd: yay -S corefreq-client corefreq-server
    reference: https://aur.archlinux.org/packages/corefreq-server
  opensuse/zypper:
    cmd: sudo zypper install CoreFreq
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=CoreFreq

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
