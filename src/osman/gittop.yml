lang: 'Go'
homepage: 'https://github.com/hjr265/gittop'
license: 'BSD-3-Clause'
desc:
  cn: 受 htop/btop 启发的 Git 仓库统计可视化终端 UI
  en: 'A beautiful terminal UI for visualizing Git repository statistics, inspired by htop/btop.'
x:
  source: https://github.com/hjr265/gittop
  eget: https://github.com/hjr265/gittop
rule:
  /eget:
    cmd: x eget hjr265/gittop
    reference: https://github.com/hjr265/gittop
binlist:
- 'gittop'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
