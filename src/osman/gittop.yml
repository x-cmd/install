lang: 'Go'
homepage: 'https://github.com/hjr265/gittop'
license: 'BSD-3-Clause'
desc:
  cn: 受 htop/btop 启发的 Git 仓库统计可视化终端 UI
  en: 'A beautiful terminal UI for visualizing Git repository statistics, inspired by htop/btop.'
x:
  source: https://github.com/hjr265/gittop
  eget: https://github.com/hjr265/gittop
rule:
  /eget:
    cmd: x eget hjr265/gittop
    reference: https://github.com/hjr265/gittop
binlist:
  - 'gittop'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
