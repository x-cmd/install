lang: 'Zig'
homepage: 'https://github.com/utox39/zigfetch'
license: 'MIT'
desc:
  cn: 极简的 neofetch/fastfetch 风格系统信息工具
  en: 'Zigfetch is a minimal neofetch/fastfetch like system information tool'
  cs: Zigfetch je minimalistický nástroj pro zobrazení systémových informací ve stylu neofetch/fastfetch
  de: Zigfetch ist ein minimalistisches Systeminformationswerkzeug im Stil von neofetch/fastfetch
  es: Zigfetch es una herramienta minimalista de información del sistema al estilo de neofetch/fastfetch
  fr: Zigfetch est un outil minimaliste d'information système dans le style de neofetch/fastfetch
  id: Zigfetch adalah alat informasi sistem minimalis bergaya neofetch/fastfetch
  it: Zigfetch è un'utilità minimale di informazioni di sistema in stile neofetch/fastfetch
  ja: Zigfetch は neofetch/fastfetch 風のミニマルなシステム情報ツールです
  ko: Zigfetch는 neofetch/fastfetch 스타일의 미니멀한 시스템 정보 도구입니다
  pl: Zigfetch to minimalistyczne narzędzie do informacji o systemie w stylu neofetch/fastfetch
  pt: Zigfetch é uma ferramenta minimalista de informações do sistema no estilo neofetch/fastfetch
  ro: Zigfetch este un utilitar minim de informații despre sistem, în stilul neofetch/fastfetch
  ru: Zigfetch — минималистичный инструмент для вывода информации о системе в стиле neofetch/fastfetch
  th: Zigfetch เป็นเครื่องมือแสดงข้อมูลระบบแบบเรียบง่ายในสไตล์ neofetch/fastfetch
  tr: Zigfetch, neofetch/fastfetch tarzında minimalist bir sistem bilgisi aracıdır
  uk: Zigfetch — мінімалістичний інструмент для виведення інформації про систему у стилі neofetch/fastfetch
  vi: Zigfetch là công cụ thông tin hệ thống tối giản theo phong cách neofetch/fastfetch
x:
  source: https://github.com/utox39/zigfetch
  eget: utox39/zigfetch
rule:
  /eget:
    cmd: x eget utox39/zigfetch
    reference: https://github.com/utox39/zigfetch
binlist:
- 'zigfetch'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
