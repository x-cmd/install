lang: 'Zig'
homepage: 'https://github.com/utox39/zigfetch'
license: 'MIT'
desc:
  cn: 极简的 neofetch/fastfetch 风格系统信息工具
  en: 'Zigfetch is a minimal neofetch/fastfetch like system information tool'
x:
  source: https://github.com/utox39/zigfetch
  eget: https://github.com/utox39/zigfetch
rule:
  /eget:
    cmd: x eget utox39/zigfetch
    reference: https://github.com/utox39/zigfetch
binlist:
  - 'zigfetch'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 55 KB
          rating: 1
          desc:
            cn: 约 55 KB（估算）
            en: ~55 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
