lang: 'Zig'
homepage: 'https://github.com/utox39/zigfetch'
license: 'MIT'
desc:
  cn: 极简的 neofetch/fastfetch 风格系统信息工具
  en: 'Zigfetch is a minimal neofetch/fastfetch like system information tool'
x:
  source: https://github.com/utox39/zigfetch
  eget: https://github.com/utox39/zigfetch
rule:
  /eget:
    cmd: x eget utox39/zigfetch
    reference: https://github.com/utox39/zigfetch
binlist:
- 'zigfetch'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
