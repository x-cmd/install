lang: Rust
homepage: https://github.com/ClementTsang/bottom
license: MIT
desc:
  cn: 用于终端的可定制跨平台图形流程/系统监视器
  en: A customizable cross-platform graphical process/system monitor for the terminal
  cs: Přizpůsobitelný multiplatformní grafický monitor procesů a systému pro terminál
  de: Ein anpassbarer plattformübergreifender grafischer Prozess-/Systemmonitor für das Terminal
  es: Un monitor gráfico de procesos/sistema multiplataforma y personalizable para el terminal
  fr: Un moniteur graphique de processus/système multiplateforme et personnalisable pour le terminal
  id: Monitor proses/sistem grafis lintas platform yang dapat dikustomisasi untuk terminal
  it: Un monitor grafico di processi/sistema multipiattaforma e personalizzabile per il terminale
  ja: ターミナル向けのカスタマイズ可能なクロスプラットフォームのプロセス/システムモニター
  ko: 터미널을 위한 사용자 정의 가능한 크로스 플랫폼 그래픽 프로세스/시스템 모니터
  pl: Konfigurowalny, wieloplatformowy graficzny monitor procesów i systemu dla terminala
  pt: Um monitor gráfico de processo/sistema multiplataforma e personalizável para o terminal
  ro: Un monitor grafic de procese/sistem multiplatformă și personalizabil pentru terminal
  ru: Настраиваемый кроссплатформенный графический монитор процессов и системы для терминала
  th: มอนิเตอร์กราฟิกกระบวนการ/ระบบแบบกำหนดเองข้ามแพลตฟอร์มสำหรับเทอร์มินัล
  tr: Terminal için özelleştirilebilir, platformlar arası grafik işlem/sistem izleyicisi
  uk: Налаштовуваний кросплатформний графічний монітор процесів і системи для термінала
  vi: Trình theo dõi tiến trình/hệ thống đồ họa đa nền tảng có thể tùy chỉnh cho terminal
x:
  source: https://github.com/ClementTsang/bottom
  eget: ClementTsang/bottom
  dnf: bottom
  brew: bottom
  pacman: bottom
  snap: bottom
  scoop: bottom
  choco: bottom
  winget: Clement.bottom
  yay: bottom-git
  cargo: bottom
  asdf: bottom
rule:
  /x:
    cmd: x pkg use bottom
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ClementTsang/bottom
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use bottom
    reference: https://github.com/carbonteq/asdf-btm
  /cargo:
    cmd: cargo install bottom
    reference: https://github.com/ClementTsang/bottom?tab=readme-ov-file#cargo
    dsnap: bottom
  arch/pacman:
    cmd: sudo pacman -S bottom
    reference: https://github.com/ClementTsang/bottom?tab=readme-ov-file#arch-linux
  arch/yay:
    cmd: yay -S bottom-git
    reference: https://aur.archlinux.org/packages/bottom-git
  debian/curl:
    cmd: 'curl -LO https://github.com/ClementTsang/bottom/releases/download/0.9.6/bottom_0.9.6_amd64.deb \

      && sudo dpkg -i bottom_0.9.6_amd64.deb

      '
    reference: https://github.com/ClementTsang/bottom?tab=readme-ov-file#debian--ubuntu
  ubuntu/curl:
    cmd: 'curl -LO https://github.com/ClementTsang/bottom/releases/download/0.9.6/bottom_0.9.6_amd64.deb \

      && sudo dpkg -i bottom_0.9.6_amd64.deb

      '
    reference: https://github.com/ClementTsang/bottom?tab=readme-ov-file#debian--ubuntu
  /snap:
    cmd: sudo snap install bottom
    reference: https://github.com/ClementTsang/bottom?tab=readme-ov-file#snap
  darwin/brew:
    cmd: brew install bottom
    reference: https://formulae.brew.sh/formula/bottom#default
  (win|wsl2)/scoop:
    cmd: x scoop install bottom
    reference: https://scoop.sh/#/apps?q=bottom
  (win|wsl2)/choco:
    cmd: x choco install bottom
    reference: https://github.com/ClementTsang/bottom?tab=readme-ov-file#chocolatey
  (win|wsl2)/winget:
    cmd: x winget install Clement.bottom
    reference: https://github.com/ClementTsang/bottom?tab=readme-ov-file#winget
  /dnf:
    cmd: 'sudo dnf copr enable atim/bottom -y \

      && sudo dnf install bottom

      '
    reference: https://github.com/ClementTsang/bottom?tab=readme-ov-file#fedora--centos--almalinux--rocky-linux
binlist:
- bottom
# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 /proc, /sys 系统状态
          en: Reads /proc, /sys system state
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 安装 5.0 MB
            en: 5.0 MB install
        growth:
          desc:
            cn: 几乎不增长
            en: Minimal growth
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config:
        - "$HOME/.config/bottom/bottom.toml"
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
      peak:
        rating: 2
        desc:
          cn: 刷新时短暂占用
          en: Brief spike on refresh
  platform:
    win: full
    linux: full
    darwin: full
