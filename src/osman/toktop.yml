lang: 'Rust'
homepage: https://github.com/htin1/toktop
license: 'MIT'
desc:
  cn: 终端中的 LLM 用量监控工具
  en: 'llm usage monitor in terminal'
  cs: Monitorovací nástroj pro používání llm v terminálu
  de: llm-Nutzungsmonitor im Terminal
  es: Monitor de uso de llm en el terminal
  fr: Moniteur d'utilisation de llm dans le terminal
  id: Monitor penggunaan llm di terminal
  it: Monitor di utilizzo di llm nel terminale
  ja: ターミナル内の llm 使用量モニター
  ko: 터미널에서의 llm 사용량 모니터
  pl: Monitor zużycia llm w terminalu
  pt: Monitor de uso de llm no terminal
  ro: Monitorizator de utilizare llm în terminal
  ru: Монитор использования llm в терминале
  th: ตัวตรวจสอบการใช้งาน llm ในเทอร์มินัล
  tr: Terminalde llm kullanım monitörü
  uk: Монітор використання llm у терміналі
  vi: Trình theo dõi mức sử dụng llm trong terminal
x:
  source: https://github.com/htin1/toktop
  eget: htin1/toktop
rule:
  /eget:
    cmd: x eget htin1/toktop
    reference: https://github.com/htin1/toktop
binlist:
  - 'toktop'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 126 KB
          rating: 1
          desc:
            cn: 约 126 KB（估算）
            en: ~126 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
