lang: 'Rust'
homepage: https://github.com/htin1/toktop
license: 'MIT'
desc:
  cn: 终端中的 LLM 用量监控工具
  en: 'llm usage monitor in terminal'
x:
  source: https://github.com/htin1/toktop
  eget: https://github.com/htin1/toktop
rule:
  /eget:
    cmd: x eget htin1/toktop
    reference: https://github.com/htin1/toktop
binlist:
  - 'toktop'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 126 KB
          rating: 1
          desc:
            cn: 约 126 KB（估算）
            en: ~126 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
