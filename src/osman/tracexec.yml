lang: Rust
homepage: https://github.com/kxxt/tracexec
license: GPL-2.0
desc:
  en: A small utility for tracing execve{,at} and pre-exec behavior.
  cn: 这是一个用于跟踪 execve{,at} 及 pre-exec 行为的小型工具。
x:
  source: https://github.com/kxxt/tracexec
rule:
  arch/pacman:
    cmd: pacman -S tracexec
    reference: https://github.com/kxxt/tracexec/blob/main/INSTALL.md#install-via-package-manager
  ubuntu/cargo:
    cmd: cargo install tracexec --bin tracexec
    reference: https://github.com/kxxt/tracexec/blob/main/INSTALL.md#install-via-cargo
    dsnap: tracexec
  arch/cargo:
    cmd: cargo install tracexec --bin tracexec
    reference: https://github.com/kxxt/tracexec/blob/main/INSTALL.md#install-via-cargo
    dsnap: tracexec
  debian/cargo:
    cmd: cargo install tracexec --bin tracexec
    reference: https://github.com/kxxt/tracexec/blob/main/INSTALL.md#install-via-cargo
    dsnap: tracexec
  alpine/cargo:
    cmd: cargo install tracexec --bin tracexec
    reference: https://github.com/kxxt/tracexec/blob/main/INSTALL.md#install-via-cargo
    dsnap: tracexec
  kali/cargo:
    cmd: cargo install tracexec --bin tracexec
    reference: https://github.com/kxxt/tracexec/blob/main/INSTALL.md#install-via-cargo
    dsnap: tracexec
  fedora/cargo:
    cmd: cargo install tracexec --bin tracexec
    reference: https://github.com/kxxt/tracexec/blob/main/INSTALL.md#install-via-cargo
    dsnap: tracexec
  wsl2/cargo:
    cmd: cargo install tracexec --bin tracexec
    reference: https://github.com/kxxt/tracexec/blob/main/INSTALL.md#install-via-cargo
    dsnap: tracexec
binlist:
- tracexec

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
