lang: Go
homepage: https://github.com/darkhz/bluetuith
license: MIT
desc:
  cn: bluetuith 是一个基于 TUI 的蓝牙连接管理器，可以与蓝牙适配器和设备进行交互。
  en: bluetuith is a TUI-based bluetooth connection manager, which can interact with bluetooth adapters and devices.
x:
  source: https://github.com/darkhz/bluetuith
  eget: https://github.com/darkhz/bluetuith
rule:
  /eget:
    cmd: x eget darkhz/bluetuith
    reference: https://x-cmd.com/mod/eget
  opensuse/zypper:
    cmd: sudo zypper install bluetuith
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=bluetuith
  arch/yay:
    cmd: yay -S bluetuith
    reference: https://aur.archlinux.org/packages/bluetuith
binlist:
- bluetuith

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 452 KB
          rating: 1
          desc:
            cn: 约 452 KB（估算）
            en: ~452 KB estimated
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
