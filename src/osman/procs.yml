lang: Rust
homepage: https://github.com/dalance/procs
license: MIT
desc:
  cn: 用 Rust 编写的 ps 的现代替代
  en: A modern replacement for ps written in Rust
x:
  pkg:
    exist: true
  source: https://github.com/dalance/procs
  eget: https://github.com/dalance/procs
rule:
  /x:
    cmd: x pkg use procs
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dalance/procs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install procs
    reference: https://github.com/dalance/procs
  debian/snap:
    cmd: sudo snap install procs
    reference: https://github.com/dalance/procs
  ubuntu/snap:
    cmd: sudo snap install procs
    reference: https://github.com/dalance/procs
  alpine/apk:
    cmd: sudo apk add procs
    reference: https://github.com/dalance/procs
    dsnap: procs
  arch/pacman:
    cmd: sudo pacman -S procs
    reference: https://github.com/dalance/procs
  arch/yay:
    cmd: yay -S procs-git
    reference: https://aur.archlinux.org/packages/procs-git
  fedora/dnf:
    cmd: sudo dnf install procs
    reference: https://github.com/dalance/procs
    dsnap: procs
  opensuse/snap:
    cmd: sudo snap install procs
    reference: https://github.com/dalance/procs
  nix/nixpkgs:
    cmd: nix-env --install procs
    reference: https://github.com/dalance/procs
  darwin/port:
    cmd: sudo port selfupdate && sudo port install procs
    reference: https://github.com/dalance/procs
  (win|wsl2)/winget:
    cmd: x winget install procs
    reference: https://github.com/dalance/procs
  (win|wsl2)/scoop:
    cmd: x scoop install procs
    reference: https://github.com/dalance/procs
  (win|wsl2)/choco:
    cmd: x choco install bat
    reference: https://github.com/dalance/procs
binlist:
- procs
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取 /proc/* 进程信息（含 cmdline、environ）
          en: Reads /proc/* process info (cmdline, environ)
        sensitive:
          - "/proc/*/cmdline"
          - "/proc/*/environ"
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 ~5 MB
            en: ~5 MB install
        growth:
          desc:
            cn: 几乎不增长
            en: Minimal growth
      paths:
        data: []
        config:
          - "$HOME/.config/procs/config.toml"
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: ~20 MB
          en: ~20 MB
      peak:
        estimate: 30 MB
        desc:
          cn: ~30 MB
          en: ~30 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 列出进程时短暂占用
          en: Brief spike during process listing
