lang: Rust
homepage: https://github.com/dalance/procs
license: MIT
desc:
  cn: 用 Rust 编写的 ps 的现代替代
  en: A modern replacement for ps written in Rust
  cs: Moderní alternativa k ps napsaná v Rustu
  de: Ein moderner, in Rust geschriebener Ersatz für ps
  es: Un sustituto moderno de ps escrito en Rust
  fr: Un remplacement moderne de ps écrit en Rust
  id: Pengganti modern untuk ps yang ditulis dalam Rust
  it: Un sostituto moderno di ps scritto in Rust
  ja: Rustで書かれた ps のモダンな代替ツールです。
  ko: Rust로 작성된 ps의 현대적인 대체 도구입니다.
  pl: Nowoczesny zamiennik ps napisany w Rust
  pt: Um substituto moderno do ps escrito em Rust
  ro: O înlocuitor modern pentru ps scris în Rust
  ru: Современная замена ps, написанная на Rust
  th: ตัวแทนสมัยใหม่ของ ps ที่เขียนด้วย Rust
  tr: Rust ile yazılmış modern bir ps alternatifi
  uk: Сучасна заміна ps, написана на Rust
  vi: Một sự thay thế hiện đại cho ps được viết bằng Rust
x:
  source: https://github.com/dalance/procs
  eget: dalance/procs
  dnf: procs
  brew: procs
  pacman: procs
  apk: procs
  snap: procs
  port: procs
  scoop: procs
  choco: bat
  winget: procs
  yay: procs-git
rule:
  /x:
    cmd: x pkg use procs
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dalance/procs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install procs
    reference: https://github.com/dalance/procs
  debian/snap:
    cmd: sudo snap install procs
    reference: https://github.com/dalance/procs
  ubuntu/snap:
    cmd: sudo snap install procs
    reference: https://github.com/dalance/procs
  alpine/apk:
    cmd: sudo apk add procs
    reference: https://github.com/dalance/procs
    dsnap: procs
  arch/pacman:
    cmd: sudo pacman -S procs
    reference: https://github.com/dalance/procs
  arch/yay:
    cmd: yay -S procs-git
    reference: https://aur.archlinux.org/packages/procs-git
  fedora/dnf:
    cmd: sudo dnf install procs
    reference: https://github.com/dalance/procs
    dsnap: procs
  opensuse/snap:
    cmd: sudo snap install procs
    reference: https://github.com/dalance/procs
  nix/nixpkgs:
    cmd: nix-env --install procs
    reference: https://github.com/dalance/procs
  darwin/port:
    cmd: sudo port selfupdate && sudo port install procs
    reference: https://github.com/dalance/procs
  (win|wsl2)/winget:
    cmd: x winget install procs
    reference: https://github.com/dalance/procs
  (win|wsl2)/scoop:
    cmd: x scoop install procs
    reference: https://github.com/dalance/procs
  (win|wsl2)/choco:
    cmd: x choco install bat
    reference: https://github.com/dalance/procs
binlist:
- procs
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 /proc/* 进程信息（含 cmdline、environ）
          en: Reads /proc/* process info (cmdline, environ)
        sensitive:
        - "/proc/*/cmdline"
        - "/proc/*/environ"
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        growth:
          desc:
            cn: 几乎不增长
            en: Minimal growth
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config:
        - "$HOME/.config/procs/config.toml"
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 30 MB
        desc:
          cn: ~30 MB
          en: ~30 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 列出进程时短暂占用
          en: Brief spike during process listing
  platform:
    win: full
    linux: full
    darwin: none
