lang: 'Rust'
homepage: 'https://github.com/dutradotdev/quokka'
license: 'MIT'
desc:
  cn: 从终端检查和清理 USB 连接设备：存储、应用、媒体及实时日志查看器，无需越狱或 root
  en: 'Inspect and clean a USB-connected device from your terminal: storage, apps, media, and a live log viewer. No jailbreak, no root.'
x:
  source: https://github.com/dutradotdev/quokka
  eget: https://github.com/dutradotdev/quokka
  brew: android-platform-toolsrule:
  darwin/brew:
    cmd: 'brew install android-platform-tools'
    reference: https://github.com/dutradotdev/quokka
  /eget:
    cmd: x eget dutradotdev/quokka
    reference: https://github.com/dutradotdev/quokka
binlist:
- 'quokka'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (macos/x64)
            en: ~5 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
