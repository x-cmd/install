lang: 'Rust'
homepage: https://github.com/matheus-git/systemd-manager-tui
license: 'MIT'
desc:
  cn: 管理 systemd 服务的 TUI 应用
  en: 'A TUI application for managing systemd services.'
  cs: TUI aplikace pro správu služeb systemd.
  de: Eine TUI-Anwendung zur Verwaltung von systemd-Diensten.
  es: Una aplicación TUI para gestionar servicios de systemd.
  fr: Une application TUI pour gérer les services systemd.
  id: Aplikasi TUI untuk mengelola layanan systemd.
  it: Un'applicazione TUI per gestire i servizi systemd.
  ja: systemd サービスを管理するための TUI アプリケーション。
  ko: systemd 서비스를 관리하는 TUI 애플리케이션.
  pl: Aplikacja TUI do zarządzania usługami systemd.
  pt: Um aplicativo TUI para gerenciar serviços do systemd.
  ro: O aplicație TUI pentru gestionarea serviciilor systemd.
  ru: TUI-приложение для управления сервисами systemd.
  th: แอปพลิเคชัน TUI สำหรับจัดการบริการ systemd
  tr: systemd servislerini yönetmek için bir TUI uygulaması.
  uk: TUI-застосунок для керування сервісами systemd.
  vi: Ứng dụng TUI để quản lý các dịch vụ systemd.
x:
  source: https://github.com/matheus-git/systemd-manager-tui
  eget: matheus-git/systemd-manager-tui
rule:
  /eget:
    cmd: x eget matheus-git/systemd-manager-tui
    reference: https://github.com/matheus-git/systemd-manager-tui
binlist:
  - 'systemd-manager-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 99 KB
          rating: 1
          desc:
            cn: 约 99 KB（估算）
            en: ~99 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
