lang: 'Rust'
homepage: https://github.com/matheus-git/systemd-manager-tui
license: 'MIT'
desc:
  cn: 管理 systemd 服务的 TUI 应用
  en: 'A TUI application for managing systemd services.'
x:
  source: https://github.com/matheus-git/systemd-manager-tui
  eget: https://github.com/matheus-git/systemd-manager-tui
rule:
  /eget:
    cmd: x eget matheus-git/systemd-manager-tui
    reference: https://github.com/matheus-git/systemd-manager-tui
binlist:
  - 'systemd-manager-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 99 KB
          rating: 1
          desc:
            cn: 约 99 KB（估算）
            en: ~99 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
