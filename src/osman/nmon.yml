lang: C
homepage: http://nmon.sourceforge.net/
desc:
  cn: nmon 是 Nigel's Performance Monitor 的缩写，用于 Linux 上的 POWER、x86、x86_64、Mainframe 以及现在的 ARM（如 Raspberry Pi）。
  en: nmon is short for Nigel's performance Monitor for Linux on POWER, x86, x86_64, Mainframe & now ARM (Raspberry Pi)
rule:
  debian/apt:
    cmd: sudo apt-get install nmon
    reference: https://command-not-found.com/nmon
    dsnap: nmon
  ubuntu/apt:
    cmd: sudo apt-get install nmon
    reference: https://command-not-found.com/nmon
    dsnap: nmon
  arch/pacman:
    cmd: sudo pacman -S nmon
    reference: https://command-not-found.com/nmon
  kali/apt:
    cmd: sudo apt-get install nmon
    reference: https://command-not-found.com/nmon
    dsnap: nmon
  fedora/dnf:
    cmd: sudo dnf install nmon
    reference: https://command-not-found.com/nmon
    dsnap: nmon
  raspbian/apt:
    cmd: sudo apt-get install nmon
    reference: https://command-not-found.com/nmon
  opensuse/zypper:
    cmd: sudo zypper install nmon
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=nmon
binlist:
- nmon
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
