lang: 'Shell'
homepage: 'https://github.com/filiparag/wikiman'
license: 'MIT'
desc:
  cn: 通用的离线文档搜索引擎，支持 man 手册、tldr-pages、ArchWiki、Gentoo Wiki、DevDocs 和 FreeBSD 文档
  en: 'Wikiman is a universal offline documentation search engine for manual pages, tldr-pages, ArchWiki, Gentoo Wiki, DevDocs, and FreeBSD documentation'
x:
  source: https://github.com/filiparag/wikiman
  eget: https://github.com/filiparag/wikiman
rule:
  /eget:
    cmd: x eget filiparag/wikiman
    reference: https://github.com/filiparag/wikiman
binlist:
- 'wikiman'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/arm64)
            en: ~5 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
