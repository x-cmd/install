lang: Rust
homepage: https://github.com/vladkens/macmon
license: MIT
desc:
  en: Sudoless performance monitoring CLI tool for Apple Silicon processors
  cn: 适用于苹果硅处理器的无声音性能监测命令行工具
  cs: Nástroj příkazového řádku pro sledování výkonu procesorů Apple Silicon bez zvuku
  de: Soundloses Kommandozeilen-Tool zur Leistungsüberwachung für Apple-Silicon-Prozessoren
  es: Herramienta de línea de comandos de monitorización de rendimiento sin sonido para procesadores Apple Silicon
  fr: Outil en ligne de commande de surveillance des performances, sans son, pour les processeurs Apple Silicon
  id: Alat baris perintah pemantauan kinerja tanpa suara untukEra prosesor Apple Silicon
  it: Strumento da riga di comando per il monitoraggio delle prestazioni, senza audio, per processori Apple Silicon
  ja: Apple Silicon プロセッサー向けのサウンドなしパフォーマンス監視 CLI ツール
  ko: Apple Silicon 프로세서를 위한 무음 성능 모니터링 CLI 도구
  pl: Narzędzie wiersza poleceń do monitorowania wydajności bez dźwięku dla procesorów Apple Silicon
  pt: Ferramento de linha de comando de monitoramento de desempenho sem som para processadores Apple Silicon
  ro: Instrument de linie de comandă pentru monitorizarea performanței, fără sunet, pentru procesoare Apple Silicon
  ru: Инструмент командной строки для мониторинга производительности процессоров Apple Silicon без звука
  th: เครื่องมือบรรทัดคำสั่งติดตามประสิทธิภาพแบบไม่มีเสียงสำหรับโปรเซสเซอร์ Apple Silicon
  tr: Apple Silicon işlemciler için sessiz performans izleme komut satırı aracı
  uk: Інструмент командного рядка для моніторингу продуктивності процесорів Apple Silicon без звуку
  vi: Công cụ dòng lệnh theo dõi hiệu năng không phát âm thanh cho bộ xử lý Apple Silicon
x:
  source: https://github.com/vladkens/macmon
  eget: vladkens/macmon
  brew: macmon
  port: macmon
rule:
  /eget:
    cmd: x eget vladkens/macmon
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install macmon
    reference: https://github.com/vladkens/macmon?tab=readme-ov-file#-install-via-homebrew
  darwin/port:
    cmd: sudo port install macmon
    reference: https://github.com/vladkens/macmon?tab=readme-ov-file#%EF%B8%8F-install-via-macports
binlist:
- macmon

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 146 KB
          rating: 1
          desc:
            cn: 约 146 KB（估算）
            en: ~146 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
