lang: 'Go'
homepage: 'https://github.com/hzqtc/taproom'
license: 'MIT'
desc:
  cn: Homebrew 的交互式 TUI
  en: 'An interactive TUI for Homebrew'
x:
  source: https://github.com/hzqtc/taproom
  eget: https://github.com/hzqtc/taproom
rule:
  /eget:
    cmd: x eget hzqtc/taproom
    reference: https://github.com/hzqtc/taproom
binlist:
  - 'taproom'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
