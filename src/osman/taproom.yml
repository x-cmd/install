lang: 'Go'
homepage: 'https://github.com/hzqtc/taproom'
license: 'MIT'
desc:
  cn: Homebrew 的交互式 TUI
  en: 'An interactive TUI for Homebrew'
x:
  source: https://github.com/hzqtc/taproom
  eget: https://github.com/hzqtc/taproom
rule:
  /eget:
    cmd: x eget hzqtc/taproom
    reference: https://github.com/hzqtc/taproom
binlist:
- 'taproom'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (macos/x64)
            en: ~6 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
