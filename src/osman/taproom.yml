lang: 'Go'
homepage: 'https://github.com/hzqtc/taproom'
license: 'MIT'
desc:
  cn: Homebrew 的交互式 TUI
  en: 'An interactive TUI for Homebrew'
  cs: Interaktivní TUI pro Homebrew
  de: Ein interaktives TUI für Homebrew
  es: Una TUI interactiva para Homebrew
  fr: Un TUI interactif pour Homebrew
  id: TUI interaktif untuk Homebrew
  it: Una TUI interattiva per Homebrew
  ja: Homebrew 用の対話型 TUI
  ko: Homebrew를 위한 대화형 TUI
  pl: Interaktywny TUI dla Homebrew
  pt: Uma TUI interativa para o Homebrew
  ro: Un TUI interactiv pentru Homebrew
  ru: Интерактивный TUI для Homebrew
  th: TUI แบบโต้ตอบสำหรับ Homebrew
  tr: Homebrew için etkileşimli bir TUI
  uk: Інтерактивний TUI для Homebrew
  vi: TUI tương tác cho Homebrew
x:
  source: https://github.com/hzqtc/taproom
  eget: hzqtc/taproom
rule:
  /eget:
    cmd: x eget hzqtc/taproom
    reference: https://github.com/hzqtc/taproom
binlist:
- 'taproom'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (macos/x64)
            en: ~6 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: full
