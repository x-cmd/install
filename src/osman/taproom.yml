lang: 'Go'
homepage: 'https://github.com/hzqtc/taproom'
license: 'MIT'
desc:
  cn: Homebrew 的交互式 TUI
  en: 'An interactive TUI for Homebrew'
x:
  source: https://github.com/hzqtc/taproom
  eget: https://github.com/hzqtc/taproom
rule:
  /eget:
    cmd: x eget hzqtc/taproom
    reference: https://github.com/hzqtc/taproom
binlist:
  - 'taproom'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 231 KB
          rating: 1
          desc:
            cn: 约 231 KB（估算）
            en: ~231 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
