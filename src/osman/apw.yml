lang: 'TypeScript'
homepage: 'https://github.com/bendews/apw'
license: 'GPL-3.0'
desc:
  cn: Apple Passwords (iCloud Keychain) 的 CLI 工具
  en: 'A CLI for Apple Passwords (also known as iCloud Keychain)'
x:
  source: https://github.com/bendews/apw
  eget: https://github.com/bendews/apw
rule:
  /eget:
    cmd: x eget bendews/apw
    reference: https://github.com/bendews/apw
binlist:
- 'apw'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 78 MB
          rating: 3
          desc:
            cn: 安装 78 MB
            en: 78 MB install
        download:
          estimate: 78 MB
          desc:
            cn: 约 78 MB 下载 (macos/x64)
            en: ~78 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
