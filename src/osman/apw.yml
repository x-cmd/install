lang: 'TypeScript'
homepage: 'https://github.com/bendews/apw'
license: 'GPL-3.0'
desc:
  cn: Apple Passwords (iCloud Keychain) 的 CLI 工具
  en: 'A CLI for Apple Passwords (also known as iCloud Keychain)'
x:
  source: https://github.com/bendews/apw
  eget: https://github.com/bendews/apw
rule:
  /eget:
    cmd: x eget bendews/apw
    reference: https://github.com/bendews/apw
binlist:
  - 'apw'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
