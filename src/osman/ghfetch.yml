lang: 'Go'
homepage: 'https://github.com/orangekame3/ghfetch'
license: 'MIT'
desc:
  cn: ghfetch 是抓取 GitHub 用户信息并以 neofetch 风格展示的 CLI 工具
  en: ':octocat: ghfetch is a CLI tool to fetch GitHub user information and show like neofetch.'
x:
  source: https://github.com/orangekame3/ghfetch
  eget: https://github.com/orangekame3/ghfetch
rule:
  /eget:
    cmd: x eget orangekame3/ghfetch
    reference: https://github.com/orangekame3/ghfetch
binlist:
- 'ghfetch'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
