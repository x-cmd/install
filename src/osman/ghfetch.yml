lang: 'Go'
homepage: 'https://github.com/orangekame3/ghfetch'
license: 'MIT'
desc:
  cn: ghfetch 是抓取 GitHub 用户信息并以 neofetch 风格展示的 CLI 工具
  en: ':octocat: ghfetch is a CLI tool to fetch GitHub user information and show like neofetch.'
x:
  source: https://github.com/orangekame3/ghfetch
  eget: https://github.com/orangekame3/ghfetch
rule:
  /eget:
    cmd: x eget orangekame3/ghfetch
    reference: https://github.com/orangekame3/ghfetch
binlist:
  - 'ghfetch'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
