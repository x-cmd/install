lang: 'Rust'
homepage: https://github.com/ulissesf/qmassa
license: 'Apache-2.0'
desc:
  cn: Linux GPU 状态监控的 Rust 工具
  en: 'Rust tools to monitor GPU stats on Linux'
x:
  source: https://github.com/ulissesf/qmassa
  eget: https://github.com/ulissesf/qmassa
rule:
  /eget:
    cmd: x eget ulissesf/qmassa
    reference: https://github.com/ulissesf/qmassa
binlist:
  - 'qmassa'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
