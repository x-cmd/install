lang: Python
homepage: https://github.com/bmwant/hapless
desc:
  cn: 运行并管理后台进程
  en: Run and manage background processes
x:
  source: https://github.com/bmwant/hapless
  eget: bmwant/hapless
rule:
  /eget:
    cmd: x eget bmwant/hapless
    reference: https://github.com/bmwant/hapless
binlist:
- hapless
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
