lang: Python
homepage: https://github.com/bmwant/hapless
desc:
  cn: 运行并管理后台进程
  en: Run and manage background processes
x:
  source: https://github.com/bmwant/hapless
  eget: https://github.com/bmwant/hapless
rule:
  /eget:
    cmd: x eget bmwant/hapless
    reference: https://github.com/bmwant/hapless
binlist:
- hapless
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
