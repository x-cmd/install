lang: 'Rust'
homepage: 'https://github.com/Rodrigodd/strace-tui'
license: 'Apache-2.0'
desc:
  cn: 用于可视化和浏览 strace 输出的 TUI
  en: 'A terminal user interface (TUI) for visualizing and exploring strace output'
x:
  source: https://github.com/Rodrigodd/strace-tui
  eget: https://github.com/Rodrigodd/strace-tui
rule:
  /eget:
    cmd: x eget Rodrigodd/strace-tui
    reference: https://github.com/Rodrigodd/strace-tui
binlist:
  - 'strace-tui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
