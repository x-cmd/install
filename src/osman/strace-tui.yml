lang: 'Rust'
homepage: 'https://github.com/Rodrigodd/strace-tui'
license: 'Apache-2.0'
desc:
  cn: 用于可视化和浏览 strace 输出的 TUI
  en: 'A terminal user interface (TUI) for visualizing and exploring strace output'
x:
  source: https://github.com/Rodrigodd/strace-tui
  eget: https://github.com/Rodrigodd/strace-tui
rule:
  /eget:
    cmd: x eget Rodrigodd/strace-tui
    reference: https://github.com/Rodrigodd/strace-tui
binlist:
- 'strace-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1020 KB
          rating: 1
          desc:
            cn: 安装 1020 KB
            en: 1020 KB install
        download:
          estimate: 1020 KB
          desc:
            cn: 约 1020 KB 下载 (linux/x64)
            en: ~1020 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
