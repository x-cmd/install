lang: 'Rust'
homepage: 'https://github.com/luis-ota/swaptop'
license: 'MIT'
desc:
  cn: Rust 编写的 swap 使用监控工具
  en: 'swap usage monitor written in rust'
x:
  source: https://github.com/luis-ota/swaptop
  eget: https://github.com/luis-ota/swaptop
rule:
  /eget:
    cmd: x eget luis-ota/swaptop
    reference: https://github.com/luis-ota/swaptop
binlist:
  - 'swaptop'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
