lang: 'Rust'
homepage: 'https://github.com/luis-ota/swaptop'
license: 'MIT'
desc:
  cn: Rust 编写的 swap 使用监控工具
  en: 'swap usage monitor written in rust'
x:
  source: https://github.com/luis-ota/swaptop
  eget: https://github.com/luis-ota/swaptop
rule:
  /eget:
    cmd: x eget luis-ota/swaptop
    reference: https://github.com/luis-ota/swaptop
binlist:
- 'swaptop'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 35 KB
          rating: 1
          desc:
            cn: 约 35 KB（估算）
            en: ~35 KB estimated
        download:
          estimate: 828 KB
          desc:
            cn: 约 828 KB 下载 (linux/x64)
            en: ~828 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
