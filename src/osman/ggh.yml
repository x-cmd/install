lang: 'Go'
homepage: 'https://github.com/byawitz/ggh'
license: 'Apache-2.0'
desc:
  cn: 回顾你的 SSH 会话（也可搜索 SSH 配置文件）
  en: 'Recall your SSH sessions (also search your SSH config file)'
x:
  source: https://github.com/byawitz/ggh
  eget: https://github.com/byawitz/ggh
rule:
  /eget:
    cmd: x eget byawitz/ggh
    reference: https://github.com/byawitz/ggh
binlist:
- 'ggh'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
