lang: 'Go'
homepage: 'https://github.com/byawitz/ggh'
license: 'Apache-2.0'
desc:
  cn: 回顾你的 SSH 会话（也可搜索 SSH 配置文件）
  en: 'Recall your SSH sessions (also search your SSH config file)'
x:
  source: https://github.com/byawitz/ggh
  eget: https://github.com/byawitz/ggh
rule:
  /eget:
    cmd: x eget byawitz/ggh
    reference: https://github.com/byawitz/ggh
binlist:
  - 'ggh'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
