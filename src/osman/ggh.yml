lang: 'Go'
homepage: 'https://github.com/byawitz/ggh'
license: 'Apache-2.0'
desc:
  cn: 回顾你的 SSH 会话（也可搜索 SSH 配置文件）
  en: 'Recall your SSH sessions (also search your SSH config file)'
x:
  source: https://github.com/byawitz/ggh
  eget: https://github.com/byawitz/ggh
rule:
  /eget:
    cmd: x eget byawitz/ggh
    reference: https://github.com/byawitz/ggh
binlist:
  - 'ggh'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 74 KB
          rating: 1
          desc:
            cn: 约 74 KB（估算）
            en: ~74 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
