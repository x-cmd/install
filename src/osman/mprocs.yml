lang: Rust
homepage: https://github.com/pvolok/mprocs
license: MIT
desc:
  cn: Mprocs 并行运行多个命令，并分别显示每个命令的输出
  en: Mprocs runs multiple commands in parallel and shows output of each command separately
  cs: Mprocs spouští více příkazů paralelně a ukazuje výstup každého příkazu zvlášť
  de: Mprocs führt mehrere Befehle parallel aus und zeigt die Ausgabe jedes Befehls getrennt an
  es: Mprocs ejecuta varios comandos en paralelo y muestra la salida de cada comando por separado
  fr: Mprocs exécute plusieurs commandes en parallèle et affiche la sortie de chaque commande séparément
  id: Mprocs menjalankan beberapa perintah secara paralel dan menampilkan keluaran setiap perintah secara terpisah
  it: Mprocs esegue più comandi in parallelo e mostra l'output di ciascun comando separatamente
  ja: Mprocs は複数のコマンドを並行して実行し、各コマンドの出力を個別に表示します
  ko: Mprocs는 여러 명령을 병렬로 실행하고 각 명령의 출력을 각각 표시합니다
  pl: Mprocs uruchamia wiele poleceń równolegle i pokazuje wyjście każdego z osobna
  pt: Mprocs executa vários comandos em paralelo e mostra a saída de cada comando separadamente
  ro: Mprocs rulează mai multe comenzi în paralel și afișează separat ieșirea fiecărei comenzi
  ru: Mprocs запускает несколько команд параллельно и показывает вывод каждой команды отдельно
  th: Mprocs รันหลายคำสั่งพร้อมกันและแสดงผลลัพธ์ของแต่ละคำสั่งแยกกัน
  tr: Mprocs birden fazla komutu paralel olarak çalıştırır ve her komutun çıktısını ayrı ayrı gösterir
  uk: Mprocs запускає кілька команд паралельно і показує вивід кожної команди окремо
  vi: Mprocs chạy nhiều lệnh song song và hiển thị đầu ra của từng lệnh riêng biệt
x:
  source: https://github.com/pvolok/mprocs
  eget: pvolok/mprocs
  brew: mprocs
  scoop: mprocs
  yay: mprocs
  npm: mprocs
  cargo: mprocs
rule:
  /eget:
    cmd: x eget pvolok/mprocs
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install mprocs
    reference: https://github.com/pvolok/mprocs?tab=readme-ov-file#cargo-all-platforms
    dsnap: mprocs
  darwin/brew:
    cmd: brew install mprocs
    reference: https://github.com/pvolok/mprocs?tab=readme-ov-file#homebrew-macos-linux
  (win|wsl2)/scoop:
    cmd: x scoop install mprocs
    reference: https://github.com/pvolok/mprocs?tab=readme-ov-file#scoop-windows
  /npm:
    cmd: npm install -g mprocs
    reference: https://github.com/pvolok/mprocs?tab=readme-ov-file#npm-linux-macos-windows
    dsnap: mprocs
  /yarn:
    cmd: yarn global add mprocs
    reference: https://github.com/pvolok/mprocs?tab=readme-ov-file#npm-linux-macos-windows
  arch/yay:
    cmd: yay -S mprocs
    reference: https://aur.archlinux.org/packages/mprocs
binlist:
- mprocs

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
