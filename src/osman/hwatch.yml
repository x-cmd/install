lang: Rust
homepage: https://github.com/blacknon/hwatch
license: MIT
desc:
  cn: watch 命令的替代品，可以记录命令执行的结果，并可以显示它的历史记录和差异
  en: A modern alternative to the watch command, records the differences in execution results and can check this differences at after.
x:
  source: https://github.com/blacknon/hwatch
  eget: https://github.com/blacknon/hwatch
rule:
  /eget:
    cmd: x eget blacknon/hwatch
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use hwatch
    reference: https://github.com/chessmango/asdf-hwatch
  darwin/brew:
    cmd: brew install hwatch
    reference: https://github.com/blacknon/hwatch?tab=readme-ov-file#macos-brew
  darwin/port:
    cmd: sudo port install hwatch
    reference: https://github.com/blacknon/hwatch?tab=readme-ov-file#macos-macports
  arch/yay:
    cmd: yay -S hwatch
    reference: https://aur.archlinux.org/packages/hwatch
  arch/paru:
    cmd: sudo paru -S hwatch
    reference: https://github.com/blacknon/hwatch?tab=readme-ov-file#arch-linux-aur
  /cargo:
    cmd: cargo install hwatch
    reference: https://github.com/blacknon/hwatch?tab=readme-ov-file#cargo-install
    dsnap: hwatch
binlist:
- hwatch

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
