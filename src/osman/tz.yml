lang: Go
homepage: https://github.com/oz/tz
license: GPL-3.0
desc:
  cn: 时区助手
  en: A time zone helper
x:
  pkg:
    exist: true
  source: https://github.com/oz/tz
  eget: https://github.com/oz/tz
rule:
  /x:
    cmd: x pkg use tz
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget oz/tz
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S tz
    reference: https://aur.archlinux.org/packages/tz
  darwin/brew:
    cmd: brew install tz
    reference: https://github.com/oz/tz?tab=readme-ov-file#brew
  /go:
    cmd: go install github.com/oz/tz@latest
    reference: https://github.com/oz/tz?tab=readme-ov-file#go
    dsnap: github.com/oz/tz
binlist:
- tz

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 160 KB
          rating: 1
          desc:
            cn: 约 160 KB（估算）
            en: ~160 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
