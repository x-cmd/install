lang: Go
homepage: https://github.com/oz/tz
license: GPL-3.0
desc:
  cn: 时区助手
  en: A time zone helper
x:
  pkg:
    exist: true
  source: https://github.com/oz/tz
  eget: https://github.com/oz/tz
rule:
  /x:
    cmd: x pkg use tz
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget oz/tz
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S tz
    reference: https://aur.archlinux.org/packages/tz
  darwin/brew:
    cmd: brew install tz
    reference: https://github.com/oz/tz?tab=readme-ov-file#brew
  /go:
    cmd: go install github.com/oz/tz@latest
    reference: https://github.com/oz/tz?tab=readme-ov-file#go
    dsnap: github.com/oz/tz
binlist:
- tz

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
