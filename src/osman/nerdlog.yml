lang: 'Go'
homepage: https://github.com/dimonomid/nerdlog
license: 'BSD-2-Clause'
desc:
  cn: 远程优先的多主机 TUI 日志查看器，带时间线直方图，无需中心服务器
  en: 'Nerdlog: fast, remote-first, multi-host TUI log viewer with timeline histogram and no central server'
x:
  source: https://github.com/dimonomid/nerdlog
  eget: https://github.com/dimonomid/nerdlog
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/dimonomid/nerdlog
  /eget:
    cmd: x eget dimonomid/nerdlog
    reference: https://github.com/dimonomid/nerdlog
binlist:
  - 'nerdlog'
