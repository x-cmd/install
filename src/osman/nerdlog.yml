lang: 'Go'
homepage: https://github.com/dimonomid/nerdlog
license: 'BSD-2-Clause'
desc:
  cn: 远程优先的多主机 TUI 日志查看器，带时间线直方图，无需中心服务器
  en: 'Nerdlog: fast, remote-first, multi-host TUI log viewer with timeline histogram and no central server'
x:
  source: https://github.com/dimonomid/nerdlog
  eget: https://github.com/dimonomid/nerdlog
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/dimonomid/nerdlog
  /eget:
    cmd: x eget dimonomid/nerdlog
    reference: https://github.com/dimonomid/nerdlog
binlist:
- 'nerdlog'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
