lang: 'Go'
homepage: 'https://github.com/vyrx-dev/toofan'
license: 'MIT'
desc:
  cn: 终端下极简、极速的打字 TUI
  en: 'A minimal, lightning-fast typing TUI for your terminal'
x:
  source: https://github.com/vyrx-dev/toofan
  eget: https://github.com/vyrx-dev/toofan
rule:
  /eget:
    cmd: x eget vyrx-dev/toofan
    reference: https://github.com/vyrx-dev/toofan
binlist:
- 'toofan'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
