lang: 'Go'
homepage: 'https://github.com/vyrx-dev/toofan'
license: 'MIT'
desc:
  cn: 终端下极简、极速的打字 TUI
  en: 'A minimal, lightning-fast typing TUI for your terminal'
  cs: Minimální a bleskurychlé TUI pro psaní na klávesnici v terminálu
  de: Ein minimales, blitzschnelles TUI zum Tippen im Terminal
  es: Un TUI mínimo y muy rápido para escribir en el terminal
  fr: Un TUI minimal et ultra-rapide pour la saisie au clavier dans le terminal
  id: TUI minimalistis dan sangat cepat untuk mengetik di terminal
  it: Una TUI minimale e velocissima per la digitazione nel terminale
  ja: ターミナル用のミニマルで超高速なタイピング TUI
  ko: 터미널을 위한 간결하고 매우 빠른 타이핑 TUI
  pl: Minimalne i błyskawiczne TUI do pisania na klawiaturze w terminalu
  pt: Uma TUI minimalista e extremamente rápida para digitar no terminal
  ro: Un TUI minimalist și ultrarapid pentru tastare în terminal
  ru: Минималистичный и сверхбыстрый TUI для набора текста в терминале
  th: TUI แบบเรียบง่ายและเร็วดั่งสายฟ้าสำหรับพิมพ์ในเทอร์มินัล
  tr: Terminal için minimal ve yıldırım hızında yazma TUI'si
  uk: Мінімалістичний та надшвидкий TUI для набору тексту в терміналі
  vi: TUI tối giản và cực nhanh để gõ phím trong terminal
x:
  source: https://github.com/vyrx-dev/toofan
  eget: vyrx-dev/toofan
rule:
  /eget:
    cmd: x eget vyrx-dev/toofan
    reference: https://github.com/vyrx-dev/toofan
binlist:
- 'toofan'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
