lang: Rust
homepage: https://github.com/Netflix/bpftop
license: Apache-2.0
desc:
  cn: bpftop 提供运行 eBPF 程序的动态实时视图
  en: bpftop provides a dynamic real-time view of running eBPF programs
x:
  source: https://github.com/Netflix/bpftop
rule:
  /curl:
    cmd: curl -fLJ https://github.com/Netflix/bpftop/releases/latest/download/bpftop -o bpftop && chmod +x bpftop
    reference: https://github.com/Netflix/bpftop?tab=readme-ov-file#installation
binlist:
- bpftop

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
