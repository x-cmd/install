lang: Go
homepage: https://github.com/noborus/psutilsql
license: MIT
desc:
  cn: 使用 gopsutil 库检索信息并使用 SQL 对其进行处理
  en: Use the gopsutil library to retrieve information and process it with SQL
  cs: Použijte knihovnu gopsutil k načtení informací a zpracujte je pomocí SQL
  de: Verwenden Sie die gopsutil-Bibliothek, um Informationen abzurufen und mit SQL zu verarbeiten
  es: Use la biblioteca gopsutil para obtener información y procesarla con SQL
  fr: Utilisez la bibliothèque gopsutil pour récupérer des informations et les traiter avec SQL
  id: Gunakan pustaka gopsutil untuk mengambil informasi dan memprosesnya dengan SQL
  it: Usa la libreria gopsutil per recuperare informazioni e elaborarle con SQL
  ja: gopsutil ライブラリを使って情報を取得し、SQL で処理します。
  ko: gopsutil 라이브러리를 사용하여 정보를 가져오고 SQL로 처리합니다.
  pl: Użyj biblioteki gopsutil do pobierania informacji i przetwarzania ich za pomocą SQL
  pt: Use a biblioteca gopsutil para recuperar informações e processá-las com SQL
  ro: Folosiți biblioteca gopsutil pentru a prelua informații și a le procesa cu SQL
  ru: Используйте библиотеку gopsutil для получения информации и её обработки средствами SQL
  th: ใช้ไลบรารี gopsutil เพื่อดึงข้อมูลและประมวลผลด้วย SQL
  tr: Bilgi almak ve SQL ile işlemek için gopsutil kütüphanesini kullanın
  uk: Використовуйте бібліотеку gopsutil для отримання інформації та її обробки засобами SQL
  vi: Dùng thư viện gopsutil để truy xuất thông tin và xử lý bằng SQL
x:
  source: https://github.com/noborus/psutilsql
  eget: noborus/psutilsql
  yay: psutilsql-bin
rule:
  /x:
    cmd: x pkg use psutilsql
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget noborus/psutilsql
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go get -u github.com/noborus/psutilsql...
    reference: https://github.com/noborus/psutilsql?tab=readme-ov-file#install
    dsnap: github.com/noborus/psutilsql
  arch/yay:
    cmd: yay -S psutilsql-bin
    reference: https://aur.archlinux.org/packages/psutilsql-bin
binlist:
- psutilsql

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
