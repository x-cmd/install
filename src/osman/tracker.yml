lang: 'Rust'
homepage: 'https://github.com/ShenMian/tracker'
license: 'Apache-2.0'
desc:
  cn: 基于终端的实时卫星追踪和轨道预测应用
  en: 'A terminal-based real-time satellite tracking and orbit prediction application.'
x:
  source: https://github.com/ShenMian/tracker
  eget: ShenMian/tracker
rule:
  /eget:
    cmd: x eget ShenMian/tracker
    reference: https://github.com/ShenMian/tracker
binlist:
  - 'tracker'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 93 KB
          rating: 1
          desc:
            cn: 约 93 KB（估算）
            en: ~93 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
