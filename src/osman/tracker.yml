lang: 'Rust'
homepage: 'https://github.com/ShenMian/tracker'
license: 'Apache-2.0'
desc:
  cn: 基于终端的实时卫星追踪和轨道预测应用
  en: 'A terminal-based real-time satellite tracking and orbit prediction application.'
x:
  source: https://github.com/ShenMian/tracker
  eget: https://github.com/ShenMian/tracker
rule:
  /eget:
    cmd: x eget ShenMian/tracker
    reference: https://github.com/ShenMian/tracker
binlist:
  - 'tracker'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
