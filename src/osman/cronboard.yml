lang: 'Python'
homepage: https://github.com/antoniorodr/cronboard
license: 'Apache-2.0'
desc:
  cn: 本地与服务器上管理 cron 任务的终端仪表盘
  en: 'A terminal-based dashboard for managing cron jobs locally and on servers.'
x:
  source: https://github.com/antoniorodr/cronboard
  eget: https://github.com/antoniorodr/cronboard
rule:
  /eget:
    cmd: x eget antoniorodr/cronboard
    reference: https://github.com/antoniorodr/cronboard
binlist:
- 'cronboard'
# complicated
footprint:
  behavior:
    runtime:
      type: [cli, tui]
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 /etc/crontab, /var/spool/cron
          en: Reads /etc/crontab, /var/spool/cron
        sensitive: []
      write:
        desc:
          cn: 无文件系统读写
          en: No filesystem reads or writes
  resource:
    disk:
      size:
        install:
          estimate: 45 KB
          rating: 1
          desc:
            cn: 安装 45 KB
            en: 45 KB install
        download:
          estimate: 45 KB
          desc:
            cn: 约 45 KB 下载 (whl)
            en: ~45 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 60 MB
        desc:
          cn: ~60 MB
          en: ~60 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 扫描 cron 时短暂占用
          en: Brief spike on cron scan
  platform:
    win: full
    linux: full
    darwin: full
