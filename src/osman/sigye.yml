lang: 'Rust'
homepage: 'https://github.com/am2rican5/sigye'
license: 'MIT'
desc:
  cn: ASCII 艺术字体的终端时钟
  en: 'A beautiful terminal clock with ASCII art fonts'
x:
  source: https://github.com/am2rican5/sigye
  eget: https://github.com/am2rican5/sigye
rule:
  /eget:
    cmd: x eget am2rican5/sigye
    reference: https://github.com/am2rican5/sigye
binlist:
  - 'sigye'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
