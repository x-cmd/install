lang: 'Rust'
homepage: 'https://github.com/am2rican5/sigye'
license: 'MIT'
desc:
  cn: ASCII 艺术字体的终端时钟
  en: 'A beautiful terminal clock with ASCII art fonts'
  cs: Krásné terminálové hodiny s písmem ASCII art
  de: Eine schöne Terminaluhr mit ASCII-Art-Schriften
  es: Un precioso reloj de terminal con fuentes de arte ASCII
  fr: Une belle horloge de terminal avec des polices en art ASCII
  id: Jam terminal yang indah dengan font seni ASCII
  it: Un bellissimo orologio da terminale con caratteri ASCII art
  ja: ASCII アートフォントを使った美しいターミナル時計
  ko: ASCII 아트 글꼴을 사용한 아름다운 터미널 시계
  pl: Piękny zegar terminala z czcionkami w stylu ASCII art
  pt: Um belo relógio de terminal com fontes em arte ASCII
  ro: Un ceas terminal frumos cu fonturi în artă ASCII
  ru: Красивые терминальные часы со шрифтами в стиле ASCII art
  th: นาฬิกาเทอร์มินัลสวยงามที่ใช้ฟอนต์ ASCII art
  tr: ASCII sanatı yazı tipleriyle güzel bir terminal saati
  uk: Гарні термінальні годинники зі шрифтами в стилі ASCII art
  vi: Đồng hồ terminal xinh đẹp với phông chữ nghệ thuật ASCII
x:
  source: https://github.com/am2rican5/sigye
  eget: am2rican5/sigye
rule:
  /eget:
    cmd: x eget am2rican5/sigye
    reference: https://github.com/am2rican5/sigye
binlist:
- 'sigye'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
