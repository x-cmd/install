lang: 'C'
homepage: 'https://github.com/wentbackward/nv-monitor'
license: 'MIT'
desc:
  cn: 轻量 nVidia 遥测与终端系统监控，适配 Jetson/GB10/GB200/H100 等架构
  en: 'Lightweight nVidia telemetry and terminal system monitor - built for any architecture - Jetson, GB10, GB200, H100'
x:
  source: https://github.com/wentbackward/nv-monitor
  eget: wentbackward/nv-monitor
rule:
  /eget:
    cmd: x eget wentbackward/nv-monitor
    reference: https://github.com/wentbackward/nv-monitor
binlist:
- 'nv-monitor'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 142 KB
          rating: 1
          desc:
            cn: 约 142 KB（估算）
            en: ~142 KB estimated
        download:
          estimate: 21 KB
          desc:
            cn: 约 21 KB 下载 (linux/x64)
            en: ~21 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
