lang: 'C'
homepage: 'https://github.com/wentbackward/nv-monitor'
license: 'MIT'
desc:
  cn: 轻量 nVidia 遥测与终端系统监控，适配 Jetson/GB10/GB200/H100 等架构
  en: 'Lightweight nVidia telemetry and terminal system monitor - built for any architecture - Jetson, GB10, GB200, H100'
x:
  source: https://github.com/wentbackward/nv-monitor
  eget: https://github.com/wentbackward/nv-monitor
rule:
  /eget:
    cmd: x eget wentbackward/nv-monitor
    reference: https://github.com/wentbackward/nv-monitor
binlist:
  - 'nv-monitor'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
