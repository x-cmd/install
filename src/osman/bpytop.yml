lang: Python
desc:
  cn: Linux/OSX/FreeBSD 资源监视器
  en: Linux/OSX/FreeBSD resource monitor
homepage: https://github.com/aristocratos/bpytop
license: Apache-2.0
x:
  pkg:
    exist: true
  source: https://github.com/aristocratos/bpytop
rule:
  /x:
    cmd: x pkg use bpytop
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: x pip3 install bpytop --upgrade
    reference: https://github.com/aristocratos/bpytop#installation
  darwin/brew:
    cmd: 'brew install bpytop

      '
    reference: https://github.com/aristocratos/bpytop#installation
  darwin/port:
    cmd: port install bpytop
    reference: https://github.com/aristocratos/bpytop#installation
  arch/pacman:
    cmd: sudo pacman -S bpytop
    reference: https://github.com/aristocratos/bpytop#installation
  arch/yay:
    cmd: yay -S bpytop-git
    reference: https://aur.archlinux.org/packages/bpytop-git
  debian/apt:
    cmd: sudo apt install bpytop
    reference: https://github.com/aristocratos/bpytop#installation
    dsnap: bpytop
  freebsd/pkg:
    cmd: sudo pkg install bpytop
    reference: https://github.com/aristocratos/bpytop#installation
  /dns:
    cmd: sudo dnf install bpytop
    reference: https://github.com/aristocratos/bpytop#installation
  gentoo/emerge:
    cmd: sudo emerge -av sys-process/bpytop
    reference: https://github.com/aristocratos/bpytop#installation
  mageia/urpmi:
    cmd: 'sudo urpmi bpytop

      sudo dnf install bpytop

      '
    reference: https://github.com/aristocratos/bpytop#installation
  void/xbps:
    cmd: sudo xbps-install bpytop
    reference: https://github.com/aristocratos/bpytop#installation
  /snap:
    cmd: sudo snap install bpytop
    reference: https://github.com/aristocratos/bpytop#installation
  /build:
    cmd: 'git clone https://github.com/aristocratos/bpytop.git

      cd bpytop

      sudo make install

      '
    reference: https://github.com/aristocratos/bpytop#installation
binlist:
- bpytop
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取 /proc/* 系统状态
          en: Reads /proc/* system state
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 ~5 MB
            en: ~5 MB install
        growth:
          desc:
            cn: 几乎不增长
            en: Minimal growth
      paths:
        data: []
        config:
          - "$HOME/.config/bpytop.cfg"
    memory:
      idle:
        rating: 3
        desc:
          cn: ~80 MB（Python 解释器）
          en: ~80 MB (Python interpreter)
      peak:
        rating: 4
        desc:
          cn: ~150 MB
          en: ~150 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
      peak:
        rating: 2
        desc:
          cn: 刷新时短暂占用
          en: Brief spike on refresh
