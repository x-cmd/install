lang: 'Python'
homepage: 'https://github.com/P403n1x87/austin-tui'
license: 'GPL-3.0'
desc:
  cn: Austin 的 top 风格文本界面
  en: 'The top-like text-based user interface for Austin'
x:
  source: https://github.com/P403n1x87/austin-tui
  eget: P403n1x87/austin-tui
rule:
  /eget:
    cmd: x eget P403n1x87/austin-tui
    reference: https://github.com/P403n1x87/austin-tui
binlist:
  - 'austin-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
