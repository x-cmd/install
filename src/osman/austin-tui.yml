lang: 'Python'
homepage: 'https://github.com/P403n1x87/austin-tui'
license: 'GPL-3.0'
desc:
  cn: Austin 的 top 风格文本界面
  en: 'The top-like text-based user interface for Austin'
x:
  source: https://github.com/P403n1x87/austin-tui
  eget: https://github.com/P403n1x87/austin-tui
rule:
  /eget:
    cmd: x eget P403n1x87/austin-tui
    reference: https://github.com/P403n1x87/austin-tui
binlist:
  - 'austin-tui'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
