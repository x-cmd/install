lang: 'Python'
homepage: https://github.com/NSPC911/rovr
license: 'MIT'
desc:
  cn: 功能丰富的终端文件管理器
  en: 'a stylish, batteries-included terminal file manager.'
x:
  source: https://github.com/NSPC911/rovr
  eget: https://github.com/NSPC911/rovr
rule:
  /eget:
    cmd: x eget NSPC911/rovr
    reference: https://github.com/NSPC911/rovr
binlist:
  - 'rovr'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
