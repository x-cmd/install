lang: 'Python'
homepage: https://github.com/NSPC911/rovr
license: 'MIT'
desc:
  cn: 功能丰富的终端文件管理器
  en: 'a stylish, batteries-included terminal file manager.'
x:
  source: https://github.com/NSPC911/rovr
  eget: https://github.com/NSPC911/rovr
rule:
  /eget:
    cmd: x eget NSPC911/rovr
    reference: https://github.com/NSPC911/rovr
binlist:
- 'rovr'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 51 KB
          rating: 1
          desc:
            cn: 约 51 KB（估算）
            en: ~51 KB estimated
        download:
          estimate: 31 MB
          desc:
            cn: 约 31 MB 下载 (linux/x64)
            en: ~31 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
