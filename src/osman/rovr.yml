lang: 'Python'
homepage: https://github.com/NSPC911/rovr
license: 'MIT'
desc:
  cn: 功能丰富的终端文件管理器
  en: 'a stylish, batteries-included terminal file manager.'
  cs: Stylový terminálový správce souborů se vším vše obsáhnutým.
  de: Ein stilvoller Terminal-Dateimanager mit allem, was dazugehört.
  es: Un gestor de archivos de terminal con estilo y todas las funciones incluidas.
  fr: Un gestionnaire de fichiers pour terminal élégant et complet.
  id: Pengelola file terminal yang stylish dengan segalanya sudah termasuk.
  it: Un elegante gestore di file da terminale con tutto incluso.
  ja: 必要な機能をすべて備えた、洗練されたターミナルファイルマネージャーです。
  ko: 필요한 기능이 모두 갖춰진 스타일리시한 터미널 파일 관리자.
  pl: Stylowy terminalowy menedżer plików z wszystkim, co potrzebne.
  pt: Um gerenciador de arquivos de terminal elegante com tudo incluído.
  ro: Un manager de fișiere pentru terminal elegant, cu totul la bord.
  ru: Стильный терминальный файловый менеджер со всеми необходимыми возможностями.
  th: ตัวจัดการไฟล์ในเทอร์มินัลที่สวยงามและมีทุกอย่างครบถ้วน
  tr: Her şeyiyle birlikte gelen şık bir terminal dosya yöneticisi.
  uk: Стильний термінальний файловий менеджер зі усіма потрібними можливостями.
  vi: Trình quản lý tệp terminal thời trang và có sẵn mọi thứ.
x:
  source: https://github.com/NSPC911/rovr
  eget: NSPC911/rovr
rule:
  /eget:
    cmd: x eget NSPC911/rovr
    reference: https://github.com/NSPC911/rovr
binlist:
- 'rovr'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 31 MB
          rating: 2
          desc:
            cn: 安装 31 MB
            en: 31 MB install
        download:
          estimate: 31 MB
          desc:
            cn: 约 31 MB 下载 (linux/x64)
            en: ~31 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
