lang: Rust
homepage: https://github.com/cjbassi/ytop
license: MIT
desc:
  cn: 一个用 Rust 编写的 TUI 系统监视器。
  en: A TUI system monitor written in Rust
  cs: TUI systémový monitor napsaný v Rustu
  de: Ein in Rust geschriebener TUI-Systemmonitor
  es: Un monitor de sistema TUI escrito en Rust
  fr: Un moniteur système TUI écrit en Rust
  id: Monitor sistem TUI yang ditulis dengan Rust
  it: Un monitor di sistema TUI scritto in Rust
  ja: Rust で書かれた TUI システムモニター
  ko: Rust로 작성된 TUI 시스템 모니터
  pl: Monitor systemu TUI napisany w Rust
  pt: Um monitor de sistema TUI escrito em Rust
  ro: Un monitor de sistem TUI scris în Rust
  ru: TUI-системный монитор, написанный на Rust
  th: ตัวตรวจสอบระบบแบบ TUI ที่เขียนด้วย Rust
  tr: Rust ile yazılmış TUI sistem izleyici
  uk: TUI-монітор системи, написаний на Rust
  vi: Trình giám sát hệ thống TUI được viết bằng Rust
x:
  source: https://github.com/cjbassi/ytop
  eget: cjbassi/ytop
  dnf: ytop
  brew: cjbassi/ytop/ytop
  yay: ytop
  cargo: ytop
rule:
  /eget:
    cmd: x eget cjbassi/ytop
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install ytop
    reference: https://github.com/cjbassi/ytop?tab=readme-ov-file#from-source
    dsnap: ytop
  darwin/brew:
    cmd: 'brew tap cjbassi/ytop && \

      brew install ytop

      '
    reference: https://github.com/cjbassi/ytop?tab=readme-ov-file#homebrew
  arch/yay:
    cmd: yay -S ytop
    reference: https://github.com/cjbassi/ytop?tab=readme-ov-file#aur
  fedora/dnf:
    cmd: 'sudo dnf copr enable atim/ytop -y && \

      sudo dnf install ytop

      '
    reference: https://github.com/cjbassi/ytop?tab=readme-ov-file#copr
    dsnap: ytop
binlist:
- ytop

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.1 MB
          rating: 1
          desc:
            cn: 安装 5.1 MB
            en: 5.1 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
