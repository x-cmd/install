lang: C
homepage: https://github.com/ip7z/7zip
desc:
  cn: 7za 是一个开源的文件压缩和解压工具，是 7-Zip 的命令行版本
  en: 7za is an open-source file compression and decompression tool, which is a command-line version of 7-Zip
x:
  source: https://github.com/ip7z/7zip
  eget: ip7z/7zip
  apt: p7zip-full
  dnf: p7zip
  brew: p7zip
  pacman: p7zip
  apk: p7zip
  apt-get: p7zip-full
rule:
  /x:
    cmd: x pkg use 7za
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ip7z/7zip
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install p7zip
    reference: https://formulae.brew.sh/formula/p7zip#default
  debian/apt:
    cmd: sudo apt-get install p7zip-full
    reference: https://command-not-found.com/7za
    dsnap: p7zip-full
  ubuntu/apt:
    cmd: sudo apt-get install p7zip-full
    reference: https://command-not-found.com/7za
    dsnap: p7zip-full
  alpine/apk:
    cmd: sudo apk add p7zip
    reference: https://command-not-found.com/7za
    dsnap: p7zip
  arch/pacman:
    cmd: sudo pacman -S p7zip
    reference: https://command-not-found.com/7za
  kali/apt:
    cmd: sudo apt-get install p7zip-full
    reference: https://command-not-found.com/7za
    dsnap: p7zip-full
  fedora/dnf:
    cmd: sudo dnf install p7zip
    reference: https://command-not-found.com/7za
    dsnap: p7zip
  raspbian/apt:
    cmd: sudo apt-get install p7zip-full
    reference: https://command-not-found.com/7za
binlist:
- 7za
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
