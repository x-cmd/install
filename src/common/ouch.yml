lang: Rust
desc:
  cn: 用于压缩和解压缩各种格式的 CLI 工具
  en: A CLI tool to compress and decompress various formats
homepage: https://github.com/ouch-org/ouch
x:
  pkg:
    exist: true
  source: https://github.com/ouch-org/ouch
  eget: https://github.com/ouch-org/ouch
rule:
  /x:
    cmd: x pkg use ouch
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ouch-org/ouch
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S ouch
    reference: https://github.com/ouch-org/ouch?tab=readme-ov-file#on-arch-linux
  (win|wsl2)/scoop:
    cmd: scoop install ouch
    reference: https://github.com/ouch-org/ouch?tab=readme-ov-file#on-windows-via-scoop
  /cargo:
    cmd: cargo
    reference: https://github.com/ouch-org/ouch?tab=readme-ov-file#from-cratesio
    dsnap: ouch
binlist:
- ouch
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
