lang: Rust
desc:
  cn: 用于压缩和解压缩各种格式的 CLI 工具
  en: A CLI tool to compress and decompress various formats
  cs: Nástroj CLI pro kompresi a dekompresi různých formátů
  de: Ein CLI-Werkzeug zum Komprimieren und Entpacken verschiedener Formate
  es: Una herramienta de CLI para comprimir y descomprimir varios formatos
  fr: Un outil CLI pour compresser et décompresser différents formats
  id: Alat CLI untuk mengompresi dan mendekompresi berbagai format
  it: Uno strumento CLI per comprimere e decomprimere vari formati
  ja: さまざまな形式を圧縮・展開するための CLI ツール
  ko: 다양한 형식을 압축하고 해제하는 CLI 도구
  pl: Narzędzie CLI do kompresji i dekompresji różnych formatów
  pt: Uma ferramenta de CLI para compactar e descompactar vários formatos
  ro: Un instrument CLI pentru comprimarea și decomprimarea diverselor formate
  ru: Инструмент командной строки для сжатия и распаковки различных форматов
  th: เครื่องมือ CLI สำหรับบีบอัดและแตกไฟล์ในรูปแบบต่าง ๆ
  tr: Çeşitli formatları sıkıştırmak ve açmak için bir CLI aracı
  uk: Інструмент командного рядка для стиснення та розпакування різних форматів
  vi: Công cụ CLI để nén và giải nén nhiều định dạng khác nhau
homepage: https://github.com/ouch-org/ouch
x:
  source: https://github.com/ouch-org/ouch
  eget: ouch-org/ouch
  pacman: ouch
  scoop: ouch
rule:
  /x:
    cmd: x pkg use ouch
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ouch-org/ouch
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S ouch
    reference: https://github.com/ouch-org/ouch?tab=readme-ov-file#on-arch-linux
  (win|wsl2)/scoop:
    cmd: scoop install ouch
    reference: https://github.com/ouch-org/ouch?tab=readme-ov-file#on-windows-via-scoop
  /cargo:
    cmd: cargo
    reference: https://github.com/ouch-org/ouch?tab=readme-ov-file#from-cratesio
    dsnap: ouch
binlist:
- ouch
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
