lang: Go
homepage: https://github.com/dnote/dnote
license: Apache-2.0
desc:
  cn: Dnote 是一款面向程序员的简单命令行笔记本
  en: Dnote is a simple command line notebook for programmers
x:
  source: https://github.com/dnote/dnote
  eget: https://github.com/dnote/dnote
  brew: dnote/dnote/dnote
  yay: dnote-cli-bin
rule:
  /x:
    cmd: x pkg use dnote
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dnote/dnote
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -s https://www.getdnote.com/install | sh
    reference: https://github.com/dnote/dnote?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S dnote-cli-bin
    reference: https://aur.archlinux.org/packages/dnote-cli-bin
  darwin/brew:
    cmd: 'brew tap dnote/dnote \

      && brew install dnote

      '
    reference: https://github.com/dnote/dnote?tab=readme-ov-file#installation
binlist:
- dnote

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
