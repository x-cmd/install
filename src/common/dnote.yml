lang: Go
homepage: https://github.com/dnote/dnote
license: Apache-2.0
desc:
  cn: Dnote 是一款面向程序员的简单命令行笔记本
  en: Dnote is a simple command line notebook for programmers
x:
  pkg:
    exist: true
  source: https://github.com/dnote/dnote
  eget: https://github.com/dnote/dnote
rule:
  /x:
    cmd: x pkg use dnote
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dnote/dnote
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -s https://www.getdnote.com/install | sh
    reference: https://github.com/dnote/dnote?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S dnote-cli-bin
    reference: https://aur.archlinux.org/packages/dnote-cli-bin
  darwin/brew:
    cmd: 'brew tap dnote/dnote \

      && brew install dnote

      '
    reference: https://github.com/dnote/dnote?tab=readme-ov-file#installation
binlist:
- dnote

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
