lang: Go
homepage: https://github.com/mholt/archiver
license: MIT
desc:
  cn: 跨平台、多格式的归档实用程序和 Go 库
  en: a cross-platform, multi-format archive utility and Go library
x:
  source: https://github.com/mholt/archiver
rule:
  /go:
    cmd: go get github.com/mholt/archiver/v4
    reference: https://github.com/mholt/archiver?tab=readme-ov-file#library-use
    dsnap: github.com/mholt/archiver/v4
binlist:
- archiver

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 292 KB
          rating: 1
          desc:
            cn: 约 292 KB（估算）
            en: ~292 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
