lang: Go
homepage: https://github.com/mholt/archiver
license: MIT
desc:
  cn: 跨平台、多格式的归档实用程序和 Go 库
  en: a cross-platform, multi-format archive utility and Go library
x:
  source: https://github.com/mholt/archiver
rule:
  /go:
    cmd: go get github.com/mholt/archiver/v4
    reference: https://github.com/mholt/archiver?tab=readme-ov-file#library-use
    dsnap: github.com/mholt/archiver/v4
binlist:
- archiver

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
