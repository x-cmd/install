lang: C
homepage: https://github.com/facebook/zstd
desc:
  cn: 一种基于 Zstandard 算法的高效文件压缩工具
  en: An efficient file compression tool based on the ZStandard algorithm
x:
  source: https://github.com/facebook/zstd
  eget: facebook/zstd
  apt: zstd
  dnf: zstd
  brew: zstd
  pacman: zstd
  apk: zstd
  apt-get: zstd
rule:
  /eget:
    cmd: x eget facebook/zstd
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use zstd
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install zstd
    reference: https://formulae.brew.sh/formula/zstd#default
  debian/apt:
    cmd: sudo apt-get install zstd
    reference: https://command-not-found.com/zstd
    dsnap: zstd
  ubuntu/apt:
    cmd: sudo apt-get install zstd
    reference: https://command-not-found.com/zstd
    dsnap: zstd
  alpine/apk:
    cmd: sudo apk add zstd
    reference: https://command-not-found.com/zstd
    dsnap: zstd
  arch/pacman:
    cmd: sudo pacman -S zstd
    reference: https://command-not-found.com/zstd
  kali/apt:
    cmd: sudo apt-get install zstd
    reference: https://command-not-found.com/zstd
    dsnap: zstd
  fedora/dnf:
    cmd: sudo dnf install zstd
    reference: https://command-not-found.com/zstd
    dsnap: zstd
  raspbian/apt:
    cmd: sudo apt-get install zstd
    reference: https://command-not-found.com/zstd
binlist:
- zstd
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.8 MB
          rating: 1
          desc:
            cn: 约 5.8 MB（估算）
            en: ~5.8 MB estimated
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (win/arm64)
            en: ~2 MB download (win/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: none
