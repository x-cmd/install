lang: C
homepage: https://github.com/RubyMetric/chsrc
license: GPL-3.0
desc:
  cn: 全平台命令行换源工具
  en: Full platform command line source swap tool
x:
  source: https://github.com/RubyMetric/chsrc
  eget: https://github.com/RubyMetric/chsrc
  brew: chsrc
  scoop: chsrc
  yay: chsrc-bin
rule:
  /x:
    cmd: x pkg use chsrc
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget RubyMetric/chsrc
    reference: https://x-cmd.com/mod/eget
  /yay:
    cmd: yay -S chsrc-bin
    reference: https://chsrc.run/
  linux/curl:
    cmd: curl https://chsrc.run/posix | sudo bash
    reference: https://chsrc.run/
  darwin/curl:
    cmd: curl https://chsrc.run/posix | sudo bash
    reference: https://chsrc.run/
  darwin/brew:
    cmd: brew install chsrc
    reference: https://chsrc.run/
  (win|wsl2)/scoop:
    cmd: x scoop install chsrc
    reference: https://chsrc.run/
  win/powershell:
    cmd: x pwsh "& { $(iwr -useb https://chsrc.run/windows) } -Version pre" | iex
    reference: https://chsrc.run/
binlist:
- chsrc

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
