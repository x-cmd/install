lang: C
homepage: https://github.com/RubyMetric/chsrc
license: GPL-3.0
desc:
  cn: 全平台命令行换源工具
  en: Full platform command line source swap tool
  cs: Nástroj pro výměnu zdrojů balíčků ve všech platformách z příkazové řádky
  de: Kommandozeilen-Tool zum Wechseln der Paketquellen auf allen Plattformen
  es: Herramienta de línea de comandos para cambiar las fuentes en todas las plataformas
  fr: Outil en ligne de commande de changement de source pour toutes les plateformes
  id: Alat ganti sumber paket lintas platform melalui baris perintah
  it: Strumento da riga di comando per cambiare sorgente dei pacchetti su tutte le piattaforme
  ja: 全プラットフォーム対応のコマンドラインソース切替ツール
  ko: 모든 플랫폼에서 동작하는 명령줄 소스 전환 도구
  pl: Narzędzie wiersza poleceń do zmiany źródeł pakietów na wszystkich platformach
  pt: Ferramenta de linha de comando para troca de fontes em todas as plataformas
  ro: Instrument de linie de comandă pentru schimbarea surselor pe toate platformele
  ru: Инструмент командной строки для смены источников пакетов на всех платформах
  th: เครื่องมือสลับแหล่งที่มาจากบรรทัดคำสั่ง รองรับทุกแพลตฟอร์ม
  tr: Tüm platformlarda paket kaynağı değiştirme komut satırı aracı
  uk: Інструмент командного рядка для зміни джерел пакетів на всіх платформах
  vi: Công cụ dòng lệnh đổi nguồn cho mọi nền tảng
x:
  source: https://github.com/RubyMetric/chsrc
  eget: RubyMetric/chsrc
  brew: chsrc
  scoop: chsrc
  yay: chsrc-bin
rule:
  /x:
    cmd: x pkg use chsrc
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget RubyMetric/chsrc
    reference: https://x-cmd.com/mod/eget
  /yay:
    cmd: yay -S chsrc-bin
    reference: https://chsrc.run/
  linux/curl:
    cmd: curl https://chsrc.run/posix | sudo bash
    reference: https://chsrc.run/
  darwin/curl:
    cmd: curl https://chsrc.run/posix | sudo bash
    reference: https://chsrc.run/
  darwin/brew:
    cmd: brew install chsrc
    reference: https://chsrc.run/
  (win|wsl2)/scoop:
    cmd: x scoop install chsrc
    reference: https://chsrc.run/
  win/powershell:
    cmd: x pwsh "& { $(iwr -useb https://chsrc.run/windows) } -Version pre" | iex
    reference: https://chsrc.run/
binlist:
- chsrc

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
