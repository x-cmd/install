lang: C
homepage: https://github.com/mirror/busybox
desc:
  cn: 一个集成了多个常用命令和工具的单个可执行文件，旨在为嵌入式系统和资源受限的环境提供常用的命令和实用程序
  en: A streamlined tool set that integrates multiple commonly used commands and tools
x:
  pkg:
    exist: true
  source: https://github.com/mirror/busybox
rule:
  /x:
    cmd: x pkg use busybox
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install procs
    reference: https://github.com/dalance/procs
  debian/apt:
    cmd: sudo apt-get install busybox
    reference: https://command-not-found.com/busybox
    dsnap: busybox
  ubuntu/apt:
    cmd: sudo apt-get install busybox
    reference: https://command-not-found.com/busybox
    dsnap: busybox
  alpine/apk:
    cmd: sudo apk add busybox
    reference: https://github.com/dalance/procs
    dsnap: busybox
  arch/pacman:
    cmd: sudo pacman -S busybox
    reference: https://github.com/dalance/procs
  kali/apt:
    cmd: sudo apt-get install busybox
    reference: https://command-not-found.com/busybox
    dsnap: busybox
  centos/yum:
    cmd: sudo yum install busybox
    reference: https://command-not-found.com/busybox
  fedora/dnf:
    cmd: sudo dnf install busybox
    reference: https://github.com/dalance/procs
    dsnap: busybox
binlist:
- busybox
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
