lang: C
homepage: https://github.com/mirror/busybox
desc:
  cn: 一个集成了多个常用命令和工具的单个可执行文件，旨在为嵌入式系统和资源受限的环境提供常用的命令和实用程序
  en: A streamlined tool set that integrates multiple commonly used commands and tools
  cs: Zjednodušená sada nástrojů, která integruje více běžně používaných příkazů a nástrojů
  de: Eine schlanke Werkzeugsammlung, die mehrere gängige Befehle und Tools integriert
  es: Un conjunto de herramientas streamlined que integra múltiples comandos y herramientas de uso común
  fr: Un ensemble d'outils rationalisé qui intègre plusieurs commandes et outils couramment utilisés
  id: Seperangkat alat ringkas yang mengintegrasikan berbagai perintah dan alat yang umum digunakan
  it: Un insieme di strumenti snello che integra molteplici comandi e strumenti comunemente usati
  ja: よく使うコマンドとツールを統合した、軽量なツール集です
  ko: 여러 가지 자주 쓰이는 명령과 도구를 통합한 경량 도구 모음
  pl: Uproszczony zestaw narzędzi integrujący wiele powszechnie używanych poleceń i narzędzi
  pt: Um conjunto de ferramentas streamlined que integra vários comandos e ferramentas comumente usados
  ro: O set rafinat de instrumente care integrează mai multe comenzi și instrumente utilizate frecvent
  ru: Компактный набор инструментов, объединяющий несколько часто используемых команд и утилит
  th: ชุดเครื่องมือที่กระชับ รวมคำสั่งและเครื่องมือที่ใช้กันทั่วไปหลายรายการ
  tr: Sık kullanılan birçok komut ve aracı bir araya getiren sadeleştirilmiş bir araç seti
  uk: Спрощений набір інструментів, що об'єднує кілька часто використовуваних команд і утиліт
  vi: Bộ công cụ gọn gàng tích hợp nhiều lệnh và công cụ thường dùng
x:
  source: https://github.com/mirror/busybox
  apt: busybox
  dnf: busybox
  brew: procs
  pacman: busybox
  apk: busybox
  apt-get: busybox
  yum: busybox
rule:
  /x:
    cmd: x pkg use busybox
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install procs
    reference: https://github.com/dalance/procs
  debian/apt:
    cmd: sudo apt-get install busybox
    reference: https://command-not-found.com/busybox
    dsnap: busybox
  ubuntu/apt:
    cmd: sudo apt-get install busybox
    reference: https://command-not-found.com/busybox
    dsnap: busybox
  alpine/apk:
    cmd: sudo apk add busybox
    reference: https://github.com/dalance/procs
    dsnap: busybox
  arch/pacman:
    cmd: sudo pacman -S busybox
    reference: https://github.com/dalance/procs
  kali/apt:
    cmd: sudo apt-get install busybox
    reference: https://command-not-found.com/busybox
    dsnap: busybox
  centos/yum:
    cmd: sudo yum install busybox
    reference: https://command-not-found.com/busybox
  fedora/dnf:
    cmd: sudo dnf install busybox
    reference: https://github.com/dalance/procs
    dsnap: busybox
binlist:
- busybox
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
