lang: C
homepage: https://github.com/jca02266/lha/
license: NOASSERTION
desc:
  cn: lha 是经典 LZH 压缩工具 jca02266/lha（原 LHa for UNIX 1.14i）。上游 license 限制二进制再分发，主流发行版已不再打包；推荐改用 lhasa（x install lhasa）或从上游源码自编译。
  en: lha is the classic LZH compression tool jca02266/lha (LHa for UNIX 1.14i). The upstream license restricts binary redistribution, and major distributions no longer package redistributable binaries; use lhasa (`x install lhasa`) instead, or build from upstream source.
  cs: lha je klasický nástroj pro kompresi LZH jca02266/lha (LHa for UNIX 1.14i). Licence upstreamu omezuje redistribuci binárek, takže hlavní distribuce již balíčky s binárkami neobsahují; použijte raději lhasa (`x install lhasa`) nebo sestavte ze zdrojového kódu upstreamu.
  de: lha ist das klassische LZH-Kompressionswerkzeug jca02266/lha (LHa for UNIX 1.14i). Die Upstream-Lizenz schränkt die Weitergabe von Binärdateien ein, daher paketieren große Distributionen keine weiterverbreitbaren Binärdateien mehr; verwenden Sie stattdessen lhasa (`x install lhasa`) oder bauen Sie aus dem Upstream-Quellcode.
  es: lha es la herramienta clásica de compresión LZH jca02266/lha (LHa for UNIX 1.14i). La licencia upstream restringe la redistribución de binarios y las principales distribuciones ya no empaquetan binarios redistribuibles; usa lhasa (`x install lhasa`) en su lugar, o compila desde el código fuente upstream.
  fr: lha est l'outil classique de compression LZH jca02266/lha (LHa for UNIX 1.14i). La licence amont restreint la redistribution de binaires et les grandes distributions n'empaquettent plus de binaires redistribuables ; utilisez plutôt lhasa (`x install lhasa`), ou compilez depuis les sources amont.
  id: lha adalah alat kompresi LZH klasik jca02266/lha (LHa for UNIX 1.14i). Lisensi upstream membatasi redistribusi bineri, dan distribusi besar sudah tidak lagi mengemas biner yang dapat didistribusikan ulang; gunakan lhasa (`x install lhasa`) sebagai gantinya, atau bangun dari sumber upstream.
  it: lha è il classico strumento di compressione LZH jca02266/lha (LHa for UNIX 1.14i). La licenza upstream limita la ridistribuzione dei binari e le principali distribuzioni non pacchettizzano più binari ridistribuibili; usa invece lhasa (`x install lhasa`) oppure compila dai sorgenti upstream.
  ja: lha は古典的な LZH 圧縮ツール jca02266/lha (LHa for UNIX 1.14i) です。上流のライセンスはバイナリの再配布を制限しているため、主要ディストリビューションは再配布可能なバイナリを同梱しなくなりました。代わりに lhasa (`x install lhasa`) を使うか、上流のソースからビルドしてください。
  ko: lha는 클래식 LZH 압축 도구 jca02266/lha (LHa for UNIX 1.14i)입니다. 업스트림 라이선스가 바이너리 재배포를 제한하여 주요 배포판은 더 이상 재배포 가능한 바이너리를 포함하지 않습니다. 대신 lhasa (`x install lhasa`)를 사용하거나 업스트림 소스에서 빌드하십시오.
  pl: lha to klasyczne narzędzie do kompresji LZH jca02266/lha (LHa for UNIX 1.14i). Licencja upstream ogranicza redystrybucję binariów, a główne dystrybucje nie pakują już binariów możliwych do redystrybucji; użyj zamiast tego lhasa (`x install lhasa`) lub zbuduj ze źródeł upstream.
  pt: lha é a ferramenta clássica de compressão LZH jca02266/lha (LHa for UNIX 1.14i). A licença upstream restringe a redistribuição de binários, e as principais distribuições não empacotam mais binários redistribuíveis; use o lhasa (`x install lhasa`) em vez disso, ou compile a partir do código-fonte upstream.
  ro: lha este instrumentul clasic de compresie LZH jca02266/lha (LHa for UNIX 1.14i). Licența upstream restricționează redistribuirea binarelor, iar distribuțiile principale nu mai ambalează binare redistribuibile; folosiți în schimb lhasa (`x install lhasa`) sau construiți din codul sursă upstream.
  ru: lha — это классический инструмент сжатия LZH jca02266/lha (LHa for UNIX 1.14i). Лицензия upstream ограничивает распространение бинарных файлов, и основные дистрибутивы больше не упаковывают распространяемые бинарники; используйте вместо него lhasa (`x install lhasa`) или соберите из исходного кода upstream.
  th: lha คือเครื่องมือบีบอัด LZH คลาสสิก jca02266/lha (LHa for UNIX 1.14i) ใบอนุญาตของ upstream จำกัดการแจกจ่ายไบนารี และดิสโทรที่ยิ่งใหญ่ก็ไม่แจกแพ็กเกจไบนารีที่นำไปแจกจ่ายต่อได้อีกแล้ว ควรใช้ lhasa (`x install lhasa`) แทน หรือ build จากซอร์สโค้ดของ upstream
  tr: lha, klasik LZH sıkıştırma aracıdır jca02266/lha (LHa for UNIX 1.14i). Upstream lisansı ikili dosyaların yeniden dağıtımını kısıtlar ve büyük dağıtımlar artık yeniden dağıtılabilir ikili dosyalar paketlemiyor; bunun yerine lhasa (`x install lhasa`) kullanın veya upstream kaynak koddan derleyin.
  uk: lha — це класичний інструмент стиснення LZH jca02266/lha (LHa for UNIX 1.14i). Ліцензія upstream обмежує поширення двійкових файлів, і основні дистрибутиви більше не пакують двійкові файли, які можна поширювати; скористайтеся lhasa (`x install lhasa`) або зберіть із вихідного коду upstream.
  vi: lha là công cụ nén LZH kinh điển jca02266/lha (LHa for UNIX 1.14i). Giấy phép upstream hạn chế việc phân phối lại nhị phân, và các bản phân phối lớn không còn đóng gói nhị phân có thể phân phối lại; hãy dùng lhasa (`x install lhasa`) thay thế, hoặc build từ mã nguồn upstream.
x:
  source: https://github.com/jca02266/lha/
  eget: ljh-sh/lha
rule:
  /git:
    cmd: git clone https://github.com/jca02266/lha.git && cd lha && autoreconf -is && ./configure && make && sudo make install
    reference: https://github.com/jca02266/lha#how-to-compile
binlist:
  - lha

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 433 KB
          rating: 1
          desc:
            cn: 约 433 KB（估算）
            en: ~433 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
