lang: C
homepage: https://github.com/ip7z/7zip
desc:
  cn: 7-Zip 是一款拥有极高压缩比的开源压缩软件
  en: 7-Zip is a file archiver with a high compression ratio
  cs: 7-Zip je archivátor souborů s vysokým poměrem komprese
  de: 7-Zip ist ein Dateiarchivierer mit hohem Kompressionsverhältnis
  es: 7-Zip es un archivador de archivos con una alta relación de compresión
  fr: 7-Zip est un archiveur de fichiers avec un taux de compression élevé
  id: 7-Zip adalah pengarsip file dengan rasio kompresi tinggi
  it: 7-Zip è un archiviazione file con un elevato rapporto di compressione
  ja: 7-Zip は圧縮率の高いファイルアーチバです
  ko: 7-Zip은 압축률이 높은 파일 아카이버입니다
  pl: 7-Zip to archiwizator plików o wysokim współczynniku kompresji
  pt: O 7-Zip é um arquivador de arquivos com alta taxa de compressão
  ro: 7-Zip este un arhivor de fișiere cu un raport de compresie ridicat
  ru: 7-Zip — это файловый архиватор с высокой степенью сжатия
  th: 7-Zip เป็นโปรแกรมจัดเก็บไฟล์ที่มีอัตราการบีบอัดสูง
  tr: 7-Zip, yüksek sıkıştırma oranına sahip bir dosya arşivleyicisidir
  uk: 7-Zip — це архіватор файлів із високим коефіцієнтом стиснення
  vi: 7-Zip là tiện ích lưu trữ tệp với tỷ lệ nén cao
x:
  source: https://github.com/ip7z/7zip
  eget: ip7z/7zip
rule:
  /x:
    cmd: x pkg use 7zz
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ip7z/7zip
    reference: https://x-cmd.com/mod/eget
  (linux|darwin|win|wsl2)/:
    cmd: x env use 7zz
    reference: https://x-cmd.com/mod/env
binlist:
- 7zz
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
