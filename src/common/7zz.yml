lang: C
homepage: https://github.com/ip7z/7zip
desc:
  cn: 7-Zip 是一款拥有极高压缩比的开源压缩软件
  en: 7-Zip is a file archiver with a high compression ratio
x:
  source: https://github.com/ip7z/7zip
  eget: ip7z/7zip
rule:
  /x:
    cmd: x pkg use 7zz
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ip7z/7zip
    reference: https://x-cmd.com/mod/eget
  (linux|darwin|win|wsl2)/:
    cmd: x env use 7zz
    reference: https://x-cmd.com/mod/env
binlist:
- 7zz
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
