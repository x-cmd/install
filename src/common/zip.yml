lang: C
homepage: https://infozip.sourceforge.net/Zip.html
desc:
  cn: Zip 是一个压缩和文件打包/归档实用程序
  en: Zip is a compression and file packaging/archive utility
rule:
  darwin/brew:
    cmd: brew install zip
    reference: https://formulae.brew.sh/formula/zip#default
  debian/apt:
    cmd: sudo apt-get install zip
    reference: https://command-not-found.com/zip
    dsnap: zip
  ubuntu/apt:
    cmd: sudo apt-get install zip
    reference: https://command-not-found.com/zip
    dsnap: zip
  alpine/apk:
    cmd: sudo apk add zip
    reference: https://command-not-found.com/zip
    dsnap: zip
  arch/pacman:
    cmd: sudo pacman -S zip
    reference: https://command-not-found.com/zip
  kali/apt:
    cmd: sudo apt-get install zip
    reference: https://command-not-found.com/zip
    dsnap: zip
  centos/yum:
    cmd: sudo yum install zip
    reference: https://command-not-found.com/zip
  fedora/dnf:
    cmd: sudo dnf install zip
    reference: https://command-not-found.com/zip
    dsnap: zip
  raspbian/apt:
    cmd: sudo apt-get install zip
    reference: https://command-not-found.com/zip
  gentoo/emerge:
    cmd: sudo emerge --ask app-arch/zip
    reference: https://wiki.gentoo.org/wiki/Zip
  opensuse/zypper:
    cmd: sudo zypper install zip
    reference: https://software.opensuse.org/download/package?package=zip&project=Archiving
binlist:
- zip
license: NOASSERTION
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取待压缩文件
          en: Reads files to compress
        sensitive: []
      write:
        desc:
          cn: 写入 .zip 归档
          en: Writes .zip archives
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 ~1 MB
            en: ~1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: ~5 MB
          en: ~5 MB
      peak:
        estimate: 200 MB
        desc:
          cn: 大型压缩 ~200 MB
          en: ~200 MB on large archives
    cpu:
      workload: [compute]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 5
        desc:
          cn: 压缩/解压时占用
          en: Spike during compression
