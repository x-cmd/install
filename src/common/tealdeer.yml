lang: Rust
homepage: https://github.com/dbrgn/tealdeer
license: Apache-2.0
desc:
  en: A very fast implementation of tldr in Rust
  cn: 用 Rust 实现的非常快速的 tldr 版本
  cs: Velmi rychlá implementace tldr v jazyce Rust
  de: Eine sehr schnelle Implementierung von tldr in Rust
  es: Una implementación muy rápida de tldr en Rust
  fr: Une implémentation très rapide de tldr en Rust
  id: Implementasi tldr yang sangat cepat dengan Rust
  it: Un'implementazione molto veloce di tldr in Rust
  ja: Rust で書かれた超高速な tldr 実装です。
  ko: Rust로 작성한 매우 빠른 tldr 구현
  pl: Bardzo szybka implementacja tldr w języku Rust
  pt: Uma implementação do tldr muito rápida, escrita em Rust
  ro: O implementare foarte rapidă a tldr în Rust
  ru: Очень быстрая реализация tldr на Rust
  th: การทำให้ tldr ที่เร็วมากโดยเขียนด้วย Rust
  tr: Rust ile yazılmış çok hızlı bir tldr uygulaması
  uk: Дуже швидка реалізація tldr на Rust
  vi: Bản triển khai tldr cực nhanh viết bằng Rust
x:
  source: https://github.com/dbrgn/tealdeer
  apt: tealdeer
  dnf: tealdeer
  brew: tealdeer
  pacman: tealdeer
  port: tealdeer
  scoop: tealdeer
  cargo: tealdeer
rule:
  /cargo:
    cmd: cargo install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#through-cargo-install
    dsnap: tealdeer
  arch/pacman:
    cmd: sudo pacman -S tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
  debian/apt:
    cmd: sudo apt install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
    dsnap: tealdeer
  fedora/dnf:
    cmd: sudo dnf install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
    dsnap: tealdeer
  darwin/brew:
    cmd: brew install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
  darwin/port:
    cmd: sudo port install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
  (win|wsl2)/scoop:
    cmd: x scoop install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
binlist:
- tldr

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
