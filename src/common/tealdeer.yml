lang: Rust
homepage: https://github.com/dbrgn/tealdeer
license: Apache-2.0
desc:
  en: A very fast implementation of tldr in Rust
  cn: 用 Rust 实现的非常快速的 tldr 版本
x:
  source: https://github.com/dbrgn/tealdeer
rule:
  /cargo:
    cmd: cargo install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#through-cargo-install
    dsnap: tealdeer
  arch/pacman:
    cmd: sudo pacman -S tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
  debian/apt:
    cmd: sudo apt install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
    dsnap: tealdeer
  fedora/dnf:
    cmd: sudo dnf install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
    dsnap: tealdeer
  darwin/brew:
    cmd: brew install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
  darwin/port:
    cmd: sudo port install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
  (win|wsl2)/scoop:
    cmd: x scoop install tealdeer
    reference: https://tealdeer-rs.github.io/tealdeer/installing.html#package-managers
binlist:
  - tldr

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 150 KB
          rating: 1
          desc:
            cn: 约 150 KB（估算）
            en: ~150 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
