lang: C
homepage: https://github.com/fragglet/lhasa
license: ISC
desc:
  cn: Lhasa 是用于解析 LHA（.lzh）、LArc（.lzs）和 PMarc（.pma）档案的库与 CLI 工具，Unix LHA 工具的纯 FOSS（ISC）替代品。CLI 二进制名字故意是 `lha`（upstream Makefile.am `bin_PROGRAMS=lha`），与原 LHa for UNIX 命令接口兼容；安装后运行 `lha` 而不是 `lhasa`。
  en: Lhasa is a library + CLI for parsing LHA (.lzh), LArc (.lzs) and PMarc (.pma) archives — pure FOSS (ISC) replacement for the non-free Unix LHA tool. The CLI binary is intentionally named `lha` (upstream Makefile.am `bin_PROGRAMS=lha`) to mirror the original LHa for UNIX command; after install, run `lha`, not `lhasa`.
  cs: Lhasa je knihovna a CLI pro parsování archivů LHA (.lzh), LArc (.lzs) a PMarc (.pma) — čistě FOSS (ISC) náhrada za nevolný nástroj Unix LHA. Binárka CLI je záměrně pojmenována `lha` (upstream Makefile.am `bin_PROGRAMS=lha`), aby odpovídala původnímu příkazu LHa for UNIX; po instalaci spouštějte `lha`, nikoli `lhasa`.
  de: Lhasa ist eine Bibliothek und CLI zum Parsen von LHA- (.lzh), LArc- (.lzs) und PMarc- (.pma)-Archiven — ein reiner FOSS-(ISC-)Ersatz für das unfreie Unix-LHA-Werkzeug. Die CLI-Binärdatei ist absichtlich `lha` benannt (upstream Makefile.am `bin_PROGRAMS=lha`), um das ursprüngliche LHa-for-UNIX-Kommando nachzubilden; führen Sie nach der Installation `lha` aus, nicht `lhasa`.
  es: Lhasa es una biblioteca + CLI para analizar archivos LHA (.lzh), LArc (.lzs) y PMarc (.pma), un reemplazo puramente FOSS (ISC) de la herramienta Unix LHA no libre. El binario de la CLI se llama intencionalmente `lha` (Makefile.am upstream `bin_PROGRAMS=lha`) para reflejar el comando original LHa for UNIX; tras instalar, ejecuta `lha`, no `lhasa`.
  fr: Lhasa est une bibliothèque et une CLI pour analyser les archives LHA (.lzh), LArc (.lzs) et PMarc (.pma) — un remplaçant purement FOSS (ISC) de l'outil Unix LHA non libre. Le binaire de la CLI est intentionnellement nommé `lha` (Makefile.am amont `bin_PROGRAMS=lha`) pour reprendre la commande LHa for UNIX d'origine ; après l'installation, lancez `lha`, pas `lhasa`.
  id: Lhasa adalah pustaka + CLI untuk mengurai arsip LHA (.lzh), LArc (.lzs) dan PMarc (.pma) — pengganti FOSS (ISC) murni untuk alat Unix LHA non-free. Binari CLI sengaja dinamai `lha` (Makefile.am upstream `bin_PROGRAMS=lha`) untuk meniru perintah LHa for UNIX asli; setelah instalasi, jalankan `lha`, bukan `lhasa`.
  it: Lhasa è una libreria e una CLI per analizzare gli archivi LHA (.lzh), LArc (.lzs) e PMarc (.pma) — un sostituto puramente FOSS (ISC) dello strumento Unix LHA non libero. Il binario della CLI è volutamente chiamato `lha` (Makefile.am upstream `bin_PROGRAMS=lha`) per replicare il comando originale LHa for UNIX; dopo l'installazione, esegui `lha`, non `lhasa`.
  ja: Lhasa は LHA (.lzh)、LArc (.lzs)、PMarc (.pma) アーカイブを解析するためのライブラリと CLI です。自由でない Unix LHA ツールに対する純粋な FOSS (ISC) の代替です。CLI バイナリは意図的に `lha` と命名されています (upstream Makefile.am `bin_PROGRAMS=lha`)。インストール後は `lhasa` ではなく `lha` を実行してください。
  ko: Lhasa는 LHA(.lzh), LArc(.lzs), PMarc(.pma) 아카이브를 파싱하기 위한 라이브러리와 CLI로, 상용 Unix LHA 도구를 대체하는 순수 FOSS(ISC) 구현입니다. CLI 바이너리는 의도적으로 `lha`로 이름이 정해졌습니다(upstream Makefile.am `bin_PROGRAMS=lha`). 설치 후에는 `lhasa`가 아니라 `lha`를 실행하십시오.
  pl: Lhasa to biblioteka i CLI do parsowania archiwów LHA (.lzh), LArc (.lzs) i PMarc (.pma) — czysto FOSS (ISC) zamiennik nie wolnego narzędzia Unix LHA. Binarny plik CLI jest celowo nazwany `lha` (upstream Makefile.am `bin_PROGRAMS=lha`), aby odwzorować oryginalne polecenie LHa for UNIX; po instalacji uruchamiaj `lha`, a nie `lhasa`.
  pt: Lhasa é uma biblioteca + CLI para analisar arquivos LHA (.lzh), LArc (.lzs) e PMarc (.pma) — substituto puramente FOSS (ISC) para a ferramenta Unix LHA não livre. O binário da CLI é intencionalmente chamado `lha` (Makefile.am upstream `bin_PROGRAMS=lha`) para espelhar o comando original LHa for UNIX; após instalar, execute `lha`, não `lhasa`.
  ro: Lhasa este o bibliotecă + CLI pentru analizarea arhivelor LHA (.lzh), LArc (.lzs) și PMarc (.pma) — înlocuitor complet FOSS (ISC) pentru instrumentul Unix LHA nefree. Binarul CLI este intenționat numit `lha` (Makefile.am upstream `bin_PROGRAMS=lha`) pentru a replica comanda originală LHa for UNIX; după instalare, rulați `lha`, nu `lhasa`.
  ru: Lhasa — это библиотека и CLI для разбора архивов LHA (.lzh), LArc (.lzs) и PMarc (.pma) — полностью свободная (ISC) замена несвободной утилиты Unix LHA. Бинарный файл CLI намеренно назван `lha` (upstream Makefile.am `bin_PROGRAMS=lha`), чтобы повторять исходную команду LHa for UNIX; после установки запускайте `lha`, а не `lhasa`.
  th: Lhasa คือไลบรารีและ CLI สำหรับแยกข้อมูลไฟล์บีบอัด LHA (.lzh), LArc (.lzs) และ PMarc (.pma) — เป็นตัวแทน FOSS (ISC) แท้แทนเครื่องมือ Unix LHA แบบไม่เสรี ตัวไบนารีของ CLI ตั้งชื่อว่า `lha` โดยเจตนา (Makefile.am ของ upstream `bin_PROGRAMS=lha`) เพื่อให้ตรงกับคำสั่ง LHa for UNIX เดิม หลังติดตั้งให้เรียก `lha` ไม่ใช่ `lhasa`
  tr: Lhasa, LHA (.lzh), LArc (.lzs) ve PMarc (.pma) arşivlerini ayrıştırmak için bir kütüphane + CLI'dır — ücretsiz olmayan Unix LHA aracına tamamen FOSS (ISC) bir alternatiftir. CLI ikili dosyası bilinçli olarak `lha` olarak adlandırılmıştır (upstream Makefile.am `bin_PROGRAMS=lha`) ve özgün LHa for UNIX komutunu yansıtır; kurulumdan sonra `lhasa` değil `lha` çalıştırın.
  uk: Lhasa — це бібліотека та CLI для розбору архівів LHA (.lzh), LArc (.lzs) та PMarc (.pma) — повністю вільна (ISC) заміна невільної утиліти Unix LHA. Бінарний файл CLI навмисно названо `lha` (upstream Makefile.am `bin_PROGRAMS=lha`), щоб повторювати початкову команду LHa for UNIX; після встановлення запускайте `lha`, а не `lhasa`.
  vi: Lhasa là thư viện và CLI để phân tích các tệp nén LHA (.lzh), LArc (.lzs) và PMarc (.pma) — thay thế hoàn toàn FOSS (ISC) cho công cụ Unix LHA không tự do. Tệp nhị phân CLI được cố ý đặt tên là `lha` (Makefile.am upstream `bin_PROGRAMS=lha`) để mô phỏng lệnh LHa for UNIX gốc; sau khi cài đặt, hãy chạy `lha` chứ không phải `lhasa`.
x:
  source: https://github.com/fragglet/lhasa
  eget: ljh-sh/lhasa
  apt: lhasa
  brew: lhasa
  zypper: lhasa
  xbps: lhasa
  yay: lhasa-git
rule:
  /eget:
    cmd: x eget ljh-sh/lhasa
    reference: https://github.com/ljh-sh/lhasa
  arch/yay:
    cmd: yay -S lhasa-git
    reference: https://aur.archlinux.org/packages/lhasa-git
  debian/apt:
    cmd: sudo apt install lhasa
    reference: https://fragglet.github.io/lhasa/
    dsnap: lhasa
  ubuntu/apt:
    cmd: sudo apt install lhasa
    reference: https://fragglet.github.io/lhasa/
    dsnap: lhasa
  freebsd/pkg:
    cmd: pkg install archivers/lhasa
    reference: https://fragglet.github.io/lhasa/
  darwin/brew:
    cmd: brew install lhasa
    reference: https://fragglet.github.io/lhasa/
  netbsd/pkgin:
    cmd: pkgin install lhasa
    reference: https://fragglet.github.io/lhasa/
  opensuse/zypper:
    cmd: sudo zypper install lhasa
    reference: https://fragglet.github.io/lhasa/
  void/xbps-install:
    cmd: sudo xbps-install lhasa
    reference: https://fragglet.github.io/lhasa/
binlist:
- lha

