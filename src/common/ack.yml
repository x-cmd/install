lang: Perl
homepage: https://github.com/beyondgrep/ack3
desc:
  cn: ack 是一个类似 grep 的源代码搜索工具
  en: ack is a grep-like source code search tool
  cs: ack je nástroj pro vyhledávání v zdrojovém kódu podobný grep
  de: ack ist ein grep-ähnliches Quellcode-Suchwerkzeug
  es: ack es una herramienta de búsqueda de código fuente similar a grep
  fr: ack est un outil de recherche de code source similaire à grep
  id: ack adalah alat pencarian kode sumber mirip grep
  it: ack è uno strumento di ricerca nel codice sorgente simile a grep
  ja: ack は grep に似たソースコード検索ツールです
  ko: ack은 grep과 유사한 소스 코드 검색 도구입니다
  pl: ack to narzędzie do przeszukiwania kodu źródłowego podobne do grep
  pt: ack é uma ferramenta de busca em código-fonte semelhante ao grep
  ro: ack este un instrument de căutare în cod sursă similar cu grep
  ru: ack — это инструмент поиска по исходному коду, похожий на grep
  th: ack เป็นเครื่องมือค้นหาโค้ดต้นฉบับคล้าย grep
  tr: ack, grep'e benzeyen bir kaynak kodu arama aracıdır
  uk: ack — це інструмент пошуку вихідним кодом, схожий на grep
  vi: ack là công cụ tìm kiếm mã nguồn tương tự grep
x:
  source: https://github.com/beyondgrep/ack3
  brew: ack
  scoop: ack
rule:
  /curl:
    cmd: curl https://beyondgrep.com/ack-v3.7.0 > ~/bin/ack && chmod 0755 ~/bin/ack
    reference: https://beyondgrep.com/install/
  darwin/brew:
    cmd: brew install ack
    reference: https://formulae.brew.sh/formula/ack#default
  (win|wsl2)/scoop:
    cmd: x scoop install ack
    reference: https://scoop.sh/#/apps?q=ack
binlist:
- ack
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 8 MB
        desc:
          cn: 8 MB（估算）
          en: 8 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
