lang: Perl
homepage: https://github.com/beyondgrep/ack3
desc:
  cn: ack 是一个类似 grep 的源代码搜索工具
  en: ack is a grep-like source code search tool
x:
  source: https://github.com/beyondgrep/ack3
  brew: ack
  scoop: ack
  curl: curl
rule:
  /curl:
    cmd: curl https://beyondgrep.com/ack-v3.7.0 > ~/bin/ack && chmod 0755 ~/bin/ack
    reference: https://beyondgrep.com/install/
  darwin/brew:
    cmd: brew install ack
    reference: https://formulae.brew.sh/formula/ack#default
  (win|wsl2)/scoop:
    cmd: x scoop install ack
    reference: https://scoop.sh/#/apps?q=ack
binlist:
- ack
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 8 MB
        desc:
          cn: 8 MB（估算）
          en: 8 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
