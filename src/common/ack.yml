lang: Perl
homepage: https://github.com/beyondgrep/ack3
desc:
  cn: ack 是一个类似 grep 的源代码搜索工具
  en: ack is a grep-like source code search tool
x:
  source: https://github.com/beyondgrep/ack3
rule:
  /curl:
    cmd: curl https://beyondgrep.com/ack-v3.7.0 > ~/bin/ack && chmod 0755 ~/bin/ack
    reference: https://beyondgrep.com/install/
  darwin/brew:
    cmd: brew install ack
    reference: https://formulae.brew.sh/formula/ack#default
  (win|wsl2)/scoop:
    cmd: x scoop install ack
    reference: https://scoop.sh/#/apps?q=ack
binlist:
- ack
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
