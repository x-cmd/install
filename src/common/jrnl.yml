lang: Python
homepage: https://github.com/jrnl-org/jrnl
license: GPL-3.0
desc:
  cn: 无需离开命令行即可收集您的想法和笔记
  en: Collect your thoughts and notes without leaving the command line
x:
  pkg:
    exist: true
  source: https://github.com/jrnl-org/jrnl
rule:
  /x:
    cmd: x pkg use jrnl
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install jrnl
    reference: https://jrnl.sh/en/stable/installation/
    dsnap: jrnl
  darwin/brew:
    cmd: brew install jrnl
    reference: https://jrnl.sh/en/stable/installation/
  /pipx:
    cmd: pipx install jrnl
    reference: https://jrnl.sh/en/stable/installation/
binlist:
- jrnl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 22 KB
          rating: 1
          desc:
            cn: 约 22 KB（估算）
            en: ~22 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
