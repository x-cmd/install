lang: Python
homepage: https://github.com/jrnl-org/jrnl
license: GPL-3.0
desc:
  cn: 无需离开命令行即可收集您的想法和笔记
  en: Collect your thoughts and notes without leaving the command line
x:
  pkg:
    exist: true
  source: https://github.com/jrnl-org/jrnl
rule:
  /x:
    cmd: x pkg use jrnl
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install jrnl
    reference: https://jrnl.sh/en/stable/installation/
    dsnap: jrnl
  darwin/brew:
    cmd: brew install jrnl
    reference: https://jrnl.sh/en/stable/installation/
  /pipx:
    cmd: pipx install jrnl
    reference: https://jrnl.sh/en/stable/installation/
binlist:
- jrnl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
