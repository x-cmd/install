lang: Go
homepage: https://github.com/larksuite/cli
license: MIT
desc:
  cn: 飞书/Lark 开放平台命令行工具
  en: A command-line tool for Lark/Feishu Open Platform
x:
  pkg:
    exist: true
  source: https://github.com/larksuite/cli
rule:
  /x:
    cmd: x pkg use lark-cli
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S lark-cli-bin
    reference: https://aur.archlinux.org/packages/lark-cli-bin
  /npm:
    cmd: npm install -g @larksuite/cli
    reference: https://github.com/larksuite/cli?tab=readme-ov-file#install-cli
    dsnap: '@larksuite/cli'
binlist:
  - lark-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
