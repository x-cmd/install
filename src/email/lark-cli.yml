lang: Go
homepage: https://github.com/larksuite/cli
license: MIT
desc:
  cn: 飞书/Lark 开放平台命令行工具
  en: A command-line tool for Lark/Feishu Open Platform
x:
  pkg:
    exist: true
  source: https://github.com/larksuite/cli
rule:
  /x:
    cmd: x pkg use lark-cli
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S lark-cli-bin
    reference: https://aur.archlinux.org/packages/lark-cli-bin
  /npm:
    cmd: npm install -g @larksuite/cli
    reference: https://github.com/larksuite/cli?tab=readme-ov-file#install-cli
    dsnap: '@larksuite/cli'
binlist:
  - lark-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
