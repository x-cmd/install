lang: Go
homepage: https://github.com/larksuite/cli
license: MIT
desc:
  cn: 飞书/Lark 开放平台命令行工具
  en: A command-line tool for Lark/Feishu Open Platform
  cs: Nástroj příkazové řádky pro open platformu Lark/Feishu
  de: Ein Kommandozeilenwerkzeug für die Lark/Feishu Open Platform
  es: Una herramienta de línea de comandos para Lark/Feishu Open Platform
  fr: Un outil en ligne de commande pour la plateforme ouverte Lark/Feishu
  id: Alat baris perintah untuk Open Platform Lark/Feishu
  it: Uno strumento da riga di comando per Lark/Feishu Open Platform
  ja: Lark/Feishu オーププラットフォーム向けのコマンドラインツール
  ko: Lark/Feishu 오픈 플랫폼을 위한 명령줄 도구
  pl: Narzędzie wiersza poleceń dla platformy otwartej Lark/Feishu
  pt: Uma ferramenta de linha de comando para a Plataforma Aberta do Lark/Feishu
  ro: Un instrument de linie de comandă pentru platforma deschisă Lark/Feishu
  ru: Инструмент командной строки для открытой платформы Lark/Feishu
  th: เครื่องมือบรรทัดคำสั่งสำหรับ Lark/Feishu Open Platform
  tr: Lark/Feishu Açık Platformu için komut satırı aracı
  uk: Інструмент командного рядка для відкритої платформи Lark/Feishu
  vi: Công cụ dòng lệnh cho Open Platform Lark/Feishu
x:
  source: https://github.com/larksuite/cli
  yay: lark-cli-bin
  npm: "@larksuite/cli"
rule:
  /x:
    cmd: x pkg use lark-cli
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S lark-cli-bin
    reference: https://aur.archlinux.org/packages/lark-cli-bin
  /npm:
    cmd: npm install -g @larksuite/cli
    reference: https://github.com/larksuite/cli?tab=readme-ov-file#install-cli
    dsnap: '@larksuite/cli'
binlist:
  - lark-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
