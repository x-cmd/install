lang: 'C'
homepage: https://github.com/neomutt/neomutt
license: 'GPL-2.0'
desc:
  cn: 为老牌邮件客户端注入新特性的终端邮件工具
  en: '✉️ Teaching an Old Dog New Tricks -- IRC: #neomutt on irc.libera.chat'
x:
  source: https://github.com/neomutt/neomutt
  eget: https://github.com/neomutt/neomutt
rule:
  /eget:
    cmd: x eget neomutt/neomutt
    reference: https://github.com/neomutt/neomutt
binlist:
  - 'neomutt'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.5 MB
          rating: 1
          desc:
            cn: 约 9.5 MB（估算）
            en: ~9.5 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
