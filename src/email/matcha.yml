lang: 'Go'
homepage: https://github.com/floatpane/matcha
license: 'MIT'
desc:
  cn: 基于 Go 和 Bubble Tea 构建的终端邮件客户端,收发邮件无需离开命令行
  en: 'A beautiful and functional email client for your terminal, built with Go and the charming Bubble Tea TUI library. Never leave your command line to check your inbox or send an email again!'
x:
  source: https://github.com/floatpane/matcha
  eget: https://github.com/floatpane/matcha
rule:
  /eget:
    cmd: x eget floatpane/matcha
    reference: https://github.com/floatpane/matcha
binlist:
  - 'matcha'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
