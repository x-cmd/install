lang: Go
homepage: https://github.com/charmbracelet/pop
license: MIT
desc:
  cn: 从你的终端发送电子邮件
  en: Send emails from your terminal
x:
  source: https://github.com/charmbracelet/pop
  eget: https://github.com/charmbracelet/pop
rule:
  /eget:
    cmd: x eget charmbracelet/pop
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install pop
    reference: https://github.com/charmbracelet/pop?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S charm-pop-bin
    reference: https://github.com/charmbracelet/pop?tab=readme-ov-file#installation
  /nixpkgs:
    cmd: nix-env -iA nixpkgs.pop
    reference: https://github.com/charmbracelet/pop?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/charmbracelet/pop@latest
    reference: https://github.com/charmbracelet/pop?tab=readme-ov-file#installation
    dsnap: github.com/charmbracelet/pop@latest
binlist:
- pop

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
