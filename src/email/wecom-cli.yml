lang: Rust
homepage: https://github.com/WecomTeam/wecom-cli
license: MIT
desc:
  cn: 企业微信开放平台命令行工具
  en: A command-line tool for WeCom Open Platform
x:
  source: https://github.com/WecomTeam/wecom-cli
  npm: "@wecom/cli"
rule:
  /x:
    cmd: x pkg use wecom-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g @wecom/cli
    reference: https://github.com/larksuite/cli?tab=readme-ov-file#install-cli
    dsnap: '@wecom/cli'
binlist:
  - wecom-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.1 MB
          rating: 1
          desc:
            cn: 约 2.1 MB（估算）
            en: ~2.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
