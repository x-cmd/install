lang: Rust
homepage: https://github.com/WecomTeam/wecom-cli
license: MIT
desc:
  cn: 企业微信开放平台命令行工具
  en: A command-line tool for WeCom Open Platform
x:
  pkg:
    exist: true
  source: https://github.com/WecomTeam/wecom-cli
rule:
  /x:
    cmd: x pkg use wecom-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g @wecom/cli
    reference: https://github.com/larksuite/cli?tab=readme-ov-file#install-cli
    dsnap: '@wecom/cli'
binlist:
  - wecom-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
