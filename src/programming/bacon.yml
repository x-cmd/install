lang: 'Rust'
homepage: https://github.com/Canop/bacon
license: 'AGPL-3.0'
desc:
  cn: 后台代码检查器
  en: 'background code checker'
  cs: Kontrolor kódu na pozadí
  de: Hintergrund-Codeprüfer
  es: Verificador de código en segundo plano
  fr: Vérificateur de code en arrière-plan
  id: Pemeriksa kode latar belakang
  it: Verificatore di codice in background
  ja: バックグラウンドのコードチェッカー
  ko: 백그라운드 코드 검사기
  pl: Kontroler kodu w tle
  pt: Verificador de código em segundo plano
  ro: Verificator de cod în fundal
  ru: Фоновая проверка кода
  th: ตัวตรวจสอบโค้ดแบบเบื้องหลัง
  tr: Arka planda çalışan kod denetleyici
  uk: Фонова перевірка коду
  vi: Trình kiểm tra mã nguồn chạy nền
x:
  source: https://github.com/Canop/bacon
  eget: Canop/bacon
rule:
  /eget:
    cmd: x eget Canop/bacon
    reference: https://github.com/Canop/bacon
binlist:
  - 'bacon'
# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 监视 Rust 源码文件 + cargo metadata
          en: Watches Rust source files + cargo metadata
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 456 KB
          rating: 1
          desc:
            cn: 约 456 KB（估算）
            en: ~456 KB estimated
      paths:
        data: []
        config:
          - "bacon.toml"
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 100 MB
        desc:
          cn: 大型项目 ~100 MB
          en: ~100 MB on large projects
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 1
        desc:
          cn: 极低（仅文件监视）
          en: Negligible (file watching only)
      peak:
        rating: 2
        desc:
          cn: cargo check 触发时占用多核
          en: Saturates cores when cargo check fires
