  en: 'Mass renamer TUI written in Rust'
  cs: TUI pro hromadné přejmenování napsaný v Rustu
  de: Ein Massenumbenennungs-TUI, geschrieben in Rust
  es: TUI de renombrado masivo escrito en Rust
  fr: TUI de renommage par masse écrit en Rust
  id: TUI untuk rename massal yang ditulis dengan Rust
  it: TUI per il rinominamento di massa scritto in Rust
  ja: Rust で書かれた一括名変更 TUI
  ko: Rust로 작성된 일괄 이름 변경 TUI
  pl: TUI do zbiorczego zmieniania nazw napisane w Rust
  pt: TUI de renomeação em massa escrita em Rust
  ro: TUI pentru redenumire în masă scris în Rust
  ru: TUI для массового переименования, написанный на Rust
  th: TUI สำหรับเปลี่ยนชื่อแบบกลุ่ม พัฒนาด้วย Rust
  tr: Rust ile yazılmış toplu yeniden adlandırma TUI'si
  uk: TUI для масового перейменування, написаний на Rust
  vi: TUI đổi tên hàng loạt được viết bằng Rust
x:
  source: https://github.com/linkdd/regname
  eget: linkdd/regname
rule:
  /eget:
    cmd: x eget linkdd/regname
    reference: https://github.com/linkdd/regname
binlist:
  - 'regname'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 24 KB
          rating: 1
          desc:
            cn: 约 24 KB（估算）
            en: ~24 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
