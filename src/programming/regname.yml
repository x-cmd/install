lang: 'Rust'
homepage: 'https://github.com/linkdd/regname'
license: 'MIT'
desc:
  cn: Rust 编写的批量重命名 TUI
  en: 'Mass renamer TUI written in Rust'
x:
  source: https://github.com/linkdd/regname
  eget: https://github.com/linkdd/regname
rule:
  /eget:
    cmd: x eget linkdd/regname
    reference: https://github.com/linkdd/regname
binlist:
  - 'regname'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 24 KB
          rating: 1
          desc:
            cn: 约 24 KB（估算）
            en: ~24 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
