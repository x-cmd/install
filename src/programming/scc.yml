lang: Go
desc:
  cn: 一个非常快速、准确的代码计数器
  en: A very fast, accurate code counter
homepage: https://github.com/boyter/scc
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/boyter/scc
  eget: https://github.com/boyter/scc
rule:
  /x:
    cmd: x pkg use scc
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget boyter/scc
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/boyter/scc@master
    reference: https://github.com/boyter/scc?tab=readme-ov-file#go-get
    dsnap: github.com/boyter/scc@master
  /snap:
    cmd: sudo snap install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#snap
  darwin/port:
    cmd: sudo port install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#macports
  (win|wsl2)/scoop:
    cmd: scoop install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#scoop
  (win|wsl2)/choco:
    cmd: choco install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#chocolatey
  freebsd/pkg:
    cmd: pkg install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#freebsd
  arch/yay:
    cmd: yay -S scc
    reference: https://aur.archlinux.org/packages/scc
binlist:
- scc

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
