lang: Go
desc:
  cn: 一个非常快速、准确的代码计数器
  en: A very fast, accurate code counter
homepage: https://github.com/boyter/scc
license: MIT
x:
  source: https://github.com/boyter/scc
  eget: https://github.com/boyter/scc
  snap: scc
  port: scc
  scoop: scc
  choco: scc
  powershell: scc
  yay: scc
  go: github.com/boyter/scc@master
  pkg: scc
rule:
  /x:
    cmd: x pkg use scc
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget boyter/scc
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/boyter/scc@master
    reference: https://github.com/boyter/scc?tab=readme-ov-file#go-get
    dsnap: github.com/boyter/scc@master
  /snap:
    cmd: sudo snap install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#snap
  darwin/port:
    cmd: sudo port install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#macports
  (win|wsl2)/scoop:
    cmd: scoop install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#scoop
  (win|wsl2)/choco:
    cmd: choco install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#chocolatey
  freebsd/pkg:
    cmd: pkg install scc
    reference: https://github.com/boyter/scc?tab=readme-ov-file#freebsd
  arch/yay:
    cmd: yay -S scc
    reference: https://aur.archlinux.org/packages/scc
binlist:
- scc

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 MB
          rating: 2
          desc:
            cn: 安装 17 MB
            en: 17 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
