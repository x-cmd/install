lang: Python
homepage: https://github.com/royreznik/rexi
license: MIT
desc:
  en: Terminal UI for Regex Testing
  cn: 正则表达式测试的终端 UI
x:
  source: https://github.com/royreznik/rexi
  eget: https://github.com/royreznik/rexi
rule:
  /eget:
    cmd: x eget royreznik/rexi
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install rexi
    reference: https://github.com/royreznik/rexi?tab=readme-ov-file#installation
    dsnap: rexi
binlist:
- rexi

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
