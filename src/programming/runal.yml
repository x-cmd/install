lang: 'Go'
homepage: https://github.com/emprcl/runal
license: 'MIT'
desc:
  cn: 面向终端的创意编程环境
  en: 'a creative coding environment for the terminal :fireworks:'
x:
  source: https://github.com/emprcl/runal
  eget: https://github.com/emprcl/runal
rule:
  /eget:
    cmd: x eget emprcl/runal
    reference: https://github.com/emprcl/runal
binlist:
  - 'runal'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
