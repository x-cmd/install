lang: 'Go'
homepage: https://github.com/emprcl/runal
license: 'MIT'
desc:
  cn: 面向终端的创意编程环境
  en: 'a creative coding environment for the terminal :fireworks:'
x:
  source: https://github.com/emprcl/runal
  eget: https://github.com/emprcl/runal
rule:
  /eget:
    cmd: x eget emprcl/runal
    reference: https://github.com/emprcl/runal
binlist:
- 'runal'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
