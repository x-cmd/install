lang: 'Rust'
homepage: 'https://github.com/godzie44/BugStalker'
license: 'MIT'
desc:
  cn: 面向 Linux x86-64 的 Rust 调试器
  en: 'Rust debugger for Linux x86-64'
  cs: Ladicí nástroj Rust pro Linux x86-64
  de: Rust-Debugger für Linux x86-64
  es: Depurador de Rust para Linux x86-64
  fr: Débogueur Rust pour Linux x86-64
  id: Debugger Rust untuk Linux x86-64
  it: Debugger Rust per Linux x86-64
  ja: Linux x86-64 用の Rust デバッガー
  ko: Linux x86-64용 Rust 디버거
  pl: Debugger Rust dla Linux x86-64
  pt: Depurador Rust para Linux x86-64
  ro: Depurător Rust pentru Linux x86-64
  ru: Отладчик Rust для Linux x86-64
  th: ตัวดีบัก Rust สำหรับ Linux x86-64
  tr: Linux x86-64 için Rust hata ayıklayıcı
  uk: Відладчик Rust для Linux x86-64
  vi: Trình gỡ lỗi Rust cho Linux x86-64
x:
  source: https://github.com/godzie44/BugStalker
  eget: godzie44/BugStalker
rule:
  /eget:
    cmd: x eget godzie44/BugStalker
    reference: https://github.com/godzie44/BugStalker
binlist:
  - 'bugstalker'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.8 MB
          rating: 1
          desc:
            cn: 约 1.8 MB（估算）
            en: ~1.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
