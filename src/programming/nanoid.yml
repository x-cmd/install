lang: JavaScript
homepage: https://github.com/ai/nanoid
license: MIT
desc:
  cn: 一个小巧、安全、URL 友好、唯一的 JavaScript 字符串 ID 生成器
  en: A tiny, secure, URL-friendly, unique string ID generator for JavaScript
x:
  pkg:
    exist: true
  source: https://github.com/ai/nanoid
rule:
  /x:
    cmd: x pkg use nanoid
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g nanoid
    reference: https://github.com/ai/nanoid?tab=readme-ov-file#install
    dsnap: nanoid
binlist:
- nanoid

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
