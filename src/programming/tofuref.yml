lang: 'Python'
homepage: https://github.com/djetelina/tofuref
license: 'MIT'
desc:
  cn: OpenTofu/Terraform provider 注册表的 TUI
  en: 'TUI for OpenTofu/Terraform provider registry'
x:
  source: https://github.com/djetelina/tofuref
  eget: https://github.com/djetelina/tofuref
rule:
  /eget:
    cmd: x eget djetelina/tofuref
    reference: https://github.com/djetelina/tofuref
binlist:
  - 'tofuref'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
