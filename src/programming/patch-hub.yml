lang: 'Rust'
homepage: 'https://github.com/kworkflow/patch-hub'
license: 'GPL-2.0'
desc:
  cn: 简化 Linux 开发者与 lore.kernel.org 归档补丁交互的 TUI
  en: 'patch-hub is a TUI that streamlines the interaction of Linux developers with patches archived on lore.kernel.org'
x:
  source: https://github.com/kworkflow/patch-hub
  eget: https://github.com/kworkflow/patch-hub
rule:
  /eget:
    cmd: x eget kworkflow/patch-hub
    reference: https://github.com/kworkflow/patch-hub
binlist:
  - 'patch-hub'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 251 KB
          rating: 1
          desc:
            cn: 约 251 KB（估算）
            en: ~251 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
