lang: 'Rust'
homepage: 'https://github.com/kworkflow/patch-hub'
license: 'GPL-2.0'
desc:
  cn: 简化 Linux 开发者与 lore.kernel.org 归档补丁交互的 TUI
  en: 'patch-hub is a TUI that streamlines the interaction of Linux developers with patches archived on lore.kernel.org'
  cs: patch-hub je TUI, které usnadňuje práci vývojářů Linuxu s patchi archivovanými na lore.kernel.org
  de: patch-hub ist eine TUI, die die Interaktion von Linux-Entwicklern mit auf lore.kernel.org archivierten Patches vereinfacht
  es: patch-hub es una TUI que agiliza la interacción de los desarrolladores de Linux con los parches archivados en lore.kernel.org
  fr: patch-hub est une TUI qui simplifie l'interaction des développeurs Linux avec les correctifs archivés sur lore.kernel.org
  id: patch-hub adalah TUI yang menyederhanakan interaksi pengembang Linux dengan patch yang diarsipkan di lore.kernel.org
  it: patch-hub è una TUI che semplifica l'interazione degli sviluppatori Linux con le patch archiviate su lore.kernel.org
  ja: patch-hub は、lore.kernel.org にアーカイブされたパッチと Linux 開発者がやり取りするのを簡素化する TUI です
  ko: patch-hub는 lore.kernel.org에 보관된 패치와 Linux 개발자의 상호작용을 간소화하는 TUI입니다
  pl: patch-hub to TUI ułatwiający pracę programistów Linuksa z poprawkami archiwizowanymi na lore.kernel.org
  pt: patch-hub é uma TUI que facilita a interação de desenvolvedores Linux com patches arquivados no lore.kernel.org
  ro: patch-hub este o TUI care facilitează interacțiunea dezvătorilor Linux cu patch-uri arhivate pe lore.kernel.org
  ru: patch-hub — это TUI, упрощающий взаимодействие разработчиков Linux с патчами, архивированными на lore.kernel.org
  th: patch-hub คือ TUI ที่ทำให้นักพัฒนา Linux ทำงานกับแพตช์ที่เก็บไว้ใน lore.kernel.org ได้ง่ายขึ้น
  tr: patch-hub, Linux geliştiricilerinin lore.kernel.org'da arşivlenen yamalar ile etkileşimini kolaylaştıran bir TUI'dir
  uk: patch-hub — це TUI, яка спрощує взаємодію розробників Linux із патчами, архівованими на lore.kernel.org
  vi: patch-hub là một TUI giúp đơn giản hóa việc tương tác của nhà phát triển Linux với các bản vá được lưu trên lore.kernel.org
x:
  source: https://github.com/kworkflow/patch-hub
  eget: kworkflow/patch-hub
rule:
  /eget:
    cmd: x eget kworkflow/patch-hub
    reference: https://github.com/kworkflow/patch-hub
binlist:
- 'patch-hub'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
