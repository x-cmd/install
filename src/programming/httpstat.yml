lang: Python
homepage: https://github.com/reorx/httpstat
license: MIT
desc:
  cn: httpstat 是一个命令行工具，可在终端中以可视化方式显示 `curl` 请求的统计信息。
  en: httpstat is a CLI tool that displays curl request statistics in a visually in the terminal.
x:
  source: https://github.com/reorx/httpstat
  eget: https://github.com/reorx/httpstat
rule:
  /eget:
    cmd: x eget reorx/httpstat
    reference: https://x-cmd.com/mod/eget
  /wet:
    cmd: wget https://raw.githubusercontent.com/reorx/httpstat/master/httpstat.py
    reference: https://github.com/reorx/httpstat?tab=readme-ov-file#installation
  /pip:
    cmd: pip install httpstat
    reference: https://github.com/reorx/httpstat?tab=readme-ov-file#installation
    dsnap: httpstat
  darwin/brew:
    cmd: brew install httpstat
    reference: https://github.com/reorx/httpstat?tab=readme-ov-file#installation
binlist:
- httpstat

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
