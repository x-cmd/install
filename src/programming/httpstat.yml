lang: Python
homepage: https://github.com/reorx/httpstat
license: MIT
desc:
  cn: httpstat 是一个命令行工具，可在终端中以可视化方式显示 `curl` 请求的统计信息。
  en: httpstat is a CLI tool that displays curl request statistics in a visually in the terminal.
x:
  source: https://github.com/reorx/httpstat
  eget: https://github.com/reorx/httpstat
rule:
  /eget:
    cmd: x eget reorx/httpstat
    reference: https://x-cmd.com/mod/eget
  /wet:
    cmd: wget https://raw.githubusercontent.com/reorx/httpstat/master/httpstat.py
    reference: https://github.com/reorx/httpstat?tab=readme-ov-file#installation
  /pip:
    cmd: pip install httpstat
    reference: https://github.com/reorx/httpstat?tab=readme-ov-file#installation
    dsnap: httpstat
  darwin/brew:
    cmd: brew install httpstat
    reference: https://github.com/reorx/httpstat?tab=readme-ov-file#installation
binlist:
- httpstat

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 KB
          rating: 1
          desc:
            cn: 安装 8 KB
            en: 8 KB install
        download:
          estimate: 8 KB
          desc:
            cn: 约 8 KB 下载 (whl)
            en: ~8 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
