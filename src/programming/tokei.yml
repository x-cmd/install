lang: Rust
homepage: https://github.com/XAMPPRocky/tokei
desc:
  cn: tokei 是一个用 Rust 编写的代码行数统计工具
  en: Tokei is a line count tool written in Rust
x:
  pkg:
    exist: true
  source: https://github.com/XAMPPRocky/tokei
rule:
  /x:
    cmd: x pkg use tokei
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use tokei
    reference: https://github.com/gasuketsu/asdf-tokei
  darwin/brew:
    cmd: brew install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  alpine/apk:
    cmd: sudo apk add tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  arch/pacman:
    cmd: sudo pacman -S tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  fedora/dnf:
    cmd: sudo dnf install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  opensuse/zypper:
    cmd: sudo zypper install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  void/xbps:
    cmd: sudo xbps-install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  freebsd/pkg:
    cmd: pkg install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  netbsd/pkgin:
    cmd: pkgin install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  nix/nixpkgs:
    cmd: nix-env -i tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  darwin/port:
    cmd: sudo port selfupdate && sudo port install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  (win|wsl2)/winget:
    cmd: x winget install XAMPPRocky.tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  (win|wsl2)/scoop:
    cmd: x scoop install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  /cargo:
    cmd: cargo install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
    dsnap: tokei
  /conda:
    cmd: conda install -c conda-forge tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
binlist:
- tokei
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
