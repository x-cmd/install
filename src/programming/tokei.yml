lang: Rust
homepage: https://github.com/XAMPPRocky/tokei
desc:
  cn: tokei 是一个用 Rust 编写的代码行数统计工具
  en: Tokei is a line count tool written in Rust
  cs: Tokei je nástroj na počítání řádků kódu napsaný v Rustu
  de: Tokei ist ein in Rust geschriebenes Werkzeug zum Zählen von Codezeilen
  es: Tokei es una herramienta de conteo de líneas de código escrita en Rust
  fr: Tokei est un outil de comptage de lignes de code écrit en Rust
  id: Tokei adalah alat penghitung baris kode yang ditulis dengan Rust
  it: Tokei è uno strumento di conteggio delle righe di codice scritto in Rust
  ja: Tokei は Rust で書かれた行数カウントツールです
  ko: Tokei는 Rust로 작성된 코드 줄 수 계산 도구입니다
  pl: Tokei to narzędzie do liczenia linii kodu napisane w Rust
  pt: Tokei é uma ferramenta de contagem de linhas de código escrita em Rust
  ro: Tokei este un instrument de numărare a liniilor de cod scris în Rust
  ru: Tokei — это инструмент подсчёта строк кода, написанный на Rust
  th: Tokei คือเครื่องมือนับบรรทัดโค้ดที่เขียนด้วย Rust
  tr: Tokei, Rust ile yazılmış bir satır sayma aracıdır
  uk: Tokei — це інструмент підрахунку рядків коду, написаний на Rust
  vi: Tokei là công cụ đếm dòng mã được viết bằng Rust
x:
  source: https://github.com/XAMPPRocky/tokei
  dnf: tokei
  brew: tokei
  pacman: tokei
  apk: tokei
  zypper: tokei
  port: tokei
  xbps: tokei
  scoop: tokei
  winget: XAMPPRocky.tokei
  cargo: tokei
  asdf: tokei
rule:
  /x:
    cmd: x pkg use tokei
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use tokei
    reference: https://github.com/gasuketsu/asdf-tokei
  darwin/brew:
    cmd: brew install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  alpine/apk:
    cmd: sudo apk add tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  arch/pacman:
    cmd: sudo pacman -S tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  fedora/dnf:
    cmd: sudo dnf install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  opensuse/zypper:
    cmd: sudo zypper install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  void/xbps:
    cmd: sudo xbps-install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  freebsd/pkg:
    cmd: pkg install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  netbsd/pkgin:
    cmd: pkgin install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  nix/nixpkgs:
    cmd: nix-env -i tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  darwin/port:
    cmd: sudo port selfupdate && sudo port install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  (win|wsl2)/winget:
    cmd: x winget install XAMPPRocky.tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  (win|wsl2)/scoop:
    cmd: x scoop install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
  /cargo:
    cmd: cargo install tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
    dsnap: tokei
  /conda:
    cmd: conda install -c conda-forge tokei
    reference: https://github.com/XAMPPRocky/tokei#installation
binlist:
- tokei
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 159 KB
          rating: 1
          desc:
            cn: 约 159 KB（估算）
            en: ~159 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
