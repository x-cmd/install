lang: Perl
homepage: https://github.com/AlDanial/cloc
license: GPL-2.0
desc:
  cn: 计算代码行数，对许多编程语言中的空白行、注释行和源代码的物理行进行计数
  en: cloc counts blank lines, comment lines, and physical lines of source code in many programming languages.
x:
  source: https://github.com/AlDanial/cloc
  eget: https://github.com/AlDanial/cloc
  apt: cloc
  dnf: cloc
  brew: cloc
  pacman: cloc
  apk: cloc
  yum: cloc
  port: cloc
  emerge: -av
  scoop: cloc
  choco: cloc
  winget: AlDanial.Cloc
  powershell: cloc
  npm: cloc
rule:
  /eget:
    cmd: x eget AlDanial/cloc
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install -g cloc
    reference: https://www.npmjs.com/package/cloc
    dsnap: cloc
  darwin/brew:
    cmd: brew install cloc
    reference: https://formulae.brew.sh/formula/cloc#default
  debian/apt:
    cmd: sudo apt install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
    dsnap: cloc
  ubuntu/apt:
    cmd: sudo apt install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
    dsnap: cloc
  alpine/apk:
    cmd: sudo apk add cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
    dsnap: cloc
  arch/pacman:
    cmd: sudo pacman -S cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
  kali/apt:
    cmd: sudo apt install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
    dsnap: cloc
  rhel/yum:
    cmd: sudo yum install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
  fedora/yum:
    cmd: sudo yum install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
  fedora/dnf:
    cmd: sudo dnf install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
    dsnap: cloc
  raspbian/apt:
    cmd: sudo apt install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
  gentoo/emerge:
    cmd: sudo emerge -av dev-util/cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
  freebsd/pkg:
    cmd: sudo pkg install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
  darwin/port:
    cmd: sudo port install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
  (win|wsl2)/scoop:
    cmd: x scoop install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
  (win|wsl2)/choco:
    cmd: x choco install cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
  (win|wsl2)/winget:
    cmd: x winget install AlDanial.Cloc
    reference: https://github.com/AlDanial/cloc?tab=readme-ov-file#install-via-package-manager
binlist:
- cloc

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 108 KB
          rating: 1
          desc:
            cn: 约 108 KB（估算）
            en: ~108 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
