lang: JavaScript
homepage: https://github.com/bigskysoftware/htmx
desc:
  cn: htmx 让你可以直接在 HTML 中使用 AJAX、CSS 过渡、WebSocket 和服务器发送事件，利用属性来实现，因此你可以以超文本的简洁性和强大功能构建现代用户界面。
  en: htmx gives you access to AJAX, CSS Transitions, WebSockets and Server Sent Events directly in HTML, using attributes, so you can build modern user interfaces with the simplicity and power of hypertext
x:
  source: https://github.com/bigskysoftware/htmx
rule:
  /npm:
    cmd: npm install htmx.org
    reference: https://htmx.org/docs/#npm
    dsnap: htmx.org
binlist:
- htmx
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
