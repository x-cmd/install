lang: JavaScript
homepage: https://github.com/yeoman/yo
license: BSD-2-Clause
desc:
  cn: 运行 Yeoman generators 的 CLI 工具
  en: CLI tool for running Yeoman generators
x:
  pkg:
    exist: true
  source: https://github.com/yeoman/yo
rule:
  /x:
    cmd: x pkg use yo
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global yo
    reference: https://github.com/yeoman/yo?tab=readme-ov-file#usage
    dsnap: yo
binlist:
- yo

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
