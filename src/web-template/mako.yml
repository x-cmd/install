lang: Python
homepage: https://github.com/sqlalchemy/mako
license: MIT
desc:
  cn: 一个高性能的模板引擎，类似于 Jinja2 或 Django 模板引擎，用于在 Python 应用程序中生成动态内容
  en: A high-performance template engine, similar to Jinja2 or the Django template engine, for generating dynamic content in Python applications
x:
  source: https://github.com/sqlalchemy/mako
rule:
  /pip:
    cmd: pip install Mako
    reference: https://www.makotemplates.org/download.html
    dsnap: Mako
binlist:
- mako

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 31 KB
          rating: 1
          desc:
            cn: 约 31 KB（估算）
            en: ~31 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
