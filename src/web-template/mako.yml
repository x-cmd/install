lang: Python
homepage: https://github.com/sqlalchemy/mako
license: MIT
desc:
  cn: 一个高性能的模板引擎，类似于 Jinja2 或 Django 模板引擎，用于在 Python 应用程序中生成动态内容
  en: A high-performance template engine, similar to Jinja2 or the Django template engine, for generating dynamic content in Python applications
x:
  source: https://github.com/sqlalchemy/mako
rule:
  /pip:
    cmd: pip install Mako
    reference: https://www.makotemplates.org/download.html
    dsnap: Mako
binlist:
- mako

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
