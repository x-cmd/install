homepage: https://github.com/jondot/hygen
license: MIT
desc:
  en: hygen is the simple, fast, and scalable code generator that lives in your project.
  cn: hygen 是简单、快速、可扩展的代码生成器，它存在于您的项目中。
lang: JavaScript
x:
  source: https://github.com/jondot/hygen
  eget: https://github.com/jondot/hygen
  brew: hygen
  asdf: asdf
rule:
  /x:
    cmd: x pkg use hygen
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jondot/hygen
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use hygen
    reference: https://github.com/brentjanderson/asdf-hygen
  /npm:
    cmd: npm i -g hygen
    reference: https://github.com/jondot/hygen?tab=readme-ov-file#quick-start
    dsnap: hygen
  darwin/brew:
    cmd: 'brew tap jondot/tap \

      && brew install hygen

      '
    reference: https://github.com/jondot/hygen?tab=readme-ov-file#quick-start
binlist:
- hygen

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 19 MB
          rating: 2
          desc:
            cn: 安装 19 MB
            en: 19 MB install
        download:
          estimate: 19 MB
          desc:
            cn: 约 19 MB 下载 (linux/arm64)
            en: ~19 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
