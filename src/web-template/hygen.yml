homepage: https://github.com/jondot/hygen
license: MIT
desc:
  en: hygen is the simple, fast, and scalable code generator that lives in your project.
  cn: hygen 是简单、快速、可扩展的代码生成器，它存在于您的项目中。
lang: JavaScript
x:
  pkg:
    exist: true
  source: https://github.com/jondot/hygen
  eget: https://github.com/jondot/hygen
rule:
  /x:
    cmd: x pkg use hygen
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jondot/hygen
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use hygen
    reference: https://github.com/brentjanderson/asdf-hygen
  /npm:
    cmd: npm i -g hygen
    reference: https://github.com/jondot/hygen?tab=readme-ov-file#quick-start
    dsnap: hygen
  darwin/brew:
    cmd: 'brew tap jondot/tap \

      && brew install hygen

      '
    reference: https://github.com/jondot/hygen?tab=readme-ov-file#quick-start
binlist:
- hygen

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
