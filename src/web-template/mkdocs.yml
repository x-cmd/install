lang: Python
homepage: https://github.com/mkdocs/mkdocs
license: BSD-2-Clause
desc:
  cn: MkDocs 是一个快速、简单、华丽的静态站点生成器，适用于构建项目文档
  en: MkDocs is a fast, simple and downright gorgeous static site generator that's geared towards building project documentation
  cs: MkDocs je rychlý, jednoduchý a opravdu krásný generátor statických webů, zaměřený na tvorbu projektové dokumentace
  de: MkDocs ist ein schneller, einfacher und geradezu hübscher Generator für statische Websites, der auf die Erstellung von Projektdokumentation ausgerichtet ist
  es: MkDocs es un generador de sitios estáticos rápido, sencillo y realmente precioso, orientado a crear documentación de proyectos
  fr: MkDocs est un générateur de sites statiques rapide, simple et vraiment élégant, conçu pour créer de la documentation de projet
  id: MkDocs adalah generator situs statis yang cepat, sederhana, dan pantas, yang berorientasi pada membangun dokumentasi proyek
  it: MkDocs è un generatore di siti statici veloce, semplice e davvero splendido, pensato per creare la documentazione dei progetti
  ja: MkDocs は高速で単純、そして実に美しい静的サイトジェネレーターで、プロジェクトドキュメントの構築を目的に設計されています
  ko: MkDocs는 빠르고 단순하며, 실제로 아름다운 정적 사이트 생성기로 프로젝트 문서 작성에 맞춰져 있습니다
  pl: MkDocs to szybki, prosty i prześlicznie piękny generator stron statycznych, przeznaczony do tworzenia dokumentacji projektów
  pt: MkDocs é um gerador de sites estáticos rápido, simples e realmente belo, voltado para criar documentação de projetos
  ro: MkDocs este un generator de site-uri statice rapid, simplu și cu adevărat frumos, orientat spre construirea documentației de proiect
  ru: MkDocs — быстрый, простой и по-настоящему красивый генератор статических сайтов, предназначенный для создания проектной документации
  th: MkDocs เป็นตัวสร้างเว็บไซต์แบบคงที่ที่รวดเร็ว เรียบง่าย และสวยงาม โดยมุ่งไปที่การสร้างเอกสารประกอบโปรเจกต์
  tr: MkDocs, proje belgeleri oluşturmaya yönelik hızlı, basit ve gerçekten görkemli bir statik site oluşturucudur
  uk: MkDocs — швидкий, простий і справді гарний генератор статичних сайтів, призначений для створення проєктної документації
  vi: MkDocs là trình tạo trang tĩnh nhanh, đơn giản và thực sự đẹp, được thiết kế để xây dựng tài liệu dự án
x:
  source: https://github.com/mkdocs/mkdocs
  apt: mkdocs
  dnf: mkdocs
  brew: mkdocs
  apt-get: mkdocs
  choco: mkdocs
  pip: mkdocs
rule:
  /x:
    cmd: x pkg use mkdocs
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install mkdocs
    reference: https://www.mkdocs.org/getting-started/#installation
    dsnap: mkdocs
  darwin/brew:
    cmd: brew install mkdocs
    reference: https://formulae.brew.sh/formula/mkdocs#default
  win/pip:
    cmd: python -m pip install mkdocs
    reference: https://www.mkdocs.org/user-guide/installation/#installing-mkdocs
  debian/apt:
    cmd: sudo apt-get install mkdocs
    reference: https://command-not-found.com/mkdocs
  ubuntu/apt:
    cmd: sudo apt-get install mkdocs
    reference: https://command-not-found.com/mkdocs
  kali/apt:
    cmd: sudo apt-get install mkdocs
    reference: https://command-not-found.com/mkdocs
    dsnap: mkdocs
  fedora/dnf:
    cmd: sudo dnf install mkdocs
    reference: https://command-not-found.com/mkdocs
  (win|wsl2)/choco:
    cmd: x choco install mkdocs
    reference: https://community.chocolatey.org/packages/mkdocs
binlist:
- mkdocs

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 42 KB
          rating: 1
          desc:
            cn: 约 42 KB（估算）
            en: ~42 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
