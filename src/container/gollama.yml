lang: 'Go'
homepage: https://github.com/sammcj/gollama
license: 'MIT'
desc:
  cn: 管理 Ollama 模型的 Go 工具
  en: 'Go manage your Ollama models'
x:
  source: https://github.com/sammcj/gollama
  eget: https://github.com/sammcj/gollama
rule:
  /eget:
    cmd: x eget sammcj/gollama
    reference: https://github.com/sammcj/gollama
binlist:
- 'gollama'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 514 KB
          rating: 1
          desc:
            cn: 约 514 KB（估算）
            en: ~514 KB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
