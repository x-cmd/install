lang: 'Go'
homepage: https://github.com/sammcj/gollama
license: 'MIT'
desc:
  cn: 管理 Ollama 模型的 Go 工具
  en: 'Go manage your Ollama models'
x:
  source: https://github.com/sammcj/gollama
  eget: https://github.com/sammcj/gollama
rule:
  /eget:
    cmd: x eget sammcj/gollama
    reference: https://github.com/sammcj/gollama
binlist:
  - 'gollama'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
