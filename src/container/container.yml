lang: Swift
homepage: https://github.com/apple/container
license: Apache-2.0
desc:
  cn: Apple 官方工具，通过轻量级虚拟机在 macOS 上原生创建和运行 Linux 容器，针对 Apple Silicon 优化
  en: Apple's tool for creating and running Linux containers using lightweight virtual machines on macOS, optimized for Apple Silicon
x:
  source: https://github.com/apple/container
rule:
  darwin/brew:
    cmd: brew install container
    reference: https://formulae.brew.sh/formula/container#default
binlist:
  - container

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
