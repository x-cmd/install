lang: Go
homepage: https://github.com/goodwithtech/dockle
license: Apache-2.0
desc:
  cn: 容器镜像安全 Linter，帮助构建最佳实践的 Docker 镜像，易于上手
  en: Container Image Linter for Security, Helping build the Best-Practice Docker Image, Easy to start
x:
  source: https://github.com/goodwithtech/dockle
  eget: https://github.com/goodwithtech/dockle
  brew: goodwithtech/r/dockle
  yay: dockle
  asdf: asdf
rule:
  /eget:
    cmd: x eget goodwithtech/dockle
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install goodwithtech/r/dockle
    reference: https://github.com/goodwithtech/dockle?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S dockle
    reference: https://aur.archlinux.org/packages/dockle
  /asdf:
    cmd: x asdf use dockle
    reference: https://github.com/goodwithtech/dockle?tab=readme-ov-file#installation
binlist:
- dockle

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/arm64)
            en: ~7 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
