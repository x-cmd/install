lang: Go
homepage: https://github.com/goodwithtech/dockle
license: Apache-2.0
desc:
  cn: 容器镜像安全 Linter，帮助构建最佳实践的 Docker 镜像，易于上手
  en: Container Image Linter for Security, Helping build the Best-Practice Docker Image, Easy to start
x:
  source: https://github.com/goodwithtech/dockle
  eget: https://github.com/goodwithtech/dockle
rule:
  /eget:
    cmd: x eget goodwithtech/dockle
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install goodwithtech/r/dockle
    reference: https://github.com/goodwithtech/dockle?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S dockle
    reference: https://aur.archlinux.org/packages/dockle
  /asdf:
    cmd: x asdf use dockle
    reference: https://github.com/goodwithtech/dockle?tab=readme-ov-file#installation
binlist:
- dockle

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
