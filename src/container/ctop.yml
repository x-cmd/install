lang: Go
homepage: https://github.com/bcicen/ctop
license: MIT
desc:
  cn: 简洁的命令行容器监控
  en: concise commandline monitoring for containers
x:
  pkg:
    exist: true
  source: https://github.com/bcicen/ctop
  eget: https://github.com/bcicen/ctop
rule:
  /eget:
    cmd: x eget bcicen/ctop
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use ctop
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use ctop
    reference: https://github.com/NeoHsu/asdf-ctop
  debian/apt:
    cmd: 'sudo apt-get install ca-certificates curl gnupg lsb-release

      curl -fsSL https://azlux.fr/repo.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/azlux-archive-keyring.gpg

      echo \

      "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/azlux-archive-keyring.gpg] http://packages.azlux.fr/debian \

      $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/azlux.list >/dev/null

      sudo apt-get update

      sudo apt-get install docker-ctop

      '
    reference: https://github.com/bcicen/ctop?tab=readme-ov-file#debianubuntu
    dsnap: docker-ctop
  ubuntu/apt:
    cmd: 'sudo apt-get install ca-certificates curl gnupg lsb-release

      curl -fsSL https://azlux.fr/repo.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/azlux-archive-keyring.gpg

      echo \

      "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/azlux-archive-keyring.gpg] http://packages.azlux.fr/debian \

      $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/azlux.list >/dev/null

      sudo apt-get update

      sudo apt-get install docker-ctop

      '
    reference: https://github.com/bcicen/ctop?tab=readme-ov-file#debianubuntu
    dsnap: docker-ctop
  darwin/brew:
    cmd: brew install ctop
    reference: https://github.com/bcicen/ctop?tab=readme-ov-file#os-x
  darwin/port:
    cmd: sudo port install ctop
    reference: https://github.com/bcicen/ctop?tab=readme-ov-file#os-x
  darwin/curl:
    cmd: 'sudo curl -Lo /usr/local/bin/ctop https://github.com/bcicen/ctop/releases/download/v0.7.7/ctop-0.7.7-darwin-amd64

      sudo chmod +x /usr/local/bin/ctop

      '
    reference: https://github.com/bcicen/ctop?tab=readme-ov-file#os-x
  /wget:
    cmd: 'sudo wget https://github.com/bcicen/ctop/releases/download/v0.7.7/ctop-0.7.7-linux-amd64 -O /usr/local/bin/ctop

      sudo chmod +x /usr/local/bin/ctop

      '
    reference: https://github.com/bcicen/ctop?tab=readme-ov-file#linux-generic
  (win|wsl2)/scoop:
    cmd: x scoop install ctop
    reference: https://github.com/bcicen/ctop?tab=readme-ov-file#windows
  arch/pacman:
    cmd: sudo pacman -S ctop
    reference: https://github.com/bcicen/ctop?tab=readme-ov-file#arch
binlist:
- ctop
