lang: Rust
homepage: https://github.com/robertpsoane/ducker
license: MIT
desc:
  en: A terminal app for managing docker containers, inspired by K9s
  cn: 受 K9s 启发的用于管理 docker 容器的终端应用程序
x:
  source: https://github.com/robertpsoane/ducker
rule:
  /cargo:
    cmd: cargo install --locked ducker
    reference: https://github.com/robertpsoane/ducker?tab=readme-ov-file#installation
    dsnap: ducker
  arch/pacman:
    cmd: pacman -S ducker
    reference: https://github.com/robertpsoane/ducker?tab=readme-ov-file#arch-linux
  darwin/brew:
    cmd: brew install ducker
    reference: https://github.com/robertpsoane/ducker?tab=readme-ov-file#brew
binlist:
- ducker

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
