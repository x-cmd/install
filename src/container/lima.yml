lang: Go
homepage: https://github.com/lima-vm/lima
license: Apache-2.0
desc:
  cn: Lima 启动具有自动文件共享和端口转发功能的 Linux 虚拟机(类似于 WSL2)
  en: Lima launches Linux virtual machines with automatic file sharing and port forwarding (similar to WSL2)
  cs: Lima spouští virtuální počítače Linux s automatickým sdílením souborů a přesměrováním portů (podobně jako WSL2)
  de: Lima startet Linux-Virtualmachines mit automatischer Dateifreigabe und Portweiterleitung (ähnlich WSL2)
  es: Lima lanza máquinas virtuales Linux con compartición automática de archivos y reenvío de puertos (similar a WSL2)
  fr: Lima lance des machines virtuelles Linux avec partage de fichiers automatique et redirection de ports (similaire à WSL2)
  id: Lima menjalankan mesin virtual Linux dengan berbagi file otomatis dan penerusan port (mirip WSL2)
  it: Lima avvia macchine virtuali Linux con condivisione file automatica e port forwarding (simile a WSL2)
  ja: Lima は自動ファイル共有とポートフォワーディングを備えた Linux 仮想マシンを起動します（WSL2 に似ています）
  ko: Lima는 자동 파일 공유와 포트 포워딩을 제공하는 Linux 가상 머신을 실행합니다 (WSL2와 유사)
  pl: Lima uruchamia maszyny wirtualne Linux z automatycznym udostępnianiem plików i przekierowaniem portów (podobnie do WSL2)
  pt: O Lima inicia máquinas virtuais Linux com compartilhamento automático de arquivos e encaminhamento de portas (semelhante ao WSL2)
  ro: Lima pornește mașini virtuale Linux cu partajare automată a fișierelor și redirecționare de porturi (similar WSL2)
  ru: Lima запускает виртуальные машины Linux с автоматическим общим доступом к файлам и переадресацией портов (аналогично WSL2)
  th: Lima เปิดเครื่องเสมือน Linux พร้อมการแชร์ไฟล์อัตโนมัติและการส่งต่อพอร์ต (คล้าย WSL2)
  tr: Lima, otomatik dosya paylaşımı ve port yönlendirme ile Linux sanal makinelerini başlatır (WSL2'ye benzer)
  uk: Lima запускає віртуальні машини Linux з автоматичним спільним доступом до файлів і переадресацією портів (аналогічно WSL2)
  vi: Lima khởi chạy máy ảo Linux với tự động chia sẻ tệp và chuyển tiếp cổng (tương tự WSL2)
x:
  source: https://github.com/lima-vm/lima
  eget: lima-vm/lima
  brew: lima
  port: lima
  yay: lima
  asdf: lima
rule:
  /eget:
    cmd: x eget lima-vm/lima
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use lima
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use lima
    reference: https://github.com/CrouchingMuppet/asdf-lima
  arch/yay:
    cmd: yay -S lima
    reference: https://aur.archlinux.org/packages/lima
  darwin/brew:
    cmd: brew install lima
    reference: https://github.com/lima-vm/lima?tab=readme-ov-file#getting-started
  darwin/port:
    cmd: sudo port selfupdate && sudo port install lima
    reference: https://lima-vm.io/docs/installation/
  /nixpkgs:
    cmd: nix-env -i lima
    reference: https://lima-vm.io/docs/installation/
binlist:
- lima

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
