lang: Python
homepage: https://github.com/TomasTomecek/sen
license: MIT
desc:
  en: Terminal User Interface for containers
  cn: 容器的终端用户界面
x:
  source: https://github.com/TomasTomecek/sen
rule:
  /pip3:
    cmd: pip3 install sen
    reference: https://github.com/TomasTomecek/sen?tab=readme-ov-file#installation-and-running-sen
binlist:
- sen

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 KB
          rating: 1
          desc:
            cn: 约 10 KB（估算）
            en: ~10 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
