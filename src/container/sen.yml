lang: Python
homepage: https://github.com/TomasTomecek/sen
license: MIT
desc:
  en: Terminal User Interface for containers
  cn: 容器的终端用户界面
x:
  source: https://github.com/TomasTomecek/sen
rule:
  /pip3:
    cmd: pip3 install sen
    reference: https://github.com/TomasTomecek/sen?tab=readme-ov-file#installation-and-running-sen
binlist:
- sen

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
