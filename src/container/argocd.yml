lang: Go
homepage: https://github.com/argoproj/argo-cd
license: Apache-2.0
desc:
  cn: Argo CD 是一个声明性的、针对库伯内特的 gitOps 持续交付工具
  en: Argo CD is a declarative, GitOps continuous delivery tool for Kubernetes
  cs: Argo CD je deklarativní nástroj pro průběžné doručování GitOps pro Kubernetes
  de: Argo CD ist ein deklaratives GitOps-Continuous-Delivery-Werkzeug für Kubernetes
  es: Argo CD es una herramienta declarativa de entrega continua GitOps para Kubernetes
  fr: Argo CD est un outil de livraison continue GitOps déclaratif pour Kubernetes
  id: Argo CD adalah alat continuous delivery GitOps yang deklaratif untuk Kubernetes
  it: Argo CD è uno strumento di continuous delivery GitOps dichiarativo per Kubernetes
  ja: Argo CD は Kubernetes 向けの宣言的な GitOps 継続的デリバツールです
  ko: Argo CD는 Kubernetes를 위한 선언적 GitOps 지속적 배포 도구입니다
  pl: Argo CD to deklaracyjne narzędzie do ciągłego dostarczania GitOps dla Kubernetes
  pt: O Argo CD é uma ferramenta declarativa de entrega contínua GitOps para o Kubernetes
  ro: Argo CD este un instrument declarativ de livrare continuă GitOps pentru Kubernetes
  ru: Argo CD — это декларативный инструмент непрерывной доставки GitOps для Kubernetes
  th: Argo CD คือเครื่องมือส่งมอบต่อเนื่องแบบ declarative ในสไตล์ GitOps สำหรับ Kubernetes
  tr: Argo CD, Kubernetes için bildirimsel GitOps sürekli teslim aracıdır
  uk: Argo CD — це декларативний інструмент безперервної доставки GitOps для Kubernetes
  vi: Argo CD là công cụ triển khai liên tục kiểu khai báo (declarative) theo mô hình GitOps cho Kubernetes
x:
  source: https://github.com/argoproj/argo-cd
  eget: argoproj/argo-cd
  brew: argocd
  scoop: argocd
  asdf: argocd
rule:
  /eget:
    cmd: x eget argoproj/argo-cd
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use argocd
    reference: https://github.com/beardix/asdf-argocd
  darwin/brew:
    cmd: brew install argocd
    reference: https://formulae.brew.sh/formula/argocd#default
  (win|wsl2)/scoop:
    cmd: x scoop install argocd
    reference: https://scoop.sh/#/apps?q=argocd
binlist:
- argocd

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 238 MB
          rating: 4
          desc:
            cn: 安装 238 MB
            en: 238 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 91 MB
        desc:
          cn: 91 MB
          en: 91 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
