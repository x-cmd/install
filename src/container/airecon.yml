  en: AIRecon is an autonomous cybersecurity agent that combines a self-hosted Large Language Model (Ollama) with a Kali Linux Docker sandbox and a Textual TUI. It is designed to automate security assess...
x:
  source: https://github.com/pikpikcu/airecon
  eget: https://github.com/pikpikcu/airecon
rule:
  /eget:
    cmd: x eget pikpikcu/airecon
    reference: https://github.com/pikpikcu/airecon
binlist:
- airecon

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 179 KB
          rating: 1
          desc:
            cn: 约 179 KB（估算）
            en: ~179 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
