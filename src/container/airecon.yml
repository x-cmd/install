lang: Python
homepage: https://github.com/pikpikcu/airecon
license: mit
desc:
  cn: 结合自托管 LLM 与 Kali Linux Docker 沙箱的自主网络安全 Agent
  en: AIRecon is an autonomous cybersecurity agent that combines a self-hosted Large Language Model (Ollama) with a Kali Linux Docker sandbox and a Textual TUI. It is designed to automate security assess...
x:
  source: https://github.com/pikpikcu/airecon
  eget: https://github.com/pikpikcu/airecon
rule:
  /eget:
    cmd: x eget pikpikcu/airecon
    reference: https://github.com/pikpikcu/airecon
binlist:
- airecon

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
