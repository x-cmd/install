lang: 'Python'
homepage: https://github.com/StakeSquid/dtop
license: 'MIT'
desc:
  cn: 高性能的 Docker 容器管理终端 UI，支持实时监控与日志查看
  en: 'A high-performance terminal UI for Docker container management with real-time monitoring, advanced log viewing, and comprehensive container operations.'
x:
  source: https://github.com/StakeSquid/dtop
  eget: StakeSquid/dtop
rule:
  /eget:
    cmd: x eget StakeSquid/dtop
    reference: https://github.com/StakeSquid/dtop
binlist:
  - 'dtop'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 KB
          rating: 1
          desc:
            cn: 约 23 KB（估算）
            en: ~23 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
