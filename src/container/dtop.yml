lang: 'Python'
homepage: https://github.com/StakeSquid/dtop
license: 'MIT'
desc:
  cn: 高性能的 Docker 容器管理终端 UI，支持实时监控与日志查看
  en: 'A high-performance terminal UI for Docker container management with real-time monitoring, advanced log viewing, and comprehensive container operations.'
x:
  source: https://github.com/StakeSquid/dtop
  eget: https://github.com/StakeSquid/dtop
rule:
  /eget:
    cmd: x eget StakeSquid/dtop
    reference: https://github.com/StakeSquid/dtop
binlist:
  - 'dtop'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
