lang: C
homepage: https://github.com/containers/bubblewrap
desc:
  cn: bwrap 是 Flatpak 和类似项目使用的低级非特权沙盒工具
  en: bwrap is low-level unprivileged sandboxing tool used by Flatpak and similar projects
x:
  pkg:
    exist: true
  source: https://github.com/containers/bubblewrap
  eget: https://github.com/containers/bubblewrap
rule:
  /eget:
    cmd: x eget containers/bubblewrap
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use bwrap
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install bubblewrap
    reference: https://formulae.brew.sh/formula/bubblewrap#default
  arch/pacman:
    cmd: sudo pacman -S bubblewrap
    reference: https://command-not-found.com/bwrap
  alpine/apk:
    cmd: sudo apk add bubblewrap
    reference: https://command-not-found.com/bwrap
    dsnap: bubblewrap
  debian/apt:
    cmd: sudo apt-get install bubblewrap
    reference: https://command-not-found.com/bwrap
    dsnap: bubblewrap
  ubuntu/apt:
    cmd: apt-get install bubblewrap
    reference: https://command-not-found.com/bwrap
    dsnap: bubblewrap
  fedora/dnf:
    cmd: sudo dnf install bubblewrap
    reference: https://command-not-found.com/bwrap
    dsnap: bubblewrap
  raspbian/apt:
    cmd: sudo apt-get install bubblewrap
    reference: https://command-not-found.com/bwrap
  kali/apt:
    cmd: sudo apt-get install bubblewrap
    reference: https://command-not-found.com/bwrap
    dsnap: bubblewrap
binlist:
- bwrap
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
