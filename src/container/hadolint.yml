lang: Haskell
homepage: https://github.com/hadolint/hadolint
license: GPL-3.0
desc:
  cn: Dockerfile linter，能分析 Dockerfile 并给出建议（能基于 shellcheck 对 RUN 指令内的 bash 代码进行检查）
  en: Dockerfile linter, which can analyze Dockerfile and give suggestions (can check the bash code in the RUN instruction based on shellcheck)
x:
  pkg:
    exist: true
  source: https://github.com/hadolint/hadolint
  eget: https://github.com/hadolint/hadolint
rule:
  /x:
    cmd: x pkg use hadolint
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget hadolint/hadolint
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use hadolint
    reference: https://github.com/devlincashman/asdf-hadolint
  arch/yay:
    cmd: yay -S hadolint
    reference: https://aur.archlinux.org/packages/hadolint
  darwin/brew:
    cmd: brew install hadolint
    reference: https://formulae.brew.sh/formula/hadolint#default
  (win|wsl2)/scoop:
    cmd: x scoop install hadolint
    reference: https://scoop.sh/#/apps?q=hadolint
binlist:
- hadolint

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
