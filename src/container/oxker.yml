lang: Rust
homepage: https://github.com/mrjackwills/oxker
license: MIT
desc:
  cn: 一个简单的 tui 来查看和控制 docker 容器
  en: A simple tui to view & control docker containers
  cs: Jednoduché tui pro zobrazení a ovládání kontejnerů docker
  de: Ein einfaches TUI zum Anzeigen und Steuern von Docker-Containern
  es: Un tui sencillo para ver y controlar contenedores de docker
  fr: Un tui simple pour afficher et contrôler les conteneurs docker
  id: TUI sederhana untuk melihat dan mengendalikan kontainer docker
  it: Una semplice tui per visualizzare e controllare i container docker
  ja: docker コンテナを表示・制御するためのシンプルな tui
  ko: docker 컨테이너를 확인하고 제어하는 간단한 tui
  pl: Proste tui do przeglądania i sterowania kontenerami dockera
  pt: Uma tui simples para visualizar e controlar contêineres do docker
  ro: Un tui simplu pentru vizualizarea și controlul containerelor docker
  ru: Простой tui для просмотра и управления контейнерами docker
  th: tui อย่างง่ายสำหรับดูและควบคุมคอนเทนเนอร์ docker
  tr: docker konteynerlerini görüntülemek ve denetlemek için basit bir tui
  uk: Простий tui для перегляду та керування контейнерами docker
  vi: Một tui đơn giản để xem và điều khiển container docker
x:
  source: https://github.com/mrjackwills/oxker
  eget: mrjackwills/oxker
  yay: oxker
  paru: oxker
  cargo: oxker
rule:
  /eget:
    cmd: x eget mrjackwills/oxker
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install oxker
    reference: https://github.com/mrjackwills/oxker?tab=readme-ov-file#cargo
    dsnap: oxker
  nix/run:
    cmd: nix run nixpkgs#oxker
    reference: https://github.com/mrjackwills/oxker?tab=readme-ov-file#nix
  nix/nix-shell:
    cmd: nix-shell -p oxker
    reference: https://github.com/mrjackwills/oxker?tab=readme-ov-file#nix
  arch/paru:
    cmd: paru -S oxker
    reference: https://github.com/mrjackwills/oxker?tab=readme-ov-file#aur
  arch/yay:
    cmd: yay -S oxker
    reference: https://aur.archlinux.org/packages/oxker
  /curl:
    cmd: curl https://raw.githubusercontent.com/mrjackwills/oxker/main/install.sh | bash
    reference: https://github.com/mrjackwills/oxker?tab=readme-ov-file#pre-built
  /wget:
    cmd: 'wget https://www.github.com/mrjackwills/oxker/releases/latest/download/oxker_linux_x86_64.tar.gz && \

      tar xzvf oxker_linux_x86_64.tar.gz oxker && \

      install -Dm 755 oxker -t "${HOME}/.local/bin" && \

      rm oxker_linux_x86_64.tar.gz oxker

      '
    reference: https://github.com/mrjackwills/oxker?tab=readme-ov-file#pre-built
binlist:
- oxker

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
