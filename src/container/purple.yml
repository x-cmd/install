lang: 'Rust'
homepage: https://github.com/erickochen/purple
license: 'MIT'
desc:
  cn: Rust 编写的终端 SSH 管理器与配置编辑器，支持 16 家云服务商同步
  en: 'Free, open-source terminal SSH manager and SSH config editor in Rust for macOS and Linux that keeps ~/.ssh/config in sync with 16 cloud providers, monitors live SSH tunnels and manages Docker and P...'
x:
  source: https://github.com/erickochen/purple
  eget: https://github.com/erickochen/purple
rule:
  /eget:
    cmd: x eget erickochen/purple
    reference: https://github.com/erickochen/purple
binlist:
  - 'purple'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
