lang: Rust
homepage: https://gitlab.exherbo.org/sydbox/sydbox
desc:
  cn: Rock-solid 应用沙箱内核，为 Linux 应用提供强隔离。
  en: Rock-solid application kernel to sandbox applications on Linux>=5.19.
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use sydbox
    reference: https://x-cmd.com/install/
  /cargo:
    cmd: cargo install sydbox
    reference: https://crates.io/crates/syd
binlist:
- syd
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
