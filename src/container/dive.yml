lang: Go
homepage: https://github.com/wagoodman/dive
license: MIT
desc:
  cn: 一个用于探索 Docker 图像、图层内容和发现缩小 Docker/OCI 图像大小的方法的工具
  en: A tool for exploring a docker image, layer contents, and discovering ways to shrink the size of your Docker/OCI image
  cs: Nástroj pro průzkum Docker obrazu, obsahu vrstev a hledání způsobů, jak zmenšit velikost vašeho Docker/OCI obrazu
  de: Ein Werkzeug zum Erkunden eines Docker-Images, seiner Layer-Inhalte und zum Finden von Möglichkeiten, die Größe Ihres Docker/OCI-Images zu verkleinern
  es: Una herramienta para explorar una imagen Docker, el contenido de las capas y descubrir formas de reducir el tamaño de tu imagen Docker/OCI
  fr: Un outil pour explorer une image Docker, le contenu des couches et découvrir des moyens de réduire la taille de votre image Docker/OCI
  id: Alat untuk menjelajahi image Docker, isi lapisan, dan menemukan cara memperkecil ukuran image Docker/OCI Anda
  it: Uno strumento per esplorare un'immagine Docker, il contenuto dei livelli e scoprire modi per ridurre le dimensioni della tua immagine Docker/OCI
  ja: Dockerイメージやレイヤーの中身を調査し、Docker/OCIイメージのサイズを縮小する方法を見つけるツール
  ko: Docker 이미지, 레이어 내용물을 탐색하고 Docker/OCI 이미지 크기를 줄이는 방법을 찾는 도구
  pl: Narzędzie do przeglądania obrazu Docker, zawartości warstw i odkrywania sposobów zmniejszenia rozmiaru obrazu Docker/OCI
  pt: Uma ferramenta para explorar uma imagem Docker, o conteúdo das camadas e descobrir maneiras de reduzir o tamanho da sua imagem Docker/OCI
  ro: Un instrument pentru explorarea unei imagini Docker, a conținutului straturilor și a descoperirii de modalități de a micșora dimensiunea imaginii Docker/OCI
  ru: Инструмент для исследования Docker-образа, содержимого слоёв и поиска способов уменьшить размер вашего Docker/OCI-образа
  th: เครื่องมือสำหรับสำรวจอิมเมจ Docker เนื้อหาของเลเยอร์ และค้นหาวิธีลดขนาดอิมเมจ Docker/OCI ของคุณ
  tr: Bir Docker imajını, katman içeriklerini incelemek ve Docker/OCI imajınızın boyutunu küçültme yollarını keşfetmek için araç
  uk: Інструмент для дослідження образу Docker, вмісту шарів і пошуку способів зменшити розмір вашого образу Docker/OCI
  vi: Công cụ để khám phá image Docker, nội dung các layer và tìm cách thu nhỏ kích thước image Docker/OCI của bạn
x:
  source: https://github.com/wagoodman/dive
  eget: wagoodman/dive
  brew: dive
  pacman: dive
  port: dive
  scoop: main/dive
  choco: dive
  winget: wagoodman.dive
  asdf: dive
rule:
  /x:
    cmd: x pkg use dive
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget wagoodman/dive
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use dive
    reference: https://github.com/looztra/asdf-dive
  darwin/brew:
    cmd: brew install dive
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  /go:
    cmd: go get github.com/wagoodman/dive
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
    dsnap: github.com/wagoodman/dive
  debian/apt:
    cmd: 'export DIVE_VERSION=$(curl -sL "https://api.github.com/repos/wagoodman/dive/releases/latest" | grep ''"tag_name":'' | sed -E ''s/.*"v([^"]+)".*/\1/'')

      curl -OL https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.deb

      sudo apt install ./dive_${DIVE_VERSION}_linux_amd64.deb

      '
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  ubuntu/apt:
    cmd: 'export DIVE_VERSION=$(curl -sL "https://api.github.com/repos/wagoodman/dive/releases/latest" | grep ''"tag_name":'' | sed -E ''s/.*"v([^"]+)".*/\1/'')

      curl -OL https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.deb

      sudo apt install ./dive_${DIVE_VERSION}_linux_amd64.deb

      '
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  arch/pacman:
    cmd: sudo pacman -S dive
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  kali/apt:
    cmd: 'export DIVE_VERSION=$(curl -sL "https://api.github.com/repos/wagoodman/dive/releases/latest" | grep ''"tag_name":'' | sed -E ''s/.*"v([^"]+)".*/\1/'')

      curl -OL https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.deb

      sudo apt install ./dive_${DIVE_VERSION}_linux_amd64.deb

      '
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  rhel/rpm:
    cmd: 'export DIVE_VERSION=$(curl -sL "https://api.github.com/repos/wagoodman/dive/releases/latest" | grep ''"tag_name":'' | sed -E ''s/.*"v([^"]+)".*/\1/'')

      curl -OL https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.rpm

      rpm -i dive_${DIVE_VERSION}_linux_amd64.rpm

      '
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  centos/rpm:
    cmd: 'export DIVE_VERSION=$(curl -sL "https://api.github.com/repos/wagoodman/dive/releases/latest" | grep ''"tag_name":'' | sed -E ''s/.*"v([^"]+)".*/\1/'')

      curl -OL https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.rpm

      rpm -i dive_${DIVE_VERSION}_linux_amd64.rpm

      '
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  raspbian/apt:
    cmd: 'export DIVE_VERSION=$(curl -sL "https://api.github.com/repos/wagoodman/dive/releases/latest" | grep ''"tag_name":'' | sed -E ''s/.*"v([^"]+)".*/\1/'')

      curl -OL https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.deb

      sudo apt install ./dive_${DIVE_VERSION}_linux_amd64.deb

      '
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  nix/nixpkgs:
    cmd: nix-env -iA nixos.dive
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  /nixpkgs:
    cmd: nix-env -iA nixpkgs.dive
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: x scoop install main/dive
    reference: https://scoop.sh/#/apps?q=dive
  (win|wsl2)/choco:
    cmd: x choco install dive
    reference: https://community.chocolatey.org/packages/dive
  (win|wsl2)/winget:
    cmd: x winget install wagoodman.dive
    reference: https://winget.run/pkg/wagoodman/dive
  darwin/port:
    cmd: sudo port selfupdate && sudo port install dive
    reference: https://github.com/wagoodman/dive?tab=readme-ov-file#installation
binlist:
- dive

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.7 MB
          rating: 1
          desc:
            cn: 安装 9.7 MB
            en: 9.7 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
