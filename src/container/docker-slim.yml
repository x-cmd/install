lang: Go
homepage: https://github.com/docker-slim/docker-slim
license: Apache-2.0
desc:
  cn: 优化您的容器体验。让您的容器更优质、更小巧、更安全，并减少工作量
  en: Optimize Your Experience with Containers. Make Your Containers Better, Smaller, More Secure and Do Less to Get There
x:
  source: https://github.com/docker-slim/docker-slim
  brew: docker-slim
  yay: docker-slim-bin
  asdf: asdf
  curl: curl
rule:
  /asdf:
    cmd: x asdf use docker-slim
    reference: https://github.com/xataz/asdf-docker-slim
  arch/yay:
    cmd: yay -S docker-slim-bin
    reference: https://aur.archlinux.org/packages/docker-slim-bin
  /curl:
    cmd: curl -sL https://raw.githubusercontent.com/slimtoolkit/slim/master/scripts/install-slim.sh | sudo -E bash -
    reference: https://github.com/slimtoolkit/slim?tab=readme-ov-file#scripted-install
  darwin/brew:
    cmd: brew install docker-slim
    reference: https://github.com/slimtoolkit/slim?tab=readme-ov-file#homebrew
binlist:
- docker-slim

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 27 MB
          rating: 2
          desc:
            cn: 安装 27 MB
            en: 27 MB install
        download:
          estimate: 27 MB
          desc:
            cn: 约 27 MB 下载 (linux/arm64)
            en: ~27 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
