lang: 'Go'
homepage: 'https://github.com/SagarMaheshwary/reqlog'
license: 'MIT'
desc:
  cn: 跨文件、Docker 容器与远程主机，按请求 ID 与键值搜索日志的快速 CLI
  en: 'Fast CLI for searching, tracing, and streaming logs across files, Docker containers, and remote hosts using request IDs, trace IDs, and key/value search.'
x:
  source: https://github.com/SagarMaheshwary/reqlog
  eget: https://github.com/SagarMaheshwary/reqlog
rule:
  /eget:
    cmd: x eget SagarMaheshwary/reqlog
    reference: https://github.com/SagarMaheshwary/reqlog
binlist:
- 'reqlog'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
