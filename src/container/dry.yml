lang: Go
homepage: https://github.com/moncho/dry
license: MIT
desc:
  cn: Dry 是一个用于管理 Docker 和 Docker Swarm 的终端应用程序
  en: Dry is a terminal application to manage Docker and Docker Swarm
x:
  pkg:
    exist: true
  source: https://github.com/moncho/dry
  eget: https://github.com/moncho/dry
rule:
  /x:
    cmd: x pkg use dry
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget moncho/dry
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: 'curl -sSf https://moncho.github.io/dry/dryup.sh | sudo sh \

      && sudo chmod 755 /usr/local/bin/dry

      '
    reference: https://github.com/moncho/dry?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S dry-bin
    reference: https://aur.archlinux.org/packages/dry-bin
  darwin/brew:
    cmd: 'brew tap moncho/dry \

      && brew install dry

      '
    reference: https://github.com/moncho/dry?tab=readme-ov-file#mac-os-x--homebrew
binlist:
- dry

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.9 MB
          rating: 1
          desc:
            cn: 约 2.9 MB（估算）
            en: ~2.9 MB estimated
        download:
          estimate: 19 MB
          desc:
            cn: 约 19 MB 下载 (linux/x64)
            en: ~19 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
