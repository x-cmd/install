lang: 'Go'
homepage: https://github.com/tarampampam/tinifier
license: 'MIT'
desc:
  cn: 使用 TinyPNG 压缩图片的 CLI 工具
  en: '🐼 CLI tool for compressing images using the TinyPNG'
x:
  source: https://github.com/tarampampam/tinifier
  eget: tarampampam/tinifier
rule:
  /eget:
    cmd: x eget tarampampam/tinifier
    reference: https://github.com/tarampampam/tinifier
binlist:
  - 'tinifier'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 778 KB
          rating: 1
          desc:
            cn: 约 778 KB（估算）
            en: ~778 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
