lang: 'Go'
homepage: https://github.com/tarampampam/tinifier
license: 'MIT'
desc:
  cn: 使用 TinyPNG 压缩图片的 CLI 工具
  en: '🐼 CLI tool for compressing images using the TinyPNG'
x:
  source: https://github.com/tarampampam/tinifier
  eget: https://github.com/tarampampam/tinifier
rule:
  /eget:
    cmd: x eget tarampampam/tinifier
    reference: https://github.com/tarampampam/tinifier
binlist:
  - 'tinifier'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
