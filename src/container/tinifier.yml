  en: '🐼 CLI tool for compressing images using the TinyPNG'
  cs: Nástroj CLI pro kompresi obrázků pomocí TinyPNG
  de: CLI-Werkzeug zum Komprimieren von Bildern mit TinyPNG
  es: Herramienta CLI para comprimir imágenes usando TinyPNG
  fr: Outil CLI pour compresser des images avec TinyPNG
  id: Alat CLI untuk mengompresi gambar menggunakan TinyPNG
  it: Strumento CLI per comprimere le immagini usando TinyPNG
  ja: TinyPNG を使って画像を圧縮する CLI ツール
  ko: TinyPNG를 사용하여 이미지를 압축하는 CLI 도구
  pl: Narzędzie CLI do kompresji obrazów za pomocą TinyPNG
  pt: Ferramenta CLI para compactar imagens usando o TinyPNG
  ro: Instrument CLI pentru comprimarea imaginilor folosind TinyPNG
  ru: CLI-инструмент для сжатия изображений с помощью TinyPNG
  th: เครื่องมือ CLI สำหรับบีบอัดรูปภาพด้วย TinyPNG
  tr: TinyPNG kullanarak görselleri sıkıştırmak için CLI aracı.
  uk: CLI-інструмент для стиснення зображень за допомогою TinyPNG
  vi: Công cụ CLI để nén ảnh bằng TinyPNG
x:
  source: https://github.com/tarampampam/tinifier
  eget: tarampampam/tinifier
rule:
  /eget:
    cmd: x eget tarampampam/tinifier
    reference: https://github.com/tarampampam/tinifier
binlist:
  - 'tinifier'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 778 KB
          rating: 1
          desc:
            cn: 约 778 KB（估算）
            en: ~778 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
