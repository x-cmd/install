lang: Go
homepage: https://github.com/containers/podman
license: Apache-2.0
desc:
  en: Podman is an open source container, pod, and container image management engine
  cn: Podman 是一个开源容器、 pod 和容器映像管理引擎
x:
  source: https://github.com/containers/podman
rule:
  darwin/brew:
    cmd: brew install podman
    reference: https://formulae.brew.sh/formula/podman#default
  arch/pacman:
    cmd: sudo pacman -S podman
    reference: https://podman.io/docs/installation
  alpine/apk:
    cmd: sudo apk add podman
    reference: https://podman.io/docs/installation
    dsnap: podman
  centos/yum:
    cmd: sudo yum -y install podman
    reference: https://podman.io/docs/installation
  debian/apt:
    cmd: sudo apt-get -y install podman
    reference: https://podman.io/docs/installation
    dsnap: podman
  fedora/dnf:
    cmd: sudo dnf -y install podman
    reference: https://podman.io/docs/installation
    dsnap: podman
  gentoo/emerge:
    cmd: sudo emerge app-containers/podman
    reference: https://podman.io/docs/installation
  openembedded/bitbake:
    cmd: sudo bitbake podman
    reference: https://podman.io/docs/installation
  opensuse/zypper:
    cmd: sudo zypper install podman
    reference: https://podman.io/docs/installation
  raspbian/apt:
    cmd: sudo apt-get -y install podman
    reference: https://podman.io/docs/installation
  rhel7/yum:
    cmd: 'sudo yum module enable -y container-tools:rhel8 \

      && sudo yum module install -y container-tools:rhel8

      '
    reference: https://podman.io/docs/installation
  rhel8/yum:
    cmd: 'sudo subscription-manager repos --enable=rhel-7-server-extras-rpms \

      && sudo yum -y install podman

      '
    reference: https://podman.io/docs/installation
  ubuntu/apt:
    cmd: 'sudo apt-get update \

      && sudo apt-get -y install podman

      '
    reference: https://podman.io/docs/installation
    dsnap: podman
binlist:
- podman

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 27 MB
          rating: 2
          desc:
            cn: 约 27 MB（估算）
            en: ~27 MB estimated
        download:
          estimate: 23 MB
          desc:
            cn: 约 23 MB 下载 (linux/x64)
            en: ~23 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
