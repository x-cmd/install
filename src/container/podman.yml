lang: Go
homepage: https://github.com/containers/podman
license: Apache-2.0
desc:
  en: Podman is an open source container, pod, and container image management engine
  cn: Podman 是一个开源容器、 pod 和容器映像管理引擎
  cs: Podman je open source engine pro správu kontejnerů, podů a obrazů kontejnerů
  de: Podman ist eine Open-Source-Engine zur Verwaltung von Containern, Pods und Container-Images
  es: Podman es un motor de código abierto para la gestión de contenedores, pods e imágenes de contenedor
  fr: Podman est un moteur open source de gestion des conteneurs, des pods et des images de conteneurs
  id: Podman adalah mesin open source untuk mengelola kontainer, pod, dan image kontainer
  it: Podman è un motore open source per la gestione di container, pod e immagini di container
  ja: Podman はコンテナ、pod、コンテナイメージを管理するオープンソースエンジン
  ko: Podman은 컨테이너, pod, 컨테이너 이미지를 관리하는 오픈 소스 엔진
  pl: Podman to otwartoźródłowy silnik do zarządzania kontenerami, podami i obrazami kontenerów
  pt: O Podman é um mecanismo de código aberto para gerenciamento de contêineres, pods e imagens de contêiner
  ro: Podman este un motor open source pentru gestionarea containerelor, podurilor și imaginilor de container
  ru: Podman — движок с открытым исходным кодом для управления контейнерами, pod-ами и образами контейнеров
  th: Podman คือเอนจินโอเพนซอร์สสำหรับจัดการคอนเทนเนอร์, pod และอิมเมจคอนเทนเนอร์
  tr: Podman, konteyner, pod ve konteyner imajlarını yönetmek için açık kaynaklı bir motordur
  uk: Podman — движок з відкритим кодом для керування контейнерами, pod-ами та образами контейнерів
  vi: Podman là động cơ mã nguồn mở để quản lý container, pod và image container
x:
  source: https://github.com/containers/podman
  brew: podman
  pacman: podman
  apk: podman
  zypper: podman
  emerge: app-containers/podman
rule:
  darwin/brew:
    cmd: brew install podman
    reference: https://formulae.brew.sh/formula/podman#default
  arch/pacman:
    cmd: sudo pacman -S podman
    reference: https://podman.io/docs/installation
  alpine/apk:
    cmd: sudo apk add podman
    reference: https://podman.io/docs/installation
    dsnap: podman
  centos/yum:
    cmd: sudo yum -y install podman
    reference: https://podman.io/docs/installation
  debian/apt:
    cmd: sudo apt-get -y install podman
    reference: https://podman.io/docs/installation
    dsnap: podman
  fedora/dnf:
    cmd: sudo dnf -y install podman
    reference: https://podman.io/docs/installation
    dsnap: podman
  gentoo/emerge:
    cmd: sudo emerge app-containers/podman
    reference: https://podman.io/docs/installation
  openembedded/bitbake:
    cmd: sudo bitbake podman
    reference: https://podman.io/docs/installation
  opensuse/zypper:
    cmd: sudo zypper install podman
    reference: https://podman.io/docs/installation
  raspbian/apt:
    cmd: sudo apt-get -y install podman
    reference: https://podman.io/docs/installation
  rhel7/yum:
    cmd: 'sudo yum module enable -y container-tools:rhel8 \

      && sudo yum module install -y container-tools:rhel8

      '
    reference: https://podman.io/docs/installation
  rhel8/yum:
    cmd: 'sudo subscription-manager repos --enable=rhel-7-server-extras-rpms \

      && sudo yum -y install podman

      '
    reference: https://podman.io/docs/installation
  ubuntu/apt:
    cmd: 'sudo apt-get update \

      && sudo apt-get -y install podman

      '
    reference: https://podman.io/docs/installation
    dsnap: podman
binlist:
- podman

# complicated
