lang: 'Go'
homepage: https://github.com/F1bonacc1/process-compose
license: 'Apache-2.0'
desc:
  cn: 用于管理非容器化应用的轻量灵活调度与编排工具
  en: 'Process Compose is a simple and flexible scheduler and orchestrator to manage non-containerized applications.'
x:
  source: https://github.com/F1bonacc1/process-compose
  eget: https://github.com/F1bonacc1/process-compose
rule:
  /eget:
    cmd: x eget F1bonacc1/process-compose
    reference: https://github.com/F1bonacc1/process-compose
binlist:
- 'process-compose'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
