lang: 'Go'
homepage: https://github.com/F1bonacc1/process-compose
license: 'Apache-2.0'
desc:
  cn: 用于管理非容器化应用的轻量灵活调度与编排工具
  en: 'Process Compose is a simple and flexible scheduler and orchestrator to manage non-containerized applications.'
x:
  source: https://github.com/F1bonacc1/process-compose
  eget: https://github.com/F1bonacc1/process-compose
rule:
  /eget:
    cmd: x eget F1bonacc1/process-compose
    reference: https://github.com/F1bonacc1/process-compose
binlist:
  - 'process-compose'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
