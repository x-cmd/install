lang: Shell
homepage: https://github.com/orbstack/orbstack
license: MIT
desc:
  cn: OrbStack 是一种快速、轻量且易于使用的 Docker 容器和 Linux 运行工具。它是 Docker Desktop 的替代方案，旨在帮助开发人员以光速进行开发。
  en: OrbStack is the fast, light, and easy way to run Docker containers and Linux. Develop at lightspeed with our Docker Desktop alternative.
x:
  source: https://github.com/orbstack/orbstack
rule:
  darwin/brew:
    cmd: brew install orbstack
    reference: https://docs.orbstack.dev/quick-start#installation
binlist:
- orbstack

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
