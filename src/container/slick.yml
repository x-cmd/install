lang: Go
homepage: https://github.com/scmmishra/slick-deploy
license: MIT
desc:
  cn: 使用 Caddy 以声明方式部署容器的 CLI 工具
  en: CLI tool to declaratively deploy containers with Caddy
  cs: Nástroj CLI pro deklarativní nasazování kontejnerů pomocí Caddy
  de: CLI-Werkzeug zum deklarativen Bereitstellen von Containern mit Caddy
  es: Herramienta de CLI para desplegar contenedores de forma declarativa con Caddy
  fr: Outil CLI pour déployer des conteneurs de manière déclarative avec Caddy
  id: Alat CLI untuk mendaftarkan kontainer secara deklaratif dengan Caddy
  it: Strumento CLI per distribuire container in modo dichiarativo con Caddy
  ja: Caddy を使ってコンテナを宣言的にデプロイする CLI ツール
  ko: Caddy로 컨테이너를 선언적으로 배포하는 CLI 도구
  pl: Narzędzie CLI do deklaratywnego wdrażania kontenerów za pomocą Caddy
  pt: Ferramenta de CLI para implantar contêineres de forma declarativa com o Caddy
  ro: Instrument CLI pentru implementarea declarativă a containerelor cu Caddy
  ru: CLI-инструмент для декларативного развёртывания контейнеров с помощью Caddy
  th: เครื่องมือ CLI สำหรับปรับใช้คอนเทนเนอร์แบบประกาศด้วย Caddy
  tr: Caddy ile konteynerleri bildirimsel olarak dağıtmak için bir CLI aracı
  uk: CLI-інструмент для декларативного розгортання контейнерів за допомогою Caddy
  vi: Công cụ CLI để triển khai container theo kiểu khai báo với Caddy
x:
  source: https://github.com/scmmishra/slick-deploy
  eget: scmmishra/slick-deploy
rule:
  /x:
    cmd: x pkg use slick
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget scmmishra/slick-deploy
    reference: https://x-cmd.com/mod/eget
  /build:
    cmd: 'git clone https://github.com/scmmishra/slick-deploy.git \

      && cd slick-deploy \

      && make install

      '
    reference: https://github.com/scmmishra/slick-deploy?tab=readme-ov-file#installing
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/scmmishra/slick-deploy/main/scripts/install.sh | bash
    reference: https://github.com/scmmishra/slick-deploy?tab=readme-ov-file#installing
binlist:
- slick

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
