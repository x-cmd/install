lang: Go
homepage: https://github.com/scmmishra/slick-deploy
license: MIT
desc:
  cn: 使用 Caddy 以声明方式部署容器的 CLI 工具
  en: CLI tool to declaratively deploy containers with Caddy
x:
  pkg:
    exist: true
  source: https://github.com/scmmishra/slick-deploy
  eget: https://github.com/scmmishra/slick-deploy
rule:
  /x:
    cmd: x pkg use slick
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget scmmishra/slick-deploy
    reference: https://x-cmd.com/mod/eget
  /build:
    cmd: 'git clone https://github.com/scmmishra/slick-deploy.git \

      && cd slick-deploy \

      && make install

      '
    reference: https://github.com/scmmishra/slick-deploy?tab=readme-ov-file#installing
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/scmmishra/slick-deploy/main/scripts/install.sh | bash
    reference: https://github.com/scmmishra/slick-deploy?tab=readme-ov-file#installing
binlist:
- slick

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
