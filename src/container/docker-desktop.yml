lang: Go
homepage: https://github.com/docker/for-mac
desc:
  cn: 面向开发人员和团队的排名第一的容器化软件
  en: 'The #1 containerization software for developers and teams'
x:
  source: https://github.com/docker/for-mac
rule:
  darwin/brew:
    cmd: brew install --cask docker
    reference: https://formulae.brew.sh/cask/docker#default
  arch/pacman:
    cmd: 'wget https://download.docker.com/linux/static/stable/x86_64/docker-27.2.1.tgz -qO- | tar xvfz - docker/docker --strip-components=1 && \

      mv ./docker /usr/local/bin && \

      x curl ''https://desktop.docker.com/linux/main/amd64/173168/docker-desktop-x86_64.pkg.tar.zst'' -OL ''docker-desktop-x86_64.pkg.tar.zst'' && \

      sudo pacman -U ./docker-desktop-x86_64.pkg.tar.zst

      '
    reference: https://docs.docker.com/desktop/install/linux/archlinux/
  archcraft/pacman:
    cmd: 'wget https://download.docker.com/linux/static/stable/x86_64/docker-27.2.1.tgz -qO- | tar xvfz - docker/docker --strip-components=1 && \

      mv ./docker /usr/local/bin && \

      x curl ''https://desktop.docker.com/linux/main/amd64/173168/docker-desktop-x86_64.pkg.tar.zst'' -OL ''docker-desktop-x86_64.pkg.tar.zst'' && \

      sudo pacman -U ./docker-desktop-x86_64.pkg.tar.zst

      '
    reference: https://docs.docker.com/desktop/install/linux/archlinux/
  debian/apt:
    cmd: 'x curl ''https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-linux-amd64'' -OL ''docker-desktop-amd64.deb'' && \

      sudo apt-get install ./docker-desktop-amd64.deb

      '
    reference: https://docs.docker.com/desktop/install/linux/debian/
  ubuntu/apt:
    cmd: 'x curl ''https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-linux-amd64'' -OL ''docker-desktop-amd64.deb'' && \

      sudo apt-get install ./docker-desktop-amd64.deb

      '
    reference: https://docs.docker.com/desktop/install/linux/ubuntu/
  kali/apt:
    cmd: 'x curl ''https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-linux-amd64'' -OL ''docker-desktop-amd64.deb'' && \

      sudo apt-get install ./docker-desktop-amd64.deb

      '
    reference: https://docs.docker.com/desktop/install/linux/ubuntu/
  fedora/dnf:
    cmd: 'x curl ''https://desktop.docker.com/linux/main/amd64/docker-desktop-x86_64.rpm?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-linux-amd64'' -OL ''docker-desktop-x86_64.rpm'' && \

      sudo dnf install ./docker-desktop-x86_64.rpm

      '
    reference: https://docs.docker.com/desktop/install/linux/fedora/
  raspbian/apt:
    cmd: 'x curl ''https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-linux-amd64'' -OL ''docker-desktop-amd64.deb'' && \

      sudo apt-get install ./docker-desktop-amd64.deb

      '
    reference: https://docs.docker.com/desktop/install/linux/ubuntu/
  rhel/dnf:
    cmd: 'sudo subscription-manager repos --enable codeready-builder-for-rhel-9-$(arch)-rpms && \

      sudo dnf install https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm && \

      sudo dnf install pass && \

      sudo dnf install gnome-shell-extension-appindicator && \

      sudo gnome-extensions enable appindicatorsupport@rgcjonas.gmail.com && \

      sudo dnf install gnome-terminal && \

      sudo dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo && \

      x curl ''https://desktop.docker.com/linux/main/amd64/docker-desktop-x86_64.rpm?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-linux-amd64'' -OL ''docker-desktop-x86_64-rhel.rpm'' && \

      sudo dnf install ./docker-desktop-x86_64-rhel.rpm

      '
    reference: https://docs.docker.com/desktop/install/linux/rhel/
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add main && x scoop install main/docker

      '
    reference: https://scoop.sh/#/apps?q=docker
  (win|wsl2)/choco:
    cmd: x choco install docker-desktop
    reference: https://community.chocolatey.org/packages/docker-desktop
  (win|wsl2)/winget:
    cmd: x winget install -e --id Docker.DockerDesktop
    reference: https://winget.run/pkg/Docker/DockerDesktop
  win/powershell:
    cmd: 'x curl -L https://desktop.docker.com/win/main/amd64/173168/Docker%20Desktop%20Installer.exe -o ''Docker Desktop Installer.exe'' && \

      x pwsh Start-Process ''Docker Desktop Installer.exe'' -Wait install

      '
    reference: https://docs.docker.com/desktop/install/windows-install/#install-from-the-command-line
  rocky/dnf:
    cmd: 'x curl ''https://desktop.docker.com/linux/main/amd64/docker-desktop-x86_64.rpm?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-linux-amd64'' -OL ''docker-desktop-x86_64.rpm'' && \

      sudo dnf install ./docker-desktop-x86_64.rpm

      '
    reference: https://docs.docker.com/desktop/install/linux/fedora/
binlist:
- docker-desktop
license: NOASSERTION
