    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-dnf-rhel-centos-fedora-amazon-linux
  opensuse/zypper:
    cmd: 'sudo zypper ar https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo \ &&

      sudo zypper --gpg-auto-import-keys install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-zypper-opensuse-sle
binlist:
- nvidia-container-toolkit

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4.5 MB
          rating: 1
          desc:
            cn: 约 4.5 MB（估算）
            en: ~4.5 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
