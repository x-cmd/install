lang: Go
homepage: https://github.com/NVIDIA/nvidia-container-toolkit
license: Apache-2.0
desc:
  cn: NVIDIA Container Toolkit 是一套库和工具，帮助用户构建和运行 GPU 加速的容器。
  en: The NVIDIA Container Toolkit is a collection of libraries and utilities enabling users to build and run GPU-accelerated containers.
x:
  source: https://github.com/NVIDIA/nvidia-container-toolkit
  eget: https://github.com/NVIDIA/nvidia-container-toolkit
rule:
  /eget:
    cmd: x eget NVIDIA/nvidia-container-toolkit
    reference: https://x-cmd.com/mod/eget
  ubuntu/apt:
    cmd: 'curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg \

      && curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \ &&

      sed ''s#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g'' | \ &&

      sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list \ &&

      sudo apt-get update \ &&

      sudo apt-get install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-apt-ubuntu-debian
    dsnap: nvidia-container-toolkit
  debian/apt:
    cmd: 'curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg \

      && curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \ &&

      sed ''s#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g'' | \ &&

      sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list \ &&

      sudo apt-get update \ &&

      sudo apt-get install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-apt-ubuntu-debian
    dsnap: nvidia-container-toolkit
  kali/apt:
    cmd: 'curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg \

      && curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \ &&

      sed ''s#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g'' | \ &&

      sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list \ &&

      sudo apt-get update \ &&

      sudo apt-get install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-apt-ubuntu-debian
  mint/apt:
    cmd: 'curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg \

      && curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \ &&

      sed ''s#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g'' | \ &&

      sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list \ &&

      sudo apt-get update \ &&

      sudo apt-get install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-apt-ubuntu-debian
  raspbian/apt:
    cmd: 'curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg \

      && curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \ &&

      sed ''s#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g'' | \ &&

      sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list \ &&

      sudo apt-get update \ &&

      sudo apt-get install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-apt-ubuntu-debian
  rhel/dnf:
    cmd: 'curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo | \ &&

      sudo tee /etc/yum.repos.d/nvidia-container-toolkit.repo \ &&

      sudo dnf install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-dnf-rhel-centos-fedora-amazon-linux
  centos/dnf:
    cmd: 'curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo | \ &&

      sudo tee /etc/yum.repos.d/nvidia-container-toolkit.repo \ &&

      sudo dnf install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-dnf-rhel-centos-fedora-amazon-linux
  fedora/dnf:
    cmd: 'curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo | \ &&

      sudo tee /etc/yum.repos.d/nvidia-container-toolkit.repo \ &&

      sudo dnf install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-dnf-rhel-centos-fedora-amazon-linux
    dsnap: nvidia-container-toolkit
  rocky/dnf:
    cmd: 'curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo | \ &&

      sudo tee /etc/yum.repos.d/nvidia-container-toolkit.repo \ &&

      sudo dnf install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-dnf-rhel-centos-fedora-amazon-linux
  amazon/dnf:
    cmd: 'curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo | \ &&

      sudo tee /etc/yum.repos.d/nvidia-container-toolkit.repo \ &&

      sudo dnf install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-dnf-rhel-centos-fedora-amazon-linux
  opensuse/zypper:
    cmd: 'sudo zypper ar https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo \ &&

      sudo zypper --gpg-auto-import-keys install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-zypper-opensuse-sle
binlist:
- nvidia-container-toolkit

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
