      sudo apt-get update \ &&

      sudo apt-get install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-apt-ubuntu-debian
  rhel/dnf:
    cmd: 'curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo | \ &&

      sudo tee /etc/yum.repos.d/nvidia-container-toolkit.repo \ &&

      sudo dnf install -y nvidia-container-toolkit

      '
    reference: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#with-dnf-rhel-centos-fedora-amazon-linux
  centos/dnf:
    cmd: 'curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo | \ &&

      sudo tee /etc/yum.repos.d/nvidia-container-toolkit.repo \ &&

