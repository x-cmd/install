lang: Go
homepage: https://github.com/docker/machine
license: Apache-2.0
desc:
  cn: 以容器为中心的机器管理
  en: Machine management for a container-centric world
  cs: Správa strojů pro svět zaměřený na kontejnery
  de: Maschinenverwaltung für eine containerzentrierte Welt
  es: Gestión de máquinas para un mundo centrado en contenedores
  fr: Gestion de machines pour un monde centré sur les conteneurs
  id: Manajemen mesin untuk dunia yang berpusat pada kontainer
  it: Gestione delle macchine per un mondo incentrato sui container
  ja: コンテナ中心のワールドのためのマシン管理
  ko: 컨테이너 중심 세계를 위한 머신 관리
  pl: Zarządzanie maszynami dla świata skoncentrowanego na kontenerach
  pt: Gerenciamento de máquinas para um mundo centrado em contêineres
  ro: Managementul mașinilor pentru o lume centrată pe containere
  ru: Управление машинами для мира, построенного вокруг контейнеров
  th: การจัดการเครื่องจักรสำหรับโลกที่มีคอนเทนเนอร์เป็นแกนกลาง
  tr: Konteyner odaklı bir dünya için makine yönetimi
  uk: Керування машинами для світу, побудованого навколо контейнерів
  vi: Quản lý máy cho một thế giới lấy container làm trung tâm
x:
  source: https://github.com/docker/machine
  brew: docker-machine
  scoop: docker-machine
rule:
  /curl:
    cmd: 'curl -O "https://gitlab-docker-machine-downloads.s3.amazonaws.com/v0.16.2-gitlab.19/docker-machine-Linux-x86_64"

      cp docker-machine-Linux-x86_64 /usr/local/bin/docker-machine

      chmod +x /usr/local/bin/docker-machine

      '
    reference: https://gitlab.com/gitlab-org/ci-cd/docker-machine/-/blob/main/docs/install-machine.md#install-docker-machine
  darwin/brew:
    cmd: brew install docker-machine
    reference: https://formulae.brew.sh/formula/docker-machine#default
  (win|wsl2)/scoop:
    cmd: x scoop install docker-machine
    reference: https://scoop.sh/#/apps?q=docker-machine
binlist:
- docker-machine

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
