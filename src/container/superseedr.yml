lang: 'Rust'
homepage: 'https://github.com/Jagalite/superseedr'
license: 'GPL-3.0'
desc:
  cn: 终端中的 BitTorrent 客户端
  en: 'A BitTorrent Client in your Terminal'
x:
  source: https://github.com/Jagalite/superseedr
  eget: https://github.com/Jagalite/superseedr
rule:
  /cargo:
    cmd: 'cargo install superseedr'
    reference: https://github.com/Jagalite/superseedr
  darwin/brew:
    cmd: 'brew install superseedr'
    reference: https://github.com/Jagalite/superseedr
  /eget:
    cmd: x eget Jagalite/superseedr
    reference: https://github.com/Jagalite/superseedr
binlist:
  - 'superseedr'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
