lang: 'Rust'
homepage: 'https://github.com/Jagalite/superseedr'
license: 'GPL-3.0'
desc:
  cn: 终端中的 BitTorrent 客户端
  en: 'A BitTorrent Client in your Terminal'
  cs: BitTorrent klient ve vašem terminálu
  de: Ein BitTorrent-Client in Ihrem Terminal
  es: Un cliente de BitTorrent en tu terminal
  fr: Un client BitTorrent dans votre terminal
  id: Klien BitTorrent di terminal Anda
  it: Un client BitTorrent nel tuo terminale
  ja: ターミナルで動作する BitTorrent クライアント
  ko: 터미널에서 동작하는 BitTorrent 클라이언트
  pl: Klient BitTorrent w terminalu
  pt: Um cliente BitTorrent no seu terminal
  ro: Un client BitTorrent în terminalul dumneavoastră
  ru: BitTorrent-клиент для вашего терминала
  th: ไคลเอนต์ BitTorrent ในเทอร์มินัลของคุณ
  tr: Terminalinizde bir BitTorrent istemcisi
  uk: BitTorrent-клієнт для вашого термінала
  vi: Ứng dụng khách BitTorrent trong terminal của bạn
x:
  source: https://github.com/Jagalite/superseedr
  eget: Jagalite/superseedr
  brew: superseedr
  cargo: superseedr
rule:
  /cargo:
    cmd: 'cargo install superseedr'
    reference: https://github.com/Jagalite/superseedr
  darwin/brew:
    cmd: 'brew install superseedr'
    reference: https://github.com/Jagalite/superseedr
  /eget:
    cmd: x eget Jagalite/superseedr
    reference: https://github.com/Jagalite/superseedr
binlist:
  - 'superseedr'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 6.7 MB
          rating: 1
          desc:
            cn: 约 6.7 MB（估算）
            en: ~6.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
