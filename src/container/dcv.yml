lang: Go
homepage: https://github.com/tokuhirom/dcv
desc:
  cn: docker-compose 的 TUI 查看器
  en: TUI viewer for docker-compose
x:
  source: https://github.com/tokuhirom/dcv
  eget: https://github.com/tokuhirom/dcv
rule:
  /eget:
    cmd: x eget tokuhirom/dcv
    reference: https://github.com/tokuhirom/dcv
binlist:
- dcv
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
