lang: Go
homepage: https://github.com/tokuhirom/dcv
desc:
  cn: docker-compose 的 TUI 查看器
  en: TUI viewer for docker-compose
  cs: TUI prohlížeč pro docker-compose
  de: TUI-Viewer für docker-compose
  es: Visor TUI para docker-compose
  fr: Visionneuse TUI pour docker-compose
  id: Penampil TUI untuk docker-compose
  it: Visualizzatore TUI per docker-compose
  ja: docker-compose用のTUIビューア
  ko: docker-compose용 TUI 뷰어
  pl: Przeglądarka TUI dla docker-compose
  pt: Visualizador TUI para docker-compose
  ro: Vizualizator TUI pentru docker-compose
  ru: TUI-просмотрщик для docker-compose
  th: ตัวดูภาพแบบ TUI สำหรับ docker-compose
  tr: docker-compose için TUI görüntüleyici
  uk: TUI-переглядач для docker-compose
  vi: Trình xem TUI cho docker-compose
x:
  source: https://github.com/tokuhirom/dcv
  eget: tokuhirom/dcv
rule:
  /eget:
    cmd: x eget tokuhirom/dcv
    reference: https://github.com/tokuhirom/dcv
binlist:
- dcv
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
