lang: Python
homepage: https://github.com/pommee/Pocker
license: MIT
desc:
  cn: 一个用于管理 Docker 任务的 TUI 工具。
  en: A TUI tool for Docker.
  cs: Nástroj TUI pro správu úloh Docker.
  de: Ein TUI-Werkzeug zur Verwaltung von Docker-Aufgaben.
  es: Una herramienta TUI para gestionar tareas de Docker.
  fr: Un outil TUI pour gérer les tâches Docker.
  id: Alat TUI untuk mengelola tugas Docker.
  it: Uno strumento TUI per gestire le attività Docker.
  ja: Docker タスクを管理するための TUI ツール。
  ko: Docker 작업을 관리하기 위한 TUI 도구.
  pl: Narzędzie TUI do zarządzania zadaniami Dockera.
  pt: Uma ferramenta TUI para gerenciar tarefas do Docker.
  ro: Un instrument TUI pentru gestionarea sarcinilor Docker.
  ru: TUI-инструмент для управления задачами Docker.
  th: เครื่องมือ TUI สำหรับจัดการงาน Docker.
  tr: Docker işlerini yönetmek için bir TUI aracı.
  uk: TUI-інструмент для керування завданнями Docker.
  vi: Công cụ TUI để quản lý các tác vụ Docker.
x:
  source: https://github.com/pommee/Pocker
  pip: pocker
rule:
  /pip:
    cmd: pip install pocker
    reference: https://github.com/pommee/Pocker#-installation
    dsnap: pocker
  /pipx:
    cmd: pipx install pocker-tui
    reference: https://github.com/pommee/Pocker#-installation
binlist:
- pocker

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
