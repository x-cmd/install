lang: Python
homepage: https://github.com/pommee/Pocker
license: MIT
desc:
  cn: 一个用于管理 Docker 任务的 TUI 工具。
  en: A TUI tool for Docker.
x:
  source: https://github.com/pommee/Pocker
rule:
  /pip:
    cmd: pip install pocker
    reference: https://github.com/pommee/Pocker#-installation
    dsnap: pocker
  /pipx:
    cmd: pipx install pocker-tui
    reference: https://github.com/pommee/Pocker#-installation
binlist:
- pocker

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
