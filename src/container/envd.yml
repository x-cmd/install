lang: Go
homepage: https://envd.tensorchord.ai/
license: Apache-2.0
desc:
  en: envd is a reproducible, container-based development environment for AI/ML — declare dependencies in build.envd and `envd up` builds an isolated environment with BuildKit, exported as an OCI-compatible image; run `envd bootstrap` once after installing.
  cn: envd 是面向 AI/ML 的可复现容器化开发环境：在 build.envd 中声明依赖，`envd up` 用 BuildKit 构建隔离环境并产出兼容 OCI 规范的镜像；安装后需执行一次 `envd bootstrap`。
  cs: envd je reprodukovatelný kontejnerový vývojové prostředí pro AI/ML — deklarujte závislosti v build.envd a `envd up` sestaví izolované prostředí pomocí BuildKitu a exportuje ho jako obraz kompatibilní s OCI; po instalaci jednou spusťte `envd bootstrap`.
  de: envd ist eine reproduzierbare, containerbasierte Entwicklungsumgebung für KI/ML — Abhängigkeiten werden in build.envd deklariert und `envd up` baut mit BuildKit eine isolierte Umgebung, die als OCI-kompatibles Image exportiert wird; führen Sie nach der Installation einmal `envd bootstrap` aus.
  es: "envd es un entorno de desarrollo basado en contenedores y reproducible para AI/ML: declara las dependencias en build.envd y `envd up` construye un entorno aislado con BuildKit, exportado como imagen compatible con OCI; ejecuta `envd bootstrap` una vez tras la instalación."
  fr: envd est un environnement de développement reproductible basé sur les conteneurs pour l'IA/ML — déclarez les dépendances dans build.envd et `envd up` construit avec BuildKit un environnement isolé, exporté comme image compatible OCI ; exécutez `envd bootstrap` une fois après l'installation.
  id: envd adalah lingkungan pengembangan berbasis container yang dapat direproduksi untuk AI/ML — nyatakan dependensi di build.envd dan `envd up` membangun lingkungan terisolasi dengan BuildKit, yang diekspor sebagai image yang kompatibel dengan OCI; jalankan `envd bootstrap` sekali setelah pemasangan.
  it: envd è un ambiente di sviluppo basato su container riproducibile per AI/ML — dichiara le dipendenze in build.envd e `envd up` costruisce con BuildKit un ambiente isolato, esportato come immagine compatibile con OCI; esegui `envd bootstrap` una volta dopo l'installazione.
  ja: envd は AI/ML 向けの再現可能なコンテナベース開発環境です。build.envd に依存関係を宣言すると `envd up` が BuildKit で隔離環境を構築し、OCI 互換イメージとして書き出します。インストール後は一度だけ `envd bootstrap` を実行してください。
  ko: envd는 AI/ML을 위한 재현 가능한 컨테이너 기반 개발 환경입니다. build.envd에 의존성을 선언하면 `envd up`이 BuildKit으로 격리된 환경을 구축하여 OCI 호환 이미지로 내보내며, 설치 후 한 번만 `envd bootstrap`을 실행하면 됩니다.
  pl: envd to powtarzalne, oparte na kontenerach środowisko programistyczne dla AI/ML — zależności deklarujesz w build.envd, a `envd up` buduje za pomocą BuildKit izolowane środowisko eksportowane jako obraz zgodny z OCI; po instalacji jednorazowo uruchom `envd bootstrap`.
  pt: envd é um ambiente de desenvolvimento baseado em contêineres e reproduzível para AI/ML — declare as dependências em build.envd e `envd up` constrói com o BuildKit um ambiente isolado, exportado como imagem compatível com OCI; execute `envd bootstrap` uma vez após a instalação.
  ro: envd este un mediu de dezvoltare bazat pe containere, reproductibil, pentru AI/ML — declarezi dependențele în build.envd, iar `envd up` construiește cu BuildKit un mediu izolat, exportat ca imagine compatibilă cu OCI; rulează `envd bootstrap` o singură dată după instalare.
  ru: envd — воспроизводимая контейнерная среда разработки для AI/ML — зависимости объявляются в build.envd, а `envd up` с помощью BuildKit собирает изолированное окружение и экспортирует его как OCI-совместимый образ; после установки один раз выполните `envd bootstrap`.
  th: envd เป็นสภาพแวดล้อมการพัฒนาแบบคอนเทนเนอร์ที่ทำซ้ำได้สำหรับ AI/ML — ประกาศการพึ่งพาใน build.envd และ `envd up` จะสร้างสภาพแวดล้อมแยกด้วย BuildKit แล้วส่งออกเป็นอิมเมจที่เข้ากันได้กับ OCI; หลังติดตั้งให้รัน `envd bootstrap` เพียงครั้งเดียว
  tr: envd, AI/ML için yeniden üretilebilir, konteiner tabanlı bir geliştirme ortamıdır — bağımlılıkları build.envd içinde tanımlarsınız ve `envd up`, BuildKit ile yalıtılmış bir ortam oluşturup OCI uyumlu bir görüntü olarak dışa aktarır; kurulumdan sonra `envd bootstrap` komutunu bir kez çalıştırın.
  uk: envd — відтворюване контейнерне середовище розробки для AI/ML — залежності оголошуються у build.envd, а `envd up` за допомогою BuildKit збирає ізольоване середовище та експортує його як OCI-сумісний образ; після встановлення один раз виконайте `envd bootstrap`.
  vi: envd là môi trường phát triển dựa trên container, có thể tái lập cho AI/ML — khai báo phụ thuộc trong build.envd và `envd up` sẽ dựng môi trường cô lập bằng BuildKit, xuất ra thành ảnh tương thích OCI; chạy `envd bootstrap` một lần sau khi cài đặt.
x:
  source: https://github.com/tensorchord/envd
  brew: envd
  pip: envd
rule:
  /curl:
    cmd: curl -sSfL https://envd.tensorchord.ai/install.sh | sudo bash
    reference: https://envd.tensorchord.ai/guide/getting-started.html#install-and-bootstrap-envd
  /pip:
    cmd: pip install --upgrade envd
    reference: https://envd.tensorchord.ai/guide/getting-started.html#install-and-bootstrap-envd
  /pipx:
    cmd: pipx install envd
    reference: https://envd.tensorchord.ai/guide/getting-started.html#install-and-bootstrap-envd
  /uv:
    cmd: uv tool install envd
    reference: https://envd.tensorchord.ai/guide/getting-started.html#install-and-bootstrap-envd
  darwin/brew:
    cmd: brew install envd
    reference: https://envd.tensorchord.ai/guide/getting-started.html#install-and-bootstrap-envd
binlist:
- envd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: true
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取 build.envd 声明文件、Docker 上下文配置与 ~/.ssh/config
          en: Reads the build.envd declaration, the Docker context config and ~/.ssh/config
        sensitive:
        - "$HOME/.ssh/config"
      write:
        desc:
          cn: 写入 ~/.config/envd（配置、SSH 密钥对、遥测 UID）、~/.cache/envd（环境数据与缓存），并向 ~/.ssh/config 追加环境条目
          en: Writes ~/.config/envd (config, SSH key pair, telemetry UID), ~/.cache/envd (environment data and caches), and appends environment entries to ~/.ssh/config
        sensitive:
        - "$HOME/.ssh/config"
        - "$HOME/.config/envd/id_rsa_envd"
        - "$HOME/.config/envd/id_rsa_envd.pub"
  resource:
    disk:
      size:
        install:
          estimate: 60 MB
          rating: 3
          desc:
            cn: 约 60 MB 安装 (linux/x64；macOS 通用二进制 119 MB)
            en: ~60 MB install (linux/x64; 119 MB for the macOS universal binary)
        download:
          estimate: 60 MB
          desc:
            cn: 约 60 MB 下载 (linux/x64)
            en: ~60 MB download (linux/x64)
        growth:
          desc:
            cn: 环境数据与构建缓存写入 ~/.cache/envd，随环境数量增长
            en: Environment data and build caches land in ~/.cache/envd and grow with the number of environments
      paths:
        data:
          - ~/.cache/envd/data/
        config:
          - ~/.config/envd/
        cache:
          - ~/.cache/envd/
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 约 30 MB 闲置
          en: ~30 MB idle
    cpu:
      workload: ['compute', 'io', 'network']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 低（实际构建由 buildkitd 容器承担）
          en: Low (the build itself runs in buildkitd containers)
  platform:
    win: none
    linux: full
    darwin: full
