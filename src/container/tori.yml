lang: 'Go'
homepage: https://github.com/thobiasn/tori-cli
license: 'MIT'
desc:
  cn: 单二进制、仅 SSH 的 Docker 服务监控工具，提供指标、日志与告警
  en: 'Docker server monitoring without the stack. Metrics, logs, and alerts from your terminal. Single binary, zero exposed ports, SSH-only.'
x:
  source: https://github.com/thobiasn/tori-cli
  eget: https://github.com/thobiasn/tori-cli
rule:
  /eget:
    cmd: x eget thobiasn/tori-cli
    reference: https://github.com/thobiasn/tori-cli
binlist:
  - 'tori'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
