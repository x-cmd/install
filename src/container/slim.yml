lang: Go
homepage: https://github.com/slimtoolkit/slim
license: Apache-2.0
desc:
  cn: Slim（工具包）：不更改容器映像中的任何内容，并将其缩小最多 30 倍（对于编译语言甚至更多），使其也更安全！ （免费且开源）
  en: 'Slim(toolkit): Don''t change anything in your container image and minify it by up to 30x (and for compiled languages even more) making it secure too! (free and open source)'
x:
  pkg:
    exist: true
  source: https://github.com/slimtoolkit/slim
  eget: https://github.com/slimtoolkit/slim
rule:
  /eget:
    cmd: x eget slimtoolkit/slim
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use slim
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -sL https://raw.githubusercontent.com/slimtoolkit/slim/master/scripts/install-slim.sh | sudo -E bash -
    reference: https://github.com/slimtoolkit/slim
  darwin/brew:
    cmd: brew install docker-slim
    reference: https://github.com/slimtoolkit/slim
  arch/yay:
    cmd: yay -S docker-slim-bin
    reference: https://aur.archlinux.org/packages/docker-slim-bin
  /docker:
    cmd: docker pull dslim/slim
    reference: https://github.com/slimtoolkit/slim
binlist:
- slim

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 27 MB
          rating: 2
          desc:
            cn: 安装 27 MB
            en: 27 MB install
        download:
          estimate: 27 MB
          desc:
            cn: 约 27 MB 下载 (linux/arm64)
            en: ~27 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
