lang: Shell
homepage: https://github.com/anthropics/devcontainer-features
license: mit
desc:
  cn: Anthropic 开发容器特性，包含 Claude Code CLI
  en: Anthropic Dev Container Features, including Claude Code CLI
x:
  source: https://github.com/anthropics/devcontainer-features
  eget: https://github.com/anthropics/devcontainer-features
rule:
  /eget:
    cmd: x eget anthropics/devcontainer-features
    reference: https://github.com/anthropics/devcontainer-features
binlist:
- devcontainer-features

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
