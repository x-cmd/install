lang: 'Go'
homepage: https://github.com/keidarcy/e1s
license: 'MIT'
desc:
  cn: 在终端中轻松管理 AWS ECS 资源（类似 k9s）
  en: 'E1S - Easily Manage AWS ECS Resources in Terminal(~k9s for ECS) 🐱'
x:
  source: https://github.com/keidarcy/e1s
  eget: https://github.com/keidarcy/e1s
rule:
  /eget:
    cmd: x eget keidarcy/e1s
    reference: https://github.com/keidarcy/e1s
binlist:
  - 'e1s'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
