lang: 'Go'
homepage: https://github.com/keidarcy/e1s
license: 'MIT'
desc:
  cn: 在终端中轻松管理 AWS ECS 资源（类似 k9s）
  en: 'E1S - Easily Manage AWS ECS Resources in Terminal(~k9s for ECS) 🐱'
x:
  source: https://github.com/keidarcy/e1s
  eget: https://github.com/keidarcy/e1s
rule:
  /eget:
    cmd: x eget keidarcy/e1s
    reference: https://github.com/keidarcy/e1s
binlist:
- 'e1s'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
