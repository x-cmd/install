lang: Rust
homepage: https://github.com/always-further/nono
license: Apache-2.0
desc:
  cn: 为 AI 代理、MCP 和 LLM 工作负载提供安全、内核强制执行的沙箱
  en: Secure, kernel-enforced sandbox for AI agents, MCP and LLM workloads.
x:
  source: https://github.com/always-further/nono
  eget: https://github.com/always-further/nono
rule:
  /eget:
    cmd: x eget always-further/nono
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install nono
    reference: https://nono.sh/
  arch/yay:
    cmd: yay -S nono-ai
    reference: https://aur.archlinux.org/packages/nono-ai
  /cargo:
    cmd: cargo install nono-cli
    reference: https://nono.sh/
  (debian|ubuntu)/curl:
    cmd: |
      VERSION=$(curl -sI https://github.com/always-further/nono/releases/latest | grep -i location | grep -oP 'v\K[0-9.]+')
      ARCH=$(dpkg --print-architecture)
      wget https://github.com/always-further/nono/releases/download/v${VERSION}/nono-cli_${VERSION}_${ARCH}.deb
      sudo dpkg -i nono-cli_${VERSION}_${ARCH}.deb
    reference: https://nono.sh/docs/cli/getting_started/installation
binlist:
  - nono

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
