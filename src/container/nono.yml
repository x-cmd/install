lang: Rust
homepage: https://github.com/always-further/nono
license: Apache-2.0
desc:
  cn: 为 AI 代理、MCP 和 LLM 工作负载提供安全、内核强制执行的沙箱
  en: Secure, kernel-enforced sandbox for AI agents, MCP and LLM workloads.
  cs: Bezpečný sandbox vynucovaný jádrem pro agenty AI, MCP a pracovní zatížení LLM.
  de: Sichere, vom Kernel durchgesetzte Sandbox für KI-Agenten, MCP und LLM-Workloads.
  es: Sandbox seguro con aplicación a nivel de kernel para agentes de IA, MCP y cargas de trabajo de LLM.
  fr: Bac à sable sécurisé, appliqué au niveau du noyau, pour les agents IA, MCP et les charges de travail LLM.
  id: Sandbox aman yang ditegakkan kernel untuk agen AI, MCP, dan beban kerja LLM.
  it: Sandbox sicuro applicato a livello di kernel per agenti AI, MCP e carichi di lavoro LLM.
  ja: AI エージェント、MCP、LLM ワークロード向けの、安全でカーネル強制のサンドボックス。
  ko: AI 에이전트, MCP 및 LLM 워크로드를 위한 안전한 커널 강제 샌드박스입니다.
  pl: Bezpieczny sandbox egzekwowany na poziomie jądra dla agentów AI, MCP i obciążeń LLM.
  pt: Sandbox seguro com imposição no nível do kernel para agentes de IA, MCP e cargas de trabalho de LLM.
  ro: Sandbox sigur, impus la nivel de kernel, pentru agenți AI, MCP și sarcini de lucru LLM.
  ru: Безопасная песочница с принудительным применением на уровне ядра для AI-агентов, MCP и рабочих нагрузок LLM.
  th: Sandbox ที่ปลอดภัยและบังคับใช้ระดับเคอร์เนล สำหรับเอเจนต์ AI, MCP และเวิร์กโหลด LLM
  tr: AI ajanları, MCP ve LLM iş yükleri için çekirdek düzeyinde zorlanan güvenli bir sandbox.
  uk: Безпечна пісочниця з примусовим застосуванням на рівні ядра для AI-агентів, MCP та робочих навантажень LLM.
  vi: Sandbox an toàn được thực thi ở cấp kernel cho các agent AI, MCP và tải làm việc LLM.
x:
  source: https://github.com/always-further/nono
  eget: always-further/nono
  brew: nono
  yay: nono-ai
  cargo: nono-cli
rule:
  /eget:
    cmd: x eget always-further/nono
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install nono
    reference: https://nono.sh/
  arch/yay:
    cmd: yay -S nono-ai
    reference: https://aur.archlinux.org/packages/nono-ai
  /cargo:
    cmd: cargo install nono-cli
    reference: https://nono.sh/
  (debian|ubuntu)/curl:
    cmd: |
      VERSION=$(curl -sI https://github.com/always-further/nono/releases/latest | grep -i location | grep -oP 'v\K[0-9.]+')
      ARCH=$(dpkg --print-architecture)
      wget https://github.com/always-further/nono/releases/download/v${VERSION}/nono-cli_${VERSION}_${ARCH}.deb
      sudo dpkg -i nono-cli_${VERSION}_${ARCH}.deb
    reference: https://nono.sh/docs/cli/getting_started/installation
binlist:
- nono

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 安装 12 MB
            en: 12 MB install
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
