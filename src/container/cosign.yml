lang: Go
homepage: https://github.com/sigstore/cosign
license: Apache-2.0
desc:
  cn: Cosign 是作为 sigstore 项目的一部分开发的
  en: Cosign is developed as part of the sigstore project
  cs: Cosign je vyvíjen jako součást projektu sigstore
  de: Cosign wird als Teil des sigstore-Projekts entwickelt
  es: Cosign se desarrolla como parte del proyecto sigstore
  fr: Cosign est développé dans le cadre du projet sigstore
  id: Cosign dikembangkan sebagai bagian dari proyek sigstore
  it: Cosign è sviluppato come parte del progetto sigstore
  ja: Cosign は sigstore プロジェクトの一部として開発されています
  ko: Cosign은 sigstore 프로젝트의 일부로 개발되었습니다
  pl: Cosign jest rozwijany jako część projektu sigstore
  pt: O Cosign é desenvolvido como parte do projeto sigstore
  ro: Cosign este dezvoltat ca parte a proiectului sigstore
  ru: Cosign разрабатывается как часть проекта sigstore
  th: Cosign ถูกพัฒนาโดยเป็นส่วนหนึ่งของโครงการ sigstore
  tr: Cosign, sigstore projesinin bir parçası olarak geliştirilmiştir
  uk: Cosign розробляється як частина проєкту sigstore
  vi: Cosign được phát triển như một phần của dự án sigstore
x:
  source: https://github.com/sigstore/cosign
  eget: sigstore/cosign
  brew: cosign
  pacman: cosign
  apk: cosign
  go: github.com/sigstore/cosign/v2/cmd/cosign@latest
rule:
  /x:
    cmd: x pkg use cosign
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget sigstore/cosign
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/sigstore/cosign/v2/cmd/cosign@latest
    reference: https://docs.sigstore.dev/system_config/installation/#with-go-120
    dsnap: github.com/sigstore/cosign/v2/cmd/cosign@latest
  /curl:
    cmd: 'curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64" && \

      sudo mv cosign-linux-amd64 /usr/local/bin/cosign && \

      sudo chmod +x /usr/local/bin/cosign

      '
    reference: https://docs.sigstore.dev/system_config/installation/#with-the-cosign-binary-or-rpmdpkg-package
  /rpm:
    cmd: 'LATEST_VERSION=$(curl https://api.github.com/repos/sigstore/cosign/releases/latest | grep tag_name | cut -d : -f2 | tr -d "v\", ") && \

      curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-${LATEST_VERSION}-1.x86_64.rpm" && \

      sudo rpm -ivh cosign-${LATEST_VERSION}.x86_64.rpm

      '
    reference: https://docs.sigstore.dev/system_config/installation/#with-the-cosign-binary-or-rpmdpkg-package
  /dkpg:
    cmd: 'LATEST_VERSION=$(curl https://api.github.com/repos/sigstore/cosign/releases/latest | grep tag_name | cut -d : -f2 | tr -d "v\", ") && \

      curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign_${LATEST_VERSION}_amd64.deb" && \

      sudo dpkg -i cosign_${LATEST_VERSION}_amd64.deb

      '
    reference: https://docs.sigstore.dev/system_config/installation/#with-the-cosign-binary-or-rpmdpkg-package
  darwin/brew:
    cmd: brew install cosign
    reference: https://docs.sigstore.dev/system_config/installation/#homebrewlinuxbrew
  linux/brew:
    cmd: brew install cosign
    reference: https://docs.sigstore.dev/system_config/installation/#homebrewlinuxbrew
  arch/pacman:
    cmd: sudo pacman -S cosign
    reference: https://docs.sigstore.dev/system_config/installation/#arch-linux
  alpine/apk:
    cmd: sudo apk add cosign
    reference: https://docs.sigstore.dev/system_config/installation/#alpine-linux
    dsnap: cosign
  /nix-env:
    cmd: nix-env -iA nixos.cosign
    reference: https://docs.sigstore.dev/system_config/installation/#nixos
binlist:
- cosign
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # OIDC, Rekor, registry
    filesystem:
      read:
        desc:
          cn: 读取 ~/.docker/config.json, ~/.cosign
          en: Reads ~/.docker/config.json, ~/.cosign
        sensitive:
        - "$HOME/.docker/config.json"
        - "$HOME/.cosign/cosign.key"
      write:
        desc:
          cn: 写入 ~/.cosign, ~/.local/share/cosign
          en: Writes ~/.cosign, ~/.local/share/cosign
        sensitive:
        - "$HOME/.cosign/cosign.key"
  resource:
    disk:
      size:
        install:
          estimate: 135 MB
          rating: 3
          desc:
            cn: 安装 135 MB
            en: 135 MB install
        download:
          estimate: 135 MB
          desc:
            cn: 约 135 MB 下载 (linux/x64)
            en: ~135 MB download (linux/x64)
      paths:
        data:
        - "$HOME/.local/share/cosign"
        config:
        - "$HOME/.cosign"
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 80 MB
        desc:
          cn: ~80 MB
          en: ~80 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 签名验证时短暂占用
          en: Brief spike on signature verification
  platform:
    win: full
    linux: full
    darwin: full
