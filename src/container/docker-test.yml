lang: Shell
homepage: https://test.docker.com
desc:
  cn: Docker 安装脚本
  en: Docker installation script
rule:
  /curl:
    cmd: curl -fsSL https://test.docker.com -o test-docker.sh
    reference: https://github.com/docker/docker-install?tab=readme-ov-file#usage
binlist:
- docker-test
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
