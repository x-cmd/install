lang: Shell
homepage: https://test.docker.com
desc:
  cn: Docker 安装脚本
  en: Docker installation script
rule:
  /curl:
    cmd: curl -fsSL https://test.docker.com -o test-docker.sh
    reference: https://github.com/docker/docker-install?tab=readme-ov-file#usage
binlist:
- docker-test
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
