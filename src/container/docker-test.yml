lang: Shell
homepage: https://test.docker.com
desc:
  cn: Docker 安装脚本
  en: Docker installation script
  cs: Instalační skript pro Docker
  de: Docker-Installationsskript
  es: Script de instalación de Docker
  fr: Script d'installation de Docker
  id: Skrip instalasi Docker
  it: Script di installazione di Docker
  ja: Dockerインストールスクリプト
  ko: Docker 설치 스크립트
  pl: Skrypt instalacyjny Dockera
  pt: Script de instalação do Docker
  ro: Script de instalare Docker
  ru: Скрипт установки Docker
  th: สคริปต์การติดตั้ง Docker
  tr: Docker kurulum betiği
  uk: Скрипт встановлення Docker
  vi: Kịch bản cài đặt Docker
rule:
  /curl:
    cmd: curl -fsSL https://test.docker.com -o test-docker.sh
    reference: https://github.com/docker/docker-install?tab=readme-ov-file#usage

x: {}
binlist:
- docker-test
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
