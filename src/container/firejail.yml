lang: C
homepage: https://github.com/netblue30/firejail
license: GPL-2.0
desc:
  cn: Firejail 是一个 SUID 沙箱程序，通过使用 Linux 命名空间、seccomp-bpf 和 Linux 功能来限制不受信任的应用程序的运行环境，从而降低安全漏洞的风险
  en: Firejail is a SUID sandbox program that reduces the risk of security breaches by restricting the running environment of untrusted applications using Linux namespaces, seccomp-bpf and Linux capabilities
x:
  source: https://github.com/netblue30/firejail
  eget: https://github.com/netblue30/firejail
rule:
  /eget:
    cmd: x eget netblue30/firejail
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install firejail
    reference: https://command-not-found.com/firejail
  ubuntu/apt:
    cmd: 'sudo add-apt-repository ppa:deki/firejail && \

      sudo apt-get update && \

      sudo apt-get install firejail firejail-profiles

      '
    reference: https://github.com/netblue30/firejail/tree/0.9.72?tab=readme-ov-file#ubuntu
  mint/apt:
    cmd: 'sudo add-apt-repository ppa:deki/firejail && \

      sudo apt-get update && \

      sudo apt-get install firejail firejail-profiles

      '
    reference: https://github.com/netblue30/firejail/tree/0.9.72?tab=readme-ov-file#ubuntu
  alpine/apk:
    cmd: sudo apk add firejail
    reference: https://command-not-found.com/firejail
  arch/pacman:
    cmd: sudo pacman -S firejail
    reference: https://command-not-found.com/firejail
  manjaro/pacman:
    cmd: sudo pacman -S firejail
    reference: https://command-not-found.com/firejail
  kali/apt:
    cmd: sudo apt-get install firejail
    reference: https://command-not-found.com/firejail
    dsnap: firejail
  centos/yum:
    cmd: sudo yum install firejail
    reference: https://command-not-found.com/firejail
  fedora/dnf:
    cmd: sudo dnf install firejail
    reference: https://command-not-found.com/firejail
  raspbian/apt:
    cmd: sudo apt-get install firejail
    reference: https://command-not-found.com/firejail
  opensuse/zypper:
    cmd: 'sudo zypper addrepo https://download.opensuse.org/repositories/openSUSE:Factory/standard/openSUSE:Factory.repo && \

      sudo zypper refresh && \

      sudo zypper install firejail

      '
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=firejail
binlist:
- firejail

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
