lang: JavaScript
homepage: https://github.com/songquanpeng/one-api
license: mit
desc:
  cn: 支持 OpenAI、Azure、Anthropic、Gemini 等主流模型的 LLM API 管理与分发系统，单文件部署
  en: LLM API 管理 & 分发系统，支持 OpenAI、Azure、Anthropic Claude、Google Gemini、DeepSeek、字节豆包、ChatGLM、文心一言、讯飞星火、通义千问、360 智脑、腾讯混元等主流模型，统一 API 适配，可用于 key 管理与二次分发。单可执行文件，提供 Docker 镜像，一键部署，开箱即用。LLM API management & k...
x:
  source: https://github.com/songquanpeng/one-api
  eget: https://github.com/songquanpeng/one-api
rule:
  /eget:
    cmd: x eget songquanpeng/one-api
    reference: https://github.com/songquanpeng/one-api
binlist:
- one-api

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 64 MB
          rating: 3
          desc:
            cn: 安装 64 MB
            en: 64 MB install
        download:
          estimate: 64 MB
          desc:
            cn: 约 64 MB 下载 (macos/arm64)
            en: ~64 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
