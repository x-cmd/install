lang: Go
homepage: https://github.com/abiosoft/colima
license: MIT
desc:
  cn: 安装最少的 macOS (和 Linux)上的容器运行时
  en: Container runtimes on macOS (and Linux) with minimal setup
  cs: Kontejnerové běhové prostředí na macOS (a Linuxu) s minimálním nastavením
  de: Container-Laufzeitumgebungen unter macOS (und Linux) mit minimaler Einrichtung
  es: Entornos de ejecución de contenedores en macOS (y Linux) con una configuración mínima
  fr: Runtime de conteneurs sur macOS (et Linux) avec une configuration minimale
  id: Runtime kontainer di macOS (dan Linux) dengan pengaturan minimum
  it: Runtime per container su macOS (e Linux) con configurazione minima
  ja: 最小限の設定でmacOS（およびLinux）で動くコンテナランタイム
  ko: 최소한의 설정으로 macOS(및 Linux)에서 동작하는 컨테이너 런타임
  pl: Środowiska uruchomieniowe kontenerów na macOS (i Linuxie) przy minimalnej konfiguracji
  pt: Runtimes de contêiner no macOS (e Linux) com configuração mínima
  ro: Medii de execuție pentru containere pe macOS (și Linux) cu configurare minimă
  ru: Среды выполнения контейнеров на macOS (и Linux) с минимальной настройкой
  th: สภาพแวดล้อมรันคอนเทนเนอร์บน macOS (และ Linux) พร้อมการตั้งค่าขั้นต่ำ
  tr: macOS (ve Linux) üzerinde asgari kurulumla konteiner çalıştırma ortamları
  uk: Середовища виконання контейнерів на macOS (і Linux) з мінімальним налаштуванням
  vi: Môi trường chạy container trên macOS (và Linux) với thiết lập tối giản
x:
  source: https://github.com/abiosoft/colima
  eget: abiosoft/colima
  brew: colima
  port: colima
  yay: colima
rule:
  /eget:
    cmd: x eget abiosoft/colima
    reference: https://x-cmd.com/mod/eget
  darwin/port:
    cmd: sudo port install colima
    reference: https://github.com/abiosoft/colima?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S colima
    reference: https://aur.archlinux.org/packages/colima
  darwin/brew:
    cmd: brew install colima
    reference: https://github.com/abiosoft/colima?tab=readme-ov-file#installation
  /nixpkgs:
    cmd: nix-env -iA nixpkgs.colima
    reference: https://github.com/abiosoft/colima?tab=readme-ov-file#installation
binlist:
- colima

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 38 MB
        desc:
          cn: 38 MB
          en: 38 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
