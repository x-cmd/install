lang: Go
homepage: https://github.com/abiosoft/colima
license: MIT
desc:
  cn: 安装最少的 macOS (和 Linux)上的容器运行时
  en: Container runtimes on macOS (and Linux) with minimal setup
x:
  source: https://github.com/abiosoft/colima
  eget: https://github.com/abiosoft/colima
rule:
  /eget:
    cmd: x eget abiosoft/colima
    reference: https://x-cmd.com/mod/eget
  darwin/port:
    cmd: sudo port install colima
    reference: https://github.com/abiosoft/colima?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S colima
    reference: https://aur.archlinux.org/packages/colima
  darwin/brew:
    cmd: brew install colima
    reference: https://github.com/abiosoft/colima?tab=readme-ov-file#installation
  /nixpkgs:
    cmd: nix-env -iA nixpkgs.colima
    reference: https://github.com/abiosoft/colima?tab=readme-ov-file#installation
binlist:
- colima

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 38 MB
        desc:
          cn: 38 MB
          en: 38 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
