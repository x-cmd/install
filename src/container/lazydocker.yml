lang: Go
desc:
  en: A simple terminal UI for both docker and docker-compose
  cn: Docker 和 Docker Compose 的多功能终端看板
  cs: Jednoduché terminálové UI pro docker i docker-compose
  de: Eine einfache Terminal-UI für docker und docker-compose
  es: Una interfaz de terminal sencilla para docker y docker-compose
  fr: Une interface terminal simple pour docker et docker-compose
  id: Antarmuka terminal sederhana untuk docker dan docker-compose
  it: Un'interfaccia terminale semplice per docker e docker-compose
  ja: docker と docker-compose のためのシンプルなターミナル UI
  ko: docker와 docker-compose를 위한 간단한 터미널 UI
  pl: Prosty interfejs terminala dla dockera i docker-compose
  pt: Uma interface de terminal simples para docker e docker-compose
  ro: O interfață terminală simplă pentru docker și docker-compose
  ru: Простой терминальный интерфейс для docker и docker-compose
  th: เทอร์มินัล UI อย่างง่ายสำหรับ docker และ docker-compose
  tr: docker ve docker-compose için basit bir terminal arayüzü
  uk: Простий термінальний інтерфейс для docker і docker-compose
  vi: Giao diện terminal đơn giản cho docker và docker-compose
homepage: https://github.com/jesseduffield/lazydocker
license: MIT
x:
  source: https://github.com/jesseduffield/lazydocker
  eget: jesseduffield/lazydocker
  brew: jesseduffield/lazydocker/lazydocker
  scoop: lazydocker
  choco: lazydocker
  yay: lazydocker
  go: github.com/jesseduffield/lazydocker@latest
  asdf: lazydocker
rule:
  /x:
    cmd: x pkg use lazydocker
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jesseduffield/lazydocker
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/jesseduffield/lazydocker@latest
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
    dsnap: github.com/jesseduffield/lazydocker@latest
  /asdf:
    cmd: x asdf use lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install jesseduffield/lazydocker/lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: x scoop install lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
binlist:
- lazydocker

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 安装 12 MB
            en: 12 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 11 MB
        desc:
          cn: 11 MB
          en: 11 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
