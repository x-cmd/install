lang: Go
desc:
  en: A simple terminal UI for both docker and docker-compose
  cn: Docker 和 Docker Compose 的多功能终端看板
homepage: https://github.com/jesseduffield/lazydocker
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/jesseduffield/lazydocker
  eget: https://github.com/jesseduffield/lazydocker
rule:
  /x:
    cmd: x pkg use lazydocker
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jesseduffield/lazydocker
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/jesseduffield/lazydocker@latest
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
    dsnap: github.com/jesseduffield/lazydocker@latest
  /asdf:
    cmd: x asdf use lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install jesseduffield/lazydocker/lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: x scoop install lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S lazydocker
    reference: https://github.com/jesseduffield/lazydocker?tab=readme-ov-file#installation
binlist:
- lazydocker

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
