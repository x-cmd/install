lang: 'Go'
homepage: https://github.com/devnullvoid/pvetui
license: 'MIT'
desc:
  cn: Proxmox VE 终端 UI
  en: 'Terminal UI for Proxmox VE'
x:
  source: https://github.com/devnullvoid/pvetui
  eget: devnullvoid/pvetui
rule:
  /eget:
    cmd: x eget devnullvoid/pvetui
    reference: https://github.com/devnullvoid/pvetui
binlist:
  - 'pvetui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.6 MB
          rating: 1
          desc:
            cn: 约 6.6 MB（估算）
            en: ~6.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
