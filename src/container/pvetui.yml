lang: 'Go'
homepage: https://github.com/devnullvoid/pvetui
license: 'MIT'
desc:
  cn: Proxmox VE 终端 UI
  en: 'Terminal UI for Proxmox VE'
  cs: Terminálové UI pro Proxmox VE
  de: Terminal-UI für Proxmox VE
  es: Interfaz de terminal para Proxmox VE
  fr: Interface terminal pour Proxmox VE
  id: UI terminal untuk Proxmox VE
  it: UI da terminale per Proxmox VE
  ja: Proxmox VE 用のターミナル UI
  ko: Proxmox VE용 터미널 UI
  pl: Interfejs terminala dla Proxmox VE
  pt: Interface de terminal para o Proxmox VE
  ro: UI de terminal pentru Proxmox VE
  ru: Терминальный UI для Proxmox VE
  th: UI เทอร์มินัลสำหรับ Proxmox VE
  tr: Proxmox VE için terminal UI
  uk: Термінальний UI для Proxmox VE
  vi: Giao diện dòng lệnh cho Proxmox VE
x:
  source: https://github.com/devnullvoid/pvetui
  eget: devnullvoid/pvetui
rule:
  /eget:
    cmd: x eget devnullvoid/pvetui
    reference: https://github.com/devnullvoid/pvetui
binlist:
  - 'pvetui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 6.6 MB
          rating: 1
          desc:
            cn: 约 6.6 MB（估算）
            en: ~6.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
