lang: Go
homepage: https://github.com/knqyf263/sou
license: Apache-2.0
desc:
  en: A modern TUI tool for exploring container image layers with an intuitive interface
  cn: 一个具有直观界面的现代 TUI 工具，用于浏览容器镜像层
x:
  source: https://github.com/knqyf263/sou
  eget: https://github.com/knqyf263/sou
rule:
  /eget:
    cmd: x eget knqyf263/sou
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install knqyf263/sou/sou
    reference: https://github.com/knqyf263/sou?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/knqyf263/sou@latest
    reference: https://github.com/knqyf263/sou?tab=readme-ov-file#installation
    dsnap: sou
binlist:
- sou

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
