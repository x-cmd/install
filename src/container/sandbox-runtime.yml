lang: TypeScript
homepage: https://github.com/anthropic-experimental/sandbox-runtime
license: Apache-2.0
desc:
  en: A lightweight sandboxing tool for enforcing filesystem and network restrictions on arbitrary processes at the OS level, without requiring a container.
  cn: 轻量级的沙箱工具，可以在操作系统级别对任意进程强制执行文件系统和网络限制，而无需容器
x:
  source: https://github.com/anthropic-experimental/sandbox-runtime
rule:
  /npm:
    cmd: npm install -g @anthropic-ai/sandbox-runtime
    reference: https://github.com/anthropic-experimental/sandbox-runtime?tab=readme-ov-file#installation
binlist:
  - srt


footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
