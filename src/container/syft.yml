lang: Go
homepage: https://github.com/anchore/syft
license: Apache-2.0
desc:
  cn: 一个 CLI 工具和 Go 库，用于从容器映像和文件系统生成软件材料清单(SBOM)。
  en: A CLI tool and Go library for generating a Software Bill of Materials (SBOM) from container images and filesystems.
x:
  source: https://github.com/anchore/syft
  eget: anchore/syft
  brew: syft
  scoop: syft
  choco: syft
  asdf: syft
rule:
  /x:
    cmd: x pkg use syft
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget anchore/syft
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use syft
    reference: https://github.com/davidgp1701/asdf-syft
  darwin/brew:
    cmd: brew install syft
    reference: https://github.com/anchore/syft?tab=readme-ov-file#homebrew
  /curl:
    cmd: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    reference: https://github.com/anchore/syft?tab=readme-ov-file#recommended
  (win|wsl2)/choco:
    cmd: x choco install syft -y
    reference: https://github.com/anchore/syft?tab=readme-ov-file#chocolatey
  (win|wsl2)/scoop:
    cmd: x scoop install syft
    reference: https://github.com/anchore/syft?tab=readme-ov-file#scoop
  nix/:
    cmd: nix-env -i syft
    reference: https://github.com/anchore/syft?tab=readme-ov-file#nix
binlist:
- syft

# already profiled
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 86 MB
          rating: 3
          desc:
            cn: 安装 86 MB
            en: 86 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
