lang: Python
homepage: https://github.com/numpy/numpy
desc:
  cn: NumPy 是一个用于科学计算的 Python 库
  en: NumPy is a Python library for scientific computing
x:
  source: https://github.com/numpy/numpy
  eget: https://github.com/numpy/numpy
  pip: numpy
rule:
  /eget:
    cmd: x eget numpy/numpy
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install numpy
    reference: https://numpy.org/install/
    dsnap: numpy
  /conda:
    cmd: conda install numpy
    reference: https://numpy.org/install/
binlist:
- numpy
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1019 KB
          rating: 1
          desc:
            cn: 约 1019 KB（估算）
            en: ~1019 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
