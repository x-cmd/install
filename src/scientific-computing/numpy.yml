lang: Python
homepage: https://github.com/numpy/numpy
desc:
  cn: NumPy 是一个用于科学计算的 Python 库
  en: NumPy is a Python library for scientific computing
x:
  source: https://github.com/numpy/numpy
  eget: https://github.com/numpy/numpy
rule:
  /eget:
    cmd: x eget numpy/numpy
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install numpy
    reference: https://numpy.org/install/
    dsnap: numpy
  /conda:
    cmd: conda install numpy
    reference: https://numpy.org/install/
binlist:
- numpy
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
