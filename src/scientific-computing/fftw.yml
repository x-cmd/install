lang: C
homepage: https://github.com/FFTW/fftw3
license: GPL-2.0
desc:
  en: FFTW is a C subroutine library for computing the discrete Fourier transform (DFT) in one or more dimensions
  cn: FFTW 是一个 C 子程序库，用于在一个或多个维度上计算离散傅里叶变换 （DFT）
x:
  source: https://github.com/FFTW/fftw3
rule:
  darwin/brew:
    cmd: brew install fftw
    reference: https://formulae.brew.sh/formula/fftw#default
binlist:
- fftw

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
