lang: Rust
desc:
  cn: 一个运行命令并使用指数退避（exponential backoff）策略的工具
  en: A tool to run commands with exponential backoff
homepage: https://github.com/rye/eb
license: GPL-3.0
x:
  source: https://github.com/rye/eb
rule:
  /cargo:
    cmd: cargo install eb
    reference: https://github.com/rye/eb?tab=readme-ov-file#installing-it
    dsnap: eb
binlist:
- eb

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
