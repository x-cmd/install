lang: Rust
desc:
  cn: 一个运行命令并使用指数退避（exponential backoff）策略的工具
  en: A tool to run commands with exponential backoff
homepage: https://github.com/rye/eb
license: GPL-3.0
x:
  source: https://github.com/rye/eb
rule:
  /cargo:
    cmd: cargo install eb
    reference: https://github.com/rye/eb?tab=readme-ov-file#installing-it
    dsnap: eb
binlist:
- eb

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 约 11 KB（估算）
            en: ~11 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
