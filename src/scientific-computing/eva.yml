lang: 'Rust'
homepage: 'https://github.com/oppiliappan/eva'
license: 'MIT'
desc:
  cn: 类似 bc(1) 的计算器 REPL
  en: 'a calculator REPL, similar to bc(1)'
x:
  source: https://github.com/oppiliappan/eva
  eget: https://github.com/oppiliappan/eva
rule:
  /eget:
    cmd: x eget oppiliappan/eva
    reference: https://github.com/oppiliappan/eva
binlist:
  - 'eva'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
