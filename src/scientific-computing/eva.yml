    linux: none
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 44 KB
          rating: 1
          desc:
            cn: 约 44 KB（估算）
            en: ~44 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
