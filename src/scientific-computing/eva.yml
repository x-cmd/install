lang: 'Rust'
homepage: 'https://github.com/oppiliappan/eva'
license: 'MIT'
desc:
  cn: 类似 bc(1) 的计算器 REPL
  en: 'a calculator REPL, similar to bc(1)'
x:
  source: https://github.com/oppiliappan/eva
  eget: oppiliappan/eva
rule:
  /eget:
    cmd: x eget oppiliappan/eva
    reference: https://github.com/oppiliappan/eva
binlist:
  - 'eva'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 44 KB
          rating: 1
          desc:
            cn: 约 44 KB（估算）
            en: ~44 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
