lang: Python
homepage: https://github.com/scipy/scipy
license: BSD-3-Clause
desc:
  cn: SciPy 是一个开源的 Python 算法库和数学工具包
  en: SciPy is an open-source Python library and math toolkit
  cs: SciPy je open-source knihovna Pythonu a sada matematických nástrojů
  de: SciPy ist eine quelloffene Python-Bibliothek und mathematische Werkzeugkiste
  es: SciPy es una biblioteca de Python de código abierto y un conjunto de herramientas matemáticas
  fr: SciPy est une bibliothèque Python open source et une boîte à outils mathématique
  id: SciPy adalah pustaka Python sumber terbuka dan perangkat perkakas matematika
  it: SciPy è una libreria Python open source e un toolkit matematico
  ja: SciPy はオープンソースの Python ライブラリ兼数学ツールキットです
  ko: SciPy는 오픈 소스 Python 라이브러리이자 수학 도구 모음입니다
  pl: SciPy to open-source'owa biblioteka Pythona i zestaw narzędzi matematycznych
  pt: SciPy é uma biblioteca Python de código aberto e um conjunto de ferramentas matemáticas
  ro: SciPy este o bibliotecă Python open source și un set de instrumente matematice
  ru: SciPy — это библиотека Python с открытым исходным кодом и набор математических инструментов
  th: SciPy เป็นไลบรารี Python แบบโอเพนซอร์สและชุดเครื่องมือทางคณิตศาสตร์
  tr: SciPy, açık kaynaklı bir Python kitaplığı ve matematik araç setidir
  uk: SciPy — це бібліотека Python з відкритим кодом і набір математичних інструментів
  vi: SciPy là thư viện Python mã nguồn mở và bộ công cụ toán học
x:
  source: https://github.com/scipy/scipy
  eget: scipy/scipy
  apt: python3-scipy
  dnf: python3-scipy
  brew: scipy
  apt-get: python3-scipy
  pip: scipy
rule:
  /eget:
    cmd: x eget scipy/scipy
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: python -m pip install scipy
    reference: https://scipy.org/install/#installing-with-pip
    dsnap: scipy
  /conda:
    cmd: conda install scipy
    reference: https://scipy.org/install/#installing-via-conda
  darwin/brew:
    cmd: brew install scipy
    reference: https://scipy.org/install/#macos
  debian/apt:
    cmd: sudo apt-get install python3-scipy
    reference: https://scipy.org/install/#ubuntu-and-debian
    dsnap: python3-scipy
  ubuntu/apt:
    cmd: sudo apt-get install python3-scipy
    reference: https://scipy.org/install/#ubuntu-and-debian
    dsnap: python3-scipy
  fedora/dnf:
    cmd: sudo dnf install python3-scipy
    reference: https://scipy.org/install/#fedora
    dsnap: python3-scipy
binlist:
- scipy

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.6 MB
          rating: 1
          desc:
            cn: 约 1.6 MB（估算）
            en: ~1.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
