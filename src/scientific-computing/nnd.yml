lang: 'Rust'
homepage: 'https://github.com/al13n321/nnd'
license: 'Apache-2.0'
desc:
  cn: Linux 调试器
  en: 'A debugger for Linux'
x:
  source: https://github.com/al13n321/nnd
  eget: https://github.com/al13n321/nnd
rule:
  /eget:
    cmd: x eget al13n321/nnd
    reference: https://github.com/al13n321/nnd
binlist:
  - 'nnd'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.2 MB
          rating: 1
          desc:
            cn: 约 2.2 MB（估算）
            en: ~2.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
