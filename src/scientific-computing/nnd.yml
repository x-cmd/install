lang: 'Rust'
homepage: 'https://github.com/al13n321/nnd'
license: 'Apache-2.0'
desc:
  cn: Linux 调试器
  en: 'A debugger for Linux'
  cs: Ladicí nástroj pro Linux
  de: Ein Debugger für Linux
  es: Un depurador para Linux
  fr: Un débogueur pour Linux
  id: Debugger untuk Linux
  it: Un debugger per Linux
  ja: Linux 用のデバッガ
  ko: Linux용 디버거
  pl: Debugger dla Linuksa
  pt: Um depurador para Linux
  ro: Un depanlare pentru Linux
  ru: Отладчик для Linux
  th: ตัวดีบักสำหรับ Linux
  tr: Linux için bir hata ayıklayıcı
  uk: Відладчик для Linux
  vi: Trình gỡ lỗi cho Linux
x:
  source: https://github.com/al13n321/nnd
  eget: al13n321/nnd
rule:
  /eget:
    cmd: x eget al13n321/nnd
    reference: https://github.com/al13n321/nnd
binlist:
  - 'nnd'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.2 MB
          rating: 1
          desc:
            cn: 约 2.2 MB（估算）
            en: ~2.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
