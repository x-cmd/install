lang: Java
homepage: https://github.com/manikmagar/mulefd
license: MIT
desc:
  cn: Mule 流程调用图和图表
  en: Mule flow call graphs and diagrams
x:
  pkg:
    exist: true
  source: https://github.com/manikmagar/mulefd
  eget: https://github.com/manikmagar/mulefd
rule:
  /eget:
    cmd: x eget manikmagar/mulefd
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use mulefd
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install mulefd
    reference: https://github.com/manikmagar/mulefd#sdkman-linux-apple
  darwin/brew:
    cmd: brew install manikmagar/tap/mulefd
    reference: https://github.com/manikmagar/mulefd#homebrew-apple
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add manikmagar https://github.com/manikmagar/scoop-bucket \

      && x scoop install mulefd

      '
    reference: https://github.com/manikmagar/mulefd#scoop-windows
binlist:
- mulefd

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
