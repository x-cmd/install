lang: Java
homepage: https://github.com/manikmagar/mulefd
license: MIT
desc:
  cn: Mule 流程调用图和图表
  en: Mule flow call graphs and diagrams
  cs: Grafy volání a diagramy toků Mule
  de: Mule Flow Call Graphs und Diagramme
  es: Grafos de llamadas y diagramas de flujos de Mule
  fr: Graphes d'appels et diagrammes de flux Mule
  id: Graf panggilan dan diagram alur Mule
  it: Grafici delle chiamate e diagrammi dei flussi Mule
  ja: Mule フローの呼び出しグラフと図
  ko: Mule 플로우 호출 그래프 및 다이어그램
  pl: Wykresy wywołań i diagramy przepływów Mule
  pt: Grafos de chamadas e diagramas de fluxos do Mule
  ro: Grafuri de apeluri și diagrame de fluxuri Mule
  ru: Графы вызовов и диаграммы потоков Mule
  th: กราฟการเรียกและไดอะแกรมของ Mule flow
  tr: Mule akış çağrı grafikleri ve diyagramları
  uk: Графи викликів та діаграми потоків Mule
  vi: Đồ thị lời gọi và sơ đồ luồng Mule
x:
  source: https://github.com/manikmagar/mulefd
  eget: manikmagar/mulefd
  brew: manikmagar/tap/mulefd
  scoop: mulefd
rule:
  /eget:
    cmd: x eget manikmagar/mulefd
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use mulefd
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install mulefd
    reference: https://github.com/manikmagar/mulefd#sdkman-linux-apple
  darwin/brew:
    cmd: brew install manikmagar/tap/mulefd
    reference: https://github.com/manikmagar/mulefd#homebrew-apple
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add manikmagar https://github.com/manikmagar/scoop-bucket \

      && x scoop install mulefd

      '
    reference: https://github.com/manikmagar/mulefd#scoop-windows
binlist:
- mulefd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 62 KB
          rating: 1
          desc:
            cn: 约 62 KB（估算）
            en: ~62 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
