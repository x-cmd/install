lang: Java
homepage: https://github.com/apache/activemq
license: Apache-2.0
desc:
  cn: 强大的开源消息传递服务器
  en: powerful open source messaging server
x:
  pkg:
    exist: true
  source: https://github.com/apache/activemq
rule:
  /x:
    cmd: x pkg use activemq
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install activemq
    reference: https://formulae.brew.sh/formula/activemq#default
  debian/apt:
    cmd: sudo apt-get install activemq
    reference: https://command-not-found.com/activemq
    dsnap: activemq
  ubuntu/apt:
    cmd: sudo apt-get install activemq
    reference: https://command-not-found.com/activemq
    dsnap: activemq
  kali/apt:
    cmd: sudo apt-get install activemq
    reference: https://command-not-found.com/activemq
    dsnap: activemq
  fedora/dnf:
    cmd: sudo dnf install activemq
    reference: https://command-not-found.com/activemq
    dsnap: activemq
  raspbian/apt:
    cmd: sudo apt-get install activemq
    reference: https://command-not-found.com/activemq
binlist:
- activemq

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 约 11 MB（估算）
            en: ~11 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
