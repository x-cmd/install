lang: Java
homepage: https://github.com/testingisdocumenting/webtau
license: Apache-2.0
desc:
  cn: WebTau（Web 测试自动化）是一个测试 API、命令行工具和框架，用于编写单元测试、集成测试和端到端测试
  en: WebTau (web test automation) is a testing API, command line tool and a framework to write unit, integration and end-to-end tests
x:
  source: https://github.com/testingisdocumenting/webtau
  brew: testingisdocumenting/brew/webtau
rule:
  /sdk:
    cmd: sdk install webtau
    reference: https://testingisdocumenting.org/webtau/getting-started/installation#groovy-runner
  darwin/brew:
    cmd: brew install testingisdocumenting/brew/webtau
    reference: https://testingisdocumenting.org/webtau/getting-started/installation#groovy-runner
binlist:
- webtau

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 约 1.4 MB（估算）
            en: ~1.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
