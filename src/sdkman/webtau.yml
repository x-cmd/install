lang: Java
homepage: https://github.com/testingisdocumenting/webtau
license: Apache-2.0
desc:
  cn: WebTau（Web 测试自动化）是一个测试 API、命令行工具和框架，用于编写单元测试、集成测试和端到端测试
  en: WebTau (web test automation) is a testing API, command line tool and a framework to write unit, integration and end-to-end tests
x:
  source: https://github.com/testingisdocumenting/webtau
rule:
  /sdk:
    cmd: sdk install webtau
    reference: https://testingisdocumenting.org/webtau/getting-started/installation#groovy-runner
  darwin/brew:
    cmd: brew install testingisdocumenting/brew/webtau
    reference: https://testingisdocumenting.org/webtau/getting-started/installation#groovy-runner
binlist:
- webtau
