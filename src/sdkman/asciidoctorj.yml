lang: Java
homepage: https://github.com/asciidoctor/asciidoctorj
license: Apache-2.0
desc:
  cn: Asciidoctorj 是在 JVM 上运行 Asciidoctor 的官方图书馆
  en: AsciidoctorJ is the official library for running Asciidoctor on the JVM
x:
  source: https://github.com/asciidoctor/asciidoctorj
rule:
  /asdf:
    cmd: x asdf use asciidoctorj
    reference: https://github.com/gliwka/asdf-asciidoctorj
  darwin/brew:
    cmd: brew install asciidoctorj
    reference: https://formulae.brew.sh/formula/asciidoctorj#default
  (win|wsl2)/choco:
    cmd: x choco install asciidoctorj
    reference: https://github.com/asciidoctor/asciidoctorj#windows-installation
binlist:
- asciidoctorj

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 473 KB
          rating: 1
          desc:
            cn: 约 473 KB（估算）
            en: ~473 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
