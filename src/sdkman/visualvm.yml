lang: Java
homepage: https://github.com/oracle/visualvm
desc:
  cn: VisualVM 是集成命令行 JDK 工具和轻量级分析功能的可视化工具
  en: VisualVM is a visual tool integrating commandline JDK tools and lightweight profiling capabilities
x:
  pkg:
    exist: true
  source: https://github.com/oracle/visualvm
  eget: https://github.com/oracle/visualvm
rule:
  /eget:
    cmd: x eget oracle/visualvm
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use visualvm
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install --cask visualvm
    reference: https://formulae.brew.sh/cask/visualvm#default
  debian/apt:
    cmd: sudo apt-get install visualvm
    reference: https://command-not-found.com/visualvm
    dsnap: visualvm
  ubuntu/apt:
    cmd: sudo apt-get install visualvm
    reference: https://command-not-found.com/visualvm
    dsnap: visualvm
  arch/pacman:
    cmd: sudo pacman -S visualvm
    reference: https://command-not-found.com/visualvm
  arch/yay:
    cmd: yay -S visualvm
    reference: https://aur.archlinux.org/packages/visualvm
binlist:
- visualvm
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
