lang: JavaScript
homepage: https://chromium.googlesource.com/chromium/src/+/refs/heads/main/chrome/test/chromedriver
desc:
  cn: WebDriver 是用于在许多浏览器中对 WebApp 进行自动测试的开源工具
  en: WebDriver is an open source tool for automated testing of webapps across many browsers
  cs: WebDriver je open source nástroj pro automatizované testování webových aplikací v mnoha prohlížečích
  de: WebDriver ist ein quelloffenes Werkzeug zum automatisierten Testen von Webanwendungen in vielen Browsern
  es: WebDriver es una herramienta de código abierto para pruebas automatizadas de aplicaciones web en muchos navegadores
  fr: WebDriver est un outil open source pour les tests automatisés d'applications web sur de nombreux navigateurs
  id: WebDriver adalah perkakas open source untuk pengujian otomatis aplikasi web di banyak peramban
  it: WebDriver è uno strumento open source per il collaudo automatizzato di webapp su molti browser
  ja: WebDriver は、多くのブラウザでウェブアプリケーションを自動テストするためのオープンソースツールです
  ko: WebDriver는 여러 브라우저에서 웹앱을 자동 테스트하는 오픈 소스 도구입니다
  pl: WebDriver jest narzędziem open source do automatycznego testowania aplikacji webowych w wielu przeglądarkach
  pt: WebDriver é uma ferramenta de código aberto para testes automatizados de aplicações web em muitos navegadores
  ro: WebDriver este un instrument open source pentru testarea automatizată a aplicațiilor web în multe browsere
  ru: WebDriver — инструмент с открытым исходным кодом для автоматического тестирования веб-приложений во многих браузерах
  th: WebDriver คือเครื่องมือโอเพนซอร์สสำหรับการทดสอบเว็บแอปโดยอัตโนมัติในเบราว์เซอร์หลายตัว
  tr: WebDriver, birçok tarayıcıda web uygulamalarını otomatik test etmek için açık kaynaklı bir araçtır
  uk: WebDriver — інструмент з відкритим кодом для автоматизованого тестування вебзастосунків у багатьох браузерах
  vi: WebDriver là công cụ mã nguồn mở để kiểm thử tự động ứng dụng web trên nhiều trình duyệt
rule:
  /asdf:
    cmd: x asdf use chromedriver
    reference: https://github.com/schinckel/asdf-chromedriver
  darwin/brew:
    cmd: brew install --cask chromedriver
    reference: https://github.com/SeleniumHQ/selenium/wiki/ChromeDriver/01fde32d0ed245141e24151f83b7c2db31d596a4#quick-installation
  (win|wsl2)/scoop:
    cmd: x scoop install chromedriver
    reference: https://scoop.sh/#/apps?q=chromedriver
  (win|wsl2)/choco:
    cmd: x choco install chromedriver
    reference: https://community.chocolatey.org/packages/chromedriver
  /apt:
    cmd: sudo apt-get install chromium-driver
    reference: https://github.com/SeleniumHQ/selenium/wiki/ChromeDriver/01fde32d0ed245141e24151f83b7c2db31d596a4#quick-installation
  darwin/webi:
    cmd: curl -sS https://webi.sh/chromedriver | sh
    reference: https://webinstall.dev/chromedriver/
  linux/webi:
    cmd: curl -sS https://webi.sh/chromedriver | sh
    reference: https://webinstall.dev/chromedriver/
  win/webi:
    cmd: curl.exe https://webi.ms/chromedriver | powershell
    reference: https://webinstall.dev/chromedriver/
  arch/yay:
    cmd: yay -S chromedriver
    reference: https://aur.archlinux.org/packages/chromedriver

x:
  apt: chromium-driver
  apt-get: chromium-driver
  scoop: chromedriver
  choco: chromedriver
  yay: chromedriver
  asdf: chromedriver
binlist:
- chromedriver
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
