homepage: https://github.com/apache/maven-mvnd/releases/
license: Apache-2.0
desc:
  cn: 使用 Gradle 和 Takari 已知的技术提供更快的 Maven 构建
  en: providing faster Maven builds using techniques known from Gradle and Takari
lang: Java
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use mvnd
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use mvnd
    reference: https://github.com/joschi/asdf-mvnd
  /sdk:
    cmd: sdk install mvnd
    reference: https://github.com/apache/maven-mvnd#install-using-sdkman
  darwin/brew:
    cmd: brew install mvndaemon/homebrew-mvnd/mvnd
    reference: https://github.com/apache/maven-mvnd#install-using-homebrew
  arch/yay:
    cmd: yay -S mvnd
    reference: https://aur.archlinux.org/packages/mvnd
binlist:
- mvnd

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
