homepage: https://github.com/apache/maven-mvnd/releases/
license: Apache-2.0
desc:
  cn: 使用 Gradle 和 Takari 已知的技术提供更快的 Maven 构建
  en: providing faster Maven builds using techniques known from Gradle and Takari
  cs: Rychlejší sestavení Mavenu s využitím technik známých z Gradle a Takari
  de: Schnellere Maven-Builds mit Techniken aus Gradle und Takari
  es: Compilaciones de Maven más rápidas mediante técnicas conocidas de Gradle y Takari
  fr: Des builds Maven plus rapides grâce aux techniques connues de Gradle et Takari
  id: Build Maven yang lebih cepat menggunakan teknik yang dikenal dari Gradle dan Takari
  it: Build Maven più veloci utilizzando tecniche note da Gradle e Takari
  ja: Gradle と Takari でよく知られた手法を用いて Maven ビルドを高速化
  ko: Gradle과 Takari의 알려진 기법을 사용하여 더 빠른 Maven 빌드 제공
  pl: Szybsze kompilacje Maven przy użyciu technik znanych z Gradle i Takari
  pt: Compilações Maven mais rápidas usando técnicas conhecidas de Gradle e Takari
  ro: Construiri Maven mai rapide folosind tehnici cunoscute din Gradle și Takari
  ru: Более быстрая сборка Maven с использованием приёмов из Gradle и Takari
  th: ให้การบิลด์ Maven เร็วขึ้นโดยใช้เทคนิคที่ได้รับการพัฒนาจาก Gradle และ Takari
  tr: Gradle ve Takari'den bilinen tekniklerle daha hızlı Maven derlemeleri
  uk: Швидші збірки Maven з використанням прийомів із Gradle та Takari
  vi: Cung cấp bản dựng Maven nhanh hơn bằng các kỹ thuật đã biết từ Gradle và Takari
lang: Java
x:
  brew: mvndaemon/homebrew-mvnd/mvnd
  yay: mvnd
  asdf: mvnd
rule:
  /x:
    cmd: x pkg use mvnd
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use mvnd
    reference: https://github.com/joschi/asdf-mvnd
  /sdk:
    cmd: sdk install mvnd
    reference: https://github.com/apache/maven-mvnd#install-using-sdkman
  darwin/brew:
    cmd: brew install mvndaemon/homebrew-mvnd/mvnd
    reference: https://github.com/apache/maven-mvnd#install-using-homebrew
  arch/yay:
    cmd: yay -S mvnd
    reference: https://aur.archlinux.org/packages/mvnd
binlist:
- mvnd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 约 50 MB（估算）
            en: ~50 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB（估算）
          en: 80 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
