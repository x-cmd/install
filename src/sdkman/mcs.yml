lang: Java
homepage: https://github.com/mthmulders/mcs
license: MIT
desc:
  cn: Maven Central Search，或简称 mcs，是一个小型 CLI，用于从命令行查询 Maven Central
  en: Maven Central Search, or mcs for short, is a small CLI to query Maven Central from your command line
x:
  pkg:
    exist: true
  source: https://github.com/mthmulders/mcs
  eget: https://github.com/mthmulders/mcs
  brew: mthmulders/tap/mcs
  snap: maven-central-search
rule:
  /x:
    cmd: x pkg use mcs
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget mthmulders/mcs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install mthmulders/tap/mcs
    reference: https://github.com/mthmulders/mcs?tab=readme-ov-file#installation
  /snap:
    cmd: sudo snap install maven-central-search
    reference: https://github.com/mthmulders/mcs?tab=readme-ov-file#installation
  /sdk:
    cmd: sdk install mcs
    reference: https://github.com/mthmulders/mcs?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install mcs
    reference: https://github.com/mthmulders/mcs?tab=readme-ov-file#installation
binlist:
- mcs
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # Minecraft server status
    filesystem:
      read:
        desc:
          cn: 无文件系统读写
          en: No filesystem reads or writes
  resource:
    disk:
      size:
        install:
          estimate: 66 KB
          rating: 1
          desc:
            cn: 约 66 KB（估算）
            en: ~66 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 150 MB
        desc:
          cn: ~150 MB
          en: ~150 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 状态查询时短暂占用
          en: Brief spike on status query
