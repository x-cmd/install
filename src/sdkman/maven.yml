homepage: https://github.com/apache/maven
license: Apache-2.0
desc:
  cn: 基于 java 的项目管理器
  en: Java-based project management
lang: Java
x:
  pkg:
    exist: true
  source: https://github.com/apache/maven
rule:
  /x:
    cmd: x pkg use maven
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use maven
    reference: https://github.com/halcyon/asdf-maven
  darwin/brew:
    cmd: brew install maven
    reference: https://formulae.brew.sh/formula/maven#default
binlist:
- maven
