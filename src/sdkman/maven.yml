homepage: https://github.com/apache/maven
license: Apache-2.0
desc:
  cn: 基于 java 的项目管理器
  en: Java-based project management
  cs: Správa projektů založená na Java
  de: Java-basierte Projektverwaltung
  es: Gestión de proyectos basada en Java
  fr: Gestion de projets basée sur Java
  id: Manajemen proyek berbasis Java
  it: Gestione dei progetti basata su Java
  ja: Java ベースのプロジェクト管理
  ko: Java 기반 프로젝트 관리
  pl: Zarządzanie projektami oparte na Javie
  pt: Gerenciamento de projetos baseado em Java
  ro: Gestionarea proiectelor bazată pe Java
  ru: Управление проектами на базе Java
  th: การจัดการโครงการที่ใช้ Java
  tr: Java tabanlı proje yönetimi
  uk: Керування проєктами на базі Java
  vi: Quản lý dự án dựa trên Java
lang: Java
x:
  source: https://github.com/apache/maven
  brew: maven
  asdf: maven
rule:
  /x:
    cmd: x pkg use maven
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use maven
    reference: https://github.com/halcyon/asdf-maven
  darwin/brew:
    cmd: brew install maven
    reference: https://formulae.brew.sh/formula/maven#default
binlist:
- maven

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.9 MB
          rating: 1
          desc:
            cn: 约 5.9 MB（估算）
            en: ~5.9 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
