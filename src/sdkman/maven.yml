homepage: https://github.com/apache/maven
license: Apache-2.0
desc:
  cn: 基于 java 的项目管理器
  en: Java-based project management
lang: Java
x:
  pkg:
    exist: true
  source: https://github.com/apache/maven
rule:
  /x:
    cmd: x pkg use maven
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use maven
    reference: https://github.com/halcyon/asdf-maven
  darwin/brew:
    cmd: brew install maven
    reference: https://formulae.brew.sh/formula/maven#default
binlist:
- maven

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
