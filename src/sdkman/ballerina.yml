lang: Ballerina
homepage: https://github.com/ballerina-platform/ballerina-lang
license: Apache-2.0
desc:
  cn: 网络分布式应用程序的编程语言
  en: Programming Language for Network Distributed Applications
  cs: Programovací jazyk pro síťově distribuované aplikace
  de: Programmiersprache für netzwerkverteilte Anwendungen
  es: Lenguaje de programación para aplicaciones distribuidas en red
  fr: Langage de programmation pour les applications distribuées en réseau
  id: Bahasa pemrograman untuk aplikasi terdistribusi berbasis jaringan
  it: Linguaggio di programmazione per applicazioni distribuite in rete
  ja: ネットワーク分散アプリケーション向けのプログラミング言語
  ko: 네트워크 분산 애플리케이션을 위한 프로그래밍 언어
  pl: Język programowania dla rozproszonych aplikacji sieciowych
  pt: Linguagem de programação para aplicações distribuídas em rede
  ro: Limbaj de programare pentru aplicații distribuite în rețea
  ru: Язык программирования для сетевых распределённых приложений
  th: ภาษาโปรแกรมสำหรับแอปพลิเคชันแบบกระจายในเครือข่าย
  tr: Ağ üzerinden dağıtılmış uygulamalar için programlama dili
  uk: Мова програмування для розподілених мережевих застосунків
  vi: Ngôn ngữ lập trình cho các ứng dụng phân tán qua mạng
x:
  source: https://github.com/ballerina-platform/ballerina-lang
  brew: ballerina
  yay: ballerina-bin
rule:
  /x:
    cmd: x pkg use ballerina
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install ballerina
    reference: https://formulae.brew.sh/formula/ballerina#default
  arch/yay:
    cmd: yay -S ballerina-bin
    reference: https://aur.archlinux.org/packages/ballerina-bin
binlist:
- ballerina

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
