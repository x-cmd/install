lang: Ballerina
homepage: https://github.com/ballerina-platform/ballerina-lang
license: Apache-2.0
desc:
  cn: 网络分布式应用程序的编程语言
  en: Programming Language for Network Distributed Applications
x:
  pkg:
    exist: true
  source: https://github.com/ballerina-platform/ballerina-lang
rule:
  /x:
    cmd: x pkg use ballerina
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install ballerina
    reference: https://formulae.brew.sh/formula/ballerina#default
  arch/yay:
    cmd: yay -S ballerina-bin
    reference: https://aur.archlinux.org/packages/ballerina-bin
binlist:
- ballerina

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
