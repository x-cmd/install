lang: kscript
homepage: https://github.com/kscripting/kscript#installation
license: MIT
desc:
  cn: kscript 是一种动态编程语言，具有表达力的语法，跨平台支持，和丰富的标准库。它的主要目标是让开发者能够编写无需依赖特定平台或操作系统的代码的程序，可以在任何地方运行。
  en: kscript is a dynamic programming language with expressive syntax, cross-platform support, and a rich standard library. Its main goal is to enable developers to write programs that do not require code that relies on a specific platform or operating system and can run anywhere.
  cs: kscript je dynamický programovací jazyk s expresivní syntaxí, podporou napříč platformami a bohatou standardní knihovnou. Jeho hlavním cílem je umožnit vývojářům psát programy, které nevyžadují kód závislý na konkrétní platformě nebo operačním systému, a mohou běžet kdekoli.
  de: kscript ist eine dynamische Programmiersprache mit ausdrucksstarker Syntax, plattformübergreifender Unterstützung und einer reichhaltigen Standardbibliothek. Ihr Hauptziel ist es, Entwicklern das Schreiben von Programmen zu ermöglichen, die keinen Code erfordern, der von einer bestimmten Plattform oder einem bestimmten Betriebssystem abhängt, und überall ausgeführt werden können.
  es: kscript es un lenguaje de programación dinámico con sintaxis expresiva, soporte multiplataforma y una rica biblioteca estándar. Su objetivo principal es permitir que los desarrolladores escriban programas que no requieren código dependiente de una plataforma u sistema operativo específico y que pueden ejecutarse en cualquier lugar.
  fr: kscript est un langage de programmation dynamique doté d'une syntaxe expressive, d'une prise en charge multiplateforme et d'une bibliothèque standard riche. Son objectif principal est de permettre aux développeurs d'écrire des programmes qui ne nécessitent pas de code dépendant d'une plateforme ou d'un système d'exploitation particulier et qui peuvent s'exécuter partout.
  id: kscript adalah bahasa pemrograman dinamis dengan sintaks ekspresif, dukungan lintas platform, dan pustaka standar yang kaya. Tujuan utamanya adalah memungkinkan pengembang menulis program yang tidak memerlukan kode yang bergantung pada platform atau sistem operasi tertentu dan dapat berjalan di mana saja.
  it: kscript è un linguaggio di programmazione dinamico con sintassi espressiva, supporto multipiattaforma e una ricca libreria standard. Il suo obiettivo principale è consentire agli sviluppatori di scrivere programmi che non richiedono codice dipendente da una piattaforma o da un sistema operativo specifico e che possono essere eseguiti ovunque.
  ja: kscript は、表現力豊かな構文、クロスプラットフォームサポート、豊富な標準ライブラリを備えた動的プログラミング言語です。主な目的は、特定のプラットフォームやオペレーティングシステムに依存するコードを必要とせず、どこでも実行できるプログラムを開発者が書けるようにすることです。
  ko: kscript는 표현력 있는 구문, 크로스 플랫폼 지원, 풍부한 표준 라이브러리를 갖춘 동적 프로그래밍 언어입니다. 주요 목표는 특정 플랫폼이나 운영 체제에 의존하는 코드가 필요하지 않고 어디에서나 실행할 수 있는 프로그램을 개발자가 작성할 수 있게 하는 것입니다.
  pl: kscript to dynamiczny język programowania o ekspresyjnej składni, obsłudze międzyplatformowej i bogatym standardzie bibliotece. Jego głównym celem jest umożliwienie deweloperom pisania programów, które nie wymagają kodu zależnego od konkretnej platformy lub systemu operacyjnego i mogą działać wszędzie.
  pt: kscript é uma linguagem de programação dinâmica com sintaxe expressiva, suporte multiplataforma e uma biblioteca padrão rica. Seu principal objetivo é permitir que os desenvolvedores escrevam programas que não exigem código dependente de uma plataforma ou sistema operacional específico e que podem ser executados em qualquer lugar.
  ro: kscript este un limbaj de programare dinamic cu sintaxă expresivă, suport multiplă platforme și o bibliotecă standard bogată. Scopul său principal este de a permite dezvoltatorilor să scrie programe care nu necesită cod dependent de o platformă sau un sistem de operare specific și care pot rula oriunde.
  ru: kscript — это динамический язык программирования с выразительным синтаксисом, кроссплатформенной поддержкой и богатой стандартной библиотекой. Его главная цель — позволить разработчикам писать программы, не требующие кода, зависящего от конкретной платформы или операционной системы, и запускаемые где угодно.
  th: kscript เป็นภาษาการเขียนโปรแกรมแบบไดนามิกที่มีไวยากรณ์เข้มงัน รองรับข้ามแพลตฟอร์ม และมีไลบรารีมาตรฐานที่มีความสมบูรณ์ เป้าหมายหลักของมันคือช่วยให้นักพัฒนาเขียนโปรแกรมที่ไม่ต้องพึ่งพาโค้ดซึ่งขึ้นอยู่กับแพลตฟอร์มหรือระบบปฏิบัติการเฉพาะ และสามารถทำงานได้ทุกที่
  tr: kscript, etkileyici söz dizimi, platformlar arası destek ve zengin bir standart kütüphane sunan dinamik bir programlama dilidir. Temel amacı, geliştiricilerin belirli bir platforma veya işletim sistemine bağımlı kod gerektirmeyen ve her yerde çalışabilen programlar yazmasını sağlamaktır.
  uk: kscript — це динамічна мова програмування з виразним синтаксисом, кросплатформенною підтримкою та багатою стандартною бібліотекою. Її головна мета — дозволити розробникам писати програми, які не потребують коду, залежного від конкретної платформи чи операційної системи, і які можна запускати будь-де.
  vi: kscript là một ngôn ngữ lập trình động với cú pháp biểu đạt, hỗ trợ đa nền tảng và thư viện tiêu chuẩn phong phú. Mục tiêu chính của nó là giúp các nhà phát triển viết những chương trình không cần mã phụ thuộc vào một nền tảng hoặc hệ điều hành cụ thể và có thể chạy ở bất cứ đâu
x:
  source: https://github.com/kscripting/kscript#installation
  brew: kscripting/tap/kscript
  yay: kscript
  asdf: kscript
rule:
  /x:
    cmd: x pkg use kscript
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use kscript
    reference: https://github.com/edgelevel/asdf-kscript
  /sdk:
    cmd: sdk install kscript
    reference: https://github.com/kscripting/kscript#installation
  darwin/brew:
    cmd: brew install kscripting/tap/kscript
    reference: https://github.com/kscripting/kscript#installation-with-homebrew
  arch/yay:
    cmd: sudo yay -S kscript
    reference: https://github.com/kscripting/kscript#installation-on-arch-linux
binlist:
- kscript

