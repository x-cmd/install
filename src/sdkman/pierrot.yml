lang: Java
homepage: https://github.com/agorapulse/pierrot
license: Apache-2.0
desc:
  cn: 多仓库 GitHub 管理工具
  en: Multi-repository GitHub Governance Tool
x:
  pkg:
    exist: true
  source: https://github.com/agorapulse/pierrot
  eget: https://github.com/agorapulse/pierrot
rule:
  /eget:
    cmd: x eget agorapulse/pierrot
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use pierrot
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install pierrot
    reference: https://agorapulse.github.io/pierrot/#_installation
binlist:
- pierrot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 68 KB
          rating: 1
          desc:
            cn: 约 68 KB（估算）
            en: ~68 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
