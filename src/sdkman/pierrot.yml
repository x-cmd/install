lang: Java
homepage: https://github.com/agorapulse/pierrot
license: Apache-2.0
desc:
  cn: 多仓库 GitHub 管理工具
  en: Multi-repository GitHub Governance Tool
  cs: Nástroj pro správu více repozitářů na GitHubu
  de: Multi-Repository GitHub Governance Tool
  es: Herramienta de gobernanza de GitHub para múltiples repositorios
  fr: Outil de gouvernance GitHub multi-dépôts
  id: Alat tata kelola GitHub untuk multi-repositori
  it: Strumento di governance GitHub multi-repository
  ja: マルチリポジトリの GitHub ガバナンスツール
  ko: 멀티 저장소 GitHub 거버넌스 도구
  pl: Narzędzie do zarządzania wieloma repozytoriami GitHub
  pt: Ferramenta de governança do GitHub para múltiplos repositórios
  ro: Instrument de guvernanță GitHub pentru mai multe depozite
  ru: Инструмент управления несколькими репозиториями GitHub
  th: เครื่องมือกำกับดูแล GitHub สำหรับหลาย repository
  tr: Çoklu depozito için GitHub yönetişim aracı
  uk: Інструмент управління кількома репозиторіями GitHub
  vi: Công cụ quản trị GitHub cho nhiều kho lưu trữ
x:
  source: https://github.com/agorapulse/pierrot
  eget: agorapulse/pierrot
rule:
  /eget:
    cmd: x eget agorapulse/pierrot
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use pierrot
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install pierrot
    reference: https://agorapulse.github.io/pierrot/#_installation
binlist:
- pierrot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 21 MB
          rating: 2
          desc:
            cn: 安装 21 MB
            en: 21 MB install
        download:
          estimate: 21 MB
          desc:
            cn: 约 21 MB 下载 (linux/x64)
            en: ~21 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
