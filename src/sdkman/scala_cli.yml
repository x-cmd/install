homepage: https://github.com/VirtusLab/scala-cli
license: Apache-2.0
lang: Scala
desc:
  cn: Scala CLI 是一个与 Scala 语言交互的命令行工具。可以编译、运行、测试和打包 Scala 代码
  en: Scala CLI is a command-line tool for interacting with the Scala language. It can compile, run, test, and package Scala code
  cs: Scala CLI je nástroj příkazového řádku pro práci s jazykem Scala. Umí kompilovat, spouštět, testovat a balit kód Scala
  de: Scala CLI ist ein Befehlszeilenwerkzeug für die Arbeit mit der Sprache Scala. Es kann Scala-Code kompilieren, ausführen, testen und paketieren
  es: Scala CLI es una herramienta de línea de comandos para interactuar con el lenguaje Scala. Puede compilar, ejecutar, probar y empaquetar código Scala
  fr: Scala CLI est un outil en ligne de commande pour interagir avec le langage Scala. Il peut compiler, exécuter, tester et empaqueter du code Scala
  id: Scala CLI adalah alat baris perintah untuk berinteraksi dengan bahasa Scala. Dapat mengompilasi, menjalankan, menguji, dan mengemas kode Scala
  it: Scala CLI è uno strumento da riga di comando per interagire con il linguaggio Scala. Può compilare, eseguire, testare e impacchettare codice Scala
  ja: Scala CLI は Scala 言語と対話するためのコマンドラインツールです。Scala コードのコンパイル、実行、テスト、パッケージングができます
  ko: Scala CLI는 Scala 언어와 상호작용하기 위한 명령줄 도구입니다. Scala 코드를 컴파일, 실행, 테스트 및 패키징할 수 있습니다
  pl: Scala CLI to narzędzie wiersza poleceń do pracy z językiem Scala. Potrafi kompilować, uruchamiać, testować i pakować kod Scali
  pt: O Scala CLI é uma ferramenta de linha de comando para interagir com a linguagem Scala. Ele pode compilar, executar, testar e empacotar código Scala
  ro: Scala CLI este un instrument de linie de comandă pentru interacțiunea cu limbajul Scala. Poate compila, rula, testa și împacheta cod Scala
  ru: Scala CLI — инструмент командной строки для работы с языком Scala. Он умеет компилировать, запускать, тестировать и упаковывать код Scala
  th: Scala CLI เป็นเครื่องมือบรรทัดคำสั่งสำหรับการทำงานกับภาษา Scala สามารถคอมไพล์ รัน ทดสอบ และแพ็กเกจโค้ด Scala
  tr: Scala CLI, Scala diliyle etkileşim kurmak için bir komut satırı aracıdır. Scala kodunu derleyebilir, çalıştırabilir, test edebilir ve paketleyebilir
  uk: Scala CLI — це інструмент командного рядка для роботи з мовою Scala. Він може компілювати, запускати, тестувати та пакувати код Scala
  vi: Scala CLI là công cụ dòng lệnh để tương tác với ngôn ngữ Scala. Nó có thể biên dịch, chạy, kiểm thử và đóng gói mã Scala
x:
  source: https://github.com/VirtusLab/scala-cli
  eget: VirtusLab/scala-cli
  apt: scala-cli
  dnf: scala-cli
  brew: Virtuslab/scala-cli/scala-cli
  yum: scala-cli
  scoop: scala-cli
  choco: scala-cli
  winget: virtuslab.scalacli
  yay: scala-cli
rule:
  /eget:
    cmd: x eget VirtusLab/scala-cli
    reference: https://x-cmd.com/mod/eget
  /sdk:
    cmd: sdk install scalacli
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
  darwin/brew:
    cmd: brew install Virtuslab/scala-cli/scala-cli
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
  /nix:
    cmd: sudo nix-env -iA nixpkgs.scala-cli
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
  darwin/curl:
    cmd: 'curl -fL https://github.com/Virtuslab/scala-cli/releases/latest/download/scala-cli-aarch64-apple-darwin.gz | gzip -d > scala-cli \

      && chmod +x scala-cli \

      && mv scala-cli /usr/local/bin/scala-cli

      '
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
  win/curl:
    cmd: 'curl -fLo scala-cli.zip https://github.com/Virtuslab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-win32.zip \

      && tar -xf scala-cli.zip

      '
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
  (win|wsl2)/choco:
    cmd: x choco install scala-cli
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
  (win|wsl2)/scoop:
    cmd: x scoop install scala-cli
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
  (win|wsl2)/winget:
    cmd: x winget install virtuslab.scalacli
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
  linux/curl:
    cmd: 'curl -fL https://github.com/Virtuslab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz | gzip -d > scala-cli \

      && chmod +x scala-cli \

      && sudo mv scala-cli /usr/local/bin/scala-cli

      '
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
  debian/apt:
    cmd: 'curl -sS "https://virtuslab.github.io/scala-cli-packages/KEY.gpg" \

      && sudo gpg --dearmor  -o /etc/apt/trusted.gpg.d/scala-cli.gpg 2>/dev/null \

      && sudo curl -s --compressed -o /etc/apt/sources.list.d/scala_cli_packages.list "https://virtuslab.github.io/scala-cli-packages/debian/scala_cli_packages.list" \

      && sudo apt update \

      && sudo apt install scala-cli

      '
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
    dsnap: scala-cli
  ubuntu/apt:
    cmd: 'curl -sS "https://virtuslab.github.io/scala-cli-packages/KEY.gpg" \

      && sudo gpg --dearmor  -o /etc/apt/trusted.gpg.d/scala-cli.gpg 2>/dev/null \

      && sudo curl -s --compressed -o /etc/apt/sources.list.d/scala_cli_packages.list "https://virtuslab.github.io/scala-cli-packages/debian/scala_cli_packages.list" \

      && sudo apt update \

      && sudo apt install scala-cli

      '
    reference: https://scala-cli.virtuslab.org/install#advanced-installation
    dsnap: scala-cli
  centos/yum:
    cmd: 'cat << EOF | sudo tee /etc/yum.repos.d/virtuslab.repo

      [virtuslab-repo]

      name=VirtusLab Repo

      baseurl=https://virtuslab.github.io/scala-cli-packages/CentOS/Packages

      enabled=1

      gpgcheck=1

      gpgkey=https://virtuslab.github.io/scala-cli-packages/KEY.gpg

      EOF \

      && sudo yum repo-pkgs virtuslab-repo list \

      && sudo yum install scala-cli

      '
    reference: https://www.scala-sbt.org/download.html
  fedora/yum:
    cmd: 'cat << EOF | sudo tee /etc/yum.repos.d/virtuslab.repo

      [virtuslab-repo]

      name=VirtusLab Repo

      baseurl=https://virtuslab.github.io/scala-cli-packages/CentOS/Packages

      enabled=1

      gpgcheck=1

      gpgkey=https://virtuslab.github.io/scala-cli-packages/KEY.gpg

      EOF \

      && sudo yum repo-pkgs virtuslab-repo list \

      && sudo yum install scala-cli

      '
    reference: https://www.scala-sbt.org/download.html
  rhel/yum:
    cmd: 'cat << EOF | sudo tee /etc/yum.repos.d/virtuslab.repo

      [virtuslab-repo]

      name=VirtusLab Repo

      baseurl=https://virtuslab.github.io/scala-cli-packages/CentOS/Packages

      enabled=1

      gpgcheck=1

      gpgkey=https://virtuslab.github.io/scala-cli-packages/KEY.gpg

      EOF \

      && sudo yum repo-pkgs virtuslab-repo list \

      && sudo yum install scala-cli

      '
    reference: https://www.scala-sbt.org/download.html
  alpine/apk:
    cmd: 'wget -q -O scala-cli.gz  https://github.com/Virtuslab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux-static.gz && gunzip scala-cli.gz \

      && sudo chmod +x scala-cli \

      && sudo mv scala-cli /usr/bin/

      '
    reference: https://www.scala-sbt.org/download.html
  arch/yay:
    cmd: yay -S scala-cli
    reference: https://aur.archlinux.org/packages/scala-cli
binlist:
- scala_cli

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
