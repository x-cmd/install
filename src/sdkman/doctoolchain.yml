lang: Groovy
homepage: https://github.com/docToolchain/docToolchain
license: MIT
desc:
  cn: Doctoolchain 是一个开源项目，致力于自动创建技术文档
  en: docToolchain is an open source project dedicated to automating the creation of technical documentation
  cs: docToolchain je open source projekt věnovaný automatizaci tvorby technické dokumentace
  de: docToolchain ist ein quelloffenes Projekt zur Automatisierung der Erstellung technischer Dokumentation
  es: docToolchain es un proyecto de código abierto dedicado a automatizar la creación de documentación técnica
  fr: docToolchain est un projet open source dédié à l'automatisation de la création de documentation technique
  id: docToolchain adalah proyek open source yang didedikasikan untuk mengotomatiskan pembuatan dokumentasi teknis
  it: docToolchain è un progetto open source dedicato all'automazione della creazione di documentazione tecnica
  ja: docToolchain は技術文書の作成を自動化することに特化したオープンソースプロジェクトです
  ko: docToolchain는 기술 문서 생성을 자동화하는 데 전념한 오픈 소스 프로젝트입니다
  pl: docToolchain to projekt open source poświęcony automatyzacji tworzenia dokumentacji technicznej
  pt: docToolchain é um projeto de código aberto dedicado a automatizar a criação de documentação técnica
  ro: docToolchain este un proiect open source dedicat automatizării creării documentației tehnice
  ru: docToolchain — проект с открытым исходным кодом, посвящённый автоматизации создания технической документации
  th: docToolchain คือโครงการโอเพนซอร์สที่มุ่งมั่นทำให้การสร้างเอกสารทางเทคนิคเป็นอัตโนมัติ
  tr: docToolchain, teknik dokümantasyon oluşturmayı otomatikleştirmeye adanmış açık kaynaklı bir projedir
  uk: docToolchain — проєкт з відкритим кодом, присвячений автоматизації створення технічної документації
  vi: docToolchain là dự án mã nguồn mở tập trung tự động hóa việc tạo tài liệu kỹ thuật
x:
  source: https://github.com/docToolchain/docToolchain
  eget: docToolchain/docToolchain
  asdf: doctoolchain
rule:
  /eget:
    cmd: x eget docToolchain/docToolchain
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use doctoolchain
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use doctoolchain
    reference: https://github.com/joschi/asdf-doctoolchain
  /curl:
    cmd: 'curl -Lo dtcw https://doctoolchain.org/dtcw \

      && chmod +x dtcw \

      && ./dtcw install doctoolchain

      '
    reference: https://doctoolchain.org/docToolchain/v2.0.x/020_tutorial/010_Install.html#install-dtc-with-dtcw
  /wget:
    cmd: 'wget doctoolchain.org/dtcw \

      && chmod +x dtcw \

      && ./dtcw install doctoolchain

      '
    reference: https://doctoolchain.org/docToolchain/v2.0.x/020_tutorial/010_Install.html#install-dtc-with-dtcw
binlist:
- doctoolchain

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 386 KB
          rating: 1
          desc:
            cn: 约 386 KB（估算）
            en: ~386 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
