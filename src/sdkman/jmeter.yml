x:
  source: https://github.com/apache/jmeter
  yay: jmeter
rule:
  /x:
    cmd: x pkg use jmeter
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S jmeter
    reference: https://aur.archlinux.org/packages/jmeter
binlist:
- jmeter

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.9 MB
          rating: 1
          desc:
            cn: 约 3.9 MB（估算）
            en: ~3.9 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
