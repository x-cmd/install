lang: Java
homepage: https://github.com/apache/jmeter
license: Apache-2.0
desc:
  cn: 负载测试和性能测量应用程序
  en: Load testing and performance measurement application
x:
  pkg:
    exist: true
  source: https://github.com/apache/jmeter
rule:
  /x:
    cmd: x pkg use jmeter
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S jmeter
    reference: https://aur.archlinux.org/packages/jmeter
binlist:
- jmeter

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
