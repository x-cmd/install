lang: Java
homepage: https://github.com/apache/jmeter
license: Apache-2.0
desc:
  cn: 负载测试和性能测量应用程序
  en: Load testing and performance measurement application
x:
  pkg:
    exist: true
  source: https://github.com/apache/jmeter
rule:
  /x:
    cmd: x pkg use jmeter
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S jmeter
    reference: https://aur.archlinux.org/packages/jmeter
binlist:
- jmeter

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.9 MB
          rating: 1
          desc:
            cn: 约 3.9 MB（估算）
            en: ~3.9 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
