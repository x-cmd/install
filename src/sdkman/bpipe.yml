lang: Groovy
homepage: https://github.com/ssadedin/bpipe
desc:
  cn: 一个用于构建和管理生物信息学流程的工具
  en: a tool for running and managing bioinformatics pipelines
x:
  pkg:
    exist: true
  source: https://github.com/ssadedin/bpipe
  eget: https://github.com/ssadedin/bpipe
rule:
  /eget:
    cmd: x eget ssadedin/bpipe
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use bpipe
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -OL https://github.com/ssadedin/bpipe/releases/download/0.9.11/bpipe-0.9.11.tar.gz
    reference: https://docs.bpipe.org/Releases/0.9.11/#bpipe-version-0911
  /wget:
    cmd: wget https://github.com/ssadedin/bpipe/releases/download/0.9.11/bpipe-0.9.11.tar.gz
    reference: https://docs.bpipe.org/Releases/0.9.11/#bpipe-version-0911
binlist:
- bpipe
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
