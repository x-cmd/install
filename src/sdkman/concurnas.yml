lang: Java
homepage: https://github.com/Concurnas/Concurnas
license: MIT
desc:
  cn: concurnas 是一种开源编程语言，旨在构建可靠、可扩展、高性能的并发、分布式和并行系统
  en: Concurnas is an open source programming language designed for building reliable, scalable, high performance concurrent, distributed and parallel systems
x:
  pkg:
    exist: true
  source: https://github.com/Concurnas/Concurnas
  eget: https://github.com/Concurnas/Concurnas
rule:
  /eget:
    cmd: x eget Concurnas/Concurnas
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use concurnas
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install concurnas
    reference: https://concurnas.com/download
binlist:
- concurnas

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
