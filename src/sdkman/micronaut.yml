lang: Java
homepage: https://github.com/micronaut-projects/micronaut-core
license: Apache-2.0
desc:
  cn: micronaut 是一个基于 JVM 的框架，用于构建轻量级、模块化的应用和微服务。micronaut 采用了预编译（AOT）的技术，可以提高启动速度和降低内存消耗，与传统的 JVM 框架相比，具有更高的效率和易用性。micronaut 支持多种语言（如 Java、Kotlin、Groovy 等）和多种平台（如 GraalVM、AWS Lambda、Google Cloud 等）。
  en: micronaut is a JVM-based framework for building lightweight, modular applications and microservices. Micronaut uses pre-compilation (AOT) technology, which can improve startup speed and reduce memory consumption. Compared with traditional JVM frameworks, it is more efficient and easier to use. micronaut supports multiple languages (such as Java, Kotlin, Groovy, etc.) and multiple platforms (such as GraalVM, AWS Lambda, Google Cloud, etc.).
x:
  pkg:
    exist: true
  source: https://github.com/micronaut-projects/micronaut-core
  eget: https://github.com/micronaut-projects/micronaut-core
rule:
  /x:
    cmd: x pkg use micronaut
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget micronaut-projects/micronaut-core
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use micronaut
    reference: https://github.com/weibemoura/asdf-micronaut
  /sdk:
    cmd: sdk install micronaut
    reference: https://micronaut-projects.github.io/micronaut-starter/latest/guide/index.html#installSdkman
  darwin/brew:
    cmd: brew install --cask micronaut-projects/tap/micronaut
    reference: https://micronaut-projects.github.io/micronaut-starter/latest/guide/index.html#installHomebrew
  darwin/port:
    cmd: sudo port selfupdate && sudo port install micronaut
    reference: https://micronaut-projects.github.io/micronaut-starter/latest/guide/index.html#installMacports
  (win|wsl2)/choco:
    cmd: x choco install micronaut
    reference: https://micronaut-projects.github.io/micronaut-starter/latest/guide/index.html#installChocolatey
  arch/yay:
    cmd: yay -S micronaut
    reference: https://aur.archlinux.org/packages/micronaut
binlist:
- micronaut

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
