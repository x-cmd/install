lang: Java
homepage: https://github.com/micronaut-projects/micronaut-core
license: Apache-2.0
desc:
  cn: micronaut 是一个基于 JVM 的框架，用于构建轻量级、模块化的应用和微服务。micronaut 采用了预编译（AOT）的技术，可以提高启动速度和降低内存消耗，与传统的 JVM 框架相比，具有更高的效率和易用性。micronaut 支持多种语言（如 Java、Kotlin、Groovy 等）和多种平台（如 GraalVM、AWS Lambda、Google Cloud 等）。
  en: micronaut is a JVM-based framework for building lightweight, modular applications and microservices. Micronaut uses pre-compilation (AOT) technology, which can improve startup speed and reduce memory consumption. Compared with traditional JVM frameworks, it is more efficient and easier to use. micronaut supports multiple languages (such as Java, Kotlin, Groovy, etc.) and multiple platforms (such as GraalVM, AWS Lambda, Google Cloud, etc.).
  cs: micronaut je framework založený na JVM pro tvorbu lehkých, modulárních aplikací a mikroslužeb. Micronaut používá technologii předkompilace (AOT), která může zrychlit start a snížit spotřebu paměti. Ve srovnání s tradičními JVM frameworky je efektivnější a snazší na použití. Micronaut podporuje více jazyků (například Java, Kotlin, Groovy atd.) a více platforem (například GraalVM, AWS Lambda, Google Cloud atd.).
  de: micronaut ist ein auf der JVM basierendes Framework zum Erstellen von leichten, modularen Anwendungen und Microservices. Micronaut nutzt Vorabkompilierung (AOT), die die Startzeit verkürzen und den Speicherverbrauch senken kann. Im Vergleich zu herkömmlichen JVM-Frameworks ist es effizienter und einfacher zu bedienen. Micronaut unterstützt mehrere Sprachen (wie Java, Kotlin, Groovy usw.) und mehrere Plattformen (wie GraalVM, AWS Lambda, Google Cloud usw.).
  es: micronaut es un framework basado en la JVM para crear aplicaciones y microservicios ligeros y modulares. Micronaut utiliza tecnología de precompilación (AOT), que puede mejorar el tiempo de arranque y reducir el consumo de memoria. Comparado con los frameworks tradicionales de la JVM, es más eficiente y fácil de usar. micronaut admite varios lenguajes (como Java, Kotlin, Groovy, etc.) y varias plataformas (como GraalVM, AWS Lambda, Google Cloud, etc.).
  fr: micronaut est un framework basé sur la JVM pour créer des applications et des microservices légers et modulaires. Micronaut utilise la précompilation (AOT), qui peut accélérer le démarrage et réduire la consommation de mémoire. Par rapport aux frameworks JVM traditionnels, il est plus efficace et plus simple à utiliser. micronaut prend en charge plusieurs langages (tels que Java, Kotlin, Groovy, etc.) et plusieurs plateformes (telles que GraalVM, AWS Lambda, Google Cloud, etc.).
  id: micronaut adalah framework berbasis JVM untuk membangun aplikasi ringan dan termodular serta microservice. Micronaut menggunakan teknologi prakompilasi (AOT) yang dapat mempercepat waktu startup dan mengurangi penggunaan memori. Dibandingkan dengan framework JVM tradisional, ini lebih efisien dan mudah digunakan. micronaut mendukung berbagai bahasa (seperti Java, Kotlin, Groovy, dll.) dan berbagai platform (seperti GraalVM, AWS Lambda, Google Cloud, dll.).
  it: micronaut è un framework basato sulla JVM per creare applicazioni e microservizi leggeri e modulari. Micronaut usa la precompilazione (AOT), che può migliorare il tempo di avvio e ridurre il consumo di memoria. Rispetto ai framework JVM tradizionali, è più efficiente e facile da usare. micronaut supporta più linguaggi (come Java, Kotlin, Groovy, ecc.) e più piattaforme (come GraalVM, AWS Lambda, Google Cloud, ecc.).
  ja: micronaut は、軽量でモジュール化されたアプリケーションとマイクロサービスを構築するための JVM ベースのフレームワークです。Micronaut は事前コンパイル (AOT) 技術を使用し、起動速度の向上とメモリ消費の削減を図ります。従来の JVM フレームワークと比べて、より効率的で使いやすいです。micronaut は Java、Kotlin、Groovy などの複数の言語や GraalVM、AWS Lambda、Google Cloud などの複数のプラットフォームに対応しています。
  ko: micronaut는 가볍고 모듈화된 애플리케이션과 마이크로서비스를 구축하기 위한 JVM 기반 프레임워크입니다. Micronaut는 미리 컴파일(AOT) 기술을 사용하여 시작 속도를 높이고 메모리 사용량을 줄일 수 있습니다. 기존 JVM 프레임워크와 비교하여 더 효율적이고 사용하기 쉽습니다. micronaut는 Java, Kotlin, Groovy 등 여러 언어와 GraalVM, AWS Lambda, Google Cloud 등 여러 플랫폼을 지원합니다.
  pl: micronaut to framework oparty na JVM do budowania lekkich, modularnych aplikacji i mikrousług. Micronaut wykorzystuje technologię kompilacji wstępnej (AOT), która może przyspieszyć uruchamianie i zmniejszyć zużycie pamięci. W porównaniu z tradycyjnymi frameworkami JVM jest wydajniejszy i łatwiejszy w użyciu. micronaut obsługuje wiele języków (takich jak Java, Kotlin, Groovy itp.) i wiele platform (takich jak GraalVM, AWS Lambda, Google Cloud itp.).
  pt: micronaut é um framework baseado na JVM para construir aplicações e microsserviços leves e modulares. O Micronaut usa tecnologia de pré-compilação (AOT), que pode melhorar o tempo de inicialização e reduzir o consumo de memória. Comparado aos frameworks JVM tradicionais, ele é mais eficiente e fácil de usar. O micronaut suporta várias linguagens (como Java, Kotlin, Groovy etc.) e várias plataformas (como GraalVM, AWS Lambda, Google Cloud etc.).
  ro: micronaut este un framework bazat pe JVM pentru construirea de aplicații și microservicii ușoare și modulare. Micronaut folosește tehnologia de precompilare (AOT), care poate îmbunătăți timpul de pornire și poate reduce consumul de memorie. Comparat cu frameworkurile JVM tradiționale, este mai eficient și mai ușor de utilizat. micronaut acceptă mai multe limbaje (precum Java, Kotlin, Groovy etc.) și mai multe platforme (precum GraalVM, AWS Lambda, Google Cloud etc.).
  ru: micronaut — это фреймворк на базе JVM для создания легковесных модульных приложений и микросервисов. Micronaut использует предварительную компиляцию (AOT), которая может ускорить запуск и снизить потребление памяти. По сравнению с традиционными JVM-фреймворками он эффективнее и проще в использовании. micronaut поддерживает несколько языков (таких как Java, Kotlin, Groovy и др.) и несколько платформ (таких как GraalVM, AWS Lambda, Google Cloud и др.).
  th: micronaut เป็นเฟรมเวิร์กบนพื้นฐาน JVM สำหรับสร้างแอปพลิเคชันและไมโครเซอร์วิสที่เบาและเป็นโมดูล Micronaut ใช้เทคโนโลยีการคอมไพล์ล่วงหน้า (AOT) ซึ่งช่วยเพิ่มความเร็วในการเริ่มทำงานและลดการใช้หน่วยความจำ เมื่อเทียบกับเฟรมเวิร์ก JVM แบบดั้งเดิม แอปจะมีประสิทธิภาพกว่าและใช้งานง่ายกว่า micronaut รองรับหลายภาษา (เช่น Java, Kotlin, Groovy เป็นต้น) และหลายแพลตฟอร์ม (เช่น GraalVM, AWS Lambda, Google Cloud เป็นต้น)
  tr: micronaut, hafif, modüler uygulamalar ve mikroservisler geliştirmek için JVM tabanlı bir çerçevedir. Micronaut, başlatma hızını artırabilen ve bellek tüketimini azaltabilen ön derleme (AOT) teknolojisini kullanır. Geleneksel JVM çerçevelerine kıyasla daha verimli ve kullanımı kolaydır. micronaut birden çok dili (Java, Kotlin, Groovy vb.) ve birden çok platformu (GraalVM, AWS Lambda, Google Cloud vb.) destekler.
  uk: micronaut — це фреймворк на базі JVM для створення легких модульних застосунків і мікросервісів. Micronaut використовує технологію попередньої компіляції (AOT), яка може пришвидшити запуск і зменшити споживання пам'яті. Порівняно з традиційними JVM-фреймворками він ефективніший і простіший у використанні. micronaut підтримує кілька мов (таких як Java, Kotlin, Groovy тощо) і кілька платформ (таких як GraalVM, AWS Lambda, Google Cloud тощо).
  vi: micronaut là framework dựa trên JVM để xây dựng các ứng dụng và vi dịch vụ nhẹ, mô đun hóa. Micronaut sử dụng công nghệ biên dịch trước (AOT), giúp tăng tốc độ khởi động và giảm mức tiêu thụ bộ nhớ. So với các framework JVM truyền thống, nó hiệu quả hơn và dễ sử dụng hơn. micronaut hỗ trợ nhiều ngôn ngữ (như Java, Kotlin, Groovy, v.v.) và nhiều nền tảng (như GraalVM, AWS Lambda, Google Cloud, v.v.)
x:
  source: https://github.com/micronaut-projects/micronaut-core
  eget: micronaut-projects/micronaut-core
  port: micronaut
  choco: micronaut
  yay: micronaut
  asdf: micronaut
rule:
  /x:
    cmd: x pkg use micronaut
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget micronaut-projects/micronaut-core
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use micronaut
    reference: https://github.com/weibemoura/asdf-micronaut
  /sdk:
    cmd: sdk install micronaut
    reference: https://micronaut-projects.github.io/micronaut-starter/latest/guide/index.html#installSdkman
  darwin/brew:
    cmd: brew install --cask micronaut-projects/tap/micronaut
    reference: https://micronaut-projects.github.io/micronaut-starter/latest/guide/index.html#installHomebrew
  darwin/port:
    cmd: sudo port selfupdate && sudo port install micronaut
    reference: https://micronaut-projects.github.io/micronaut-starter/latest/guide/index.html#installMacports
  (win|wsl2)/choco:
    cmd: x choco install micronaut
    reference: https://micronaut-projects.github.io/micronaut-starter/latest/guide/index.html#installChocolatey
  arch/yay:
    cmd: yay -S micronaut
    reference: https://aur.archlinux.org/packages/micronaut
binlist:
- micronaut

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 约 50 MB（估算）
            en: ~50 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB（估算）
          en: 80 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
