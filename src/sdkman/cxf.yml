lang: Java
homepage: https://github.com/apache/cxf
license: Apache-2.0
desc:
  cn: 一个开源服务框架，帮助你使用前端编程 API 构建和开发服务，如 JAX-WS 和 JAX-RS
  en: An Open-Source Services Framework,helps you build and develop services using frontend programming APIs, like JAX-WS and JAX-RS
x:
  pkg:
    exist: true
  source: https://github.com/apache/cxf
rule:
  /x:
    cmd: x pkg use cxf
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S apache-cxf
    reference: https://aur.archlinux.org/packages/apache-cxf
binlist:
- cxf

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 约 16 MB（估算）
            en: ~16 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
