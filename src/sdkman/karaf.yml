lang: Java
homepage: https://github.com/apache/karaf
license: Apache-2.0
desc:
  cn: Karaf 是一个支持各种框架和技术的模块化运行时
  en: Karaf is the modulith runtime, supporting a wide range of frameworks and technologies
x:
  pkg:
    exist: true
  source: https://github.com/apache/karaf
rule:
  /x:
    cmd: x pkg use karaf
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S apache-karaf
    reference: https://aur.archlinux.org/packages/apache-karaf
binlist:
- karaf

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2.8 MB
          rating: 1
          desc:
            cn: 约 2.8 MB（估算）
            en: ~2.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
