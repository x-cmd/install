lang: Java
homepage: https://github.com/apache/karaf
license: Apache-2.0
desc:
  cn: Karaf 是一个支持各种框架和技术的模块化运行时
  en: Karaf is the modulith runtime, supporting a wide range of frameworks and technologies
x:
  pkg:
    exist: true
  source: https://github.com/apache/karaf
rule:
  /x:
    cmd: x pkg use karaf
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S apache-karaf
    reference: https://aur.archlinux.org/packages/apache-karaf
binlist:
- karaf

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
