lang: scala/java
homepage: https://github.com/coursier/coursier
license: Apache-2.0
desc:
  cn: Coursier 是 Scala 应用和构件管理器
  en: Coursier is the Scala application and artifact manager
  cs: Coursier je správce aplikací a artefaktů pro Scala
  de: Coursier ist der Scala-Anwendungs- und Artefakt-Manager
  es: Coursier es el gestor de aplicaciones y artefactos de Scala
  fr: Coursier est le gestionnaire d'applications et d'artefacts pour Scala
  id: Coursier adalah pengelola aplikasi dan artefak untuk Scala
  it: Coursier è il gestore di applicazioni e artefatti per Scala
  ja: Coursier は Scala アプリケーションとアーティファクトのパッケージマネージャーです
  ko: Coursier는 Scala 애플리케이션 및 아티팩트 관리자입니다
  pl: Coursier to menedżer aplikacji i artefaktów dla Scali
  pt: Coursier é o gerenciador de aplicativos e artefatos para Scala
  ro: Coursier este managerul de aplicații și artefacte pentru Scala
  ru: Coursier — менеджер приложений и артефактов для Scala
  th: Coursier คือตัวจัดการแอปพลิเคชันและอาร์ติแฟกต์สำหรับ Scala
  tr: Coursier, Scala uygulama ve artefakt yöneticisidir
  uk: Coursier — менеджер застосунків і артефактів для Scala
  vi: Coursier là trình quản lý ứng dụng và artifact cho Scala
x:
  source: https://github.com/coursier/coursier
  eget: coursier/coursier
  brew: coursier/formulas/coursier
  yay: coursier
  pacaur: coursier
  asdf: coursier
rule:
  /eget:
    cmd: x eget coursier/coursier
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use coursier
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use coursier
    reference: https://github.com/jiahuili430/asdf-coursier
  /curl:
    cmd: 'curl -fLo coursier https://github.com/coursier/launchers/raw/master/coursier \

      && chmod +x coursier \

      && ./coursier

      '
    reference: https://get-coursier.io/docs/cli-installation#linux-macos
  darwin/brew:
    cmd: 'brew install coursier/formulas/coursier \

      && cs setup

      '
    reference: https://get-coursier.io/docs/cli-installation#macos-brew-based-installation
  darwin/curl:
    cmd: curl -fL https://github.com/VirtusLab/coursier-m1/releases/latest/download/cs-aarch64-apple-darwin.gz | gzip -d > cs
    reference: https://get-coursier.io/docs/cli-installation#macos
  linux/brew:
    cmd: curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" | gzip -d > cs
    reference: https://get-coursier.io/docs/cli-installation#linux
  win/powershell:
    cmd: 'x pwsh Invoke-WebRequest -Uri "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-win32.zip" -OutFile "cs-x86_64-pc-win32.zip" \

      && x pwsh Expand-Archive -Path "cs-x86_64-pc-win32.zip" \

      && x pwsh Rename-Item -Path "cs-x86_64-pc-win32.exe" -NewName "cs.exe" \

      && x pwsh Remove-Item -Path "cs-x86_64-pc-win32.zip" \

      && x pwsh .\cs --help

      '
    reference: https://get-coursier.io/docs/cli-installation#windows
  arch/pacaur:
    cmd: sudo pacaur -S coursier
    reference: https://get-coursier.io/docs/cli-installation#arch-linux
  arch/yay:
    cmd: yay -S coursier
    reference: https://aur.archlinux.org/packages/coursier
binlist:
- coursier

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 22 MB
          rating: 2
          desc:
            cn: 安装 22 MB
            en: 22 MB install
        download:
          estimate: 22 MB
          desc:
            cn: 约 22 MB 下载 (linux/x64)
            en: ~22 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
