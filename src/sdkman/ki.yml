homepage: https://github.com/Kotlin/kotlin-interactive-shell/
license: Apache-2.0
desc:
  cn: Kotlin 语言的交互式 Shell
  en: Kotlin Language Interactive Shell
  cs: Interaktivní shell pro jazyk Kotlin
  de: Interaktive Shell für die Sprache Kotlin
  es: Shell interactivo para el lenguaje Kotlin
  fr: Interpréteur de commandes interactif pour le langage Kotlin
  id: Shell interaktif untuk bahasa Kotlin
  it: Shell interattiva per il linguaggio Kotlin
  ja: Kotlin 言語の対話型シェル
  ko: Kotlin 언어용 대화형 셸
  pl: Interaktywna powłoka dla języka Kotlin
  pt: Shell interativo para a linguagem Kotlin
  ro: Shell interactiv pentru limbajul Kotlin
  ru: Интерактивная оболочка для языка Kotlin
  th: เชล์แบบโต้ตอบสำหรับภาษา Kotlin
  tr: Kotlin diline yönelik etkileşimli kabuk
  uk: Інтерактивна оболонка для мови Kotlin
  vi: Shell tương tác cho ngôn ngữ Kotlin
lang: Ki
x:
  source: https://github.com/Kotlin/kotlin-interactive-shell
  eget: Kotlin/kotlin-interactive-shell
  brew: ki
  port: ki-shell
  trizen: ki-shell-bin
  yay: ki-shell-bin
  asdf: ki
rule:
  /eget:
    cmd: x eget Kotlin/kotlin-interactive-shell
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use ki
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use ki
    reference: https://github.com/comdotlinux/asdf-ki
  /sdk:
    cmd: sdk install ki
    reference: https://github.com/Kotlin/kotlin-interactive-shell#sdkman
  darwin/brew:
    cmd: brew install ki
    reference: https://formulae.brew.sh/formula/ki#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install ki-shell
    reference: https://github.com/Kotlin/kotlin-interactive-shell#macports
  arch/trizen:
    cmd: sudo trizen -S ki-shell-bin
    reference: https://github.com/Kotlin/kotlin-interactive-shell#arch-linux
  arch/yay:
    cmd: yay -S ki-shell-bin
    reference: https://aur.archlinux.org/packages/ki-shell-bin
binlist:
- ki

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
