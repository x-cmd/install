homepage: https://github.com/Kotlin/kotlin-interactive-shell/
license: Apache-2.0
desc:
  cn: Kotlin 语言的交互式 Shell
  en: Kotlin Language Interactive Shell
lang: Ki
x:
  pkg:
    exist: true
  source: https://github.com/Kotlin/kotlin-interactive-shell
  eget: https://github.com/Kotlin/kotlin-interactive-shell
rule:
  /eget:
    cmd: x eget Kotlin/kotlin-interactive-shell
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use ki
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use ki
    reference: https://github.com/comdotlinux/asdf-ki
  /sdk:
    cmd: sdk install ki
    reference: https://github.com/Kotlin/kotlin-interactive-shell#sdkman
  darwin/brew:
    cmd: brew install ki
    reference: https://formulae.brew.sh/formula/ki#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install ki-shell
    reference: https://github.com/Kotlin/kotlin-interactive-shell#macports
  arch/trizen:
    cmd: sudo trizen -S ki-shell-bin
    reference: https://github.com/Kotlin/kotlin-interactive-shell#arch-linux
  arch/yay:
    cmd: yay -S ki-shell-bin
    reference: https://aur.archlinux.org/packages/ki-shell-bin
binlist:
- ki

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
