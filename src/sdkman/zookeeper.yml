lang: Java
homepage: https://github.com/apache/zookeeper
license: Apache-2.0
desc:
  cn: ZooKeeper 是用于维护配置信息、命名、提供分布式同步和提供组服务的集中式服务
  en: ZooKeeper is a centralized service for maintaining configuration information, naming, providing distributed synchronization, and providing group services
x:
  source: https://github.com/apache/zookeeper
rule:
  darwin/brew:
    cmd: brew install zookeeper
    reference: https://formulae.brew.sh/formula/zookeeper#default
  (win|wsl2)/scoop:
    cmd: x scoop install zookeeper
    reference: https://scoop.sh/#/apps?q=zookeeper
  arch/yay:
    cmd: yay -S zookeeper
    reference: https://aur.archlinux.org/packages/zookeeper
binlist:
- zookeeper

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4.1 MB
          rating: 1
          desc:
            cn: 约 4.1 MB（估算）
            en: ~4.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
