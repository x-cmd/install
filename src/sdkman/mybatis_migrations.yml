lang: Java
homepage: https://github.com/mybatis/migrations
license: Apache-2.0
desc:
  cn: MyBatis Migrations 是一个命令行数据库迁移工具
  en: MyBatis Migrations is a command line Database migrations tool
x:
  pkg:
    exist: true
  source: https://github.com/mybatis/migrations
  eget: https://github.com/mybatis/migrations
rule:
  /eget:
    cmd: x eget mybatis/migrations
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use mybatis_migrations
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install mybatis
    reference: https://github.com/mybatis/migrations?tab=readme-ov-file#sdkman
binlist:
- mybatis_migrations

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 约 50 MB（估算）
            en: ~50 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB（估算）
          en: 80 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
