  en: A Launcher and API for Modularized Java Applications
  cs: Launcher a API pro modulární Java aplikace
  de: Ein Launcher und eine API für modulare Java-Anwendungen
  es: Un launcher y una API para aplicaciones Java modularizadas
  fr: Un lanceur et une API pour les applications Java modulaires
  id: Launcher dan API untuk aplikasi Java termodularisasi
  it: Un launcher e un'API per applicazioni Java modularizzate
  ja: モジュール化された Java アプリケーション用のランチャーと API
  ko: 모듈화된 Java 애플리케이션을 위한 런처와 API
  pl: Launcher i API dla modularnych aplikacji Java
  pt: Um launcher e uma API para aplicações Java modularizadas
  ro: Un launcher și o API pentru aplicații Java modularizate
  ru: Лаунчер и API для модульных Java-приложений
  th: ตัวเรียกใช้งานและ API สำหรับแอปพลิเคชัน Java แบบโมดูลาร์
  tr: Modüler Java uygulamaları için bir başlatıcı ve API
  uk: Лаунчер і API для модульних Java-застосунків
  vi: Trình khởi chạy và API cho các ứng dụng Java được mô đun hóa
x:
  source: https://github.com/moditect/layrry
  eget: moditect/layrry
rule:
  /eget:
    cmd: x eget moditect/layrry
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use layrry
    reference: https://x-cmd.com/install/
binlist:
- layrry

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 76 KB
          rating: 1
          desc:
            cn: 约 76 KB（估算）
            en: ~76 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
