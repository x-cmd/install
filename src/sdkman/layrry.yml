lang: Java
homepage: https://github.com/moditect/layrry
license: Apache-2.0
desc:
  cn: 用于模块化 Java 应用程序的启动器和 API
  en: A Launcher and API for Modularized Java Applications
x:
  source: https://github.com/moditect/layrry
  eget: https://github.com/moditect/layrry
rule:
  /eget:
    cmd: x eget moditect/layrry
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use layrry
    reference: https://x-cmd.com/install/
binlist:
- layrry

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 76 KB
          rating: 1
          desc:
            cn: 约 76 KB（估算）
            en: ~76 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
