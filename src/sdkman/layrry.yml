lang: Java
homepage: https://github.com/moditect/layrry
license: Apache-2.0
desc:
  cn: 用于模块化 Java 应用程序的启动器和 API
  en: A Launcher and API for Modularized Java Applications
x:
  pkg:
    exist: true
  source: https://github.com/moditect/layrry
  eget: https://github.com/moditect/layrry
rule:
  /eget:
    cmd: x eget moditect/layrry
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use layrry
    reference: https://x-cmd.com/install/
binlist:
- layrry

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
