lang: Java
homepage: https://github.com/moditect/layrry
license: Apache-2.0
desc:
  cn: 用于模块化 Java 应用程序的启动器和 API
  en: A Launcher and API for Modularized Java Applications
x:
  pkg:
    exist: true
  source: https://github.com/moditect/layrry
  eget: https://github.com/moditect/layrry
rule:
  /eget:
    cmd: x eget moditect/layrry
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use layrry
    reference: https://x-cmd.com/install/
binlist:
- layrry
