homepage: https://github.com/sbt/sbt
license: Apache-2.0
desc:
  cn: 用于 Scala 项目的构建工具
  en: Build tool for Scala projects
lang: Scala
x:
  pkg:
    exist: true
  source: https://github.com/sbt/sbt
  eget: https://github.com/sbt/sbt
rule:
  /eget:
    cmd: x eget sbt/sbt
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use sbt
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use sbt
    reference: https://github.com/bram2000/asdf-sbt
  /sdk:
    cmd: sdk install sbt
    reference: https://www.scala-sbt.org/download.html
  darwin/brew:
    cmd: brew install sbt
    reference: https://formulae.brew.sh/formula/sbt#default
  (win|wsl2)/choco:
    cmd: x choco install sbt
    reference: https://www.scala-sbt.org/download.html
  (win|wsl2)/scoop:
    cmd: x scoop install sbt
    reference: https://www.scala-sbt.org/download.html
  debian/apt:
    cmd: 'echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" \

      && sudo tee /etc/apt/sources.list.d/sbt.list \

      && echo "deb https://repo.scala-sbt.org/scalasbt/debian /" \

      && sudo tee /etc/apt/sources.list.d/sbt_old.list \

      && curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" \

      && sudo apt-key add \

      && sudo apt-get update \

      && sudo apt-get install sbt

      '
    reference: https://www.scala-sbt.org/download.html
    dsnap: sbt
  ubuntu/apt:
    cmd: 'echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" \

      && sudo tee /etc/apt/sources.list.d/sbt.list \

      && echo "deb https://repo.scala-sbt.org/scalasbt/debian /" \

      && sudo tee /etc/apt/sources.list.d/sbt_old.list \

      && curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" \

      && sudo apt-key add \

      && sudo apt-get update \

      && sudo apt-get install sbt

      '
    reference: https://www.scala-sbt.org/download.html
    dsnap: sbt
  centos/yum:
    cmd: 'sudo rm -f /etc/yum.repos.d/bintray-rpm.repo || true \

      && curl -L https://www.scala-sbt.org/sbt-rpm.repo > sbt-rpm.repo \

      && sudo mv sbt-rpm.repo /etc/yum.repos.d/ \

      && sudo yum install sbt

      '
    reference: https://www.scala-sbt.org/download.html
  fedora/yum:
    cmd: 'sudo rm -f /etc/yum.repos.d/bintray-rpm.repo || true \

      && curl -L https://www.scala-sbt.org/sbt-rpm.repo > sbt-rpm.repo \

      && sudo mv sbt-rpm.repo /etc/yum.repos.d/ \

      && sudo yum install sbt

      '
    reference: https://www.scala-sbt.org/download.html
binlist:
- sbt

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
