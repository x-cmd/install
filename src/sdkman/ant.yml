lang: Java
homepage: https://github.com/apache/ant
desc:
  cn: Java 构建工具
  en: Java build tool
x:
  pkg:
    exist: true
  source: https://github.com/apache/ant
rule:
  /x:
    cmd: x pkg use ant
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use ant
    reference: https://github.com/jackboespflug/asdf-ant
  darwin/brew:
    cmd: brew install ant
    reference: https://formulae.brew.sh/formula/ant#default
  debian/apt:
    cmd: sudo apt-get install ant
    reference: https://command-not-found.com/ant
    dsnap: ant
  ubuntu/apt:
    cmd: sudo apt-get install ant
    reference: https://command-not-found.com/ant
    dsnap: ant
  arch/pacman:
    cmd: sudo pacman -S ant
    reference: https://command-not-found.com/ant
  kali/apt:
    cmd: sudo apt-get install ant
    reference: https://command-not-found.com/ant
    dsnap: ant
  centos/yum:
    cmd: sudo yum install ant
    reference: https://command-not-found.com/ant
  fedora/dnf:
    cmd: sudo dnf install ant
    reference: https://command-not-found.com/ant
    dsnap: ant
  raspbian/apt:
    cmd: sudo apt-get install ant
    reference: https://command-not-found.com/ant
binlist:
- ant
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
