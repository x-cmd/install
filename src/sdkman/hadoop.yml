lang: Java
homepage: https://github.com/apache/hadoop
license: Apache-2.0
desc:
  cn: Apache Hadoop 是用于在商品硬件建造的大型群集上运行应用程序的框架
  en: Apache Hadoop is a framework for running applications on large clusters built of commodity hardware
x:
  pkg:
    exist: true
  source: https://github.com/apache/hadoop
rule:
  /x:
    cmd: x pkg use hadoop
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install hadoop
    reference: https://formulae.brew.sh/formula/hadoop#default
  fedora/dnf:
    cmd: sudo dnf install hadoop-common
    reference: https://command-not-found.com/hadoop
    dsnap: hadoop-common
  arch/yay:
    cmd: yay -S hadoop
    reference: https://aur.archlinux.org/packages/hadoop
binlist:
- hadoop

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 45 MB
          rating: 2
          desc:
            cn: 约 45 MB（估算）
            en: ~45 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
