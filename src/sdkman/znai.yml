lang: Java
homepage: https://github.com/testingisdocumenting/znai
license: Apache-2.0
desc:
  cn: 一个用于生成功能性强、易于维护且美观的用户指南的工具。
  en: A tool for generating functional, easy to maintain, and aesthetically pleasing user guides.
x:
  source: https://github.com/testingisdocumenting/znai
rule:
  darwin/brew:
    cmd: brew install testingisdocumenting/brew/znai
    reference: https://testingisdocumenting.org/znai/introduction/getting-started#command-line-brew
binlist:
- znai

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
