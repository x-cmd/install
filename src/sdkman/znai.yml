lang: Java
homepage: https://github.com/testingisdocumenting/znai
license: Apache-2.0
desc:
  cn: 一个用于生成功能性强、易于维护且美观的用户指南的工具。
  en: A tool for generating functional, easy to maintain, and aesthetically pleasing user guides.
x:
  source: https://github.com/testingisdocumenting/znai
  brew: testingisdocumenting/brew/znairule:
  darwin/brew:
    cmd: brew install testingisdocumenting/brew/znai
    reference: https://testingisdocumenting.org/znai/introduction/getting-started#command-line-brew
binlist:
- znai

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.6 MB
          rating: 1
          desc:
            cn: 约 1.6 MB（估算）
            en: ~1.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
