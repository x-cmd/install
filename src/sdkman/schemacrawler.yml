lang: Java
homepage: https://github.com/schemacrawler/SchemaCrawler
desc:
  cn: SchemaCrawler 是一款免费的数据库架构发现和理解工具
  en: SchemaCrawler is a free database schema discovery and comprehension tool
  cs: SchemaCrawler je bezplatný nástroj pro objevování a pochopení schémat databází
  de: SchemaCrawler ist ein kostenloses Werkzeug zur Erkennung und zum Verständnis von Datenbankschemata
  es: SchemaCrawler es una herramienta gratuita para descubrir y comprender esquemas de bases de datos
  fr: SchemaCrawler est un outil gratuit de découverte et de compréhension des schémas de bases de données
  id: SchemaCrawler adalah alat gratis untuk menemukan dan memahami skema basis data
  it: SchemaCrawler è uno strumento gratuito per scoprire e comprendere gli schemi dei database
  ja: SchemaCrawler はデータベーススキーマの検出と理解のための無料ツールです
  ko: SchemaCrawler는 데이터베이스 스키마를 발견하고 이해하는 무료 도구입니다
  pl: SchemaCrawler to darmowe narzędzie do odkrywania i rozumienia schematów baz danych
  pt: O SchemaCrawler é uma ferramenta gratuita para descobrir e compreender esquemas de banco de dados
  ro: SchemaCrawler este un instrument gratuit pentru descoperirea și înțelegerea schemelor de baze de date
  ru: SchemaCrawler — бесплатный инструмент для обнаружения и понимания схем баз данных
  th: SchemaCrawler เป็นเครื่องมือฟรีสำหรับค้นพบและเข้าใจสคีมาฐานข้อมูล
  tr: SchemaCrawler, veritabanı şemalarını keşfetmek ve anlamak için ücretsiz bir araçtır
  uk: SchemaCrawler — безкоштовний інструмент для виявлення та розуміння схем баз даних
  vi: SchemaCrawler là công cụ miễn phí để khám phá và hiểu lược đồ cơ sở dữ liệu
x:
  source: https://github.com/schemacrawler/SchemaCrawler
  eget: schemacrawler/SchemaCrawler
  scoop: schemacrawler
  choco: schemacrawler
  asdf: schemacrawler
rule:
  /eget:
    cmd: x eget schemacrawler/SchemaCrawler
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use schemacrawler
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use schemacrawler
    reference: https://github.com/davidecavestro/asdf-schemacrawler
  /sdk:
    cmd: sdk install schemacrawler
    reference: https://www.schemacrawler.com/downloads.html
  (win|wsl2)/choco:
    cmd: x choco install schemacrawler
    reference: https://www.schemacrawler.com/downloads.html
  (win|wsl2)/scoop:
    cmd: x scoop install schemacrawler
    reference: https://www.schemacrawler.com/downloads.html
binlist:
- schemacrawler
license: NOASSERTION
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # JDBC database connection
    filesystem:
      read:
        desc:
          cn: 读取数据库 schema
          en: Reads database schema
        sensitive: []
      write:
        desc:
          cn: 输出 schema 报告
          en: Outputs schema report
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 约 1.4 MB（估算）
            en: ~1.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 500 MB
        desc:
          cn: 大型 schema ~500 MB
          en: ~500 MB on large schemas
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 大 schema 分析时
          en: Spike on large schema analysis
