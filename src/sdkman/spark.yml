lang: Scala
homepage: https://github.com/apache/spark
license: Apache-2.0
desc:
  cn: spark 是一个用于在单节点机器或集群上执行数据工程、数据科学和机器学习的多语言引擎
  en: spark is a multi-language engine for executing data engineering, data science, and machine learning on single-node machines or clusters
x:
  source: https://github.com/apache/spark
  yay: apache-spark
rule:
  /x:
    cmd: x pkg use spark
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S apache-spark
    reference: https://aur.archlinux.org/packages/apache-spark
binlist:
- spark

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 54 MB
          rating: 3
          desc:
            cn: 约 54 MB（估算）
            en: ~54 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
