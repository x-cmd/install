lang: Scala
homepage: https://github.com/apache/spark
license: Apache-2.0
desc:
  cn: spark 是一个用于在单节点机器或集群上执行数据工程、数据科学和机器学习的多语言引擎
  en: spark is a multi-language engine for executing data engineering, data science, and machine learning on single-node machines or clusters
x:
  pkg:
    exist: true
  source: https://github.com/apache/spark
rule:
  /x:
    cmd: x pkg use spark
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S apache-spark
    reference: https://aur.archlinux.org/packages/apache-spark
binlist:
- spark

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
