lang: Groovy
homepage: https://github.com/infrastructor/infrastructor
license: GPL-3.0
desc:
  cn: Infrastructor 是一个用 Groovy 编程语言编写的服务器供应和配置管理工具
  en: Infrastructor is a server provisioning and configuration management tool written in Groovy programming language
x:
  pkg:
    exist: true
  source: https://github.com/infrastructor/infrastructor
  eget: https://github.com/infrastructor/infrastructor
rule:
  /eget:
    cmd: x eget infrastructor/infrastructor
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use infrastructor
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install infrastructor
    reference: https://github.com/infrastructor/infrastructor#installation
binlist:
- infrastructor

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 137 KB
          rating: 1
          desc:
            cn: 约 137 KB（估算）
            en: ~137 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
