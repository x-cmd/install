lang: Groovy
homepage: https://github.com/infrastructor/infrastructor
license: GPL-3.0
desc:
  cn: Infrastructor 是一个用 Groovy 编程语言编写的服务器供应和配置管理工具
  en: Infrastructor is a server provisioning and configuration management tool written in Groovy programming language
  cs: Infrastructor je nástroj pro zajišťování serverů a správu konfigurací napsaný v programovacím jazyce Groovy
  de: Infrastructor ist ein Tool zur Serverbereitstellung und Konfigurationsverwaltung, geschrieben in der Programmiersprache Groovy
  es: Infrastructor es una herramienta de aprovisionamiento de servidores y gestión de configuración escrita en el lenguaje de programación Groovy
  fr: Infrastructor est un outil de provisionnement de serveurs et de gestion de configuration écrit en langage de programmation Groovy
  id: Infrastructor adalah alat provisioning server dan manajemen konfigurasi yang ditulis dalam bahasa pemrograman Groovy
  it: Infrastructor è uno strumento di provisioning dei server e gestione della configurazione scritto in linguaggio Groovy
  ja: Infrastructor は Groovy プログラミング言語で書かれたサーバープロビジョニングおよび構成管理ツールです
  ko: Infrastructor는 Groovy 프로그래밍 언어로 작성된 서버 프로비저닝 및 구성 관리 도구입니다
  pl: Infrastructor to narzędzie do provisionowania serwerów i zarządzania konfiguracją, napisane w języku programowania Groovy
  pt: Infrastructor é uma ferramenta de provisionamento de servidores e gerenciamento de configuração escrita na linguagem de programação Groovy
  ro: Infrastructor este un instrument de provisionare a serverelor și gestionare a configurației scris în limbajul de programare Groovy
  ru: Infrastructor — это инструмент подготовки серверов и управления конфигурациями, написанный на языке программирования Groovy
  th: Infrastructor คือเครื่องมือจัดเตรียมเซิร์ฟเวอร์และจัดการการตั้งค่าที่เขียนด้วยภาษาโปรแกรม Groovy
  tr: Infrastructor, Groovy programlama diliyle yazılmış bir sunucu sağlama ve yapılandırma yönetimi aracıdır
  uk: Infrastructor — це інструмент для підготовки серверів та керування конфігураціями, написаний мовою програмування Groovy
  vi: Infrastructor là công cụ cấp phát máy chủ và quản lý cấu hình được viết bằng ngôn ngữ lập trình Groovy
x:
  source: https://github.com/infrastructor/infrastructor
  eget: infrastructor/infrastructor
rule:
  /eget:
    cmd: x eget infrastructor/infrastructor
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use infrastructor
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install infrastructor
    reference: https://github.com/infrastructor/infrastructor#installation
binlist:
- infrastructor

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 137 KB
          rating: 1
          desc:
            cn: 约 137 KB（估算）
            en: ~137 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
