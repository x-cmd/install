lang: Java
homepage: https://iot.mushuwei.cn/#/toolkit/
desc:
  cn: toolkit 是一款客户端命令行工具，支持多种物联网协议
  en: toolkit is a client-side command line tool that supports multiple iot protocols
  cs: toolkit je klientové nástroje příkazového řádku podporující více protokolů IoT
  de: toolkit ist ein clientseitiges Befehlszeilenwerkzeug, das mehrere IoT-Protokolle unterstützt
  es: toolkit es una herramienta de línea de comandos del lado del cliente que admite varios protocolos de IoT
  fr: toolkit est un outil en ligne de commande côté client qui prend en charge plusieurs protocoles IoT
  id: toolkit adalah alat baris perintah sisi klien yang mendukung berbagai protokol IoT
  it: toolkit è uno strumento da riga di comando lato client che supporta molteplici protocolli IoT
  ja: toolkit は複数の IoT プロトコルに対応したクライアント側コマンドラインツールです
  ko: toolkit은 여러 IoT 프로토콜을 지원하는 클라이언트 측 명령줄 도구입니다
  pl: toolkit to narzędzie wiersza poleceń po stronie klienta obsługujące wiele protokołów IoT
  pt: O toolkit é uma ferramenta de linha de comando do lado do cliente que oferece suporte a vários protocolos de IoT
  ro: toolkit este un instrument de linie de comandă din partea clientului care acceptă mai multe protocoale IoT
  ru: toolkit — клиентский инструмент командной строки, поддерживающий несколько протоколов IoT
  th: toolkit เป็นเครื่องมือบรรทัดคำสั่งฝั่งไคลเอนต์ที่รองรับโปรโตคอล IoT หลายแบบ
  tr: toolkit, birden fazla IoT protokolünü destekleyen istemci tarafı bir komut satırı aracıdır
  uk: toolkit — клієнтський інструмент командного рядка, що підтримує кілька протоколів IoT
  vi: toolkit là công cụ dòng lệnh phía client hỗ trợ nhiều giao thức IoT
x:
  brew: iot-technology/tap/toolkit
  choco: toolkit
rule:
  /x:
    cmd: x pkg use toolkit
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install iot-technology/tap/toolkit
    reference: https://github.com/IoT-Technology/IoT-Toolkit?tab=readme-ov-file#macos
  linux/sdk:
    cmd: sdk install toolkit
    reference: https://github.com/IoT-Technology/IoT-Toolkit?tab=readme-ov-file#linux
  (win|wsl2)/choco:
    cmd: x choco install toolkit
    reference: https://github.com/IoT-Technology/IoT-Toolkit?tab=readme-ov-file#windows
binlist:
- toolkit
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 约 50 MB（估算）
            en: ~50 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB（估算）
          en: 80 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
