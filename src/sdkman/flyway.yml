lang: Java
homepage: https://github.com/flyway/flyway
license: Apache-2.0
desc:
  cn: 自动化数据库迁移
  en: Automated database migration
x:
  source: https://github.com/flyway/flyway
  eget: https://github.com/flyway/flyway
rule:
  /eget:
    cmd: x eget flyway/flyway
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use flyway
    reference: https://github.com/junminahn/asdf-flyway
  (win|wsl2)/scoop:
    cmd: x scoop install main/flyway
    reference: https://scoop.sh/#/apps?q=flyway
  (win|wsl2)/choco:
    cmd: x choco install flyway.commandline
    reference: https://community.chocolatey.org/packages/flyway.commandline
  darwin/brew:
    cmd: brew install flyway
    reference: https://formulae.brew.sh/formula/flyway#default
  arch/yay:
    cmd: yay -S flyway
    reference: https://aur.archlinux.org/packages/flyway
binlist:
- flyway

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 362 MB
          rating: 4
          desc:
            cn: 安装 362 MB
            en: 362 MB install
        download:
          estimate: 362 MB
          desc:
            cn: 约 362 MB 下载 (linux/x64)
            en: ~362 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
