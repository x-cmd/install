lang: Java
homepage: https://github.com/helpermethod/connor/releases
license: Apache-2.0
desc:
  cn: 用于重置 Kafka Connect 源连接器偏移量的命令行工具
  en: A commandline tool for resetting Kafka Connect source connector offsets
x:
  pkg:
    exist: true
  brew: connor
rule:
  /x:
    cmd: x pkg use connor
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install connor
    reference: https://github.com/helpermethod/connor?tab=readme-ov-file#sdkman
  darwin/brew:
    cmd: 'brew tap helpermethod/homebrew-tap \

      && brew install connor

      '
    reference: https://github.com/helpermethod/connor?tab=readme-ov-file#homebrew
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add helpermethod https://github.com/helpermethod/scoop-helpermethod.git \

      && x scoop install connor

      '
    reference: https://github.com/helpermethod/connor?tab=readme-ov-file#scoop
binlist:
- connor

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 安装 14 MB
            en: 14 MB install
        download:
          estimate: 14 MB
          desc:
            cn: 约 14 MB 下载 (linux/x64)
            en: ~14 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
