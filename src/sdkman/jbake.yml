lang: Java
homepage: https://github.com/jbake-org/jbake
license: MIT
desc:
  cn: Jbake 是一个基于 Java 的开源，静态网站/博客生成器，用于开发人员和设计师
  en: JBake is a Java based, open source, static site/blog generator for developers & designers
x:
  pkg:
    exist: true
  source: https://github.com/jbake-org/jbake
  eget: https://github.com/jbake-org/jbake
rule:
  /eget:
    cmd: x eget jbake-org/jbake
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use jbake
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install jbake
    reference: http://kobo.github.io/groovyserv/howtoinstall.html#sdk
  darwin/brew:
    cmd: brew install jbake
    reference: https://jbake.org/
  arch/yay:
    cmd: yay -S jbake
    reference: https://aur.archlinux.org/packages/jbake
binlist:
- jbake

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
