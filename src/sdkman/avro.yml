lang: Java
homepage: https://github.com/apache/avro
license: Apache-2.0
desc:
  cn: Apache Avro™ 是记录数据的领先序列化格式，也是流数据管道的首选
  en: Apache Avro™ is the leading serialization format for record data, and first choice for streaming data pipelines
x:
  source: https://github.com/apache/avro
rule:
  darwin/brew:
    cmd: brew install avro-cpp
    reference: https://formulae.brew.sh/formula/avro-cpp#default
  (win|wsl2)/scoop:
    cmd: x scoop install avro-tools
    reference: https://scoop.sh/#/apps?q=avro
binlist:
- avro

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
