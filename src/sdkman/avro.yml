lang: Java
homepage: https://github.com/apache/avro
license: Apache-2.0
desc:
  cn: Apache Avro™ 是记录数据的领先序列化格式，也是流数据管道的首选
  en: Apache Avro™ is the leading serialization format for record data, and first choice for streaming data pipelines
x:
  source: https://github.com/apache/avro
rule:
  darwin/brew:
    cmd: brew install avro-cpp
    reference: https://formulae.brew.sh/formula/avro-cpp#default
  (win|wsl2)/scoop:
    cmd: x scoop install avro-tools
    reference: https://scoop.sh/#/apps?q=avro
binlist:
- avro

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.9 MB
          rating: 1
          desc:
            cn: 约 3.9 MB（估算）
            en: ~3.9 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
