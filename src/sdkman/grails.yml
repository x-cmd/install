lang: Groovy/Java
homepage: https://github.com/apache/grails-core
license: Apache-2.0
desc:
  cn: 一个强大的基于 Groovy 的 JVM web 应用程序框架，构建在 Spring Boot 之上
  en: A powerful Groovy-based web application framework for the JVM built on top of Spring Boot
  cs: Výkonný webový aplikační framework pro JVM založený na Groovy, postavený na Spring Boot
  de: Ein leistungsfähiges, auf Groovy basierendes Webanwendungs-Framework für die JVM, aufgebaut auf Spring Boot
  es: Un potente framework de aplicaciones web para la JVM basado en Groovy, construido sobre Spring Boot
  fr: Un puissant framework d'applications web pour la JVM basé sur Groovy, construit sur Spring Boot
  id: Framework aplikasi web yang kuat untuk JVM berbasis Groovy, yang dibangun di atas Spring Boot
  it: Un potente framework di applicazioni web per la JVM basato su Groovy, costruito su Spring Boot
  ja: Spring Boot の上に構築された、Groovy ベースの JVM 向け強力なウェブアプリケーションフレームワークです
  ko: Spring Boot 위에 구축된 Groovy 기반의 강력한 JVM 웹 애플리케이션 프레임워크입니다
  pl: Potężny framework aplikacji web dla JVM oparty na Groovy, zbudowany na Spring Boot
  pt: Um poderoso framework de aplicações web para a JVM baseado em Groovy, construído sobre o Spring Boot
  ro: Un puternic framework de aplicații web pentru JVM bazat pe Groovy, construit pe Spring Boot
  ru: Мощный веб-фреймворк для приложений на JVM на базе Groovy, построенный поверх Spring Boot
  th: เฟรมเวิร์กแอปพลิเคชันเว็บที่ทรงพลังสำหรับ JVM ซึ่งใช้ Groovy สร้างบน Spring Boot
  tr: Spring Boot üzerine kurulmuş, JVM için güçlü ve Groovy tabanlı web uygulaması çerçevesi
  uk: Потужний Groovy-фреймворк вебзастосунків для JVM, побудований поверх Spring Boot
  vi: Một framework ứng dụng web mạnh mẽ cho JVM dựa trên Groovy, xây dựng trên nền tảng Spring Boot
x:
  source: https://github.com/apache/grails-core
  eget: apache/grails-core
  brew: grails
  pacman: grails
  yay: grails
  asdf: grails
rule:
  /eget:
    cmd: x eget apache/grails-core
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use grails
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use grails
    reference: https://github.com/weibemoura/asdf-grails
  /sdk:
    cmd: sdk install grails
    reference: https://docs.grails.org/6.1.0/guide/gettingStarted.html#downloadingAndInstalling
  darwin/brew:
    cmd: brew install grails
    reference: https://formulae.brew.sh/formula/grails#default
  arch/pacman:
    cmd: sudo pacman -S grails
    reference: https://command-not-found.com/grails
  arch/yay:
    cmd: yay -S grails
    reference: https://aur.archlinux.org/packages/grails
binlist:
- grails

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
