lang: Java
homepage: https://github.com/apache/flink
license: Apache-2.0
desc:
  cn: Apache Flink 是一个框架和分布式处理引擎
  en: Apache Flink is a framework and distributed processing engine for stateful computations over unbounded and bounded data streams
x:
  pkg:
    exist: true
  source: https://github.com/apache/flink
rule:
  /x:
    cmd: x pkg use flink
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install apache-flink
    reference: https://formulae.brew.sh/formula/apache-flink#default
  arch/yay:
    cmd: yay -S apache-flink
    reference: https://aur.archlinux.org/packages/apache-flink
binlist:
- flink
