lang: Java
homepage: https://github.com/apache/flink
license: Apache-2.0
desc:
  cn: Apache Flink 是一个框架和分布式处理引擎
  en: Apache Flink is a framework and distributed processing engine for stateful computations over unbounded and bounded data streams
x:
  pkg:
    exist: true
  source: https://github.com/apache/flink
rule:
  /x:
    cmd: x pkg use flink
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install apache-flink
    reference: https://formulae.brew.sh/formula/apache-flink#default
  arch/yay:
    cmd: yay -S apache-flink
    reference: https://aur.archlinux.org/packages/apache-flink
binlist:
- flink

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 49 MB
          rating: 2
          desc:
            cn: 约 49 MB（估算）
            en: ~49 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
