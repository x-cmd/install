lang: Java
homepage: https://github.com/apache/flink
license: Apache-2.0
desc:
  cn: Apache Flink 是一个框架和分布式处理引擎
  en: Apache Flink is a framework and distributed processing engine for stateful computations over unbounded and bounded data streams
  cs: Apache Flink je framework a distribuovaný zpracovací engine pro stavové výpočty nad neomezenými a ohraničenými datovými toky
  de: Apache Flink ist ein Framework und eine verteilte Verarbeitungs-Engine für zustandsbehaftete Berechnungen über unbegrenzte und begrenzte Datenströme
  es: Apache Flink es un framework y un motor de procesamiento distribuido para cálculos con estado sobre flujos de datos ilimitados y acotados
  fr: Apache Flink est un framework et un moteur de traitement distribué pour les calculs avec état sur des flux de données illimités et bornés
  id: Apache Flink adalah framework dan mesin pemrosesan terdistribusi untuk komputasi stateful pada aliran data tak terbatas dan terbatas
  it: Apache Flink è un framework e un motore di elaborazione distribuito per calcoli con stato su flussi di dati illimitati e limitati
  ja: Apache Flink は、無制限および有制限のデータストリームに対するステートフル計算のためのフレームワークと分散処理エンジンです
  ko: Apache Flink는 무한 및 유한 데이터 스트림에 대한 상태 기반 계산을 위한 프레임워크이자 분산 처리 엔진입니다
  pl: Apache Flink to framework i rozproszony silnik przetwarzania do obliczeń stanowych na strumieniach danych nieograniczonych i ograniczonych
  pt: Apache Flink é um framework e um mecanismo de processamento distribuído para computações stateful sobre fluxos de dados ilimitados e limitados
  ro: Apache Flink este un framework și un motor de procesare distribuit pentru calcule cu stare pe fluxuri de date nelimitate și limitate
  ru: Apache Flink — это фреймворк и распределённый движок обработки для состоянийных вычислений над неограниченными и ограниченными потоками данных
  th: Apache Flink คือเฟรมเวิร์กและเอนจินประมวลผลแบบกระจายสำหรับการคำนวณแบบมีสถานะบนสตรีมข้อมูลไม่จำกัดและจำกัดขอบเขต
  tr: Apache Flink, sınırsız ve sınırlı veri akışları üzerinde durumlu hesaplamalar için bir çerçeve ve dağıtık işleme motorudur
  uk: Apache Flink — це фреймворк і розподілений руш обробки для станових обчислень над необмеженими та обмеженими потоками даних
  vi: Apache Flink là một framework và công cụ xử lý phân tán cho các phép tính có trạng thái trên luồng dữ liệu không giới hạn và có giới hạn
x:
  source: https://github.com/apache/flink
  brew: apache-flink
  yay: apache-flink
rule:
  /x:
    cmd: x pkg use flink
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install apache-flink
    reference: https://formulae.brew.sh/formula/apache-flink#default
  arch/yay:
    cmd: yay -S apache-flink
    reference: https://aur.archlinux.org/packages/apache-flink
binlist:
- flink

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 49 MB
          rating: 2
          desc:
            cn: 约 49 MB（估算）
            en: ~49 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
