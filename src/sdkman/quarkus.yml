homepage: https://github.com/quarkusio/quarkus
license: Apache-2.0
desc:
  cn: Quarkus 是用于编写 Java 应用程序的云原生、（Linux）容器优先的框架
  en: Quarkus is a Cloud Native, (Linux) Container First framework for writing Java applications
  cs: Quarkus je cloud-native framework, (Linux) container-first, pro psaní Java aplikací
  de: Quarkus ist ein Cloud-Native-, (Linux-)Container-First-Framework zum Schreiben von Java-Anwendungen
  es: Quarkus es un framework cloud native, (Linux) container first, para escribir aplicaciones Java
  fr: Quarkus est un framework cloud native, (Linux) container first, pour écrire des applications Java
  id: Quarkus adalah framework cloud native, (Linux) container first untuk menulis aplikasi Java
  it: Quarkus è un framework cloud native, (Linux) container first per scrivere applicazioni Java
  ja: Quarkus は、Java アプリケーションを書くためのクラウドネイティブな (Linux) コンテナファーストのフレームワークです
  ko: Quarkus는 Java 애플리케이션을 작성하기 위한 클라우드 네이티브 (Linux) 컨테이너 우선 프레임워크입니다
  pl: Quarkus to framework cloud native, (Linux) container first, do pisania aplikacji Java
  pt: Quarkus é um framework cloud native, (Linux) container first para escrever aplicações Java
  ro: Quarkus este un framework cloud native, (Linux) container first pentru scrierea aplicațiilor Java
  ru: Quarkus — это облачно-ориентированный (Linux) container-first фреймворк для написания Java-приложений
  th: Quarkus เป็นเฟรมเวิร์กแบบ cloud native และ (Linux) container first สำหรับการเขียนแอปพลิเคชัน Java
  tr: Quarkus, Java uygulamaları yazmak için Cloud Native, (Linux) Container First bir çerçevedir
  uk: Quarkus — це хмарно-орієнтований (Linux) container-first фреймворк для написання Java-застосунків
  vi: Quarkus là framework cloud native, (Linux) container first để viết các ứng dụng Java
lang: Java
x:
  source: https://github.com/quarkusio/quarkus
  eget: quarkusio/quarkus
  yay: quarkuscli-bin
  asdf: quarkus
rule:
  /eget:
    cmd: x eget quarkusio/quarkus
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use quarkus
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use quarkus
    reference: https://github.com/asdf-community/asdf-quarkus
  /curl:
    cmd: 'curl -Ls https://sh.jbang.dev | bash -s - trust add https://repo1.maven.org/maven2/io/quarkus/quarkus-cli/ \

      && curl -Ls https://sh.jbang.dev | bash -s - app install --fresh --force quarkus@quarkusio

      '
    reference: https://quarkus.io/get-started/
  /sdk:
    cmd: sdk install quarkus
    reference: https://quarkus.io/get-started/
  win/powershell:
    cmd: 'x pwsh iex "& { $(iwr https://ps.jbang.dev) } trust add https://repo1.maven.org/maven2/io/quarkus/quarkus-cli/" \

      && x pwsh  iex "& { $(iwr https://ps.jbang.dev) } app install --fresh --force quarkus@quarkusio"

      '
    reference: https://quarkus.io/get-started/
  arch/yay:
    cmd: yay -S quarkuscli-bin
    reference: https://aur.archlinux.org/packages/quarkuscli-bin
binlist:
- quarkus

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 28 MB
          rating: 2
          desc:
            cn: 约 28 MB（估算）
            en: ~28 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
