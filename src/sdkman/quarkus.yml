homepage: https://github.com/quarkusio/quarkus
license: Apache-2.0
desc:
  cn: Quarkus 是用于编写 Java 应用程序的云原生、（Linux）容器优先的框架
  en: Quarkus is a Cloud Native, (Linux) Container First framework for writing Java applications
lang: Java
x:
  pkg:
    exist: true
  source: https://github.com/quarkusio/quarkus
  eget: https://github.com/quarkusio/quarkus
rule:
  /eget:
    cmd: x eget quarkusio/quarkus
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use quarkus
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use quarkus
    reference: https://github.com/asdf-community/asdf-quarkus
  /curl:
    cmd: 'curl -Ls https://sh.jbang.dev | bash -s - trust add https://repo1.maven.org/maven2/io/quarkus/quarkus-cli/ \

      && curl -Ls https://sh.jbang.dev | bash -s - app install --fresh --force quarkus@quarkusio

      '
    reference: https://quarkus.io/get-started/
  /sdk:
    cmd: sdk install quarkus
    reference: https://quarkus.io/get-started/
  win/powershell:
    cmd: 'x pwsh iex "& { $(iwr https://ps.jbang.dev) } trust add https://repo1.maven.org/maven2/io/quarkus/quarkus-cli/" \

      && x pwsh  iex "& { $(iwr https://ps.jbang.dev) } app install --fresh --force quarkus@quarkusio"

      '
    reference: https://quarkus.io/get-started/
  arch/yay:
    cmd: yay -S quarkuscli-bin
    reference: https://aur.archlinux.org/packages/quarkuscli-bin
binlist:
- quarkus
