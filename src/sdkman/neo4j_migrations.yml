lang: Java
homepage: https://github.com/michael-simons/neo4j-migrations
license: Apache-2.0
desc:
  cn: neo4j 迁移是一组工具，可以使您的模式迁移尽可能容易
  en: Neo4j-Migrations are a set of tools to make your schema migrations as easy as possible
x:
  pkg:
    exist: true
  source: https://github.com/michael-simons/neo4j-migrations
  eget: https://github.com/michael-simons/neo4j-migrations
rule:
  /x:
    cmd: x pkg use neo4j_migrations
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget michael-simons/neo4j-migrations
    reference: https://x-cmd.com/mod/eget
  /sdk:
    cmd: sdk install neo4jmigrations
    reference: https://michael-simons.github.io/neo4j-migrations/2.7.0/#sdkman
  darwin/brew:
    cmd: brew install michael-simons/homebrew-neo4j-migrations/neo4j-migrations
    reference: https://michael-simons.github.io/neo4j-migrations/2.7.0/#download_cli_brew
  arch/yay:
    cmd: yay -S neo4j-migrations-bin
    reference: https://aur.archlinux.org/packages/neo4j-migrations-bin
binlist:
- neo4j_migrations

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
