lang: Java
homepage: https://github.com/michael-simons/neo4j-migrations
license: Apache-2.0
desc:
  cn: neo4j 迁移是一组工具，可以使您的模式迁移尽可能容易
  en: Neo4j-Migrations are a set of tools to make your schema migrations as easy as possible
  cs: Neo4j-Migrations je sada nástrojů, které usnadňují migrace schémat
  de: Neo4j-Migrations sind eine Reihe von Werkzeugen, die Ihre Schema-Migrationen so einfach wie möglich machen
  es: Neo4j-Migrations es un conjunto de herramientas para que las migraciones de esquema sean lo más fáciles posible
  fr: Neo4j-Migrations est un ensemble d'outils qui rendent vos migrations de schéma aussi simples que possible
  id: Neo4j-Migrations adalah rangkaian alat untuk membuat migrasi skema Anda semudah mungkin
  it: Neo4j-Migrations è un insieme di strumenti per rendere le migrazioni dello schema il più semplici possibile
  ja: Neo4j-Migrations は、スキーマ移行をできるだけ簡単にするためのツール群です
  ko: Neo4j-Migrations는 스키마 마이그레이션을 최대한 쉽게 만들도록 하는 도구 모음입니다
  pl: Neo4j-Migrations to zestaw narzędzi, które ułatwiają migracje schematu w najbardziej możliwy sposób
  pt: Neo4j-Migrations é um conjunto de ferramentas para tornar as migrações de esquema o mais fácil possível
  ro: Neo4j-Migrations este un set de instrumente care fac migrările de schemă cât mai ușoare
  ru: Neo4j-Migrations — это набор инструментов, которые делают миграции схем максимально простыми
  th: Neo4j-Migrations คือชุดเครื่องมือที่ช่วยให้การย้ายสคีมาของคุณง่ายที่สุดเท่าที่จะเป็นไปได้
  tr: Neo4j-Migrations, şema geçişlerinizi mümkün olduğunca kolaylaştıran bir araç kümesidir
  uk: Neo4j-Migrations — це набір інструментів, які роблять міграції схем максимально простими
  vi: Neo4j-Migrations là tập hợp công cụ giúp việc di trú lược đồ của bạn trở nên dễ dàng nhất có thể
x:
  source: https://github.com/michael-simons/neo4j-migrations
  eget: michael-simons/neo4j-migrations
  brew: michael-simons/homebrew-neo4j-migrations/neo4j-migrations
  yay: neo4j-migrations-bin
rule:
  /x:
    cmd: x pkg use neo4j_migrations
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget michael-simons/neo4j-migrations
    reference: https://x-cmd.com/mod/eget
  /sdk:
    cmd: sdk install neo4jmigrations
    reference: https://michael-simons.github.io/neo4j-migrations/2.7.0/#sdkman
  darwin/brew:
    cmd: brew install michael-simons/homebrew-neo4j-migrations/neo4j-migrations
    reference: https://michael-simons.github.io/neo4j-migrations/2.7.0/#download_cli_brew
  arch/yay:
    cmd: yay -S neo4j-migrations-bin
    reference: https://aur.archlinux.org/packages/neo4j-migrations-bin
binlist:
- neo4j_migrations

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 约 50 MB（估算）
            en: ~50 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB（估算）
          en: 80 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
