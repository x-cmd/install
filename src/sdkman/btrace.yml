lang: Java
homepage: https://github.com/btraceio/btrace
license: Apache-2.0
desc:
  cn: 用于 java 平台的安全、动态追踪工具
  en: a safe, dynamic tracing tool for the Java platform
  cs: bezpečný dynamický nástroj pro trasování na platformě Java
  de: ein sicheres, dynamisches Tracing-Werkzeug für die Java-Plattform
  es: una herramienta de trazado dinámico y segura para la plataforma Java
  fr: un outil de traçage dynamique et sûr pour la plateforme Java
  id: alat pelacakan dinamis yang aman untuk platform Java
  it: uno strumento di tracing dinamico e sicuro per la piattaforma Java
  ja: Java プラットフォーム向けの安全で動的なトレーシングツール
  ko: Java 플랫폼을 위한 안전한 동적 추적 도구
  pl: bezpieczne, dynamiczne narzędzie do śledzenia dla platformy Java
  pt: uma ferramenta de rastreamento dinâmico e seguro para a plataforma Java
  ro: un instrument de urmărire dinamică și sigur pentru platforma Java
  ru: безопасный динамический инструмент трассировки для платформы Java
  th: เครื่องมือติดตามแบบไดนามิกที่ปลอดภัยสำหรับแพลตฟอร์ม Java
  tr: Java platformu için güvenli, dinamik izleme aracı
  uk: безпечний динамічний інструмент трасування для платформи Java
  vi: công cụ truy vết động an toàn cho nền tảng Java
x:
  source: https://github.com/btraceio/btrace
  eget: btraceio/btrace
rule:
  /eget:
    cmd: x eget btraceio/btrace
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use btrace
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -OL https://github.com/btraceio/btrace/releases/download/v2.2.4/btrace-v2.2.4-bin.tar.gz
    reference: https://github.com/btraceio/btrace/releases/tag/v2.2.4
  /wget:
    cmd: wget https://github.com/btraceio/btrace/releases/download/v2.2.4/btrace-v2.2.4-bin.tar.gz
    reference: https://github.com/btraceio/btrace/releases/tag/v2.2.4
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/btraceio/btrace/releases/download/v2.2.4/btrace-v2.2.4-bin.zip -OutFile btrace-v2.2.4-bin.zip
    reference: https://github.com/btraceio/btrace/releases/tag/v2.2.4
binlist:
- btrace

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.8 MB
          rating: 1
          desc:
            cn: 约 1.8 MB（估算）
            en: ~1.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
