lang: Java
homepage: https://github.com/btraceio/btrace
license: Apache-2.0
desc:
  cn: 用于 java 平台的安全、动态追踪工具
  en: a safe, dynamic tracing tool for the Java platform
x:
  pkg:
    exist: true
  source: https://github.com/btraceio/btrace
  eget: https://github.com/btraceio/btrace
rule:
  /eget:
    cmd: x eget btraceio/btrace
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use btrace
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -OL https://github.com/btraceio/btrace/releases/download/v2.2.4/btrace-v2.2.4-bin.tar.gz
    reference: https://github.com/btraceio/btrace/releases/tag/v2.2.4
  /wget:
    cmd: wget https://github.com/btraceio/btrace/releases/download/v2.2.4/btrace-v2.2.4-bin.tar.gz
    reference: https://github.com/btraceio/btrace/releases/tag/v2.2.4
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/btraceio/btrace/releases/download/v2.2.4/btrace-v2.2.4-bin.zip -OutFile btrace-v2.2.4-bin.zip
    reference: https://github.com/btraceio/btrace/releases/tag/v2.2.4
binlist:
- btrace

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.8 MB
          rating: 1
          desc:
            cn: 约 1.8 MB（估算）
            en: ~1.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
