lang: Groovy
homepage: https://github.com/kobo/gaiden
license: Apache-2.0
desc:
  cn: Gaiden 是一种工具，可以轻松使用 Markdown 创建文档
  en: Gaiden is a tool that makes it easy to create documentation with Markdown
  cs: Gaiden je nástroj, který usnadňuje tvorbu dokumentace pomocí Markdownu
  de: Gaiden ist ein Werkzeug, das das Erstellen von Dokumentation mit Markdown einfach macht
  es: Gaiden es una herramienta que facilita la creación de documentación con Markdown
  fr: Gaiden est un outil qui facilite la création de documentation avec Markdown
  id: Gaiden adalah alat yang membuat pembuatan dokumentasi dengan Markdown menjadi mudah
  it: Gaiden è uno strumento che rende facile creare documentazione con Markdown
  ja: Gaiden は Markdown でドキュメント作成を簡単にするためのツールです
  ko: Gaiden은 Markdown로 문서를 쉽게 작성할 수 있게 해 주는 도구입니다
  pl: Gaiden to narzędzie ułatwiające tworzenie dokumentacji w Markdown
  pt: Gaiden é uma ferramenta que facilita criar documentação com Markdown
  ro: Gaiden este un instrument care facilitează crearea documentației cu Markdown
  ru: Gaiden — это инструмент, который упрощает создание документации с помощью Markdown
  th: Gaiden คือเครื่องมือที่ทำให้การสร้างเอกสารด้วย Markdown ทำได้อย่างง่ายดาย
  tr: Gaiden, Markdown ile belge oluşturmayı kolaylaştıran bir araçtır
  uk: Gaiden — це інструмент, який спрощує створення документації за допомогою Markdown
  vi: Gaiden là công cụ giúp tạo tài liệu bằng Markdown một cách dễ dàng
x:
  source: https://github.com/kobo/gaiden
  eget: kobo/gaiden
rule:
  /eget:
    cmd: x eget kobo/gaiden
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use gaiden
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install gaiden
    reference: http://kobo.github.io/gaiden/getting-started.html#installation
binlist:
- gaiden

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 158 KB
          rating: 1
          desc:
            cn: 约 158 KB（估算）
            en: ~158 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
