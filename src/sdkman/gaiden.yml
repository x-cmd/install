lang: Groovy
homepage: https://github.com/kobo/gaiden
license: Apache-2.0
desc:
  cn: Gaiden 是一种工具，可以轻松使用 Markdown 创建文档
  en: Gaiden is a tool that makes it easy to create documentation with Markdown
x:
  pkg:
    exist: true
  source: https://github.com/kobo/gaiden
  eget: https://github.com/kobo/gaiden
rule:
  /eget:
    cmd: x eget kobo/gaiden
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use gaiden
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install gaiden
    reference: http://kobo.github.io/gaiden/getting-started.html#installation
binlist:
- gaiden

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 158 KB
          rating: 1
          desc:
            cn: 约 158 KB（估算）
            en: ~158 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
