lang: Groovy
homepage: https://github.com/kobo/gaiden
license: Apache-2.0
desc:
  cn: Gaiden 是一种工具，可以轻松使用 Markdown 创建文档
  en: Gaiden is a tool that makes it easy to create documentation with Markdown
x:
  pkg:
    exist: true
  source: https://github.com/kobo/gaiden
  eget: https://github.com/kobo/gaiden
rule:
  /eget:
    cmd: x eget kobo/gaiden
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use gaiden
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install gaiden
    reference: http://kobo.github.io/gaiden/getting-started.html#installation
binlist:
- gaiden

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
