lang: Groovy/Java
homepage: https://github.com/gradle/gradle
license: Apache-2.0
desc:
  cn: 自动化(构建、测试和部署)工具。Groovy 或 Kotlin
  en: Automation (build, test and deployment) tools. Groovy or Kotlin
x:
  pkg:
    exist: true
  source: https://github.com/gradle/gradle
rule:
  /x:
    cmd: x pkg use gradle
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use gradle
    reference: https://github.com/rfrancis/asdf-gradle
  darwin/brew:
    cmd: brew install gradle
    reference: https://formulae.brew.sh/formula/gradle#default
  debian/apt:
    cmd: sudo apt-get install gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  ubuntu/apt:
    cmd: sudo apt-get install gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  alpine/apk:
    cmd: sudo apk add gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  arch/pacman:
    cmd: sudo pacman -S gradle
    reference: https://command-not-found.com/gradle
  kali/apt:
    cmd: sudo apt-get install gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  fedora/dnf:
    cmd: sudo dnf install gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  raspbian/apt:
    cmd: sudo apt-get install gradle
    reference: https://command-not-found.com/gradle
  arch/yay:
    cmd: yay -S gradle
    reference: https://aur.archlinux.org/packages/gradle
binlist:
- gradle

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
