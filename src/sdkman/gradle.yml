lang: Groovy/Java
homepage: https://github.com/gradle/gradle
license: Apache-2.0
desc:
  cn: 自动化(构建、测试和部署)工具。Groovy 或 Kotlin
  en: Automation (build, test and deployment) tools. Groovy or Kotlin
  cs: Nástroje pro automatizaci (sestavení, testování a nasazení). Groovy nebo Kotlin
  de: Automatisierungswerkzeuge (Build, Test und Bereitstellung). Groovy oder Kotlin
  es: Herramientas de automatización (compilación, pruebas y despliegue). Groovy o Kotlin
  fr: Outils d'automatisation (compilation, tests et déploiement). Groovy ou Kotlin
  id: Alat otomatisasi (build, pengujian, dan deployment). Groovy atau Kotlin
  it: Strumenti di automazione (build, test e deployment). Groovy o Kotlin
  ja: 自動化（ビルド、テスト、デプロイ）ツール。Groovy または Kotlin
  ko: 자동화(빌드, 테스트 및 배포) 도구. Groovy 또는 Kotlin
  pl: Narzędzia automatyzacji (kompilacja, testy i wdrażanie). Groovy lub Kotlin
  pt: Ferramentas de automação (build, teste e implantação). Groovy ou Kotlin
  ro: Instrumente de automatizare (build, test și deployment). Groovy sau Kotlin
  ru: Инструменты автоматизации (сборка, тестирование и развёртывание). Groovy или Kotlin
  th: เครื่องมืออัตโนมัติ (สร้าง ทดสอบ และปล่อยใช้งาน) Groovy หรือ Kotlin
  tr: Otomasyon (derleme, test ve dağıtım) araçları. Groovy veya Kotlin
  uk: Інструменти автоматизації (збирання, тестування та розгортання). Groovy або Kotlin
  vi: Công cụ tự động hóa (build, test và triển khai). Groovy hoặc Kotlin
x:
  source: https://github.com/gradle/gradle
  apt: gradle
  dnf: gradle
  brew: gradle
  pacman: gradle
  apk: gradle
  apt-get: gradle
  yay: gradle
  asdf: gradle
rule:
  /x:
    cmd: x pkg use gradle
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use gradle
    reference: https://github.com/rfrancis/asdf-gradle
  darwin/brew:
    cmd: brew install gradle
    reference: https://formulae.brew.sh/formula/gradle#default
  debian/apt:
    cmd: sudo apt-get install gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  ubuntu/apt:
    cmd: sudo apt-get install gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  alpine/apk:
    cmd: sudo apk add gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  arch/pacman:
    cmd: sudo pacman -S gradle
    reference: https://command-not-found.com/gradle
  kali/apt:
    cmd: sudo apt-get install gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  fedora/dnf:
    cmd: sudo dnf install gradle
    reference: https://command-not-found.com/gradle
    dsnap: gradle
  raspbian/apt:
    cmd: sudo apt-get install gradle
    reference: https://command-not-found.com/gradle
  arch/yay:
    cmd: yay -S gradle
    reference: https://aur.archlinux.org/packages/gradle
binlist:
- gradle

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 39 MB
          rating: 2
          desc:
            cn: 约 39 MB（估算）
            en: ~39 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
