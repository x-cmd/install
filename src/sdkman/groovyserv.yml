lang: Groovy
homepage: https://github.com/kobo/groovyserv
desc:
  cn: Groovy 的启动加速器。
  en: Groovy's startup acceralator.
x:
  pkg:
    exist: true
  source: https://github.com/kobo/groovyserv
rule:
  /x:
    cmd: x pkg use groovyserv
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install groovyserv
    reference: http://kobo.github.io/groovyserv/howtoinstall.html#sdk
  darwin/brew:
    cmd: brew install groovyserv
    reference: http://kobo.github.io/groovyserv/howtoinstall.html#homebrew
  arch/yay:
    cmd: yay -S groovyserv-bin
    reference: https://aur.archlinux.org/packages/groovyserv-bin
binlist:
- groovyserv
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
