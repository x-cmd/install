lang: Groovy
homepage: https://github.com/kobo/groovyserv
desc:
  cn: Groovy 的启动加速器。
  en: Groovy's startup acceralator.
  cs: Akcelerátor startu pro Groovy.
  de: Startbeschleuniger für Groovy.
  es: Acelerador de arranque para Groovy.
  fr: Accélérateur de démarrage pour Groovy.
  id: Akselerator startup untuk Groovy.
  it: Acceleratore di avvio per Groovy.
  ja: Groovy の起動アクセラレーター。
  ko: Groovy의 시작 가속기.
  pl: Akcelerator uruchamiania dla Groovy.
  pt: Acelerador de inicialização para Groovy.
  ro: Accelerator de pornire pentru Groovy.
  ru: Ускоритель запуска для Groovy.
  th: ตัวเร่งความเร็วการเริ่มทำงานสำหรับ Groovy
  tr: Groovy için başlangıç hızlandırıcısı.
  uk: Прискорювач запуску для Groovy.
  vi: Trình tăng tốc khởi động cho Groovy.
x:
  source: https://github.com/kobo/groovyserv
  brew: groovyserv
  yay: groovyserv-bin
rule:
  /x:
    cmd: x pkg use groovyserv
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install groovyserv
    reference: http://kobo.github.io/groovyserv/howtoinstall.html#sdk
  darwin/brew:
    cmd: brew install groovyserv
    reference: http://kobo.github.io/groovyserv/howtoinstall.html#homebrew
  arch/yay:
    cmd: yay -S groovyserv-bin
    reference: https://aur.archlinux.org/packages/groovyserv-bin
binlist:
- groovyserv
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 125 KB
          rating: 1
          desc:
            cn: 约 125 KB（估算）
            en: ~125 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
