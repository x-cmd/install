lang: Groovy
homepage: https://github.com/cbmarcum/skeletal
license: Apache-2.0
desc:
  cn: 一个使用打包模板的简单项目创建工具
  en: A simple project creation tool that uses packaged templates
  cs: Jednoduchý nástroj pro vytváření projektů, který používá připravené šablony
  de: Ein einfaches Werkzeug zur Projekterstellung mit fertigen Vorlagen
  es: Una sencilla herramienta de creación de proyectos que usa plantillas empaquetadas
  fr: Un simple outil de création de projets utilisant des modèles préemballés
  id: Alat pembuatan proyek sederhana yang menggunakan templat siap pakai
  it: Un semplice strumento di creazione di progetti che usa modelli preconfezionati
  ja: 同梱のテンプレートを使う、簡単なプロジェクト作成ツールです
  ko: 미리 packaged된 템플릿을 사용하는 간단한 프로젝트 생성 도구입니다
  pl: Proste narzędzie do tworzenia projektów korzystające z gotowych szablonów
  pt: Uma ferramenta simples de criação de projetos que usa modelos empacotados
  ro: Un instrument simplu de creare de proiecte care folosește șabloane ambalate
  ru: Простой инструмент для создания проектов на основе готовых шаблонов
  th: เครื่องมือสร้างโครงการอย่างง่ายที่ใช้เทมเพลตที่แพ็กมา
  tr: Hazır şablonları kullanan basit bir proje oluşturma aracı
  uk: Простий інструмент для створення проєктів на основі готових шаблонів
  vi: Công cụ tạo dự án đơn giản sử dụng các mẫu có sẵn
x:
  source: https://github.com/cbmarcum/skeletal
  eget: cbmarcum/skeletal
rule:
  /eget:
    cmd: x eget cbmarcum/skeletal
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use skeletal
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install skeletal 0.16.0
    reference: https://cbmarcum.github.io/skeletal/application-users-guide.html#_installation
  /curl:
    cmd: curl -o skeletal-0.16.0.zip -L https://github.com/cbmarcum/skeletal/releases/download/v0.16.0/skeletal-0.16.0.zip
    reference: https://cbmarcum.github.io/skeletal/application-users-guide.html#_installation
binlist:
- skeletal

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 179 KB
          rating: 1
          desc:
            cn: 约 179 KB（估算）
            en: ~179 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
