lang: Java
homepage: https://github.com/kordamp/pomchecker
license: Apache-2.0
desc:
  cn: Maven POM 语法检查器
  en: Maven POM syntax checker
x:
  pkg:
    exist: true
  source: https://github.com/kordamp/pomchecker
  eget: https://github.com/kordamp/pomchecker
rule:
  /eget:
    cmd: x eget kordamp/pomchecker
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use pomchecker
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install pomchecker 1.9.0
    reference: https://github.com/kordamp/pomchecker#install
binlist:
- pomchecker

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
