lang: Java
homepage: https://github.com/kordamp/pomchecker
license: Apache-2.0
desc:
  cn: Maven POM 语法检查器
  en: Maven POM syntax checker
x:
  source: https://github.com/kordamp/pomchecker
  eget: kordamp/pomchecker
rule:
  /eget:
    cmd: x eget kordamp/pomchecker
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use pomchecker
    reference: https://x-cmd.com/install/
  /sdk:
    cmd: sdk install pomchecker 1.9.0
    reference: https://github.com/kordamp/pomchecker#install
binlist:
- pomchecker

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 43 KB
          rating: 1
          desc:
            cn: 约 43 KB（估算）
            en: ~43 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
