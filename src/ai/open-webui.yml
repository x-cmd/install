lang: Python
homepage: https://github.com/open-webui/open-webui
license: other
desc:
  cn: 友好的 AI 界面，支持 Ollama、OpenAI API 等
  en: User-friendly AI Interface (Supports Ollama, OpenAI API, ...)
x:
  source: https://github.com/open-webui/open-webui
rule:
  /pip:
    cmd: pip install open-webui
    reference: https://pypi.org/project/open-webui/
    dsnap: open-webui
binlist:
- open-webui

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
