lang: TypeScript
homepage: https://github.com/Yeachan-Heo/oh-my-claudecode
license: mit
desc:
  cn: 面向团队的 Claude Code 多 Agent 编排工具
  en: Teams-first Multi-agent orchestration for Claude Code
x:
  source: https://github.com/Yeachan-Heo/oh-my-claudecode
  eget: https://github.com/Yeachan-Heo/oh-my-claudecode
rule:
  /eget:
    cmd: x eget Yeachan-Heo/oh-my-claudecode
    reference: https://github.com/Yeachan-Heo/oh-my-claudecode
binlist:
- oh-my-claudecode

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
