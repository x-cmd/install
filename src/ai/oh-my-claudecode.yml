lang: TypeScript
homepage: https://github.com/Yeachan-Heo/oh-my-claudecode
license: mit
desc:
  cn: 面向团队的 Claude Code 多 Agent 编排工具
  en: Teams-first Multi-agent orchestration for Claude Code
x:
  source: https://github.com/Yeachan-Heo/oh-my-claudecode
  eget: https://github.com/Yeachan-Heo/oh-my-claudecode
rule:
  /eget:
    cmd: x eget Yeachan-Heo/oh-my-claudecode
    reference: https://github.com/Yeachan-Heo/oh-my-claudecode
binlist:
- oh-my-claudecode

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1020 KB
          rating: 1
          desc:
            cn: 约 1020 KB（估算）
            en: ~1020 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
