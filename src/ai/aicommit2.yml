lang: TypeScript
homepage: https://github.com/tak-bro/aicommit2
license: mit
desc:
  cn: 响应式 CLI，使用 Ollama、ChatGPT、Gemini、Claude、Mistral 等 AI 为 Git 与 Jujutsu 生成提交信息
  en: A Reactive CLI that generates commit messages for Git and Jujutsu with Ollama, ChatGPT, Gemini, Claude, Mistral and other AI
x:
  source: https://github.com/tak-bro/aicommit2
rule:
  /npm:
    cmd: npm install -g aicommit2
    reference: https://www.npmjs.com/package/aicommit2
    dsnap: 'aicommit2'
binlist:
- aicommit2

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 39 KB
          rating: 1
          desc:
            cn: 约 39 KB（估算）
            en: ~39 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
