lang: TypeScript
homepage: https://github.com/danielmiessler/Personal_AI_Infrastructure
license: mit
desc:
  cn: 自托管个人 AI 助手基础设施：以文件系统为上下文、记忆与技能为底，把 Claude Code 打造成长期理解你目标与工作流的"数字助理"。
  en: "Self-hosted personal AI infrastructure: build a long-running digital assistant on Claude Code, with the filesystem as context, skills and memory as substrate, that learns your goals and ideal state."
x:
  source: https://github.com/danielmiessler/Personal_AI_Infrastructure
rule:
  /git:
    cmd: x git clone danielmiessler/Personal_AI_Infrastructure
    reference: https://github.com/danielmiessler/Personal_AI_Infrastructure#-installation
binlist:
- personal_ai_infrastructure

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
