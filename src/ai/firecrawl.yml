lang: TypeScript
homepage: https://github.com/mendableai/firecrawl
license: agpl-3.0
desc:
  cn: 用于搜索、抓取、交互 Web 的 API 与 SDK，输出干净的 Markdown 或结构化数据，供 AI Agent 直接使用
  en: API and SDKs to search, scrape, and interact with the web at scale, turning pages into clean Markdown or structured data for AI agents
x:
  source: https://github.com/mendableai/firecrawl
rule:
  /npm:
    cmd: npm install -g firecrawl-cli
    reference: https://github.com/mendableai/firecrawl
    dsnap: firecrawl-cli
binlist:
- firecrawl

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
