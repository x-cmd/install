lang: TypeScript
homepage: https://github.com/mendableai/firecrawl
license: agpl-3.0
desc:
  cn: 用于搜索、抓取、交互 Web 的 API 与 SDK，输出干净的 Markdown 或结构化数据，供 AI Agent 直接使用
  en: API and SDKs to search, scrape, and interact with the web at scale, turning pages into clean Markdown or structured data for AI agents
x:
  source: https://github.com/mendableai/firecrawl
rule:
  /npm:
    cmd: npm install -g firecrawl-cli
    reference: https://github.com/mendableai/firecrawl
    dsnap: firecrawl-cli
binlist:
- firecrawl

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 408 KB
          rating: 1
          desc:
            cn: 约 408 KB（估算）
            en: ~408 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
