lang: TypeScript
homepage: https://github.com/browserbase/mcp-server-browserbase
license: apache-2.0
desc:
  cn: 让 LLM 通过 Browserbase 与 Stagehand 控制浏览器的 MCP 服务器
  en: Allow LLMs to control a browser with Browserbase and Stagehand
x:
  source: https://github.com/browserbase/mcp-server-browserbase
rule:
  /npm:
    cmd: npm install -g @browserbasehq/mcp-server-browserbase
    reference: https://www.npmjs.com/package/@browserbasehq/mcp-server-browserbase
    dsnap: '@browserbasehq/mcp-server-browserbase'
binlist:
- mcp-server-browserbase

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
