lang: Rust
homepage: https://github.com/tinyhumansai/openhuman
license: gpl-3.0
desc:
  cn: 在桌面运行个人 AI Agent，自动从 Gmail、Slack、Notion 等关联应用构建私有知识库
  en: Runs a personal AI agent on your desktop that automatically builds a private knowledge base from your connected apps like Gmail, Slack, and Notion.
x:
  source: https://github.com/tinyhumansai/openhuman
  eget: https://github.com/tinyhumansai/openhuman
rule:
  /eget:
    cmd: x eget tinyhumansai/openhuman
    reference: https://github.com/tinyhumansai/openhuman
binlist:
- openhuman

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 52 MB
          rating: 3
          desc:
            cn: 约 52 MB（估算）
            en: ~52 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
