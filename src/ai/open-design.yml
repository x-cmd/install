lang: TypeScript
homepage: https://github.com/nexu-io/open-design
license: apache-2.0
desc:
  cn: 开源的 Claude Design 替代品——把 Claude Code / Codex / Cursor 等本地 CLI 变成设计引擎，一句话产出 UI 原型、Deck、视频、设计稿，150 套品牌级 DESIGN.md 系统 + 100+ skills + 261 插件开箱即用。
  en: Open-source Claude Design alternative — turns the Claude Code / Codex / Cursor CLI on your laptop into a design engine. Type a brief, stream UI prototypes, decks, videos, and brand-grade artifacts; 150 DESIGN.md systems, 100+ skills, and 261 plugins ship in the box.
  cs: Open-source alternativa k Claude Design — promění CLI Claude Code / Codex / Cursor na vašem notebooku v designové jádro. Napište zadání a streamujte UI prototypy, prezentace, videa a brand-grade artefakty; 150 systémů DESIGN.md, 100+ skills a 261 pluginů je součástí balíku.
  de: Open-Source-Alternative zu Claude Design – verwandelt die Claude Code / Codex / Cursor CLI auf deinem Laptop in eine Design-Engine. Formuliere ein Briefing und streame UI-Prototypen, Decks, Videos und Marken-Artefakte; 150 DESIGN.md-Systeme, 100+ Skills und 261 Plugins sind ab Werk dabei.
  es: "Alternativa de código abierto a Claude Design: convierte la CLI de Claude Code / Codex / Cursor de tu portátil en un motor de diseño. Escribe un brief y emite prototipos de UI, presentaciones, vídeos y entregables de calidad de marca; 150 sistemas DESIGN.md, más de 100 skills y 261 plugins vienen de serie."
  fr: "Alternative open source à Claude Design : transforme la CLI Claude Code / Codex / Cursor de votre ordinateur en un moteur de design. Rédigez un brief et diffusez des prototypes d'UI, des decks, des vidéos et des artefacts de qualité marque ; 150 systèmes DESIGN.md, plus de 100 skills et 261 plugins sont fournis."
  id: Alternatif sumber terbuka untuk Claude Design — mengubah CLI Claude Code / Codex / Cursor di laptop Anda menjadi mesin desain. Tulis brief, lalu stream prototipe UI, deck, video, dan artefak berkualitas merek; 150 sistem DESIGN.md, 100+ skills, dan 261 plugin sudah termasuk.
  it: "Alternativa open source a Claude Design: trasforma la CLI di Claude Code / Codex / Cursor sul tuo laptop in un motore di design. Scrivi un brief e streama prototipi UI, deck, video e artefatti di qualità brand; 150 sistemi DESIGN.md, oltre 100 skill e 261 plugin sono inclusi."
  ja: オープンソースの Claude Design 代替 — お使いのノートPCの Claude Code / Codex / Cursor CLI をデザインエンジンに変えます。ブリーフひとつ入力して UI プロトタイプ、デッキ、動画、ブランド品質のアーティファクトをストリーミング。150 種の DESIGN.md システム、100 以上の skills、261 のプラグインが標準搭載です。
  ko: Claude Design의 오픈소스 대안 — 노트북의 Claude Code / Codex / Cursor CLI를 디자인 엔진으로 바꿉니다. 브리프를 입력하면 UI 프로토타입, 덱, 영상, 브랜드급 산출물을 스트리밍합니다. 150개의 DESIGN.md 시스템, 100개 이상의 skills, 261개의 플러그인이 기본 제공됩니다.
  pl: Alternatywa open source dla Claude Design — zamienia CLI Claude Code / Codex / Cursor na twoim laptopie w silnik projektowy. Napisz brief i strumieniuj prototypy UI, prezentacje, wideo oraz artefakty klasy markowej; 150 systemów DESIGN.md, ponad 100 skills i 261 wtyczek jest w zestawie.
  pt: Alternativa de código aberto ao Claude Design — transforma a CLI do Claude Code / Codex / Cursor no seu notebook em um motor de design. Escreva um briefing e transmita protótipos de UI, decks, vídeos e artefatos de qualidade de marca; 150 sistemas DESIGN.md, mais de 100 skills e 261 plugins vêm prontos.
  ro: Alternativă open source pentru Claude Design — transformă CLI-ul Claude Code / Codex / Cursor de pe laptopul tău într-un motor de design. Scrie un brief și transmite prototipuri de UI, prezentări, videoclipuri și artefacte de calitate de marcă; 150 de sisteme DESIGN.md, 100+ skill-uri și 261 de pluginuri vin incluse.
  ru: Открытая альтернатива Claude Design — превращает CLI Claude Code / Codex / Cursor на вашем ноутбуке в дизайн-движок. Напишите бриф и получайте потоком UI-прототипы, деки, видео и артефакты уровня бренда; 150 систем DESIGN.md, более 100 skills и 261 плагин поставляются в комплекте.
  th: ทางเลือกโอเพนซอร์สแทน Claude Design — เปลี่ยน CLI ของ Claude Code / Codex / Cursor ในแล็ปท็อปของคุณให้เป็นเครื่องมือออกแบบ พิมพ์บรีฟแล้วสตรีมต้นแบบ UI เด็ค วิดีโอ และชิ้นงานระดับแบรนด์ พร้อม 150 ระบบ DESIGN.md กว่า 100 skills และ 261 ปลั๊กอินในกล่อง
  tr: Claude Design için açık kaynak alternatif — dizüstü bilgisayarındaki Claude Code / Codex / Cursor CLI'sini bir tasarım motoruna dönüştürür. Bir brief yazın; UI prototipleri, deck'ler, videolar ve marka kalitesinde çıktılar akış halinde gelsin; 150 DESIGN.md sistemi, 100+ skill ve 261 eklenti kutuyla birlikte gelir.
  uk: Відкрита альтернатива Claude Design — перетворює CLI Claude Code / Codex / Cursor на вашому ноутбуці на дизайн-рушій. Напишіть бриф і отримуйте потоком UI-прототипи, деки, відео та артефакти брендового рівня; 150 систем DESIGN.md, понад 100 skills і 261 плагін постачаються в комплекті.
  vi: Giải pháp mã nguồn mở thay thế Claude Design — biến CLI Claude Code / Codex / Cursor trên laptop của bạn thành công cụ thiết kế. Viết yêu cầu ngắn rồi trực tiếp nhận prototype UI, deck, video và sản phẩm chuẩn thương hiệu; 150 hệ DESIGN.md, hơn 100 skills và 261 plugin đã có sẵn trong gói.
x:
  source: https://github.com/nexu-io/open-design
rule:
  /git:
    cmd: x git clone nexu-io/open-design
    reference: https://github.com/nexu-io/open-design#-quick-start
binlist:
- open-design

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 3.7 MB
          rating: 1
          desc:
            cn: 约 3.7 MB（估算）
            en: ~3.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
