lang: Rust
homepage: https://github.com/mufeedvh/code2prompt
license: mit
desc:
  cn: 将代码库转换为单一 LLM 提示词的 Rust CLI，支持源码树、Handlebars 模板、token 计数、Git 集成，并提供 Python SDK 与 MCP Server
  en: A Rust CLI that converts a codebase into a single LLM prompt with source tree, Handlebars templating, token counting and Git integration; ships with a Python SDK and MCP Server.
x:
  source: https://github.com/mufeedvh/code2prompt
  eget: mufeedvh/code2prompt
  brew: code2prompt
  pip: code2prompt-rs
  cargo: code2prompt
rule:
  /eget:
    cmd: x eget mufeedvh/code2prompt
    reference: https://github.com/mufeedvh/code2prompt
  darwin/brew:
    cmd: brew install code2prompt
    reference: https://github.com/mufeedvh/code2prompt#-quick-install
  /cargo:
    cmd: cargo install code2prompt
    reference: https://github.com/mufeedvh/code2prompt#-quick-install
    dsnap: code2prompt
  /pip:
    cmd: pip install code2prompt-rs
    reference: https://github.com/mufeedvh/code2prompt#sdk-with-pip-
    dsnap: code2prompt-rs
binlist:
- code2prompt
# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 安装 20 MB
            en: 20 MB install
        download:
          estimate: 20 MB
          desc:
            cn: 约 20 MB 下载 (linux/x64)
            en: ~20 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
