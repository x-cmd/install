lang: Rust
homepage: https://github.com/vercel-labs/agent-browser
license: Apache-2.0
desc:
  cn: AI 代理的无头浏览器自动化 CLI。快速 Rust CLI，带 Node.js 后备。
  en: Headless browser automation CLI for AI agents. Fast Rust CLI with Node.js fallback.
  cs: CLI pro automatizaci headless prohlížeče pro AI agenty. Rychlé Rust CLI s Node.js zálohou.
  de: Headless-Browser-Automatisierungs-CLI für KI-Agenten. Schnelle Rust-CLI mit Node.js-Fallback.
  es: CLI de automatización de navegador sin cabeza para agentes de IA. CLI rápido en Rust con alternativa en Node.js.
  fr: CLI d'automatisation de navigateur sans interface pour les agents IA. CLI rapide en Rust avec repli sur Node.js.
  id: CLI otomatisasi browser headless untuk agen AI. CLI Rust cepat dengan cadangan Node.js.
  it: CLI di automazione browser headless per agenti IA. CLI Rust veloce con fallback Node.js.
  ja: AIエージェント向けのヘッドレスブラウザ自動化CLI。高速なRust製CLIで、Node.jsにフォールバック対応。
  ko: AI 에이전트를 위한 헤드리스 브라우저 자동화 CLI. Node.js 폴백을 갖춘 빠른 Rust CLI.
  pl: CLI do automatyzacji przeglądarki headless dla agentów AI. Szybkie CLI w Rust z awaryjnym fallbackiem na Node.js.
  pt: CLI de automação de navegador headless para agentes de IA. CLI rápido em Rust com fallback para Node.js.
  ro: CLI de automatizare a browserului headless pentru agenți AI. CLI rapid în Rust cu fallback pe Node.js.
  ru: CLI для автоматизации headless-браузера для ИИ-агентов. Быстрый Rust CLI с резервным вариантом на Node.js.
  th: CLI สำหรับทำอัตโนมัติเบราว์เซอร์แบบ headless สำหรับเอเจนต์ AI คือ Rust CLI ที่เร็วพร้อมทางเลือกสำรองเป็น Node.js
  tr: Yapay zekâ ajanları için başsız tarayıcı otomasyon CLI'sı. Node.js yedeğiyle birlikte hızlı Rust CLI.
  uk: CLI для автоматизації headless-браузера для ШІ-агентів. Швидкий Rust CLI із запасним варіантом на Node.js.
  vi: CLI tự động hóa trình duyệt headless cho tác tử AI. CLI Rust nhanh kèm phương án dự phòng bằng Node.js.
x:
  source: https://github.com/vercel-labs/agent-browser
  eget: vercel-labs/agent-browser
  brew: agent-browser
  npm: agent-browser
  cargo: agent-browser
rule:
  /x:
    cmd: x pkg use agent-browser
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget vercel-labs/agent-browser
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install -g agent-browser && agent-browser install
    reference: https://github.com/vercel-labs/agent-browser#global-installation-recommended
    dsnap: agent-browser
  darwin/brew:
    cmd: brew install agent-browser && agent-browser install
    reference: https://github.com/vercel-labs/agent-browser#homebrew-macos
  /cargo:
    cmd: cargo install agent-browser && agent-browser install
    reference: https://github.com/vercel-labs/agent-browser#cargo-rust
binlist:
  - agent-browser

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
