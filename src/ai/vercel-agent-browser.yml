lang: Rust
homepage: https://github.com/vercel-labs/agent-browser
license: Apache-2.0
desc:
  cn: AI 代理的无头浏览器自动化 CLI。快速 Rust CLI，带 Node.js 后备。
  en: Headless browser automation CLI for AI agents. Fast Rust CLI with Node.js fallback.
x:
  source: https://github.com/vercel-labs/agent-browser
  eget: https://github.com/vercel-labs/agent-browser
  brew: agent-browser
  npm: agent-browser
  cargo: agent-browser
rule:
  /x:
    cmd: x pkg use agent-browser
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget vercel-labs/agent-browser
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install -g agent-browser && agent-browser install
    reference: https://github.com/vercel-labs/agent-browser#global-installation-recommended
    dsnap: agent-browser
  darwin/brew:
    cmd: brew install agent-browser && agent-browser install
    reference: https://github.com/vercel-labs/agent-browser#homebrew-macos
  /cargo:
    cmd: cargo install agent-browser && agent-browser install
    reference: https://github.com/vercel-labs/agent-browser#cargo-rust
binlist:
  - agent-browser

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
