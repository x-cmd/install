lang: Go
homepage: https://github.com/bgdnvk/clanker
license: mit
desc:
  cn: 通过终端自然语言命令查询、创建与管理 AWS、Kubernetes 等云基础设施
  en: Query, create, and manage cloud infrastructure on AWS, Kubernetes, and more using natural language commands from your terminal.
x:
  source: https://github.com/bgdnvk/clanker
  eget: https://github.com/bgdnvk/clanker
rule:
  /eget:
    cmd: x eget bgdnvk/clanker
    reference: https://github.com/bgdnvk/clanker
binlist:
- clanker

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 49 MB
          rating: 2
          desc:
            cn: 安装 49 MB
            en: 49 MB install
        download:
          estimate: 49 MB
          desc:
            cn: 约 49 MB 下载 (macos/x64)
            en: ~49 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
