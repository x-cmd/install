lang: Go
homepage: https://github.com/bgdnvk/clanker
license: mit
desc:
  cn: 通过终端自然语言命令查询、创建与管理 AWS、Kubernetes 等云基础设施
  en: Query, create, and manage cloud infrastructure on AWS, Kubernetes, and more using natural language commands from your terminal.
x:
  source: https://github.com/bgdnvk/clanker
  eget: https://github.com/bgdnvk/clanker
rule:
  /eget:
    cmd: x eget bgdnvk/clanker
    reference: https://github.com/bgdnvk/clanker
binlist:
- clanker

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 19 MB
          rating: 2
          desc:
            cn: 约 19 MB（估算）
            en: ~19 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
