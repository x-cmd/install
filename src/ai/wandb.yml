lang: 'Python'
homepage: https://github.com/wandb/wandb
license: 'MIT'
desc:
  cn: AI 开发者平台，用于训练、微调模型并管理从实验到生产的全流程
  en: 'The AI developer platform. Use Weights & Biases to train and fine-tune models, and manage models from experimentation to production.'
  cs: Vývojářská platforma AI. Použijte Weights & Biases k trénování a doladění modelů a ke správě modelů od experimentování po produkci.
  de: Die KI-Entwicklerplattform. Nutzen Sie Weights & Biases, um Modelle zu trainieren und feinzustimmen und sie vom Experimentieren bis zur Produktion zu verwalten.
  es: La plataforma para desarrolladores de IA. Use Weights & Biases para entrenar y ajustar modelos y gestionarlos desde la experimentación hasta la producción.
  fr: La plateforme de développement IA. Utilisez Weights & Biases pour entraîner et affiner des modèles et les gérer, de l'expérimentation à la production.
  id: Platform pengembang AI. Gunakan Weights & Biases untuk melatih dan menyempurnakan model, serta mengelola model dari eksperimen hingga produksi.
  it: La piattaforma per gli sviluppatori AI. Usa Weights & Biases per addestrare e mettere a punto i modelli e gestirli dall'esperimento alla produzione.
  ja: AI 開発者プラットフォーム。Weights & Biases を使ってモデルの学習とファインチューニングを行い、実験から本番までを管理できます。
  ko: AI 개발자 플랫폼. Weights & Biases로 모델을 학습시키고 미세 조정하며, 실험부터 프로덕션까지 모델을 관리하세요.
  pl: Platforma deweloperska AI. Użyj Weights & Biases do trenowania i dostrajania modeli oraz zarządzania nimi od eksperymentów po produkcję.
  pt: A plataforma de desenvolvedores de IA. Use Weights & Biases para treinar e ajustar modelos e gerenciar modelos da experimentação à produção.
  ro: Platforma pentru dezvoltatori AI. Folosiți Weights & Biases pentru a antrena și regla modele și a le gestiona de la experimentare până la producție.
  ru: Платформа разработчиков ИИ. Используйте Weights & Biases для обучения и дообучения моделей и управления ими на всех этапах — от экспериментов до продакшена.
  th: แพลตฟอร์มสำหรับนักพัฒนา AI ใช้ Weights & Biases เพื่อฝึกและปรับแต่งโมเดล พร้อมจัดการโมเดลตั้งแต่การทดลองจนถึงการใช้งานจริง
  tr: Yapay zeka geliştirici platformu. Weights & Biases ile modelleri eğitin, ince ayar yapın ve deneyden üretime kadar modelleri yönetin.
  uk: Платформа розробника ШІ. Використовуйте Weights & Biases для навчання та донавчання моделей і керування ними від експериментів до продакшену.
  vi: Nền tảng dành cho nhà phát triển AI. Dùng Weights & Biases để huấn luyện và tinh chỉnh mô hình, cũng như quản lý mô hình từ thử nghiệm đến sản xuất.
x:
  source: https://github.com/wandb/wandb
  eget: wandb/wandb
rule:
  /eget:
    cmd: x eget wandb/wandb
    reference: https://github.com/wandb/wandb
binlist:
  - 'wandb'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 454 KB
          rating: 1
          desc:
            cn: 约 454 KB（估算）
            en: ~454 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
