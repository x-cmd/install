lang: 'Python'
homepage: https://github.com/wandb/wandb
license: 'MIT'
desc:
  cn: AI 开发者平台，用于训练、微调模型并管理从实验到生产的全流程
  en: 'The AI developer platform. Use Weights & Biases to train and fine-tune models, and manage models from experimentation to production.'
x:
  source: https://github.com/wandb/wandb
  eget: https://github.com/wandb/wandb
rule:
  /eget:
    cmd: x eget wandb/wandb
    reference: https://github.com/wandb/wandb
binlist:
  - 'wandb'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 454 KB
          rating: 1
          desc:
            cn: 约 454 KB（估算）
            en: ~454 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
