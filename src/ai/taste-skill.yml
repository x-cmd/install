lang: JavaScript
homepage: https://github.com/Leonxlnx/taste-skill
license: mit
desc:
  cn: 为你的 AI 赋予良好品味，避免生成平庸、套路化的内容
  en: Taste-Skill - gives your AI good taste. stops the AI from generating boring, generic slop
x:
  source: https://github.com/Leonxlnx/taste-skill
  eget: https://github.com/Leonxlnx/taste-skill
rule:
  /eget:
    cmd: x eget Leonxlnx/taste-skill
    reference: https://github.com/Leonxlnx/taste-skill
binlist:
- taste-skill

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
