lang: JavaScript
homepage: https://github.com/Leonxlnx/taste-skill
license: mit
desc:
  cn: 为你的 AI 赋予良好品味，避免生成平庸、套路化的内容
  en: Taste-Skill - gives your AI good taste. stops the AI from generating boring, generic slop
  cs: Taste-Skill – dává vaší AI chuť. Zabraňuje AI generovat nudný, generický balast.
  de: Taste-Skill – verleiht deiner KI guten Geschmack und verhindert, dass sie langweilige, generische Inhalte erzeugt.
  es: "Taste-Skill: le da buen gusto a tu IA y evita que genere contenido aburrido y genérico."
  fr: Taste-Skill – donne du goût à votre IA et l'empêche de générer du contenu ennuyeux et générique.
  id: Taste-Skill - memberi AI Anda rasa yang baik dan mencegahnya menghasilkan konten membosankan dan generik.
  it: "Taste-Skill: dà alla tua IA un buon gusto, impedendole di generare contenuti noiosi e generici."
  ja: Taste-Skill - AIに良いセンスを与え、退屈でテンプレ化した内容を生成するのを防ぎます。
  ko: Taste-Skill - AI에 좋은 취향을 부여하여 지루하고 평범한 콘텐츠를 생성하는 것을 막습니다.
  pl: Taste-Skill – nadaje Twojemu AI dobrego gustu i powstrzymuje go od generowania nudnych, generycznych treści.
  pt: Taste-Skill – dá bom gosto à sua IA e impede que ela gere conteúdo chato e genérico.
  ro: Taste-Skill – oferă AI-ului tău bun simț și îl împiedică să genereze conținut plictisitor și generic.
  ru: Taste-Skill — даёт вашему ИИ хороший вкус и не даёт ему генерировать скучный, шаблонный контент.
  th: Taste-Skill - ให้ AI ของคุณมีรสนะยอดเยี่ยม และป้องกันไม่ให้สร้างเนื้อหาที่น่าเบื่อและทั่วไป
  tr: Taste-Skill - yapay zekânıza iyi bir tat verir, sıkıcı ve jenerik içerik üretmesini engeller.
  uk: Taste-Skill — надає вашому ШІ добрий смак і не дає йому генерувати нудний, шаблонний контент.
  vi: Taste-Skill - trao cho AI của bạn gu thẩm mỹ tốt và ngăn AI tạo ra nội dung nhàm chánh, hời hợt.
x:
  source: https://github.com/Leonxlnx/taste-skill
  eget: Leonxlnx/taste-skill
rule:
  /eget:
    cmd: x eget Leonxlnx/taste-skill
    reference: https://github.com/Leonxlnx/taste-skill
binlist:
- taste-skill

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
