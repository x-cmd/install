lang: Go
homepage: https://github.com/steipete/brabble
license: mit
desc:
  cn: Star Trek 式的对话 Agent，可在触发命令后运行钩子，完全本地运行
  en: '"Hey, Computer" from Star Trek. Talk to your agent. Run hooks after trigger comands. Runs locally, cause shit''s scary.'
x:
  source: https://github.com/steipete/brabble
  eget: https://github.com/steipete/brabble
rule:
  /eget:
    cmd: x eget steipete/brabble
    reference: https://github.com/steipete/brabble
binlist:
- brabble

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 239 KB
          rating: 1
          desc:
            cn: 约 239 KB（估算）
            en: ~239 KB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (macos/arm64)
            en: ~4 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
