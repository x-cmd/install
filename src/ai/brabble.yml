lang: Go
homepage: https://github.com/steipete/brabble
license: mit
desc:
  cn: Star Trek 式的对话 Agent，可在触发命令后运行钩子，完全本地运行
  en: '"Hey, Computer" from Star Trek. Talk to your agent. Run hooks after trigger comands. Runs locally, cause shit''s scary.'
x:
  source: https://github.com/steipete/brabble
  eget: https://github.com/steipete/brabble
rule:
  /eget:
    cmd: x eget steipete/brabble
    reference: https://github.com/steipete/brabble
binlist:
- brabble

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
