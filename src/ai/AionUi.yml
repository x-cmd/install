lang: TypeScript
homepage: https://github.com/iOfficeAI/AionUi
license: apache-2.0
desc:
  cn: 面向 OpenClaw、Hermes Agent、Claude Code、Codex、OpenCode、Gemini CLI 等 20+ CLI 的免费本地开源 7x24 协同应用，支持自定义助手
  en: Free, local, open-source 24/7 Cowork app for OpenClaw, Hermes Agent, Claude Code, Codex, OpenCode, Gemini CLI and 20+ more CLI | Customize your assistants | Star if you like it!
x:
  source: https://github.com/iOfficeAI/AionUi
  eget: https://github.com/iOfficeAI/AionUi
rule:
  /eget:
    cmd: x eget iOfficeAI/AionUi
    reference: https://github.com/iOfficeAI/AionUi
binlist:
- AionUi

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
