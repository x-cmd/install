lang: Python
homepage: https://github.com/Andyyyy64/whichllm
license: mit
desc:
  cn: 根据基准测试和硬件规格对 HuggingFace 模型排序，帮你找出能在本机运行的最优本地 LLM
  en: Find the best local LLM that runs on your hardware by ranking HuggingFace models based on benchmarks and system specs.
x:
  source: https://github.com/Andyyyy64/whichllm
rule:
  /pip:
    cmd: pip install whichllm
    reference: https://github.com/Andyyyy64/whichllm
    dsnap: whichllm
  /git:
    cmd: x git clone Andyyyy64/whichllm
    reference: https://github.com/Andyyyy64/whichllm
binlist:
- whichllm

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
