lang: Python
homepage: https://github.com/Andyyyy64/whichllm
license: mit
desc:
  cn: 根据基准测试和硬件规格对 HuggingFace 模型排序，帮你找出能在本机运行的最优本地 LLM
  en: Find the best local LLM that runs on your hardware by ranking HuggingFace models based on benchmarks and system specs.
x:
  source: https://github.com/Andyyyy64/whichllm
rule:
  /pip:
    cmd: pip install whichllm
    reference: https://github.com/Andyyyy64/whichllm
    dsnap: whichllm
  /git:
    cmd: x git clone Andyyyy64/whichllm
    reference: https://github.com/Andyyyy64/whichllm
binlist:
- whichllm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 KB
          rating: 1
          desc:
            cn: 约 30 KB（估算）
            en: ~30 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
