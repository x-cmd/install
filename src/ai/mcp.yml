lang: TypeScript
homepage: https://github.com/BrowserMCP/mcp
license: apache-2.0
desc:
  cn: 浏览器 MCP 服务器，让 AI 应用可以控制你的浏览器
  en: Browser MCP is a Model Context Provider (MCP) server that allows AI applications to control your browser
x:
  source: https://github.com/BrowserMCP/mcp
  npm: "@browsermcp/mcp"
rule:
  /npm:
    cmd: npm install -g @browsermcp/mcp
    reference: https://www.npmjs.com/package/@browsermcp/mcp
    dsnap: '@browsermcp/mcp'
binlist:
- mcp
# complicated
footprint:
  behavior:
    runtime:
      type: daemon   # MCP server 持续运行
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取浏览器会话状态
          en: Reads browser session state
        sensitive: []
      write:
        desc:
          cn: 无文件系统读写
          en: No filesystem reads or writes
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 200 MB
        desc:
          cn: 浏览器交互时
          en: During browser interactions
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 处理浏览器请求时
          en: Spike during browser request handling
