lang: TypeScript
homepage: https://github.com/makenotion/notion-mcp-server
license: mit
desc:
  cn: Notion 官方 MCP 服务器
  en: Official Notion MCP Server
x:
  source: https://github.com/makenotion/notion-mcp-server
rule:
  /npm:
    cmd: npm install -g @notionhq/notion-mcp-server
    reference: https://www.npmjs.com/package/@notionhq/notion-mcp-server
    dsnap: '@notionhq/notion-mcp-server'
binlist:
- notion-mcp-server

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 KB
          rating: 1
          desc:
            cn: 约 8 KB（估算）
            en: ~8 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
