lang: Go
homepage: https://github.com/yusufcanb/tlm
license: apache-2.0
desc:
  cn: 基于 Ollama 的本地 CLI Copilot
  en: Local CLI Copilot, powered by Ollama. 💻🦙
x:
  source: https://github.com/yusufcanb/tlm
  eget: https://github.com/yusufcanb/tlm
rule:
  /eget:
    cmd: x eget yusufcanb/tlm
    reference: https://github.com/yusufcanb/tlm
binlist:
- tlm

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
