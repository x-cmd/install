lang: Go
homepage: https://github.com/yusufcanb/tlm
license: apache-2.0
desc:
  cn: 基于 Ollama 的本地 CLI Copilot
  en: Local CLI Copilot, powered by Ollama. 💻🦙
x:
  source: https://github.com/yusufcanb/tlm
  eget: https://github.com/yusufcanb/tlm
rule:
  /eget:
    cmd: x eget yusufcanb/tlm
    reference: https://github.com/yusufcanb/tlm
binlist:
- tlm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 170 KB
          rating: 1
          desc:
            cn: 约 170 KB（估算）
            en: ~170 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
