lang: Rust
homepage: https://github.com/AIScientists-Dev/flowtrace
license: mit
desc:
  cn: 把 AI Agent 的工作流跑成可审计、可检查、可重用的步骤序列，每步输出落到 git 仓库里供验证与回放
  en: Runs AI agent workflows as a series of auditable steps, saving each output to a version-controlled repository for verification, debugging, and reuse.
x:
  source: https://github.com/AIScientists-Dev/flowtrace
rule:
  /cargo:
    cmd: cargo install --git https://github.com/AIScientists-Dev/flowtrace flowtrace-cli
    reference: https://github.com/AIScientists-Dev/flowtrace#install-by-hand
    dsnap: flowtrace-cli
  /curl:
    cmd: bash <(curl -fsSL https://raw.githubusercontent.com/AIScientists-Dev/flowtrace/main/scripts/install.sh)
    reference: https://github.com/AIScientists-Dev/flowtrace#install-by-hand
binlist:
- flowtrace
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
