lang: 'Rust'
homepage: 'https://github.com/echosoar/canvas-cli'
license: noassertion
desc:
  cn: 纯 Rust 实现的类 Canvas API 绘图库，让无法直接生成图像的 AI 模型也能产出图片
  en: 'pure rust implemented drawer library( api like canvas), enables AI models that do not produce raw images to generate images'
x:
  source: https://github.com/echosoar/canvas-cli
  eget: https://github.com/echosoar/canvas-cli
rule:
  /eget:
    cmd: x eget echosoar/canvas-cli
    reference: https://github.com/echosoar/canvas-cli
binlist:
- 'canvas-cli'

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 267 KB
          rating: 1
          desc:
            cn: 约 267 KB（估算）
            en: ~267 KB estimated
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
