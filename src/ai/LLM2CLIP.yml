lang: Python
homepage: https://github.com/microsoft/LLM2CLIP
license: mit
desc:
  cn: 显著提升 CLIP 模型效果（在已有 SOTA 基础上）
  en: LLM2CLIP significantly improves already state-of-the-art CLIP models.
x:
  source: https://github.com/microsoft/LLM2CLIP
  eget: https://github.com/microsoft/LLM2CLIP
rule:
  /eget:
    cmd: x eget microsoft/LLM2CLIP
    reference: https://github.com/microsoft/LLM2CLIP
binlist:
- LLM2CLIP

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
