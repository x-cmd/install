lang: Python
homepage: https://github.com/microsoft/LLM2CLIP
license: mit
desc:
  cn: 显著提升 CLIP 模型效果（在已有 SOTA 基础上）
  en: LLM2CLIP significantly improves already state-of-the-art CLIP models.
x:
  source: https://github.com/microsoft/LLM2CLIP
  eget: https://github.com/microsoft/LLM2CLIP
rule:
  /eget:
    cmd: x eget microsoft/LLM2CLIP
    reference: https://github.com/microsoft/LLM2CLIP
binlist:
- LLM2CLIP

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 KB
          rating: 1
          desc:
            cn: 约 25 KB（估算）
            en: ~25 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
