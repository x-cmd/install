lang: Rust
homepage: https://github.com/sigoden/aichat
license: apache-2.0
desc:
  cn: 全功能 LLM CLI 工具，集成 Shell 助手、Chat-REPL、RAG、AI 工具与 Agent，可接入 OpenAI、Claude、Gemini、Ollama、Groq 等
  en: All-in-one LLM CLI tool featuring Shell Assistant, Chat-REPL, RAG, AI Tools & Agents, with access to OpenAI, Claude, Gemini, Ollama, Groq, and more.
x:
  source: https://github.com/sigoden/aichat
  eget: https://github.com/sigoden/aichat
rule:
  /eget:
    cmd: x eget sigoden/aichat
    reference: https://github.com/sigoden/aichat
binlist:
- aichat

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
