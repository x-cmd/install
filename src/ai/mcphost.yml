lang: Go
homepage: https://github.com/mark3labs/mcphost
license: MIT
desc:
  cn: 一个 CLI 主机应用程序，支持大型语言模型 (LLM) 通过模型上下文协议 (MCP) 与外部工具交互。
  en: A CLI host application that enables Large Language Models (LLMs) to interact with external tools through the Model Context Protocol (MCP).
x:
  source: https://github.com/mark3labs/mcphost
  eget: https://github.com/mark3labs/mcphost
rule:
  /eget:
    cmd: x eget mark3labs/mcphost
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/mark3labs/mcphost@latest
    reference: https://github.com/mark3labs/mcphost?tab=readme-ov-file#installation-
    dsnap: github.com/mark3labs/mcphost@latest
  arch/yay:
    cmd: yay -S mcphost
    reference: https://aur.archlinux.org/packages/mcphost
binlist:
- mcphost

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
