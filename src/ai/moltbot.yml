lang: TypeScript
homepage: https://github.com/moltbot/moltbot
license: MIT
desc:
  cn: Moltbot 是一款在你个人设备上运行的私人 AI 助手。
  en: Moltbot is a personal AI assistant you run on your own devices.
x:
  source: https://github.com/moltbot/moltbot
rule:
  /curl:
    cmd: curl -fsSL https://molt.bot/install.sh | bash
    reference: https://www.molt.bot/
  /npm:
    cmd: npm install -g moltbot@latest
    reference: https://www.molt.bot/
  win/powershell:
    cmd: x pwsh 'iwr -useb https://molt.bot/install.ps1 | iex'
    reference: https://www.molt.bot/
binlist:
  - moltbot

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
