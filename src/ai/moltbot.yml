lang: TypeScript
homepage: https://github.com/moltbot/moltbot
license: MIT
desc:
  cn: Moltbot 是一款在你个人设备上运行的私人 AI 助手。
  en: Moltbot is a personal AI assistant you run on your own devices.
x:
  source: https://github.com/moltbot/moltbot
rule:
  /curl:
    cmd: curl -fsSL https://molt.bot/install.sh | bash
    reference: https://www.molt.bot/
  /npm:
    cmd: npm install -g moltbot@latest
    reference: https://www.molt.bot/
  win/powershell:
    cmd: x pwsh 'iwr -useb https://molt.bot/install.ps1 | iex'
    reference: https://www.molt.bot/
binlist:
- moltbot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 约 14 MB（估算）
            en: ~14 MB estimated
        download:
          estimate: 401 MB
          desc:
            cn: 约 401 MB 下载 (dmg)
            en: ~401 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
