lang: TypeScript
homepage: https://github.com/moltbot/moltbot
license: MIT
desc:
  cn: Moltbot 是一款在你个人设备上运行的私人 AI 助手。
  en: Moltbot is a personal AI assistant you run on your own devices.
  cs: Moltbot je osobní AI asistent, který si spouštíte na vlastních zařízeních.
  de: Moltbot ist ein persönlicher KI-Assistent, den Sie auf Ihren eigenen Geräten ausführen.
  es: Moltbot es un asistente de IA personal que ejecutas en tus propios dispositivos.
  fr: Moltbot est un assistant IA personnel que vous exécutez sur vos propres appareils.
  id: Moltbot adalah asisten AI pribadi yang Anda jalankan di perangkat Anda sendiri.
  it: Moltbot è un assistente IA personale che esegui sui tuoi dispositivi.
  ja: Moltbotは、自分のデバイス上で動かす個人のAIアシスタントです。
  ko: Moltbot은 내 기기에서 직접 실행하는 개인 AI 어시스턴트입니다.
  pl: Moltbot to osobisty asystent AI, który uruchamiasz na własnych urządzeniach.
  pt: O Moltbot é um assistente de IA pessoal que você executa em seus próprios dispositivos.
  ro: Moltbot este un asistent AI personal pe care îl rulezi pe dispozitivele tale.
  ru: Moltbot — персональный ИИ-ассистент, который вы запускаете на своих устройствах.
  th: Moltbot คือผู้ช่วย AI ส่วนตัวที่คุณรันบนอุปกรณ์ของคุณเอง
  tr: Moltbot, kendi cihazlarınızda çalıştırdığınız kişisel bir yapay zeka asistanıdır.
  uk: Moltbot — персональний ШІ-асистент, який ви запускаєте на власних пристроях.
  vi: Moltbot là trợ lý AI cá nhân do bạn tự chạy trên thiết bị của mình.
x:
  source: https://github.com/moltbot/moltbot
  npm: moltbot@latest
rule:
  /curl:
    cmd: curl -fsSL https://molt.bot/install.sh | bash
    reference: https://www.molt.bot/
  /npm:
    cmd: npm install -g moltbot@latest
    reference: https://www.molt.bot/
  win/powershell:
    cmd: x pwsh 'iwr -useb https://molt.bot/install.ps1 | iex'
    reference: https://www.molt.bot/
binlist:
- moltbot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 401 MB
          rating: 4
          desc:
            cn: 安装 401 MB
            en: 401 MB install
        download:
          estimate: 401 MB
          desc:
            cn: 约 401 MB 下载 (dmg)
            en: ~401 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
