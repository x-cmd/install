lang: Python
homepage: https://github.com/repowise-dev/repowise
license: noassertion
desc:
  cn: 索引代码库的依赖、Git 历史和架构，为 AI 编码 Agent 提供深度上下文，提升回答质量并节省 token
  en: Indexes a codebase's dependencies, git history, and architecture to provide deep context to AI coding agents, improving answer quality and token efficiency.
x:
  source: https://github.com/repowise-dev/repowise
  eget: https://github.com/repowise-dev/repowise
rule:
  /eget:
    cmd: x eget repowise-dev/repowise
    reference: https://github.com/repowise-dev/repowise
binlist:
- repowise

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
