lang: Python
homepage: https://github.com/KINGSTON-115/llm-pid-tuner
license: other
desc:
  cn: 基于 LLM 的极简 PID 自动调参系统（CLI 版）
  en: 基于 LLM 的极简 PID 自动调参系统 (CLI 版)
x:
  source: https://github.com/KINGSTON-115/llm-pid-tuner
  eget: https://github.com/KINGSTON-115/llm-pid-tuner
rule:
  /eget:
    cmd: x eget KINGSTON-115/llm-pid-tuner
    reference: https://github.com/KINGSTON-115/llm-pid-tuner
binlist:
- llm-pid-tuner

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 35 KB
          rating: 1
          desc:
            cn: 约 35 KB（估算）
            en: ~35 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
