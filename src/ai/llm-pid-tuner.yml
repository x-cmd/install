lang: Python
homepage: https://github.com/KINGSTON-115/llm-pid-tuner
license: other
desc:
  cn: 基于 LLM 的极简 PID 自动调参系统（CLI 版）
  en: 基于 LLM 的极简 PID 自动调参系统 (CLI 版)
x:
  source: https://github.com/KINGSTON-115/llm-pid-tuner
  eget: https://github.com/KINGSTON-115/llm-pid-tuner
rule:
  /eget:
    cmd: x eget KINGSTON-115/llm-pid-tuner
    reference: https://github.com/KINGSTON-115/llm-pid-tuner
binlist:
- llm-pid-tuner

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
