lang: TypeScript
homepage: https://github.com/tradingview/lightweight-charts
license: apache-2.0
desc:
  cn: TradingView 官方的轻量高性能金融图表库，用 HTML5 canvas 渲染交互式 K 线、折线、面积图。
  en: TradingView's lightweight, high-performance financial charting library for interactive candlestick, line, and area charts on HTML5 canvas.
x:
  source: https://github.com/tradingview/lightweight-charts
rule:
  /npm:
    cmd: npm install lightweight-charts
    reference: https://github.com/tradingview/lightweight-charts?tab=readme-ov-file#installing
binlist:
- lightweight-charts

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 148 KB
          rating: 1
          desc:
            cn: 约 148 KB（估算）
            en: ~148 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
