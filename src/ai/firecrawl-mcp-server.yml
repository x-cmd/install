lang: JavaScript
homepage: https://github.com/firecrawl/firecrawl-mcp-server
license: mit
desc:
  cn: Firecrawl 官方 MCP 服务器，为 Cursor、Claude 等 LLM 客户端提供强大的网页抓取与搜索能力
  en: 🔥 Official Firecrawl MCP Server - Adds powerful web scraping and search to Cursor, Claude and any other LLM clients.
x:
  source: https://github.com/firecrawl/firecrawl-mcp-server
rule:
  /npm:
    cmd: npm install -g firecrawl-mcp
    reference: https://www.npmjs.com/package/firecrawl-mcp
    dsnap: 'firecrawl-mcp'
binlist:
- firecrawl-mcp-server

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
