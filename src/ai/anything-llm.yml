lang: JavaScript
homepage: https://github.com/Mintplex-Labs/anything-llm
license: mit
desc:
  cn: 本地优先的强大 Agent 体验，让你拥有自己的智能而非租用
  en: Stop renting your intelligence. Own it with AnythingLLM. Everything you need for a powerful local-first agent experience
x:
  source: https://github.com/Mintplex-Labs/anything-llm
  eget: Mintplex-Labs/anything-llm
rule:
  /eget:
    cmd: x eget Mintplex-Labs/anything-llm
    reference: https://github.com/Mintplex-Labs/anything-llm
binlist:
- anything-llm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 522 MB
          rating: 4
          desc:
            cn: 安装 522 MB
            en: 522 MB install
        download:
          estimate: 522 MB
          desc:
            cn: 约 522 MB 下载 (dmg)
            en: ~522 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
