lang: JavaScript
homepage: https://github.com/Mintplex-Labs/anything-llm
license: mit
desc:
  cn: 本地优先的强大 Agent 体验，让你拥有自己的智能而非租用
  en: Stop renting your intelligence. Own it with AnythingLLM. Everything you need for a powerful local-first agent experience
x:
  source: https://github.com/Mintplex-Labs/anything-llm
  eget: https://github.com/Mintplex-Labs/anything-llm
rule:
  /eget:
    cmd: x eget Mintplex-Labs/anything-llm
    reference: https://github.com/Mintplex-Labs/anything-llm
binlist:
- anything-llm

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
