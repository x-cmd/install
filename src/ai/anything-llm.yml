lang: JavaScript
homepage: https://github.com/Mintplex-Labs/anything-llm
license: mit
desc:
  cn: 本地优先的强大 Agent 体验，让你拥有自己的智能而非租用
  en: Stop renting your intelligence. Own it with AnythingLLM. Everything you need for a powerful local-first agent experience
  cs: Přestaňte si pronajímat svou inteligenci. Vlastněte ji s AnythingLLM. Všechno, co potřebujete pro výkonnou lokální agenci
  de: Hören Sie auf, Ihre Intelligenz zu mieten. Besitzen Sie sie mit AnythingLLM. Alles, was Sie für eine leistungsstarke lokale Agentenerfahrung brauchen
  es: Deja de alquilar tu inteligencia. Sé su dueño con AnythingLLM. Todo lo que necesitas para una potente experiencia de agente local
  fr: Arrêtez de louer votre intelligence. Possédez-la avec AnythingLLM. Tout ce dont vous avez besoin pour une expérience d'agent local performante
  id: Berhenti menyewa kecerdasan Anda. Milikilah dengan AnythingLLM. Semua yang Anda butuhkan untuk pengalaman agen lokal yang kuat
  it: Smetti di affittare la tua intelligenza. Possiedila con AnythingLLM. Tutto ciò che serve per un'esperienza agente locale potente
  ja: 知能を借りるのをやめよう。AnythingLLM で自分のものにする。ローカルファーストのエージェント体験に必要なものはすべて
  ko: 지능을 빌리지 마세요. AnythingLLM으로 직접 소유하세요. 강력한 로컬 우선 에이전트 경험에 필요한 모든 것
  pl: Przestań wynajmować swoją inteligencję. Posiadaj ją dzięki AnythingLLM. Wszystko, czego potrzebujesz do potężnego doświadczenia z lokalnym agentem
  pt: Pare de alugar sua inteligência. Possua-a com o AnythingLLM. Tudo o que você precisa para uma experiência de agente local poderosa
  ro: Nu mai închiria inteligența ta. Deține-o cu AnythingLLM. Tot ce ai nevoie pentru o experiență puternică cu un agent local
  ru: Перестаньте арендовать свой интеллект. Овладейте им с AnythingLLM. Всё необходимое для мощного локального агента
  th: เลิกเช่าความฉลาดของคุณ มีความเป็นเจ้าของด้วย AnythingLLM ทุกสิ่งที่คุณต้องการเพื่อประสบการใช้งานเอเจนต์แบบ local-first ที่ทรงพลัง
  tr: Zekânızı kiralamayı bırakın. AnythingLLM ile size ait olsun. Güçlü, yerel öncelikli bir ajan deneyimi için gereken her şey
  uk: Перестаньте орендовувати свій інтелект. Оволодійте ним з AnythingLLM. Усе необхідне для потужного локального агента
  vi: Ngừng thuê trí tuệ của bạn. Hãy sở hữu nó với AnythingLLM. Mọi thứ bạn cần cho trải nghiệm agent cục bộ mạnh mẽ
x:
  source: https://github.com/Mintplex-Labs/anything-llm
  eget: Mintplex-Labs/anything-llm
rule:
  /eget:
    cmd: x eget Mintplex-Labs/anything-llm
    reference: https://github.com/Mintplex-Labs/anything-llm
binlist:
- anything-llm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 522 MB
          rating: 4
          desc:
            cn: 安装 522 MB
            en: 522 MB install
        download:
          estimate: 522 MB
          desc:
            cn: 约 522 MB 下载 (dmg)
            en: ~522 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: full
