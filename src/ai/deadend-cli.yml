lang: Python
homepage: https://github.com/straylabs-ai/deadend-cli
license: agpl-3.0
desc:
  cn: 智能体化渗透测试工具，完全自托管，支持 LiteLLM 上的各类模型
  en: Agentic pentest tooling. Currently achieving 81% (KIMI K2.5) on XBOW's benchmark in full black-box. Completely Self-hosted. Every model available on LiteLLM (Ollama, anthropic, openai...)
x:
  source: https://github.com/straylabs-ai/deadend-cli
  eget: https://github.com/straylabs-ai/deadend-cli
rule:
  /eget:
    cmd: x eget straylabs-ai/deadend-cli
    reference: https://github.com/straylabs-ai/deadend-cli
binlist:
- deadend-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
