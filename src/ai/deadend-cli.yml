lang: Python
homepage: https://github.com/straylabs-ai/deadend-cli
license: agpl-3.0
desc:
  cn: 智能体化渗透测试工具，完全自托管，支持 LiteLLM 上的各类模型
  en: Agentic pentest tooling. Currently achieving 81% (KIMI K2.5) on XBOW's benchmark in full black-box. Completely Self-hosted. Every model available on LiteLLM (Ollama, anthropic, openai...)
x:
  source: https://github.com/straylabs-ai/deadend-cli
  eget: straylabs-ai/deadend-cli
rule:
  /eget:
    cmd: x eget straylabs-ai/deadend-cli
    reference: https://github.com/straylabs-ai/deadend-cli
binlist:
- deadend-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 39 MB
          rating: 2
          desc:
            cn: 安装 39 MB
            en: 39 MB install
        download:
          estimate: 39 MB
          desc:
            cn: 约 39 MB 下载 (linux/x64)
            en: ~39 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
