lang: Go
homepage: https://github.com/kenn-io/agentsview
license: MIT
desc:
  cn: 浏览、搜索并追踪各类 AI 编程 Agent 的会话与成本，所有数据保存在本地
  en: Browse, search, and track sessions and costs across all your AI coding agents, locally.
  cs: Prohlížejte, vyhledávejte a sledujte relace a náklady všech svých AI programovacích agentů místně.
  de: Sitzungen und Kosten aller KI-Coding-Agenten lokal durchsuchen, suchen und verfolgen.
  es: Explora, busca y rastrea sesiones y costes de todos tus agentes de programación con IA, de forma local.
  fr: Parcourez, recherchez et suivez localement les sessions et les coûts de tous vos agents de programmation IA.
  id: Jelajahi, cari, dan lacak sesi serta biaya di seluruh agen pemrograman AI Anda secara lokal.
  it: Sfoglia, cerca e traccia localmente sessioni e costi di tutti i tuoi agenti di programmazione IA.
  ja: すべてのAIコーディングエージェントのセッションとコストをローカルで閲覧・検索・追跡できます。
  ko: 모든 AI 코딩 에이전트의 세션과 비용을 로컬에서 탐색, 검색, 추적하세요.
  pl: Przeglądaj, wyszukuj i śledź lokalnie sesje oraz koszty wszystkich twoich agentów programowania AI.
  pt: Explore, pesquise e acompanhe sessões e custos de todos os seus agentes de programação com IA, localmente.
  ro: Răsfoiește, caută și urmărește local sesiunile și costurile tuturor agenților tăi de programare AI.
  ru: Просматривайте, ищите и отслеживайте локально сессии и расходы всех ваших ИИ-ассистентов программирования.
  th: เรียกดู ค้นหา และติดตามเซสชันและค่าใช้จ่ายของเอเจนต์เขียนโค้ด AI ทั้งหมดของคุณ ในเครื่อง
  tr: Tüm yapay zekâ kodlama ajanlarınızın oturumlarını ve maliyetlerini yerel olarak görüntüleyin, arayın ve izleyin.
  uk: Переглядайте, шукайте та відстежуйте локально сесії та витрати всіх ваших ІІ-асистентів програмування.
  vi: Duyệt, tìm kiếm và theo dõi cục bộ các phiên và chi phí của mọi trợ lý lập trình AI của bạn.
x:
  source: https://github.com/kenn-io/agentsview
  eget: kenn-io/agentsview
rule:
  /eget:
    cmd: x eget use kenn-io/agentsview
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://agentsview.io/install.sh | bash
    reference: https://github.com/kenn-io/agentsview?tab=readme-ov-file#install
  darwin/brew:
    cmd: brew install --cask agentsview
    reference: https://github.com/kenn-io/agentsview?tab=readme-ov-file#install
binlist:
- agentsview

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取本地代理历史记录
          en: Reads local agent session histories
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 76 MB
          rating: 3
          desc:
            cn: 约 76 MB（估算）
            en: ~76 MB estimated
        download:
          estimate: 44 MB
          desc:
            cn: 约 44 MB 下载 (linux/x64)
            en: ~44 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
