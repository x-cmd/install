lang: Python
homepage: https://github.com/binary-husky/gpt_academic
license: gpl-3.0
desc:
  cn: 为 GPT/GLM 等 LLM 提供实用交互接口，优化论文阅读、润色与写作，模块化设计并支持多模型并行问询
  en: 为GPT/GLM等LLM大语言模型提供实用化交互接口，特别优化论文阅读/润色/写作体验，模块化设计，支持自定义快捷按钮&函数插件，支持Python和C++等项目剖析&自译解功能，PDF/LaTex论文翻译&总结功能，支持并行问询多种LLM模型，支持chatglm3等本地模型。接入通义千问, deepseekcoder, 讯飞星火, 文心一言, llama2, rwkv, claude2, m...
  cs: Poskytuje praktické interakční rozhraní pro velké jazykové modely jako GPT/GLM, optimalizuje zejména čtení, úpravu a psaní odborných článků, má modulární návrh, podporuje vlastní tlačítka a funkční pluginy, analýzu projektů i vlastní překlad v Pythonu a C++, překlad a shrnutí PDF/LaTex článků, paralelní dotazování více modelů LLM i lokální modely jako chatglm3, a propojuje se s Tongyi Qianwen, deepseekcoder, iFlytek Spark, Wenxin Yiyan, llama2, rwkv, claude2 a dalšími.
  de: Bietet praktische Interaktionsschnittstellen für große Sprachmodelle wie GPT/GLM, optimiert insbesondere das Lesen, Überarbeiten und Schreiben von Fachpapieren, ist modular aufgebaut, unterstützt eigene Shortcut-Buttons und Funktions-Plugins, Projektanalyse und Selbstübersetzung in Python und C++, die Übersetzung und Zusammenfassung von PDF-/LaTeX-Papern, parallele Abfragen mehrerer LLM-Modelle sowie lokale Modelle wie chatglm3, und bindet Tongyi Qianwen, deepseekcoder, iFlytek Spark, Wenxin Yiyan, llama2, rwkv, claude2 und weitere ein.
  es: Ofrece interfaces prácticas de interacción para grandes modelos de lenguaje como GPT/GLM, optimiza especialmente la lectura, revisión y redacción de artículos académicos, tiene un diseño modular, admite botones de acceso rápido y complementos de función personalizados, análisis de proyectos y autotraducción en Python y C++, traducción y resumen de artículos en PDF/LaTeX, consultas en paralelo a varios modelos de LLM y modelos locales como chatglm3, y se conecta con Tongyi Qianwen, deepseekcoder, iFlytek Spark, Wenxin Yiyan, llama2, rwkv, claude2 y más.
  fr: Fournit des interfaces d'interaction pratiques pour les grands modèles de langage comme GPT/GLM, optimise en particulier la lecture, la relecture et la rédaction d'articles scientifiques, adopte une conception modulaire, prend en charge des boutons de raccourci et des plugins de fonction personnalisés, l'analyse de projets et l'autotraduction en Python et C++, la traduction et le résumé d'articles PDF/LaTeX, les requêtes parallèles à plusieurs modèles de LLM ainsi que des modèles locaux comme chatglm3, et se connecte à Tongyi Qianwen, deepseekcoder, iFlytek Spark, Wenxin Yiyan, llama2, rwkv, claude2 et plus encore.
  id: Menyediakan antarmuka interaksi praktis untuk model bahasa besar seperti GPT/GLM, khusus untuk pengalaman membaca, menyunting, dan menulis makalah ilmiah, dirancang secara modular, mendukung tombol pintasan dan plugin fungsi kustom, analisis proyek dan penerjemahan mandiri di Python dan C++, penerjemahan dan ringkasan makalah PDF/LaTeX, tanya jawab paralel ke berbagai model LLM, serta model lokal seperti chatglm3, dan terhubung ke Tongyi Qianwen, deepseekcoder, iFlytek Spark, Wenxin Yiyan, llama2, rwkv, claude2, dan lainnya.
  it: Fornisce interfacce di interazione pratiche per grandi modelli linguistici come GPT/GLM, ottimizzando in particolare la lettura, la revisione e la scrittura di articoli scientifici, con un design modulare, supporta pulsanti di scelta rapida e plugin di funzione personalizzati, analisi dei progetti e autotraduzione in Python e C++, traduzione e riepilogo di articoli PDF/LaTeX, interrogazioni parallele a più modelli LLM e modelli locali come chatglm3, e si connette a Tongyi Qianwen, deepseekcoder, iFlytek Spark, Wenxin Yiyan, llama2, rwkv, claude2 e altro.
  ja: GPT/GLM などの大規模言語モデルに実用的な対話インターフェースを提供し、論文の閲覧・推敲・執筆を特に最適化します。モジュール設計で、独自のショートカットボタンや関数プラグイン、Python と C++ でのプロジェクト解析・自己翻訳、PDF/LaTeX 論文の翻訳と要約、複数 LLM モデルへの並列問い合わせ、chatglm3 などのローカルモデルに対応し、通义千问, deepseekcoder, 讯飞星火, 文心一言, llama2, rwkv, claude2 とも連携します。
  ko: GPT/GLM 같은 대규모 언어 모델을 위한 실용적인 대화 인터페이스를 제공하며, 논문 읽기, 다듬기, 쓰기 경험을 특히 최적화합니다. 모듈형 설계로 사용자 정의 단축 버튼과 함수 플러그인, Python 및 C++ 프로젝트 분석과 자동 번역, PDF/LaTeX 논문 번역 및 요약, 여러 LLM 모델 병렬 질의, chatglm3 같은 로컬 모델 지원, 그리고 Tongyi Qianwen, deepseekcoder, iFlytek Spark, Wenxin Yiyan, llama2, rwkv, claude2 연동을 제공합니다.
  pl: Zapewnia praktyczne interfejsy interakcji dla dużych modeli językowych, takich jak GPT/GLM, szczególnie optymalizując czytanie, redagowanie i pisanie prac naukowych, ma konstrukcję modułową, obsługuje własne przyciski skrótów i wtyczki funkcji, analizę projektów oraz autotłumaczenie w Pythonie i C++, tłumaczenie i streszczanie prac PDF/LaTeX, równoległe zapytania do wielu modeli LLM oraz modele lokalne takie jak chatglm3, i łączy się z Tongyi Qianwen, deepseekcoder, iFlytek Spark, Wenxin Yiyan, llama2, rwkv, claude2 i innymi.
  pt: Fornece interfaces práticas de interação para grandes modelos de linguagem como GPT/GLM, otimizando especialmente a leitura, revisão e escrita de artigos acadêmicos, tem design modular, suporta botões de atalho e plugins de função personalizados, análise de projetos e autotradução em Python e C++, tradução e resumo de artigos em PDF/LaTeX, consultas paralelas a vários modelos de LLM e modelos locais como chatglm3, e conecta-se a Tongyi Qianwen, deepseekcoder, Xunfei Xinghuo, Wenxin Yiyan, llama2, rwkv, claude2 e mais.
  ro: Oferă interfețe practice de interacțiune pentru modelele de limbaj mari precum GPT/GLM, optimizând în special citirea, editarea și scrierea articolelor științifice, are un design modular, acceptă butoane de scurtătură și pluginuri de funcție personalizate, analiză de proiecte și autotraducere în Python și C++, traducerea și rezumarea articolelor PDF/LaTeX, interogări paralele la mai multe modele LLM și modele locale precum chatglm3, și se conectează la Tongyi Qianwen, deepseekcoder, Xunfei Xinghuo, Wenxin Yiyan, llama2, rwkv, claude2 și altele.
  ru: Предоставляет практичные интерфейсы взаимодействия для больших языковых моделей, таких как GPT/GLM, особенно оптимизирует чтение, редактирование и написание научных статей, имеет модульную конструкцию, поддерживает пользовательские кнопки быстрого доступа и функциональные плагины, анализ проектов и самостоятельный перевод на Python и C++, перевод и краткое изложение статей в PDF/LaTeX, параллельные запросы к нескольким моделям LLM и локальные модели вроде chatglm3, а также подключается к Tongyi Qianwen, deepseekcoder, Xunfei Xinghuo, Wenxin Yiyan, llama2, rwkv, claude2 и другим.
  th: ให้อินเทอร์เฟซโต้ตอบที่ใช้งานได้จริงสำหรับโมเดลภาษาขนาดใหญ่อย่าง GPT/GLM โดยเฉพาะปรับปรุงประสบการณ์อ่าน เรียบเรียง และเขียนงานวิจัยให้ดียิ่งขึ้น ออกแบบแบบโมดูลาร์ รองรับปุ่มลัดและปลั๊กอินฟังก์ชันที่กำหนดเอง การวิเคราะห์โครงการและแปลตนเองด้วย Python และ C++ การแปลและสรุปบทความ PDF/LaTeX การถามหลายโมเดล LLM พร้อมกัน รองรับโมเดลในเครื่องอย่าง chatglm3 และเชื่อมต่อกับ Tongyi Qianwen, deepseekcoder, Xunfei Xinghuo, Wenxin Yiyan, llama2, rwkv, claude2 และอื่น ๆ
  tr: GPT/GLM gibi büyük dil modelleri için pratik etkileşim arayüzleri sunar; makale okuma, düzenleme ve yazma deneyimini özellikle iyileştirir, modüler tasarıma sahiptir, özel kısayol düğmeleri ve işlev eklentilerini, proje analizini ve Python/C++ ile kendi kendine çeviri yapmayı, PDF/LaTeX makalelerinin çevirisini ve özetini, birden çok LLM modeline paralel sorgu yapmayı ve chatglm3 gibi yerel modelleri destekler, ayrıca Tongyi Qianwen, deepseekcoder, Xunfei Xinghuo, Wenxin Yiyan, llama2, rwkv, claude2 ve diğerleriyle entegre çalışır.
  uk: Надає практичні інтерфейси взаємодії для великих мовних моделей, таких як GPT/GLM, особливо оптимізуючи читання, редагування та написання наукових статей, має модульну конструкцію, підтримує власні кнопки швидкого доступу та функціональні плагіни, аналіз проєктів і самостійний переклад на Python та C++, переклад і коротке виклад статей у PDF/LaTeX, паралельні запити до кількох моделей LLM та локальні моделі, як-от chatglm3, а також підключається до Tongyi Qianwen, deepseekcoder, Xunfei Xinghuo, Wenxin Yiyan, llama2, rwkv, claude2 та інших.
  vi: Cung cấp giao diện tương tác thực dụng cho các mô hình ngôn ngữ lớn như GPT/GLM, đặc biệt tối ưu trải nghiệm đọc, tinh chỉnh và viết luận văn, được thiết kế theo mô-đun, hỗ trợ nút tắt tùy chỉnh và plugin chức năng, phân tích dự án và tự dịch bằng Python và C++, dịch và tóm tắt luận văn PDF/LaTeX, truy vấn song song nhiều mô hình LLM cùng các mô hình cục bộ như chatglm3, đồng thời kết nối với Tongyi Qianwen, deepseekcoder, Xunfei Xinghuo, Wenxin Yiyan, llama2, rwkv, claude2 và nhiều hơn nữa.
