lang: Python
homepage: https://github.com/binary-husky/gpt_academic
license: gpl-3.0
desc:
  cn: 为 GPT/GLM 等 LLM 提供实用交互接口，优化论文阅读、润色与写作，模块化设计并支持多模型并行问询
  en: 为GPT/GLM等LLM大语言模型提供实用化交互接口，特别优化论文阅读/润色/写作体验，模块化设计，支持自定义快捷按钮&函数插件，支持Python和C++等项目剖析&自译解功能，PDF/LaTex论文翻译&总结功能，支持并行问询多种LLM模型，支持chatglm3等本地模型。接入通义千问, deepseekcoder, 讯飞星火, 文心一言, llama2, rwkv, claude2, m...
x:
  source: https://github.com/binary-husky/gpt_academic
  eget: https://github.com/binary-husky/gpt_academic
rule:
  /eget:
    cmd: x eget binary-husky/gpt_academic
    reference: https://github.com/binary-husky/gpt_academic
binlist:
- gpt_academic

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 157 KB
          rating: 1
          desc:
            cn: 约 157 KB（估算）
            en: ~157 KB estimated
        download:
          estimate: 18 KB
          desc:
            cn: 约 18 KB 下载 (macos/arm64)
            en: ~18 KB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
