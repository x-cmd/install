lang: TypeScript
homepage: https://github.com/cytostack/openwolf
license: agpl-3.0
desc:
  cn: 开源的 Claude Code 中间件，更精炼的上下文，更少的 token
  en: Sharper context. Fewer tokens. Open-source middleware for Claude Code.
x:
  source: https://github.com/cytostack/openwolf
  eget: https://github.com/cytostack/openwolf
rule:
  /eget:
    cmd: x eget cytostack/openwolf
    reference: https://github.com/cytostack/openwolf
binlist:
- openwolf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 35 KB
          rating: 1
          desc:
            cn: 约 35 KB（估算）
            en: ~35 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
