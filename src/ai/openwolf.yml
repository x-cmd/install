lang: TypeScript
homepage: https://github.com/cytostack/openwolf
license: agpl-3.0
desc:
  cn: 开源的 Claude Code 中间件，更精炼的上下文，更少的 token
  en: Sharper context. Fewer tokens. Open-source middleware for Claude Code.
x:
  source: https://github.com/cytostack/openwolf
  eget: https://github.com/cytostack/openwolf
rule:
  /eget:
    cmd: x eget cytostack/openwolf
    reference: https://github.com/cytostack/openwolf
binlist:
- openwolf

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
