lang: Go
homepage: https://github.com/appleboy/CodeGPT
license: mit
desc:
  cn: Go 编写的 CLI，借助 ChatGPT（gpt-4.1、gpt-4o）生成 git 提交信息或代码评审摘要，并自动安装 prepare-commit-msg 钩子
  en: A CLI written in Go language that writes git commit messages or do a code review brief for you using ChatGPT AI (gpt-4.1, gpt-4o model) and automatically installs a git prepare-commit-msg hook.
x:
  source: https://github.com/appleboy/CodeGPT
  eget: https://github.com/appleboy/CodeGPT
rule:
  /eget:
    cmd: x eget appleboy/CodeGPT
    reference: https://github.com/appleboy/CodeGPT
binlist:
- CodeGPT

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
