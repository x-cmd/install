lang: Python
homepage: https://github.com/HKUDS/nanobot
license: mit
desc:
  cn: 面向工具、聊天和工作流的轻量开源 AI Agent
  en: Lightweight, open-source AI agent for your tools, chats, and workflows.
  cs: Lehký open-source AI agent pro vaše nástroje, chaty a pracovní postupy.
  de: Leichter, quelloffener KI-Agent für Ihre Tools, Chats und Workflows.
  es: Agente de IA ligero y de código abierto para tus herramientas, chats y flujos de trabajo.
  fr: Agent IA léger et open source pour vos outils, vos chats et vos workflows.
  id: Agen AI ringan dan open-source untuk alat, obrolan, dan workflow Anda.
  it: Agente IA leggero e open source per i tuoi strumenti, chat e flussi di lavoro.
  ja: ツール、チャット、ワークフローのための軽量オープンソースAIエージェント。
  ko: 도구, 대화, 워크플로를 위한 가벼운 오픈소스 AI 에이전트.
  pl: Lekki, otwartoźródłowy agent AI dla Twoich narzędzi, czatów i przepływów pracy.
  pt: Agente de IA leve e de código aberto para suas ferramentas, conversas e fluxos de trabalho.
  ro: Agent AI ușor, open source, pentru instrumentele, discuțiile și fluxurile tale de lucru.
  ru: Лёгкий open-source ИИ-агент для ваших инструментов, чатов и рабочих процессов.
  th: เอเจนต์ AI แบบเบาและโอเพนซอร์สสำหรับเครื่องมือ แชท และเวิร์กโฟลว์ของคุณ
  tr: Araçlarınız, sohbetleriniz ve iş akışlarınız için hafif, açık kaynaklı yapay zeka ajanı.
  uk: Легкий open-source ШІ-агент для ваших інструментів, чатів і робочих процесів.
  vi: Agent AI nhẹ, mã nguồn mở cho công cụ, cuộc trò chuyện và workflow của bạn.
x:
  source: https://github.com/HKUDS/nanobot
  eget: HKUDS/nanobot
rule:
  /eget:
    cmd: x eget HKUDS/nanobot
    reference: https://github.com/HKUDS/nanobot
binlist:
- nanobot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 680 KB
          rating: 1
          desc:
            cn: 约 680 KB（估算）
            en: ~680 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
