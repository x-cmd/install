lang: Python
homepage: https://github.com/HKUDS/nanobot
license: mit
desc:
  cn: 面向工具、聊天和工作流的轻量开源 AI Agent
  en: Lightweight, open-source AI agent for your tools, chats, and workflows.
x:
  source: https://github.com/HKUDS/nanobot
  eget: HKUDS/nanobot
rule:
  /eget:
    cmd: x eget HKUDS/nanobot
    reference: https://github.com/HKUDS/nanobot
binlist:
- nanobot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 680 KB
          rating: 1
          desc:
            cn: 约 680 KB（估算）
            en: ~680 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
