lang: Python
homepage: https://github.com/microsoft/graphrag
license: mit
desc:
  cn: 基于图的模块化检索增强生成（RAG）系统
  en: A modular graph-based Retrieval-Augmented Generation (RAG) system
x:
  source: https://github.com/microsoft/graphrag
rule:
  /pip:
    cmd: pip install graphrag
    reference: https://pypi.org/project/graphrag/
    dsnap: graphrag
binlist:
- graphrag

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
