lang: Go
homepage: https://github.com/StringKe/std-ai
license: mit
desc:
  cn: 跨 11 款工具同步 AI CLI 配置（rules/skills/commands/references/MCP），涵盖 Claude Code、Codex、Cursor 等
  en: Synchronize AI CLI configuration (rules / skills / commands / references / MCP) across 11 tools — Claude Code, Codex, Cursor, Copilot, Windsurf, Gemini CLI, Aider, Cline, OpenCode, Continue.dev, An...
x:
  source: https://github.com/StringKe/std-ai
  eget: https://github.com/StringKe/std-ai
rule:
  /eget:
    cmd: x eget StringKe/std-ai
    reference: https://github.com/StringKe/std-ai
binlist:
- std-ai

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
