lang: Python
homepage: https://github.com/chatchat-space/Langchain-Chatchat
license: apache-2.0
desc:
  cn: 基于 Langchain 与 ChatGLM、Qwen、Llama 等语言模型的本地知识 RAG 与 Agent 应用（原 Langchain-ChatGLM）
  en: Langchain-Chatchat（原Langchain-ChatGLM）基于 Langchain 与 ChatGLM, Qwen 与 Llama 等语言模型的 RAG 与 Agent 应用 | Langchain-Chatchat (formerly langchain-ChatGLM), local knowledge based LLM (like ChatGLM, Qwen and...
x:
  source: https://github.com/chatchat-space/Langchain-Chatchat
  eget: https://github.com/chatchat-space/Langchain-Chatchat
rule:
  /eget:
    cmd: x eget chatchat-space/Langchain-Chatchat
    reference: https://github.com/chatchat-space/Langchain-Chatchat
binlist:
- Langchain-Chatchat

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
