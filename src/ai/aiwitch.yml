lang: Rust
homepage: https://github.com/baedonguri/aiwitch
license: mit
desc:
  cn: AI CLI（Codex、Claude Code）多账号管理器
  en: Multi-account manager for AI CLIs (Codex, Claude Code)
x:
  source: https://github.com/baedonguri/aiwitch
  eget: https://github.com/baedonguri/aiwitch
rule:
  /eget:
    cmd: x eget baedonguri/aiwitch
    reference: https://github.com/baedonguri/aiwitch
binlist:
- aiwitch

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 204 KB
          rating: 1
          desc:
            cn: 约 204 KB（估算）
            en: ~204 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
