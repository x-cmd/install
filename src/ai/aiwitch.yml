lang: Rust
homepage: https://github.com/baedonguri/aiwitch
license: mit
desc:
  cn: AI CLI（Codex、Claude Code）多账号管理器
  en: Multi-account manager for AI CLIs (Codex, Claude Code)
x:
  source: https://github.com/baedonguri/aiwitch
  eget: https://github.com/baedonguri/aiwitch
rule:
  /eget:
    cmd: x eget baedonguri/aiwitch
    reference: https://github.com/baedonguri/aiwitch
binlist:
- aiwitch

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
