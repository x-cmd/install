lang: TypeScript
homepage: https://github.com/Nutlope/aicommits
license: mit
desc:
  cn: 用 AI 为你生成 git 提交信息的 CLI
  en: A CLI that writes your git commit messages for you with AI
x:
  source: https://github.com/Nutlope/aicommits
rule:
  /npm:
    cmd: npm install -g aicommits
    reference: https://www.npmjs.com/package/aicommits
    dsnap: 'aicommits'
binlist:
- aicommits

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 KB
          rating: 1
          desc:
            cn: 约 8 KB（估算）
            en: ~8 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
