lang: TypeScript
homepage: https://github.com/Nutlope/aicommits
license: mit
desc:
  cn: 用 AI 为你生成 git 提交信息的 CLI
  en: A CLI that writes your git commit messages for you with AI
x:
  source: https://github.com/Nutlope/aicommits
rule:
  /npm:
    cmd: npm install -g aicommits
    reference: https://www.npmjs.com/package/aicommits
    dsnap: 'aicommits'
binlist:
- aicommits

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
