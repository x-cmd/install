lang: Python
homepage: https://github.com/public-clis/twitter-cli
license: apache-2.0
desc:
  cn: 从命令行读写 Twitter/X 时间线、书签、推文与用户资料，无需官方 API Key
  en: Interact with Twitter/X from the command line to read timelines, manage tweets, and export data without an API key.
x:
  source: https://github.com/public-clis/twitter-cli
rule:
  /pip:
    cmd: pip install twitter-cli
    reference: https://pypi.org/project/twitter-cli/
    dsnap: twitter-cli
binlist:
- twitter

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
