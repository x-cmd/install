lang: 'Python'
homepage: https://github.com/alDuncanson/Handler
license: 'GPL-3.0'
desc:
  cn: 终端中的 A2A 协议客户端
  en: 'A2A protocol client for your terminal'
x:
  source: https://github.com/alDuncanson/Handler
  eget: https://github.com/alDuncanson/Handler
rule:
  /eget:
    cmd: x eget alDuncanson/Handler
    reference: https://github.com/alDuncanson/Handler
binlist:
- 'handler'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 37 KB
          rating: 1
          desc:
            cn: 约 37 KB（估算）
            en: ~37 KB estimated
        download:
          estimate: 113 KB
          desc:
            cn: 约 113 KB 下载 (whl)
            en: ~113 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
