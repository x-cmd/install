lang: Rust
homepage: https://github.com/pythops/tenere
license: GPL-3.0
desc:
  en: TUI interface for LLMs written in Rust
  cn: 用 Rust 编写的用于大语言模型（LLMs）的 TUI 界面
x:
  source: https://github.com/pythops/tenere
  eget: https://github.com/pythops/tenere
rule:
  /eget:
    cmd: x eget pythops/tenere
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tenere
    reference: https://github.com/pythops/tenere?tab=readme-ov-file#-installation
  /cargo:
    cmd: cargo install tenere
    reference: https://github.com/pythops/tenere?tab=readme-ov-file#-installation
    dsnap: tenere
  /nix-env:
    cmd: nix-env -iA nixpkgs.tenere
    reference: https://github.com/pythops/tenere?tab=readme-ov-file#-installation
  arch/yay:
    cmd: yay -S tenere-bin
    reference: https://aur.archlinux.org/packages/tenere-bin
binlist:
- tenere

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
