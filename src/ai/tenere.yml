lang: Rust
homepage: https://github.com/pythops/tenere
license: GPL-3.0
desc:
  en: TUI interface for LLMs written in Rust
  cn: 用 Rust 编写的用于大语言模型（LLMs）的 TUI 界面
  cs: TUI rozhraní pro LLM napsané v Rustu
  de: TUI-Oberfläche für LLMs, geschrieben in Rust
  es: Interfaz TUI para LLMs escrita en Rust
  fr: Interface TUI pour les LLM écrite en Rust
  id: Antarmuka TUI untuk LLM yang ditulis dengan Rust
  it: Interfaccia TUI per LLM scritta in Rust
  ja: Rust で書かれた LLM 用の TUI インターフェース
  ko: Rust로 작성된 LLM용 TUI 인터페이스
  pl: Interfejs TUI dla LLM napisany w Rust
  pt: Interface TUI para LLMs escrita em Rust
  ro: Interfață TUI pentru LLM scrisă în Rust
  ru: TUI-интерфейс для больших языковых моделей, написанный на Rust
  th: ส่วนติดต่อ TUI สำหรับ LLM ที่เขียนด้วย Rust
  tr: Rust ile yazılmış LLM'ler için TUI arayüzü
  uk: TUI-інтерфейс для великих мовних моделей, написаний на Rust
  vi: Giao diện TUI cho các LLM được viết bằng Rust
x:
  source: https://github.com/pythops/tenere
  eget: pythops/tenere
  brew: tenere
  yay: tenere-bin
  cargo: tenere
rule:
  /eget:
    cmd: x eget pythops/tenere
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tenere
    reference: https://github.com/pythops/tenere?tab=readme-ov-file#-installation
  /cargo:
    cmd: cargo install tenere
    reference: https://github.com/pythops/tenere?tab=readme-ov-file#-installation
    dsnap: tenere
  /nix-env:
    cmd: nix-env -iA nixpkgs.tenere
    reference: https://github.com/pythops/tenere?tab=readme-ov-file#-installation
  arch/yay:
    cmd: yay -S tenere-bin
    reference: https://aur.archlinux.org/packages/tenere-bin
binlist:
- tenere

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
