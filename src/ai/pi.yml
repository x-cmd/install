lang: TypeScript
homepage: https://github.com/earendil-works/pi
license: mit
desc:
  cn: AI Agent 工具集：统一 LLM API、Agent 循环、TUI 与编码 Agent CLI
  en: 'AI agent toolkit: unified LLM API, agent loop, TUI, coding agent CLI'
x:
  source: https://github.com/earendil-works/pi
  eget: https://github.com/earendil-works/pi
rule:
  /eget:
    cmd: x eget earendil-works/pi
    reference: https://github.com/earendil-works/pi
binlist:
- pi

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
