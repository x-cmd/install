lang: TypeScript
homepage: https://github.com/earendil-works/pi
license: mit
desc:
  cn: AI Agent 工具集：统一 LLM API、Agent 循环、TUI 与编码 Agent CLI
  en: 'AI agent toolkit: unified LLM API, agent loop, TUI, coding agent CLI'
x:
  source: https://github.com/earendil-works/pi
  eget: earendil-works/pi
rule:
  /eget:
    cmd: x eget earendil-works/pi
    reference: https://github.com/earendil-works/pi
binlist:
- pi

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 109 MB
          rating: 3
          desc:
            cn: 安装 109 MB
            en: 109 MB install
        download:
          estimate: 41 MB
          desc:
            cn: 约 41 MB 下载 (linux/x64)
            en: ~41 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 101 MB
        desc:
          cn: 101 MB
          en: 101 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
