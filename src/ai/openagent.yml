lang: TypeScript
homepage: https://github.com/ask-sol/openagent
license: apache-2.0
desc:
  cn: 面向终端的开源 Agent 编码 CLI，多模型供应商、节省 token，支持 Web 搜索和 MCP 服务器
  en: Open-source agentic coding CLI for your terminal. Multi-provider (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), token-efficient, with web search, MCP server support...
x:
  source: https://github.com/ask-sol/openagent
  eget: https://github.com/ask-sol/openagent
rule:
  /eget:
    cmd: x eget ask-sol/openagent
    reference: https://github.com/ask-sol/openagent
binlist:
- openagent

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
