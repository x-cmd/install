lang: TypeScript
homepage: https://github.com/ask-sol/openagent
license: apache-2.0
desc:
  cn: 面向终端的开源 Agent 编码 CLI，多模型供应商、节省 token，支持 Web 搜索和 MCP 服务器
  en: Open-source agentic coding CLI for your terminal. Multi-provider (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), token-efficient, with web search, MCP server support...
x:
  source: https://github.com/ask-sol/openagent
  eget: ask-sol/openagent
rule:
  /eget:
    cmd: x eget ask-sol/openagent
    reference: https://github.com/ask-sol/openagent
binlist:
- openagent

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
