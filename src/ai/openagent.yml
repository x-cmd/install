  es: CLI de codificación agéntica de código abierto para tu terminal. Multi-proveedor (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), eficiente en tokens, con búsqueda web y soporte para servidores MCP...
  fr: CLI de codage agentique open source pour votre terminal. Multi-fournisseur (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), économe en tokens, avec recherche web et prise en charge des serveurs MCP...
  id: CLI pengodean agen open source untuk terminal Anda. Multi-penyedia (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), hemat token, dengan pencarian web dan dukungan server MCP...
  it: CLI di coding agentico open source per il tuo terminale. Multi-provider (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), efficiente nei token, con ricerca web e supporto per i server MCP...
  ja: ターミナル向けのオープンソースエージェント型コーディング CLI。複数プロバイダー（OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter）に対応し、トークン効率が良く、ウェブ検索と MCP サーバーサポートを備えています...
  ko: 터미널을 위한 오픈소스 에이전트형 코딩 CLI. 멀티 제공자 지원(OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), 토큰 효율적, 웹 검색과 MCP 서버 지원...
  pl: Otwarta agentyczna CLI do kodowania dla terminala. Wiele dostawców (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), oszczędna w tokenach, z wyszukiwaniem w sieci i obsługą serwerów MCP...
  pt: CLI de codificação agêntica de código aberto para o seu terminal. Multi-provedor (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), eficiente em tokens, com busca na web e suporte a servidores MCP...
  ro: CLI de codare agentică open source pentru terminalul tău. Mai mulți furnizori (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), eficientă la consum de tokeni, cu căutare web și suport pentru servere MCP...
  ru: Открытая агентная CLI для написания кода в терминале. Несколько провайдеров (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), экономный расход токенов, веб-поиск и поддержка серверов MCP...
  th: CLI เขียนโค้ดแบบเอเจนต์แบบโอเพนซอร์สสำหรับเทอร์มินัลของคุณ รองรับผู้ให้บริการหลายราย (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter) ประหยัดโทเคน พร้อมค้นหาเว็บและรองรับเซิร์ฟเวอร์ MCP...
  tr: Terminaliniz için açık kaynak ajan tabanlı kodlama CLI'si. Çoklu sağlayıcı desteği (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), jeton verimli, web araması ve MCP sunucu desteği...
  uk: Відкритий агентний CLI для написання коду в терміналі. Підтримка кількох провайдерів (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), економія токенів, веб-пошук і підтримка серверів MCP...
  vi: CLI mã hóa dạng agent mã nguồn mở cho terminal của bạn. Hỗ trợ nhiều nhà cung cấp (OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, xAI, Ollama, OpenRouter), tiết kiệm token, có tìm kiếm web và hỗ trợ máy chủ MCP...
x:
  source: https://github.com/ask-sol/openagent
  eget: ask-sol/openagent
rule:
  /eget:
    cmd: x eget ask-sol/openagent
    reference: https://github.com/ask-sol/openagent
binlist:
- openagent

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
