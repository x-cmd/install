lang: C
homepage: https://github.com/ggerganov/whisper.cpp
license: MIT
desc:
  cn: OpenAI 的 Whisper 模型在 C/C++ 中的移植
  en: Port of OpenAI's Whisper model in C/C++
x:
  source: https://github.com/ggerganov/whisper.cpp
  brew: whisper-cpp
  scoop: main/whisper-cpp
  yay: whisper.cpp-vulkan
rule:
  /x:
    cmd: x pkg use whispercpp
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install whisper-cpp
    reference: https://formulae.brew.sh/formula/whisper-cpp#default
  (win|wsl2)/scoop:
    cmd: x scoop install main/whisper-cpp
    reference: https://scoop.sh/#/apps?q=whisper
  arch/yay:
    cmd: yay -S whisper.cpp-vulkan
    reference: https://aur.archlinux.org/packages/whisper.cpp-vulkan
binlist:
- whispercpp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
