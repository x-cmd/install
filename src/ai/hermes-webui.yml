lang: Python
homepage: https://github.com/nesquena/hermes-webui
license: mit
desc:
  cn: 提供自托管 Web 界面与持久自我进化的 Hermes AI 智能体交互，支持持续学习与任务自动化
  en: Provides a self-hosted web interface to interact with and manage the persistent, self-improving Hermes AI agent, enabling continuous learning and task automation.
x:
  source: https://github.com/nesquena/hermes-webui
  eget: https://github.com/nesquena/hermes-webui
rule:
  /eget:
    cmd: x eget nesquena/hermes-webui
    reference: https://github.com/nesquena/hermes-webui
binlist:
- hermes-webui

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
