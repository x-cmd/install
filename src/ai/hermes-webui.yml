lang: Python
homepage: https://github.com/nesquena/hermes-webui
license: mit
desc:
  cn: 提供自托管 Web 界面与持久自我进化的 Hermes AI 智能体交互，支持持续学习与任务自动化
  en: Provides a self-hosted web interface to interact with and manage the persistent, self-improving Hermes AI agent, enabling continuous learning and task automation.
x:
  source: https://github.com/nesquena/hermes-webui
  eget: https://github.com/nesquena/hermes-webui
rule:
  /eget:
    cmd: x eget nesquena/hermes-webui
    reference: https://github.com/nesquena/hermes-webui
binlist:
- hermes-webui

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
