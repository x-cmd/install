lang: Python
homepage: https://github.com/Thysrael/Horizon
license: mit
desc:
  cn: 自托管的 AI 新闻雷达：从 Hacker News / Reddit / RSS / Telegram / GitHub 等多源聚合、抓取、评分、去重、生成每日简报（中英双语），并支持 Pages 发布、邮件订阅、Feishu/Slack/Webhook 推送与 MCP 集成。
  en: "Self-hosted AI news radar: aggregate, fetch, score, deduplicate, and summarize Hacker News, Reddit, RSS, Telegram, GitHub, and more into a daily bilingual briefing — with Pages publishing, email subscription, Feishu/Slack/Webhook push, and MCP integration."
  cs: "Samohostovaný AI radar zpráv: agreguje, sbírá, hodnotí, deduplikuje a shrnuje Hacker News, Reddit, RSS, Telegram, GitHub a další do denního dvojjazyčného briefingu — s publikací na Pages, e-mailovým odběrem, push přes Feishu/Slack/Webhook a integrací MCP."
  de: "Selbst gehosteter KI-Nachrichtenradar: Aggregiert, ruft ab, bewertet, dedupliziert und fasst Hacker News, Reddit, RSS, Telegram, GitHub und mehr zu einem täglichen zweisprachigen Briefing zusammen — mit Pages-Veröffentlichung, E-Mail-Abonnement, Feishu/Slack/Webhook-Push und MCP-Integration."
  es: "Radar de noticias con IA autoalojado: agrega, recopila, puntúa, deduplica y resume Hacker News, Reddit, RSS, Telegram, GitHub y más en un informe bilingüe diario, con publicación en Pages, suscripción por correo, push por Feishu/Slack/Webhook e integración con MCP."
  fr: "Radar d'actualités IA auto-hébergé : agrège, récupère, note, déduplique et résume Hacker News, Reddit, RSS, Telegram, GitHub et plus encore en un briefing bilingue quotidien, avec publication Pages, abonnement par e-mail, push Feishu/Slack/Webhook et intégration MCP."
  id: "Radar berita AI yang di-hosting sendiri: agregat, ambil, beri nilai, deduplikasi, dan rangkum Hacker News, Reddit, RSS, Telegram, GitHub, dan lainnya menjadi ringkasan dwibahasa harian, dengan penerbitan Pages, langganan email, push Feishu/Slack/Webhook, dan integrasi MCP."
  it: "Radar di notizie IA self-hosted: aggrega, raccoglie, valuta, deduplica e riassume Hacker News, Reddit, RSS, Telegram, GitHub e altro in un briefing bilingue giornaliero, con pubblicazione su Pages, iscrizione via e-mail, push Feishu/Slack/Webhook e integrazione MCP."
  ja: セルフホスト型の AI ニュースレーダー。Hacker News、Reddit、RSS、Telegram、GitHub などを集約・取得・採点・重複排除・要約し、日英二言語のブリーフィングを生成します。Pages での公開、メール購読、Feishu/Slack/Webhook プッシュ、MCP 統合にも対応します。
  ko: 자체 호스팅 AI 뉴스 레이더로 Hacker News, Reddit, RSS, Telegram, GitHub 등을 수집·가져와·채점·중복 제거·요약해 매일 이중 언어 브리핑을 만들고, Pages 게시, 이메일 구독, Feishu/Slack/Webhook 푸시, MCP 통합을 지원합니다.
  pl: "Samodzielnie hostowany radar wiadomości AI: agreguje, pobiera, ocenia, usuwa duplikaty i streszcza Hacker News, Reddit, RSS, Telegram, GitHub i inne w codzienny dwujęzyczny briefing — z publikacją na Pages, subskrypcją e-mail, powiadomieniami Feishu/Slack/Webhook i integracją MCP."
  pt: "Radar de notícias com IA hospedado localmente: agrega, busca, pontua, remove duplicatas e resume Hacker News, Reddit, RSS, Telegram, GitHub e mais em um briefing bilíngue diário — com publicação no Pages, assinatura por e-mail, push via Feishu/Slack/Webhook e integração com MCP."
  ro: "Radar de știri cu AI găzduit local: agregă, preia, evaluează, elimină duplicatele și rezumă Hacker News, Reddit, RSS, Telegram, GitHub și altele într-un briefing bilingv zilnic, cu publicare pe Pages, abonare prin e-mail, push Feishu/Slack/Webhook și integrare MCP."
  ru: "Самостоятельно размещаемый ИИ-радар новостей: агрегирует, собирает, оценивает, дедуплицирует и суммирует Hacker News, Reddit, RSS, Telegram, GitHub и другие источники в ежедневный двуязычный брифинг — с публикацией через Pages, подпиской по почте, push через Feishu/Slack/Webhook и интеграцией MCP."
  th: "เรดาร์ข่าว AI แบบโฮสต์เอง: รวบรวม ดึง ให้คะแนน ตัดข้อมูลซ้ำ และสรุป Hacker News, Reddit, RSS, Telegram, GitHub และอื่น ๆ เป็นบรีฟภาษาคู่ประจำวัน พร้อมการเผยแพร่บน Pages การสมัครรับอีเมล การดันผ่าน Feishu/Slack/Webhook และการผสานรวม MCP"
  tr: "Kendi barındırdığınız yapay zeka haber radarı: Hacker News, Reddit, RSS, Telegram, GitHub ve diğer kaynakları toplar, getirir, puanlar, tekilleştirir ve günlük iki dilli brifing haline getirir — Pages yayını, e-posta aboneliği, Feishu/Slack/Webhook anlık bildirimi ve MCP entegrasyonuyla birlikte."
  uk: "Самостійно розміщуваний ІІ-радар новин: агрегує, збирає, оцінює, дедуплікує та підсумовує Hacker News, Reddit, RSS, Telegram, GitHub та інші джерела у щоденний двомовний брифінг — із публікацією через Pages, підпискою електронною поштою, push через Feishu/Slack/Webhook та інтеграцією MCP."
  vi: "Radar tin tức AI tự host: tổng hợp, thu thập, chấm điểm, khử trùng lặp và tóm tắt Hacker News, Reddit, RSS, Telegram, GitHub cùng nhiều nguồn khác thành bản tóm tắt song ngữ hằng ngày, kèm đăng bằng Pages, đăng ký qua email, đẩy Feishu/Slack/Webhook và tích hợp MCP."
x:
  source: https://github.com/Thysrael/Horizon
rule:
  /git:
    cmd: x git clone Thysrael/Horizon
    reference: https://github.com/Thysrael/Horizon#quick-start
  /docker:
    cmd: x git clone Thysrael/Horizon && cd Horizon && cp .env.example .env && cp data/config.example.json data/config.json && docker compose run --rm horizon
    reference: https://github.com/Thysrael/Horizon#option-b-docker
binlist:
- horizon
- horizon-wizard

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 37 KB
          rating: 1
          desc:
            cn: 约 37 KB（估算）
            en: ~37 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
