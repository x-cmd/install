lang: Python
homepage: https://github.com/MemPalace/mempalace
license: mit
desc:
  cn: 基准测试领先的开源 AI 记忆系统，完全免费
  en: The best-benchmarked open-source AI memory system. And it's free.
x:
  source: https://github.com/MemPalace/mempalace
  eget: https://github.com/MemPalace/mempalace
rule:
  /eget:
    cmd: x eget MemPalace/mempalace
    reference: https://github.com/MemPalace/mempalace
binlist:
- mempalace

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 343 KB
          rating: 1
          desc:
            cn: 约 343 KB（估算）
            en: ~343 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
