lang: Python
homepage: https://github.com/MemPalace/mempalace
license: mit
desc:
  cn: 基准测试领先的开源 AI 记忆系统，完全免费
  en: The best-benchmarked open-source AI memory system. And it's free.
x:
  source: https://github.com/MemPalace/mempalace
  eget: https://github.com/MemPalace/mempalace
rule:
  /eget:
    cmd: x eget MemPalace/mempalace
    reference: https://github.com/MemPalace/mempalace
binlist:
- mempalace

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
