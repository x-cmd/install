lang: Python
homepage: https://github.com/MemPalace/mempalace
license: mit
desc:
  cn: 基准测试领先的开源 AI 记忆系统，完全免费
  en: The best-benchmarked open-source AI memory system. And it's free.
  cs: Nejlépe benchmarkovaný open source systém paměti AI. A je zdarma.
  de: Das am besten benchmarkierte Open-Source-KI-Gedächtnissystem. Und es ist kostenlos.
  es: El sistema de memoria de IA de código abierto mejor evaluado por benchmarks. Y es gratis.
  fr: Le système de mémoire IA open source le mieux évalué par les benchmarks. Et il est gratuit.
  id: Sistem memori AI open-source dengan hasil benchmark terbaik. Dan gratis.
  it: Il sistema di memoria AI open source con i migliori risultati nei benchmark. Ed è gratuito.
  ja: ベンチマーク評価で最も成績のよいオープンソース AI メモリシステムです。しかも無料です。
  ko: 벤치마크 성능이 가장 우수한 오픈 소스 AI 메모리 시스템입니다. 무엇보다 무료입니다.
  pl: Najlepiej benchmarkowany system pamięci AI o otwartym kodzie. I jest darmowy.
  pt: O sistema de memória de IA de código aberto com melhor desempenho nos benchmarks. E é gratuito.
  ro: Cel mai bine benchmarkat sistem de memorie AI cu sursă deschisă. Și este gratuit.
  ru: Лучшая по результатам бенчмарков система памяти для ИИ с открытым исходным кодом. И она бесплатна.
  th: ระบบหน่วยความจำ AI โอเพนซอร์สที่ผลงานเบนช์มาร์กดีที่สุด และยังใช้ฟรี
  tr: En iyi kıyaslanmış açık kaynaklı AI bellek sistemi. Üstelik ücretsiz.
  uk: Найкраща за результатами бенчмарків система пам'яті для ШІ з відкритим кодом. І вона безкоштовна.
  vi: Hệ thống bộ nhớ AI mã nguồn mở có kết quả benchmark tốt nhất. Và hoàn toàn miễn phí.
x:
  source: https://github.com/MemPalace/mempalace
  eget: MemPalace/mempalace
rule:
  /eget:
    cmd: x eget MemPalace/mempalace
    reference: https://github.com/MemPalace/mempalace
binlist:
- mempalace

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 343 KB
          rating: 1
          desc:
            cn: 约 343 KB（估算）
            en: ~343 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
