lang: Go
homepage: https://github.com/anthropics/anthropic-cli
license: mit
desc:
  cn: Claude API 的 CLI
  en: The CLI for the Claude API
x:
  source: https://github.com/anthropics/anthropic-cli
  eget: https://github.com/anthropics/anthropic-cli
rule:
  /eget:
    cmd: x eget anthropics/anthropic-cli
    reference: https://github.com/anthropics/anthropic-cli
binlist:
- anthropic-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
