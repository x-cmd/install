lang: Go
homepage: https://github.com/anthropics/anthropic-cli
license: mit
desc:
  cn: Claude API 的 CLI
  en: The CLI for the Claude API
x:
  source: https://github.com/anthropics/anthropic-cli
  eget: https://github.com/anthropics/anthropic-cli
rule:
  /eget:
    cmd: x eget anthropics/anthropic-cli
    reference: https://github.com/anthropics/anthropic-cli
binlist:
- anthropic-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
