lang: Python
homepage: https://github.com/microsoft/apm
license: MIT
desc:
  cn: APM（Agent Package Manager）是面向 AI 编码代理的社区驱动依赖管理器，通过一份 apm.yml 清单即可在 Copilot、Claude Code、Cursor、OpenCode、Codex、Gemini、Windsurf、Kiro 等客户端之间声明、同步并治理指令、技能、插件与 MCP 服务器。
  en: APM (Agent Package Manager) is an open-source, community-driven dependency manager for AI coding agents. Declare agentic dependencies once in apm.yml and reproduce a fully configured setup across GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro, and more — with transitive resolution, a lockfile, policy enforcement, and SBOM export.
  cs: APM (Agent Package Manager) je open-source správce závislostí řízený komunitou pro kódovací agenty AI. Deklarujte agentické závislosti jednou v apm.yml a reprodukujte plně nakonfigurované prostředí napříč GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro a dalšími — s přechodným řešením, lockfile, vynucováním zásad a exportem SBOM.
  de: APM (Agent Package Manager) ist ein quelloffener, Community-gesteuerter Abhängigkeitsmanager für KI-Coding-Agents. Agentische Abhängigkeiten einmal in apm.yml deklarieren und eine vollständig konfigurierte Einrichtung in GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro und mehr reproduzieren — mit transitiver Auflösung, Lockfile, Richtliniendurchsetzung und SBOM-Export.
  es: APM (Agent Package Manager) es un gestoror de dependencias de código abierto basado en la comunidad para agentes de programación con IA. Declara las dependencias agénticas una vez en apm.yml y reproduce una configuración completa en GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro y más, con resolución transitiva, lockfile, aplicación de políticas y exportación de SBOM.
  fr: APM (Agent Package Manager) est un gestionnaire de dépendances open source piloté par la communauté pour les agents de codage IA. Déclarez les dépendances agentiques une fois dans apm.yml et reproduisez une configuration complète sur GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro et plus — avec résolution transitive, lockfile, application des politiques et export SBOM.
  id: APM (Agent Package Manager) adalah pengelola dependensi open source berbasis komunitas untuk agen pengodean AI. Deklarasikan dependensi agen sekali di apm.yml dan tirukan setup yang terkonfigurasi penuh di GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro, dan lainnya — dengan resolusi transitif, lockfile, penerapan kebijakan, dan ekspor SBOM.
  it: APM (Agent Package Manager) è un gestore di dipendenze open source guidato dalla comunità per gli agenti di codifica IA. Dichiara una sola volta le dipendenze agentiche in apm.yml e riproduci un ambiente completamente configurato su GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro e altro — con risoluzione transitiva, lockfile, applicazione delle policy ed esportazione SBOM.
  ja: APM (Agent Package Manager) は、AI コーディングエージェント向けのオープンソースでコミュニティ主導の依存関係マネージャーです。エージェント依存関係は apm.yml に一度宣言するだけで、GitHub Copilot、Claude Code、Cursor、OpenCode、Codex、Gemini、Windsurf、Kiro などで完全に設定済みの環境を実現できます。推移的解決、lockfile、ポリシー強制、SBOM エクスポートに対応しています。
  ko: APM (Agent Package Manager)는 AI 코딩 에이전트를 위한 오픈소스 커뮤니티 주도 의존성 관리자입니다. 에이전트 의존성을 apm.yml에 한 번 선언하고 GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro 등에서 완전히 구성된 환경을 재현하세요. 전이적 해석, lockfile, 정책 강제, SBOM 내보내기를 지원합니다.
  pl: APM (Agent Package Manager) to otwartoźródłowy, napędzany przez społeczność menedżer zależności dla agentów kodujących AI. Zadeklaruj zależności agentowe raz w apm.yml i odtwórz w pełni skonfigurowane środowisko w GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro i nie tylko — z rozwiązywaniem przechodnim, plikiem blokad, egzekwowaniem polityk i eksportem SBOM.
  pt: O APM (Agent Package Manager) é um gerenciador de dependências de código aberto, mantido pela comunidade, para agentes de codificação com IA. Declare as dependências agênticas uma vez no apm.yml e reproduza um ambiente totalmente configurado no GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro e mais — com resolução transitiva, lockfile, imposição de políticas e exportação de SBOM.
  ro: APM (Agent Package Manager) este un manager de dependențe open source, condus de comunitate, pentru agenți de codare AI. Declarați o singură dată dependențele agențice în apm.yml și reproduceți o configurare completă în GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro și altele — cu rezolvare tranzitivă, lockfile, aplicarea politicilor și export SBOM.
  ru: APM (Agent Package Manager) — открытый, развиваемый сообществом менеджер зависимостей для ИИ-агентов написания кода. Объявите агентские зависимости один раз в apm.yml и воспроизведите полностью настроенное окружение в GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro и других — с транзитивным разрешением, lock-файлом, применением политик и экспортом SBOM.
  th: APM (Agent Package Manager) คือตัวจัดการการขึ้นต่อกันแบบโอเพนซอร์สที่ขับเคลื่อนโดยชุมชนสำหรับเอเจนต์เขียนโค้ดด้วย AI ประกาศการขึ้นต่อกันแบบเอเจนต์ไว้ครั้งเดียวใน apm.yml แล้วทำซ้ำชุดการตั้งค่าที่พร้อมใช้งานได้อย่างสมบูรณ์บน GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro และอื่น ๆ — พร้อมการแก้ปัญหาแบบทรานซิทีฟ, lockfile, การบังคับใช้นโยบาย และการส่งออก SBOM
  tr: APM (Agent Package Manager), AI kodlama ajanları için açık kaynak ve topluluk destekli bir bağımlılık yöneticisidir. Ajanik bağımlılıkları apm.yml içinde bir kez tanımlayın ve GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro ve daha fazlasında tam yapılandırılmış bir kurulumu yeniden üretin — geçişli çözümleme, lockfile, politika uygulama ve SBOM dışa aktarma ile birlikte.
  uk: APM (Agent Package Manager) — це відкритий, керований спільнотою менеджер залежностей для ІІ-агентів написання коду. Оголосіть агентські залежності один раз в apm.yml і відтворіть повністю налаштоване оточення в GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro та інших — із транзитивним розв'язанням, lock-файлом, застосуванням політик та експортом SBOM.
  vi: APM (Agent Package Manager) là trình quản lý phụ thuộc mã nguồn mở, do cộng đồng dẫn dắt, dành cho các agent lập trình AI. Khai báo phụ thuộc agent một lần trong apm.yml và tái tạo thiết lập hoàn chỉnh trên GitHub Copilot, Claude Code, Cursor, OpenCode, Codex, Gemini, Windsurf, Kiro và nhiều hơn — với phân giải bắc cầu, lockfile, thực thi chính sách và xuất SBOM.
x:
  source: https://github.com/microsoft/apm
  brew: microsoft/apm/apm
  pip: apm-cli
rule:
  /curl:
    cmd: curl -sSL https://aka.ms/apm-unix | sh
    reference: https://github.com/microsoft/apm#linux--macos
  darwin/brew:
    cmd: brew install microsoft/apm/apm
    reference: https://github.com/microsoft/apm#linux--macos
  /pip:
    cmd: pip install apm-cli
    reference: https://github.com/microsoft/apm#linux--macos
    dsnap: apm-cli
  /pipx:
    cmd: pipx install apm-cli
    reference: https://github.com/microsoft/apm
    dsnap: apm-cli
  win/powershell:
    cmd: x pwsh 'irm https://aka.ms/apm-windows | iex'
    reference: https://github.com/microsoft/apm#windows
binlist:
  - apm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取 AI 代理配置文件与 apm.yml 清单
          en: Reads AI agent config files and apm.yml manifests
        sensitive: []
      write:
        desc:
          cn: 在多个代理配置目录下写入依赖与 MCP 服务器配置
          en: Writes dependencies and MCP server configs into agent config dirs
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 1.5 MB
          rating: 1
          desc:
            cn: 约 1.5 MB（估算）
            en: ~1.5 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
