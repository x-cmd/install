lang: Python
homepage: https://github.com/TheR1D/shell_gpt
license: mit
desc:
  cn: 由 GPT-5 等 AI 大模型驱动的命令行生产力工具，助你更快更高效地完成任务
  en: A command-line productivity tool powered by AI large language models like GPT-5, will help you accomplish your tasks faster and more efficiently.
x:
  source: https://github.com/TheR1D/shell_gpt
  eget: https://github.com/TheR1D/shell_gpt
rule:
  /eget:
    cmd: x eget TheR1D/shell_gpt
    reference: https://github.com/TheR1D/shell_gpt
binlist:
- shell_gpt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 KB
          rating: 1
          desc:
            cn: 安装 30 KB
            en: 30 KB install
        download:
          estimate: 30 KB
          desc:
            cn: 约 30 KB 下载 (whl)
            en: ~30 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
