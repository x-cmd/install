lang: 'Rust'
homepage: https://github.com/gglucass/headroom-desktop
license: 'MIT'
desc:
  cn: 让你的 Claude Code 与 Codex 用量翻倍
  en: 'Unlock 2x more Claude Code and Codex usage'
  cs: Odemkněte dvojnásobnou spotřebu Claude Code a Codex
  de: Entsperren Sie die doppelte Nutzung von Claude Code und Codex
  es: Desbloquea el doble de uso de Claude Code y Codex
  fr: Débloquez deux fois plus d'utilisation de Claude Code et Codex
  id: Buka 2x lebih banyak penggunaan Claude Code dan Codex
  it: Sblocca il doppio dell'utilizzo di Claude Code e Codex
  ja: Claude Code と Codex の利用量を 2 倍に扩容
  ko: Claude Code와 Codex 사용량을 2배로 늘리세요
  pl: Odblokuj dwukrotnie większe zużycie Claude Code i Codex
  pt: Desbloqueie o dobro do uso de Claude Code e Codex
  ro: Deblochează de două ori mai multă utilizare a Claude Code și Codex
  ru: Получите вдвое больше использования Claude Code и Codex
  th: ปลดล็อกการใช้งาน Claude Code และ Codex ได้มากขึ้น 2 เท่า
  tr: Claude Code ve Codex kullanımının 2 katını açın
  uk: Отримайте вдвічі більше використання Claude Code і Codex
  vi: Mở khóa gấp đôi mức sử dụng Claude Code và Codex
x:
  source: https://github.com/gglucass/headroom-desktop
  eget: gglucass/headroom-desktop
rule:
  /eget:
    cmd: x eget gglucass/headroom-desktop
    reference: https://github.com/gglucass/headroom-desktop
binlist:
- 'headroom-desktop'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 19 MB
          rating: 2
          desc:
            cn: 安装 19 MB
            en: 19 MB install
        download:
          estimate: 19 MB
          desc:
            cn: 约 19 MB 下载 (dmg)
            en: ~19 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
