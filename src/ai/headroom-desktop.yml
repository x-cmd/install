lang: 'Rust'
homepage: https://github.com/gglucass/headroom-desktop
license: 'MIT'
desc:
  cn: 让你的 Claude Code 与 Codex 用量翻倍
  en: 'Unlock 2x more Claude Code and Codex usage'
x:
  source: https://github.com/gglucass/headroom-desktop
  eget: https://github.com/gglucass/headroom-desktop
rule:
  /eget:
    cmd: x eget gglucass/headroom-desktop
    reference: https://github.com/gglucass/headroom-desktop
binlist:
  - 'headroom-desktop'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
