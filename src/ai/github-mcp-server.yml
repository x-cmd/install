lang: Go
homepage: https://github.com/github/github-mcp-server
license: mit
desc:
  cn: GitHub 官方 MCP 服务器
  en: GitHub's official MCP Server
  cs: Oficiální MCP server GitHubu
  de: Offizieller MCP-Server von GitHub
  es: Servidor MCP oficial de GitHub
  fr: Serveur MCP officiel de GitHub
  id: Server MCP resmi GitHub
  it: Server MCP ufficiale di GitHub
  ja: GitHub 公式 MCP サーバー
  ko: GitHub 공식 MCP 서버
  pl: Oficjalny serwer MCP GitHuba
  pt: Servidor MCP oficial do GitHub
  ro: Serverul MCP oficial al GitHub
  ru: Официальный MCP-сервер GitHub
  th: เซิร์ฟเวอร์ MCP อย่างเป็นทางการของ GitHub
  tr: GitHub'ın resmi MCP sunucusu
  uk: Офіційний MCP-сервер GitHub
  vi: Máy chủ MCP chính thức của GitHub
x:
  source: https://github.com/github/github-mcp-server
  eget: github/github-mcp-server
rule:
  /eget:
    cmd: x eget github/github-mcp-server
    reference: https://github.com/github/github-mcp-server
binlist:
- github-mcp-server
# already profiled
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # GitHub API
    filesystem:
      read:
        desc:
          cn: 读取 ~/.config/gh, GITHUB_TOKEN
          en: Reads ~/.config/gh, GITHUB_TOKEN
        sensitive:
        - "$HOME/.config/gh/hosts.yml"
      write:
        desc:
          cn: 无文件系统读写
          en: No filesystem reads or writes
  resource:
    disk:
      size:
        install:
          estimate: 24 MB
          rating: 2
          desc:
            cn: 安装 24 MB
            en: 24 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 18 MB
        desc:
          cn: 18 MB
          en: 18 MB
      peak:
        estimate: 300 MB
        desc:
          cn: ~300 MB
          en: ~300 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: API 调用时短暂占用
          en: Brief spike on API calls
  platform:
    win: full
    linux: full
    darwin: full
