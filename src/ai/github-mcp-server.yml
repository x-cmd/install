lang: Go
homepage: https://github.com/github/github-mcp-server
license: mit
desc:
  cn: GitHub 官方 MCP 服务器
  en: GitHub's official MCP Server
x:
  source: https://github.com/github/github-mcp-server
  eget: https://github.com/github/github-mcp-server
rule:
  /eget:
    cmd: x eget github/github-mcp-server
    reference: https://github.com/github/github-mcp-server
binlist:
- github-mcp-server
# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true   # GitHub API
    filesystem:
      read:
        desc:
          cn: 读取 ~/.config/gh, GITHUB_TOKEN
          en: Reads ~/.config/gh, GITHUB_TOKEN
        sensitive:
          - "$HOME/.config/gh/hosts.yml"
      write: []
  resource:
    disk:
      size:
        install:
          estimate: 9.7 MB
          rating: 1
          desc:
            cn: 约 9.7 MB（估算）
            en: ~9.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
      peak:
        estimate: 300 MB
        desc:
          cn: ~300 MB
          en: ~300 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: API 调用时短暂占用
          en: Brief spike on API calls
