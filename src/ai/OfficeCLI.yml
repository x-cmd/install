lang: C#
homepage: https://github.com/iOfficeAI/OfficeCLI
license: apache-2.0
desc:
  cn: 专为 AI Agent 打造的 Office 套件，可读写自动化 Word、Excel、PowerPoint 文件，免费开源单二进制，无需安装 Office
  en: OfficeCLI is the first and best Office suite purpose-built for AI agents to read, edit, and automate Word, Excel, and PowerPoint files. Free, open-source, single binary, no Office installation req...
x:
  source: https://github.com/iOfficeAI/OfficeCLI
  eget: https://github.com/iOfficeAI/OfficeCLI
rule:
  /eget:
    cmd: x eget iOfficeAI/OfficeCLI
    reference: https://github.com/iOfficeAI/OfficeCLI
binlist:
- OfficeCLI

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 34 MB
          rating: 2
          desc:
            cn: 安装 34 MB
            en: 34 MB install
        download:
          estimate: 34 MB
          desc:
            cn: 约 34 MB 下载 (linux/x64)
            en: ~34 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
