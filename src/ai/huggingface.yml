lang: Python
homepage: https://github.com/huggingface/huggingface_hub
license: Apache-2.0
desc:
  cn: Huggingface Hub 的官方 Python 客户端
  en: The official Python client for the Huggingface Hub
  cs: Oficiální Python klient pro Huggingface Hub
  de: Der offizielle Python-Client für den Huggingface Hub
  es: El cliente oficial de Python para Huggingface Hub
  fr: Le client Python officiel pour Huggingface Hub
  id: Klien Python resmi untuk Huggingface Hub
  it: Il client Python ufficiale per Huggingface Hub
  ja: Huggingface Hub 用の公式 Python クライアント
  ko: Huggingface Hub용 공식 Python 클라이언트
  pl: Oficjalny klient Python dla Huggingface Hub
  pt: O cliente oficial em Python para o Huggingface Hub
  ro: Clientul oficial Python pentru Huggingface Hub
  ru: Официальный клиент Python для Huggingface Hub
  th: ไคลเอนต์ Python อย่างเป็นทางการของ Huggingface Hub
  tr: Huggingface Hub için resmi Python istemcisi
  uk: Офіційний клієнт Python для Huggingface Hub
  vi: Trình khách Python chính thức cho Huggingface Hub
x:
  source: https://github.com/huggingface/huggingface_hub
  brew: huggingface-cli
  pip: huggingface_hub
rule:
  /x:
    cmd: x pkg use huggingface
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -LsSf https://hf.co/cli/install.sh | bash
    reference: https://huggingface.co/docs/huggingface_hub/installation
  /pip:
    cmd: pip install huggingface_hub
    reference: https://huggingface.co/docs/huggingface_hub/installation
    dsnap: huggingface_hub
  /conda:
    cmd: conda install -c conda-forge huggingface_hub
    reference: https://huggingface.co/docs/huggingface_hub/installation
  darwin/brew:
    cmd: brew install huggingface-cli
    reference: https://huggingface.co/docs/huggingface_hub/installation
  (win|wsl2)/powershell:
    cmd: x pwsh -ExecutionPolicy ByPass -c "irm https://hf.co/cli/install.ps1 | iex"
    reference: https://huggingface.co/docs/huggingface_hub/installation
binlist:
- huggingface

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
