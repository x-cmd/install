lang: 'TypeScript'
homepage: https://github.com/cline/cline
license: 'Apache-2.0'
desc:
  cn: 以 SDK、IDE 扩展或 CLI 助手形式提供的自主编码智能体
  en: 'Autonomous coding agent as an SDK, IDE extension, or CLI assistant.'
x:
  source: https://github.com/cline/cline
  eget: https://github.com/cline/cline
rule:
  /eget:
    cmd: x eget cline/cline
    reference: https://github.com/cline/cline
binlist:
  - 'cline'

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1005 KB
          rating: 1
          desc:
            cn: 约 1005 KB（估算）
            en: ~1005 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
