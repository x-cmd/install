lang: 'TypeScript'
homepage: https://github.com/cline/cline
license: 'Apache-2.0'
desc:
  cn: 以 SDK、IDE 扩展或 CLI 助手形式提供的自主编码智能体
  en: 'Autonomous coding agent as an SDK, IDE extension, or CLI assistant.'
x:
  source: https://github.com/cline/cline
  eget: https://github.com/cline/cline
rule:
  /eget:
    cmd: x eget cline/cline
    reference: https://github.com/cline/cline
binlist:
  - 'cline'

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
