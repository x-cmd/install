lang: Shell
homepage: https://github.com/lacymorrow/lacy
license: other
desc:
  cn: 与你的 shell 对话：命令直接执行，问题交给 AI，无需前缀
  en: Talk to your shell — commands run, questions go to AI. No prefixes.
x:
  source: https://github.com/lacymorrow/lacy
rule:
  /npm:
    cmd: npm install -g lacy
    reference: https://www.npmjs.com/package/lacy
    dsnap: 'lacy'
binlist:
- lacy

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
