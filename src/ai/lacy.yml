lang: Shell
homepage: https://github.com/lacymorrow/lacy
license: other
desc:
  cn: 与你的 shell 对话：命令直接执行，问题交给 AI，无需前缀
  en: Talk to your shell — commands run, questions go to AI. No prefixes.
x:
  source: https://github.com/lacymorrow/lacy
  npm: lacy
rule:
  /npm:
    cmd: npm install -g lacy
    reference: https://www.npmjs.com/package/lacy
    dsnap: 'lacy'
binlist:
- lacy

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
