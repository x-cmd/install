lang: 'Python'
homepage: https://github.com/bentoml/BentoML
license: 'Apache-2.0'
desc:
  cn: 构建 AI 应用与模型的最简方式，支持模型推理 API、任务队列、LLM 应用与多模型流水线
  en: 'The easiest way to serve AI apps and models - Build Model Inference APIs, Job queues, LLM apps, Multi-model pipelines, and more!'
x:
  source: https://github.com/bentoml/BentoML
rule:
  /pip:
    cmd: pip install bentoml
    reference: https://pypi.org/project/bentoml/
    dsnap: bentoml
binlist:
  - 'BentoML'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
