lang: TypeScript
homepage: https://github.com/xaspx/hermes-control-interface
license: mit
desc:
  cn: Hermes AI 智能体栈的自托管 Web 仪表板，统一管理聊天、终端、文件、token 分析、MCP 服务器与多智能体协作
  en: Self-hosted web dashboard for the Hermes AI agent stack — manage chat, terminals, files, token analytics, MCP servers, and multi-agent workflows behind a password gate.
x:
  source: https://github.com/xaspx/hermes-control-interface
rule:
  /git:
    cmd: git clone https://github.com/xaspx/hermes-control-interface.git
    reference: https://github.com/xaspx/hermes-control-interface#-quick-start
binlist:
- hermes-control-interface
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
