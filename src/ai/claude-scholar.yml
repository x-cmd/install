lang: Python
homepage: https://github.com/Galaxy-Dawn/claude-scholar
license: mit
desc:
  cn: 面向学术研究与软件开发的半自动化研究助手，支持 Claude Code、Codex CLI、Kimi Code CLI、OpenCode，覆盖创意、编码、实验、写作与发表
  en: Semi-automated research assistant for academic research and software development. Supports Claude Code, Codex CLI, Kimi Code CLI, and OpenCode across ideation, coding, experiments, writing, and pub...
x:
  source: https://github.com/Galaxy-Dawn/claude-scholar
  eget: https://github.com/Galaxy-Dawn/claude-scholar
rule:
  /eget:
    cmd: x eget Galaxy-Dawn/claude-scholar
    reference: https://github.com/Galaxy-Dawn/claude-scholar
binlist:
- claude-scholar

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
