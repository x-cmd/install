lang: TypeScript
homepage: https://github.com/gyoridavid/short-video-maker
license: mit
desc:
  cn: 从文本提示生成短视频，自动配音、加字幕、配素材和背景音乐
  en: Generates short-form videos from text prompts with automated voiceovers, captions, stock footage, and background music.
x:
  source: https://github.com/gyoridavid/short-video-maker
  npm: short-video-maker
rule:
  /npm:
    cmd: npm install -g short-video-maker
    reference: https://github.com/gyoridavid/short-video-maker?tab=readme-ov-file#npm
binlist:
- short-video-maker

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
