lang: TypeScript
homepage: https://github.com/gyoridavid/short-video-maker
license: mit
desc:
  cn: 从文本提示生成短视频，自动配音、加字幕、配素材和背景音乐
  en: Generates short-form videos from text prompts with automated voiceovers, captions, stock footage, and background music.
x:
  source: https://github.com/gyoridavid/short-video-maker
rule:
  /npm:
    cmd: npm install -g short-video-maker
    reference: https://github.com/gyoridavid/short-video-maker?tab=readme-ov-file#npm
binlist:
- short-video-maker

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
