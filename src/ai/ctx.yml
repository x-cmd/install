lang: Rust
homepage: https://github.com/ctxrs/ctx
license: apache-2.0
desc:
  cn: 开源的本地编码代理历史检索 CLI，基于 Rust 与本地 SQLite 索引，自动发现并导入 Claude Code、Codex、Cursor、Pi 等四十余种代理的本地会话，供当前与未来的代理以 50 倍更少的 token 复用历史决策、命令与失败记录
  en: Open-source CLI for fast local search across past coding-agent sessions. Written in Rust with a local SQLite index, ctx auto-discovers and imports histories from Claude Code, Codex, Cursor, Pi, and 40+ other agents so current and future agents can reuse prior decisions, commands, and failures at ~50x fewer tokens than raw transcript search.
  cs: Open-source CLI pro rychlé lokální vyhledávání v minulých relacích kódujících agentů. Napsáno v Rustu s lokální SQLite indexem, ctx automaticky objevuje a importuje historie z Claude Code, Codex, Cursor, Pi a dalších 40+ agentů, aby současní i budoucí agenti mohli znovu využívat předchozí rozhodnutí, příkazy a chyby s přibližně 50krát menším počtem tokenů než při hledání v surových transkriptech.
  de: Open-Source-CLI für die schnelle lokale Suche in früheren Coding-Agent-Sitzungen. In Rust mit lokalem SQLite-Index geschrieben, entdeckt und importiert ctx automatisch Verläufe aus Claude Code, Codex, Cursor, Pi und über 40 weiteren Agenten, sodass aktuelle und zukünftige Agenten frühere Entscheidungen, Befehle und Fehler mit rund 50x weniger Tokens erneut nutzen können als bei einer Suche in Rohprotokollen.
  es: CLI de código abierto para búsquedas locales rápidas en sesiones anteriores de agentes de codificación. Escrito en Rust con un índice SQLite local, ctx descubre e importa automáticamente historiales de Claude Code, Codex, Cursor, Pi y más de 40 agentes, de modo que los agentes actuales y futuros puedan reutilizar decisiones, comandos y fallos previos con unas 50 veces menos tokens que la búsqueda en transcripciones sin procesar.
  fr: Un CLI open source pour une recherche locale rapide dans les sessions passées des agents de code. Écrit en Rust avec un index SQLite local, ctx découvre et importe automatiquement les historiques de Claude Code, Codex, Cursor, Pi et plus de 40 autres agents, afin que les agents actuels et futurs puissent réutiliser les décisions, commandes et échecs précédents avec environ 50 fois moins de tokens que la recherche dans les transcriptions brutes.
  id: CLI sumber terbuka untuk pencarian lokal cepat di sesi agen coding sebelumnya. Ditulis dengan Rust dan indeks SQLite lokal, ctx otomatis menemukan dan mengimpor riwayat dari Claude Code, Codex, Cursor, Pi, dan 40+ agen lainnya sehingga agen saat ini dan mendatang dapat memakai kembali keputusan, perintah, dan kegagalan sebelumnya dengan token sekitar 50 kali lebih sedikit daripada pencarian transkrip mentah.
  it: Una CLI open source per ricerche locali rapide nelle sessioni passate degli agenti di codifica. Scritta in Rust con un indice SQLite locale, ctx rileva e importa automaticamente le cronologie da Claude Code, Codex, Cursor, Pi e altri 40+ agenti, così gli agenti attuali e futuri possono riutilizzare decisioni, comandi e fallimenti precedenti con circa 50 volte meno token rispetto alla ricerca nelle trascrizioni grezze.
  ja: 過去のコーディングエージェントのセッションを高速にローカル検索するオープンソース CLI。Rust とローカル SQLite インデックスで書かれ、ctx は Claude Code、Codex、Cursor、Pi 他 40 以上のエージェントの履歴を自動検出・取り込むため、現在および将来のエージェントは生ログ検索の約 50 分の 1 のトークン量で過去の判断、コマンド、失敗を再利用できます。
  ko: 과거 코딩 에이전트 세션을 빠르게 로컬 검색하는 오픈 소스 CLI입니다. Rust와 로컬 SQLite 인덱스로 작성되었으며, ctx는 Claude Code, Codex, Cursor, Pi 등 40개 이상의 에이전트에서 기록을 자동으로 찾아 가져와서 현재와 미래의 에이전트가 원본 기록 검색보다 약 50배 적은 토큰으로 이전 결정, 명령, 실패를 재사용할 수 있게 합니다.
  pl: Otwartoźródłowe CLI do szybkiego lokalnego wyszukiwania w dawnych sesjach agentów programistycznych. Napisane w Rust z lokalnym indeksem SQLite, ctx automatycznie wykrywa i importuje historie z Claude Code, Codex, Cursor, Pi oraz ponad 40 innych agentów, dzięki czemu obecni i przyszli agenci mogą wykorzystywać wcześniejsze decyzje, polecenia i niepowodzenia przy ok. 50 razy mniejszej liczbie tokenów niż przeszukiwanie surowych transkrypcji.
  pt: Uma CLI de código aberto para busca local rápida em sessões anteriores de agentes de codificação. Escrita em Rust com um índice SQLite local, o ctx descobre e importa automaticamente históricos do Claude Code, Codex, Cursor, Pi e outros 40+ agentes, para que agentes atuais e futuros possam reutilizar decisões, comandos e falhas anteriores com cerca de 50x menos tokens que a busca em transcrições brutas.
  ro: Un instrument CLI open source pentru căutare locală rapidă în sesiunile anterioare ale agenților de cod. Scris în Rust cu un index SQLite local, ctx descoperă și importă automat istorice din Claude Code, Codex, Cursor, Pi și alți 40+ de agenți, astfel încât agenții actuali și viitori pot reutiliza decizii, comenzi și eșecuri anterioare cu aproximativ 50 de ori mai puține tokenuri decât căutarea în transcrieri brute.
  ru: CLI с открытым исходным кодом для быстрого локального поиска по прошлым сессиям агентов для программирования. Написан на Rust с локальным индексом SQLite, ctx автоматически находит и импортирует истории из Claude Code, Codex, Cursor, Pi и ещё 40+ агентов, чтобы текущие и будущие агенты могли переиспользовать прежние решения, команды и ошибки примерно в 50 раз дешевле по токенам, чем поиск по сырым транскриптам.
  th: คลิเอนต์โอเพนซอร์สสำหรับค้นหาอย่างรวดเร็วในเครื่องจากเซสชันเอเจนต์เขียนโค้ดในอดีต เขียนด้วย Rust พร้อมดัชนี SQLite ในเครื่อง ctx จะค้นพบและนำเข้าประวัติจาก Claude Code, Codex, Cursor, Pi และเอเจนต์อีกกว่า 40 ตัวโดยอัตโนมัติ เพื่อให้เอเจนต์ในปัจจุบันและอนาคตนำการตัดสินใจ คำสั่ง และความล้มเหลวเดิมกลับมาใช้ได้โดยใช้โทเคนน้อยกว่าการค้นในทรานสคริปต์ดิบราว 50 เท่า
  tr: Geçmiş kodlama ajanı oturumlarında hızlı yerel arama için açık kaynaklı CLI. Rust ve yerel SQLite diziniyle yazılan ctx, Claude Code, Codex, Cursor, Pi ve 40'tan fazla ajanın geçmişini otomatik olarak bulur ve içe aktarır; böylece mevcut ve gelecekteki ajanlar önceki karar, komut ve hataları ham transkript aramasından yaklaşık 50 kat daha az tokenla yeniden kullanabilir.
  uk: CLI з відкритим кодом для швидкого локального пошуку в минулих сесіях агентів для програмування. Написаний на Rust із локальним індексом SQLite, ctx автоматично знаходить та імпортує історії з Claude Code, Codex, Cursor, Pi та ще 40+ агентів, щоб поточні й майбутні агенти могли повторно використовувати попередні рішення, команди та помилки приблизно у 50 разів дешевше за токени, ніж пошук у необроблених транскриптах.
  vi: CLI mã nguồn mở để tìm kiếm cục bộ nhanh trong các phiên tác nhân lập trình trước đây. Viết bằng Rust với chỉ mục SQLite cục bộ, ctx tự động phát hiện và nhập lịch sử từ Claude Code, Codex, Cursor, Pi và hơn 40 tác nhân khác, giúp các tác nhân hiện tại và tương lai tái sử dụng quyết định, lệnh và thất bại trước đó với khoảng 50 lần ít token hơn so với tìm kiếm trong bản ghi thô.
x:
  source: https://github.com/ctxrs/ctx
  eget: ctxrs/ctx
rule:
  /eget:
    cmd: x eget use ctxrs/ctx
    reference: https://github.com/ctxrs/ctx/releases
  /curl:
    cmd: curl -fsSL https://ctx.rs/install | sh
    reference: https://github.com/ctxrs/ctx#install-and-set-up-ctx
binlist:
- ctx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取多个代理的本地会话历史
          en: Reads local session histories from many coding agents
        sensitive: []
      write:
        desc:
          cn: 写入本地 SQLite 索引
          en: Writes a local SQLite index
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 安装 50 MB
            en: 50 MB install
        download:
          estimate: 50 MB
          desc:
            cn: 约 50 MB 下载 (linux/x64)
            en: ~50 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
