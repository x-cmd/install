lang: Python
homepage: https://github.com/AstrBotDevs/AstrBot
license: agpl-3.0
desc:
  cn: 对接多种 IM 平台、LLM、插件与 AI 能力的 Agent 助手开发框架，可作为 OpenClaw 替代方案
  en: AI Agent Assistant & development framework that integrates lots of IM platforms, LLMs, plugins and AI feature, and can be your openclaw alternative. ✨
x:
  source: https://github.com/AstrBotDevs/AstrBot
  eget: https://github.com/AstrBotDevs/AstrBot
rule:
  /eget:
    cmd: x eget AstrBotDevs/AstrBot
    reference: https://github.com/AstrBotDevs/AstrBot
binlist:
- AstrBot

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 514 KB
          rating: 1
          desc:
            cn: 约 514 KB（估算）
            en: ~514 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
