lang: TypeScript
homepage: https://github.com/Tencent/TencentDB-Agent-Memory
license: MIT
desc:
  cn: 为 AI Agent 添加分层长期记忆与符号短期记忆，降低 token 消耗并提升任务成功率
  en: Adds layered long-term and symbolic short-term memory to AI agents to reduce token usage and improve task success.
x:
  source: https://github.com/Tencent/TencentDB-Agent-Memory
rule:
  /npm:
    cmd: npm install -g @tencentdb-agent-memory/memory-tencentdb
    reference: https://github.com/Tencent/TencentDB-Agent-Memory
    dsnap: '@tencentdb-agent-memory/memory-tencentdb'
  /git:
    cmd: x git clone Tencent/TencentDB-Agent-Memory
    reference: https://github.com/Tencent/TencentDB-Agent-Memory
binlist:
  - read-local-memory
  - migrate-sqlite-to-tcvdb
  - export-tencent-vdb

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 368 KB
          rating: 1
          desc:
            cn: 约 368 KB（估算）
            en: ~368 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
