lang: JavaScript
homepage: https://github.com/Manavarya09/design-extract
license: mit
desc:
  cn: 从在线网站提取完整设计语言，生成多平台代码与设计令牌，并审计系统一致性
  en: Extracts comprehensive design language from live websites, generating multi-platform code, design tokens, and auditing system consistency.
x:
  source: https://github.com/Manavarya09/design-extract
  eget: https://github.com/Manavarya09/design-extract
rule:
  /eget:
    cmd: x eget Manavarya09/design-extract
    reference: https://github.com/Manavarya09/design-extract
binlist:
- design-extract

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
