lang: Rust
homepage: https://github.com/ShelbyJenkins/llm_client
license: mit
desc:
  cn: 面向本地 LLM 的最简 Rust 接口，并从概率性 LLM 输出中提取确定性信号
  en: The Easiest Rust Interface for Local LLMs and an Interface for Deterministic Signals from Probabilistic LLM Vibes
x:
  source: https://github.com/ShelbyJenkins/llm_client
  eget: https://github.com/ShelbyJenkins/llm_client
rule:
  /eget:
    cmd: x eget ShelbyJenkins/llm_client
    reference: https://github.com/ShelbyJenkins/llm_client
binlist:
- llm_client

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 784 KB
          rating: 1
          desc:
            cn: 约 784 KB（估算）
            en: ~784 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
