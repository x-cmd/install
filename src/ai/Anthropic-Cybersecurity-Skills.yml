  th: คลังสกิลไซเบอร์ซีเคอร์เอไอสำหรับเอเจนต์ AI ที่ชุมชนสร้างขึ้น · สกิลเชิงโครงสร้าง 817 รายการที่แมปกับ 6 เฟรมเวิร์ก (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · มาตรฐาน agentskills.io · ใช้ได้กับ Claude Code, Codex, Cursor และอีกกว่า 26 แพลตฟอร์ม
