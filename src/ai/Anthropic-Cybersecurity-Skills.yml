desc:
  cn: 社区开源的 AI Agent 网络安全技能库，817 项结构化技能映射 MITRE ATT&CK、NIST CSF 2.0、ATLAS、D3FEND、AI RMF 与 F3 六大框架，兼容 Claude Code、Codex、Cursor 等 26+ 平台
  en: Community-built AI agent cybersecurity skills library · 817 structured skills mapped to 6 frameworks (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · agentskills.io standard · Works with Claude Code, Codex, Cursor & 26+ platforms
  cs: Knihovna dovedností pro kybernetickou bezpečnost AI agentů vytvořená komunitou · 817 strukturovaných dovedností mapovaných na 6 frameworků (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · standard agentskills.io · funguje s Claude Code, Codex, Cursor a 26+ platformami
  de: Von der Community entwickelte Bibliothek für Cybersecurity-Skills von AI-Agenten · 817 strukturierte Skills, auf 6 Frameworks abgebildet (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · agentskills.io-Standard · funktioniert mit Claude Code, Codex, Cursor und 26+ Plattformen
  es: Biblioteca de habilidades de ciberseguridad para agentes de IA creada por la comunidad · 817 habilidades estructuradas mapeadas a 6 marcos (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · estándar agentskills.io · funciona con Claude Code, Codex, Cursor y más de 26 plataformas
  fr: Bibliothèque de compétences en cybersécurité pour agents IA construite par la communauté · 817 compétences structurées mappées à 6 référentiels (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · standard agentskills.io · compatible avec Claude Code, Codex, Cursor et plus de 26 plateformes
