lang: Python
homepage: https://mahipal.engineer/Anthropic-Cybersecurity-Skills/
license: apache-2.0
desc:
  cn: 社区开源的 AI Agent 网络安全技能库，817 项结构化技能映射 MITRE ATT&CK、NIST CSF 2.0、ATLAS、D3FEND、AI RMF 与 F3 六大框架，兼容 Claude Code、Codex、Cursor 等 26+ 平台
  en: Community-built AI agent cybersecurity skills library · 817 structured skills mapped to 6 frameworks (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · agentskills.io standard · Works with Claude Code, Codex, Cursor & 26+ platforms
rule:
  /git:
    cmd: x git clone mukul975/Anthropic-Cybersecurity-Skills && mkdir -p ~/.claude/skills && mv Anthropic-Cybersecurity-Skills ~/.claude/skills/Anthropic-Cybersecurity-Skills
    reference: https://github.com/mukul975/Anthropic-Cybersecurity-Skills#quick-start
  /npm:
    cmd: npx skills add mukul975/Anthropic-Cybersecurity-Skills
    reference: https://github.com/mukul975/Anthropic-Cybersecurity-Skills#quick-start
binlist:
- Anthropic-Cybersecurity-Skills

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
