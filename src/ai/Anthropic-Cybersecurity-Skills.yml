  uk: Бібліотека навичок кібербезпеки для ІІ-агентів, створена спільнотою · 817 структурованих навичок, відображені на 6 фреймворків (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · стандарт agentskills.io · працює з Claude Code, Codex, Cursor та 26+ платформами
  vi: Thư viện kỹ năng an ninh mạng cho tác nhân AI do cộng đồng xây dựng · 817 kỹ năng có cấu trúc được ánh xạ tới 6 khung (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · tiêu chuẩn agentskills.io · hoạt động với Claude Code, Codex, Cursor và hơn 26 nền tảng
rule:
  /git:
    cmd: x git clone mukul975/Anthropic-Cybersecurity-Skills && mkdir -p ~/.claude/skills && mv Anthropic-Cybersecurity-Skills ~/.claude/skills/Anthropic-Cybersecurity-Skills
    reference: https://github.com/mukul975/Anthropic-Cybersecurity-Skills#quick-start
  /npm:
    cmd: npx skills add mukul975/Anthropic-Cybersecurity-Skills
    reference: https://github.com/mukul975/Anthropic-Cybersecurity-Skills#quick-start

x: {}
binlist:
- Anthropic-Cybersecurity-Skills

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
