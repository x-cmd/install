  pl: Wspólnotowa biblioteka umiejętności cyberbezpieczeństwa dla agentów AI · 817 ustrukturyzowanych umiejętności odwzorowanych na 6 frameworków (MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, AI RMF, F3) · standard agentskills.io · działa z Claude Code, Codex, Cursor i 26+ platformami
