lang: TypeScript
homepage: https://github.com/KolosalAI/kolosal-cli
license: apache-2.0
desc:
  cn: 超轻量的 Ollama 与 Qwen Code 替代品，可运行 Llama 3.3、DeepSeek-R1、Phi-4、Gemma 3 等大模型
  en: Super lightweight Ollama + Qwen Code alternative to run Llama 3.3, DeepSeek-R1, Phi-4, Gemma 3, Mistral Small 3.1 and other large language models.
x:
  source: https://github.com/KolosalAI/kolosal-cli
  eget: https://github.com/KolosalAI/kolosal-cli
rule:
  /eget:
    cmd: x eget KolosalAI/kolosal-cli
    reference: https://github.com/KolosalAI/kolosal-cli
binlist:
- kolosal-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 79 MB
          rating: 3
          desc:
            cn: 安装 79 MB
            en: 79 MB install
        download:
          estimate: 79 MB
          desc:
            cn: 约 79 MB 下载 (linux/x64)
            en: ~79 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
