lang: TypeScript
homepage: https://github.com/razvanneculai/litecode
license: isc
desc:
  cn: 面向 8k 上下文 AI 模型的 CLI 工具
  en: CLI Tool for 8k context ai models
x:
  source: https://github.com/razvanneculai/litecode
  eget: https://github.com/razvanneculai/litecode
rule:
  /eget:
    cmd: x eget razvanneculai/litecode
    reference: https://github.com/razvanneculai/litecode
binlist:
- litecode

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
