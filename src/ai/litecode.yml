lang: TypeScript
homepage: https://github.com/razvanneculai/litecode
license: isc
desc:
  cn: 面向 8k 上下文 AI 模型的 CLI 工具
  en: CLI Tool for 8k context ai models
  cs: Nástroj CLI pro AI modely s kontextem 8k
  de: CLI-Tool für KI-Modelle mit 8k Kontext
  es: Herramienta CLI para modelos de IA con contexto de 8k
  fr: Outil en ligne de commande pour les modèles d'IA avec un contexte de 8k
  id: Alat CLI untuk model AI berkonteks 8k
  it: Strumento CLI per modelli IA con contesto 8k
  ja: 8kコンテキストのAIモデル向けのCLIツール
  ko: 8k 컨텍스트 AI 모델을 위한 CLI 도구
  pl: Narzędzie CLI dla modeli AI z kontekstem 8k
  pt: Ferramenta de CLI para modelos de IA com contexto de 8k
  ro: Instrument CLI pentru modele AI cu context de 8k
  ru: CLI-инструмент для ИИ-моделей с контекстом 8k
  th: เครื่องมือ CLI สำหรับโมเดล AI ที่มีบริบท 8k
  tr: 8k bağlamlı yapay zeka modelleri için CLI aracı
  uk: CLI-інструмент для ШІ-моделей із контекстом 8k
  vi: Công cụ CLI cho các mô hình AI có ngữ cảnh 8k
x:
  source: https://github.com/razvanneculai/litecode
  eget: razvanneculai/litecode
rule:
  /eget:
    cmd: x eget razvanneculai/litecode
    reference: https://github.com/razvanneculai/litecode
binlist:
- litecode

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
