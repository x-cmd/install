lang: TypeScript
homepage: https://github.com/razvanneculai/litecode
license: isc
desc:
  cn: 面向 8k 上下文 AI 模型的 CLI 工具
  en: CLI Tool for 8k context ai models
x:
  source: https://github.com/razvanneculai/litecode
  eget: https://github.com/razvanneculai/litecode
rule:
  /eget:
    cmd: x eget razvanneculai/litecode
    reference: https://github.com/razvanneculai/litecode
binlist:
- litecode

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
