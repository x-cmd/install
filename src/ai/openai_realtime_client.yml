lang: Python
homepage: https://github.com/run-llama/openai_realtime_client
license: mit
desc:
  cn: 用于在 Python 中与 OpenAI Realtime API 交互的简单客户端与工具集
  en: A simple client and utils for interacting with OpenAI's Realtime API in Python
x:
  source: https://github.com/run-llama/openai_realtime_client
  eget: https://github.com/run-llama/openai_realtime_client
rule:
  /eget:
    cmd: x eget run-llama/openai_realtime_client
    reference: https://github.com/run-llama/openai_realtime_client
binlist:
- openai_realtime_client

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
