lang: Python
homepage: https://github.com/run-llama/openai_realtime_client
license: mit
desc:
  cn: 用于在 Python 中与 OpenAI Realtime API 交互的简单客户端与工具集
  en: A simple client and utils for interacting with OpenAI's Realtime API in Python
x:
  source: https://github.com/run-llama/openai_realtime_client
  eget: run-llama/openai_realtime_client
rule:
  /eget:
    cmd: x eget run-llama/openai_realtime_client
    reference: https://github.com/run-llama/openai_realtime_client
binlist:
- openai_realtime_client

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
