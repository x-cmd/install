x:
  source: https://github.com/MayDay-wpf/snow-cli
  eget: MayDay-wpf/snow-cli
rule:
  /eget:
    cmd: x eget MayDay-wpf/snow-cli
    reference: https://github.com/MayDay-wpf/snow-cli
binlist:
- snow-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 223 KB
          rating: 1
          desc:
            cn: 约 223 KB（估算）
            en: ~223 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
