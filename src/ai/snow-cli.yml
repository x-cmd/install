lang: TypeScript
homepage: https://github.com/MayDay-wpf/snow-cli
license: other
desc:
  cn: 运行在终端的 AI 编程智能体，同时兼容 OpenAI、Gemini 和 Claude
  en: Agentic coding in your terminal — simultaneously compatible with DeepSeek, OpenAI, Gemini, and Claude.
x:
  source: https://github.com/MayDay-wpf/snow-cli
  eget: https://github.com/MayDay-wpf/snow-cli
rule:
  /eget:
    cmd: x eget MayDay-wpf/snow-cli
    reference: https://github.com/MayDay-wpf/snow-cli
binlist:
- snow-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
