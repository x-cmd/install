lang: Python
homepage: https://github.com/browser-use/browser-use
license: MIT
desc:
  cn: 让 AI 代理可以访问网站。轻松实现在线任务自动化
  en: Make websites accessible for AI agents. Automate tasks online with ease.
  cs: Umožněte webovým stránkám přístup pro AI agenty. Automatizujte úkoly online snadno.
  de: Machen Sie Websites für KI-Agents zugänglich. Automatisieren Sie Aufgaben online ganz einfach.
  es: Haz accesibles los sitios web para agentes de IA. Automatiza tareas en línea con facilidad.
  fr: Rendez les sites web accessibles aux agents IA. Automatisez les tâches en ligne en toute simplicité.
  id: Buat situs web dapat diakses oleh agen AI. Otomatiskan tugas online dengan mudah.
  it: Rendi i siti web accessibili agli agenti IA. Automatizza le attività online con facilità.
  ja: Web へのアクセスを AI エージェントに可能に。オンラインでのタスクを手軽に自動化。
  ko: 웹사이트를 AI 에이전트가 접근할 수 있게 하세요. 온라인 작업을 손쉽게 자동화하세요.
  pl: Udostępnij strony internetowe agentom AI. Łatwo automatyzuj zadania w sieci.
  pt: Torne os sites acessíveis para agentes de IA. Automatize tarefas online com facilidade.
  ro: Fă site-urile accesibile pentru agenții AI. Automatizează sarcinile online cu ușurință.
  ru: Сделайте веб-сайты доступными для ИИ-агентов. Автоматизируйте онлайн-задачи без лишних усилий.
  th: ทำให้เว็บไซต์เข้าถึงได้สำหรับเอเจนต์ AI ทำงานอัตโนมัติบนอินเทอร์เน็ตได้อย่างง่ายดาย
  tr: Web sitelerini YZ ajanları için erişilebilir hale getirin. Çevrimiçi görevleri kolayca otomatikleştirin.
  uk: Зробіть вебсайти доступними для ІІ-агентів. Автоматизуйте онлайн-завдання без зусиль.
  vi: Giúp các trang web trở nên truy cập được cho agent AI. Tự động hóa tác vụ trực tuyến một cách dễ dàng.
x:
  source: https://github.com/browser-use/browser-use
  yay: browser-use-cli
rule:
  /x:
    cmd: x pkg use browser-use
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -fsSL https://browser-use.com/cli/install.sh | bash
    reference: https://docs.browser-use.com/open-source/browser-use-cli
  /uv:
    cmd: uv tool install browser-use
    reference: https://pypi.org/project/browser-use/
  arch/yay:
    cmd: yay -S browser-use-cli
    reference: https://aur.archlinux.org/packages/browser-use-cli
binlist:
  - browser-use
  - browseruse
  - browser
  - browser-use-tui
  - bu

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
