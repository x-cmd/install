lang: Python
homepage: https://github.com/browser-use/browser-use
license: MIT
desc:
  cn: 让 AI 代理可以访问网站。轻松实现在线任务自动化
  en: Make websites accessible for AI agents. Automate tasks online with ease.
x:
  pkg:
    exist: true
  source: https://github.com/browser-use/browser-use
rule:
  /x:
    cmd: x pkg use browser-use
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -fsSL https://browser-use.com/cli/install.sh | bash
    reference: https://docs.browser-use.com/open-source/browser-use-cli
  /uv:
    cmd: uv tool install browser-use
    reference: https://pypi.org/project/browser-use/
  arch/yay:
    cmd: yay -S browser-use-cli
    reference: https://aur.archlinux.org/packages/browser-use-cli
binlist:
  - browser-use
  - browseruse
  - browser
  - browser-use-tui
  - bu

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
