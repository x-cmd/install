lang: Go
homepage: https://github.com/kunchenguid/no-mistakes
license: MIT
desc:
  cn: 本地 git 代理，把 git push no-mistakes 拦在 disposable worktree 中，走通 review → test → docs → lint → push → PR → CI 的 AI 校验流水线；所有 gate 全绿后才会把分支转发到真实 remote 并自动开干净的 PR。
  en: Local git proxy that sits in front of your real remote. Pushing to no-mistakes spins up a disposable worktree, runs an AI-driven validation pipeline (review → test → docs → lint → push → PR → CI), and only forwards the branch to the configured push target — and opens a clean PR — after every gate is green.
  cs: Místní git proxy, který stojí před vaším skutečným remote. Push do no-mistakes vytvoří jednorázový worktree, spustí validovací pipeline řízenou AI (review → test → docs → lint → push → PR → CI) a větev předá nastavenému push cíli – a otevře čistý PR – až poté, když jsou všechny brány zelené.
  de: Lokaler git-Proxy, der vor Ihrem echten Remote sitzt. Ein Push an no-mistakes startet einen Wegwerf-Worktree, führt eine KI-gesteuerte Validierungspipeline aus (review → test → docs → lint → push → PR → CI) und leitet den Branch erst dann an das konfigurierte Push-Ziel weiter – und eröffnet einen sauberen PR –, wenn alle Gates grün sind.
  es: Proxy git local que se sitúa delante de tu remote real. Enviar a no-mistakes crea un worktree desechable, ejecuta una canalización de validación impulsada por IA (review → test → docs → lint → push → PR → CI) y solo reenvía la rama al destino de push configurado —y abre un PR limpio— cuando todas las comprobaciones están en verde.
  fr: Proxy git local qui se place devant votre vrai remote. Pousser vers no-mistakes crée un worktree jetable, exécute une pipeline de validation pilotée par l'IA (review → test → docs → lint → push → PR → CI) et ne transmet la branche vers la cible de push configurée — et n'ouvre une PR propre — qu'une fois toutes les étapes au vert.
  id: Proxy git lokal yang berada di depan remote Anda yang sesungguhnya. Push ke no-mistakes akan membuat worktree sekali pakai, menjalankan pipeline validasi berbasis AI (review → test → docs → lint → push → PR → CI), dan hanya meneruskan cabang ke target push yang dikonfigurasi — serta membuka PR yang bersih — setelah semua gerbang hijau.
  it: Proxy git locale che si mette davanti al tuo remote reale. Il push verso no-mistakes avvia un worktree usa e getta, esegue una pipeline di validazione guidata dall'IA (review → test → docs → lint → push → PR → CI) e inoltra il ramo alla destinazione di push configurata — e apre una PR pulita — solo dopo che ogni gate è verde.
  ja: 実際のremoteの前に座るローカルgitプロキシ。no-mistakesへのpushは使い捨てworktreeを起動し、AI主導の検証パイプライン（review → test → docs → lint → push → PR → CI）を実行し、すべてのゲートがグリーンになった後にのみ、設定されたpush先へブランチを転送してクリーンなPRを作成します。
  ko: 실제 remote 앞에 놓이는 로컬 git 프록시입니다. no-mistakes로 push하면 일회용 worktree를 띄우고 AI 주도 검증 파이프라인(review → test → docs → lint → push → PR → CI)을 실행한 뒤, 모든 게이트가 통과한 후에만 설정된 push 대상으로 브랜치를 전달하고 깨끗한 PR을 엽니다.
  pl: Lokalny proxy git stojący przed Twoim prawdziwym remote. Pushowanie do no-mistakes tworzy jednorazowy worktree, uruchamia walidacyjny pipeline sterowany przez AI (review → test → docs → lint → push → PR → CI) i przekazuje gałąź do skonfigurowanego celu push — oraz otwiera czysty PR — dopiero, gdy wszystkie bramki są zielone.
  pt: Proxy git local que fica à frente do seu remote real. Enviar para no-mistakes cria um worktree descartável, executa um pipeline de validação orientado por IA (review → test → docs → lint → push → PR → CI) e só encaminha o branch para o destino de push configurado — e abre um PR limpo — depois que todas as verificações ficam verdes.
  ro: Proxy git local amplasat în fața remote-ului tău real. Push-ul către no-mistakes creează un worktree de unică folosință, rulează o conductă de validare ghidată de AI (review → test → docs → lint → push → PR → CI) și doar trimite ramura către ținta de push configurată — și deschide un PR curat — după ce toate porțile sunt verzi.
  ru: Локальный git-прокси, который стоит перед вашим настоящим remote. Push в no-mistakes поднимает одноразовый worktree, запускает проверочный конвейер на базе ИИ (review → test → docs → lint → push → PR → CI) и перенаправляет ветку в настроенную цель push — и открывает чистый PR — только после того, как все проверки пройдены успешно.
  th: git proxy ในเครื่องที่ยืนอยู่หน้า remote จริงของคุณ การ push ไปยัง no-mistakes จะสร้าง worktree แบบใช้ครั้งเดียว เรียกใช้ไปป์ไลน์ตรวจสอบที่ขับเคลื่อนด้วย AI (review → test → docs → lint → push → PR → CI) และจะส่งต่อ branch ไปยังเป้าหมาย push ที่ตั้งค่าไว้ พร้อมเปิด PR ที่สะอาด หลังจากทุก gate ผ่านเป็นสีเขียว
  tr: Gerçek remote'unuzun önünde duran yerel git proxy'si. no-mistakes hedefine push etmek tek kullanımlık bir worktree başlatır, YZ destekli bir doğrulama işi hattı çalıştırır (review → test → docs → lint → push → PR → CI) ve tüm kapılar yeşil olduktan sonra dalı yalnızca yapılandırılmış push hedefine iletir — ve temiz bir PR açar.
  uk: Локальний git-проксі, що стоїть перед вашим справжнім remote. Push до no-mistakes піднімає одноразовий worktree, запускає перевірявальний конвеєр на базі ШІ (review → test → docs → lint → push → PR → CI) і лише після того, як усі перевірки пройдено успішно, пересилає гілку до налаштованої цілі push та відкриває чистий PR.
  vi: Proxy git cục bộ đứng trước remote thật của bạn. Push tới no-mistakes sẽ dựng một worktree dùng một lần, chạy pipeline kiểm định do AI dẫn dắt (review → test → docs → lint → push → PR → CI), và chỉ chuyển nhánh tới đích push đã cấu hình — đồng thời mở một PR sạch — sau khi mọi gate đều xanh.
x:
  source: https://github.com/kunchenguid/no-mistakes
  eget: kunchenguid/no-mistakes
  go: github.com/kunchenguid/no-mistakes@latest
rule:
  /eget:
    cmd: x eget use kunchenguid/no-mistakes
    reference: https://x-cmd.com/mod/eget
  (linux|darwin)/curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/kunchenguid/no-mistakes/main/docs/install.sh | sh
    reference: https://github.com/kunchenguid/no-mistakes#install
  (win|wsl2)/powershell:
    cmd: x pwsh 'irm https://raw.githubusercontent.com/kunchenguid/no-mistakes/main/docs/install.ps1 | iex'
    reference: https://github.com/kunchenguid/no-mistakes#install
  /go:
    cmd: go install github.com/kunchenguid/no-mistakes@latest
    reference: https://github.com/kunchenguid/no-mistakes#install
binlist:
- no-mistakes

