lang: TypeScript
homepage: https://github.com/cosmicstack-labs/mercury-agent
license: mit
desc:
  cn: 具备权限加固工具、token 预算和多通道访问的灵魂驱动型 AI Agent，可通过 CLI 或 Telegram 7x24 小时运行
  en: Soul-driven AI agent with permission-hardened tools, token budgets, and multi-channel access. Runs 24/7 from CLI or Telegram.
x:
  source: https://github.com/cosmicstack-labs/mercury-agent
  eget: https://github.com/cosmicstack-labs/mercury-agent
rule:
  /eget:
    cmd: x eget cosmicstack-labs/mercury-agent
    reference: https://github.com/cosmicstack-labs/mercury-agent
binlist:
- mercury-agent

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
