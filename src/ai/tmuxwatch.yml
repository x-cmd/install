lang: Go
homepage: https://github.com/steipete/tmuxwatch
license: mit
desc:
  cn: 用于监视 tmux 会话的简洁 TUI
  en: A simple TUI to watch tmux sessions
  cs: Jednoduché TUI pro sledování relací tmux
  de: Eine einfache TUI zum Beobachten von tmux-Sitzungen
  es: Una TUI sencilla para observar sesiones de tmux
  fr: Une TUI simple pour surveiller les sessions tmux
  id: TUI sederhana untuk memantau sesi tmux
  it: Una semplice TUI per monitorare le sessioni tmux
  ja: tmux セッションを監視するシンプルな TUI
  ko: tmux 세션을 관찰하기 위한 간단한 TUI
  pl: Prosty TUI do śledzenia sesji tmux
  pt: Uma TUI simples para acompanhar sessões do tmux
  ro: Un TUI simplu pentru monitorizarea sesiunilor tmux
  ru: Простой TUI для просмотра сессий tmux
  th: TUI อย่างง่ายสำหรับดูเซสชัน tmux
  tr: tmux oturumlarını izlemek için basit bir TUI
  uk: Простий TUI для перегляду сесій tmux
  vi: Giao diện TUI đơn giản để theo dõi các phiên tmux
x:
  source: https://github.com/steipete/tmuxwatch
  eget: steipete/tmuxwatch
rule:
  /eget:
    cmd: x eget steipete/tmuxwatch
    reference: https://github.com/steipete/tmuxwatch
binlist:
- tmuxwatch

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
