lang: Go
homepage: https://github.com/steipete/tmuxwatch
license: mit
desc:
  cn: 用于监视 tmux 会话的简洁 TUI
  en: A simple TUI to watch tmux sessions
x:
  source: https://github.com/steipete/tmuxwatch
  eget: https://github.com/steipete/tmuxwatch
rule:
  /eget:
    cmd: x eget steipete/tmuxwatch
    reference: https://github.com/steipete/tmuxwatch
binlist:
- tmuxwatch

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
