lang: Go
homepage: https://github.com/477-Studio/claude-gym
license: mit
desc:
  cn: 监视本地日志，在长时间运行任务中提醒 Claude Code 用户做桌边锻炼
  en: Reminds developers using Claude Code to perform deskside exercises during long-running tasks by watching local logs.
x:
  source: https://github.com/477-Studio/claude-gym
  eget: https://github.com/477-Studio/claude-gym
rule:
  /eget:
    cmd: x eget 477-Studio/claude-gym
    reference: https://github.com/477-Studio/claude-gym
binlist:
- claude-gym

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
