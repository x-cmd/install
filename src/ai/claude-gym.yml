lang: Go
homepage: https://github.com/477-Studio/claude-gym
license: mit
desc:
  cn: 监视本地日志，在长时间运行任务中提醒 Claude Code 用户做桌边锻炼
  en: Reminds developers using Claude Code to perform deskside exercises during long-running tasks by watching local logs.
x:
  source: https://github.com/477-Studio/claude-gym
  eget: https://github.com/477-Studio/claude-gym
rule:
  /eget:
    cmd: x eget 477-Studio/claude-gym
    reference: https://github.com/477-Studio/claude-gym
binlist:
- claude-gym

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
