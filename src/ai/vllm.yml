lang: Python
homepage: https://github.com/vllm-project/vllm
license: apache-2.0
desc:
  cn: 面向 LLM 的高吞吐、低内存占用的推理与服务引擎
  en: A high-throughput and memory-efficient inference and serving engine for LLMs
x:
  source: https://github.com/vllm-project/vllm
  eget: https://github.com/vllm-project/vllm
rule:
  /eget:
    cmd: x eget vllm-project/vllm
    reference: https://github.com/vllm-project/vllm
binlist:
- vllm

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 124 MB
          rating: 3
          desc:
            cn: 安装 124 MB
            en: 124 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
