lang: Python
homepage: https://github.com/ggozad/oterm
license: MIT
desc:
  cn: ollama 的基于文本的终端客户端
  en: A text-based terminal client for ollama.
  cs: Textový terminálový klient pro ollama.
  de: Ein textbasierter Terminal-Client für ollama.
  es: Un cliente de terminal basado en texto para ollama.
  fr: Un client de terminal textuel pour ollama.
  id: Klien terminal berbasis teks untuk ollama.
  it: Un client terminale basato su testo per ollama.
  ja: ollama のためのテキストベースのターミナルクライアント。
  ko: ollama를 위한 텍스트 기반 터미널 클라이언트.
  pl: Tekstowy klient terminala dla ollama.
  pt: Um cliente de terminal baseado em texto para ollama.
  ro: Un client de terminal bazat pe text pentru ollama.
  ru: Текстовый терминальный клиент для ollama.
  th: ไคลเอนต์เทอร์มินัลแบบข้อความสำหรับ ollama.
  tr: ollama için metin tabanlı terminal istemcisi.
  uk: Текстовий термінальний клієнт для ollama.
  vi: Trình khách hàngi dòng lệnh dựa trên văn bản cho ollama.
x:
  source: https://github.com/ggozad/oterm
  brew: ggozad/formulas/oterm
  yay: oterm
  pip: oterm
rule:
  /uvx:
    cmd: uvx oterm
    reference: https://ggozad.github.io/oterm/installation/#installation
  /uv:
    cmd: uv tool install oterm
    reference: https://ggozad.github.io/oterm/installation/#installation
    dsnap: oterm
  /pip:
    cmd: pip install oterm
    reference: https://ggozad.github.io/oterm/installation/#installation
    dsnap: oterm
  arch/yay:
    cmd: yay -S oterm
    reference: https://ggozad.github.io/oterm/installation/#installation
  /nix:
    cmd: nix-env -iA oterm
    reference: https://ggozad.github.io/oterm/installation/#installation
  darwin/brew:
    cmd: brew install ggozad/formulas/oterm
    reference: https://ggozad.github.io/oterm/installation/#installation
binlist:
- oterm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 22 KB
          rating: 1
          desc:
            cn: 约 22 KB（估算）
            en: ~22 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
