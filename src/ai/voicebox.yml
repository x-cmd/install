lang: TypeScript
homepage: https://github.com/jamiepine/voicebox
license: mit
desc:
  cn: 开源本地优先的 AI 语音工作室，支持语音克隆、多语言语音合成和任意应用内听写
  en: Clone voices, generate multi-lingual speech, and dictate into any app with an open-source, local-first AI voice studio that runs on your machine.
x:
  source: https://github.com/jamiepine/voicebox
  eget: https://github.com/jamiepine/voicebox
rule:
  /eget:
    cmd: x eget jamiepine/voicebox
    reference: https://github.com/jamiepine/voicebox
binlist:
- voicebox

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
