lang: TypeScript
homepage: https://github.com/jamiepine/voicebox
license: mit
desc:
  cn: 开源本地优先的 AI 语音工作室，支持语音克隆、多语言语音合成和任意应用内听写
  en: Clone voices, generate multi-lingual speech, and dictate into any app with an open-source, local-first AI voice studio that runs on your machine.
x:
  source: https://github.com/jamiepine/voicebox
  eget: https://github.com/jamiepine/voicebox
rule:
  /eget:
    cmd: x eget jamiepine/voicebox
    reference: https://github.com/jamiepine/voicebox
binlist:
- voicebox

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 517 MB
          rating: 4
          desc:
            cn: 安装 517 MB
            en: 517 MB install
        download:
          estimate: 517 MB
          desc:
            cn: 约 517 MB 下载 (macos/x64)
            en: ~517 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: full
