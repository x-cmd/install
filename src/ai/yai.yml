lang: Go
homepage: https://github.com/ekkinox/yai
license: MIT
desc:
  cn: 使用 OpenAI ChatGPT 为您构建和运行命令的助手。
  en: An assistant for your terminal, using OpenAI ChatGPT to build and run commands for you.
x:
  source: https://github.com/ekkinox/yai
  eget: https://github.com/ekkinox/yai
rule:
  /eget:
    cmd: x eget ekkinox/yai
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sS https://raw.githubusercontent.com/ekkinox/yai/main/install.sh | bash
    reference: https://github.com/ekkinox/yai?tab=readme-ov-file#quick-start
  /nix-shell:
    cmd: nix-shell -p yai
    reference: https://search.nixos.org/packages?query=yai
  arch/yay:
    cmd: yay -S yai
    reference: https://aur.archlinux.org/packages/yai
binlist:
- yai

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
