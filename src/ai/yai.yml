lang: Go
homepage: https://github.com/ekkinox/yai
license: MIT
desc:
  cn: 使用 OpenAI ChatGPT 为您构建和运行命令的助手。
  en: An assistant for your terminal, using OpenAI ChatGPT to build and run commands for you.
  cs: Asistent pro váš terminál, který pomocí OpenAI ChatGPT sestavuje a spouští příkazy za vás.
  de: Ein Assistent für Ihr Terminal, der mit OpenAI ChatGPT Befehle für Sie erstellt und ausführt.
  es: Un asistente para tu terminal que usa OpenAI ChatGPT para crear y ejecutar comandos por ti.
  fr: Un assistant pour votre terminal, qui utilise OpenAI ChatGPT pour construire et exécuter des commandes à votre place.
  id: Asisten untuk terminal Anda, menggunakan OpenAI ChatGPT untuk membangun dan menjalankan perintah atas nama Anda.
  it: Un assistente per il tuo terminal, che usa OpenAI ChatGPT per costruire ed eseguire i comandi al posto tuo.
  ja: OpenAI ChatGPT を使ってコマンドを構築・実行する、ターミナル用のアシスタント。
  ko: OpenAI ChatGPT를 사용해 명령을 만들어 실행해 주는 터미널용 어시스턴트.
  pl: Asystent terminala, który używa OpenAI ChatGPT do tworzenia i uruchamiania poleceń za Ciebie.
  pt: Um assistente para seu terminal, usando OpenAI ChatGPT para criar e executar comandos por você.
  ro: Un asistent pentru terminalul dumneavoastră, care folosește OpenAI ChatGPT pentru a construi și a rula comenzi în locul dumneavoastră.
  ru: Помощник для вашего терминала, который использует OpenAI ChatGPT, чтобы составлять и выполнять команды за вас.
  th: ผู้ช่วยสำหรับเทอร์มินัลของคุณ โดยใช้ OpenAI ChatGPT เพื่อสร้างและรันคำสั่งแทนคุณ
  tr: OpenAI ChatGPT kullanarak sizin için komutlar oluşturan ve çalıştıran bir terminal asistanı.
  uk: Помічник для вашого термінала, який використовує OpenAI ChatGPT, щоб створювати та виконувати команди замість вас.
  vi: Trợ lý cho terminal của bạn, dùng OpenAI ChatGPT để tạo và chạy các lệnh thay bạn.
x:
  source: https://github.com/ekkinox/yai
  eget: ekkinox/yai
  yay: yai
rule:
  /eget:
    cmd: x eget ekkinox/yai
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sS https://raw.githubusercontent.com/ekkinox/yai/main/install.sh | bash
    reference: https://github.com/ekkinox/yai?tab=readme-ov-file#quick-start
  /nix-shell:
    cmd: nix-shell -p yai
    reference: https://search.nixos.org/packages?query=yai
  arch/yay:
    cmd: yay -S yai
    reference: https://aur.archlinux.org/packages/yai
binlist:
- yai

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
