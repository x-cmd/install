lang: Jupyter Notebook
homepage: https://github.com/moein-shariatnia/OpenAI-CLIP
license: mit
desc:
  cn: 用 PyTorch 简洁实现 OpenAI CLIP 模型
  en: Simple implementation of OpenAI CLIP model in PyTorch.
x:
  source: https://github.com/moein-shariatnia/OpenAI-CLIP
  eget: moein-shariatnia/OpenAI-CLIP
rule:
  /eget:
    cmd: x eget moein-shariatnia/OpenAI-CLIP
    reference: https://github.com/moein-shariatnia/OpenAI-CLIP
binlist:
- OpenAI-CLIP

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 45 KB
          rating: 1
          desc:
            cn: 约 45 KB（估算）
            en: ~45 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
