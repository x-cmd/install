lang: Jupyter Notebook
homepage: https://github.com/moein-shariatnia/OpenAI-CLIP
license: mit
desc:
  cn: 用 PyTorch 简洁实现 OpenAI CLIP 模型
  en: Simple implementation of OpenAI CLIP model in PyTorch.
x:
  source: https://github.com/moein-shariatnia/OpenAI-CLIP
  eget: https://github.com/moein-shariatnia/OpenAI-CLIP
rule:
  /eget:
    cmd: x eget moein-shariatnia/OpenAI-CLIP
    reference: https://github.com/moein-shariatnia/OpenAI-CLIP
binlist:
- OpenAI-CLIP

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
