lang: Python
homepage: https://github.com/QuivrHQ/quivr
license: other
desc:
  cn: 面向 GenAI 集成的 RAG 框架，专注于产品本身而非 RAG 细节，支持 GPT4、Groq、Llama 等多种 LLM
  en: 'Opiniated RAG for integrating GenAI in your apps 🧠 Focus on your product rather than the RAG. Easy integration in existing products with customisation! Any LLM: GPT4, Groq, Llama. Any Vectorstor...'
x:
  source: https://github.com/QuivrHQ/quivr
  eget: https://github.com/QuivrHQ/quivr
rule:
  /eget:
    cmd: x eget QuivrHQ/quivr
    reference: https://github.com/QuivrHQ/quivr
binlist:
- quivr

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
