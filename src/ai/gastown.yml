lang: Go
homepage: https://github.com/steveyegge/gastown
license: MIT
desc:
  cn: 多代理工作空​​间管理器
  en: multi-agent workspace manager
  cs: Správce pracovního prostoru pro více agentů
  de: Manager für Arbeitsbereiche mit mehreren Agenten
  es: Gestor de espacio de trabajo multiagente
  fr: Gestionnaire d'espace de travail multi-agents
  id: Manajer ruang kerja multiagen
  it: Gestore dell'area di lavoro multi-agente
  ja: マルチエージェントのワークスペースマネージャー
  ko: 멀티 에이전트 워크스페이스 관리자
  pl: Menedżer przestrzeni roboczej dla wielu agentów
  pt: Gerenciador de espaço de trabalho multiagente
  ro: Manager de spațiu de lucru cu mai mulți agenți
  ru: Менеджер рабочего пространства для нескольких агентов
  th: ตัวจัดการพื้นที่ทำงานแบบหลายเอเจนต์
  tr: Çoklu ajan çalışma alanı yöneticisi
  uk: Менеджер робочого простору для кількох агентів
  vi: Trình quản lý không gian làm việc đa tác nhân
x:
  source: https://github.com/steveyegge/gastown
  eget: steveyegge/gastown
  brew: gastown
  yay: gastown-git
  npm: "@gastown/gt"
  go: github.com/steveyegge/gastown/cmd/gt@latest
rule:
  /eget:
    cmd: x eget steveyegge/gastown
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install gastown
    reference: https://github.com/steveyegge/gastown?tab=readme-ov-file#setup
  /npm:
    cmd: npm install -g @gastown/gt
    reference: https://github.com/steveyegge/gastown?tab=readme-ov-file#setup
    dsnap: '@gastown/gt'
  /go:
    cmd: go install github.com/steveyegge/gastown/cmd/gt@latest
    reference: https://github.com/steveyegge/gastown?tab=readme-ov-file#setup
    dsnap: github.com/steveyegge/gastown/cmd/gt@latest
  arch/yay:
    cmd: yay -S gastown-git
    reference: https://aur.archlinux.org/packages/gastown-git
binlist:
- gt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 37 MB
          rating: 2
          desc:
            cn: 约 37 MB（估算）
            en: ~37 MB estimated
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
