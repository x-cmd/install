lang: TypeScript
homepage: https://github.com/yamadashy/repomix
license: mit
desc:
  cn: 将整个仓库打包成单个对 AI 友好的文件，便于交给 LLM 等 AI 工具处理
  en: 📦 Repomix is a powerful tool that packs your entire repository into a single, AI-friendly file. Perfect for when you need to feed your codebase to Large Language Models (LLMs) or other AI tools lik...
x:
  source: https://github.com/yamadashy/repomix
  npm: repomix
rule:
  /npm:
    cmd: npm install -g repomix
    reference: https://www.npmjs.com/package/repomix
    dsnap: 'repomix'
binlist:
- repomix

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 89 KB
          rating: 1
          desc:
            cn: 约 89 KB（估算）
            en: ~89 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
