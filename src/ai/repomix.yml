lang: TypeScript
homepage: https://github.com/yamadashy/repomix
license: mit
desc:
  cn: 将整个仓库打包成单个对 AI 友好的文件，便于交给 LLM 等 AI 工具处理
  en: 📦 Repomix is a powerful tool that packs your entire repository into a single, AI-friendly file. Perfect for when you need to feed your codebase to Large Language Models (LLMs) or other AI tools lik...
  cs: 📦 Repomix je výkonný nástroj, který zabalí celý váš repozitář do jediného souboru přátelského pro AI. Ideální pro případ, kdy potřebujete předat svůj kód velkým jazykovým modelům (LLM) nebo jiným AI nástrojům...
  de: 📦 Repomix ist ein leistungsfähiges Werkzeug, das dein gesamtes Repository in eine einzige, KI-freundliche Datei packt. Perfekt, wenn du deinen Codebasis an Large Language Models (LLMs) oder andere KI-Werkzeuge übergeben musst...
  es: 📦 Repomix es una potente herramienta que empaqueta todo tu repositorio en un único archivo amigable para la IA. Perfecto cuando necesitas pasar tu base de código a grandes modelos de lenguaje (LLM) u otras herramientas de IA...
  fr: 📦 Repomix est un outil puissant qui empaquette l'ensemble de votre dépôt dans un seul fichier compatible IA. Parfait lorsque vous devez transmettre votre base de code à de grands modèles de langage (LLM) ou à d'autres outils IA...
  id: 📦 Repomix adalah alat yang kuat untuk mengemas seluruh repositori Anda menjadi satu file yang ramah AI. Sempurna ketika Anda perlu memberikan basis kode Anda kepada Large Language Models (LLM) atau alat AI lainnya...
  it: 📦 Repomix è un potente strumento che impacchetta l'intero repository in un unico file compatibile con l'IA. Perfetto quando devi passare la tua base di codice ai Large Language Models (LLM) o ad altri strumenti di IA...
  ja: 📦 Repomix は、リポジトリ全体を AI に優しい単一ファイルにまとめる強力なツールです。コードベースを Large Language Models (LLM) やその他の AI ツールに渡すのに最適です...
  ko: 📦 Repomix는 저장소 전체를 AI에 적합한 단일 파일로 묶어주는 강력한 도구입니다. 코드베이스를 Large Language Models (LLM) 또는 다른 AI 도구에 전달할 때 완벽합니다...
  pl: 📦 Repomix to potężne narzędzie, które pakuje całe repozytorium w jeden przyjazny AI plik. Idealne, gdy musisz przekazać swój kod dużym modelom językowym (LLM) lub innym narzędziom AI...
  pt: 📦 Repomix é uma ferramenta poderosa que empacota todo o seu repositório em um único arquivo amigável para IA. Perfeito quando você precisa alimentar seu código a grandes modelos de linguagem (LLMs) ou outras ferramentas de IA...
  ro: 📦 Repomix este un instrument puternic care împachetează întregul tău depozit într-un singur fișier prietenos cu AI. Perfect pentru când trebuie să îi oferi codul tău modelelor mari de limbaj (LLM) sau altor instrumente AI...
  ru: 📦 Repomix - мощный инструмент, который упаковывает весь ваш репозиторий в один файл, удобный для ИИ. Идеален, когда нужно передать вашу кодовую базу большим языковым моделям (LLM) или другим ИИ-инструментам...
  th: 📦 Repomix เป็นเครื่องมือที่ทรงพลัง ซึ่งรวม repository ทั้งหมดของคุณให้เป็นไฟล์เดียวที่เป็นมิตรกับ AI เหมาะอย่างยิ่งเมื่อคุณต้องส่ง codebase ให้กับ Large Language Models (LLMs) หรือเครื่องมือ AI อื่น ๆ...
  tr: 📦 Repomix, tüm deponuzu tek bir AI dostu dosyaya paketleyen güçlü bir araçtır. Kod tabanınızı Büyük Dil Modellerine (LLM) veya diğer AI araçlarına aktarmanız gerektiğinde idealdir...
  uk: 📦 Repomix - потужний інструмент, який пакує весь ваш репозиторій в один файл, зручний для ШІ. Ідеальний, коли потрібно передати вашу кодову базу великим мовним моделям (LLM) чи іншим ШІ-інструментам...
  vi: 📦 Repomix là công cụ mạnh mẽ gói toàn bộ kho lưu trữ của bạn vào một tệp thân thiện với AI. Hoàn hảo khi bạn cần đưa codebase cho các mô hình ngôn ngữ lớn (LLM) hoặc công cụ AI khác...
x:
  source: https://github.com/yamadashy/repomix
  npm: repomix
rule:
  /npm:
    cmd: npm install -g repomix
    reference: https://www.npmjs.com/package/repomix
    dsnap: 'repomix'
binlist:
- repomix

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 89 KB
          rating: 1
          desc:
            cn: 约 89 KB（估算）
            en: ~89 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
