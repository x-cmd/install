lang: TypeScript
homepage: https://github.com/langgenius/dify
license: other
desc:
  cn: 面向智能体工作流开发的生产级平台
  en: Production-ready platform for agentic workflow development.
x:
  source: https://github.com/langgenius/dify
  eget: https://github.com/langgenius/dify
rule:
  /eget:
    cmd: x eget langgenius/dify
    reference: https://github.com/langgenius/dify
binlist:
- dify

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
