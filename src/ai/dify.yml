lang: TypeScript
homepage: https://github.com/langgenius/dify
license: other
desc:
  cn: 面向智能体工作流开发的生产级平台
  en: Production-ready platform for agentic workflow development.
x:
  source: https://github.com/langgenius/dify
  eget: https://github.com/langgenius/dify
rule:
  /eget:
    cmd: x eget langgenius/dify
    reference: https://github.com/langgenius/dify
binlist:
- dify

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.1 MB
          rating: 1
          desc:
            cn: 约 3.1 MB（估算）
            en: ~3.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
