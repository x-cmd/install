lang: Go
homepage: https://github.com/j178/chatgpt
license: MIT
desc:
  cn: 适用于 ChatGPT 的命令行界面
  en: Command line interface for ChatGPT
x:
  pkg:
    exist: true
  source: https://github.com/j178/chatgpt
  eget: https://github.com/j178/chatgpt
rule:
  /x:
    cmd: x pkg use chatgpt
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget j178/chatgpt
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install j178/tap/chatgpt
    reference: https://github.com/j178/chatgpt#installation
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add j178 https://github.com/j178/scoop-bucket.git \

      && x scoop install j178/chatgpt

      '
    reference: https://github.com/j178/chatgpt#installation
  darwin/nix:
    cmd: environment.systemPackages = [pkgs.chatgpt-cli];
    reference: https://github.com/j178/chatgpt#installation
  arch/yay:
    cmd: yay -S chatgpt-bin
    reference: https://aur.archlinux.org/packages/chatgpt-bin
binlist:
- chatgpt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 97 KB
          rating: 1
          desc:
            cn: 约 97 KB（估算）
            en: ~97 KB estimated
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
