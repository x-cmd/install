lang: Python
homepage: https://github.com/enderzcx/superx
license: mit
desc:
  cn: 通过 Grok Build CLI 查询 X/Twitter 数据，并将帖子缓存为 Markdown 文件供 AI Agent 使用
  en: Query X/Twitter data and cache posts as Markdown files using the Grok Build CLI for use by AI agents.
x:
  source: https://github.com/enderzcx/superx
rule:
  /pip:
    cmd: pip install superx
    reference: https://github.com/enderzcx/superx
    dsnap: superx
binlist:
- superx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
