lang: Python
homepage: https://github.com/npiv/chatblade
license: GPL-3.0
desc:
  cn: Chatblade 是一个多功能的命令行界面 (CLI) 工具，用于与 OpenAI 的 ChatGPT 交互。
  en: Chatblade is a multi-purpose command line interface (CLI) tool for interacting with OpenAI's ChatGPT.
x:
  pkg:
    exist: true
  source: https://github.com/npiv/chatblade
rule:
  /x:
    cmd: x pkg use chatblade
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install chatblade
    reference: https://github.com/npiv/chatblade?tab=readme-ov-file#via-pypi
    dsnap: chatblade
  darwin/brew:
    cmd: brew install chatblade
    reference: https://github.com/npiv/chatblade?tab=readme-ov-file#via-brew
binlist:
- chatblade

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
