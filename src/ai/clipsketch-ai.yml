lang: 'TypeScript'
homepage: https://github.com/RanFeng/clipsketch-ai
license: noassertion
desc:
  cn: 将视频瞬间转化为手绘故事的工具
  en: '将视频瞬间转化为手绘故事 Turn Video Moments into Hand-Drawn Stories'
x:
  source: https://github.com/RanFeng/clipsketch-ai
  eget: https://github.com/RanFeng/clipsketch-ai
rule:
  /eget:
    cmd: x eget RanFeng/clipsketch-ai
    reference: https://github.com/RanFeng/clipsketch-ai
binlist:
  - 'clipsketch-ai'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 KB
          rating: 1
          desc:
            cn: 约 9 KB（估算）
            en: ~9 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
