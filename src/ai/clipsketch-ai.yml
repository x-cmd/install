lang: 'TypeScript'
homepage: https://github.com/RanFeng/clipsketch-ai
license: noassertion
desc:
  cn: 将视频瞬间转化为手绘故事的工具
  en: '将视频瞬间转化为手绘故事 Turn Video Moments into Hand-Drawn Stories'
  cs: Proměňte okamžiky videa v ručně kreslené příběhy
  de: Video-Momente in handgezeichnete Geschichten verwandeln
  es: Convierte momentos de vídeo en historias dibujadas a mano
  fr: Transformez des instants vidéo en histoires dessinées à la main
  id: Ubah momen video menjadi cerita gambar tangan
  it: Trasforma i momenti video in storie disegnate a mano
  ja: 動画の瞬間を手描きの物語に変身させる
  ko: 영상의 순간을 손으로 그린 이야기로 바꿔보세요
  pl: Zamień momenty z wideo w ręcznie rysowane historie
  pt: Transforme momentos de vídeo em histórias desenhadas à mão
  ro: Transformă momente din video în povești desenate de mână
  ru: Превращайте моменты из видео в нарисованные от руки истории
  th: เปลี่ยนช่วงเวลาจากวิดีโอให้เป็นเรื่องราวที่วาดด้วยมือ
  tr: Video anlarını elle çizilmiş hikâyelere dönüştürün.
  uk: Перетворюйте моменти з відео в намальовані від руки історії.
  vi: Biến những khoảnh khắc trong video thành câu chuyện vẽ tay.
x:
  source: https://github.com/RanFeng/clipsketch-ai
  eget: RanFeng/clipsketch-ai
rule:
  /eget:
    cmd: x eget RanFeng/clipsketch-ai
    reference: https://github.com/RanFeng/clipsketch-ai
binlist:
  - 'clipsketch-ai'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 KB
          rating: 1
          desc:
            cn: 约 9 KB（估算）
            en: ~9 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
