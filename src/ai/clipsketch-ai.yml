lang: 'TypeScript'
homepage: https://github.com/RanFeng/clipsketch-ai
license: noassertion
desc:
  cn: 将视频瞬间转化为手绘故事的工具
  en: '将视频瞬间转化为手绘故事 Turn Video Moments into Hand-Drawn Stories'
x:
  source: https://github.com/RanFeng/clipsketch-ai
  eget: https://github.com/RanFeng/clipsketch-ai
rule:
  /eget:
    cmd: x eget RanFeng/clipsketch-ai
    reference: https://github.com/RanFeng/clipsketch-ai
binlist:
  - 'clipsketch-ai'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
