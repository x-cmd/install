lang: JavaScript
homepage: https://github.com/MiniMax-AI/cli
license: MIT
desc:
  cn: MiniMax AI 平台的官方 CLI 工具，支持文本对话、图像生成、视频生成、语音合成、音乐创作、图像理解和网页搜索等全模态能力调用
  en: The official CLI for the MiniMax AI Platform, supporting text chat, image generation, video generation, speech synthesis, music creation, vision understanding, and web search
x:
  source: https://github.com/MiniMax-AI/cli
rule:
  /npm:
    cmd: npm install -g mmx-cli
    reference: https://github.com/MiniMax-AI/cli?tab=readme-ov-file#install
    dsnap: mmx-cli
binlist:
  - mmx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
