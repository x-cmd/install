lang: Python
homepage: https://github.com/KoboldAI/KoboldAI-Client
license: agpl-3.0
desc:
  cn: KoboldAI 客户端，GGUF 支持请使用 KoboldCPP
  en: 'For GGUF support, see KoboldCPP: https://github.com/LostRuins/koboldcpp'
x:
  source: https://github.com/KoboldAI/KoboldAI-Client
  eget: https://github.com/KoboldAI/KoboldAI-Client
rule:
  /eget:
    cmd: x eget KoboldAI/KoboldAI-Client
    reference: https://github.com/KoboldAI/KoboldAI-Client
binlist:
- KoboldAI-Client

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
