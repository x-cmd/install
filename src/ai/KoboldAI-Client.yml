lang: Python
homepage: https://github.com/KoboldAI/KoboldAI-Client
license: agpl-3.0
desc:
  cn: KoboldAI 客户端，GGUF 支持请使用 KoboldCPP
  en: 'For GGUF support, see KoboldCPP: https://github.com/LostRuins/koboldcpp'
x:
  source: https://github.com/KoboldAI/KoboldAI-Client
  eget: https://github.com/KoboldAI/KoboldAI-Client
rule:
  /eget:
    cmd: x eget KoboldAI/KoboldAI-Client
    reference: https://github.com/KoboldAI/KoboldAI-Client
binlist:
- KoboldAI-Client

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 58 KB
          rating: 1
          desc:
            cn: 约 58 KB（估算）
            en: ~58 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
