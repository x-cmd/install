lang: powershell & shell
homepage: https://github.com/anthropics/claude-code
license: © Anthropic PBC. All rights reserved.
desc:
  cn: Claude Code 是一种代理编码工具，它存在于您的终端中，可以理解您的代码库，并通过执行常规任务、解释复杂代码和处理 git 工作流程来帮助您更快地编写代码 - 所有这些都通过自然语言命令完成。
  en: Claude Code is an agentic coding tool that lives in your terminal, understands your codebase, and helps you code faster by executing routine tasks, explaining complex code, and handling git workflows - all through natural language commands.
  cs: Claude Code je agentační nástroj pro kódování, který běží ve vašem terminálu, rozumí vašemu codebase a pomáhá vám kódovat rychleji tím, že vykonává rutinní úkoly, vysvětluje složitý kód a řeší git pracovní postupy – a to vše pomocí přirozených jazykových příkazů.
  de: Claude Code ist ein agentisches Coding-Tool, das in Ihrem Terminal läuft, Ihre Codebasis versteht und Ihnen hilft, schneller zu programmieren, indem es Routineaufgaben ausführt, komplexen Code erklärt und git-Workflows übernimmt – alles über natürliche Sprachbefehle.
  es: Claude Code es una herramienta de programación agéntica que vive en tu terminal, entiende tu base de código y te ayuda a programar más rápido ejecutando tareas rutinarias, explicando código complejo y gestionando flujos de trabajo de git, todo ello mediante comandos en lenguaje natural.
  fr: Claude Code est un outil de codage agentique qui réside dans votre terminal, comprend votre base de code et vous aide à coder plus vite en exécutant les tâches routinières, en expliquant le code complexe et en gérant les flux de travail git, le tout via des commandes en langage naturel.
  id: Claude Code adalah alat pengodean agenik yang berjalan di terminal Anda, memahami basis kode Anda, dan membantu Anda mengode lebih cepat dengan menjalankan tugas rutin, menjelaskan kode kompleks, serta menangani alur kerja git - semuanya melalui perintah bahasa alami.
  it: Claude Code è un tool di coding agentico che vive nel tuo terminale, comprende la tua codebase e ti aiuta a programmare più velocemente eseguendo attività di routine, spiegando codice complesso e gestendo i flussi di lavoro git, il tutto tramite comandi in linguaggio naturale.
  ja: Claude Code はターミナル内で動作するエージェント型コーディングツールで、コードベースを理解し、日常的な作業の実行、複雑なコードの説明、git ワークフローの対応を通じて、より速くコードを書けるよう支援します。すべて自然言語のコマンドで行えます。
  ko: Claude Code는 터미널에서 동작하는 에이전트형 코딩 도구로, 코드베이스를 이해하고 일상적인 작업 실행, 복잡한 코드 설명, git 워크플로 처리를 통해 더 빠르게 코드를 작성하도록 도와줍니다. 모두 자연어 명령으로 이루어집니다.
  pl: Claude Code to agentyczne narzędzie do kodowania, które działa w Twoim terminalu, rozumie Twoją bazę kodu i pomaga szybciej programować, wykonując rutynowe zadania, wyjaśniając złożony kod i obsługując przepływy pracy git - wszystko za pomocą poleceń w języku naturalnym.
  pt: O Claude Code é uma ferramenta de programação agêntica que vive no seu terminal, entende sua base de código e ajuda você a codar mais rápido executando tarefas rotineiras, explicando código complexo e lidando com fluxos de trabalho do git - tudo por meio de comandos em linguagem natural.
  ro: Claude Code este un instrument de codare agentic care rulește în terminalul dumneavoastră, înțelege baza de cod și vă ajută să codificați mai rapid prin executarea sarcinilor de rutină, explicarea codului complex și gestionarea fluxurilor de lucru git - toate prin comenzi în limbaj natural.
  ru: Claude Code — агентный инструмент для программирования, работающий в вашем терминале, который понимает вашу кодовую базу и помогает писать код быстрее, выполняя рутинные задачи, объясняя сложный код и обрабатывая рабочие процессы git — всё с помощью команд на естественном языке.
  th: Claude Code คือเครื่องมือเขียนโค้ดแบบเอเจนต์ที่ทำงานอยู่ในเทอร์มินัลของคุณ เข้าใจ codebase ของคุณ และช่วยให้เขียนโค้ดได้เร็วขึ้นด้วยการทำงานทั่วไป อธิบายโค้ดที่ซับซ้อน และจัดการเวิร์กโฟลว์ของ git - ทั้งหมดผ่านคำสั่งภาษาธรรมชาติ
  tr: Claude Code, terminalinizde çalışan, kod tabanınızı anlayan ve rutin görevleri yürüterek, karmaşık kodu açıklayarak ve git iş akışlarını yöneterek daha hızlı kod yazmanıza yardımcı olan ajan tabanlı bir kodlama aracıdır - hepsi doğal dil komutlarıyla.
  uk: Claude Code — агентний інструмент для програмування, що працює у вашому терміналі, розуміє вашу кодову базу і допомагає писати код швидше, виконуючи рутинні завдання, пояснюючи складний код і обробляючи робочі процеси git — усе командами природною мовою.
  vi: Claude Code là công cụ lập trình dạng agent hoạt động trong terminal của bạn, hiểu codebase của bạn và giúp bạn viết code nhanh hơn bằng cách thực hiện các tác vụ thường nhật, giải thích code phức tạp và xử lý quy trình git - tất cả qua các lệnh ngôn ngữ tự nhiên.
x:
  source: https://github.com/anthropics/claude-code
  eget: anthropics/claude-code
  winget: Anthropic.ClaudeCode
  yay: claude-code
  npm: "@anthropic-ai/claude-code"
rule:
  /x:
    cmd: x pkg use claude-code
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget anthropics/claude-code
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://claude.ai/install.sh | bash
    reference: https://docs.claude.com/en/docs/claude-code/quickstart#native-install
  darwin/brew:
    cmd: brew install --cask claude-code
    reference: https://docs.claude.com/en/docs/claude-code/quickstart
  win/powershell:
    cmd: x pwsh 'irm https://claude.ai/install.ps1 | iex'
    reference: https://docs.claude.com/en/docs/claude-code/quickstart#native-install
  win/winget:
    cmd: x winget install Anthropic.ClaudeCode
    reference: https://code.claude.com/docs/en/quickstart#winget
  /npm:
    cmd: npm install -g @anthropic-ai/claude-code
    reference: https://github.com/anthropics/claude-code?tab=readme-ov-file#get-started
    dsnap: '@anthropic-ai/claude-code'
  arch/yay:
    cmd: yay -S claude-code
    reference: https://aur.archlinux.org/packages/claude-code
binlist:
- claude

