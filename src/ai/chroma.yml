lang: 'Rust'
homepage: https://github.com/chroma-core/chroma
license: 'Apache-2.0'
desc:
  cn: 面向 AI 的搜索基础设施
  en: 'Search infrastructure for AI'
x:
  source: https://github.com/chroma-core/chroma
  eget: https://github.com/chroma-core/chroma
rule:
  /eget:
    cmd: x eget chroma-core/chroma
    reference: https://github.com/chroma-core/chroma
binlist:
  - 'chroma'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 约 16 MB（估算）
            en: ~16 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
