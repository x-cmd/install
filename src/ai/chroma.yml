lang: 'Rust'
homepage: https://github.com/chroma-core/chroma
license: 'Apache-2.0'
desc:
  cn: 面向 AI 的搜索基础设施
  en: 'Search infrastructure for AI'
x:
  source: https://github.com/chroma-core/chroma
  eget: https://github.com/chroma-core/chroma
rule:
  /eget:
    cmd: x eget chroma-core/chroma
    reference: https://github.com/chroma-core/chroma
binlist:
  - 'chroma'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
