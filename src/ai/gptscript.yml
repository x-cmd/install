lang: Go
homepage: https://github.com/gptscript-ai/gptscript
license: Apache-2.0
desc:
  cn: GPTScript 是一种新的脚本语言，可自动与大型语言模型 (LLM)（即 OpenAI）进行交互
  en: GPTScript is a new scripting language to automate your interaction with a Large Language Model (LLM), namely OpenAI
x:
  pkg:
    exist: true
  source: https://github.com/gptscript-ai/gptscript
  eget: https://github.com/gptscript-ai/gptscript
rule:
  /x:
    cmd: x pkg use gptscript
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget gptscript-ai/gptscript
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install gptscript-ai/tap/gptscript
    reference: https://github.com/gptscript-ai/gptscript?tab=readme-ov-file#homebrew-macos-and-linux
  linux/brew:
    cmd: brew install gptscript-ai/tap/gptscript
    reference: https://github.com/gptscript-ai/gptscript?tab=readme-ov-file#homebrew-macos-and-linux
  /curl:
    cmd: curl https://get.gptscript.ai/install.sh | sh
    reference: https://github.com/gptscript-ai/gptscript?tab=readme-ov-file#install-script-macos-and-linux
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install gptscript
    reference: https://github.com/gptscript-ai/gptscript?tab=readme-ov-file#scoop-windows
  (win|wsl2)/winget:
    cmd: x winget install gptscript-ai.gptscript
    reference: https://github.com/gptscript-ai/gptscript?tab=readme-ov-file#winget-windows
  arch/yay:
    cmd: yay -S gptscript
    reference: https://aur.archlinux.org/packages/gptscript
binlist:
- gptscript

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.7 MB
          rating: 1
          desc:
            cn: 约 1.7 MB（估算）
            en: ~1.7 MB estimated
        download:
          estimate: 16 MB
          desc:
            cn: 约 16 MB 下载 (linux/x64)
            en: ~16 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
