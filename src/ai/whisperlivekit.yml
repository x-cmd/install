lang: Python
homepage: https://github.com/QuentinFuxa/WhisperLiveKit
license: Apache-2.0
desc:
  cn: 超低延迟、自托管的语音转文本功能，并且能够区分音频中不同说话人
  en: Ultra-low-latency, self-hosted speech-to-text with speaker identification
x:
  source: https://github.com/QuentinFuxa/WhisperLiveKit
  yay: whisperlivekit
  pip: whisperlivekit
rule:
  /pip:
    cmd: pip install whisperlivekit
    reference: https://github.com/QuentinFuxa/WhisperLiveKit#installation
    dsnap: whisperlivekit
  arch/yay:
    cmd: yay -S whisperlivekit
    reference: https://aur.archlinux.org/packages/whisperlivekit
binlist:
  - wlk
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 74 KB
          rating: 1
          desc:
            cn: 约 74 KB（估算）
            en: ~74 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
