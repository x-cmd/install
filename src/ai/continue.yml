lang: TypeScript
homepage: https://github.com/continuedev/continue
license: apache-2.0
desc:
  cn: 开源编码智能体
  en: open-source coding agent
x:
  source: https://github.com/continuedev/continue
  eget: https://github.com/continuedev/continue
rule:
  /eget:
    cmd: x eget continuedev/continue
    reference: https://github.com/continuedev/continue
binlist:
- continue

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
