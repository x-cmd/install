lang: TypeScript
homepage: https://github.com/continuedev/continue
license: apache-2.0
desc:
  cn: 开源编码智能体
  en: open-source coding agent
x:
  source: https://github.com/continuedev/continue
  eget: https://github.com/continuedev/continue
rule:
  /eget:
    cmd: x eget continuedev/continue
    reference: https://github.com/continuedev/continue
binlist:
- continue

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 415 KB
          rating: 1
          desc:
            cn: 约 415 KB（估算）
            en: ~415 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
