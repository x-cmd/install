lang: TypeScript
homepage: https://github.com/withcatai/catai
license: MIT
desc:
  cn: Llama 模型的聊天 UI 和本地 API
  en: Chat UI and Local API for the Llama models
x:
  pkg:
    exist: true
  source: https://github.com/withcatai/catai
rule:
  /x:
    cmd: x pkg use catai
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g catai
    reference: https://github.com/withcatai/catai?tab=readme-ov-file#installation--use
    dsnap: catai
binlist:
- catai

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
