lang: TypeScript
homepage: https://github.com/withcatai/catai
license: MIT
desc:
  cn: Llama 模型的聊天 UI 和本地 API
  en: Chat UI and Local API for the Llama models
x:
  source: https://github.com/withcatai/catai
  npm: catai
rule:
  /x:
    cmd: x pkg use catai
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g catai
    reference: https://github.com/withcatai/catai?tab=readme-ov-file#installation--use
    dsnap: catai
binlist:
- catai

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 KB
          rating: 1
          desc:
            cn: 约 10 KB（估算）
            en: ~10 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
