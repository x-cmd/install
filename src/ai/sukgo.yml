lang: Python
homepage: https://github.com/reallygood83/sukgo
license: other
desc:
  cn: 决策的艺术 CLI：汇聚 Claude Pro、ChatGPT Plus、Gemini，通过比较、综合、圆桌讨论帮你更深入地思考
  en: 🧙 sukgo (숙고) — 결정의 기술 CLI. Claude Pro·ChatGPT Plus·Gemini를 한 자리에 모아 비교·종합·원탁토론으로 더 깊이 사고하게 도와주는 한국어 의사결정 도구.
  cs: "CLI umění rozhodování: sdružuje Claude Pro, ChatGPT Plus a Gemini, aby vám pomohl hlouběji uvažovat díky porovnávání, syntéze a panelové diskusi."
  de: "CLI der Entscheidungskunst: vereint Claude Pro, ChatGPT Plus und Gemini und hilft Ihnen mit Vergleich, Synthese und Roundtable-Diskussionen tiefer zu denken."
  es: "CLI del arte de decidir: reúne Claude Pro, ChatGPT Plus y Gemini para ayudarte a pensar más a fondo mediante comparación, síntesis y discusión de mesa redonda."
  fr: "CLI de l'art de décider : réunit Claude Pro, ChatGPT Plus et Gemini pour vous aider à réfléchir plus profondément par la comparaison, la synthèse et les tables rondes."
  id: "CLI seni keputusan: menyatukan Claude Pro, ChatGPT Plus, dan Gemini untuk membantu Anda berpikir lebih mendalam lewat perbandingan, sintesis, dan diskusi meja bundar."
  it: "CLI dell'arte di decidere: riunisce Claude Pro, ChatGPT Plus e Gemini per aiutarti a pensare più in profondità tramite confronto, sintesi e tavole rotonde."
  ja: "意思決定的艺术 CLI: Claude Pro、ChatGPT Plus、Gemini を一箇所に集め、比較・総合・円卓ディスカッションでより深く考える手助けをします。"
  ko: "의사결정의 기술 CLI: Claude Pro, ChatGPT Plus, Gemini를 한곳에 모아 비교·종합·원탁 토론으로 더 깊이 생각할 수 있게 도와줍니다."
  pl: "CLI sztuki decyzji: łączy Claude Pro, ChatGPT Plus i Gemini, pomagając Ci myśleć głębiej dzięki porównywaniu, syntezie i dyskusjom okrągłego stołu."
  pt: "CLI da arte de decidir: reúne Claude Pro, ChatGPT Plus e Gemini para ajudá-lo a pensar mais fundo por meio de comparação, síntese e discussões em mesa-redonda."
  ro: "CLI pentru arta deciziei: reunește Claude Pro, ChatGPT Plus și Gemini, ajutându-vă să gândiți mai profund prin comparare, sinteză și dezbateri la masă rotundă."
  ru: "CLI «Искусство решать»: объединяет Claude Pro, ChatGPT Plus и Gemini, помогая вам глубже размышлять с помощью сравнения, синтеза и круглых обсуждений."
  th: "CLI ศิลปะการตัดสินใจ: รวม Claude Pro, ChatGPT Plus และ Gemini ไว้ที่เดียว ให้คิดลึกซึ้งขึ้นผ่านการเปรียบเทียบ สังเคราะห์ และการอภิปรายโต๊ะกลม"
  tr: "Karar verme sanatı CLI: Claude Pro, ChatGPT Plus ve Gemini'yi bir araya getirerek karşılaştırma, sentez ve roundtable tartışmalarıyla daha derin düşünmenize yardımcı olur."
  uk: "CLI «Мистецтво ухвалювати рішення»: об'єднує Claude Pro, ChatGPT Plus і Gemini, допомагаючи вам думати глибше завдяки порівнянню, синтезу та круглим обговоренням."
  vi: "CLI nghệ thuật ra quyết định: gom Claude Pro, ChatGPT Plus và Gemini lại, giúp bạn suy nghĩ sâu hơn qua so sánh, tổng hợp và thảo luận vòng tròn."
