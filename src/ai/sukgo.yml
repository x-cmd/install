lang: Python
homepage: https://github.com/reallygood83/sukgo
license: other
desc:
  cn: 决策的艺术 CLI：汇聚 Claude Pro、ChatGPT Plus、Gemini，通过比较、综合、圆桌讨论帮你更深入地思考
  en: 🧙 sukgo (숙고) — 결정의 기술 CLI. Claude Pro·ChatGPT Plus·Gemini를 한 자리에 모아 비교·종합·원탁토론으로 더 깊이 사고하게 도와주는 한국어 의사결정 도구.
x:
  source: https://github.com/reallygood83/sukgo
  eget: https://github.com/reallygood83/sukgo
rule:
  /eget:
    cmd: x eget reallygood83/sukgo
    reference: https://github.com/reallygood83/sukgo
binlist:
- sukgo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
