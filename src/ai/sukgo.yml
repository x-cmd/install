lang: Python
homepage: https://github.com/reallygood83/sukgo
license: other
desc:
  cn: 决策的艺术 CLI：汇聚 Claude Pro、ChatGPT Plus、Gemini，通过比较、综合、圆桌讨论帮你更深入地思考
  en: 🧙 sukgo (숙고) — 결정의 기술 CLI. Claude Pro·ChatGPT Plus·Gemini를 한 자리에 모아 비교·종합·원탁토론으로 더 깊이 사고하게 도와주는 한국어 의사결정 도구.
x:
  source: https://github.com/reallygood83/sukgo
  eget: https://github.com/reallygood83/sukgo
rule:
  /eget:
    cmd: x eget reallygood83/sukgo
    reference: https://github.com/reallygood83/sukgo
binlist:
- sukgo

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
