lang: Java
homepage: https://github.com/LaurieWired/GhidraMCP
license: apache-2.0
desc:
  cn: Ghidra 的 MCP Server
  en: MCP Server for Ghidra
x:
  source: https://github.com/LaurieWired/GhidraMCP
  eget: LaurieWired/GhidraMCP
rule:
  /eget:
    cmd: x eget LaurieWired/GhidraMCP
    reference: https://github.com/LaurieWired/GhidraMCP
binlist:
- GhidraMCP

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 KB
          rating: 1
          desc:
            cn: 约 30 KB（估算）
            en: ~30 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
