lang: Java
homepage: https://github.com/LaurieWired/GhidraMCP
license: apache-2.0
desc:
  cn: Ghidra 的 MCP Server
  en: MCP Server for Ghidra
x:
  source: https://github.com/LaurieWired/GhidraMCP
  eget: https://github.com/LaurieWired/GhidraMCP
rule:
  /eget:
    cmd: x eget LaurieWired/GhidraMCP
    reference: https://github.com/LaurieWired/GhidraMCP
binlist:
- GhidraMCP

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
