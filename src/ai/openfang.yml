lang: Rust
homepage: https://github.com/RightNow-AI/openfang
license: apache-2.0
desc:
  cn: 按计划运行自主 Agent，执行研究、线索生成、社交媒体管理等持续性任务
  en: Run autonomous agents on schedules to perform continuous tasks like research, lead generation, and social media management.
x:
  source: https://github.com/RightNow-AI/openfang
  eget: https://github.com/RightNow-AI/openfang
rule:
  /eget:
    cmd: x eget RightNow-AI/openfang
    reference: https://github.com/RightNow-AI/openfang
binlist:
- openfang

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 MB
          rating: 2
          desc:
            cn: 安装 25 MB
            en: 25 MB install
        download:
          estimate: 25 MB
          desc:
            cn: 约 25 MB 下载 (linux/x64)
            en: ~25 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
