lang: TypeScript
homepage: https://github.com/siteboon/claudecodeui
license: agpl-3.0
desc:
  cn: 通过 CloudCLI（即 Claude Code UI）在移动端和网页端使用 Claude Code、OpenCode、Cursor CLI 与 Codex 的开源 WebUI
  en: Use Claude Code, OpenCode, Cursor CLI, and Codex on mobile and web with CloudCLI (aka Claude Code UI). CloudCLI is a free open source webui/GUI that helps you manage your Claude Code session and pr...
x:
  source: https://github.com/siteboon/claudecodeui
  eget: https://github.com/siteboon/claudecodeui
rule:
  /eget:
    cmd: x eget siteboon/claudecodeui
    reference: https://github.com/siteboon/claudecodeui
binlist:
- claudecodeui

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 183 KB
          rating: 1
          desc:
            cn: 约 183 KB（估算）
            en: ~183 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
