lang: Python
homepage: https://github.com/zakirkun/guardian-cli
license: other
desc:
  cn: 基于 Google Gemini 与 LangChain 的生产级 AI 渗透测试自动化 CLI
  en: Guardian is a production-ready AI-powered penetration testing automation CLI tool that leverages Google Gemini and LangChain to orchestrate intelligent, step-by-step penetration testing workflows w...
x:
  source: https://github.com/zakirkun/guardian-cli
  eget: https://github.com/zakirkun/guardian-cli
rule:
  /eget:
    cmd: x eget zakirkun/guardian-cli
    reference: https://github.com/zakirkun/guardian-cli
binlist:
- guardian-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 34 KB
          rating: 1
          desc:
            cn: 约 34 KB（估算）
            en: ~34 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
