lang: Python
homepage: https://github.com/zakirkun/guardian-cli
license: other
desc:
  cn: 基于 Google Gemini 与 LangChain 的生产级 AI 渗透测试自动化 CLI
  en: Guardian is a production-ready AI-powered penetration testing automation CLI tool that leverages Google Gemini and LangChain to orchestrate intelligent, step-by-step penetration testing workflows w...
  cs: Guardian je produkční CLI nástroj pro automatizaci penetračního testování založenou na AI, který využívá Google Gemini a LangChain k řízení inteligentních postupných pracovních postupů průnikového testování...
  de: Guardian ist ein produktionsreifes CLI-Werkzeug zur Automatisierung von Penetrationstests mit KI, das Google Gemini und LangChain nutzt, um intelligente schrittweise Penetrationstest-Workflows zu orchestrieren...
  es: Guardian es una herramienta CLI de producción para automatizar pruebas de penetración con IA que aprovecha Google Gemini y LangChain para orquestar flujos de trabajo inteligentes de pruebas de penetración paso a paso...
  fr: Guardian est un outil CLI de production pour automatiser les tests d'intrusion grâce à l'IA, qui exploite Google Gemini et LangChain pour orchestrer des flux de travail de test d'intrusion intelligents étape par étape...
  id: Guardian adalah alat CLI produksi untuk mengotomatiskan pengujian penetrasi bertenaga AI yang memanfaatkan Google Gemini dan LangChain untuk mengorkestrasi alur kerja pengujian penetrasi bertahap yang cerdas...
  it: Guardian è uno strumento CLI pronto per la produzione che automatizza il penetration testing con l'AI, sfruttando Google Gemini e LangChain per orchestrare flussi di lavoro di penetration testing intelligenti e passo dopo passo...
  ja: Guardian は AI を活用した侵入テスト自動化のための本番対応 CLI ツールで、Google Gemini と LangChain を用いて知的な段階的侵入テストワークフローを编排します。
  ko: Guardian는 Google Gemini와 LangChain를 활용하여 지능적인 단계별 침투 테스트 워크플로를 조율하는 AI 기반 침투 테스트 자동화 CLI 도구입니다.
  pl: Guardian to gotowy do produkcji narzędzie CLI do automatyzacji testów penetracyjnych opartej na AI, wykorzystujące Google Gemini i LangChain do orkiestracji inteligentnych, etapowych przepływów testów penetracyjnych...
  pt: Guardian é uma ferramenta CLI pronta para produção que automatiza testes de penetração com IA, usando Google Gemini e LangChain para orquestrar fluxos de trabalho de teste de penetração inteligentes e passo a passo...
  ro: Guardian este un instrument CLI gata de producție pentru automatizarea testelor de penetrare bazate pe AI, care folosește Google Gemini și LangChain pentru a orchestra fluxuri de lucru de testare a penetrării inteligente, pas cu pas...
  ru: Guardian — готовый к промышленной эксплуатации CLI-инструмент для автоматизации пентеста на базе ИИ, использующий Google Gemini и LangChain для оркестрации интеллектуальных пошаговых рабочих процессов пентеста...
  th: Guardian คือเครื่องมือ CLI สำหรับทดสอบการเจาะระบบด้วย AI ระดับพร้อมใช้งาน ซึ่งใช้ Google Gemini และ LangChain เพื่อประสานการทำงานแบบขั้นตอนอัจฉริยะ
  tr: Guardian, Google Gemini ve LangChain'i kullanarak akıllı, adım adım sızma testi iş akışlarını düzenleyen, üretime hazır yapay zekâ destekli sızma testi otomasyonu CLI aracıdır...
  uk: Guardian — готовий до промислової експлуатації CLI-інструмент для автоматизації пентесту на базі ШІ, що використовує Google Gemini і LangChain для оркестрації інтелектуальних покрокових робочих процесів пентесту...
  vi: Guardian là công cụ CLI sẵn sàng cho sản xuất để tự động hóa kiểm thử xâm nhập dựa trên AI, tận dụng Google Gemini và LangChain để điều phối các quy trình kiểm thử xâm nhập thông minh theo từng bước...
x:
  source: https://github.com/zakirkun/guardian-cli
  eget: zakirkun/guardian-cli
rule:
  /eget:
    cmd: x eget zakirkun/guardian-cli
    reference: https://github.com/zakirkun/guardian-cli
binlist:
- guardian-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 34 KB
          rating: 1
          desc:
            cn: 约 34 KB（估算）
            en: ~34 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
