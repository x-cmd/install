lang: 'TypeScript'
homepage: 'https://github.com/cemalturkcan/opencode-anthropic-login-via-cli'
license: noassertion
desc:
  cn: 让你用 Claude Pro/Max 订阅调用 Anthropic 模型的 OpenCode 插件
  en: 'OpenCode plugin for using Anthropic models with your Claude Pro/Max subscription'
x:
  source: https://github.com/cemalturkcan/opencode-anthropic-login-via-cli
  eget: https://github.com/cemalturkcan/opencode-anthropic-login-via-cli
rule:
  /eget:
    cmd: x eget cemalturkcan/opencode-anthropic-login-via-cli
    reference: https://github.com/cemalturkcan/opencode-anthropic-login-via-cli
binlist:
  - 'opencode-anthropic-login-via-cli'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
