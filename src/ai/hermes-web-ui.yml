lang: TypeScript
homepage: https://github.com/EKKOLearnAI/hermes-web-ui
license: noassertion
desc:
  cn: 部署自托管 Web 仪表板管理 Hermes Agent 聊天会话、配置渠道、监控用量与调度任务
  en: Deploy a self-hosted web dashboard to manage Hermes Agent chat sessions, configure channels, monitor usage, and schedule jobs.
x:
  source: https://github.com/EKKOLearnAI/hermes-web-ui
rule:
  /npm:
    cmd: npm install -g hermes-web-ui
    reference: https://github.com/EKKOLearnAI/hermes-web-ui#-npm
    dsnap: hermes-web-ui
binlist:
- hermes-web-ui

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 787 KB
          rating: 1
          desc:
            cn: 约 787 KB（估算）
            en: ~787 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
