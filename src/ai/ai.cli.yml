lang: 'C++'
homepage: 'https://github.com/shediao/ai.cli'
license: noassertion
desc:
  cn: 支持多供应商、工具调用、流式输出与视觉输入的 AI 驱动 CLI 聊天机器人，基于 C++20
  en: '🤖 AI-powered CLI chatbot with multi-provider support, tool-calling capabilities, streaming output, and vision input. Built in C++20.'
x:
  source: https://github.com/shediao/ai.cli
  eget: https://github.com/shediao/ai.cli
rule:
  /eget:
    cmd: x eget shediao/ai.cli
    reference: https://github.com/shediao/ai.cli
binlist:
  - 'ai.cli'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
