lang: 'C++'
homepage: 'https://github.com/shediao/ai.cli'
license: noassertion
desc:
  cn: 支持多供应商、工具调用、流式输出与视觉输入的 AI 驱动 CLI 聊天机器人，基于 C++20
  en: '🤖 AI-powered CLI chatbot with multi-provider support, tool-calling capabilities, streaming output, and vision input. Built in C++20.'
x:
  source: https://github.com/shediao/ai.cli
  eget: https://github.com/shediao/ai.cli
rule:
  /eget:
    cmd: x eget shediao/ai.cli
    reference: https://github.com/shediao/ai.cli
binlist:
- 'ai.cli'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.1 MB
          rating: 1
          desc:
            cn: 约 1.1 MB（估算）
            en: ~1.1 MB estimated
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (macos/arm64)
            en: ~1 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
