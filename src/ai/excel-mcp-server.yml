lang: Python
homepage: https://github.com/haris-musa/excel-mcp-server
license: mit
desc:
  cn: 用于操作 Excel 文件的 MCP 服务器
  en: A Model Context Protocol server for Excel file manipulation
x:
  source: https://github.com/haris-musa/excel-mcp-server
rule:
  /pip:
    cmd: pip install excel-mcp-server
    reference: https://pypi.org/project/excel-mcp-server/
    dsnap: excel-mcp-server
binlist:
- excel-mcp-server

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
