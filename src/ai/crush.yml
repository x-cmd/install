lang: Go
homepage: https://github.com/charmbracelet/crush
license: FSL-1.1-MIT
desc:
  cn: 由 Charm 团队提供的终端的 AI 编码代理
  en: AI encoding agent for terminals provided by the Charm team
  cs: AI kódující agent pro terminály od týmu Charm
  de: KI-Coding-Agent für Terminals vom Charm-Team
  es: Agente de codificación con IA para terminales proporcionado por el equipo de Charm
  fr: Agent de code IA pour les terminaux, fourni par l'équipe Charm
  id: Agen coding AI untuk terminal dari tim Charm
  it: Agente di codifica IA per terminali fornito dal team Charm
  ja: Charm チームによるターミナル向け AI コーディングエージェント
  ko: Charm 팀이 제공하는 터미널용 AI 코딩 에이전트
  pl: Agent programistyczny AI dla terminali dostarczony przez zespół Charm
  pt: Agente de codificação com IA para terminais, fornecido pela equipe Charm
  ro: Agent de cod AI pentru terminale, oferit de echipa Charm
  ru: ИИ-агент для программирования в терминале от команды Charm
  th: เอเจนต์เขียนโค้ดด้วย AI สำหรับเทอร์มินัลจากทีม Charm
  tr: Charm ekibinden terminal için AI kodlama ajanı
  uk: ІІ-агент для програмування в терміналі від команди Charm
  vi: Tác nhân lập trình AI cho terminal do đội ngũ Charm cung cấp
x:
  source: https://github.com/charmbracelet/crush
  eget: charmbracelet/crush
  brew: charmbracelet/tap/crush
  yay: crush-bin
  npm: "@charmland/crush"
  go: github.com/charmbracelet/crush@latest
rule:
  /x:
    cmd: x pkg use crush
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget charmbracelet/crush
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install charmbracelet/tap/crush
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
  /npm:
    cmd: npm install -g @charmland/crush
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
    dsnap: '@charmland/crush'
  arch/yay:
    cmd: yay -S crush-bin
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
  nix/nix:
    cmd: nix run github:numtide/nix-ai-tools#crush
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/charmbracelet/crush@latest
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
    dsnap: github.com/charmbracelet/crush@latest
binlist:
- crush

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 90 MB
          rating: 3
          desc:
            cn: 安装 90 MB
            en: 90 MB install
        download:
          estimate: 27 MB
          desc:
            cn: 约 27 MB 下载 (linux/x64)
            en: ~27 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 70 MB
        desc:
          cn: 70 MB
          en: 70 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
