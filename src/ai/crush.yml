lang: Go
homepage: https://github.com/charmbracelet/crush
license: FSL-1.1-MIT
desc:
  cn: 由 Charm 团队提供的终端的 AI 编码代理
  en: AI encoding agent for terminals provided by the Charm team
x:
  pkg:
    exist: true
  source: https://github.com/charmbracelet/crush
  eget: https://github.com/charmbracelet/crush
rule:
  /x:
    cmd: x pkg use crush
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget charmbracelet/crush
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install charmbracelet/tap/crush
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
  /npm:
    cmd: npm install -g @charmland/crush
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
    dsnap: '@charmland/crush'
  arch/yay:
    cmd: yay -S crush-bin
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
  nix/nix:
    cmd: nix run github:numtide/nix-ai-tools#crush
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/charmbracelet/crush@latest
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
    dsnap: github.com/charmbracelet/crush@latest
binlist:
- crush

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 90 MB
          rating: 3
          desc:
            cn: 安装 90 MB
            en: 90 MB install
        download:
          estimate: 27 MB
          desc:
            cn: 约 27 MB 下载 (linux/x64)
            en: ~27 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 70 MB
        desc:
          cn: 70 MB
          en: 70 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
