lang: Go
homepage: https://github.com/charmbracelet/crush
license: FSL-1.1-MIT
desc:
  cn: 由 Charm 团队提供的终端的 AI 编码代理
  en: AI encoding agent for terminals provided by the Charm team
x:
  pkg:
    exist: true
  source: https://github.com/charmbracelet/crush
  eget: https://github.com/charmbracelet/crush
rule:
  /x:
    cmd: x pkg use crush
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget charmbracelet/crush
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install charmbracelet/tap/crush
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
  /npm:
    cmd: npm install -g @charmland/crush
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
    dsnap: '@charmland/crush'
  arch/yay:
    cmd: yay -S crush-bin
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
  nix/nix:
    cmd: nix run github:numtide/nix-ai-tools#crush
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/charmbracelet/crush@latest
    reference: https://github.com/charmbracelet/crush?tab=readme-ov-file#installation
    dsnap: github.com/charmbracelet/crush@latest
binlist:
  - crush

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
