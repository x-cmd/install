lang: Rust
homepage: https://github.com/Kuberwastaken/claurst
license: gpl-3.0
desc:
  cn: 面向交付型开发者的智能体编码工具
  en: Agentic Coding for Builders who Ship
x:
  source: https://github.com/Kuberwastaken/claurst
  eget: https://github.com/Kuberwastaken/claurst
rule:
  /eget:
    cmd: x eget Kuberwastaken/claurst
    reference: https://github.com/Kuberwastaken/claurst
binlist:
- claurst

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.6 MB
          rating: 1
          desc:
            cn: 约 5.6 MB（估算）
            en: ~5.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
