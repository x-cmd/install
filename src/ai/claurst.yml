lang: Rust
homepage: https://github.com/Kuberwastaken/claurst
license: gpl-3.0
desc:
  cn: 面向交付型开发者的智能体编码工具
  en: Agentic Coding for Builders who Ship
  cs: Agentiční kódování pro vývojáře, kteří doručují výsledky.
  de: Agentisches Programmieren für Entwickler, die liefern.
  es: Programación agéntica para desarrolladores que entregan.
  fr: Programmation agentique pour les développeurs qui livrent.
  id: Pemrograman agentik untuk pengembang yang menghasilkan karya.
  it: Programmazione agentica per sviluppatori che rilasciano.
  ja: 成果产出型開発者のためのエージェント型コーディング。
  ko: 결과물을 완성하는 개발자를 위한 에이전틱 코딩.
  pl: Programowanie agentowe dla deweloperów, którzy dostarczają.
  pt: Programação agêntica para desenvolvedores que entregam.
  ro: Programare agentică pentru dezvoltatori care livrează.
  ru: Агентное программирование для разработчиков, которые выпускают продукты.
  th: การเขียนโค้ดแบบเอเจนต์สำหรับนักพัฒนาที่ส่งมอบผลงาน
  tr: Ürün çıkaran geliştiriciler için ajan tabanlı kodlama.
  uk: Агентне програмування для розробників, які випускають продукти.
  vi: Lập trình dạng tác nhân dành cho các nhà phát triển giao sản phẩm.
x:
  source: https://github.com/Kuberwastaken/claurst
  eget: Kuberwastaken/claurst
rule:
  /eget:
    cmd: x eget Kuberwastaken/claurst
    reference: https://github.com/Kuberwastaken/claurst
binlist:
- claurst

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 5.6 MB
          rating: 1
          desc:
            cn: 约 5.6 MB（估算）
            en: ~5.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
