lang: Python
homepage: https://github.com/PaddlePaddle/PaddleOCR
license: apache-2.0
desc:
  cn: 从图片和 PDF 中提取结构化文本、表格和公式，使其适配 LLM 处理
  en: Extracts structured text, tables, and formulas from images and PDF documents to make them LLM-ready.
x:
  source: https://github.com/PaddlePaddle/PaddleOCR
rule:
  /pip:
    cmd: pip install paddleocr
    reference: https://github.com/PaddlePaddle/PaddleOCR
    dsnap: paddleocr
binlist:
- paddleocr

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
