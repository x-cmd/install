lang: Python
homepage: https://github.com/cobanov/websum
license: mit
desc:
  cn: 用可插拔的 LLM 后端（Ollama、OpenAI）总结网页和 YouTube 视频，提供 CLI、库与 Gradio 界面
  en: Summarize web pages and YouTube videos with pluggable LLM backends (Ollama, OpenAI). CLI, library, and Gradio UI.
x:
  source: https://github.com/cobanov/websum
rule:
  /pip:
    cmd: pip install websum
    reference: https://pypi.org/project/websum/
    dsnap: websum
binlist:
- websum

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
