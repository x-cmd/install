lang: Python
homepage: https://github.com/hummingbot/hummingbot
license: apache-2.0
desc:
  cn: 为中心和去中心化加密货币交易所构建并部署自动化交易机器人
  en: Builds and deploys automated trading bots for centralized and decentralized cryptocurrency exchanges.
x:
  source: https://github.com/hummingbot/hummingbot
  eget: https://github.com/hummingbot/hummingbot
rule:
  /eget:
    cmd: x eget hummingbot/hummingbot
    reference: https://github.com/hummingbot/hummingbot
binlist:
- hummingbot

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
