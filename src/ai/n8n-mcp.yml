lang: TypeScript
homepage: https://github.com/czlonkowski/n8n-mcp
license: mit
desc:
  cn: 把 n8n 全量节点库（816 核心 + 1029 社区）、操作、2352 个模板与工作流管理 API 暴露给 AI 助手的 MCP 服务器，支持检索、校验、生成和部署 n8n 工作流。
  en: MCP server that exposes n8n's full node library (816 core + 1029 community), operations, 2352 templates, and workflow management API to AI assistants for searching, validating, generating, and deploying n8n workflows.
x:
  source: https://github.com/czlonkowski/n8n-mcp
rule:
  /npm:
    cmd: npx n8n-mcp
    reference: https://github.com/czlonkowski/n8n-mcp
    dsnap: n8n-mcp
binlist:
- n8n-mcp

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
