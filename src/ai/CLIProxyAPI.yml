lang: Go
homepage: https://github.com/router-for-me/CLIProxyAPI
license: mit
desc:
  cn: 将 Gemini CLI、Antigravity、ChatGPT Codex、Claude Code、Grok Build 封装为 OpenAI/Gemini/Claude/Codex 兼容的 API 服务
  en: Wrap Gemini CLI, Antigravity, ChatGPT Codex, Claude Code, Grok Build as an OpenAI/Gemini/Claude/Codex compatible API service, allowing you to enjoy the free Gemini 3.1 Pro, GPT 5.5, Grok 4.3, Claud...
x:
  source: https://github.com/router-for-me/CLIProxyAPI
  eget: https://github.com/router-for-me/CLIProxyAPI
rule:
  /eget:
    cmd: x eget router-for-me/CLIProxyAPI
    reference: https://github.com/router-for-me/CLIProxyAPI
binlist:
- CLIProxyAPI

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
