lang: Go
homepage: https://github.com/steipete/gifgrep
license: mit
desc:
  cn: 用 grep 的方式搜索 GIF
  en: Grep the GIF. Stick the landing.
x:
  source: https://github.com/steipete/gifgrep
  eget: https://github.com/steipete/gifgrep
rule:
  /eget:
    cmd: x eget steipete/gifgrep
    reference: https://github.com/steipete/gifgrep
binlist:
- gifgrep

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
