lang: Go
homepage: https://github.com/steipete/gifgrep
license: mit
desc:
  cn: 用 grep 的方式搜索 GIF
  en: Grep the GIF. Stick the landing.
x:
  source: https://github.com/steipete/gifgrep
  eget: https://github.com/steipete/gifgrep
rule:
  /eget:
    cmd: x eget steipete/gifgrep
    reference: https://github.com/steipete/gifgrep
binlist:
- gifgrep

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
