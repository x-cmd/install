lang: Java
homepage: https://github.com/OtterMind/Chat2DB
license: apache-2.0
desc:
  cn: AI 驱动的数据库工具与 SQL 客户端，支持 MySQL、Oracle、PostgreSQL、DB2、SQL Server、SQLite、H2、ClickHouse 等
  en: AI-driven database tool and SQL client, The hottest GUI client, supporting MySQL, Oracle, PostgreSQL, DB2, SQL Server, DB2, SQLite, H2, ClickHouse, and more.
x:
  source: https://github.com/OtterMind/Chat2DB
  eget: https://github.com/OtterMind/Chat2DB
rule:
  /eget:
    cmd: x eget OtterMind/Chat2DB
    reference: https://github.com/OtterMind/Chat2DB
binlist:
- Chat2DB

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.2 MB
          rating: 1
          desc:
            cn: 约 6.2 MB（估算）
            en: ~6.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
