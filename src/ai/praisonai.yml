lang: Python
homepage: https://github.com/MervinPraison/PraisonAI
license: mit
desc:
  cn: 用 5 行代码搭建 7x24 小时多智能体 AI 团队的 Python/YAML 框架，支持 100+ LLM、MCP 协议、深度研究、可视化编排与自反思。
  en: Build and deploy autonomous, self-improving multi-agent AI systems in 5 lines of code; Python/YAML framework with 100+ LLMs, MCP, deep research, and visual orchestration.
x:
  source: https://github.com/MervinPraison/PraisonAI
  pip: praisonai
rule:
  /pip:
    cmd: pip install praisonai
    reference: https://github.com/MervinPraison/PraisonAI
    dsnap: praisonai
binlist:
- praisonai

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2.3 MB
          rating: 1
          desc:
            cn: 约 2.3 MB（估算）
            en: ~2.3 MB estimated
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (dmg)
            en: ~2 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
