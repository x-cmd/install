lang: 'Python'
homepage: https://github.com/chopratejas/headroom
license: 'Apache-2.0'
desc:
  cn: 在工具输出、日志、文件与 RAG 片段送达 LLM 前进行压缩，节省 60-95% token
  en: 'Compress tool outputs, logs, files, and RAG chunks before they reach the LLM. 60-95% fewer tokens, same answers. Library, proxy, MCP server.'
x:
  source: https://github.com/chopratejas/headroom
  eget: https://github.com/chopratejas/headroom
rule:
  /eget:
    cmd: x eget chopratejas/headroom
    reference: https://github.com/chopratejas/headroom
binlist:
  - 'headroom'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.1 MB
          rating: 1
          desc:
            cn: 约 1.1 MB（估算）
            en: ~1.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
