lang: Python
homepage: https://github.com/llm-workflow-engine/llm-workflow-engine
license: mit
desc:
  cn: LLM 的强力 CLI 与工作流管理器（核心包）
  en: Power CLI and Workflow manager for LLMs (core package)
x:
  source: https://github.com/llm-workflow-engine/llm-workflow-engine
rule:
  /pip:
    cmd: pip install llm-workflow-engine
    reference: https://pypi.org/project/llm-workflow-engine/
    dsnap: llm-workflow-engine
binlist:
- llm-workflow-engine

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
