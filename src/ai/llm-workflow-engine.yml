x:
  source: https://github.com/llm-workflow-engine/llm-workflow-engine
  pip: llm-workflow-engine
rule:
  /pip:
    cmd: pip install llm-workflow-engine
    reference: https://pypi.org/project/llm-workflow-engine/
    dsnap: llm-workflow-engine
binlist:
- llm-workflow-engine

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 KB
          rating: 1
          desc:
            cn: 约 30 KB（估算）
            en: ~30 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
