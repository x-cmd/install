lang: Python
homepage: https://github.com/microsoft/conductor
license: mit
desc:
  cn: 基于 GitHub Copilot SDK 与 Anthropic Agents SDK 定义并运行多智能体工作流的 CLI 工具
  en: A CLI tool for defining and running multi-agent workflows with the GitHub Copilot SDK and Anthropic Agents SDK.
x:
  source: https://github.com/microsoft/conductor
  eget: https://github.com/microsoft/conductor
rule:
  /eget:
    cmd: x eget microsoft/conductor
    reference: https://github.com/microsoft/conductor
binlist:
- conductor

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (whl)
            en: ~1 MB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
