lang: JavaScript
homepage: https://github.com/DietrichGebert/ponytail
license: mit
desc:
  cn: 让你的 AI Agent 像最懒的高级工程师一样思考，最好的代码是不写的代码
  en: Makes your AI agent think like the laziest senior dev in the room. The best code is the code you never wrote.
  cs: Nechá vašeho AI agenta myslet jako nejlenivější senior vývojář v místnosti. Nejlepší kód je kód, který jste nikdy nenapsali.
  de: Lässt deinen KI-Agenten denkfauler wie der faulste Senior-Entwickler im Raum. Der beste Code ist der Code, den du nie geschrieben hast.
  es: Hace que tu agente de IA piense como el desarrollador senior más perezoso de la sala. El mejor código es el que nunca escribiste.
  fr: Fait réfléchir votre agent IA comme le développeur senior le plus paresseux de la pièce. Le meilleur code est celui que vous n'avez jamais écrit.
  id: Membuat agen AI Anda berpikir seperti pengembang senior paling malas di ruangan. Kode terbaik adalah kode yang tidak pernah Anda tulis.
  it: Faà pensare il tuo agente IA come lo sviluppatore senior più pigro della stanza. Il codice migliore è quello che non hai mai scritto.
  ja: AIエージェントをその部屋で最も怠惰シニア開発者のように考えさせます。最高のコードは書かれたことのないコードです。
  ko: AI 에이전트가 방 안 가장 게으른 시니어 개발자처럼 생각하게 합니다. 최고의 코드는 절대 작성하지 않은 코드입니다.
  pl: Sprawia, że Twój agent AI myśli jak najleniwiejszy starszy programista w pokoju. Najlepszy kod to taki, którego nigdy nie napisałeś.
  pt: Faz seu agente de IA pensar como o desenvolvedor sênior mais preguiçoso da sala. O melhor código é o código que você nunca escreveu.
  ro: Îți face agentul AI să gândească ca cel mai leneș dezvoltator senior din cameră. Cel mai bun cod este codul pe care nu l-ai scris niciodată.
  ru: Заставляет вашего ИИ-агента думать как самый ленивый старший разработчик в комнате. Лучший код — это код, который вы никогда не писали.
  th: ทำให้เอเจนต์ AI ของคุณคิดเหมือนนักพัฒนาอาวุโสที่ขี้เกียจที่สุดในห้อง โค้ดที่ดีที่สุดคือโค้ดที่คุณไม่เคยเขียน
  tr: Yapay zeka ajanınızın odadaki en tembel kıdemli geliştirici gibi düşünmesini sağlar. En iyi kod, hiç yazmadığınız koddur.
  uk: Змушує вашого AI-агента мислити як найліниший старший розробник у кімнаті. Найкращий код — це код, який ви ніколи не писали.
  vi: Giúp tác nhân AI của bạn suy nghĩ như lập trình viên cao cấp lười nhất trong phòng. Mã tốt nhất là mã bạn chưa bao giờ viết.
x:
  source: https://github.com/DietrichGebert/ponytail
  eget: DietrichGebert/ponytail
rule:
  /eget:
    cmd: x eget DietrichGebert/ponytail
    reference: https://github.com/DietrichGebert/ponytail
binlist:
- ponytail

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
