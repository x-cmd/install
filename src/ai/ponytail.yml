lang: JavaScript
homepage: https://github.com/DietrichGebert/ponytail
license: mit
desc:
  cn: 让你的 AI Agent 像最懒的高级工程师一样思考，最好的代码是不写的代码
  en: Makes your AI agent think like the laziest senior dev in the room. The best code is the code you never wrote.
x:
  source: https://github.com/DietrichGebert/ponytail
  eget: DietrichGebert/ponytail
rule:
  /eget:
    cmd: x eget DietrichGebert/ponytail
    reference: https://github.com/DietrichGebert/ponytail
binlist:
- ponytail

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
