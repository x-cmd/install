lang: JavaScript
homepage: https://github.com/DietrichGebert/ponytail
license: mit
desc:
  cn: 让你的 AI Agent 像最懒的高级工程师一样思考，最好的代码是不写的代码
  en: Makes your AI agent think like the laziest senior dev in the room. The best code is the code you never wrote.
x:
  source: https://github.com/DietrichGebert/ponytail
  eget: https://github.com/DietrichGebert/ponytail
rule:
  /eget:
    cmd: x eget DietrichGebert/ponytail
    reference: https://github.com/DietrichGebert/ponytail
binlist:
- ponytail

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
