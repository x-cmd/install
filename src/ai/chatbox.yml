lang: TypeScript
homepage: https://github.com/chatboxai/chatbox
license: gpl-3.0
desc:
  cn: 强大的 AI 客户端
  en: Powerful AI Client
x:
  source: https://github.com/chatboxai/chatbox
  eget: https://github.com/chatboxai/chatbox
rule:
  /eget:
    cmd: x eget chatboxai/chatbox
    reference: https://github.com/chatboxai/chatbox
binlist:
- chatbox

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 386 KB
          rating: 1
          desc:
            cn: 约 386 KB（估算）
            en: ~386 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
