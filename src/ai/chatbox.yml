lang: TypeScript
homepage: https://github.com/chatboxai/chatbox
license: gpl-3.0
desc:
  cn: 强大的 AI 客户端
  en: Powerful AI Client
x:
  source: https://github.com/chatboxai/chatbox
  eget: https://github.com/chatboxai/chatbox
rule:
  /eget:
    cmd: x eget chatboxai/chatbox
    reference: https://github.com/chatboxai/chatbox
binlist:
- chatbox

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
