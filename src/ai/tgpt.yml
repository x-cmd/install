lang: Go
homepage: https://github.com/aandrew-me/tgpt
license: GPL-3.0
desc:
  cn: tgpt 是一个跨平台的命令行界面（CLI）工具，允许你在终端中使用 AI 聊天机器人，无需 API 密钥。
  en: tgpt is a cross-platform command-line interface (CLI) tool that allows you to use AI chatbot in your Terminal without requiring API keys.
  cs: tgpt je multiplatformní nástroj s příkazovou řádkou (CLI), který vám umožní používat AI chatbota v terminálu bez nutnosti API klíčů.
  de: tgpt ist ein plattformübergreifendes Kommandozeilen-Tool (CLI), mit dem du einen KI-Chatbot in deinem Terminal nutzen kannst, ganz ohne API-Schlüssel.
  es: tgpt es una herramienta de interfaz de línea de comandos (CLI) multiplataforma que te permite usar un chatbot de IA en tu terminal sin necesidad de claves de API.
  fr: tgpt est un outil d'interface en ligne de commande (CLI) multiplateforme qui permet d'utiliser un chatbot IA dans votre terminal sans clés d'API.
  id: tgpt adalah alat antarmuka baris perintah (CLI) lintas platform yang memungkinkan Anda menggunakan chatbot AI di terminal tanpa memerlukan kunci API.
  it: tgpt è uno strumento a riga di comando (CLI) multipiattaforma che ti permette di usare un chatbot IA nel terminale senza richiedere chiavi API.
  ja: tgpt はクロスプラットフォームのコマンドラインインターフェース（CLI）ツールで、APIキー不要でターミナル上でAIチャットボットを利用できます。
  ko: tgpt은 API 키 없이 터미널에서 AI 챗봇을 사용할 수 있게 해주는 크로스 플랫폼 명령줄 인터페이스(CLI) 도구입니다.
  pl: tgpt to wieloplatformowe narzędzie wiersza poleceń (CLI), które pozwala korzystać z chatbotów AI w terminalu bez kluczy API.
  pt: O tgpt é uma ferramenta de interface de linha de comando (CLI) multiplataforma que permite usar um chatbot de IA no seu terminal sem precisar de chaves de API.
  ro: tgpt este un instrument de interfață în linie de comandă (CLI) multiplatformă care îți permite să folosești un chatbot AI în terminal fără chei API.
  ru: tgpt — кроссплатформенный инструмент командной строки (CLI), позволяющий использовать ИИ-чатбота в терминале без API-ключей.
  th: tgpt เป็นเครื่องมือส่วนติดต่อบรรทัดคำสั่ง (CLI) แบบข้ามแพลตฟอร์ม ที่ให้คุณใช้แชตบอต AI ในเทอร์มินัลได้โดยไม่ต้องใช้คีย์ API
  tr: tgpt, terminalde API anahtarlarına gerek kalmadan bir yapay zekâ sohbet botu kullanmanıza olanak tanıyan platformlar arası bir komut satırı arayüzü (CLI) aracıdır.
  uk: tgpt — кроссплатформний інструмент командного рядка (CLI), який дозволяє використовувати ШІ-чатбота в терміналі без ключів API.
  vi: tgpt là công cụ giao diện dòng lệnh (CLI) đa nền tảng cho phép bạn dùng chatbot AI trong terminal mà không cần khóa API.
x:
  source: https://github.com/aandrew-me/tgpt
  eget: aandrew-me/tgpt
  pacman: tgpt
  scoop: https://raw.githubusercontent.com/aandrew-me/tgpt/main/tgpt.json
  choco: tgpt
  yay: tgpt-git
  go: github.com/aandrew-me/tgpt/v2@latest
rule:
  /eget:
    cmd: x eget aandrew-me/tgpt
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sSL https://raw.githubusercontent.com/aandrew-me/tgpt/main/install | bash -s /usr/local/bin
    reference: https://github.com/aandrew-me/tgpt?tab=readme-ov-file#download-for-gnulinux--or-macos-
  arch/pacman:
    cmd: sudo pacman -S tgpt
    reference: https://github.com/aandrew-me/tgpt?tab=readme-ov-file#download-for-gnulinux--or-macos-
  freebsd/pkg:
    cmd: pkg install tgpt
    reference: https://github.com/aandrew-me/tgpt?tab=readme-ov-file#freebsd-
  /go:
    cmd: go install github.com/aandrew-me/tgpt/v2@latest
    reference: https://github.com/aandrew-me/tgpt?tab=readme-ov-file#install-with-go
    dsnap: github.com/aandrew-me/tgpt/v2@latest
  (win|wsl2)/scoop:
    cmd: x scoop install https://raw.githubusercontent.com/aandrew-me/tgpt/main/tgpt.json
    reference: https://github.com/aandrew-me/tgpt?tab=readme-ov-file#windows-
  (win|wsl2)/choco:
    cmd: x choco install tgpt
    reference: https://github.com/aandrew-me/tgpt?tab=readme-ov-file#windows-
  arch/yay:
    cmd: yay -S tgpt-git
    reference: https://aur.archlinux.org/packages/tgpt-git
binlist:
- tgpt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
