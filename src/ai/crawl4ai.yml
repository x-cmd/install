lang: Python
homepage: https://github.com/unclecode/crawl4ai
license: apache-2.0
desc:
  cn: 开源的 LLM 友好型 Web 爬虫与抓取器，把网页内容转成干净的、可直接喂给大模型的 Markdown，服务于 RAG、智能体与数据管道。
  en: Crawl and scrape websites to convert web content into clean, LLM-ready Markdown for RAG, agents, and data pipelines.
x:
  source: https://github.com/unclecode/crawl4ai
rule:
  /pip:
    cmd: pip install -U crawl4ai
    reference: https://github.com/unclecode/crawl4ai#-quick-start
    dsnap: crawl4ai
binlist:
- crwl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 221 KB
          rating: 1
          desc:
            cn: 约 221 KB（估算）
            en: ~221 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
