lang: Python
homepage: https://github.com/unclecode/crawl4ai
license: apache-2.0
desc:
  cn: 开源的 LLM 友好型 Web 爬虫与抓取器，把网页内容转成干净的、可直接喂给大模型的 Markdown，服务于 RAG、智能体与数据管道。
  en: Crawl and scrape websites to convert web content into clean, LLM-ready Markdown for RAG, agents, and data pipelines.
x:
  source: https://github.com/unclecode/crawl4ai
rule:
  /pip:
    cmd: pip install -U crawl4ai
    reference: https://github.com/unclecode/crawl4ai#-quick-start
    dsnap: crawl4ai
binlist:
- crwl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
