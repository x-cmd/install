lang: Python
homepage: https://github.com/ricklamers/shell-ai
license: mit
desc:
  cn: 基于 LangChain 的 shell 命令生成与执行 CLI
  en: LangChain powered shell command generator and runner CLI
  cs: CLI pro generování a spouštění shell příkazů založený na LangChain
  de: CLI zum Generieren und Ausführen von Shell-Befehlen auf Basis von LangChain
  es: CLI de generación y ejecución de comandos de shell basada en LangChain
  fr: CLI de génération et d'exécution de commandes shell basée sur LangChain
  id: CLI pembuat dan menjalankan perintah shell berbasis LangChain
  it: CLI per generare ed eseguire comandi shell basato su LangChain
  ja: LangChain に基づくシェルコマンド生成・実行 CLI
  ko: LangChain 기반 셸 명령 생성 및 실행 CLI
  pl: CLI do generowania i uruchamiania poleceń powłoki oparte na LangChain
  pt: CLI de geração e execução de comandos shell baseada em LangChain
  ro: CLI pentru generarea și rularea comenzilor shell bazat pe LangChain
  ru: CLI для генерации и выполнения shell-команд на базе LangChain
  th: CLI สร้างและรันคำสั่ง shell บนพื้นฐาน LangChain
  tr: LangChain tabanlı shell komutu oluşturma ve çalıştırma CLI aracı
  uk: CLI для генерації та виконання shell-команд на основі LangChain
  vi: CLI tạo và chạy lệnh shell dựa trên LangChain
x:
  source: https://github.com/ricklamers/shell-ai
  eget: ricklamers/shell-ai
rule:
  /eget:
    cmd: x eget ricklamers/shell-ai
    reference: https://github.com/ricklamers/shell-ai
binlist:
- shell-ai

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
