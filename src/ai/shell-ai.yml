lang: Python
homepage: https://github.com/ricklamers/shell-ai
license: mit
desc:
  cn: 基于 LangChain 的 shell 命令生成与执行 CLI
  en: LangChain powered shell command generator and runner CLI
x:
  source: https://github.com/ricklamers/shell-ai
  eget: https://github.com/ricklamers/shell-ai
rule:
  /eget:
    cmd: x eget ricklamers/shell-ai
    reference: https://github.com/ricklamers/shell-ai
binlist:
- shell-ai

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
