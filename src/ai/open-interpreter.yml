lang: Python
homepage: https://github.com/KillianLucas/open-interpreter
license: AGPL-3.0
desc:
  cn: OpenAI 代码解释器的一个开源的、本地运行的实现
  en: An open-source, locally running implementation of OpenAI's Code Interpreter
x:
  pkg:
    exist: true
  source: https://github.com/KillianLucas/open-interpreter
rule:
  /x:
    cmd: x pkg use open-interpreter
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install open-interpreter
    reference: https://github.com/KillianLucas/open-interpreter?tab=readme-ov-file#quick-start
    dsnap: open-interpreter
  arch/yay:
    cmd: yay -S open-interpreter-desktop-bin
    reference: https://aur.archlinux.org/packages/open-interpreter-desktop-bin
binlist:
- open-interpreter

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 216 MB
          rating: 4
          desc:
            cn: 安装 216 MB
            en: 216 MB install
        download:
          estimate: 216 MB
          desc:
            cn: 约 216 MB 下载 (linux/x64)
            en: ~216 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
