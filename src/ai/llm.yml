lang: Python
homepage: https://github.com/simonw/llm
license: Apache-2.0
desc:
  cn: 用于与大语言模型进行交互的 CLI
  en: Access large language models from the command-line
x:
  pkg:
    exist: true
  source: https://github.com/simonw/llm
rule:
  /x:
    cmd: x pkg use llm
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install llm
    reference: https://llm.datasette.io/en/stable/setup.html#installation
    dsnap: llm
  /pipx:
    cmd: pipx install llm
    reference: https://llm.datasette.io/en/stable/setup.html#installation
  darwin/brew:
    cmd: brew install llm
    reference: https://formulae.brew.sh/formula/llm#default
  arch/yay:
    cmd: yay -S llm
    reference: https://aur.archlinux.org/packages/llm

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
