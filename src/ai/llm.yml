lang: Python
homepage: https://github.com/simonw/llm
license: Apache-2.0
desc:
  cn: 用于与大语言模型进行交互的 CLI
  en: Access large language models from the command-line
  cs: Přístup k velkým jazykovým modelům z příkazové řádky
  de: Von der Kommandozeile auf große Sprachmodelle zugreifen
  es: Accede a los grandes modelos de lenguaje desde la línea de comandos
  fr: Accédez aux grands modèles de langage depuis la ligne de commande
  id: Akses model bahasa besar dari baris perintah
  it: Accedi ai grandi modelli linguistici dalla riga di comando
  ja: コマンドラインから大規模言語モデルにアクセス
  ko: 명령줄에서 대형 언어 모델에 접근
  pl: Dostęp do dużych modeli językowych z wiersza poleceń
  pt: Acesse grandes modelos de linguagem pela linha de comando
  ro: Accesați modelele mari de limbaj din linia de comandă
  ru: Доступ к большим языковым моделям из командной строки
  th: เข้าถึงโมเดลภาษาขนาดใหญ่จากบรรทัดคำสั่ง
  tr: Komut satırından büyük dil modellerine erişin
  uk: Доступ до великих мовних моделей із командного рядка
  vi: Truy cập các mô hình ngôn ngữ lớn từ dòng lệnh
x:
  source: https://github.com/simonw/llm
  brew: llm
  yay: llm
  pip: llm
rule:
  /x:
    cmd: x pkg use llm
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install llm
    reference: https://llm.datasette.io/en/stable/setup.html#installation
    dsnap: llm
  /pipx:
    cmd: pipx install llm
    reference: https://llm.datasette.io/en/stable/setup.html#installation
  darwin/brew:
    cmd: brew install llm
    reference: https://formulae.brew.sh/formula/llm#default
  arch/yay:
    cmd: yay -S llm
    reference: https://aur.archlinux.org/packages/llm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 60 KB
          rating: 1
          desc:
            cn: 约 60 KB（估算）
            en: ~60 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
