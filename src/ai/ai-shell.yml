lang: TypeScript
homepage: https://github.com/BuilderIO/ai-shell
license: mit
desc:
  cn: 将自然语言转换为 shell 命令的 CLI
  en: A CLI that converts natural language to shell commands.
x:
  source: https://github.com/BuilderIO/ai-shell
  eget: https://github.com/BuilderIO/ai-shell
rule:
  /eget:
    cmd: x eget BuilderIO/ai-shell
    reference: https://github.com/BuilderIO/ai-shell
binlist:
- ai-shell

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
