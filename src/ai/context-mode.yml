lang: TypeScript
homepage: https://github.com/mksglu/context-mode
license: noassertion
desc:
  cn: AI agent 上下文沙箱与持续会话引擎：拦截大输出工具结果、提供 11 个 MCP 工具把原始数据留在 sandbox 外，并通过 SQLite + FTS5 索引追踪会话事件实现压缩后无损恢复。
  en: AI agent context sandbox and session-continuity engine that intercepts large tool outputs, exposes 11 MCP tools to keep raw data out of the context window, and tracks session events in SQLite + FTS5 so compaction does not lose state.
  cs: Kontextní sandbox a engine pro kontinuitu relací AI agentů, který zachycuje velké výstupy nástrojů, zpřístupňuje 11 nástrojů MCP, aby surová data zůstala mimo kontextové okno, a sleduje události relací v SQLite + FTS5, takže komprese neztratí stav.
  de: Kontext-Sandbox und Engine für Sitzungskontinuität von KI-Agenten, die große Tool-Ausgaben abfängt, 11 MCP-Tools bereitstellt, um Rohdaten aus dem Kontextfenster zu halten, und Sitzungsereignisse in SQLite + FTS5 verfolgt, sodass die Verdichtung keinen Zustand verliert.
  es: Sandbox de contexto y motor de continuidad de sesión para agentes de IA que intercepta salidas grandes de herramientas, expone 11 herramientas MCP para mantener los datos sin procesar fuera de la ventana de contexto y registra los eventos de sesión en SQLite + FTS5, de modo que la compactación no pierde estado.
  fr: Bac à sable de contexte et moteur de continuité de session pour agents IA qui intercepte les sorties volumineuses des outils, expose 11 outils MCP pour garder les données brutes hors de la fenêtre de contexte et suit les événements de session dans SQLite + FTS5, afin que la compaction ne perde pas l'état.
  id: Sandbox konteks dan mesin kesinuan sesi untuk agen AI yang mencegat keluaran alat berukuran besar, menyediakan 11 alat MCP agar data mentah tetap di luar jendela konteks, dan melacak peristiwa sesi di SQLite + FTS5 sehingga pemadatan tidak kehilangan status.
  it: Sandbox di contesto e motore di continuità della sessione per agenti IA che intercetta gli output di grandi dimensioni degli strumenti, espone 11 strumenti MCP per mantenere i dati grezzi fuori dalla finestra di contesto e traccia gli eventi di sessione in SQLite + FTS5, così la compattazione non perde lo stato.
  ja: AI エージェント向けのコンテキストサンドボックスとセッション継続エンジン。大きなツール出力を横取りし、11 個の MCP ツールで生データをコンテキストウィンドウの外に保持し、SQLite + FTS5 でセッションイベントを記録するため、圧縮しても状態が失われません。
  ko: AI 에이전트를 위한 컨텍스트 샌드박스와 세션 연속성 엔진으로, 큰 도구 출력을 가로채고 11개의 MCP 도구를 제공해 원시 데이터가 컨텍스트 창 밖에 머물게 하며, SQLite + FTS5로 세션 이벤트를 추적해 압축 시에도 상태가 손실되지 않습니다.
  pl: Piaskownica kontekstu i silnik ciągłości sesji dla agentów AI, który przechwytuje duże wyjścia narzędzi, udostępnia 11 narzędzi MCP, aby surowe dane pozostały poza oknem kontekstu, i śledzi zdarzenia sesji w SQLite + FTS5, dzięki czemu kompresja nie traci stanu.
  pt: Sandbox de contexto e mecanismo de continuidade de sessão para agentes de IA que intercepta saídas grandes de ferramentas, expõe 11 ferramentas MCP para manter os dados brutos fora da janela de contexto e rastreia eventos de sessão em SQLite + FTS5, de modo que a compactação não perde o estado.
  ro: Sandbox de context și motor de continuitate a sesiunii pentru agenți AI, care interceptează ieșirile mari ale instrumentelor, expune 11 instrumente MCP pentru a păstra datele brute în afara ferestrei de context și urmărește evenimentele sesiunii în SQLite + FTS5, astfel încât compactarea nu pierde starea.
  ru: "Песочница контекста и движок непрерывности сессий для ИИ-агентов: перехватывает большие выводы инструментов, предоставляет 11 инструментов MCP, чтобы сырые данные оставались вне контекстного окна, и отслеживает события сессии в SQLite + FTS5, поэтому сжатие не теряет состояние."
  th: แซนด์บ็อกซ์บริบทและเอนจินรักษาความต่อเนื่องของเซสชันสำหรับเอเจนต์ AI ที่สกัดผลลัพธ์ขนาดใหญ่จากเครื่องมือ เปิดเผยเครื่องมือ MCP 11 ตัวเพื่อเก็บข้อมูลดิบไว้นอกหน้าต่างบริบท และติดตามเหตุการณ์เซสชันใน SQLite + FTS5 จึงไม่สูญเสียสถานะเมื่อมีการย่อ
  tr: Büyük araç çıktılarını yakalayan, ham veriyi bağlam penceresinin dışında tutmak için 11 MCP aracı sunan ve oturum olaylarını SQLite + FTS5 içinde izleyerek sıkıştırmada durum kaybını önleyen AI ajanları için bağlam sandbox'ı ve oturum süreklilik motoru.
  uk: "Пісочниця контексту та движок безперервності сесій для ІІ-агентів: перехоплює великі виводи інструментів, надає 11 інструментів MCP, щоб сирі дані залишалися поза контекстним вікном, і відстежує події сесії в SQLite + FTS5, тож стиснення не втрачає стан."
  vi: Sandbox ngữ cảnh và động cơ liên tục phiên cho tác nhân AI, chặn các kết quả công cụ lớn, cung cấp 11 công cụ MCP để giữ dữ liệu thô ngoài cửa sổ ngữ cảnh và theo dõi sự kiện phiên trong SQLite + FTS5, nên việc nén không làm mất trạng thái.
