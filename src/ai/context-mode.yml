lang: TypeScript
homepage: https://github.com/mksglu/context-mode
license: noassertion
desc:
  cn: AI agent 上下文沙箱与持续会话引擎：拦截大输出工具结果、提供 11 个 MCP 工具把原始数据留在 sandbox 外，并通过 SQLite + FTS5 索引追踪会话事件实现压缩后无损恢复。
  en: AI agent context sandbox and session-continuity engine that intercepts large tool outputs, exposes 11 MCP tools to keep raw data out of the context window, and tracks session events in SQLite + FTS5 so compaction does not lose state.
x:
  source: https://github.com/mksglu/context-mode
  npm: context-mode
rule:
  /npm:
    cmd: npm install -g context-mode
    reference: https://github.com/mksglu/context-mode#install
    dsnap: context-mode
binlist:
- context-mode

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 288 KB
          rating: 1
          desc:
            cn: 约 288 KB（估算）
            en: ~288 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
