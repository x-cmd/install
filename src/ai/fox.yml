lang: Rust
homepage: https://github.com/ferrumox/fox
license: MIT
desc:
  cn: 高速本地 LLM 推理服务引擎，作为 Ollama 的直接替代品，通过前缀缓存与连续批处理获得更低的 TTFT 与更高吞吐
  en: High-performance local LLM inference server and drop-in replacement for Ollama, with lower TTFT and higher throughput via prefix caching and continuous batching
x:
  source: https://github.com/ferrumox/fox
  eget: https://github.com/ferrumox/fox
rule:
  /eget:
    cmd: x eget use ferrumox/fox
    reference: https://x-cmd.com/mod/eget
  (linux|darwin)/curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/ferrumox/fox/main/install.sh | bash
    reference: https://github.com/ferrumox/fox/blob/main/install.sh
  (win|wsl2)/powershell:
    cmd: irm https://raw.githubusercontent.com/ferrumox/fox/main/install.ps1 | iex
    reference: https://github.com/ferrumox/fox#try-it-in-30-seconds
binlist:
  - fox

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取模型文件与配置文件
          en: Reads model files and config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB（不含模型）
            en: 30 MB install (models not included)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB（不含模型）
          en: 100 MB (models not included)
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 4
        desc:
          cn: 高（推理时）
          en: High (during inference)