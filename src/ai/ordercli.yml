lang: Go
homepage: https://github.com/steipete/ordercli
license: mit
desc:
  cn: Foodora 和 Deliveroo 的命令行工具
  en: CLI for Foodora and Deliveroo
x:
  source: https://github.com/steipete/ordercli
  eget: https://github.com/steipete/ordercli
rule:
  /eget:
    cmd: x eget steipete/ordercli
    reference: https://github.com/steipete/ordercli
binlist:
- ordercli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
