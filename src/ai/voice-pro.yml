lang: Python
homepage: https://github.com/abus-aikorea/voice-pro
license: gpl-3.0
desc:
  cn: 免费自托管的 Web 应用，支持语音克隆，可对音视频内容进行转录、翻译和配音
  en: Transcribe, translate, and dub audio or video content with voice cloning using a free, self-hosted web application.
x:
  source: https://github.com/abus-aikorea/voice-pro
rule:
  /git:
    cmd: x git clone abus-aikorea/voice-pro
    reference: https://github.com/abus-aikorea/voice-pro#-installation
binlist:
- voice-pro

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 80 KB
          rating: 1
          desc:
            cn: 约 80 KB（估算）
            en: ~80 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
