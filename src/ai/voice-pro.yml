lang: Python
homepage: https://github.com/abus-aikorea/voice-pro
license: gpl-3.0
desc:
  cn: 免费自托管的 Web 应用，支持语音克隆，可对音视频内容进行转录、翻译和配音
  en: Transcribe, translate, and dub audio or video content with voice cloning using a free, self-hosted web application.
x:
  source: https://github.com/abus-aikorea/voice-pro
rule:
  /git:
    cmd: x git clone abus-aikorea/voice-pro
    reference: https://github.com/abus-aikorea/voice-pro#-installation
binlist:
- voice-pro

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
