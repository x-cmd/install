lang: TypeScript
homepage: https://github.com/ConardLi/easy-llm-cli
license: apache-2.0
desc:
  cn: 兼容多种 LLM 模型的开源 AI 智能体
  en: An open-source AI agent that is compatible with multiple LLM models
x:
  source: https://github.com/ConardLi/easy-llm-cli
  eget: ConardLi/easy-llm-cli
rule:
  /eget:
    cmd: x eget ConardLi/easy-llm-cli
    reference: https://github.com/ConardLi/easy-llm-cli
binlist:
- easy-llm-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 88 KB
          rating: 1
          desc:
            cn: 约 88 KB（估算）
            en: ~88 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
