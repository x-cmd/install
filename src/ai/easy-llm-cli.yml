lang: TypeScript
homepage: https://github.com/ConardLi/easy-llm-cli
license: apache-2.0
desc:
  cn: 兼容多种 LLM 模型的开源 AI 智能体
  en: An open-source AI agent that is compatible with multiple LLM models
x:
  source: https://github.com/ConardLi/easy-llm-cli
  eget: https://github.com/ConardLi/easy-llm-cli
rule:
  /eget:
    cmd: x eget ConardLi/easy-llm-cli
    reference: https://github.com/ConardLi/easy-llm-cli
binlist:
- easy-llm-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
