lang: Python
homepage: https://github.com/laude-institute/harbor
license: Apache-2.0
desc:
  cn: 用于运行代理评估以及创建和使用 RL 环境的框架（依赖 git 和 Docker）
  en: a framework for running agent evaluations and creating and using RL environments (requires git and Docker)
x:
  source: https://github.com/laude-institute/harbor
rule:
  /uv:
    cmd: uv tool install harbor
    reference: https://github.com/laude-institute/harbor?tab=readme-ov-file#installation
  /pip:
    cmd: pip install harbor
    reference: https://github.com/laude-institute/harbor?tab=readme-ov-file#installation
binlist:
  - harbor

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
