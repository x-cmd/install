lang: Python
homepage: https://github.com/laude-institute/harbor
license: Apache-2.0
desc:
  cn: 用于运行代理评估以及创建和使用 RL 环境的框架（依赖 git 和 Docker）
  en: a framework for running agent evaluations and creating and using RL environments (requires git and Docker)
x:
  source: https://github.com/laude-institute/harbor
rule:
  /uv:
    cmd: uv tool install harbor
    reference: https://github.com/laude-institute/harbor?tab=readme-ov-file#installation
  /pip:
    cmd: pip install harbor
    reference: https://github.com/laude-institute/harbor?tab=readme-ov-file#installation
binlist:
  - harbor

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 791 KB
          rating: 1
          desc:
            cn: 约 791 KB（估算）
            en: ~791 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
