lang: Go
homepage: https://github.com/steveyegge/beads
license: MIT
desc:
  cn: 为您的编码代理提供内存升级
  en: A memory upgrade for your coding agent
  cs: Upgrade paměti pro váš kódovací agent
  de: Ein Speicher-Upgrade für deinen Coding-Agent
  es: Una mejora de memoria para tu agente de programación
  fr: Une amélioration mémoire pour votre agent de codage
  id: Peningkatan memori untuk agen pengodean Anda
  it: Un potenziamento della memoria per il tuo agente di codifica
  ja: コーディングエージェントのためのメモリ強化
  ko: 코딩 에이전트를 위한 메모리 업그레이드
  pl: Ulepszenie pamięci dla Twojego agenta kodującego
  pt: Um upgrade de memória para o seu agente de codificação
  ro: O actualizare de memorie pentru agentul tău de codare
  ru: Апгрейд памяти для вашего агента написания кода
  th: การอัปเกรดหน่วยความจำสำหรับเอเจนต์เขียนโค้ดของคุณ
  tr: Kodlama ajanınız için bir bellek yükseltmesi
  uk: Апгрейд пам'яті для вашого агента написання коду
  vi: Nâng cấp bộ nhớ cho agent lập trình của bạn
x:
  source: https://github.com/steveyegge/beads
  eget: steveyegge/beads
  brew: beads
  yay: beads-bin
  npm: "@beads/bd"
  go: github.com/steveyegge/beads/cmd/bd@latest
rule:
  /eget:
    cmd: x eget steveyegge/beads
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/steveyegge/beads/main/scripts/install.sh | bash
    reference: https://github.com/steveyegge/beads?tab=readme-ov-file#-quick-start
  /npm:
    cmd: npm install -g @beads/bd
    reference: https://github.com/steveyegge/beads?tab=readme-ov-file#-installation
    dsnap: '@beads/bd'
  /go:
    cmd: go install github.com/steveyegge/beads/cmd/bd@latest
    reference: https://github.com/steveyegge/beads?tab=readme-ov-file#-installation
    dsnap: github.com/steveyegge/beads/cmd/bd@latest
  darwin/brew:
    cmd: brew install beads
    reference: https://github.com/steveyegge/beads?tab=readme-ov-file#-installation
  arch/yay:
    cmd: yay -S beads-bin
    reference: https://aur.archlinux.org/packages/beads-bin
binlist:
- bd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 72 MB
          rating: 3
          desc:
            cn: 约 72 MB（估算）
            en: ~72 MB estimated
        download:
          estimate: 47 MB
          desc:
            cn: 约 47 MB 下载 (linux/x64)
            en: ~47 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
