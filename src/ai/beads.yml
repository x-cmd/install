lang: Go
homepage: https://github.com/steveyegge/beads
license: MIT
desc:
  cn: 为您的编码代理提供内存升级
  en: A memory upgrade for your coding agent
x:
  source: https://github.com/steveyegge/beads
  eget: https://github.com/steveyegge/beads
rule:
  /eget:
    cmd: x eget steveyegge/beads
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/steveyegge/beads/main/scripts/install.sh | bash
    reference: https://github.com/steveyegge/beads?tab=readme-ov-file#-quick-start
  /npm:
    cmd: npm install -g @beads/bd
    reference: https://github.com/steveyegge/beads?tab=readme-ov-file#-installation
    dsnap: '@beads/bd'
  /go:
    cmd: go install github.com/steveyegge/beads/cmd/bd@latest
    reference: https://github.com/steveyegge/beads?tab=readme-ov-file#-installation
    dsnap: github.com/steveyegge/beads/cmd/bd@latest
  darwin/brew:
    cmd: brew install beads
    reference: https://github.com/steveyegge/beads?tab=readme-ov-file#-installation
  arch/yay:
    cmd: yay -S beads-bin
    reference: https://aur.archlinux.org/packages/beads-bin
binlist:
- bd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 72 MB
          rating: 3
          desc:
            cn: 约 72 MB（估算）
            en: ~72 MB estimated
        download:
          estimate: 47 MB
          desc:
            cn: 约 47 MB 下载 (linux/x64)
            en: ~47 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
