lang: Shell
homepage: https://github.com/JetBrains/junie
license: © JetBrains s.r.o. All rights reserved.
desc:
  en: AI coding assistant developed by JetBrains
  cn: JetBrains 开发的 AI 编码助手
  cs: AI asistent pro kódování vyvinutý JetBrains
  de: KI-Coding-Assistent von JetBrains
  es: Asistente de programación con IA desarrollado por JetBrains
  fr: Assistant de codage IA développé par JetBrains
  id: Asisten pemrograman AI yang dikembangkan oleh JetBrains
  it: Assistente di programmazione IA sviluppato da JetBrains
  ja: JetBrains が開発した AI コーディングアシスタント
  ko: JetBrains에서 개발한 AI 코딩 어시스턴트
  pl: Asystent programowania AI opracowany przez JetBrains
  pt: Assistente de programação com IA desenvolvido pela JetBrains
  ro: Asistent de programare AI dezvoltat de JetBrains
  ru: ИИ-ассистент для написания кода, разработанный JetBrains
  th: ผู้ช่วยเขียนโค้ด AI ที่พัฒนาโดย JetBrains
  tr: JetBrains tarafından geliştirilen AI kodlama asistanı
  uk: ІІ-асистент для написання коду, розроблений JetBrains
  vi: Trợ lý lập trình AI do JetBrains phát triển
x:
  source: https://github.com/JetBrains/junie
  eget: JetBrains/junie
  brew: jetbrains-junie/junie/junie
  npm: "@jetbrains/junie"
rule:
  /eget:
    cmd: x eget JetBrains/junie
    reference: https://x-cmd.com/mod/eget
  (darwin|linux)/curl:
    cmd: curl -fsSL https://junie.jetbrains.com/install.sh | bash
    reference: https://github.com/JetBrains/junie?tab=readme-ov-file#-install
  win/powershell:
    cmd: x pwsh -NoProfile -ExecutionPolicy Bypass -Command "iex (irm 'https://junie.jetbrains.com/install.ps1')"
    reference: https://github.com/JetBrains/junie?tab=readme-ov-file#-install
  darwin/brew:
    cmd: |
      brew tap jetbrains-junie/junie
      brew install junie
    reference: https://github.com/JetBrains/junie?tab=readme-ov-file#-install
  /npm:
    cmd: npm install -g @jetbrains/junie
    reference: https://github.com/JetBrains/junie?tab=readme-ov-file#-install
    dsnap: '@jetbrains/junie'
binlist:
- junie


# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 317 MB
          rating: 4
          desc:
            cn: 安装 317 MB
            en: 317 MB install
        download:
          estimate: 317 MB
          desc:
            cn: 约 317 MB 下载 (linux/x64)
            en: ~317 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
