lang: Go
homepage: https://github.com/voocel/ainovel-cli
license: apache-2.0
desc:
  cn: 多 Agent 实现的全自动 AI 小说生成工具
  en: ✨多agent实现全自动AI小说生成
x:
  source: https://github.com/voocel/ainovel-cli
  eget: https://github.com/voocel/ainovel-cli
rule:
  /eget:
    cmd: x eget voocel/ainovel-cli
    reference: https://github.com/voocel/ainovel-cli
binlist:
- ainovel-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
