lang: Go
homepage: https://github.com/voocel/ainovel-cli
license: apache-2.0
desc:
  cn: 多 Agent 实现的全自动 AI 小说生成工具
  en: ✨多agent实现全自动AI小说生成
x:
  source: https://github.com/voocel/ainovel-cli
  eget: voocel/ainovel-cli
rule:
  /eget:
    cmd: x eget voocel/ainovel-cli
    reference: https://github.com/voocel/ainovel-cli
binlist:
- ainovel-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
