lang: TypeScript
homepage: https://github.com/Lum1104/Understand-Anything
license: mit
desc:
  cn: 分析代码库或 Wiki，生成交互式知识图谱，支持可视化探索、搜索和影响分析
  en: Analyze codebases or wikis to generate an interactive knowledge graph for visual exploration, search, and impact analysis.
x:
  source: https://github.com/Lum1104/Understand-Anything
rule:
  /git:
    cmd: x git clone Lum1104/Understand-Anything
    reference: https://github.com/Lum1104/Understand-Anything#-quick-start
  /npm:
    cmd: npx skills add Lum1104/Understand-Anything
    reference: https://www.skills.sh/egonex-ai/understand-anything
    dsnap: skills
binlist:
- understand-anything

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 104 KB
          rating: 1
          desc:
            cn: 约 104 KB（估算）
            en: ~104 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
