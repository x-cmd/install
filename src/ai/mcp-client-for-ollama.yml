lang: Python
homepage: https://github.com/jonigl/mcp-client-for-ollama
license: mit
desc:
  cn: 面向 Ollama 的 TUI MCP 客户端，支持完整 MCP 原语、智能体模式、多服务器与流式响应
  en: Harness the power of local LLMs with this TUI MCP Client for Ollama. Featuring all core MCP primitives (tools, prompts, resources), agent mode, multi-server, model switching, streaming responses, h...
x:
  source: https://github.com/jonigl/mcp-client-for-ollama
rule:
  /pip:
    cmd: pip install mcp-client-for-ollama
    reference: https://pypi.org/project/mcp-client-for-ollama/
    dsnap: mcp-client-for-ollama
binlist:
- mcp-client-for-ollama

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 KB
          rating: 1
          desc:
            cn: 约 28 KB（估算）
            en: ~28 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
