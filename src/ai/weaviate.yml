lang: 'Go'
homepage: https://github.com/weaviate/weaviate
license: 'BSD-3-Clause'
desc:
  cn: 开源向量数据库，同时存储对象和向量，将向量检索与结构化过滤相结合
  en: 'Weaviate is an open-source vector database that stores both objects and vectors, allowing for the combination of vector search with structured filtering with the fault tolerance and scalability of ...'
x:
  source: https://github.com/weaviate/weaviate
  eget: https://github.com/weaviate/weaviate
rule:
  /eget:
    cmd: x eget weaviate/weaviate
    reference: https://github.com/weaviate/weaviate
binlist:
- 'weaviate'
# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true   # vector DB API
    filesystem:
      read:
        desc:
          cn: 读取 schema 配置、数据文件
          en: Reads schema config, data files
        sensitive: []
      write:
        desc:
          cn: 写入向量索引数据
          en: Writes vector index data
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 95 MB
          rating: 3
          desc:
            cn: 约 95 MB（估算）
            en: ~95 MB estimated
        growth:
          desc:
            cn: 随索引数据增长
            en: Grows with indexed data
        download:
          estimate: 70 MB
          desc:
            cn: 约 70 MB 下载 (linux/x64)
            en: ~70 MB download (linux/x64)
      paths:
        data:
        - "/var/lib/weaviate"
        config:
        - "/etc/weaviate"
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
      peak:
        estimate: 4 GB
        desc:
          cn: 大型向量索引
          en: Large vector indexes
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
      peak:
        rating: 2
        desc:
          cn: 索引/查询时占用
          en: Spike on indexing/querying
  platform:
    win: none
    linux: full
    darwin: full
