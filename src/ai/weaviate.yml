lang: 'Go'
homepage: https://github.com/weaviate/weaviate
license: 'BSD-3-Clause'
desc:
  cn: 开源向量数据库，同时存储对象和向量，将向量检索与结构化过滤相结合
  en: 'Weaviate is an open-source vector database that stores both objects and vectors, allowing for the combination of vector search with structured filtering with the fault tolerance and scalability of ...'
  cs: Weaviate je open-source vektorová databáze, která ukládá objekty i vektory a umožňuje kombinovat vektorové vyhledávání se strukturovaným filtrováním, s tolerancí chyb a škálovatelností ...
  de: Weaviate ist eine quelloffene Vektordatenbank, die Objekte und Vektoren speichert und die Kombination von Vektorsuche mit strukturierter Filterung sowie Fehlertoleranz und Skalierbarkeit ermöglicht ...
  es: Weaviate es una base de datos vectorial de código abierto que almacena tanto objetos como vectores, lo que permite combinar la búsqueda vectorial con el filtrado estructurado, con tolerancia a fallos y escalabilidad ...
  fr: Weaviate est une base de données vectorielle open source qui stocke à la fois les objets et les vecteurs, permettant de combiner la recherche vectorielle avec un filtrage structuré, avec la tolérance aux pannes et l'évolutivité ...
  id: Weaviate adalah basis data vektor open-source yang menyimpan objek dan vektor, sehingga menggabungkan pencarian vektor dengan pemfilteran terstruktur, dengan toleransi kesalahan dan skalabilitas ...
  it: Weaviate è un database vettoriale open source che archivia sia oggetti sia vettori, consentendo di combinare la ricerca vettoriale con il filtraggio strutturato, con tolleranza ai guasti e scalabilità ...
  ja: Weaviate は、オブジェクトとベクトルの両方を保存するオープンソースのベクトルデータベースで、ベクトル検索と構造化フィルタリングを組み合わせられます。耐障害性と拡張性も備えています ...
  ko: Weaviate는 객체와 벡터를 모두 저장하는 오픈 소스 벡터 데이터베이스로, 벡터 검색과 구조화된 필터링을 결합할 수 있으며 내결함성과 확장성을 제공합니다 ...
  pl: Weaviate to otwartoźródłowa baza danych wektorowa, która przechowuje zarówno obiekty, jak i wektory, umożliwiając połączenie wyszukiwania wektorowego z filtrowaniem strukturalnym, z tolerancją błędów i skalowalnością ...
  pt: O Weaviate é um banco de dados vetorial de código aberto que armazena objetos e vetores, permitindo combinar busca vetorial com filtragem estruturada, com tolerância a falhas e escalabilidade ...
  ro: Weaviate este o bază de date vectorială open source care stochează atât obiecte, cât și vectori, permițând combinarea căutării vectoriale cu filtrarea structurată, cu toleranță la erori și scalabilitate ...
  ru: Weaviate — векторная база данных с открытым исходным кодом, хранящая как объекты, так и векторы, что позволяет сочетать векторный поиск со структурированной фильтрацией, обеспечивая отказоустойчивость и масштабируемость ...
  th: Weaviate คือฐานข้อมูลเวกเตอร์โอเพนซอร์สที่เก็บทั้งอ็อบเจกต์และเวกเตอร์ ทำให้ค้นหาแบบเวกเตอร์ร่วมกับการกรองแบบมีโครงสร้างได้ พร้อมความทนทานต่อข้อผิดพลาดและความสามารถในการขยายขนาด ...
  tr: Weaviate, hem nesneleri hem vektörleri saklayan açık kaynaklı bir vektör veritabanıdır; vektör aramasını yapılandırılmış filtreleme ile birleştirir, hata toleransı ve ölçeklenebilirlik sunar ...
  uk: Weaviate — векторна база даних з відкритим кодом, яка зберігає як об'єкти, так і вектори, дозволяючи поєднувати векторний пошук зі структурованою фільтрацією, з відмовостійкістю та масштабованістю ...
  vi: Weaviate là cơ sở dữ liệu vector mã nguồn mở lưu trữ cả đối tượng lẫn vector, cho phép kết hợp tìm kiếm vector với lọc có cấu trúc, đồng thời có khả năng chịu lỗi và mở rộng ...
x:
  source: https://github.com/weaviate/weaviate
  eget: weaviate/weaviate
rule:
  /eget:
    cmd: x eget weaviate/weaviate
    reference: https://github.com/weaviate/weaviate
binlist:
- 'weaviate'
# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # vector DB API
    filesystem:
      read:
        desc:
          cn: 读取 schema 配置、数据文件
          en: Reads schema config, data files
        sensitive: []
      write:
        desc:
          cn: 写入向量索引数据
          en: Writes vector index data
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 95 MB
          rating: 3
          desc:
            cn: 约 95 MB（估算）
            en: ~95 MB estimated
        growth:
          desc:
            cn: 随索引数据增长
            en: Grows with indexed data
        download:
          estimate: 70 MB
          desc:
            cn: 约 70 MB 下载 (linux/x64)
            en: ~70 MB download (linux/x64)
      paths:
        data:
        - "/var/lib/weaviate"
        config:
        - "/etc/weaviate"
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
      peak:
        estimate: 4 GB
        desc:
          cn: 大型向量索引
          en: Large vector indexes
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
      peak:
        rating: 2
        desc:
          cn: 索引/查询时占用
          en: Spike on indexing/querying
  platform:
    win: none
    linux: full
    darwin: full
