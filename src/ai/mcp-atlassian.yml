lang: Python
homepage: https://github.com/sooperset/mcp-atlassian
license: mit
desc:
  cn: 面向 Atlassian 工具（Confluence、Jira）的 MCP 服务器
  en: MCP server for Atlassian tools (Confluence, Jira)
x:
  source: https://github.com/sooperset/mcp-atlassian
rule:
  /pip:
    cmd: pip install mcp-atlassian
    reference: https://pypi.org/project/mcp-atlassian/
    dsnap: mcp-atlassian
binlist:
- mcp-atlassian

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
