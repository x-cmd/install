lang: Python
homepage: https://github.com/sooperset/mcp-atlassian
license: mit
desc:
  cn: 面向 Atlassian 工具（Confluence、Jira）的 MCP 服务器
  en: MCP server for Atlassian tools (Confluence, Jira)
x:
  source: https://github.com/sooperset/mcp-atlassian
rule:
  /pip:
    cmd: pip install mcp-atlassian
    reference: https://pypi.org/project/mcp-atlassian/
    dsnap: mcp-atlassian
binlist:
- mcp-atlassian

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 222 KB
          rating: 1
          desc:
            cn: 约 222 KB（估算）
            en: ~222 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
