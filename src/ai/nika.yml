lang: 'Rust'
homepage: 'https://github.com/supernovae-st/nika'
license: 'AGPL-3.0'
desc:
  cn: 面向 AI 的工作流引擎：单一 .nika.yaml DAG（LLM 步骤、Shell 步骤、工具调用），执行前静态校验（schema/permits/cost floor），执行后生成可验证的执行轨迹（nika trace verify）。本地优先，mock 与 Ollama 路径无需 API key。
  en: 'Workflow engine for AI: a single .nika.yaml DAG (LLM steps, shell steps, tool calls) statically checked before a single token is spent (nika check: schema, permits, cost floor) and leaving a tamper-evident trace after (nika trace verify). Local-first, mock and Ollama paths need no API key.'
  cs: "Workflow engine pro AI: jediný DAG v .nika.yaml (LLM kroky, shell kroky, volání nástrojů) staticky ověřený ještě před utrácením jediného tokenu (nika check: schema, permits, cost floor) a po sobě zanechávající nepodvrhlitelnou stopu (nika trace verify). Local-first, mock i Ollama cesty nepotřebují API key."
  de: "Workflow-Engine für KI: ein einzelner .nika.yaml-DAG (LLM-Schritte, Shell-Schritte, Tool-Aufrufe), statisch geprüft, bevor ein einziges Token verbraucht wird (nika check: schema, permits, cost floor), und hinterlässt eine manipulationssichere Spur (nika trace verify). Local-first, Mock- und Ollama-Pfade brauchen keinen API-Schlüssel."
  es: "Motor de flujos de trabajo para IA: un único DAG en .nika.yaml (pasos LLM, pasos de shell, llamadas a herramientas) comprobado estáticamente antes de gastar un solo token (nika check: schema, permits, cost floor) y que deja un rastro a prueba de manipulaciones (nika trace verify). Local-first, las rutas mock y Ollama no necesitan API key."
  fr: "Moteur de workflows pour l'IA : un unique DAG .nika.yaml (étapes LLM, étapes shell, appels d'outils) vérifié statiquement avant qu'un seul token ne soit dépensé (nika check: schema, permits, cost floor) et laissant une trace infalsifiable (nika trace verify). Local-first, les chemins mock et Ollama ne nécessitent pas de clé API."
  id: "Mesin alur kerja untuk AI: satu DAG .nika.yaml (langkah LLM, langkah shell, pemanggilan alat) yang diperiksa secara statis sebelum satu token pun terpakai (nika check: schema, permits, cost floor) dan meninggalkan jejak yang tahan manipulasi (nika trace verify). Local-first, jalur mock dan Ollama tidak memerlukan API key."
  it: "Motore di workflow per l'IA: un unico DAG .nika.yaml (passi LLM, passi shell, chiamate agli strumenti) controllato staticamente prima che venga speso anche un solo token (nika check: schema, permits, cost floor) e che lascia una traccia a prova di manomissione (nika trace verify). Local-first, i percorsi mock e Ollama non richiedono chiavi API."
  ja: "AI向けワークフローエンジン：単一の .nika.yaml DAG（LLMステップ、シェルステップ、ツール呼び出し）を、トークンを消費する前に静的チェック（nika check: schema, permits, cost floor）し、実行後に改ざん不能なトレース（nika trace verify）を残します。Local-firstで、mockとOllamaのパスにAPIキーは不要です。"
  ko: "AI를 위한 워크플로 엔진: 단일 .nika.yaml DAG(LLM 단계, 셸 단계, 도구 호출)를 토큰을 쓰기 전에 정적으로 검사하고(nika check: schema, permits, cost floor) 실행 후 변조 방지 추적 기록(nika trace verify)을 남깁니다. Local-first이며 mock과 Ollama 경로에는 API 키가 필요 없습니다."
  pl: "Silnik przepływów pracy dla AI: jeden DAG .nika.yaml (kroki LLM, kroki powłoki, wywołania narzędzi) statycznie sprawdzany, zanim wydano choćby jeden token (nika check: schema, permits, cost floor), pozostawiający ślad odporny na manipulacje (nika trace verify). Local-first, ścieżki mock i Ollama nie wymagają klucza API."
  pt: "Mecanismo de workflow para IA: um único DAG .nika.yaml (etapas LLM, etapas de shell, chamadas de ferramentas) verificado estaticamente antes de gastar um único token (nika check: schema, permits, cost floor) e que deixa um rastro à prova de adulteração (nika trace verify). Local-first, os caminhos mock e Ollama não precisam de chave de API."
  ro: "Motor de fluxuri de lucru pentru AI: un singur DAG .nika.yaml (pași LLM, pași shell, apeluri de instrumente) verificat static înainte de a se cheltui un singur token (nika check: schema, permits, cost floor) și care lasă o urmă rezistentă la manipulare (nika trace verify). Local-first, căile mock și Ollama nu au nevoie de cheie API."
  ru: "Движок рабочих процессов для ИИ: единый DAG в .nika.yaml (шаги LLM, шаги shell, вызовы инструментов), статически проверяемый до расхода хотя бы одного токена (nika check: schema, permits, cost floor) и оставляющий после себя защищённую от подделки трассу (nika trace verify). Local-first, пути mock и Ollama не требуют API-ключа."
  th: "เอนจินเวิร์กโฟลว์สำหรับ AI: DAG .nika.yaml เดียว (ขั้นตอน LLM ขั้นตอน shell การเรียกเครื่องมือ) ตรวจสอบแบบสถิตก่อนใช้โทเคนแม้แต่โทเคนเดียว (nika check: schema, permits, cost floor) และทิ้งร่องรอยที่ตรวจสอบการแก้ไขได้หลังจบ (nika trace verify) Local-first ไม่ต้องใช้ API key ทั้งแนว mock และ Ollama"
  tr: "Yapay zeka için iş akışı motoru: tek bir .nika.yaml DAG (LLM adımları, kabuk adımları, araç çağrıları) tek bir token harcanmadan önce statik olarak denetlenir (nika check: schema, permits, cost floor) ve sonrasında manipülasyona dayanıklı bir iz bırakır (nika trace verify). Local-first; mock ve Ollama yolları API anahtarı gerektirmez."
  uk: "Движок робочих процесів для ШІ: єдиний DAG у .nika.yaml (кроки LLM, кроки shell, виклики інструментів), статично перевіряється до витрати хоча б одного токена (nika check: schema, permits, cost floor) і залишає після себе захищений від підробки слід (nika trace verify). Local-first, шляхи mock та Ollama не потребують API-ключа."
  vi: "Engine workflow cho AI: một DAG .nika.yaml duy nhất (bước LLM, bước shell, lời gọi công cụ) được kiểm tra tĩnh trước khi tiêu bất kỳ token nào (nika check: schema, permits, cost floor) và để lại dấu vết chống sửa đổi sau khi chạy (nika trace verify). Local-first, các đường mock và Ollama không cần API key."
x:
  source: https://github.com/supernovae-st/nika
  eget: supernovae-st/nika
  brew: supernovae-st/tap/nika
rule:
  /eget:
    cmd: x eget supernovae-st/nika
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use nika
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install supernovae-st/tap/nika
    reference: https://github.com/supernovae-st/nika#install
  /cargo:
    cmd: cargo binstall --git https://github.com/supernovae-st/nika nika-cli
    reference: https://github.com/supernovae-st/nika#install
  /nix:
    cmd: nix run github:supernovae-st/nika
    reference: https://github.com/supernovae-st/nika#install
binlist:
- 'nika'
# complicated
