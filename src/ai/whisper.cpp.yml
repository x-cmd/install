lang: 'C++'
homepage: 'https://github.com/ggml-org/whisper.cpp'
license: 'MIT'
desc:
  cn: OpenAI Whisper 模型的 C/C++ 移植版
  en: 'Port of OpenAI''s Whisper model in C/C++'
x:
  source: https://github.com/ggml-org/whisper.cpp
  eget: https://github.com/ggml-org/whisper.cpp
rule:
  /eget:
    cmd: x eget ggml-org/whisper.cpp
    reference: https://github.com/ggml-org/whisper.cpp
binlist:
- 'whisper.cpp'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 26 MB
          rating: 2
          desc:
            cn: 约 26 MB（估算）
            en: ~26 MB estimated
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
