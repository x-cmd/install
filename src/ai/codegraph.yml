lang: TypeScript
homepage: https://github.com/colbymchenry/codegraph
license: mit
desc:
  cn: 将代码库索引为本地知识图谱，用高效的图查询替代文件遍历，让 AI 编码智能体更快更省
  en: Indexes your codebase into a local knowledge graph to make AI coding agents faster and cheaper by replacing file exploration with efficient graph queries.
x:
  source: https://github.com/colbymchenry/codegraph
rule:
  /npm:
    cmd: npm i -g @colbymchenry/codegraph
    reference: https://github.com/colbymchenry/codegraph
    dsnap: '@colbymchenry/codegraph'
binlist:
- codegraph

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 72 MB
          rating: 3
          desc:
            cn: 约 72 MB（估算）
            en: ~72 MB estimated
        download:
          estimate: 59 MB
          desc:
            cn: 约 59 MB 下载 (linux/x64)
            en: ~59 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
