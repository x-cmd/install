lang: TypeScript
homepage: https://github.com/colbymchenry/codegraph
license: mit
desc:
  cn: 将代码库索引为本地知识图谱，用高效的图查询替代文件遍历，让 AI 编码智能体更快更省
  en: Indexes your codebase into a local knowledge graph to make AI coding agents faster and cheaper by replacing file exploration with efficient graph queries.
x:
  source: https://github.com/colbymchenry/codegraph
rule:
  /npm:
    cmd: npm i -g @colbymchenry/codegraph
    reference: https://github.com/colbymchenry/codegraph
    dsnap: '@colbymchenry/codegraph'
binlist:
- codegraph

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
