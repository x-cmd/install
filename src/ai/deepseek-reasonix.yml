lang: Go
homepage: https://github.com/esengine/DeepSeek-Reasonix
license: mit
desc:
  cn: 为 DeepSeek 前缀缓存专门优化、最小化 API 成本的终端低成本 AI 编码智能体
  en: Run a cost-efficient AI coding agent in your terminal, specifically engineered for DeepSeek's prefix-caching to minimize API costs.
x:
  source: https://github.com/esengine/DeepSeek-Reasonix
  eget: https://github.com/esengine/DeepSeek-Reasonix
rule:
  /eget:
    cmd: x eget esengine/DeepSeek-Reasonix
    reference: https://github.com/esengine/DeepSeek-Reasonix
binlist:
- deepseek-reasonix

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 97 MB
          rating: 3
          desc:
            cn: 约 97 MB（估算）
            en: ~97 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
