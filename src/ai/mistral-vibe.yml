lang: Python
homepage: https://github.com/mistralai/mistral-vibe
license: Apache-2.0
desc:
  cn: Mistral 的开源 CLI 编码助手
  en: Mistral's open-source CLI coding assistant.
  cs: Open source CLI asistent pro kódování od Mistral.
  de: Mistrals quelloffener CLI-Coding-Assistent.
  es: Asistente de programación en la CLI de código abierto de Mistral.
  fr: Assistant de codage CLI open source de Mistral.
  id: Asisten pemrograman CLI open-source dari Mistral.
  it: Assistente di programmazione CLI open source di Mistral.
  ja: Mistral のオープンソース CLI コーディングアシスタント。
  ko: Mistral의 오픈 소스 CLI 코딩 어시스턴트.
  pl: Asystent programowania w CLI o otwartym kodzie od Mistral.
  pt: Assistente de programação CLI de código aberto da Mistral.
  ro: Asistent de programare CLI cu sursă deschisă de la Mistral.
  ru: Открытый CLI-ассистент для написания кода от Mistral.
  th: ผู้ช่วยเขียนโค้ด CLI โอเพนซอร์สจาก Mistral
  tr: Mistral'ın açık kaynaklı CLI kodlama asistanı.
  uk: Відкритий CLI-асистент для написання коду від Mistral.
  vi: Trợ lý lập trình CLI mã nguồn mở của Mistral.
x:
  source: https://github.com/mistralai/mistral-vibe
  eget: mistralai/mistral-vibe
  yay: mistral-vibe
  pip: mistral-vibe
rule:
  /eget:
    cmd: x eget mistralai/mistral-vibe
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -LsSf https://mistral.ai/vibe/install.sh | bash
    reference: https://github.com/mistralai/mistral-vibe?tab=readme-ov-file#one-line-install-recommended
  (win|wsl2)/powershell:
    cmd: x pwsh -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
    reference: https://github.com/mistralai/mistral-vibe?tab=readme-ov-file#one-line-install-recommended
  /uv:
    cmd: uv tool install mistral-vibe
    reference: https://github.com/mistralai/mistral-vibe?tab=readme-ov-file#one-line-install-recommended
  /pip:
    cmd: pip install mistral-vibe
    reference: https://github.com/mistralai/mistral-vibe?tab=readme-ov-file#one-line-install-recommended
    dsnap: mistral-vibe
  arch/yay:
    cmd: yay -S mistral-vibe
    reference: https://aur.archlinux.org/packages/mistral-vibe
binlist:
- vibe

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 43 MB
          rating: 2
          desc:
            cn: 安装 43 MB
            en: 43 MB install
        download:
          estimate: 43 MB
          desc:
            cn: 约 43 MB 下载 (linux/x64)
            en: ~43 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
