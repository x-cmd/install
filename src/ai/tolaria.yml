lang: TypeScript
homepage: https://refactoringhq.github.io/tolaria/
license: AGPL-3.0
desc:
  cn: Tauri + React + TypeScript 构建的开源 Markdown 个人知识库桌面应用（macOS / Windows / Linux），笔记以 Markdown 文件直接存盘、原生 Git 仓库管理，AI 智能体友好
  en: An open-source Tauri + React + TypeScript desktop app (macOS / Windows / Linux) for managing personal Markdown knowledge bases — notes are plain .md files on disk, the workspace is a native git repo, and the format is friendly to AI coding agents.
  cs: Open-source desktopová aplikace (macOS / Windows / Linux) postavená na Tauri + React + TypeScript pro správu osobních znalostních bází v Markdownu – poznámky jsou prosté soubory .md na disku, pracovní prostor je nativní git repozitář a formát je přátelský k AI kódovacím agentům.
  de: Eine quelloffene Desktop-App (macOS / Windows / Linux) auf Basis von Tauri + React + TypeScript zur Verwaltung persönlicher Markdown-Wissensdatenbanken – Notizen sind einfache .md-Dateien auf der Festplatte, der Arbeitsbereich ist ein natives Git-Repository und das Format ist für KI-Coding-Agenten geeignet.
  es: "Una aplicación de escritorio de código abierto (macOS / Windows / Linux) construida con Tauri + React + TypeScript para gestionar bases de conocimiento personales en Markdown: las notas son simples archivos .md en disco, el espacio de trabajo es un repositorio git nativo y el formato es amigable para los agentes de programación con IA."
  fr: Une application de bureau open source (macOS / Windows / Linux) construite avec Tauri + React + TypeScript pour gérer des bases de connaissances personnelles en Markdown – les notes sont de simples fichiers .md sur disque, l'espace de travail est un dépôt git natif et le format est adapté aux agents de codage IA.
  id: Aplikasi desktop open source (macOS / Windows / Linux) yang dibangun dengan Tauri + React + TypeScript untuk mengelola basis pengetahuan pribadi berbasis Markdown — catatan disimpan sebagai file .md biasa di disk, ruang kerja adalah repositori git asli, dan formatnya ramah untuk agen pengodean AI.
  it: "Un'app desktop open source (macOS / Windows / Linux) basata su Tauri + React + TypeScript per gestire basi di conoscenza personali in Markdown: le note sono semplici file .md su disco, l'area di lavoro è un repository git nativo e il formato è user friendly per gli agenti di coding IA."
  ja: Tauri + React + TypeScript で構築されたオープンソースのデスクトップアプリ（macOS / Windows / Linux）で、個人の Markdown ナレッジベースを管理します。ノートはディスク上の素の .md ファイルで、ワークスペースはネイティブの git リポジトリ、形式は AI コーディングエージェントにも扱いやすいものです。
  ko: Tauri + React + TypeScript로 만든 오픈 소스 데스크톱 앱(macOS / Windows / Linux)입니다. 개인 Markdown 지식 베이스를 관리하며, 노트는 디스크의 평범한 .md 파일로 저장되고 작업 공간은 네이티브 git 저장소이며 형식은 AI 코딩 에이전트에 적합합니다.
  pl: Otwartoźródładowa aplikacja desktopowa (macOS / Windows / Linux) zbudowana w Tauri + React + TypeScript do zarządzania osobistymi bazami wiedzy w Markdown — notatki to zwykłe pliki .md na dysku, przestrzeń robocza to natywny repozytorium git, a format jest przyjazny agentom programistycznym AI.
  pt: Um aplicativo de desktop de código aberto (macOS / Windows / Linux) construído com Tauri + React + TypeScript para gerenciar bases de conhecimento pessoais em Markdown — as notas são arquivos .md simples no disco, o workspace é um repositório git nativo e o formato é amigável para agentes de programação com IA.
  ro: O aplicație desktop open source (macOS / Windows / Linux) construită cu Tauri + React + TypeScript pentru gestionarea bazelor de cunoștințe personale în Markdown – notițele sunt simple fișiere .md pe disc, spațiul de lucru este un repo git nativ, iar formatul este prietenos cu agenții de programare AI.
  ru: Открытое десктопное приложение (macOS / Windows / Linux) на Tauri + React + TypeScript для управления личными базами знаний в Markdown — заметки хранятся обычными файлами .md на диске, рабочая область является нативным git-репозиторием, а формат удобен для ИИ-агентов написания кода.
  th: แอปเดสก์ท็อปโอเพนซอร์ส (macOS / Windows / Linux) ที่สร้างด้วย Tauri + React + TypeScript สำหรับจัดการฐานความรู้ส่วนตัวในรูปแบบ Markdown — โน้ตเป็นไฟล์ .md ธรรมดาบนดิสก์ เวิร์กสเปซเป็น repositor git แบบ native และรูปแบบนี้เหมาะกับเอเจนต์เขียนโค้ดด้วย AI
  tr: Kişisel Markdown bilgi tabanlarını yönetmek için Tauri + React + TypeScript ile geliştirilmiş açık kaynaklı masaüstü uygulaması (macOS / Windows / Linux) — notlar diskteki düz .md dosyalarıdır, çalışma alanı yerel bir git deposudur ve biçim AI kodlama ajanları için elverişlidir.
  uk: Відкритий десктопний застосунок (macOS / Windows / Linux) на Tauri + React + TypeScript для керування особистими базами знань у Markdown — нотатки зберігаються звичайними файлами .md на диску, робоча область є нативним git-репозиторієм, а формат зручний для ШІ-агентів написання коду.
  vi: Ứng dụng desktop mã nguồn mở (macOS / Windows / Linux) xây dựng bằng Tauri + React + TypeScript để quản lý kho tri thức cá nhân dạng Markdown — ghi chú là các tệp .md thông thường trên ổ đĩa, không gian làm việc là kho git gốc và định dạng thân thiện với các tác tử lập trình AI.
rule:
  darwin/brew:
    cmd: brew install --cask tolaria
    reference: https://formulae.brew.sh/cask/tolaria#default
  /curl:
    cmd: curl -L -o tolaria.dmg https://github.com/refactoringhq/tolaria/releases/latest
    reference: https://refactoringhq.github.io/tolaria/download/

x: {}
binlist:
- tolaria
# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
