lang: TypeScript
homepage: https://refactoringhq.github.io/tolaria/
license: AGPL-3.0
desc:
  cn: Tauri + React + TypeScript 构建的开源 Markdown 个人知识库桌面应用（macOS / Windows / Linux），笔记以 Markdown 文件直接存盘、原生 Git 仓库管理，AI 智能体友好
  en: An open-source Tauri + React + TypeScript desktop app (macOS / Windows / Linux) for managing personal Markdown knowledge bases — notes are plain .md files on disk, the workspace is a native git repo, and the format is friendly to AI coding agents.
rule:
  darwin/brew:
    cmd: brew install --cask tolaria
    reference: https://formulae.brew.sh/cask/tolaria#default
  /curl:
    cmd: curl -L -o tolaria.dmg https://github.com/refactoringhq/tolaria/releases/latest
    reference: https://refactoringhq.github.io/tolaria/download/
binlist:
- tolaria
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
