lang: TypeScript
homepage: https://github.com/campfirein/byterover-cli
license: other
desc:
  cn: ByteRover CLI（brv），面向自主编码 Agent 的便携记忆层（原 Cipher）
  en: ByteRover CLI (brv) - The portable memory layer for autonomous coding agents (formerly Cipher)
x:
  source: https://github.com/campfirein/byterover-cli
rule:
  /npm:
    cmd: npm install -g byterover-cli
    reference: https://www.npmjs.com/package/byterover-cli
    dsnap: 'byterover-cli'
binlist:
- byterover-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 428 KB
          rating: 1
          desc:
            cn: 约 428 KB（估算）
            en: ~428 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
