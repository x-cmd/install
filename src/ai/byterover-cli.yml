lang: TypeScript
homepage: https://github.com/campfirein/byterover-cli
license: other
desc:
  cn: ByteRover CLI（brv），面向自主编码 Agent 的便携记忆层（原 Cipher）
  en: ByteRover CLI (brv) - The portable memory layer for autonomous coding agents (formerly Cipher)
x:
  source: https://github.com/campfirein/byterover-cli
rule:
  /npm:
    cmd: npm install -g byterover-cli
    reference: https://www.npmjs.com/package/byterover-cli
    dsnap: 'byterover-cli'
binlist:
- byterover-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
