lang: 'C++'
homepage: https://github.com/ggerganov/llama.cpp
license: 'MIT'
desc:
  cn: C/C++ 实现的 LLM 推理
  en: 'LLM inference in C/C++'
  cs: Inference LLM v C/C++
  de: LLM-Inferenz in C/C++
  es: Inferencia de LLM en C/C++
  fr: Inférence LLM en C/C++
  id: Inferensi LLM dalam C/C++
  it: Inferenza LLM in C/C++
  ja: C/C++によるLLM推論
  ko: C/C++로 구현한 LLM 추론
  pl: Wnioskowanie LLM w C/C++
  pt: Inferência de LLM em C/C++
  ro: Inferență LLM în C/C++
  ru: Вывод LLM на C/C++
  th: การอนุมาน LLM ด้วย C/C++
  tr: C/C++ ile LLM çıkarımı
  uk: Виведення LLM на C/C++
  vi: Suy luận LLM bằng C/C++
x:
  source: https://github.com/ggerganov/llama.cpp
  eget: ggerganov/llama.cpp
rule:
  /eget:
    cmd: x eget ggerganov/llama.cpp
    reference: https://github.com/ggerganov/llama.cpp
binlist:
  - 'llama.cpp'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 43 MB
          rating: 2
          desc:
            cn: 约 43 MB（估算）
            en: ~43 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
