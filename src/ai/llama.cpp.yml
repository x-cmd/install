lang: 'C++'
homepage: https://github.com/ggerganov/llama.cpp
license: 'MIT'
desc:
  cn: C/C++ 实现的 LLM 推理
  en: 'LLM inference in C/C++'
x:
  source: https://github.com/ggerganov/llama.cpp
  eget: https://github.com/ggerganov/llama.cpp
rule:
  /eget:
    cmd: x eget ggerganov/llama.cpp
    reference: https://github.com/ggerganov/llama.cpp
binlist:
  - 'llama.cpp'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
