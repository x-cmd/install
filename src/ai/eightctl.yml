lang: Go
homepage: https://github.com/steipete/eightctl
license: mit
desc:
  cn: Eight Sleep 数据获取与设备控制的 CLI
  en: Eight Sleep cli to fetch data and control your pods.
  cs: CLI pro Eight Sleep pro získávání dat a ovládání vašich podů.
  de: Eight Sleep CLI zum Abrufen von Daten und Steuern Ihrer Pods.
  es: CLI de Eight Sleep para obtener datos y controlar tus pods.
  fr: CLI Eight Sleep pour récupérer des données et contrôler vos pods.
  id: CLI Eight Sleep untuk mengambil data dan mengendalikan pod Anda.
  it: CLI Eight Sleep per recuperare dati e controllare i tuoi pod.
  ja: Eight Sleep のデータを取得し、ポッドを制御する CLI。
  ko: 데이터를 가져오고 포드를 제어하는 Eight Sleep CLI.
  pl: CLI Eight Sleep do pobierania danych i sterowania Twoimi podami.
  pt: CLI da Eight Sleep para buscar dados e controlar seus pods.
  ro: CLI Eight Sleep pentru preluarea datelor și controlul pod-urilor tale.
  ru: CLI Eight Sleep для получения данных и управления вашими pod.
  th: CLI ของ Eight Sleep สำหรับดึงข้อมูลและควบคุมพอดของคุณ
  tr: Veri çekmek ve pod'larınızı kontrol etmek için Eight Sleep CLI.
  uk: CLI Eight Sleep для отримання даних і керування вашими pod.
  vi: CLI Eight Sleep để lấy dữ liệu và điều khiển các pod của bạn.
x:
  source: https://github.com/steipete/eightctl
  eget: steipete/eightctl
rule:
  /eget:
    cmd: x eget steipete/eightctl
    reference: https://github.com/steipete/eightctl
binlist:
- eightctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
