lang: Go
homepage: https://github.com/steipete/eightctl
license: mit
desc:
  cn: Eight Sleep 数据获取与设备控制的 CLI
  en: Eight Sleep cli to fetch data and control your pods.
x:
  source: https://github.com/steipete/eightctl
  eget: https://github.com/steipete/eightctl
rule:
  /eget:
    cmd: x eget steipete/eightctl
    reference: https://github.com/steipete/eightctl
binlist:
- eightctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 643 KB
          rating: 1
          desc:
            cn: 约 643 KB（估算）
            en: ~643 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
