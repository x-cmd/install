lang: TypeScript
homepage: https://sweetcookie.dev
license: mit
desc:
  cn: 浏览器 cookie 提取库，inline 优先 + 本地尽力读取；无原生 Node 插件，TypeScript 实现，跨 macOS/Windows/Linux
  en: Browser cookie extraction library. Inline-first with best-effort local reads. No native Node addons, TypeScript, cross-platform (macOS/Windows/Linux).
rule:
  /npm:
    cmd: npm i -g @steipete/sweet-cookie
    reference: https://github.com/steipete/sweet-cookie
    dsnap: '@steipete/sweet-cookie'
binlist:
  - sweet-cookie

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
