lang: Go
homepage: https://github.com/charmbracelet/mods
license: MIT
desc:
  cn: 命令行的 AI，为管道构建
  en: AI for the command line, built for pipelines.
x:
  source: https://github.com/charmbracelet/mods
  eget: https://github.com/charmbracelet/mods
  apt: mods
  brew: charmbracelet/tap/mods
  scoop: mods
  winget: mods
  powershell: install
  yay: mods
  go: github.com/charmbracelet/mods@latest
rule:
  /eget:
    cmd: x eget charmbracelet/mods
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/charmbracelet/mods@latest
    reference: https://github.com/charmbracelet/mods/?tab=readme-ov-file#install-mods
    dsnap: github.com/charmbracelet/mods@latest
  darwin/brew:
    cmd: brew install charmbracelet/tap/mods
    reference: https://github.com/charmbracelet/mods/?tab=readme-ov-file#install-mods
  arch/yay:
    cmd: yay -S mods
    reference: https://github.com/charmbracelet/mods/?tab=readme-ov-file#install-mods
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add https://github.com/charmbracelet/scoop-bucket.git \

      && x scoop install mods

      '
    reference: https://github.com/charmbracelet/mods/?tab=readme-ov-file#install-mods
  (win|wsl2)/winget:
    cmd: x winget install mods
    reference: https://github.com/charmbracelet/mods/?tab=readme-ov-file#install-mods
  debian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install mods

      '
    reference: https://github.com/charmbracelet/mods/?tab=readme-ov-file#install-mods
  ubuntu/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install mods

      '
    reference: https://github.com/charmbracelet/mods/?tab=readme-ov-file#install-mods
binlist:
- mods

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
