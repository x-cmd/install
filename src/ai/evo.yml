lang: Python
homepage: https://github.com/evo-hq/evo
license: apache-2.0
desc:
  cn: 通过并行 LLM 子代理自动跑实验、发现可优化指标、迭代改进代码库的"自主研究"编排器；植根于 Karpathy autoresearch，扩展为树搜索+共享状态+gate+远程沙箱。
  en: An autoresearch orchestrator that runs parallel LLM sub-agents to discover metrics, iterate on code via experiments, and hill-climb score in tree-search fashion — extends Karpathy's autoresearch with shared state, gates, and remote sandboxes.
x:
  source: https://github.com/evo-hq/evo
  pip: -U
  git: evo-hq/evo
rule:
  /pip:
    cmd: pip install -U evo-hq-cli
    reference: https://github.com/evo-hq/evo#install
    dsnap: evo-hq-cli
  /uv:
    cmd: uv tool install evo-hq-cli
    reference: https://github.com/evo-hq/evo#install
  /git:
    cmd: x git clone evo-hq/evo
    reference: https://github.com/evo-hq/evo#dev-install
binlist:
- evo
- evo-dashboard
- evo-drain
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 453 KB
          rating: 1
          desc:
            cn: 安装 453 KB
            en: 453 KB install
        download:
          estimate: 453 KB
          desc:
            cn: 约 453 KB 下载 (linux/x64)
            en: ~453 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
