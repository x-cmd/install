lang: Rust
homepage: https://github.com/graykode/abtop
license: MIT
desc:
  cn: abtop 是一个类似 top 的 CLI 工具，用于实时监控多个 AI 编程助手（Claude Code、Codex CLI 等）的 Token 用量、上下文窗口和速率限制。
  en: abtop is a top-like CLI tool for real-time monitoring of multiple AI coding agents, showing token usage, context window, and rate limits.
x:
  source: https://github.com/graykode/abtop
  eget: https://github.com/graykode/abtop
rule:
  /eget:
    cmd: x eget graykode/abtop
    reference: https://x-cmd.com/mod/eget
  (darwin|linux)/curl:
    cmd: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/graykode/abtop/releases/latest/download/abtop-installer.sh | sh
    reference: https://github.com/graykode/abtop?tab=readme-ov-file#install
  /cargo:
    cmd: cargo install abtop
    reference: https://github.com/graykode/abtop?tab=readme-ov-file#install
    dsnap: abtop
binlist:
- abtop

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 782 KB
          rating: 1
          desc:
            cn: 安装 782 KB
            en: 782 KB install
        download:
          estimate: 782 KB
          desc:
            cn: 约 782 KB 下载 (linux/x64)
            en: ~782 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
