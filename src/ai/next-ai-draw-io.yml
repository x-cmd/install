lang: TypeScript
homepage: https://github.com/DayuanJiang/next-ai-draw-io
license: apache-2.0
desc:
  cn: 通过 Web 或桌面应用用自然语言生成和编辑 draw.io 图表，包括复杂云架构和流程图
  en: Generate and edit draw.io diagrams, including complex cloud architectures and flowcharts, using natural language commands in a web or desktop app.
x:
  source: https://github.com/DayuanJiang/next-ai-draw-io
rule:
  /npm:
    cmd: x npm install -g next-ai-draw-io
    reference: https://www.npmjs.com/package/next-ai-draw-io
  /git:
    cmd: x git clone DayuanJiang/next-ai-draw-io
    reference: https://github.com/DayuanJiang/next-ai-draw-io
  /dsnap:
    cmd: x dsnap DayuanJiang/next-ai-draw-io
    reference: https://github.com/DayuanJiang/next-ai-draw-io
binlist:
- next-ai-draw-io

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 63 KB
          rating: 1
          desc:
            cn: 约 63 KB（估算）
            en: ~63 KB estimated
        download:
          estimate: 725 B
          desc:
            cn: 约 725 B 下载 (linux/arm64)
            en: ~725 B download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
