lang: TypeScript
homepage: https://github.com/jamubc/gemini-mcp-tool
license: other
desc:
  cn: 让 AI 助手对接 Google Gemini CLI 的 MCP 服务器，借助超大 token 窗口分析大文件与理解代码库
  en: MCP server that enables AI assistants to interact with Google Gemini CLI, leveraging Gemini's massive token window for large file analysis and codebase understanding
x:
  source: https://github.com/jamubc/gemini-mcp-tool
rule:
  /npm:
    cmd: npm install -g gemini-mcp-tool
    reference: https://www.npmjs.com/package/gemini-mcp-tool
    dsnap: 'gemini-mcp-tool'
binlist:
- gemini-mcp-tool

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
