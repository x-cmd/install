lang: Python
homepage: https://github.com/peterdemin/openai-cli
license: mit
desc:
  cn: OpenAI API 的命令行客户端
  en: Command-line client for OpenAI APIs
x:
  source: https://github.com/peterdemin/openai-cli
rule:
  /pip:
    cmd: pip install openai-cli
    reference: https://pypi.org/project/openai-cli/
    dsnap: openai-cli
binlist:
- openai-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
