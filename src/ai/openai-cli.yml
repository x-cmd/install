lang: Python
homepage: https://github.com/peterdemin/openai-cli
license: mit
desc:
  cn: OpenAI API 的命令行客户端
  en: Command-line client for OpenAI APIs
x:
  source: https://github.com/peterdemin/openai-cli
rule:
  /pip:
    cmd: pip install openai-cli
    reference: https://pypi.org/project/openai-cli/
    dsnap: openai-cli
binlist:
- openai-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
