lang: Shell
homepage: https://github.com/mattpocock/skills
license: mit
desc:
  cn: 从终端运行模块化的 AI 脚本，自动化项目规划、TDD、代码重构、工具配置等软件开发任务
  en: Run modular, AI-powered scripts from your terminal to automate software development tasks like project planning, TDD, code refactoring, and tooling setup.
x:
  source: https://github.com/mattpocock/skills
  eget: https://github.com/mattpocock/skills
rule:
  /eget:
    cmd: x eget mattpocock/skills
    reference: https://github.com/mattpocock/skills
binlist:
- skills

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
