lang: Python
homepage: https://github.com/harry0703/MoneyPrinterTurbo
license: mit
desc:
  cn: 借助 AI 大模型一键生成高清短视频
  en: 利用AI大模型，一键生成高清短视频 Generate short videos with one click using AI LLM.
x:
  source: https://github.com/harry0703/MoneyPrinterTurbo
  eget: https://github.com/harry0703/MoneyPrinterTurbo
rule:
  /eget:
    cmd: x eget harry0703/MoneyPrinterTurbo
    reference: https://github.com/harry0703/MoneyPrinterTurbo
binlist:
- MoneyPrinterTurbo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 901 MB
          rating: 4
          desc:
            cn: 安装 901 MB
            en: 901 MB install
        download:
          estimate: 901 MB
          desc:
            cn: 约 901 MB 下载 (win/arm64)
            en: ~901 MB download (win/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: none
