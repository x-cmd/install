lang: Python
homepage: https://github.com/harry0703/MoneyPrinterTurbo
license: mit
desc:
  cn: 借助 AI 大模型一键生成高清短视频
  en: 利用AI大模型，一键生成高清短视频 Generate short videos with one click using AI LLM.
x:
  source: https://github.com/harry0703/MoneyPrinterTurbo
  eget: https://github.com/harry0703/MoneyPrinterTurbo
rule:
  /eget:
    cmd: x eget harry0703/MoneyPrinterTurbo
    reference: https://github.com/harry0703/MoneyPrinterTurbo
binlist:
- MoneyPrinterTurbo

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
