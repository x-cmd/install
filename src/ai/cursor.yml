lang: TypeScript
homepage: https://github.com/getcursor/cursor
license: NOASSERTION
desc:
  cn: 深度集成了 AI 辅助编程功能的现代化代码编辑器
  en: A modern code editor with deep AI-assisted coding integration
x:
  source: https://github.com/getcursor/cursor
  brew: --cask
rule:
  /curl:
    cmd: curl https://cursor.com/install -fsS | bash
    reference: https://cursor.com/download
  darwin/brew:
    cmd: brew install --cask cursor
    reference: https://formulae.brew.sh/cask/cursor#default
  arch/yay:
    cmd: yay -S cursor-bin
    reference: https://aur.archlinux.org/packages/cursor-bin
  win/winget:
    cmd: winget install Cursor.Cursor
    reference: https://winstall.app/apps/Anysphere.Cursor
binlist:
  - cursor

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
