lang: Go
homepage: https://github.com/tbckr/sgpt
license: MIT
desc:
  cn: SGPT（也称为 shell-gpt）是一个强大的命令行界面（CLI）工具，旨在通过终端直接与 OpenAI 模型进行无缝交互。
  en: SGPT (aka shell-gpt) is a powerful command-line interface (CLI) tool designed for seamless interaction with OpenAI models directly from your terminal.
x:
  source: https://github.com/tbckr/sgpt
  eget: https://github.com/tbckr/sgpt
rule:
  /eget:
    cmd: x eget tbckr/sgpt
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tbckr/tap/sgpt
    reference: https://github.com/tbckr/sgpt?tab=readme-ov-file#macos
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add tbckr https://github.com/tbckr/scoop-bucket.git && \

      x scoop install tbckr/sgpt

      '
    reference: https://github.com/tbckr/sgpt?tab=readme-ov-file#windows
  /go:
    cmd: go install github.com/tbckr/sgpt/v2/cmd/sgpt@latest
    reference: https://github.com/tbckr/sgpt?tab=readme-ov-file#using-go
    dsnap: sgpt
  arch/yay:
    cmd: yay -S shell-gpt
    reference: https://aur.archlinux.org/packages/shell-gpt
binlist:
- sgpt

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
