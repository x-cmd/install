lang: Python
homepage: https://github.com/adhikasp/mcp-client-cli
license: mit
desc:
  cn: 运行 LLM 提示并实现 MCP 客户端的简易 CLI
  en: A simple CLI to run LLM prompt and implement MCP client.
x:
  source: https://github.com/adhikasp/mcp-client-cli
  eget: https://github.com/adhikasp/mcp-client-cli
rule:
  /eget:
    cmd: x eget adhikasp/mcp-client-cli
    reference: https://github.com/adhikasp/mcp-client-cli
binlist:
- mcp-client-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
