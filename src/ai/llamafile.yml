lang: 'C++'
homepage: https://github.com/Mozilla-Ocho/llamafile
license: 'NOASSERTION'
desc:
  cn: 用单一文件分发并运行 LLM
  en: 'Distribute and run LLMs with a single file.'
  cs: Distribuujte a spouštějte LLM v jediném souboru.
  de: LLMs mit einer einzigen Datei verteilen und ausführen.
  es: Distribuye y ejecuta LLM con un solo archivo.
  fr: Distribuez et exécutez des LLM avec un seul fichier.
  id: Distribusikan dan jalankan LLM dengan satu file.
  it: Distribuisci ed esegui LLM con un unico file.
  ja: 単一ファイルでLLMを配布・実行します。
  ko: 단일 파일로 LLM을 배포하고 실행합니다.
  pl: Dystrybuuj i uruchamiaj LLM w jednym pliku.
  pt: Distribua e execute LLMs com um único arquivo.
  ro: Distribuiți și rulați LLM cu un singur fișier.
  ru: Распространяйте и запускайте LLM с помощью одного файла.
  th: กระจายและรัน LLM ด้วยไฟล์เดียว
  tr: LLM'leri tek bir dosyayla dağıtın ve çalıştırın.
  uk: Розповсюджуйте та запускайте LLM за допомогою одного файлу.
  vi: Phân phối và chạy LLM bằng một tệp duy nhất.
x:
  source: https://github.com/Mozilla-Ocho/llamafile
  eget: Mozilla-Ocho/llamafile
rule:
  /eget:
    cmd: x eget Mozilla-Ocho/llamafile
    reference: https://github.com/Mozilla-Ocho/llamafile
binlist:
  - 'llamafile'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.2 MB
          rating: 1
          desc:
            cn: 约 2.2 MB（估算）
            en: ~2.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
