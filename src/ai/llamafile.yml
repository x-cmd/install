lang: 'C++'
homepage: https://github.com/Mozilla-Ocho/llamafile
license: 'NOASSERTION'
desc:
  cn: 用单一文件分发并运行 LLM
  en: 'Distribute and run LLMs with a single file.'
x:
  source: https://github.com/Mozilla-Ocho/llamafile
  eget: https://github.com/Mozilla-Ocho/llamafile
rule:
  /eget:
    cmd: x eget Mozilla-Ocho/llamafile
    reference: https://github.com/Mozilla-Ocho/llamafile
binlist:
  - 'llamafile'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
