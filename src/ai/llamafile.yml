lang: 'C++'
homepage: https://github.com/Mozilla-Ocho/llamafile
license: 'NOASSERTION'
desc:
  cn: 用单一文件分发并运行 LLM
  en: 'Distribute and run LLMs with a single file.'
x:
  source: https://github.com/Mozilla-Ocho/llamafile
  eget: https://github.com/Mozilla-Ocho/llamafile
rule:
  /eget:
    cmd: x eget Mozilla-Ocho/llamafile
    reference: https://github.com/Mozilla-Ocho/llamafile
binlist:
  - 'llamafile'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.2 MB
          rating: 1
          desc:
            cn: 约 2.2 MB（估算）
            en: ~2.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
