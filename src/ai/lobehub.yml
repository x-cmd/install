lang: 'TypeScript'
homepage: https://github.com/lobehub/lobe-chat
license: 'NOASSERTION'
desc:
  cn: LobeHub 是你的首席智能体运营官，将智能体编排为 7×24 全天候运营团队
  en: '🤯 LobeHub is your Chief Agent Operator, organizing your agents into 7×24 operations by hiring, scheduling, and reporting on your entire AI team.'
  cs: 🤯 LobeHub je váš hlavní agent provozní důstojník, který organizuje vaše agenty do nepřetržitého provozu 7×24 tím, že najímá, plánuje a reportuje o celém vašem AI týmu.
  de: 🤯 LobeHub ist Ihr Chief Agent Operator, der Ihre Agenten durch Einstellung, Planung und Berichte über Ihr gesamtes KI-Team in 7×24-Betrieb organisiert.
  es: 🤯 LobeHub es tu Chief Agent Operator, que organiza tus agentes en operaciones 7×24 contratando, programando e informando sobre todo tu equipo de IA.
  fr: 🤯 LobeHub est votre Chief Agent Operator, qui organise vos agents en opérations 7×24 en recrutant, planifiant et rendant compte de toute votre équipe d'IA.
  id: 🤯 LobeHub adalah Chief Agent Operator Anda, mengatur agen Anda menjadi operasi 7×24 dengan merekrut, menjadwalkan, dan melapor tentang seluruh tim AI Anda.
  it: 🤯 LobeHub è il tuo Chief Agent Operator, che organizza i tuoi agenti in operazioni 7×24 assumendo, pianificando e rendicontando sull'intero team di IA.
  ja: 🤯 LobeHub は、主エージェント オペレーターとしてあなたのエージェントを 7×24 運用に整え、AI チーム全体の採用・スケジュール管理・報告を行います。
  ko: 🤯 LobeHub는 전체 AI 팀의 채용, 일정 관리, 보고를 통해 에이전트를 7×24 운영으로 조직하는 최고 에이전트 오퍼레이터입니다.
  pl: 🤯 LobeHub to Twój Główny Operator Agentów, który organizuje Twoich agentów w działalność 7×24 poprzez rekrutowanie, planowanie i raportowanie o całym zespole AI.
  pt: 🤯 LobeHub é o seu Chief Agent Operator, organizando seus agentes em operações 7×24 ao contratar, agendar e relatar sobre toda a sua equipe de IA.
  ro: 🤯 LobeHub este Operatorul dumneavoastră Principal de Agenți, care organizează agenții în operațiuni 7×24 prin angajare, programare și raportare asupra întregii echipe AI.
  ru: 🤯 LobeHub — ваш главный оператор агентов, который организует работу ваших агентов 24/7, нанимая их, планируя задачи и отчитываясь по всей вашей AI-команде.
  th: 🤯 LobeHub คือผู้บริหารเอเจนต์หลักของคุณ จัดการเอเจนต์ของคุณให้ทำงานต่อเนื่อง 7×24 ด้วยการจ้างงาน จัดตาราง และรายงานผลของทีม AI ทั้งหมด
  tr: 🤯 LobeHub, yapay zeka ekibinizin tamamını işe alarak, programlayarak ve raporlayarak ajanlarınızı 7×24 operasyona dönüştüren Şef Ajan Operatörünüzdür.
  uk: 🤯 LobeHub — ваш головний оператор агентів, який організує ваших агентів у режим 7×24, наймаючи їх, плануючи та звітуючи про всю вашу AI-команду.
  vi: 🤯 LobeHub là Nhà điều hành Agent trưởng của bạn, tổ chức các agent của bạn thành hoạt động 7×24 bằng cách tuyển dụng, lên lịch và báo cáo toàn bộ đội ngũ AI của bạn.
x:
  source: https://github.com/lobehub/lobe-chat
  eget: lobehub/lobe-chat
rule:
  /eget:
    cmd: x eget lobehub/lobe-chat
    reference: https://github.com/lobehub/lobe-chat
binlist:
  - 'lobehub'

# complicated
