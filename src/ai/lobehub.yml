lang: 'TypeScript'
homepage: https://github.com/lobehub/lobe-chat
license: 'NOASSERTION'
desc:
  cn: LobeHub 是你的首席智能体运营官，将智能体编排为 7×24 全天候运营团队
  en: '🤯 LobeHub is your Chief Agent Operator, organizing your agents into 7×24 operations by hiring, scheduling, and reporting on your entire AI team.'
x:
  source: https://github.com/lobehub/lobe-chat
  eget: https://github.com/lobehub/lobe-chat
rule:
  /eget:
    cmd: x eget lobehub/lobe-chat
    reference: https://github.com/lobehub/lobe-chat
binlist:
  - 'lobehub'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
