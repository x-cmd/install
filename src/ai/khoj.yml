lang: 'Python'
homepage: https://github.com/khoj-ai/khoj
license: 'AGPL-3.0'
desc:
  cn: 你的 AI 第二大脑，可自托管，支持联网或本地文档问答、自定义智能体与深度研究
  en: 'Your AI second brain. Self-hostable. Get answers from the web or your docs. Build custom agents, schedule automations, do deep research. Turn any online or local LLM into your personal, autonomous ...'
x:
  source: https://github.com/khoj-ai/khoj
  eget: https://github.com/khoj-ai/khoj
rule:
  /eget:
    cmd: x eget khoj-ai/khoj
    reference: https://github.com/khoj-ai/khoj
binlist:
  - 'khoj'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 157 KB
          rating: 1
          desc:
            cn: 约 157 KB（估算）
            en: ~157 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
