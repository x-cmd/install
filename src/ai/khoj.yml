desc:
  cn: 你的 AI 第二大脑，可自托管，支持联网或本地文档问答、自定义智能体与深度研究
  en: 'Your AI second brain. Self-hostable. Get answers from the web or your docs. Build custom agents, schedule automations, do deep research. Turn any online or local LLM into your personal, autonomous ...'
  cs: Vaše AI druhá mozek. Samostatně hostovaný. Získejte odpovědi z webu nebo svých dokumentů. Vytvářejte vlastní agenty, plánujte automatizace, provádějte hluboký výzkum. Proměňte jakýkoli online nebo lokální LLM ve svého osobního, autonomního ...
  de: Ihr zweites Gehirn mit KI. Selbst hostbar. Holen Sie Antworten aus dem Web oder Ihren Dokumenten. Bauen Sie eigene Agenten, planen Sie Automatisierungen, führen Sie tiefgehende Forschungen durch. Verwandeln Sie jedes Online- oder lokale LLM in Ihren persönlichen, autonomen ...
  es: Tu segundo cerebro con IA. Autoalojable. Obtén respuestas de la web o de tus documentos. Crea agentes personalizados, programa automatizaciones, realiza investigaciones profundas. Convierte cualquier LLM en línea o local en tu ... personal y autónomo.
  fr: Votre deuxième cerveau IA. Auto-hébergeable. Obtenez des réponses depuis le web ou vos documents. Créez des agents personnalisés, planifiez des automatisations, menez des recherches approfondies. Transformez n'importe quel LLM en ligne ou local en votre assistant personnel et autonome ...
  id: Otak kedua AI Anda. Dapat di-host sendiri. Dapatkan jawaban dari web atau dokumen Anda. Bangun agen kustom, jadwalkan otomatisasi, lakukan riset mendalam. Ubah LLM online atau lokal apa pun menjadi asisten pribadi Anda yang otonom ...
  it: Il tuo secondo cervello IA. Self-hostable. Ottieni risposte dal web o dai tuoi documenti. Crea agenti personalizzati, pianifica automazioni, svolgi ricerche approfondite. Trasforma qualsiasi LLM online o locale nel tuo assistente personale e autonomo ...
  ja: あなたの AI セカンドブレイン。セルフホスト可能。ウェブやドキュメントから回答を得ます。カスタムエージェントの作成、自動化のスケジュール設定、深掘り調査ができます。オンラインまたはローカルの LLM を你自己的で自律的な ...
  ko: 당신의 AI 세컨드 브레인. 자체 호스팅 가능. 웹이나 내 문서에서 답을 얻으세요. 사용자 정의 에이전트를 만들고, 자동화를 예약하고, 심층 조사를 수행하세요. 어떤 온라인 또는 로컬 LLM이든 개인적이고 자율적인 ...으로 바꾸세요.
  pl: Twój drugi mózg z AI. Możliwość samodzielnego hostowania. Uzyskuj odpowiedzi z sieci lub swoich dokumentów. Twórz własnych agentów, planuj automatyzacje, prowadź głębokie badania. Zamień dowolny LLM online lub lokalny w swojego osobistego, autonomicznego ...
  pt: Seu segundo cérebro com IA. Hospedável em sua própria máquina. Obtenha respostas da web ou dos seus documentos. Crie agentes personalizados, agende automações, faça pesquisas aprofundadas. Transforme qualquer LLM online ou local no seu ... pessoal e autônomo.
  ro: Al doilea tău creier cu AI. Poate fi găzduit de tine însuți. Primește răspunsuri de pe web sau din documentele tale. Construiește agenți personalizați, programează automatizări, fă cercetare profundă. Transformă orice LLM online sau local în asistentul tău personal și autonom ...
  ru: Ваш второй мозг на основе ИИ. Можно развернуть на своём сервере. Получайте ответы из интернета или из своих документов. Создавайте собственных агентов, планируйте автоматизации, проводите глубокие исследования. Превратите любую онлайн- или локальную LLM в персонального автономного ...
  th: สมองที่สองของคุณที่ขับเคลื่อนด้วย AI โฮสต์เองได้ รับคำตอบจากเว็บหรือเอกสารของคุณ สร้างเอเจนต์แบบกำหนดเอง ตั้งงานอัตโนมัติ และทำการวิจัยเชิงลึก เปลี่ยน LLM ออนไลน์หรือในเครื่องใดก็ตามให้เป็นผู้ช่วยส่วนตัวและเป็นอิสระของคุณ ...
  tr: Yapay zeka destekli ikinci beyniniz. Kendi sunucunuzda barındırılabilir. Web'den veya belgelerinizden yanıt alın. Özel ajanlar oluşturun, otomasyon planlayın, derinlemesine araştırma yapın. Çevrimiçi veya yerel herhangi bir LLM'yi kişisel, otonom ... asistanınıza dönüştürün.
  uk: Ваш другий мозок на основі ІІ. Можна розмістити на власному сервері. Отримуйте відповіді з інтернету або зі своїх документів. Створюйте власних агентів, плануйте автоматизації, проводьте глибокі дослідження. Перетворіть будь-яку онлайн- або локальну LLM на свого персонального автономного ...
  vi: Bộ não thứ hai AI của bạn. Có thể tự host. Nhận câu trả lời từ web hoặc tài liệu của bạn. Xây dựng tác nhân tùy chỉnh, lên lịch tự động hóa, thực hiện nghiên cứu chuyên sâu. Biến bất kỳ LLM trực tuyến hay cục bộ nào thành trợ lý cá nhân và tự chủ ... của bạn.
x:
  source: https://github.com/khoj-ai/khoj
  eget: khoj-ai/khoj
rule:
  /eget:
    cmd: x eget khoj-ai/khoj
    reference: https://github.com/khoj-ai/khoj
binlist:
  - 'khoj'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 157 KB
          rating: 1
          desc:
            cn: 约 157 KB（估算）
            en: ~157 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
