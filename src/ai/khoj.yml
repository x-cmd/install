lang: 'Python'
homepage: https://github.com/khoj-ai/khoj
license: 'AGPL-3.0'
desc:
  cn: 你的 AI 第二大脑，可自托管，支持联网或本地文档问答、自定义智能体与深度研究
  en: 'Your AI second brain. Self-hostable. Get answers from the web or your docs. Build custom agents, schedule automations, do deep research. Turn any online or local LLM into your personal, autonomous ...'
x:
  source: https://github.com/khoj-ai/khoj
  eget: https://github.com/khoj-ai/khoj
rule:
  /eget:
    cmd: x eget khoj-ai/khoj
    reference: https://github.com/khoj-ai/khoj
binlist:
  - 'khoj'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
