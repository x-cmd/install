lang: TypeScript
homepage: https://github.com/IRISX-AI/IRIS-Mini
license: other
desc:
  cn: 面向 Agent 的 CLI 助手，从终端直接搭建代码骨架、操作本地文件系统并自动化开发工作流，纯执行零摩擦
  en: IRIS Mini ⚡ — The agentic CLI heartbeat. Scaffolds code 🏗️, commands the local filesystem 📂, and automates your developer workflow directly from the terminal 🚀. Pure execution, zero friction, local...
x:
  source: https://github.com/IRISX-AI/IRIS-Mini
  eget: https://github.com/IRISX-AI/IRIS-Mini
rule:
  /eget:
    cmd: x eget IRISX-AI/IRIS-Mini
    reference: https://github.com/IRISX-AI/IRIS-Mini
binlist:
- IRIS-Mini

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
