lang: Python
homepage: https://github.com/Aider-AI/aider
license: Apache-2.0
desc:
  cn: aider 是一个终端中的 AI 配对编程工具。
  en: aider is AI pair programming in your terminal
  cs: aider je programování ve dvojici s AI ve vašem terminálu
  de: aider ist KI-Pair-Programming in Ihrem Terminal
  es: aider es programación en pareja con IA en tu terminal
  fr: aider est du pair programming avec l'IA dans votre terminal
  id: aider adalah pair programming dengan AI di terminal Anda
  it: aider è il pair programming con l'IA nel tuo terminale
  ja: aider はターミナル内での AI ペアプログラミングです
  ko: aider는 터미널에서 이루어지는 AI 페어 프로그래밍입니다
  pl: aider to programowanie w parach z AI w twoim terminalu
  pt: aider é programação em par com IA no seu terminal
  ro: aider este programare în pereche cu AI în terminalul dumneavoastră
  ru: aider — это парное программирование с ИИ прямо в вашем терминале
  th: aider คือการเขียนโค้ดคู่กับ AI ในเทอร์มินัลของคุณ
  tr: aider, terminalinizde yapay zekâ ile eşle programlamadır
  uk: aider — це парне програмування з ШІ прямо у вашому терміналі
  vi: aider là lập trình đôi với AI ngay trong terminal của bạn
x:
  source: https://github.com/Aider-AI/aider
  brew: aider
  yay: aider-chat
rule:
  /x:
    cmd: x pkg use aider
    reference: https://x-cmd.com/install/
  win/powershell:
    cmd: x pwsh -ExecutionPolicy ByPass -c "irm https://aider.chat/install.ps1 | iex"
    reference: https://aider.chat/docs/install.html#windows
  /curl:
    cmd: curl -LsSf https://aider.chat/install.sh | sh
    reference: https://aider.chat/docs/install.html#mac--linux
  /wget:
    cmd: wget -qO- https://aider.chat/install.sh | sh
    reference: https://aider.chat/docs/install.html#mac--linux
  /pipx:
    cmd: pipx install aider-chat
    reference: https://aider.chat/docs/install.html#install-with-pipx
  /pip:
    cmd: python -m pip install -U --upgrade-strategy only-if-needed aider-chat
    reference: https://aider.chat/docs/install.html#install-with-pip
    # dsnap-dep: gcc
    dsnap: aider-chat
  /uv:
    cmd: uv tool install --force --python python3.12 aider-chat@latest
    reference: https://aider.chat/docs/install.html#install-with-uv
    dsnap: aider-chat
  darwin/brew:
    cmd: brew install aider
    reference: https://formulae.brew.sh/formula/aider#default
  arch/yay:
    cmd: yay -S aider-chat
    reference: https://aur.archlinux.org/packages/aider-chat

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 81 KB
          rating: 1
          desc:
            cn: 约 81 KB（估算）
            en: ~81 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
