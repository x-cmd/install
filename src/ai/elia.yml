lang: Python
homepage: https://github.com/darrenburns/elia
license: Apache-2.0
desc:
  cn: elia 是一个与大型语言模型（LLM）交互的应用程序，完全在终端中运行，旨在以键盘为中心，既高效又有趣。
  en: elia is an application for interacting with LLMs which runs entirely in your terminal, and is designed to be keyboard-focused, efficient, and fun to use!
x:
  source: https://github.com/darrenburns/elia
rule:
  /pipx:
    cmd: pipx install --python 3.11 elia-chat
    reference: https://github.com/darrenburns/elia?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S elia
    reference: https://aur.archlinux.org/packages/elia
binlist:
- elia

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
