lang: Python
homepage: https://github.com/HKUDS/LightRAG
license: mit
desc:
  cn: EMNLP2025 论文：简单快速的检索增强生成方案
  en: '[EMNLP2025] "LightRAG: Simple and Fast Retrieval-Augmented Generation"'
x:
  source: https://github.com/HKUDS/LightRAG
rule:
  /pip:
    cmd: pip install lightrag-hku
    reference: https://pypi.org/project/lightrag-hku/
    dsnap: lightrag-hku
binlist:
- LightRAG

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
