lang: Python
homepage: https://github.com/kharvd/gpt-cli
license: mit
desc:
  cn: ChatGPT、Claude 和 Bard 的命令行界面
  en: Command-line interface for ChatGPT, Claude and Bard
x:
  source: https://github.com/kharvd/gpt-cli
  eget: https://github.com/kharvd/gpt-cli
rule:
  /eget:
    cmd: x eget kharvd/gpt-cli
    reference: https://github.com/kharvd/gpt-cli
binlist:
- gpt-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
