lang: Python
homepage: https://github.com/kharvd/gpt-cli
license: mit
desc:
  cn: ChatGPT、Claude 和 Bard 的命令行界面
  en: Command-line interface for ChatGPT, Claude and Bard
x:
  source: https://github.com/kharvd/gpt-cli
  eget: https://github.com/kharvd/gpt-cli
rule:
  /eget:
    cmd: x eget kharvd/gpt-cli
    reference: https://github.com/kharvd/gpt-cli
binlist:
- gpt-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
