lang: Python
homepage: https://github.com/soxoj/maigret
license: mit
desc:
  cn: 仅凭用户名即可跨 3000+ 站点探测账号并生成详细 OSINT 档案，用于自查数字足迹、安全研究与授权调查。
  en: Find a person's online accounts across 3,000+ websites by username and generate detailed OSINT reports.
x:
  source: https://github.com/soxoj/maigret
rule:
  /pip:
    cmd: pip install maigret
    reference: https://github.com/soxoj/maigret
    dsnap: maigret
binlist:
- maigret

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
