lang: Python
homepage: https://github.com/soxoj/maigret
license: mit
desc:
  cn: 仅凭用户名即可跨 3000+ 站点探测账号并生成详细 OSINT 档案，用于自查数字足迹、安全研究与授权调查。
  en: Find a person's online accounts across 3,000+ websites by username and generate detailed OSINT reports.
x:
  source: https://github.com/soxoj/maigret
rule:
  /pip:
    cmd: pip install maigret
    reference: https://github.com/soxoj/maigret
    dsnap: maigret
binlist:
- maigret

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 43 KB
          rating: 1
          desc:
            cn: 约 43 KB（估算）
            en: ~43 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
