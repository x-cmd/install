lang: JavaScript
homepage: https://github.com/decolua/9router
license: mit
desc:
  cn: 本地 AI 路由网关，聚合 40+ Provider、100+ 模型，自动 fallback、RTK 压缩省 20-40% token，统一接入 Claude Code / Codex / Cursor 等编程工具。
  en: Local AI router that aggregates 40+ providers and 100+ models with auto-fallback and RTK token compression (20-40% savings), unifying Claude Code / Codex / Cursor and other coding tools.
x:
  source: https://github.com/decolua/9router
rule:
  /npm:
    cmd: npm install -g 9router
    reference: https://github.com/decolua/9router#-quick-start
    dsnap: 9router
binlist:
- 9router

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
