lang: 'Go'
homepage: https://github.com/milvus-io/milvus
license: 'Apache-2.0'
desc:
  cn: 为可扩展向量 ANN 检索打造的高性能云原生向量数据库
  en: 'Milvus is a high-performance, cloud-native vector database built for scalable vector ANN search'
x:
  source: https://github.com/milvus-io/milvus
  eget: https://github.com/milvus-io/milvus
rule:
  /eget:
    cmd: x eget milvus-io/milvus
    reference: https://github.com/milvus-io/milvus
binlist:
  - 'milvus'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 175 MB
          rating: 3
          desc:
            cn: 约 175 MB（估算）
            en: ~175 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 极低
          en: Negligible
