lang: 'Go'
homepage: https://github.com/milvus-io/milvus
license: 'Apache-2.0'
desc:
  cn: 为可扩展向量 ANN 检索打造的高性能云原生向量数据库
  en: 'Milvus is a high-performance, cloud-native vector database built for scalable vector ANN search'
x:
  source: https://github.com/milvus-io/milvus
  eget: https://github.com/milvus-io/milvus
rule:
  /eget:
    cmd: x eget milvus-io/milvus
    reference: https://github.com/milvus-io/milvus
binlist:
  - 'milvus'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
