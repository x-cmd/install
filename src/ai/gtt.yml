lang: Go
homepage: https://github.com/eeeXun/GTT
license: MIT
desc:
  cn: Google Translate TUI（最初版本）目前支持 Apertium、Bing、ChatGPT、DeepL、DeepLX、Google、LibreTranslate 和 Reverso 等翻译服务。
  en: Google Translate TUI (Originally). Currently supports Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate, Reverso.
  cs: Google Translate TUI (původní verze). Aktuálně podporuje Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate a Reverso.
  de: Google Translate TUI (Original). Unterstützt derzeit Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate und Reverso.
  es: Google Translate TUI (original). Actualmente admite Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate y Reverso.
  fr: Google Translate TUI (version originale). Prend actuellement en charge Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate et Reverso.
  id: Google Translate TUI (versi asli). Saat ini mendukung Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate, dan Reverso.
  it: Google Translate TUI (versione originale). Attualmente supporta Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate e Reverso.
  ja: Google Translate TUI (オリジナル版)。現在 Apertium、Bing、ChatGPT、DeepL、DeepLX、Google、LibreTranslate、Reverso に対応しています。
  ko: Google Translate TUI(오리지널). 현재 Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate, Reverso를 지원합니다.
  pl: Google Translate TUI (oryginał). Obecnie obsługuje Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate i Reverso.
  pt: Google Translate TUI (original). Atualmente suporta Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate e Reverso.
  ro: Google Translate TUI (original). Acceptă momentan Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate și Reverso.
  ru: Google Translate TUI (оригинальная версия). В настоящее время поддерживает Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate и Reverso.
  th: Google Translate TUI (เวอร์ชันดั้งเดิม) ปัจจุบันรองรับ Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate และ Reverso
  tr: Google Translate TUI (orijinal). Şu anda Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate ve Reverso destekleniyor.
  uk: Google Translate TUI (оригінальна версія). Наразі підтримує Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate та Reverso.
  vi: Google Translate TUI (bản gốc). Hiện hỗ trợ Apertium, Bing, ChatGPT, DeepL, DeepLX, Google, LibreTranslate và Reverso.
x:
  source: https://github.com/eeeXun/GTT
  eget: eeeXun/GTT
  yay: gtt-bin
rule:
  /eget:
    cmd: x eget eeeXun/GTT
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S gtt-bin
    reference: https://github.com/eeeXun/GTT?tab=readme-ov-file#arch-linux-aur
  nix/nix-shell:
    cmd: nix-shell -p '(import <nixpkgs-unstable> {}).gtt' --run gtt
    reference: https://github.com/eeeXun/GTT?tab=readme-ov-file#nix-%EF%B8%8F-nixpkgs-unstable
  /go:
    cmd: go install -ldflags="-s -w" github.com/eeeXun/gtt@latest
    reference: https://github.com/eeeXun/GTT?tab=readme-ov-file#go-install
    dsnap: github.com/eeeXun/gtt@latest
binlist:
- gtt

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
