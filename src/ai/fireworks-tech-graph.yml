lang: HTML
homepage: https://github.com/yizhiyanhua-ai/fireworks-tech-graph
license: mit
desc:
  cn: yizhiyanhua-ai 开源的 Claude Code Skill——用自然语言（中/英）描述系统即可生成 8 种风格、14 种 UML / AI Agent 架构图的 SVG + 1920px PNG，专为 AI/RAG/Mem0/Multi-Agent 等场景内置领域知识，无需写 DSL、无需拖拽。
  en: yizhiyanhua-ai's open-source Claude Code Skill that turns natural-language (Chinese/English) system descriptions into SVG + 1920px PNG diagrams across 8 visual styles and 14 UML / AI-Agent diagram types, with built-in domain knowledge for AI/RAG/Mem0/Multi-Agent patterns — no DSL, no drag-and-drop.
  cs: Open-source Claude Code Skill od yizhiyanhua-ai, který přeměňuje přirozené jazykové popisy systémů (čínština/angličtina) na SVG a PNG o šířce 1920 px v 8 vizuálních stylech a 14 typech diagramů UML / AI Agent, s vestavěnou oborovou znalostí pro vzory AI/RAG/Mem0/Multi-Agent — bez DSL a bez táhnutí myší.
  de: Open-Source-Claude-Code-Skill von yizhiyanhua-ai, der natürlichsprachliche Systembeschreibungen (Chinesisch/Englisch) in SVG- und 1920-px-PNG-Diagramme in 8 visuellen Stilen und 14 UML-/AI-Agent-Diagrammtypen verwandelt, mit eingebautem Domänenwissen für AI/RAG/Mem0/Multi-Agent-Muster — ohne DSL, ohne Drag-and-drop.
  es: Claude Code Skill de código abierto de yizhiyanhua-ai que convierte descripciones de sistemas en lenguaje natural (chino/inglés) en diagramas SVG y PNG de 1920 px en 8 estilos visuales y 14 tipos de diagramas UML / AI Agent, con conocimiento del dominio integrado para patrones AI/RAG/Mem0/Multi-Agent, sin DSL ni arrastrar y soltar.
  fr: Claude Code Skill open source de yizhiyanhua-ai qui transforme des descriptions de systèmes en langage naturel (chinois/anglais) en diagrammes SVG et PNG de 1920 px, dans 8 styles visuels et 14 types de diagrammes UML / AI Agent, avec des connaissances métier intégrées pour les motifs AI/RAG/Mem0/Multi-Agent — sans DSL ni glisser-déposer.
  id: Claude Code Skill sumber terbuka dari yizhiyanhua-ai yang mengubah deskripsi sistem dalam bahasa alami (Tionghoa/Inggris) menjadi diagram SVG dan PNG 1920px dalam 8 gaya visual dan 14 jenis diagram UML / AI Agent, dengan pengetahuan domain bawaan untuk pola AI/RAG/Mem0/Multi-Agent — tanpa DSL, tanpa seret dan lepas.
  it: Claude Code Skill open source di yizhiyanhua-ai che trasforma descrizioni di sistem in linguaggio naturale (cinese/inglese) in diagrammi SVG e PNG da 1920 px, in 8 stili visivi e 14 tipi di diagramma UML / AI Agent, con conoscenze di dominio integrate per i pattern AI/RAG/Mem0/Multi-Agent — senza DSL e senza drag-and-drop.
  ja: yizhiyanhua-ai のオープンソース Claude Code Skill。日本語や英語などの自然言語で書いたシステム説明を、8 種類の視覚スタイルと 14 種類の UML / AI-Agent 図の SVG と 1920px PNG に変換します。AI/RAG/Mem0/Multi-Agent パターン向けの領域知識を組み込み済みで、DSL もドラッグ＆ドロップも不要です。
  ko: yizhiyanhua-ai의 오픈소스 Claude Code 스킬로, 중국어/영어 등 자연어로 작성한 시스템 설명을 8가지 시각 스타일과 14종류의 UML / AI-Agent 다이어그램 SVG 및 1920px PNG로 변환합니다. AI/RAG/Mem0/Multi-Agent 패턴을 위한 도메인 지식이 내장되어 있으며 DSL이나 드래그 앤 드롭이 필요 없습니다.
  pl: Open-source'owy Claude Code Skill od yizhiyanhua-ai, który zamienia opisy systemów w języku naturalnym (chiński/angielski) w diagramy SVG i PNG 1920 px w 8 stylach wizualnych i 14 typach diagramów UML / AI Agent, ze wbudowaną wiedzą dziedzinową dla wzorców AI/RAG/Mem0/Multi-Agent — bez DSL i bez przeciągania.
  pt: Claude Code Skill de código aberto da yizhiyanhua-ai que transforma descrições de sistemas em linguagem natural (chinês/inglês) em diagramas SVG e PNG de 1920 px, com 8 estilos visuais e 14 tipos de diagramas UML / AI Agent, com conhecimento de domínio integrado para padrões AI/RAG/Mem0/Multi-Agent — sem DSL e sem arrastar e soltar.
  ro: Claude Code Skill open source de la yizhiyanhua-ai care transformă descrierile de sisteme în limbaj natural (chinezesc/engleză) în diagrame SVG și PNG de 1920 px, cu 8 stiluri vizuale și 14 tipuri de diagrame UML / AI Agent, cu cunoștințe de domeniu integrate pentru modelele AI/RAG/Mem0/Multi-Agent — fără DSL și fără drag-and-drop.
  ru: Открытый Claude Code Skill от yizhiyanhua-ai, который превращает описания систем на естественном языке (китайском/английском) в SVG- и PNG-диаграммы шириной 1920 px в 8 визуальных стилях и 14 типах диаграмм UML / AI Agent, со встроенными предметными знаниями для паттернов AI/RAG/Mem0/Multi-Agent — без DSL и без перетаскивания.
  th: Claude Code Skill โอเพนซอร์สจาก yizhiyanhua-ai ที่เปลี่ยนคำอธิบายระบบเป็นภาษาธรรมชาติ (จีน/อังกฤษ) ให้เป็นไดอะแกรม SVG และ PNG ขนาด 1920px ใน 8 สไตล์ภาพ และ 14 ประเภทไดอะแกรม UML / AI Agent พร้อมความรู้เฉพาะทางสำหรับรูปแบบ AI/RAG/Mem0/Multi-Agent ที่ฝังมาในตัว ไม่ต้องใช้ DSL และไม่ต้องลากวาง
  tr: yizhiyanhua-ai tarafından geliştirilen açık kaynak Claude Code Skill; doğal dildeki (Çince/İngilizce) sistem açıklamalarını 8 görsel stil ve 14 UML / AI-Agent diyagram türünde SVG ve 1920px PNG'lere dönüştürür, AI/RAG/Mem0/Multi-Agent kalıpları için gömülü alan bilgisine sahiptir — DSL ve sürükle-bırak yok.
  uk: Відкритий Claude Code Skill від yizhiyanhua-ai, який перетворює описи систем природною мовою (китайською/англійською) на SVG- та PNG-діаграми шириною 1920 px у 8 візуальних стилях і 14 типах діаграм UML / AI Agent, із вбудованими галузевими знаннями для шаблонів AI/RAG/Mem0/Multi-Agent — без DSL і без перетягування.
  vi: Claude Code Skill mã nguồn mở của yizhiyanhua-ai, chuyển các mô tả hệ thống bằng ngôn ngữ tự nhiên (tiếng Trung/tiếng Anh) thành sơ đồ SVG và PNG 1920px với 8 phong cách trực quan và 14 loại sơ đồ UML / AI Agent, tích hợp kiến thức chuyên môn cho các mẫu AI/RAG/Mem0/Multi-Agent — không cần DSL, không cần kéo thả
x:
  source: https://github.com/yizhiyanhua-ai/fireworks-tech-graph
rule:
  /git:
    cmd: x git clone yizhiyanhua-ai/fireworks-tech-graph && mkdir -p ~/.claude/skills && mv fireworks-tech-graph ~/.claude/skills/fireworks-tech-graph
    reference: https://github.com/yizhiyanhua-ai/fireworks-tech-graph#-installation
  /npm:
    cmd: npx skills add yizhiyanhua-ai/fireworks-tech-graph
    reference: https://www.npmjs.com/package/@yizhiyanhua-ai/fireworks-tech-graph
    dsnap: skills
binlist:
- fireworks-tech-graph

