lang: 'Python'
homepage: 'https://github.com/lllyasviel/Fooocus'
license: 'GPL-3.0'
desc:
  cn: 专注于提示词与图像生成
  en: 'Focus on prompting and generating'
x:
  source: https://github.com/lllyasviel/Fooocus
  eget: https://github.com/lllyasviel/Fooocus
rule:
  /eget:
    cmd: x eget lllyasviel/Fooocus
    reference: https://github.com/lllyasviel/Fooocus
binlist:
  - 'Fooocus'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
