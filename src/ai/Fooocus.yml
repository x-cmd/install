x:
  source: https://github.com/lllyasviel/Fooocus
  eget: lllyasviel/Fooocus
rule:
  /eget:
    cmd: x eget lllyasviel/Fooocus
    reference: https://github.com/lllyasviel/Fooocus
binlist:
  - 'Fooocus'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 101 KB
          rating: 1
          desc:
            cn: 约 101 KB（估算）
            en: ~101 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
