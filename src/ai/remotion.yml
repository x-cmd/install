lang: TypeScript
homepage: https://github.com/remotion-dev/remotion
license: noassertion
desc:
  cn: 用 React 组件、CSS、Canvas、SVG、WebGL 等网页技术以编程方式创建视频。
  en: Create MP4 videos programmatically using React components, CSS, and other web technologies.
x:
  source: https://github.com/remotion-dev/remotion
rule:
  /npm:
    cmd: npm install -g remotion
    reference: https://github.com/remotion-dev/remotion
    dsnap: remotion
binlist:
- remotion

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
