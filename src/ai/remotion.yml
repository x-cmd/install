lang: TypeScript
homepage: https://github.com/remotion-dev/remotion
license: noassertion
desc:
  cn: 用 React 组件、CSS、Canvas、SVG、WebGL 等网页技术以编程方式创建视频。
  en: Create MP4 videos programmatically using React components, CSS, and other web technologies.
x:
  source: https://github.com/remotion-dev/remotion
rule:
  /npm:
    cmd: npm install -g remotion
    reference: https://github.com/remotion-dev/remotion
    dsnap: remotion
binlist:
- remotion

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.2 MB
          rating: 1
          desc:
            cn: 约 2.2 MB（估算）
            en: ~2.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
