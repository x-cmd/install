x:
  source: https://github.com/modelcontextprotocol/inspector
  npm: "@modelcontextprotocol/inspector"
rule:
  /npm:
    cmd: npm install -g @modelcontextprotocol/inspector
    reference: https://www.npmjs.com/package/@modelcontextprotocol/inspector
    dsnap: '@modelcontextprotocol/inspector'
binlist:
- inspector

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 403 KB
          rating: 1
          desc:
            cn: 约 403 KB（估算）
            en: ~403 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
