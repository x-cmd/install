lang: TypeScript
homepage: https://github.com/modelcontextprotocol/inspector
license: other
desc:
  cn: MCP 服务器可视化测试工具
  en: Visual testing tool for MCP servers
x:
  source: https://github.com/modelcontextprotocol/inspector
rule:
  /npm:
    cmd: npm install -g @modelcontextprotocol/inspector
    reference: https://www.npmjs.com/package/@modelcontextprotocol/inspector
    dsnap: '@modelcontextprotocol/inspector'
binlist:
- inspector

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
