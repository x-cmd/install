lang: Python
homepage: https://github.com/CursorTouch/Windows-MCP
license: mit
desc:
  cn: 面向 Windows 计算机使用的 MCP Server
  en: MCP Server for Computer Use in Windows
x:
  source: https://github.com/CursorTouch/Windows-MCP
  eget: https://github.com/CursorTouch/Windows-MCP
rule:
  /eget:
    cmd: x eget CursorTouch/Windows-MCP
    reference: https://github.com/CursorTouch/Windows-MCP
binlist:
- Windows-MCP

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
