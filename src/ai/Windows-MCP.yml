lang: Python
homepage: https://github.com/CursorTouch/Windows-MCP
license: mit
desc:
  cn: 面向 Windows 计算机使用的 MCP Server
  en: MCP Server for Computer Use in Windows
x:
  source: https://github.com/CursorTouch/Windows-MCP
  eget: https://github.com/CursorTouch/Windows-MCP
rule:
  /eget:
    cmd: x eget CursorTouch/Windows-MCP
    reference: https://github.com/CursorTouch/Windows-MCP
binlist:
- Windows-MCP

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 58 KB
          rating: 1
          desc:
            cn: 约 58 KB（估算）
            en: ~58 KB estimated
        download:
          estimate: 9 KB
          desc:
            cn: 约 9 KB 下载 (win/arm64)
            en: ~9 KB download (win/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
