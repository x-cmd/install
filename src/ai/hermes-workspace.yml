lang: JavaScript
homepage: https://github.com/outsourc-e/hermes-workspace
license: mit
desc:
  cn: 用统一工作区管理 AI 智能体的聊天、文件、记忆、技能与终端
  en: Manage AI agents with a unified workspace for chat, files, memory, skills, and a terminal.
x:
  source: https://github.com/outsourc-e/hermes-workspace
rule:
  /git:
    cmd: x git clone outsourc-e/hermes-workspace
    reference: https://github.com/outsourc-e/hermes-workspace
binlist:
- hermes-workspace

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
