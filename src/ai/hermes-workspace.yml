lang: JavaScript
homepage: https://github.com/outsourc-e/hermes-workspace
license: mit
desc:
  cn: 用统一工作区管理 AI 智能体的聊天、文件、记忆、技能与终端
  en: Manage AI agents with a unified workspace for chat, files, memory, skills, and a terminal.
x:
  source: https://github.com/outsourc-e/hermes-workspace
  git: outsourc-e/hermes-workspace
rule:
  /git:
    cmd: x git clone outsourc-e/hermes-workspace
    reference: https://github.com/outsourc-e/hermes-workspace
binlist:
- hermes-workspace

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 约 1.4 MB（估算）
            en: ~1.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
