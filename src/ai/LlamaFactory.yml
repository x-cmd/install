lang: Python
homepage: https://github.com/hiyouga/LlamaFactory
license: apache-2.0
desc:
  cn: 100+ LLM 与 VLM 的统一高效微调框架（ACL 2024）
  en: Unified Efficient Fine-Tuning of 100+ LLMs & VLMs (ACL 2024)
x:
  source: https://github.com/hiyouga/LlamaFactory
  eget: https://github.com/hiyouga/LlamaFactory
rule:
  /eget:
    cmd: x eget hiyouga/LlamaFactory
    reference: https://github.com/hiyouga/LlamaFactory
binlist:
- LlamaFactory

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 113 KB
          rating: 1
          desc:
            cn: 约 113 KB（估算）
            en: ~113 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
