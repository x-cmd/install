lang: Python
homepage: https://github.com/hiyouga/LlamaFactory
license: apache-2.0
desc:
  cn: 100+ LLM 与 VLM 的统一高效微调框架（ACL 2024）
  en: Unified Efficient Fine-Tuning of 100+ LLMs & VLMs (ACL 2024)
x:
  source: https://github.com/hiyouga/LlamaFactory
  eget: https://github.com/hiyouga/LlamaFactory
rule:
  /eget:
    cmd: x eget hiyouga/LlamaFactory
    reference: https://github.com/hiyouga/LlamaFactory
binlist:
- LlamaFactory

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
