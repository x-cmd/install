lang: Rust
homepage: https://github.com/zurawiki/gptcommit
license: mit
desc:
  cn: 用 LLM 撰写提交信息的 git prepare-commit-msg 钩子
  en: A git prepare-commit-msg hook for authoring commit messages with LLMs.
x:
  source: https://github.com/zurawiki/gptcommit
  eget: https://github.com/zurawiki/gptcommit
rule:
  /eget:
    cmd: x eget zurawiki/gptcommit
    reference: https://github.com/zurawiki/gptcommit
binlist:
- gptcommit

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
