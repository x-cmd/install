lang: Rust
homepage: https://github.com/zurawiki/gptcommit
license: mit
desc:
  cn: 用 LLM 撰写提交信息的 git prepare-commit-msg 钩子
  en: A git prepare-commit-msg hook for authoring commit messages with LLMs.
x:
  source: https://github.com/zurawiki/gptcommit
  eget: https://github.com/zurawiki/gptcommit
rule:
  /eget:
    cmd: x eget zurawiki/gptcommit
    reference: https://github.com/zurawiki/gptcommit
binlist:
- gptcommit

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
