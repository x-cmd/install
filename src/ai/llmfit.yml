lang: Rust
homepage: https://github.com/AlexsJones/llmfit
license: MIT
desc:
  en: Hundreds of models & providers. One command to find what runs on your hardware.
  cn: 数百个模型和提供商，一个命令找到能在你的硬件上运行的模型
x:
  source: https://github.com/AlexsJones/llmfit
  eget: https://github.com/AlexsJones/llmfit
  brew: llmfit
rule:
  /eget:
    cmd: x eget AlexsJones/llmfit
    reference: https://x-cmd.com/mod/eget
  (win|wsl2)/scoop:
    cmd: x scoop install llmfit
    reference: https://github.com/AlexsJones/llmfit?tab=readme-ov-file#install
  darwin/brew:
    cmd: brew install llmfit
    reference: https://github.com/AlexsJones/llmfit?tab=readme-ov-file#install
  darwin/port:
    cmd: port install llmfit
    reference: https://github.com/AlexsJones/llmfit?tab=readme-ov-file#install
  /curl:
    cmd: curl -fsSL https://llmfit.axjns.dev/install.sh | sh
    reference: https://github.com/AlexsJones/llmfit?tab=readme-ov-file#install
binlist:
- llmfit

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 31 MB
          rating: 2
          desc:
            cn: 安装 31 MB
            en: 31 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 7 MB
        desc:
          cn: 7 MB
          en: 7 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
