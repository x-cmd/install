lang: Rust
homepage: https://github.com/AlexsJones/llmfit
license: MIT
desc:
  en: Hundreds of models & providers. One command to find what runs on your hardware.
  cn: 数百个模型和提供商，一个命令找到能在你的硬件上运行的模型
  cs: Stovky modelů a poskytovatelů. Jediný příkaz najde to, co běží na vašem hardwaru.
  de: Hunderte Modelle und Anbieter. Ein Befehl findet, was auf Ihrer Hardware läuft.
  es: Cientos de modelos y proveedores. Un solo comando encuentra lo que se ejecuta en tu hardware.
  fr: Des centaines de modèles et de fournisseurs. Une seule commande trouve ce qui fonctionne sur votre matériel.
  id: Ratusan model dan penyedia. Satu perintah untuk menemukan yang berjalan di perangkat keras Anda.
  it: Centinaia di modelli e provider. Un solo comando per trovare cosa gira sul tuo hardware.
  ja: 数百のモデルとプロバイダー。ひとつのコマンドで自分のハードウェアで動くものが見つかる。
  ko: 수백 개의 모델과 제공자. 하드웨어에서 실행되는 것을 찾는 단 하나의 명령.
  pl: Setki modeli i dostawców. Jedno polecenie znajdzie to, co działa na Twoim sprzęcie.
  pt: Centenas de modelos e provedores. Um único comando encontra o que roda no seu hardware.
  ro: Sute de modele și furnizori. O singură comandă găsește ce rulează pe hardware-ul tău.
  ru: Сотни моделей и провайдеров. Одна команда найдёт то, что работает на вашем железе.
  th: โมเดลและผู้ให้บริการหลายร้อย คำสั่งเดียวเพื่อค้นหาสิ่งที่รันได้บนฮาร์ดแวร์ของคุณ
  tr: Yüzlerce model ve sağlayıcı. Donanımınızda çalışanı bulan tek bir komut.
  uk: Сотні моделей і провайдерів. Одна команда знайде те, що працює на вашому залізі.
  vi: Hàng trăm mô hình và nhà cung cấp. Một lệnh để tìm thứ chạy được trên phần cứng của bạn.
x:
  source: https://github.com/AlexsJones/llmfit
  eget: AlexsJones/llmfit
  brew: llmfit
  port: llmfit
  scoop: llmfit
rule:
  /eget:
    cmd: x eget AlexsJones/llmfit
    reference: https://x-cmd.com/mod/eget
  (win|wsl2)/scoop:
    cmd: x scoop install llmfit
    reference: https://github.com/AlexsJones/llmfit?tab=readme-ov-file#install
  darwin/brew:
    cmd: brew install llmfit
    reference: https://github.com/AlexsJones/llmfit?tab=readme-ov-file#install
  darwin/port:
    cmd: port install llmfit
    reference: https://github.com/AlexsJones/llmfit?tab=readme-ov-file#install
  /curl:
    cmd: curl -fsSL https://llmfit.axjns.dev/install.sh | sh
    reference: https://github.com/AlexsJones/llmfit?tab=readme-ov-file#install
binlist:
- llmfit

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 31 MB
          rating: 2
          desc:
            cn: 安装 31 MB
            en: 31 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 7 MB
        desc:
          cn: 7 MB
          en: 7 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
