lang: Rust
homepage: https://github.com/openai/codex
license: Apache-2.0
desc:
  cn: OpenAI Codex CLI - 在您的终端中运行的轻量级编码代理
  en: OpenAI Codex CLI - Lightweight coding agent that runs in your terminal
  cs: OpenAI Codex CLI - odlehčený kódující agent, který běží ve vašem terminálu
  de: OpenAI Codex CLI - schlanker Coding-Agent, der in Ihrem Terminal läuft
  es: "OpenAI Codex CLI: agente de codificación ligero que se ejecuta en tu terminal"
  fr: OpenAI Codex CLI - agent de code léger qui s'exécute dans votre terminal
  id: OpenAI Codex CLI - agen coding ringan yang berjalan di terminal Anda
  it: OpenAI Codex CLI - agente di codifica leggero che gira nel tuo terminale
  ja: OpenAI Codex CLI - ターミナルで動く軽量なコーディングエージェント
  ko: OpenAI Codex CLI - 터미널에서 실행되는 가벼운 코딩 에이전트
  pl: OpenAI Codex CLI - lekki agent programistyczny działający w terminalu
  pt: OpenAI Codex CLI - agente de codificação leve que roda no seu terminal
  ro: OpenAI Codex CLI - agent de cod ușor care rulește în terminalul dumneavoastră
  ru: OpenAI Codex CLI - лёгкий агент для программирования, работающий в вашем терминале
  th: OpenAI Codex CLI - เอเจนต์เขียนโค้ดแบบเบาที่ทำงานในเทอร์มินัลของคุณ
  tr: OpenAI Codex CLI - terminalinizde çalışan hafif kodlama ajanı
  uk: OpenAI Codex CLI - легкий агент для програмування, що працює у вашому терміналі
  vi: OpenAI Codex CLI - tác nhân lập trình nhẹ chạy trong terminal của bạn
x:
  source: https://github.com/openai/codex
  eget: openai/codex
  yay: openai-codex-bin
  npm: "@openai/codex"
rule:
  /eget:
    cmd: x eget openai/codex
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use codex
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g @openai/codex
    reference: https://github.com/openai/codex?tab=readme-ov-file#quickstart
    dsnap: '@openai/codex'
  darwin/brew:
    cmd: brew install --cask codex
    reference: https://github.com/openai/codex?tab=readme-ov-file#quickstart
  arch/yay:
    cmd: yay -S openai-codex-bin
    reference: https://aur.archlinux.org/packages/openai-codex-bin
binlist:
- codex

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.7 MB
          rating: 1
          desc:
            cn: 安装 9.7 MB
            en: 9.7 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
