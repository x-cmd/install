lang: Rust
homepage: https://github.com/openai/codex
license: Apache-2.0
desc:
  cn: OpenAI Codex CLI - 在您的终端中运行的轻量级编码代理
  en: OpenAI Codex CLI - Lightweight coding agent that runs in your terminal
x:
  pkg:
    exist: true
  source: https://github.com/openai/codex
  eget: https://github.com/openai/codex
rule:
  /eget:
    cmd: x eget openai/codex
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use codex
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g @openai/codex
    reference: https://github.com/openai/codex?tab=readme-ov-file#quickstart
    dsnap: '@openai/codex'
  darwin/brew:
    cmd: brew install --cask codex
    reference: https://github.com/openai/codex?tab=readme-ov-file#quickstart
  arch/yay:
    cmd: yay -S openai-codex-bin
    reference: https://aur.archlinux.org/packages/openai-codex-bin
binlist:
- codex

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.7 MB
          rating: 1
          desc:
            cn: 安装 9.7 MB
            en: 9.7 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
