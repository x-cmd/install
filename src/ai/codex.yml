lang: Rust
homepage: https://github.com/openai/codex
license: Apache-2.0
desc:
  cn: OpenAI Codex CLI - 在您的终端中运行的轻量级编码代理
  en: OpenAI Codex CLI - Lightweight coding agent that runs in your terminal
x:
  pkg:
    exist: true
  source: https://github.com/openai/codex
  eget: https://github.com/openai/codex
rule:
  /eget:
    cmd: x eget openai/codex
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use codex
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g @openai/codex
    reference: https://github.com/openai/codex?tab=readme-ov-file#quickstart
    dsnap: '@openai/codex'
  darwin/brew:
    cmd: brew install --cask codex
    reference: https://github.com/openai/codex?tab=readme-ov-file#quickstart
  arch/yay:
    cmd: yay -S openai-codex-bin
    reference: https://aur.archlinux.org/packages/openai-codex-bin
binlist:
  - codex

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 58 MB
          rating: 3
          desc:
            cn: 约 58 MB（估算）
            en: ~58 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
