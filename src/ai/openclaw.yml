lang: TypeScript
homepage: https://github.com/openclaw/openclaw
license: MIT
desc:
  cn: 一款在你个人设备上运行的私人 AI 助手
  en: a personal AI assistant you run on your own devices.
  cs: Osobní AI asistent, kterého provozujete na vlastních zařízeních.
  de: Ein persönlicher KI-Assistent, den Sie auf Ihren eigenen Geräten ausführen.
  es: Un asistente personal de IA que ejecutas en tus propios dispositivos.
  fr: Un assistant IA personnel que vous exécutez sur vos propres appareils.
  id: Asisten AI pribadi yang Anda jalankan di perangkat Anda sendiri.
  it: Un assistente IA personale che esegui sui tuoi dispositivi.
  ja: 自分のデバイス上で動かす個人用 AI アシスタント。
  ko: 자신의 기기에서 실행하는 개인 AI 어시스턴트.
  pl: Osobisty asystent AI, którego uruchamiasz na własnych urządzeniach.
  pt: Um assistente de IA pessoal que você executa em seus próprios dispositivos.
  ro: Un asistent AI personal pe care îl rulezi pe propriile tale dispozitive.
  ru: Персональный ИИ-ассистент, которого вы запускаете на своих устройствах.
  th: ผู้ช่วย AI ส่วนตัวที่คุณรันบนอุปกรณ์ของคุณเอง
  tr: Kendi cihazlarınızda çalıştırdığınız kişisel bir yapay zeka asistanı.
  uk: Персональний ШІ-асистент, який ви запускаєте на власних пристроях.
  vi: Trợ lý AI cá nhân do bạn tự chạy trên thiết bị của mình.
x:
  source: https://github.com/openclaw/openclaw
  eget: openclaw/openclaw
  yay: openclaw-git
  npm: openclaw@latest
rule:
  /eget:
    cmd: x eget openclaw/openclaw
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x openclaw --install
    reference: https://www.x-cmd.com/mod/openclaw
  /curl:
    cmd: curl -fsSL https://openclaw.ai/install.sh | bash
    reference: https://openclaw.ai/
  /npm:
    cmd: npm install -g openclaw@latest
    reference: https://github.com/openclaw/openclaw?tab=readme-ov-file#install-recommended
  win/powershell:
    cmd: x pwsh 'iwr -useb https://openclaw.ai/install.ps1 | iex'
    reference: https://docs.openclaw.ai/start/getting-started#1-install-the-cli-recommended
  arch/yay:
    cmd: yay -S openclaw-git
    reference: https://aur.archlinux.org/packages/openclaw-git
binlist:
- openclaw

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 401 MB
          rating: 4
          desc:
            cn: 安装 401 MB
            en: 401 MB install
        download:
          estimate: 401 MB
          desc:
            cn: 约 401 MB 下载 (dmg)
            en: ~401 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
