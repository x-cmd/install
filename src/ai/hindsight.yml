lang: Python
homepage: https://github.com/vectorize-io/hindsight
license: mit
desc:
  cn: 开源的智能体记忆系统，用「世界 / 经验 / 心智模型」三层拟生结构组织长期记忆，retain/recall/reflect 三步法让 AI Agent 真正学会而不仅是检索历史。
  en: Open-source agent memory system that organizes long-term memory in a biomimetic three-layer structure (world / experiences / mental models) and uses retain/recall/reflect primitives so AI agents truly learn rather than just retrieve history.
  cs: Open-source systém paměti agentů, který organizuje dlouhodobou paměť v biomimetické třívrstvé struktuře (svět / zkušenosti / mentální modely) a používá primitivy retain/recall/reflect, takže AI agenti se skutečně učí, nejen vyhledávají v historii.
  de: Open-Source-Speichersystem für Agenten, das das Langzeitgedächtnis in einer biomimetischen dreischichtigen Struktur (Welt / Erfahrungen / mentale Modelle) organisiert und die Primitiven retain/recall/reflect nutzt, sodass KI-Agenten wirklich lernen und nicht nur die Historie abrufen.
  es: Sistema de memoria de agentes de código abierto que organiza la memoria a largo plazo en una estructura biomimética de tres capas (mundo / experiencias / modelos mentales) y usa las primitivas retain/recall/reflect para que los agentes de IA aprendan realmente en lugar de solo recuperar el historial.
  fr: Système de mémoire pour agents open source qui organise la mémoire à long terme dans une structure biomimétique à trois couches (monde / expériences / modèles mentaux) et utilise les primitives retain/recall/reflect afin que les agents IA apprennent réellement au lieu de seulement retrouver l'historique.
  id: Sistem memori agen open source yang mengatur memori jangka panjang dalam struktur biomimetik tiga lapisan (dunia / pengalaman / model mental) dan menggunakan primitif retain/recall/reflect sehingga agen AI benar-benar belajar, bukan sekadar mengambil riwayat.
  it: Sistema di memoria per agenti open source che organizza la memoria a lungo termine in una struttura biomimetica a tre livelli (mondo / esperienze / modelli mentali) e usa le primitive retain/recall/reflect, così che gli agenti IA imparino davvero invece di limitarsi a recuperare la cronologia.
  ja: 長期記憶を世界・経験・メンタルモデルの biomimetic な三層構造で整理し、retain/recall/reflect プリミティブを使うオープンソースのエージェント記憶システム。AIエージェントが履歴を検索するだけでなく、本当に学習できます。
  ko: 장기 기억을 세계/경험/멘탈 모델의 생체 모방 3계층 구조로 정리하고 retain/recall/reflect 프리미티브를 사용해 AI 에이전트가 단순히 기록을 조회하는 것이 아니라 실제로 학습하게 하는 오픈소스 에이전트 메모리 시스템.
  pl: Otwartoźródłowy system pamięci agentów, który organizuje pamięć długoterminową w biomimetycznej trójwarstwowej strukturze (świat / doświadczenia / modele mentalne) i używa prymitywów retain/recall/reflect, dzięki czemu agenci AI naprawdę się uczą, a nie tylko przeglądają historię.
  pt: Sistema de memória de agentes de código aberto que organiza a memória de longo prazo em uma estrutura biomimética de três camadas (mundo / experiências / modelos mentais) e usa as primitivas retain/recall/reflect para que os agentes de IA aprendam de verdade em vez de apenas recuperar o histórico.
  ro: Sistem open source de memorie pentru agenți, care organizează memoria pe termen lung într-o structură biomimetică în trei straturi (lume / experiențe / modele mentale) și folosește primitivele retain/recall/reflect, astfel încât agenții AI să învețe cu adevărat, nu doar să recupereze istoricul.
  ru: Открытая система памяти для агентов, которая организует долговременную память в биомиметической трёхслойной структуре (мир / опыт / ментальные модели) и использует примитивы retain/recall/reflect, чтобы ИИ-агенты действительно учились, а не просто извлекали историю.
  th: ระบบหน่วยความจำของเอเจนต์แบบโอเพนซอร์ส ที่จัดระเบียบความจำระยะยาวในโครงสร้างสามชั้นแบบไบโอมิเมติก (โลก / ประสบการณ์ / แบบจำลองทางจิต) และใช้พรีมิทีฟ retain/recall/reflect เพื่อให้เอเจนต์ AI เรียนรู้จริง ไม่ใช่แค่ดึงประวัติ
  tr: Uzun süreli belleği biyomimetik üç katmanlı bir yapıda (dünya / deneyimler / zihinsel modeller) düzenleyen ve retain/recall/reflect ilkelerini kullanan açık kaynaklı ajan bellek sistemi; böylece AI ajanları geçmişi yalnızca sorgulamakla kalmayıp gerçekten öğrenir.
  uk: Відкрита система пам'яті для агентів, яка організує довготривалу пам'ять у біоміметичній тришаровій структурі (світ / досвід / ментальні моделі) та використовує примітиви retain/recall/reflect, щоб ІІ-агенти справді навчалися, а не лише витягували історію.
  vi: Hệ thống bộ nhớ tác nhân mã nguồn mở sắp xếp bộ nhớ dài hạn theo cấu trúc ba tầng mô phỏng sinh học (thế giới / trải nghiệm / mô hình tâm trí) và dùng các thao tác retain/recall/reflect để tác nhân AI thực sự học chứ không chỉ truy xuất lịch sử.
