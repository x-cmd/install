lang: Rust
homepage: https://github.com/claudioemmanuel/squeez
license: apache-2.0
desc:
  cn: 基于 hook 的 token 压缩器，支持 Claude Code、Copilot CLI、OpenCode、Gemini CLI、Codex CLI 5 款 AI CLI 主机，bash 输出压缩率最高 95%
  en: Hook-based token compressor for Claude Code, Copilot CLI, OpenCode, Gemini CLI, and Codex CLI. Up to 95% bash compression with zero runtime dependencies.
x:
  source: https://github.com/claudioemmanuel/squeez
rule:
  darwin/curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/claudioemmanuel/squeez/main/install.sh | sh
    reference: https://github.com/claudioemmanuel/squeez#install
  linux/curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/claudioemmanuel/squeez/main/install.sh | sh
    reference: https://github.com/claudioemmanuel/squeez#install
  /npm:
    cmd: npm install -g squeez
    dsnap: squeez
    reference: https://www.npmjs.com/package/squeez
binlist:
- squeez

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
