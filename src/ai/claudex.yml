lang: TypeScript
homepage: https://github.com/caixiaoshun/claudex
license: gpl-3.0
desc:
  cn: 通过本地 Anthropic 兼容代理将 Claude Code 桥接到 ChatGPT Codex
  en: Bridge Claude Code to ChatGPT Codex via a local Anthropic-compatible proxy.
x:
  source: https://github.com/caixiaoshun/claudex
  eget: https://github.com/caixiaoshun/claudex
rule:
  /eget:
    cmd: x eget caixiaoshun/claudex
    reference: https://github.com/caixiaoshun/claudex
binlist:
- claudex

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
