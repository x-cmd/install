lang: Go
homepage: https://github.com/QuantumNous/new-api
license: agpl-3.0
desc:
  cn: 聚合分发各类 LLM 的统一 AI 模型中心，可转换为 OpenAI/Claude/Gemini 兼容格式
  en: A unified AI model hub for aggregation & distribution. It supports cross-converting various LLMs into OpenAI-compatible, Claude-compatible, or Gemini-compatible formats. A centralized gateway for p...
x:
  source: https://github.com/QuantumNous/new-api
  eget: https://github.com/QuantumNous/new-api
rule:
  /eget:
    cmd: x eget QuantumNous/new-api
    reference: https://github.com/QuantumNous/new-api
binlist:
- new-api

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 120 MB
          rating: 3
          desc:
            cn: 安装 120 MB
            en: 120 MB install
        download:
          estimate: 120 MB
          desc:
            cn: 约 120 MB 下载 (macos/arm64)
            en: ~120 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
