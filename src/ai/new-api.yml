lang: Go
homepage: https://github.com/QuantumNous/new-api
license: agpl-3.0
desc:
  cn: 聚合分发各类 LLM 的统一 AI 模型中心，可转换为 OpenAI/Claude/Gemini 兼容格式
  en: A unified AI model hub for aggregation & distribution. It supports cross-converting various LLMs into OpenAI-compatible, Claude-compatible, or Gemini-compatible formats. A centralized gateway for p...
x:
  source: https://github.com/QuantumNous/new-api
  eget: https://github.com/QuantumNous/new-api
rule:
  /eget:
    cmd: x eget QuantumNous/new-api
    reference: https://github.com/QuantumNous/new-api
binlist:
- new-api

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
