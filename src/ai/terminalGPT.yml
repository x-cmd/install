lang: TypeScript
homepage: https://github.com/jucasoliveira/terminalGPT
license: mit
desc:
  cn: 在终端中体验类似 ChatGPT 的对话
  en: Get GPT like chatGPT on your terminal
x:
  source: https://github.com/jucasoliveira/terminalGPT
  eget: https://github.com/jucasoliveira/terminalGPT
rule:
  /eget:
    cmd: x eget jucasoliveira/terminalGPT
    reference: https://github.com/jucasoliveira/terminalGPT
binlist:
- terminalGPT

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
