lang: TypeScript
homepage: https://github.com/jucasoliveira/terminalGPT
license: mit
desc:
  cn: 在终端中体验类似 ChatGPT 的对话
  en: Get GPT like chatGPT on your terminal
x:
  source: https://github.com/jucasoliveira/terminalGPT
  eget: https://github.com/jucasoliveira/terminalGPT
rule:
  /eget:
    cmd: x eget jucasoliveira/terminalGPT
    reference: https://github.com/jucasoliveira/terminalGPT
binlist:
- terminalGPT

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
