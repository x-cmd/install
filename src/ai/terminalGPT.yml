lang: TypeScript
homepage: https://github.com/jucasoliveira/terminalGPT
license: mit
desc:
  cn: 在终端中体验类似 ChatGPT 的对话
  en: Get GPT like chatGPT on your terminal
  cs: Získejte GPT podobný ChatGPT přímo ve vašem terminálu
  de: Nutze GPT wie ChatGPT direkt in deinem Terminal
  es: Obtén GPT como ChatGPT en tu terminal
  fr: Profitez du GPT façon ChatGPT dans votre terminal
  id: Dapatkan GPT seperti ChatGPT di terminal Anda
  it: Ottieni GPT in stile ChatGPT sul tuo terminale
  ja: ターミナルでChatGPTのようなGPTを利用できます
  ko: 터미널에서 ChatGPT처럼 GPT를 사용하세요
  pl: Używaj GPT w stylu ChatGPT w swoim terminalu
  pt: Tenha GPT no estilo ChatGPT no seu terminal
  ro: Obține GPT în stil ChatGPT direct în terminalul tău
  ru: Используйте GPT в стиле ChatGPT прямо в терминале
  th: รับประสบการณ์ GPT เหมือน ChatGPT ในเทอร์มินัลของคุณ
  tr: Terminalinizde ChatGPT gibi GPT'yi kullanın
  uk: Отримайте GPT у стилі ChatGPT прямо у терміналі
  vi: Trải nghiệm GPT giống ChatGPT ngay trong terminal của bạn
x:
  source: https://github.com/jucasoliveira/terminalGPT
  eget: jucasoliveira/terminalGPT
rule:
  /eget:
    cmd: x eget jucasoliveira/terminalGPT
    reference: https://github.com/jucasoliveira/terminalGPT
binlist:
- terminalGPT

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
