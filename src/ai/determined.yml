lang: 'Go'
homepage: https://github.com/determined-ai/determined
license: 'Apache-2.0'
desc:
  cn: 开源机器学习平台，简化分布式训练、超参调优、实验追踪与资源管理，支持 PyTorch 和 TensorFlow
  en: 'Determined is an open-source machine learning platform that simplifies distributed training, hyperparameter tuning, experiment tracking, and resource management. Works with PyTorch and TensorFlow.'
x:
  source: https://github.com/determined-ai/determined
  eget: https://github.com/determined-ai/determined
rule:
  /eget:
    cmd: x eget determined-ai/determined
    reference: https://github.com/determined-ai/determined
binlist:
- 'determined'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 29 MB
          rating: 2
          desc:
            cn: 约 29 MB（估算）
            en: ~29 MB estimated
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
