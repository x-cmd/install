lang: Python
homepage: https://github.com/langflow-ai/langflow
license: mit
desc:
  cn: 构建与部署 AI 智能体和工作流的强力工具
  en: Langflow is a powerful tool for building and deploying AI-powered agents and workflows.
x:
  source: https://github.com/langflow-ai/langflow
  eget: https://github.com/langflow-ai/langflow
rule:
  /eget:
    cmd: x eget langflow-ai/langflow
    reference: https://github.com/langflow-ai/langflow
binlist:
- langflow

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.3 MB
          rating: 1
          desc:
            cn: 约 2.3 MB（估算）
            en: ~2.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
