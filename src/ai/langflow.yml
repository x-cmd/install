lang: Python
homepage: https://github.com/langflow-ai/langflow
license: mit
desc:
  cn: 构建与部署 AI 智能体和工作流的强力工具
  en: Langflow is a powerful tool for building and deploying AI-powered agents and workflows.
  cs: Langflow je výkonný nástroj pro tvorbu a nasazování agentů a workflow s umělou inteligencí.
  de: Langflow ist ein leistungsstarkes Werkzeug zum Erstellen und Bereitstellen von KI-Agenten und Workflows.
  es: Langflow es una potente herramienta para crear y desplegar agentes y flujos de trabajo con IA.
  fr: Langflow est un outil puissant pour créer et déployer des agents et des workflows optimisés par l'IA.
  id: Langflow adalah alat kuat untuk membangun dan menerapkan agen serta alur kerja bertenaga AI.
  it: Langflow è un potente strumento per creare e distribuire agenti e workflow basati sull'IA.
  ja: Langflowは、AIエージェントとワークフローを構築・デプロイするための強力なツールです。
  ko: Langflow는 AI 기반 에이전트와 워크플로를 구축하고 배포하는 강력한 도구입니다.
  pl: Langflow to potężne narzędzie do tworzenia i wdrażania agentów i przepływów pracy opartych na AI.
  pt: O Langflow é uma ferramenta poderosa para criar e implantar agentes e fluxos de trabalho com IA.
  ro: Langflow este un instrument puternic pentru construirea și implementarea agenților și fluxurilor de lucru bazate pe AI.
  ru: Langflow — мощный инструмент для создания и развертывания агентов и рабочих процессов на базе ИИ.
  th: Langflow คือเครื่องมืออันทรงพลังสำหรับสร้างและปรับใช้เอเจนต์และเวิร์กโฟลว์ที่ขับเคลื่อนด้วย AI
  tr: Langflow, yapay zeka destekli ajan ve iş akışları oluşturmak ve dağıtmak için güçlü bir araçtır.
  uk: Langflow — потужний інструмент для створення та розгортання агентів і робочих процесів на базі ШІ.
  vi: Langflow là công cụ mạnh mẽ để xây dựng và triển khai các tác tử và quy trình dựa trên AI.
x:
  source: https://github.com/langflow-ai/langflow
  eget: langflow-ai/langflow
rule:
  /eget:
    cmd: x eget langflow-ai/langflow
    reference: https://github.com/langflow-ai/langflow
binlist:
- langflow

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.3 MB
          rating: 1
          desc:
            cn: 约 2.3 MB（估算）
            en: ~2.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
