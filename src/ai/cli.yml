lang: Shell
homepage: https://github.com/gitbito/CLI
license: other
desc:
  cn: Bito CLI，为 Bito AI 聊天功能提供命令行界面
  en: Bito CLI (Command Line Interface) provides a command line interface to the Bito AI chat functionality. Over time, CLI will add more functions and new command options to support complex automation a...
x:
  source: https://github.com/gitbito/CLI
  eget: https://github.com/gitbito/CLI
rule:
  /eget:
    cmd: x eget gitbito/CLI
    reference: https://github.com/gitbito/CLI
binlist:
- CLI

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
