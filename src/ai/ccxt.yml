lang: Python
homepage: https://github.com/ccxt/ccxt
license: mit
desc:
  cn: 一个统一 100+ 加密货币交易所公开与私有 API 的跨语言库，覆盖 JavaScript、Python、PHP、C#、Go、Java。
  en: A cryptocurrency trading API with over 100 exchanges in JavaScript, TypeScript, Python, PHP, C#, Go, and Java.
x:
  source: https://github.com/ccxt/ccxt
rule:
  /pip:
    cmd: pip install ccxt
    reference: https://github.com/ccxt/ccxt?tab=readme-ov-file#install
binlist:
- ccxt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 183 MB
          rating: 3
          desc:
            cn: 约 183 MB（估算）
            en: ~183 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 极低
          en: Negligible
