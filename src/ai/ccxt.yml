lang: Python
homepage: https://github.com/ccxt/ccxt
license: mit
desc:
  cn: 一个统一 100+ 加密货币交易所公开与私有 API 的跨语言库，覆盖 JavaScript、Python、PHP、C#、Go、Java。
  en: A cryptocurrency trading API with over 100 exchanges in JavaScript, TypeScript, Python, PHP, C#, Go, and Java.
x:
  source: https://github.com/ccxt/ccxt
rule:
  /pip:
    cmd: pip install ccxt
    reference: https://github.com/ccxt/ccxt?tab=readme-ov-file#install
binlist:
- ccxt

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
