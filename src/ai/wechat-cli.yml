lang: Shell
homepage: https://github.com/huohuoer/wechat-cli
license: apache-2.0
desc:
  cn: 查询本地微信数据的 CLI 工具，包括聊天记录、联系人、会话、收藏等，专为 LLM 集成设计
  en: A CLI tool to query your local WeChat data — chat history, contacts, sessions, favorites, and more. Designed for LLM integration.
x:
  source: https://github.com/huohuoer/wechat-cli
  eget: https://github.com/huohuoer/wechat-cli
rule:
  /eget:
    cmd: x eget huohuoer/wechat-cli
    reference: https://github.com/huohuoer/wechat-cli
binlist:
- wechat-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
