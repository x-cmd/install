lang: TypeScript
homepage: https://github.com/kbwo/ccmanager
license: mit
desc:
  cn: 面向 Claude Code、Gemini CLI、Codex CLI、Cursor Agent、Copilot CLI、Cline CLI、OpenCode、Kimi CLI 的编码 Agent 会话管理器
  en: Coding Agent Session Manager for Claude Code / Gemini CLI / Codex CLI / Cursor Agent / Copilot CLI / Cline CLI / OpenCode / Kimi CLI
x:
  source: https://github.com/kbwo/ccmanager
  npm: ccmanager
rule:
  /npm:
    cmd: npm install -g ccmanager
    reference: https://www.npmjs.com/package/ccmanager
    dsnap: 'ccmanager'
binlist:
- ccmanager

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 47 KB
          rating: 1
          desc:
            cn: 约 47 KB（估算）
            en: ~47 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
