lang: Shell
homepage: https://github.com/mlabonne/llm-course
license: apache-2.0
desc:
  cn: 通过路线图与 Colab notebook 系统入门大语言模型（LLM）的课程
  en: Course to get into Large Language Models (LLMs) with roadmaps and Colab notebooks.
x:
  source: https://github.com/mlabonne/llm-course
  eget: https://github.com/mlabonne/llm-course
rule:
  /eget:
    cmd: x eget mlabonne/llm-course
    reference: https://github.com/mlabonne/llm-course
binlist:
- llm-course
# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: false
      lan: true
      internet: true   # notebooks 下载
    filesystem:
      read: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: notebook 训练时（取决于模型）
          en: Spike during notebook training (model-dependent)
