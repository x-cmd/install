lang: Shell
homepage: https://github.com/mlabonne/llm-course
license: apache-2.0
desc:
  cn: 通过路线图与 Colab notebook 系统入门大语言模型（LLM）的课程
  en: Course to get into Large Language Models (LLMs) with roadmaps and Colab notebooks.
  cs: Kurz pro začínající s velkými jazykovými modely (LLM) s pomocí roadmap a Colab notebooků.
  de: Kurs für den Einstieg in Large Language Models (LLMs) mit Roadmaps und Colab-Notebooks.
  es: Curso para introducirse en los modelos de lenguaje grandes (LLM) con hojas de ruta y cuadernos de Colab.
  fr: Cours pour découvrir les grands modèles de langage (LLM) avec des feuilles de route et des carnets Colab.
  id: Kurs untuk memahami Large Language Model (LLM) dengan roadmap dan notebook Colab.
  it: Corso per avvicinarsi ai Large Language Model (LLM) con roadmap e notebook Colab.
  ja: ロードマップと Colab ノートブックで大規模言語モデル（LLM）を入門するコース。
  ko: 로드맵과 Colab 노트를 통해 대형 언어 모델(LLM)을 입문하는 과정.
  pl: Kurs wprowadzający w duże modele językowe (LLM) za pomocą map drogowych i notatników Colab.
  pt: Curso para entrar em Large Language Models (LLMs) com roadmaps e notebooks do Colab.
  ro: Curs de inițiere în Large Language Models (LLM) cu hărți de parcurs și notebookuri Colab.
  ru: Курс по освоению больших языковых моделей (LLM) с дорожными картами и блокнотами Colab.
  th: คอร์สเริ่มต้นกับ Large Language Models (LLM) ผ่านแผนการเรียนรู้และ Colab notebook
  tr: Yol haritaları ve Colab not defterleriyle Büyük Dil Modellerine (LLM) giriş kursu.
  uk: Курс з основ великих мовних моделей (LLM) із дорожніми картами та блокнотами Colab.
  vi: Khóa học làm quen với Mô hình ngôn ngữ lớn (LLM) qua lộ trình và notebook Colab.
x:
  source: https://github.com/mlabonne/llm-course
  eget: mlabonne/llm-course
rule:
  /eget:
    cmd: x eget mlabonne/llm-course
    reference: https://github.com/mlabonne/llm-course
binlist:
- llm-course
# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: lan
      connect:
        localhost: true
        lan: true
        internet: true   # notebooks 下载
    filesystem:
      read:
        desc:
          cn: 无文件系统读写
          en: No filesystem reads or writes
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: notebook 训练时（取决于模型）
          en: Spike during notebook training (model-dependent)
