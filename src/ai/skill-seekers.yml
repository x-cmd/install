lang: Python
homepage: https://github.com/yusufkaraaslan/Skill_Seekers
license: MIT
desc:
  cn: 一款自动化工具，可将文档网站、GitHub 代码库和 PDF 文件转换为可用于生产环境的 Claude AI 技能
  en: an automated tool that transforms documentation websites, GitHub repositories, and PDF files into production-ready Claude AI skills.
x:
  source: https://github.com/yusufkaraaslan/Skill_Seekers
rule:
  /pip:
    cmd: pip install 'skill-seekers[all-llms]'
    reference: https://github.com/yusufkaraaslan/Skill_Seekers
    dsnap: 'skill-seekers[all-llms]'
binlist:
  - skill-seekers

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
