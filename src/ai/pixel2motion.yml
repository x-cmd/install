lang: Python
homepage: https://github.com/nolangz/pixel2motion
license: mit
desc:
  cn: nolangz 开源的 Codex/Claude Skill，把静态像素 logo 转成干净 SVG，再生成可审查、可回放的 SVG 动效与 HTML 展示页。
  en: nolangz's open-source Codex/Claude Skill that converts static raster logos into clean SVG and generates auditable, replayable SVG animations and HTML showcase pages.
x:
  source: https://github.com/nolangz/pixel2motion
rule:
  /git:
    cmd: x git clone nolangz/pixel2motion && mkdir -p ~/.claude/skills && cp -r pixel2motion ~/.claude/skills/pixel2motion
    reference: https://github.com/nolangz/pixel2motion#publishing-checklist
binlist:
- pixel2motion

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
