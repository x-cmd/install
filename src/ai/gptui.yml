lang: Python
homepage: https://github.com/happyapplehorse/gptui
license: MIT
desc:
  cn: GPTUI 是一个在终端中运行的 GPT 对话 TUI 工具
  en: GPTUI is a GPT conversational TUI (Textual User Interface) tool that runs within the terminal
x:
  pkg:
    exist: true
  source: https://github.com/happyapplehorse/gptui
rule:
  /x:
    cmd: x pkg use gptui
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install gptui
    reference: https://github.com/happyapplehorse/gptui?tab=readme-ov-file#install-with-pip
    dsnap: gptui
binlist:
- gptui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 29 KB
          rating: 1
          desc:
            cn: 约 29 KB（估算）
            en: ~29 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
