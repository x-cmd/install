lang: Python
homepage: https://github.com/HKUDS/CLI-Anything
license: apache-2.0
desc:
  cn: 港大数据科学实验室开源的 agent-native 工具,通过 7 阶段自动流水线为任意软件(GIMP、Blender、LibreOffice、Draw.io 等)生成结构化 CLI,让 AI agent 无需脆弱的 GUI 自动化或受限的 API 即可驱动真实专业软件。
  en: Open-source agent-native toolkit from HKU Data Science Lab that generates structured CLIs for any software (GIMP, Blender, LibreOffice, Draw.io, etc.) via a 7-phase automated pipeline, letting AI agents drive real professional software without fragile GUI automation or limited APIs.
  cs: Open-source nástrojí agent-native z HKU Data Science Lab, které generuje strukturované CLI pro libovolný software (GIMP, Blender, LibreOffice, Draw.io apod.) pomocí 7fázové automatizované pipeline, takže AI agenti mohou řídit skutečný profesionální software bez křehké GUI automatizace nebo omezených API.
  de: Open-Source-Agent-native-Toolkit des HKU Data Science Lab, das über eine automatisierte Pipeline mit 7 Phasen strukturierte CLIs für beliebige Software (GIMP, Blender, LibreOffice, Draw.io usw.) erzeugt und so KI-Agenten echte professionelle Software ohne fragile GUI-Automatisierung oder eingeschränkte APIs steuern können.
  es: Kit de herramientas agent-native de código abierto del HKU Data Science Lab que genera CLIs estructuradas para cualquier software (GIMP, Blender, LibreOffice, Draw.io, etc.) mediante un pipeline automatizado de 7 fases, permitiendo que los agentes de IA controlen software profesional real sin automatización GUI frágil ni APIs limitadas.
  fr: Kit d'outils agent-native open source du HKU Data Science Lab qui génère des CLI structurées pour n'importe quel logiciel (GIMP, Blender, LibreOffice, Draw.io, etc.) via un pipeline automatisé en 7 phases, permettant aux agents IA de piloter de vrais logiciels professionnels sans automatisation GUI fragile ni API limitées.
  id: Toolkit agent-native open source dari HKU Data Science Lab yang menghasilkan CLI terstruktur untuk perangkat lunak apa pun (GIMP, Blender, LibreOffice, Draw.io, dll.) melalui pipeline otomatis 7 tahap, sehingga agen AI dapat mengendalikan perangkat lunak profesional nyata tanpa otomasi GUI yang rapuh atau API terbatas.
  it: Toolkit open source agent-native dell'HKU Data Science Lab che genera CLI strutturate per qualsiasi software (GIMP, Blender, LibreOffice, Draw.io, ecc.) tramite una pipeline automatizzata a 7 fasi, consentendo agli agenti AI di pilotare software professionale reale senza automazioni GUI fragili o API limitate.
  ja: HKU Data Science Lab のオープンソース agent-native ツールキットで、7 段階の自動パイプラインにより任意のソフトウェア (GIMP、Blender、LibreOffice、Draw.io など) 向けの構造化された CLI を生成します。脆い GUI 自動化や限定された API なしでも、AI エージェントが実際の専門ソフトウェアを操作できます。
  ko: HKU Data Science Lab의 오픈소스 agent-native 툴킷으로, 7단계 자동화 파이프라인을 통해 모든 소프트웨어(GIMP, Blender, LibreOffice, Draw.io 등)에 대한 구조화된 CLI를 생성합니다. 이를 통해 취약한 GUI 자동화나 제한된 API 없이도 AI 에이전트가 실제 전문 소프트웨어를 조작할 수 있습니다.
  pl: Otwartoźródłowy zestaw narzędzi agent-native z HKU Data Science Lab, który generuje ustrukturyzowane CLI dla dowolnego oprogramowania (GIMP, Blender, LibreOffice, Draw.io itd.) za pomocą zautomatyzowanego potoku 7 faz, dzięki czemu agenci AI mogą sterować prawdziwym oprogramowaniem profesjonalnym bez kruchej automatyzacji GUI ani ograniczonych API.
  pt: Kit de ferramentas agent-native de código aberto do HKU Data Science Lab que gera CLIs estruturadas para qualquer software (GIMP, Blender, LibreOffice, Draw.io etc.) por meio de um pipeline automatizado de 7 fases, permitindo que agentes de IA controlem software profissional real sem automação de GUI frágil ou APIs limitadas.
  ro: Set de instrumente agent-native open source de la HKU Data Science Lab care generează CLI-uri structurate pentru orice software (GIMP, Blender, LibreOffice, Draw.io etc.) printr-o conductă automatizată în 7 etape, permițând agenților AI să controleze software profesional real fără automatizare GUI fragilă sau API limitate.
  ru: Открытый agent-native набор инструментов от HKU Data Science Lab, который генерирует структурированные CLI для любого ПО (GIMP, Blender, LibreOffice, Draw.io и т. д.) через автоматизированный конвейер из 7 этапов, позволяя ИИ-агентам управлять реальным профессиональным ПО без хрупкой GUI-автоматизации и ограниченных API.
  th: ชุดเครื่องมือ agent-native โอเพนซอร์สจาก HKU Data Science Lab ที่สร้าง CLI แบบมีโครงสร้างสำหรับซอฟต์แวร์ใด ๆ (GIMP, Blender, LibreOffice, Draw.io ฯลฯ) ผ่านไปป์ไลน์อัตโนมัติ 7 ขั้นตอน ทำให้เอเจนต์ AI สามารถควบคุมซอฟต์แวร์มืออาชีพจริงได้โดยไม่ต้องพึ่ง GUI อัตโนมัติที่เปราะบางหรือ API ที่จำกัด
  tr: HKU Data Science Lab'dan açık kaynaklı, agent-native araç seti. 7 aşamalı otomatik işlem hattıyla her türlü yazılım (GIMP, Blender, LibreOffice, Draw.io vb.) için yapılandırılmış CLI'lar üretir; böylece AI ajanları kırılgan GUI otomasyonu veya sınırlı API olmadan gerçek profesyonel yazılımları yönetebilir.
  uk: Відкритий agent-native набір інструментів від HKU Data Science Lab, який генерує структуровані CLI для будь-якого ПЗ (GIMP, Blender, LibreOffice, Draw.io тощо) через автоматизований конвеєр із 7 етапів, дозволяючи ІІ-агентам керувати справжнім професійним ПЗ без крихкої GUI-автоматизації та обмежених API.
  vi: Bộ công cụ agent-native mã nguồn mở từ HKU Data Science Lab, tạo CLI có cấu trúc cho mọi phần mềm (GIMP, Blender, LibreOffice, Draw.io, v.v.) qua quy trình tự động 7 giai đoạn, giúp các tác nhân AI điều khiển phần mềm chuyên nghiệp thực sự mà không cần tự động hóa GUI mong manh hay API hạn chế.
x:
  source: https://github.com/HKUDS/CLI-Anything
rule:
  /pip:
    cmd: pip install -U cli-anything-hub
    reference: https://github.com/HKUDS/CLI-Anything#-quick-start
    dsnap: cli-anything-hub
  /git:
    cmd: x git clone HKUDS/CLI-Anything
    reference: https://github.com/HKUDS/CLI-Anything#-quick-start
binlist:
- cli-hub

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 554 KB
          rating: 1
          desc:
            cn: 约 554 KB（估算）
            en: ~554 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
