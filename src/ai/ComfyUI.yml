lang: 'Python'
homepage: https://github.com/comfyanonymous/ComfyUI
license: 'GPL-3.0'
desc:
  cn: 功能最强、模块化的扩散模型 GUI/API/后端，采用图/节点式界面
  en: 'The most powerful and modular diffusion model GUI, api and backend with a graph/nodes interface.'
x:
  source: https://github.com/comfyanonymous/ComfyUI
  eget: https://github.com/comfyanonymous/ComfyUI
rule:
  /eget:
    cmd: x eget comfyanonymous/ComfyUI
    reference: https://github.com/comfyanonymous/ComfyUI
binlist:
  - 'ComfyUI'

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
