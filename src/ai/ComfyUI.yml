lang: 'Python'
homepage: https://github.com/comfyanonymous/ComfyUI
license: 'GPL-3.0'
desc:
  cn: 功能最强、模块化的扩散模型 GUI/API/后端，采用图/节点式界面
  en: 'The most powerful and modular diffusion model GUI, api and backend with a graph/nodes interface.'
x:
  source: https://github.com/comfyanonymous/ComfyUI
  eget: https://github.com/comfyanonymous/ComfyUI
rule:
  /eget:
    cmd: x eget comfyanonymous/ComfyUI
    reference: https://github.com/comfyanonymous/ComfyUI
binlist:
- 'ComfyUI'

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 GB
          rating: 5
          desc:
            cn: 安装 2 GB
            en: 2 GB install
        download:
          estimate: 2 GB
          desc:
            cn: 约 2 GB 下载 (win/arm64)
            en: ~2 GB download (win/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: none
