lang: TypeScript
homepage: https://github.com/code-yeongyu/oh-my-openagent
license: other
desc:
  cn: 面向复杂代码库的编码 Agent 框架，支持 Codex 和 OpenCode
  en: 'omo/lazycodex: The coding agent for tokenmaxxers;the one and only agent harness for complex codebases. For your Codex, for your OpenCode'
x:
  source: https://github.com/code-yeongyu/oh-my-openagent
rule:
  /npm:
    cmd: npm install -g oh-my-openagent
    reference: https://www.npmjs.com/package/oh-my-openagent
    dsnap: 'oh-my-openagent'
binlist:
- oh-my-openagent

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
