lang: TypeScript
homepage: https://github.com/code-yeongyu/oh-my-openagent
license: other
desc:
  cn: 面向复杂代码库的编码 Agent 框架，支持 Codex 和 OpenCode
  en: 'omo/lazycodex: The coding agent for tokenmaxxers;the one and only agent harness for complex codebases. For your Codex, for your OpenCode'
x:
  source: https://github.com/code-yeongyu/oh-my-openagent
rule:
  /npm:
    cmd: npm install -g oh-my-openagent
    reference: https://www.npmjs.com/package/oh-my-openagent
    dsnap: 'oh-my-openagent'
binlist:
- oh-my-openagent

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 124 MB
          rating: 3
          desc:
            cn: 安装 124 MB
            en: 124 MB install
        download:
          estimate: 124 MB
          desc:
            cn: 约 124 MB 下载 (linux/x64)
            en: ~124 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 76 MB
        desc:
          cn: 76 MB
          en: 76 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
