lang: JavaScript
homepage: https://github.com/jackwener/opencli
license: apache-2.0
desc:
  cn: 用 AI Agent 把任意网站变为 CLI，并复用你已登录的浏览器
  en: Make Any Website into CLI & Use your logged-in browser by AI agent.
  cs: Přeměňte jakýkoli web na CLI a AI agent využije váš přihlášený prohlížeč.
  de: Verwandeln Sie jede Website in eine CLI und nutzen Sie Ihren angemeldeten Browser mit einem KI-Agenten.
  es: Convierte cualquier sitio web en una CLI y usa tu navegador con sesión iniciada mediante un agente de IA.
  fr: Transformez n'importe quel site web en CLI et utilisez votre navigateur connecté via un agent IA.
  id: Jadikan situs web mana pun menjadi CLI dan gunakan browser yang sudah login oleh AI agent.
  it: Trasforma qualsiasi sito web in una CLI e usa il tuo browser già connesso tramite un agente IA.
  ja: 任意のウェブサイトを CLI 化し、AI エージェントでログイン済みのブラウザを使い回す
  ko: 어떤 웹사이트든 CLI로 만들고 AI 에이전트로 로그인된 브라우저를 활용하세요.
  pl: Zamień dowolną stronę w CLI i używaj zalogowanej przeglądarki przez agenta AI.
  pt: Transforme qualquer site em CLI e use seu navegador já conectado por um agente de IA.
  ro: Transformă orice site într-un CLI și folosește browserul tău deja logat cu un agent AI.
  ru: Превратите любой сайт в CLI и используйте уже авторизованный браузер с помощью ИИ-агента.
  th: เปลี่ยนเว็บไซต์ใดก็ได้ให้เป็น CLI และใช้เบราว์เซอร์ที่คุณล็อกอินแล้วด้วย AI เอเจนต์
  tr: Herhangi bir web sitesini CLI'ya dönüştürün ve AI ajanıyla giriş yapmış tarayıcınızı kullanın.
  uk: Перетворіть будь-який сайт на CLI та користуйтеся вже авторизованим браузером за допомогою ІІ-агента.
  vi: Biến bất kỳ trang web nào thành CLI và dùng trình duyệt đã đăng nhập với tác nhân AI
x:
  source: https://github.com/jackwener/opencli
  eget: jackwener/opencli
  npm: "@jackwener/opencli"
rule:
  /eget:
    cmd: x eget use jackwener/opencli
    reference: https://github.com/jackwener/opencli
  /npm:
    cmd: npm install -g @jackwener/opencli
    reference: https://github.com/jackwener/opencli#installation
    dsnap: opencli
binlist:
  - opencli

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 663 KB
          rating: 1
          desc:
            cn: 约 663 KB（估算）
            en: ~663 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
