lang: JavaScript
homepage: https://github.com/jackwener/opencli
license: apache-2.0
desc:
  cn: 用 AI Agent 把任意网站变为 CLI，并复用你已登录的浏览器
  en: Make Any Website into CLI & Use your logged-in browser by AI agent.
x:
  source: https://github.com/jackwener/opencli
  eget: https://github.com/jackwener/opencli
rule:
  /eget:
    cmd: x eget use jackwener/opencli
    reference: https://github.com/jackwener/opencli
  /npm:
    cmd: npm install -g @jackwener/opencli
    reference: https://github.com/jackwener/opencli#installation
    dsnap: opencli
binlist:
  - opencli

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 663 KB
          rating: 1
          desc:
            cn: 约 663 KB（估算）
            en: ~663 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
