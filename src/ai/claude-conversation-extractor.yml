lang: Python
homepage: https://github.com/ZeroSumQuant/claude-conversation-extractor
license: mit
desc:
  cn: 从 Claude Code 内部存储中提取干净的对话记录
  en: Extract clean conversation logs from Claude Code's internal storage
x:
  source: https://github.com/ZeroSumQuant/claude-conversation-extractor
  eget: https://github.com/ZeroSumQuant/claude-conversation-extractor
rule:
  /eget:
    cmd: x eget ZeroSumQuant/claude-conversation-extractor
    reference: https://github.com/ZeroSumQuant/claude-conversation-extractor
binlist:
- claude-conversation-extractor

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
