lang: Python
homepage: https://github.com/CodeUpdaterBot/ClickUi
license: agpl-3.0
desc:
  cn: 在本地使用 AI 的最佳方式，支持本地或付费 API 模型，ctrl+k 切换聊天界面
  en: The best way to use AI is on your own computer. Use local or paid API models, and ctrl+k to show/hide the chat UI. Experience the future of AI, and help build it too!
x:
  source: https://github.com/CodeUpdaterBot/ClickUi
  eget: https://github.com/CodeUpdaterBot/ClickUi
rule:
  /eget:
    cmd: x eget CodeUpdaterBot/ClickUi
    reference: https://github.com/CodeUpdaterBot/ClickUi
binlist:
- ClickUi

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 KB
          rating: 1
          desc:
            cn: 约 9 KB（估算）
            en: ~9 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
