lang: Python
homepage: https://github.com/CodeUpdaterBot/ClickUi
license: agpl-3.0
desc:
  cn: 在本地使用 AI 的最佳方式，支持本地或付费 API 模型，ctrl+k 切换聊天界面
  en: The best way to use AI is on your own computer. Use local or paid API models, and ctrl+k to show/hide the chat UI. Experience the future of AI, and help build it too!
  cs: Nejlepší způsob, jak používat AI, je na vašem vlastním počítači. Používejte lokální nebo placené API modely a ctrl+k pro zobrazení/skrytí chatového rozhraní. Zažijte budoucnost AI a pomozte ji také budovat!
  de: Der beste Weg, KI auf dem eigenen Rechner zu nutzen. Verwenden Sie lokale oder kostenpflichtige API-Modelle und ctrl+k zum Ein-/Ausblenden der Chat-Oberfläche. Erleben Sie die Zukunft der KI und helfen Sie mit, sie zu bauen!
  es: La mejor forma de usar IA es en tu propio ordenador. Usa modelos API locales o de pago, y ctrl+k para mostrar u ocultar la interfaz de chat. ¡Vive el futuro de la IA y ayúdanos a construirlo!
  fr: La meilleure façon d'utiliser l'IA est sur votre propre ordinateur. Utilisez des modèles API locaux ou payants, et ctrl+k pour afficher/masquer l'interface de chat. Vivez le futur de l'IA et aidez à le construire !
  id: Cara terbaik menggunakan AI adalah di komputer Anda sendiri. Gunakan model API lokal atau berbayar, dan ctrl+k untuk menampilkan/menyembunyikan UI obrolan. Rasakan masa depan AI, dan bantu membangunnya juga!
  it: Il modo migliore per usare l'AI è sul tuo computer. Usa modelli API locali o a pagamento, e ctrl+k per mostrare/nascondere l'interfaccia di chat. Vivi il futuro dell'AI e aiutaci a costruirlo!
  ja: AI を使うのに最適なのは、自分のコンピューター上で使うことです。ローカルまたは有料の API モデルを使い、ctrl+k でチャット UI の表示/非表示を切り替えます。AI の未来を体験し、その未来づくりにも参加しましょう！
  ko: AI를 사용하는 가장 좋은 방법은 자신의 컴퓨터에서입니다. 로컬 또는 유료 API 모델을 사용하고, ctrl+k로 채팅 UI를 표시/숨기세요. AI의 미래를 경험하고 함께 만들어가세요!
  pl: Najlepszy sposób korzystania z AI jest na własnym komputerze. Używaj modeli API lokalnych lub płatnych i naciskaj ctrl+k, aby pokazać/ukryć interfejs czatu. Doświadcz przyszłości AI i pomóż ją budować!
  pt: A melhor forma de usar IA é no seu próprio computador. Use modelos de API locais ou pagos e ctrl+k para mostrar/ocultar a interface de chat. Viva o futuro da IA e ajude a construí-lo também!
  ro: Cel mai bun mod de a folosi AI este chiar pe computerul tău. Folosește modele API locale sau cu plată, și ctrl+k pentru a arăta/ascunde interfața de chat. Trăiește viitorul AI și ajută-l să fie construit!
  ru: Лучший способ использовать ИИ — на собственном компьютере. Используйте локальные или платные API-модели и ctrl+k для показа/скрытия чат-интерфейса. Испытайте будущее ИИ и помогите его строить!
  th: วิธีที่ดีที่สุดในการใช้ AI คือใช้บนคอมพิวเตอร์ของคุณเอง ใช้โมเดล API แบบ local หรือแบบจ่ายเงิน และกด ctrl+k เพื่อแสดง/ซ่อนแชท UI สัมผัสอนาคตของ AI และช่วยสร้างมันไปด้วยกัน!
  tr: Yapay zekâyı kullanmanın en iyi yolu kendi bilgisayarınızda kullanmaktır. Yerel veya ücretli API modelleri kullanın ve sohbet arayüzünü göstermek/gizlemek için ctrl+k tuşuna basın. Yapay zekânın geleceğini deneyimleyin ve onu inşa etmeye de yardım edin!
  uk: Найкращий спосіб використовувати ІІ — на власному комп'ютері. Використовуйте локальні або платні API-моделі та ctrl+k для показу/приховування чат-інтерфейсу. Оскоріть майбутнє ІІ та допоможіть його створити!
  vi: Cách tốt nhất để dùng AI là trên máy tính của bạn. Dùng mô hình API cục bộ hoặc trả phí, và nhấn ctrl+k để hiện/ẩn giao diện trò chuyện. Trải nghiệm tương lai của AI và giúp xây dựng nó!
x:
  source: https://github.com/CodeUpdaterBot/ClickUi
  eget: CodeUpdaterBot/ClickUi
rule:
  /eget:
    cmd: x eget CodeUpdaterBot/ClickUi
    reference: https://github.com/CodeUpdaterBot/ClickUi
binlist:
- ClickUi

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 KB
          rating: 1
          desc:
            cn: 约 9 KB（估算）
            en: ~9 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
