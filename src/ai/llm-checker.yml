lang: JavaScript
homepage: https://github.com/Pavelevich/llm-checker
license: other
desc:
  cn: 扫描硬件并明确告诉你能在本地运行哪些 LLM 或 sLLM 模型的高级 CLI，深度集成 Ollama
  en: Advanced CLI tool that scans your hardware and tells you exactly which LLM or sLLM models you can run locally, with full Ollama integration.
x:
  source: https://github.com/Pavelevich/llm-checker
rule:
  /npm:
    cmd: npm install -g llm-checker
    reference: https://www.npmjs.com/package/llm-checker
    dsnap: 'llm-checker'
binlist:
- llm-checker

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 128 KB
          rating: 1
          desc:
            cn: 约 128 KB（估算）
            en: ~128 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
