lang: Python
homepage: https://github.com/Panniantong/Agent-Reach
license: MIT
desc:
  cn: 给 AI Agent 装上互联网之眼，一键安装并打通多个平台的内容阅读与搜索能力
  en: Equip AI agents with read and search access to content across multiple internet platforms
x:
  source: https://github.com/Panniantong/Agent-Reach
rule:
  /pipx:
    cmd: |
      pipx install https://github.com/Panniantong/agent-reach/archive/main.zip
      agent-reach install --env=auto
    reference: https://github.com/Panniantong/Agent-Reach/blob/main/docs/install.md
binlist:
  - agent-reach

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 29 KB
          rating: 1
          desc:
            cn: 约 29 KB（估算）
            en: ~29 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible

