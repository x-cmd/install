lang: 'Python'
homepage: 'https://github.com/AUTOMATIC1111/stable-diffusion-webui'
license: 'AGPL-3.0'
desc:
  cn: Stable Diffusion 的 Web 界面
  en: 'Stable Diffusion web UI'
x:
  source: https://github.com/AUTOMATIC1111/stable-diffusion-webui
  eget: https://github.com/AUTOMATIC1111/stable-diffusion-webui
rule:
  /eget:
    cmd: x eget AUTOMATIC1111/stable-diffusion-webui
    reference: https://github.com/AUTOMATIC1111/stable-diffusion-webui
binlist:
  - 'stable-diffusion-webui'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 102 KB
          rating: 1
          desc:
            cn: 约 102 KB（估算）
            en: ~102 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
