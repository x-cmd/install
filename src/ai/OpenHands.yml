lang: Python
homepage: https://github.com/OpenHands/OpenHands
license: other
desc:
  cn: OpenHands：AI 驱动的开发平台
  en: '🙌 OpenHands: AI-Driven Development'
x:
  source: https://github.com/OpenHands/OpenHands
  pip: openhands-ai
rule:
  /pip:
    cmd: pip install openhands-ai
    reference: https://pypi.org/project/openhands-ai/
    dsnap: openhands-ai
binlist:
- OpenHands

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 186 MB
          rating: 3
          desc:
            cn: 安装 186 MB
            en: 186 MB install
        download:
          estimate: 186 MB
          desc:
            cn: 约 186 MB 下载 (appimage)
            en: ~186 MB download (appimage)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
