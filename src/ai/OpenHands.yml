lang: Python
homepage: https://github.com/OpenHands/OpenHands
license: other
desc:
  cn: OpenHands：AI 驱动的开发平台
  en: '🙌 OpenHands: AI-Driven Development'
x:
  source: https://github.com/OpenHands/OpenHands
rule:
  /pip:
    cmd: pip install openhands-ai
    reference: https://pypi.org/project/openhands-ai/
    dsnap: openhands-ai
binlist:
- OpenHands

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
