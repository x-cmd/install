lang: Python
homepage: https://github.com/nousresearch/hermes-agent
license: MIT
desc:
  cn: Nous Research 开发的自学习型 AI 智能体， 是唯一一款内置学习循环的智能体
  en: The self-improving AI agent built by Nous Research. It's the only agent with a built-in learning loop
x:
  source: https://github.com/nousresearch/hermes-agent
rule:
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash
    reference: https://github.com/nousresearch/hermes-agent?tab=readme-ov-file#quick-install
  arch/yay:
    cmd: yay -S hermes-agent
    reference: https://aur.archlinux.org/packages/hermes-agent
binlist:
  - hermes

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
