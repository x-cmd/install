lang: JavaScript
homepage: https://github.com/thedotmack/claude-mem
license: apache-2.0
desc:
  cn: 为每个 Agent 提供跨会话持久上下文，记录会话行为并用 AI 压缩后注入后续会话
  en: Persistent Context Across Sessions for Every Agent – Captures everything your agent does during sessions, compresses it with AI, and injects relevant context back into future sessions. Works with ...
x:
  source: https://github.com/thedotmack/claude-mem
rule:
  /npm:
    cmd: npm install -g claude-mem
    reference: https://www.npmjs.com/package/claude-mem
    dsnap: 'claude-mem'
binlist:
- claude-mem

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
