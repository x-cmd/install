lang: Python
homepage: https://github.com/microsoft/fara
license: mit
desc:
  cn: 微软首个 7B 参数的视觉感知型计算机使用智能体（CUA），通过鼠标键盘操控网页完成多步任务
  en: Automates web tasks by visually perceiving webpages and controlling the computer's mouse and keyboard to execute multi-step actions.
x:
  source: https://github.com/microsoft/fara
rule:
  /pip:
    cmd: pip install fara
    reference: https://github.com/microsoft/fara
binlist:
- fara

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
