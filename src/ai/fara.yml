lang: Python
homepage: https://github.com/microsoft/fara
license: mit
desc:
  cn: 微软首个 7B 参数的视觉感知型计算机使用智能体（CUA），通过鼠标键盘操控网页完成多步任务
  en: Automates web tasks by visually perceiving webpages and controlling the computer's mouse and keyboard to execute multi-step actions.
x:
  source: https://github.com/microsoft/fara
rule:
  /pip:
    cmd: pip install fara
    reference: https://github.com/microsoft/fara
binlist:
- fara

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 72 KB
          rating: 1
          desc:
            cn: 约 72 KB（估算）
            en: ~72 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
