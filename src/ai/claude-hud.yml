lang: JavaScript
homepage: https://github.com/jarrodwatts/claude-hud
license: mit
desc:
  cn: 实时展示 Claude Code 状态的插件：上下文用量、活动工具、运行中 Agent 与待办进度
  en: A Claude Code plugin that shows what's happening - context usage, active tools, running agents, and todo progress
x:
  source: https://github.com/jarrodwatts/claude-hud
  eget: jarrodwatts/claude-hud
rule:
  /eget:
    cmd: x eget jarrodwatts/claude-hud
    reference: https://github.com/jarrodwatts/claude-hud
binlist:
- claude-hud

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 KB
          rating: 1
          desc:
            cn: 约 50 KB（估算）
            en: ~50 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
