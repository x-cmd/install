lang: Rust
homepage: https://github.com/kuku-mom/kuku
license: mit
desc:
  cn: 在 macOS 上管理本地 Markdown 笔记库，支持个人 wiki、AI 编辑、图谱导航与可选加密同步
  en: Manage a local vault of Markdown notes with a personal wiki, AI-powered editing, graph navigation, and optional encrypted sync on macOS.
x:
  source: https://github.com/kuku-mom/kuku
  eget: https://github.com/kuku-mom/kuku
rule:
  /eget:
    cmd: x eget kuku-mom/kuku
    reference: https://github.com/kuku-mom/kuku
binlist:
- kuku

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
