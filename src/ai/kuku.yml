lang: Rust
homepage: https://github.com/kuku-mom/kuku
license: mit
desc:
  cn: 在 macOS 上管理本地 Markdown 笔记库，支持个人 wiki、AI 编辑、图谱导航与可选加密同步
  en: Manage a local vault of Markdown notes with a personal wiki, AI-powered editing, graph navigation, and optional encrypted sync on macOS.
x:
  source: https://github.com/kuku-mom/kuku
  eget: https://github.com/kuku-mom/kuku
rule:
  /eget:
    cmd: x eget kuku-mom/kuku
    reference: https://github.com/kuku-mom/kuku
binlist:
- kuku

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.4 MB
          rating: 1
          desc:
            cn: 约 6.4 MB（估算）
            en: ~6.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
