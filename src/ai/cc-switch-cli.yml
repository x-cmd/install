lang: Rust
homepage: https://github.com/SaladDay/cc-switch-cli
license: mit
desc:
  cn: 面向 Claude Code、Codex、Gemini CLI 的跨平台 All-in-One CLI 助手工具
  en: ⭐️ A cross-platform CLI All-in-One assistant tool for Claude Code, Codex & Gemini CLI.
x:
  source: https://github.com/SaladDay/cc-switch-cli
  eget: https://github.com/SaladDay/cc-switch-cli
rule:
  /eget:
    cmd: x eget SaladDay/cc-switch-cli
    reference: https://github.com/SaladDay/cc-switch-cli
binlist:
- cc-switch-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
