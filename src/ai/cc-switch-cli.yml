lang: Rust
homepage: https://github.com/SaladDay/cc-switch-cli
license: mit
desc:
  cn: 面向 Claude Code、Codex、Gemini CLI 的跨平台 All-in-One CLI 助手工具
  en: ⭐️ A cross-platform CLI All-in-One assistant tool for Claude Code, Codex & Gemini CLI.
x:
  source: https://github.com/SaladDay/cc-switch-cli
  eget: https://github.com/SaladDay/cc-switch-cli
rule:
  /eget:
    cmd: x eget SaladDay/cc-switch-cli
    reference: https://github.com/SaladDay/cc-switch-cli
binlist:
- cc-switch-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 约 14 MB（估算）
            en: ~14 MB estimated
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (macos/arm64)
            en: ~8 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
