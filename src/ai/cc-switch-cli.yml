lang: Rust
homepage: https://github.com/SaladDay/cc-switch-cli
license: mit
desc:
  cn: 面向 Claude Code、Codex、Gemini CLI 的跨平台 All-in-One CLI 助手工具
  en: ⭐️ A cross-platform CLI All-in-One assistant tool for Claude Code, Codex & Gemini CLI.
  cs: ⭐️ Multiplatformní nástroj CLI All-in-One asistent pro Claude Code, Codex a Gemini CLI.
  de: ⭐️ Ein plattformübergreifendes All-in-One-CLI-Assistentenwerkzeug für Claude Code, Codex und Gemini CLI.
  es: ⭐️ Una herramienta de asistente CLI All-in-One multiplataforma para Claude Code, Codex y Gemini CLI.
  fr: ⭐️ Un outil d'assistant CLI tout-en-un multiplateforme pour Claude Code, Codex et Gemini CLI.
  id: ⭐️ Alat asisten CLI All-in-One lintas platform untuk Claude Code, Codex, dan Gemini CLI.
  it: ⭐️ Un tool di assistente CLI All-in-One multipiattaforma per Claude Code, Codex e Gemini CLI.
  ja: ⭐️ Claude Code、Codex、Gemini CLI 向けのクロスプラットフォーム All-in-One CLI アシスタントツール。
  ko: ⭐️ Claude Code, Codex, Gemini CLI를 위한 크로스 플랫폼 All-in-One CLI 어시스턴트 도구.
  pl: ⭐️ Wieloplatformowe narzędzie asystenta CLI All-in-One dla Claude Code, Codex i Gemini CLI.
  pt: ⭐️ Uma ferramenta de assistente CLI All-in-One multiplataforma para Claude Code, Codex e Gemini CLI.
  ro: ⭐️ Un instrument de asistent CLI All-in-One multiplatformă pentru Claude Code, Codex și Gemini CLI.
  ru: ⭐️ Кроссплатформенный многофункциональный CLI-инструмент-ассистент для Claude Code, Codex и Gemini CLI.
  th: ⭐️ เครื่องมือผู้ช่วย CLI All-in-One แบบข้ามแพลตฟอร์มสำหรับ Claude Code, Codex และ Gemini CLI
  tr: ⭐️ Claude Code, Codex ve Gemini CLI için platformlar arası hepsi bir arada CLI asistan aracı.
  uk: ⭐️ Кроссплатформний універсальний CLI-інструмент-асистент для Claude Code, Codex та Gemini CLI.
  vi: ⭐️ Công cụ trợ lý CLI All-in-One đa nền tảng cho Claude Code, Codex và Gemini CLI.
x:
  source: https://github.com/SaladDay/cc-switch-cli
  eget: SaladDay/cc-switch-cli
rule:
  /eget:
    cmd: x eget SaladDay/cc-switch-cli
    reference: https://github.com/SaladDay/cc-switch-cli
binlist:
- cc-switch-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 约 14 MB（估算）
            en: ~14 MB estimated
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (macos/arm64)
            en: ~8 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
