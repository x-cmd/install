lang: 'Rust'
homepage: https://github.com/TabbyML/tabby
license: 'NOASSERTION'
desc:
  cn: 自托管的 AI 编程助手
  en: 'Self-hosted AI coding assistant'
x:
  source: https://github.com/TabbyML/tabby
  eget: https://github.com/TabbyML/tabby
rule:
  /eget:
    cmd: x eget TabbyML/tabby
    reference: https://github.com/TabbyML/tabby
binlist:
  - 'tabby'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 48 KB
          rating: 1
          desc:
            cn: 约 48 KB（估算）
            en: ~48 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
