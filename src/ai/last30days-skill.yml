lang: Python
homepage: https://github.com/mvanhorn/last30days-skill
license: mit
desc:
  cn: AI 智能体技能，跨 Reddit、X、YouTube、HN、Polymarket 与全网研究任意话题并合成有据总结
  en: AI agent skill that researches any topic across Reddit, X, YouTube, HN, Polymarket, and the web - then synthesizes a grounded summary
x:
  source: https://github.com/mvanhorn/last30days-skill
  eget: https://github.com/mvanhorn/last30days-skill
rule:
  /eget:
    cmd: x eget mvanhorn/last30days-skill
    reference: https://github.com/mvanhorn/last30days-skill
binlist:
- last30days-skill

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
