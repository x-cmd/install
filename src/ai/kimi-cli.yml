lang: Python
homepage: https://github.com/MoonshotAI/kimi-cli
license: Apache-2.0
desc:
  cn: MoonshotAI 推出的 AI Agent，可帮助您完成软件开发任务和终端操作
  en: An AI agent released by MoonshotAI that helps you with software development tasks and terminal operations.
  cs: AI agent vydaný MoonshotAI, který vám pomůže s úkoly vývoje softwaru a s operacemi v terminálu.
  de: Ein von MoonshotAI veröffentlichter KI-Agent, der Ihnen bei Softwareentwicklungsaufgaben und Terminal-Operationen hilft.
  es: Un agente de IA lanzado por MoonshotAI que te ayuda con tareas de desarrollo de software y operaciones de terminal.
  fr: Un agent IA publié par MoonshotAI qui vous aide dans vos tâches de développement logiciel et vos opérations dans le terminal.
  id: Agen AI yang dirilis oleh MoonshotAI untuk membantu Anda dengan tugas pengembangan perangkat lunak dan operasi terminal.
  it: Un agente IA rilasciato da MoonshotAI che ti aiuta nelle attività di sviluppo software e nelle operazioni da terminale.
  ja: MoonshotAI がリリースした AI エージェントで、ソフトウェア開発タスクやターミナル操作を支援します。
  ko: MoonshotAI가 출시한 AI 에이전트로, 소프트웨어 개발 작업과 터미널 작업을 도와줍니다.
  pl: Agent AI wydany przez MoonshotAI, który pomaga w zadaniach związanych z rozwojem oprogramowania i obsługą terminala.
  pt: Um agente de IA lançado pela MoonshotAI que ajuda você em tarefas de desenvolvimento de software e operações no terminal.
  ro: Un agent AI lansat de MoonshotAI care vă ajută la sarcinile de dezvoltare software și la operațiunile din terminal.
  ru: ИИ-агент, выпущенный MoonshotAI, который помогает вам с задачами разработки программного обеспечения и операциями в терминале.
  th: เอเจนต์ AI ที่ปล่อยโดย MoonshotAI ช่วยคุณเรื่องงานพัฒนาซอฟต์แวร์และการใช้งานเทอร์มินัล
  tr: MoonshotAI tarafından yayımlanan, yazılım geliştirme görevlerinde ve terminal işlemlerinde size yardımcı olan bir AI ajanı.
  uk: ІІ-агент, випущений MoonshotAI, який допомагає вам із завданнями розробки програмного забезпечення та операціями в терміналі.
  vi: Tác nhân AI do MoonshotAI phát hành, giúp bạn với các tác vụ phát triển phần mềm và thao tác trong terminal.
x:
  source: https://github.com/MoonshotAI/kimi-cli
  eget: MoonshotAI/kimi-cli
  yay: kimi-cli
rule:
  /eget:
    cmd: x eget MoonshotAI/kimi-cli
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x kimi --install
    reference: https://www.x-cmd.com/mod/kimi
  /curl:
    cmd: curl -LsSf https://code.kimi.com/install.sh | bash
    reference: https://moonshotai.github.io/kimi-cli/en/guides/getting-started.html#installation
  /uv:
    cmd: uv tool install --python 3.13 kimi-cli
    reference: https://moonshotai.github.io/kimi-cli/en/guides/getting-started.html#installation
  win/powershell:
    cmd: x pwsh 'Invoke-RestMethod https://code.kimi.com/install.ps1 | Invoke-Expression'
    reference: https://moonshotai.github.io/kimi-cli/en/guides/getting-started.html#installation
  arch/yay:
    cmd: yay -S kimi-cli
    reference: https://aur.archlinux.org/packages/kimi-cli
binlist:
- kimi
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 91 MB
          rating: 3
          desc:
            cn: 安装 91 MB
            en: 91 MB install
        download:
          estimate: 91 MB
          desc:
            cn: 约 91 MB 下载 (linux/x64)
            en: ~91 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
