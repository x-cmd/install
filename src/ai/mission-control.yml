lang: TypeScript
homepage: https://github.com/builderz-labs/mission-control
license: mit
desc:
  cn: 面向 AI Agent 集群的自托管编排与监控面板，调度任务、追踪成本、审计安全
  en: Self-hosted dashboard for orchestrating AI agent fleets — dispatch tasks, track costs, audit security
x:
  source: https://github.com/builderz-labs/mission-control
rule:
  /git:
    cmd: x git clone builderz-labs/mission-control
    reference: https://github.com/builderz-labs/mission-control
binlist:
- mission-control

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
