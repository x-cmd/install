lang: TypeScript
homepage: https://github.com/builderz-labs/mission-control
license: mit
desc:
  cn: 面向 AI Agent 集群的自托管编排与监控面板，调度任务、追踪成本、审计安全
  en: Self-hosted dashboard for orchestrating AI agent fleets — dispatch tasks, track costs, audit security
x:
  source: https://github.com/builderz-labs/mission-control
rule:
  /git:
    cmd: x git clone builderz-labs/mission-control
    reference: https://github.com/builderz-labs/mission-control
binlist:
- mission-control

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 197 KB
          rating: 1
          desc:
            cn: 约 197 KB（估算）
            en: ~197 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
