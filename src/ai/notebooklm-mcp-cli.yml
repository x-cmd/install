  ru: Программный доступ к Google NotebookLM — через интерфейс командной строки (CLI), сервер Model Context Protocol (MCP) и навыки ИИ-агентов.
  th: เข้าถึง Google NotebookLM ด้วยการเขียนโปรแกรม — ผ่านอินเทอร์เฟซบรรทัดคำสั่ง (CLI) เซิร์ฟเวอร์ Model Context Protocol (MCP) และทักษะของเอเจนต์ AI
