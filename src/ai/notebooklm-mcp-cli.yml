lang: Python
homepage: https://github.com/jacob-bd/notebooklm-mcp-cli
license: mit
desc:
  cn: 通过命令行、MCP 服务器和 AI Agent 技能以编程方式访问 Google NotebookLM
  en: Programmatic access to Google NotebookLM — via command-line interface (CLI), Model Context Protocol (MCP) server, and AI agent skills.
x:
  source: https://github.com/jacob-bd/notebooklm-mcp-cli
  eget: https://github.com/jacob-bd/notebooklm-mcp-cli
rule:
  /eget:
    cmd: x eget jacob-bd/notebooklm-mcp-cli
    reference: https://github.com/jacob-bd/notebooklm-mcp-cli
binlist:
- notebooklm-mcp-cli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 108 KB
          rating: 1
          desc:
            cn: 约 108 KB（估算）
            en: ~108 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
