lang: Go
homepage: https://github.com/google/adk-go
license: Apache-2.0
desc:
  cn: Agent Development Kit（ADK）是一款灵活且模块化的框架，用于开发和部署人工智能代理（AI agents）。
  en: Agent Development Kit (ADK) is a flexible and modular framework for developing and deploying AI agents.
x:
  source: https://github.com/google/adk-go
rule:
  /pip:
    cmd: pip install google-adk
    reference: https://google.github.io/adk-docs/#python
  /go:
    cmd: go get google.golang.org/adk
    reference: https://google.github.io/adk-docs/#go
binlist:
- adk-go

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
