lang: TypeScript
homepage: https://github.com/LING71671/Open-ClaudeCode
license: other
desc:
  cn: Claude Code 相关仓库
  en: ClaudeCode related repository
x:
  source: https://github.com/LING71671/Open-ClaudeCode
  eget: https://github.com/LING71671/Open-ClaudeCode
rule:
  /eget:
    cmd: x eget LING71671/Open-ClaudeCode
    reference: https://github.com/LING71671/Open-ClaudeCode
binlist:
- Open-ClaudeCode

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.2 MB
          rating: 1
          desc:
            cn: 约 1.2 MB（估算）
            en: ~1.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
