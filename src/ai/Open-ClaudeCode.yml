lang: TypeScript
homepage: https://github.com/LING71671/Open-ClaudeCode
license: other
desc:
  cn: Claude Code 相关仓库
  en: ClaudeCode related repository
x:
  source: https://github.com/LING71671/Open-ClaudeCode
  eget: https://github.com/LING71671/Open-ClaudeCode
rule:
  /eget:
    cmd: x eget LING71671/Open-ClaudeCode
    reference: https://github.com/LING71671/Open-ClaudeCode
binlist:
- Open-ClaudeCode

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
