lang: Go
homepage: https://github.com/steipete/camsnap
license: mit
desc:
  cn: 针对 RTSP/ONVIF 摄像头抓取快照、短视频并执行运动检测的 CLI
  en: CLI to capture snapshots, short clips, and run motion detection against RTSP/ONVIF came ras
x:
  source: https://github.com/steipete/camsnap
  eget: https://github.com/steipete/camsnap
rule:
  /eget:
    cmd: x eget steipete/camsnap
    reference: https://github.com/steipete/camsnap
binlist:
- camsnap

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
