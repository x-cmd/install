lang: JavaScript
homepage: https://github.com/JuliusBrussee/caveman
license: mit
desc:
  cn: Claude Code 技能，用穴居人风格说话可减少 65% 的 token 用量
  en: 🪨 why use many token when few token do trick — Claude Code skill that cuts 65% of tokens by talking like caveman
x:
  source: https://github.com/JuliusBrussee/caveman
  eget: https://github.com/JuliusBrussee/caveman
rule:
  /eget:
    cmd: x eget JuliusBrussee/caveman
    reference: https://github.com/JuliusBrussee/caveman
binlist:
- caveman

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 33 MB
          rating: 2
          desc:
            cn: 安装 33 MB
            en: 33 MB install
        download:
          estimate: 31 MB
          desc:
            cn: 约 31 MB 下载 (linux/x64)
            en: ~31 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
