lang: JavaScript
homepage: https://github.com/JuliusBrussee/caveman
license: mit
desc:
  cn: Claude Code 技能，用穴居人风格说话可减少 65% 的 token 用量
  en: 🪨 why use many token when few token do trick — Claude Code skill that cuts 65% of tokens by talking like caveman
x:
  source: https://github.com/JuliusBrussee/caveman
  eget: https://github.com/JuliusBrussee/caveman
rule:
  /eget:
    cmd: x eget JuliusBrussee/caveman
    reference: https://github.com/JuliusBrussee/caveman
binlist:
- caveman

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 MB
          rating: 2
          desc:
            cn: 约 23 MB（估算）
            en: ~23 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
