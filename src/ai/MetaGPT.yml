lang: Python
homepage: https://github.com/FoundationAgents/MetaGPT
license: mit
desc:
  cn: 多 Agent 框架，打造首家 AI 软件公司，迈向自然语言编程
  en: '🌟 The Multi-Agent Framework: First AI Software Company, Towards Natural Language Programming'
x:
  source: https://github.com/FoundationAgents/MetaGPT
  eget: https://github.com/FoundationAgents/MetaGPT
rule:
  /eget:
    cmd: x eget FoundationAgents/MetaGPT
    reference: https://github.com/FoundationAgents/MetaGPT
binlist:
- MetaGPT

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
