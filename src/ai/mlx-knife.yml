lang: Python
homepage: https://github.com/mzau/mlx-knife
license: apache-2.0
desc:
  cn: 类似 ollama 的 CLI，用于在 HuggingFace 上管理 MLX 模型（pull/rm/list/show/serve 等）
  en: ollama like cli tool for MLX models on huggingface (pull, rm, list, show, serve etc.)
x:
  source: https://github.com/mzau/mlx-knife
  eget: https://github.com/mzau/mlx-knife
rule:
  /eget:
    cmd: x eget mzau/mlx-knife
    reference: https://github.com/mzau/mlx-knife
binlist:
- mlx-knife

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 97 KB
          rating: 1
          desc:
            cn: 约 97 KB（估算）
            en: ~97 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
