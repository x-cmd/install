lang: Python
homepage: https://github.com/mzau/mlx-knife
license: apache-2.0
desc:
  cn: 类似 ollama 的 CLI，用于在 HuggingFace 上管理 MLX 模型（pull/rm/list/show/serve 等）
  en: ollama like cli tool for MLX models on huggingface (pull, rm, list, show, serve etc.)
x:
  source: https://github.com/mzau/mlx-knife
  eget: https://github.com/mzau/mlx-knife
rule:
  /eget:
    cmd: x eget mzau/mlx-knife
    reference: https://github.com/mzau/mlx-knife
binlist:
- mlx-knife

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
