lang: Python
homepage: https://github.com/mzau/mlx-knife
license: apache-2.0
desc:
  cn: 类似 ollama 的 CLI，用于在 HuggingFace 上管理 MLX 模型（pull/rm/list/show/serve 等）
  en: ollama like cli tool for MLX models on huggingface (pull, rm, list, show, serve etc.)
  cs: CLI nástroj podobný ollama pro správu modelů MLX na huggingface (pull, rm, list, show, serve atd.)
  de: ollama-ähnliches CLI-Werkzeug für MLX-Modelle auf huggingface (pull, rm, list, show, serve usw.)
