lang: Python
homepage: https://github.com/aliom-v/KiroGate
license: agpl-3.0
desc:
  cn: OpenAI 与 Anthropic 兼容的 Kiro IDE API 代理网关，支持 Claude Code CLI
  en: OpenAI & Anthropic 兼容的 Kiro IDE API 代理网关，支持 Claude Code CLI
x:
  source: https://github.com/aliom-v/KiroGate
  eget: https://github.com/aliom-v/KiroGate
rule:
  /eget:
    cmd: x eget aliom-v/KiroGate
    reference: https://github.com/aliom-v/KiroGate
binlist:
- KiroGate

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
