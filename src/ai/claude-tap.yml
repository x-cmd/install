lang: Python
homepage: https://github.com/liaohch3/claude-tap
license: mit
desc:
  cn: 拦截并检查 Claude Code、Codex CLI、Gemini CLI、Cursor CLI、OpenCode、Kimi、Hermes 等编码 Agent 的 API 流量
  en: Intercept and inspect Coding Agent API traffic from Claude Code, Codex CLI, Gemini CLI, Cursor CLI, OpenCode, Kimi/Kimi Code, Pi, and Hermes in a local trace viewer.
x:
  source: https://github.com/liaohch3/claude-tap
  eget: https://github.com/liaohch3/claude-tap
rule:
  /eget:
    cmd: x eget liaohch3/claude-tap
    reference: https://github.com/liaohch3/claude-tap
binlist:
- claude-tap

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
