lang: Rust
homepage: https://github.com/farion1231/cc-switch
license: MIT
desc:
  cn: CC-Switch 是一款跨平台桌面应用，用于统一管理和一键切换多个 AI CLI 编程助手（Claude Code、Codex、Gemini CLI 等）的 API 配置、MCP 服务器和 Skills。
  en: CC-Switch is a cross-platform desktop app for unified management and one-click switching of API configurations, MCP servers, and Skills across multiple AI CLI coding assistants.
x:
  source: https://github.com/farion1231/cc-switch
  brew: --cask
  paru: cc-switch-bin
rule:
  darwin/brew:
    cmd: |
      brew tap farion1231/ccswitch && brew install --cask cc-switch
    reference: https://github.com/farion1231/cc-switch?tab=readme-ov-file#download--installation
  arch/paru:
    cmd: paru -S cc-switch-bin
    reference: https://github.com/farion1231/cc-switch?tab=readme-ov-file#arch-linux-users


# already profiled
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 88 MB
          rating: 3
          desc:
            cn: 安装 88 MB
            en: 88 MB install
        download:
          estimate: 27 MB
          desc:
            cn: 约 27 MB 下载 (macos/arm64)
            en: ~27 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
