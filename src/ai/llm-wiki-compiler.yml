lang: TypeScript
homepage: https://github.com/atomicstrata/llm-wiki-compiler
license: mit
desc:
  cn: 知识编译器：原始素材输入，互链 wiki 输出，灵感源自 Karpathy 的 LLM Wiki 模式
  en: The knowledge compiler. Raw sources in, interlinked wiki out. Inspired by Karpathy's LLM Wiki pattern.
x:
  source: https://github.com/atomicstrata/llm-wiki-compiler
  eget: https://github.com/atomicstrata/llm-wiki-compiler
rule:
  /eget:
    cmd: x eget atomicstrata/llm-wiki-compiler
    reference: https://github.com/atomicstrata/llm-wiki-compiler
binlist:
- llm-wiki-compiler

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
