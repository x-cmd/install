lang: Python
homepage: https://github.com/financial-datasets/mcp-server
license: mit
desc:
  cn: 用于对接 Financial Datasets 股市 API 的 MCP 服务器
  en: An MCP server for interacting with the Financial Datasets stock market API.
x:
  source: https://github.com/financial-datasets/mcp-server
  eget: https://github.com/financial-datasets/mcp-server
rule:
  /eget:
    cmd: x eget financial-datasets/mcp-server
    reference: https://github.com/financial-datasets/mcp-server
binlist:
- mcp-server

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
