lang: Go
homepage: https://github.com/steipete/sonoscli
license: mit
desc:
  cn: 从终端控制 SONOS 音箱
  en: Control SONOS speakers from your terminal.
  cs: Ovládejte reproduktory SONOS z terminálu.
  de: Steuern Sie SONOS-Lautsprecher von Ihrem Terminal aus.
  es: Controla los altavoces SONOS desde tu terminal.
  fr: Contrôlez les enceintes SONOS depuis votre terminal.
  id: Kendalikan speaker SONOS dari terminal Anda.
  it: Controlla i diffusori SONOS dal tuo terminale.
  ja: ターミナルから SONOS スピーカーを操作します。
  ko: 터미널에서 SONOS 스피커를 제어합니다.
  pl: Steruj głośnikami SONOS z terminala.
  pt: Controle alto-falantes SONOS a partir do terminal.
  ro: Controlați difuzoarele SONOS din terminalul dumneavoastră.
  ru: Управляйте колонками SONOS из терминала.
  th: ควบคุมลำโพง SONOS จากเทอร์มินัลของคุณ
  tr: SONOS hoparlörleri terminalinizden kontrol edin.
  uk: Керуйте колонками SONOS із термінала.
  vi: Điều khiển loa SONOS từ terminal của bạn.
x:
  source: https://github.com/steipete/sonoscli
  eget: steipete/sonoscli
rule:
  /eget:
    cmd: x eget steipete/sonoscli
    reference: https://github.com/steipete/sonoscli
binlist:
- sonoscli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
