lang: Go
homepage: https://github.com/steipete/sonoscli
license: mit
desc:
  cn: 从终端控制 SONOS 音箱
  en: Control SONOS speakers from your terminal.
x:
  source: https://github.com/steipete/sonoscli
  eget: https://github.com/steipete/sonoscli
rule:
  /eget:
    cmd: x eget steipete/sonoscli
    reference: https://github.com/steipete/sonoscli
binlist:
- sonoscli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
