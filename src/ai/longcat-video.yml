lang: Python
homepage: https://github.com/meituan-longcat/LongCat-Video
license: mit
desc:
  cn: 美团开源的 13.6B 参数视频生成基础模型，统一支持文本/图像/音频到视频与视频续写，擅长分钟级长视频生成，多奖励 RLHF 后性能对标商业方案。
  en: Meituan's open-source 13.6B foundational video generation model, unifying text/image/audio-to-video and video continuation with minutes-long generation and multi-reward RLHF.
x:
  source: https://github.com/meituan-longcat/LongCat-Video
rule:
  /git:
    cmd: x git clone meituan-longcat/LongCat-Video
    reference: https://github.com/meituan-longcat/LongCat-Video#installation
binlist:
- longcat-video

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 KB
          rating: 1
          desc:
            cn: 约 25 KB（估算）
            en: ~25 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
