lang: 'Shell'
homepage: 'https://github.com/BankrBot/skills'
license: noassertion
desc:
  cn: 提供一组开源即插即用的模块，用于构建与区块链协议和去中心化应用交互的 AI Agent
  en: 'Provides a collection of open-source, plug-and-play modules for building AI agents that interact with blockchain protocols and decentralized applications.'
x:
  source: https://github.com/BankrBot/skills
  eget: https://github.com/BankrBot/skills
rule:
  /eget:
    cmd: x eget BankrBot/skills
    reference: https://github.com/BankrBot/skills
binlist:
  - 'skills'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 49 KB
          rating: 1
          desc:
            cn: 约 49 KB（估算）
            en: ~49 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
