lang: 'Shell'
homepage: 'https://github.com/BankrBot/skills'
license: noassertion
desc:
  cn: 提供一组开源即插即用的模块，用于构建与区块链协议和去中心化应用交互的 AI Agent
  en: 'Provides a collection of open-source, plug-and-play modules for building AI agents that interact with blockchain protocols and decentralized applications.'
x:
  source: https://github.com/BankrBot/skills
  eget: https://github.com/BankrBot/skills
rule:
  /eget:
    cmd: x eget BankrBot/skills
    reference: https://github.com/BankrBot/skills
binlist:
  - 'skills'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
