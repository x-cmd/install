lang: TypeScript
homepage: https://github.com/zhijiewong/openharness
license: mit
desc:
  cn: 支持任意 LLM 的开源本地终端 CLI
  en: Open source local terminal cli with any LLM
x:
  source: https://github.com/zhijiewong/openharness
  eget: https://github.com/zhijiewong/openharness
rule:
  /eget:
    cmd: x eget zhijiewong/openharness
    reference: https://github.com/zhijiewong/openharness
binlist:
- openharness

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 91 KB
          rating: 1
          desc:
            cn: 约 91 KB（估算）
            en: ~91 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
