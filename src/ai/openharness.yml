lang: TypeScript
homepage: https://github.com/zhijiewong/openharness
license: mit
desc:
  cn: 支持任意 LLM 的开源本地终端 CLI
  en: Open source local terminal cli with any LLM
  cs: Otevřený zdrojový lokální terminálový cli s podporou libovolného LLM
  de: Quelloffene lokale Terminal-cli mit beliebigem LLM
  es: Cli de terminal local de código abierto compatible con cualquier LLM
  fr: Cli de terminal local open source compatible avec n'importe quel LLM
  id: Cli terminal lokal sumber terbuka dengan LLM apa pun
  it: Cli da terminale locale open source con qualsiasi LLM
  ja: 任意の LLM に対応したオープンソースのローカル端末 cli
  ko: 어떤 LLM이든 지원하는 오픈 소스 로컬 터미널 cli
  pl: Oprogramowanie terminali wiersza poleceń o otwartym kodzie, lokalne, obsługujące dowolny LLM
  pt: Cli de terminal local de código aberto com qualquer LLM
  ro: Cli de terminal local open source cu orice LLM
  ru: Открытый локальный терминальный cli с поддержкой любой LLM
  th: เทอร์มินัล cli แบบโอเพนซอร์สที่ทำงานในเครื่อง รองรับ LLM ใดก็ได้
  tr: Herhangi bir LLM ile çalışan açık kaynak yerel terminal cli
  uk: Відкритий локальний термінальний cli з підтримкою будь-якої LLM
  vi: Cli terminal cục bộ mã nguồn mở hỗ trợ mọi LLM
x:
  source: https://github.com/zhijiewong/openharness
  eget: zhijiewong/openharness
rule:
  /eget:
    cmd: x eget zhijiewong/openharness
    reference: https://github.com/zhijiewong/openharness
binlist:
- openharness

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 91 KB
          rating: 1
          desc:
            cn: 约 91 KB（估算）
            en: ~91 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
