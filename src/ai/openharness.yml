lang: TypeScript
homepage: https://github.com/zhijiewong/openharness
license: mit
desc:
  cn: 支持任意 LLM 的开源本地终端 CLI
  en: Open source local terminal cli with any LLM
x:
  source: https://github.com/zhijiewong/openharness
  eget: https://github.com/zhijiewong/openharness
rule:
  /eget:
    cmd: x eget zhijiewong/openharness
    reference: https://github.com/zhijiewong/openharness
binlist:
- openharness

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
