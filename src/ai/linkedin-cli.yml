lang: TypeScript
homepage: https://github.com/Linked-API/linkedin-cli
license: mit
desc:
  cn: 对 AI 智能体友好的 CLI，用于控制 LinkedIn 账号并获取实时数据
  en: AI-agent-friendly CLI for controlling LinkedIn accounts and retrieving real-time data.
x:
  source: https://github.com/Linked-API/linkedin-cli
  eget: https://github.com/Linked-API/linkedin-cli
rule:
  /eget:
    cmd: x eget Linked-API/linkedin-cli
    reference: https://github.com/Linked-API/linkedin-cli
binlist:
- linkedin-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
