lang: Shell
homepage: https://github.com/JasonYeYuhe/cli-pulse
license: other
desc:
  cn: 实时追踪 50+ AI CLI 工具的用量、成本与配额，并支持手机远程控制 Mac 上的 AI 编码会话
  en: Real-time usage, cost & quota tracking across 50+ AI CLI tools (Claude Code, Codex, Gemini, Cursor, Copilot…) — plus remote-control your Mac's AI coding sessions from your phone. macOS menu bar · i...
x:
  source: https://github.com/JasonYeYuhe/cli-pulse
  eget: https://github.com/JasonYeYuhe/cli-pulse
rule:
  /eget:
    cmd: x eget JasonYeYuhe/cli-pulse
    reference: https://github.com/JasonYeYuhe/cli-pulse
binlist:
- cli-pulse

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
