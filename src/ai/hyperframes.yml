lang: TypeScript
homepage: https://github.com/heygen-com/hyperframes
license: apache-2.0
desc:
  cn: 通过 CLI 与对智能体友好的框架，从 HTML、CSS、JavaScript 动画渲染确定性 MP4 视频
  en: Render deterministic MP4 videos from HTML, CSS, and JavaScript animations using a CLI and agent-friendly framework.
x:
  source: https://github.com/heygen-com/hyperframes
rule:
  /npm:
    cmd: npm install -g hyperframes
    reference: https://github.com/heygen-com/hyperframes
    dsnap: hyperframes
binlist:
- hyperframes

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
