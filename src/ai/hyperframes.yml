lang: TypeScript
homepage: https://github.com/heygen-com/hyperframes
license: apache-2.0
desc:
  cn: 通过 CLI 与对智能体友好的框架，从 HTML、CSS、JavaScript 动画渲染确定性 MP4 视频
  en: Render deterministic MP4 videos from HTML, CSS, and JavaScript animations using a CLI and agent-friendly framework.
x:
  source: https://github.com/heygen-com/hyperframes
rule:
  /npm:
    cmd: npm install -g hyperframes
    reference: https://github.com/heygen-com/hyperframes
    dsnap: hyperframes
binlist:
- hyperframes

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.1 MB
          rating: 1
          desc:
            cn: 约 1.1 MB（估算）
            en: ~1.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
