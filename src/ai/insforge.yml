lang: TypeScript
homepage: https://github.com/InsForge/InsForge
license: apache-2.0
desc:
  cn: 对智能体友好的后端平台，让 AI 直接配置数据库、认证、存储与 Serverless 函数
  en: Provide an agent-friendly backend platform that allows AI to directly configure databases, authentication, storage, and serverless functions.
x:
  source: https://github.com/InsForge/InsForge
rule:
  /git:
    cmd: x git clone InsForge/InsForge
    reference: https://github.com/InsForge/InsForge
binlist:
- insforge

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
