lang: TypeScript
homepage: https://github.com/InsForge/InsForge
license: apache-2.0
desc:
  cn: 对智能体友好的后端平台，让 AI 直接配置数据库、认证、存储与 Serverless 函数
  en: Provide an agent-friendly backend platform that allows AI to directly configure databases, authentication, storage, and serverless functions.
x:
  source: https://github.com/InsForge/InsForge
rule:
  /git:
    cmd: x git clone InsForge/InsForge
    reference: https://github.com/InsForge/InsForge
binlist:
- insforge

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 285 KB
          rating: 1
          desc:
            cn: 约 285 KB（估算）
            en: ~285 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
