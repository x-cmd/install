lang: Go
homepage: https://github.com/ishizakahiroshi/many-ai-cli
license: mit
desc:
  cn: 用于审批管理与监控并行 AI 编码 CLI 会话的本地 Web 仪表板
  en: Local web dashboard for managing approvals and monitoring parallel AI coding CLI sessions.
  cs: Místní webový panel pro správu schvalování a monitorování paralelních relací AI kódovacího CLI.
  de: Lokales Web-Dashboard zur Verwaltung von Freigaben und zur Überwachung paralleler KI-Coding-CLI-Sitzungen.
  es: Panel web local para gestionar aprobaciones y supervisar sesiones paralelas de CLI de programación con IA.
  fr: Tableau de bord web local pour gérer les approbations et surveiller les sessions CLI de codage IA parallèles.
  id: Dasbor web lokal untuk mengelola persetujuan dan memantau sesi CLI pengodean AI paralel.
  it: Dashboard web locale per gestire le approvazioni e monitorare sessioni CLI di coding con AI parallele.
  ja: 承認の管理と並列 AI コーディング CLI セッションの監視を行うローカル Web ダッシュボード。
  ko: 승인을 관리하고 병렬 AI 코딩 CLI 세션을 모니터링하는 로컬 웹 대시보드.
  pl: Lokalny pulpit nawigacji do zarządzania zatwierdzeniami i monitorowania równoległych sesji CLI do kodowania AI.
  pt: Painel web local para gerenciar aprovações e monitorar sessões paralelas de CLI de programação com IA.
  ro: Tablou de bord web local pentru gestionarea aprobărilor și monitorizarea sesiunilor paralele de CLI de codare AI.
  ru: Локальная веб-панель для управления подтверждениями и мониторинга параллельных сессий ИИ-кодинга в CLI.
  th: แดชบอร์ดเว็บในเครื่องสำหรับจัดการการอนุมัติและติดตามเซสชัน CLI เขียนโค้ดด้วย AI แบบขนาน
  tr: Onayları yönetmek ve paralel AI kodlama CLI oturumlarını izlemek için yerel web panosu.
  uk: Локальна веб-панель для керування підтвердженнями та моніторингу паралельних сесій AI-кодування в CLI.
  vi: Bảng điều khiển web cục bộ để quản lý phê duyệt và theo dõi các phiên CLI viết mã bằng AI chạy song song.
x:
  source: https://github.com/ishizakahiroshi/many-ai-cli
  eget: ishizakahiroshi/many-ai-cli
rule:
  /eget:
    cmd: x eget ishizakahiroshi/many-ai-cli
    reference: https://github.com/ishizakahiroshi/many-ai-cli
binlist:
- many-ai-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 约 12 MB（估算）
            en: ~12 MB estimated
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
