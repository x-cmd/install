lang: Go
homepage: https://github.com/ishizakahiroshi/many-ai-cli
license: mit
desc:
  cn: 用于审批管理与监控并行 AI 编码 CLI 会话的本地 Web 仪表板
  en: Local web dashboard for managing approvals and monitoring parallel AI coding CLI sessions.
x:
  source: https://github.com/ishizakahiroshi/many-ai-cli
  eget: https://github.com/ishizakahiroshi/many-ai-cli
rule:
  /eget:
    cmd: x eget ishizakahiroshi/many-ai-cli
    reference: https://github.com/ishizakahiroshi/many-ai-cli
binlist:
- many-ai-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 约 12 MB（估算）
            en: ~12 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
