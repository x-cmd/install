lang: 'TypeScript'
homepage: 'https://github.com/ponponon/claude_code_src'
license: noassertion
desc:
  cn: 2026.3.31 Claude Code 意外将含源码文件上传至 npm（版本 2.1.88），其中 cli.js.map 达 57MB，源码位于 sourcesContent 字段，解压还原后约 70 万行
  en: '2026.3.31 claude code 意外把包含源码的文件上传到 npm 仓库，版本号是 2.1.88，其中 cli.js.map 文件有 57MB 的体积，claude code 的源码在该文件的 sourcesContent 字段里面，解压还原后有 70w 行代码'
x:
  source: https://github.com/ponponon/claude_code_src
  eget: https://github.com/ponponon/claude_code_src
rule:
  /eget:
    cmd: x eget ponponon/claude_code_src
    reference: https://github.com/ponponon/claude_code_src
binlist:
  - 'claude_code_src'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
