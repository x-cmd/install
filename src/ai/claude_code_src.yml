lang: 'TypeScript'
homepage: 'https://github.com/ponponon/claude_code_src'
license: noassertion
desc:
  cn: 2026.3.31 Claude Code 意外将含源码文件上传至 npm（版本 2.1.88），其中 cli.js.map 达 57MB，源码位于 sourcesContent 字段，解压还原后约 70 万行
  en: '2026.3.31 claude code 意外把包含源码的文件上传到 npm 仓库，版本号是 2.1.88，其中 cli.js.map 文件有 57MB 的体积，claude code 的源码在该文件的 sourcesContent 字段里面，解压还原后有 70w 行代码'
  cs: Dne 31.3.2026 Claude Code omylem nahrál soubory se zdrojovým kódem do repozitáře npm, verze 2.1.88, přičemž soubor cli.js.map měl 57 MB a zdrojový kód Claude Code se nacházel v poli sourcesContent tohoto souboru, po rozbalení a obnově měl asi 700 000 řádků kódu.
  de: Am 31.3.2026 hat Claude Code versehentlich Dateien mit Quellcode in das npm-Repository hochgeladen, Version 2.1.88, wobei die Datei cli.js.map 57 MB groß war und der Quellcode von Claude Code im Feld sourcesContent dieser Datei lag, nach dem Entpacken und Wiederherstellen rund 700.000 Codezeilen ergaben.
  es: El 31/3/2026 Claude Code subió por error al repositorio de npm archivos con el código fuente, versión 2.1.88, donde el archivo cli.js.map pesaba 57 MB y el código fuente de Claude Code estaba en el campo sourcesContent de ese archivo, tras descomprimir y restaurar había unas 700.000 líneas de código.
  fr: Le 31/3/2026, Claude Code a accidentellement téléversé sur le dépôt npm des fichiers contenant le code source, version 2.1.88, le fichier cli.js.map pesait 57 Mo et le code source de Claude Code se trouvait dans le champ sourcesContent de ce fichier, soit environ 700 000 lignes de code après extraction et restauration.
  id: Pada 31.3.2026 Claude Code tidak sengaja mengunggah berkas berisi kode sumber ke repositori npm, versi 2.1.88, dengan berkas cli.js.map berukuran 57 MB dan kode sumber Claude Code berada di field sourcesContent berkas tersebut, setelah diekstrak dan dipulihkan ada sekitar 700 ribu baris kode.
  it: Il 31/3/2026 Claude Code ha caricato per errore nel repository npm file contenenti il codice sorgente, versione 2.1.88, con il file cli.js.map da 57 MB e il codice sorgente di Claude Code nel campo sourcesContent di quel file, che dopo l'estrazione e il ripristino contiene circa 700.000 righe di codice.
  ja: 2026年3月31日、Claude Code は誤ってソースコードを含むファイルを npm リポジトリにアップロードしました（バージョン 2.1.88）。cli.js.map は 57MB で、Claude Code のソースコードはその sourcesContent フィールドにあり、展開・復元すると約 70 万行のコードになります。
  ko: 2026.3.31 Claude Code가 실수로 소스 코드가 포함된 파일을 npm 저장소에 업로드했습니다(버전 2.1.88). cli.js.map 파일은 57MB이며 Claude Code 소스 코드는 해당 파일의 sourcesContent 필드에 있고, 압축 해제 및 복원하면 약 70만 줄의 코드가 됩니다.
  pl: 31.3.2026 Claude Code przypadkowo wgrał do repozytorium npm pliki zawierające kod źródłowy, wersja 2.1.88, przy czym plik cli.js.map miał 57 MB, a kod źródłowy Claude Code znajdował się w polu sourcesContent tego pliku — po rozpakowaniu i odtworzeniu to około 700 tysięcy linii kodu.
  pt: Em 31/3/2026 o Claude Code enviou por engano ao repositório npm arquivos com o código-fonte, versão 2.1.88, sendo que o arquivo cli.js.map tinha 57 MB e o código-fonte do Claude Code estava no campo sourcesContent desse arquivo, resultingo em cerca de 700 mil linhas de código após a extração.
  ro: Pe 31.3.2026, Claude Code a încărcat accidental în depozitul npm fișiere care conțin codul sursă, versiunea 2.1.88, fișierul cli.js.map având 57 MB, iar codul sursă al Claude Code se afla în câmpul sourcesContent al acestui fișier, rezultând circa 700.000 de linii de cod după extragere.
  ru: 31.3.2026 Claude Code по ошибке загрузил в репозиторий npm файлы с исходным кодом, версия 2.1.88, при этом файл cli.js.map занимал 57 МБ, а исходный код Claude Code находился в поле sourcesContent этого файла — после распаковки и восстановления это около 700 тысяч строк кода.
  th: วันที่ 31 มี.ค. 2026 Claude Code เผลออัปโหลดไฟล์ที่มีซอร์สโค้ดขึ้น npm รีโพ เวอร์ชัน 2.1.88 โดยไฟล์ cli.js.map มีขนาด 57MB และซอร์สโค้ดของ Claude Code อยู่ในฟิลด์ sourcesContent ของไฟล์นั้น เมื่อแตกและกู้คืนแล้วมีรหัสราว 700,000 บรทัด
  tr: 31.3.2026 tarihinde Claude Code, kaynak kodu içeren dosyaları yanlışlıkla npm deposuna yükledi; sürüm 2.1.88 idi, cli.js.map dosyası 57 MB boyutundaydı ve Claude Code'un kaynak kodu bu dosyanın sourcesContent alanındaydı; açılıp geri yüklendiğinde yaklaşık 700 bin satır kod bulunuyor.
  uk: 31.3.2026 Claude Code випадково завантажив до репозиторію npm файли з вихідним кодом, версія 2.1.88, причому файл cli.js.map мав розмір 57 МБ, а вихідний код Claude Code містився в полі sourcesContent цього файлу — після розпакування та відновлення це близько 700 тисяч рядків коду.
  vi: Ngày 31/3/2026 Claude Code vô tình tải lên kho npm các tệp chứa mã nguồn, phiên bản 2.1.88, trong đó tệp cli.js.map có dung lượng 57MB và mã nguồn của Claude Code nằm trong trường sourcesContent của tệp đó, sau khi giải nén và khôi phục có khoảng 700 nghìn dòng mã.
