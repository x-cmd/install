lang: JavaScript
homepage: https://github.com/affaan-m/ECC
license: mit
desc:
  cn: Agent 框架的性能优化系统，为 Claude Code、Codex、OpenCode、Cursor 等提供技能、直觉、记忆、安全与研究优先开发
  en: The agent harness performance optimization system. Skills, instincts, memory, security, and research-first development for Claude Code, Codex, Opencode, Cursor and beyond.
x:
  source: https://github.com/affaan-m/ECC
  eget: affaan-m/ECC
rule:
  /eget:
    cmd: x eget affaan-m/ECC
    reference: https://github.com/affaan-m/ECC
binlist:
- ECC

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 459 KB
          rating: 1
          desc:
            cn: 约 459 KB（估算）
            en: ~459 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
