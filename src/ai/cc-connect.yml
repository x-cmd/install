lang: Go
homepage: https://github.com/chenhg5/cc-connect
license: MIT
desc:
  cn: 本地 AI 编码代理（Claude Code / Cursor / Gemini CLI / Codex / Kimi CLI / OpenCode 等 10+ 种）到即时通讯平台（飞书、钉钉、Slack、Telegram、Discord、企微、个人微信、QQ、LINE 等 13 种）的桥接服务，可通过聊天远程驱动本地代理执行代码审查、调试与自动化任务，大多数平台无需公网 IP
  en: Bridge local AI coding agents (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode, and 10+ more) to chat platforms (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, personal WeChat, QQ, LINE, Matrix, and 13 total). Drive your local agents remotely from chat for code review, debugging, and automation — most platforms need no public IP.
  cs: Propojení místních kódovacích agentů AI (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode a dalších 10+) s chatovacími platformami (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, osobní WeChat, QQ, LINE, Matrix a celkem 13). Ovládejte své místní agenty na dálku z chatu pro code review, ladění chyb a automatizaci — většina platforem nepotřebuje veřejnou IP adresu.
  de: Verbindet lokale KI-Coding-Agents (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode und 10+ weitere) mit Chat-Plattformen (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, privates WeChat, QQ, LINE, Matrix, insgesamt 13). Steuern Sie Ihre lokalen Agents aus dem Chat heraus ferngesteuert für Code-Review, Debugging und Automatisierung — die meisten Plattformen brauchen keine öffentliche IP.
  es: Puente entre agentes de programación con IA locales (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode y 10 más) y plataformas de chat (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, WeChat personal, QQ, LINE, Matrix, 13 en total). Conduce tus agentes locales de forma remota desde el chat para revisión de código, depuración y automatización — la mayoría de plataformas no necesita IP pública.
  fr: Passerelle entre les agents de codage IA locaux (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode et 10 autres) et les plateformes de chat (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, WeChat personnel, QQ, LINE, Matrix, 13 au total). Pilotez vos agents locaux à distance depuis le chat pour la revue de code, le débogage et l'automatisation — la plupart des plateformes n'ont pas besoin d'IP publique.
  id: Jembatan antara agen pengodean AI lokal (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode, dan 10+ lainnya) dengan platform chat (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, WeChat pribadi, QQ, LINE, Matrix, total 13). Kendalikan agen lokal Anda dari jarak jauh lewat chat untuk tinjauan kode, debugging, dan otomasi — sebagian besar platform tidak memerlukan IP publik.
  it: Ponte tra gli agenti di codifica IA locali (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode e altri 10+) e le piattaforme di chat (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, WeChat personale, QQ, LINE, Matrix, 13 in totale). Guida i tuoi agenti locali da remoto via chat per code review, debug e automazione — la maggior parte delle piattaforme non richiede IP pubblico.
  ja: ローカルの AI コーディングエージェント（Claude Code、Cursor、Gemini CLI、Codex、Kimi CLI、OpenCode ほか 10 種類以上）とチャットプラットフォーム（Feishu/Lark、DingTalk、Slack、Telegram、Discord、WeChat Work、個人用 WeChat、QQ、LINE、Matrix、計 13 種類）を橋渡しします。チャットからリモートでコードレビュー、デバッグ、自動化を実行 — ほとんどのプラットフォームは公開 IP 不要です。
  ko: 로컬 AI 코딩 에이전트(Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode 외 10여 개)를 채팅 플랫폼(Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, 개인 WeChat, QQ, LINE, Matrix, 총 13개)과 연결합니다. 채팅으로 로컬 에이전트를 원격 구동해 코드 리뷰, 디버깅, 자동화를 수행하세요 — 대부분의 플랫폼은 공인 IP가 필요 없습니다.
  pl: Mostka między lokalnymi agentami kodującymi AI (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode i 10 innych) a platformami czatu (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, osobisty WeChat, QQ, LINE, Matrix, łącznie 13). Steruj lokalnymi agentami zdalnie z czatu w celu przeglądu kodu, debugowania i automatyzacji — większość platform nie wymaga publicznego IP.
  pt: Ponte entre agentes de codificação com IA locais (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode e mais 10+) e plataformas de chat (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, WeChat pessoal, QQ, LINE, Matrix, 13 no total). Dirija seus agentes locais remotamente pelo chat para revisão de código, depuração e automação — a maioria das plataformas não precisa de IP público.
  ro: Punte între agenții locali de codare AI (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode și încă 10+) și platformele de chat (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, WeChat personal, QQ, LINE, Matrix, 13 în total). Conduce-ți agenții locali de la distanță prin chat pentru code review, depanare și automatizare — majoritatea platformelor nu au nevoie de IP public.
  ru: Мост между локальными ИИ-агентами написания кода (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode и ещё 10+) и платформами для чата (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, личный WeChat, QQ, LINE, Matrix, всего 13). Управляйте локальными агентами удалённо из чата для code review, отладки и автоматизации — большинству платформ не нужен публичный IP.
  th: สะพานเชื่อมเอเจนต์เขียนโค้ดด้วย AI ในเครื่อง (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode และอีก 10+ ตัว) กับแพลตฟอร์มแชท (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, WeChat ส่วนตัว, QQ, LINE, Matrix รวม 13 ตัว) ขับเคลื่อนเอเจนต์ในเครื่องจากระยะไกลผ่านแชทเพื่อรีวิวโค้ด ดีบัก และทำงานอัตโนมัติ — ส่วนใหญ่ไม่ต้องใช้ IP สาธารณะ
  tr: Yerel YZ kodlama ajanlarını (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode ve 10+ tane daha) sohbet platformlarıyla (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, kişisel WeChat, QQ, LINE, Matrix, toplam 13) birbirine bağlar. Yerel ajanlarınızı kod incelemesi, hata ayıklama ve otomasyon için sohbetten uzaktan çalıştırın — platformların çoğu genel IP gerektirmez.
  uk: Мост між локальними ІІ-агентами написання коду (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode та ще 10+) і платформами для чату (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, особистий WeChat, QQ, LINE, Matrix, усього 13). Керуйте локальними агентами віддалено з чату для code review, налагодження та автоматизації — більшість платформ не потребує публічної IP.
  vi: Cầu nối giữa các agent lập trình AI cục bộ (Claude Code, Cursor, Gemini CLI, Codex, Kimi CLI, OpenCode và hơn 10 agent khác) với các nền tảng trò chuyện (Feishu/Lark, DingTalk, Slack, Telegram, Discord, WeChat Work, WeChat cá nhân, QQ, LINE, Matrix, tổng cộng 13 nền tảng). Điều khiển từ xa các agent cục bộ ngay trong chat để review code, gỡ lỗi và tự động hóa — hầu hết nền tảng không cần IP công cộng.
x:
  source: https://github.com/chenhg5/cc-connect
  eget: chenhg5/cc-connect
  brew: cc-connect
  npm: cc-connect
rule:
  /eget:
    cmd: x eget use chenhg5/cc-connect
    reference: https://github.com/chenhg5/cc-connect/releases
  /npm:
    cmd: npm install -g cc-connect
    reference: https://github.com/chenhg5/cc-connect#3%EF%B8%8F%E2%83%A3-install-cc-connect
    dsnap: cc-connect
  darwin/brew:
    cmd: brew install cc-connect
    reference: https://github.com/chenhg5/cc-connect#3%EF%B8%8F%E2%83%A3-install-cc-connect
binlist:
- cc-connect

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 MB
          rating: 2
          desc:
            cn: 约 17 MB（估算）
            en: ~17 MB estimated
        download:
          estimate: 16 MB
          desc:
            cn: 约 16 MB 下载 (linux/x64)
            en: ~16 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
