lang: JavaScript
homepage: https://github.com/gsd-build/get-shit-done
license: mit
desc:
  cn: 编排 AI 智能体完成从规划研究到代码执行验证的规格驱动软件开发
  en: Orchestrate AI agents to manage spec-driven software development, from planning and research to code execution and verification, directly from your command line.
x:
  source: https://github.com/gsd-build/get-shit-done
  eget: https://github.com/gsd-build/get-shit-done
rule:
  /eget:
    cmd: x eget gsd-build/get-shit-done
    reference: https://github.com/gsd-build/get-shit-done
binlist:
- get-shit-done

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 484 KB
          rating: 1
          desc:
            cn: 约 484 KB（估算）
            en: ~484 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
