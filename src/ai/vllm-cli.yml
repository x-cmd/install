lang: Python
homepage: https://github.com/Chen-zexi/vllm-cli
license: mit
desc:
  cn: 基于 vLLM 提供 LLM 服务的命令行工具
  en: A command-line interface tool for serving LLM using vLLM.
x:
  source: https://github.com/Chen-zexi/vllm-cli
  eget: https://github.com/Chen-zexi/vllm-cli
rule:
  /eget:
    cmd: x eget Chen-zexi/vllm-cli
    reference: https://github.com/Chen-zexi/vllm-cli
binlist:
- vllm-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
