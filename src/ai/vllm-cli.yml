lang: Python
homepage: https://github.com/Chen-zexi/vllm-cli
license: mit
desc:
  cn: 基于 vLLM 提供 LLM 服务的命令行工具
  en: A command-line interface tool for serving LLM using vLLM.
x:
  source: https://github.com/Chen-zexi/vllm-cli
  eget: https://github.com/Chen-zexi/vllm-cli
rule:
  /eget:
    cmd: x eget Chen-zexi/vllm-cli
    reference: https://github.com/Chen-zexi/vllm-cli
binlist:
- vllm-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 59 KB
          rating: 1
          desc:
            cn: 约 59 KB（估算）
            en: ~59 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
