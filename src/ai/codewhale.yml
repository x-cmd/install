lang: Rust
homepage: https://github.com/Hmbown/CodeWhale
license: mit
desc:
  cn: 开源、社区驱动的智能体框架
  en: Open-source, community-driven agent harness
x:
  source: https://github.com/Hmbown/CodeWhale
  eget: https://github.com/Hmbown/CodeWhale
rule:
  /eget:
    cmd: x eget Hmbown/CodeWhale
    reference: https://github.com/Hmbown/CodeWhale
binlist:
- CodeWhale

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 133 MB
          rating: 3
          desc:
            cn: 安装 133 MB
            en: 133 MB install
        download:
          estimate: 66 MB
          desc:
            cn: 约 66 MB 下载 (linux/x64)
            en: ~66 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 14 MB
        desc:
          cn: 14 MB
          en: 14 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
