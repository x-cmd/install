lang: Rust
homepage: https://github.com/Hmbown/CodeWhale
license: mit
desc:
  cn: 开源、社区驱动的智能体框架
  en: Open-source, community-driven agent harness
x:
  source: https://github.com/Hmbown/CodeWhale
  eget: https://github.com/Hmbown/CodeWhale
rule:
  /eget:
    cmd: x eget Hmbown/CodeWhale
    reference: https://github.com/Hmbown/CodeWhale
binlist:
- CodeWhale

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
