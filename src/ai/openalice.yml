lang: TypeScript
homepage: https://github.com/TraderAlice/OpenAlice
license: AGPL-3.0
desc:
  cn: 一人即华尔街的 AI 交易代理——覆盖股票、加密、商品、外汇与宏观，从研究到下单、持仓管理、退出全流程，UTA 隔离券商凭证、Trading-as-Git 留审计痕迹、所有交易需人工显式确认。
  en: Your one-person Wall Street — an AI trading agent covering equities, crypto, commodities, forex, and macro, end-to-end from research through position entry and ongoing management to exit. UTA isolates broker credentials, Trading-as-Git leaves a reviewable audit trail, and every order requires explicit human approval.
  cs: Vaše jednoosobová Wall Street — AI obchodní agent pokrývající akcie, krypto, komodity, forex a makro, komplexně od výzkumu přes otevření pozice a průběžné řízení až po výstup. UTA izoluje přihlašovací údaje k brokerovi, Trading-as-Git zanechává přezkoumatelnou auditní stopu a každý příkaz vyžaduje výslovné schválení člověkem.
  de: Ihre Ein-Personen-Wall-Street – ein KI-Handelsagent für Aktien, Krypto, Rohstoffe, Forex und Makro, durchgängig von der Recherche über den Positionseinstieg und das laufende Management bis zum Ausstieg. UTA isoliert Broker-Zugangsdaten, Trading-as-Git hinterlässt eine prüfbare Audit-Spur und jede Order erfordert eine ausdrückliche menschliche Freigabe.
  es: "Tu Wall Street de una persona: un agente de trading de IA para acciones, cripto, materias primas, forex y macro, de principio a fin, desde la investigación hasta la apertura de posiciones, su gestión continua y el cierre. UTA aísla las credenciales del bróker, Trading-as-Git deja un rastro de auditoría revisable y cada orden requiere la aprobación explícita de una persona."
  fr: "Votre Wall Street à un seul agent : un agent de trading IA couvrant actions, crypto, matières premières, forex et macro, de bout en bout, de la recherche à l'ouverture de position, à la gestion continue jusqu'à la sortie. UTA isole les identifiants du courtier, Trading-as-Git laisse une piste d'audit vérifiable et chaque ordre exige une validation humaine explicite."
  id: Wall Street satu orang — agen dagang AI untuk saham, kripto, komoditas, forex, dan makro, dari riset hingga pembukaan posisi, pengelolaan berkelanjutan, sampai keluar. UTA mengisolasi kredensial broker, Trading-as-Git meninggalkan jejak audit yang dapat ditinjau, dan setiap perintah memerlukan persetujuan manusia yang eksplisit.
  it: "La tua Wall Street personale: un agente di trading IA che copre azioni, criptovalute, commodity, forex e macro, end-to-end dalla ricerca all'apertura della posizione, alla gestione continua, fino all'uscita. UTA isola le credenziali del broker, Trading-as-Git lascia una traccia di audit verificabile e ogni ordine richiede un'esplicita approvazione umana."
  ja: あなただけのウォールストリート — 株式、暗号資産、商品、為替、マクロを扱う AI トレーディングエージェント。リサーチからポジションの建玉、継続的な管理、決済までを一気通貫でカバー。UTA はブローカー認証情報を分離し、Trading-as-Git は監査可能な履歴を残し、すべての注文に明示的な人間の承認が必要です。
  ko: 혼자 일하는 월 스트리트 — 주식, 암호화폐, 원자재, 외환, 매크로를 다루는 AI 트레이딩 에이전트. 리서치부터 포지션 진입, 지속적인 관리, 청산까지 엔드투엔드로 지원합니다. UTA는 브로커 자격 증명을 격리하고, Trading-as-Git는 검토 가능한 감사 추적을 남기며, 모든 주문은 사람의 명시적 승인이 필요합니다.
  pl: Twoja jednoosobowa Wall Street — agent handlujący AI obejmujący akcje, krypto, towary, forex i makro, kompleksowo od badań, przez otwarcie pozycji i bieżące zarządzanie, aż do zamknięcia. UTA izoluje dane logowania do brokera, Trading-as-Git pozostawia audytowalny ślad, a każde zlecenie wymaga wyraźnej zgody człowieka.
  pt: A sua Wall Street de uma pessoa — um agente de trading de IA para ações, cripto, commodities, forex e macro, de ponta a ponta, da pesquisa à abertura de posições, à gestão contínua e à saída. A UTA isola as credenciais do broker, o Trading-as-Git deixa um rasto de auditoria revisável e cada ordem exige aprovação humana explícita.
  ro: "Wall Street-ul dumneavoastră — un agent de tranzacționare AI pentru acțiuni, cripto, mărfuri, forex și macro, de la cap la coadă: de la cercetare și intrarea în poziție, la gestionarea continuă, până la ieșire. UTA izolează credentialele brokerului, Trading-as-Git lasă o urmă de audit revizuibilă, iar fiecare ordin necesită o aprobare umană explicită."
  ru: Ваш Уолл-стрит на одного человека — ИИ-агент для торговли акциями, криптой, сырьём, форексом и макро, от исследования и открытия позиции до сопровождения и выхода. UTA изолирует учётные данные брокера, Trading-as-Git оставляет проверяемый след аудита, а каждый ордер требует явного одобрения человека.
  th: Wall Street ของคุณคนเดียว — เอเจนต์เทรดดิ้ง AI ครอบคลุมหุ้น คริปโต สินค้า ฟอเร็กซ์ และมอโคร ตั้งแต่การวิจัย เข้าสู่สถานะ บริหารอย่างต่อเนื่อง ไปจนถึงการปิดสถานะ UTA แยกข้อมูลรับรองของโบรกเกอร์ Trading-as-Git ทิ้งร่องรอยการตรวจสอบที่ทบทวนได้ และทุกคำสั่งซื้อขายต้องได้รับการอนุมัติจากมนุษย์อย่างชัดเจน
  tr: Tek kişilik Wall Street — hisse senetleri, kripto, emtia, forex ve makro için bir AI işlem ajanı; araştırmadan pozisyon açmaya, sürekli yönetimden çıkışa kadar uçtan uca. UTA aracı kimlik bilgilerini izole eder, Trading-as-Git gözden geçirilebilir bir denetim izi bırakır ve her emir açık insan onayı gerektirir.
  uk: Ваш Уолл-стрит на одного — ІІ-агент для торгівлі акціями, криптою, сировиною, форексом і макро, від дослідження та відкриття позиції до супроводу й виходу. UTA ізолює облікові дані брокера, Trading-as-Git залишає перевірюваний слід аудиту, а кожне замовлення потребує явного людського підтвердження.
  vi: Wall Street của riêng bạn — tác nhân giao dịch AI cho cổ phiếu, tiền mã hóa, hàng hóa, ngoại hối và kinh tế vĩ mô, trọn vẹn từ nghiên cứu, mở vị thế, quản lý liên tục cho tới đóng vị thế. UTA tách biệt thông tin đăng nhập của broker, Trading-as-Git để lại một dấu vết kiểm toán có thể rà soát, và mọi lệnh đều cần được con người phê duyệt rõ ràng.
x:
  source: https://github.com/TraderAlice/OpenAlice
rule:
  /git:
    cmd: x git clone TraderAlice/OpenAlice
    reference: https://github.com/TraderAlice/OpenAlice#quick-start
    dsnap: OpenAlice
