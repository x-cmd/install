lang: TypeScript
homepage: https://github.com/superagent-ai/grok-cli
license: mit
desc:
  cn: 面向 Grok API 的开源编码智能体
  en: An open-source coding agent for the Grok API
x:
  source: https://github.com/superagent-ai/grok-cli
  eget: https://github.com/superagent-ai/grok-cli
rule:
  /eget:
    cmd: x eget superagent-ai/grok-cli
    reference: https://github.com/superagent-ai/grok-cli
binlist:
- grok-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 112 MB
          rating: 3
          desc:
            cn: 安装 112 MB
            en: 112 MB install
        download:
          estimate: 112 MB
          desc:
            cn: 约 112 MB 下载 (linux/x64)
            en: ~112 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
