lang: TypeScript
homepage: https://github.com/cloudflare/agents
license: mit
desc:
  cn: Cloudflare 官方的有状态 AI Agent SDK——基于 Durable Objects,支持持久状态、可调用 RPC、调度、WebSocket、MCP、工作流、语音、邮件与 React Hooks,空闲时休眠、按需唤醒。
  en: Build and deploy persistent, stateful AI agents on the Cloudflare network, with built-in support for state management, scheduling, workflows, and real-time communication.
x:
  source: https://github.com/cloudflare/agents
rule:
  /npm:
    cmd: npm create cloudflare@latest -- --template cloudflare/agents-starter
    reference: https://github.com/cloudflare/agents
    dsnap: cloudflare
binlist:
- agents

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
