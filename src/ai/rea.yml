lang: TypeScript
homepage: https://github.com/morluto/rea
license: MIT
desc:
  en: REA (Reverse Engineer Anything) is an MCP tool surface that lets AI coding agents reverse-engineer software end-to-end — native binaries, Electron, .NET, APKs, firmware, websites — with non-silent evidence and limitations.
  cn: REA 是面向 AI 编程代理的 MCP 工具面，可对原生二进制、Electron、.NET、APK、固件与网站等做端到端逆向工程，结果附带证据与局限说明。
x:
  source: https://github.com/morluto/rea
  npm: rea-agents
rule:
  /npm:
    cmd: npm install -g rea-agents
    reference: https://github.com/morluto/rea
    dsnap: rea-agents
  /npx:
    cmd: npx -y rea-agents setup
    reference: https://github.com/morluto/rea
binlist:
- rea

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取待逆向的二进制/源码与本地配置
          en: Reads binaries/sources to be reverse-engineered and local config
        sensitive: []
      write:
        desc:
          cn: 写入分析结果缓存与配置
          en: Writes analysis cache and configuration
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 1
          desc:
            cn: 约 10 MB 安装
            en: ~10 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (npm 包)
            en: ~4 MB download (npm tarball)
      paths:
        data:
          - ~/.local/share/rea/
        config: []
    memory:
      idle:
        estimate: 60 MB
        desc:
          cn: 约 60 MB 闲置（含 Node.js 运行时）
          en: ~60 MB idle (Node.js runtime incl.)
    cpu:
      workload: ['compute', 'io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 低
          en: Low
  platform:
    win: full
    linux: full
    darwin: full
