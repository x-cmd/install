lang: 'Rust'
homepage: https://github.com/qdrant/qdrant
license: 'Apache-2.0'
desc:
  cn: 面向下一代 AI 的高性能大规模向量数据库和向量检索引擎
  en: 'Qdrant - High-performance, massive-scale Vector Database and Vector Search Engine for the next generation of AI. Also available in the cloud https://cloud.qdrant.io/'
x:
  source: https://github.com/qdrant/qdrant
  eget: https://github.com/qdrant/qdrant
rule:
  /eget:
    cmd: x eget qdrant/qdrant
    reference: https://github.com/qdrant/qdrant
binlist:
  - 'qdrant'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
