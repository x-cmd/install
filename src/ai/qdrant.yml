lang: 'Rust'
homepage: https://github.com/qdrant/qdrant
license: 'Apache-2.0'
desc:
  cn: 面向下一代 AI 的高性能大规模向量数据库和向量检索引擎
  en: 'Qdrant - High-performance, massive-scale Vector Database and Vector Search Engine for the next generation of AI. Also available in the cloud https://cloud.qdrant.io/'
x:
  source: https://github.com/qdrant/qdrant
  eget: https://github.com/qdrant/qdrant
rule:
  /eget:
    cmd: x eget qdrant/qdrant
    reference: https://github.com/qdrant/qdrant
binlist:
- 'qdrant'

# already profiled
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 85 MB
          rating: 3
          desc:
            cn: 安装 85 MB
            en: 85 MB install
        download:
          estimate: 31 MB
          desc:
            cn: 约 31 MB 下载 (linux/x64)
            en: ~31 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 12 MB
        desc:
          cn: 12 MB
          en: 12 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
