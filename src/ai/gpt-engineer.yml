lang: Python
homepage: https://github.com/AntonOsika/gpt-engineer
license: MIT
desc:
  cn: gpt-engineer 是一个通过自然语言与 AI 交互来自动生成 web 应用程序的商业项目
  en: gpt-engineer is a commercial project that automatically generates web applications by interacting with AI through natural language
  cs: gpt-engineer je komerční projekt, který automaticky generuje webové aplikace interakcí s AI prostřednictvím přirozeného jazyka
  de: gpt-engineer ist ein kommerzielles Projekt, das Webanwendungen automatisch erzeugt, indem es über natürliche Sprache mit KI interagiert
  es: gpt-engineer es un proyecto comercial que genera automáticamente aplicaciones web al interactuar con la IA mediante lenguaje natural
  fr: gpt-engineer est un projet commercial qui génère automatiquement des applications web en interagissant avec l'IA via le langage naturel
  id: gpt-engineer adalah proyek komersial yang secara otomatis menghasilkan aplikasi web dengan berinteraksi dengan AI melalui bahasa alami
  it: gpt-engineer è un progetto commerciale che genera automaticamente applicazioni web interagendo con l'IA tramite linguaggio naturale
  ja: gpt-engineer は、自然言語で AI と対話することでウェブアプリケーションを自動生成する商用プロジェクトです。
  ko: gpt-engineer는 자연어로 AI와 상호작용하여 웹 애플리케이션을 자동으로 생성하는 상용 프로젝트입니다.
  pl: gpt-engineer to komercyjny projekt, który automatycznie generuje aplikacje internetowe poprzez interakcję z AI w języku naturalnym
  pt: gpt-engineer é um projeto comercial que gera automaticamente aplicações web interagindo com a IA por meio de linguagem natural
  ro: gpt-engineer este un proiect comercial care generează automat aplicații web prin interacțiunea cu AI în limbaj natural
  ru: gpt-engineer — коммерческий проект, который автоматически создаёт веб-приложения, взаимодействуя с ИИ на естественном языке
  th: gpt-engineer เป็นโครงการเชิงพาณิชย์ที่สร้างเว็บแอปพลิเคชันโดยอัตโนมัติ ผ่านการโต้ตอบกับ AI ด้วยภาษาธรรมชาติ
  tr: gpt-engineer, doğal dil üzerinden yapay zekâ ile etkileşime girerek web uygulamalarını otomatik olarak üreten ticari bir projedir.
  uk: gpt-engineer — комерційний проєкт, який автоматично створює вебзастосунки, взаємодіючи з ШІ природною мовою
  vi: gpt-engineer là một dự án thương mại tự động tạo ra ứng dụng web bằng cách tương tác với AI qua ngôn ngữ tự nhiên
x:
  source: https://github.com/AntonOsika/gpt-engineer
  yay: gpt-engineer
  pip: gpt_engineer
rule:
  /x:
    cmd: x pkg use gpt-engineer
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install gpt_engineer
    reference: https://gpt-engineer.readthedocs.io/en/latest/installation.html#stable-release
    dsnap: gpt_engineer
  arch/yay:
    cmd: yay -S gpt-engineer
    reference: https://aur.archlinux.org/packages/gpt-engineer
binlist:
- gpt-engineer

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
