lang: Python
homepage: https://github.com/AntonOsika/gpt-engineer
license: MIT
desc:
  cn: gpt-engineer 是一个通过自然语言与 AI 交互来自动生成 web 应用程序的商业项目
  en: gpt-engineer is a commercial project that automatically generates web applications by interacting with AI through natural language
x:
  pkg:
    exist: true
  source: https://github.com/AntonOsika/gpt-engineer
rule:
  /x:
    cmd: x pkg use gpt-engineer
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install gpt_engineer
    reference: https://gpt-engineer.readthedocs.io/en/latest/installation.html#stable-release
    dsnap: gpt_engineer
  arch/yay:
    cmd: yay -S gpt-engineer
    reference: https://aur.archlinux.org/packages/gpt-engineer
binlist:
- gpt-engineer

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
