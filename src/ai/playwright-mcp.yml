lang: TypeScript
homepage: https://github.com/microsoft/playwright-mcp
license: apache-2.0
desc:
  cn: 微软官方的 MCP 服务器，把 Playwright 浏览器自动化以结构化可访问性快照的形式暴露给 LLM
  en: Microsoft's MCP server that exposes Playwright browser automation to LLMs through structured accessibility snapshots
x:
  source: https://github.com/microsoft/playwright-mcp
rule:
  /npm:
    cmd: npx @playwright/mcp@latest
    reference: https://github.com/microsoft/playwright-mcp
    dsnap: "@playwright/mcp"
binlist:
- "@playwright/mcp"

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
