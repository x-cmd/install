lang: Go
homepage: https://github.com/smtg-ai/claude-squad
license: agpl-3.0
desc:
  cn: 管理多个 AI 终端 Agent，如 Claude Code、Codex、OpenCode、Amp
  en: Manage multiple AI terminal agents like Claude Code, Codex, OpenCode, and Amp.
x:
  source: https://github.com/smtg-ai/claude-squad
  eget: https://github.com/smtg-ai/claude-squad
rule:
  /eget:
    cmd: x eget smtg-ai/claude-squad
    reference: https://github.com/smtg-ai/claude-squad
binlist:
- claude-squad

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
