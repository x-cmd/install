lang: Go
homepage: https://github.com/smtg-ai/claude-squad
license: agpl-3.0
desc:
  cn: 管理多个 AI 终端 Agent，如 Claude Code、Codex、OpenCode、Amp
  en: Manage multiple AI terminal agents like Claude Code, Codex, OpenCode, and Amp.
  cs: Spravujte více terminálových AI agentů, jako jsou Claude Code, Codex, OpenCode a Amp.
  de: Verwalten Sie mehrere KI-Terminal-Agents wie Claude Code, Codex, OpenCode und Amp.
  es: Gestiona varios agentes de terminal de IA como Claude Code, Codex, OpenCode y Amp.
  fr: Gérez plusieurs agents IA en terminal comme Claude Code, Codex, OpenCode et Amp.
  id: Kelola beberapa agen terminal AI seperti Claude Code, Codex, OpenCode, dan Amp.
  it: Gestisci più agenti terminale IA come Claude Code, Codex, OpenCode e Amp.
  ja: Claude Code、Codex、OpenCode、Amp などの複数の AI ターミナルエージェントを管理します。
  ko: Claude Code, Codex, OpenCode, Amp 등 여러 AI 터미널 에이전트를 관리합니다.
  pl: Zarządzaj wieloma agentami terminalowymi AI, takimi jak Claude Code, Codex, OpenCode i Amp.
  pt: Gerencie vários agentes de terminal de IA como Claude Code, Codex, OpenCode e Amp.
  ro: Gestionați mai mulți agenți AI de terminal precum Claude Code, Codex, OpenCode și Amp.
  ru: Управляйте несколькими терминальными ИИ-агентами, такими как Claude Code, Codex, OpenCode и Amp.
  th: จัดการเอเจนต์เทอร์มินัล AI หลายตัว เช่น Claude Code, Codex, OpenCode และ Amp
  tr: Claude Code, Codex, OpenCode ve Amp gibi birden fazla AI terminal ajanını yönetin.
  uk: Керуйте кількома термінальними ІІ-агентами, такими як Claude Code, Codex, OpenCode та Amp.
  vi: Quản lý nhiều tác nhân terminal AI như Claude Code, Codex, OpenCode và Amp.
x:
  source: https://github.com/smtg-ai/claude-squad
  eget: smtg-ai/claude-squad
rule:
  /eget:
    cmd: x eget smtg-ai/claude-squad
    reference: https://github.com/smtg-ai/claude-squad
binlist:
- claude-squad

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
