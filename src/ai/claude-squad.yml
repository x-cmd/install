lang: Go
homepage: https://github.com/smtg-ai/claude-squad
license: agpl-3.0
desc:
  cn: 管理多个 AI 终端 Agent，如 Claude Code、Codex、OpenCode、Amp
  en: Manage multiple AI terminal agents like Claude Code, Codex, OpenCode, and Amp.
x:
  source: https://github.com/smtg-ai/claude-squad
  eget: https://github.com/smtg-ai/claude-squad
rule:
  /eget:
    cmd: x eget smtg-ai/claude-squad
    reference: https://github.com/smtg-ai/claude-squad
binlist:
- claude-squad

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
