lang: TypeScript
homepage: https://github.com/FlowiseAI/Flowise
license: other
desc:
  cn: 可视化构建 AI Agent
  en: Build AI Agents, Visually
x:
  source: https://github.com/FlowiseAI/Flowise
rule:
  /npm:
    cmd: npm install -g flowise
    reference: https://www.npmjs.com/package/flowise
    dsnap: 'flowise'
binlist:
- Flowise

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 554 KB
          rating: 1
          desc:
            cn: 约 554 KB（估算）
            en: ~554 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
