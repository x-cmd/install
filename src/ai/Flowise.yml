lang: TypeScript
homepage: https://github.com/FlowiseAI/Flowise
license: other
desc:
  cn: 可视化构建 AI Agent
  en: Build AI Agents, Visually
x:
  source: https://github.com/FlowiseAI/Flowise
rule:
  /npm:
    cmd: npm install -g flowise
    reference: https://www.npmjs.com/package/flowise
    dsnap: 'flowise'
binlist:
- Flowise

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
