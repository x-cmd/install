lang: Python
homepage: https://github.com/PDFMathTranslate/PDFMathTranslate
license: agpl-3.0
desc:
  cn: 保留排版的 PDF 科学论文双语翻译（EMNLP 2025 Demo），支持 Google/DeepL/Ollama/OpenAI 等，提供 CLI/GUI/MCP/Docker/Zotero
  en: '[EMNLP 2025 Demo] PDF scientific paper translation with preserved formats - 基于 AI 完整保留排版的 PDF 文档全文双语翻译，支持 Google/DeepL/Ollama/OpenAI 等服务，提供 CLI/GUI/MCP/Docker/Zotero'
x:
  source: https://github.com/PDFMathTranslate/PDFMathTranslate
  eget: https://github.com/PDFMathTranslate/PDFMathTranslate
rule:
  /eget:
    cmd: x eget PDFMathTranslate/PDFMathTranslate
    reference: https://github.com/PDFMathTranslate/PDFMathTranslate
binlist:
- PDFMathTranslate

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
