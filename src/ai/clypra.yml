lang: TypeScript
homepage: https://github.com/AIEraDev/Clypra
license: mit
desc:
  cn: Tauri + React + TypeScript 构建的开源桌面视频编辑器，提供多轨时间线、帧精确剪辑、专业音频波形、FFmpeg 后端导出与跨平台原生性能。
  en: An open-source desktop video editor built with Tauri, React and TypeScript, featuring a multi-track timeline, frame-accurate trimming, pro-grade audio waveforms, FFmpeg-backed export, and native cross-platform performance.
x:
  source: https://github.com/AIEraDev/Clypra
rule:
  darwin/brew:
    cmd: brew install AIEraDev/tap/clypra
    reference: https://github.com/AIEraDev/Clypra#installation
    dsnap: clypra
  /git:
    cmd: x git clone AIEraDev/Clypra && cd Clypra && npm install && npm run dev
    reference: https://github.com/AIEraDev/Clypra#development
binlist:
- clypra

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
