lang: Go
homepage: https://github.com/steipete/sag
license: mit
desc:
  cn: 类似 macOS say 命令，但使用现代化语音
  en: Like the macOS say command, but with a modern voice.
x:
  source: https://github.com/steipete/sag
  eget: https://github.com/steipete/sag
rule:
  /eget:
    cmd: x eget steipete/sag
    reference: https://github.com/steipete/sag
binlist:
- sag

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 482 KB
          rating: 1
          desc:
            cn: 约 482 KB（估算）
            en: ~482 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
