lang: Python
homepage: https://github.com/instavm/clickclickclick
license: mit
desc:
  cn: 借助任意 LLM（本地或远程）实现 Android 与电脑的自主操控
  en: Autonomous Android and computer use using any LLM (local or remote)
x:
  source: https://github.com/instavm/clickclickclick
  eget: https://github.com/instavm/clickclickclick
rule:
  /eget:
    cmd: x eget instavm/clickclickclick
    reference: https://github.com/instavm/clickclickclick
binlist:
- clickclickclick

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
