lang: Python
homepage: https://github.com/instavm/clickclickclick
license: mit
desc:
  cn: 借助任意 LLM（本地或远程）实现 Android 与电脑的自主操控
  en: Autonomous Android and computer use using any LLM (local or remote)
x:
  source: https://github.com/instavm/clickclickclick
  eget: https://github.com/instavm/clickclickclick
rule:
  /eget:
    cmd: x eget instavm/clickclickclick
    reference: https://github.com/instavm/clickclickclick
binlist:
- clickclickclick

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
