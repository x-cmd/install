lang: 'Python'
homepage: https://github.com/NVIDIA/triton-inference-server
license: 'BSD-3-Clause'
desc:
  cn: Triton 推理服务器，提供优化的云端和边缘推理方案
  en: 'The Triton Inference Server provides an optimized cloud and edge inferencing solution.'
x:
  source: https://github.com/NVIDIA/triton-inference-server
  eget: NVIDIA/triton-inference-server
rule:
  /eget:
    cmd: x eget NVIDIA/triton-inference-server
    reference: https://github.com/NVIDIA/triton-inference-server
binlist:
  - 'server'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
