lang: 'Python'
homepage: https://github.com/NVIDIA/triton-inference-server
license: 'BSD-3-Clause'
desc:
  cn: Triton 推理服务器，提供优化的云端和边缘推理方案
  en: 'The Triton Inference Server provides an optimized cloud and edge inferencing solution.'
x:
  source: https://github.com/NVIDIA/triton-inference-server
  eget: https://github.com/NVIDIA/triton-inference-server
rule:
  /eget:
    cmd: x eget NVIDIA/triton-inference-server
    reference: https://github.com/NVIDIA/triton-inference-server
binlist:
  - 'server'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
