lang: Python
homepage: https://github.com/huggingface/ml-intern
license: apache-2.0
desc:
  cn: Hugging Face 官方推出的 ML 智能体，能自主调研、编写并交付高质量机器学习代码，深度接入 HF 文档、论文、数据集与云端算力。
  en: Automates machine learning development by researching, writing, and shipping code using the Hugging Face ecosystem via a command-line interface.
x:
  source: https://github.com/huggingface/ml-intern
  pip: ml-intern
rule:
  /pip:
    cmd: pip install ml-intern
    reference: https://github.com/huggingface/ml-intern#installation
    dsnap: ml-intern
binlist:
- ml-intern

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 98 KB
          rating: 1
          desc:
            cn: 约 98 KB（估算）
            en: ~98 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
