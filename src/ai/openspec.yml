lang: TypeScript
homepage: https://github.com/Fission-AI/OpenSpec
license: MIT
desc:
  cn: 面向规范驱动开发（spec-driven development）的 AI 原生系统
  en: AI-native system for spec-driven development
x:
  pkg:
    exist: true
  source: https://github.com/Fission-AI/OpenSpec
rule:
  /x:
    cmd: x pkg use openspec
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g @fission-ai/openspec
    reference: https://github.com/Fission-AI/OpenSpec?tab=readme-ov-file#step-1-install-the-cli-globally
    dsnap: '@fission-ai/openspec'
  arch/yay:
    cmd: yay -S openspec
    reference: https://aur.archlinux.org/packages/openspec
binlist:
  - openspec

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
