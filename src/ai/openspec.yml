lang: TypeScript
homepage: https://github.com/Fission-AI/OpenSpec
license: MIT
desc:
  cn: 面向规范驱动开发（spec-driven development）的 AI 原生系统
  en: AI-native system for spec-driven development
  cs: AI nativní systém pro vývoj řízený specifikacemi
  de: KI-natives System für spec-getriebene Entwicklung
  es: Sistema nativo de IA para desarrollo basado en especificaciones
  fr: Système natif IA pour le développement piloté par les spécifications
  id: Sistem AI-native untuk pengembangan berbasis spesifikasi
  it: Sistema nativo IA per lo sviluppo guidato dalle specifiche
  ja: 仕様駆動開発（spec-driven development）のための AI ネイティブなシステム
  ko: 명세 중심 개발을 위한 AI 네이티브 시스템
  pl: System natywny AI do rozwoju sterowanego specyfikacją
  pt: Sistema nativo de IA para desenvolvimento orientado por especificações
  ro: Sistem nativ AI pentru dezvoltare ghidată de specificații
  ru: AI-нативная система для разработки на основе спецификаций
  th: ระบบ AI-native สำหรับการพัฒนาแบบ spec-driven
  tr: Specifikasyon odaklı geliştirme için AI-yerel sistem
  uk: AI-нативна система для розробки на основі специфікацій
  vi: Hệ thống AI-native cho phát triển theo đặc tả
x:
  source: https://github.com/Fission-AI/OpenSpec
  yay: openspec
  npm: "@fission-ai/openspec"
rule:
  /x:
    cmd: x pkg use openspec
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g @fission-ai/openspec
    reference: https://github.com/Fission-AI/OpenSpec?tab=readme-ov-file#step-1-install-the-cli-globally
    dsnap: '@fission-ai/openspec'
  arch/yay:
    cmd: yay -S openspec
    reference: https://aur.archlinux.org/packages/openspec
binlist:
  - openspec

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 164 KB
          rating: 1
          desc:
            cn: 约 164 KB（估算）
            en: ~164 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
