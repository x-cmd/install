lang: TypeScript
homepage: https://github.com/ChatGPTNextWeb/NextChat
license: mit
desc:
  cn: 轻量快速的 AI 助手，支持 Web/iOS/macOS/Android/Linux/Windows
  en: '✨ Light and Fast AI Assistant. Support: Web | iOS | MacOS | Android | Linux | Windows'
x:
  source: https://github.com/ChatGPTNextWeb/NextChat
  eget: https://github.com/ChatGPTNextWeb/NextChat
rule:
  /eget:
    cmd: x eget ChatGPTNextWeb/NextChat
    reference: https://github.com/ChatGPTNextWeb/NextChat
binlist:
- NextChat

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
