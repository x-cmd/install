x:
  source: https://github.com/ChatGPTNextWeb/NextChat
  eget: ChatGPTNextWeb/NextChat
rule:
  /eget:
    cmd: x eget ChatGPTNextWeb/NextChat
    reference: https://github.com/ChatGPTNextWeb/NextChat
binlist:
- NextChat

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 56 KB
          rating: 1
          desc:
            cn: 约 56 KB（估算）
            en: ~56 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
