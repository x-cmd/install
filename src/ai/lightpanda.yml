lang: Zig
homepage: https://github.com/lightpanda-io/browser
license: AGPL-3.0
desc:
  cn: 专为人工智能和自动化设计的无头浏览器
  en: the headless browser designed for AI and automation
  cs: headless prohlížeč navržený pro AI a automatizaci
  de: der headless Browser, entwickelt für KI und Automatisierung
  es: el navegador headless diseñado para IA y automatización
  fr: le navigateur sans interface conçu pour l'IA et l'automatisation
  id: browser headless yang dirancang untuk AI dan otomasi
  it: il browser headless progettato per IA e automazione
  ja: AIと自動化のために設計されたヘッドレスブラウザ
  ko: AI와 자동화를 위해 설계된 헤드리스 브라우저
  pl: przeglądarka bez interfejsu zaprojektowana do AI i automatyzacji
  pt: o navegador headless projetado para IA e automação
  ro: browserul headless conceput pentru AI și automatizare
  ru: headless-браузер, разработанный для ИИ и автоматизации
  th: เบราว์เซอร์แบบไม่มีส่วนติดต่อผู้ใช้ที่ออกแบบมาสำหรับ AI และระบบอัตโนมัติ
  tr: Yapay zeka ve otomasyon için tasarlanmış headless tarayıcı
  uk: headless-браузер, розроблений для ШІ та автоматизації
  vi: trình duyệt không giao diện được thiết kế cho AI và tự động hóa
x:
  source: https://github.com/lightpanda-io/browser
  eget: lightpanda-io/browser
  yay: lightpanda-bin
rule:
  /eget:
    cmd: x eget lightpanda-io/browser
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://pkg.lightpanda.io/install.sh | bash
    reference: https://lightpanda.io/docs/open-source/installation
  /docker:
    cmd: docker run -d --name lightpanda -p 9222:9222 lightpanda/browser:nightly
    reference: https://lightpanda.io/docs/open-source/installation#install-from-docker
  arch/yay:
    cmd: yay -S lightpanda-bin
    reference: https://aur.archlinux.org/packages/lightpanda-bin
binlist:
  - lightpanda

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
