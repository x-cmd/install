lang: Python
homepage: https://github.com/OpenMOSS/MOSS-TTS-Nano
license: apache-2.0
desc:
  cn: MOSI.AI 与 OpenMOSS 团队开源的 0.1B 参数多语言 TTS 模型，纯自回归（Audio Tokenizer + LLM）架构，48kHz 立体声、流式推理可在 4 核 CPU 上跑，支持 20 种语言与零样本语音克隆。
  en: MOSS-TTS-Nano is a 0.1B parameter, open-source multilingual text-to-speech model from MOSI.AI and the OpenMOSS team using a pure autoregressive (Audio Tokenizer + LLM) pipeline; 48 kHz stereo, streaming on a 4-core CPU, 20 languages and zero-shot voice cloning.
  cs: MOSS-TTS-Nano je open-source model převodu textu na řeč s 0,1B parametry a podporou více jazyků od MOSI.AI a týmu OpenMOSS, založený na čistém autoregresivním pipeline (Audio Tokenizer + LLM); 48 kHz stereo, streamování na 4jádrovém CPU, 20 jazyků a klonování hlasu bez příkladů.
  de: MOSS-TTS-Nano ist ein quelloffenes, mehrsprachiges Text-to-Speech-Modell mit 0,1B Parametern von MOSI.AI und dem OpenMOSS-Team, das eine rein autoregressive Pipeline (Audio Tokenizer + LLM) nutzt; 48 kHz Stereo, Streaming auf einer 4-Kern-CPU, 20 Sprachen und Zero-Shot-Voice-Cloning.
  es: MOSS-TTS-Nano es un modelo de voz de código abierto, multilingüe y de 0,1B de parámetros, creado por MOSI.AI y el equipo de OpenMOSS con una canalización puramente autorregresiva (Audio Tokenizer + LLM); estéreo de 48 kHz, streaming en una CPU de 4 núcleos, 20 idiomas y clonación de voz sin ejemplos.
  fr: MOSS-TTS-Nano est un modèle open source de synthèse vocale multilingue à 0,1B de paramètres, créé par MOSI.AI et l'équipe OpenMOSS avec un pipeline purement autorégressif (Audio Tokenizer + LLM) ; stéréo 48 kHz, streaming sur un CPU à 4 cœurs, 20 langues et clonage vocal zero-shot.
  id: MOSS-TTS-Nano adalah model text-to-speech multibahasa sumber terbuka dengan 0,1B parameter dari MOSI.AI dan tim OpenMOSS menggunakan pipeline autoregresif murni (Audio Tokenizer + LLM); stereo 48 kHz, streaming pada CPU 4-core, 20 bahasa, dan kloning suara zero-shot.
  it: MOSS-TTS-Nano è un modello text-to-speech open source multilingue da 0,1B di parametri di MOSI.AI e del team OpenMOSS, basato su una pipeline puramente autoregressiva (Audio Tokenizer + LLM); stereo a 48 kHz, streaming su CPU a 4 core, 20 lingue e clonazione vocale zero-shot.
  ja: MOSS-TTS-Nanoは、MOSI.AIとOpenMOSSチームが開発した0.1Bパラメータのオープンソース多言語テキスト読み上げモデルで、純粋な自己回帰（Audio Tokenizer + LLM）パイプラインを採用しています。48 kHzステレオ、4コアCPUでのストリーミング、20言語、ゼロショット音声クローンに対応します。
  ko: MOSS-TTS-Nano는 MOSI.AI와 OpenMOSS 팀이 만든 0.1B 파라미터 오픈소스 다국어 음성 합성 모델로, 순수 자기회귀(Audio Tokenizer + LLM) 파이프라인을 사용합니다. 48 kHz 스테레오, 4코어 CPU 스트리밍, 20개 언어, 제로샷 음성 복제를 지원합니다.
  pl: MOSS-TTS-Nano to otwartoźródłowy, wielojęzyczny model syntezy mowy o 0,1B parametrów od MOSI.AI i zespołu OpenMOSS, oparty na czysto autoregresyjnym potoku (Audio Tokenizer + LLM); stereo 48 kHz, strumieniowanie na 4-rdzeniowym CPU, 20 języków i klonowanie głosu bez przykładów.
  pt: O MOSS-TTS-Nano é um modelo de texto para fala multilíngue e de código aberto com 0,1B de parâmetros, criado pela MOSI.AI e a equipe OpenMOSS com um pipeline puramente autoregressivo (Audio Tokenizer + LLM); estéreo de 48 kHz, streaming em CPU de 4 núcleos, 20 idiomas e clonagem de voz sem exemplos.
  ro: MOSS-TTS-Nano este un model open source de conversie text în vorbire, multilingv, cu 0,1B parametri, creat de MOSI.AI și echipa OpenMOSS folosind un pipeline pur autoregresiv (Audio Tokenizer + LLM); stereo 48 kHz, streaming pe un CPU cu 4 nuclee, 20 de limbi și clonare vocală zero-shot.
  ru: MOSS-TTS-Nano — открытая многоязычная модель преобразования текста в речь с 0,1B параметров от MOSI.AI и команды OpenMOSS, использующая чисто авторегрессивный конвейер (Audio Tokenizer + LLM); стерео 48 кГц, потоковая обработка на 4-ядерном CPU, 20 языков и клонирование голоса без примеров.
  th: MOSS-TTS-Nano คือโมเดลแปลงข้อความเป็นเสียงแบบโอเพนซอร์สหลายภาษาขนาดพารามิเตอร์ 0.1B จาก MOSI.AI และทีม OpenMOSS ที่ใช้ไปป์ไลน์ autoregressive ล้วน (Audio Tokenizer + LLM) รองรับสเตอริโอ 48 kHz สตรีมมิ่งบน CPU 4 แกน 20 ภาษา และการโคลนเสียงแบบ zero-shot
  tr: MOSS-TTS-Nano, MOSI.AI ve OpenMOSS ekibinden saf otoregresif (Audio Tokenizer + LLM) hattı kullanan 0,1B parametreli, açık kaynaklı, çok dilli metin-sesten modelidir; 48 kHz stereo, 4 çekirdekli CPU'da akış, 20 dil ve sıfır örnekli ses klonlama.
  uk: MOSS-TTS-Nano — відкрита багатомовна модель перетворення тексту на мовлення з 0,1B параметрів від MOSI.AI та команди OpenMOSS, що використовує суто авторегресійний конвеєр (Audio Tokenizer + LLM); стерео 48 кГц, потокова обробка на 4-ядерному CPU, 20 мов та клонування голосу без прикладів.
  vi: MOSS-TTS-Nano là mô hình text-to-speech đa ngôn ngữ mã nguồn mở với 0,1B tham số do MOSI.AI và nhóm OpenMOSS tạo ra, dùng pipeline tự hồi quy hoàn toàn (Audio Tokenizer + LLM); stereo 48 kHz, truyền trực tiếp trên CPU 4 lõi, 20 ngôn ngữ và nhân bản giọng nói zero-shot.
