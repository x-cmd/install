lang: Python
homepage: https://github.com/HKUDS/ViMax
license: mit
desc:
  cn: 港大数据智能实验室（HKUDS）开源的多 Agent 视频生成框架，从创意、剧本或整本小说出发，自动完成脚本、角色、分镜、镜头与多镜头视频的全流程制作。
  en: HKUDS's open-source multi-agent video generation framework that turns ideas, scripts, or full novels into finished multi-shot videos — automating script, character, storyboard, shot, and video production end-to-end.
  cs: Open-source framework pro generování videí více agenty od laboratoře datových inteligencí HKU (HKUDS), který přeměňuje nápady, scénáře nebo celé romány na hotové víceshotové video – automatizuje tvorbu scénáře, postav, storyboardu, záběrů a videa od začátku do konce.
  de: Das quelloffene Multi-Agent-Videogenerierungs-Framework der HKU Data Intelligence Lab (HKUDS), das Ideen, Skripte oder ganze Romane in fertige Multi-Shot-Videos verwandelt – Skript, Figuren, Storyboard, Einzelshot und Videoproduktion werden durchgängig automatisiert.
  es: Marco de código abierto de generación de vídeo multiagente del Laboratorio de Inteligencia de Datos de HKU (HKUDS), que convierte ideas, guiones o novelas completas en vídeos de varios planos finalizados, automatizando de principio a fin el guion, los personajes, el storyboard, los planos y el vídeo.
  fr: Cadre open source de génération vidéo multi-agents du laboratoire d'intelligence des données de HKU (HKUDS), qui transforme des idées, des scripts ou des romans entiers en vidéos multi-plans finalisées – scénario, personnages, storyboard, plan et production vidéo sont automatisés de bout en bout.
  id: Kerangka kerja generasi video multi agen open source dari Laboratorium Kecerdasan Data HKU (HKUDS) yang mengubah ide, skrip, atau novel penuh menjadi video multi-shot selesai — Producersi skrip, karakter, storyboard, shot, dan video diotomatisasi dari ujung ke ujung.
  it: Framework open source di generazione video multi-agente del laboratorio di Data Intelligence di HKU (HKUDS), che trasforma idee, script o romanzi completi in video multi-inquadratura finiti, automatizzando sceneggiatura, personaggi, storyboard, inquadrature e produzione video dall'inizio alla fine.
  ja: HKUデータインテリジェンスラボ（HKUDS）のオープンソースのマルチエージェント動画生成フレームワーク。アイデア、脚本、長編小説，完成済みのマルチショット動画に変換し、台本、キャラクター、絵コンテ、ショット、動画制作をエンドツーエンドで自動化します。
  ko: HKU 데이터 인텔리전스 랩(HKUDS)의 오픈 소스 멀티 에이전트 비디오 생성 프레임워크로, 아이디어, 대본 또는 소설 원고 완성된 멀티샷 비디오로 전환하며 대본, 캐릭터, 스토리보드, 샷, 영상 제작을 종단 간 자동화합니다.
  pl: Otwartoźródłowy framework generowania wideo wieloagentowego z laboratorium Data Intelligence Uniwersytetu HKU (HKUDS), który zamienia pomysły, scenariusze lub całe powieści w gotowe filmy wielokadrowe – automatyzując scenariusz, postacie, storyboard, ujęcia i produkcję wideo od początku do końca.
  pt: Framework open source de geração de vídeo multiagente do Laboratório de Inteligência de Dados da HKU (HKUDS), que transforma ideias, roteiros ou romances completos em vídeos finalizados de vários planos — automatizando de ponta a ponta a produção de roteiro, personagens, storyboard, planos e vídeo.
  ro: Cadrul open source de generare video cu agenți multipli al Laboratorului de Data Intelligence al HKU (HKUDS), care transformă idei, scenarii sau romane întregi în video-uri cu planuri multiple finite – automatizând scenariul, personajele, storyboard-ul, planurile și producția video de la un cap la altul.
  ru: Открытый фреймворк мультиагентной генерации видео от лаборатории Data Intelligence Университета Гонконга (HKUDS), превращающий идеи, сценарии или целые романы в готовые многоракурсные видео — сценарий, персонажи, раскадровка, планы и видеопроизводство автоматизируются от начала до конца.
  th: เฟรมเวิร์กสร้างวิดีโอแบบหลายเอเจนต์โอเพนซอร์สจาก HKU Data Intelligence Lab (HKUDS) ที่เปลี่ยนแนวคิด บทหรือนวนิยายฉบับเต็มให้เป็นวิดีโอหลายช็อตที่เสร็จสมบูรณ์ โดยอัตโนมัติทั้งกระบวนการสร้างบท ตัวละคร สตอรีบอร์ด ช็อต และวิดีโอ
  tr: HKU Veri Zekâsı Laboratuvarı'nın (HKUDS) açık kaynaklı çoklu ajan video üretim çerçevesi; fikirleri, senaryoları veya tam romanları bitmiş çoklu planlı videolara dönüştürür — senaryo, karakter, storyboard, plan ve video üretimini uçtan uca otomatikleştirir.
  uk: Відкритий фреймворк мультиагентної генерації відео від лабораторії Data Intelligence Університету Гонконгу (HKUDS), який перетворює ідеї, сценарії або цілі романи на готові багаторанісні відео — сценарій, персонажі, розкадровка, плани та відеовиробництво автоматизуються від початку до кінця.
  vi: Khung tạo video đa tác tử mã nguồn mở của Phòng thí nghiệm Trí tuệ Dữ liệu HKU (HKUDS), biến ý tưởng, kịch bản hoặc tiểu thuyết đầy đủ thành video nhiều cảnh hoàn chỉnh — tự động hóa toàn bộ quy trình viết kịch bản, dựng nhân vật, storyboard, quay cảnh và sản xuất video.
x:
