lang: TypeScript
homepage: https://github.com/virattt/dexter
license: MIT
desc:
  cn: 自主深度金融研究代理（Claude Code 的金融研究特化版），基于 TypeScript + Bun 与实时市场数据，将复杂金融问题拆解为多步研究计划，自主选择工具、自检并迭代，最终输出带数据支撑的研究结论
  en: Autonomous agent for deep financial research — a Claude Code for finance. Written in TypeScript and run on Bun, Dexter turns complex queries into step-by-step plans, picks the right financial-data APIs (real-time income statements, cash flow, balance sheets), self-validates results, and refines until it produces a confident, data-backed answer.
  cs: Autonomní agent pro hluboký finanční výzkum — Claude Code pro finance. Napsaný v TypeScriptu a běžící na Bun, Dexter rozkládá složité dotazy na postupné plány, vybírá správná API finančních dat (výkazy zisku, cash flow, rozvahy v reálném čase), sám výsledky ověřuje a upravuje je, dokud nedospěje k sebevědomému odpovědi podložené daty.
  de: Autonomer Agent für tiefgreifende Finanzresearch – ein Claude Code für Finanzen. In TypeScript geschrieben und auf Bun ausgeführt, zerlegt Dexter komplexe Anfragen in schrittweise Pläne, wählt die passenden Finanzdaten-APIs (Gewinn- und Verlustrechnungen, Cashflow, Bilanzen in Echtzeit), validiert Ergebnisse selbst und verfeinert sie, bis eine selbstbewusste, datenbasierte Antwort entsteht.
  es: "Agente autónomo para investigación financiera profunda: un Claude Code para finanzas. Escrito en TypeScript y ejecutado en Bun, Dexter convierte consultas complejas en planes paso a paso, elige las API de datos financieros adecuadas (estados de resultados, flujo de caja y balances en tiempo real), autovalida los resultados y los refina hasta producir una respuesta segura y respaldada por datos."
  fr: Agent autonome de recherche financière approfondie — un Claude Code pour la finance. Écrit en TypeScript et exécuté sur Bun, Dexter transforme les requêtes complexes en plans étape par étape, choisit les bonnes API de données financières (comptes de résultat, flux de trésorerie, bilans en temps réel), auto-vérifie les résultats et les affine jusqu'à produire une réponse fiable et fondée sur les données.
  id: Agen otonom untuk riset keuangan mendalam — Claude Code untuk keuangan. Ditulis dengan TypeScript dan berjalan di Bun, Dexter mengubah kueri rumit menjadi rencana bertahap, memilih API data keuangan yang tepat (laba rugi, arus kas, neraca secara real-time), memvalidasi hasilnya sendiri, dan menyempurnakannya hingga menghasilkan jawaban yang yakin dan didukung data.
  it: Agente autonomo per ricerca finanziaria approfondita — un Claude Code per la finanza. Scritto in TypeScript ed eseguito su Bun, Dexter trasforma query complessi in piani passo dopo passo, sceglie le API finanziarie più appropriate (conti economici, flussi di cassa, bilanci in tempo reale), autovalida i risultati e li affina fino a produrre una risposta sicura e supportata dai dati.
  ja: 深い金融リサーチのための自律型エージェント — 金融向けの Claude Code です。TypeScript で書かれ Bun で動作する Dexter は、複雑な問いを手順立てた計画に分解し、適切な金融データ API（リアルタイムの損益計算書、キャッシュフロー、貸借対照表）を選び、結果を自己検証して|dataが裏付けられた確信ある回答が出るまで磨き込みます。
  ko: 심층 금융 리서치를 위한 자율형 에이전트 — 금융을 위한 Claude Code입니다. TypeScript로 작성되고 Bun에서 실행되는 Dexter는 복잡한 질문을 단계별 계획으로 나누고, 적합한 금융 데이터 API(실시간 손익계산서, 현금흐름, 재무상태표)를 선택하며, 결과를 자체 검증해 데이터에 근거한 확신 있는 답을 낼 때까지 다듬습니다.
  pl: Autonomiczny agent do pogłębionych badań finansowych — Claude Code dla finansów. Napisany w TypeScript i uruchamiany na Bun, Dexter rozbija złożone zapytania na krok po kroku plany, wybiera właściwe API danych finansowych (real-time rachunki wyników, przepływy gotówki, bilanse), sam weryfikuje wyniki i dopracowuje je, aż powstanie pewna, oparta na danych odpowiedź.
  pt: Agente autônomo para pesquisa financeira aprofundada — um Claude Code para finanças. Escrito em TypeScript e executado no Bun, o Dexter transforma consultas complexas em planos passo a passo, escolhe as APIs de dados financeiros certas (demonstrações de resultado, fluxo de caixa, balanços em tempo real), autovalida os resultados e os refina até produzir uma resposta confiante e respaldada por dados.
  ro: Agent autonom pentru cercetare financiară aprofundată — un Claude Code pentru finanțe. Scris în TypeScript și rulat pe Bun, Dexter transformă interogările complexe în planuri pas cu pas, alege API-urile potrivite pentru date financiare (conturi de profit și pierdere, flux de numerar, bilanțuri în timp real), își validează singur rezultatele și le rafinează până produce un răspuns încrezător, susținut de date.
  ru: "Автономный агент для глубоких финансовых исследований — Claude Code для финансов. Написан на TypeScript и работает на Bun: Dexter разбивает сложные запросы на пошаговые планы, выбирает подходящие финансовые API (отчёты о прибылях, денежные потоки, балансы в реальном времени), сам проверяет результаты и дорабатывает их, пока не выдаст уверенный ответ, подкреплённый данными."
  th: เอเจนต์อัตโนมัติสำหรับการวิจัยการเงินเชิงลึก — Claude Code สำหรับการเงิน เขียนด้วย TypeScript และทำงานบน Bun Dexter จะแตกคำถามที่ซับซ้อนเป็นแผนทีละขั้น เลือก API ข้อมูลการเงินที่เหมาะสม (งบกำไรขาดทุน กระแสเงินสด และงบแสดงฐานะการเงินแบบเรียลไทม์) ตรวจสอบผลลัพธ์ด้วยตนเอง และปรับปรุงจนได้คำตอบที่มั่นใจและมีข้อมูลรองรับ
  tr: Derinlemesine finansal araştırma için otonom ajan — finans için bir Claude Code. TypeScript ile yazılmış ve Bun üzerinde çalışan Dexter, karmaşık sorguları adım adım planlara dönüştürür, doğru finansal veri API'lerini seçer (gerçek zamanlı gelir tabloları, nakit akışı, bilançolar), sonuçları kendisi doğrular ve veriye dayalı güvenilir bir yanıt üretene kadar iyileştirir.
  uk: "Автономний агент для глибоких фінансових досліджень — Claude Code для фінансів. Написаний на TypeScript і працює на Bun: Dexter розбиває складні запити на покрокові плани, обирає потрібні фінансові API (звіти про прибутки, грошові потоки, баланси в реальному часі), сам перевіряє результати та вдосконалює їх, доки не отримає впевнену відповідь, підкріплену даними."
  vi: Agent tự động cho nghiên cứu tài chính chuyên sâu — một Claude Code cho tài chính. Được viết bằng TypeScript và chạy trên Bun, Dexter biến các truy vấn phức tạp thành kế hoạch từng bước, chọn đúng API dữ liệu tài chính (báo cáo lãi lỗ, lưu chuyển tiền tệ, bảng cân đối theo thời gian thực), tự kiểm chứng kết quả và tinh chỉnh cho đến khi tạo ra câu trả lời chắc chắn, có dữ liệu hỗ trợ.
x:
  source: https://github.com/virattt/dexter
rule:
  /git:
    cmd: |
      git clone https://github.com/virattt/dexter.git \
      && cd dexter \
      && bun install \
      && cp env.example .env
    reference: https://github.com/virattt/dexter#%F0%9F%92%BB-how-to-install
binlist:
  - dexter-ts

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 35 KB
          rating: 1
          desc:
            cn: 约 35 KB（估算）
            en: ~35 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible