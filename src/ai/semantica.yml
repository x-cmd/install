lang: Python
homepage: https://github.com/semantica-agi/semantica
license: mit
desc:
  cn: 为 AI Agent 系统添加可审计的知识图谱和决策智能层，提升治理、推理和可解释性
  en: Adds an auditable knowledge graph and decision intelligence layer to AI agent systems for improved governance, reasoning, and explainability.
x:
  source: https://github.com/semantica-agi/semantica
rule:
  /pip:
    cmd: pip install -U semantica
    reference: https://github.com/semantica-agi/semantica#quick-start
    dsnap: semantica
  /git:
    cmd: x git clone semantica-agi/semantica
    reference: https://github.com/semantica-agi/semantica
binlist:
- semantica
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
