lang: TypeScript
homepage: https://github.com/Zackriya-Solutions/meetily
license: MIT
desc:
  cn: 以隐私为先的本地 AI 会议助手，基于 Rust 构建，集成 4x 更快的 Parakeet/Whisper 实时转写、说话人分离与 Ollama 本地摘要，macOS / Windows 一键安装，数据全程不离本机
  en: Privacy-first AI meeting assistant built with Rust. Local-only processing with 4x faster Parakeet/Whisper live transcription, speaker diarization, and Ollama summarization. One-click installer for macOS and Windows; Linux builds from source. No cloud required.
  cs: Asistent schůzek AI s ochranou soukromí postavený na Rustu. Zcela lokální zpracování s 4x rychlejším živým přepisem Parakeet/Whisper, diarizací mluvčích a shrnováním pomocí Ollama. Instalační program jedním kliknutím pro macOS a Windows; sestavení pro Linux ze zdrojů. Bez cloudu.
  de: Datenschutzorientierter KI-Meetingsassistent auf Basis von Rust. Komplett lokale Verarbeitung mit 4x schnellerer Live-Transkription durch Parakeet/Whisper, Sprecherdiarisierung und Ollama-Zusammenfassung. Ein-Klick-Installer für macOS und Windows; Linux-Builds aus dem Quellcode. Keine Cloud erforderlich.
  es: Asistente de reuniones con IA centrado en la privacidad, construido en Rust. Procesamiento totalmente local con transcripción en vivo 4 veces más rápida con Parakeet/Whisper, diarización de hablantes y resumen con Ollama. Instalador de un clic para macOS y Windows; compilaciones de Linux desde el código fuente. No requiere nube.
  fr: Assistant de réunion IA axé sur la confidentialité, écrit en Rust. Traitement entièrement local avec transcription en direct 4x plus rapide via Parakeet/Whisper, diarisation des locuteurs et résumé par Ollama. Installateur en un clic pour macOS et Windows ; compilation Linux depuis les sources. Aucun cloud requis.
  id: Asisten rapat AI yang mengutamakan privasi, dibangun dengan Rust. Pemrosesan sepenuhnya lokal dengan transkripsi langsung 4x lebih cepat melalui Parakeet/Whisper, pemisahan pembicara, dan ringkasan Ollama. Penginstal sekali klik untuk macOS dan Windows; build Linux dari sumber. Tidak memerlukan cloud.
  it: Assistente per riunioni basato su IA e orientato alla privacy, costruito con Rust. Elaborazione interamente locale con trascrizione live 4x più veloce tramite Parakeet/Whisper, diarizzazione dei relatori e riepilogo con Ollama. Installer con un clic per macOS e Windows; build Linux dal sorgente. Nessun cloud richiesto.
  ja: プライバシーを最優先した Rust 製の AI ミーティングアシスタントです。4 倍高速な Parakeet/Whisper によるリアルタイム文字起こし、話者分離、Ollama による要約をすべてローカルで処理します。macOS と Windows 向けワンクリックインストーラー、Linux はソースからビルド。クラウドは不要です。
  ko: Rust로 만든 개인정보 우선 AI 회의 어시스턴트입니다. Parakeet/Whisper 실시간 속기 4배 가속, 화자 분리, Ollama 요약을 모두 로컬에서 처리합니다. macOS와 Windows용 원클릭 인스톨러를 제공하며 Linux는 소스에서 빌드합니다. 클라우드가 필요 없습니다.
  pl: Asystent spotkań AI stawiający na prywatność, zbudowany w Rust. W pełni lokalne przetwarzanie z 4x szybszą transkrypcją na żywo Parakeet/Whisper, diarizacją mówców i podsumowaniem przez Ollama. Instalator jednym kliknięciem dla macOS i Windows; kompilacje Linuksa ze źródeł. Bez chmury.
  pt: Assistente de reuniões com IA que prioriza a privacidade, construído em Rust. Processamento totalmente local com transcrição ao vivo 4x mais rápida via Parakeet/Whisper, diarização de falantes e resumo com Ollama. Instalador de um clique para macOS e Windows; builds de Linux a partir do código-fonte. Sem nuvem.
  ro: Asistent de întâlniri cu AI orientat spre confidențialitate, construit în Rust. Procesare complet locală cu transcriere live de 4 ori mai rapidă prin Parakeet/Whisper, diarizarea vorbitorilor și rezumare cu Ollama. Installer cu un singur clic pentru macOS și Windows; build-uri Linux din sursă. Nu este necesar niciun cloud.
  ru: Асистент встреч на базе ИИ с приоритетом приватности, написанный на Rust. Полностью локальная обработка с расшифровкой в реальном времени в 4 раза быстрее на базе Parakeet/Whisper, разделением говорящих и суммаризацией через Ollama. Установщик в один клик для macOS и Windows; сборки Linux из исходников. Облако не требуется.
  th: ผู้ช่วยประชุม AI ที่ให้ความสำคัญกับความเป็นส่วนตัว พัฒนาด้วย Rust ประมวลผลทั้งหมดในเครื่อง พร้อมการถอดเสียงสดเร็วกว่า 4 เท่าด้วย Parakeet/Whisper การแยกผู้พูด และการสรุปด้วย Ollama ตัวติดตั้งคลิกเดียวสำหรับ macOS และ Windows ส่วน Linux ต้อง build จากซอร์ส ไม่ต้องใช้คลาวด์
  tr: Rust ile geliştirilmiş, gizliliği önceliklendiren AI toplantı asistanı. Parakeet/Whisper ile 4 kat daha hızlı canlı transkripsiyon, konuşmacı ayrımı ve Ollama özetleme ile tamamen yerel işleme. macOS ve Windows için tek tıkla kurulum; Linux sürümleri kaynaktan derlenir. Bulut gerektirmez.
  uk: Асистент зустрічей на базі ШІ з акцентом на приватність, написаний на Rust. Повністю локальна обробка з розшифруванням у реальному часі у 4 рази швидше на базі Parakeet/Whisper, розділенням мовців і підсумовуванням через Ollama. Установник в один клік для macOS і Windows; збірки Linux із вихідного коду. Хмара не потрібна.
  vi: Trợ lý họp AI ưu tiên quyền riêng tư, xây dựng bằng Rust. Xử lý hoàn toàn cục bộ với chép chú l trực tiếp nhanh gấp 4 lần qua Parakeet/Whisper, phân tách người nói và tóm tắt bằng Ollama. Trình cài đặt một chạm cho macOS và Windows; bản Linux build từ mã nguồn. Không cần cloud.
x:
  source: https://github.com/Zackriya-Solutions/meetily
rule:
  /git:
    cmd: |
      git clone https://github.com/Zackriya-Solutions/meeting-minutes
      cd meeting-minutes/frontend
      pnpm install
      ./build-gpu.sh
    reference: https://github.com/Zackriya-Solutions/meetily#installation

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取本地音频与配置文件
          en: Reads local audio and config files
        sensitive: []
      write:
        desc:
          cn: 写入本地会议转写与摘要
          en: Writes local meeting transcripts and summaries
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 48 MB
          rating: 2
          desc:
            cn: 安装 48 MB
            en: 48 MB install
        download:
          estimate: 48 MB
          desc:
            cn: 约 48 MB 下载 (macos/arm64)
            en: ~48 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 高（实时转写时）
          en: High (during live transcription)
  platform:
    win: full
    linux: none
    darwin: full
