lang: Python
homepage: https://github.com/google/agents-cli
license: apache-2.0
desc:
  cn: 将任意编码助手变为在 Google Cloud 上创建、评估与部署 AI Agent 专家的 CLI 与技能集
  en: The CLI and skills that turn any coding assistant into an expert at creating, evaluating, and deploying AI agents on Google Cloud.
x:
  source: https://github.com/google/agents-cli
  eget: https://github.com/google/agents-cli
rule:
  /eget:
    cmd: x eget google/agents-cli
    reference: https://github.com/google/agents-cli
binlist:
- agents-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (whl)
            en: ~1 MB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
