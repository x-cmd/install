lang: JavaScript
homepage: https://github.com/santinic/how2
license: MIT
desc:
  en: Use an external AI server to find the best unix command line suggestions
  cn: 使用外部 AI 服务器来查找最佳的 unix 命令行建议
  cs: Použije externí AI server k nalezení nejlepších návrhů unixových příkazů
  de: Verwendet einen externen KI-Server, um die besten Vorschläge für Unix-Befehlszeilen zu finden
  es: Usa un servidor de IA externo para encontrar las mejores sugerencias de línea de comandos de unix
  fr: Utilise un serveur IA externe pour trouver les meilleures suggestions de lignes de commande unix
  id: Gunakan server AI eksternal untuk menemukan saran baris perintah unix terbaik
  it: Utilizza un server IA esterno per trovare i migliori suggerimenti per la riga di comando unix
  ja: 外部 AI サーバーを利用して最適な unix コマンドライン候補を見つけます
  ko: 외부 AI 서버를 사용해 가장 좋은 unix 명령줄 제안을 찾습니다
  pl: Korzysta z zewnętrznego serwera AI, aby znaleźć najlepsze podpowiedzi dla wiersza poleceń unix
  pt: Usa um servidor de IA externo para encontrar as melhores sugestões de linha de comando unix
  ro: Folosește un server AI extern pentru a găsi cele mai bune sugestii de linie de comandă unix
  ru: Использует внешний ИИ-сервер для подбора лучших подсказок по командной строке unix
  th: ใช้เซิร์ฟเวอร์ AI ภายนอกเพื่อค้นหาคำแนะนำคำสั่ง unix ที่ดีที่สุด
  tr: En iyi unix komut satırı önerilerini bulmak için harici bir AI sunucusu kullanır
  uk: Використовує зовнішній ІІ-сервер, щоб знайти найкращі підказки для командного рядка unix
  vi: Dùng máy chủ AI bên ngoài để tìm các gợi ý dòng lệnh unix tốt nhất
x:
  source: https://github.com/santinic/how2
  eget: santinic/how2
  brew: how2terminal/how2/how2
  yay: how2
  npm: how2
rule:
  /x:
    cmd: x pkg use how2
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget santinic/how2
    reference: https://x-cmd.com/mod/eget
  debian/wget:
    cmd: wget how2terminal.com/how2.deb && sudo dpkg -i how2.deb
    reference: https://github.com/santinic/how2?tab=readme-ov-file#ubuntudebian
  ubuntu/wget:
    cmd: wget how2terminal.com/how2.deb && sudo dpkg -i how2.deb
    reference: https://github.com/santinic/how2?tab=readme-ov-file#ubuntudebian
  darwin/brew:
    cmd: brew tap how2terminal/how2 && brew install how2
    reference: https://github.com/santinic/how2?tab=readme-ov-file#macosx-via-howbrew
  /npm:
    cmd: sudo npm install -g how2
    reference: https://github.com/santinic/how2?tab=readme-ov-file#with-npm
    dsnap: how2
  arch/yay:
    cmd: yay -S how2
    reference: https://aur.archlinux.org/packages/how2
binlist:
- how2

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 MB
          rating: 2
          desc:
            cn: 安装 17 MB
            en: 17 MB install
        download:
          estimate: 17 MB
          desc:
            cn: 约 17 MB 下载 (linux/x64)
            en: ~17 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
