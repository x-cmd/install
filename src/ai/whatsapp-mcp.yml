lang: Go
homepage: https://github.com/lharries/whatsapp-mcp
license: mit
desc:
  cn: WhatsApp 的 MCP 服务器
  en: WhatsApp MCP server
x:
  source: https://github.com/lharries/whatsapp-mcp
  eget: https://github.com/lharries/whatsapp-mcp
rule:
  /eget:
    cmd: x eget lharries/whatsapp-mcp
    reference: https://github.com/lharries/whatsapp-mcp
binlist:
- whatsapp-mcp

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
