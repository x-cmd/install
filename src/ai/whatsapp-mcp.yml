lang: Go
homepage: https://github.com/lharries/whatsapp-mcp
license: mit
desc:
  cn: WhatsApp 的 MCP 服务器
  en: WhatsApp MCP server
x:
  source: https://github.com/lharries/whatsapp-mcp
  eget: lharries/whatsapp-mcp
rule:
  /eget:
    cmd: x eget lharries/whatsapp-mcp
    reference: https://github.com/lharries/whatsapp-mcp
binlist:
- whatsapp-mcp

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 186 KB
          rating: 1
          desc:
            cn: 约 186 KB（估算）
            en: ~186 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
