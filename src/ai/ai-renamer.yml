lang: JavaScript
homepage: https://github.com/ozgrozer/ai-renamer
license: gpl-3.0
desc:
  cn: 基于 Node.js 的 CLI，使用 Ollama 与 LM Studio 模型（Llava、Gemma、Llama 等）按内容智能重命名文件
  en: A Node.js CLI that uses Ollama and LM Studio models (Llava, Gemma, Llama etc.) to intelligently rename files by their contents
x:
  source: https://github.com/ozgrozer/ai-renamer
  eget: https://github.com/ozgrozer/ai-renamer
rule:
  /eget:
    cmd: x eget ozgrozer/ai-renamer
    reference: https://github.com/ozgrozer/ai-renamer
binlist:
- ai-renamer

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
