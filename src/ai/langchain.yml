lang: Python
homepage: https://github.com/langchain-ai/langchain
license: mit
desc:
  cn: 智能体工程平台
  en: The agent engineering platform.
x:
  source: https://github.com/langchain-ai/langchain
  eget: https://github.com/langchain-ai/langchain
rule:
  /eget:
    cmd: x eget langchain-ai/langchain
    reference: https://github.com/langchain-ai/langchain
binlist:
- langchain

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 686 KB
          rating: 1
          desc:
            cn: 约 686 KB（估算）
            en: ~686 KB estimated
        download:
          estimate: 558 KB
          desc:
            cn: 约 558 KB 下载 (whl)
            en: ~558 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
