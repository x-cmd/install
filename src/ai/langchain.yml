lang: Python
homepage: https://github.com/langchain-ai/langchain
license: mit
desc:
  cn: 智能体工程平台
  en: The agent engineering platform.
x:
  source: https://github.com/langchain-ai/langchain
  eget: https://github.com/langchain-ai/langchain
rule:
  /eget:
    cmd: x eget langchain-ai/langchain
    reference: https://github.com/langchain-ai/langchain
binlist:
- langchain

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
