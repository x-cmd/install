lang: TypeScript
homepage: https://github.com/github/copilot-cli
license: GitHub Copilot CLI License
desc:
  cn: GitHub Copilot CLI 将 Copilot 编码代理的功能直接带到您的终端
  en: GitHub Copilot CLI brings the power of Copilot coding agent directly to your terminal.
  cs: GitHub Copilot CLI přináší sílu kódujícího agenta Copilot přímo do vašeho terminálu.
  de: Die GitHub Copilot CLI bringt die Leistung des Copilot Coding Agent direkt in Ihr Terminal.
  es: GitHub Copilot CLI lleva la potencia del agente de codificación Copilot directamente a tu terminal.
  fr: GitHub Copilot CLI apporte la puissance de l'agent de code Copilot directement dans votre terminal.
  id: GitHub Copilot CLI menghadirkan kekuatan agen coding Copilot langsung ke terminal Anda.
  it: GitHub Copilot CLI porta la potenza dell'agente di codifica Copilot direttamente nel tuo terminale.
  ja: GitHub Copilot CLI は Copilot コーディングエージェントの力を直接ターミナルにもたらします。
  ko: GitHub Copilot CLI는 Copilot 코딩 에이전트의 힘을 터미널로 직접 가져옵니다.
  pl: GitHub Copilot CLI przenosi moc agenta programistycznego Copilot bezpośrednio do Twojego terminala.
  pt: O GitHub Copilot CLI traz o poder do agente de codificação Copilot direto para o seu terminal.
  ro: GitHub Copilot CLI aduce puterea agentului de cod Copilot direct în terminalul dumneavoastră.
  ru: GitHub Copilot CLI переносит возможности агента Copilot прямо в ваш терминал.
  th: GitHub Copilot CLI นำความสามารถของเอเจนต์เขียนโค้ด Copilot มาไว้ในเทอร์มินัลของคุณโดยตรง
  tr: GitHub Copilot CLI, Copilot kodlama ajanının gücünü doğrudan terminalinize getirir.
  uk: GitHub Copilot CLI переносить можливості агента Copilot просто у ваш термінал.
  vi: GitHub Copilot CLI mang sức mạnh của tác nhân lập trình Copilot thẳng vào terminal của bạn.
x:
  source: https://github.com/github/copilot-cli
  eget: github/copilot-cli
  brew: copilot-cli
  winget: GitHub.Copilot
  npm: "@github/copilot"
rule:
  /x:
    cmd: x pkg use copilot
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget github/copilot-cli
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install -g @github/copilot
    reference: https://github.com/github/copilot-cli?tab=readme-ov-file#installation
    dsnap: '@github/copilot'
  (win|wsl2)/winget:
    cmd: winget install GitHub.Copilot
    reference: https://github.com/github/copilot-cli?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install copilot-cli
    reference: https://github.com/github/copilot-cli?tab=readme-ov-file#installation
  /curl:
    cmd: curl -fsSL https://gh.io/copilot-install | bash
    reference: https://github.com/github/copilot-cli?tab=readme-ov-file#installation
  /wget:
    cmd: wget -qO- https://gh.io/copilot-install | bash
    reference: https://github.com/github/copilot-cli?tab=readme-ov-file#installation
binlist:
  - copilot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
