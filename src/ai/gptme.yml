lang: Python
homepage: https://github.com/gptme/gptme
license: mit
desc:
  cn: 终端中的智能体，配备本地工具：写代码、用终端、浏览网页，可构建持久自主智能体
  en: 'Your agent in your terminal, equipped with local tools: writes code, uses the terminal, browses the web. Make your own persistent autonomous agent on top!'
x:
  source: https://github.com/gptme/gptme
  eget: https://github.com/gptme/gptme
rule:
  /eget:
    cmd: x eget gptme/gptme
    reference: https://github.com/gptme/gptme
binlist:
- gptme

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
