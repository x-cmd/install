lang: Go
homepage: https://github.com/ollama/ollama
license: MIT
desc:
  cn: 启动并运行 Llama 2、 Mistral 和其他大型语言模型
  en: Get up and running with Llama 2, Mistral, and other large language models
  cs: Spusťte a začněte používat Llama 2, Mistral a další velké jazykové modely
  de: Mit Llama 2, Mistral und anderen großen Sprachmodellen schnell starten
  es: Ponte en marcha con Llama 2, Mistral y otros grandes modelos de lenguaje
  fr: Démarrez avec Llama 2, Mistral et d'autres grands modèles de langage
  id: Mulai gunakan Llama 2, Mistral, dan model bahasa besar lainnya
  it: Metti in funzione Llama 2, Mistral e altri grandi modelli linguistici
  ja: Llama 2、Mistral などの大規模言語モデルをすぐに使い始める
  ko: Llama 2, Mistral 및 다른 대규모 언어 모델을 빠르게 시작하세요
  pl: Szybko zacznij korzystać z Llama 2, Mistral i innych dużych modeli językowych
  pt: Comece a usar o Llama 2, o Mistral e outros grandes modelos de linguagem
  ro: Puneți în funcțiune Llama 2, Mistral și alte modele mari de limbaj
  ru: Быстро начните работу с Llama 2, Mistral и другими большими языковыми моделями
  th: เริ่มใช้งาน Llama 2, Mistral และโมเดลภาษาขนาดใหญ่อื่น ๆ ได้อย่างรวดเร็ว
  tr: Llama 2, Mistral ve diğer büyük dil modelleriyle hızla çalışmaya başlayın
  uk: Швидко почніть роботу з Llama 2, Mistral та іншими великими мовними моделями
  vi: Nhanh chóng bắt đầu với Llama 2, Mistral và các mô hình ngôn ngữ lớn khác
x:
  source: https://github.com/ollama/ollama
  eget: ollama/ollama
  brew: ollama
  yay: ollama-bin
rule:
  /eget:
    cmd: x eget ollama/ollama
    reference: https://x-cmd.com/mod/eget
  darwin/:
    cmd: x ollama install
    reference: https://ollama.com/download
  linux/:
    cmd: x ollama install
    reference: https://ollama.com/download
  linux/curl:
    cmd: curl -fsSL https://ollama.com/install.sh | sh
    reference: https://github.com/ollama/ollama?tab=readme-ov-file#linux
  darwin/brew:
    cmd: brew install ollama
    reference: https://formulae.brew.sh/formula/ollama#default
  arch/yay:
    cmd: yay -S ollama-bin
    reference: https://aur.archlinux.org/packages/ollama-bin

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 GB
          rating: 5
          desc:
            cn: 安装 1 GB
            en: 1 GB install
        download:
          estimate: 1 GB
          desc:
            cn: 约 1 GB 下载 (linux/x64)
            en: ~1 GB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
