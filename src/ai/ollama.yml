lang: Go
homepage: https://github.com/ollama/ollama
license: MIT
desc:
  cn: 启动并运行 Llama 2、 Mistral 和其他大型语言模型
  en: Get up and running with Llama 2, Mistral, and other large language models
x:
  source: https://github.com/ollama/ollama
  eget: https://github.com/ollama/ollama
rule:
  /eget:
    cmd: x eget ollama/ollama
    reference: https://x-cmd.com/mod/eget
  darwin/:
    cmd: x ollama install
    reference: https://ollama.com/download
  linux/:
    cmd: x ollama install
    reference: https://ollama.com/download
  linux/curl:
    cmd: curl -fsSL https://ollama.com/install.sh | sh
    reference: https://github.com/ollama/ollama?tab=readme-ov-file#linux
  darwin/brew:
    cmd: brew install ollama
    reference: https://formulae.brew.sh/formula/ollama#default
  arch/yay:
    cmd: yay -S ollama-bin
    reference: https://aur.archlinux.org/packages/ollama-bin

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 GB
          rating: 5
          desc:
            cn: 安装 1 GB
            en: 1 GB install
        download:
          estimate: 1 GB
          desc:
            cn: 约 1 GB 下载 (linux/x64)
            en: ~1 GB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
