lang: C++
homepage: https://github.com/orailnoor/cross-platform-llm-client
license: mit
desc:
  cn: 统一跨平台 AI 客户端，支持在标准云 API 与设备端离线运行自定义、无审查语言模型间无缝切换
  en: A unified cross-platform AI client supporting seamless transitions between standard cloud APIs and on-device, offline execution of custom and uncensored language models.
x:
  source: https://github.com/orailnoor/cross-platform-llm-client
  eget: https://github.com/orailnoor/cross-platform-llm-client
rule:
  /eget:
    cmd: x eget orailnoor/cross-platform-llm-client
    reference: https://github.com/orailnoor/cross-platform-llm-client
binlist:
- cross-platform-llm-client

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 42 MB
          rating: 2
          desc:
            cn: 约 42 MB（估算）
            en: ~42 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
