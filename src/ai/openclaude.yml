lang: TypeScript
homepage: https://github.com/Gitlawb/openclaude
license: other
desc:
  cn: 随处运行，调用任意模型
  en: runs anywhere. uses anything
  cs: běží kdekoli. používá cokoli
  de: läuft überall. nutzt alles
  es: se ejecuta en cualquier lugar. usa cualquier cosa
  fr: fonctionne partout. utilise tout
  id: berjalan di mana saja. menggunakan apa saja
  it: funziona ovunque. usa qualsiasi cosa
  ja: どこでも動く。何でも使える
  ko: 어디서나 실행되고, 무엇이든 사용
  pl: działa wszędzie. używa wszystkiego
  pt: roda em qualquer lugar. usa qualquer coisa
  ro: rulează oriunde. folosește orice
  ru: работает где угодно. использует что угодно
  th: ทำงานได้ทุกที่ ใช้ได้ทุกอย่าง
  tr: her yerde çalışır. her şeyi kullanır
  uk: працює скрізь. використовує будь-що
  vi: chạy ở mọi nơi. dùng mọi thứ
x:
  source: https://github.com/Gitlawb/openclaude
  eget: Gitlawb/openclaude
rule:
  /eget:
    cmd: x eget Gitlawb/openclaude
    reference: https://github.com/Gitlawb/openclaude
binlist:
- openclaude

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.2 MB
          rating: 1
          desc:
            cn: 约 1.2 MB（估算）
            en: ~1.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
