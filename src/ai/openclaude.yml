lang: TypeScript
homepage: https://github.com/Gitlawb/openclaude
license: other
desc:
  cn: 随处运行，调用任意模型
  en: runs anywhere. uses anything
x:
  source: https://github.com/Gitlawb/openclaude
  eget: https://github.com/Gitlawb/openclaude
rule:
  /eget:
    cmd: x eget Gitlawb/openclaude
    reference: https://github.com/Gitlawb/openclaude
binlist:
- openclaude

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
