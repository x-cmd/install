lang: TypeScript
homepage: https://github.com/philschmid/mcp-cli
license: MIT
desc:
  cn: 一个轻量级的、基于 Bun 的 CLI，用于与 MCP（模型上下文协议） 服务器交互
  en: A lightweight, Bun-based CLI for interacting with MCP (Model Context Protocol) servers.
x:
  pkg:
    exist: true
  source: https://github.com/philschmid/mcp-cli
  eget: https://github.com/philschmid/mcp-cli
rule:
  /x:
    cmd: x pkg use mcp-cli
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget philschmid/mcp-cli
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/philschmid/mcp-cli/main/install.sh | bash
    reference: https://github.com/philschmid/mcp-cli?tab=readme-ov-file#quick-start
  /bun:
    cmd: bun install -g https://github.com/philschmid/mcp-cli
    reference: https://github.com/philschmid/mcp-cli?tab=readme-ov-file#quick-start
  arch/yay:
    cmd: yay -S mcp-cli-git
    reference: https://aur.archlinux.org/packages/mcp-cli-git
binlist:
- mcp-cli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 96 MB
          rating: 3
          desc:
            cn: 安装 96 MB
            en: 96 MB install
        download:
          estimate: 96 MB
          desc:
            cn: 约 96 MB 下载 (linux/x64)
            en: ~96 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
