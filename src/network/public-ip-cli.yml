lang: JavaScript
homepage: https://github.com/sindresorhus/public-ip-cli#readme
license: MIT
desc:
  cn: 获取您的公共 IP 地址
  en: Get your public IP address
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/public-ip-cli#readme
rule:
  /x:
    cmd: x pkg use public-ip-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global public-ip-cli
    reference: https://github.com/sindresorhus/public-ip-cli?tab=readme-ov-file#install
    dsnap: public-ip-cli
binlist:
- public-ip-cli
