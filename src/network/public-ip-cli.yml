lang: JavaScript
homepage: https://github.com/sindresorhus/public-ip-cli#readme
license: MIT
desc:
  cn: 获取您的公共 IP 地址
  en: Get your public IP address
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/public-ip-cli#readme
rule:
  /x:
    cmd: x pkg use public-ip-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global public-ip-cli
    reference: https://github.com/sindresorhus/public-ip-cli?tab=readme-ov-file#install
    dsnap: public-ip-cli
binlist:
- public-ip-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
