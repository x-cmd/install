lang: JavaScript
homepage: https://github.com/sindresorhus/public-ip-cli#readme
license: MIT
desc:
  cn: 获取您的公共 IP 地址
  en: Get your public IP address
  cs: Získejte svou veřejnou IP adresu
  de: Ermitteln Sie Ihre öffentliche IP-Adresse
  es: Obtén tu dirección IP pública
  fr: Obtenez votre adresse IP publique
  id: Dapatkan alamat IP publik Anda
  it: Ottieni il tuo indirizzo IP pubblico
  ja: 公開 IP アドレスを取得する
  ko: 공개 IP 주소 가져오기
  pl: Pobierz swój publiczny adres IP
  pt: Obtenha o seu endereço IP público
  ro: Obține adresa ta IP publică
  ru: Получить ваш публичный IP-адрес
  th: รับที่อยู่ IP สาธารณะของคุณ
  tr: Genel IP adresinizi alın
  uk: Отримати свою публічну IP-адресу
  vi: Lấy địa chỉ IP công khai của bạn
x:
  source: https://github.com/sindresorhus/public-ip-cli#readme
rule:
  /x:
    cmd: x pkg use public-ip-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global public-ip-cli
    reference: https://github.com/sindresorhus/public-ip-cli?tab=readme-ov-file#install
    dsnap: public-ip-cli
binlist:
- public-ip-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
