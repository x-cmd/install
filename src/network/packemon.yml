lang: 'Go'
homepage: 'https://github.com/ddddddO/packemon'
license: 'BSD-2-Clause'
desc:
  cn: 任意网络接口收发数据包的 TUI 工具，支持 Windows/macOS/Linux
  en: 'Packet monster (っ‘-’)╮=͟͟͞͞◒ ヽ( ''-''ヽ) TUI tool for sending packets of arbitrary input and monitoring packets on any network interfaces (default: eth0). Windows/macOS/Linux'
x:
  source: https://github.com/ddddddO/packemon
  eget: https://github.com/ddddddO/packemon
rule:
  /eget:
    cmd: x eget ddddddO/packemon
    reference: https://github.com/ddddddO/packemon
binlist:
- 'packemon'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
