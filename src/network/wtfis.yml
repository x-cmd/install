lang: Python
homepage: https://github.com/pirxthepilot/wtfis
license: MIT
desc:
  cn: 适用于非机器人的被动主机名、域名和 IP 查找工具
  en: Passive hostname, domain and IP lookup tool for non-robots
x:
  source: https://github.com/pirxthepilot/wtfis
rule:
  /pip:
    cmd: pip install wtfis
    reference: https://github.com/pirxthepilot/wtfis?tab=readme-ov-file#install
    dsnap: wtfis
  arch/yay:
    cmd: yay -S wtfis
    reference: https://aur.archlinux.org/packages/wtfis
  darwin/brew:
    cmd: brew install wtfis
    reference: https://github.com/pirxthepilot/wtfis?tab=readme-ov-file#install
binlist:
  - wtfis
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 KB
          rating: 1
          desc:
            cn: 约 13 KB（估算）
            en: ~13 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
