lang: Python
homepage: https://github.com/pirxthepilot/wtfis
license: MIT
desc:
  cn: 适用于非机器人的被动主机名、域名和 IP 查找工具
  en: Passive hostname, domain and IP lookup tool for non-robots
x:
  source: https://github.com/pirxthepilot/wtfis
rule:
  /pip:
    cmd: pip install wtfis
    reference: https://github.com/pirxthepilot/wtfis?tab=readme-ov-file#install
    dsnap: wtfis
  arch/yay:
    cmd: yay -S wtfis
    reference: https://aur.archlinux.org/packages/wtfis
  darwin/brew:
    cmd: brew install wtfis
    reference: https://github.com/pirxthepilot/wtfis?tab=readme-ov-file#install
binlist:
  - wtfis
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
