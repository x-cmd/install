lang: Python
homepage: https://github.com/pirxthepilot/wtfis
license: MIT
desc:
  cn: 适用于非机器人的被动主机名、域名和 IP 查找工具
  en: Passive hostname, domain and IP lookup tool for non-robots
  cs: Pasivní nástroj pro vyhledávání hostname, domény a IP adres, určený pro nelidi
  de: Passives Werkzeug zur Suche nach Hostname, Domain und IP-Adresse, für Menschen statt für Bots
  es: Herramienta pasiva de búsqueda de nombre de host, dominio e IP para personas, no para robots
  fr: Outil passif de recherche de nom d'hôte, de domaine et d'adresse IP pour les humains, pas pour les robots
  id: Alat pencarian pasif untuk nama host, domain, dan IP untuk manusia, bukan robot
  it: Strumento passivo per cercare hostname, dominio e IP, per esseri umani e non robot
  ja: ロボットではなく人間のための、ホスト名・ドメイン・IP のパッシブ検索ツール
  ko: 로봇이 아니라 사람을 위한 수동적 호스트명, 도메인 및 IP 조회 도구
  pl: Pasywne narzędzie do wyszukiwania nazw hostów, domen i adresów IP dla ludzi, a nie robotów
  pt: Ferramenta passiva de pesquisa de hostname, domínio e IP para humanos, não para robôs
  ro: Instrument pasiv de căutare a numelui de gazdă, domeniului și adresei IP pentru oameni, nu pentru roboți
  ru: Пассивный инструмент поиска имени хоста, домена и IP-адреса для людей, а не для роботов
  th: เครื่องมือค้นหาแบบ Passive สำหรับชื่อโฮสต์ โดเมน และ IP สำหรับมนุษย์ ไม่ใช่หุ่นยนต์
  tr: Robotlar için değil, insanlar için pasif ana makine, alan adı ve IP arama aracı
  uk: Пасивний інструмент пошуку імені хоста, домену та IP-адреси для людей, а не для роботів
  vi: Công cụ tra cứu thụ động tên máy chủ, tên miền và địa chỉ IP dành cho con người, không phải robot
x:
  source: https://github.com/pirxthepilot/wtfis
  brew: wtfis
  yay: wtfis
  pip: wtfis
rule:
  /pip:
    cmd: pip install wtfis
    reference: https://github.com/pirxthepilot/wtfis?tab=readme-ov-file#install
    dsnap: wtfis
  arch/yay:
    cmd: yay -S wtfis
    reference: https://aur.archlinux.org/packages/wtfis
  darwin/brew:
    cmd: brew install wtfis
    reference: https://github.com/pirxthepilot/wtfis?tab=readme-ov-file#install
binlist:
  - wtfis
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 KB
          rating: 1
          desc:
            cn: 约 13 KB（估算）
            en: ~13 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
