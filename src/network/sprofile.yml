lang: Rust
homepage: https://github.com/GoodBoyNeon/sprofile
desc:
  cn: 极速 TUI 应用，查看你的 Spotify 收听活动
  en: ⚡ Blazingly fast TUI application for viewing your Spotify listening activity.
  cs: ⚡ Extrémně rychlá TUI aplikace pro zobrazení vaší aktivity na Spotify.
  de: ⚡ Unglaublich schnelle TUI-Anwendung zur Anzeige Ihrer Spotify-Wiedergabeaktivität.
  es: ⚡ Aplicación TUI extremadamente rápida para ver tu actividad de reproducción en Spotify.
  fr: ⚡ Application TUI ultra-rapide pour afficher votre activité d'écoute Spotify.
  id: ⚡ Aplikasi TUI sangat cepat untuk melihat aktivitas pemutaran Anda di Spotify.
  it: ⚡ Applicazione TUI velocissima per visualizzare la tua attività di ascolto su Spotify.
  ja: ⚡ Spotifyの再生アクティビティを表示する超高速TUIアプリケーション。
  ko: ⚡ Spotify 재생 활동을 확인하는 매우 빠른 TUI 애플리케이션.
  pl: ⚡ Błyskawicznie szybka aplikacja TUI do przeglądania aktywności słuchania w Spotify.
  pt: ⚡ Aplicação TUI extremamente rápida para ver sua atividade de reprodução no Spotify.
  ro: ⚡ Aplicație TUI extrem de rapidă pentru a vedea activitatea ta de redare pe Spotify.
  ru: ⚡ Сверхбыстрое TUI-приложение для просмотра активности прослушивания в Spotify.
  th: ⚡ แอปพลิเคชัน TUI ที่รวดเร็วมากสำหรับดูกิจกรรมการฟัง Spotify ของคุณ.
  tr: ⚡ Spotify dinleme etkinliğinizi görüntülemek için çok hızlı bir TUI uygulaması.
  uk: ⚡ Надзвичайно швидкий TUI-додаток для перегляду активності прослуховування у Spotify.
  vi: ⚡ Ứng dụng TUI cực nhanh để xem hoạt động nghe của bạn trên Spotify.
x:
  source: https://github.com/GoodBoyNeon/sprofile
  eget: GoodBoyNeon/sprofile
rule:
  /eget:
    cmd: x eget GoodBoyNeon/sprofile
    reference: https://github.com/GoodBoyNeon/sprofile
binlist:
- sprofile
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 31 KB
          rating: 1
          desc:
            cn: 约 31 KB（估算）
            en: ~31 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
