lang: Rust
homepage: https://github.com/GoodBoyNeon/sprofile
desc:
  cn: 极速 TUI 应用，查看你的 Spotify 收听活动
  en: ⚡ Blazingly fast TUI application for viewing your Spotify listening activity.
x:
  source: https://github.com/GoodBoyNeon/sprofile
  eget: https://github.com/GoodBoyNeon/sprofile
rule:
  /eget:
    cmd: x eget GoodBoyNeon/sprofile
    reference: https://github.com/GoodBoyNeon/sprofile
binlist:
- sprofile
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
