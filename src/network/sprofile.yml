lang: Rust
homepage: https://github.com/GoodBoyNeon/sprofile
desc:
  cn: 极速 TUI 应用，查看你的 Spotify 收听活动
  en: ⚡ Blazingly fast TUI application for viewing your Spotify listening activity.
x:
  source: https://github.com/GoodBoyNeon/sprofile
  eget: https://github.com/GoodBoyNeon/sprofile
rule:
  /eget:
    cmd: x eget GoodBoyNeon/sprofile
    reference: https://github.com/GoodBoyNeon/sprofile
binlist:
- sprofile
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 31 KB
          rating: 1
          desc:
            cn: 约 31 KB（估算）
            en: ~31 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
