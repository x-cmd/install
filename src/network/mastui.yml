lang: 'Python'
homepage: https://github.com/kimusan/mastui
license: 'MIT'
desc:
  cn: Python 编写的 Mastodon TUI 客户端
  en: 'A TUI client for mastodon written in python'
x:
  source: https://github.com/kimusan/mastui
  eget: https://github.com/kimusan/mastui
rule:
  /eget:
    cmd: x eget kimusan/mastui
    reference: https://github.com/kimusan/mastui
binlist:
  - 'mastui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
