lang: 'Python'
homepage: https://github.com/kimusan/mastui
license: 'MIT'
desc:
  cn: Python 编写的 Mastodon TUI 客户端
  en: 'A TUI client for mastodon written in python'
x:
  source: https://github.com/kimusan/mastui
  eget: kimusan/mastui
rule:
  /eget:
    cmd: x eget kimusan/mastui
    reference: https://github.com/kimusan/mastui
binlist:
- 'mastui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 MB
          rating: 2
          desc:
            cn: 安装 28 MB
            en: 28 MB install
        download:
          estimate: 28 MB
          desc:
            cn: 约 28 MB 下载 (win/x64)
            en: ~28 MB download (win/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
