  id: Klien TUI untuk Mastodon yang ditulis dengan Python
  it: Un client TUI per Mastodon scritto in Python
  ja: Python で書かれた Mastodon の TUI クライアント
  ko: Python으로 작성된 Mastodon TUI 클라이언트
  pl: Klient TUI dla Mastodona napisany w Pythonie
  pt: Um cliente TUI para Mastodon escrito em Python
  ro: Un client TUI pentru Mastodon scris în Python
  ru: TUI-клиент для Mastodon, написанный на Python
  th: ไคลเอนต์ TUI สำหรับ Mastodon ที่เขียนด้วย Python
  tr: Python ile yazılmış Mastodon için bir TUI istemcisi
