lang: 'Rust'
homepage: 'https://github.com/lance0/xfr'
license: 'Apache-2.0'
desc:
  cn: iperf3 的现代替代品，带实时 TUI、多客户端服务端与 QUIC 支持，Rust 编写
  en: 'A modern iperf3 alternative with a live TUI, multi-client server, and QUIC support. Built in Rust.'
x:
  source: https://github.com/lance0/xfr
  eget: https://github.com/lance0/xfr
rule:
  /cargo:
    cmd: 'cargo install xfr'
    reference: https://github.com/lance0/xfr
  /eget:
    cmd: x eget lance0/xfr
    reference: https://github.com/lance0/xfr
binlist:
- 'xfr'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
