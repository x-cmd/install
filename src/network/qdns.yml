lang: Go
homepage: https://github.com/natesales/q
license: GPL-3.0
desc:
  cn: 命令行 DNS 客户端，支持 UDP、TCP、DoT、DoH、DoQ 和 ODoH
  en: A tiny and feature-rich command line DNS client with support for UDP, TCP, DoT, DoH, DoQ, and ODoH
x:
  source: https://github.com/natesales/q
  eget: https://github.com/natesales/q
rule:
  /eget:
    cmd: x eget natesales/q
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use qdns
    reference: https://github.com/moritz-makandra/asdf-plugin-qdns
  darwin/brew:
    cmd: brew tap natesales/repo https://github.com/natesales/repo
    reference: https://github.com/natesales/repo?tab=readme-ov-file#brew
  /apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings

      curl -fsSL https://repo.natesales.net/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/natesales.gpg

      echo "deb [signed-by=/etc/apt/keyrings/natesales.gpg] https://repo.natesales.net/apt * *" | sudo tee /etc/apt/sources.list.d/natesales.list

      '
    reference: https://github.com/natesales/repo?tab=readme-ov-file#apt
  /yum:
    cmd: 'echo ''[natesales]

      name=Nate Sales

      baseurl=https://repo.natesales.net/yum/

      enabled=1

      gpgcheck=1

      gpgkey=https://repo.natesales.net/apt/gpg.key

      '' | sudo tee /etc/yum.repos.d/natesales.repo

      '
    reference: https://github.com/natesales/repo?tab=readme-ov-file#yum
  /go:
    cmd: go install github.com/natesales/q@latest
    reference: https://github.com/natesales/q?tab=readme-ov-file#installation
    dsnap: github.com/natesales/q@latest
binlist:
- qdns

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
