lang: JavaScript
homepage: https://github.com/sindresorhus/is-up-cli#readme
license: MIT
desc:
  en: Check whether a website is up or down
  cn: 检查网站是否正常运行
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/is-up-cli#readme
rule:
  /x:
    cmd: x pkg use is-up-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global is-up-cli
    reference: https://github.com/sindresorhus/is-up-cli?tab=readme-ov-file#install
    dsnap: is-up-cli
  arch/yay:
    cmd: yay -S nodejs-is-up-cli
    reference: https://aur.archlinux.org/packages/nodejs-is-up-cli
binlist:
- is-up-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
