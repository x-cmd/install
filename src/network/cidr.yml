lang: 'Go'
homepage: https://github.com/bschaatsbergen/cidr
license: 'MIT'
desc:
  cn: 简化 IPv4/IPv6 CIDR 前缀管理,支持计数、重叠检查、解释与细分
  en: 'Simplifies IPv4/IPv6 CIDR network prefix management with counting, overlap checking, explanation, and subdivision.'
x:
  source: https://github.com/bschaatsbergen/cidr
  eget: https://github.com/bschaatsbergen/cidr
rule:
  /eget:
    cmd: x eget bschaatsbergen/cidr
    reference: https://github.com/bschaatsbergen/cidr
binlist:
- 'cidr'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 93 KB
          rating: 1
          desc:
            cn: 约 93 KB（估算）
            en: ~93 KB estimated
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
