lang: 'Go'
homepage: https://github.com/bschaatsbergen/cidr
license: 'MIT'
desc:
  cn: 简化 IPv4/IPv6 CIDR 前缀管理,支持计数、重叠检查、解释与细分
  en: 'Simplifies IPv4/IPv6 CIDR network prefix management with counting, overlap checking, explanation, and subdivision.'
x:
  source: https://github.com/bschaatsbergen/cidr
  eget: https://github.com/bschaatsbergen/cidr
rule:
  /eget:
    cmd: x eget bschaatsbergen/cidr
    reference: https://github.com/bschaatsbergen/cidr
binlist:
  - 'cidr'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
