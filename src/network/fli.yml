lang: 'Go'
homepage: 'https://github.com/fractalops/fli'
license: 'MIT'
desc:
  cn: 强大的 CLI 工具,简化 AWS VPC Flow Logs 分析,提供直观命令、智能过滤和自动标注
  en: '⚙️ FLI is a powerful command-line tool that simplifies AWS VPC Flow Logs analysis with intuitive commands, smart filtering, and automatic annotations, turning raw network data into actionable insig...'
  cs: ⚙️ FLI je výkonný nástroj příkazové řádky, který zjednodušuje analýzu AWS VPC Flow Logs pomocí intuitivních příkazů, chytrého filtrování a automatických poznámek a přeměňuje surová síťová data na použitelné poznatky...
  de: ⚙️ FLI ist ein leistungsfähiges Kommandozeilen-Tool, das die Analyse von AWS VPC Flow Logs mit intuitiven Befehlen, intelligenter Filterung und automatischen Anmerkungen vereinfacht und Rohdaten in verwertbare Erkenntnisse verwandelt...
  es: ⚙️ FLI es una potente herramienta de línea de comandos que simplifica el análisis de AWS VPC Flow Logs con comandos intuitivos, filtrado inteligente y anotaciones automáticas, convirtiendo los datos de red en bruto en información accionable...
  fr: ⚙️ FLI est un outil en ligne de commande puissant qui simplifie l'analyse des AWS VPC Flow Logs grâce à des commandes intuitives, un filtrage intelligent et des annotations automatiques, transformant les données réseau brutes en informations exploitables...
  id: ⚙️ FLI adalah alat baris perintah yang kuat untuk menyederhanakan analisis AWS VPC Flow Logs dengan perintah intuitif, filter cerdas, dan anotasi otomatis, mengubah data jaringan mentah menjadi insight yang dapat ditindaklanjuti...
  it: ⚙️ FLI è un potente strumento da riga di comando che semplifica l'analisi di AWS VPC Flow Logs con comandi intuitivi, filtraggio intelligente e annotazioni automatiche, trasformando i dati di rete grezzi in informazioni utili...
  ja: ⚙️ FLI は、直感的なコマンド、スマートなフィルター、自動注釈を使って AWS VPC Flow Logs の分析を簡単にする強力なコマンドラインツールで、生のネットワークデータを実行可能な洞察に変えます...
  ko: ⚙️ FLI는 직관적인 명령, 스마트한 필터링, 자동 주석을 통해 AWS VPC Flow Logs 분석을 단순화하는 강력한 명령줄 도구로, 원시 네트워크 데이터를 실행 가능한 인사이트로 바꿔줍니다...
  pl: ⚙️ FLI to potężne narzędzie wiersza poleceń, które upraszcza analizę AWS VPC Flow Logs dzięki intuicyjnym poleceniom, inteligentnemu filtrowaniu i automatycznym adnotacjom, zamieniając surowe dane sieciowe w praktyczne wnioski...
  pt: ⚙️ FLI é uma ferramenta de linha de comando poderosa que simplifica a análise do AWS VPC Flow Logs com comandos intuitivos, filtragem inteligente e anotações automáticas, transformando dados de rede brutos em insights acionáveis...
  ro: ⚙️ FLI este un instrument puternic de linie de comandă care simplifică analiza AWS VPC Flow Logs cu comenzi intuitive, filtrare inteligentă și adnotări automate, transformând datele de rețea brute în informații utile...
  ru: ⚙️ FLI — мощный инструмент командной строки, упрощающий анализ AWS VPC Flow Logs за счёт интуитивных команд, умной фильтрации и автоматических аннотаций, превращающий необработанные сетевые данные в применимые выводы...
  th: ⚙️ FLI เป็นเครื่องมือบรรทัดคำสั่งที่ทรงพลัง ช่วยให้วิเคราะห์ AWS VPC Flow Logs ด้วยคำสั่งที่เข้าใจง่าย ตัวกรองอัจฉริยะ และคำอธิบายอัตโนมัติ เปลี่ยนข้อมูลเครือข่ายดิบให้เป็นข้อมูลเชิงลึกที่นำไปใช้ได้...
  tr: ⚙️ FLI, sezgisel komutlar, akıllı filtreleme ve otomatik açıklamalarla AWS VPC Flow Logs analizini basitleştiren güçlü bir komut satırı aracıdır; ham ağ verilerini uygulanabilir içgörülere dönüştürür...
  uk: ⚙️ FLI — потужний інструмент командного рядка, який спрощує аналіз AWS VPC Flow Logs завдяки інтуїтивним командам, розумному фільтруванню та автоматичним приміткам, перетворюючи сирі мережеві дані на практичні висновки...
  vi: ⚙️ FLI là công cụ dòng lệnh mạnh mẽ giúp đơn giản hóa việc phân tích AWS VPC Flow Logs với các lệnh trực quan, bộ lọc thông minh và chú thích tự động, biến dữ liệu mạng thô thành thông tin có thể hành động...
x:
  source: https://github.com/fractalops/fli
  eget: fractalops/fli
rule:
  /eget:
    cmd: x eget fractalops/fli
    reference: https://github.com/fractalops/fli
binlist:
- 'fli'

