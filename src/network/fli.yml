lang: 'Go'
homepage: 'https://github.com/fractalops/fli'
license: 'MIT'
desc:
  cn: 强大的 CLI 工具,简化 AWS VPC Flow Logs 分析,提供直观命令、智能过滤和自动标注
  en: '⚙️ FLI is a powerful command-line tool that simplifies AWS VPC Flow Logs analysis with intuitive commands, smart filtering, and automatic annotations, turning raw network data into actionable insig...'
x:
  source: https://github.com/fractalops/fli
  eget: https://github.com/fractalops/fli
rule:
  /eget:
    cmd: x eget fractalops/fli
    reference: https://github.com/fractalops/fli
binlist:
- 'fli'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
