      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.9 MB
          rating: 1
          desc:
            cn: 约 6.9 MB（估算）
            en: ~6.9 MB estimated
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
