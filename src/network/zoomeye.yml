lang: Python
homepage: https://github.com/knownsec/ZoomEye
license: GPL-2.0
desc:
  cn: 一个网络空间搜索引擎，可以让用户使用浏览器搜索网络设备
  en: A cyberspace search engine that allows users to search for network devices using a browser
x:
  pkg:
    exist: true
  source: https://github.com/knownsec/ZoomEye
rule:
  /x:
    cmd: x pkg use zoomeye
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip3 install zoomeye
    reference: https://github.com/knownsec/zoomeye-python?tab=readme-ov-file#0x01-installation
    dsnap: zoomeye
binlist:
- zoomeye

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
