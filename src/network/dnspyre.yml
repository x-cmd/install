lang: 'Go'
homepage: https://github.com/Tantalor93/dnspyre
license: 'MIT'
desc:
  cn: 高 QPS 的 DNS 基准测试 CLI 工具
  en: 'CLI tool for a high QPS DNS benchmark'
x:
  source: https://github.com/Tantalor93/dnspyre
  eget: https://github.com/Tantalor93/dnspyre
rule:
  /eget:
    cmd: x eget Tantalor93/dnspyre
    reference: https://github.com/Tantalor93/dnspyre
binlist:
  - 'dnspyre'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
