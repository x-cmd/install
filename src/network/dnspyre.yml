lang: 'Go'
homepage: https://github.com/Tantalor93/dnspyre
license: 'MIT'
desc:
  cn: 高 QPS 的 DNS 基准测试 CLI 工具
  en: 'CLI tool for a high QPS DNS benchmark'
x:
  source: https://github.com/Tantalor93/dnspyre
  eget: https://github.com/Tantalor93/dnspyre
rule:
  /eget:
    cmd: x eget Tantalor93/dnspyre
    reference: https://github.com/Tantalor93/dnspyre
binlist:
  - 'dnspyre'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 469 KB
          rating: 1
          desc:
            cn: 约 469 KB（估算）
            en: ~469 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
