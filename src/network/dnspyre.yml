lang: 'Go'
homepage: https://github.com/Tantalor93/dnspyre
license: 'MIT'
desc:
  cn: 高 QPS 的 DNS 基准测试 CLI 工具
  en: 'CLI tool for a high QPS DNS benchmark'
  cs: Nástroj CLI pro benchmark DNS s vysokým QPS
  de: CLI-Tool für einen DNS-Benchmark mit hoher QPS
  es: Herramienta de CLI para una prueba de rendimiento DNS con QPS alto
  fr: Outil CLI pour un banc d'essai DNS à haut QPS
  id: Alat CLI untuk benchmark DNS dengan QPS tinggi
  it: Strumento CLI per un benchmark DNS ad alto QPS
  ja: 高 QPS の DNS ベンチマーク用 CLI ツール
  ko: 높은 QPS를 위한 DNS 벤치마크 CLI 도구
  pl: Narzędzie CLI do benchmarku DNS z wysokim QPS
  pt: Ferramenta de CLI para benchmark de DNS com alto QPS
  ro: Instrument CLI pentru un benchmark DNS cu QPS ridicat
  ru: CLI-инструмент для DNS-бенчмарка с высоким QPS
  th: เครื่องมือ CLI สำหรับการทดสอบประสิทธิภาพ DNS ด้วย QPS สูง
  tr: Yüksek QPS'li DNS kıyaslaması için bir CLI aracı
  uk: CLI-інструмент для DNS-бенчмарку з високим QPS
  vi: Công cụ CLI để đánh giá hiệu năng DNS với QPS cao
x:
  source: https://github.com/Tantalor93/dnspyre
  eget: Tantalor93/dnspyre
rule:
  /eget:
    cmd: x eget Tantalor93/dnspyre
    reference: https://github.com/Tantalor93/dnspyre
binlist:
- 'dnspyre'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 18 MB
          rating: 2
          desc:
            cn: 安装 18 MB
            en: 18 MB install
        download:
          estimate: 18 MB
          desc:
            cn: 约 18 MB 下载 (linux/x64)
            en: ~18 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
