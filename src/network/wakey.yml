lang: 'Go'
homepage: 'https://github.com/jonathanruiz/wakey'
license: 'MIT'
desc:
  cn: 通过 Wake-on-LAN 管理与唤醒设备的 TUI
  en: 'A TUI built for managing and waking your devices using Wake-on-LAN.'
  cs: TUI pro správu a probouzení zařízení pomocí Wake-on-LAN.
  de: Eine TUI zur Verwaltung und zum Aufwachen deiner Geräte mit Wake-on-LAN.
  es: Una TUI para gestionar y despertar tus dispositivos usando Wake-on-LAN.
  fr: Une TUI pour gérer et réveiller vos appareils à l'aide de Wake-on-LAN.
  id: TUI untuk mengelola dan bangunkan perangkat Anda menggunakan Wake-on-LAN.
  it: Una TUI per gestire e riattivare i tuoi dispositivi usando Wake-on-LAN.
  ja: Wake-on-LAN を使ってデバイスを管理・起動するための TUI。
  ko: Wake-on-LAN을 사용하여 기기를 관리하고 깨우는 TUI입니다.
  pl: TUI do zarządzania i budzenia urządzeń za pomocą Wake-on-LAN.
  pt: Uma TUI para gerenciar e acordar seus dispositivos usando Wake-on-LAN.
  ro: Un TUI pentru gestionarea și trezirea dispozitivelor tale folosind Wake-on-LAN.
  ru: TUI для управления и пробуждения ваших устройств с помощью Wake-on-LAN.
  th: TUI สำหรับจัดการและปลุกอุปกรณ์ของคุณด้วย Wake-on-LAN
  tr: Wake-on-LAN kullanarak cihazlarınızı yönetmek ve uyandırmak için bir TUI.
  uk: TUI для керування та пробудження ваших пристроїв за допомогою Wake-on-LAN.
  vi: Một TUI để quản lý và đánh thức thiết bị của bạn bằng Wake-on-LAN
x:
  source: https://github.com/jonathanruiz/wakey
  eget: jonathanruiz/wakey
rule:
  /eget:
    cmd: x eget jonathanruiz/wakey
    reference: https://github.com/jonathanruiz/wakey
binlist:
- 'wakey'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 安装 13 MB
            en: 13 MB install
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
