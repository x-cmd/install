lang: 'Go'
homepage: 'https://github.com/jonathanruiz/wakey'
license: 'MIT'
desc:
  cn: 通过 Wake-on-LAN 管理与唤醒设备的 TUI
  en: 'A TUI built for managing and waking your devices using Wake-on-LAN.'
x:
  source: https://github.com/jonathanruiz/wakey
  eget: https://github.com/jonathanruiz/wakey
rule:
  /eget:
    cmd: x eget jonathanruiz/wakey
    reference: https://github.com/jonathanruiz/wakey
binlist:
- 'wakey'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 213 KB
          rating: 1
          desc:
            cn: 约 213 KB（估算）
            en: ~213 KB estimated
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
