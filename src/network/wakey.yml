lang: 'Go'
homepage: 'https://github.com/jonathanruiz/wakey'
license: 'MIT'
desc:
  cn: 通过 Wake-on-LAN 管理与唤醒设备的 TUI
  en: 'A TUI built for managing and waking your devices using Wake-on-LAN.'
x:
  source: https://github.com/jonathanruiz/wakey
  eget: https://github.com/jonathanruiz/wakey
rule:
  /eget:
    cmd: x eget jonathanruiz/wakey
    reference: https://github.com/jonathanruiz/wakey
binlist:
  - 'wakey'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
