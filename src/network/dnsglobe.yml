lang: Rust
homepage: https://github.com/514-labs/dnsglobe
license: MIT
desc:
  en: dnsglobe is a TUI that checks DNS record propagation across 34 public resolvers worldwide, with NSID, EDNS Client Subnet, watch mode, and a world map / spinning globe in the terminal.
  cn: dnsglobe 是 TUI DNS 传播检查器：并行查询 34 个公共 DNS 解析器，支持 NSID、EDNS Client Subnet、watch 模式，并在终端里展示世界地图/旋转地球。
x:
  source: https://github.com/514-labs/dnsglobe
  eget: 514-labs/dnsglobe
  brew: 514-labs/tap/dnsglobe
  cargo: dnsglobe
  yay: dnsglobe-bin
  nix: dnsglobe
rule:
  /eget:
    cmd: x eget 514-labs/dnsglobe
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install dnsglobe
    reference: https://crates.io/crates/dnsglobe
    dsnap: dnsglobe
  darwin/brew:
    cmd: 'brew tap 514-labs/tap && brew install dnsglobe'
    reference: https://github.com/514-labs/dnsglobe?tab=readme-ov-file#usage
  arch/yay:
    cmd: yay -S dnsglobe-bin
    reference: https://aur.archlinux.org/packages/dnsglobe-bin
  (linux|nixos)/nix:
    cmd: nix run github:514-labs/dnsglobe
    reference: https://github.com/514-labs/dnsglobe?tab=readme-ov-file#usage
binlist:
- dnsglobe

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件（可选）
          en: Reads config file (optional)
        sensitive: []
      write:
        desc:
          cn: 写出 DNS 解析历史与配置
          en: Writes DNS resolution history and config
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 约 4 MB 安装
            en: ~4 MB install
        download:
          estimate: 1.3 MB
          desc:
            cn: 约 1.3 MB 下载 (linux/x86_64 tar.xz)
            en: ~1.3 MB download (linux/x86_64 tar.xz)
      paths:
        data:
          - ~/.local/share/dnsglobe/
        config:
          - ~/.config/dnsglobe/
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 约 30 MB 闲置
          en: ~30 MB idle
    cpu:
      workload: ['compute', 'network']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 低（并行 DNS 查询 + 地图渲染）
          en: Low (parallel DNS queries + map render)
  platform:
    win: full
    linux: full
    darwin: full
