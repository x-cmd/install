lang: C
homepage: https://gitlab.nic.cz/knot/knot-dns
desc:
  cn: Knot DNS 是一款高性能的权威 DNS 服务器
  en: Knot DNS is a high-performance authoritative-only DNS server
  cs: Knot DNS je vysoce výkonný autoritativní DNS server
  de: Knot DNS ist ein leistungsstarker autoritativer DNS-Server
  es: Knot DNS es un servidor DNS autoritativo de alto rendimiento
  fr: Knot DNS est un serveur DNS faisant autorité haute performance
  id: Knot DNS adalah server DNS otoritatif berkinerja tinggi
  it: Knot DNS è un server DNS autoritativo ad alte prestazioni
  ja: Knot DNS は高性能な権威 DNS サーバーです
  ko: Knot DNS는 고성능 권위 DNS 서버입니다
  pl: Knot DNS to wysoce wydajny autorytatywny serwer DNS
  pt: O Knot DNS é um servidor DNS autoritativo de alto desempenho
  ro: Knot DNS este un server DNS autoritar de înaltă performanță
  ru: Knot DNS — это высокопроизводительный авторитативный DNS-сервер
  th: Knot DNS คือเซิร์ฟเวอร์ DNS แบบออทอริทีที่มีประสิทธิภาพสูง
  tr: Knot DNS, yüksek performanslı yalnızca yetkili bir DNS sunucusudur
  uk: Knot DNS — це високопродуктивний авторитативний DNS-сервер
  vi: Knot DNS là máy chủ DNS có thẩm quyền hiệu năng cao
rule:
  debian/apt:
    cmd: sudo apt-get install dnsutils
    reference: https://command-not-found.com/dig
    dsnap: dnsutils
  ubuntu/apt:
    cmd: sudo apt-get install dnsutils
    reference: https://command-not-found.com/dig
    dsnap: dnsutils
  alpine/apk:
    cmd: sudo apk add bind-tools
    reference: https://command-not-found.com/dig
    dsnap: bind-tools
  arch/pacman:
    cmd: sudo pacman -S bind-tools
    reference: https://command-not-found.com/dig
  kali/apt:
    cmd: sudo apt-get install dnsutils
    reference: https://command-not-found.com/dig
    dsnap: dnsutils
  fedora/dnf:
    cmd: sudo dnf install bind-utils
    reference: https://command-not-found.com/dig
    dsnap: bind-utils
  raspbian/apt:
    cmd: sudo apt-get install dnsutils
    reference: https://command-not-found.com/dig

x:
  apt: dnsutils
  apt-get: dnsutils
  dnf: bind-utils
  pacman: bind-tools
  apk: bind-tools
binlist:
- dig
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
