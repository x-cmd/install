lang: C
homepage: https://gitlab.nic.cz/knot/knot-dns
desc:
  cn: Knot DNS 是一款高性能的权威 DNS 服务器
  en: Knot DNS is a high-performance authoritative-only DNS server
rule:
  debian/apt:
    cmd: sudo apt-get install dnsutils
    reference: https://command-not-found.com/dig
    dsnap: dnsutils
  ubuntu/apt:
    cmd: sudo apt-get install dnsutils
    reference: https://command-not-found.com/dig
    dsnap: dnsutils
  alpine/apk:
    cmd: sudo apk add bind-tools
    reference: https://command-not-found.com/dig
    dsnap: bind-tools
  arch/pacman:
    cmd: sudo pacman -S bind-tools
    reference: https://command-not-found.com/dig
  kali/apt:
    cmd: sudo apt-get install dnsutils
    reference: https://command-not-found.com/dig
    dsnap: dnsutils
  fedora/dnf:
    cmd: sudo dnf install bind-utils
    reference: https://command-not-found.com/dig
    dsnap: bind-utils
  raspbian/apt:
    cmd: sudo apt-get install dnsutils
    reference: https://command-not-found.com/dig
binlist:
- dig
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
