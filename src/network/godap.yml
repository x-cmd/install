lang: 'Go'
homepage: 'https://github.com/Macmod/godap'
license: 'MIT'
desc:
  cn: 功能完整的 LDAP 终端界面(TUI)
  en: 'A complete terminal user interface (TUI) for LDAP.'
x:
  source: https://github.com/Macmod/godap
  eget: https://github.com/Macmod/godap
rule:
  /eget:
    cmd: x eget Macmod/godap
    reference: https://github.com/Macmod/godap
binlist:
  - 'godap'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
