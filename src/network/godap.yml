lang: 'Go'
homepage: 'https://github.com/Macmod/godap'
license: 'MIT'
desc:
  cn: 功能完整的 LDAP 终端界面(TUI)
  en: 'A complete terminal user interface (TUI) for LDAP.'
x:
  source: https://github.com/Macmod/godap
  eget: https://github.com/Macmod/godap
rule:
  /eget:
    cmd: x eget Macmod/godap
    reference: https://github.com/Macmod/godap
binlist:
- 'godap'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.1 MB
          rating: 1
          desc:
            cn: 约 1.1 MB（估算）
            en: ~1.1 MB estimated
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
