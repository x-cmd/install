lang: Go
homepage: https://github.com/luynrs/justray
license: GPL-3.0-or-later
desc:
  en: justray is a modern VPN client that lives in your terminal — TUI front-end plus a headless daemon with embedded sing-box core, supporting VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 and more.
  cn: justray 是住在终端里的现代 VPN 客户端：TUI 前端 + 后台守护进程（内置 sing-box 内核），支持 VMess、VLESS、Trojan、WireGuard、Hysteria 1/2、TUIC、Shadowsocks、SOCKS5 等协议。
  cs: justray je moderní klient VPN, který žije ve vašem terminálu — TUI frontend plus headless daemon s vestavěným jádrem sing-box, podporující VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 a další.
  de: justray ist ein moderner VPN-Client für dein Terminal — TUI-Frontend plus headless-Daemon mit eingebettetem sing-box-Kern, der VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 und mehr unterstützt.
  es: "justray es un cliente VPN moderno que vive en tu terminal: frontend TUI más demonio headless con núcleo sing-box integrado, compatible con VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 y más."
  fr: justray est un client VPN moderne qui vit dans votre terminal — interface TUI plus démon sans interface avec le noyau sing-box intégré, prenant en charge VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 et plus encore.
  id: justray adalah klien VPN modern yang tinggal di terminal Anda — frontend TUI plus daemon headless dengan inti sing-box tertanam, mendukung VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5, dan banyak lagi.
  it: justray è un client VPN moderno che vive nel tuo terminale — frontend TUI più daemon headless con core sing-box integrato, con supporto per VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 e altro.
  ja: justrayはターミナルで動く現代のVPNクライアントです。TUIフロントエンドと組み込みのsing-boxコアを持つヘッドレスデーモンで構成され、VMess、VLESS、Trojan、WireGuard、Hysteria 1/2、TUIC、Shadowsocks、SOCKS5などに対応しています。
  ko: justray는 터미널에서 동작하는 현대적인 VPN 클라이언트입니다. TUI 프런트엔드와 내장 sing-box 코어를 가진 헤드리스 데몬으로 구성되며 VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 등을 지원합니다.
  pl: justray to nowoczesny klient VPN działający w terminalu — frontend TUI plus headlessowy demon z wbudowanym rdzeniem sing-box, obsługujący VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 i więcej.
  pt: justray é um cliente VPN moderno que vive no seu terminal — front-end TUI mais daemon headless com núcleo sing-box embutido, com suporte a VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 e mais.
  ro: justray este un client VPN modern care stă în terminalul tău — frontend TUI plus daemon headless cu nucleu sing-box încorporat, care acceptă VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 și altele.
  ru: "justray — современный VPN-клиент, живущий в вашем терминале: TUI-фронтенд плюс headless-демон со встроенным ядром sing-box, поддерживающий VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 и другие."
  th: justray คือไคลเอนต์ VPN สมัยใหม่ที่ทำงานอยู่ในเทอร์มินัลของคุณ — ส่วนหน้าแบบ TUI พร้อมดีมอนแบบ headless ที่มีแกน sing-box ฝังมาภายใน รองรับ VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 และอื่น ๆ
  tr: justray, terminalinizde yaşayan modern bir VPN istemcisidir — gömülü sing-box çekirdeğine sahip headless daemon ile TUI ön uçtan oluşur; VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 ve daha fazlasını destekler.
  uk: "justray — сучасний VPN-клієнт, що живе у вашому терміналі: TUI-фронтенд плюс headless-демон із вбудованим ядром sing-box, який підтримує VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 та інші."
  vi: justray là client VPN hiện đại sống trong terminal của bạn — frontend TUI kèm daemon headless có nhúng lõi sing-box, hỗ trợ VMess, VLESS, Trojan, WireGuard, Hysteria 1/2, TUIC, Shadowsocks, SOCKS5 và nhiều hơn nữa.
x:
  source: https://github.com/luynrs/justray
  eget: luynrs/justray
  brew: luynrs/tap/justray
  yay: justray-bin
  winget: luynrs.justray
  nix: justray
rule:
  /eget:
    cmd: x eget luynrs/justray
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap luynrs/tap && brew install justray'
    reference: https://github.com/luynrs/justray?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S justray-bin
    reference: https://aur.archlinux.org/packages/justray-bin
  (win|wsl2)/winget:
    cmd: x winget install luynrs.justray
    reference: https://github.com/luynrs/justray?tab=readme-ov-file#installation
  /curl:
    cmd: 'curl -fsSL https://raw.githubusercontent.com/luynrs/justray/main/install.sh | sh'
    reference: https://github.com/luynrs/justray?tab=readme-ov-file#installation
  (linux|nixos)/nix:
    cmd: nix run github:luynrs/justray
    reference: https://github.com/luynrs/justray?tab=readme-ov-file#nix
binlist:
- justray
- justrayd

# complicated
footprint:
  behavior:
    runtime:
      type: ['tui', 'daemon']
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取订阅、节点配置与代理协议
          en: Reads subscriptions, node configs and proxy protocols
        sensitive:
          - ~/.config/justray/subscriptions.yaml
      write:
        desc:
          cn: 写入订阅缓存、节点探测结果与日志
          en: Writes subscription cache, probe results and logs
        sensitive:
          - ~/.config/justray/subscriptions.yaml
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB 安装
            en: ~15 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data:
          - ~/.local/share/justray/
        config:
          - ~/.config/justray/
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 约 50 MB 闲置（Linux/macOS，README 标注）
          en: ~50 MB idle (Linux/macOS, per README)
    cpu:
      workload: ['compute', 'network']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 低（流量代理转发）
          en: Low (proxy forwarding)
  platform:
    win: full
    linux: full
    darwin: full
