lang: C
homepage: https://github.com/Lekensteyn/ltunify
desc:
  en: Tool for working with Logitech Unifying receivers and devices (mirror)
  cn: 使用 Logitech 统一接收器和设备（镜像）的工具
x:
  source: https://github.com/Lekensteyn/ltunify
  dnf: ltunify
  yay: ltunify
rule:
  fedora/dnf:
    cmd: sudo dnf install ltunify
    reference: https://command-not-found.com/usbmon.awk
    dsnap: ltunify
  arch/yay:
    cmd: yay -S ltunify
    reference: https://aur.archlinux.org/packages/ltunify
binlist:
- ltunify
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 77 KB
          rating: 1
          desc:
            cn: 约 77 KB（估算）
            en: ~77 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
