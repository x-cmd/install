lang: C
homepage: https://github.com/Lekensteyn/ltunify
desc:
  en: Tool for working with Logitech Unifying receivers and devices (mirror)
  cn: 使用 Logitech 统一接收器和设备（镜像）的工具
x:
  source: https://github.com/Lekensteyn/ltunify
rule:
  fedora/dnf:
    cmd: sudo dnf install ltunify
    reference: https://command-not-found.com/usbmon.awk
    dsnap: ltunify
  arch/yay:
    cmd: yay -S ltunify
    reference: https://aur.archlinux.org/packages/ltunify
binlist:
- ltunify
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
