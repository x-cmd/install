lang: Go
homepage: https://github.com/pouriyajamshidi/tcping
license: MIT
desc:
  cn: 一个通过 TCP 连接进行 ping 操作的工具
  en: A tool to ping over a TCP connection
x:
  pkg:
    exist: true
  source: https://github.com/pouriyajamshidi/tcping
  eget: https://github.com/pouriyajamshidi/tcping
rule:
  /x:
    cmd: x pkg use tcping
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget pouriyajamshidi/tcping
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/pouriyajamshidi/tcping@latest
    reference: https://github.com/pouriyajamshidi/tcping?tab=readme-ov-file#download
    dsnap: github.com/pouriyajamshidi/tcping@latest
  arch/yay:
    cmd: yay -S tcping-go
    reference: https://aur.archlinux.org/packages/tcping-go
  debian/apt:
    cmd: 'wget https://github.com/pouriyajamshidi/tcping/releases/latest/download/tcping_amd64.deb -O /tmp/tcping.deb &&

      sudo apt install -y /tmp/tcping.deb

      '
    reference: https://github.com/pouriyajamshidi/tcping?tab=readme-ov-file#linux---debian-and-ubuntu
    dsnap: tcping_amd64.deb
  ubuntu/apt:
    cmd: 'wget https://github.com/pouriyajamshidi/tcping/releases/latest/download/tcping_amd64.deb -O /tmp/tcping.deb &&

      sudo apt install -y /tmp/tcping.deb

      '
    reference: https://github.com/pouriyajamshidi/tcping?tab=readme-ov-file#linux---debian-and-ubuntu
    dsnap: tcping_amd64.deb
  darwin/brew:
    cmd: brew install pouriyajamshidi/tap/tcping
    reference: https://github.com/pouriyajamshidi/tcping?tab=readme-ov-file#download
binlist:
- tcping

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
