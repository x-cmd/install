lang: Go
homepage: https://github.com/sachaos/tcpterm
license: MIT
desc:
  cn: tcpterm 是一个基于 TUI 的数据包可视化工具。
  en: tcpterm is a packet visualizer in TUI.
x:
  source: https://github.com/sachaos/tcpterm
rule:
  /go:
    cmd: go install github.com/sachaos/tcpterm
    reference: https://github.com/sachaos/tcpterm?tab=readme-ov-file#go-install
    dsnap: github.com/sachaos/tcpterm
  arch/yay:
    cmd: yay -S tcpterm
    reference: https://aur.archlinux.org/packages/tcpterm
  /wget:
    cmd: wget -O tcpterm https://github.com/sachaos/tcpterm/releases/download/v0.0.2/tcpterm_linux_amd64 && chmod +x tcpterm && sudo mv tcpterm /usr/local/bin
    reference: https://github.com/sachaos/tcpterm?tab=readme-ov-file#download-binary
binlist:
- tcpterm

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
