lang: Rust
desc:
  cn: 一个通过 HTTP 提供文件和目录的 CLI 工具
  en: A CLI tool to serve files and directories over HTTP
  cs: Nástroj CLI pro poskytování souborů a adresářů přes HTTP
  de: Ein CLI-Werkzeug zum Bereitstellen von Dateien und Verzeichnissen über HTTP
  es: Una herramienta CLI para servir archivos y directorios a través de HTTP
  fr: Un outil CLI pour servir des fichiers et des répertoires via HTTP
  id: Alat CLI untuk menyajikan berkas dan direktori melalui HTTP
  it: Uno strumento CLI per servire file e directory tramite HTTP
  ja: HTTP 経由でファイルとディレクトリを提供する CLI ツール
  ko: HTTP를 통해 파일과 디렉터리를 제공 하는 CLI 도구
  pl: Narzędzie CLI do udostępniania plików i katalogów przez HTTP
  pt: Uma ferramenta CLI para servir arquivos e diretórios via HTTP
  ro: Un instrument CLI pentru a servi fișiere și directoare prin HTTP
  ru: Инструмент CLI для раздачи файлов и каталогов по HTTP
  th: เครื่องมือ CLI สำหรับให้บริการไฟล์และไดเรกทอรีผ่าน HTTP
  tr: HTTP üzerinden dosya ve dizin sunmak için bir CLI aracı.
  uk: Інструмент CLI для роздачі файлів і каталогів через HTTP
  vi: Công cụ CLI để phục vụ tệp và thư mục qua HTTP
homepage: https://github.com/svenstaro/miniserve
license: MIT
x:
  source: https://github.com/svenstaro/miniserve
  eget: svenstaro/miniserve
  brew: miniserve
  pacman: miniserve
  scoop: miniserve
rule:
  /x:
    cmd: x pkg use miniserve
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget svenstaro/miniserve
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
  termux/pkg:
    cmd: pkg install miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
  darwin/brew:
    cmd: brew install miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
  (win|wsl2)/scoop:
    cmd: scoop install miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
  /cargo:
    cmd: cargo install --locked miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
    dsnap: miniserve
binlist:
- miniserve

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
