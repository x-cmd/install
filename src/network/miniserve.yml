lang: Rust
desc:
  cn: 一个通过 HTTP 提供文件和目录的 CLI 工具
  en: A CLI tool to serve files and directories over HTTP
homepage: https://github.com/svenstaro/miniserve
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/svenstaro/miniserve
  eget: https://github.com/svenstaro/miniserve
rule:
  /x:
    cmd: x pkg use miniserve
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget svenstaro/miniserve
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
  termux/pkg:
    cmd: pkg install miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
  darwin/brew:
    cmd: brew install miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
  (win|wsl2)/scoop:
    cmd: scoop install miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
  /cargo:
    cmd: cargo install --locked miniserve
    reference: https://github.com/svenstaro/miniserve?tab=readme-ov-file#how-to-install
    dsnap: miniserve
binlist:
- miniserve

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
