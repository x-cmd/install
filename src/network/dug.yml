lang: C
homepage: https://github.com/unfrl/dug
license: MIT
desc:
  cn: 一个基于 CLI 的 DNS 传播检查器，具有美观的输出。
  en: A CLI based DNS propagation checker with attractive output.
  cs: Kontrolor šíření DNS založený na CLI s přitažlivým výstupem.
  de: Ein CLI-basierter DNS-Propagation-Checker mit ansprechender Ausgabe.
  es: Un comprobador de propagación DNS basado en CLI con una salida atractiva.
  fr: Un vérificateur de propagation DNS basé sur la CLI avec une sortie soignée.
  id: Pemeriksa propagasi DNS berbasis CLI dengan output yang menarik.
  it: Un verificatore di propagazione DNS basato sulla CLI con un output accattivante.
  ja: CLI ベースの DNS 伝播チェッカーで、美しい出力を備えています。
  ko: 매력적인 출력을 갖춘 CLI 기반 DNS 전파 검사기.
  pl: Narzędzie CLI do sprawdzania propagacji DNS z atrakcyjnym wyjściem.
  pt: Um verificador de propagação de DNS baseado em CLI com saída atraente.
  ro: Un verificator de propagare DNS bazat pe CLI, cu ieșire atractivă.
  ru: Проверка распространения DNS на основе CLI с привлекательным выводом.
  th: ตัวตรวจการกระจาย DNS บนพื้นฐาน CLI พร้อมผลลัพธ์ที่สวยงาม.
  tr: Çekici çıktıya sahip, CLI tabanlı bir DNS yayılım denetleyicisi.
  uk: Перевіряльник поширення DNS на основі CLI з привабливим виводом.
  vi: Trình kiểm tra lan truyền DNS dựa trên CLI với kết quả hiển thị bắt mắt.
x:
  source: https://github.com/unfrl/dug
  eget: unfrl/dug
  brew: dug
  pacman: dug
  snap: unfrl-dug
  choco: dug
  yay: unfrl-dug-bin
rule:
  /eget:
    cmd: x eget unfrl/dug
    reference: https://x-cmd.com/mod/eget
  /snap:
    cmd: sudo snap install unfrl-dug
    reference: https://github.com/mehrdad-f/dug#installation
  arch/pacman:
    cmd: sudo pacman -S dug
    reference: https://github.com/mehrdad-f/dug#installation
  arch/yay:
    cmd: yay -S unfrl-dug-bin
    reference: https://aur.archlinux.org/packages/unfrl-dug-bin
  /brew:
    cmd: brew install dug
    reference: https://github.com/mehrdad-f/dug#installation
  (win|wsl2)/choco:
    cmd: x choco install dug
    reference: https://github.com/mehrdad-f/dug#installation
binlist:
- dug

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 66 MB
          rating: 3
          desc:
            cn: 安装 66 MB
            en: 66 MB install
        download:
          estimate: 66 MB
          desc:
            cn: 约 66 MB 下载 (linux/x64)
            en: ~66 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
