lang: C
homepage: https://github.com/unfrl/dug
license: MIT
desc:
  cn: 一个基于 CLI 的 DNS 传播检查器，具有美观的输出。
  en: A CLI based DNS propagation checker with attractive output.
x:
  source: https://github.com/unfrl/dug
  eget: https://github.com/unfrl/dug
rule:
  /eget:
    cmd: x eget unfrl/dug
    reference: https://x-cmd.com/mod/eget
  /snap:
    cmd: sudo snap install unfrl-dug
    reference: https://github.com/mehrdad-f/dug#installation
  arch/pacman:
    cmd: sudo pacman -S dug
    reference: https://github.com/mehrdad-f/dug#installation
  arch/yay:
    cmd: yay -S unfrl-dug-bin
    reference: https://aur.archlinux.org/packages/unfrl-dug-bin
  /brew:
    cmd: brew install dug
    reference: https://github.com/mehrdad-f/dug#installation
  (win|wsl2)/choco:
    cmd: x choco install dug
    reference: https://github.com/mehrdad-f/dug#installation
binlist:
- dug

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
