lang: C
homepage: https://github.com/unfrl/dug
license: MIT
desc:
  cn: 一个基于 CLI 的 DNS 传播检查器，具有美观的输出。
  en: A CLI based DNS propagation checker with attractive output.
x:
  source: https://github.com/unfrl/dug
  eget: https://github.com/unfrl/dug
  brew: dug
  pacman: dug
  snap: unfrl-dug
  choco: dug
  yay: unfrl-dug-bin
rule:
  /eget:
    cmd: x eget unfrl/dug
    reference: https://x-cmd.com/mod/eget
  /snap:
    cmd: sudo snap install unfrl-dug
    reference: https://github.com/mehrdad-f/dug#installation
  arch/pacman:
    cmd: sudo pacman -S dug
    reference: https://github.com/mehrdad-f/dug#installation
  arch/yay:
    cmd: yay -S unfrl-dug-bin
    reference: https://aur.archlinux.org/packages/unfrl-dug-bin
  /brew:
    cmd: brew install dug
    reference: https://github.com/mehrdad-f/dug#installation
  (win|wsl2)/choco:
    cmd: x choco install dug
    reference: https://github.com/mehrdad-f/dug#installation
binlist:
- dug

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 66 MB
          rating: 3
          desc:
            cn: 安装 66 MB
            en: 66 MB install
        download:
          estimate: 66 MB
          desc:
            cn: 约 66 MB 下载 (linux/x64)
            en: ~66 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
