lang: Go
homepage: https://github.com/majd/ipatool
license: MIT
desc:
  cn: 用于从 iOS App Store 搜索和下载应用程序包（称为 ipa 文件）的命令行工具
  en: Command-line tool that allows searching and downloading app packages (known as ipa files) from the iOS App Store
x:
  pkg:
    exist: true
  source: https://github.com/majd/ipatool
  eget: https://github.com/majd/ipatool
rule:
  /x:
    cmd: x pkg use ipatool
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget majd/ipatool
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew tap majd/repo && brew install ipatool
    reference: https://github.com/majd/ipatool?tab=readme-ov-file#package-manager-macos
  arch/yay:
    cmd: yay -S ipatool
    reference: https://aur.archlinux.org/packages/ipatool
binlist:
- ipatool

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
