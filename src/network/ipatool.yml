lang: Go
homepage: https://github.com/majd/ipatool
license: MIT
desc:
  cn: 用于从 iOS App Store 搜索和下载应用程序包（称为 ipa 文件）的命令行工具
  en: Command-line tool that allows searching and downloading app packages (known as ipa files) from the iOS App Store
x:
  source: https://github.com/majd/ipatool
  eget: https://github.com/majd/ipatool
  brew: ipatool
  yay: ipatool
rule:
  /x:
    cmd: x pkg use ipatool
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget majd/ipatool
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew tap majd/repo && brew install ipatool
    reference: https://github.com/majd/ipatool?tab=readme-ov-file#package-manager-macos
  arch/yay:
    cmd: yay -S ipatool
    reference: https://aur.archlinux.org/packages/ipatool
binlist:
- ipatool

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 安装 16 MB
            en: 16 MB install
        download:
          estimate: 16 MB
          desc:
            cn: 约 16 MB 下载 (linux/x64)
            en: ~16 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
