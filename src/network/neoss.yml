lang: TypeScript
homepage: https://github.com/PabloLec/neoss
license: BSD-3-Clause
desc:
  cn: 网络连接查看工具
  en: Network connection viewing tool
  cs: Nástroj pro zobrazení síťových připojení
  de: Tool zum Anzeigen von Netzwerkverbindungen
  es: Herramienta para ver conexiones de red
  fr: Outil de visualisation des connexions réseau
  id: Alat untuk melihat koneksi jaringan
  it: Strumento per visualizzare le connessioni di rete
  ja: ネットワーク接続を表示するツール
  ko: 네트워크 연결을 확인하는 도구
  pl: Narzędzie do przeglądania połączeń sieciowych
  pt: Ferramenta para visualizar conexões de rede
  ro: Instrument pentru vizualizarea conexiunilor de rețea
  ru: Инструмент для просмотра сетевых подключений
  th: เครื่องมือดูการเชื่อมต่อเครือข่าย
  tr: Ağ bağlantılarını görüntüleme aracı
  uk: Інструмент для перегляду мережевих з'єднань
  vi: Công cụ xem kết nối mạng
x:
  source: https://github.com/PabloLec/neoss
  yay: neoss
  npm: neoss
rule:
  /npm:
    cmd: npm install -g neoss
    reference: https://github.com/PabloLec/neoss?tab=readme-ov-file#installation
    dsnap: neoss
  arch/yay:
    cmd: yay -S neoss
    reference: https://aur.archlinux.org/packages/neoss
binlist:
- neoss

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
