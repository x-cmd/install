lang: TypeScript
homepage: https://github.com/PabloLec/neoss
license: BSD-3-Clause
desc:
  cn: 网络连接查看工具
  en: Network connection viewing tool
x:
  source: https://github.com/PabloLec/neoss
rule:
  /npm:
    cmd: npm install -g neoss
    reference: https://github.com/PabloLec/neoss?tab=readme-ov-file#installation
    dsnap: neoss
  arch/yay:
    cmd: yay -S neoss
    reference: https://aur.archlinux.org/packages/neoss
binlist:
- neoss

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
