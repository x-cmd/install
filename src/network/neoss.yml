lang: TypeScript
homepage: https://github.com/PabloLec/neoss
license: BSD-3-Clause
desc:
  cn: 网络连接查看工具
  en: Network connection viewing tool
x:
  source: https://github.com/PabloLec/neoss
rule:
  /npm:
    cmd: npm install -g neoss
    reference: https://github.com/PabloLec/neoss?tab=readme-ov-file#installation
    dsnap: neoss
  arch/yay:
    cmd: yay -S neoss
    reference: https://aur.archlinux.org/packages/neoss
binlist:
- neoss

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
