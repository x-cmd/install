lang: Python
homepage: https://github.com/ytdl-org/youtube-dl
license: Unlicense
desc:
  cn: 用于从 YouTube.com 和其他视频网站下载视频的命令行程序
  en: Command-line program to download videos from YouTube.com and other video sites
x:
  pkg:
    exist: true
  source: https://github.com/ytdl-org/youtube-dl
  eget: https://github.com/ytdl-org/youtube-dl
rule:
  /eget:
    cmd: x eget ytdl-org/youtube-dl
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use youtube-dl
    reference: https://x-cmd.com/install/
  /curl:
    cmd: 'sudo curl -L https://yt-dl.org/downloads/latest/youtube-dl -o /usr/local/bin/youtube-dl \

      && sudo chmod a+rx /usr/local/bin/youtube-dl

      '
    reference: https://github.com/ytdl-org/youtube-dl?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S youtube-dl
    reference: https://aur.archlinux.org/packages/youtube-dl
  /wget:
    cmd: 'sudo wget https://yt-dl.org/downloads/latest/youtube-dl -O /usr/local/bin/youtube-dl \

      && sudo chmod a+rx /usr/local/bin/youtube-dl

      '
    reference: https://github.com/ytdl-org/youtube-dl?tab=readme-ov-file#installation
  /pip:
    cmd: sudo -H pip install --upgrade youtube-dl
    reference: https://github.com/ytdl-org/youtube-dl?tab=readme-ov-file#installation
    dsnap: youtube-dl
  darwin/brew:
    cmd: brew install youtube-dl
    reference: https://github.com/ytdl-org/youtube-dl?tab=readme-ov-file#installation
  darwin/port:
    cmd: sudo port install youtube-dl
    reference: https://github.com/ytdl-org/youtube-dl?tab=readme-ov-file#installation
binlist:
- youtube-dl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
