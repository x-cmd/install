lang: Go
homepage: https://github.com/nxtrace/NTrace-core
license: GPL-3.0
desc:
  cn: NextTrace - 开源可视化路线跟踪 CLI 工具
  en: NextTrace, an open source visual route tracking CLI tool
  cs: NextTrace, open source CLI nástroj pro vizuální trasování tras
  de: NextTrace, ein quelloffenes CLI-Werkzeug zur visuellen Routenverfolgung
  es: NextTrace, una herramienta CLI de código abierto para el seguimiento visual de rutas
  fr: NextTrace, un outil CLI open source de suivi visuel des routes
  id: NextTrace, alat CLI sumber terbuka untuk pelacakan rute visual
  it: NextTrace, uno strumento CLI open source per il tracciamento visuale delle rotte
  ja: NextTrace、可視化ルート追跡を行うオープンソースの CLI ツール
  ko: NextTrace, 시각적 경로 추적을 위한 오픈 소스 CLI 도구
  pl: NextTrace, otwartoźródłowe narzędzie CLI do wizualnego śledzenia tras
  pt: NextTrace, uma ferramenta CLI de código aberto para rastreamento visual de rotas
  ro: NextTrace, un instrument CLI open source pentru urmărirea vizuală a rutelor
  ru: NextTrace — CLI-инструмент с открытым исходным кодом для визуального отслеживания маршрутов
  th: NextTrace เครื่องมือ CLI โอเพนซอร์สสำหรับติดตามเส้นทางแบบภาพ
  tr: NextTrace, görsel rota izleme için açık kaynaklı bir CLI aracı
  uk: NextTrace — CLI-інструмент з відкритим кодом для візуального відстеження маршрутів
  vi: NextTrace, công cụ CLI mã nguồn mở để theo dõi tuyến đường trực quan
x:
  source: https://github.com/nxtrace/NTrace-core
  eget: nxtrace/NTrace-core
  apt: nexttrace
  brew: nexttrace
  scoop: extras/nexttrace
  yay: nexttrace-bin
  go: github.com/nxtrace/NTrace-core@latest
rule:
  /x:
    cmd: x pkg use nexttrace
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget nxtrace/NTrace-core
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/nxtrace/NTrace-core@latest
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#manual-install
    dsnap: github.com/nxtrace/NTrace-core
  linux/curl:
    cmd: curl nxtrace.org/nt |bash
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
  arch/yay:
    cmd: yay -S nexttrace-bin
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
  (ubuntu|debian)/apt:
    cmd: apt install nexttrace
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
  /brew:
    cmd: brew install nexttrace
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
  (win|wsl2)/scoop:
    cmd: scoop bucket add extras && scoop install extras/nexttrace
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
binlist:
- nexttrace

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
