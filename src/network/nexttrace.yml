lang: Go
homepage: https://github.com/nxtrace/NTrace-core
license: GPL-3.0
desc:
  cn: NextTrace - 开源可视化路线跟踪 CLI 工具
  en: NextTrace, an open source visual route tracking CLI tool
x:
  pkg:
    exist: true
  source: https://github.com/nxtrace/NTrace-core
  eget: https://github.com/nxtrace/NTrace-core
rule:
  /x:
    cmd: x pkg use nexttrace
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget nxtrace/NTrace-core
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/nxtrace/NTrace-core@latest
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#manual-install
    dsnap: github.com/nxtrace/NTrace-core
  linux/curl:
    cmd: curl nxtrace.org/nt |bash
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
  arch/yay:
    cmd: yay -S nexttrace-bin
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
  (ubuntu|debian)/apt:
    cmd: apt install nexttrace
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
  /brew:
    cmd: brew install nexttrace
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
  (win|wsl2)/scoop:
    cmd: scoop bucket add extras && scoop install extras/nexttrace
    reference: https://github.com/nxtrace/NTrace-core?tab=readme-ov-file#automated-install
binlist:
- nexttrace

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
