lang: 'Rust'
homepage: 'https://github.com/pranav-cs-1/nexus'
license: 'MIT'
desc:
  cn: 终端版 HTTP 客户端，支持 REST 与 gRPC API
  en: 'A terminal-based HTTP client for REST and gRPC APIs'
x:
  source: https://github.com/pranav-cs-1/nexus
  eget: https://github.com/pranav-cs-1/nexus
rule:
  /eget:
    cmd: x eget pranav-cs-1/nexus
    reference: https://github.com/pranav-cs-1/nexus
binlist:
  - 'nexus'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 292 KB
          rating: 1
          desc:
            cn: 约 292 KB（估算）
            en: ~292 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
