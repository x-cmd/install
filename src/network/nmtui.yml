lang: C
homepage: https://gitlab.freedesktop.org/NetworkManager/NetworkManager
desc:
  cn: NetworkManager 是标准的 Linux 网络配置工具套件。
  en: NetworkManager is the standard Linux network configuration tool suite.
  cs: NetworkManager je standardní sada nástrojů pro konfiguraci sítě v Linuxu.
  de: NetworkManager ist die Standard-Toolsuite zur Linux-Netzwerkkonfiguration.
  es: NetworkManager es el conjunto de herramientas estándar de configuración de red en Linux.
  fr: NetworkManager est la suite d'outils standard de configuration réseau pour Linux.
  id: NetworkManager adalah rangkaian alat konfigurasi jaringan Linux standar.
  it: NetworkManager è la suite di strumenti standard per la configurazione di rete su Linux.
  ja: NetworkManager は Linux の標準的なネットワーク設定ツール群です。
  ko: NetworkManager는 Linux의 표준 네트워크 구성 도구 모음입니다.
  pl: NetworkManager to standardowy zestaw narzędzi do konfiguracji sieci w systemie Linux.
  pt: O NetworkManager é o conjunto padrão de ferramentas de configuração de rede no Linux.
  ro: NetworkManager este suita standard de instrumente pentru configurarea rețelei în Linux.
  ru: NetworkManager — стандартный набор инструментов для настройки сети в Linux.
  th: NetworkManager คือชุดเครื่องมือกำหนดค่าเครือข่ายมาตรฐานของ Linux
  tr: NetworkManager, Linux için standart ağ yapılandırma araç setidir.
  uk: NetworkManager — стандартний набір інструментів для налаштування мережі в Linux.
  vi: NetworkManager là bộ công cụ cấu hình mạng tiêu chuẩn của Linux.
rule:
  debian/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
    dsnap: network-manager
  ubuntu/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
    dsnap: network-manager
  kali/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
    dsnap: network-manager
  raspbian/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
  mint/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
  alpine/apk:
    cmd: apk add networkmanager
    reference: https://command-not-found.com/nmtui
    dsnap: networkmanager
  arch/pacman:
    cmd: sudo pacman -S networkmanager
    reference: https://command-not-found.com/nmtui
  fedora/dnf:
    cmd: sudo dnf install NetworkManager-tui-1
    reference: https://command-not-found.com/nmtui
    dsnap: NetworkManager-tui-1

x:
  apt: network-manager
  apt-get: network-manager
  dnf: NetworkManager-tui-1
  pacman: networkmanager
  apk: networkmanager
binlist:
- nmtui
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
