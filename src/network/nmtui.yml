lang: C
homepage: https://gitlab.freedesktop.org/NetworkManager/NetworkManager
desc:
  cn: NetworkManager 是标准的 Linux 网络配置工具套件。
  en: NetworkManager is the standard Linux network configuration tool suite.
rule:
  debian/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
    dsnap: network-manager
  ubuntu/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
    dsnap: network-manager
  kali/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
    dsnap: network-manager
  raspbian/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
  mint/apt:
    cmd: sudo apt-get install network-manager
    reference: https://command-not-found.com/nmtui
  alpine/apk:
    cmd: apk add networkmanager
    reference: https://command-not-found.com/nmtui
    dsnap: networkmanager
  arch/pacman:
    cmd: sudo pacman -S networkmanager
    reference: https://command-not-found.com/nmtui
  fedora/dnf:
    cmd: sudo dnf install NetworkManager-tui-1
    reference: https://command-not-found.com/nmtui
    dsnap: NetworkManager-tui-1
binlist:
- nmtui
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
