  ubuntu/apt:
    cmd: sudo apt-get install wavemon
    reference: https://command-not-found.com/wavemon
    dsnap: wavemon
  kali/apt:
    cmd: sudo apt-get install wavemon
    reference: https://command-not-found.com/wavemon
    dsnap: wavemon
  raspbian/apt:
    cmd: sudo apt-get install wavemon
    reference: https://command-not-found.com/wavemon
  mint/apt:
    cmd: sudo apt-get install wavemon
    reference: https://command-not-found.com/wavemon
  alpine/apk:
    cmd: apk add wavemon
    reference: https://command-not-found.com/wavemon
    dsnap: wavemon
  arch/pacman:
    cmd: sudo pacman -S wavemon
    reference: https://command-not-found.com/wavemon
  arch/yay:
