desc:
  cn: wavemon 是一个基于 ncurses 的 Linux 无线网络设备监控应用程序。
  en: wavemon is an ncurses-based monitoring application for wireless network devices on Linux.
x:
  source: https://github.com/uoaerg/wavemon
rule:
  opensuse/zypper:
    cmd: sudo zypper install wavemon
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=wavemon
  debian/apt:
    cmd: sudo apt-get install wavemon
    reference: https://command-not-found.com/wavemon
