lang: Go
homepage: https://github.com/purpleclay/dns53
license: MIT
desc:
  cn: Amazon Route53 中的动态 DNS。快速、轻松、私密地公开您的 EC2。
  en: Dynamic DNS within Amazon Route53. Expose your EC2 quickly, easily and privately.
  cs: Dynamické DNS v rámci Amazon Route53. Odhalte svou EC2 rychle, snadno a soukromě.
  de: Dynamisches DNS innerhalb von Amazon Route53. Machen Sie Ihre EC2 schnell, einfach und privat zugänglich.
  es: DNS dinámico dentro de Amazon Route53. Exponga su EC2 de forma rápida, fácil y privada.
  fr: DNS dynamique au sein d'Amazon Route53. Exposez votre EC2 rapidement, facilement et en toute confidentialité.
  id: DNS dinamis dalam Amazon Route53. Expose EC2 Anda dengan cepat, mudah, dan secara privat.
  it: DNS dinamico all'interno di Amazon Route53. Espone la tua EC2 in modo rapido, semplice e privato.
  ja: Amazon Route53 内の動的 DNS です。EC2 を迅速かつ簡単、そしてプライベートに公開できます。
  ko: Amazon Route53 안의 동적 DNS입니다. EC2를 빠르고 간편하게 비공개로 노출하세요.
  pl: Dynamiczny DNS w ramach Amazon Route53. Udostępnij swoją instancję EC2 szybko, łatwo i prywatnie.
  pt: DNS dinâmico dentro do Amazon Route53. Exponha sua EC2 de forma rápida, fácil e privada.
  ro: DNS dinamic în Amazon Route53. Expuneți-vă EC2 rapid, ușor și în mod privat.
  ru: Динамический DNS в Amazon Route53. Быстро, просто и конфиденциально откройте свой EC2.
  th: DNS แบบไดนามิกใน Amazon Route53 เปิดเผย EC2 ของคุณได้อย่างรวดเร็ว ง่ายดาย และเป็นการส่วนตัว.
  tr: Amazon Route53 içinde dinamik DNS. EC2 makinenizi hızlı, kolay ve gizli bir şekilde yayınlayın.
  uk: Динамічний DNS в Amazon Route53. Швидко, просто та конфіденційно відкрийте свій EC2.
  vi: DNS động trong Amazon Route53. Công khai EC2 của bạn nhanh chóng, dễ dàng và riêng tư.
x:
  source: https://github.com/purpleclay/dns53
  eget: purpleclay/dns53
  brew: purpleclay/tap/dns53
  scoop: dns53
  yay: dns53-bin
  go: github.com/purpleclay/dns53@latest
rule:
  /eget:
    cmd: x eget purpleclay/dns53
    reference: https://x-cmd.com/mod/eget
  ubuntu/apt:
    cmd: 'echo ''deb [trusted=yes] https://fury.purpleclay.dev/apt/ /'' | sudo tee /etc/apt/sources.list.d/purpleclay.list \

      && sudo apt update \

      && sudo apt install -y dns53

      '
    reference: https://docs.purpleclay.dev/dns53/install/binary/#apt
    dsnap: dns53
  /curl:
    cmd: curl https://raw.githubusercontent.com/purpleclay/dns53/main/scripts/install | bash
    reference: https://docs.purpleclay.dev/dns53/install/binary/#bash-script
  arch/yay:
    cmd: yay -S dns53-bin
    reference: https://docs.purpleclay.dev/dns53/install/binary/#aur
  darwin/brew:
    cmd: brew install purpleclay/tap/dns53
    reference: https://docs.purpleclay.dev/dns53/install/binary/#homebrew
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add purpleclay https://github.com/purpleclay/scoop-bucket.git \

      && x scoop install dns53

      '
    reference: https://docs.purpleclay.dev/dns53/install/binary/#scoop
  /go:
    cmd: go install github.com/purpleclay/dns53@latest
    reference: https://docs.purpleclay.dev/dns53/install/binary/#go-install
    dsnap: dns53
binlist:
- dns53

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
