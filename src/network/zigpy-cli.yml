lang: Python
homepage: https://github.com/zigpy/zigpy-cli
license: GPL-3.0
desc:
  cn: zigpy 的命令行界面
  en: Command line interface for zigpy
x:
  source: https://github.com/zigpy/zigpy-cli
rule:
  /pip:
    cmd: pip install zigpy-cli
    reference: https://github.com/zigpy/zigpy-cli?tab=readme-ov-file#installation
    dsnap: zigpy-cli
binlist:
- zigpy-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
