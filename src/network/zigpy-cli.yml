lang: Python
homepage: https://github.com/zigpy/zigpy-cli
license: GPL-3.0
desc:
  cn: zigpy 的命令行界面
  en: Command line interface for zigpy
x:
  source: https://github.com/zigpy/zigpy-cli
rule:
  /pip:
    cmd: pip install zigpy-cli
    reference: https://github.com/zigpy/zigpy-cli?tab=readme-ov-file#installation
    dsnap: zigpy-cli
binlist:
- zigpy-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
