lang: 'Go'
homepage: 'https://github.com/ramonvermeulen/whosthere'
license: 'Apache-2.0'
desc:
  cn: Go 编写的局域网发现工具，带交互式 TUI
  en: 'Local Area Network discovery tool with an interactive Terminal User Interface (TUI) written in Go. Discover, explore, and understand your LAN in an intuitive way. Knock Knock.. who''s there? 🚪'
x:
  source: https://github.com/ramonvermeulen/whosthere
  eget: https://github.com/ramonvermeulen/whosthere
rule:
  /eget:
    cmd: x eget ramonvermeulen/whosthere
    reference: https://github.com/ramonvermeulen/whosthere
binlist:
  - 'whosthere'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
