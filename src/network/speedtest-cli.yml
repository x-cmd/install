lang: Python
homepage: https://github.com/sivel/speedtest-cli
license: Apache-2.0
desc:
  cn: 使用 speedtest.net 测试互联网带宽的命令行界面
  en: Command line interface for testing internet bandwidth using speedtest.net
  cs: Příkazová řádka pro testování šířky pásma internetu pomocí speedtest.net
  de: Kommandozeilenoberfläche zum Testen der Internetbandbreite mit speedtest.net
  es: Interfaz de línea de comandos para probar el ancho de banda de internet usando speedtest.net
  fr: Interface en ligne de commande pour tester la bande passante Internet avec speedtest.net
  id: Antarmuka baris perintah untuk menguji bandwidth internet menggunakan speedtest.net
  it: Interfaccia a riga di comando per testare la banda larga internet usando speedtest.net
  ja: speedtest.net を使ってインターネット帯域をテストするコマンドラインインターフェース
  ko: speedtest.net을 사용하여 인터넷 대역폭을 테스트하는 명령줄 인터페이스
  pl: Interfejs wiersza poleceń do testowania przepustowości internetu za pomocą speedtest.net
  pt: Interface de linha de comando para testar a largura de banda da internet usando speedtest.net
  ro: Interfață din linia de comandă pentru testarea lățimii de bandă a internetului folosind speedtest.net
  ru: Интерфейс командной строки для проверки пропускной способности интернета с помощью speedtest.net
  th: ส่วนติดต่อบรรทัดคำสั่งสำหรับทดสอบแบนด์วิธอินเทอร์เน็ตโดยใช้ speedtest.net
  tr: speedtest.net kullanarak internet bant genişliğini test etmek için komut satırı arayüzü
  uk: Інтерфейс командного рядка для перевірки пропускної здатності інтернету за допомогою speedtest.net
  vi: Giao diện dòng lệnh để kiểm tra băng thông internet bằng speedtest.net
x:
  source: https://github.com/sivel/speedtest-cli
  apt: speedtest-cli
  dnf: speedtest-cli
  brew: speedtest-cli
  pacman: speedtest-cli
  apk: speedtest-cli
  apt-get: speedtest-cli
  choco: speedtest-cli
  yay: speedtest-cli-git
  pip: speedtest-cli
rule:
  /x:
    cmd: x pkg use speedtest-cli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install speedtest-cli
    reference: https://speedtest-cli.readthedocs.io/en/latest/welcome.html#install-from-source
    dsnap: speedtest-cli
  darwin/brew:
    cmd: brew install speedtest-cli
    reference: https://formulae.brew.sh/formula/speedtest-cli#default
  debian/apt:
    cmd: sudo apt install speedtest-cli
    reference: https://command-not-found.com/speedtest-cli
    dsnap: speedtest-cli
  ubuntu/apt:
    cmd: sudo apt install speedtest-cli
    reference: https://command-not-found.com/speedtest-cli
    dsnap: speedtest-cli
  alpine/apk:
    cmd: sudo apk add speedtest-cli
    reference: https://command-not-found.com/speedtest-cli
    dsnap: speedtest-cli
  arch/pacman:
    cmd: sudo pacman -S speedtest-cli
    reference: https://command-not-found.com/speedtest-cli
  arch/yay:
    cmd: yay -S speedtest-cli-git
    reference: https://aur.archlinux.org/packages/speedtest-cli-git
  kali/apt:
    cmd: sudo apt-get install speedtest-cli
    reference: https://command-not-found.com/speedtest-cli
    dsnap: speedtest-cli
  fedora/dnf:
    cmd: sudo dnf install speedtest-cli
    reference: https://command-not-found.com/speedtest-cli
    dsnap: speedtest-cli
  raspbian/apt:
    cmd: sudo apt-get install speedtest-cli
    reference: https://command-not-found.com/speedtest-cli
  (win|wsl2)/choco:
    cmd: x choco install speedtest-cli
    reference: https://speedtest-cli.readthedocs.io/en/latest/welcome.html#chocolatey
  /easy_install:
    cmd: easy_install speedtest-cli
    reference: https://github.com/sivel/speedtest-cli#installation
  /wget:
    cmd: 'wget -O speedtest-cli https://raw.githubusercontent.com/sivel/speedtest-cli/master/speedtest.py \

      && chmod +x speedtest-cli

      '
    reference: https://github.com/sivel/speedtest-cli#just-download-like-the-way-it-used-to-be
  /curl:
    cmd: 'curl -Lo speedtest-cli https://raw.githubusercontent.com/sivel/speedtest-cli/master/speedtest.py \

      && chmod +x speedtest-cli

      '
    reference: https://github.com/sivel/speedtest-cli#just-download-like-the-way-it-used-to-be
binlist:
- speedtest-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
