lang: Shell
homepage: https://github.com/txthinking/google-hosts
license: MIT
desc:
  cn: 谷歌主机生成器
  en: Google hosts generator
x:
  source: https://github.com/txthinking/google-hosts
rule:
  /git:
    cmd: git clone https://github.com/txthinking/google-hosts.git
    reference: https://github.com/txthinking/google-hosts/blob/master/scripts/README.md
binlist:
- google-hosts

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
