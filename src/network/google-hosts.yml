lang: Shell
homepage: https://github.com/txthinking/google-hosts
license: MIT
desc:
  cn: 谷歌主机生成器
  en: Google hosts generator
x:
  source: https://github.com/txthinking/google-hosts
rule:
  /git:
    cmd: git clone https://github.com/txthinking/google-hosts.git
    reference: https://github.com/txthinking/google-hosts/blob/master/scripts/README.md
binlist:
- google-hosts

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
