lang: Shell
homepage: https://github.com/txthinking/google-hosts
license: MIT
desc:
  cn: 谷歌主机生成器
  en: Google hosts generator
  cs: Generátor hostů Google
  de: Google-Hosts-Generator
  es: Generador de hosts de Google
  fr: Générateur de fichiers hosts Google
  id: Pembuat hosts Google
  it: Generatore di hosts per Google
  ja: Google ホストのジェネレーター
  ko: Google 호스트 생성기
  pl: Generator plików hosts Google
  pt: Gerador de hosts do Google
  ro: Generator de hosts Google
  ru: Генератор хостов Google
  th: ตัวสร้างไฟล์ hosts ของ Google
  tr: Google hosts oluşturucu
  uk: Генератор хостів Google
  vi: Trình tạo hosts cho Google
x:
  source: https://github.com/txthinking/google-hosts
rule:
  /git:
    cmd: git clone https://github.com/txthinking/google-hosts.git
    reference: https://github.com/txthinking/google-hosts/blob/master/scripts/README.md
binlist:
- google-hosts

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
