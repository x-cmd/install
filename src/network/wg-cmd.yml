lang: Go
homepage: https://github.com/AndrianBdn/wg-cmd
license: MIT
desc:
  cn: TUI 用于管理 WireGuard 配置文件。
  en: TUI for managing WireGuard configuration files
x:
  source: https://github.com/AndrianBdn/wg-cmd
rule:
  linux-x64/curl:
    cmd: curl -SL https://github.com/andrianbdn/wg-cmd/releases/download/v0.1.6/wg-cmd-0.1.6-linux-amd64 -o /usr/local/bin/wg-cmd
    reference: https://github.com/AndrianBdn/wg-cmd?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S wg-cmd
    reference: https://aur.archlinux.org/packages/wg-cmd
  linux-xarm64/curl:
    cmd: curl -SL https://github.com/andrianbdn/wg-cmd/releases/download/v0.1.6/wg-cmd-0.1.6-linux-arm64 -o /usr/local/bin/wg-cmd
    reference: https://github.com/AndrianBdn/wg-cmd?tab=readme-ov-file#installation
binlist:
- wg-cmd

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 295 KB
          rating: 1
          desc:
            cn: 约 295 KB（估算）
            en: ~295 KB estimated
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
