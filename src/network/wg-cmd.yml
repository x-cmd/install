lang: Go
homepage: https://github.com/AndrianBdn/wg-cmd
license: MIT
desc:
  cn: TUI 用于管理 WireGuard 配置文件。
  en: TUI for managing WireGuard configuration files
  cs: TUI pro správu konfiguračních souborů WireGuard
  de: TUI zur Verwaltung von WireGuard-Konfigurationsdateien
  es: TUI para gestionar archivos de configuración de WireGuard
  fr: TUI pour gérer les fichiers de configuration WireGuard
  id: TUI untuk mengelola berkas konfigurasi WireGuard
  it: TUI per gestire i file di configurazione di WireGuard
  ja: WireGuard の設定ファイルを管理するための TUI
  ko: WireGuard 설정 파일을 관리하는 TUI
  pl: TUI do zarządzania plikami konfiguracyjnymi WireGuard
  pt: TUI para gerenciar arquivos de configuração do WireGuard
  ro: TUI pentru gestionarea fișierelor de configurare WireGuard
  ru: TUI для управления конфигурационными файлами WireGuard
  th: TUI สำหรับจัดการไฟล์การตั้งค่า WireGuard
  tr: WireGuard yapılandırma dosyalarını yönetmek için TUI
  uk: TUI для керування конфігураційними файлами WireGuard
  vi: TUI để quản lý các tệp cấu hình WireGuard
x:
  source: https://github.com/AndrianBdn/wg-cmd
  yay: wg-cmd
rule:
  linux-x64/curl:
    cmd: curl -SL https://github.com/andrianbdn/wg-cmd/releases/download/v0.1.6/wg-cmd-0.1.6-linux-amd64 -o /usr/local/bin/wg-cmd
    reference: https://github.com/AndrianBdn/wg-cmd?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S wg-cmd
    reference: https://aur.archlinux.org/packages/wg-cmd
  linux-xarm64/curl:
    cmd: curl -SL https://github.com/andrianbdn/wg-cmd/releases/download/v0.1.6/wg-cmd-0.1.6-linux-arm64 -o /usr/local/bin/wg-cmd
    reference: https://github.com/AndrianBdn/wg-cmd?tab=readme-ov-file#installation
binlist:
- wg-cmd

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
