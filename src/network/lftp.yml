lang: C++
homepage: https://github.com/lavv17/lftp
license: GPL-3.0
desc:
  en: LFTP is a sophisticated file transfer program supporting a number of network protocols (ftp, http, sftp, fish, torrent)
  cn: LFTP 是一个复杂的文件传输程序，支持许多网络协议(ftp、 http、 sftp、 fish、 torrent)
x:
  source: https://github.com/lavv17/lftp
  eget: https://github.com/lavv17/lftp
rule:
  /eget:
    cmd: x eget lavv17/lftp
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S lftp-git
    reference: https://aur.archlinux.org/packages/lftp-git
  darwin/brew:
    cmd: brew install lftp
    reference: https://formulae.brew.sh/formula/lftp#default
  (win|wsl2)/scoop:
    cmd: x scoop install main/lftp
    reference: https://scoop.sh/#/apps?q=lftp
binlist:
- lftp

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
