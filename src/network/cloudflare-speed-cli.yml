lang: 'Rust'
homepage: 'https://github.com/kavehtehrani/cloudflare-speed-cli'
license: 'GPL-3.0'
desc:
  cn: 通过 Cloudflare 进行网络测速的 CLI
  en: 'CLI for internet speed test via cloudflare'
  cs: CLI pro test rychlosti internetu přes cloudflare
  de: CLI für einen Internetgeschwindigkeitstest über cloudflare
  es: CLI para probar la velocidad de internet a través de cloudflare
  fr: CLI pour tester la vitesse d'Internet via cloudflare
  id: CLI untuk menguji kecepatan internet melalui cloudflare
  it: CLI per il test di velocità della connessione internet tramite cloudflare
  ja: cloudflare 経由のインターネット速度テスト用 CLI
  ko: cloudflare를 통한 인터넷 속도 테스트 CLI
  pl: CLI do testu prędkości internetu przez cloudflare
  pt: CLI para testar a velocidade da internet via cloudflare
  ro: CLI pentru testarea vitezei internetului prin cloudflare
  ru: CLI для тестирования скорости интернета через cloudflare
  th: CLI สำหรับทดสอบความเร็วอินเทอร์เน็ตผ่าน cloudflare
  tr: cloudflare üzerinden internet hız testi için CLI
  uk: CLI для тестування швидкості інтернету через cloudflare
  vi: CLI để kiểm tra tốc độ internet qua cloudflare
x:
  source: https://github.com/kavehtehrani/cloudflare-speed-cli
  eget: kavehtehrani/cloudflare-speed-cli
rule:
  /eget:
    cmd: x eget kavehtehrani/cloudflare-speed-cli
    reference: https://github.com/kavehtehrani/cloudflare-speed-cli
binlist:
- 'cloudflare-speed-cli'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
