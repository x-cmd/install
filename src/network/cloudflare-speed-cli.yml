lang: 'Rust'
homepage: 'https://github.com/kavehtehrani/cloudflare-speed-cli'
license: 'GPL-3.0'
desc:
  cn: 通过 Cloudflare 进行网络测速的 CLI
  en: 'CLI for internet speed test via cloudflare'
x:
  source: https://github.com/kavehtehrani/cloudflare-speed-cli
  eget: https://github.com/kavehtehrani/cloudflare-speed-cli
rule:
  /eget:
    cmd: x eget kavehtehrani/cloudflare-speed-cli
    reference: https://github.com/kavehtehrani/cloudflare-speed-cli
binlist:
- 'cloudflare-speed-cli'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
