lang: 'Rust'
homepage: https://github.com/Lissy93/AdGuardian-Term
license: 'MIT'
desc:
  cn: 面向 AdGuard Home 实例的终端实时流量监控与统计工具
  en: '🛡️ Terminal-based, real-time traffic monitoring and statistics for your AdGuard Home instance'
x:
  source: https://github.com/Lissy93/AdGuardian-Term
  eget: https://github.com/Lissy93/AdGuardian-Term
rule:
  /eget:
    cmd: x eget Lissy93/AdGuardian-Term
    reference: https://github.com/Lissy93/AdGuardian-Term
binlist:
- 'adguardian-term'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (macos/x64)
            en: ~7 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
