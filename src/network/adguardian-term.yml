lang: 'Rust'
homepage: https://github.com/Lissy93/AdGuardian-Term
license: 'MIT'
desc:
  cn: 面向 AdGuard Home 实例的终端实时流量监控与统计工具
  en: '🛡️ Terminal-based, real-time traffic monitoring and statistics for your AdGuard Home instance'
x:
  source: https://github.com/Lissy93/AdGuardian-Term
  eget: https://github.com/Lissy93/AdGuardian-Term
rule:
  /eget:
    cmd: x eget Lissy93/AdGuardian-Term
    reference: https://github.com/Lissy93/AdGuardian-Term
binlist:
  - 'adguardian-term'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 56 KB
          rating: 1
          desc:
            cn: 约 56 KB（估算）
            en: ~56 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
