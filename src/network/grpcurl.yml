lang: Go
homepage: https://github.com/fullstorydev/grpcurl
license: MIT
desc:
  cn: grpcurl 是一个命令行工具，可让您与 gRPC 服务器交互
  en: grpcurl is a command-line tool that lets you interact with gRPC servers
x:
  source: https://github.com/fullstorydev/grpcurl
  eget: fullstorydev/grpcurl
  dnf: grpcurl
  brew: grpcurl
  yay: grpcurl-bin
  asdf: grpcurl
rule:
  /x:
    cmd: x pkg use grpcurl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget fullstorydev/grpcurl
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use grpcurl
    reference: https://github.com/asdf-community/asdf-grpcurl
  darwin/brew:
    cmd: brew install grpcurl
    reference: https://github.com/fullstorydev/grpcurl?tab=readme-ov-file#homebrew-macos
  arch/yay:
    cmd: yay -S grpcurl-bin
    reference: https://aur.archlinux.org/packages/grpcurl-bin
  fedora/dnf:
    cmd: sudo dnf install grpcurl
    reference: https://repology.org/project/grpcurl/information
binlist:
- grpcurl

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
