lang: Python
homepage: https://github.com/achillean/shodan-python
desc:
  cn: Shodan 是一个针对互联网连接设备的搜索引擎
  en: Shodan is a search engine for Internet-connected devices
x:
  pkg:
    exist: true
  source: https://github.com/achillean/shodan-python
rule:
  /x:
    cmd: x pkg use shodan
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install shodan
    reference: https://github.com/achillean/shodan-python?tab=readme-ov-file#installation
    dsnap: shodan
  /easy_install:
    cmd: easy_install shodan
    reference: https://github.com/achillean/shodan-python?tab=readme-ov-file#installation
binlist:
- shodan
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
