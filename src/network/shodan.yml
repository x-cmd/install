lang: Python
homepage: https://github.com/achillean/shodan-python
desc:
  cn: Shodan 是一个针对互联网连接设备的搜索引擎
  en: Shodan is a search engine for Internet-connected devices
x:
  source: https://github.com/achillean/shodan-python
  pip: shodan
rule:
  /x:
    cmd: x pkg use shodan
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install shodan
    reference: https://github.com/achillean/shodan-python?tab=readme-ov-file#installation
    dsnap: shodan
  /easy_install:
    cmd: easy_install shodan
    reference: https://github.com/achillean/shodan-python?tab=readme-ov-file#installation
binlist:
- shodan
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
