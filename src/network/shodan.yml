lang: Python
homepage: https://github.com/achillean/shodan-python
desc:
  cn: Shodan 是一个针对互联网连接设备的搜索引擎
  en: Shodan is a search engine for Internet-connected devices
x:
  pkg:
    exist: true
  source: https://github.com/achillean/shodan-python
rule:
  /x:
    cmd: x pkg use shodan
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install shodan
    reference: https://github.com/achillean/shodan-python?tab=readme-ov-file#installation
    dsnap: shodan
  /easy_install:
    cmd: easy_install shodan
    reference: https://github.com/achillean/shodan-python?tab=readme-ov-file#installation
binlist:
- shodan
license: NOASSERTION
