lang: Rust
homepage: https://github.com/orf/gping
license: MIT
desc:
  cn: Ping，但有图表
  en: Ping, but with graphs
x:
  pkg:
    exist: true
  source: https://github.com/orf/gping
  eget: https://github.com/orf/gping
rule:
  /x:
    cmd: x pkg use gping
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget orf/gping
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  darwin/port:
    cmd: sudo port install gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  (win|wsl2)/scoop:
    cmd: x scoop install gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  (win|wsl2)/choco:
    cmd: x choco install gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  fedora/dnf:
    cmd: sudo dnf copr enable atim/gping -y && sudo dnf install gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  /cargo:
    cmd: cargo install gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
    dsnap: gping
  arch/pacman:
    cmd: sudo pacman -S gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  arch/yay:
    cmd: yay -S gping-git
    reference: https://aur.archlinux.org/packages/gping-git
  alpine/apk:
    cmd: sudo apk add gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  ubuntu/apt:
    cmd: sudo apt install gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  debian/apt:
    cmd: sudo apt install gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  gentoo/emerge:
    cmd: 'sudo eselect repository enable dm9pZCAq \

      && sudo emerge --sync dm9pZCAq \

      && sudo emerge net-misc/gping::dm9pZCAq

      '
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  freebsd/pkg:
    cmd: pkg install gping
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
  freebsd/ports:
    cmd: cd /usr/ports/net-mgmt/gping && make install clean
    reference: https://github.com/orf/gping?tab=readme-ov-file#install-cd
binlist:
- gping

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
