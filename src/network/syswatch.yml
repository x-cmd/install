lang: 'Rust'
homepage: https://github.com/matthart1983/syswatch
license: 'MIT'
desc:
  cn: 单机系统诊断 TUI，netwatch 的姊妹工具，十二标签页与英文洞察
  en: 'Single-host system diagnostics TUI. Sibling to netwatch. Twelve tabs, plain-English insights, session scrubber. macOS + Linux.'
x:
  source: https://github.com/matthart1983/syswatch
  eget: https://github.com/matthart1983/syswatch
rule:
  /eget:
    cmd: x eget matthart1983/syswatch
    reference: https://github.com/matthart1983/syswatch
binlist:
- 'syswatch'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
