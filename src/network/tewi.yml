lang: Python
homepage: https://github.com/anlar/tewi
license: GPL-3.0
desc:
  cn: 基于文本的 Transmission BitTorrent 守护进程界面。
  en: Text-based interface for the Transmission BitTorrent daemon.
x:
  source: https://github.com/anlar/tewi
rule:
  /pip:
    cmd: pip install tewi-transmission
    reference: https://github.com/anlar/tewi#installation
    dsnap: tewi-transmission
  /pipx:
    cmd: pipx install tewi-transmission
    reference: https://github.com/anlar/tewi#installation
binlist:
- tewi

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
