lang: Python
homepage: https://github.com/anlar/tewi
license: GPL-3.0
desc:
  cn: 基于文本的 Transmission BitTorrent 守护进程界面。
  en: Text-based interface for the Transmission BitTorrent daemon.
  cs: Textové rozhraní pro daemon Transmission BitTorrent.
  de: Textbasierte Oberfläche für den Transmission-BitTorrent-Daemon.
  es: Interfaz basada en texto para el demonio de BitTorrent Transmission.
  fr: Interface en mode texte pour le démon BitTorrent Transmission.
  id: Antarmuka berbasis teks untuk daemon BitTorrent Transmission.
  it: Interfaccia basata su testo per il demone BitTorrent Transmission.
  ja: Transmission BitTorrent デーモンのためのテキストベースのインターフェース。
  ko: Transmission BitTorrent 데몬을 위한 텍스트 기반 인터페이스.
  pl: Interfejs tekstowy dla demona Transmission BitTorrent.
  pt: Interface baseada em texto para o daemon BitTorrent Transmission.
  ro: Interfață bazată pe text pentru daemonul BitTorrent Transmission.
  ru: Текстовый интерфейс для демона Transmission BitTorrent.
  th: ส่วนติดต่อผู้ใช้แบบข้อความสำหรับ daemon ของ Transmission BitTorrent.
  tr: Transmission BitTorrent arka plan süreci için metin tabanlı arayüz.
  uk: Текстовий інтерфейс для демона Transmission BitTorrent.
  vi: Giao diện dựa trên văn bản cho tiến trình nền Transmission BitTorrent.
x:
  source: https://github.com/anlar/tewi
  pip: tewi-transmission
rule:
  /pip:
    cmd: pip install tewi-transmission
    reference: https://github.com/anlar/tewi#installation
    dsnap: tewi-transmission
  /pipx:
    cmd: pipx install tewi-transmission
    reference: https://github.com/anlar/tewi#installation
binlist:
- tewi

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 KB
          rating: 1
          desc:
            cn: 约 30 KB（估算）
            en: ~30 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
