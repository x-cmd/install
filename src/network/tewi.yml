lang: Python
homepage: https://github.com/anlar/tewi
license: GPL-3.0
desc:
  cn: 基于文本的 Transmission BitTorrent 守护进程界面。
  en: Text-based interface for the Transmission BitTorrent daemon.
x:
  source: https://github.com/anlar/tewi
rule:
  /pip:
    cmd: pip install tewi-transmission
    reference: https://github.com/anlar/tewi#installation
    dsnap: tewi-transmission
  /pipx:
    cmd: pipx install tewi-transmission
    reference: https://github.com/anlar/tewi#installation
binlist:
- tewi

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 KB
          rating: 1
          desc:
            cn: 约 30 KB（估算）
            en: ~30 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
