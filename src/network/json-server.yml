lang: JavaScript
homepage: https://github.com/typicode/json-server
license: MIT
desc:
  cn: 在不到 30 秒的时间内获取具有零编码的完整假 REST API
  en: Get a full fake REST API with zero coding in less than 30 seconds
x:
  source: https://github.com/typicode/json-server
  npm: json-server
rule:
  /x:
    cmd: x pkg use json-server
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install json-server
    reference: https://github.com/typicode/json-server?tab=readme-ov-file#install
    dsnap: json-server
binlist:
- json-server

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
