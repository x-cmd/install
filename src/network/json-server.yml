lang: JavaScript
homepage: https://github.com/typicode/json-server
license: MIT
desc:
  cn: 在不到 30 秒的时间内获取具有零编码的完整假 REST API
  en: Get a full fake REST API with zero coding in less than 30 seconds
x:
  pkg:
    exist: true
  source: https://github.com/typicode/json-server
rule:
  /x:
    cmd: x pkg use json-server
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install json-server
    reference: https://github.com/typicode/json-server?tab=readme-ov-file#install
    dsnap: json-server
binlist:
- json-server

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
