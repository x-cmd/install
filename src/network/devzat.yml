lang: 'Go'
homepage: 'https://github.com/quackduck/devzat'
license: 'MIT'
desc:
  cn: 通过 SSH 与开发者聊天的工具
  en: 'The devs are over here at devzat, chat over SSH!'
x:
  source: https://github.com/quackduck/devzat
  eget: https://github.com/quackduck/devzat
rule:
  /eget:
    cmd: x eget quackduck/devzat
    reference: https://github.com/quackduck/devzat
binlist:
- 'devzat'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 22 MB
          rating: 2
          desc:
            cn: 安装 22 MB
            en: 22 MB install
        download:
          estimate: 22 MB
          desc:
            cn: 约 22 MB 下载 (linux/x64)
            en: ~22 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
