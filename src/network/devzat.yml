lang: 'Go'
homepage: 'https://github.com/quackduck/devzat'
license: 'MIT'
desc:
  cn: 通过 SSH 与开发者聊天的工具
  en: 'The devs are over here at devzat, chat over SSH!'
x:
  source: https://github.com/quackduck/devzat
  eget: https://github.com/quackduck/devzat
rule:
  /eget:
    cmd: x eget quackduck/devzat
    reference: https://github.com/quackduck/devzat
binlist:
  - 'devzat'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
