lang: 'Go'
homepage: 'https://github.com/quackduck/devzat'
license: 'MIT'
desc:
  cn: 通过 SSH 与开发者聊天的工具
  en: 'The devs are over here at devzat, chat over SSH!'
  cs: Vývojáři jsou tady na devzat, chatujte přes SSH!
  de: Die Entwickler sind hier bei devzat, chatten Sie über SSH!
  es: Los desarrolladores están aquí en devzat, ¡chatea por SSH!
  fr: Les développeurs sont ici sur devzat, discutez via SSH !
  id: Para pengembang ada di devzat, ngobrol lewat SSH!
  it: Gli sviluppatori sono qui su devzat, chattate tramite SSH!
  ja: 開発者たちは devzat にいます、SSH でチャットしましょう!
  ko: 개발자들은 devzat에 있습니다, SSH로 대화하세요!
  pl: Programiści są tutaj na devzat, porozmawiaj przez SSH!
  pt: Os desenvolvedores estão aqui no devzat, converse por SSH!
  ro: Dezvoltatorii sunt aici pe devzat, discutați prin SSH!
  ru: Разработчики здесь, на devzat, общайтесь через SSH!
  th: ผู้พัฒนาอยู่ที่นี่บน devzat แชทผ่าน SSH!
  tr: Geliştiriciler devzat üzerinde, SSH ile sohbet edin!
  uk: Розробники тут, на devzat, спілкуйтеся через SSH!
  vi: Các nhà phát triển đang ở đây trên devzat, hãy trò chuyện qua SSH!
x:
  source: https://github.com/quackduck/devzat
  eget: quackduck/devzat
rule:
  /eget:
    cmd: x eget quackduck/devzat
    reference: https://github.com/quackduck/devzat
binlist:
- 'devzat'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 22 MB
          rating: 2
          desc:
            cn: 安装 22 MB
            en: 22 MB install
        download:
          estimate: 22 MB
          desc:
            cn: 约 22 MB 下载 (linux/x64)
            en: ~22 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
