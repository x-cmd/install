lang: Rust
homepage: https://github.com/ducaale/xh
license: MIT
desc:
  cn: xh 是用于发送 HTTP 请求的友好而快速的工具
  en: xh is a friendly and fast tool for sending HTTP requests
  cs: xh je přátelský a rychlý nástroj pro odesílání HTTP požadavků
  de: xh ist ein freundliches und schnelles Werkzeug zum Senden von HTTP-Anfragen
  es: xh es una herramienta amigable y rápida para enviar solicitudes HTTP
  fr: xh est un outil convivial et rapide pour envoyer des requêtes HTTP
  id: xh adalah alat yang ramah dan cepat untuk mengirim permintaan HTTP
  it: xh è uno strumento intuitivo e veloce per inviare richieste HTTP
  ja: xh は HTTP リクエストを送信するための親しみやすい高速なツールです
  ko: xh는 HTTP 요청을 보내기 위한 친절하고 빠른 도구입니다
  pl: xh to przyjazne i szybkie narzędzie do wysyłania żądań HTTP
  pt: xh é uma ferramenta amigável e rápida para enviar requisições HTTP
  ro: xh este un instrument prietenos și rapid pentru trimiterea cererilor HTTP
  ru: xh — дружелюбный и быстрый инструмент для отправки HTTP-запросов
  th: xh คือเครื่องมือที่ใช้งานง่ายและรวดเร็วสำหรับส่งคำขอ HTTP
  tr: xh, HTTP istekleri göndermek için kullanıcı dostu ve hızlı bir araçtır
  uk: xh — зручний і швидкий інструмент для надсилання HTTP-запитів
  vi: xh là công cụ thân thiện và nhanh để gửi các yêu cầu HTTP
x:
  source: https://github.com/ducaale/xh
  eget: ducaale/xh
  asdf: xh
rule:
  /x:
    cmd: x pkg use xh
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ducaale/xh
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use xh
    reference: https://github.com/NeoHsu/asdf-xh
  /curl:
    cmd: curl -sfL https://raw.githubusercontent.com/ducaale/xh/master/install.sh | sh
    reference: https://github.com/ducaale/xh?tab=readme-ov-file#via-curl-linux--macos
  win/powershell:
    cmd: x pwsh iwr -useb https://raw.githubusercontent.com/ducaale/xh/master/install.ps1 | iex
    reference: https://github.com/ducaale/xh?tab=readme-ov-file#via-powershell-windows
binlist:
- xh

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 7 MB
        desc:
          cn: 7 MB
          en: 7 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
