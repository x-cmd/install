lang: Go
homepage: https://github.com/ngrok/ngrok
desc:
  cn: ngrok 是一种全球分布式反向代理，无论您在何处运行应用程序和网络服务，都可以保护和加速您的应用程序和网络服务。
  en: ngrok is a globally distributed reverse proxy that secures, protects and accelerates your applications and network services, no matter where you run them.
x:
  source: https://github.com/ngrok/ngrok
rule:
  darwin/brew:
    cmd: brew install ngrok
    reference: https://download.ngrok.com/mac-os?tab=install
  arch/yay:
    cmd: yay -S ngrok
    reference: https://aur.archlinux.org/packages/ngrok
  (win|wsl2)/choco:
    cmd: x choco install ngrok
    reference: https://download.ngrok.com/windows
  debian/apt:
    cmd: "curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \\\n  | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null \\\n  && echo \"deb https://ngrok-agent.s3.amazonaws.com buster main\" \\\n  | sudo tee /etc/apt/sources.list.d/ngrok.list \\\n  && sudo apt update \\\n  && sudo apt install ngrok\n"
    reference: https://download.ngrok.com/linux
    dsnap: ngrok
  ubuntu/apt:
    cmd: "curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \\\n  | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null \\\n  && echo \"deb https://ngrok-agent.s3.amazonaws.com buster main\" \\\n  | sudo tee /etc/apt/sources.list.d/ngrok.list \\\n  && sudo apt update \\\n  && sudo apt install ngrok\n"
    reference: https://download.ngrok.com/linux
    dsnap: ngrok
  kali/apt:
    cmd: "curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \\\n  | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null \\\n  && echo \"deb https://ngrok-agent.s3.amazonaws.com buster main\" \\\n  | sudo tee /etc/apt/sources.list.d/ngrok.list \\\n  && sudo apt update \\\n  && sudo apt install ngrok\n"
    reference: https://download.ngrok.com/linux
  raspbian/apt:
    cmd: "curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \\\n  | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null \\\n  && echo \"deb https://ngrok-agent.s3.amazonaws.com buster main\" \\\n  | sudo tee /etc/apt/sources.list.d/ngrok.list \\\n  && sudo apt update \\\n  && sudo apt install ngrok\n"
    reference: https://download.ngrok.com/raspberry-pi
  mint/apt:
    cmd: "curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \\\n  | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null \\\n  && echo \"deb https://ngrok-agent.s3.amazonaws.com buster main\" \\\n  | sudo tee /etc/apt/sources.list.d/ngrok.list \\\n  && sudo apt update \\\n  && sudo apt install ngrok\n"
    reference: https://download.ngrok.com/linux
  /snap:
    cmd: sudo snap install ngrok
    reference: https://download.ngrok.com/linux
binlist:
- ngrok
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
