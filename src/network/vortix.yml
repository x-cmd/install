lang: 'Rust'
homepage: 'https://github.com/Harry-kp/vortix'
license: 'MIT'
desc:
  cn: WireGuard 与 OpenVPN 的终端 UI，含实时遥测与防泄漏
  en: 'Terminal UI for WireGuard and OpenVPN with real-time telemetry and leak guarding.'
x:
  source: https://github.com/Harry-kp/vortix
  eget: https://github.com/Harry-kp/vortix
rule:
  /cargo:
    cmd: 'cargo install vortix'
    reference: https://github.com/Harry-kp/vortix
  /eget:
    cmd: x eget Harry-kp/vortix
    reference: https://github.com/Harry-kp/vortix
binlist:
  - 'vortix'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
