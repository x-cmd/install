lang: 'Rust'
homepage: 'https://github.com/Harry-kp/vortix'
license: 'MIT'
desc:
  cn: WireGuard 与 OpenVPN 的终端 UI，含实时遥测与防泄漏
  en: 'Terminal UI for WireGuard and OpenVPN with real-time telemetry and leak guarding.'
x:
  source: https://github.com/Harry-kp/vortix
  eget: https://github.com/Harry-kp/vortix
rule:
  /cargo:
    cmd: 'cargo install vortix'
    reference: https://github.com/Harry-kp/vortix
  /eget:
    cmd: x eget Harry-kp/vortix
    reference: https://github.com/Harry-kp/vortix
binlist:
- 'vortix'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.9 MB
          rating: 1
          desc:
            cn: 约 5.9 MB（估算）
            en: ~5.9 MB estimated
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
