lang: 'Rust'
homepage: 'https://github.com/Harry-kp/vortix'
license: 'MIT'
desc:
  cn: WireGuard 与 OpenVPN 的终端 UI，含实时遥测与防泄漏
  en: 'Terminal UI for WireGuard and OpenVPN with real-time telemetry and leak guarding.'
  cs: Terminálové UI pro WireGuard a OpenVPN s telemetrií v reálném čase a ochranou proti úniku dat.
  de: Terminal-UI für WireGuard und OpenVPN mit Echtzeit-Telemetrie und Schutz vor Datenlecks.
  es: Interfaz de terminal para WireGuard y OpenVPN con telemetría en tiempo real y protección contra fugas.
  fr: Interface terminal pour WireGuard et OpenVPN avec télémétrie en temps réel et protection contre les fuites.
  id: UI terminal untuk WireGuard dan OpenVPN dengan telemetri waktu nyata dan guarding kebocoran.
  it: Interfaccia a terminale per WireGuard e OpenVPN con telemetria in tempo reale e protezione dalle perdite.
  ja: WireGuard と OpenVPN 向けのターミナル UI。リアルタイムテレメトリと漏洩防止 functionalities を備えます。
  ko: WireGuard와 OpenVPN을 위한 터미널 UI로, 실시간 텔레메트리와 누출 방지를 지원합니다.
  pl: Terminalowy interfejs dla WireGuard i OpenVPN z telemetrią w czasie rzeczywistym i ochroną przed wyciekami.
  pt: Interface de terminal para WireGuard e OpenVPN com telemetria em tempo real e proteção contra vazamentos.
  ro: Interfață de terminal pentru WireGuard și OpenVPN cu telemetrie în timp real și protecție împotriva scurgerilor.
  ru: Терминальный интерфейс для WireGuard и OpenVPN с телеметрией в реальном времени и защитой от утечек.
  th: UI เทอร์มินัลสำหรับ WireGuard และ OpenVPN พร้อมเทเลเมตรีแบบเรียลไทม์และการป้องกันการรั่วไหล
  tr: Gerçek zamanlı telemetri ve sızıntı korumasıyla WireGuard ve OpenVPN için terminal arayüzü.
  uk: Термінальний інтерфейс для WireGuard та OpenVPN із телеметрією в реальному часі та захистом від витоку.
  vi: Giao diện terminal cho WireGuard và OpenVPN với telemetri thời gian thực và bảo vệ chống rò rỉ
x:
  source: https://github.com/Harry-kp/vortix
  eget: Harry-kp/vortix
  cargo: vortix
rule:
  /cargo:
    cmd: 'cargo install vortix'
    reference: https://github.com/Harry-kp/vortix
  /eget:
    cmd: x eget Harry-kp/vortix
    reference: https://github.com/Harry-kp/vortix
binlist:
- 'vortix'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.9 MB
          rating: 1
          desc:
            cn: 约 5.9 MB（估算）
            en: ~5.9 MB estimated
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
