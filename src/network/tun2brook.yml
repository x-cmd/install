lang: Go
homepage: https://github.com/txthinking/tun2brook
license: GPL-3.0
desc:
  cn: Brook GUI 的 CLI 版本
  en: The CLI version of Brook GUI
x:
  source: https://github.com/txthinking/tun2brook
  eget: https://github.com/txthinking/tun2brook
rule:
  /x:
    cmd: x pkg use tun2brook
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/tun2brook
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install tun2brook
    reference: https://github.com/txthinking/tun2brook?tab=readme-ov-file#install-via-nami
binlist:
- tun2brook

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 MB
          rating: 2
          desc:
            cn: 安装 28 MB
            en: 28 MB install
        download:
          estimate: 28 MB
          desc:
            cn: 约 28 MB 下载 (linux/x64)
            en: ~28 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
