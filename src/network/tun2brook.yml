lang: Go
homepage: https://github.com/txthinking/tun2brook
license: GPL-3.0
desc:
  cn: Brook GUI 的 CLI 版本
  en: The CLI version of Brook GUI
x:
  pkg:
    exist: true
  source: https://github.com/txthinking/tun2brook
  eget: https://github.com/txthinking/tun2brook
rule:
  /x:
    cmd: x pkg use tun2brook
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/tun2brook
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install tun2brook
    reference: https://github.com/txthinking/tun2brook?tab=readme-ov-file#install-via-nami
binlist:
- tun2brook

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
