lang: 'Go'
homepage: 'https://github.com/xaaha/hulak'
license: 'MIT'
desc:
  cn: 轻量基于文件的 CLI API 客户端，支持 age 加密密钥与 GraphQL
  en: 'Lightweight file-based CLI API client with age-encrypted secrets and first-class GraphQL support.'
x:
  source: https://github.com/xaaha/hulak
  eget: https://github.com/xaaha/hulak
rule:
  /go:
    cmd: 'go install github.com/xaaha/hulak@latest'
    reference: https://github.com/xaaha/hulak
  /eget:
    cmd: x eget xaaha/hulak
    reference: https://github.com/xaaha/hulak
binlist:
  - 'hulak'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
