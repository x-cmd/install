lang: bash/awk
homepage: https://github.com/denilsonsa/prettyping
license: MIT
desc:
  cn: Prettyping 是标准 ping 工具的包装器，使输出更漂亮、更丰富多彩、更紧凑且更易于阅读
  en: Prettyping is a wrapper around the standard ping tool, making the output prettier, more colorful, more compact, and easier to read
x:
  source: https://github.com/denilsonsa/prettyping
rule:
  /curl:
    cmd: 'curl -O https://raw.githubusercontent.com/denilsonsa/prettyping/master/prettyping \

      && chmod +x prettyping \

      && ./prettyping whatever.host.you.want.to.ping

      '
    reference: https://denilson.sa.nom.br/prettyping/
binlist:
- prettyping

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
