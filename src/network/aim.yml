lang: Rust
homepage: https://github.com/mihaigalos/aim
license: MIT
desc:
  cn: 一个带有恢复功能的命令行下载/上传工具。
  en: A command line download/upload tool with resume.
x:
  source: https://github.com/mihaigalos/aim
  eget: https://github.com/mihaigalos/aim
rule:
  /eget:
    cmd: x eget mihaigalos/aim
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install aim
    reference: https://github.com/mihaigalos/aim#%EF%B8%8E-installation
    dsnap: aim
  arch/paru:
    cmd: paru -S aim
    reference: https://github.com/mihaigalos/aim#%EF%B8%8E-installation
  arch/yay:
    cmd: yay -S aim-bin
    reference: https://aur.archlinux.org/packages/aim-bin
  /brew:
    cmd: brew install aim
    reference: https://github.com/mihaigalos/aim#%EF%B8%8E-installation
binlist:
- aim

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
