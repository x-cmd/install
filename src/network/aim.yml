lang: Rust
homepage: https://github.com/mihaigalos/aim
license: MIT
desc:
  cn: 一个带有恢复功能的命令行下载/上传工具。
  en: A command line download/upload tool with resume.
  cs: Nástroj pro stahování a nahrávání z příkazové řádky s podporou pokračování.
  de: Ein Kommandozeilen-Download-/Upload-Tool mit Fortsetzung.
  es: Una herramienta de descarga/subida desde la línea de comandos con reanudación.
  fr: Un outil de téléchargement/téléversement en ligne de commande avec reprise.
  id: Alat unduh/unggah baris perintah dengan kemampuan melanjutkan.
  it: Uno strumento da riga di comando per download/upload con ripresa.
  ja: レジュームに対応したコマンドラインのダウンロード/アップロードツール。
  ko: 이어받기 기능이 있는 명령줄 다운로드/업로드 도구.
  pl: Narzędzie wiersza poleceń do pobierania/wysyłania z obsługą wznawiania.
  pt: Uma ferramenta de download/upload de linha de comando com retomada.
  ro: Un instrument de descărcare/încărcare din linia de comandă cu reluare.
  ru: Консольный инструмент для загрузки/выгрузки файлов с возможностью докачки.
  th: เครื่องมือดาวน์โหลด/อัปโหลดจากบรรทัดคำสั่งที่รองรับการดาวน์โหลดต่อ
  tr: Devam ettirme destekli komut satırı indirme/yükleme aracı.
  uk: Консольний інструмент для завантаження/вивантаження файлів із можливістю докачування.
  vi: Công cụ tải xuống/tải lên từ dòng lệnh có hỗ trợ tiếp tục.
x:
  source: https://github.com/mihaigalos/aim
  eget: mihaigalos/aim
  brew: aim
  yay: aim-bin
  paru: aim
  cargo: aim
rule:
  /eget:
    cmd: x eget mihaigalos/aim
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install aim
    reference: https://github.com/mihaigalos/aim#%EF%B8%8E-installation
    dsnap: aim
  arch/paru:
    cmd: paru -S aim
    reference: https://github.com/mihaigalos/aim#%EF%B8%8E-installation
  arch/yay:
    cmd: yay -S aim-bin
    reference: https://aur.archlinux.org/packages/aim-bin
  /brew:
    cmd: brew install aim
    reference: https://github.com/mihaigalos/aim#%EF%B8%8E-installation
binlist:
- aim

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 22 MB
          rating: 2
          desc:
            cn: 安装 22 MB
            en: 22 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 9 MB
        desc:
          cn: 9 MB
          en: 9 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
