lang: Go
homepage: https://github.com/RamboRogers/netventory
license: GPL-3.0
desc:
  cn: NetVentory 是一个快速且美观的网络发现工具，提供终端和网页界面。
  en: NetVentory is a fast, beautiful network discovery tool with both terminal and web interfaces.
x:
  source: https://github.com/RamboRogers/netventory
  eget: https://github.com/RamboRogers/netventory
  yay: netventory-git
  curl: curl
rule:
  /eget:
    cmd: x eget RamboRogers/netventory
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -L https://raw.githubusercontent.com/RamboRogers/netventory/refs/heads/master/install.sh | sh
    reference: https://github.com/RamboRogers/netventory?tab=readme-ov-file#-mac--linux
  arch/yay:
    cmd: yay -S netventory-git
    reference: https://aur.archlinux.org/packages/netventory-git
  linux/curl:
    cmd: curl -L https://raw.githubusercontent.com/RamboRogers/netventory/refs/heads/master/install.sh | sh
    reference: https://github.com/RamboRogers/netventory?tab=readme-ov-file#-mac--linux
  win/powershell:
    cmd: x pwsh iwr -useb https://raw.githubusercontent.com/RamboRogers/netventory/refs/heads/master/install.ps1 | iex
    reference: https://github.com/RamboRogers/netventory?tab=readme-ov-file#-windows-powershell
binlist:
- netventory

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
