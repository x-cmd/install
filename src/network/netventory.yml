lang: Go
homepage: https://github.com/RamboRogers/netventory
license: GPL-3.0
desc:
  cn: NetVentory 是一个快速且美观的网络发现工具，提供终端和网页界面。
  en: NetVentory is a fast, beautiful network discovery tool with both terminal and web interfaces.
  cs: NetVentory je rychlý a krásný nástroj pro objevování sítí s rozhraním pro terminál i web.
  de: NetVentory ist ein schnelles, schönes Netzwerk-Discovery-Tool mit Terminal- und Weboberfläche.
  es: NetVentory es una herramienta rápida y bonita de descubrimiento de red con interfaces de terminal y web.
  fr: NetVentory est un outil rapide et élégant de découverte réseau avec des interfaces terminal et web.
  id: NetVentory adalah alat penemuan jaringan yang cepat dan indah dengan antarmuka terminal dan web.
  it: NetVentory è un rapido ed elegante strumento di rilevamento della rete con interfacce terminale e web.
  ja: NetVentory はターミナルとウェブの両方のインターフェースを備えた高速で美しいネットワーク探索ツールです。
  ko: NetVentory는 터미널과 웹 인터페이스를 모두 갖춘 빠르고 보기 좋은 네트워크 탐색 도구입니다.
  pl: NetVentory to szybkie i piękne narzędzie do odkrywania sieci z interfejsem terminalowym i webowym.
  pt: NetVentory é uma ferramenta rápida e bonita de descoberta de rede com interfaces de terminal e web.
  ro: NetVentory este o unealtă rapidă și frumoasă de descoperire a rețelei cu interfețe terminal și web.
  ru: NetVentory — быстрый и красивый инструмент обнаружения сетей с интерфейсами для терминала и веба.
  th: NetVentory เป็นเครื่องมือค้นหาเครือข่ายที่รวดเร็วและสวยงาม พร้อมทั้งอินเทอร์เฟซทั้งเทอร์มินัลและเว็บ
  tr: NetVentory, hem terminal hem web arayüzüne sahip hızlı ve şık bir ağ keşif aracıdır.
  uk: NetVentory — швидкий і гарний інструмент виявлення мереж з інтерфейсами для термінала та вебу.
  vi: NetVentory là công cụ khám phá mạng nhanh và đẹp với giao diện cả terminal lẫn web.
x:
  source: https://github.com/RamboRogers/netventory
  eget: RamboRogers/netventory
  yay: netventory-git
rule:
  /eget:
    cmd: x eget RamboRogers/netventory
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -L https://raw.githubusercontent.com/RamboRogers/netventory/refs/heads/master/install.sh | sh
    reference: https://github.com/RamboRogers/netventory?tab=readme-ov-file#-mac--linux
  arch/yay:
    cmd: yay -S netventory-git
    reference: https://aur.archlinux.org/packages/netventory-git
  linux/curl:
    cmd: curl -L https://raw.githubusercontent.com/RamboRogers/netventory/refs/heads/master/install.sh | sh
    reference: https://github.com/RamboRogers/netventory?tab=readme-ov-file#-mac--linux
  win/powershell:
    cmd: x pwsh iwr -useb https://raw.githubusercontent.com/RamboRogers/netventory/refs/heads/master/install.ps1 | iex
    reference: https://github.com/RamboRogers/netventory?tab=readme-ov-file#-windows-powershell
binlist:
- netventory

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
