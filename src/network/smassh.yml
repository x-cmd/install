lang: 'Python'
homepage: 'https://github.com/kraanzu/smassh'
license: 'GPL-3.0'
desc:
  cn: 键盘练手 TUI 工具
  en: 'Smassh your Keyboard, TUI Edition'
x:
  source: https://github.com/kraanzu/smassh
  eget: https://github.com/kraanzu/smassh
rule:
  /eget:
    cmd: x eget kraanzu/smassh
    reference: https://github.com/kraanzu/smassh
binlist:
- 'smassh'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 19 MB
          rating: 2
          desc:
            cn: 安装 19 MB
            en: 19 MB install
        download:
          estimate: 19 MB
          desc:
            cn: 约 19 MB 下载 (linux/arm64)
            en: ~19 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
