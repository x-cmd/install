lang: 'Python'
homepage: 'https://github.com/kraanzu/smassh'
license: 'GPL-3.0'
desc:
  cn: 键盘练手 TUI 工具
  en: 'Smassh your Keyboard, TUI Edition'
x:
  source: https://github.com/kraanzu/smassh
  eget: https://github.com/kraanzu/smassh
rule:
  /eget:
    cmd: x eget kraanzu/smassh
    reference: https://github.com/kraanzu/smassh
binlist:
  - 'smassh'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
