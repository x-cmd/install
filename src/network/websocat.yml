lang: Rust
homepage: https://github.com/vi/websocat
license: MIT
desc:
  cn: 用于 WebSockets 的 Netcat、 curl 和 socat
  en: Netcat, curl and socat for WebSockets
x:
  pkg:
    exist: true
  source: https://github.com/vi/websocat
  eget: https://github.com/vi/websocat
  dnf: websocat
  brew: websocat
rule:
  /x:
    cmd: x pkg use websocat
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget vi/websocat
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use websocat
    reference: https://github.com/bdellegrazie/asdf-websocat
  arch/yay:
    cmd: yay -S websocat-git
    reference: https://aur.archlinux.org/packages/websocat-git
  darwin/brew:
    cmd: brew install websocat
    reference: https://formulae.brew.sh/formula/websocat#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install websocat
    reference: https://github.com/vi/websocat#installation
  fedora/dnf:
    cmd: 'sudo dnf copr enable atim/websocat -y \

      && sudo dnf install websocat

      '
    reference: https://command-not-found.com/nmap
  freebsd/pkg:
    cmd: pkg install websocat
    reference: https://github.com/vi/websocat#installation
binlist:
- websocat

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
