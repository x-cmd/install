lang: Python
homepage: https://github.com/certbot/certbot
desc:
  cn: Certbot 是 EFF 的工具，用于从 Let's Encrypt 获取证书并（可选）在您的服务器上自动启用 HTTPS
  en: Certbot is EFF's tool to obtain certs from Let's Encrypt and (optionally) auto-enable HTTPS on your server.
  cs: Certbot je nástroj EFF k získávání certifikátů od Let's Encrypt a volitelnému automatickému zapnutí HTTPS na vašem serveru.
  de: Certbot ist das Werkzeug von EFF zum Beziehen von Zertifikaten von Let's Encrypt und zum optionalen automatischen Aktivieren von HTTPS auf Ihrem Server.
  es: Certbot es la herramienta de EFF para obtener certificados de Let's Encrypt y (opcionalmente) habilitar HTTPS automáticamente en tu servidor.
  fr: Certbot est l'outil de l'EFF pour obtenir des certificats auprès de Let's Encrypt et (facultativement) activer automatiquement HTTPS sur votre serveur.
  id: Certbot adalah alat dari EFF untuk memperoleh sertifikat dari Let's Encrypt dan (opsional) otomatis mengaktifkan HTTPS di server Anda.
  it: Certbot è lo strumento di EFF per ottenere certificati da Let's Encrypt e (opzionalmente) abilitare automaticamente HTTPS sul tuo server.
  ja: Certbot は Let's Encrypt から証明書を取得し、必要に応じてサーバー上で HTTPS を自動的に有効にする EFF のツールです。
  ko: Certbot는 Let's Encrypt에서 인증서를 받고 (선택적으로) 서버에서 HTTPS를 자동으로 활성화하는 EFF의 도구입니다.
  pl: Certbot to narzędzie EFF do uzyskiwania certyfikatów z Let's Encrypt i (opcjonalnie) automatycznego włączania HTTPS na serwerze.
  pt: O Certbot é a ferramenta da EFF para obter certificados do Let's Encrypt e (opcionalmente) ativar HTTPS automaticamente no seu servidor.
  ro: Certbot este instrumentul EFF pentru obținerea certificatelor de la Let's Encrypt și (opțional) activarea automată a HTTPS pe serverul dvs.
  ru: Certbot — инструмент EFF для получения сертификатов от Let's Encrypt и (при желании) автоматического включения HTTPS на вашем сервере.
  th: Certbot เป็นเครื่องมือของ EFF สำหรับรับใบรับรองจาก Let's Encrypt และ (โดยไม่บังคับ) เปิดใช้งาน HTTPS บนเซิร์ฟเวอร์ของคุณโดยอัตโนมัติ
  tr: Certbot, Let's Encrypt'ten sertifika almak ve (isteğe bağlı olarak) sunucunuzda HTTPS'yi otomatik olarak etkinleştirmek için EFF aracıdır.
  uk: Certbot — інструмент EFF для отримання сертифікатів від Let's Encrypt і (за бажанням) автоматичного ввімкнення HTTPS на вашому сервері.
  vi: Certbot là công cụ của EFF để lấy chứng chỉ từ Let's Encrypt và (tùy chọn) tự động bật HTTPS trên máy chủ của bạn.
x:
  source: https://github.com/certbot/certbot
  eget: certbot/certbot
  apt: certbot
  dnf: certbot
  brew: certbot
  pacman: certbot
  apk: certbot
  apt-get: certbot
  winget: EFF.Certbot
  yay: certbot-git
  pip: certbot
rule:
  /eget:
    cmd: x eget certbot/certbot
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use certbot
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install certbot
    reference: https://devicetests.com/install-certbot-ubuntu-20-04-ssl-certificate#:~:text=Install%20Certbot%20using%20pip.%20Run%20the%20following%20command%3A,install%20certbot%20This%20command%20installs%20Certbot%20using%20pip.
  darwin/brew:
    cmd: brew install certbot
    reference: https://formulae.brew.sh/formula/certbot#default
  debian/apt:
    cmd: sudo apt-get install certbot
    reference: https://command-not-found.com/certbot
    dsnap: certbot
  ubuntu/apt:
    cmd: sudo apt-get install certbot
    reference: https://command-not-found.com/certbot
    dsnap: certbot
  alpine/apk:
    cmd: sudo apk add certbot
    reference: https://command-not-found.com/certbot
    dsnap: certbot
  arch/pacman:
    cmd: sudo pacman -S certbot
    reference: https://command-not-found.com/certbot
  arch/yay:
    cmd: yay -S certbot-git
    reference: https://aur.archlinux.org/packages/certbot-git
  kali/apt:
    cmd: sudo apt-get install certbot
    reference: https://command-not-found.com/certbot
    dsnap: certbot
  fedora/dnf:
    cmd: sudo dnf install certbot
    reference: https://command-not-found.com/certbot
    dsnap: certbot
  raspbian/apt:
    cmd: sudo apt-get install certbot
    reference: https://command-not-found.com/certbot
  (win|wsl2)/winget:
    cmd: x winget install EFF.Certbot
    reference: https://winget.run/pkg/EFF/Certbot
binlist:
- certbot
license: NOASSERTION
# complicated
footprint:
  behavior:
    runtime:
      type: [cli, oneshot]      # `certbot` 交互式 CLI；`certbot renew` oneshot
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true              # ACME 协议
    filesystem:
      read:
        desc:
          cn: 读取 /etc/letsencrypt 配置；域名验证文件
          en: Reads /etc/letsencrypt config; domain validation files
        sensitive: []
      write:
        desc:
          cn: 在 /etc/letsencrypt/live/ 写入证书和密钥
          en: Writes certificates and keys in /etc/letsencrypt/live/
        sensitive:
          - "/etc/letsencrypt/live/*/privkey.pem"
  resource:
    disk:
      size:
        install:
          estimate: 156 KB
          rating: 1
          desc:
            cn: 约 156 KB（估算）
            en: ~156 KB estimated
        growth:
          desc:
            cn: /etc/letsencrypt 随域名数增长
            en: /etc/letsencrypt grows with number of domains
      paths:
        data:
          - "/etc/letsencrypt/"
          - "/var/log/letsencrypt/"
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 短暂占用（ACME 握手 + 证书生成）
          en: Brief spike (ACME handshake + cert generation)
