lang: 'Go'
homepage: 'https://github.com/plutov/oq'
license: 'MIT'
desc:
  cn: 终端 OpenAPI Spec 查看器
  en: 'Terminal OpenAPI Spec viewer'
x:
  source: https://github.com/plutov/oq
  eget: https://github.com/plutov/oq
rule:
  /eget:
    cmd: x eget plutov/oq
    reference: https://github.com/plutov/oq
binlist:
  - 'oq'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 120 KB
          rating: 1
          desc:
            cn: 约 120 KB（估算）
            en: ~120 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
