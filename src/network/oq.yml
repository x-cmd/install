lang: 'Go'
homepage: 'https://github.com/plutov/oq'
license: 'MIT'
desc:
  cn: 终端 OpenAPI Spec 查看器
  en: 'Terminal OpenAPI Spec viewer'
  cs: Prohlížeč OpenAPI Spec v terminálu
  de: Terminal-Viewer für OpenAPI Specs
  es: Visor de OpenAPI Spec en la terminal
  fr: Visionneuse de spécifications OpenAPI en terminal
  id: Penampil OpenAPI Spec berbasis terminal
  it: Visualizzatore di specifiche OpenAPI da terminale
  ja: ターミナル向け OpenAPI Spec ビューア
  ko: 터미널용 OpenAPI Spec 뷰어
  pl: Przeglądarka OpenAPI Spec w terminalu
  pt: Visualizador de OpenAPI Spec no terminal
  ro: Vizualizator de specificații OpenAPI în terminal
  ru: Просмотрщик OpenAPI Spec для терминала
  th: ตัวดู OpenAPI Spec ในเทอร์มินัล
  tr: Terminal için OpenAPI Spec görüntüleyici
  uk: Переглядач OpenAPI Spec для термінала
  vi: Trình xem OpenAPI Spec trên terminal
x:
  source: https://github.com/plutov/oq
  eget: plutov/oq
rule:
  /eget:
    cmd: x eget plutov/oq
    reference: https://github.com/plutov/oq
binlist:
- 'oq'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
