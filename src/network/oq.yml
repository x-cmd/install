lang: 'Go'
homepage: 'https://github.com/plutov/oq'
license: 'MIT'
desc:
  cn: 终端 OpenAPI Spec 查看器
  en: 'Terminal OpenAPI Spec viewer'
x:
  source: https://github.com/plutov/oq
  eget: https://github.com/plutov/oq
rule:
  /eget:
    cmd: x eget plutov/oq
    reference: https://github.com/plutov/oq
binlist:
  - 'oq'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
