lang: 'Rust'
homepage: https://github.com/matthart1983/netwatch
license: 'MIT'
desc:
  cn: 终端实时网络诊断，一条命令零配置即时可见
  en: 'Real-time network diagnostics in your terminal. One command, zero config, instant visibility.'
x:
  source: https://github.com/matthart1983/netwatch
  eget: https://github.com/matthart1983/netwatch
rule:
  debian/apt:
    cmd: 'sudo apt install libpcap-dev'
    reference: https://github.com/matthart1983/netwatch
  /eget:
    cmd: x eget matthart1983/netwatch
    reference: https://github.com/matthart1983/netwatch
binlist:
  - 'netwatch'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.4 MB
          rating: 1
          desc:
            cn: 约 2.4 MB（估算）
            en: ~2.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
