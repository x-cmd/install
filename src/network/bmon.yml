lang: C
homepage: https://github.com/tgraf/bmon
desc:
  cn: 带宽监控和速率估计器
  en: Bandwidth monitor and rate estimator
x:
  source: https://github.com/tgraf/bmon
  eget: https://github.com/tgraf/bmon
rule:
  /eget:
    cmd: x eget tgraf/bmon
    reference: https://x-cmd.com/mod/eget
  ubuntu/apt:
    cmd: sudo apt install bmon
    reference: https://github.com/tgraf/bmon#debianubuntu-installation
    dsnap: bmon
  debian/apt:
    cmd: sudo apt install bmon
    reference: https://github.com/tgraf/bmon#debianubuntu-installation
    dsnap: bmon
  arch/pacman:
    cmd: sudo pacman -S bmon
    reference: https://github.com/tgraf/bmon#debianubuntu-installation
  arch/yay:
    cmd: yay -S bmon-git
    reference: https://aur.archlinux.org/packages/bmon-git
  centos/yum:
    cmd: sudo yum -S bmon
    reference: https://github.com/tgraf/bmon#debianubuntu-installation
  fedora/dnf:
    cmd: sudo dnf install bmon
    reference: https://github.com/tgraf/bmon#debianubuntu-installation
    dsnap: bmon
  opensuse/zypper:
    cmd: zypper in bmon
    reference: https://github.com/tgraf/bmon#debianubuntu-installation
  alpine/apk:
    cmd: apk add bmon
    reference: https://github.com/tgraf/bmon#debianubuntu-installation
    dsnap: bmon
  darwin/brew:
    cmd: brew install bmon
    reference: https://github.com/tgraf/bmon#osx-installation
binlist:
- bmon
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 284 KB
          rating: 1
          desc:
            cn: 约 284 KB（估算）
            en: ~284 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
