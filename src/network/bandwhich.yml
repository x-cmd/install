lang: Rust
homepage: https://github.com/imsnif/bandwhich
license: MIT
desc:
  cn: bandwhich 是一个通过进程、连接和远程 IP/主机名显示当前网络利用率的 CLI 实用程序
  en: bandwhich is a CLI utility for displaying current network utilization by process, connection and remote IP/hostname
  cs: bandwhich je nástroj CLI pro zobrazení aktuálního využití sítě podle procesu, připojení a vzdálené IP adresy či hostitelského jména
  de: bandwhich ist ein CLI-Dienstprogramm zur Anzeige der aktuellen Netzwerkauslastung nach Prozess, Verbindung und entfernter IP-Adresse/Hostname
  es: bandwhich es una utilidad de CLI para mostrar la utilización actual de la red por proceso, conexión e IP/host remoto
  fr: bandwhich est un utilitaire CLI permettant d'afficher l'utilisation actuelle du réseau par processus, connexion et IP/nom d'hôte distant
  id: bandwhich adalah utilitas CLI untuk menampilkan utilisasi jaringan saat ini berdasarkan proses, koneksi, dan IP/host jarak jauh
  it: bandwhich è un'utilità CLI per visualizzare l'utilizzo attuale della rete per processo, connessione e IP/hostname remoto
  ja: bandwhich は、プロセス、接続、リモートの IP/ホスト名ごとに現在のネットワーク使用状況を表示する CLI ユーティリティです
  ko: bandwhich는 프로세스, 연결, 원격 IP/호스트 이름별로 현재 네트워크 사용량을 표시하는 CLI 유틸리티입니다
  pl: bandwhich to narzędzie CLI do wyświetlania bieżącego wykorzystania sieci według procesu, połączenia i zdalnego adresu IP/nazwy hosta
  pt: O bandwhich é um utilitário de CLI para exibir a utilização atual da rede por processo, conexão e IP/hostname remoto
  ro: bandwhich este un utilitar CLI pentru afișarea utilizării curente a rețelei după proces, conexiune și IP/nume de gazdă la distanță
  ru: bandwhich — утилита CLI для отображения текущей загрузки сети по процессам, соединениям и удалённым IP-адресам/именам хостов
  th: bandwhich เป็นยูทิลิตี CLI สำหรับแสดงการใช้งานเครือข่ายปัจจุบันตามกระบวนการ การเชื่อมต่อ และ IP/ชื่อโฮสต์ระยะไกล
  tr: bandwhich, mevcut ağ kullanımını süreç, bağlantı ve uzak IP/ana bilgisayar bazında gösteren bir CLI aracıdır
  uk: bandwhich — це утиліта CLI для відображення поточного використання мережі за процесами, з'єднаннями та віддаленими IP-адресами/іменами хостів
  vi: bandwhich là tiện ích CLI hiển thị mức sử dụng mạng hiện tại theo tiến trình, kết nối và IP/tên máy chủ từ xa
x:
  source: https://github.com/imsnif/bandwhich
  eget: imsnif/bandwhich
  dnf: bandwhich
  brew: bandwhich
  pacman: bandwhich
  port: bandwhich
  yay: bandwhich-git
rule:
  /x:
    cmd: x pkg use bandwhich
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget imsnif/bandwhich
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install bandwhich
    reference: https://formulae.brew.sh/formula/bandwhich#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install bandwhich
    reference: https://github.com/imsnif/bandwhich#macos-using-macports
  arch/pacman:
    cmd: sudo pacman -S bandwhich
    reference: https://github.com/imsnif/bandwhich#arch-linux
  arch/yay:
    cmd: yay -S bandwhich-git
    reference: https://aur.archlinux.org/packages/bandwhich-git
  nix/nixpkgs:
    cmd: nix-env -iA nixpkgs.bandwhich
    reference: https://github.com/imsnif/bandwhich#nixnixos
  fedora/dnf:
    cmd: 'sudo dnf copr enable atim/bandwhich -y \

      && sudo dnf install bandwhich

      '
    reference: https://github.com/imsnif/bandwhich#fedora
  freebsd/pkg:
    cmd: pkg install bandwhich
    reference: https://github.com/imsnif/bandwhich#freebsd
binlist:
- bandwhich

# already profiled
