lang: Go
homepage: https://github.com/SagerNet/sing-box
desc:
  cn: 通用代理平台
  en: The universal proxy platform
x:
  source: https://github.com/SagerNet/sing-box
  eget: https://github.com/SagerNet/sing-box
rule:
  /eget:
    cmd: x eget SagerNet/sing-box
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/sagernet/sing-box/cmd/sing-box@stable
    reference: https://github.com/SagerNet/sing-box
    dsnap: github.com/sagernet/sing-box/cmd/sing-box@stable
  arch/yay:
    cmd: yay -S sing-box
    reference: https://aur.archlinux.org/packages/sing-box
  /curl:
    cmd: curl -fsSL https://sing-box.app/install.sh | sh
    reference: https://sing-box.sagernet.org/installation/package-manager/
  darwin/brew:
    cmd: brew install sing-box
    reference: https://sing-box.sagernet.org/installation/package-manager/
  (win|wsl2)/scoop:
    cmd: scoop install sing-box
    reference: https://sing-box.sagernet.org/installation/package-manager/
binlist:
- sing-box
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 约 13 MB（估算）
            en: ~13 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
