lang: Go
homepage: https://github.com/tuna/tunasync
license: GPL-3.0
desc:
  cn: 镜像 job 管理工具
  en: Mirror job management tool
x:
  source: https://github.com/tuna/tunasync
  yay: tunasync-bin
rule:
  /x:
    cmd: x pkg use tunasync
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S tunasync-bin
    reference: https://aur.archlinux.org/packages/tunasync-bin
binlist:
- tunasync

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 安装 30 MB
            en: 30 MB install
        download:
          estimate: 30 MB
          desc:
            cn: 约 30 MB 下载 (linux/x64)
            en: ~30 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
