lang: Go
homepage: https://github.com/tuna/tunasync
license: GPL-3.0
desc:
  cn: 镜像 job 管理工具
  en: Mirror job management tool
x:
  pkg:
    exist: true
  source: https://github.com/tuna/tunasync
rule:
  /x:
    cmd: x pkg use tunasync
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S tunasync-bin
    reference: https://aur.archlinux.org/packages/tunasync-bin
binlist:
- tunasync

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
