lang: Go
homepage: https://github.com/tuna/tunasync
license: GPL-3.0
desc:
  cn: 镜像 job 管理工具
  en: Mirror job management tool
x:
  pkg:
    exist: true
  source: https://github.com/tuna/tunasync
rule:
  /x:
    cmd: x pkg use tunasync
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S tunasync-bin
    reference: https://aur.archlinux.org/packages/tunasync-bin
binlist:
- tunasync
