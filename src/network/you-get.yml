lang: Python
homepage: https://github.com/soimort/you-get
desc:
  cn: 小型命令行工具，用于从网络下载媒体内容（视频、音频、图像）
  en: You-Get is a tiny command-line utility to download media contents (videos, audios, images) from the Web
x:
  pkg:
    exist: true
  source: https://github.com/soimort/you-get
  eget: https://github.com/soimort/you-get
rule:
  /eget:
    cmd: x eget soimort/you-get
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use you-get
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install you-get
    reference: https://pypi.org/project/you-get/
    dsnap: you-get
  /pip3:
    cmd: pip3 install you-get
    reference: https://github.com/nvbn/thefuck#installation
  darwin/brew:
    cmd: brew install you-get
    reference: https://github.com/soimort/you-get#option-5-homebrew-mac-only
  alpine/apk:
    cmd: sudo apk add you-get
    reference: https://command-not-found.com/you-get
    dsnap: you-get
  freebsd/pkg:
    cmd: pkg install you-get
    reference: https://github.com/soimort/you-get#option-6-pkg-freebsd-only
  arch/pacman:
    cmd: sudo pacman -S you-get
    reference: https://command-not-found.com/you-get
  arch/yay:
    cmd: yay -S you-get-git
    reference: https://aur.archlinux.org/packages/you-get-git
binlist:
- you-get
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
