lang: C
homepage: https://github.com/curl/curl
desc:
  cn: 一个使用 URL 语法传输数据的命令行工具
  en: A command line tool for transferring data with URL syntax
  cs: Nástroj příkazové řádky pro přenos dat s použitím syntaxe URL
  de: Ein Kommandozeilen-Tool zur Datenübertragung mit URL-Syntax
  es: Una herramienta de línea de comandos para transferir datos con sintaxis de URL
  fr: Un outil en ligne de commande pour transférer des données avec la syntaxe URL
  id: Alat baris perintah untuk mentransfer data dengan sintaks URL
  it: Uno strumento da riga di comando per trasferire dati con la sintassi URL
  ja: URL 構文を使ってデータを転送するコマンドラインツール
  ko: URL 구문을 사용하여 데이터를 전송하는 명령줄 도구
  pl: Narzędzie wiersza poleceń do przesyłania danych przy użyciu składni URL
  pt: Uma ferramenta de linha de comando para transferir dados com sintaxe de URL
  ro: Un instrument de linie de comand pentru transferul de date folosind sintaxa URL
  ru: Командный инструмент для передачи данных с использованием синтаксиса URL
  th: เครื่องมือบรรทัดคำสั่งสำหรับถ่ายโอนข้อมูลด้วยไวยากรณ์ URL
  tr: URL sözdizimiyle veri aktarımı için bir komut satırı aracı
  uk: Командний інструмент для передачі даних із використанням синтаксису URL
  vi: Công cụ dòng lệnh để truyền dữ liệu bằng cú pháp URL
x:
  source: https://github.com/curl/curl
  eget: curl/curl
  apt: curl
  dnf: curl
  brew: curl
  pacman: curl
  apk: curl
  apt-get: curl
  yum: curl
rule:
  /eget:
    cmd: x eget curl/curl
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use curl
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install curl
    reference: https://formulae.brew.sh/formula/curl#default
  debian/apt:
    cmd: sudo apt-get install curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  ubuntu/apt:
    cmd: sudo apt-get install curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  alpine/apk:
    cmd: sudo apk add curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  arch/pacman:
    cmd: sudo pacman -S curl
    reference: https://command-not-found.com/curl
  kali/apt:
    cmd: sudo apt-get install curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  centos/yum:
    cmd: sudo yum install curl
    reference: https://command-not-found.com/curl
  fedora/dnf:
    cmd: sudo dnf install curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  raspbian/apt:
    cmd: sudo apt-get install curl
    reference: https://command-not-found.com/curl
binlist:
- curl
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 约 11 MB（估算）
            en: ~11 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
