lang: C
homepage: https://github.com/curl/curl
desc:
  cn: 一个使用 URL 语法传输数据的命令行工具
  en: A command line tool for transferring data with URL syntax
x:
  pkg:
    exist: true
  source: https://github.com/curl/curl
  eget: https://github.com/curl/curl
rule:
  /eget:
    cmd: x eget curl/curl
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use curl
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install curl
    reference: https://formulae.brew.sh/formula/curl#default
  debian/apt:
    cmd: sudo apt-get install curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  ubuntu/apt:
    cmd: sudo apt-get install curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  alpine/apk:
    cmd: sudo apk add curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  arch/pacman:
    cmd: sudo pacman -S curl
    reference: https://command-not-found.com/curl
  kali/apt:
    cmd: sudo apt-get install curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  centos/yum:
    cmd: sudo yum install curl
    reference: https://command-not-found.com/curl
  fedora/dnf:
    cmd: sudo dnf install curl
    reference: https://command-not-found.com/curl
    dsnap: curl
  raspbian/apt:
    cmd: sudo apt-get install curl
    reference: https://command-not-found.com/curl
binlist:
- curl
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
