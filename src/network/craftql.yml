lang: Rust
homepage: https://github.com/yamafaktory/craftql
license: MIT
desc:
  en: A CLI tool to visualize GraphQL schemas and to output a graph data structure as a graphviz .dot format
  cn: 一个命令行工具，用于可视化 GraphQL 模式，并将图形数据结构输出为 Graphviz 的.dot 格式
x:
  source: https://github.com/yamafaktory/craftql
rule:
  /cargo:
    cmd: cargo install craftql
    reference: https://github.com/yamafaktory/craftql?tab=readme-ov-file#installation
    dsnap: craftql
binlist:
- craftql

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
