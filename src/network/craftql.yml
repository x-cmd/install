lang: Rust
homepage: https://github.com/yamafaktory/craftql
license: MIT
desc:
  en: A CLI tool to visualize GraphQL schemas and to output a graph data structure as a graphviz .dot format
  cn: 一个命令行工具，用于可视化 GraphQL 模式，并将图形数据结构输出为 Graphviz 的.dot 格式
x:
  source: https://github.com/yamafaktory/craftql
rule:
  /cargo:
    cmd: cargo install craftql
    reference: https://github.com/yamafaktory/craftql?tab=readme-ov-file#installation
    dsnap: craftql
binlist:
- craftql

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 55 KB
          rating: 1
          desc:
            cn: 约 55 KB（估算）
            en: ~55 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
