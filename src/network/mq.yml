lang: 'Rust'
homepage: https://github.com/harehare/mq
license: 'MIT'
desc:
  cn: 类 jq 的 Markdown 查询语言，用于命令行处理
  en: 'A jq-like Markdown query language for command-line processing'
  cs: Dotazovací jazyk Markdown podobný jq pro zpracování na příkazové řádce
  de: Eine jq-ähnliche Markdown-Abfragesprache für die Verarbeitung auf der Kommandozeile
  es: Un lenguaje de consulta Markdown similar a jq para el procesamiento en línea de comandos
  fr: Un langage de requête Markdown similaire à jq pour le traitement en ligne de commande
  id: Bahasa kueri Markdown mirip jq untuk pemrosesan baris perintah
  it: Un linguaggio di interrogazione Markdown simile a jq per l'elaborazione da riga di comando
  ja: コマンドライン処理のための jq 風の Markdown クエリ言語
  ko: 명령줄 처리를 위한 jq 유사 Markdown 질의 언어
  pl: Język zapytań Markdown podobny do jq do przetwarzania w wierszu poleceń
  pt: Uma linguagem de consulta Markdown semelhante ao jq para processamento em linha de comando
  ro: Un limbaj de interogare Markdown similar cu jq pentru procesarea în linia de comandă
  ru: Язык запросов Markdown, похожий на jq, для обработки в командной строке
  th: ภาษาคิวรี Markdown คล้าย jq สำหรับการประมวลผลบนบรรทัดคำสั่ง
  tr: Komut satırı işleme için jq benzeri bir Markdown sorgu dili.
  uk: Мова запитів Markdown, схожа на jq, для обробки в командному рядку
  vi: Ngôn ngữ truy vấn Markdown tương tự jq để xử lý trên dòng lệnh
x:
  source: https://github.com/harehare/mq
  eget: harehare/mq
rule:
  /eget:
    cmd: x eget harehare/mq
    reference: https://github.com/harehare/mq
binlist:
  - 'mq'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 6.6 MB
          rating: 1
          desc:
            cn: 约 6.6 MB（估算）
            en: ~6.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
