lang: 'Rust'
homepage: https://github.com/harehare/mq
license: 'MIT'
desc:
  cn: 类 jq 的 Markdown 查询语言，用于命令行处理
  en: 'A jq-like Markdown query language for command-line processing'
x:
  source: https://github.com/harehare/mq
  eget: https://github.com/harehare/mq
rule:
  /eget:
    cmd: x eget harehare/mq
    reference: https://github.com/harehare/mq
binlist:
  - 'mq'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.6 MB
          rating: 1
          desc:
            cn: 约 6.6 MB（估算）
            en: ~6.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
