lang: 'Rust'
homepage: https://github.com/harehare/mq
license: 'MIT'
desc:
  cn: 类 jq 的 Markdown 查询语言，用于命令行处理
  en: 'A jq-like Markdown query language for command-line processing'
x:
  source: https://github.com/harehare/mq
  eget: https://github.com/harehare/mq
rule:
  /eget:
    cmd: x eget harehare/mq
    reference: https://github.com/harehare/mq
binlist:
  - 'mq'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
