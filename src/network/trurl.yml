lang: c/Perl
homepage: https://github.com/curl/trurl
desc:
  en: trurl is a tool in a similar spirit of tr but for URLs
  cn: trurl 是一个与 tr 精神类似的工具，但是用于 URL
  cs: trurl je nástroj ve stejném duchu jako tr, ale pro URL
  de: trurl ist ein Werkzeug im Geiste von tr, aber für URLs
  es: trurl es una herramienta en el mismo espíritu que tr, pero para URLs
  fr: trurl est un outil dans la même veine que tr, mais pour les URL
  id: trurl adalah alat dengan semangat serupa dengan tr, tetapi untuk URL
  it: trurl è uno strumento nello stesso spirito di tr, ma per gli URL
  ja: trurl は tr と同様の精神で書かれた URL 用のツールです。
  ko: trurl은 tr과 같은 취지에서 만들어졌지만 URL을 위한 도구입니다.
  pl: trurl jest narzędziem w duchu podobnym do tr, ale dla URL
  pt: trurl é uma ferramenta no mesmo espírito que tr, mas para URLs
  ro: trurl este un instrument în același spirit ca tr, dar pentru URL-uri
  ru: trurl — инструмент в духе tr, но для URL
  th: trurl เป็นเครื่องมือที่มีแนวคิดคล้าย tr แต่สำหรับ URL
  tr: trurl, tr ile aynı ruh halinde bir araçtır, ancak URL'ler içindir
  uk: trurl — інструмент у дусі tr, але для URL
  vi: trurl là công cụ cùng tinh thần với tr, nhưng dành cho URL
x:
  source: https://github.com/curl/trurl
  eget: curl/trurl
  brew: trurl
  yay: trurl-git
rule:
  /eget:
    cmd: x eget curl/trurl
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install trurl
    reference: https://formulae.brew.sh/formula/trurl#default
  arch/yay:
    cmd: yay -S trurl-git
    reference: https://aur.archlinux.org/packages/trurl-git
binlist:
- trurl
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
