lang: c/Perl
homepage: https://github.com/curl/trurl
desc:
  en: trurl is a tool in a similar spirit of tr but for URLs
  cn: trurl 是一个与 tr 精神类似的工具，但是用于 URL
x:
  source: https://github.com/curl/trurl
  eget: https://github.com/curl/trurl
  brew: trurl
rule:
  /eget:
    cmd: x eget curl/trurl
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install trurl
    reference: https://formulae.brew.sh/formula/trurl#default
  arch/yay:
    cmd: yay -S trurl-git
    reference: https://aur.archlinux.org/packages/trurl-git
binlist:
- trurl
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
