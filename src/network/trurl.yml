lang: c/Perl
homepage: https://github.com/curl/trurl
desc:
  en: trurl is a tool in a similar spirit of tr but for URLs
  cn: trurl 是一个与 tr 精神类似的工具，但是用于 URL
x:
  source: https://github.com/curl/trurl
  eget: https://github.com/curl/trurl
rule:
  /eget:
    cmd: x eget curl/trurl
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install trurl
    reference: https://formulae.brew.sh/formula/trurl#default
  arch/yay:
    cmd: yay -S trurl-git
    reference: https://aur.archlinux.org/packages/trurl-git
binlist:
- trurl
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
