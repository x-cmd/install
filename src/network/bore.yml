lang: Rust
homepage: https://github.com/ekzhang/bore
license: MIT
desc:
  cn: 一个简单的 CLI 工具，用于建立到本地主机的隧道
  en: A simple CLI tool for establishing a tunnel to localhost
  cs: Jednoduchý nástroj CLI pro vytvoření tunelu na localhost
  de: Ein einfaches CLI-Werkzeug zum Herstellen eines Tunnels zu localhost
  es: Una sencilla utilidad de CLI para establecer un túnel hacia localhost
  fr: Un simple utilitaire CLI pour établir un tunnel vers localhost
  id: Alat CLI sederhana untuk membuat terowongan ke localhost
  it: Un semplice strumento CLI per stabilire un tunnel verso localhost
  ja: localhost へのトンネルを確立するためのシンプルな CLI ツール
  ko: localhost로 터널을 설정하기 위한 간단한 CLI 도구
  pl: Proste narzędzie CLI do nawiązywania tunelu do localhost
  pt: Uma ferramenta de CLI simples para estabelecer um túnel para localhost
  ro: Un instrument CLI simplu pentru stabilirea unui tunel către localhost
  ru: Простой инструмент CLI для создания туннеля к localhost
  th: เครื่องมือ CLI อย่างง่ายสำหรับสร้างอุโมงค์ไปยัง localhost
  tr: localhost'a bir tünel kurmak için basit bir CLI aracı
  uk: Простий інструмент CLI для встановлення тунелю до localhost
  vi: Công cụ CLI đơn giản để thiết lập đường hầm tới localhost
x:
  source: https://github.com/ekzhang/bore
  eget: ekzhang/bore
  brew: bore-cli
  cargo: bore-cli
rule:
  /x:
    cmd: x pkg use bore
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ekzhang/bore
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install bore-cli
    reference: https://github.com/ekzhang/bore?tab=readme-ov-file#installation
    dsnap: bore-cli
  darwin/brew:
    cmd: brew install bore-cli
    reference: https://github.com/ekzhang/bore?tab=readme-ov-file#installation
binlist:
- bore

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.7 MB
          rating: 1
          desc:
            cn: 安装 2.7 MB
            en: 2.7 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
