lang: Rust
homepage: https://github.com/ekzhang/bore
license: MIT
desc:
  cn: 一个简单的 CLI 工具，用于建立到本地主机的隧道
  en: A simple CLI tool for establishing a tunnel to localhost
x:
  pkg:
    exist: true
  source: https://github.com/ekzhang/bore
  eget: https://github.com/ekzhang/bore
rule:
  /x:
    cmd: x pkg use bore
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ekzhang/bore
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install bore-cli
    reference: https://github.com/ekzhang/bore?tab=readme-ov-file#installation
    dsnap: bore-cli
  darwin/brew:
    cmd: brew install bore-cli
    reference: https://github.com/ekzhang/bore?tab=readme-ov-file#installation
binlist:
- bore

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.7 MB
          rating: 1
          desc:
            cn: 安装 2.7 MB
            en: 2.7 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
