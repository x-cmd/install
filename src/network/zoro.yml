lang: Go
homepage: https://github.com/txthinking/zoro
license: GPL-3.0
desc:
  cn: zoro 能帮助你将本地端口暴露在外网
  en: zoro can help you expose local server to external network
x:
  pkg:
    exist: true
  source: https://github.com/txthinking/zoro
  eget: https://github.com/txthinking/zoro
rule:
  /x:
    cmd: x pkg use zoro
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/zoro
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install zoro
    reference: https://github.com/txthinking/zoro?tab=readme-ov-file#install-via-nami
  darwin/brew:
    cmd: brew install zoro
    reference: https://github.com/txthinking/zoro?tab=readme-ov-file#install-via-brew
binlist:
- zoro

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 126 KB
          rating: 1
          desc:
            cn: 约 126 KB（估算）
            en: ~126 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
