lang: Go
homepage: https://github.com/txthinking/zoro
license: GPL-3.0
desc:
  cn: zoro 能帮助你将本地端口暴露在外网
  en: zoro can help you expose local server to external network
  cs: zoro vám může pomoci vystavit lokální server do externí sítě
  de: zoro kann Ihnen helfen, einen lokalen Server ins externe Netzwerk freizugeben
  es: zoro puede ayudarte a exponer un servidor local a la red externa
  fr: zoro peut vous aider à exposer un serveur local au réseau externe
  id: zoro dapat membantu Anda mengekspos server lokal ke jaringan eksternal
  it: zoro può aiutarti a esporre un server locale alla rete esterna
  ja: zoro はローカルサーバーを外部ネットワークに公開する助けになります
  ko: zoro는 로컬 서버를 외부 네트워크에 노출하는 데 도움을 줄 수 있습니다
  pl: zoro pomoże udostępnić lokalny serwer w sieci zewnętrznej
  pt: zoro pode ajudar você a expor um servidor local para a rede externa
  ro: zoro vă poate ajuta să expuneți un server local către rețeaua externă
  ru: zoro поможет вам открыть доступ к локальному серверу во внешней сети
  th: zoro ช่วยให้คุณเปิดเผยเซิร์ฟเวอร์ในเครื่องให้เข้าถึงได้จากเครือข่ายภายนอก
  tr: zoro, yerel sunucunuzu dış ağa açmanıza yardımcı olabilir
  uk: zoro допоможе вам відкрити доступ до локального сервера у зовнішній мережі
  vi: zoro có thể giúp bạn phơi bày máy chủ cục bộ ra mạng bên ngoài
x:
  source: https://github.com/txthinking/zoro
  eget: txthinking/zoro
  brew: zoro
rule:
  /x:
    cmd: x pkg use zoro
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/zoro
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install zoro
    reference: https://github.com/txthinking/zoro?tab=readme-ov-file#install-via-nami
  darwin/brew:
    cmd: brew install zoro
    reference: https://github.com/txthinking/zoro?tab=readme-ov-file#install-via-brew
binlist:
- zoro

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
