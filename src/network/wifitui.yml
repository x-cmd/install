lang: 'Go'
homepage: 'https://github.com/shazow/wifitui'
license: 'MIT'
desc:
  cn: 快速且功能丰富的友好 WiFi 终端 UI
  en: 'Fast featureful friendly wifi terminal UI. 🛜✨'
x:
  source: https://github.com/shazow/wifitui
  eget: https://github.com/shazow/wifitui
rule:
  /eget:
    cmd: x eget shazow/wifitui
    reference: https://github.com/shazow/wifitui
binlist:
  - 'wifitui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
