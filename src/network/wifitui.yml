lang: 'Go'
homepage: 'https://github.com/shazow/wifitui'
license: 'MIT'
desc:
  cn: 快速且功能丰富的友好 WiFi 终端 UI
  en: 'Fast featureful friendly wifi terminal UI. 🛜✨'
x:
  source: https://github.com/shazow/wifitui
  eget: shazow/wifitui
rule:
  /eget:
    cmd: x eget shazow/wifitui
    reference: https://github.com/shazow/wifitui
binlist:
- 'wifitui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
