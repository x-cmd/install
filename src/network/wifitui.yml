lang: 'Go'
homepage: 'https://github.com/shazow/wifitui'
license: 'MIT'
desc:
  cn: 快速且功能丰富的友好 WiFi 终端 UI
  en: 'Fast featureful friendly wifi terminal UI. 🛜✨'
  cs: Rychlé, funkční a přátelské terminálové UI pro WiFi
  de: Schnelle, funktionsreiche und freundliche Terminal-UI für WLAN
  es: Interfaz de terminal rápida, completa y amigable para WiFi
  fr: Interface terminal rapide, riche et conviviale pour le WiFi
  id: UI terminal WiFi yang cepat, lengkap, dan ramah
  it: UI terminale veloce, ricca di funzionalità e intuitiva per il WiFi
  ja: 高速で機能が豊富で親切な WiFi 用ターミナル UI
  ko: 빠르고 기능이 많으며 친절한 WiFi 터미널 UI
  pl: Szybki, bogaty w funkcje i przyjazny terminalowy interfejs dla WiFi
  pt: Interface de terminal rápida, cheia em recursos e amigável para WiFi
  ro: Interfață de terminal rapidă, bogată în funcții și prietenoasă pentru WiFi
  ru: Быстрый, функциональный и дружелюбный терминальный UI для WiFi
  th: UI เทอร์มินัลสำหรับ WiFi ที่รวดเร็ว มีความสามารถครบถ้วน และใช้งานง่าย
  tr: Hızlı, özellikli ve kullanıcı dostu WiFi terminal arayüzü
  uk: Швидкий, функціональний і зручний термінальний UI для WiFi
  vi: Giao diện terminal nhanh, giàu tính năng và thân thiện cho WiFi
x:
  source: https://github.com/shazow/wifitui
  eget: shazow/wifitui
rule:
  /eget:
    cmd: x eget shazow/wifitui
    reference: https://github.com/shazow/wifitui
binlist:
- 'wifitui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
