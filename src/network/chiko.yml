lang: 'Go'
homepage: 'https://github.com/felangga/chiko'
license: 'MIT'
desc:
  cn: 终端中极致优雅的 gRPC 客户端
  en: 'The ultimate beauty gRPC Client on your Terminal!'
x:
  source: https://github.com/felangga/chiko
  eget: https://github.com/felangga/chiko
rule:
  /eget:
    cmd: x eget felangga/chiko
    reference: https://github.com/felangga/chiko
binlist:
- 'chiko'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 311 KB
          rating: 1
          desc:
            cn: 约 311 KB（估算）
            en: ~311 KB estimated
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
