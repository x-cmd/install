lang: 'Go'
homepage: 'https://github.com/felangga/chiko'
license: 'MIT'
desc:
  cn: 终端中极致优雅的 gRPC 客户端
  en: 'The ultimate beauty gRPC Client on your Terminal!'
x:
  source: https://github.com/felangga/chiko
  eget: https://github.com/felangga/chiko
rule:
  /eget:
    cmd: x eget felangga/chiko
    reference: https://github.com/felangga/chiko
binlist:
  - 'chiko'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
