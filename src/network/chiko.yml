lang: 'Go'
homepage: 'https://github.com/felangga/chiko'
license: 'MIT'
desc:
  cn: 终端中极致优雅的 gRPC 客户端
  en: 'The ultimate beauty gRPC Client on your Terminal!'
  cs: Úžasně krásný gRPC klient ve vašem terminálu!
  de: Der ultimativ schöne gRPC-Client in Ihrem Terminal!
  es: ¡El cliente gRPC más bello para tu terminal!
  fr: Le plus beau client gRPC pour votre terminal !
  id: Klien gRPC paling indah di Terminal Anda!
  it: Il client gRPC più bello sul tuo terminale!
  ja: ターミナルで動作する最高の美しい gRPC クライアント!
  ko: 터미널에서 동작하는 가장 아름다운 gRPC 클라이언트!
  pl: Najpiękniejszy klient gRPC w Twoim terminalu!
  pt: O cliente gRPC mais bonito para o seu terminal!
  ro: Clientul gRPC cel mai elegant din terminalul dvs.!
  ru: Самый красивый gRPC-клиент в вашем терминале!
  th: ไคลเอนต์ gRPC ที่สวยงามที่สุดบนเทอร์มินัลของคุณ!
  tr: Terminalinizdeki en güzel gRPC istemcisi!
  uk: Найкрасивіший gRPC-клієнт у вашому терміналі!
  vi: Ứng dụng khách gRPC đẹp nhất trên terminal của bạn!
x:
  source: https://github.com/felangga/chiko
  eget: felangga/chiko
rule:
  /eget:
    cmd: x eget felangga/chiko
    reference: https://github.com/felangga/chiko
binlist:
- 'chiko'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
