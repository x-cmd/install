lang: 'Go'
homepage: https://github.com/retlehs/quien
license: 'MIT'
desc:
  cn: 更强大的 whois 与域名情报工具包
  en: 'A better whois and domain intelligence toolkit'
x:
  source: https://github.com/retlehs/quien
  eget: https://github.com/retlehs/quien
rule:
  /eget:
    cmd: x eget retlehs/quien
    reference: https://github.com/retlehs/quien
binlist:
  - 'quien'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 787 KB
          rating: 1
          desc:
            cn: 约 787 KB（估算）
            en: ~787 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
