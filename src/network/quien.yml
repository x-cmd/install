lang: 'Go'
homepage: https://github.com/retlehs/quien
license: 'MIT'
desc:
  cn: 更强大的 whois 与域名情报工具包
  en: 'A better whois and domain intelligence toolkit'
x:
  source: https://github.com/retlehs/quien
  eget: https://github.com/retlehs/quien
rule:
  /eget:
    cmd: x eget retlehs/quien
    reference: https://github.com/retlehs/quien
binlist:
  - 'quien'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
