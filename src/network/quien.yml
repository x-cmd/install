  en: 'A better whois and domain intelligence toolkit'
  cs: Lepší sada nástrojů pro whois a doménovou inteligenci
  de: Ein besseres Toolkit für whois und Domain-Intelligence
  es: Un mejor conjunto de herramientas para whois e inteligencia de dominios
  fr: Un meilleur kit d'outils pour whois et l'intelligence de domaine
  id: Kit alat whois dan intelijen domain yang lebih baik
  it: Un toolkit migliore per whois e intelligence dei domini
  ja: より優れた whois とドメインインテリジェンスのツールキット。
  ko: whois와 도메인 인텔리전스를 위한 더 나은 도구 모음.
  pl: Lepszy zestaw narzędzi do whois i analizy domen
  pt: Um conjunto de ferramentas melhor para whois e inteligência de domínios
  ro: Un set de instrumente mai bun pentru whois și inteligență de domeniu
  ru: Более удобный набор инструментов для whois и анализа доменов
  th: ชุดเครื่องมือ whois และ domain intelligence ที่ดีกว่า
  tr: whois ve alan adı istihbaratı için daha iyi bir araç seti
  uk: Кращий набір інструментів для whois та доменної розвідки
  vi: Bộ công cụ whois và phân tích miền tên tốt hơn
x:
  source: https://github.com/retlehs/quien
  eget: retlehs/quien
rule:
  /eget:
    cmd: x eget retlehs/quien
    reference: https://github.com/retlehs/quien
binlist:
- 'quien'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
