lang: Go
homepage: https://github.com/zu1k/nali
license: MIT
desc:
  cn: 一个查询 IP 地理信息和 CDN 服务提供商的离线终端工具
  en: An offline tool for querying IP geographic information and CDN provider
  cs: Offline nástroj pro dotazování geografických údajů IP a poskytovatele CDN
  de: Ein Offline-Tool zum Abfragen geografischer IP-Informationen und CDN-Anbieter
  es: Una herramienta offline para consultar información geográfica de IP y proveedores de CDN
  fr: Un outil hors ligne pour interroger les informations géographiques IP et les fournisseurs CDN
  id: Alat offline untuk menanyakan informasi geografis IP dan penyedia CDN
  it: Uno strumento offline per interrogare le informazioni geografiche IP e i provider CDN
  ja: IP の地理情報と CDN プロバイダーを問い合わせるオフラインツール
  ko: IP 지리 정보와 CDN 제공업체를 조회하는 오프라인 도구
  pl: Narzędzie offline do wyszukiwania informacji geograficznych IP i dostawców CDN
  pt: Uma ferramenta offline para consultar informações geográficas de IP e provedores de CDN
  ro: Un instrument offline pentru interogarea informațiilor geografice IP și a furnizorilor CDN
  ru: Офлайн-инструмент для запроса географической информации об IP и CDN-провайдерах
  th: เครื่องมือออฟไลน์สำหรับค้นหาข้อมูลภูมิศาสตร์ของ IP และผู้ให้บริการ CDN
  tr: IP coğrafi bilgilerini ve CDN sağlayıcılarını sorgulamak için çevrimdışı araç
  uk: Офлайн-інструмент для запиту географічної інформації про IP та CDN-провайдерів
  vi: Công cụ ngoại tuyến để tra cứu thông tin địa lý IP và nhà cung cấp CDN
x:
  source: https://github.com/zu1k/nali
  eget: zu1k/nali
  yay: nali-go-bin
  go: github.com/zu1k/nali@latest
rule:
  /eget:
    cmd: x eget zu1k/nali
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use nali
    reference: https://x-cmd.com/install/
  /go:
    cmd: go install github.com/zu1k/nali@latest
    reference: https://github.com/zu1k/nali/blob/master/README_en.md#install-from-source
    dsnap: github.com/zu1k/nali@latest
  arch/yay:
    cmd: yay -S nali-go-bin
    reference: https://aur.archlinux.org/packages/nali-go-bin
binlist:
- nali

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
