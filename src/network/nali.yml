lang: Go
homepage: https://github.com/zu1k/nali
license: MIT
desc:
  cn: 一个查询 IP 地理信息和 CDN 服务提供商的离线终端工具
  en: An offline tool for querying IP geographic information and CDN provider
x:
  pkg:
    exist: true
  source: https://github.com/zu1k/nali
  eget: https://github.com/zu1k/nali
rule:
  /eget:
    cmd: x eget zu1k/nali
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use nali
    reference: https://x-cmd.com/install/
  /go:
    cmd: go install github.com/zu1k/nali@latest
    reference: https://github.com/zu1k/nali/blob/master/README_en.md#install-from-source
    dsnap: github.com/zu1k/nali@latest
  arch/yay:
    cmd: yay -S nali-go-bin
    reference: https://aur.archlinux.org/packages/nali-go-bin
binlist:
- nali

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
