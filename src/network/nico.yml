lang: Go
homepage: https://github.com/txthinking/nico
license: GPL-3.0
desc:
  cn: 用于反向代理和单页应用的 HTTP3 Web 服务器
  en: A HTTP3 web server for reverse proxy and single page application
x:
  pkg:
    exist: true
  source: https://github.com/txthinking/nico
  eget: https://github.com/txthinking/nico
rule:
  /x:
    cmd: x pkg use nico
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/nico
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install nico
    reference: https://github.com/txthinking/nico?tab=readme-ov-file#install-via-nami
binlist:
- nico

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
