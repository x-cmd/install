lang: Go
homepage: https://github.com/txthinking/nico
license: GPL-3.0
desc:
  cn: 用于反向代理和单页应用的 HTTP3 Web 服务器
  en: A HTTP3 web server for reverse proxy and single page application
  cs: Webový server HTTP3 pro reverzní proxy a jednostránkové aplikace
  de: Ein HTTP3-Webserver für Reverse Proxy und Single-Page-Anwendungen
  es: Un servidor web HTTP3 para proxy inverso y aplicaciones de una sola página
  fr: Un serveur web HTTP3 pour proxy inverse et applications monopage
  id: Server web HTTP3 untuk reverse proxy dan aplikasi satu halaman
  it: Un server web HTTP3 per reverse proxy e applicazioni a pagina singola
  ja: リバースプロキシとシングルページアプリケーション向けの HTTP3 ウェブサーバー
  ko: 역방향 프록시와 단일 페이지 애플리케이션을 위한 HTTP3 웹 서버
  pl: Serwer WWW HTTP3 do odwrotnego proxy i aplikacji jednostronicowych
  pt: Um servidor web HTTP3 para proxy reverso e aplicações de página única
  ro: Un server web HTTP3 pentru proxy invers și aplicații cu o singură pagină
  ru: Веб-сервер HTTP3 для обратного прокси и одностраничных приложений
  th: เว็บเซิร์ฟเวอร์ HTTP3 สำหรับ reverse proxy และแอปพลิเคชันหน้าเดียว
  tr: Ters vekil ve tek sayfalık uygulamalar için bir HTTP3 web sunucusu
  uk: Веб-сервер HTTP3 для зворотного проксі та односторінкових застосунків
  vi: Máy chủ web HTTP3 dành cho reverse proxy và ứng dụng một trang
x:
  source: https://github.com/txthinking/nico
  eget: txthinking/nico
rule:
  /x:
    cmd: x pkg use nico
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/nico
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install nico
    reference: https://github.com/txthinking/nico?tab=readme-ov-file#install-via-nami
binlist:
- nico

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
