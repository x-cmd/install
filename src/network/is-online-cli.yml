homepage: https://github.com/sindresorhus/is-online-cli#readme
license: MIT
desc:
  cn: 检查网络是否连通
  en: Check if the internet connection is up
lang: JavaScript
x:
  source: https://github.com/sindresorhus/is-online-cli#readme
  npm: --global
rule:
  /x:
    cmd: x pkg use is-online-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global is-online-cli
    reference: https://github.com/sindresorhus/is-online-cli?tab=readme-ov-file#install
    dsnap: is-online-cli
binlist:
- is-online-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
