lang: Shell
homepage: https://github.com/nitefood/asn
license: MIT
desc:
  cn: ASN 查询工具和 Traceroute（路由跟踪）服务器。
  en: ASN lookup tool and traceroute server
x:
  source: https://github.com/nitefood/asn
rule:
  darwin/brew:
    cmd: brew install asn
    reference: https://formulae.brew.sh/formula/asn#default
  ubuntu/apt:
    cmd: sudo apt update && sudo apt install asn
    reference: https://github.com/nitefood/asn?tab=readme-ov-file#method-2-installing-a-packaged-version-of-the-script
    dsnap: asn
  debian/apt:
    cmd: sudo apt update && sudo apt install asn
    reference: https://github.com/nitefood/asn?tab=readme-ov-file#method-2-installing-a-packaged-version-of-the-script
    dsnap: asn
  kali/apt:
    cmd: sudo apt update && sudo apt install asn
    reference: https://github.com/nitefood/asn?tab=readme-ov-file#method-2-installing-a-packaged-version-of-the-script
    dsnap: asn
  arch/yay:
    cmd: yay -S asn-git
    reference: https://github.com/nitefood/asn?tab=readme-ov-file#method-2-installing-a-packaged-version-of-the-script
  alpine/apk:
    cmd: apk add -X https://dl-cdn.alpinelinux.org/alpine/v3.19/community asn
    reference: https://github.com/nitefood/asn?tab=readme-ov-file#method-2-installing-a-packaged-version-of-the-script
    dsnap: asn
binlist:
- asn

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
