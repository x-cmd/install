lang: Go
homepage: https://github.com/bufbuild/buf
license: Apache-2.0
desc:
  cn: protobuf 的 CLI 工具
  en: The buf CLI is a tool for working with Protocol Buffers
x:
  source: https://github.com/bufbuild/buf
  eget: https://github.com/bufbuild/buf
rule:
  /eget:
    cmd: x eget bufbuild/buf
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use buf
    reference: https://github.com/truepay/asdf-buf
  (win|wsl2)/scoop:
    cmd: x scoop install buf
    reference: https://scoop.sh/#/apps?q=buf
  arch/yay:
    cmd: yay -S buf-bin
    reference: https://aur.archlinux.org/packages/buf-bin
  darwin/brew:
    cmd: brew install bufbuild/buf/buf
    reference: https://buf.build/docs/installation
  /npm:
    cmd: npm install @bufbuild/buf
    reference: https://buf.build/docs/installation
    dsnap: '@bufbuild/buf'
binlist:
- buf
