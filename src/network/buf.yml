lang: Go
homepage: https://github.com/bufbuild/buf
license: Apache-2.0
desc:
  cn: protobuf 的 CLI 工具
  en: The buf CLI is a tool for working with Protocol Buffers
x:
  source: https://github.com/bufbuild/buf
  eget: https://github.com/bufbuild/buf
rule:
  /eget:
    cmd: x eget bufbuild/buf
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use buf
    reference: https://github.com/truepay/asdf-buf
  (win|wsl2)/scoop:
    cmd: x scoop install buf
    reference: https://scoop.sh/#/apps?q=buf
  arch/yay:
    cmd: yay -S buf-bin
    reference: https://aur.archlinux.org/packages/buf-bin
  darwin/brew:
    cmd: brew install bufbuild/buf/buf
    reference: https://buf.build/docs/installation
  /npm:
    cmd: npm install @bufbuild/buf
    reference: https://buf.build/docs/installation
    dsnap: '@bufbuild/buf'
binlist:
- buf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 52 MB
          rating: 3
          desc:
            cn: 安装 52 MB
            en: 52 MB install
        download:
          estimate: 52 MB
          desc:
            cn: 约 52 MB 下载 (linux/x64)
            en: ~52 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
