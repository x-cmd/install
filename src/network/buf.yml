lang: Go
homepage: https://github.com/bufbuild/buf
license: Apache-2.0
desc:
  cn: protobuf 的 CLI 工具
  en: The buf CLI is a tool for working with Protocol Buffers
  cs: Nástroj CLI buf je nástroj pro práci s Protocol Buffers
  de: Das buf CLI ist ein Werkzeug für den Umgang mit Protocol Buffers
  es: La CLI de buf es una herramienta para trabajar con Protocol Buffers
  fr: Le CLI buf est un outil pour travailler avec Protocol Buffers
  id: CLI buf adalah alat untuk bekerja dengan Protocol Buffers
  it: La CLI di buf è uno strumento per lavorare con Protocol Buffers
  ja: buf CLI は Protocol Buffers を扱うためのツールです
  ko: buf CLI는 Protocol Buffers로 작업하기 위한 도구입니다
  pl: Narzędzie CLI buf służy do pracy z Protocol Buffers
  pt: A CLI do buf é uma ferramenta para trabalhar com Protocol Buffers
  ro: CLI-ul buf este un instrument pentru lucrul cu Protocol Buffers
  ru: buf CLI — это инструмент для работы с Protocol Buffers
  th: buf CLI เป็นเครื่องมือสำหรับทำงานกับ Protocol Buffers
  tr: buf CLI, Protocol Buffers ile çalışmak için bir araçtır
  uk: buf CLI — це інструмент для роботи з Protocol Buffers
  vi: CLI buf là công cụ để làm việc với Protocol Buffers
x:
  source: https://github.com/bufbuild/buf
  eget: bufbuild/buf
  brew: bufbuild/buf/buf
  scoop: buf
  yay: buf-bin
  npm: "@bufbuild/buf"
  asdf: buf
rule:
  /eget:
    cmd: x eget bufbuild/buf
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use buf
    reference: https://github.com/truepay/asdf-buf
  (win|wsl2)/scoop:
    cmd: x scoop install buf
    reference: https://scoop.sh/#/apps?q=buf
  arch/yay:
    cmd: yay -S buf-bin
    reference: https://aur.archlinux.org/packages/buf-bin
  darwin/brew:
    cmd: brew install bufbuild/buf/buf
    reference: https://buf.build/docs/installation
  /npm:
    cmd: npm install @bufbuild/buf
    reference: https://buf.build/docs/installation
    dsnap: '@bufbuild/buf'
binlist:
- buf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 52 MB
          rating: 3
          desc:
            cn: 安装 52 MB
            en: 52 MB install
        download:
          estimate: 52 MB
          desc:
            cn: 约 52 MB 下载 (linux/x64)
            en: ~52 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
