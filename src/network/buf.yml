lang: Go
homepage: https://github.com/bufbuild/buf
license: Apache-2.0
desc:
  cn: protobuf 的 CLI 工具
  en: The buf CLI is a tool for working with Protocol Buffers
x:
  source: https://github.com/bufbuild/buf
  eget: https://github.com/bufbuild/buf
rule:
  /eget:
    cmd: x eget bufbuild/buf
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use buf
    reference: https://github.com/truepay/asdf-buf
  (win|wsl2)/scoop:
    cmd: x scoop install buf
    reference: https://scoop.sh/#/apps?q=buf
  arch/yay:
    cmd: yay -S buf-bin
    reference: https://aur.archlinux.org/packages/buf-bin
  darwin/brew:
    cmd: brew install bufbuild/buf/buf
    reference: https://buf.build/docs/installation
  /npm:
    cmd: npm install @bufbuild/buf
    reference: https://buf.build/docs/installation
    dsnap: '@bufbuild/buf'
binlist:
- buf

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
