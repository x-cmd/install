lang: Go
homepage: https://github.com/natesales/q
license: GPL-3.0
desc:
  cn: 一个小型命令行 DNS 客户端，支持 UDP、TCP、DoT、DoH、DoQ 和 ODoH
  en: A tiny command line DNS client with support for UDP, TCP, DoT, DoH, DoQ and ODoH
x:
  source: https://github.com/natesales/q
  eget: https://github.com/natesales/q
  yay: q-dns
  go: github.com/natesales/q@latest
  curl: curl
rule:
  /x:
    cmd: x pkg use q
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget natesales/q
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S q-dns
    reference: https://aur.archlinux.org/packages/q-dns
  /go:
    cmd: go install github.com/natesales/q@latest
    reference: https://github.com/natesales/q?tab=readme-ov-file#installation
    dsnap: github.com/natesales/q@latest
  /apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.natesales.net/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/natesales.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/natesales.gpg] https://repo.natesales.net/apt * *" | sudo tee /etc/apt/sources.list.d/natesales.list

      '
    reference: https://github.com/natesales/repo?tab=readme-ov-file#apt
  /yum:
    cmd: 'echo ''[natesales] \

      && name=Nate Sales \

      && baseurl=https://repo.natesales.net/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.natesales.net/apt/gpg.key \

      && '' | sudo tee /etc/yum.repos.d/natesales.repo \

      '
    reference: https://github.com/natesales/repo?tab=readme-ov-file#yum
  darwin/brew:
    cmd: brew tap natesales/repo https://github.com/natesales/repo
    reference: https://github.com/natesales/repo?tab=readme-ov-file#brew
binlist:
- q

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
