lang: Rust
homepage: https://github.com/mike-engel/jwt-cli
license: MIT
desc:
  cn: jwt-cli 是一个命令行工具，可以帮助您使用 JSON Web Tokens (JWT)
  en: jwt-cli is a command line tool to help you work with JSON Web Tokens (JWTs)
  cs: jwt-cli je nástroj příkazové řádky, který vám pomůže pracovat s JSON Web Tokens (JWT)
  de: jwt-cli ist ein Kommandozeilen-Tool, das Ihnen beim Umgang mit JSON Web Tokens (JWTs) hilft
  es: jwt-cli es una herramienta de línea de comandos que te ayuda a trabajar con JSON Web Tokens (JWT)
  fr: jwt-cli est un outil en ligne de commande qui vous aide à travailler avec les JSON Web Tokens (JWT)
  id: jwt-cli adalah alat baris perintah untuk membantu Anda bekerja dengan JSON Web Tokens (JWT)
  it: jwt-cli è uno strumento da riga di comando che ti aiuta a lavorare con JSON Web Tokens (JWT)
  ja: jwt-cliはJSON Web Tokens (JWT)の扱いを助于コマンドラインツールです
  ko: jwt-cli는 JSON Web Tokens(JWT)를 다루도록 돕는 명령줄 도구입니다
  pl: jwt-cli to narzędzie wiersza poleceń, które pomaga pracować z JSON Web Tokens (JWT)
  pt: jwt-cli é uma ferramenta de linha de comando que ajuda você a trabalhar com JSON Web Tokens (JWTs)
  ro: jwt-cli este un instrument de linie de comandă care vă ajută să lucrați cu JSON Web Tokens (JWT)
  ru: jwt-cli — инструмент командной строки, который помогает работать с JSON Web Tokens (JWT)
  th: jwt-cli เป็นเครื่องมือบรรทัดคำสั่งที่ช่วยคุณทำงานกับ JSON Web Tokens (JWT)
  tr: jwt-cli, JSON Web Tokens (JWT) ile çalışmanıza yardımcı olan bir komut satırı aracıdır
  uk: jwt-cli — інструмент командного рядка, який допомагає працювати з JSON Web Tokens (JWT)
  vi: jwt-cli là công cụ dòng lệnh giúp bạn làm việc với JSON Web Tokens (JWT)
x:
  source: https://github.com/mike-engel/jwt-cli
  eget: mike-engel/jwt-cli
  brew: mike-engel/jwt-cli/jwt-cli
  port: jwt-cli
  cargo: jwt-cli
rule:
  /eget:
    cmd: x eget mike-engel/jwt-cli
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install jwt-cli
    reference: https://github.com/mike-engel/jwt-cli?tab=readme-ov-file#cargo
    dsnap: jwt-cli
  darwin/brew:
    cmd: brew install mike-engel/jwt-cli/jwt-cli
    reference: https://github.com/mike-engel/jwt-cli?tab=readme-ov-file#homebrew
  darwin/port:
    cmd: sudo port install jwt-cli
    reference: https://github.com/mike-engel/jwt-cli?tab=readme-ov-file#macports
binlist:
- jwt-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/arm64)
            en: ~1 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
