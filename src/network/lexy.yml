lang: 'Python'
homepage: https://github.com/antoniorodr/lexy
license: 'Apache-2.0'
desc:
  cn: 轻量 CLI 工具，将 Learn X in Y Minutes 编程教程直接拉到终端
  en: 'Lexy is a lightweight CLI tool that fetches programming tutorials from "Learn X in Y Minutes" directly into your terminal. Quickly search, learn, and reference code examples without leaving your wo...'
x:
  source: https://github.com/antoniorodr/lexy
  eget: https://github.com/antoniorodr/lexy
rule:
  /eget:
    cmd: x eget antoniorodr/lexy
    reference: https://github.com/antoniorodr/lexy
binlist:
- 'lexy'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
        download:
          estimate: 13 KB
          desc:
            cn: 约 13 KB 下载 (whl)
            en: ~13 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
