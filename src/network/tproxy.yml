lang: Go
desc:
  cn: 用于代理和分析 TCP 连接的 cli 工具
  en: A cli tool for proxying and analyzing TCP connections
homepage: https://github.com/kevwan/tproxy
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/kevwan/tproxy
  eget: https://github.com/kevwan/tproxy
rule:
  /x:
    cmd: x pkg use tproxy
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget kevwan/tproxy
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/kevwan/tproxy@latest
    reference: https://github.com/kevwan/tproxy?tab=readme-ov-file#installation
    dsnap: github.com/kevwan/tproxy
  (win|wsl2)/scoop:
    cmd: scoop install tproxy
    reference: https://github.com/kevwan/tproxy?tab=readme-ov-file#installation
binlist:
- tproxy

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
