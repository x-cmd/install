lang: Go
desc:
  cn: 用于代理和分析 TCP 连接的 cli 工具
  en: A cli tool for proxying and analyzing TCP connections
  cs: Nástroj CLI pro proxyování a analýzu připojení TCP
  de: Ein CLI-Tool zum Proxyen und Analysieren von TCP-Verbindungen
  es: Una herramienta de CLI para proxificar y analizar conexiones TCP
  fr: Un outil CLI pour le proxy et l'analyse des connexions TCP
  id: Alat CLI untuk memproksikan dan menganalisis koneksi TCP
  it: Uno strumento CLI per il proxy e l'analisi delle connessioni TCP
  ja: TCP 接続のプロキシと解析を行う CLI ツール。
  ko: TCP 연결을 프록시하고 분석하는 CLI 도구입니다.
  pl: Narzędzie CLI do proxyowania i analizy połączeń TCP
  pt: Uma ferramenta de CLI para fazer proxy e analisar conexões TCP
  ro: Un instrument CLI pentru proxy și analiza conexiunilor TCP
  ru: CLI-инструмент для проксирования и анализа TCP-соединений
  th: เครื่องมือ CLI สำหรับพร็อกซีและวิเคราะห์การเชื่อมต่อ TCP
  tr: TCP bağlantılarını proxy'lemek ve analiz etmek için bir CLI aracı
  uk: CLI-інструмент для проксювання та аналізу TCP-з'єднань
  vi: Công cụ CLI để proxy và phân tích các kết nối TCP
homepage: https://github.com/kevwan/tproxy
license: MIT
x:
  source: https://github.com/kevwan/tproxy
  eget: kevwan/tproxy
  scoop: tproxy
  go: github.com/kevwan/tproxy@latest
rule:
  /x:
    cmd: x pkg use tproxy
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget kevwan/tproxy
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/kevwan/tproxy@latest
    reference: https://github.com/kevwan/tproxy?tab=readme-ov-file#installation
    dsnap: github.com/kevwan/tproxy
  (win|wsl2)/scoop:
    cmd: scoop install tproxy
    reference: https://github.com/kevwan/tproxy?tab=readme-ov-file#installation
binlist:
- tproxy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
