lang: 'Go'
homepage: 'https://github.com/TheYahya/enola'
license: 'MIT'
desc:
  cn: Golang 编写的现代 CLI 工具,按用户名在各大社交网络中追踪账号
  en: 'This is Sherlock''s sister, Modern shiny CLI tool written with Golang to help you: 🔎 Hunt down social media accounts by username across social networks'
x:
  source: https://github.com/TheYahya/enola
  eget: https://github.com/TheYahya/enola
rule:
  /eget:
    cmd: x eget TheYahya/enola
    reference: https://github.com/TheYahya/enola
binlist:
  - 'enola'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
