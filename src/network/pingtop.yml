lang: Python
homepage: https://github.com/laixintao/pingtop
license: MIT
desc:
  cn: 用于 ping 多个服务器并在类似 top 的终端 UI 中显示结果的 TUI 工具
  en: A TUI tool for pinging multiple servers and showing the result in a top like terminal UI.
x:
  source: https://github.com/laixintao/pingtop
rule:
  /pip:
    cmd: pip install pingtop
    reference: https://github.com/laixintao/pingtop#installation
    dsnap: pingtop
binlist:
- pingtop

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
