lang: Python
homepage: https://github.com/laixintao/pingtop
license: MIT
desc:
  cn: 用于 ping 多个服务器并在类似 top 的终端 UI 中显示结果的 TUI 工具
  en: A TUI tool for pinging multiple servers and showing the result in a top like terminal UI.
x:
  source: https://github.com/laixintao/pingtop
rule:
  /pip:
    cmd: pip install pingtop
    reference: https://github.com/laixintao/pingtop#installation
    dsnap: pingtop
binlist:
- pingtop

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
