lang: 'Rust'
homepage: 'https://github.com/CramBL/mdns-scanner'
license: 'Apache-2.0'
desc:
  cn: 扫描网络并生成 IP 与对应主机名列表，含 mDNS 主机名等别名
  en: 'Scan a network and create a list of IPs and associated hostnames, including mDNS hostnames and other aliases.'
x:
  source: https://github.com/CramBL/mdns-scanner
  eget: https://github.com/CramBL/mdns-scanner
rule:
  /eget:
    cmd: x eget CramBL/mdns-scanner
    reference: https://github.com/CramBL/mdns-scanner
binlist:
- 'mdns-scanner'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
