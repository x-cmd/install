lang: JavaScript
homepage: https://github.com/parvardegr/sharing
license: MIT
desc:
  cn: Sharing 是一个命令行工具，可将 CLI 中的目录和文件共享到 iOS 和 Android 设备，无需额外的客户端应用程序
  en: Sharing is a command-line tool to share directories and files from the CLI to iOS and Android devices without the need of an extra client app
x:
  pkg:
    exist: true
  source: https://github.com/parvardegr/sharing
rule:
  /x:
    cmd: x pkg use easy-sharing
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g easy-sharing
    reference: https://github.com/parvardegr/sharing?tab=readme-ov-file#usage
    dsnap: easy-sharing
binlist:
- easy-sharing

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
