lang: 'Shell'
homepage: 'https://github.com/Benexl/yt-x'
license: 'MIT'
desc:
  cn: POSIX 脚本，用 fzf/rofi 从终端浏览 YouTube 等 yt-dlp 支持的站点
  en: 'Posix script to browse youtube plus other yt-dlp supported sites from your terminal (fzf) or app launcher (rofi) with optional previews. (supports bash, zsh and dash)'
x:
  source: https://github.com/Benexl/yt-x
  eget: https://github.com/Benexl/yt-x
rule:
  /eget:
    cmd: x eget Benexl/yt-x
    reference: https://github.com/Benexl/yt-x
binlist:
  - 'yt-x'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
