lang: Python
homepage: https://github.com/taylorwilsdon/netshow
desc:
  cn: 轻量高性能的交互式网络连接监控器，显示友好的服务名
  en: Lightweight, performant interactive network connection monitor with friendly service names
x:
  source: https://github.com/taylorwilsdon/netshow
  eget: https://github.com/taylorwilsdon/netshow
rule:
  /eget:
    cmd: x eget taylorwilsdon/netshow
    reference: https://github.com/taylorwilsdon/netshow
binlist:
- netshow
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 KB
          rating: 1
          desc:
            cn: 安装 17 KB
            en: 17 KB install
        download:
          estimate: 17 KB
          desc:
            cn: 约 17 KB 下载 (whl)
            en: ~17 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
