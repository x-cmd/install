lang: Python
homepage: https://github.com/taylorwilsdon/netshow
desc:
  cn: 轻量高性能的交互式网络连接监控器，显示友好的服务名
  en: Lightweight, performant interactive network connection monitor with friendly service names
x:
  source: https://github.com/taylorwilsdon/netshow
  eget: https://github.com/taylorwilsdon/netshow
rule:
  /eget:
    cmd: x eget taylorwilsdon/netshow
    reference: https://github.com/taylorwilsdon/netshow
binlist:
- netshow
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
