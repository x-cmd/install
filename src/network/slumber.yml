lang: Rust
homepage: https://github.com/LucasPickering/slumber
license: MIT
desc:
  cn: Slumber 是一个基于终端的用户界面（TUI）HTTP 客户端。
  en: Slumber is a TUI (terminal user interface) HTTP client.
  cs: Slumber je HTTP klient s TUI (terminálovým uživatelským rozhraním).
  de: Slumber ist ein TUI- (Terminal-Benutzeroberfläche) HTTP-Client.
  es: Slumber es un cliente HTTP con TUI (interfaz de usuario de terminal).
  fr: Slumber est un client HTTP à interface utilisateur terminal (TUI).
  id: Slumber adalah klien HTTP dengan TUI (antarmuka pengguna terminal).
  it: Slumber è un client HTTP con TUI (interfaccia utente a terminale).
  ja: Slumber は TUI (ターミナルユーザーインターフェース) の HTTP クライアントです。
  ko: Slumber는 TUI(터미널 사용자 인터페이스) HTTP 클라이언트입니다.
  pl: Slumber to klient HTTP z TUI (interfejsem użytkownika w terminalu).
  pt: Slumber é um cliente HTTP com TUI (interface de usuário de terminal).
  ro: Slumber este un client HTTP cu TUI (interfață de utilizator în terminal).
  ru: Slumber — это HTTP-клиент с TUI (терминальным пользовательским интерфейсом).
  th: Slumber เป็นไคลเอนต์ HTTP แบบ TUI (ส่วนติดต่อผู้ใช้บนเทอร์มินัล)
  tr: Slumber, TUI (terminal kullanıcı arayüzü) HTTP istemcisidir.
  uk: Slumber — це HTTP-клієнт із TUI (термінальним користувацьким інтерфейсом).
  vi: Slumber là HTTP client có TUI (giao diện người dùng trên terminal).
x:
  source: https://github.com/LucasPickering/slumber
  eget: LucasPickering/slumber
  brew: slumber
  cargo: slumber
rule:
  /eget:
    cmd: x eget LucasPickering/slumber
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/LucasPickering/slumber/releases/download/v3.0.1/slumber-installer.sh | sh
    reference: https://github.com/LucasPickering/slumber/releases
  /brew:
    cmd: brew install slumber
    reference: https://formulae.brew.sh/formula/slumber#default
  /cargo:
    cmd: cargo install slumber --locked
    reference: https://slumber.lucaspickering.me/artifacts/
    dsnap: slumber
  (win|wsl2)/powershell:
    cmd: powershell -ExecutionPolicy ByPass -c "irm https://github.com/LucasPickering/slumber/releases/download/v3.0.1/slumber-installer.ps1 | iex"
    reference: https://github.com/LucasPickering/slumber/releases
binlist:
- slumber

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
