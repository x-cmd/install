lang: C++
homepage: https://github.com/ifax/HylaFAX
desc:
  en: HylaFAX™ is an enterprise-class open-source system for sending and receiving facsimiles as well as for sending alpha-numeric pages.
  cn: HylaFAX™ 是一个企业级的开源系统，用于发送和接收传真以及发送字母数字页面。
x:
  source: https://github.com/ifax/HylaFAX
rule:
  fedora/dnf:
    cmd: sudo dnf install hylafax+
    reference: https://command-not-found.com/rfc2047-encode.awk
    dsnap: hylafax+
  arch/yay:
    cmd: yay -S hylafaxplus
    reference: https://aur.archlinux.org/packages/hylafaxplus
binlist:
- hylafax
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.6 MB
          rating: 1
          desc:
            cn: 约 3.6 MB（估算）
            en: ~3.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
