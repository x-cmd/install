lang: Go
homepage: https://github.com/gcla/termshark
license: MIT
desc:
  cn: 一个受到 Wireshark 启发的 tshark 终端用户界面
  en: A terminal UI for tshark, inspired by Wireshark
  cs: Terminálové UI pro tshark, inspirované Wiresharkem
  de: Eine Terminal-Oberfläche für tshark, inspiriert von Wireshark
  es: Una interfaz de terminal para tshark, inspirada en Wireshark
  fr: Une interface terminal pour tshark, inspirée de Wireshark
  id: Antarmuka terminal untuk tshark, terinspirasi dari Wireshark
  it: Un'interfaccia a terminale per tshark, ispirata a Wireshark
  ja: Wiresharkから着想を得た、tsharkのターミナルUI
  ko: Wireshark에서 영감을 받은 tshark용 터미널 UI
  pl: Terminalowy interfejs użytkownika dla tshark, inspirowany Wiresharkiem
  pt: Uma interface de terminal para o tshark, inspirada no Wireshark
  ro: O interfață terminal pentru tshark, inspirată de Wireshark
  ru: Терминальный интерфейс для tshark, вдохновлённый Wireshark
  th: ส่วนติดต่อผู้ใช้แบบเทอร์มินัลสำหรับ tshark ได้รับแรงบันดาลใจจาก Wireshark
  tr: Wireshark'tan esinlenilmiş, tshark için bir terminal arayüzü
  uk: Термінальний інтерфейс для tshark, натхненний Wireshark
  vi: Giao diện terminal cho tshark, lấy cảm hứng từ Wireshark
x:
  source: https://github.com/gcla/termshark
  eget: gcla/termshark
  apt: termshark
  brew: termshark
  pacman: termshark
  snap: termshark
  port: termshark
  yay: termshark-git
rule:
  /x:
    cmd: x pkg use termshark
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget gcla/termshark
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install termshark
    reference: https://formulae.brew.sh/formula/termshark#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install termshark
    reference: https://github.com/gcla/termshark/blob/master/docs/Packages.md#macports
  debian/apt:
    cmd: sudo apt install termshark
    reference: https://github.com/gcla/termshark/blob/master/docs/Packages.md#debian
    dsnap: termshark
  ubuntu/apt:
    cmd: sudo apt install termshark
    reference: https://github.com/gcla/termshark/blob/master/docs/Packages.md#ubuntu
    dsnap: termshark
  arch/pacman:
    cmd: sudo pacman -S termshark
    reference: https://linux-packages.com/arch-linux/package/termshark
  arch/yay:
    cmd: yay -S termshark-git
    reference: https://aur.archlinux.org/packages/termshark-git
  nix/nixpkgs:
    cmd: 'sudo nix-channel --add https://nixos.org/channels/nixpkgs-unstable \

      && sudo nix-channel --update \

      && sudo nix-env -iA nixpkgs.termshark

      '
    reference: https://github.com/gcla/termshark/blob/master/docs/Packages.md#nixos
  freebsd/pkg:
    cmd: pkg install termshark
    reference: https://github.com/gcla/termshark/blob/master/docs/Packages.md#freebsd
  kali/apt:
    cmd: sudo apt install termshark
    reference: https://github.com/gcla/termshark/blob/master/docs/Packages.md#kali-linux
    dsnap: termshark
  /snap:
    cmd: sudo snap install termshark
    reference: https://github.com/gcla/termshark/blob/master/docs/Packages.md#snapcraft
binlist:
- termshark

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
