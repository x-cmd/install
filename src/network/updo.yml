lang: Go
homepage: https://github.com/Owloops/updo
license: MIT
desc:
  cn: Updo 是一个用于监控网站正常运行时间和性能的命令行工具。
  en: Updo is a command-line tool for monitoring website uptime and performance.
  cs: Updo je nástroj příkazové řádky pro monitorování uptime a výkonu webových stránek.
  de: Updo ist ein Kommandozeilenwerkzeug zur Überwachung der Verfügbarkeit und Leistung von Websites.
  es: Updo es una herramienta de línea de comandos para monitorear el tiempo de actividad y el rendimiento de los sitios web.
  fr: Updo est un outil en ligne de commande pour surveiller la disponibilité et les performances des sites web.
  id: Updo adalah alat baris perintah untuk memantau uptime dan performa situs web.
  it: Updo è uno strumento da riga di comando per monitorare uptime e prestazioni dei siti web.
  ja: Updo は Web サイトの稼働時間とパフォーマンスを監視するコマンドラインツールです。
  ko: Updo는 웹사이트의 가동 시간과 성능을 모니터링하는 명령줄 도구입니다.
  pl: Updo jest narzędziem wiersza poleceń do monitorowania czasu działania i wydajności witryn.
  pt: O Updo é uma ferramenta de linha de comando para monitorar o tempo de atividade e o desempenho de sites.
  ro: Updo este un instrument de linie de comandă pentru monitorizarea disponibilității și a performanței site-urilor web.
  ru: Updo — инструмент командной строки для мониторинга доступности и производительности веб-сайтов.
  th: Updo เป็นเครื่องมือบรรทัดคำสั่งสำหรับตรวจสอบเวลาทำงานและประสิทธิภาพของเว็บไซต์
  tr: Updo, web sitelerinin çalışma süresini ve performansını izlemek için bir komut satırı aracıdır.
  uk: Updo — інструмент командного рядка для моніторингу доступності та продуктивності веб-сайтів.
  vi: Updo là công cụ dòng lệnh để giám sát thời gian hoạt động và hiệu năng của trang web.
x:
  source: https://github.com/Owloops/updo
  yay: updo
  go: github.com/Owloops/updo@latest
rule:
  /go:
    cmd: go install github.com/Owloops/updo@latest
    reference: https://github.com/Owloops/updo#installation
    dsnap: github.com/Owloops/updo@latest
  arch/yay:
    cmd: yay -S updo
    reference: https://aur.archlinux.org/packages/updo
  /eget:
    cmd: eget Owloops/updo
    reference: https://github.com/Owloops/updo#installation
binlist:
- updo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 18 MB
          rating: 2
          desc:
            cn: 安装 18 MB
            en: 18 MB install
        download:
          estimate: 18 MB
          desc:
            cn: 约 18 MB 下载 (linux/x64)
            en: ~18 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
