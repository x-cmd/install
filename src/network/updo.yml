lang: Go
homepage: https://github.com/Owloops/updo
license: MIT
desc:
  cn: Updo 是一个用于监控网站正常运行时间和性能的命令行工具。
  en: Updo is a command-line tool for monitoring website uptime and performance.
x:
  source: https://github.com/Owloops/updo
  yay: updo
  go: github.com/Owloops/updo@latest
rule:
  /go:
    cmd: go install github.com/Owloops/updo@latest
    reference: https://github.com/Owloops/updo#installation
    dsnap: github.com/Owloops/updo@latest
  arch/yay:
    cmd: yay -S updo
    reference: https://aur.archlinux.org/packages/updo
  /eget:
    cmd: eget Owloops/updo
    reference: https://github.com/Owloops/updo#installation
binlist:
- updo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 18 MB
          rating: 2
          desc:
            cn: 安装 18 MB
            en: 18 MB install
        download:
          estimate: 18 MB
          desc:
            cn: 约 18 MB 下载 (linux/x64)
            en: ~18 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
