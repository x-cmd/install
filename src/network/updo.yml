lang: Go
homepage: https://github.com/Owloops/updo
license: MIT
desc:
  cn: Updo 是一个用于监控网站正常运行时间和性能的命令行工具。
  en: Updo is a command-line tool for monitoring website uptime and performance.
x:
  source: https://github.com/Owloops/updo
rule:
  /go:
    cmd: go install github.com/Owloops/updo@latest
    reference: https://github.com/Owloops/updo#installation
    dsnap: github.com/Owloops/updo@latest
  arch/yay:
    cmd: yay -S updo
    reference: https://aur.archlinux.org/packages/updo
  /eget:
    cmd: eget Owloops/updo
    reference: https://github.com/Owloops/updo#installation
binlist:
- updo

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
