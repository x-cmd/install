lang: 'Python'
homepage: https://github.com/stabldev/torrra
license: 'MIT'
desc:
  cn: Python 工具，在 CLI 中搜索并下载 torrent
  en: 'A Python tool that lets you search and download torrents without leaving your CLI.'
x:
  source: https://github.com/stabldev/torrra
  eget: https://github.com/stabldev/torrra
rule:
  /eget:
    cmd: x eget stabldev/torrra
    reference: https://github.com/stabldev/torrra
binlist:
  - 'torra'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
