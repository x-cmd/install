lang: 'Python'
homepage: https://github.com/stabldev/torrra
license: 'MIT'
desc:
  cn: Python 工具，在 CLI 中搜索并下载 torrent
  en: 'A Python tool that lets you search and download torrents without leaving your CLI.'
  cs: Nástroj v Pythonu, který vám umožní vyhledávat a stahovat torrenty bez opuštění CLI.
  de: Ein Python-Tool, mit dem Sie Torrents suchen und herunterladen können, ohne Ihr CLI zu verlassen.
  es: Una herramienta de Python que te permite buscar y descargar torrents sin salir de tu CLI.
  fr: Un outil Python qui vous permet de rechercher et télécharger des torrents sans quitter votre CLI.
  id: Alat Python yang memungkinkan Anda mencari dan mengunduh torrent tanpa meninggalkan CLI.
  it: Uno strumento Python che ti permette di cercare e scaricare torrent senza uscire dalla tua CLI.
  ja: CLI を離れることなくTorrent を検索・ダウンロードできる Python ツール。
  ko: CLI를 벗어나지 않고 토렌트를 검색하고 다운로드할 수 있는 Python 도구입니다.
  pl: Narzędzie w Pythonie, które pozwala wyszukiwać i pobierać torrenty bez opuszczania wiersza poleceń.
  pt: Uma ferramenta Python que permite pesquisar e baixar torrents sem sair do seu CLI.
  ro: Un instrument Python care vă permite să căutați și să descărcați torrente fără a părăsi CLI-ul.
  ru: Инструмент на Python, позволяющий искать и скачивать торренты, не покидая командную строку.
  th: เครื่องมือ Python ที่ให้คุณค้นหาและดาวน์โหลดทอร์เรนต์ได้โดยไม่ต้องออกจาก CLI
  tr: CLI'den ayrılmadan torrent aramanıza ve indirmenize olanak sağlayan bir Python aracı.
  uk: Інструмент на Python, який дозволяє шукати та завантажувати торренти, не залишаючи командний рядок.
  vi: Một công cụ Python giúp bạn tìm kiếm và tải torrent mà không cần rời khỏi CLI.
x:
  source: https://github.com/stabldev/torrra
  eget: stabldev/torrra
rule:
  /eget:
    cmd: x eget stabldev/torrra
    reference: https://github.com/stabldev/torrra
binlist:
  - 'torra'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
