lang: 'Python'
homepage: https://github.com/stabldev/torrra
license: 'MIT'
desc:
  cn: Python 工具，在 CLI 中搜索并下载 torrent
  en: 'A Python tool that lets you search and download torrents without leaving your CLI.'
x:
  source: https://github.com/stabldev/torrra
  eget: https://github.com/stabldev/torrra
rule:
  /eget:
    cmd: x eget stabldev/torrra
    reference: https://github.com/stabldev/torrra
binlist:
  - 'torra'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
