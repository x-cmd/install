lang: Go
homepage: https://github.com/go-gost/gost
license: MIT
desc:
  cn: GO 语言实现的安全隧道
  en: A simple security tunnel written in Golang
  cs: Jednoduchý bezpečnostní tunel napsaný v Golang
  de: Ein einfacher Sicherheitstunnel, geschrieben in Golang
  es: Un sencillo túnel de seguridad escrito en Golang
  fr: Un tunnel de sécurité simple écrit en Golang
  id: Terowongan keamanan sederhana yang ditulis dengan Golang
  it: Un semplice tunnel di sicurezza scritto in Golang
  ja: Golang で書かれたシンプルなセキュアトンネル
  ko: Golang으로 작성된 간단한 보안 터널
  pl: Prosty bezpieczny tunel napisany w Golang
  pt: Um túnel de segurança simples escrito em Golang
  ro: Un tunel de securitate simplu scris în Golang
  ru: Простой безопасный туннель, написанный на Golang
  th: อุโมงค์ความปลอดภัยอย่างง่ายที่เขียนด้วย Golang
  tr: Golang ile yazılmış basit bir güvenlik tüneli
  uk: Простий безпечний тунель, написаний на Golang
  vi: Đường hầm bảo mật đơn giản viết bằng Golang
x:
  source: https://github.com/go-gost/gost
  eget: go-gost/gost
  apt: gost
  brew: gost
  pacman: gost
  apk: mosquitto
  apt-get: gost
  yay: gost-v3-bin
  go: github.com/go-gost/gost/cmd/gost@master
rule:
  /x:
    cmd: x pkg use gost
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget go-gost/gost
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/go-gost/gost/cmd/gost@master
    reference: https://github.com/go-gost/gost
    dsnap: github.com/go-gost/gost/cmd/gost@master
  darwin/brew:
    cmd: brew install gost
    reference: https://formulae.brew.sh/formula/gost#default
  debian/apt:
    cmd: sudo apt-get install gost
    reference: https://command-not-found.com/gost
    dsnap: gost
  ubuntu/apt:
    cmd: sudo apt-get install gost
    reference: https://command-not-found.com/gost
    dsnap: gost
  alpine/apk:
    cmd: sudo apk add mosquitto
    reference: https://command-not-found.com/mosquitto
    dsnap: mosquitto
  arch/pacman:
    cmd: sudo pacman -S gost
    reference: https://command-not-found.com/gost
  arch/yay:
    cmd: yay -S gost-v3-bin
    reference: https://aur.archlinux.org/packages/gost-v3-bin
  kali/apt:
    cmd: sudo apt-get install gost
    reference: https://command-not-found.com/gost
    dsnap: gost
  raspbian/apt:
    cmd: sudo apt-get install gost
    reference: https://command-not-found.com/gost
binlist:
- gost

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 MB
          rating: 2
          desc:
            cn: 安装 17 MB
            en: 17 MB install
        download:
          estimate: 17 MB
          desc:
            cn: 约 17 MB 下载 (linux/x64)
            en: ~17 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
