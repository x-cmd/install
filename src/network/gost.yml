lang: Go
homepage: https://github.com/go-gost/gost
license: MIT
desc:
  cn: GO 语言实现的安全隧道
  en: A simple security tunnel written in Golang
x:
  pkg:
    exist: true
  source: https://github.com/go-gost/gost
  eget: https://github.com/go-gost/gost
rule:
  /x:
    cmd: x pkg use gost
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget go-gost/gost
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/go-gost/gost/cmd/gost@master
    reference: https://github.com/go-gost/gost
    dsnap: github.com/go-gost/gost/cmd/gost@master
  darwin/brew:
    cmd: brew install gost
    reference: https://formulae.brew.sh/formula/gost#default
  debian/apt:
    cmd: sudo apt-get install gost
    reference: https://command-not-found.com/gost
    dsnap: gost
  ubuntu/apt:
    cmd: sudo apt-get install gost
    reference: https://command-not-found.com/gost
    dsnap: gost
  alpine/apk:
    cmd: sudo apk add mosquitto
    reference: https://command-not-found.com/mosquitto
    dsnap: mosquitto
  arch/pacman:
    cmd: sudo pacman -S gost
    reference: https://command-not-found.com/gost
  arch/yay:
    cmd: yay -S gost-v3-bin
    reference: https://aur.archlinux.org/packages/gost-v3-bin
  kali/apt:
    cmd: sudo apt-get install gost
    reference: https://command-not-found.com/gost
    dsnap: gost
  raspbian/apt:
    cmd: sudo apt-get install gost
    reference: https://command-not-found.com/gost
binlist:
- gost

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 MB
          rating: 2
          desc:
            cn: 安装 17 MB
            en: 17 MB install
        download:
          estimate: 17 MB
          desc:
            cn: 约 17 MB 下载 (linux/x64)
            en: ~17 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
