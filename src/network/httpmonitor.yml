lang: 'Go'
homepage: 'https://github.com/ricoberger/httpmonitor'
license: 'MIT'
desc:
  cn: 监控单个或多个目标的小型 TUI 应用
  en: 'A small TUI application to monitor a single or multiple targets'
x:
  source: https://github.com/ricoberger/httpmonitor
  eget: https://github.com/ricoberger/httpmonitor
rule:
  /eget:
    cmd: x eget ricoberger/httpmonitor
    reference: https://github.com/ricoberger/httpmonitor
binlist:
  - 'httpmonitor'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
