lang: 'Go'
homepage: 'https://github.com/ricoberger/httpmonitor'
license: 'MIT'
desc:
  cn: 监控单个或多个目标的小型 TUI 应用
  en: 'A small TUI application to monitor a single or multiple targets'
  cs: Malá TUI aplikace pro monitorování jednoho nebo více cílů
  de: Eine kleine TUI-Anwendung zur Überwachung eines oder mehrerer Ziele
  es: Una pequeña aplicación TUI para supervisar uno o varios objetivos
  fr: Une petite application TUI pour surveiller une ou plusieurs cibles
  id: Aplikasi TUI kecil untuk memantau satu atau beberapa target
  it: Una piccola applicazione TUI per monitorare uno o più target
  ja: 単一または複数のターゲットを監視する小さなTUIアプリケーション
  ko: 하나 이상의 대상을 모니터링하는 소형 TUI 애플리케이션
  pl: Mała aplikacja TUI do monitorowania jednego lub wielu celów
  pt: Um pequeno aplicativo TUI para monitorar um ou vários alvos
  ro: O mică aplicație TUI pentru monitorizarea uneia sau mai multor ținte
  ru: Небольшое TUI-приложение для мониторинга одной или нескольких целей
  th: แอปพลิเคชัน TUI ขนาดเล็กสำหรับตรวจสอบเป้าหมายเดียวหรือหลายเป้าหมาย
  tr: Tek bir veya birden fazla hedefi izlemek için küçük bir TUI uygulaması
  uk: Невеликий TUI-додаток для моніторингу однієї або кількох цілей
  vi: Ứng dụng TUI nhỏ để theo dõi một hoặc nhiều mục tiêu
x:
  source: https://github.com/ricoberger/httpmonitor
  eget: ricoberger/httpmonitor
rule:
  /eget:
    cmd: x eget ricoberger/httpmonitor
    reference: https://github.com/ricoberger/httpmonitor
binlist:
- 'httpmonitor'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
