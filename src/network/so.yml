lang: 'Rust'
homepage: 'https://github.com/samtay/so'
license: 'MIT'
desc:
  cn: Stack Overflow 的终端界面
  en: 'A terminal interface for Stack Overflow'
x:
  source: https://github.com/samtay/so
  eget: https://github.com/samtay/so
rule:
  /eget:
    cmd: x eget samtay/so
    reference: https://github.com/samtay/so
binlist:
  - 'so'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
