lang: 'Rust'
homepage: 'https://github.com/samtay/so'
license: 'MIT'
desc:
  cn: Stack Overflow 的终端界面
  en: 'A terminal interface for Stack Overflow'
  cs: Terminálové rozhraní pro Stack Overflow
  de: Ein Terminal-Interface für Stack Overflow
  es: Una interfaz de terminal para Stack Overflow
  fr: Une interface en terminal pour Stack Overflow
  id: Antarmuka terminal untuk Stack Overflow
  it: Un'interfaccia a terminale per Stack Overflow
  ja: Stack Overflow のターミナルインターフェース
  ko: Stack Overflow를 위한 터미널 인터페이스
  pl: Interfejs terminalowy dla Stack Overflow
  pt: Uma interface de terminal para o Stack Overflow
  ro: O interfață de terminal pentru Stack Overflow
  ru: Терминальный интерфейс для Stack Overflow
  th: ส่วนติดต่อผู้ใช้แบบเทอร์มินัลสำหรับ Stack Overflow
  tr: Stack Overflow için bir terminal arayüzü
  uk: Термінальний інтерфейс для Stack Overflow
  vi: Giao diện terminal cho Stack Overflow
x:
  source: https://github.com/samtay/so
  eget: samtay/so
rule:
  /eget:
    cmd: x eget samtay/so
    reference: https://github.com/samtay/so
binlist:
- 'so'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
