lang: 'Rust'
homepage: 'https://github.com/boxdot/gurk-rs'
license: 'AGPL-3.0'
desc:
  cn: 终端版 Signal Messenger 客户端
  en: 'Signal Messenger client for terminal'
  cs: Klient Signal Messenger pro terminál
  de: Signal Messenger-Client für das Terminal
  es: Cliente de Signal Messenger para terminal
  fr: Client Signal Messenger pour le terminal
  id: Klien Signal Messenger untuk terminal
  it: Client Signal Messenger per terminale
  ja: ターミナル向け Signal Messenger クライアント
  ko: 터미널용 Signal Messenger 클라이언트
  pl: Klient Signal Messenger dla terminala
  pt: Cliente do Signal Messenger para terminal
  ro: Client Signal Messenger pentru terminal
  ru: Клиент Signal Messenger для терминала
  th: ไคลเอนต์ Signal Messenger สำหรับเทอร์มินัล
  tr: Terminal için Signal Messenger istemcisi
  uk: Клієнт Signal Messenger для термінала
  vi: Ứng dụng Signal Messenger cho terminal
x:
  source: https://github.com/boxdot/gurk-rs
  eget: boxdot/gurk-rs
rule:
  /eget:
    cmd: x eget boxdot/gurk-rs
    reference: https://github.com/boxdot/gurk-rs
binlist:
  - 'gurk'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
