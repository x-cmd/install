lang: 'Rust'
homepage: 'https://github.com/boxdot/gurk-rs'
license: 'AGPL-3.0'
desc:
  cn: 终端版 Signal Messenger 客户端
  en: 'Signal Messenger client for terminal'
x:
  source: https://github.com/boxdot/gurk-rs
  eget: boxdot/gurk-rs
rule:
  /eget:
    cmd: x eget boxdot/gurk-rs
    reference: https://github.com/boxdot/gurk-rs
binlist:
  - 'gurk'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
