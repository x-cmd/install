lang: 'Rust'
homepage: 'https://github.com/boxdot/gurk-rs'
license: 'AGPL-3.0'
desc:
  cn: 终端版 Signal Messenger 客户端
  en: 'Signal Messenger client for terminal'
x:
  source: https://github.com/boxdot/gurk-rs
  eget: https://github.com/boxdot/gurk-rs
rule:
  /eget:
    cmd: x eget boxdot/gurk-rs
    reference: https://github.com/boxdot/gurk-rs
binlist:
  - 'gurk'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
