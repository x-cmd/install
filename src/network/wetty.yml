lang: TypeScript
homepage: https://github.com/butlerx/wetty
license: MIT
desc:
  cn: WeTTY（ Web + TTY）是通过 http/https 在浏览器中进行终端访问的命令行工具
  en: WeTTY = Web + TTY. Terminal access in browser over http/https
x:
  pkg:
    exist: true
  source: https://github.com/butlerx/wetty
rule:
  /x:
    cmd: x pkg use wetty
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm -g i wetty
    reference: https://github.com/butlerx/wetty?tab=readme-ov-file#install
    dsnap: wetty
binlist:
- wetty

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
