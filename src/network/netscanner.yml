lang: Rust
homepage: https://github.com/Chleba/netscanner
license: MIT
desc:
  en: Network scanning & diagnostic tool
  cn: 网络扫描和诊断工具
  cs: Nástroj pro skenování sítě a diagnostiku
  de: Netzwerkscan- und Diagnosewerkzeug
  es: Herramienta de escaneo de red y diagnóstico
  fr: Outil de scan réseau et de diagnostic
  id: Alat pemindaian jaringan dan diagnostik
  it: Strumento di scansione di rete e diagnostica
  ja: ネットワークスキャンと診断のツール
  ko: 네트워크 스캔 및 진단 도구
  pl: Narzędzie do skanowania sieci i diagnostyki
  pt: Ferramenta de varredura de rede e diagnóstico
  ro: Instrument de scanare a rețelei și diagnosticare
  ru: Инструмент для сканирования сети и диагностики
  th: เครื่องมือสแกนเครือข่ายและวินิจฉัย
  tr: Ağ tarama ve tanılama aracı
  uk: Інструмент для сканування мережі та діагностики
  vi: Công cụ quét mạng và chẩn đoán
x:
  source: https://github.com/Chleba/netscanner
  pacman: netscanner
  apk: netscanner
  cargo: netscanner
rule:
  arch/pacman:
    cmd: sudo pacman -S netscanner
    reference: https://github.com/Chleba/netscanner?tab=readme-ov-file#install-on-arch-linux
  /cargo:
    cmd: cargo install netscanner
    reference: https://github.com/Chleba/netscanner?tab=readme-ov-file#install-with-cargo
    dsnap: netscanner
  alpine/apk:
    cmd: apk add netscanner --repository=http://dl-cdn.alpinelinux.org/alpine/edge/testing/
    reference: https://github.com/Chleba/netscanner?tab=readme-ov-file#install-on-alpineedge-linux
binlist:
- netscanner

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 212 KB
          rating: 1
          desc:
            cn: 约 212 KB（估算）
            en: ~212 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
