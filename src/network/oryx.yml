lang: Rust
homepage: https://github.com/pythops/oryx
license: GPL-3.0
desc:
  cn: 使用 eBPF (扩展 Berkeley 数据包过滤器) 的网络流量嗅探器。
  en: A network traffic sniffer using eBPF (extended Berkeley Packet Filter).
x:
  source: https://github.com/pythops/oryx
rule:
  arch/yay:
    cmd: yay -S oryx
    reference: https://aur.archlinux.org/packages/oryx
  arch/paru:
    cmd: paru -S oryx
    reference: https://github.com/pythops/oryx#-installation
  /eget:
    cmd: eget pythops/oryx
    reference: https://github.com/pythops/oryx#-installation
binlist:
- oryx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 367 KB
          rating: 1
          desc:
            cn: 约 367 KB（估算）
            en: ~367 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
