lang: Rust
homepage: https://github.com/pythops/oryx
license: GPL-3.0
desc:
  cn: 使用 eBPF (扩展 Berkeley 数据包过滤器) 的网络流量嗅探器。
  en: A network traffic sniffer using eBPF (extended Berkeley Packet Filter).
  cs: Síťový sniffer provozu paketů založený na eBPF (extended Berkeley Packet Filter).
  de: Ein Netzwerk-Sniffer auf Basis von eBPF (extended Berkeley Packet Filter).
  es: Un sniffer de tráfico de red que usa eBPF (extended Berkeley Packet Filter).
  fr: Un sniffer de trafic réseau utilisant eBPF (extended Berkeley Packet Filter).
  id: Sniffer lalu lintas jaringan menggunakan eBPF (extended Berkeley Packet Filter).
  it: Uno sniffer del traffico di rete basato su eBPF (extended Berkeley Packet Filter).
  ja: eBPF (extended Berkeley Packet Filter) を使用したネットワークトラフィックスニッパー。
  ko: eBPF(extended Berkeley Packet Filter)를 사용하는 네트워크 트래픽 스니퍼.
  pl: Sniffer ruchu sieciowego wykorzystujący eBPF (extended Berkeley Packet Filter).
  pt: Um sniffer de tráfego de rede que usa eBPF (extended Berkeley Packet Filter).
  ro: Un sniffer de trafic de rețea bazat pe eBPF (extended Berkeley Packet Filter).
  ru: Сетевой сниффер трафика на основе eBPF (extended Berkeley Packet Filter).
  th: ตัวดักจับปริมาณข้อมูลเครือข่ายที่ใช้ eBPF (extended Berkeley Packet Filter)
  tr: eBPF (extended Berkeley Packet Filter) kullanan bir ağ trafiği sniffer'ı.
  uk: Мережевий снифер трафіку на основі eBPF (extended Berkeley Packet Filter).
  vi: Trình bắt gói lưu lượng mạng sử dụng eBPF (extended Berkeley Packet Filter).
x:
  source: https://github.com/pythops/oryx
  yay: oryx
  paru: oryx
rule:
  arch/yay:
    cmd: yay -S oryx
    reference: https://aur.archlinux.org/packages/oryx
  arch/paru:
    cmd: paru -S oryx
    reference: https://github.com/pythops/oryx#-installation
  /eget:
    cmd: eget pythops/oryx
    reference: https://github.com/pythops/oryx#-installation
binlist:
- oryx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
