lang: Go
homepage: https://webinstall.dev/serviceman/
desc:
  cn: 适用于 Mac、Linux 和 Windows 的跨平台 service management
  en: Cross-platform service management for Mac, Linux, and Windows
  cs: Správa služeb napříč platformami pro Mac, Linux a Windows
  de: Plattformübergreifende Dienstverwaltung für Mac, Linux und Windows
  es: Gestión de servicios multiplataforma para Mac, Linux y Windows
  fr: Gestion de services multiplateforme pour Mac, Linux et Windows
  id: Manajemen layanan lintas platform untuk Mac, Linux, dan Windows
  it: Gestione dei servizi multipiattaforma per Mac, Linux e Windows
  ja: Mac、Linux、Windows 向けのクロスプラットフォームなサービス管理。
  ko: Mac, Linux, Windows를 위한 크로스 플랫폼 서비스 관리.
  pl: Zarządzanie usługami na różnych platformach dla Mac, Linux i Windows
  pt: Gerenciamento de serviços multiplataforma para Mac, Linux e Windows
  ro: Gestionul serviciilor multiplatformă pentru Mac, Linux și Windows
  ru: Кроссплатформенное управление службами для Mac, Linux и Windows
  th: การจัดการบริการข้ามแพลตฟอร์มสำหรับ Mac, Linux และ Windows
  tr: Mac, Linux ve Windows için platformlar arası servis yönetimi
  uk: Кросплатформне керування службами для Mac, Linux та Windows
  vi: Quản lý dịch vụ đa nền tảng cho Mac, Linux và Windows
x: {}
rule:
  /x:
    cmd: x pkg use serviceman
    reference: https://x-cmd.com/install/
  darwin/curl:
    cmd: curl -sL https://webinstall.dev/serviceman | bash
    reference: https://github.com/therootcompany/serviceman?tab=readme-ov-file#install
  linux/curl:
    cmd: curl -sL https://webinstall.dev/serviceman | bash
    reference: https://github.com/therootcompany/serviceman?tab=readme-ov-file#install
  win/curl:
    cmd: curl.exe -sLA "MS" https://webinstall.dev/serviceman | powershell
    reference: https://github.com/therootcompany/serviceman?tab=readme-ov-file#install
binlist:
- serviceman
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
