lang: Go
homepage: https://webinstall.dev/serviceman/
desc:
  cn: 适用于 Mac、Linux 和 Windows 的跨平台 service management
  en: Cross-platform service management for Mac, Linux, and Windows
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use serviceman
    reference: https://x-cmd.com/install/
  darwin/curl:
    cmd: curl -sL https://webinstall.dev/serviceman | bash
    reference: https://github.com/therootcompany/serviceman?tab=readme-ov-file#install
  linux/curl:
    cmd: curl -sL https://webinstall.dev/serviceman | bash
    reference: https://github.com/therootcompany/serviceman?tab=readme-ov-file#install
  win/curl:
    cmd: curl.exe -sLA "MS" https://webinstall.dev/serviceman | powershell
    reference: https://github.com/therootcompany/serviceman?tab=readme-ov-file#install
binlist:
- serviceman
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
