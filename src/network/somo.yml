lang: Rust
homepage: https://github.com/theopfr/somo
license: MIT
desc:
  cn: 一种用于 Linux 和 macOS 上套接字和端口监控的人性化 netstat 替代方案
  en: A human-friendly alternative to netstat for socket and port monitoring on Linux and macOS.
  cs: Lidská přátelská alternativa k netstat pro monitorování socketů a portů na Linuxu a macOS.
  de: Eine benutzerfreundliche Alternative zu netstat zur Überwachung von Sockets und Ports unter Linux und macOS.
  es: Una alternativa rudimentarya a netstat para supervisar sockets y puertos en Linux y macOS.
  fr: Une alternative conviviale à netstat pour la surveillance des sockets et des ports sous Linux et macOS.
  id: Alternatif yang ramah pengguna untuk netstat dalam memantau socket dan port di Linux dan macOS.
  it: Un'alternativa intuitiva a netstat per il monitoraggio di socket e porte su Linux e macOS.
  ja: LinuxとmacOSでソケットとポートを監視するための、使いやすいnetstatの代替ツール。
  ko: Linux와 macOS에서 소켓과 포트를 모니터링하기 위한 사용자 친화적인 netstat 대안.
  pl: Przyjazna użytkownikowi alternatywa dla netstat do monitorowania gniazd i portów w Linuxie i macOS.
  pt: Uma alternativa amigável ao netstat para monitorar sockets e portas no Linux e no macOS.
  ro: O alternativă ușor de folosit la netstat pentru monitorizarea socket-urilor și a porturilor pe Linux și macOS.
  ru: Удобная альтернатива netstat для мониторинга сокетов и портов в Linux и macOS.
  th: ทางเลือกที่ใช้งานง่ายกว่า netstat สำหรับตรวจสอบซ็อกเก็ตและพอร์ตบน Linux และ macOS.
  tr: Linux ve macOS'ta soket ve port izleme için kullanıcı dostu bir netstat alternatifi.
  uk: Зручна альтернатива netstat для моніторингу сокетів і портів у Linux та macOS.
  vi: Giải pháp thân thiện hơn netstat để giám sát socket và cổng trên Linux và macOS.
x:
  source: https://github.com/theopfr/somo
  eget: theopfr/somo
  yay: somo
  cargo: somo
rule:
  /eget:
    cmd: x eget theopfr/somo
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install somo
    reference: https://github.com/theopfr/somo?tab=readme-ov-file#%EF%B8%8F-installation
    dsnap: somo
  arch/yay:
    cmd: yay -S somo
    reference: https://aur.archlinux.org/packages/somo
binlist:
- somo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 111 KB
          rating: 1
          desc:
            cn: 约 111 KB（估算）
            en: ~111 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
