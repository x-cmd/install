lang: Rust
homepage: https://github.com/theopfr/somo
license: MIT
desc:
  cn: 一种用于 Linux 和 macOS 上套接字和端口监控的人性化 netstat 替代方案
  en: A human-friendly alternative to netstat for socket and port monitoring on Linux and macOS.
x:
  source: https://github.com/theopfr/somo
  eget: https://github.com/theopfr/somo
rule:
  /eget:
    cmd: x eget theopfr/somo
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install somo
    reference: https://github.com/theopfr/somo?tab=readme-ov-file#%EF%B8%8F-installation
    dsnap: somo
  arch/yay:
    cmd: yay -S somo
    reference: https://aur.archlinux.org/packages/somo
binlist:
- somo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 111 KB
          rating: 1
          desc:
            cn: 约 111 KB（估算）
            en: ~111 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
