lang: 'Rust'
homepage: 'https://github.com/Ragnt/AngryOxide'
license: 'GPL-3.0'
desc:
  cn: 802.11 攻击工具
  en: '802.11 Attack Tool'
x:
  source: https://github.com/Ragnt/AngryOxide
  eget: Ragnt/AngryOxide
rule:
  /eget:
    cmd: x eget Ragnt/AngryOxide
    reference: https://github.com/Ragnt/AngryOxide
binlist:
- 'angryoxide'

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.6 MB
          rating: 1
          desc:
            cn: 安装 6.6 MB
            en: 6.6 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 7 MB
        desc:
          cn: 7 MB
          en: 7 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
