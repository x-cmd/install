lang: 'Rust'
homepage: 'https://github.com/Ragnt/AngryOxide'
license: 'GPL-3.0'
desc:
  cn: 802.11 攻击工具
  en: '802.11 Attack Tool'
x:
  source: https://github.com/Ragnt/AngryOxide
  eget: https://github.com/Ragnt/AngryOxide
rule:
  /eget:
    cmd: x eget Ragnt/AngryOxide
    reference: https://github.com/Ragnt/AngryOxide
binlist:
  - 'angryoxide'

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.6 MB
          rating: 1
          desc:
            cn: 安装 6.6 MB
            en: 6.6 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 7 MB
        desc:
          cn: 7 MB
          en: 7 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
