lang: Rust
homepage: https://github.com/fujiapple852/trippy
license: Apache-2.0
desc:
  cn: Trippy 结合了 traceroute 和 ping 的功能，旨在协助分析网络问题
  en: Trippy combines the functionality of traceroute and ping and is designed to assist with the analysis of networking issues
  cs: Trippy kombinuje funkce traceroute a ping a je navržen k pomoci při analýze problémů se sítí
  de: Trippy kombiniert die Funktionen von traceroute und ping und soll bei der Analyse von Netzwerkproblemen helfen
  es: Trippy combina la funcionalidad de traceroute y ping, y está diseñado para ayudar en el análisis de problemas de red
  fr: Trippy combine les fonctionnalités de traceroute et de ping et est conçu pour faciliter l'analyse des problèmes réseau
  id: Trippy menggabungkan fungsi traceroute dan ping dan dirancang untuk membantu analisis masalah jaringan
  it: Trippy combina le funzionalità di traceroute e ping ed è progettato per assistere l'analisi dei problemi di rete
  ja: Trippy は traceroute と ping の機能を組み合わせ、ネットワーク問題の分析を支援するために設計されています。
  ko: Trippy는 traceroute와 ping의 기능을 결합하여 네트워크 문제 분석을 지원하도록 설계되었습니다.
  pl: Trippy łączy funkcje traceroute i ping i został zaprojektowany, aby pomagać w analizie problemów z siecią
  pt: O Trippy combina a funcionalidade do traceroute e do ping e foi projetado para ajudar na análise de problemas de rede
  ro: Trippy combină funcționalitatea lui traceroute și ping și este conceput pentru a ajuta la analizarea problemelor de rețea
  ru: Trippy объединяет возможности traceroute и ping и предназначен для помощи в анализе сетевых проблем
  th: Trippy รวมความสามารถของ traceroute และ ping ไว้ด้วยกัน และออกแบบมาเพื่อช่วยวิเคราะห์ปัญหาเครือข่าย
  tr: Trippy, traceroute ve ping işlevlerini birleştirir ve ağ sorunlarının analizinde yardımcı olmak üzere tasarlanmıştır
  uk: Trippy поєднує можливості traceroute та ping і призначений для допомоги в аналізі мережевих проблем
  vi: Trippy kết hợp chức năng của traceroute và ping, được thiết kế để hỗ trợ phân tích các sự cố mạng
x:
  source: https://github.com/fujiapple852/trippy
  eget: fujiapple852/trippy
  brew: trippy
  pacman: trippy
  snap: trippy
  scoop: trippy
  winget: trippy
  cargo: trippy
rule:
  /x:
    cmd: x pkg use trippy
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget fujiapple852/trippy
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install trippy
    reference: https://trippy.cli.rs/#cargo
    dsnap: trippy
  /snap:
    cmd: sudo snap install trippy
    reference: https://trippy.cli.rs/#snap-linux
  darwin/brew:
    cmd: brew install trippy
    reference: https://trippy.cli.rs/#homebrew-macos
  (win|wsl2)/scoop:
    cmd: x scoop install trippy
    reference: https://trippy.cli.rs/#scoop-windows
  (win|wsl2)/winget:
    cmd: x winget install trippy
    reference: https://trippy.cli.rs/#winget-windows
  netbsd/pkgin:
    cmd: pkgin install trippy
    reference: https://trippy.cli.rs/#netbsd
  openbsd/pkg_add:
    cmd: pkg_add trippy
    reference: https://trippy.cli.rs/#openbsd
  arch/pacman:
    cmd: sudo pacman -S trippy
    reference: https://trippy.cli.rs/#pacman-arch-linux
  /nix-env:
    cmd: sudo nix-env -iA trippy
    reference: https://trippy.cli.rs/#nix
binlist:
- trippy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
