lang: C++
homepage: https://github.com/bchretien/tcptrack
license: LGPL-2.1
desc:
  cn: tcptrack 是一个嗅探器，显示有关它在网络接口上看到的 TCP 连接的信息。
  en: tcptrack is a sniffer which displays information about TCP connections it sees on a network interface.
x:
  source: https://github.com/bchretien/tcptrack
rule:
  arch/yay:
    cmd: yay -S tcptrack
    reference: https://aur.archlinux.org/packages/tcptrack
  debian/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
    dsnap: tcptrack
  ubuntu/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
    dsnap: tcptrack
  kali/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
    dsnap: tcptrack
  raspbian/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
  mint/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
  fedora/dnf:
    cmd: sudo dnf install tcptrack
    reference: https://command-not-found.com/tcptrack
    dsnap: tcptrack
binlist:
- tcptrack

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
