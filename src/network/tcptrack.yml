lang: C++
homepage: https://github.com/bchretien/tcptrack
license: LGPL-2.1
desc:
  cn: tcptrack 是一个嗅探器，显示有关它在网络接口上看到的 TCP 连接的信息。
  en: tcptrack is a sniffer which displays information about TCP connections it sees on a network interface.
x:
  source: https://github.com/bchretien/tcptrack
rule:
  arch/yay:
    cmd: yay -S tcptrack
    reference: https://aur.archlinux.org/packages/tcptrack
  debian/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
    dsnap: tcptrack
  ubuntu/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
    dsnap: tcptrack
  kali/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
    dsnap: tcptrack
  raspbian/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
  mint/apt:
    cmd: sudo apt-get install tcptrack
    reference: https://command-not-found.com/tcptrack
  fedora/dnf:
    cmd: sudo dnf install tcptrack
    reference: https://command-not-found.com/tcptrack
    dsnap: tcptrack
binlist:
- tcptrack

