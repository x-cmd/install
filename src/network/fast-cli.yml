homepage: https://github.com/sindresorhus/fast-cli#readme
license: MIT
desc:
  cn: 使用 fast.com 测试下载和上传速度
  en: Test your download and upload speed using fast.com
lang: JavaScript
x:
  source: https://github.com/sindresorhus/fast-cli#readme
  yay: nodejs-fast-cli
rule:
  /x:
    cmd: x pkg use fast-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global fast-cli
    reference: https://github.com/sindresorhus/fast-cli?tab=readme-ov-file#install
    dsnap: fast-cli
  arch/yay:
    cmd: yay -S nodejs-fast-cli
    reference: https://aur.archlinux.org/packages/nodejs-fast-cli
binlist:
- fast-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
