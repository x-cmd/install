lang: Rust
homepage: https://github.com/ekzhang/bore
license: MIT
desc:
  cn: Rust 编写的 TCP 隧道工具
  en: A modern, simple TCP tunnel in Rust
x:
  source: https://github.com/ekzhang/bore
  eget: https://github.com/ekzhang/bore
rule:
  /eget:
    cmd: x eget ekzhang/bore
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install bore-cli
    reference: https://github.com/ekzhang/bore/?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install bore-cli
    reference: https://github.com/ekzhang/bore/?tab=readme-ov-file#bore
    dsnap: bore-cli
binlist:
- bore-cli

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.7 MB
          rating: 1
          desc:
            cn: 安装 2.7 MB
            en: 2.7 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
