lang: Rust
homepage: https://github.com/ekzhang/bore
license: MIT
desc:
  cn: Rust 编写的 TCP 隧道工具
  en: A modern, simple TCP tunnel in Rust
  cs: Moderní, jednoduchý TCP tunel napsaný v Rustu
  de: Ein moderner, einfacher TCP-Tunnel in Rust
  es: Un túnel TCP moderno y sencillo escrito en Rust
  fr: Un tunnel TCP moderne et simple écrit en Rust
  id: Terowongan TCP modern dan sederhana yang ditulis dalam Rust
  it: Un tunnel TCP moderno e semplice scritto in Rust
  ja: Rust で書かれたモダンでシンプルな TCP トンネル
  ko: Rust로 작성된 현대적이고 간단한 TCP 터널
  pl: Nowoczesny, prosty tunel TCP napisany w Rust
  pt: Um túnel TCP moderno e simples escrito em Rust
  ro: Un tunel TCP modern și simplu scris în Rust
  ru: Современный простой TCP-туннель, написанный на Rust
  th: อุโมงค์ TCP สมัยใหม่และเรียบง่ายที่เขียนด้วย Rust
  tr: Rust ile yazılmış modern ve basit bir TCP tüneli
  uk: Сучасний простий TCP-тунель, написаний на Rust
  vi: Đường hầm TCP hiện đại và đơn giản được viết bằng Rust
x:
  source: https://github.com/ekzhang/bore
  eget: ekzhang/bore
  brew: bore-cli
  cargo: bore-cli
rule:
  /eget:
    cmd: x eget ekzhang/bore
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install bore-cli
    reference: https://github.com/ekzhang/bore/?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install bore-cli
    reference: https://github.com/ekzhang/bore/?tab=readme-ov-file#bore
    dsnap: bore-cli
binlist:
- bore-cli

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 2.7 MB
          rating: 1
          desc:
            cn: 安装 2.7 MB
            en: 2.7 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
