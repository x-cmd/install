lang: 'Go'
homepage: https://github.com/surge-downloader/surge
license: 'MIT'
desc:
  cn: Go 编写的极速 TUI 下载管理器，面向高级用户
  en: 'Blazing fast TUI download manager built in Go for power users'
  cs: Extrémně rychlý TUI správce stahování napsaný v Go pro pokročilé uživatele
  de: Blitzschneller TUI-Downloadmanager in Go für Poweruser
  es: Un gestor de descargas TUI muy rápido escrito en Go para usuarios avanzados
  fr: Un gestionnaire de téléchargements TUI ultra-rapide écrit en Go pour les utilisateurs avancés
  id: Pengunduh TUI yang sangat cepat yang ditulis dengan Go untuk pengguna mahir
  it: Un gestore di download TUI velocissimo scritto in Go per utenti esperti
  ja: Goで書かれた超高速TUIダウンローダマネージャー。パワユーザー向け
  ko: Go로 작성된 매우 빠른 TUI 다운로드 관리자, 전문 사용자를 위한
  pl: Błyskawicznie szybki menedżer pobierania TUI napisany w Go dla zaawansowanych użytkowników
  pt: Um gerenciador de downloads TUI muito rápido escrito em Go para usuários avançados
  ro: Un manager de descărcări TUI ultrarapid scris în Go pentru utilizatori avansați
  ru: Сверхбыстрый TUI-менеджер загрузок на Go для опытных пользователей
  th: ตัวจัดการดาวน์โหลด TUI ที่รวดเร็วมาก เขียนด้วย Go สำหรับผู้ใช้ขั้นสูง
  tr: İleri düzey kullanıcılar için Go ile yazılmış çok hızlı bir TUI indirme yöneticisi
  uk: Надзвичайно швидкий TUI-менеджер завантажень на Go для просунутих користувачів
  vi: Trình quản lý tải xuống TUI cực nhanh viết bằng Go dành cho người dùng nâng cao
x:
  source: https://github.com/surge-downloader/surge
  eget: surge-downloader/surge
  brew: SurgeDM/tap/surge
  go: github.com/SurgeDM/Surge@latest
rule:
  darwin/brew:
    cmd: 'brew install SurgeDM/tap/surge'
    reference: https://github.com/surge-downloader/surge
  /go:
    cmd: 'go install github.com/SurgeDM/Surge@latest'
    reference: https://github.com/surge-downloader/surge
  /eget:
    cmd: x eget surge-downloader/surge
    reference: https://github.com/surge-downloader/surge
binlist:
- 'surge'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
