lang: 'Go'
homepage: https://github.com/surge-downloader/surge
license: 'MIT'
desc:
  cn: Go 编写的极速 TUI 下载管理器，面向高级用户
  en: 'Blazing fast TUI download manager built in Go for power users'
x:
  source: https://github.com/surge-downloader/surge
  eget: https://github.com/surge-downloader/surge
rule:
  darwin/brew:
    cmd: 'brew install SurgeDM/tap/surge'
    reference: https://github.com/surge-downloader/surge
  /go:
    cmd: 'go install github.com/SurgeDM/Surge@latest'
    reference: https://github.com/surge-downloader/surge
  /eget:
    cmd: x eget surge-downloader/surge
    reference: https://github.com/surge-downloader/surge
binlist:
- 'surge'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
