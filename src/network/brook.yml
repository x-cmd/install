lang: Go
homepage: https://github.com/txthinking/brook
license: GPL-3.0
desc:
  cn: 一个跨平台可编程网络工具
  en: A cross-platform programmable network tool
  cs: Multiplatformní programovatelný síťový nástroj
  de: Ein plattformübergreifendes, programmierbares Netzwerkwerkzeug
  es: Una herramienta de red programable y multiplataforma
  fr: Un outil réseau programmable et multiplateforme
  id: Alat jaringan terprogram yang lintas platform
  it: Uno strumento di rete programmabile e multipiattaforma
  ja: クロスプラットフォームでプログラム可能なネットワークツール
  ko: 크로스 플랫폼 프로그래밍 가능 네트워크 도구
  pl: Wieloplatformowe, programowalne narzędzie sieciowe
  pt: Uma ferramenta de rede programável e multiplataforma
  ro: Un instrument de rețea programabil și multiplatformă
  ru: Кроссплатформенный программируемый сетевой инструмент
  th: เครื่องมือเครือข่ายแบบเขียนโปรแกรมได้และใช้งานข้ามแพลตฟอร์ม
  tr: Platformlar arası programlanabilir bir ağ aracı
  uk: Кроссплатформний програмований мережевий інструмент
  vi: Công cụ mạng có thể lập trình, đa nền tảng
x:
  source: https://github.com/txthinking/brook
  eget: txthinking/brook
  brew: brook
  pacman: brook
rule:
  /x:
    cmd: x pkg use brook
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/brook
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install brook
    reference: https://formulae.brew.sh/formula/brook#default
  arch/pacman:
    cmd: sudo pacman -S brook
    reference: https://command-not-found.com/brook
binlist:
- brook

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 MB
          rating: 2
          desc:
            cn: 安装 28 MB
            en: 28 MB install
        download:
          estimate: 28 MB
          desc:
            cn: 约 28 MB 下载 (linux/x64)
            en: ~28 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
