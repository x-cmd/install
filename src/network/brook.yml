lang: Go
homepage: https://github.com/txthinking/brook
license: GPL-3.0
desc:
  cn: 一个跨平台可编程网络工具
  en: A cross-platform programmable network tool
x:
  pkg:
    exist: true
  source: https://github.com/txthinking/brook
  eget: https://github.com/txthinking/brook
  brew: brook
  pacman: brook
rule:
  /x:
    cmd: x pkg use brook
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/brook
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install brook
    reference: https://formulae.brew.sh/formula/brook#default
  arch/pacman:
    cmd: sudo pacman -S brook
    reference: https://command-not-found.com/brook
binlist:
- brook

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 MB
          rating: 2
          desc:
            cn: 安装 28 MB
            en: 28 MB install
        download:
          estimate: 28 MB
          desc:
            cn: 约 28 MB 下载 (linux/x64)
            en: ~28 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
