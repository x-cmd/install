lang: Go
homepage: https://github.com/txthinking/brook
license: GPL-3.0
desc:
  cn: 一个跨平台可编程网络工具
  en: A cross-platform programmable network tool
x:
  pkg:
    exist: true
  source: https://github.com/txthinking/brook
  eget: https://github.com/txthinking/brook
rule:
  /x:
    cmd: x pkg use brook
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget txthinking/brook
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install brook
    reference: https://formulae.brew.sh/formula/brook#default
  arch/pacman:
    cmd: sudo pacman -S brook
    reference: https://command-not-found.com/brook
binlist:
- brook

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
