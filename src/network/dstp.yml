lang: Go
homepage: https://github.com/ycd/dstp
license: MIT
desc:
  cn: 针对您的站点运行常见的网络测试
  en: run common networking tests against your site
x:
  source: https://github.com/ycd/dstp
  eget: https://github.com/ycd/dstp
rule:
  /eget:
    cmd: x eget ycd/dstp
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install ycd/tap/dstp
    reference: https://github.com/ycd/dstp?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S dstp
    reference: https://aur.archlinux.org/packages/dstp
  /go:
    cmd: go install github.com/ycd/dstp/cmd/dstp@latest
    reference: https://github.com/ycd/dstp?tab=readme-ov-file#installation
    dsnap: github.com/ycd/dstp/cmd/dstp@latest
  nix/nix-shell:
    cmd: nix-shell -p dstp
    reference: https://search.nixos.org/packages?query=dstp
binlist:
- dstp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 45 KB
          rating: 1
          desc:
            cn: 约 45 KB（估算）
            en: ~45 KB estimated
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
