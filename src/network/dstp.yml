lang: Go
homepage: https://github.com/ycd/dstp
license: MIT
desc:
  cn: 针对您的站点运行常见的网络测试
  en: run common networking tests against your site
  cs: spouští běžné testy sítě proti vašemu webu
  de: führt gängige Netzwerktests gegen Ihre Website aus
  es: ejecuta pruebas de red comunes contra tu sitio web
  fr: exécute des tests réseau courants sur votre site
  id: menjalankan uji jaringan umum terhadap situs Anda
  it: esegue i test di rete più comuni sul tuo sito
  ja: 自分のサイトに対して一般的なネットワークテストを実行します
  ko: 웹사이트에 대해 일반적인 네트워크 테스트를 실행합니다
  pl: uruchamia popularne testy sieciowe wobec Twojej witryny
  pt: executa testes de rede comuns contra o seu site
  ro: rulează teste de rețea uzuale împotriva site-ului dumneavoastră
  ru: запускает распространённые сетевые тесты для вашего сайта
  th: รันการทดสอบเครือข่ายทั่วไปกับเว็บไซต์ของคุณ
  tr: sitenize karşı yaygın ağ testleri çalıştırır
  uk: запускає поширені мережеві тести для вашого сайту
  vi: chạy các bài kiểm tra mạng thông thường đối với trang web của bạn
x:
  source: https://github.com/ycd/dstp
  eget: ycd/dstp
  brew: ycd/tap/dstp
  yay: dstp
  go: github.com/ycd/dstp/cmd/dstp@latest
rule:
  /eget:
    cmd: x eget ycd/dstp
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install ycd/tap/dstp
    reference: https://github.com/ycd/dstp?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S dstp
    reference: https://aur.archlinux.org/packages/dstp
  /go:
    cmd: go install github.com/ycd/dstp/cmd/dstp@latest
    reference: https://github.com/ycd/dstp?tab=readme-ov-file#installation
    dsnap: github.com/ycd/dstp/cmd/dstp@latest
  nix/nix-shell:
    cmd: nix-shell -p dstp
    reference: https://search.nixos.org/packages?query=dstp
binlist:
- dstp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
