lang: Go
homepage: https://github.com/ycd/dstp
license: MIT
desc:
  cn: 针对您的站点运行常见的网络测试
  en: run common networking tests against your site
x:
  source: https://github.com/ycd/dstp
  eget: https://github.com/ycd/dstp
rule:
  /eget:
    cmd: x eget ycd/dstp
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install ycd/tap/dstp
    reference: https://github.com/ycd/dstp?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S dstp
    reference: https://aur.archlinux.org/packages/dstp
  /go:
    cmd: go install github.com/ycd/dstp/cmd/dstp@latest
    reference: https://github.com/ycd/dstp?tab=readme-ov-file#installation
    dsnap: github.com/ycd/dstp/cmd/dstp@latest
  nix/nix-shell:
    cmd: nix-shell -p dstp
    reference: https://search.nixos.org/packages?query=dstp
binlist:
- dstp

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
