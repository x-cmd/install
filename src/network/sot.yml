lang: 'Python'
homepage: https://github.com/anistark/sot
license: 'MIT'
desc:
  cn: 命令行系统观测工具
  en: 'Command-line System Obervation Tool'
x:
  source: https://github.com/anistark/sot
  eget: https://github.com/anistark/sot
rule:
  /eget:
    cmd: x eget anistark/sot
    reference: https://github.com/anistark/sot
binlist:
  - 'sot'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
