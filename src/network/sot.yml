lang: 'Python'
homepage: https://github.com/anistark/sot
license: 'MIT'
desc:
  cn: 命令行系统观测工具
  en: 'Command-line System Obervation Tool'
  cs: Nástroj pro pozorování systému z příkazové řádky
  de: Kommandozeilen-Tool zur Systemüberwachung
  es: Herramienta de observación de sistemas en línea de comandos
  fr: Outil d'observation du système en ligne de commande
  id: Alat observasi sistem baris perintah
  it: Strumento di osservazione del sistema da riga di comando
  ja: コマンドラインのシステム観測ツール
  ko: 명령줄 시스템 관찰 도구
  pl: Narzędzie do obserwacji systemu w wierszu poleceń
  pt: Ferramenta de observação do sistema em linha de comando
  ro: Instrument de observare a sistemului din linia de comandă
  ru: Инструмент наблюдения за системой в командной строке
  th: เครื่องมือสังเกตการณ์ระบบจากบรรทัดคำสั่ง
  tr: Komut satırı sistem gözlem aracı
  uk: Інструмент спостереження за системою з командного рядка
  vi: Công cụ quan sát hệ thống từ dòng lệnh
x:
  source: https://github.com/anistark/sot
  eget: anistark/sot
rule:
  /eget:
    cmd: x eget anistark/sot
    reference: https://github.com/anistark/sot
binlist:
  - 'sot'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
