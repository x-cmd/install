lang: Shell
homepage: https://github.com/akshayKMR/hhttpserver
license: NOASSERTION
desc:
  cn: httpserver — 软件安装
  en: httpserver — software install
x:
  source: https://github.com/akshayKMR/hhttpserver
  eget: https://github.com/akshayKMR/hhttpserver
rule:
  /eget:
    cmd: x eget akshayKMR/hhttpserver
    reference: https://github.com/akshayKMR/hhttpserver
binlist:
- httpserver

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
