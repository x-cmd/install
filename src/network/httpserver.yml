lang: Shell
homepage: https://github.com/akshayKMR/hhttpserver
license: NOASSERTION
desc:
  cn: httpserver — 软件安装
  en: httpserver — software install
x:
  source: https://github.com/akshayKMR/hhttpserver
  eget: https://github.com/akshayKMR/hhttpserver
rule:
  /eget:
    cmd: x eget akshayKMR/hhttpserver
    reference: https://github.com/akshayKMR/hhttpserver
binlist:
- httpserver

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
