lang: Python
homepage: https://github.com/magic-wormhole/magic-wormhole
license: MIT
desc:
  cn: Wormhole 使得可以将任意大小的文件和目录（或短文本片段）从一台计算机传输到另一台
  en: wormhole makes it possible to get arbitrary-sized files and directories (or short pieces of text) from one computer to another
  cs: wormhole umožňuje přenášet soubory a adresáře libovolné velikosti (nebo krátké úseky textu) z jednoho počítače na druhý
  de: wormhole ermöglicht es, Dateien und Verzeichnisse beliebiger Größe (oder kurze Textstücke) von einem Rechner auf einen anderen zu übertragen
  es: wormhole permite transferir archivos y directorios de cualquier tamaño (o fragmentos cortos de texto) de un ordenador a otro
  fr: wormhole permet de transférer des fichiers et des répertoires de taille quelconque (ou de courts extraits de texte) d'un ordinateur à un autre
  id: wormhole memungkinkan Anda memindahkan file dan direktori berukuran apa pun (atau potongan teks pendek) dari satu komputer ke komputer lain
  it: wormhole permette di trasferire file e directory di qualsiasi dimensione (o brevi frammenti di testo) da un computer a un altro
  ja: wormhole を使うと、任意の大きさのファイルやディレクトリ (または短いテキスト片) を別のコンピューターへ転送できます
  ko: wormhole을 사용하면 임의 크기의 파일과 디렉터리(또는 짧은 텍스트 조각)를 한 컴퓨터에서 다른 컴퓨터로 옮길 수 있습니다
  pl: wormhole umożliwia przenoszenie plików i katalogów o dowolnym rozmiarze (lub krótkich fragmentów tekstu) z jednego komputera na drugi
  pt: wormhole permite transferir arquivos e diretórios de qualquer tamanho (ou trechos curtos de texto) de um computador para outro
  ro: wormhole permite transferul de fișiere și directoare de orice dimensiune (sau fragmente scurte de text) de la un computer la altul
  ru: wormhole позволяет передавать файлы и каталоги любого размера (или короткие фрагменты текста) с одного компьютера на другой
  th: wormhole ช่วยให้ส่งไฟล์และไดเรกทอรีขนาดใดก็ได้ (หรือข้อความสั้น ๆ) จากคอมพิวเตอร์เครื่องหนึ่งไปยังอีกเครื่องหนึ่ง
  tr: wormhole, keyfi her boyuttaki dosyaların (veya kısa metin parçalarının) bir bilgisayardan diğerine aktarılmasını sağlar.
  uk: wormhole дає змогу передавати файли та каталоги будь-якого розміру (або короткі фрагменти тексту) з одного комп'ютера на інший
  vi: wormhole cho phép chuyển các tệp và thư mục có kích thước bất kỳ (hoặc các đoạn văn bản ngắn) từ máy tính này sang máy tính khác
x:
  source: https://github.com/magic-wormhole/magic-wormhole
  apt: magic-wormhole
  dnf: magic-wormhole
  brew: magic-wormhole
  snap: wormhole
  apt-get: magic-wormhole
  zypper: python-magic-wormhole
  choco: magic-wormhole
  yay: magic-wormhole-git
rule:
  /x:
    cmd: x pkg use magic-wormhole
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install --user magic-wormhole
    reference: https://magic-wormhole.readthedocs.io/en/latest/welcome.html#install-from-source
    dsnap: magic-wormhole
  darwin/brew:
    cmd: brew install magic-wormhole
    reference: https://formulae.brew.sh/formula/magic-wormhole#default
  debian/apt:
    cmd: sudo apt install magic-wormhole
    reference: https://magic-wormhole.readthedocs.io/en/latest/welcome.html#linux-debian-ubuntu
    dsnap: magic-wormhole
  ubuntu/apt:
    cmd: sudo apt install magic-wormhole
    reference: https://magic-wormhole.readthedocs.io/en/latest/welcome.html#linux-debian-ubuntu
    dsnap: magic-wormhole
  kali/apt:
    cmd: sudo apt-get install magic-wormhole
    reference: https://command-not-found.com/wormhole
    dsnap: magic-wormhole
  fedora/dnf:
    cmd: sudo dnf install magic-wormhole
    reference: https://magic-wormhole.readthedocs.io/en/latest/welcome.html#linux-fedora
    dsnap: magic-wormhole
  opensuse/zypper:
    cmd: sudo zypper install python-magic-wormhole
    reference: https://magic-wormhole.readthedocs.io/en/latest/welcome.html#linux-opensuse
  /snap:
    cmd: sudo snap install wormhole
    reference: https://magic-wormhole.readthedocs.io/en/latest/welcome.html#linux-snap-package
  raspbian/apt:
    cmd: sudo apt-get install magic-wormhole
    reference: https://command-not-found.com/wormhole
  (win|wsl2)/choco:
    cmd: x choco install magic-wormhole
    reference: https://magic-wormhole.readthedocs.io/en/latest/welcome.html#chocolatey
  arch/yay:
    cmd: yay -S magic-wormhole-git
    reference: https://aur.archlinux.org/packages/magic-wormhole-git
binlist:
- magic-wormhole

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 46 KB
          rating: 1
          desc:
            cn: 约 46 KB（估算）
            en: ~46 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
