lang: 'Rust'
homepage: https://github.com/hyperb1iss/unifly
license: 'Apache-2.0'
desc:
  cn: 优雅的 UniFi 网络管理 CLI 与 TUI，面向人与 Agent
  en: '🌐 Elegant UniFi network management CLI & TUI - for humans and agents'
x:
  source: https://github.com/hyperb1iss/unifly
  eget: https://github.com/hyperb1iss/unifly
rule:
  /cargo:
    cmd: 'cargo install --git https://github.com/hyperb1iss/unifly.git unifly'
    reference: https://github.com/hyperb1iss/unifly
  darwin/brew:
    cmd: 'brew install hyperb1iss/tap/unifly'
    reference: https://github.com/hyperb1iss/unifly
  /eget:
    cmd: x eget hyperb1iss/unifly
    reference: https://github.com/hyperb1iss/unifly
binlist:
  - 'unifly'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.1 MB
          rating: 1
          desc:
            cn: 约 2.1 MB（估算）
            en: ~2.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
