lang: 'Rust'
homepage: https://github.com/pwnwriter/kanha
license: 'MIT'
desc:
  cn: Rust 编写的 Web 应用渗透测试套件
  en: '🦚 A web-app pentesting suite written in rust .'
  cs: Sada webových aplikací pro pentesting napsaná v Rustu.
  de: Eine in Rust geschriebene Pentesting-Suite für Webanwendungen.
  es: Una suite de pruebas de penetración para aplicaciones web escrita en Rust.
  fr: Une suite de tests d'intrusion pour applications web écrite en Rust.
  id: Rangkaian uji penetrasi aplikasi web yang ditulis dengan Rust.
  it: Una suite di penetration testing per applicazioni web scritta in Rust.
  ja: Rust で書かれたウェブアプリケーションのペンテストスイート。
  ko: Rust로 작성된 웹 애플리케이션 펜테스팅 스위트.
  pl: Zestaw narzędzi do testów penetracyjnych aplikacji webowych napisany w Rust.
  pt: Uma suíte de pentest de aplicações web escrita em Rust.
  ro: O suită de testare a penetrării aplicațiilor web scrisă în Rust.
  ru: Набор инструментов для пентеста веб-приложений, написанный на Rust.
  th: ชุดเครื่องมือทดสอบเจาะระบบเว็บแอปพลิเคชันที่เขียนด้วย Rust
  tr: Rust ile yazılmış bir web uygulaması pentest paketi.
  uk: Набір інструментів для пентесту вебзастосунків, написаний на Rust.
  vi: Bộ công cụ kiểm thử xâm nhập ứng dụng web viết bằng Rust.
x:
  source: https://github.com/pwnwriter/kanha
  eget: pwnwriter/kanha
rule:
  /eget:
    cmd: x eget pwnwriter/kanha
    reference: https://github.com/pwnwriter/kanha
binlist:
- 'kanha'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
