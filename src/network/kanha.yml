lang: 'Rust'
homepage: https://github.com/pwnwriter/kanha
license: 'MIT'
desc:
  cn: Rust 编写的 Web 应用渗透测试套件
  en: '🦚 A web-app pentesting suite written in rust .'
x:
  source: https://github.com/pwnwriter/kanha
  eget: https://github.com/pwnwriter/kanha
rule:
  /eget:
    cmd: x eget pwnwriter/kanha
    reference: https://github.com/pwnwriter/kanha
binlist:
  - 'kanha'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 KB
          rating: 1
          desc:
            cn: 约 23 KB（估算）
            en: ~23 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
