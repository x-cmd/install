lang: Shell
homepage: http://www.dest-unreach.org/socat/
desc:
  cn: 一个多功能的网络工具
  en: A versatile web tool
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use socat
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install socat
    reference: https://formulae.brew.sh/formula/socat#default
  debian/apt:
    cmd: sudo apt-get install socat
    reference: https://command-not-found.com/socat
    dsnap: socat
  ubuntu/apt:
    cmd: sudo apt-get install socat
    reference: https://command-not-found.com/socat
    dsnap: socat
  alpine/apk:
    cmd: sudo apk add socat
    reference: https://command-not-found.com/socat
    dsnap: socat
  arch/pacman:
    cmd: sudo pacman -S socat
    reference: https://command-not-found.com/socat
  arch/yay:
    cmd: yay -S socat-git
    reference: https://aur.archlinux.org/packages/socat-git
  kali/apt:
    cmd: sudo apt-get install socat
    reference: https://command-not-found.com/socat
    dsnap: socat
  centos/yum:
    cmd: sudo yum install socat
    reference: https://command-not-found.com/socat
  fedora/dnf:
    cmd: sudo dnf install socat
    reference: https://command-not-found.com/socat
    dsnap: socat
  raspbian/apt:
    cmd: sudo apt-get install socat
    reference: https://command-not-found.com/socat
binlist:
- socat
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
