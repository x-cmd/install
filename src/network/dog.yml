  de: dog ist ein quelloffener DNS-Client für die Kommandozeile
  es: dog es un cliente DNS de código abierto para la línea de comandos
  fr: dog est un client DNS open source pour la ligne de commande
  id: dog adalah klien DNS sumber terbuka untuk baris perintah
