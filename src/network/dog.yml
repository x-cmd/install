  vi: dog là ứng dụng DNS mã nguồn mở dành cho dòng lệnh
x:
  source: https://github.com/ogham/dog
  eget: ogham/dog
  scoop: dog
rule:
  /eget:
    cmd: x eget ogham/dog
    reference: https://x-cmd.com/mod/eget
  (win|wsl2)/scoop:
    cmd: x scoop install dog
    reference: https://scoop.sh/#/apps?q=dog
binlist:
- dog

# complicated
