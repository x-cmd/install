  ro: dog este un client DNS open source pentru linia de comand
  ru: dog — это клиент DNS с открытым исходным кодом для командной строки
  th: dog คือไคลเอนต์ DNS แบบโอเพนซอร์สสำหรับบรรทัดคำสั่ง
  tr: dog, komut satırı için açık kaynaklı bir DNS istemcisidir
