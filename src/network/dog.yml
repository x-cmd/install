lang: Rust
homepage: https://github.com/ogham/dog
license: EUPL-1.2
desc:
  cn: dog 是命令行的开源 DNS 客户端
  en: dog is an open-source DNS client for the command-line
x:
  source: https://github.com/ogham/dog
  eget: https://github.com/ogham/dog
rule:
  /eget:
    cmd: x eget ogham/dog
    reference: https://x-cmd.com/mod/eget
  (win|wsl2)/scoop:
    cmd: x scoop install dog
    reference: https://scoop.sh/#/apps?q=dog
binlist:
- dog

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 257 KB
          rating: 1
          desc:
            cn: 约 257 KB（估算）
            en: ~257 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
