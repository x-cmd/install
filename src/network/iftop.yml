lang: Shell
homepage: http://www.ex-parrot.com/~pdw/iftop/
desc:
  en: iftop is a tool for show bandwidth usage on an interface by host
  cn: iftop 是个一个按主机显示接口上的带宽使用情况的工具
rule:
  darwin/brew:
    cmd: brew install iftop
    reference: https://formulae.brew.sh/formula/iftop#default
  debian/apt:
    cmd: sudo apt-get install iftop
    reference: https://command-not-found.com/iftop
    dsnap: iftop
  ubuntu/apt:
    cmd: sudo apt-get install iftop
    reference: https://command-not-found.com/iftop
    dsnap: iftop
  alpine/apk:
    cmd: sudo apk add iftop
    reference: https://command-not-found.com/iftop
    dsnap: iftop
  arch/pacman:
    cmd: sudo pacman -S iftop
    reference: https://command-not-found.com/iftop
  arch/yay:
    cmd: yay -S iftop-git
    reference: https://aur.archlinux.org/packages/iftop-git
  kali/apt:
    cmd: sudo apt-get install iftop
    reference: https://command-not-found.com/iftop
    dsnap: iftop
  fedora/dnf:
    cmd: sudo dnf install iftop
    reference: https://command-not-found.com/iftop
    dsnap: iftop
  raspbian/apt:
    cmd: sudo apt-get install iftop
    reference: https://command-not-found.com/iftop
  opensuse/zypper:
    cmd: sudo zypper install iftop
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=iftop
binlist:
- iftop
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
