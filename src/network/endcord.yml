lang: 'Python'
homepage: 'https://github.com/sparklost/endcord'
license: 'GPL-3.0'
desc:
  cn: 功能丰富的 Discord TUI 客户端
  en: 'Feature rich Discord TUI client.'
x:
  source: https://github.com/sparklost/endcord
  eget: sparklost/endcord
  yay: endcord
rule:
  arch/pacman:
    cmd: 'yay -S endcord'
    reference: https://github.com/sparklost/endcord
  /eget:
    cmd: x eget sparklost/endcord
    reference: https://github.com/sparklost/endcord
binlist:
- 'endcord'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 安装 50 MB
            en: 50 MB install
        download:
          estimate: 50 MB
          desc:
            cn: 约 50 MB 下载 (macos/x64)
            en: ~50 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
