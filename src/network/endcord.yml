lang: 'Python'
homepage: 'https://github.com/sparklost/endcord'
license: 'GPL-3.0'
desc:
  cn: 功能丰富的 Discord TUI 客户端
  en: 'Feature rich Discord TUI client.'
x:
  source: https://github.com/sparklost/endcord
  eget: https://github.com/sparklost/endcord
rule:
  arch/pacman:
    cmd: 'yay -S endcord'
    reference: https://github.com/sparklost/endcord
  /eget:
    cmd: x eget sparklost/endcord
    reference: https://github.com/sparklost/endcord
binlist:
  - 'endcord'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
