lang: Go
homepage: https://github.com/tsenart/vegeta
license: MIT
desc:
  cn: Vegeta 是一款多功能 HTTP 负载测试工具，旨在满足以恒定请求率钻探 HTTP 服务的需求
  en: Vegeta is a versatile HTTP load testing tool built out of a need to drill HTTP services with a constant request rate
x:
  source: https://github.com/tsenart/vegeta
  eget: https://github.com/tsenart/vegeta
rule:
  /eget:
    cmd: x eget tsenart/vegeta
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew update && brew install vegeta
    reference: https://github.com/tsenart/vegeta?tab=readme-ov-file#macos
  darwin/port:
    cmd: sudo port install vegeta
    reference: https://github.com/tsenart/vegeta?tab=readme-ov-file#macos
  arch/pacman:
    cmd: sudo pacman -S vegeta
    reference: https://github.com/tsenart/vegeta?tab=readme-ov-file#arch-linux
  freebsd/pkg:
    cmd: pkg install vegeta
    reference: https://github.com/tsenart/vegeta?tab=readme-ov-file#freebsd
binlist:
- vegeta

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
