lang: 'C++'
homepage: 'https://github.com/nassendelft/har-viewer'
license: 'GPL-3.0'
desc:
  cn: 检查 HAR (HTTP Archive) 文件的终端界面
  en: 'A terminal UI for inspecting HAR (HTTP Archive) files'
x:
  source: https://github.com/nassendelft/har-viewer
  eget: https://github.com/nassendelft/har-viewer
rule:
  /eget:
    cmd: x eget nassendelft/har-viewer
    reference: https://github.com/nassendelft/har-viewer
binlist:
  - 'har-viewer'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 439 KB
          rating: 1
          desc:
            cn: 约 439 KB（估算）
            en: ~439 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
