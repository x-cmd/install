lang: Go
homepage: https://github.com/brandonyoungdev/tldx
license: Apache-2.0
desc:
  cn: 域名可用性查询工具
  en: Domain Availability Research Tool
  cs: Nástroj pro výzkum dostupnosti domén
  de: Tool zur Recherche der Domainverfügbarkeit
  es: Herramienta de investigación de disponibilidad de dominios
  fr: Outil de recherche de disponibilité de domaines
  id: Alat riset ketersediaan domain
  it: Strumento di ricerca sulla disponibilità dei domini
  ja: ドメイン可用性の調査ツール
  ko: 도메인 가용성 조사 도구
  pl: Narzędzie do badania dostępności domen
  pt: Ferramenta de pesquisa de disponibilidade de domínios
  ro: Instrument de cercetare a disponibilității domeniilor
  ru: Инструмент для проверки доступности доменов
  th: เครื่องมือค้นคว้าความพร้อมของโดเมน
  tr: Alan adı kullanılabilirliği araştırma aracı
  uk: Інструмент для перевірки доступності доменів
  vi: Công cụ khảo sát khả năng sử dụng của tên miền
x:
  source: https://github.com/brandonyoungdev/tldx
  eget: brandonyoungdev/tldx
  brew: brandonyoungdev/tldx/tldx
  yay: tldx
  go: github.com/brandonyoungdev/tldx@latest
rule:
  /eget:
    cmd: x eget brandonyoungdev/tldx
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install brandonyoungdev/tldx/tldx
    reference: https://github.com/brandonyoungdev/tldx?tab=readme-ov-file#macos-homebrew
  arch/yay:
    cmd: yay -S tldx
    reference: https://aur.archlinux.org/packages/tldx
  /go:
    cmd: go install github.com/brandonyoungdev/tldx@latest
    reference: https://github.com/brandonyoungdev/tldx?tab=readme-ov-file#go-install-from-source
    dsnap: github.com/brandonyoungdev/tldx@latest
binlist:
- tldx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
