lang: JavaScript
homepage: https://github.com/jeffjose/tget
license: MIT
desc:
  cn: tget 是用于种子下载的 wget
  en: tget is wget for torrents
x:
  pkg:
    exist: true
  source: https://github.com/jeffjose/tget
rule:
  /x:
    cmd: x pkg use t-get
    reference: https://x-cmd.com/install/
  /yarn:
    cmd: yarn global add t-get
    reference: https://github.com/jeffjose/tget?tab=readme-ov-file#tget
  /npm:
    cmd: npm install -g t-get
    reference: https://github.com/jeffjose/tget?tab=readme-ov-file#tget
    dsnap: t-get
  arch/yay:
    cmd: yay -S nodejs-tget
    reference: https://aur.archlinux.org/packages/nodejs-tget
binlist:
- t-get

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
