lang: JavaScript
homepage: https://github.com/jeffjose/tget
license: MIT
desc:
  cn: tget 是用于种子下载的 wget
  en: tget is wget for torrents
  cs: tget je wget pro torrenty
  de: tget ist wget für Torrents
  es: tget es wget para torrents
  fr: tget est un wget pour les torrents
  id: tget adalah wget untuk torrent
  it: tget è wget per i torrent
  ja: tgetはTorrent用のwgetです
  ko: tget는 토렌트를 위한 wget입니다
  pl: tget to wget dla torrentów
  pt: tget é o wget para torrents
  ro: tget este wget pentru torrente
  ru: tget — это wget для торрентов
  th: tget คือ wget สำหรับทอร์เรนต์
  tr: tget, torrentler için wget'tir
  uk: tget — це wget для торентів
  vi: tget là wget dành cho torrent
x:
  source: https://github.com/jeffjose/tget
  yay: nodejs-tget
  npm: t-get
rule:
  /x:
    cmd: x pkg use t-get
    reference: https://x-cmd.com/install/
  /yarn:
    cmd: yarn global add t-get
    reference: https://github.com/jeffjose/tget?tab=readme-ov-file#tget
  /npm:
    cmd: npm install -g t-get
    reference: https://github.com/jeffjose/tget?tab=readme-ov-file#tget
    dsnap: t-get
  arch/yay:
    cmd: yay -S nodejs-tget
    reference: https://aur.archlinux.org/packages/nodejs-tget
binlist:
- t-get

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
