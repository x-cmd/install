lang: JavaScript
homepage: https://github.com/jeffjose/tget
license: MIT
desc:
  cn: tget 是用于种子下载的 wget
  en: tget is wget for torrents
x:
  pkg:
    exist: true
  source: https://github.com/jeffjose/tget
rule:
  /x:
    cmd: x pkg use t-get
    reference: https://x-cmd.com/install/
  /yarn:
    cmd: yarn global add t-get
    reference: https://github.com/jeffjose/tget?tab=readme-ov-file#tget
  /npm:
    cmd: npm install -g t-get
    reference: https://github.com/jeffjose/tget?tab=readme-ov-file#tget
    dsnap: t-get
  arch/yay:
    cmd: yay -S nodejs-tget
    reference: https://aur.archlinux.org/packages/nodejs-tget
binlist:
- t-get
