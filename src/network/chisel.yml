lang: Go
homepage: https://github.com/jpillora/chisel
license: MIT
desc:
  cn: 基于 HTTP 的快速 TCP/UDP 隧道
  en: Fast TCP/UDP tunnel over HTTP
x:
  pkg:
    exist: true
  source: https://github.com/jpillora/chisel
  eget: https://github.com/jpillora/chisel
rule:
  /eget:
    cmd: x eget jpillora/chisel
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use chisel
    reference: https://x-cmd.com/install/
  fedora/dnf:
    cmd: sudo dnf -y install chisel
    reference: https://github.com/jpillora/chisel?tab=readme-ov-file#fedora
    dsnap: chisel
  arch/yay:
    cmd: yay -S chisel-bin
    reference: https://aur.archlinux.org/packages/chisel-bin
  /go:
    cmd: go install github.com/jpillora/chisel@latest
    reference: https://github.com/jpillora/chisel?tab=readme-ov-file#source
    dsnap: github.com/jpillora/chisel@latest
binlist:
- chisel

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
