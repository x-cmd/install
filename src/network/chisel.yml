lang: Go
homepage: https://github.com/jpillora/chisel
license: MIT
desc:
  cn: 基于 HTTP 的快速 TCP/UDP 隧道
  en: Fast TCP/UDP tunnel over HTTP
x:
  pkg:
    exist: true
  source: https://github.com/jpillora/chisel
  eget: https://github.com/jpillora/chisel
rule:
  /eget:
    cmd: x eget jpillora/chisel
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use chisel
    reference: https://x-cmd.com/install/
  fedora/dnf:
    cmd: sudo dnf -y install chisel
    reference: https://github.com/jpillora/chisel?tab=readme-ov-file#fedora
    dsnap: chisel
  arch/yay:
    cmd: yay -S chisel-bin
    reference: https://aur.archlinux.org/packages/chisel-bin
  /go:
    cmd: go install github.com/jpillora/chisel@latest
    reference: https://github.com/jpillora/chisel?tab=readme-ov-file#source
    dsnap: github.com/jpillora/chisel@latest
binlist:
- chisel

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 541 KB
          rating: 1
          desc:
            cn: 约 541 KB（估算）
            en: ~541 KB estimated
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
