lang: Rust
homepage: https://github.com/mrjackwills/havn
license: MIT
desc:
  cn: 一个快速且可配置的端口扫描器，具有合理的默认值。
  en: A fast configurable port scanner with reasonable defaults.
x:
  source: https://github.com/mrjackwills/havn
rule:
  /curl:
    cmd: curl https://raw.githubusercontent.com/mrjackwills/havn/main/install.sh | bash
    reference: https://github.com/mrjackwills/havn?tab=readme-ov-file#download--install
  /cargo:
    cmd: cargo install havn
    reference: https://github.com/mrjackwills/havn?tab=readme-ov-file#download--install
    dsnap: havn
  arch/pacman:
    cmd: pacman -S havn
    reference: https://github.com/mrjackwills/havn?tab=readme-ov-file#download--install
binlist:
- havn

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
