lang: Rust
homepage: https://github.com/mrjackwills/havn
license: MIT
desc:
  cn: 一个快速且可配置的端口扫描器，具有合理的默认值。
  en: A fast configurable port scanner with reasonable defaults.
  cs: Rychlý konfigurovatelný skener portů s rozumnými výchozími hodnotami.
  de: Ein schneller, konfigurierbarer Portscanner mit sinnvollen Standardwerten.
  es: Un escáner de puertos rápido y configurable con valores predeterminados razonables.
  fr: Un scanner de ports rapide et configurable avec des valeurs par défaut raisonnables.
  id: Pemindai port yang cepat dan dapat dikonfigurasi dengan nilai bawaan yang wajar.
  it: Un port scanner veloce e configurabile con impostazioni predefinite ragionevoli.
  ja: 妥当なデフォルト値を持つ、高速で設定可能なポートスキャナ。
  ko: 합리적인 기본값을 갖춘 빠르고 구성 가능한 포트 스캐너.
  pl: Szybki, konfigurowalny skaner portów z rozsądnymi wartościami domyślnymi.
  pt: Um verificador de portas rápido e configurável com padrões razoáveis.
  ro: Un scanner de porturi rapid și configurabil cu valori implicite rezonabile.
  ru: Быстрый настраиваемый сканер портов с разумными значениями по умолчанию.
  th: ตัวสแกนพอร์ตที่รวดเร็วและกำหนดค่าได้ พร้อมค่าเริ่มต้นที่สมเหตุสมผล
  tr: Makul ölçüde varsayılan değerlere sahip hızlı ve yapılandırılabilir port tarayıcı.
  uk: Швидкий налаштовуваний сканер портів із розумними значеннями за замовчуванням.
  vi: Trình quét cổng nhanh và có thể cấu hình với các giá trị mặc định hợp lý.
x:
  source: https://github.com/mrjackwills/havn
  pacman: havn
  cargo: havn
rule:
  /curl:
    cmd: curl https://raw.githubusercontent.com/mrjackwills/havn/main/install.sh | bash
    reference: https://github.com/mrjackwills/havn?tab=readme-ov-file#download--install
  /cargo:
    cmd: cargo install havn
    reference: https://github.com/mrjackwills/havn?tab=readme-ov-file#download--install
    dsnap: havn
  arch/pacman:
    cmd: pacman -S havn
    reference: https://github.com/mrjackwills/havn?tab=readme-ov-file#download--install
binlist:
- havn

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 463 KB
          rating: 1
          desc:
            cn: 安装 463 KB
            en: 463 KB install
        download:
          estimate: 463 KB
          desc:
            cn: 约 463 KB 下载 (linux/x64)
            en: ~463 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
