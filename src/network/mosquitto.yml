lang: C
homepage: https://github.com/eclipse/mosquitto
desc:
  cn: 实现 MQTT 协议的消息代理
  en: Message broker implementing the MQTT protocol
x:
  pkg:
    exist: true
  source: https://github.com/eclipse/mosquitto
rule:
  /x:
    cmd: x pkg use mosquitto
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install mosquitto
    reference: https://mosquitto.org/download/
  debian/apt:
    cmd: sudo apt-get install mosquitto
    reference: https://command-not-found.com/mosquitto
    dsnap: mosquitto
  ubuntu/apt:
    cmd: sudo apt-get install mosquitto
    reference: https://command-not-found.com/mosquitto
    dsnap: mosquitto
  alpine/apk:
    cmd: sudo apk add mosquitto
    reference: https://command-not-found.com/mosquitto
    dsnap: mosquitto
  arch/pacman:
    cmd: sudo pacman -S mosquitto
    reference: https://command-not-found.com/mosquitto
  arch/yay:
    cmd: yay -S mosquitto-git
    reference: https://aur.archlinux.org/packages/mosquitto-git
  kali/apt:
    cmd: sudo apt-get install mosquitto
    reference: https://command-not-found.com/mosquitto
    dsnap: mosquitto
  fedora/dnf:
    cmd: sudo dnf install mosquitto
    reference: https://command-not-found.com/mosquitto
    dsnap: mosquitto
  raspbian/apt:
    cmd: sudo apt-get install mosquitto
    reference: https://command-not-found.com/mosquitto
binlist:
- mosquitto
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
