lang: 'Python'
homepage: https://github.com/savannahostrowski/gruyere
license: 'MIT'
desc:
  cn: 查看并终止监听端口的小巧终端工具
  en: '✨ A tiny (and pretty) program for viewing + killing listening ports'
  cs: ✨ Drobný (a hezký) program pro zobrazení a ukončení naslouchajících portů
  de: ✨ Ein kleines (und hübsches) Programm zum Anzeigen und Beenden lauschender Ports
  es: ✨ Un programa pequeño (y bonito) para ver y terminar puertos en escucha
  fr: ✨ Un petit programme (et joli) pour afficher et tuer les ports en écoute
  id: ✨ Program kecil (dan cantik) untuk melihat dan menghentikan port yang mendengarkan
  it: ✨ Un piccolo (e carino) programma per visualizzare e chiudere le porte in ascolto
  ja: ✨ 待ち受け中のポートの表示と終了を行う小さな（そして rincónとした）プログラム
  ko: ✨ 수신 대기 중인 포트를 확인하고 종료하는 작고(아름다운) 프로그램
  pl: ✨ Mały (i ładny) program do przeglądania i zamykania nasłuchujących portów
  pt: ✨ Um programa pequeno (e bonito) para ver e matar portas em escuta
  ro: ✨ Un program mic (și frumos) pentru vizualizarea și oprirea porturilor care ascultă
  ru: ✨ Маленькая (и красивая) программа для просмотра и закрытия слушающих портов
  th: ✨ โปรแกรมเล็ก (และสวย) สำหรับดูและปิดพอร์ตที่กำลังฟัง
  tr: ✨ Dinlenen portları görüntülemek ve sonlandırmak için küçük (ve güzel) bir program
  uk: ✨ Маленька (і гарна) програма для перегляду та закриття портів, що слухають
  vi: ✨ Một chương trình nhỏ (và xinh) để xem và dừng các cổng đang lắng nghe
x:
  source: https://github.com/savannahostrowski/gruyere
  eget: savannahostrowski/gruyere
rule:
  /eget:
    cmd: x eget savannahostrowski/gruyere
    reference: https://github.com/savannahostrowski/gruyere
binlist:
  - 'gruyere'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
