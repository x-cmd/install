lang: 'Python'
homepage: https://github.com/savannahostrowski/gruyere
license: 'MIT'
desc:
  cn: 查看并终止监听端口的小巧终端工具
  en: '✨ A tiny (and pretty) program for viewing + killing listening ports'
x:
  source: https://github.com/savannahostrowski/gruyere
  eget: https://github.com/savannahostrowski/gruyere
rule:
  /eget:
    cmd: x eget savannahostrowski/gruyere
    reference: https://github.com/savannahostrowski/gruyere
binlist:
  - 'gruyere'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
