lang: 'Python'
homepage: https://github.com/savannahostrowski/gruyere
license: 'MIT'
desc:
  cn: 查看并终止监听端口的小巧终端工具
  en: '✨ A tiny (and pretty) program for viewing + killing listening ports'
x:
  source: https://github.com/savannahostrowski/gruyere
  eget: https://github.com/savannahostrowski/gruyere
rule:
  /eget:
    cmd: x eget savannahostrowski/gruyere
    reference: https://github.com/savannahostrowski/gruyere
binlist:
  - 'gruyere'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
