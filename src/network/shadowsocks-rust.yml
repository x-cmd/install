lang: Rust
homepage: https://github.com/shadowsocks/shadowsocks-rust
license: MIT
desc:
  cn: Shadowsocks 是一个快速隧道代理，可以帮助您绕过防火墙
  en: shadowsocks is a fast tunnel proxy that helps you bypass firewalls
x:
  pkg:
    exist: true
  source: https://github.com/shadowsocks/shadowsocks-rust
  eget: https://github.com/shadowsocks/shadowsocks-rust
  brew: shadowsocks-rust
  snap: shadowsocks-rust
rule:
  /eget:
    cmd: x eget shadowsocks/shadowsocks-rust
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use shadowsocks-rust
    reference: https://x-cmd.com/install/
  /cargo:
    cmd: cargo install shadowsocks-rust
    reference: https://github.com/shadowsocks/shadowsocks-rust?tab=readme-ov-file#cratesio
    dsnap: shadowsocks-rust
  arch/yay:
    cmd: yay -S shadowsocks-rust-git
    reference: https://aur.archlinux.org/packages/shadowsocks-rust-git
  darwin/brew:
    cmd: brew install shadowsocks-rust
    reference: https://github.com/shadowsocks/shadowsocks-rust?tab=readme-ov-file#install-using-homebrew
  /snap:
    cmd: snap install shadowsocks-rust
    reference: https://github.com/shadowsocks/shadowsocks-rust?tab=readme-ov-file#install-using-snap
binlist:
- shadowsocks-rust

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 安装 13 MB
            en: 13 MB install
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
