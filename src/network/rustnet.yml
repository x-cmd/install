lang: 'Rust'
homepage: https://github.com/domcyrus/rustnet
license: 'Apache-2.0'
desc:
  cn: 带深度包检测的终端按进程网络监控，跨平台沙箱运行
  en: 'Per-process network monitoring for your terminal with deep packet inspection. Cross-platform, sandboxed.'
x:
  source: https://github.com/domcyrus/rustnet
  eget: https://github.com/domcyrus/rustnet
rule:
  /eget:
    cmd: x eget domcyrus/rustnet
    reference: https://github.com/domcyrus/rustnet
binlist:
- 'rustnet'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
