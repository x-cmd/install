lang: 'Rust'
homepage: https://github.com/domcyrus/rustnet
license: 'Apache-2.0'
desc:
  cn: 带深度包检测的终端按进程网络监控，跨平台沙箱运行
  en: 'Per-process network monitoring for your terminal with deep packet inspection. Cross-platform, sandboxed.'
x:
  source: https://github.com/domcyrus/rustnet
  eget: https://github.com/domcyrus/rustnet
rule:
  /eget:
    cmd: x eget domcyrus/rustnet
    reference: https://github.com/domcyrus/rustnet
binlist:
  - 'rustnet'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
