lang: Go
homepage: https://github.com/jsdelivr/globalping
desc:
  cn: Globalping CLI 是网络优化必备的一体化工具
  en: Globalping CLI is a must have all-in-one tool for network optimization
  cs: Globalping CLI je nepostradatelný all-in-one nástroj pro optimalizaci sítě
  de: Globalping CLI ist ein unverzichtbares All-in-One-Tool zur Netzwerkoptimierung
  es: Globalping CLI es una herramienta integral imprescindible para la optimización de la red
  fr: Globalping CLI est un outil tout-en-un indispensable pour l'optimisation du réseau
  id: Globalping CLI adalah alat all-in-one yang wajib dimiliki untuk optimasi jaringan
  it: Globalping CLI è uno strumento tutto in uno indispensabile per l'ottimizzazione della rete
  ja: Globalping CLI はネットワーク最適化に必要なオールインワンツールです
  ko: Globalping CLI는 네트워크 최적화를 위한 필수 올인원 도구입니다
  pl: Globalping CLI to niezbędne narzędzie all-in-one do optymalizacji sieci
  pt: O Globalping CLI é uma ferramenta completa indispensável para otimização de rede
  ro: Globalping CLI este un instrument all-in-one indispensabil pentru optimizarea rețelei
  ru: Globalping CLI — незаменимый универсальный инструмент для оптимизации сети
  th: Globalping CLI คือเครื่องมือออลอินวันที่ต้องมีสำหรับการปรับจูนเครือข่าย
  tr: Globalping CLI, ağ optimizasyonu için vazgeçilmez bir hepsi bir arada araçtır
  uk: Globalping CLI — незамінний універсальний інструмент для оптимізації мережі
  vi: Globalping CLI là công cụ tất cả trong một không thể thiếu cho việc tối ưu hóa mạng
x:
  source: https://github.com/jsdelivr/globalping
  apt: globalping
  dnf: globalping
  brew: jsdelivr/globalping/globalping
  choco: globalping
  winget: globalping
  yay: globalping-cli
rule:
  /x:
    cmd: x pkg use globalping
    reference: https://x-cmd.com/install/
  debian/apt:
    cmd: 'curl -s https://packagecloud.io/install/repositories/jsdelivr/globalping/script.deb.sh | sudo bash && \

      sudo apt install globalping

      '
    reference: https://github.com/jsdelivr/globalping-cli?tab=readme-ov-file#ubuntudebian-deb
    dsnap: globalping
  ubuntu/apt:
    cmd: 'curl -s https://packagecloud.io/install/repositories/jsdelivr/globalping/script.deb.sh | sudo bash && \

      sudo apt install globalping

      '
    reference: https://github.com/jsdelivr/globalping-cli?tab=readme-ov-file#ubuntudebian-deb
    dsnap: globalping
  centos/dnf:
    cmd: 'curl -s https://packagecloud.io/install/repositories/jsdelivr/globalping/script.rpm.sh | sudo bash && \

      sudo dnf install globalping

      '
    reference: https://github.com/jsdelivr/globalping-cli?tab=readme-ov-file#centosfedorarocky-linuxalmalinux-rpm
  fedora/dnf:
    cmd: 'curl -s https://packagecloud.io/install/repositories/jsdelivr/globalping/script.rpm.sh | sudo bash && \

      sudo dnf install globalping

      '
    reference: https://github.com/jsdelivr/globalping-cli?tab=readme-ov-file#centosfedorarocky-linuxalmalinux-rpm
    dsnap: globalping
  rocky/dnf:
    cmd: 'curl -s https://packagecloud.io/install/repositories/jsdelivr/globalping/script.rpm.sh | sudo bash && \

      sudo dnf install globalping

      '
    reference: https://github.com/jsdelivr/globalping-cli?tab=readme-ov-file#centosfedorarocky-linuxalmalinux-rpm
  alma/dnf:
    cmd: 'curl -s https://packagecloud.io/install/repositories/jsdelivr/globalping/script.rpm.sh | sudo bash && \

      sudo dnf install globalping

      '
    reference: https://github.com/jsdelivr/globalping-cli?tab=readme-ov-file#centosfedorarocky-linuxalmalinux-rpm
  darwin/brew:
    cmd: 'brew tap jsdelivr/globalping && \

      brew install globalping

      '
    reference: https://github.com/jsdelivr/globalping-cli?tab=readme-ov-file#macos---homebrew
  arch/yay:
    cmd: yay -S globalping-cli
    reference: https://aur.archlinux.org/packages/globalping-cli
  (win|wsl2)/choco:
    cmd: x choco install globalping
    reference: https://github.com/jsdelivr/globalping-cli?tab=readme-ov-file#windows---chocolatey
  (win|wsl2)/winget:
    cmd: x winget install globalping
    reference: https://github.com/jsdelivr/globalping-cli?tab=readme-ov-file#windows---winget
binlist:
- globalping
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 40 KB
          rating: 1
          desc:
            cn: 约 40 KB（估算）
            en: ~40 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
