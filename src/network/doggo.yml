lang: Go
homepage: https://github.com/mr-karan/doggo
license: GPL-3.0
desc:
  cn: doggo 是一个用 Golang 编写的现代命令行 DNS 客户端
  en: doggo is a modern command-line DNS client (like dig) written in Golang
x:
  pkg:
    exist: true
  source: https://github.com/mr-karan/doggo
  eget: https://github.com/mr-karan/doggo
rule:
  /x:
    cmd: x pkg use doggo
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget mr-karan/doggo
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install doggo
    reference: https://formulae.brew.sh/formula/doggo#default
  arch/yay:
    cmd: yay -S doggo-bin
    reference: https://aur.archlinux.org/packages/doggo-bin
  (win|wsl2)/scoop:
    cmd: x scoop install doggo
    reference: https://github.com/mr-karan/doggo#package-managers
binlist:
- doggo

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
