lang: Python
homepage: https://github.com/mitmproxy/mitmproxy
license: MIT
desc:
  cn: mitmproxy 是一个免费开源的交互式 HTTPS 代理
  en: mitmproxy is a free and open source interactive HTTPS proxy
  cs: mitmproxy je bezplatný interaktivní proxy server s otevřeným zdrojovým kódem pro HTTPS
  de: mitmproxy ist ein kostenloser, quelloffener interaktiver HTTPS-Proxy
  es: mitmproxy es un proxy HTTPS interactivo, gratuito y de código abierto
  fr: mitmproxy est un proxy HTTPS interactif, gratuit et open source
  id: mitmproxy adalah proxy HTTPS interaktif yang gratis dan sumber terbuka
  it: mitmproxy è un proxy HTTPS interattivo, gratuito e open source
  ja: mitmproxy は無料でオープンソースの対話型 HTTPS プロキシです
  ko: mitmproxy는 무료 오픈 소스 대화형 HTTPS 프록시입니다
  pl: mitmproxy to bezpłatny, otwartoźródłowy interaktywny proxy dla HTTPS
  pt: mitmproxy é um proxy HTTPS interativo, gratuito e de código aberto
  ro: mitmproxy este un proxy HTTPS interactiv, gratuit și open source
  ru: mitmproxy — это бесплатный интерактивный HTTPS-прокси с открытым исходным кодом
  th: mitmproxy เป็นพร็อกซี HTTPS แบบโต้ตอบที่ฟรีและโอเพนซอร์ส
  tr: mitmproxy, ücretsiz ve açık kaynaklı bir etkileşimli HTTPS proxy'sidir.
  uk: mitmproxy — це безкоштовний інтерактивний HTTPS-проксі з відкритим кодом
  vi: mitmproxy là proxy HTTPS tương tác, miễn phí và mã nguồn mở
x:
  source: https://github.com/mitmproxy/mitmproxy
  apt: mitmproxy
  dnf: mitmproxy
  brew: mitmproxy
  pacman: mitmproxy
  apt-get: mitmproxy
  zypper: mitmproxy
  scoop: extras/mitmproxy
  choco: mitmproxy
  winget: mitmproxy.mitmproxy
  yay: mitmproxy-git
  asdf: mitmproxy
rule:
  /x:
    cmd: x pkg use mitmproxy
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use mitmproxy
    reference: https://github.com/NeoHsu/asdf-mitmproxy
  /pipx:
    cmd: pipx install mitmproxy
    reference: https://docs.mitmproxy.org/stable/overview-installation/#installation-from-the-python-package-index-pypi
  darwin/brew:
    cmd: brew install mitmproxy
    reference: https://formulae.brew.sh/cask/mitmproxy#default
  debian/apt:
    cmd: sudo apt-get install mitmproxy
    reference: https://command-not-found.com/mitmproxy
    dsnap: mitmproxy
  ubuntu/apt:
    cmd: sudo apt-get install mitmproxy
    reference: https://command-not-found.com/mitmproxy
    dsnap: mitmproxy
  arch/pacman:
    cmd: sudo pacman -S mitmproxy
    reference: https://command-not-found.com/mitmproxy
  arch/yay:
    cmd: yay -S mitmproxy-git
    reference: https://aur.archlinux.org/packages/mitmproxy-git
  kali/apt:
    cmd: sudo apt-get install mitmproxy
    reference: https://command-not-found.com/mitmproxy
    dsnap: mitmproxy
  fedora/dnf:
    cmd: sudo dnf install mitmproxy
    reference: https://docs.mitmproxy.org/stable/overview-installation/#linux
    dsnap: mitmproxy
  opensuse/zypper:
    cmd: sudo zypper install mitmproxy
    reference: https://docs.mitmproxy.org/stable/overview-installation/#linux
  raspbian/apt:
    cmd: sudo apt-get install mitmproxy
    reference: https://command-not-found.com/mitmproxy
  (win|wsl2)/winget:
    cmd: x winget install mitmproxy.mitmproxy
    reference: https://winget.run/pkg/mitmproxy/mitmproxy
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/mitmproxy
    reference: https://scoop.sh/#/apps?q=mitmproxy
  (win|wsl2)/choco:
    cmd: x choco install mitmproxy
    reference: https://community.chocolatey.org/packages?q=mitmproxy
binlist:
- mitmproxy

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 170 KB
          rating: 1
          desc:
            cn: 约 170 KB（估算）
            en: ~170 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
