lang: 'Go'
homepage: https://github.com/dhth/kplay
license: 'MIT'
desc:
  cn: 简洁可控地查看 Kafka topic 中的消息
  en: 'Inspect messages in a Kafka topic in a simple and deliberate manner'
x:
  source: https://github.com/dhth/kplay
  eget: https://github.com/dhth/kplay
rule:
  /eget:
    cmd: x eget dhth/kplay
    reference: https://github.com/dhth/kplay
binlist:
- 'kplay'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
