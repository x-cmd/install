lang: 'Rust'
homepage: 'https://github.com/EdJoPaTo/mqttui'
license: 'GPL-3.0'
desc:
  cn: 从终端快速订阅 MQTT topic 或发布消息
  en: 'Subscribe to a MQTT Topic or publish something quickly from the terminal'
x:
  source: https://github.com/EdJoPaTo/mqttui
  eget: https://github.com/EdJoPaTo/mqttui
rule:
  /cargo:
    cmd: 'cargo install --path .'
    reference: https://github.com/EdJoPaTo/mqttui
  /eget:
    cmd: x eget EdJoPaTo/mqttui
    reference: https://github.com/EdJoPaTo/mqttui
binlist:
- 'mqttui'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
