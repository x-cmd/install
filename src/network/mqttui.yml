lang: 'Rust'
homepage: 'https://github.com/EdJoPaTo/mqttui'
license: 'GPL-3.0'
desc:
  cn: 从终端快速订阅 MQTT topic 或发布消息
  en: 'Subscribe to a MQTT Topic or publish something quickly from the terminal'
  cs: Rychle odběr MQTT topicu nebo publikování zpráv z terminálu
  de: Abonniere schnell auf ein MQTT-Topic oder veröffentliche Nachrichten aus dem Terminal
  es: Suscríbete a un topic MQTT o publica mensajes rápidamente desde la terminal
  fr: Abonnez-vous à un topic MQTT ou publiez des messages rapidement depuis le terminal
  id: Berlangganan topik MQTT atau publikasikan pesan dengan cepat dari terminal
  it: Iscriviti a un topic MQTT o pubblica messaggi rapidamente dal terminale
  ja: ターミナルから MQTT トピックを購読したりメッセージを送信したりします
  ko: 터미널에서 MQTT 토픽을 구독하거나 메시지를 빠르게 게시합니다
  pl: Szybko subskrybuj temat MQTT lub publikuj wiadomości z terminala
  pt: Assine um tópico MQTT ou publique mensagens rapidamente a partir do terminal
  ro: Abonează-te rapid la un subiect MQTT sau publică mesaje din terminal
  ru: Быстро подписывайтесь на темы MQTT или публикуйте сообщения из терминала
  th: สมัครรับหัวข้อ MQTT หรือเผยแพร่ข้อความได้อย่างรวดเร็วจากเทอร์มินัล
  tr: Terminalden hızlıca bir MQTT konusuna abone olun veya mesaj yayınlayın
  uk: Швидко підписуйтесь на теми MQTT або публікуйте повідомлення з термінала
  vi: Nhanh chóng đăng ký một chủ đề MQTT hoặc đăng tin nhắn từ terminal
x:
  source: https://github.com/EdJoPaTo/mqttui
  eget: EdJoPaTo/mqttui
rule:
  /cargo:
    cmd: 'cargo install --path .'
    reference: https://github.com/EdJoPaTo/mqttui
  /eget:
    cmd: x eget EdJoPaTo/mqttui
    reference: https://github.com/EdJoPaTo/mqttui
binlist:
- 'mqttui'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
