lang: 'Rust'
homepage: 'https://github.com/EdJoPaTo/mqttui'
license: 'GPL-3.0'
desc:
  cn: 从终端快速订阅 MQTT topic 或发布消息
  en: 'Subscribe to a MQTT Topic or publish something quickly from the terminal'
x:
  source: https://github.com/EdJoPaTo/mqttui
  eget: https://github.com/EdJoPaTo/mqttui
rule:
  /cargo:
    cmd: 'cargo install --path .'
    reference: https://github.com/EdJoPaTo/mqttui
  /eget:
    cmd: x eget EdJoPaTo/mqttui
    reference: https://github.com/EdJoPaTo/mqttui
binlist:
  - 'mqttui'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
