lang: swift
homepage: https://github.com/mxcl/Workbench
desc:
  cn: Workbench 是一个可视化的数据库建模、管理和排队工具
  en: Workbench is a visual database modeling, administration and queuing tool
  cs: Workbench je vizuální nástroj pro modelování databází, administraci a řízení front
  de: Workbench ist ein visuelles Werkzeug für Datenbankmodellierung, -verwaltung und Warteschlangen
  es: Workbench es una herramienta visual de modelado de bases de datos, administración y gestión de colas
  fr: Workbench est un outil visuel de modélisation de bases de données, d'administration et de gestion de files d'attente
  id: Workbench adalah alat visual untuk pemodelan basis data, administrasi, dan antrean
  it: Workbench è uno strumento visuale per la modellazione di database, l'amministrazione e la gestione delle code
  ja: Workbench はデータベースのモデリング、管理、キュー管理のためのビジュアルツールです
  ko: Workbench는 데이터베이스 모델링, 관리 및 대기열 처리를 위한 시각적 도구입니다
  pl: Workbench to wizualne narzędzie do modelowania baz danych, administracji i kolejkowania
  pt: Workbench é uma ferramenta visual de modelagem de banco de dados, administração e gerenciamento de filas
  ro: Workbench este un instrument vizual pentru modelarea bazelor de date, administrare și gestionarea cozilor
  ru: Workbench — визуальный инструмент для моделирования баз данных, администрирования и управления очередями
  th: Workbench เป็นเครื่องมือภาพสำหรับการสร้างแบบจำลองฐานข้อมูล การดูแลระบบ และการจัดคิว
  tr: Workbench, veritabanı modelleme, yönetim ve kuyruk işlemleri için görsel bir araçtır
  uk: Workbench — візуальний інструмент для моделювання баз даних, адміністрування та керування чергами
  vi: Workbench là công cụ trực quan để mô hình hóa cơ sở dữ liệu, quản trị và quản lý hàng đợi
x:
  source: https://github.com/mxcl/Workbench
  eget: mxcl/Workbench
  apt: mysql-workbench
  pacman: mysql-workbench
  apt-get: mysql-workbench
rule:
  /eget:
    cmd: x eget mxcl/Workbench
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install --cask workbench
    reference: https://formulae.brew.sh/cask/workbench#default
  debian/apt:
    cmd: sudo apt-get install mysql-workbench
    reference: https://command-not-found.com/mysql-workbench
    dsnap: mysql-workbench
  ubuntu/apt:
    cmd: sudo apt-get install mysql-workbench
    reference: https://command-not-found.com/mysql-workbench
    dsnap: mysql-workbench
  arch/pacman:
    cmd: sudo pacman -S mysql-workbench
    reference: https://command-not-found.com/mysql-workbench
  raspbian/apt:
    cmd: sudo apt-get install mysql-workbench
    reference: https://command-not-found.com/mysql-workbench
binlist:
- mysql-workbench
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
