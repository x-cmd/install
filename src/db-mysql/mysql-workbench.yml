lang: swift
homepage: https://github.com/mxcl/Workbench
desc:
  cn: Workbench 是一个可视化的数据库建模、管理和排队工具
  en: Workbench is a visual database modeling, administration and queuing tool
x:
  source: https://github.com/mxcl/Workbench
  eget: https://github.com/mxcl/Workbench
rule:
  /eget:
    cmd: x eget mxcl/Workbench
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install --cask workbench
    reference: https://formulae.brew.sh/cask/workbench#default
  debian/apt:
    cmd: sudo apt-get install mysql-workbench
    reference: https://command-not-found.com/mysql-workbench
    dsnap: mysql-workbench
  ubuntu/apt:
    cmd: sudo apt-get install mysql-workbench
    reference: https://command-not-found.com/mysql-workbench
    dsnap: mysql-workbench
  arch/pacman:
    cmd: sudo pacman -S mysql-workbench
    reference: https://command-not-found.com/mysql-workbench
  raspbian/apt:
    cmd: sudo apt-get install mysql-workbench
    reference: https://command-not-found.com/mysql-workbench
binlist:
- mysql-workbench
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
