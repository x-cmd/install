lang: Python
homepage: https://github.com/dbcli/mycli
license: BSD-3-Clause
desc:
  cn: MySQL、MariaDB 和 Percona 的命令行界面，具有自动完成和语法功能突出显示
  en: MyCLI is a command line interface for MySQL, MariaDB, and Percona with auto-completion and syntax highlighting.
x:
  source: https://github.com/dbcli/mycli
  apt: mycli
  dnf: mycli
  brew: mycli
  apt-get: mycli
  yay: mycli
  pip: -U
rule:
  /x:
    cmd: x pkg use mycli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install -U mycli
    reference: https://github.com/dbcli/mycli#quick-start
    dsnap: mycli
  /pip3:
    cmd: pip3 install mycli
    reference: https://www.mycli.net/install
  darwin/brew:
    cmd: 'brew update \

      && brew install mycli

      '
    reference: https://github.com/dbcli/mycli#quick-start
  debian/apt:
    cmd: sudo apt-get install mycli
    reference: https://github.com/dbcli/mycli#quick-start
    dsnap: mycli
  ubuntu/apt:
    cmd: sudo apt-get install mycli
    reference: https://github.com/dbcli/mycli#quick-start
    dsnap: mycli
  kali/apt:
    cmd: sudo apt-get install mycli
    reference: https://command-not-found.com/mycli
    dsnap: mycli
  fedora/dnf:
    cmd: sudo dnf install mycli
    reference: https://command-not-found.com/mycli
    dsnap: mycli
  raspbian/apt:
    cmd: sudo apt-get install mycli
    reference: https://command-not-found.com/mycli
  arch/yay:
    cmd: yay -S mycli
    reference: https://aur.archlinux.org/packages/mycli
binlist:
- mycli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 87 KB
          rating: 1
          desc:
            cn: 约 87 KB（估算）
            en: ~87 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
