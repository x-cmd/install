lang: Python
homepage: https://github.com/wireservice/csvkit
license: MIT
desc:
  cn: csvkit 是一套命令行工具，用于转换和使用 CSV（“表格文件格式之王”）
  en: csvkit is a suite of command-line tools for converting to and working with CSV ("The king of tabular file formats")
x:
  pkg:
    exist: true
  source: https://github.com/wireservice/csvkit
rule:
  /x:
    cmd: x pkg use csvkit
    reference: https://x-cmd.com/install/
  /pip:
    cmd: sudo pip install csvkit
    reference: https://csvkit.readthedocs.io/en/latest/tutorial/1_getting_started.html#installing-csvkit
    dsnap: csvkit
  arch/yay:
    cmd: yay -S csvkit-git
    reference: https://aur.archlinux.org/packages/csvkit-git
binlist:
  - csvclean
  - csvcut
  - csvformat
  - csvgrep
  - csvjoin
  - csvjson
  - csvlook
  - csvpy
  - csvsort
  - csvsql
  - csvstack
  - csvstat
  - in2csv
  - sql2csv

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
