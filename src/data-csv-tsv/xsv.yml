lang: Rust
homepage: https://github.com/BurntSushi/xsv
license: Unlicense
desc:
  cn: xsv 是一个用于索引、切片、分析、拆分和连接 CSV 文件的命令行程序
  en: xsv is a command line program for indexing, slicing, analyzing, splitting and joining CSV files
x:
  pkg:
    exist: true
  source: https://github.com/BurntSushi/xsv
  eget: https://github.com/BurntSushi/xsv
rule:
  /eget:
    cmd: x eget BurntSushi/xsv
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use xsv
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install xsv
    reference: https://formulae.brew.sh/formula/xsv#default
  nix/:
    cmd: nix-env -i xsv
    reference: https://github.com/BurntSushi/xsv
  darwin/port:
    cmd: sudo port selfupdate && $ sudo port install xsv
    reference: https://github.com/BurntSushi/xsv
  arch/yay:
    cmd: yay -S xsv-git
    reference: https://aur.archlinux.org/packages/xsv-git
binlist:
- xsv

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
