lang: Rust
homepage: https://github.com/BurntSushi/xsv
license: Unlicense
desc:
  cn: xsv 是一个用于索引、切片、分析、拆分和连接 CSV 文件的命令行程序
  en: xsv is a command line program for indexing, slicing, analyzing, splitting and joining CSV files
  cs: xsv je program příkazové řádky pro indexování, řezání, analýzu, rozdělování a spojování souborů CSV.
  de: xsv ist ein Kommandozeilenprogramm zum Indizieren, Aufteilen, Analysieren, Zerlegen und Zusammenführen von CSV-Dateien.
  es: xsv es un programa de línea de comandos para indexar, cortar, analizar, dividir y unir archivos CSV.
  fr: xsv est un programme en ligne de commande pour indexer, découper, analyser, séparer et joindre des fichiers CSV.
  id: xsv adalah program baris perintah untuk mengindeks, memotong, menganalisis, memisahkan, dan menggabungkan file CSV.
  it: xsv è un programma da riga di comando per indicizzare, sezionare, analizzare, dividere e unire file CSV.
  ja: xsv は CSV ファイルのインデキシング、スライス、解析、分割、結合を行うコマンドラインプログラムです。
  ko: xsv는 CSV 파일의 인덱싱, 슬라이싱, 분석, 분할 및 결합을 위한 명령줄 프로그램입니다.
  pl: xsv to program wiersza poleceń do indeksowania, wycinania, analizowania, dzielenia i łączenia plików CSV.
  pt: xsv é um programa de linha de comando para indexar, fatiar, analisar, dividir e juntar arquivos CSV.
  ro: xsv este un program de linie de comandă pentru indexarea, felierea, analizarea, împărțirea și unirea fișierelor CSV.
  ru: xsv — программа командной строки для индексации, нарезки, анализа, разбиения и объединения файлов CSV.
  th: xsv เป็นโปรแกรมบรรทัดคำสั่งสำหรับสร้างดัชนี ตัดช่วง วิเคราะห์ แยก และรวมไฟล์ CSV
  tr: xsv, CSV dosyalarını dizinlemek, dilimlemek, analiz etmek, bölmek ve birleştirmek için bir komut satırı programıdır.
  uk: xsv — програма командного рядка для індексації, нарізання, аналізу, розбиття та об'єднання файлів CSV.
  vi: xsv là chương trình dòng lệnh để lập chỉ mục, cắt, phân tích, tách và nối các tệp CSV.
x:
  source: https://github.com/BurntSushi/xsv
  eget: BurntSushi/xsv
  brew: xsv
  port: xsv
  yay: xsv-git
rule:
  /eget:
    cmd: x eget BurntSushi/xsv
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use xsv
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install xsv
    reference: https://formulae.brew.sh/formula/xsv#default
  nix/:
    cmd: nix-env -i xsv
    reference: https://github.com/BurntSushi/xsv
  darwin/port:
    cmd: sudo port selfupdate && $ sudo port install xsv
    reference: https://github.com/BurntSushi/xsv
  arch/yay:
    cmd: yay -S xsv-git
    reference: https://aur.archlinux.org/packages/xsv-git
binlist:
- xsv

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
