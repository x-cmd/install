lang: Go
homepage: https://github.com/nao1215/sqly
license: MIT
desc:
  en: sqly is a powerful command-line tool that can execute SQL against CSV, TSV, LTSV, JSON, and even Microsoft Excel™ files
  cn: sqly 是一个强大的命令行工具，能够对 CSV、TSV、LTSV、JSON 甚至 Microsoft Excel™ 文件执行 SQL 查询。
x:
  source: https://github.com/nao1215/sqly
  eget: https://github.com/nao1215/sqly
rule:
  /eget:
    cmd: x eget nao1215/sqly
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/nao1215/sqly@latest
    reference: https://github.com/nao1215/sqly?tab=readme-ov-file#how-to-install
    dsnap: github.com/nao1215/sqly
  darwin/brew:
    cmd: brew install nao1215/tap/sqly
    reference: https://github.com/nao1215/sqly?tab=readme-ov-file#how-to-install
binlist:
- sqly

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.2 MB
          rating: 1
          desc:
            cn: 约 5.2 MB（估算）
            en: ~5.2 MB estimated
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
