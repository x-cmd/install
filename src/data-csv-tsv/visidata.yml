lang: Python
homepage: https://github.com/saulpw/visidata
license: GPL-3.0
desc:
  cn: VisiData 是一个用于探索和整理数据的终端工具，支持多种数据格式。
  en: VisiData is a terminal tool for exploring and arranging data, supporting various data formats.
x:
  source: https://github.com/saulpw/visidata
  apt: visidata
  brew: saulpw/vd/visidata
  pacman: visidata
rule:
  /pip:
    cmd: pip3 install visidata
    reference: https://www.visidata.org/install/#all-platforms---python-v3.6-and-above
    dsnap: visidata
  darwin/brew:
    cmd: brew install saulpw/vd/visidata
    reference: https://www.visidata.org/install/#macos
  /conda:
    cmd: conda install --channel conda-forge visidata
    reference: https://www.visidata.org/install/#conda
  debian/apt:
    cmd: sudo apt install visidata
    reference: https://www.visidata.org/install/#linux
    dsnap: visidata
  arch/pacman:
    cmd: sudo pacman -S visidata
    reference: https://www.visidata.org/install/#linux
  arch/yay:
    cmd: yay -S visidata-git
    reference: https://aur.archlinux.org/packages/visidata-git
  /nix-env:
    cmd: nix-env -iA nixpkgs.visidata
    reference: https://www.visidata.org/install/#linux
  guix/guix:
    cmd: guix install visidata
    reference: https://www.visidata.org/install/#linux
binlist:
  - vd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 81 KB
          rating: 1
          desc:
            cn: 约 81 KB（估算）
            en: ~81 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
