lang: C
homepage: https://github.com/andmarti1424/sc-im
desc:
  cn: sc-im 是一个使用 ncurses 编写的终端电子表格程序。
  en: sc-im - Spreadsheet Calculator Improvised -- An ncurses spreadsheet program for terminal.
x:
  source: https://github.com/andmarti1424/sc-im
rule:
  darwin/brew:
    cmd: brew install sc-im
    reference: https://github.com/andmarti1424/sc-im#homebrew-for-osx-users
  ubuntu/apt:
    cmd: sudo apt install sc-im
    reference: https://github.com/andmarti1424/sc-im
    dsnap: sc-im
  arch/pacman:
    cmd: sudo pacman -S sc-im
    reference: https://github.com/andmarti1424/sc-im
  fedora/dnf:
    cmd: sudo dnf install sc-im
    reference: https://github.com/andmarti1424/sc-im
    dsnap: sc-im
  opensuse/zypper:
    cmd: sudo zypper install sc-im
    reference: https://github.com/andmarti1424/sc-im
  freebsd/pkg:
    cmd: pkg install sc-im
    reference: https://github.com/andmarti1424/sc-im
  alpine/apk:
    cmd: sudo apk add sc-im
    reference: https://github.com/andmarti1424/sc-im
    dsnap: sc-im
binlist:
- sc-im
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
