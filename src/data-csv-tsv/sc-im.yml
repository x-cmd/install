lang: C
homepage: https://github.com/andmarti1424/sc-im
desc:
  cn: sc-im 是一个使用 ncurses 编写的终端电子表格程序。
  en: sc-im - Spreadsheet Calculator Improvised -- An ncurses spreadsheet program for terminal.
  cs: sc-im - Zjednodušená tabulková kalkulačka -- ncurses tabulkový program pro terminál.
  de: sc-im - improvisierte Tabellenkalkulation -- ein ncurses-Tabellenprogramm für das Terminal.
  es: "sc-im: hoja de cálculo improvisada: un programa de hojas de cálculo con ncurses para el terminal."
  fr: sc-im - tableur improvisé -- un tableur ncurses pour le terminal.
  id: sc-im - Spreadsheet Calculator Improvised -- program spreadsheet berbasis ncurses untuk terminal.
  it: sc-im - foglio di calcolo improvvisato -- un programma di fogli di calcolo basato su ncurses per il terminale.
  ja: sc-im - 即興スプレッドシート計算機 -- 端末向けのncurses製スプレッドシートプログラム。
  ko: sc-im - 즉석 스프레드시트 계산기 -- 터미널용 ncurses 스프레드시트 프로그램.
  pl: sc-im - improwizowany arkusz kalkulacyjny -- program arkusza kalkulacyjnego oparty na ncurses dla terminala.
  pt: sc-im - calculadora de tabelas improvisada -- um programa de planilhas baseado em ncurses para o terminal.
  ro: sc-im - calculator de tabele improvizat -- un program de foi de calcul pentru terminal bazat pe ncurses.
  ru: sc-im - импровизированная электронная таблица -- программа-таблица на ncurses для терминала.
  th: sc-im - โปรแกรมตารางคำนวณแบบเรียบง่ายสำหรับเทอร์มินัลโดยใช้ ncurses
  tr: sc-im - doğaçlama elektronik tablo -- terminal için ncurses tablo programı.
  uk: sc-im - імпровізована електронна таблиця -- програма-таблиця на ncurses для термінала.
  vi: sc-im - bảng tính tạm số - chương trình bảng tính ncurses dành cho terminal.
x:
  source: https://github.com/andmarti1424/sc-im
  apt: sc-im
  dnf: sc-im
  brew: sc-im
  pacman: sc-im
  apk: sc-im
  zypper: sc-im
rule:
  darwin/brew:
    cmd: brew install sc-im
    reference: https://github.com/andmarti1424/sc-im#homebrew-for-osx-users
  ubuntu/apt:
    cmd: sudo apt install sc-im
    reference: https://github.com/andmarti1424/sc-im
    dsnap: sc-im
  arch/pacman:
    cmd: sudo pacman -S sc-im
    reference: https://github.com/andmarti1424/sc-im
  fedora/dnf:
    cmd: sudo dnf install sc-im
    reference: https://github.com/andmarti1424/sc-im
    dsnap: sc-im
  opensuse/zypper:
    cmd: sudo zypper install sc-im
    reference: https://github.com/andmarti1424/sc-im
  freebsd/pkg:
    cmd: pkg install sc-im
    reference: https://github.com/andmarti1424/sc-im
  alpine/apk:
    cmd: sudo apk add sc-im
    reference: https://github.com/andmarti1424/sc-im
    dsnap: sc-im
binlist:
- sc-im
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.2 MB
          rating: 1
          desc:
            cn: 约 1.2 MB（估算）
            en: ~1.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
