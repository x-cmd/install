lang: Rust
homepage: https://github.com/alexhallam/tv
license: MIT
desc:
  cn: Tidy Viewer (tv) 是一种跨平台 CSV 漂亮的打印机，它使用列造型来最大化观看者的享受
  en: Tidy Viewer (tv) is a cross-platform csv pretty printer that uses column styling to maximize viewer enjoyment
  cs: Tidy Viewer (tv) je multiplatformní krásný tisk CSV, který pomocí stylování sloupců maximalizuje zážitek ze čtení.
  de: Tidy Viewer (tv) ist ein plattformübergreifender CSV-Pretty-Printer, der durch Spaltenformatierung das Leseerlebnis maximiert.
  es: Tidy Viewer (tv) es una herramienta multiplataforma para imprimir CSV con formato bonito que usa el estilo de columnas para maximizar el disfrute del lector.
  fr: Tidy Viewer (tv) est un pretty-printer CSV multiplateforme qui utilise le style des colonnes pour maximiser le plaisir de lecture.
  id: Tidy Viewer (tv) adalah pprint CSV lintas platform yang menggunakan gaya kolom untuk memaksimalkan kenyamanan pembaca.
  it: Tidy Viewer (tv) è un pretty printer CSV multipiattaforma che usa lo stile delle colonne per massimizzare il piacere della lettura.
  ja: Tidy Viewer (tv) は、列のスタイル指定によって読みやすさを最大化する、クロスプラットフォームの CSV 整形表示ツールです。
  ko: Tidy Viewer (tv)는 열 스타일을 활용하여 보는 경험을 극대화하는 크로스 플랫폼 CSV pretty printer입니다.
  pl: Tidy Viewer (tv) to wieloplatformowy czytelnik CSV, który dzięki formatowaniu kolumn maksymalizuje przyjemność oglądania.
  pt: Tidy Viewer (tv) é um formatador de CSV multiplataforma que usa estilo de colunas para maximizar o prazer de quem visualiza.
  ro: Tidy Viewer (tv) este un frumosator CSV multiplă platformă care folosește stilizarea coloanelor pentru a maximiza plăcerea de vizualizare.
  ru: Tidy Viewer (tv) — кроссплатформенный инструмент красивого вывода CSV, использующий оформление колонок для удобства просмотра.
  th: Tidy Viewer (tv) เป็นเครื่องมือจัดรูปแบบ CSV ข้ามแพลตฟอร์มที่ใช้การจัดรูปแบบคอลัมน์เพื่อเพิ่มความสุขในการดูข้อมูล
  tr: Tidy Viewer (tv), sütun stilleriyle okuma keyfini en üst düzeye çıkaran platformlar arası bir CSV pretty printer'dır.
  uk: Tidy Viewer (tv) — кроссплатформений інструмент гарного виводу CSV, який використовує оформлення колонок для зручного перегляду.
  vi: Tidy Viewer (tv) là công cụ trình bày CSV đẹp đẽ đa nền tảng, sử dụng định kiểu cột để tối đa hóa trải nghiệm xem.
x:
  source: https://github.com/alexhallam/tv
  eget: alexhallam/tv
  brew: tidy-viewer
  yay: tidy-viewer
  paru: tidy-viewer
  cargo: tidy-viewer
rule:
  /eget:
    cmd: x eget alexhallam/tv
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tidy-viewer
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#homebrew
  /snap:
    cmd: sudo snap install --edge tidy-viewer
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#snap
  /paru:
    cmd: sudo paru -S tidy-viewer
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#aur
  arch/yay:
    cmd: yay -S tidy-viewer
    reference: https://aur.archlinux.org/packages/tidy-viewer
  /cargo:
    cmd: 'cargo install tidy-viewer \

      && sudo cp /home/$USER/.cargo/bin/tidy-viewer /usr/local/bin/. \

      && echo "alias tv=''tidy-viewer''" >> ~/.bashrc \

      && source ~/.bashrc

      '
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#cargo
    dsnap: tidy-viewer
  debian/wget:
    cmd: 'wget https://github.com/alexhallam/tv/releases/download/<VERSION>/tidy-viewer_<VERSION>_amd64.deb \

      && sudo dpkg -i tidy-viewer_<VERSION>_amd64.deb \

      && echo "alias tv=''tidy-viewer''" >> ~/.bashrc \

      && source ~/.bashrc

      '
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#debian
binlist:
- tidy-viewer

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
