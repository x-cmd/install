lang: Rust
homepage: https://github.com/alexhallam/tv
license: MIT
desc:
  cn: Tidy Viewer (tv) 是一种跨平台 CSV 漂亮的打印机，它使用列造型来最大化观看者的享受
  en: Tidy Viewer (tv) is a cross-platform csv pretty printer that uses column styling to maximize viewer enjoyment
x:
  source: https://github.com/alexhallam/tv
  eget: https://github.com/alexhallam/tv
rule:
  /eget:
    cmd: x eget alexhallam/tv
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tidy-viewer
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#homebrew
  /snap:
    cmd: sudo snap install --edge tidy-viewer
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#snap
  /paru:
    cmd: sudo paru -S tidy-viewer
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#aur
  arch/yay:
    cmd: yay -S tidy-viewer
    reference: https://aur.archlinux.org/packages/tidy-viewer
  /cargo:
    cmd: 'cargo install tidy-viewer \

      && sudo cp /home/$USER/.cargo/bin/tidy-viewer /usr/local/bin/. \

      && echo "alias tv=''tidy-viewer''" >> ~/.bashrc \

      && source ~/.bashrc

      '
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#cargo
    dsnap: tidy-viewer
  debian/wget:
    cmd: 'wget https://github.com/alexhallam/tv/releases/download/<VERSION>/tidy-viewer_<VERSION>_amd64.deb \

      && sudo dpkg -i tidy-viewer_<VERSION>_amd64.deb \

      && echo "alias tv=''tidy-viewer''" >> ~/.bashrc \

      && source ~/.bashrc

      '
    reference: https://github.com/alexhallam/tv?tab=readme-ov-file#debian
binlist:
- tidy-viewer

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
