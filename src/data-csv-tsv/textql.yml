lang: Go
homepage: https://github.com/dinedal/textql
license: MIT
desc:
  cn: 对 CSV 或 TSV 等结构化文本执行 SQL
  en: Execute SQL against structured text like CSV or TSV
x:
  source: https://github.com/dinedal/textql
rule:
  /brew:
    cmd: brew install textql
    reference: https://github.com/dinedal/textql?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S textql-git
    reference: https://aur.archlinux.org/packages/textql-git
binlist:
- textql

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
