lang: Go
homepage: https://github.com/dinedal/textql
license: MIT
desc:
  cn: 对 CSV 或 TSV 等结构化文本执行 SQL
  en: Execute SQL against structured text like CSV or TSV
x:
  source: https://github.com/dinedal/textql
rule:
  /brew:
    cmd: brew install textql
    reference: https://github.com/dinedal/textql?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S textql-git
    reference: https://aur.archlinux.org/packages/textql-git
binlist:
- textql

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 386 KB
          rating: 1
          desc:
            cn: 约 386 KB（估算）
            en: ~386 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
