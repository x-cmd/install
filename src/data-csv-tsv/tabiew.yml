lang: Rust
homepage: https://github.com/shshemi/tabiew
license: MIT
desc:
  cn: Tabiew 是一个基于终端的轻量级应用程序，用于查看和查询分隔符分隔值格式的文档，例如 CSV 或 TSV 文件
  en: Tabiew is a lightweight, terminal-based application to view and query delimiter separated value formatted documents, such as CSV or TSV files
x:
  pkg:
    exist: true
  source: https://github.com/shshemi/tabiew
  eget: https://github.com/shshemi/tabiew
rule:
  /x:
    cmd: x pkg use tabiew
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget shshemi/tabiew
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: sudo pacman -S tabiew
    reference: https://github.com/shshemi/tabiew?tab=readme-ov-file#arch-linux
  debian/wget:
    cmd: 'wget -d https://github.com/shshemi/tabiew/releases/download/v0.6.0/tabiew_0.6.0-1_amd64.deb && \

      sudo dpkg -i tabiew_0.6.0-1_amd64.deb

      '
    reference: https://github.com/shshemi/tabiew?tab=readme-ov-file#debian-based
