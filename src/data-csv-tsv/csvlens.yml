lang: Rust
homepage: https://github.com/YS-L/csvlens
license: MIT
desc:
  cn: csvlens 是一个命令行 CSV 文件查看器
  en: csvlens is a command line CSV file viewer
  cs: csvlens je prohlížeč souborů CSV pro příkazovou řádku
  de: csvlens ist ein CSV-Dateibetrachter für die Befehlszeile
  es: csvlens es un visor de archivos CSV de línea de comandos
  fr: csvlens est un visualiseur de fichiers CSV en ligne de commande
  id: csvlens adalah penampil berkas CSV untuk baris perintah
  it: csvlens è un visualizzatore di file CSV da riga di comando
  ja: csvlens はコマンドライン用の CSV ファイルビューアーです
  ko: csvlens는 명령줄용 CSV 파일 뷰어
  pl: csvlens to przeglądarka plików CSV dla wiersza poleceń
  pt: csvlens é um visualizador de arquivos CSV de linha de comando
  ro: csvlens este un vizualizator de fișiere CSV pentru linia de comandă
  ru: csvlens — просмотрщик файлов CSV для командной строки
  th: csvlens คือโปรแกรมดูไฟล์ CSV สำหรับบรรทัดคำสั่ง
  tr: csvlens, komut satırı için bir CSV dosya görüntüleyicisidir.
  uk: csvlens — переглядач файлів CSV для командного рядка.
  vi: csvlens là trình xem tệp CSV cho dòng lệnh
x:
  source: https://github.com/YS-L/csvlens
  eget: YS-L/csvlens
  brew: csvlens
  pacman: csvlens
  winget: YS-L.csvlens
  cargo: csvlens
rule:
  /x:
    cmd: x pkg use csvlens
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget YS-L/csvlens
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install csvlens
    reference: https://github.com/YS-L/csvlens?tab=readme-ov-file#homebrew
  arch/pacman:
    cmd: sudo pacman -S csvlens
    reference: https://github.com/YS-L/csvlens?tab=readme-ov-file#arch-linux
  (win|wsl2)/winget:
    cmd: x winget install --id YS-L.csvlens
    reference: https://github.com/YS-L/csvlens?tab=readme-ov-file#windows
  freebsd/pkg:
    cmd: pkg install csvlens
    reference: https://github.com/YS-L/csvlens?tab=readme-ov-file#freebsd
  netbsd/pkgin:
    cmd: pkgin install csvlens
    reference: https://github.com/YS-L/csvlens?tab=readme-ov-file#netbsd
  /cargo:
    cmd: cargo install csvlens
    reference: https://github.com/YS-L/csvlens?tab=readme-ov-file#cargo
    dsnap: csvlens
binlist:
- csvlens

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
