lang: Rust
homepage: https://github.com/excelano/xled
license: MIT

desc:
  cn: 表格数据的 sed 和 awk：清洗、转换 CSV 而不破坏数值。
  en: "sed and awk for tabular data: clean and transform CSV without corrupting values."

x:
  source: https://github.com/excelano/xled
  eget: excelano/xled
  brew: excelano/tap/xled
  winget: Excelano.xled
  cargo: xled
rule:
  /eget:
    cmd: x eget excelano/xled
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install xled --locked
    reference: https://crates.io/crates/xled
    dsnap: xled
  darwin/brew:
    cmd: brew install excelano/tap/xled
    reference: https://github.com/excelano/homebrew-tap
  (win|wsl2)/winget:
    cmd: x winget install Excelano.xled
    reference: https://github.com/excelano/xled#windows
binlist:
- xled

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full