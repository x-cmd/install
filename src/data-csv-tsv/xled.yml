lang: Rust
homepage: https://github.com/excelano/xled
license: MIT

desc:
  cn: 表格数据的 sed 和 awk：清洗、转换 CSV 而不破坏数值。
  en: "sed and awk for tabular data: clean and transform CSV without corrupting values."
  cs: "sed a awk pro tabulková data: čistí a převádí CSV bez poškození hodnot."
  de: "sed und awk für tabellarische Daten: CSV bereinigen und umwandeln, ohne Werte zu beschädigen."
  es: "sed y awk para datos tabulares: limpia y transforma CSV sin corromper los valores."
  fr: "sed et awk pour les données tabulaires : nettoyer et transformer du CSV sans corrompre les valeurs."
  id: "sed dan awk untuk data tabular: bersihkan dan ubah CSV tanpa merusak nilai."
  it: "sed e awk per dati tabellari: pulisce e trasforma i CSV senza corrompere i valori."
  ja: "表形式データのための sed と awk: 値を壊さずに CSV を整形・変換します。"
  ko: "표 형식 데이터를 위한 sed와 awk: 값을 손상시키지 않고 CSV를 정리하고 변환합니다."
  pl: "sed i awk dla danych tabelarycznych: czyszczą i przekształcają CSV bez uszkadzania wartości."
  pt: "sed e awk para dados tabulares: limpa e transforma CSV sem corromper os valores."
  ro: "sed și awk pentru date tabulare: curăță și transformă CSV fără a corupe valorile."
  ru: "sed и awk для табличных данных: очищают и преобразуют CSV, не портя значения."
  th: "sed และ awk สำหรับข้อมูลแบบตาราง: ทำความสะอาดและแปลง CSV โดยไม่ทำให้ค่าเสียหาย"
  tr: "tablo verileri için sed ve awk: değerleri bozmadan CSV'yi temizler ve dönüştürür."
  uk: "sed і awk для табличних даних: очищають і перетворюють CSV, не псуючи значення."
  vi: "sed và awk cho dữ liệu dạng bảng: làm sạch và chuyển đổi CSV mà không làm hỏng giá trị."

x:
  source: https://github.com/excelano/xled
  eget: excelano/xled
  brew: excelano/tap/xled
  winget: Excelano.xled
  cargo: xled
rule:
  /eget:
    cmd: x eget excelano/xled
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install xled --locked
    reference: https://crates.io/crates/xled
    dsnap: xled
  darwin/brew:
    cmd: brew install excelano/tap/xled
    reference: https://github.com/excelano/homebrew-tap
  (win|wsl2)/winget:
    cmd: x winget install Excelano.xled
    reference: https://github.com/excelano/xled#windows
binlist:
- xled

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full