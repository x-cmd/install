lang: Rust
homepage: https://github.com/wfxr/csview
license: Apache-2.0
desc:
  cn: 支持 cjk/emoji 的高性能 csv 查看器
  en: A high performance csv viewer with cjk/emoji support
x:
  pkg:
    exist: true
  source: https://github.com/wfxr/csview
  eget: https://github.com/wfxr/csview
rule:
  /x:
    cmd: x pkg use csview
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget wfxr/csview
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install csview
    reference: https://github.com/wfxr/csview?tab=readme-ov-file#on-macos
  (win|wsl2)/scoop:
    cmd: x scoop install csview
    reference: https://github.com/wfxr/csview?tab=readme-ov-file#on-windows
  /cargo:
    cmd: cargo install --locked csview
    reference: https://github.com/wfxr/csview?tab=readme-ov-file#from-source
    dsnap: csview
  arch/yay:
    cmd: yay -S csview
    reference: https://aur.archlinux.org/packages/csview
binlist:
- csview

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
