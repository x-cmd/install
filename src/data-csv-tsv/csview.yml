lang: Rust
homepage: https://github.com/wfxr/csview
license: Apache-2.0
desc:
  cn: 支持 cjk/emoji 的高性能 csv 查看器
  en: A high performance csv viewer with cjk/emoji support
  cs: Vysoce výkonný prohlížeč CSV s podporou cjk/emoji
  de: Ein hochleistungsfähiger CSV-Betrachter mit cjk/emoji-Unterstützung
  es: Un visor CSV de alto rendimiento con soporte cjk/emoji
  fr: Un visualiseur CSV performant avec prise en charge cjk/emoji
  id: Penampil csv berkinerja tinggi dengan dukungan cjk/emoji
  it: Un visualizzatore CSV ad alte prestazioni con supporto cjk/emoji
  ja: cjk/emoji に対応した高性能 csv ビューアー
  ko: cjk/emoji를 지원하는 고성능 csv 뷰어
  pl: Wydajna przeglądarka CSV z obsługą cjk/emoji
  pt: Um visualizador CSV de alto desempenho com suporte a cjk/emoji
  ro: Un vizualizator CSV de înaltă performanță cu suport cjk/emoji
  ru: Высокопроизводительный просмотрщик CSV с поддержкой cjk/emoji
  th: โปรแกรมดูข้อมูล csv ประสิทธิภาพสูง รองรับ cjk/emoji
  tr: cjk/emoji desteği olan yüksek performanslı csv görüntüleyici
  uk: Високопродуктивний переглядач CSV із підтримкою cjk/emoji
  vi: Trình xem csv hiệu năng cao có hỗ trợ cjk/emoji
x:
  source: https://github.com/wfxr/csview
  eget: wfxr/csview
  brew: csview
  scoop: csview
  yay: csview
rule:
  /x:
    cmd: x pkg use csview
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget wfxr/csview
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install csview
    reference: https://github.com/wfxr/csview?tab=readme-ov-file#on-macos
  (win|wsl2)/scoop:
    cmd: x scoop install csview
    reference: https://github.com/wfxr/csview?tab=readme-ov-file#on-windows
  /cargo:
    cmd: cargo install --locked csview
    reference: https://github.com/wfxr/csview?tab=readme-ov-file#from-source
    dsnap: csview
  arch/yay:
    cmd: yay -S csview
    reference: https://aur.archlinux.org/packages/csview
binlist:
- csview

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 25 KB
          rating: 1
          desc:
            cn: 约 25 KB（估算）
            en: ~25 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
