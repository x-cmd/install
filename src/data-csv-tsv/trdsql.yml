lang: Go
homepage: https://github.com/noborus/trdsql
license: MIT
desc:
  cn: trdsql 是一个 CLI 工具，可以对 CSV、 LTSV、 JSON、 YAML 和 TBLN 文件执行 SQL 查询。
  en: trdsql is a CLI tool that can execute SQL queries on CSV, LTSV, JSON, YAML and TBLN files.
x:
  pkg:
    exist: true
  source: https://github.com/noborus/trdsql
  eget: https://github.com/noborus/trdsql
rule:
  /x:
    cmd: x pkg use trdsql
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget noborus/trdsql
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use trdsql
    reference: https://github.com/johnlayton/asdf-trdsql
  darwin/brew:
    cmd: brew install noborus/tap/trdsql
    reference: https://github.com/noborus/trdsql#install
  darwin/port:
    cmd: sudo port selfupdate && $ sudo port install trdsql
    reference: https://github.com/noborus/trdsql#install
  freebsd/pkg:
    cmd: pkg install trdsql
    reference: https://github.com/noborus/trdsql#install
  arch/yay:
    cmd: yay -S trdsql
    reference: https://aur.archlinux.org/packages/trdsql
binlist:
- trdsql

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
