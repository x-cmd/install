lang: Go
homepage: https://github.com/noborus/trdsql
license: MIT
desc:
  cn: trdsql 是一个 CLI 工具，可以对 CSV、 LTSV、 JSON、 YAML 和 TBLN 文件执行 SQL 查询。
  en: trdsql is a CLI tool that can execute SQL queries on CSV, LTSV, JSON, YAML and TBLN files.
  cs: trdsql je nástroj příkazové řádky, který dokáže spouštět SQL dotazy nad soubory CSV, LTSV, JSON, YAML a TBLN.
  de: trdsql ist ein Kommandozeilenwerkzeug, das SQL-Abfragen auf CSV-, LTSV-, JSON-, YAML- und TBLN-Dateien ausführen kann.
  es: trdsql es una herramienta de línea de comandos que puede ejecutar consultas SQL sobre archivos CSV, LTSV, JSON, YAML y TBLN.
  fr: trdsql est un outil en ligne de commande capable d'exécuter des requêtes SQL sur des fichiers CSV, LTSV, JSON, YAML et TBLN.
  id: trdsql adalah alat baris perintah yang dapat menjalankan kueri SQL pada file CSV, LTSV, JSON, YAML, dan TBLN.
  it: trdsql è uno strumento da riga di comando che può eseguire query SQL su file CSV, LTSV, JSON, YAML e TBLN.
  ja: trdsql は CSV、LTSV、JSON、YAML、TBLN ファイルに対して SQL クエリを実行できる CLI ツールです。
  ko: trdsql는 CSV, LTSV, JSON, YAML 및 TBLN 파일에 대해 SQL 쿼리를 실행할 수 있는 CLI 도구입니다.
  pl: trdsql to narzędzie wiersza poleceń, które potrafi wykonywać zapytania SQL na plikach CSV, LTSV, JSON, YAML i TBLN.
  pt: trdsql é uma ferramenta de linha de comando que pode executar consultas SQL em arquivos CSV, LTSV, JSON, YAML e TBLN.
  ro: trdsql este un instrument de linie de comandă care poate rula interogări SQL pe fișiere CSV, LTSV, JSON, YAML și TBLN.
  ru: trdsql — инструмент командной строки, который может выполнять SQL-запросы к файлам CSV, LTSV, JSON, YAML и TBLN.
  th: trdsql เป็นเครื่องมือ CLI ที่สามารถรันคำสั่ง SQL บนไฟล์ CSV, LTSV, JSON, YAML และ TBLN
  tr: trdsql, CSV, LTSV, JSON, YAML ve TBLN dosyalarında SQL sorguları çalıştırabilen bir CLI aracıdır.
  uk: trdsql — інструмент командного рядка, який може виконувати SQL-запити до файлів CSV, LTSV, JSON, YAML і TBLN.
  vi: trdsql là công cụ CLI có thể thực thi truy vấn SQL trên các tệp CSV, LTSV, JSON, YAML và TBLN.
x:
  source: https://github.com/noborus/trdsql
  eget: noborus/trdsql
  brew: noborus/tap/trdsql
  port: trdsql
  yay: trdsql
  asdf: trdsql
rule:
  /x:
    cmd: x pkg use trdsql
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget noborus/trdsql
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use trdsql
    reference: https://github.com/johnlayton/asdf-trdsql
  darwin/brew:
    cmd: brew install noborus/tap/trdsql
    reference: https://github.com/noborus/trdsql#install
  darwin/port:
    cmd: sudo port selfupdate && $ sudo port install trdsql
    reference: https://github.com/noborus/trdsql#install
  freebsd/pkg:
    cmd: pkg install trdsql
    reference: https://github.com/noborus/trdsql#install
  arch/yay:
    cmd: yay -S trdsql
    reference: https://aur.archlinux.org/packages/trdsql
binlist:
- trdsql

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
