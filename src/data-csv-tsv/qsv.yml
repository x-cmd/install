lang: Rust
homepage: https://github.com/dathere/qsv
license: MIT
desc:
  cn: 极速数据处理工具包
  en: Blazing-fast, Neuro-symbolic Data-Wrangling toolkit
x:
  source: https://github.com/dathere/qsv
  eget: dathere/qsv
  brew: qsv
  scoop: qsv
rule:
  /eget:
    cmd: x eget dathere/qsv
    reference: https://github.com/dathere/qsv
  darwin/brew:
    cmd: brew install qsv
    reference: https://github.com/dathere/qsv#option-2-package-managers--distributions
  /mise:
    cmd: mise use -g qsv@latest
    reference: https://github.com/dathere/qsv#option-2-package-managers--distributions
  /conda:
    cmd: conda install conda-forge::qsv
    reference: https://anaconda.org/conda-forge/qsv
  arch/pacman:
    cmd: pacman -S qsv
    reference: https://github.com/dathere/qsv#option-2-package-managers--distributions
  darwin/port:
    cmd: sudo port install qsv
    reference: https://ports.macports.org/port/qsv/
  (win|wsl2)/scoop:
    cmd: x scoop install qsv
    reference: https://scoop.sh/#/apps?q=qsv

binlist:
  - qsv

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取 CSV/TSV 数据文件与配置文件
          en: Reads CSV/TSV data files and config files
        sensitive: []
      write:
        desc:
          cn: 写出处理结果到 CSV/TSV 文件
          en: Writes processed results to CSV/TSV files
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 195 MB
          rating: 3
          desc:
            cn: 约 195 MB
            en: ~195 MB
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 约 20 MB
          en: ~20 MB
      peak:
        estimate: 300 MB
        desc:
          cn: 处理大文件时可达数百 MB
          en: Hundreds of MB when processing large files
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
