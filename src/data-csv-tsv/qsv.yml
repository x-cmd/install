lang: Rust
homepage: https://github.com/dathere/qsv
license: MIT
desc:
  cn: 极速数据处理工具包
  en: Blazing-fast, Neuro-symbolic Data-Wrangling toolkit
  cs: Bleskrychle rychlá sada nástrojů pro zpracování dat
  de: Blitzschnelles Data-Wrangling-Toolkit
  es: Kit de herramientas de manipulator de datos ultrarrápido
  fr: Boîte à outils de manipulation de données ultra-rapide
  id: Toolkit pemrosesan data yang sangat cepat
  it: Toolkit per la manipolazione dei dati ultra-veloce
  ja: 超高速データラングリングツールキット
  ko: 번개같이 빠른 데이터 처리 도구 모음
  pl: Błyskawicznie szybki zestaw narzędzi do obróbki danych
  pt: Kit de ferramentas de manipulação de dados extremamente rápido
  ro: Truset de instrumente pentru procesarea datelor extrem de rapidă
  ru: Сверхбыстрый набор инструментов для обработки данных
  th: ชุดเครื่องมือจัดการข้อมูลที่รวดเร็วดั่งไฟ
  tr: Blazing-fast veri işleme araç seti
  uk: Надшвидкий набір інструментів для обробки даних
  vi: Bộ công cụ xử lý dữ liệu siêu nhanh
x:
  source: https://github.com/dathere/qsv
  eget: dathere/qsv
  brew: qsv
  scoop: qsv
rule:
  /eget:
    cmd: x eget dathere/qsv
    reference: https://github.com/dathere/qsv
  darwin/brew:
    cmd: brew install qsv
    reference: https://github.com/dathere/qsv#option-2-package-managers--distributions
  /mise:
    cmd: mise use -g qsv@latest
    reference: https://github.com/dathere/qsv#option-2-package-managers--distributions
  /conda:
    cmd: conda install conda-forge::qsv
    reference: https://anaconda.org/conda-forge/qsv
  arch/pacman:
    cmd: pacman -S qsv
    reference: https://github.com/dathere/qsv#option-2-package-managers--distributions
  darwin/port:
    cmd: sudo port install qsv
    reference: https://ports.macports.org/port/qsv/
  (win|wsl2)/scoop:
    cmd: x scoop install qsv
    reference: https://scoop.sh/#/apps?q=qsv

binlist:
  - qsv

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取 CSV/TSV 数据文件与配置文件
          en: Reads CSV/TSV data files and config files
        sensitive: []
      write:
        desc:
          cn: 写出处理结果到 CSV/TSV 文件
          en: Writes processed results to CSV/TSV files
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 195 MB
          rating: 3
          desc:
            cn: 约 195 MB
            en: ~195 MB
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 约 20 MB
          en: ~20 MB
      peak:
        estimate: 300 MB
        desc:
          cn: 处理大文件时可达数百 MB
          en: Hundreds of MB when processing large files
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
