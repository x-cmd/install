lang: 'Rust'
homepage: https://github.com/jqnatividad/qsv
license: 'Unlicense'
desc:
  cn: 极速数据处理工具包
  en: 'Blazing-fast Data-Wrangling toolkit'
x:
  source: https://github.com/jqnatividad/qsv
  eget: https://github.com/jqnatividad/qsv
rule:
  /eget:
    cmd: x eget jqnatividad/qsv
    reference: https://github.com/jqnatividad/qsv
binlist:
  - 'qsv'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
