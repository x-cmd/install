lang: 'Rust'
homepage: https://github.com/jqnatividad/qsv
license: 'Unlicense'
desc:
  cn: 极速数据处理工具包
  en: 'Blazing-fast Data-Wrangling toolkit'
x:
  source: https://github.com/jqnatividad/qsv
  eget: https://github.com/jqnatividad/qsv
rule:
  /eget:
    cmd: x eget jqnatividad/qsv
    reference: https://github.com/jqnatividad/qsv
binlist:
  - 'qsv'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
