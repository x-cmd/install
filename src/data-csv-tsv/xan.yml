lang: Rust
homepage: https://github.com/medialab/xan
license: Unlicense
desc:
  cn: 用于直接从 shell 处理 CSV 文件的命令行工具
  en: a command line tool that can be used to process CSV files directly from the shell.
x:
  source: https://github.com/medialab/xan
  eget: https://github.com/medialab/xan
rule:
  /eget:
    cmd: x eget medialab/xan
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install xan --locked
    reference: https://github.com/medialab/xan?tab=readme-ov-file#how-to-install
    dsnap: xan
  darwin/brew:
    cmd: brew install xan
    reference: https://github.com/medialab/xan?tab=readme-ov-file#how-to-install
  (win|wsl2)/scoop:
    cmd: |
      scoop bucket add extras
      scoop install xan
    reference: https://github.com/medialab/xan?tab=readme-ov-file#how-to-install
  arch/pacman:
    cmd: sudo pacman -S xan
    reference: https://github.com/medialab/xan?tab=readme-ov-file#how-to-install
  nix/nix-shell:
    cmd: nix-shell -p xan
    reference: https://github.com/medialab/xan?tab=readme-ov-file#how-to-install
binlist:
  - xan

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
