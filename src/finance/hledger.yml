lang: Haskell
homepage: https://github.com/simonmichael/hledger
license: GPL-3.0
desc:
  cn: 纯文本记账工具，提供 CLI、TUI 和 Web 界面
  en: A plain text accounting tool that provides CLI, TUI, and web interfaces.
x:
  source: https://github.com/simonmichael/hledger
  eget: simonmichael/hledger
  apt: hledger
  dnf: hledger
  brew: hledger
  apk: hledger
  emerge: hledger
  xbps: hledger
  scoop: hledger
  choco: hledger
  winget: simonmichael.hledger
  yay: hledger-bin
  pacman: hledger
rule:
  /eget:
    cmd: x eget simonmichael/hledger
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use hledger
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install hledger
    reference: https://hledger.org/install.html#homebrew-linux-mac-wsl
  linux/brew:
    cmd: brew install hledger
    reference: https://hledger.org/install.html#homebrew-linux-mac-wsl
  (win|wsl2)/scoop:
    cmd: x scoop install hledger
    reference: https://hledger.org/install.html#windows
  (win|wsl2)/choco:
    cmd: x choco install hledger -y
    reference: https://hledger.org/install.html#windows
  (win|wsl2)/winget:
    cmd: x winget install simonmichael.hledger
    reference: https://hledger.org/install.html#windows
  alpine/apk:
    cmd: doas apk add hledger hledger-ui hledger-web
    reference: https://hledger.org/install.html#linux
    dsnap: hledger
  arch/pacman:
    cmd: sudo pacman -Sy hledger hledger-ui hledger-web
    reference: https://hledger.org/install.html#linux
  debian/apt:
    cmd: sudo apt install hledger hledger-ui hledger-web
    reference: https://hledger.org/install.html#linux
    dsnap: hledger
  fedora/dnf:
    cmd: sudo dnf install hledger
    reference: https://hledger.org/install.html#linux
    dsnap: hledger
  gentoo/emerge:
    cmd: sudo layman -a haskell && sudo emerge hledger hledger-ui hledger-web
    reference: https://hledger.org/install.html#linux
  ubuntu/apt:
    cmd: sudo apt install hledger hledger-ui hledger-web
    reference: https://hledger.org/install.html#linux
    dsnap: hledger
  void/xbps:
    cmd: xbps-install -S hledger hledger-ui hledger-web
    reference: https://hledger.org/install.html#linux
  freebad/pkg:
    cmd: pkg install hs-hledger hs-hledger-ui hs-hledger-web
    reference: https://hledger.org/install.html#bsd
  openbad/pkg_add:
    cmd: pkg_add hledger
    reference: https://hledger.org/install.html#bsd
  linux/nix-shell:
    cmd: nix-shell -p hledger hledger-ui hledger-web
    reference: https://hledger.org/install.html#nix-linux-mac
  darwin/nix-shell:
    cmd: nix-shell -p hledger hledger-ui hledger-web
    reference: https://hledger.org/install.html#nix-linux-mac
  arch/yay:
    cmd: yay -S hledger-bin
    reference: https://aur.archlinux.org/packages/hledger-bin
binlist:
- hledger

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 46 MB
          rating: 2
          desc:
            cn: 安装 46 MB
            en: 46 MB install
        download:
          estimate: 46 MB
          desc:
            cn: 约 46 MB 下载 (linux/x64)
            en: ~46 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
