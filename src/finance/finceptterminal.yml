lang: C++
homepage: https://github.com/Fincept-Corporation/FinceptTerminal
license: noassertion
desc:
  cn: 开源桌面终端分析金融市场,提供 CFA 级分析、100+ 数据连接器和 AI 研究助手
  en: Analyze financial markets with an open-source desktop terminal featuring CFA-level analytics, 100+ data connectors, and AI-powered research agents.
x:
  source: https://github.com/Fincept-Corporation/FinceptTerminal
  eget: https://github.com/Fincept-Corporation/FinceptTerminal
rule:
  /eget:
    cmd: x eget Fincept-Corporation/FinceptTerminal
    reference: https://github.com/Fincept-Corporation/FinceptTerminal
binlist:
- finceptterminal

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 169 MB
          rating: 3
          desc:
            cn: 安装 169 MB
            en: 169 MB install
        download:
          estimate: 169 MB
          desc:
            cn: 约 169 MB 下载 (linux/x64)
            en: ~169 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
