lang: C++
homepage: https://github.com/Fincept-Corporation/FinceptTerminal
license: noassertion
desc:
  cn: 开源桌面终端分析金融市场,提供 CFA 级分析、100+ 数据连接器和 AI 研究助手
  en: Analyze financial markets with an open-source desktop terminal featuring CFA-level analytics, 100+ data connectors, and AI-powered research agents.
x:
  source: https://github.com/Fincept-Corporation/FinceptTerminal
  eget: https://github.com/Fincept-Corporation/FinceptTerminal
rule:
  /eget:
    cmd: x eget Fincept-Corporation/FinceptTerminal
    reference: https://github.com/Fincept-Corporation/FinceptTerminal
binlist:
- finceptterminal

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
