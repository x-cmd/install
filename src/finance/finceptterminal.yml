lang: C++
homepage: https://github.com/Fincept-Corporation/FinceptTerminal
license: noassertion
desc:
  cn: 开源桌面终端分析金融市场,提供 CFA 级分析、100+ 数据连接器和 AI 研究助手
  en: Analyze financial markets with an open-source desktop terminal featuring CFA-level analytics, 100+ data connectors, and AI-powered research agents.
  cs: Analyzujte finanční trhy pomocí open-source desktopového terminálu s analýzami na úrovni CFA, 100+ datovými konektory a výzkumnými agenty s podporou AI.
  de: Analysieren Sie Finanzmärkte mit einem quelloffenen Desktop-Terminal mit CFA-Niveau-Analysen, über 100 Datenkonnektoren und KI-gestützten Research-Agenten.
  es: Analiza los mercados financieros con una terminal de escritorio de código abierto con análisis de nivel CFA, más de 100 conectores de datos y agentes de investigación con IA.
  fr: Analysez les marchés financiers avec un terminal de bureau open source offrant des analyses de niveau CFA, plus de 100 connecteurs de données et des agents de recherche propulsés par l'IA.
  id: Analisis pasar keuangan dengan terminal desktop sumber terbuka yang menghadirkan analitik tingkat CFA, 100+ konektor data, dan agen riset bertenaga AI.
  it: Analizza i mercati finanziari con un terminal desktop open source dotato di analisi di livello CFA, oltre 100 connettori di dati e agenti di ricerca basati sull'AI.
  ja: CFAレベルの分析、100以上のデータコネクタ、AIを活用したリサーチエージェントを備えたオープンソースのデスクトップターミナルで金融市場を分析します。
  ko: CFA 수준 분석, 100개 이상의 데이터 커넥터, AI 기반 리서치 에이전트를 갖춘 오픈소스 데스크톱 터미널로 금융 시장을 분석하세요.
  pl: Analizuj rynki finansowe za pomocą open source'owego terminala desktopowego z analityką na poziomie CFA, ponad 100 konektorami danych i agentami badawczymi wspieranymi przez AI.
  pt: Analise os mercados financeiros com um terminal desktop de código aberto com análises de nível CFA, mais de 100 conectores de dados e agentes de pesquisa com IA.
  ro: Analizați piețele financiare cu un terminal desktop open source cu analize de nivel CFA, peste 100 de conectori de date și agenți de cercetare bazați pe AI.
  ru: Анализируйте финансовые рынки с помощью открытого настольного терминала с аналитикой уровня CFA, более чем 100 коннекторами данных и исследовательскими агентами на базе ИИ.
  th: วิเคราะห์ตลาดการเงินด้วยเทอร์มินัลเดสก์ท็อปโอเพนซอร์สที่มีการวิเคราะห์ระดับ CFA ตัวเชื่อมต่อข้อมูลกว่า 100 ตัว และเอเจนต์วิจัยที่ขับเคลื่อนด้วย AI
  tr: CFA düzeyinde analitikler, 100'den fazla veri bağlantısı ve yapay zeka destekli araştırma ajanlarıyla açık kaynak masaüstü terminaliyle finansal piyasaları analiz edin.
  uk: Аналізуйте фінансові ринки за допомогою відкритого настольного термінала з аналітикою рівня CFA, понад 100 конекторів даних і дослідницькими агентами на базі ШІ.
  vi: Phân tích các thị trường tài chính với terminal desktop mã nguồn mở có phân tích cấp CFA, hơn 100 trình kết nối dữ liệu và các tác nhân nghiên cứu tích hợp AI.
x:
  source: https://github.com/Fincept-Corporation/FinceptTerminal
  eget: Fincept-Corporation/FinceptTerminal
rule:
  /eget:
    cmd: x eget Fincept-Corporation/FinceptTerminal
    reference: https://github.com/Fincept-Corporation/FinceptTerminal
binlist:
- finceptterminal

