lang: Rust
homepage: https://crates.io/crates/portfolio_rs
desc:
  cn: 用 Rust 编写的用于管理金融投资组合的命令行工具
  en: A command line tool for managing financial investment portfolios written in Rust
rule:
  arch/yay:
    cmd: yay -S portfolio
    reference: https://aur.archlinux.org/packages/portfolio
  /cargo:
    cmd: cargo add portfolio_rs
    reference: https://crates.io/crates/portfolio_rs
    dsnap: portfolio_rs
binlist:
- portfolio_rs
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
