lang: C#
homepage: https://github.com/QuantConnect/Lean
license: apache-2.0
desc:
  cn: "使用开源引擎本地开发、回测并部署算法交易策略,支持 C# 和 Python"
  en: Develop, backtest, and deploy algorithmic trading strategies locally using an open-source engine that supports C# and Python.
x:
  source: https://github.com/QuantConnect/Lean
  eget: https://github.com/QuantConnect/Lean
rule:
  /eget:
    cmd: x eget QuantConnect/Lean
    reference: https://github.com/QuantConnect/Lean
binlist:
- lean

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
