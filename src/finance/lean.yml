lang: C#
homepage: https://github.com/QuantConnect/Lean
license: apache-2.0
desc:
  cn: "使用开源引擎本地开发、回测并部署算法交易策略,支持 C# 和 Python"
  en: Develop, backtest, and deploy algorithmic trading strategies locally using an open-source engine that supports C# and Python.
x:
  source: https://github.com/QuantConnect/Lean
  eget: https://github.com/QuantConnect/Lean
rule:
  /eget:
    cmd: x eget QuantConnect/Lean
    reference: https://github.com/QuantConnect/Lean
binlist:
- lean

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 33 MB
          rating: 2
          desc:
            cn: 约 33 MB（估算）
            en: ~33 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
