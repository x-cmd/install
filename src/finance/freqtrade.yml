lang: Python
homepage: https://github.com/freqtrade/freqtrade
license: gpl-3.0
desc:
  cn: 用 Python 编写的开源加密货币交易机器人，支持回测、策略优化、机器学习与自动交易，可通过 WebUI 或 Telegram 控制
  en: Develop, backtest, and deploy automated cryptocurrency trading bots using Python and machine learning.
x:
  source: https://github.com/freqtrade/freqtrade
rule:
  /pip:
    cmd: pip install freqtrade
    reference: https://www.freqtrade.io/en/stable/installation/
    dsnap: freqtrade
binlist:
- freqtrade

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
