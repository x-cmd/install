lang: 'Rust'
homepage: 'https://github.com/tarkah/tickrs'
license: 'MIT'
desc:
  cn: 终端中的实时行情数据
  en: 'Realtime ticker data in your terminal 📈'
x:
  source: https://github.com/tarkah/tickrs
  eget: https://github.com/tarkah/tickrs
rule:
  /eget:
    cmd: x eget tarkah/tickrs
    reference: https://github.com/tarkah/tickrs
binlist:
  - 'tickrs'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 218 KB
          rating: 1
          desc:
            cn: 约 218 KB（估算）
            en: ~218 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
