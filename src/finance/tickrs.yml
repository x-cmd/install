lang: 'Rust'
homepage: 'https://github.com/tarkah/tickrs'
license: 'MIT'
desc:
  cn: 终端中的实时行情数据
  en: 'Realtime ticker data in your terminal 📈'
  cs: Data kurzů v reálném čase ve vašem terminálu 📈
  de: Kursdaten in Echtzeit in Ihrem Terminal 📈
  es: Datos de cotización en tiempo real en tu terminal 📈
  fr: Données de cotisation en temps réel dans votre terminal 📈
  id: Data harga real-time di terminal Anda 📈
  it: Dati di quotazione in tempo reale nel tuo terminale 📈
  ja: ターミナル内でリアルタイムの相場データを取得 📈
  ko: 터미널에서 실시간 시세 데이터 📈
  pl: Dane giełdowe w czasie rzeczywistym w twoim terminalu 📈
  pt: Dados de cotação em tempo real no seu terminal 📈
  ro: Date de cotație în timp real în terminalul dumneavoastră 📈
  ru: Котировки в реальном времени прямо в вашем терминале 📈
  th: ข้อมูลราคาหุ้นแบบเรียลไทม์ในเทอร์มินัลของคุณ 📈
  tr: Terminalinizde gerçek zamanlı fiyat verileri 📈
  uk: Котирування в реальному часі просто у вашому терміналі 📈
  vi: Dữ liệu giá theo thời gian thực trong terminal của bạn 📈
x:
  source: https://github.com/tarkah/tickrs
  eget: tarkah/tickrs
rule:
  /eget:
    cmd: x eget tarkah/tickrs
    reference: https://github.com/tarkah/tickrs
binlist:
- 'tickrs'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
