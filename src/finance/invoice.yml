lang: Go
homepage: https://github.com/maaslalani/invoice
license: MIT
desc:
  cn: 命令行发票生成器
  en: Generate invoices from the command line
x:
  pkg:
    exist: true
  source: https://github.com/maaslalani/invoice
  eget: https://github.com/maaslalani/invoice
  brew: invoice
rule:
  /x:
    cmd: x pkg use invoice
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget maaslalani/invoice
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install invoice
    reference: https://formulae.brew.sh/formula/invoice#default
  arch/yay:
    cmd: yay -S invoice
    reference: https://aur.archlinux.org/packages/invoice
  /go:
    cmd: go install github.com/maaslalani/invoice@main
    reference: https://github.com/maaslalani/invoice?tab=readme-ov-file#installation
    dsnap: github.com/maaslalani/invoice
binlist:
- invoice

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
