lang: Python
homepage: https://github.com/EnhancedJax/Bagels
license: GPL-3.0
desc:
  cn: 一个强大的终端费用跟踪器，可在您的终端中使用。
  en: A powerful expense tracker that lives in your terminal.
  cs: Výkonný sledovač výdajů, který běží přímo ve vašem terminálu.
  de: Ein leistungsstarker Ausgaben-Tracker, der direkt in Ihrem Terminal läuft.
  es: Un potente gestor de gastos que vive en tu terminal.
  fr: Un suivi de dépenses puissant qui s'exécute directement dans votre terminal.
  id: Pelacak pengeluaran yang kuat dan berjalan langsung di terminal Anda.
  it: Un potente tracker di spese che vive nel tuo terminale.
  ja: ターミナル内で動作する高性能な支出トラッカーです。
  ko: 터미널에서 동작하는 강력한 지출 추적 도구입니다.
  pl: Potężne narzędzie do śledzenia wydatków działające wprost w terminalu.
  pt: Um poderoso rastreador de despesas que roda direto no seu terminal.
  ro: Un urmăritor puternic de cheltuieli care rulează chiar în terminalul tău.
  ru: Мощный трекер расходов, работающий прямо в вашем терминале.
  th: ตัวติดตามค่าใช้จ่ายที่ทรงพลัง ทำงานอยู่ในเทอร์มินัลของคุณ
  tr: Terminalinizde çalışan güçlü bir gider takip aracı.
  uk: Потужний трекер витрат, який працює прямо у вашому терміналі.
  vi: Trình theo dõi chi phí mạnh mẽ chạy ngay trong terminal của bạn.
x:
  source: https://github.com/EnhancedJax/Bagels
  brew: bagels
  yay: bagels
rule:
  /uv:
    cmd: uv tool install --python 3.13 bagels
    reference: https://github.com/EnhancedJax/Bagels#unix--macos
    dsnap: bagels
  darwin/brew:
    cmd: brew install bagels
    reference: https://github.com/EnhancedJax/Bagels?tab=readme-ov-file#-installation
  /pipx:
    cmd: pipx install bagels
    reference: https://github.com/EnhancedJax/Bagels#windows
  /conda:
    cmd: conda install -c conda-forge bagels
    reference: https://github.com/EnhancedJax/Bagels#windows
  arch/yay:
    cmd: yay -S bagels
    reference: https://aur.archlinux.org/packages/bagels
binlist:
- bagels

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 KB
          rating: 1
          desc:
            cn: 约 25 KB（估算）
            en: ~25 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
