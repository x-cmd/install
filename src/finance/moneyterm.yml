lang: Python
homepage: https://github.com/ChrisBuilds/moneyterm
license: MIT
desc:
  cn: 一个用于在终端中管理支出和跟踪预算的 TUI 工具。
  en: A comprehensive TUI tool for managing expenses and tracking budgets in the terminal.
x:
  source: https://github.com/ChrisBuilds/moneyterm
rule:
  /pip:
    cmd: pip install moneyterm
    reference: https://github.com/ChrisBuilds/moneyterm#installation
    dsnap: moneyterm
  /pipx:
    cmd: pipx install moneyterm
    reference: https://github.com/ChrisBuilds/moneyterm#installation
binlist:
- moneyterm

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
