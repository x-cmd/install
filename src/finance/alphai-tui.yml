lang: Rust
homepage: https://alphai.io/tui
license: MIT

desc:
  cn: 开源的 Bloomberg 风格终端股票看板：实时行情与 K 线图，旁边是 AI 评分的新闻、SEC Form 4 内部人交易和财报解读。基于 ratatui 的单个 Rust 二进制。
  en: "Open-source, Bloomberg-style stock dashboard for the terminal: live quotes and candlestick charts next to AI-scored news, SEC Form 4 insider filings and earnings reads. One Rust binary built on ratatui."

x:
  source: https://github.com/makeev/alphai-tui
  eget: makeev/alphai-tui
rule:
  /eget:
    cmd: x eget makeev/alphai-tui
    reference: https://github.com/makeev/alphai-tui/releases/latest
  /curl:
    cmd: curl -LsSf https://github.com/makeev/alphai-tui/releases/latest/download/alphai-tui-installer.sh | sh
    reference: https://github.com/makeev/alphai-tui#install
  /brew:
    cmd: brew install makeev/tap/alphai-tui
    reference: https://github.com/makeev/homebrew-tap
  /cargo:
    cmd: cargo install alphai-tui
    reference: https://crates.io/crates/alphai-tui
  /aur:
    cmd: paru -S alphai-tui-bin
    reference: https://aur.archlinux.org/packages/alphai-tui-bin
  ubuntu/apt:
    cmd: |
      sudo install -d -m 0755 /etc/apt/keyrings && \
      sudo curl -fsSL https://makeev.github.io/alphai-tui-apt/alphai-tui.gpg -o /etc/apt/keyrings/alphai-tui.gpg && \
      echo "deb [signed-by=/etc/apt/keyrings/alphai-tui.gpg] https://makeev.github.io/alphai-tui-apt stable main" | sudo tee /etc/apt/sources.list.d/alphai-tui.list && \
      sudo apt update && sudo apt install alphai-tui
    reference: https://makeev.github.io/alphai-tui-apt/
  debian/apt:
    cmd: |
      sudo install -d -m 0755 /etc/apt/keyrings && \
      sudo curl -fsSL https://makeev.github.io/alphai-tui-apt/alphai-tui.gpg -o /etc/apt/keyrings/alphai-tui.gpg && \
      echo "deb [signed-by=/etc/apt/keyrings/alphai-tui.gpg] https://makeev.github.io/alphai-tui-apt stable main" | sudo tee /etc/apt/sources.list.d/alphai-tui.list && \
      sudo apt update && sudo apt install alphai-tui
    reference: https://makeev.github.io/alphai-tui-apt/

binlist:
  - alphai-tui

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取 ~/.config/alphai-tui/config.toml
          en: Reads ~/.config/alphai-tui/config.toml
        sensitive: []
      write:
        desc:
          cn: 写入配置文件（含 API 密钥，权限 0600）和行情缓存 ~/.cache/alphai-tui/quotes.json
          en: Writes the config file (holds API keys, mode 0600) and a quote cache at ~/.cache/alphai-tui/quotes.json
        sensitive:
          - ~/.config/alphai-tui/config.toml
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 1
          desc:
            cn: 约 12 MB（单个二进制，v0.22.0 x86_64 实测）
            en: ~12 MB (single binary, measured on v0.22.0 x86_64)
      paths:
        data:
          - ~/.cache/alphai-tui
        config:
          - ~/.config/alphai-tui
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 约 15 MB RSS（三只股票的观察列表，v0.22.0 实测）
          en: ~15 MB RSS with a three-ticker watchlist (measured on v0.22.0)
    cpu:
      workload: ['network', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 低（终端渲染与 JSON 解析）
          en: Low (terminal rendering and JSON parsing)
