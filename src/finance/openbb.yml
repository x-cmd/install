lang: Python
homepage: https://github.com/OpenBB-finance/OpenBB
license: noassertion
desc:
  cn: 通过统一 API 将公开、私有和授权来源的金融数据接入 Python、Excel 或自定义应用
  en: Integrate financial data from public, private, and licensed sources into Python, Excel, or custom applications via a unified API.
x:
  source: https://github.com/OpenBB-finance/OpenBB
rule:
  /pip:
    cmd: pip install openbb
    reference: https://github.com/OpenBB-finance/OpenBB
    dsnap: openbb
binlist:
- openbb

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
