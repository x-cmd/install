lang: Python
homepage: https://github.com/OpenBB-finance/OpenBB
license: noassertion
desc:
  cn: 通过统一 API 将公开、私有和授权来源的金融数据接入 Python、Excel 或自定义应用
  en: Integrate financial data from public, private, and licensed sources into Python, Excel, or custom applications via a unified API.
x:
  source: https://github.com/OpenBB-finance/OpenBB
  pip: openbb
rule:
  /pip:
    cmd: pip install openbb
    reference: https://github.com/OpenBB-finance/OpenBB
    dsnap: openbb
binlist:
- openbb

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 433 KB
          rating: 1
          desc:
            cn: 约 433 KB（估算）
            en: ~433 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
