lang: 'Go'
homepage: 'https://github.com/achannarasappa/ticker'
license: 'GPL-3.0'
desc:
  cn: 在终端实时追踪股票、加密货币和衍生品价格与持仓
  en: 'Track stocks, crypto, and derivatives prices and positions in real time from your terminal'
x:
  source: https://github.com/achannarasappa/ticker
  eget: https://github.com/achannarasappa/ticker
rule:
  /eget:
    cmd: x eget achannarasappa/ticker
    reference: https://github.com/achannarasappa/ticker
binlist:
  - 'ticker'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
