lang: 'Go'
homepage: 'https://github.com/achannarasappa/ticker'
license: 'GPL-3.0'
desc:
  cn: 在终端实时追踪股票、加密货币和衍生品价格与持仓
  en: 'Track stocks, crypto, and derivatives prices and positions in real time from your terminal'
x:
  source: https://github.com/achannarasappa/ticker
  eget: achannarasappa/ticker
rule:
  /eget:
    cmd: x eget achannarasappa/ticker
    reference: https://github.com/achannarasappa/ticker
binlist:
- 'ticker'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
