lang: 'Haskell'
homepage: https://github.com/simonmichael/hledger
license: 'GPL-3.0'
desc:
  cn: 稳健快速的纯文本记账工具,支持 CLI、TUI 和 Web 界面
  en: 'Robust, fast, intuitive plain text accounting tool with CLI, TUI and web interfaces.'
x:
  source: https://github.com/simonmichael/hledger
  eget: https://github.com/simonmichael/hledger
rule:
  /eget:
    cmd: x eget simonmichael/hledger
    reference: https://github.com/simonmichael/hledger
binlist:
  - 'hledger-ui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
