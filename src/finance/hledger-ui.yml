lang: 'Haskell'
homepage: https://github.com/simonmichael/hledger
license: 'GPL-3.0'
desc:
  cn: 稳健快速的纯文本记账工具,支持 CLI、TUI 和 Web 界面
  en: 'Robust, fast, intuitive plain text accounting tool with CLI, TUI and web interfaces.'
x:
  source: https://github.com/simonmichael/hledger
  eget: simonmichael/hledger
rule:
  /eget:
    cmd: x eget simonmichael/hledger
    reference: https://github.com/simonmichael/hledger
binlist:
  - 'hledger-ui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
