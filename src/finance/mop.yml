lang: Go
homepage: https://github.com/mop-tracker/mop
license: MIT
desc:
  cn: 一个命令行工具，用于在终端中显示市场和个股信息。
  en: A command line tool that shows information on markets and individual stocks in the terminal.
x:
  source: https://github.com/mop-tracker/mop
rule:
  /go:
    cmd: 'git clone https://github.com/mop-tracker/mop && \

      cd mop && \

      go build ./cmd/mop && \

      ./mop

      '
    reference: https://github.com/mop-tracker/mop?tab=readme-ov-file#installing-mop-from-source
    dsnap: mop
binlist:
- mop

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 209 KB
          rating: 1
          desc:
            cn: 约 209 KB（估算）
            en: ~209 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
