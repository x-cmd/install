lang: 'Go'
homepage: 'https://github.com/hzqtc/cashd'
license: 'MIT'
desc:
  cn: 快速温馨的个人财务管理 TUI
  en: 'A fast and cozy TUI for personal finance management.'
x:
  source: https://github.com/hzqtc/cashd
  eget: https://github.com/hzqtc/cashd
rule:
  /eget:
    cmd: x eget hzqtc/cashd
    reference: https://github.com/hzqtc/cashd
binlist:
  - 'cashd'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 235 KB
          rating: 1
          desc:
            cn: 约 235 KB（估算）
            en: ~235 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
