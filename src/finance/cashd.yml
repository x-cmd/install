lang: 'Go'
homepage: 'https://github.com/hzqtc/cashd'
license: 'MIT'
desc:
  cn: 快速温馨的个人财务管理 TUI
  en: 'A fast and cozy TUI for personal finance management.'
  cs: Rychlé a příjemné TUI pro osobní správu financí.
  de: Ein schnelles und angenehmes TUI für das persönliche Finanzmanagement.
  es: Una TUI rápida y agradable para la gestión de las finanzas personales.
  fr: Un TUI rapide et confortable pour la gestion de vos finances personnelles.
  id: TUI yang cepat dan nyaman untuk manajemen keuangan pribadi.
  it: Una TUI veloce e accogliente per la gestione delle finanze personali.
  ja: 個人財務管理のための高速で快適なTUIです。
  ko: 개인 재무 관리를 위한 빠르고 편안한 TUI입니다.
  pl: Szybki i przyjemny interfejs TUI do zarządzania finansami osobistymi.
  pt: Uma TUI rápida e confortável para gestão de finanças pessoais.
  ro: O interfață TUI rapidă și plăcută pentru gestionarea finanțelor personale.
  ru: Быстрый и удобный TUI для личного финансового управления.
  th: TUI ที่รวดเร็วและสบายตา สำหรับการจัดการการเงินส่วนบุคคล
  tr: Kişisel finans yönetimi için hızlı ve konforlu bir TUI.
  uk: Швидкий і зручний TUI для особистого фінансового управління.
  vi: Giao diện TUI nhanh và dễ chịu để quản lý tài chính cá nhân.
x:
  source: https://github.com/hzqtc/cashd
  eget: hzqtc/cashd
rule:
  /eget:
    cmd: x eget hzqtc/cashd
    reference: https://github.com/hzqtc/cashd
binlist:
- 'cashd'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
