lang: 'Go'
homepage: 'https://github.com/hzqtc/cashd'
license: 'MIT'
desc:
  cn: 快速温馨的个人财务管理 TUI
  en: 'A fast and cozy TUI for personal finance management.'
x:
  source: https://github.com/hzqtc/cashd
  eget: hzqtc/cashd
rule:
  /eget:
    cmd: x eget hzqtc/cashd
    reference: https://github.com/hzqtc/cashd
binlist:
- 'cashd'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
