lang: C
homepage: https://github.com/nmbazima/LinksWWWbrowser
license: GPL-2.0
desc:
  cn: Links 是一款图形和文本模式的网页浏览器。
  en: Links is a graphics and text mode web browser.
  cs: Links je webový prohlížeč v grafickém i textovém režimu.
  de: Links ist ein Webbrowser im Grafik- und Textmodus.
  es: Links es un navegador web de modo gráfico y de texto.
  fr: Links est un navigateur web en mode graphique et texte.
  id: Links adalah browser web mode grafis dan teks.
  it: Links è un browser web in modalità grafica e testuale.
  ja: Links はグラフィックモードとテキストモードに対応したウェブブラウザです。
  ko: Links는 그래픽 모드와 텍스트 모드를 지원하는 웹 브라우저입니다.
  pl: Links to przeglądarka internetowa działająca w trybie graficznym i tekstowym.
  pt: Links é um navegador web de modo gráfico e de texto.
  ro: Links este un browser web în mod grafic și text.
  ru: Links — это веб-браузер с графическим и текстовым режимами.
  th: Links เป็นเว็บเบราว์เซอร์ที่รองรับทั้งโหมดกราฟิกและโหมดข้อความ
  tr: Links, hem grafik hem de metin modunda çalışan bir web tarayıcısıdır.
  uk: Links — це веббраузер із графічним і текстовим режимами.
  vi: Links là trình duyệt web ở chế độ đồ họa và văn bản.
x:
  source: https://github.com/nmbazima/LinksWWWbrowser
  apt: links
  dnf: links
  brew: links
  pacman: links
  apk: links
  apt-get: links
  yum: links
  zypper: links
rule:
  darwin/brew:
    cmd: brew install links
    reference: https://formulae.brew.sh/formula/links#default
  debian/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
    dsnap: links
  ubuntu/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
    dsnap: links
  kali/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
    dsnap: links
  raspbian/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
  mint/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
  alpine/apt:
    cmd: apk add links
    reference: https://command-not-found.com/links
  arch/pacman:
    cmd: sudo pacman -S links
    reference: https://command-not-found.com/links
  centos/yum:
    cmd: sudo yum install links
    reference: https://command-not-found.com/links
  fedora/dnf:
    cmd: sudo dnf install links
    reference: https://command-not-found.com/links
    dsnap: links
  opensuse/zypper:
    cmd: sudo zypper install links
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=links
binlist:
- links

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
