lang: C
homepage: https://github.com/nmbazima/LinksWWWbrowser
license: GPL-2.0
desc:
  cn: Links 是一款图形和文本模式的网页浏览器。
  en: Links is a graphics and text mode web browser.
x:
  source: https://github.com/nmbazima/LinksWWWbrowser
rule:
  darwin/brew:
    cmd: brew install links
    reference: https://formulae.brew.sh/formula/links#default
  debian/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
    dsnap: links
  ubuntu/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
    dsnap: links
  kali/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
    dsnap: links
  raspbian/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
  mint/apt:
    cmd: sudo apt-get install links
    reference: https://command-not-found.com/links
  alpine/apt:
    cmd: apk add links
    reference: https://command-not-found.com/links
  arch/pacman:
    cmd: sudo pacman -S links
    reference: https://command-not-found.com/links
  centos/yum:
    cmd: sudo yum install links
    reference: https://command-not-found.com/links
  fedora/dnf:
    cmd: sudo dnf install links
    reference: https://command-not-found.com/links
    dsnap: links
  opensuse/zypper:
    cmd: sudo zypper install links
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=links
binlist:
- links

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
