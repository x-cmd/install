lang: Ruby
homepage: https://github.com/jekyll/jekyll
license: MIT
desc:
  cn: Jekyll 是一个简单的、博客感知的静态站点生成器，非常适合个人、项目或组织站点
  en: Jekyll is a simple, blog-aware, static site generator perfect for personal, project, or organization sites
  cs: Jekyll je jednoduchý, blogově zaměřený generátor statických stránek, ideální pro osobní, projektové nebo organizační weby
  de: Jekyll ist ein einfacher, blogbewusster statischer Site-Generator, ideal für persönliche, Projekt- oder Organisations-Websites
  es: Jekyll es un generador de sitios estáticos sencillo y orientado a blogs, perfecto para sitios personales, de proyecto o de organización
  fr: Jekyll est un générateur de site statique simple et conscient des blogs, idéal pour les sites personnels, de projet ou d'organisation
  id: Jekyll adalah generator situs statis sederhana yang sadar blog, cocok untuk situs pribadi, proyek, atau organisasi
  it: Jekyll è un semplice generatore di siti statici orientato ai blog, perfetto per siti personali, di progetto o di organizzazione
  ja: Jekyll は単純でブログに対応した静的サイトジェネレーターで、個人・プロジェクト・組織のサイトに最適です。
  ko: Jekyll는 간단하고 블로그를 인식하는 정적 사이트 생성기로, 개인, 프로젝트 또는 조직 사이트에 이상적입니다.
  pl: Jekyll to prosty, świadomy blogów generator stron statycznych, idealny dla stron osobistych, projektowych i organizacyjnych
  pt: O Jekyll é um gerador de sites estáticos simples e consciente de blogs, perfeito para sites pessoais, de projeto ou de organização
  ro: Jekyll este un generator de site-uri statice simplu, orientat spre bloguri, perfect pentru site-uri personale, de proiect sau de organizație
  ru: Jekyll — простой генератор статических сайтов с поддержкой блогов, идеально подходящий для личных, проектных и организационных сайтов
  th: Jekyll เป็นตัวสร้างเว็บไซต์แบบสถิตที่เรียบง่ายและรองรับบล็อก เหมาะกับเว็บไซต์ส่วนตัว โครงการ หรือองค์กร
  tr: Jekyll, blog farkındalığına sahip basit bir statik site oluşturucusudur; kişisel, proje veya kurumsal siteler için idealdir.
  uk: Jekyll — це простий генератор статичних сайтів із підтримкою блогів, ідеальний для особистих, проєктних та організаційних сайтів.
  vi: Jekyll là trình tạo trang tĩnh đơn giản, hỗ trợ blog, rất phù hợp cho các trang cá nhân, dự án hoặc tổ chức
x:
  source: https://github.com/jekyll/jekyll
  apt: ruby-full
  dnf: ruby
  brew: chruby
  pacman: ruby
  apt-get: ruby-full
  gem: jekyll
rule:
  darwin/gem:
    cmd: 'brew install chruby ruby-install xz \

      && gem install jekyll \

      && ruby-install ruby 3.1.3 \

      && echo "source $(brew --prefix)/opt/chruby/share/chruby/chruby.sh" >> ~/.zshrc \

      && echo "source $(brew --prefix)/opt/chruby/share/chruby/auto.sh" >> ~/.zshrc \

      && echo "chruby ruby-3.1.3" >> ~/.zshrc \

      && gem install jekyll

      '
    reference: https://jekyllrb.com/docs/installation/macos/#install-jekyll
  ubuntu/gem:
    cmd: 'sudo apt-get install ruby-full build-essential zlib1g-dev \

      && echo ''# Install Ruby Gems to ~/gems'' >> ~/.bashrc \

      && echo ''export GEM_HOME="$HOME/gems"'' >> ~/.bashrc \

      && echo ''export PATH="$HOME/gems/bin:$PATH"'' >> ~/.bashrc \

      && source ~/.bashrc \

      && gem install jekyll bundler

      '
    reference: https://jekyllrb.com/docs/installation/ubuntu/
  freebsd/gem:
    cmd: 'pkg search gems \

      && sudo pkg install ruby3x-gems \

      && echo ''# Install Ruby Gems to ~/gems'' >> ~/.bashrc \

      && echo ''export GEM_HOME="$HOME/gems"'' >> ~/.bashrc \

      && echo ''export PATH="$HOME/gems/bin:$PATH"'' >> ~/.bashrc \

      && source ~/.bashrc \

      && gem install jekyll bundler jekyll-sitemap

      '
    reference: https://jekyllrb.com/docs/installation/freebsd/
  fedora/gem:
    cmd: 'sudo dnf install ruby ruby-devel openssl-devel redhat-rpm-config gcc-c++ @development-tools \

      && echo ''# Install Ruby Gems to ~/gems'' >> ~/.bashrc \

      && echo ''export GEM_HOME="$HOME/gems"'' >> ~/.bashrc \

      && echo ''export PATH="$HOME/gems/bin:$PATH"'' >> ~/.bashrc \

      && source ~/.bashrc \

      && gem install jekyll bundler

      '
    reference: https://jekyllrb.com/docs/installation/other-linux/
  rhel/gem:
    cmd: 'sudo dnf install ruby ruby-devel \

      && sudo dnf group install "Development Tools" \

      && echo ''# Install Ruby Gems to ~/gems'' >> ~/.bashrc \

      && echo ''export GEM_HOME="$HOME/gems"'' >> ~/.bashrc \

      && echo ''export PATH="$HOME/gems/bin:$PATH"'' >> ~/.bashrc \

      && source ~/.bashrc \

      && gem install jekyll bundler

      '
    reference: https://jekyllrb.com/docs/installation/other-linux/
  centos/gem:
    cmd: 'sudo dnf install ruby ruby-devel \

      && sudo dnf group install "Development Tools" \

      && echo ''# Install Ruby Gems to ~/gems'' >> ~/.bashrc \

      && echo ''export GEM_HOME="$HOME/gems"'' >> ~/.bashrc \

      && echo ''export PATH="$HOME/gems/bin:$PATH"'' >> ~/.bashrc \

      && source ~/.bashrc \

      && gem install jekyll bundler

      '
    reference: https://jekyllrb.com/docs/installation/other-linux/
  debian/gem:
    cmd: 'sudo apt-get install ruby-full build-essential \

      && echo ''# Install Ruby Gems to ~/gems'' >> ~/.bashrc \

      && echo ''export GEM_HOME="$HOME/gems"'' >> ~/.bashrc \

      && echo ''export PATH="$HOME/gems/bin:$PATH"'' >> ~/.bashrc \

      && source ~/.bashrc \

      && gem install jekyll bundler

      '
    reference: https://jekyllrb.com/docs/installation/other-linux/
  gentoo/emerge:
    cmd: sudo emerge -av jekyll
    reference: https://jekyllrb.com/docs/installation/other-linux/
  opensuse/gem:
    cmd: 'sudo zypper install -t pattern devel_ruby devel_C_C++ \

      && sudo zypper install ruby-devel \

      && sudo dnf group install "Development Tools" \

      && echo ''# Install Ruby Gems to ~/gems'' >> ~/.bashrc \

      && echo ''export GEM_HOME="$HOME/gems"'' >> ~/.bashrc \

      && echo ''export PATH="$HOME/gems/bin:$PATH"'' >> ~/.bashrc \

      && source ~/.bashrc \

      && gem install jekyll bundler

      '
    reference: https://jekyllrb.com/docs/installation/other-linux/
  arch/gem:
    cmd: 'sudo pacman -S ruby base-devel \

      && echo ''# Install Ruby Gems to ~/gems'' >> ~/.bashrc \

      && echo ''export GEM_HOME="$HOME/gems"'' >> ~/.bashrc \

      && echo ''export PATH="$HOME/gems/bin:$PATH"'' >> ~/.bashrc \

      && source ~/.bashrc \

      && gem install jekyll bundler

      '
    reference: https://jekyllrb.com/docs/installation/other-linux/
  clear/gem:
    cmd: 'sudo swupd bundle-add ruby-basic \

      && echo ''# Install Ruby Gems to ~/gems'' >> ~/.bashrc \

      && echo ''export GEM_HOME="$HOME/gems"'' >> ~/.bashrc \

      && echo ''export PATH="$HOME/gems/bin:$PATH"'' >> ~/.bashrc \

      && source ~/.bashrc \

      && gem install jekyll bundler

      '
    reference: https://jekyllrb.com/docs/installation/other-linux/
binlist:
- jekyll

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 49 KB
          rating: 1
          desc:
            cn: 约 49 KB（估算）
            en: ~49 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
