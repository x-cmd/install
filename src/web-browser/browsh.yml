lang: JavaScript
homepage: https://github.com/browsh-org/browsh
license: LGPL-2.1
desc:
  cn: Browsh 是一个完全现代化的基于文本的浏览器。
  en: Browsh is a fully-modern text-based browser.
  cs: Browsh je plně moderní textový prohlížeč.
  de: Browsh ist ein vollmodernes textbasiertes Webbrowser-Programm.
  es: Browsh es un navegador basado en texto totalmente moderno.
  fr: Browsh est un navigateur entièrement moderne basé sur le texte.
  id: Browsh adalah peramban berbasis teks yang sepenuhnya modern.
  it: Browsh è un browser basato su testo completamente moderno.
  ja: Browsh は完全にモダンなテキストベースのブラウザです。
  ko: Browsh는 완전히 현대적인 텍스트 기반 브라우저입니다.
  pl: Browsh to w pełni nowoczesna przeglądarka oparta na tekście.
  pt: O Browsh é um navegador totalmente moderno baseado em texto.
  ro: Browsh este un browser complet modern, bazat pe text.
  ru: Browsh — полностью современный текстовый браузер.
  th: Browsh คือเบราว์เซอร์แบบข้อความที่ทันสมัยอย่างสมบูรณ์๏
  tr: Browsh, tamamen modern bir metin tabanlı tarayıcıdır.
  uk: Browsh — повністю сучасний текстовий браузер.
  vi: Browsh là một trình duyệt dựa trên văn bản hoàn toàn hiện đại.
x:
  source: https://github.com/browsh-org/browsh
  eget: browsh-org/browsh
  yay: browsh-bin
rule:
  /eget:
    cmd: x eget browsh-org/browsh
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew tap browsh-org/homebrew-browsh
    reference: https://www.brow.sh/downloads/
  arch/yay:
    cmd: yay -S browsh-bin
    reference: https://www.brow.sh/downloads/
binlist:
- browsh
# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # renders web pages
    filesystem:
      read:
        desc:
          cn: 读取 ~/.config/browsh
          en: Reads ~/.config/browsh
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 约 11 KB（估算）
            en: ~11 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 200 MB
        desc:
          cn: ~200 MB
          en: ~200 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 渲染网页时占用
          en: Spike during page rendering
