lang: JavaScript
homepage: https://github.com/browsh-org/browsh
license: LGPL-2.1
desc:
  cn: Browsh 是一个完全现代化的基于文本的浏览器。
  en: Browsh is a fully-modern text-based browser.
x:
  source: https://github.com/browsh-org/browsh
  eget: https://github.com/browsh-org/browsh
rule:
  /eget:
    cmd: x eget browsh-org/browsh
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew tap browsh-org/homebrew-browsh
    reference: https://www.brow.sh/downloads/
  arch/yay:
    cmd: yay -S browsh-bin
    reference: https://www.brow.sh/downloads/
binlist:
- browsh
# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true   # renders web pages
    filesystem:
      read:
        desc:
          cn: 读取 ~/.config/browsh
          en: Reads ~/.config/browsh
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 约 11 KB（估算）
            en: ~11 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 200 MB
        desc:
          cn: ~200 MB
          en: ~200 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 渲染网页时占用
          en: Spike during page rendering
