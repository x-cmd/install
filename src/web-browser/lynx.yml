lang: C
homepage: https://github.com/lynx-family/lynx
license: Apache-2.0
desc:
  cn: Lynx 是一款功能齐全的全球范围网页浏览器，适用于通过光标可寻址字符单元终端或模拟器连接到 Unix 和 VMS 平台的用户。
  en: Lynx is a fully featured World-Wide Web browser for users on both Unix and VMS platforms who are connected to those systems via cursor-addressable, character-cell terminals or emulators.
x:
  source: https://github.com/lynx-family/lynx
  eget: https://github.com/lynx-family/lynx
rule:
  /eget:
    cmd: x eget lynx-family/lynx
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install lynx
    reference: https://formulae.brew.sh/formula/lynx#default
  arch/yay:
    cmd: yay -S lynx-git
    reference: https://aur.archlinux.org/packages/lynx-git
binlist:
- lynx

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 63 MB
          rating: 3
          desc:
            cn: 约 63 MB（估算）
            en: ~63 MB estimated
        download:
          estimate: 17 MB
          desc:
            cn: 约 17 MB 下载 (macos/x64)
            en: ~17 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: full
