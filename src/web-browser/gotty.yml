lang: Go
desc:
  en: Share your terminal as a web application
  cn: 将终端共享为 Web 应用程序
homepage: https://github.com/yudai/gotty
license: MIT
x:
  source: https://github.com/yudai/gotty
  eget: https://github.com/yudai/gotty
  brew: yudai/gotty/gotty
  yay: gotty-bin
rule:
  /eget:
    cmd: x eget yudai/gotty
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use gotty
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install yudai/gotty/gotty
    reference: https://github.com/yudai/gotty?tab=readme-ov-file#homebrew-installation
  /go:
    cmd: go get github.com/yudai/gotty
    reference: https://github.com/yudai/gotty?tab=readme-ov-file#go-get-installation-development
    dsnap: github.com/yudai/gotty
  arch/yay:
    cmd: yay -S gotty-bin
    reference: https://aur.archlinux.org/packages/gotty-bin
binlist:
- gotty

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
