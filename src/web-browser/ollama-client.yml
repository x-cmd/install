lang: TypeScript
homepage: https://github.com/Shishir435/ollama-client
license: mit
desc:
  cn: 在浏览器中与本地 LLM 对话的轻量、隐私优先 Chrome 扩展，支持 Ollama、LM Studio 和 llama.cpp 流式对话
  en: Ollama Client – Chat with Local LLMs Inside Your Browser A lightweight, privacy‑first Chrome extension to chat with local LLMs via Ollama, LM Studio, and llama.cpp. Supports streaming, stop/regene...
x:
  source: https://github.com/Shishir435/ollama-client
  eget: https://github.com/Shishir435/ollama-client
rule:
  /eget:
    cmd: x eget Shishir435/ollama-client
    reference: https://github.com/Shishir435/ollama-client
binlist:
- ollama-client

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
