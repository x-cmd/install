lang: Python
homepage: https://github.com/browser-use/browser-use
license: mit
desc:
  cn: 让 AI Agent 轻松接入并自动化网站任务的工具
  en: 🌐 Make websites accessible for AI agents. Automate tasks online with ease.
x:
  source: https://github.com/browser-use/browser-use
  pip: browser-use
rule:
  /pip:
    cmd: pip install browser-use
    reference: https://pypi.org/project/browser-use/
    dsnap: browser-use
binlist:
- browser-use

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 178 KB
          rating: 1
          desc:
            cn: 约 178 KB（估算）
            en: ~178 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
