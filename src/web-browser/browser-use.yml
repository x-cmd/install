lang: Python
homepage: https://github.com/browser-use/browser-use
license: mit
desc:
  cn: 让 AI Agent 轻松接入并自动化网站任务的工具
  en: 🌐 Make websites accessible for AI agents. Automate tasks online with ease.
x:
  source: https://github.com/browser-use/browser-use
rule:
  /pip:
    cmd: pip install browser-use
    reference: https://pypi.org/project/browser-use/
    dsnap: browser-use
binlist:
- browser-use

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
