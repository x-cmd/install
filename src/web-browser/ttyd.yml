lang: C
homepage: https://github.com/tsl0922/ttyd
license: MIT
desc:
  cn: ttyd 是一个简单的命令行工具，用于通过 Web 共享终端
  en: ttyd is a simple command-line tool for sharing terminal over the web
x:
  pkg:
    exist: true
  source: https://github.com/tsl0922/ttyd
  eget: https://github.com/tsl0922/ttyd
rule:
  /x:
    cmd: x pkg use ttyd
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget tsl0922/ttyd
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use ttyd
    reference: https://github.com/ivanvc/asdf-ttyd
  darwin/brew:
    cmd: brew install ttyd
    reference: https://formulae.brew.sh/formula/ttyd#default
  alpine/apk:
    cmd: sudo apk add ttyd
    reference: https://command-not-found.com/ttyd
    dsnap: ttyd
binlist:
- ttyd

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 116 KB
          rating: 1
          desc:
            cn: 约 116 KB（估算）
            en: ~116 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
