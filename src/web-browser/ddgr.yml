lang: Python
desc:
  cn: ddgr 是一个命令行实用程序，用于从终端搜索 DuckDuckGo（html 版本）
  en: ddgr is a cmdline utility to search DuckDuckGo (html version) from the terminal
homepage: https://github.com/jarun/ddgr
license: GPL-3.0
x:
  pkg:
    exist: true
  source: https://github.com/jarun/ddgr
rule:
  /x:
    cmd: x pkg use ddgr
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install ddgr
    reference: https://formulae.brew.sh/formula/ddgr
  ubuntu/apt:
    cmd: sudo apt install ddgr
    reference: https://github.com/jarun/ddgr?tab=readme-ov-file#from-a-package-manager
    dsnap: ddgr
  fedora/dnf:
    cmd: sudo dnf install ddgr
    reference: https://github.com/jarun/ddgr?tab=readme-ov-file#from-a-package-manager
    dsnap: ddgr
  arch/yay:
    cmd: yay -S ddgr-git
    reference: https://aur.archlinux.org/packages/ddgr-git
binlist:
- ddgr

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
