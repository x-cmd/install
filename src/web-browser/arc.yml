lang: C++
homepage: https://arc.net/
license: NOASSERTION
desc:
  cn: Arc 是一个 Chromium 浏览器，专注多空间 / 多面板的生产力工作流。
  en: Arc is a Chromium browser focused on multi-space / multi-pane productivity workflows.
  cs: Arc je prohlížeč Chromium zaměřený na pracovní postupy s více prostory a panely.
  de: Arc ist ein Chromium-Browser für produktive Arbeitsabläufe mit mehreren Bereichen und Fenstern.
  es: Arc es un navegador Chromium orientado a flujos de trabajo productividad con múltiples espacios y paneles.
  fr: Arc est un navigateur Chromium axé sur les flux de travail multitâches avec plusieurs espaces et panneaux.
  id: Arc adalah peramban Chromium yang berfokus pada alur kerja produktivitas multi-ruang/multi-panel.
  it: Arc è un browser Chromium focalizzato sui flussi di lavoro di produttività con più spazi e pannelli.
  ja: Arc はマルチスペース・マルチペインの生産性向上ワークフローに特化した Chromium ブラウザです。
  ko: Arc은 다중 스페이스/패널 생산성 워크플로에 초점을 맞춘 Chromium 브라우저입니다.
  pl: Arc to przeglądarka Chromium skupiona na przepływach pracy z wieloma przestrzeniami i panelami.
  pt: O Arc é um navegador Chromium focado em fluxos de trabalho de produtividade com múltiplos espaços e painéis.
  ro: Arc este un browser Chromium axat pe fluxuri de lucru de productivitate cu mai multe spații și panouri.
  ru: Arc — браузер на базе Chromium, ориентированный на рабочие сценарии с несколькими пространствами и панелями.
  th: Arc คือเบราว์เซอร์ Chromium ที่มุ่งเน้นเวิร์กโฟลว์เพิ่มผลผลิตแบบมัลติสเปซและมัลติแพเนล๏
  tr: Arc, çoklu alan ve panel içeren üretkenlik iş akışlarına odaklanan bir Chromium tarayıcısıdır.
  uk: Arc — браузер на базі Chromium, орієнтований на робочі сценарії з кількома просторами та панелями.
  vi: Arc là trình duyệt Chromium tập trung vào quy trình làm việc năng suất với nhiều không gian và bảng điều khiển.
x:
  brew: arc
rule:
  darwin/brew:
    cmd: brew install --cask arc
    reference: https://formulae.brew.sh/cask/arc
  (win|wsl2)/winget:
    cmd: x winget install -e --id TheBrowserCompany.Arc
    reference: https://winget.run/pkg/TheBrowserCompany/Arc
binlist:
- arc
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置、扩展、缓存
          en: Reads config, extensions, cache
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 350 MB
          rating: 2
          desc:
            cn: 约 350 MB 安装
            en: ~350 MB install
      paths:
        data:
          - ~/Library/Application Support/Arc
        config:
          - ~/Library/Application Support/Arc
    memory:
      idle:
        estimate: 400 MB
        desc:
          cn: 约 400 MB 闲置（Electron 类较重）
          en: ~400 MB idle (Electron-heavy)
    cpu:
      workload: ['io', 'compute']
      processes: 8
      peak:
        rating: 3
        desc:
          cn: 较高（Electron 类）
          en: High (Electron-heavy)
  platform:
    win: full
    linux: none
    darwin: full