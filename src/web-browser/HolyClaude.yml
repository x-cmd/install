lang: JavaScript
homepage: https://github.com/CoderLuii/HolyClaude
license: mit
desc:
  cn: AI 编程工作站：Claude Code + Web UI + 7 个 AI CLI + 无头浏览器 + 50+ 工具
  en: 'AI coding workstation: Claude Code + web UI + 7 AI CLIs + headless browser + 50+ tools'
x:
  source: https://github.com/CoderLuii/HolyClaude
  eget: https://github.com/CoderLuii/HolyClaude
rule:
  /eget:
    cmd: x eget CoderLuii/HolyClaude
    reference: https://github.com/CoderLuii/HolyClaude
binlist:
- HolyClaude

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
