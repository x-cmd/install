lang: JavaScript
homepage: https://github.com/CoderLuii/HolyClaude
license: mit
desc:
  cn: AI 编程工作站：Claude Code + Web UI + 7 个 AI CLI + 无头浏览器 + 50+ 工具
  en: 'AI coding workstation: Claude Code + web UI + 7 AI CLIs + headless browser + 50+ tools'
x:
  source: https://github.com/CoderLuii/HolyClaude
  eget: CoderLuii/HolyClaude
rule:
  /eget:
    cmd: x eget CoderLuii/HolyClaude
    reference: https://github.com/CoderLuii/HolyClaude
binlist:
- HolyClaude

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 32 KB
          rating: 1
          desc:
            cn: 约 32 KB（估算）
            en: ~32 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
