lang: Rust
homepage: https://github.com/h4ckf0r0day/obscura
license: Apache-2.0
desc:
  cn: Obscura 是一款面向 AI Agent 与网络爬虫的开源无头浏览器引擎，基于 Rust 与嵌入式 V8 实现，支持 CDP / Puppeteer / Playwright，内置反指纹与追踪拦截。
  en: Obscura is an open-source headless browser engine for AI agents and web scraping, built in Rust with embedded V8, supporting CDP / Puppeteer / Playwright, with built-in anti-fingerprinting and tracker blocking.
x:
  source: https://github.com/h4ckf0r0day/obscura
  eget: https://github.com/h4ckf0r0day/obscura
rule:
  /eget:
    cmd: x eget use h4ckf0r0day/obscura
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S obscura-browser
    reference: https://aur.archlinux.org/packages/obscura-browser
binlist:
  - obscura

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.9 MB
          rating: 1
          desc:
            cn: 约 5.9 MB（估算）
            en: ~5.9 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 中
          en: Medium