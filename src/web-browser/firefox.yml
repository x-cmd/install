lang: C++
homepage: https://www.mozilla.org/en-US/firefox/
desc:
  cn: 火狐是自由及开源，由 Mozilla 基金会及其子公司 Mozilla 公司开发的网页浏览器
  en: Firefox is a free and open source web browser developed by the Mozilla Foundation and its subsidiary, the Mozilla Corporation
  cs: Firefox je bezplatný webový prohlížeč s otevřeným zdrojovým kódem, vyvinutý Nadací Mozilla a její dceřinou společností Mozilla Corporation
  de: Firefox ist ein kostenloser Open-Source-Webbrowser, entwickelt von der Mozilla Foundation und ihrer Tochtergesellschaft, der Mozilla Corporation
  es: Firefox es un navegador web gratuito y de código abierto desarrollado por la Fundación Mozilla y su filial, Mozilla Corporation
  fr: Firefox est un navigateur web gratuit et open source développé par la Fondation Mozilla et sa filiale, Mozilla Corporation
  id: Firefox adalah peramban web gratis dan sumber terbuka yang dikembangkan oleh Mozilla Foundation dan anak perusahaannya, Mozilla Corporation
  it: Firefox è un browser web gratuito e open source sviluppato dalla Mozilla Foundation e dalla sua controllata, la Mozilla Corporation
  ja: Firefox は Mozilla Foundation とその子会社 Mozilla Corporation が開発した無料でオープンソースのウェブブラウザです
  ko: Firefox는 Mozilla Foundation과 그 자회사 Mozilla Corporation이 개발한 자유 및 오픈 소스 웹 브라우저입니다
  pl: Firefox to bezpłatna przeglądarka internetowa o otwartym kodzie, opracowana przez Fundację Mozilla i jej spółkę zależną, Mozilla Corporation
  pt: O Firefox é um navegador web gratuito e de código aberto desenvolvido pela Mozilla Foundation e sua subsidiária, a Mozilla Corporation
  ro: Firefox este un browser web gratuit și open source, dezvoltat de Mozilla Foundation și de filiala sa, Mozilla Corporation
  ru: Firefox — бесплатный веб-браузер с открытым исходным кодом, разработанный Mozilla Foundation и её дочерней компанией Mozilla Corporation
  th: Firefox เป็นเว็บเบราว์เซอร์ฟรีและโอเพนซอร์สที่พัฒนาโดยมูลนิธิ Mozilla และบริษัทในเครือ Mozilla Corporation
  tr: Firefox, Mozilla Vakfı ve iştiraki Mozilla Corporation tarafından geliştirilen ücretsiz ve açık kaynaklı bir web tarayıcısıdır
  uk: Firefox — це безкоштовний веббраузер з відкритим кодом, розроблений Mozilla Foundation та її дочірньою компанією Mozilla Corporation
  vi: Firefox là trình duyệt web miễn phí và mã nguồn mở được phát triển bởi Mozilla Foundation và công ty con Mozilla Corporation
x:
  source: https://github.com/mozilla/gecko-dev
  apt: firefox
  dnf: firefox
  brew: firefox
  scoop: firefox
  choco: firefox
  winget: mozilla.firefox
  pacman: firefox
rule:
  darwin/brew:
    cmd: brew install --cask firefox
    reference: https://formulae.brew.sh/cask/firefox#default
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/firefox
    reference: https://scoop.sh/#/apps?q=firefox&id=6643da2c8c4f1db4008e36e14271e538634b7e76
  (win|wsl2)/choco:
    cmd: x choco install firefox
    reference: https://community.chocolatey.org/packages/Firefox
  (win|wsl2)/winget:
    cmd: x winget install -e --id Mozilla.Firefox
    reference: https://winget.run/pkg/Mozilla/Firefox
  debian/apt:
    cmd: sudo apt-get install firefox
    reference: https://command-not-found.com/firefox
  ubuntu/apt:
    cmd: sudo apt-get install firefox
    reference: https://command-not-found.com/firefox
  alpine/apk:
    cmd: sudo apk add firefox
    reference: https://command-not-found.com/firefox
  arch/pacman:
    cmd: sudo pacman -S firefox
    reference: https://command-not-found.com/firefox
  kali/apt:
    cmd: sudo apt-get install firefox
    reference: https://command-not-found.com/firefox
  centos/yum:
    cmd: sudo yum install firefox
    reference: https://command-not-found.com/firefox
  fedora/dnf:
    cmd: sudo dnf install firefox
    reference: https://command-not-found.com/firefox
  raspbian/apt:
    cmd: sudo apt-get install firefox
    reference: https://command-not-found.com/firefox
  /flatpak:
    cmd: sudo flatpak install flathub org.mozilla.firefox
    reference: https://flathub.org/apps/org.mozilla.firefox
  nix/:
    cmd: nix-shell -p firefox
    reference: https://search.nixos.org/packages?channel=unstable&show=firefox&from=0&size=50&sort=relevance&type=packages&query=firefox
  arch/yay:
    cmd: yay -S firefox-bin
    reference: https://aur.archlinux.org/packages/firefox-bin

binlist:
- firefox
license: MPL-2.0

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件、扩展、缓存
          en: Reads config files, extensions, cache
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 250 MB
          rating: 2
          desc:
            cn: 约 250 MB 安装
            en: ~250 MB install
      paths:
        data:
          - ~/.mozilla/firefox
        config:
          - ~/.mozilla/firefox
    memory:
      idle:
        estimate: 200 MB
        desc:
          cn: 约 200 MB 闲置
          en: ~200 MB idle
    cpu:
      workload: ['io', 'compute']
      processes: 5
      peak:
        rating: 2
        desc:
          cn: 低
          en: Low
  platform:
    win: full
    linux: full
    darwin: full
