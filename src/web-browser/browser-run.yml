lang: JavaScript
homepage: https://github.com/juliangruber/browser-run
desc:
  cn: 从命令行在浏览器内运行代码
  en: Run code inside a browser from the command line
x:
  pkg:
    exist: true
  source: https://github.com/juliangruber/browser-run
rule:
  /x:
    cmd: x pkg use browser-run
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g browser-run
    reference: https://github.com/juliangruber/browser-run?tab=readme-ov-file#installation
    dsnap: browser-run
binlist:
- browser-run
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
