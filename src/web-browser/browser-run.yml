lang: JavaScript
homepage: https://github.com/juliangruber/browser-run
desc:
  cn: 从命令行在浏览器内运行代码
  en: Run code inside a browser from the command line
  cs: Spouští kód v prohlížeči z příkazové řádky
  de: Führt Code in einem Browser über die Kommandozeile aus
  es: Ejecuta código dentro de un navegador desde la línea de comandos
  fr: Exécute du code dans un navigateur depuis la ligne de commande
  id: Menjalankan kode di dalam browser dari baris perintah
  it: Esegue codice all'interno di un browser dalla riga di comando
  ja: コマンドラインからブラウザ内でコードを実行する
  ko: 명령줄에서 브라우저 안의 코드를 실행합니다
  pl: Uruchamia kod w przeglądarce z wiersza poleceń
  pt: Executa código dentro de um navegador a partir da linha de comando
  ro: Rulează cod într-un browser din linia de comandă
  ru: Запускает код в браузере из командной строки
  th: เรียกใช้โค้ดภายในเบราว์เซอร์จากบรรทัดคำสั่ง
  tr: Komut satırından tarayıcı içinde kod çalıştırır
  uk: Запускає код у браузері з командного рядка
  vi: Chạy mã bên trong trình duyệt từ dòng lệnh
x:
  source: https://github.com/juliangruber/browser-run
  npm: browser-run
rule:
  /x:
    cmd: x pkg use browser-run
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g browser-run
    reference: https://github.com/juliangruber/browser-run?tab=readme-ov-file#installation
    dsnap: browser-run
binlist:
- browser-run
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
