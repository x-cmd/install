lang: C++
homepage: https://vivaldi.com/
license: NOASSERTION
desc:
  cn: Vivaldi 是一个高度可定制的 Chromium 浏览器，内置标签平铺、笔记、邮件与 RSS 阅读器。
  en: Vivaldi is a highly customizable Chromium browser with built-in tab tiling, notes, mail, and RSS reader.
  cs: Vivaldi je vysoce přizpůsobitelný prohlížeč založený na Chromium s vestavěnou dlaždicí panelů, poznámkami, poštou a čtečkou RSS.
  de: Vivaldi ist ein hochgradig anpassbarer Chromium-Browser mit integrierter Tab-Kachelung, Notizen, Mail und RSS-Reader.
  es: Vivaldi es un navegador Chromium altamente personalizable con mosaico de pestañas, notas, correo y lector RSS integrados.
  fr: Vivaldi est un navigateur Chromium très personnalisable avec tuilage des onglets, notes, courrier et lecteur RSS intégrés.
  id: Vivaldi adalah peramban Chromium yang sangat dapat dikustomisasi dengan fitur ubin tab, catatan, email, dan pembaca RSS bawaan.
  it: Vivaldi è un browser Chromium altamente personalizzabile con mosaico delle schede, note, posta e lettore RSS integrati.
  ja: Vivaldi は、タブのタイル配置、ノート、メール、RSS リーダーを内蔵した高度にカスタマイズ可能な Chromium ブラウザです。
  ko: Vivaldi는 탭 타일링, 노트, 메일, RSS 리더기를 내장한 고도로 사용자 정의 가능한 Chromium 브라우저입니다.
  pl: Vivaldi to wysoce konfigurowalna przeglądarka oparta na Chromium z wbudowanym kafelkowaniem kart, notatkami, pocztą i czytnikiem RSS.
  pt: Vivaldi é um navegador Chromium altamente personalizável com mosaico de abas, notas, e-mail e leitor RSS integrados.
  ro: Vivaldi este un browser Chromium extrem de personalizabil, cu mozaic de file, note, e-mail și cititor RSS integrate.
  ru: Vivaldi — высоконастраиваемый браузер на базе Chromium со встроенной мозаикой вкладок, заметками, почтой и RSS-читалкой.
  th: Vivaldi คือเบราว์เซอร์ Chromium ที่ปรับแต่งได้สูง พร้อมคุณสมบัติจัดเรียงแท็บ บันทึก อีเมล และโปรแกรมอ่าน RSS ในตัว
  tr: Vivaldi, yerleşik sekme döşeme, notlar, posta ve RSS okuyucu ile son derece özelleştirilebilir bir Chromium tarayıcısıdır.
  uk: Vivaldi — високоналаштовуваний браузер на базі Chromium зі вбудованою мозаїкою вкладок, нотатками, поштою та RSS-читалкою.
  vi: Vivaldi là trình duyệt Chromium có thể tùy chỉnh cao với tính năng xếp ô tab, ghi chú, mail và trình đọc RSS tích hợp.
x:
  source: https://vivaldi.com/source/
  apt: vivaldi-stable
  dnf: vivaldi-stable
  brew: vivaldi
  pacman: vivaldi
  scoop: vivaldi
  choco: vivaldi
  winget: Vivaldi.Vivaldi
  flatpak: com.vivaldi.Vivaldi
  snap: vivaldi
rule:
  (linux|debian|ubuntu|kali|mint)/apt:
    cmd: 'wget -qO- https://repo.vivaldi.com/archive/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/vivaldi.gpg && echo "deb [signed-by=/usr/share/keyrings/vivaldi.gpg] https://repo.vivaldi.com/archive/deb/ stable main" | sudo tee /etc/apt/sources.list.d/vivaldi.list && sudo apt update && sudo apt install -y vivaldi-stable'
    reference: https://help.vivaldi.com/article/install-vivaldi-on-debian-ubuntu-and-their-derivatives/
    dsnap: vivaldi-stable
  (linux|fedora|rhel|centos)/dnf:
    cmd: 'sudo dnf config-manager --add-repo https://repo.vivaldi.com/archive/vivaldi-fedora.repo && sudo dnf install -y vivaldi-stable'
    reference: https://help.vivaldi.com/article/install-vivaldi-on-fedora-and-rhel/
    dsnap: vivaldi-stable
  (linux|arch|manjaro)/pacman:
    cmd: sudo pacman -S vivaldi
    reference: https://wiki.archlinux.org/title/Vivaldi
  darwin/brew:
    cmd: brew install --cask vivaldi
    reference: https://formulae.brew.sh/cask/vivaldi
  (win|wsl2)/scoop:
    cmd: x scoop install vivaldi
    reference: https://scoop.sh/#/apps?q=vivaldi
  (win|wsl2)/winget:
    cmd: x winget install -e --id Vivaldi.Vivaldi
    reference: https://winget.run/pkg/Vivaldi/Vivaldi
  (win|wsl2)/choco:
    cmd: x choco install vivaldi
    reference: https://community.chocolatey.org/packages/vivaldi
  /flatpak:
    cmd: flatpak install flathub com.vivaldi.Vivaldi
    reference: https://flathub.org/apps/com.vivaldi.Vivaldi
  /snap:
    cmd: sudo snap install vivaldi
    reference: https://snapcraft.io/vivaldi
binlist:
- vivaldi
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置、扩展、缓存
          en: Reads config, extensions, cache
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 310 MB
          rating: 2
          desc:
            cn: 约 310 MB 安装
            en: ~310 MB install
      paths:
        data:
          - ~/.config/vivaldi
        config:
          - ~/.config/vivaldi
    memory:
      idle:
        estimate: 280 MB
        desc:
          cn: 约 280 MB 闲置
          en: ~280 MB idle
    cpu:
      workload: ['io', 'compute']
      processes: 7
      peak:
        rating: 2
        desc:
            cn: 中
            en: Medium
  platform:
    win: full
    linux: full
    darwin: full