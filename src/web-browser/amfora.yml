lang: Go
homepage: https://github.com/makew0rld/amfora
license: GPL-3.0
desc:
  cn: 一个用于 Gemini 协议的漂亮终端浏览器。
  en: A fancy terminal browser for the Gemini protocol.
x:
  source: https://github.com/makew0rld/amfora
  eget: https://github.com/makew0rld/amfora
rule:
  /eget:
    cmd: x eget makew0rld/amfora
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#macos-homebrew
  darwin/port:
    cmd: sudo port install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#macos-macports
  (win|wsl2)/scoop:
    cmd: x scoop install amfora
    reference: https://scoop.sh/#/apps?q=amfora
  debian/apt:
    cmd: sudo apt-get install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
    dsnap: amfora
  ubuntu/apt:
    cmd: sudo apt-get install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
    dsnap: amfora
  kali/apt:
    cmd: sudo apt-get install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
    dsnap: amfora
  mint/apt:
    cmd: sudo apt-get install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  raspbian/apt:
    cmd: sudo apt-get install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  arch/pacman:
    cmd: sudo pacman -S amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  manjaro/pacman:
    cmd: sudo pacman -S amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  opensuse/zypper:
    cmd: sudo zypper install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  alpine/apk:
    cmd: apk add amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
    dsnap: amfora
  /nix:
    cmd: nix-env -iA amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  freebsd/pkg:
    cmd: pkg install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  openbsd/pkg_add:
    cmd: pkg_add amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  netbsd/pkgin:
    cmd: pkgin install amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  gentoo/emerge:
    cmd: sudo emerge amfora
    reference: https://github.com/makew0rld/amfora?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S amfora-git
    reference: https://aur.archlinux.org/packages/amfora-git
binlist:
- amfora

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/arm64)
            en: ~15 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
