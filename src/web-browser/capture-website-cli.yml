lang: JavaScript
homepage: https://github.com/sindresorhus/capture-website-cli#readme
license: MIT
desc:
  cn: 从命令行捕获网站的屏幕截图
  en: Capture screenshots of websites from the command-line
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/capture-website-cli#readme
rule:
  /x:
    cmd: x pkg use capture-website-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global capture-website-cli
    reference: https://github.com/sindresorhus/capture-website-cli?tab=readme-ov-file#install
    dsnap: capture-website-cli
binlist:
- capture-website-cli

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
