lang: JavaScript
homepage: https://github.com/sindresorhus/capture-website-cli#readme
license: MIT
desc:
  cn: 从命令行捕获网站的屏幕截图
  en: Capture screenshots of websites from the command-line
  cs: Pořizuje snímky obrazovky webů z příkazové řádky
  de: Erfasst Screenshots von Websites über die Kommandozeile
  es: Captura capturas de pantalla de sitios web desde la línea de comandos
  fr: Capture des captures d'écran de sites web depuis la ligne de commande
  id: Menangkap tangkapan layar situs web dari baris perintah
  it: Cattura screenshot di siti web dalla riga di comando
  ja: コマンドラインからウェブサイトのスクリーンショットを撮影する
  ko: 명령줄에서 웹사이트의 스크린샷을 캡처합니다
  pl: Robi zrzuty ekranu witryn z wiersza poleceń
  pt: Captura capturas de tela de sites da web a partir da linha de comando
  ro: Capturează capturi de ecran ale site-urilor web din linia de comandă
  ru: Делает скриншоты веб-сайтов из командной строки
  th: จับภาพหน้าจอของเว็บไซต์จากบรรทัดคำสั่ง
  tr: Komut satırından web sitelerinin ekran görüntülerini alır
  uk: Робить знімки екрана вебсайтів з командного рядка
  vi: Chụp ảnh màn hình của trang web từ dòng lệnh
x:
  source: https://github.com/sindresorhus/capture-website-cli#readme
rule:
  /x:
    cmd: x pkg use capture-website-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global capture-website-cli
    reference: https://github.com/sindresorhus/capture-website-cli?tab=readme-ov-file#install
    dsnap: capture-website-cli
binlist:
- capture-website-cli

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
