lang: JavaScript
homepage: https://github.com/sindresorhus/capture-website-cli#readme
license: MIT
desc:
  cn: 从命令行捕获网站的屏幕截图
  en: Capture screenshots of websites from the command-line
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/capture-website-cli#readme
rule:
  /x:
    cmd: x pkg use capture-website-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global capture-website-cli
    reference: https://github.com/sindresorhus/capture-website-cli?tab=readme-ov-file#install
    dsnap: capture-website-cli
binlist:
- capture-website-cli

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
