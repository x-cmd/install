lang: C++
homepage: https://www.opera.com/
license: NOASSERTION
desc:
  cn: Opera 是一个历史悠久的 Chromium 浏览器，自带内置广告拦截、VPN 与消息应用。
  en: Opera is a long-established Chromium browser with built-in ad-blocking, VPN, and messaging apps.
  cs: Opera je dlouho etablovaný prohlížeč Chromium s vestavěným blokováním reklam, VPN a aplikacemi pro zasílání zpráv.
  de: Opera ist ein lang etablierter Chromium-Browser mit integriertem Werbeblocker, VPN und Messaging-Apps.
  es: Opera es un navegador Chromium de larga trayectoria con bloqueo de anuncios, VPN y aplicaciones de mensajería integrados.
  fr: Opera est un navigateur Chromium de longue date, avec bloqueur de publicités, VPN et applications de messagerie intégrés.
  id: Opera adalah browser Chromium yang sudah lama ada dengan pemblokir iklan, VPN, dan aplikasi pesan bawaan.
  it: Opera è un browser Chromium di lunga tradizione con blocco degli annunci, VPN e app di messaggistica integrati.
  ja: Opera は長い実績を持つ Chromium ブラウザで、広告ブロック、VPN、メッセージングアプリを内蔵しています。
  ko: Opera는 광고 차단, VPN, 메시징 앱이 내장된 오래된 Chromium 브라우저입니다.
  pl: Opera to długo obecny na rynku przeglądarka Chromium z wbudowanym blokowaniem reklam, VPN i aplikacjami do komunikacji.
  pt: Opera é um navegador Chromium de longa tradição com bloqueador de anúncios, VPN e aplicativos de mensagens integrados.
  ro: Opera este un browser Chromium de lungă tradiție cu blocare de reclame, VPN și aplicații de mesagerie integrate.
  ru: Opera — это давно известный браузер Chromium со встроенным блокировщиком рекламы, VPN и приложениями для обмена сообщениями.
  th: Opera เป็นเบราว์เซอร์ Chromium ที่มีมานาน พร้อมคุณสมบัติบล็อกโฆษณา VPN และแอปแชทในตัว
  tr: Opera, yerleşik reklam engelleyici, VPN ve mesajlaşma uygulamalarıyla uzun süredir var olan bir Chromium tarayıcısıdır.
  uk: Opera — це давно відомий браузер Chromium зі вбудованим блокувальником реклами, VPN та застосунками для обміну повідомленнями.
  vi: Opera là trình duyệt Chromium lâu đời với trình chặn quảng cáo, VPN và ứng dụng nhắn tin tích hợp sẵn.
x:
  source: https://github.com/operasoftware/desktop
  apt: opera-stable
  dnf: opera-stable
  brew: opera
  pacman: opera
  scoop: opera
  choco: opera
  winget: Opera.Opera
  snap: opera
rule:
  (linux|debian|ubuntu|kali|mint)/apt:
    cmd: 'wget -qO- https://deb.opera.com/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/opera.gpg && echo "deb [signed-by=/usr/share/keyrings/opera.gpg] https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera.list && sudo apt update && sudo apt install -y opera-stable'
    reference: https://deb.opera.com/manual.html
    dsnap: opera-stable
  (linux|fedora|rhel|centos)/dnf:
    cmd: 'sudo dnf config-manager --add-repo https://rpm.opera.com/rpmrepo && sudo dnf install -y opera-stable'
    reference: https://rpm.opera.com/
    dsnap: opera-stable
  (linux|arch|manjaro)/pacman:
    cmd: sudo pacman -S opera
    reference: https://wiki.archlinux.org/title/Opera
  darwin/brew:
    cmd: brew install --cask opera
    reference: https://formulae.brew.sh/cask/opera
  (win|wsl2)/scoop:
    cmd: x scoop install opera
    reference: https://scoop.sh/#/apps?q=opera
  (win|wsl2)/winget:
    cmd: x winget install -e --id Opera.Opera
    reference: https://winget.run/pkg/Opera/Opera
  (win|wsl2)/choco:
    cmd: x choco install opera
    reference: https://community.chocolatey.org/packages/opera
  /snap:
    cmd: sudo snap install opera
    reference: https://snapcraft.io/opera
binlist:
- opera
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置、扩展、缓存
          en: Reads config, extensions, cache
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 320 MB
          rating: 2
          desc:
            cn: 约 320 MB 安装
            en: ~320 MB install
      paths:
        data:
          - ~/.config/opera
        config:
          - ~/.config/opera
    memory:
      idle:
        estimate: 280 MB
        desc:
          cn: 约 280 MB 闲置
          en: ~280 MB idle
    cpu:
      workload: ['io', 'compute']
      processes: 6
      peak:
        rating: 2
        desc:
          cn: 中
          en: Medium
  platform:
    win: full
    linux: full
    darwin: none
