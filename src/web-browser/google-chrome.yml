lang: C++
homepage: https://www.google.com/chrome/
license: NOASSERTION
desc:
  cn: Google Chrome 是一个由 Google 开发的快速、安全的网页浏览器，基于 Blink 引擎。
  en: Google Chrome is a fast, secure web browser built by Google, powered by the Blink engine.
  cs: Google Chrome je rychlý a bezpečný webový prohlížeč od Google, založený na enginu Blink.
  de: Google Chrome ist ein schneller, sicherer Webbrowser von Google, basierend auf der Blink-Engine.
  es: Google Chrome es un navegador web rápido y seguro creado por Google, basado en el motor Blink.
  fr: Google Chrome est un navigateur web rapide et sécurisé conçu par Google, fondé sur le moteur Blink.
  id: Google Chrome adalah browser web cepat dan aman yang dibuat oleh Google, bertenaga mesin Blink.
  it: Google Chrome è un browser web veloce e sicuro realizzato da Google, basato sul motore Blink.
  ja: Google Chrome は Google が開発した高速で安全なウェブブラウザで、Blink エンジンを搭載しています。
  ko: Google Chrome는 Google이 만든 빠르고 안전한 웹 브라우저로, Blink 엔진을 사용합니다.
  pl: Google Chrome to szybka i bezpieczna przeglądarka internetowa stworzona przez Google, oparta na silniku Blink.
  pt: O Google Chrome é um navegador web rápido e seguro criado pelo Google, com o motor Blink.
  ro: Google Chrome este un browser web rapid și sigur creat de Google, bazat pe motorul Blink.
  ru: Google Chrome — это быстрый и безопасный веб-браузер от Google, работающий на движке Blink.
  th: Google Chrome เป็นเว็บเบราว์เซอร์ที่รวดเร็วและปลอดภัย พัฒนาโดย Google ใช้เอนจิน Blink
  tr: Google Chrome, Blink motoruyla çalışan, Google tarafından geliştirilen hızlı ve güvenli bir web tarayıcısıdır.
  uk: Google Chrome — це швидкий і безпечний веббраузер від Google, що працює на рушієві Blink.
  vi: Google Chrome là trình duyệt web nhanh và an toàn do Google xây dựng, dựa trên engine Blink.
x:
  source: https://chromium.googlesource.com/chromium/src/
  brew: google-chrome
  pacman: google-chrome
  yay: google-chrome
  scoop: googlechrome
  choco: googlechrome
  winget: Google.Chrome
  apt: google-chrome-stable
  dnf: google-chrome-stable
  flatpak: com.google.Chrome
  snap: chrome
rule:
  (linux|debian|ubuntu|kali|raspbian|mint)/apt:
    cmd: 'wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && sudo apt install -y ./google-chrome-stable_current_amd64.deb'
    reference: https://www.google.com/chrome/linux/
    dsnap: google-chrome-stable
  (linux|fedora|rhel|centos)/dnf:
    cmd: 'sudo dnf install -y https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm'
    reference: https://www.google.com/chrome/linux/
    dsnap: google-chrome-stable
  (linux|arch|manjaro)/pacman:
    cmd: sudo pacman -U https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=google-chrome
    reference: https://aur.archlinux.org/packages/google-chrome
  (linux|arch|manjaro)/yay:
    cmd: yay -S google-chrome
    reference: https://aur.archlinux.org/packages/google-chrome
  darwin/brew:
    cmd: brew install --cask google-chrome
    reference: https://formulae.brew.sh/cask/google-chrome
  (win|wsl2)/scoop:
    cmd: x scoop install googlechrome
    reference: https://scoop.sh/#/apps?q=googlechrome
  (win|wsl2)/winget:
    cmd: x winget install -e --id Google.Chrome
    reference: https://winget.run/pkg/Google/Chrome
  (win|wsl2)/choco:
    cmd: x choco install googlechrome
    reference: https://community.chocolatey.org/packages/googlechrome
  /flatpak:
    cmd: flatpak install flathub com.google.Chrome
    reference: https://flathub.org/apps/com.google.Chrome
  /snap:
    cmd: sudo snap install chrome
    reference: https://snapcraft.io/chrome
binlist:
- google-chrome
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置、扩展、缓存
          en: Reads config, extensions, cache
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 350 MB
          rating: 2
          desc:
            cn: 约 350 MB 安装
            en: ~350 MB install
      paths:
        data:
          - ~/.config/google-chrome
        config:
          - ~/.config/google-chrome
    memory:
      idle:
        estimate: 300 MB
        desc:
          cn: 约 300 MB 闲置
          en: ~300 MB idle
    cpu:
      workload: ['io', 'compute']
      processes: 8
      peak:
        rating: 2
        desc:
          cn: 中
          en: Medium
  platform:
    win: full
    linux: full
    darwin: full