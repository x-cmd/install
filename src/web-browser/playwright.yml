lang: TypeScript
homepage: https://github.com/microsoft/playwright
license: Apache-2.0
desc:
  cn: Playwright 是一个 Web 测试和自动化的框架，它允许用一个 API 测试 Chromium、 Firefox 和 WebKit
  en: Playwright is a framework for Web Testing and Automation. It allows testing Chromium, Firefox and WebKit with a single API
x:
  pkg:
    exist: true
  source: https://github.com/microsoft/playwright
rule:
  /x:
    cmd: x pkg use playwright
    reference: https://x-cmd.com/install/
  /npx:
    cmd: npx playwright
    reference: https://playwright.dev/docs/cli
  /npm:
    cmd: npm install -g playwright
    reference: https://playwright.dev/docs/cli
    dsnap: playwright
binlist:
- playwright

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 513 KB
          rating: 1
          desc:
            cn: 约 513 KB（估算）
            en: ~513 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
