lang: Rust
homepage: https://github.com/vercel-labs/agent-browser
license: apache-2.0
desc:
  cn: 面向 AI Agent 的浏览器自动化 CLI
  en: Browser automation CLI for AI agents
x:
  source: https://github.com/vercel-labs/agent-browser
  eget: https://github.com/vercel-labs/agent-browser
rule:
  /eget:
    cmd: x eget vercel-labs/agent-browser
    reference: https://github.com/vercel-labs/agent-browser
binlist:
- agent-browser

# already profiled
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 安装 14 MB
            en: 14 MB install
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
