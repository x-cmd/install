lang: Rust
homepage: https://github.com/vercel-labs/agent-browser
license: apache-2.0
desc:
  cn: 面向 AI Agent 的浏览器自动化 CLI
  en: Browser automation CLI for AI agents
x:
  source: https://github.com/vercel-labs/agent-browser
  eget: https://github.com/vercel-labs/agent-browser
rule:
  /eget:
    cmd: x eget vercel-labs/agent-browser
    reference: https://github.com/vercel-labs/agent-browser
binlist:
- agent-browser

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.6 MB
          rating: 1
          desc:
            cn: 约 3.6 MB（估算）
            en: ~3.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
