lang: Postscript/python
homepage: https://github.com/rrthomas/psutils
license: GPL-3.0
desc:
  cn: PSUtils 是一套用于操作 PDF 和 PostScript 文档的实用程序
  en: PSUtils is a suite of utilities for manipulating PDF and PostScript documents
x:
  source: https://github.com/rrthomas/psutils
  eget: https://github.com/rrthomas/psutils
rule:
  /eget:
    cmd: x eget rrthomas/psutils
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install pspdfutils
    reference: https://github.com/rrthomas/psutils?tab=readme-ov-file#installation
    dsnap: pspdfutils
binlist:
- pspdfutils
