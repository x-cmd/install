lang: Postscript/python
homepage: https://github.com/rrthomas/psutils
license: GPL-3.0
desc:
  cn: PSUtils 是一套用于操作 PDF 和 PostScript 文档的实用程序
  en: PSUtils is a suite of utilities for manipulating PDF and PostScript documents
x:
  source: https://github.com/rrthomas/psutils
  eget: https://github.com/rrthomas/psutils
rule:
  /eget:
    cmd: x eget rrthomas/psutils
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install pspdfutils
    reference: https://github.com/rrthomas/psutils?tab=readme-ov-file#installation
    dsnap: pspdfutils
binlist:
- pspdfutils

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
