lang: Postscript/python
homepage: https://github.com/rrthomas/psutils
license: GPL-3.0
desc:
  cn: PSUtils 是一套用于操作 PDF 和 PostScript 文档的实用程序
  en: PSUtils is a suite of utilities for manipulating PDF and PostScript documents
x:
  source: https://github.com/rrthomas/psutils
  eget: https://github.com/rrthomas/psutils
  pip: pspdfutils
rule:
  /eget:
    cmd: x eget rrthomas/psutils
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install pspdfutils
    reference: https://github.com/rrthomas/psutils?tab=readme-ov-file#installation
    dsnap: pspdfutils
binlist:
- pspdfutils

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
