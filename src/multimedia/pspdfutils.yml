lang: Postscript/python
homepage: https://github.com/rrthomas/psutils
license: GPL-3.0
desc:
  cn: PSUtils 是一套用于操作 PDF 和 PostScript 文档的实用程序
  en: PSUtils is a suite of utilities for manipulating PDF and PostScript documents
  cs: PSUtils je sada nástrojů pro práci s dokumenty PDF a PostScript
  de: PSUtils ist eine Sammlung von Werkzeugen zum Bearbeiten von PDF- und PostScript-Dokumenten
  es: PSUtils es un conjunto de utilidades para manipular documentos PDF y PostScript
  fr: PSUtils est une suite d'outils permettant de manipuler des documents PDF et PostScript
  id: PSUtils adalah rangkaian utilitas untuk memanipulasi dokumen PDF dan PostScript
  it: PSUtils è una suite di utilità per manipolare documenti PDF e PostScript
  ja: PSUtils は PDF と PostScript のドキュメントを操作するためのユーティリティ集です
  ko: PSUtils는 PDF 및 PostScript 문서를 처리하는 유틸리티 모음입니다
  pl: PSUtils to zestaw narzędzi do manipulowania dokumentami PDF i PostScript
  pt: PSUtils é um conjunto de utilitários para manipular documentos PDF e PostScript
  ro: PSUtils este o suită de utilitare pentru manipularea documentelor PDF și PostScript
  ru: PSUtils — набор утилит для работы с документами PDF и PostScript
  th: PSUtils คือชุดเครื่องมือสำหรับจัดการเอกสาร PDF และ PostScript
  tr: PSUtils, PDF ve PostScript belgelerini düzenlemek için bir araç setidir
  uk: PSUtils — набір утиліт для роботи з документами PDF і PostScript
  vi: PSUtils là bộ tiện ích để thao tác với tài liệu PDF và PostScript
x:
  source: https://github.com/rrthomas/psutils
  eget: rrthomas/psutils
  pip: pspdfutils
rule:
  /eget:
    cmd: x eget rrthomas/psutils
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install pspdfutils
    reference: https://github.com/rrthomas/psutils?tab=readme-ov-file#installation
    dsnap: pspdfutils
binlist:
- pspdfutils

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
