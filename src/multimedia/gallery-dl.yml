lang: Python
homepage: https://github.com/mikf/gallery-dl
license: GPL-2.0
desc:
  cn: 用于从多个图像托管站点下载图像库和集合的命令行工具
  en: Command-line program to download image galleries and collections from several image hosting sites
  cs: Program příkazové řádky ke stahování obrazových galerií a sbírek z několika hostitelů obrázků
  de: Kommandozeilenprogramm zum Herunterladen von Bildergalerien und Sammlungen von mehreren Bild-Hosts
  es: Programa de línea de comandos para descargar galerías y colecciones de imágenes de varios sitios de alojamiento de imágenes
  fr: Programme en ligne de commande pour télécharger des galeries et collections d'images depuis plusieurs sites d'hébergement d'images
  id: Program baris perintah untuk mengunduh galeri dan koleksi gambar dari beberapa situs hosting gambar
  it: Programma da riga di comando per scaricare gallerie e collezioni di immagini da diversi siti di hosting di immagini
  ja: 複数の画像ホスティングサイトから画像ギャラリーとコレクションをダウンロードするコマンドラインプログラム
  ko: 여러 이미지 호스팅 사이트에서 이미지 갤러리와 컬렉션을 다운로드하는 명령줄 프로그램
  pl: Program wiersza polecenia do pobierania galerii i kolekcji obrazów z kilku witryn hostujących obrazy
  pt: Programa de linha de comando para baixar galerias e coleções de imagens de vários sites de hospedagem de imagens
  ro: Program de linie de comandă pentru descărcarea galeriilor și colecțiilor de imagini de pe mai multe site-uri de găzduire de imagini
  ru: Программа командной строки для загрузки галерей и коллекций изображений с нескольких сайтов хостинга изображений
  th: โปรแกรมบรรทัดคำสั่งสำหรับดาวน์โหลดแกลเลอรีและคอลเลกชันรูปภาพจากหลายเว็บไซต์จัดเก็บรูปภาพ
  tr: Çeşitli görsel barındırma sitelerinden görsel galerileri ve koleksiyonları indirmek için komut satırı programı
  uk: Програма командного рядка для завантаження галерей і колекцій зображень із кількох сайтів хостингу зображень
  vi: Chương trình dòng lệnh để tải thư viện và bộ sưu tập hình ảnh từ nhiều trang lưu trữ hình ảnh
x:
  source: https://github.com/mikf/gallery-dl
  apt: yt-dlp
  brew: gallery-dl
  snap: gallery-dl
  port: gallery-dl
  scoop: gallery-dl
  choco: gallery-dl
  winget: yt-dlp
  yay: gallery-dl
  asdf: gallery-dl
  pacman: yt-dlp
rule:
  /x:
    cmd: x pkg use gallery-dl
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use gallery-dl
    reference: https://github.com/iul1an/asdf-gallery-dl
  /pip:
    cmd: python3 -m pip install -U gallery-dl
    reference: https://github.com/mikf/gallery-dl#pip
    dsnap: gallery-dl
  /snap:
    cmd: sudo snap install gallery-dl
    reference: https://github.com/mikf/gallery-dl#snap
  darwin/brew:
    cmd: brew install gallery-dl
    reference: https://github.com/mikf/gallery-dl#homebrew
  debian/apt:
    cmd: 'sudo add-apt-repository ppa:tomtomtom/yt-dlp

      sudo apt update

      sudo apt install yt-dlp

      '
    reference: https://github.com/yt-dlp/yt-dlp/wiki/Installation#apt
  ubuntu/apt:
    cmd: 'sudo add-apt-repository ppa:tomtomtom/yt-dlp

      sudo apt update

      sudo apt install yt-dlp

      '
    reference: https://github.com/yt-dlp/yt-dlp/wiki/Installation#apt
  arch/pacman:
    cmd: sudo pacman -Syu yt-dlp
    reference: https://github.com/yt-dlp/yt-dlp/wiki/Installation#pacman
  arch/yay:
    cmd: yay -S gallery-dl
    reference: https://aur.archlinux.org/packages/gallery-dl
  darwin/port:
    cmd: sudo port selfupdate && sudo port install gallery-dl
    reference: https://github.com/mikf/gallery-dl#macports
  alpine/apk:
    cmd: doas apk -U add yt-dlp
    reference: https://github.com/yt-dlp/yt-dlp/wiki/Installation#alpine-linux
  (win|wsl2)/winget:
    cmd: x winget install yt-dlp
    reference: https://github.com/yt-dlp/yt-dlp/wiki/Installation#winget
  (win|wsl2)/scoop:
    cmd: x scoop install gallery-dl
    reference: https://github.com/mikf/gallery-dl#scoop
  (win|wsl2)/choco:
    cmd: x choco install gallery-dl
    reference: https://github.com/mikf/gallery-dl#chocolatey
binlist:
- gallery-dl

# complicated
