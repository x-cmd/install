lang: Rust
homepage: https://github.com/chaosprint/asak
license: MIT
desc:
  cn: 一个用 Rust 编写的带有 TUI 的跨平台音频录制/播放 CLI 工具
  en: A cross-platform audio recording/playback CLI tool with TUI, written in Rust.
x:
  source: https://github.com/chaosprint/asak
rule:
  /cargo:
    cmd: cargo install asak
    reference: https://github.com/chaosprint/asak?tab=readme-ov-file#install
    dsnap: asak
  arch/yay:
    cmd: yay -S asak
    reference: https://aur.archlinux.org/packages/asak
binlist:
  - asak


footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
