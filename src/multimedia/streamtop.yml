lang: Rust
homepage: https://github.com/Jorji49/streamtop
license: MIT
desc:
  en: streamtop is a Rust TUI/CLI for monitoring HLS, DASH, IPTV and WHEP streams — wire probes, TR 101 290, SCTE-35, linter score, Prometheus metrics and CI-friendly summary JSON.
  cn: streamtop 是用 Rust 写的 TUI/CLI，监控 HLS、DASH、IPTV 与 WHEP 流：线缆探测、TR 101 290、SCTE-35、linter 评分、Prometheus 指标与 CI 友好的 JSON 摘要。
  cs: streamtop je TUI/CLI v Rustu pro monitorování streamů HLS, DASH, IPTV a WHEP — sondy na drát, TR 101 290, SCTE-35, skóre linteru, metriky Prometheus a souhrnný JSON vhodný pro CI.
  de: streamtop ist eine TUI/CLI in Rust zur Überwachung von HLS-, DASH-, IPTV- und WHEP-Streams — Kabelproben, TR 101 290, SCTE-35, Linter-Score, Prometheus-Metriken und CI-freundliche Zusammenfassungs-JSON.
  es: streamtop es una TUI/CLI en Rust para supervisar transmisiones HLS, DASH, IPTV y WHEP — sondas de cable, TR 101 290, SCTE-35, puntuación del linter, métricas de Prometheus y JSON de resumen compatible con CI.
  fr: streamtop est une TUI/CLI en Rust pour surveiller les flux HLS, DASH, IPTV et WHEP — sondes filaires, TR 101 290, SCTE-35, score du linter, métriques Prometheus et JSON récapitulatif adapté à la CI.
  id: streamtop adalah TUI/CLI berbasis Rust untuk memantau stream HLS, DASH, IPTV, dan WHEP — probe kabel, TR 101 290, SCTE-35, skor linter, metrik Prometheus, dan ringkasan JSON yang ramah CI.
  it: streamtop è una TUI/CLI in Rust per monitorare stream HLS, DASH, IPTV e WHEP — sonde via cavo, TR 101 290, SCTE-35, punteggio del linter, metriche Prometheus e JSON di riepilogo compatibile con CI.
  ja: streamtop は HLS、DASH、IPTV、WHEP ストリームを監視する Rust 製の TUI/CLI — ケーブルプローブ、TR 101 290、SCTE-35、linter スコア、Prometheus メトリクス、CI 向けのサマリー JSON。
  ko: streamtop는 HLS, DASH, IPTV, WHEP 스트림을 모니터링하는 Rust 기반 TUI/CLI 입니다 — 와이어 프로브, TR 101 290, SCTE-35, linter 점수, Prometheus 메트릭, CI 친화적 요약 JSON.
  pl: streamtop to TUI/CLI w Rustie do monitorowania strumieni HLS, DASH, IPTV i WHEP — sondy przewodowe, TR 101 290, SCTE-35, wynik lintera, metryki Prometheus i podsumowanie JSON przyjazne CI.
  pt: streamtop é uma TUI/CLI em Rust para monitorar streams HLS, DASH, IPTV e WHEP — sondas de fio, TR 101 290, SCTE-35, pontuação do linter, métricas do Prometheus e JSON de resumo amigável para CI.
  ro: streamtop este o TUI/CLI în Rust pentru monitorizarea fluxurilor HLS, DASH, IPTV și WHEP — sonde pe cablu, TR 101 290, SCTE-35, scorul linterului, metrici Prometheus și JSON rezumat prietenos cu CI.
  ru: streamtop — TUI/CLI на Rust для мониторинга потоков HLS, DASH, IPTV и WHEP — кабельные зонды, TR 101 290, SCTE-35, оценка линтера, метрики Prometheus и сводный JSON, удобный для CI.
  th: streamtop คือ TUI/CLI ที่เขียนด้วย Rust สำหรับตรวจสอบสตรีม HLS, DASH, IPTV และ WHEP — การสำรวจสายสัญญาณ, TR 101 290, SCTE-35, คะแนนจาก linter, เมตริก Prometheus และ JSON สรุปที่เข้ากับ CI
  tr: streamtop, HLS, DASH, IPTV ve WHEP akışlarını izlemek için Rust ile yazılmış bir TUI/CLI'dır — kablo probları, TR 101 290, SCTE-35, linter puanı, Prometheus metrikleri ve CI uyumlu özet JSON.
  uk: streamtop — TUI/CLI на Rust для моніторингу потоків HLS, DASH, IPTV та WHEP — дротові зонди, TR 101 290, SCTE-35, оцінка лінтера, метрики Prometheus та зведений JSON, зручний для CI.
  vi: streamtop là TUI/CLI viết bằng Rust để giám sát các luồng HLS, DASH, IPTV và WHEP — dò dây, TR 101 290, SCTE-35, điểm linter, số liệu Prometheus và JSON tóm tắt thân thiện với CI.
x:
  source: https://github.com/Jorji49/streamtop
  eget: Jorji49/streamtop
  brew: Jorji49/tap/streamtop
  cargo: streamtop
  yay: streamtop-bin
rule:
  /eget:
    cmd: x eget Jorji49/streamtop
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install streamtop
    reference: https://github.com/Jorji49/streamtop
    dsnap: streamtop
  /cargo-binstall:
    cmd: cargo binstall streamtop
    reference: https://github.com/Jorji49/streamtop
    dsnap: streamtop
  darwin/brew:
    cmd: 'brew tap Jorji49/tap && brew install streamtop'
    reference: https://github.com/Jorji49/streamtop
  arch/yay:
    cmd: makepkg -si -p dist/aur/PKGBUILD
    reference: https://github.com/Jorji49/streamtop?tab=readme-ov-file#arch-linux
  (win|wsl2)/scoop:
    cmd: 'scoop bucket add streamtop https://github.com/Jorji49/streamtop && scoop install streamtop'
    reference: https://github.com/Jorji49/streamtop
binlist:
- streamtop

# complicated
footprint:
  behavior:
    runtime:
      type: ['tui', 'cli']
    network:
      listen: localhost
      connect:
        localhost: false
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取用户指定的流、清单与日志
          en: Reads user-specified streams, manifests and logs
        sensitive: []
      write:
        desc:
          cn: 写出诊断 JSON/HAR/SARIF 报告
          en: Writes diagnostic JSON / HAR / SARIF reports
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 约 20 MB 安装
            en: ~20 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64 tar.gz)
            en: ~7 MB download (linux/x64 tar.gz)
      paths:
        data:
          - ~/.local/share/streamtop/
        config:
          - ~/.config/streamtop/
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 约 80 MB 闲置
          en: ~80 MB idle
    cpu:
      workload: ['compute', 'network', 'io']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 中等（持续轮询与解析）
          en: Moderate (continuous polling & parsing)
  platform:
    win: full
    linux: full
    darwin: full
