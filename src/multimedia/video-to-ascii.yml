lang: Python
desc:
  cn: 一个简单的 python 包，用于使用 ASCII 字符在终端中播放视频
  en: A simple python package for playing videos in the terminal using ASCII characters
homepage: https://github.com/joelibaceta/video-to-ascii
license: MIT
x:
  source: https://github.com/joelibaceta/video-to-ascii
  pip: video-to-ascii
rule:
  /x:
    cmd: x pkg use video-to-ascii
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip3 install video-to-ascii --install-option="--with-audio"
    reference: https://github.com/joelibaceta/video-to-ascii?tab=readme-ov-file#installation
    dsnap: video-to-ascii
binlist:
- video-to-ascii

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
