lang: Python
desc:
  cn: 一个简单的 python 包，用于使用 ASCII 字符在终端中播放视频
  en: A simple python package for playing videos in the terminal using ASCII characters
homepage: https://github.com/joelibaceta/video-to-ascii
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/joelibaceta/video-to-ascii
rule:
  /x:
    cmd: x pkg use video-to-ascii
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip3 install video-to-ascii --install-option="--with-audio"
    reference: https://github.com/joelibaceta/video-to-ascii?tab=readme-ov-file#installation
    dsnap: video-to-ascii
binlist:
- video-to-ascii

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
