lang: 'Rust'
homepage: https://github.com/pls-rs/pls
license: 'GPL-3.0'
desc:
  cn: 为专业人士打造的更美观、更强大的 ls(1)
  en: 'pls is a prettier and powerful ls(1) for the pros.'
x:
  source: https://github.com/pls-rs/pls
  eget: pls-rs/pls
rule:
  /eget:
    cmd: x eget pls-rs/pls
    reference: https://github.com/pls-rs/pls
binlist:
  - 'pls'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 235 KB
          rating: 1
          desc:
            cn: 约 235 KB（估算）
            en: ~235 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
