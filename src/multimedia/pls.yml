lang: 'Rust'
homepage: https://github.com/pls-rs/pls
license: 'GPL-3.0'
desc:
  cn: 为专业人士打造的更美观、更强大的 ls(1)
  en: 'pls is a prettier and powerful ls(1) for the pros.'
x:
  source: https://github.com/pls-rs/pls
  eget: https://github.com/pls-rs/pls
rule:
  /eget:
    cmd: x eget pls-rs/pls
    reference: https://github.com/pls-rs/pls
binlist:
  - 'pls'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
