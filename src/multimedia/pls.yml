lang: 'Rust'
homepage: https://github.com/pls-rs/pls
license: 'GPL-3.0'
desc:
  cn: 为专业人士打造的更美观、更强大的 ls(1)
  en: 'pls is a prettier and powerful ls(1) for the pros.'
  cs: pls je krásnější a výkonnější ls(1) pro profesiony.
  de: pls ist ein schöneres und mächtigeres ls(1) für Profis.
  es: pls es un ls(1) más bonito y potente para profesionales.
  fr: pls est un ls(1) plus beau et plus puissant pour les professionnels.
  id: pls adalah ls(1) yang lebih cantik dan kuat untuk para profesional.
  it: pls è un ls(1) più bello e potente per i professionisti.
  ja: pls はプロのためのより美しく強力な ls(1) です。
  ko: pls는 전문가를 위한 더 보기 좋고 강력한 ls(1)입니다.
  pl: pls to ładniejsze i potężniejsze ls(1) dla profesjonalistów.
  pt: pls é um ls(1) mais bonito e poderoso para profissionais.
  ro: pls este un ls(1) mai frumos și mai puternic pentru profesioniști.
  ru: pls — более красивый и мощный ls(1) для профессионалов.
  th: pls คือ ls(1) ที่สวยงามและทรงพลังกว่าสำหรับมืออาชีพ
  tr: pls, profesyoneller için daha güzel ve güçlü bir ls(1).
  uk: pls — гарніший і потужніший ls(1) для професіоналів.
  vi: pls là lệnh ls(1) đẹp hơn và mạnh mẽ hơn dành cho dân chuyên.
x:
  source: https://github.com/pls-rs/pls
  eget: pls-rs/pls
rule:
  /eget:
    cmd: x eget pls-rs/pls
    reference: https://github.com/pls-rs/pls
binlist:
  - 'pls'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 235 KB
          rating: 1
          desc:
            cn: 约 235 KB（估算）
            en: ~235 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
