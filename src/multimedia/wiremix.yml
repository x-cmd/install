lang: 'Rust'
homepage: 'https://github.com/tsowell/wiremix'
license: 'Apache-2.0'
desc:
  cn: 面向 PipeWire 的简洁 TUI 音频混音器
  en: 'Simple TUI audio mixer for PipeWire'
x:
  source: https://github.com/tsowell/wiremix
  eget: https://github.com/tsowell/wiremix
rule:
  /cargo:
    cmd: 'cargo install wiremix'
    reference: https://github.com/tsowell/wiremix
  debian/apt:
    cmd: 'sudo apt install cargo libpipewire-0.3-dev pkg-config clang'
    reference: https://github.com/tsowell/wiremix
  /eget:
    cmd: x eget tsowell/wiremix
    reference: https://github.com/tsowell/wiremix
binlist:
  - 'wiremix'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
