lang: 'Rust'
homepage: 'https://github.com/tsowell/wiremix'
license: 'Apache-2.0'
desc:
  cn: 面向 PipeWire 的简洁 TUI 音频混音器
  en: 'Simple TUI audio mixer for PipeWire'
x:
  source: https://github.com/tsowell/wiremix
  eget: tsowell/wiremix
  apt: cargo
  cargo: wiremix
rule:
  /cargo:
    cmd: 'cargo install wiremix'
    reference: https://github.com/tsowell/wiremix
  debian/apt:
    cmd: 'sudo apt install cargo libpipewire-0.3-dev pkg-config clang'
    reference: https://github.com/tsowell/wiremix
  /eget:
    cmd: x eget tsowell/wiremix
    reference: https://github.com/tsowell/wiremix
binlist:
  - 'wiremix'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 362 KB
          rating: 1
          desc:
            cn: 约 362 KB（估算）
            en: ~362 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
