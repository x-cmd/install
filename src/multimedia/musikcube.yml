lang: 'C++'
homepage: https://github.com/clangen/musikcube
license: 'BSD-3-Clause'
desc:
  cn: C++ 编写的跨平台终端音乐播放器、音频引擎、元数据索引器和服务器
  en: 'a cross-platform, terminal-based music player, audio engine, metadata indexer, and server in c++'
x:
  source: https://github.com/clangen/musikcube
  eget: https://github.com/clangen/musikcube
rule:
  darwin/brew:
    cmd: 'brew install musikcube'
    reference: https://github.com/clangen/musikcube
  /eget:
    cmd: x eget clangen/musikcube
    reference: https://github.com/clangen/musikcube
binlist:
- 'musikcube'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
