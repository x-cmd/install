lang: 'C++'
homepage: https://github.com/clangen/musikcube
license: 'BSD-3-Clause'
desc:
  cn: C++ 编写的跨平台终端音乐播放器、音频引擎、元数据索引器和服务器
  en: 'a cross-platform, terminal-based music player, audio engine, metadata indexer, and server in c++'
x:
  source: https://github.com/clangen/musikcube
  eget: https://github.com/clangen/musikcube
rule:
  darwin/brew:
    cmd: 'brew install musikcube'
    reference: https://github.com/clangen/musikcube
  /eget:
    cmd: x eget clangen/musikcube
    reference: https://github.com/clangen/musikcube
binlist:
  - 'musikcube'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
