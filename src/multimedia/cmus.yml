lang: C
homepage: https://github.com/cmus/cmus
license: GPL-2.0
desc:
  cn: cmus 是一个小巧、快速且功能强大的控制台音乐播放器，适用于类 Unix 操作系统。
  en: cmus is a small, fast and powerful console music player for Unix-like operating systems.
x:
  source: https://github.com/cmus/cmus
rule:
  darwin/brew:
    cmd: brew install cmus
    reference: https://formulae.brew.sh/formula/cmus#default
  debian/apt:
    cmd: sudo apt-get install cmus
    reference: https://command-not-found.com/cmus
    dsnap: cmus
  ubuntu/apt:
    cmd: sudo apt-get install cmus
    reference: https://command-not-found.com/cmus
    dsnap: cmus
  kali/apt:
    cmd: sudo apt-get install cmus
    reference: https://command-not-found.com/cmus
    dsnap: cmus
  raspbian/apt:
    cmd: sudo apt-get install cmus
    reference: https://command-not-found.com/cmus
  mint/apt:
    cmd: sudo apt-get install cmus
    reference: https://command-not-found.com/cmus
  alpine/apk:
    cmd: apk add cmus
    reference: https://command-not-found.com/cmus
    dsnap: cmus
  arch/pacman:
    cmd: sudo pacman -S cmus
    reference: https://command-not-found.com/cmus
  opensuse/zypper:
    cmd: sudo zypper install cmus
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=cmus
binlist:
- cmus

footprint:
