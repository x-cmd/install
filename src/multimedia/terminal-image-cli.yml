lang: JavaScript
homepage: https://github.com/sindresorhus/terminal-image-cli#readme
license: MIT
desc:
  en: Display images in the terminal
  cn: 在终端中显示图像
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/terminal-image-cli#readme
rule:
  /x:
    cmd: x pkg use terminal-image-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global terminal-image-cli
    reference: https://github.com/sindresorhus/terminal-image-cli?tab=readme-ov-file#install
    dsnap: terminal-image-cli
binlist:
- terminal-image-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
