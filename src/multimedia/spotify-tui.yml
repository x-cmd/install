lang: Rust
homepage: https://github.com/Rigellute/spotify-tui
license: MIT
desc:
  cn: 一个用 Rust 编写的终端版 Spotify 客户端。
  en: A Spotify client for the terminal written in Rust.
  cs: Klient Spotify pro terminál napsaný v Rustu.
  de: Ein in Rust geschriebener Spotify-Client für das Terminal.
  es: Un cliente de Spotify para el terminal escrito en Rust.
  fr: Un client Spotify pour le terminal écrit en Rust.
  id: Klien Spotify untuk terminal yang ditulis dengan Rust.
  it: Un client Spotify per il terminale scritto in Rust.
  ja: Rust で書かれたターミナル向け Spotify クライアントです。
  ko: Rust로 작성된 터미널용 Spotify 클라이언트입니다.
  pl: Klient Spotify dla terminala napisany w Rust.
  pt: Um cliente do Spotify para o terminal escrito em Rust.
  ro: Un client Spotify pentru terminal scris în Rust.
  ru: Клиент Spotify для терминала, написанный на Rust.
  th: ไคลเอนต์ Spotify สำหรับเทอร์มินัลที่เขียนด้วย Rust
  tr: Rust ile yazılmış terminal için bir Spotify istemcisi.
  uk: Клієнт Spotify для термінала, написаний на Rust.
  vi: Ứng dụng khách Spotify cho terminal viết bằng Rust.
x:
  source: https://github.com/Rigellute/spotify-tui
  eget: Rigellute/spotify-tui
  dnf: spotify-tui
  brew: spotify-tui
  snap: spt
  scoop: spotify-tui
  yay: spotify-tui
  cargo: spotify-tui
rule:
  /eget:
    cmd: x eget Rigellute/spotify-tui
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install spotify-tui
    reference: https://github.com/Rigellute/spotify-tui?tab=readme-ov-file#homebrew
  /snap:
    cmd: sudo snap install spt
    reference: https://github.com/Rigellute/spotify-tui?tab=readme-ov-file#snap
  arch/yay:
    cmd: yay -S spotify-tui
    reference: https://github.com/Rigellute/spotify-tui?tab=readme-ov-file#aur
  /nix-env:
    cmd: nix-env -iA nixpkgs.spotify-tui
    reference: https://github.com/Rigellute/spotify-tui?tab=readme-ov-file#nix
  void/xbps-install:
    cmd: sudo xbps-install -Su spotify-tui
    reference: https://github.com/Rigellute/spotify-tui?tab=readme-ov-file#void-linux
  fedora/dnf:
    cmd: sudo dnf copr enable atim/spotify-tui -y && sudo dnf install spotify-tui
    reference: https://github.com/Rigellute/spotify-tui?tab=readme-ov-file#fedoracentos
  centos/dnf:
    cmd: sudo dnf copr enable atim/spotify-tui -y && sudo dnf install spotify-tui
    reference: https://github.com/Rigellute/spotify-tui?tab=readme-ov-file#fedoracentos
  /cargo:
    cmd: cargo install spotify-tui
    reference: https://github.com/Rigellute/spotify-tui?tab=readme-ov-file#cargo
    dsnap: spotify-tui
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add scoop-bucket https://github.com/Rigellute/scoop-bucket && \

      x scoop install spotify-tui

      '
    reference: https://github.com/Rigellute/spotify-tui?tab=readme-ov-file#scoop-installer
binlist:
- spotify-tui

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/arm64)
            en: ~3 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
