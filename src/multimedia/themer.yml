lang: JavaScript
homepage: https://github.com/themerdev/themer#readme
license: MIT
desc:
  en: Customizable theme generator for editors, terminals, wallpaper, and more.
  cn: 可定制的编辑器、终端、壁纸等主题生成器。
x:
  pkg:
    exist: true
  source: https://github.com/themerdev/themer#readme
rule:
  /x:
    cmd: x pkg use themer
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g themer
    reference: https://github.com/themerdev/themer?tab=readme-ov-file#installation
    dsnap: themer
  arch/yay:
    cmd: yay -S themer
    reference: https://aur.archlinux.org/packages/themer
binlist:
- themer

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
