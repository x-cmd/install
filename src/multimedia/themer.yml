lang: JavaScript
homepage: https://github.com/themerdev/themer#readme
license: MIT
desc:
  en: Customizable theme generator for editors, terminals, wallpaper, and more.
  cn: 可定制的编辑器、终端、壁纸等主题生成器。
  cs: Přizpůsobitelný generátor motivů pro editory, terminály, tapety a další.
  de: Anpassbarer Themengenerator für Editoren, Terminals, Hintergrundbilder und mehr.
  es: Generador de temas personalizable para editores, terminales, fondos de pantalla y más.
  fr: Générateur de thèmes personnalisable pour éditeurs, terminaux, fonds d'écran et plus encore.
  id: Pembuat tema yang dapat dikustomisasi untuk editor, terminal, wallpaper, dan lainnya.
  it: Generatore di temi personalizzabile per editor, terminali, sfondi desktop e altro.
  ja: エディタ、ターミナル、壁紙など向けのカスタマイズ可能なテーマジェネレーター。
  ko: 편집기, 터미널, 배경화면 등을 위한 사용자 지정 가능한 테마 생성기.
  pl: Konfigurowalny generator motywów dla edytorów, terminali, tapet i nie tylko.
  pt: Gerador de temas personalizável para editores, terminais, papel de parede e mais.
  ro: Generator de teme personalizabil pentru editoare, terminale, fundal de ecran și multe altele.
  ru: Настраиваемый генератор тем для редакторов, терминалов, обоев и многого другого.
  th: เครื่องมือสร้างธีมที่ปรับแต่งได้สำหรับโปรแกรมแก้ไข เทอร์มินัล ภาพพื้นหลัง และอื่น ๆ
  tr: Editörler, terminaller, duvar kağıtları ve daha fazlası için özelleştirilebilir tema oluşturucu.
  uk: Налаштовуваний генератор тем для редакторів, терміналів, шпалер та іншого.
  vi: Trình tạo chủ đề tùy chỉnh cho trình biên tập, terminal, hình nền và nhiều hơn nữa.
x:
  source: https://github.com/themerdev/themer#readme
  yay: themer
  npm: themer
rule:
  /x:
    cmd: x pkg use themer
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g themer
    reference: https://github.com/themerdev/themer?tab=readme-ov-file#installation
    dsnap: themer
  arch/yay:
    cmd: yay -S themer
    reference: https://aur.archlinux.org/packages/themer
binlist:
- themer

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
