lang: C
homepage: https://gitlab.freedesktop.org/cairo/cairo
desc:
  cn: Cairo 是一个支持多种输出设备的 2D 图形库
  en: Cairo is a 2D graphics library with support for multiple output devices
rule:
  darwin/brew:
    cmd: brew install cairo
    reference: https://formulae.brew.sh/formula/cairo#default
  debian/apt:
    cmd: sudo apt-get install libcairo2-dev
    reference: https://cairographics.org/download/
    dsnap: libcairo2-dev
  ubuntu/apt:
    cmd: sudo apt-get install libcairo2-dev
    reference: https://cairographics.org/download/
    dsnap: libcairo2-dev
  fedora/yum:
    cmd: sudo yum install cairo-devel
    reference: https://cairographics.org/download/
  opensue/zypper:
    cmd: sudo zypper install cairo-devel
    reference: https://cairographics.org/download/
  darwin/port:
    cmd: sudo port install cairo
    reference: https://cairographics.org/download/
binlist:
- cairo
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
