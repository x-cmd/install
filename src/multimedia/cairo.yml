lang: C
homepage: https://gitlab.freedesktop.org/cairo/cairo
desc:
  cn: Cairo 是一个支持多种输出设备的 2D 图形库
  en: Cairo is a 2D graphics library with support for multiple output devices
  cs: Cairo je 2D grafická knihovna podporující více výstupních zařízení
  de: Cairo ist eine 2D-Grafikbibliothek mit Unterstützung für mehrere Ausgabegeräte
  es: Cairo es una biblioteca de gráficos 2D compatible con varios dispositivos de salida
  fr: Cairo est une bibliothèque graphique 2D prenant en charge plusieurs périphériques de sortie
  id: Cairo adalah pustaka grafis 2D yang mendukung berbagai perangkat keluaran
  it: Cairo è una libreria di grafica 2D con supporto per più dispositivi di output
  ja: Cairo は複数の出力デバイスに対応した 2D グラフィックスライブラリです
  ko: Cairo는 여러 출력 장치를 지원하는 2D 그래픽 라이브러리입니다
  pl: Cairo to biblioteka grafiki 2D z obsługą wielu urządzeń wyjściowych
  pt: Cairo é uma biblioteca de gráficos 2D com suporte a vários dispositivos de saída
  ro: Cairo este o bibliotecă de grafică 2D cu suport pentru mai multe dispozitive de ieșire
  ru: Cairo — библиотека 2D-графики с поддержкой различных устройств вывода
  th: Cairo คือไลบรารีกราฟิก 2D ที่รองรับอุปกรณ์แสดงผลหลายแบบ
  tr: Cairo, birden çok çıktı cihazını destekleyen 2D grafik kitaplığıdır
  uk: Cairo — бібліотека 2D-графіки з підтримкою кількох пристроїв виведення
  vi: Cairo là thư viện đồ họa 2D hỗ trợ nhiều thiết bị đầu ra
rule:
  darwin/brew:
    cmd: brew install cairo
    reference: https://formulae.brew.sh/formula/cairo#default
  debian/apt:
    cmd: sudo apt-get install libcairo2-dev
    reference: https://cairographics.org/download/
    dsnap: libcairo2-dev
  ubuntu/apt:
    cmd: sudo apt-get install libcairo2-dev
    reference: https://cairographics.org/download/
    dsnap: libcairo2-dev
  fedora/yum:
    cmd: sudo yum install cairo-devel
    reference: https://cairographics.org/download/
  opensue/zypper:
    cmd: sudo zypper install cairo-devel
    reference: https://cairographics.org/download/
  darwin/port:
    cmd: sudo port install cairo
    reference: https://cairographics.org/download/

x:
  apt: libcairo2-dev
  apt-get: libcairo2-dev
  dnf: cairo-devel
  yum: cairo-devel
  zypper: cairo-devel
  port: cairo
  brew: cairo
binlist:
- cairo
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
