lang: Rust
homepage: https://github.com/kornelski/cavif-rs
license: BSD-3-Clause
desc:
  cn: AVIF 图像的编码器/转换器
  en: Encoder/converter for AVIF images
x:
  source: https://github.com/kornelski/cavif-rs
rule:
  /cargo:
    cmd: cargo install cavif
    reference: https://lib.rs/crates/cavif
    dsnap: cavif
  arch/yay:
    cmd: yay -S cavif
    reference: https://aur.archlinux.org/packages/cavif
binlist:
- cavif

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
