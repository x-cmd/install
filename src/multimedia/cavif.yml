lang: Rust
homepage: https://github.com/kornelski/cavif-rs
license: BSD-3-Clause
desc:
  cn: AVIF 图像的编码器/转换器
  en: Encoder/converter for AVIF images
x:
  source: https://github.com/kornelski/cavif-rs
rule:
  /cargo:
    cmd: cargo install cavif
    reference: https://lib.rs/crates/cavif
    dsnap: cavif
  arch/yay:
    cmd: yay -S cavif
    reference: https://aur.archlinux.org/packages/cavif
binlist:
- cavif

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
