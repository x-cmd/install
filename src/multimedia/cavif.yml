lang: Rust
homepage: https://github.com/kornelski/cavif-rs
license: BSD-3-Clause
desc:
  cn: AVIF 图像的编码器/转换器
  en: Encoder/converter for AVIF images
  cs: Kodér/konvertér pro obrázky AVIF
  de: Encoder/Konverter für AVIF-Bilder
  es: Codificador/conversor para imágenes AVIF
  fr: Encodeur/convertisseur pour les images AVIF
  id: Encoder/konverter untuk gambar AVIF
  it: Encoder/converter per immagini AVIF
  ja: AVIF 画像用のエンコーダ/コンバーター
  ko: AVIF 이미지를 위한 인코더/컨버터
  pl: Enkoder/konwerter obrazów AVIF
  pt: Codificador/conversor para imagens AVIF
  ro: Codificator/convertor pentru imagini AVIF
  ru: Кодировщик/конвертер для изображений AVIF
  th: ตัวเข้ารหัส/ตัวแปลงสำหรับรูปภาพ AVIF
  tr: AVIF görüntüleri için kodlayıcı/dönüştürücü
  uk: Кодувальник/конвертер для зображень AVIF
  vi: Bộ mã hóa/chuyển đổi cho hình ảnh AVIF
x:
  source: https://github.com/kornelski/cavif-rs
  yay: cavif
  cargo: cavif
rule:
  /cargo:
    cmd: cargo install cavif
    reference: https://lib.rs/crates/cavif
    dsnap: cavif
  arch/yay:
    cmd: yay -S cavif
    reference: https://aur.archlinux.org/packages/cavif
binlist:
- cavif

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
