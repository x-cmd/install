lang: Go
homepage: https://github.com/pdfcpu/pdfcpu
license: Apache-2.0
desc:
  cn: pdfcpu 是一个用 Go 编写的支持加密的 PDF 处理库
  en: pdfcpu is a PDF processing library written in Go supporting encryption
x:
  pkg:
    exist: true
  source: https://github.com/pdfcpu/pdfcpu
  eget: https://github.com/pdfcpu/pdfcpu
rule:
  /x:
    cmd: x pkg use pdfcpu
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget pdfcpu/pdfcpu
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install pdfcpu
    reference: https://formulae.brew.sh/formula/pdfcpu#default
  arch/yay:
    cmd: yay -S pdfcpu
    reference: https://aur.archlinux.org/packages/pdfcpu
  fedora/dnf:
    cmd: sudo dnf install golang-github-pdfcpu
    reference: https://github.com/pdfcpu/pdfcpu#installation
    dsnap: golang-github-pdfcpu
binlist:
- pdfcpu

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
