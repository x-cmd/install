lang: Python
homepage: https://github.com/xgi/castero
license: MIT
desc:
  cn: castero 是用于终端的 TUI 播客客户端。
  en: castero is a TUI podcast client for the terminal.
  cs: castero je TUI podcastový klient pro terminál.
  de: castero ist ein TUI-Podcast-Client für das Terminal.
  es: castero es un cliente de podcast TUI para el terminal.
  fr: castero est un client podcast TUI pour le terminal.
  id: castero adalah klien podcast TUI untuk terminal.
  it: castero è un client podcast TUI per il terminale.
  ja: castero はターミナル向けの TUI ポッドキャストクライアントです。
  ko: castero는 터미널용 TUI 팟캐스트 클라이언트입니다.
  pl: castero to klient podcastów TUI dla terminala.
  pt: castero é um cliente de podcast TUI para o terminal.
  ro: castero este un client de podcast TUI pentru terminal.
  ru: castero — TUI-клиент подкастов для терминала.
  th: castero คือไคลเอนต์พ็อดแคสต์แบบ TUI สำหรับเทอร์มินัล
  tr: castero, terminal için bir TUI podcast istemcisidir.
  uk: castero — TUI-клієнт подкастів для термінала.
  vi: castero là trình khách podcast TUI cho terminal
x:
  source: https://github.com/xgi/castero
  yay: castero
  pip: castero
rule:
  /pip:
    cmd: pip3 install castero
    reference: https://github.com/xgi/castero?tab=readme-ov-file#installation
    dsnap: castero
  arch/yay:
    cmd: yay -S castero
    reference: https://aur.archlinux.org/packages/castero
binlist:
- castero

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
