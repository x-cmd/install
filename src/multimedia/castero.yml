lang: Python
homepage: https://github.com/xgi/castero
license: MIT
desc:
  cn: castero 是用于终端的 TUI 播客客户端。
  en: castero is a TUI podcast client for the terminal.
x:
  source: https://github.com/xgi/castero
rule:
  /pip:
    cmd: pip3 install castero
    reference: https://github.com/xgi/castero?tab=readme-ov-file#installation
    dsnap: castero
  arch/yay:
    cmd: yay -S castero
    reference: https://aur.archlinux.org/packages/castero
binlist:
- castero

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
