lang: Python
homepage: https://github.com/xgi/castero
license: MIT
desc:
  cn: castero 是用于终端的 TUI 播客客户端。
  en: castero is a TUI podcast client for the terminal.
x:
  source: https://github.com/xgi/castero
rule:
  /pip:
    cmd: pip3 install castero
    reference: https://github.com/xgi/castero?tab=readme-ov-file#installation
    dsnap: castero
  arch/yay:
    cmd: yay -S castero
    reference: https://aur.archlinux.org/packages/castero
binlist:
- castero

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
