desc:
  cn: 命令行录制工具，用于将终端的操作过程录制成视频文件
  en: Command line recording tool, used to record terminal operations into video files
homepage: https://github.com/charmbracelet/vhs
license: MIT
lang: Go
x:
  pkg:
    exist: true
  source: https://github.com/charmbracelet/vhs
  eget: https://github.com/charmbracelet/vhs
rule:
  /x:
    cmd: x pkg use vhs
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget charmbracelet/vhs
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use vhs
    reference: https://github.com/chessmango/asdf-vhs
  darwin/brew:
    cmd: brew install vhs
    reference: https://formulae.brew.sh/formula/vhs#default
  darwin/port:
    cmd: sudo port install vhs
    reference: https://github.com/charmbracelet/vhs#installation
  debian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo snap install ttyd --classic \

      && sudo apt update && sudo apt install vhs ffmpeg

      '
    reference: https://github.com/charmbracelet/vhs#installation
    dsnap: vhs
  ubuntu/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo snap install ttyd --classic \

      && sudo apt update && sudo apt install vhs ffmpeg

      '
    reference: https://github.com/charmbracelet/vhs#installation
    dsnap: vhs
  alpine/apk:
    cmd: sudo apk add vhs
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#alpine-linux
  arch/pacman:
    cmd: sudo pacman -S vhs
    reference: https://docs.helix-editor.com/install.html#arch-linux-extra
  kali/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo snap install ttyd --classic \

      && sudo apt update && sudo apt install vhs ffmpeg

      '
    reference: https://github.com/charmbracelet/vhs#installation
    dsnap: vhs
  fedora/yum:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' \

      && sudo tee /etc/yum.repos.d/charm.repo \

      && sudo snap install ttyd --classic \

      && sudo yum install vhs ffmpeg

      '
    reference: https://github.com/charmbracelet/vhs#installation
  rhel/yum:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' \

      && sudo tee /etc/yum.repos.d/charm.repo \

      && sudo snap install ttyd --classic \

      && sudo yum install vhs ffmpeg

      '
    reference: https://github.com/charmbracelet/vhs#installation
  raspbian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo snap install ttyd --classic \

      && sudo apt update && sudo apt install vhs ffmpeg

      '
    reference: https://github.com/charmbracelet/vhs#installation
  (win|wsl2)/scoop:
    cmd: x scoop install vhs
    reference: https://github.com/charmbracelet/vhs#installation
  nix/nixpkgs:
    cmd: nix-env -iA nixpkgs.vhs
    reference: https://docs.helix-editor.com/install.html#nixos
  void/xbps:
    cmd: sudo xbps-install vhs
    reference: https://github.com/charmbracelet/vhs#installation
binlist:
- vhs

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
