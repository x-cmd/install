lang: Python
homepage: https://github.com/scottrogowski/code2flow
license: MIT
desc:
  cn: 将 Python 和 JavaScript 代码转换为 DOT 流程图
  en: Code2flow generates call graphs for dynamic programming language
x:
  pkg:
    exist: true
  source: https://github.com/scottrogowski/code2flow
rule:
  /x:
    cmd: x pkg use code2flow
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install code2flow
    reference: https://github.com/scottrogowski/code2flow?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S python-code2flow
    reference: https://aur.archlinux.org/packages/python-code2flow
binlist:
- code2flow

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 32 KB
          rating: 1
          desc:
            cn: 约 32 KB（估算）
            en: ~32 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
