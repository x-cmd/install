lang: C
homepage: https://chromium.googlesource.com/webm/libwebp
desc:
  cn: WebP 编码器工具
  en: WebP encoder tool
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use cwebp
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install webp
    reference: https://formulae.brew.sh/formula/webp
binlist:
- cwebp
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
