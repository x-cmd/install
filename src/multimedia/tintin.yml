lang: C
homepage: https://github.com/scandum/tintin
license: GPL-3.0
desc:
  cn: TinTin++（又称 tt++）是一款免费的 MUD 客户端，支持 Android、iOS、Linux、Mac OS X 和 Windows。
  en: TinTin++ (aka tt++) is a free Mud client for Android, iOS, Linux, Mac OS X and Windows.
  cs: TinTin++ (také tt++) je bezplatný MUD klient pro Android, iOS, Linux, Mac OS X a Windows.
  de: TinTin++ (auch tt++) ist ein kostenloser MUD-Client für Android, iOS, Linux, Mac OS X und Windows.
  es: TinTin++ (también conocido como tt++) es un cliente MUD gratuito para Android, iOS, Linux, Mac OS X y Windows.
  fr: TinTin++ (également appelé tt++) est un client MUD gratuit pour Android, iOS, Linux, Mac OS X et Windows.
  id: TinTin++ (disebut tt++) adalah klien MUD gratis untuk Android, iOS, Linux, Mac OS X, dan Windows.
  it: TinTin++ (aka tt++) è un client MUD gratuito per Android, iOS, Linux, Mac OS X e Windows.
  ja: TinTin++ (別名 tt++) は Android、iOS、Linux、Mac OS X、Windows 向けの無料の MUD クライアントです。
  ko: TinTin++ (tt++라고도 함)는 Android, iOS, Linux, Mac OS X, Windows용 무료 MUD 클라이언트입니다.
  pl: TinTin++ (znany też jako tt++) to darmowy klient MUD dla systemów Android, iOS, Linux, Mac OS X i Windows.
  pt: TinTin++ (também conhecido como tt++) é um cliente MUD gratuito para Android, iOS, Linux, Mac OS X e Windows.
  ro: TinTin++ (cunoscut și ca tt++) este un client MUD gratuit pentru Android, iOS, Linux, Mac OS X și Windows.
  ru: TinTin++ (также известный как tt++) — бесплатный MUD-клиент для Android, iOS, Linux, Mac OS X и Windows.
  th: TinTin++ (หรือที่เรียกว่า tt++) เป็นไคลเอนต์ MUD ฟรีสำหรับ Android, iOS, Linux, Mac OS X และ Windows
  tr: TinTin++ (tt++ olarak da bilinir), Android, iOS, Linux, Mac OS X ve Windows için ücretsiz bir MUD istemcisidir.
  uk: TinTin++ (також відомий як tt++) — безкоштовний MUD-клієнт для Android, iOS, Linux, Mac OS X і Windows.
  vi: TinTin++ (còn gọi là tt++) là ứng dụng MUD miễn phí cho Android, iOS, Linux, Mac OS X và Windows.
x:
  source: https://github.com/scandum/tintin
  eget: scandum/tintin
  apt: build-essential
  dnf: make
  brew: tintin
  apk: build-base
  snap: tintin
  apt-get: build-essential
  yum: make
  yay: tintin
rule:
  /eget:
    cmd: x eget scandum/tintin
    reference: https://x-cmd.com/mod/eget
  /snap:
    cmd: sudo snap install tintin
    reference: https://tintin.mudhalla.net/install.php
  alpine/apk:
    cmd: 'mkdir tintin && \

      cd tintin && \

      apk update && \

      apk upgrade && \

      apk add build-base && \

      apk add zlib-dev && \

      apk add gnutls-dev && \

      apk add pcre-dev && \

      apk add make && \

      apk add wget && \

      wget https://github.com/scandum/tintin/releases/download/2.02.42/tintin-2.02.42.tar.gz && \

      tar -zxvf tintin-2.02.42.tar.gz && \

      cd tt/src && \

      ./configure && \

      make install

      '
    reference: https://tintin.mudhalla.net/install.php#Alpine
  openbsd/pkg_add:
    cmd: 'pkg_add pcre && \

      wget https://github.com/scandum/tintin/releases/download/2.02.42/tintin-2.02.42.tar.gz && \

      tar -zxvf tintin-2.02.42.tar.gz && \

      cd tt/src && \

      ./configure CFLAGS=-I/usr/local/include LDFLAGS=-L/usr/local/lib && \

      make CFLAGS=-I/usr/local/include LDFLAGS=-L/usr/local/lib && \

      make install

      '
    reference: https://tintin.mudhalla.net/install.php#BSD
  debian/apt:
    cmd: 'mkdir tintin && \

      cd tintin && \

      sudo apt-get install build-essential && \

      sudo apt-get install zlib1g-dev && \

      sudo apt-get install libpcre++-dev && \

      wget https://github.com/scandum/tintin/releases/download/2.02.42/tintin-2.02.42.tar.gz && \

      tar -zxvf tintin-2.02.42.tar.gz && \

      cd tt/src && \

      ./configure && \

      sudo make install

      '
    reference: https://tintin.mudhalla.net/install.php#Debian
    dsnap: tintin++
  fedora/yum:
    cmd: 'mkdir tintin && \

      cd tintin && \

      sudo yum install make && \

      sudo yum install gcc && \

      sudo yum install zlib-devel && \

      sudo yum install pcre-devel && \

      wget https://github.com/scandum/tintin/releases/download/2.02.42/tintin-2.02.42.tar.gz && \

      tar -zxvf tintin-2.02.42.tar.gz && \

      cd tt/src && \

      ./configure && \

      sudo make install

      '
    reference: https://tintin.mudhalla.net/install.php#Fedora
  darwin/brew:
    cmd: brew install tintin
    reference: https://tintin.mudhalla.net/install.php#OSX
  arch/yay:
    cmd: yay -S tintin
    reference: https://aur.archlinux.org/packages/tintin
  ubuntu/apt:
    cmd: 'mkdir tintin && \

      cd tintin && \

      sudo apt-get update && \

      sudo apt-get install build-essential && \

      sudo apt-get build-dep tintin++ && \

      wget https://github.com/scandum/tintin/releases/download/2.02.42/tintin-2.02.42.tar.gz && \

      tar -zxvf tintin-2.02.42.tar.gz && \

      cd tt/src && \

      ./configure && \

      sudo make install

      '
    reference: https://tintin.mudhalla.net/install.php#Ubuntu
    dsnap: tintin++
binlist:
- tintin

