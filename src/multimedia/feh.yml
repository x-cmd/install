lang: C
desc:
  en: Image Viewer and Cataloguer
  cn: 图像查看器和目录管理器
homepage: https://github.com/derf/feh
x:
  source: https://github.com/derf/feh
rule:
  darwin/brew:
    cmd: brew install feh
    reference: https://formulae.brew.sh/formula/feh
  /apt:
    cmd: sudo apt install feh
    reference: https://github.com/derf/feh?tab=readme-ov-file#build-process
  arch/pacman:
    cmd: sudo pacman -S feh
    reference: https://archlinux.org/packages/extra/x86_64/feh/
  freebsd/pkg:
    cmd: pkg install feh
    reference: https://www.freshports.org/graphics/feh
binlist:
- feh
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
