lang: JavaScript
homepage: https://github.com/xxczaki/nasa-cli
license: MIT
desc:
  cn: NASA 每日天文图片的 CLI
  en: A CLI for NASA's Astronomy Picture of the Day
  cs: CLI pro NASA Astronomy Picture of the Day
  de: Ein CLI für das NASA-Astronomiebild des Tages
  es: Una CLI para la Imagen de Astronomía del Día de la NASA
  fr: Une CLI pour l'image d'astronomie du jour de la NASA
  id: CLI untuk Gambar Astronomi Harian dari NASA
  it: Una CLI per l'Astronomy Picture of the Day della NASA
  ja: NASA の「一日の天文写真」のための CLI
  ko: NASA의 매일 천문 사진용 CLI
  pl: CLI dla NASA Astronomy Picture of the Day
  pt: Uma CLI para a Imagem de Astronomia do Dia da NASA
  ro: O CLI pentru Imaginea de Astronomie a Zilei a NASA
  ru: CLI для «Астрономической картины дня» NASA
  th: CLI สำหรับภาพดาราศาสตร์ประจำวันของ NASA
  tr: NASA'nın Günün Astronomi Fotoğrafı için bir CLI
  uk: CLI для «Астрономічного зображення дня» NASA
  vi: CLI cho Ảnh Thiên văn Trong Ngày của NASA
x:
  source: https://github.com/xxczaki/nasa-cli
rule:
  /x:
    cmd: x pkg use nasa-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm i -g nasa-cli
    reference: https://github.com/xxczaki/nasa-cli?tab=readme-ov-file#installation
    dsnap: nasa-cli
binlist:
- nasa-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
