lang: JavaScript
homepage: https://github.com/xxczaki/nasa-cli
license: MIT
desc:
  cn: NASA 每日天文图片的 CLI
  en: A CLI for NASA's Astronomy Picture of the Day
x:
  pkg:
    exist: true
  source: https://github.com/xxczaki/nasa-cli
rule:
  /x:
    cmd: x pkg use nasa-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm i -g nasa-cli
    reference: https://github.com/xxczaki/nasa-cli?tab=readme-ov-file#installation
    dsnap: nasa-cli
binlist:
- nasa-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
