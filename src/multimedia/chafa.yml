lang: C
homepage: https://github.com/hpjansson/chafa
license: LGPL-3.0
desc:
  cn: Chafa 是一个命令行工具，能够将图像数据（包括动画 GIF）转换为适合在终端显示的图形格式或 ANSI/Unicode 字符艺术。
  en: Chafa is a command-line utility that converts image data, including animated GIFs, into graphics formats or ANSI/Unicode character art suitable for display in a terminal.
  cs: Chafa je nástroj příkazové řádky, který převádí obrazová data včetně animovaných GIF na grafické formáty nebo ASCII/Unicode znakové umění vhodné k zobrazení v terminálu.
  de: Chafa ist ein Kommandozeilenwerkzeug, das Bilddaten einschließlich animierter GIFs in Grafikformate oder ANSI/Unicode-Zeichenkunst umwandelt, die für die Anzeige im Terminal geeignet ist.
  es: Chafa es una utilidad de línea de comandos que convierte datos de imagen, incluidos GIF animados, en formatos gráficos o arte de caracteres ANSI/Unicode adecuado para mostrar en una terminal.
  fr: Chafa est un utilitaire en ligne de commande qui convertit des données d'image, y compris les GIF animés, en formats graphiques ou en art de caractères ANSI/Unicode adapté à l'affichage dans un terminal.
  id: Chafa adalah utilitas baris perintah yang mengubah data gambar, termasuk GIF animasi, menjadi format grafis atau seni karakter ANSI/Unicode yang cocok untuk ditampilkan di terminal.
  it: Chafa è un'utilità da riga di comando che converte i dati delle immagini, inclusi i GIF animati, in formati grafici o arte di caratteri ANSI/Unicode adatti alla visualizzazione in un terminale.
  ja: Chafa は、アニメーション GIF を含む画像データを、ターミナルでの表示に適したグラフィック形式や ANSI/Unicode 文字アートに変換するコマンドラインツールです。
  ko: Chafa는 애니메이션 GIF를 포함한 이미지 데이터를 터미널 표시에 적합한 그래픽 형식이나 ANSI/유니코드 문자 아트로 변환하는 명령줄 도구입니다.
  pl: Chafa to narzędzie wiersza poleceń, które konwertuje dane obrazu, w tym animowane GIF-y, na formaty graficzne lub sztukę znaków ANSI/Unicode odpowiednią do wyświetlania w terminalu.
  pt: Chafa é um utilitário de linha de comando que converte dados de imagem, incluindo GIFs animados, em formatos gráficos ou arte de caracteres ANSI/Unicode adequada para exibição em um terminal.
  ro: Chafa este un utilitar de linie de comandă care convertește datele de imagine, inclusiv GIF-uri animate, în formate grafice sau artă de caractere ANSI/Unicode potrivită pentru afișare într-un terminal.
  ru: Chafa — утилита командной строки, преобразующая данные изображений, включая анимированные GIF, в графические форматы или ASCII/Unicode-арт, пригодные для отображения в терминале.
  th: Chafa คือเครื่องมือบรรทัดคำสั่งที่แปลงข้อมูลภาพ รวมถึง GIF เคลื่อนไหว ให้เป็นรูปแบบกราฟิกหรืออักขระศิลป์ ANSI/Unicode ที่เหมาะกับการแสดงผลในเทอร์มินัล
  tr: Chafa, animasyonlu GIF'ler dâhil görüntü verilerini terminalde görüntülenmeye uygun grafik biçimlerine veya ANSI/Unicode karakter sanatına dönüştüren bir komut satırı aracıdır.
  uk: Chafa — утиліта командного рядка, яка перетворює дані зображень, зокрема анімовані GIF, у графічні формати або ASCII/Unicode-арт, придатні для відображення в терміналі.
  vi: Chafa là tiện ích dòng lệnh chuyển đổi dữ liệu hình ảnh, gồm cả GIF động, thành định dạng đồ họa hoặc nghệ thuật ký tự ANSI/Unicode phù hợp để hiển thị trong terminal.
x:
  source: https://github.com/hpjansson/chafa
  eget: hpjansson/chafa
  apt: chaf
  dnf: chafa
  brew: chafa
  pacman: chafa
  zypper: chafa
  port: chafa
  emerge: media-gfx/chafa
  scoop: chafa
  winget: hpjansson.Chafa
rule:
  /eget:
    cmd: x eget hpjansson/chafa
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: sudo pacman -S chafa
    reference: https://hpjansson.org/chafa/download/
  darwin/brew:
    cmd: brew install chafa
    reference: https://hpjansson.org/chafa/download/
  debian/apt:
    cmd: sudo apt install chaf
    reference: https://hpjansson.org/chafa/download/
    dsnap: chafa
  fedora/dnf:
    cmd: sudo dnf install chafa
    reference: https://hpjansson.org/chafa/download/
    dsnap: chafa
  freebsd/pkg:
    cmd: pkg install chafa
    reference: https://hpjansson.org/chafa/download/
  gentoo/emerge:
    cmd: sudo emerge media-gfx/chafa
    reference: https://hpjansson.org/chafa/download/
  guix/guix:
    cmd: sudo guix install chafa
    reference: https://hpjansson.org/chafa/download/
  kali/apt:
    cmd: sudo apt install chafa
    reference: https://hpjansson.org/chafa/download/
    dsnap: chafa
  darwin/port:
    cmd: sudo port install chafa
    reference: https://hpjansson.org/chafa/download/
  openbsd/pkg_add:
    cmd: pkg_add chafa
    reference: https://hpjansson.org/chafa/download/
  opensuse/zypper:
    cmd: sudo zypper in chafa
    reference: https://hpjansson.org/chafa/download/
  ubuntu/apt:
    cmd: sudo apt install chafa
    reference: https://hpjansson.org/chafa/download/
    dsnap: chafa
  (win|wsl2)/scoop:
    cmd: x scoop install chafa
    reference: https://hpjansson.org/chafa/download/
  (win|wsl2)/winget:
    cmd: x winget install hpjansson.Chafa
    reference: https://hpjansson.org/chafa/download/
binlist:
- chafa

