lang: rust
homepage: https://github.com/ljh-sh/silk
license: noassertion
desc:
  cn: 微信 SILK 语音转换器——单个 Rust 二进制，无 Python 依赖；SILK 与 WAV/MP3/Opus/AAC 互转、格式探测、批量处理
  en: WeChat SILK audio converter — single Rust binary, no Python deps; decode/encode SILK to and from WAV/MP3/Opus/AAC, detect format, batch process
x:
  source: https://github.com/ljh-sh/silk
rule:
  /cargo:
    cmd: cargo install --git https://github.com/ljh-sh/silk
    reference: https://github.com/ljh-sh/silk
binlist:
- silk

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
