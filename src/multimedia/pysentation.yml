lang: Python
homepage: https://github.com/mimseyedi/pysentation
license: GPL-3.0
desc:
  en: pysentation is a CLI for displaying Python presentations.
  cn: pysentation 是一个用于显示 Python 演示文稿的命令行界面（CLI）。
x:
  source: https://github.com/mimseyedi/pysentation
rule:
  /pip:
    cmd: python3 -m pip install pysentation
    reference: https://github.com/mimseyedi/pysentation?tab=readme-ov-file#installation-
    dsnap: pysentation
binlist:
- pysentation

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
