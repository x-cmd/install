lang: Python
homepage: https://github.com/mimseyedi/pysentation
license: GPL-3.0
desc:
  en: pysentation is a CLI for displaying Python presentations.
  cn: pysentation 是一个用于显示 Python 演示文稿的命令行界面（CLI）。
x:
  source: https://github.com/mimseyedi/pysentation
  pip: pysentation
rule:
  /pip:
    cmd: python3 -m pip install pysentation
    reference: https://github.com/mimseyedi/pysentation?tab=readme-ov-file#installation-
    dsnap: pysentation
binlist:
- pysentation

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
