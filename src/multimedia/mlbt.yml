lang: 'Rust'
homepage: https://github.com/mlb-rs/mlbt
license: 'MIT'
desc:
  cn: MLB Stats API 的终端界面,查看比分、战绩和数据,甚至能在终端看棒球比赛
  en: 'A terminal user interface for the MLB Stats API. Check scores, standings, and stats. Even watch a baseball game in your terminal! ⚾'
x:
  source: https://github.com/mlb-rs/mlbt
  eget: https://github.com/mlb-rs/mlbt
rule:
  /eget:
    cmd: x eget mlb-rs/mlbt
    reference: https://github.com/mlb-rs/mlbt
binlist:
  - 'mlbt'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
