lang: Python
homepage: https://github.com/icloud-photos-downloader/icloud_photos_downloader
license: MIT
desc:
  cn: iCloud Photos Downloader 是一个从 iCloud 下载照片的命令行工具
  en: iCloud Photos Downloader is a command-line tool to download photos from iCloud
  cs: iCloud Photos Downloader je nástroj příkazové řádky pro stahování fotografií z iCloudu
  de: iCloud Photos Downloader ist ein Kommandozeilenwerkzeug zum Herunterladen von Fotos aus iCloud
  es: iCloud Photos Downloader es una herramienta de línea de comandos para descargar fotos de iCloud
  fr: iCloud Photos Downloader est un outil en ligne de commande pour télécharger des photos depuis iCloud
  id: iCloud Photos Downloader adalah alat baris perintah untuk mengunduh foto dari iCloud
  it: iCloud Photos Downloader è uno strumento da riga di comando per scaricare foto da iCloud
  ja: iCloud Photos Downloader は iCloud から写真をダウンロードするコマンドラインツールです
  ko: iCloud Photos Downloader는 iCloud에서 사진을 다운로드하는 명령줄 도구입니다
  pl: iCloud Photos Downloader to narzędzie wiersza polecenia do pobierania zdjęć z iCloud
  pt: O iCloud Photos Downloader é uma ferramenta de linha de comando para baixar fotos do iCloud
  ro: iCloud Photos Downloader este un instrument de linie de comandă pentru descărcarea fotografiilor din iCloud
  ru: iCloud Photos Downloader — инструмент командной строки для загрузки фотографий из iCloud
  th: iCloud Photos Downloader เป็นเครื่องมือบรรทัดคำสั่งสำหรับดาวน์โหลดรูปภาพจาก iCloud
  tr: iCloud Photos Downloader, iCloud'dan foto indirmek için bir komut satırı aracıdır
  uk: iCloud Photos Downloader — інструмент командного рядка для завантаження фотографій з iCloud
  vi: iCloud Photos Downloader là công cụ dòng lệnh để tải ảnh từ iCloud
x:
  source: https://github.com/icloud-photos-downloader/icloud_photos_downloader
  eget: icloud-photos-downloader/icloud_photos_downloader
  yay: icloudpd-bin
  pip: icloudpd
rule:
  /eget:
    cmd: x eget icloud-photos-downloader/icloud_photos_downloader
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use icloudpd
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install icloudpd
    reference: https://github.com/icloud-photos-downloader/icloud_photos_downloader/blob/master/README_PYPI.md
    dsnap: icloudpd
  arch/yay:
    cmd: yay -S icloudpd-bin
    reference: https://aur.archlinux.org/packages/icloudpd-bin
binlist:
- icloudpd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
