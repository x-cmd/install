lang: C++
homepage: https://github.com/ArthurSonzogni/Diagon
license: MIT
desc:
  cn: 交互式 ASCII 艺术图表生成器
  en: Interactive ASCII art diagram generators
x:
  pkg:
    exist: true
  source: https://github.com/ArthurSonzogni/Diagon
  eget: https://github.com/ArthurSonzogni/Diagon
rule:
  /eget:
    cmd: x eget ArthurSonzogni/Diagon
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use diagon
    reference: https://x-cmd.com/install/
  (linux|darwin|win|wsl2)/:
    cmd: x env use diagon
    reference: https://x-cmd.com/mod/env
  /snap:
    cmd: sudo snap install diagon
    reference: https://github.com/ArthurSonzogni/Diagon?tab=readme-ov-file#command-line-interface
  /nix:
    cmd: nix run github:petertrotman/nixpkgs/Diagon#diagon
    reference: https://github.com/ArthurSonzogni/Diagon?tab=readme-ov-file#command-line-interface
  arch/yay:
    cmd: yay -S diagon-bin
    reference: https://aur.archlinux.org/packages/diagon-bin
binlist:
- diagon

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 646 KB
          rating: 1
          desc:
            cn: 安装 646 KB
            en: 646 KB install
        download:
          estimate: 646 KB
          desc:
            cn: 约 646 KB 下载 (linux/arm64)
            en: ~646 KB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
