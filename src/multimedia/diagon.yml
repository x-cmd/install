lang: C++
homepage: https://github.com/ArthurSonzogni/Diagon
license: MIT
desc:
  cn: 交互式 ASCII 艺术图表生成器
  en: Interactive ASCII art diagram generators
  cs: Interaktivní generátory ASCII grafů
  de: Interaktive ASCII-Kunst-Diagrammgeneratoren
  es: Generadores interactivos de diagramas en arte ASCII
  fr: Générateurs interactifs de diagrammes en art ASCII
  id: Generator diagram ASCII art interaktif
  it: Generatori interattivi di diagrammi in arte ASCII
  ja: インタラクティブな ASCII アート図生成ツール
  ko: 대화형 ASCII 아트 다이어그램 생성기
  pl: Interaktywne generatory diagramów w sztuce ASCII
  pt: Geradores interativos de diagramas em arte ASCII
  ro: Generatoare interactive de diagrame în artă ASCII
  ru: Интерактивные генераторы диаграмм в стиле ASCII-арт
  th: เครื่องสร้างแผนภาพ ASCII art แบบโต้ตอบ
  tr: Etkileşimli ASCII sanatı diyagram oluşturucuları
  uk: Інтерактивні генератори діаграм в стилі ASCII-арт
  vi: Trình tạo sơ đồ nghệ thuật ASCII tương tác
x:
  source: https://github.com/ArthurSonzogni/Diagon
  eget: ArthurSonzogni/Diagon
  snap: diagon
  yay: diagon-bin
rule:
  /eget:
    cmd: x eget ArthurSonzogni/Diagon
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use diagon
    reference: https://x-cmd.com/install/
  (linux|darwin|win|wsl2)/:
    cmd: x env use diagon
    reference: https://x-cmd.com/mod/env
  /snap:
    cmd: sudo snap install diagon
    reference: https://github.com/ArthurSonzogni/Diagon?tab=readme-ov-file#command-line-interface
  /nix:
    cmd: nix run github:petertrotman/nixpkgs/Diagon#diagon
    reference: https://github.com/ArthurSonzogni/Diagon?tab=readme-ov-file#command-line-interface
  arch/yay:
    cmd: yay -S diagon-bin
    reference: https://aur.archlinux.org/packages/diagon-bin
binlist:
- diagon

