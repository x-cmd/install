lang: Python
homepage: https://github.com/ceuk/spotui
license: MIT
desc:
  cn: spotui 是一个在终端中运行的 Spotify 客户端。
  en: spotui is Spotify in the terminal.
x:
  source: https://github.com/ceuk/spotui
rule:
  /pip:
    cmd: pip install spotui
    reference: https://github.com/ceuk/spotui?tab=readme-ov-file#getting-started
    dsnap: spotui
binlist:
- spotui

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
