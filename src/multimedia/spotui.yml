lang: Python
homepage: https://github.com/ceuk/spotui
license: MIT
desc:
  cn: spotui 是一个在终端中运行的 Spotify 客户端。
  en: spotui is Spotify in the terminal.
x:
  source: https://github.com/ceuk/spotui
rule:
  /pip:
    cmd: pip install spotui
    reference: https://github.com/ceuk/spotui?tab=readme-ov-file#getting-started
    dsnap: spotui
binlist:
- spotui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
