lang: 'Go'
homepage: https://github.com/mudler/LocalAI
license: 'MIT'
desc:
  cn: 开源 AI 引擎,可在任意硬件上运行 LLM、视觉、语音、图像、视频等各类模型,无需 GPU
  en: 'LocalAI is the open-source AI engine. Run any model - LLMs, vision, voice, image, video - on any hardware. No GPU required.'
x:
  source: https://github.com/mudler/LocalAI
  eget: https://github.com/mudler/LocalAI
rule:
  /eget:
    cmd: x eget mudler/LocalAI
    reference: https://github.com/mudler/LocalAI
binlist:
  - 'LocalAI'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
