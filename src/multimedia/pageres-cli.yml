lang: JavaScript
homepage: https://github.com/sindresorhus/pageres-cli
license: MIT
desc:
  en: Capture screenshots of websites in various resolutions
  cn: 以各种分辨率捕获网站的屏幕截图
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/pageres-cli
rule:
  /x:
    cmd: x pkg use pageres-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global pageres-cli
    reference: https://github.com/sindresorhus/pageres-cli?tab=readme-ov-file#install
    dsnap: pageres-cli
binlist:
- pageres-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
