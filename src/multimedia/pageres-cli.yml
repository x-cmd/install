lang: JavaScript
homepage: https://github.com/sindresorhus/pageres-cli
license: MIT
desc:
  en: Capture screenshots of websites in various resolutions
  cn: 以各种分辨率捕获网站的屏幕截图
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/pageres-cli
rule:
  /x:
    cmd: x pkg use pageres-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global pageres-cli
    reference: https://github.com/sindresorhus/pageres-cli?tab=readme-ov-file#install
    dsnap: pageres-cli
binlist:
- pageres-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
