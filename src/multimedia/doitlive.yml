lang: Python
homepage: https://doitlive.readthedocs.io/
desc:
  cn: doitlive 是终端中实时演示的工具
  en: doitlive is a tool for live presentations in the terminal
  cs: doitlive je nástroj pro živé prezentace v terminálu
  de: doitlive ist ein Werkzeug für Live-Präsentationen im Terminal
  es: doitlive es una herramienta para presentaciones en vivo en la terminal
  fr: doitlive est un outil pour les présentations en direct dans le terminal
  id: doitlive adalah alat untuk presentasi langsung di terminal
  it: doitlive è uno strumento per presentazioni dal vivo nel terminale
  ja: doitlive はターミナルでライブプレゼンテーションを行うためのツールです
  ko: doitlive는 터미널에서 실시간 프레젠테이션을 위한 도구입니다
  pl: doitlive to narzędzie do prezentacji na żywo w terminalu
  pt: doitlive é uma ferramenta para apresentações ao vivo no terminal
  ro: doitlive este un instrument pentru prezentări live în terminal
  ru: doitlive — инструмент для живых презентаций в терминале
  th: doitlive เป็นเครื่องมือสำหรับการนำเสนอสดในเทอร์มินัล
  tr: doitlive, terminalde canlı sunumlar yapmak için bir araçtır
  uk: doitlive — інструмент для живих презентацій у терміналі
  vi: doitlive là công cụ để thuyết trình trực tiếp trong terminal
x:
  brew: doitlive
  yay: doitlive
  pip: doitlive
rule:
  /x:
    cmd: x pkg use doitlive
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install doitlive
    reference: https://github.com/sloria/doitlive?tab=readme-ov-file#macos-with-homebrew
  arch/yay:
    cmd: yay -S doitlive
    reference: https://aur.archlinux.org/packages/doitlive
  /pip:
    cmd: pip install doitlive
    reference: https://github.com/sloria/doitlive?tab=readme-ov-file#with-pip
    dsnap: doitlive
binlist:
- doitlive
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
