lang: Python
homepage: https://doitlive.readthedocs.io/
desc:
  cn: doitlive 是终端中实时演示的工具
  en: doitlive is a tool for live presentations in the terminal
x:
  pkg:
    exist: true
  brew: doitlive
rule:
  /x:
    cmd: x pkg use doitlive
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install doitlive
    reference: https://github.com/sloria/doitlive?tab=readme-ov-file#macos-with-homebrew
  arch/yay:
    cmd: yay -S doitlive
    reference: https://aur.archlinux.org/packages/doitlive
  /pip:
    cmd: pip install doitlive
    reference: https://github.com/sloria/doitlive?tab=readme-ov-file#with-pip
    dsnap: doitlive
binlist:
- doitlive
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
