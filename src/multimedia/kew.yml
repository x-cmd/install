lang: C
homepage: https://github.com/ravachol/kew
license: GPL-2.0
desc:
  cn: 命令行音乐播放器
  en: Command line music player
  cs: Hudební přehrávač pro příkazovou řádek
  de: Musikplayer für die Kommandozeile
  es: Reproductor de música para la línea de comandos
  fr: Lecteur de musique en ligne de commande
  id: Pemutar musik baris perintah
  it: Lettore musicale da riga di comando
  ja: コマンドライン音楽プレーヤー
  ko: 명령줄 음악 플레이어
  pl: Odtwarzacz muzyki w wierszu poleceń
  pt: Reprodutor de música de linha de comando
  ro: Player de muzică pentru linia de comandă
  ru: Командный музыкальный проигрыватель
  th: เครื่องเล่นเพลงบรรทัดคำสั่ง
  tr: Komut satırı müzik çalar
  uk: Командний музичний програвач
  vi: Trình phát nhạc dòng lệnh
x:
  source: https://github.com/ravachol/kew
  apt: kew
  brew: kew
rule:
  debian/apt:
    cmd: sudo apt install kew
    reference: https://github.com/ravachol/kew?tab=readme-ov-file#installing-on-debian
    dsnap: kew
  ubuntu/apt:
    cmd: sudo apt install kew
    reference: https://github.com/ravachol/kew?tab=readme-ov-file#installing-on-debian
    dsnap: kew
  arch/yay:
    cmd: sudo yay kew
    reference: https://github.com/ravachol/kew?tab=readme-ov-file#installing-via-aur
  darwin/brew:
    cmd: brew install kew
    reference: https://github.com/ravachol/kew?tab=readme-ov-file#installing-via-brew
  /curl:
    cmd: sudo bash -c "curl https://raw.githubusercontent.com/ravachol/kew/main/install.sh | bash"
    reference: https://github.com/ravachol/kew?tab=readme-ov-file#installing-with-quick-install-script
binlist:
- kew

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 6.8 MB
          rating: 1
          desc:
            cn: 约 6.8 MB（估算）
            en: ~6.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
