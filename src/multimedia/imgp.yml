lang: Python
homepage: https://github.com/jarun/imgp
license: GPL-3.0
desc:
  cn: 用于 JPEG 和 PNG 图像的命令行图像调整器和旋转器
  en: A command line image resizer and rotator for JPEG and PNG images
x:
  source: https://github.com/jarun/imgp
  apt: imgp
  dnf: imgp
rule:
  /pip3:
    cmd: sudo pip3 install pillow
    reference: https://github.com/jarun/imgp#installation
  debian/apt:
    cmd: sudo apt-get install imgp
    reference: https://command-not-found.com/imgp
  ubuntu/apt:
    cmd: sudo apt-get install imgp
    reference: https://command-not-found.com/imgp
  kali/apt:
    cmd: sudo apt-get install imgp
    reference: https://command-not-found.com/imgp
    dsnap: imgp
  fedora/dnf:
    cmd: sudo dnf install imgp
    reference: https://command-not-found.com/imgp
  arch/yay:
    cmd: yay -S imgp-git
    reference: https://aur.archlinux.org/packages/imgp-git
binlist:
- imgp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
