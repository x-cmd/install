lang: Python
homepage: https://github.com/jarun/imgp
license: GPL-3.0
desc:
  cn: 用于 JPEG 和 PNG 图像的命令行图像调整器和旋转器
  en: A command line image resizer and rotator for JPEG and PNG images
x:
  source: https://github.com/jarun/imgp
rule:
  /pip3:
    cmd: sudo pip3 install pillow
    reference: https://github.com/jarun/imgp#installation
  debian/apt:
    cmd: sudo apt-get install imgp
    reference: https://command-not-found.com/imgp
  ubuntu/apt:
    cmd: sudo apt-get install imgp
    reference: https://command-not-found.com/imgp
  kali/apt:
    cmd: sudo apt-get install imgp
    reference: https://command-not-found.com/imgp
    dsnap: imgp
  fedora/dnf:
    cmd: sudo dnf install imgp
    reference: https://command-not-found.com/imgp
  arch/yay:
    cmd: yay -S imgp-git
    reference: https://aur.archlinux.org/packages/imgp-git
binlist:
- imgp

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
