lang: TypeScirpt
homepage: https://github.com/jupyter-book/mystmd
license: MIT
desc:
  cn: Myst 是一个由开源，社区驱动工具组成的生态系统，旨在彻底改变科学交流
  en: MyST is an ecosystem of open-source, community-driven tools designed to revolutionize scientific communication
x:
  source: https://github.com/jupyter-book/mystmd
rule:
  /pip:
    cmd: pip install mystmd
    reference: https://mystmd.org/guide/quickstart#installing-the-myst-markdown-cli
    dsnap: mystmd
  arch/yay:
    cmd: yay -S mystmd
    reference: https://aur.archlinux.org/packages/mystmd
  /conda:
    cmd: conda install mystmd -c conda-forge
    reference: https://mystmd.org/guide/quickstart#installing-the-myst-markdown-cli
  /npm:
    cmd: npm install -g mystmd
    reference: https://mystmd.org/guide/quickstart#installing-the-myst-markdown-cli
    dsnap: mystmd
binlist:
- mystmd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 106 KB
          rating: 1
          desc:
            cn: 约 106 KB（估算）
            en: ~106 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
