lang: TypeScirpt
homepage: https://github.com/jupyter-book/mystmd
license: MIT
desc:
  cn: Myst 是一个由开源，社区驱动工具组成的生态系统，旨在彻底改变科学交流
  en: MyST is an ecosystem of open-source, community-driven tools designed to revolutionize scientific communication
  cs: MyST je ekosystém open-source nástrojů řízených komunitou, navržený ke změně vědecké komunikace
  de: MyST ist ein Ökosystem aus quelloffenen, gemeinschaftlich getriebenen Werkzeugen, das die wissenschaftliche Kommunikation revolutionieren soll
  es: MyST es un ecosistema de herramientas de código abierto impulsadas por la comunidad, diseñadas para revolucionar la comunicación científica
  fr: MyST est un écosystème d'outils open source pilotés par la communauté, conçus pour révolutionner la communication scientifique
  id: MyST adalah ekosistem perkakas sumber terbuka yang digerakkan komunitas, dirancang untuk merevolusi komunikasi ilmiah
  it: MyST è un ecosistema di strumenti open source guidati dalla comunità, progettati per rivoluzionare la comunicazione scientifica
  ja: MyST は、科学コミュニケーションを革新することを目指して設計された、オープンソースでコミュニティ主導のツールのエコシステムです
  ko: MyST는 과학적 소통을 혁신하도록 설계된 오픈 소스 커뮤니티 기반 도구 생태계입니다
  pl: MyST to ekosystem narzędzi open source rozwijanych przez społeczność, zaprojektowany w celu zrewolucjonizowania komunikacji naukowej
  pt: O MyST é um ecossistema de ferramentas de código aberto orientadas pela comunidade, projetadas para revolucionar a comunicação científica
  ro: MyST este un ecosistem de instrumente open source, conduse de comunitate, concepute pentru a revoluționa comunicarea științifică
  ru: MyST — это экосистема инструментов с открытым исходным кодом, развиваемых сообществом и созданных для революции в научной коммуникации
  th: MyST คือระบบนิเวศของเครื่องมือโอเพนซอร์สที่ขับเคลื่อนโดยชุมชน ออกแบบมาเพื่อปฏิวัติการสื่อสารทางวิทยาศาสตร์
  tr: MyST, bilimsel iletişimi devrimleştirmek için tasarlanmış, açık kaynaklı ve topluluk odaklı araçlardan oluşan bir ekosistemdir
  uk: MyST — це екосистема з відкритим кодом, керованих спільнотою інструментів, створених для революції в науковій комунікації
  vi: MyST là hệ sinh thái các công cụ mã nguồn mở do cộng đồng dẫn dắt, được thiết kế để cách mạng hóa giao tiếp khoa học
x:
  source: https://github.com/jupyter-book/mystmd
  yay: mystmd
  pip: mystmd
  npm: mystmd
rule:
  /pip:
    cmd: pip install mystmd
    reference: https://mystmd.org/guide/quickstart#installing-the-myst-markdown-cli
    dsnap: mystmd
  arch/yay:
    cmd: yay -S mystmd
    reference: https://aur.archlinux.org/packages/mystmd
  /conda:
    cmd: conda install mystmd -c conda-forge
    reference: https://mystmd.org/guide/quickstart#installing-the-myst-markdown-cli
  /npm:
    cmd: npm install -g mystmd
    reference: https://mystmd.org/guide/quickstart#installing-the-myst-markdown-cli
    dsnap: mystmd
binlist:
- mystmd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 106 KB
          rating: 1
          desc:
            cn: 约 106 KB（估算）
            en: ~106 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
