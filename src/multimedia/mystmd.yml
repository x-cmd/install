lang: TypeScirpt
homepage: https://github.com/jupyter-book/mystmd
license: MIT
desc:
  cn: Myst 是一个由开源，社区驱动工具组成的生态系统，旨在彻底改变科学交流
  en: MyST is an ecosystem of open-source, community-driven tools designed to revolutionize scientific communication
x:
  source: https://github.com/jupyter-book/mystmd
rule:
  /pip:
    cmd: pip install mystmd
    reference: https://mystmd.org/guide/quickstart#installing-the-myst-markdown-cli
    dsnap: mystmd
  arch/yay:
    cmd: yay -S mystmd
    reference: https://aur.archlinux.org/packages/mystmd
  /conda:
    cmd: conda install mystmd -c conda-forge
    reference: https://mystmd.org/guide/quickstart#installing-the-myst-markdown-cli
  /npm:
    cmd: npm install -g mystmd
    reference: https://mystmd.org/guide/quickstart#installing-the-myst-markdown-cli
    dsnap: mystmd
binlist:
- mystmd

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
