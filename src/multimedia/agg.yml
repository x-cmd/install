lang: Rust
homepage: https://github.com/asciinema/agg
license: GPL-3.0
desc:
  cn: asciinema gif 生成器
  en: asciinema gif generator
x:
  pkg:
    exist: true
  source: https://github.com/asciinema/agg
  eget: https://github.com/asciinema/agg
rule:
  /x:
    cmd: x pkg use agg
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget asciinema/agg
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install agg
    reference: https://formulae.brew.sh/formula/agg#default
  /cargo:
    cmd: cargo install --git https://github.com/asciinema/agg
    reference: https://github.com/asciinema/agg?tab=readme-ov-file#building
    dsnap: agg
  (win|wsl2)/scoop:
    cmd: x scoop install agg
    reference: https://scoop.sh/#/apps?q=agg
  arch/yay:
    cmd: yay -S asciinema-agg
    reference: https://aur.archlinux.org/packages/asciinema-agg
binlist:
- agg

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
