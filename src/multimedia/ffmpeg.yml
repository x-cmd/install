homepage: https://github.com/FFmpeg/FFmpeg
desc:
  cn: ffmpeg 是用于处理音频、视频、字幕和相关元数据等多媒体内容的库和工具的集合
  en: ffmpeg is a collection of libraries and tools for working with multimedia content such as audio, video, subtitles, and related metadata
lang: C
x:
  pkg:
    exist: true
  source: https://github.com/FFmpeg/FFmpeg
rule:
  /x:
    cmd: x pkg use ffmpeg
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use ffmpeg
    reference: https://github.com/acj/asdf-ffmpeg
  darwin/brew:
    cmd: brew install ffmpeg
    reference: https://formulae.brew.sh/formula/ffmpeg#default
  debian/apt:
    cmd: sudo apt-get install ffmpeg
    reference: https://command-not-found.com/ffmpeg
    dsnap: ffmpeg
  ubuntu/apt:
    cmd: sudo apt-get install ffmpeg
    reference: https://command-not-found.com/ffmpeg
    dsnap: ffmpeg
  alpine/apk:
    cmd: sudo apk add ffmpeg
    reference: https://command-not-found.com/ffmpeg
    dsnap: ffmpeg
  arch/pacman:
    cmd: sudo pacman -S ffmpeg
    reference: https://command-not-found.com/ffmpeg
  kali/apt:
    cmd: sudo apt-get install ffmpeg
    reference: https://command-not-found.com/ffmpeg
    dsnap: ffmpeg
  raspbian/apt:
    cmd: sudo apt-get install ffmpeg
    reference: https://command-not-found.com/ffmpeg
binlist:
- ffmpeg
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
