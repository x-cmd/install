lang: C++
homepage: https://github.com/qpdf/qpdf
license: Apache-2.0
desc:
  cn: 用于转换和检查 PDF 文件的工具
  en: Tools for and transforming and inspecting PDF files
x:
  pkg:
    exist: true
  source: https://github.com/qpdf/qpdf
  eget: https://github.com/qpdf/qpdf
  brew: qpdf
rule:
  /x:
    cmd: x pkg use qpdf
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget qpdf/qpdf
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install qpdf
    reference: https://formulae.brew.sh/formula/qpdf#default
  (win|wsl2)/scoop:
    cmd: x scoop install qpdf
    reference: https://scoop.sh/#/apps?q=qpdf
binlist:
- qpdf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4.1 MB
          rating: 1
          desc:
            cn: 约 4.1 MB（估算）
            en: ~4.1 MB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
