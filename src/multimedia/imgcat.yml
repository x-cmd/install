lang: 'Go'
homepage: 'https://github.com/danielgatis/imgcat'
license: 'MIT'
desc:
  cn: 在终端中显示图像和 GIF
  en: 'Display images and gifs in your terminal.'
x:
  source: https://github.com/danielgatis/imgcat
  eget: https://github.com/danielgatis/imgcat
rule:
  /eget:
    cmd: x eget danielgatis/imgcat
    reference: https://github.com/danielgatis/imgcat
binlist:
  - 'imgcat'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
