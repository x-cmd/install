lang: 'Go'
homepage: 'https://github.com/danielgatis/imgcat'
license: 'MIT'
desc:
  cn: 在终端中显示图像和 GIF
  en: 'Display images and gifs in your terminal.'
x:
  source: https://github.com/danielgatis/imgcat
  eget: https://github.com/danielgatis/imgcat
rule:
  /eget:
    cmd: x eget danielgatis/imgcat
    reference: https://github.com/danielgatis/imgcat
binlist:
- 'imgcat'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 26 KB
          rating: 1
          desc:
            cn: 约 26 KB（估算）
            en: ~26 KB estimated
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
