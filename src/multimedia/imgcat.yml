lang: 'Go'
homepage: 'https://github.com/danielgatis/imgcat'
license: 'MIT'
desc:
  cn: 在终端中显示图像和 GIF
  en: 'Display images and gifs in your terminal.'
  cs: Zobrazuje obrázky a gify v terminálu.
  de: Zeigt Bilder und GIFs in Ihrem Terminal an.
  es: Muestra imágenes y GIF en tu terminal.
  fr: Affiche des images et des GIF dans votre terminal.
  id: Menampilkan gambar dan gif di terminal Anda.
  it: Mostra immagini e gif nel tuo terminale.
  ja: ターミナルに画像と gif を表示します。
  ko: 터미널에 이미지와 gif를 표시합니다.
  pl: Wyświetla obrazy i gify w terminalu.
  pt: Exibe imagens e gifs no seu terminal.
  ro: Afișează imagini și gif-uri în terminalul dvs.
  ru: Отображает изображения и gif в вашем терминале.
  th: แสดงรูปภาพและ gif ในเทอร์มินัลของคุณ
  tr: Terminalinizde görseller ve gif'leri gösterir.
  uk: Показує зображення та gif у вашому терміналі.
  vi: Hiển thị hình ảnh và gif trong terminal của bạn.
x:
  source: https://github.com/danielgatis/imgcat
  eget: danielgatis/imgcat
rule:
  /eget:
    cmd: x eget danielgatis/imgcat
    reference: https://github.com/danielgatis/imgcat
binlist:
- 'imgcat'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
