lang: Python
homepage: https://github.com/beetbox/beets
license: MIT
desc:
  cn: Beets 是专为音乐迷打造的媒体库管理系统
  en: Beets is the media library management system for obsessive music geeks
x:
  pkg:
    exist: true
  source: https://github.com/beetbox/beets
  eget: https://github.com/beetbox/beets
rule:
  /eget:
    cmd: x eget beetbox/beets
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use beets
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install beets
    reference: https://github.com/beetbox/beets#install
    dsnap: beets
  darwin/port:
    cmd: sudo port selfupdate && sudo port install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  debian/apt:
    cmd: sudo apt-get install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  ubuntu/apt:
    cmd: sudo apt-get install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  arch/pacman:
    cmd: sudo pacman -S beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  gentoo/emerge:
    cmd: sudo emerge beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  kali/apt:
    cmd: sudo apt-get install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
    dsnap: beets
  fedora/dnf:
    cmd: sudo dnf install beets beets-plugins beets-doc
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  raspbian/apt:
    cmd: sudo apt-get install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  freebsd/pkg:
    cmd: pkg install audio/beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  openbsd/pkg_add:
    cmd: pkg_add beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  solus/eopkg:
    cmd: sudo eopkg install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  nix/nixpkgs:
    cmd: sudo nix-env -i beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  (win|wsl2)/choco:
    cmd: x choco install beets
    reference: https://community.chocolatey.org/packages/beets
binlist:
- beets

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
