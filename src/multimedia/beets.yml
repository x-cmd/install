lang: Python
homepage: https://github.com/beetbox/beets
license: MIT
desc:
  cn: Beets 是专为音乐迷打造的媒体库管理系统
  en: Beets is the media library management system for obsessive music geeks
  cs: Beets je systém správy hudební knihovny pro posedlé hudební fanoušky
  de: Beets ist das Mediathek-Verwaltungssystem für zwanghafte Musikfans
  es: Beets es el sistema de gestión de biblioteca multimedia para aficionados obsesivos de la música
  fr: Beets est le système de gestion de médiathèque pour les férus de musique obsessionnels
  id: Beets adalah sistem manajemen pustaka media untuk pecandu musik yang fanatik
  it: Beets è il sistema di gestione della libreria multimediale per appassionati di musica ossessionati
  ja: Beets は音楽に執念した熱狂的な音楽ファンのための メディアライブラリ管理システムです
  ko: Beets는 음악에 열광하는 사용자를 위한 미디어 라이브러리 관리 시스템입니다
  pl: Beets to system zarządzania biblioteką multimedialną dla fanatycznych miłośników muzyki
  pt: Beets é o sistema de gestão de biblioteca de mídia para aficionados obsessivos de música
  ro: Beets este sistemul de management al bibliotecii media pentru pasionați obsesivi de muzică
  ru: Beets — система управления медиатекой для фанатов музыки
  th: Beets คือระบบจัดการคลังสื่อสำหรับคนหลงไหล่เพลง
  tr: Beets, müzik konusunda takıntılı hayranlar için medya kütüphanesi yönetim sistemidir
  uk: Beets — система керування медіатекою для прихильників музики
  vi: Beets là hệ thống quản lý thư viện phương tiện dành cho những người yêu nhạc cuồng nhiệt
x:
  source: https://github.com/beetbox/beets
  eget: beetbox/beets
  apt: beets
  dnf: beets
  pacman: beets
  apt-get: beets
  port: beets
  emerge: beets
  eopkg: beets
  choco: beets
  pip: beets
rule:
  /eget:
    cmd: x eget beetbox/beets
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use beets
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install beets
    reference: https://github.com/beetbox/beets#install
    dsnap: beets
  darwin/port:
    cmd: sudo port selfupdate && sudo port install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  debian/apt:
    cmd: sudo apt-get install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  ubuntu/apt:
    cmd: sudo apt-get install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  arch/pacman:
    cmd: sudo pacman -S beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  gentoo/emerge:
    cmd: sudo emerge beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  kali/apt:
    cmd: sudo apt-get install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
    dsnap: beets
  fedora/dnf:
    cmd: sudo dnf install beets beets-plugins beets-doc
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  raspbian/apt:
    cmd: sudo apt-get install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  freebsd/pkg:
    cmd: pkg install audio/beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  openbsd/pkg_add:
    cmd: pkg_add beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  solus/eopkg:
    cmd: sudo eopkg install beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  nix/nixpkgs:
    cmd: sudo nix-env -i beets
    reference: https://beets.readthedocs.io/en/stable/guides/main.html#installing
  (win|wsl2)/choco:
    cmd: x choco install beets
    reference: https://community.chocolatey.org/packages/beets
binlist:
- beets

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 635 KB
          rating: 1
          desc:
            cn: 安装 635 KB
            en: 635 KB install
        download:
          estimate: 635 KB
          desc:
            cn: 约 635 KB 下载 (whl)
            en: ~635 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
