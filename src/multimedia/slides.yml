lang: Go
homepage: https://github.com/maaslalani/slides
license: MIT
desc:
  en: Terminal based presentation tool
  cn: 基于终端的演示工具
x:
  source: https://github.com/maaslalani/slides
  eget: https://github.com/maaslalani/slides
rule:
  /eget:
    cmd: x eget maaslalani/slides
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install slides
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S slides
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
  /nix-env:
    cmd: nix-env -iA nixpkgs.slides
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
  linux/snapd:
    cmd: sudo snap install slides
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/maaslalani/slides@latest
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
    dsnap: slides
binlist:
- slides

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
