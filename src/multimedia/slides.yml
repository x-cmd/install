lang: Go
homepage: https://github.com/maaslalani/slides
license: MIT
desc:
  en: Terminal based presentation tool
  cn: 基于终端的演示工具
  cs: Nástroj pro prezentace založený na terminálu
  de: Terminalbasiertes Präsentationswerkzeug
  es: Herramienta de presentaciones basada en terminal
  fr: Outil de présentation basé sur le terminal
  id: Alat presentasi berbasis terminal
  it: Strumento di presentazione basato sul terminale
  ja: ターミナルベースのプレゼンテーションツール
  ko: 터미널 기반 프레젠테이션 도구
  pl: Narzędzie do prezentacji oparte na terminalu
  pt: Ferramenta de apresentação baseada em terminal
  ro: Instrument de prezentare bazat pe terminal
  ru: Презентационный инструмент на основе терминала
  th: เครื่องมือนำเสนอที่ใช้เทอร์มินัล
  tr: Terminal tabanlı sunum aracı
  uk: Інструмент для презентацій на основі термінала
  vi: Công cụ thuyết trình dựa trên terminal
x:
  source: https://github.com/maaslalani/slides
  eget: maaslalani/slides
  brew: slides
  snap: slides
  yay: slides
  go: github.com/maaslalani/slides@latest
rule:
  /eget:
    cmd: x eget maaslalani/slides
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install slides
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S slides
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
  /nix-env:
    cmd: nix-env -iA nixpkgs.slides
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
  linux/snapd:
    cmd: sudo snap install slides
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/maaslalani/slides@latest
    reference: https://github.com/maaslalani/slides?tab=readme-ov-file#installation
    dsnap: slides
binlist:
- slides

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
