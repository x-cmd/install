lang: Go
homepage: https://github.com/Achno/gowall
license: MIT
desc:
  cn: 一个可以将图像转换为你喜欢的任何配色方案/调色板的工具。
  en: A tool to convert an image to any color-scheme / pallete you like.
x:
  source: https://github.com/Achno/gowall
  eget: https://github.com/Achno/gowall
  brew: gowall
rule:
  /eget:
    cmd: x eget Achno/gowall
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S gowall
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#arch-linux---aur
  darwin/brew:
    cmd: brew install gowall
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#homebrew---maintainer--homebrew-core
  linux/brew:
    cmd: brew install gowall
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#homebrew---maintainer--homebrew-core
  /go:
    cmd: go install github.com/Achno/gowall@latest
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#build-from-source
    dsnap: github.com/Achno/gowall@latest
binlist:
- gowall

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 安装 14 MB
            en: 14 MB install
        download:
          estimate: 14 MB
          desc:
            cn: 约 14 MB 下载 (linux/x64)
            en: ~14 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
