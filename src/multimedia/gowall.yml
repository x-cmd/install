lang: Go
homepage: https://github.com/Achno/gowall
license: MIT
desc:
  cn: 一个可以将图像转换为你喜欢的任何配色方案/调色板的工具。
  en: A tool to convert an image to any color-scheme / pallete you like.
  cs: Nástroj pro převod obrázku na libovolné barevné schéma / paletu, která se vám líbí.
  de: Ein Werkzeug, um ein Bild in ein beliebiges Farbschema / eine beliebige Palette umzuwandeln.
  es: Una herramienta para convertir una imagen a cualquier esquema de color o paleta que te guste.
  fr: Un outil pour convertir une image en n'importe quel schéma de couleurs ou palette que vous aimez.
  id: Alat untuk mengubah gambar menjadi skema warna atau palet apa pun yang Anda sukai.
  it: Uno strumento per convertire un'immagine in qualsiasi schema di colori o palette preferito.
  ja: 画像を任意の色スキーム / パレットに変換できるツールです。
  ko: 이미지를 원하는 색상 구성이나 팔레트로 변환하는 도구입니다.
  pl: Narzędzie do konwersji obrazu do dowolnego schematu kolorów lub palety, który Ci się podoba.
  pt: Uma ferramenta para converter uma imagem em qualquer esquema de cores ou paleta que você goste.
  ro: Un instrument pentru conversia unei imagini în orice schemă de culori sau paletă care vă place.
  ru: Инструмент для преобразования изображения в любую цветовую схему или палитру, которая вам нравится.
  th: เครื่องมือแปลงรูปภาพเป็นชุดสีหรือจานสีใดก็ได้ที่คุณชอบ
  tr: Bir görüntüyü istediğiniz herhangi bir renk şemasına / paletine dönüştürme aracı.
  uk: Інструмент для перетворення зображення на будь-яку колірну схему / палітру, яка вам подобається.
  vi: Công cụ chuyển đổi hình ảnh sang bất kỳ bảng màu nào bạn thích.
x:
  source: https://github.com/Achno/gowall
  eget: Achno/gowall
  brew: gowall
  yay: gowall
  go: github.com/Achno/gowall@latest
rule:
  /eget:
    cmd: x eget Achno/gowall
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S gowall
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#arch-linux---aur
  darwin/brew:
    cmd: brew install gowall
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#homebrew---maintainer--homebrew-core
  linux/brew:
    cmd: brew install gowall
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#homebrew---maintainer--homebrew-core
  /go:
    cmd: go install github.com/Achno/gowall@latest
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#build-from-source
    dsnap: github.com/Achno/gowall@latest
binlist:
- gowall

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 安装 14 MB
            en: 14 MB install
        download:
          estimate: 14 MB
          desc:
            cn: 约 14 MB 下载 (linux/x64)
            en: ~14 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
