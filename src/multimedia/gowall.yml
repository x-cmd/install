lang: Go
homepage: https://github.com/Achno/gowall
license: MIT
desc:
  cn: 一个可以将图像转换为你喜欢的任何配色方案/调色板的工具。
  en: A tool to convert an image to any color-scheme / pallete you like.
x:
  source: https://github.com/Achno/gowall
  eget: https://github.com/Achno/gowall
rule:
  /eget:
    cmd: x eget Achno/gowall
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S gowall
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#arch-linux---aur
  darwin/brew:
    cmd: brew install gowall
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#homebrew---maintainer--homebrew-core
  linux/brew:
    cmd: brew install gowall
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#homebrew---maintainer--homebrew-core
  /go:
    cmd: go install github.com/Achno/gowall@latest
    reference: https://github.com/Achno/gowall?tab=readme-ov-file#build-from-source
    dsnap: github.com/Achno/gowall@latest
binlist:
- gowall

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
