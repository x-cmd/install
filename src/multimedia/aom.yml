lang: C
homepage: https://aomedia.googlesource.com/aom/
desc:
  cn: 用于编码和解码 AV1 视频流的编解码器库
  en: Codec library for encoding and decoding AV1 video streams
rule:
  darwin/brew:
    cmd: brew install aom
    reference: https://formulae.brew.sh/formula/aom#default
binlist:
- aom
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
