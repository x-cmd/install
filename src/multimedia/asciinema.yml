lang: Rust
homepage: https://github.com/asciinema/asciinema
license: GPL-3.0
desc:
  cn: 终端会话录制器、直播器和播放器
  en: Terminal session recorder, streamer and player
x:
  source: https://github.com/asciinema/asciinema
  eget: asciinema/asciinema
  apt: asciinema
  brew: asciinema
  pacman: asciinema
rule:
  /x:
    cmd: x pkg use asciinema
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget asciinema/asciinema
    reference: https://x-cmd.com/mod/eget
  ubuntu/apt:
    cmd: sudo apt install asciinema
    reference: https://docs.asciinema.org/getting-started/#__tabbed_1_2
    dsnap: asciinema
  debian/apt:
    cmd: sudo apt install asciinema
    reference: https://docs.asciinema.org/getting-started/#__tabbed_1_2
    dsnap: asciinema
  arch/pacman:
    cmd: sudo pacman -S asciinema
    reference: https://docs.asciinema.org/getting-started/#__tabbed_1_3
  darwin/brew:
    cmd: brew install asciinema
    reference: https://docs.asciinema.org/getting-started/#__tabbed_1_4
  /cargo:
    cmd: cargo install --locked --git https://github.com/asciinema/asciinema
    reference: https://github.com/asciinema/asciinema?tab=readme-ov-file#building
  /pipx:
    cmd: pipx install asciinema
    reference: https://docs.asciinema.org/getting-started/#__tabbed_1_5
binlist:
- asciinema

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7.6 MB
          rating: 1
          desc:
            cn: 安装 7.6 MB
            en: 7.6 MB install
        download:
          estimate: 7.6 MB
          desc:
            cn: 约 7.6 MB 下载
            en: ~7.6 MB download
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
