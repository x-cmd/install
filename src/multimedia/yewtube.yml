lang: Python
homepage: https://github.com/mps-youtube/yewtube
license: GPL-3.0
desc:
  cn: yewtube 是一个基于终端的 YouTube 播放器和下载器。
  en: yewtube is a Terminal based YouTube player and downloader.
x:
  source: https://github.com/mps-youtube/yewtube
  eget: https://github.com/mps-youtube/yewtube
rule:
  /eget:
    cmd: x eget mps-youtube/yewtube
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install yewtube
    reference: https://github.com/mps-youtube/yewtube?tab=readme-ov-file#using-pip
    dsnap: yewtube
  /pipx:
    cmd: pipx install yewtube
    reference: https://github.com/mps-youtube/yewtube?tab=readme-ov-file#using-pipx
  darwin/brew:
    cmd: brew install yewtube
    reference: https://formulae.brew.sh/formula/yewtube#default
  arch/yay:
    cmd: yay -S yewtube
    reference: https://aur.archlinux.org/packages/yewtube
binlist:
- yt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
        download:
          estimate: 116 KB
          desc:
            cn: 约 116 KB 下载 (whl)
            en: ~116 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
