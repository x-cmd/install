lang: Python
homepage: https://github.com/mps-youtube/yewtube
license: GPL-3.0
desc:
  cn: yewtube 是一个基于终端的 YouTube 播放器和下载器。
  en: yewtube is a Terminal based YouTube player and downloader.
  cs: yewtube je terminálový přehrávač a stahovač YouTube.
  de: yewtube ist ein Terminal-basierter YouTube-Player und Downloader.
  es: yewtube es un reproductor y descargador de YouTube basado en la terminal.
  fr: yewtube est un lecteur et téléchargeur YouTube basé sur le terminal.
  id: yewtube adalah pemutar dan pengunduh YouTube berbasis terminal.
  it: yewtube è un player e downloader YouTube basato sul terminale.
  ja: yewtube はターミナルベースの YouTube プレイヤー兼ダウンローダーです。
  ko: yewtube는 터미널 기반 YouTube 플레이어 및 다운로더입니다.
  pl: yewtube to terminalowy odtwarzacz i pobieracz YouTube.
  pt: yewtube é um player e downloader de YouTube baseado em terminal.
  ro: yewtube este un player și descărcător YouTube bazat pe terminal.
  ru: yewtube — терминальный плеер и загрузчик YouTube.
  th: yewtube คือโปรแกรมเล่นและดาวน์โหลด YouTube ที่ทำงานบนเทอร์มินัล
  tr: yewtube, terminal tabanlı bir YouTube oynatıcısı ve indiricisidir.
  uk: yewtube — термінальний програвач і завантажувач YouTube.
  vi: yewtube là trình phát và tải YouTube chạy trên terminal.
x:
  source: https://github.com/mps-youtube/yewtube
  eget: mps-youtube/yewtube
  brew: yewtube
  yay: yewtube
  pip: yewtube
rule:
  /eget:
    cmd: x eget mps-youtube/yewtube
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install yewtube
    reference: https://github.com/mps-youtube/yewtube?tab=readme-ov-file#using-pip
    dsnap: yewtube
  /pipx:
    cmd: pipx install yewtube
    reference: https://github.com/mps-youtube/yewtube?tab=readme-ov-file#using-pipx
  darwin/brew:
    cmd: brew install yewtube
    reference: https://formulae.brew.sh/formula/yewtube#default
  arch/yay:
    cmd: yay -S yewtube
    reference: https://aur.archlinux.org/packages/yewtube
binlist:
- yt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 116 KB
          rating: 1
          desc:
            cn: 安装 116 KB
            en: 116 KB install
        download:
          estimate: 116 KB
          desc:
            cn: 约 116 KB 下载 (whl)
            en: ~116 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
