lang: Rust
homepage: https://github.com/graniet/llm
license: mit
desc:
  cn: Rust 库与 CLI 工具,以单一可扩展 API 统一并编排多个 LLM、Agent 与语音后端
  en: A powerful Rust library and CLI tool to unify and orchestrate multiple LLM, Agent and voice backends (OpenAI, Claude, Gemini, Ollama, ElevenLabs...) with a single, extensible API. Build, chain, eva...
x:
  source: https://github.com/graniet/llm
  eget: https://github.com/graniet/llm
rule:
  /eget:
    cmd: x eget graniet/llm
    reference: https://github.com/graniet/llm
binlist:
- llm

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
