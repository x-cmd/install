lang: Rust
homepage: https://github.com/graniet/llm
license: mit
desc:
  cn: Rust 库与 CLI 工具,以单一可扩展 API 统一并编排多个 LLM、Agent 与语音后端
  en: A powerful Rust library and CLI tool to unify and orchestrate multiple LLM, Agent and voice backends (OpenAI, Claude, Gemini, Ollama, ElevenLabs...) with a single, extensible API. Build, chain, eva...
x:
  source: https://github.com/graniet/llm
  eget: graniet/llm
rule:
  /eget:
    cmd: x eget graniet/llm
    reference: https://github.com/graniet/llm
binlist:
- llm

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
