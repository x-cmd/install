lang: Rust
homepage: https://github.com/Watfaq/PowerSession-rs
license: MIT
desc:
  cn: 基于 Windows 伪控制台 (ConPTY) 的 asciinema Windows 移植版
  en: A port of asciinema for Windows, based on Windows Pseudo Console(ConPTY)
  cs: Port asciinema pro Windows založený na Windows Pseudo Console (ConPTY)
  de: Eine Portierung von asciinema für Windows, basierend auf der Windows Pseudo Console (ConPTY)
  es: Un port de asciinema para Windows, basado en Windows Pseudo Console (ConPTY)
  fr: Un portage d'asciinema pour Windows, basé sur la Windows Pseudo Console (ConPTY)
  id: Port asciinema untuk Windows, berbasis Windows Pseudo Console (ConPTY)
  it: Un porting di asciinema per Windows, basato su Windows Pseudo Console (ConPTY)
  ja: Windows Pseudo Console (ConPTY) に基づく Windows 向け asciinema の移植版
  ko: Windows Pseudo Console(ConPTY)를 기반으로 한 Windows용 asciinema 포트
  pl: Port asciinema dla Windows, oparty na Windows Pseudo Console (ConPTY)
  pt: Uma portação do asciinema para Windows, baseada no Windows Pseudo Console (ConPTY)
  ro: O portare a asciinema pentru Windows, bazată pe Windows Pseudo Console (ConPTY)
  ru: Порт asciinema для Windows на базе Windows Pseudo Console (ConPTY)
  th: พอร์ตของ asciinema สำหรับ Windows บนพื้นฐานของ Windows Pseudo Console (ConPTY)
  tr: Windows Pseudo Console (ConPTY) tabanlı, Windows için bir asciinema portu
  uk: Порт asciinema для Windows на основі Windows Pseudo Console (ConPTY)
  vi: Bản port của asciinema cho Windows, dựa trên Windows Pseudo Console (ConPTY)
x:
  source: https://github.com/Watfaq/PowerSession-rs
  scoop: powersession-rs
  winget: Watfaq.PowerSession
  cargo: PowerSession
rule:
  (win|wsl2)/cargo:
    cmd: cargo install PowerSession
    reference: https://github.com/Watfaq/PowerSession-rs?tab=readme-ov-file#installation
  (win|wsl2)/winget:
    cmd: winget install Watfaq.PowerSession
    reference: https://github.com/Watfaq/PowerSession-rs?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: scoop install powersession-rs
    reference: https://github.com/Watfaq/PowerSession-rs?tab=readme-ov-file#installation
binlist:
  - powersession

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: partial
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
