lang: Rust
homepage: https://github.com/Watfaq/PowerSession-rs
license: MIT
desc:
  cn: 基于 Windows 伪控制台 (ConPTY) 的 asciinema Windows 移植版
  en: A port of asciinema for Windows, based on Windows Pseudo Console(ConPTY)
x:
  source: https://github.com/Watfaq/PowerSession-rs
rule:
  (win|wsl2)/cargo:
    cmd: cargo install PowerSession
    reference: https://github.com/Watfaq/PowerSession-rs?tab=readme-ov-file#installation
  (win|wsl2)/winget:
    cmd: winget install Watfaq.PowerSession
    reference: https://github.com/Watfaq/PowerSession-rs?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: scoop install powersession-rs
    reference: https://github.com/Watfaq/PowerSession-rs?tab=readme-ov-file#installation
binlist:
  - powersession

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
