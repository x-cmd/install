lang: TypeScript
homepage: https://github.com/mixn/carbon-now-cli
license: MIT
desc:
  cn: Carbon 可让您创建并分享源代码的精美图像
  en: Carbon lets you create and share beautiful images of your source code
  cs: Carbon vám umožní vytvářet a sdílet krásné obrázky vašeho zdrojového kódu
  de: Carbon ermöglicht es Ihnen, schöne Bilder Ihres Quellcodes zu erstellen und zu teilen
  es: Carbon te permite crear y compartir bellas imágenes de tu código fuente
  fr: Carbon vous permet de créer et de partager de belles images de votre code source
  id: Carbon memungkinkan Anda membuat dan dibagikan gambar indah dari kode sumber Anda
  it: Carbon ti permette di creare e condividere bellissime immagini del tuo codice sorgente
  ja: Carbon はソースコードの美しい画像を作成して共有できます
  ko: Carbon을 사용하면 소스 코드의 아름다운 이미지를 만들고 공유할 수 있습니다
  pl: Carbon pozwala tworzyć i udostępniać piękne obrazy swojego kodu źródłowego
  pt: O Carbon permite criar e compartilhar belas imagens do seu código-fonte
  ro: Carbon vă permite să creați și să partajați imagini frumoase ale codului dvs. sursă
  ru: Carbon позволяет создавать и делиться красивыми изображениями вашего исходного кода
  th: Carbon ช่วยให้คุณสร้างและแบ่งปันภาพสวยของซอร์สโค้ดของคุณ
  tr: Carbon, kaynak kodunuzun güzel görüntülerini oluşturmanıza ve paylaşmanıza olanak tanır
  uk: Carbon дозволяє створювати та ділитися гарними зображеннями вашого вихідного коду
  vi: Carbon cho phép bạn tạo và chia sẻ những hình ảnh đẹp của mã nguồn
x:
  source: https://github.com/mixn/carbon-now-cli
  yay: carbon-now-cli-bin
rule:
  /x:
    cmd: x pkg use carbon-now-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm i -g carbon-now-cli
    reference: https://github.com/mixn/carbon-now-cli?tab=readme-ov-file#npm
    dsnap: carbon-now-cli
  arch/yay:
    cmd: yay -S carbon-now-cli-bin
    reference: https://aur.archlinux.org/packages/carbon-now-cli-bin
binlist:
- carbon-now-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
