lang: TypeScript
homepage: https://github.com/mixn/carbon-now-cli
license: MIT
desc:
  cn: Carbon 可让您创建并分享源代码的精美图像
  en: Carbon lets you create and share beautiful images of your source code
x:
  pkg:
    exist: true
  source: https://github.com/mixn/carbon-now-cli
rule:
  /x:
    cmd: x pkg use carbon-now-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm i -g carbon-now-cli
    reference: https://github.com/mixn/carbon-now-cli?tab=readme-ov-file#npm
    dsnap: carbon-now-cli
  arch/yay:
    cmd: yay -S carbon-now-cli-bin
    reference: https://aur.archlinux.org/packages/carbon-now-cli-bin
binlist:
- carbon-now-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
