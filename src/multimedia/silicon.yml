lang: Rust
homepage: https://github.com/Aloxaf/silicon
license: MIT
desc:
  en: Create beautiful image of your source code.
  cn: 创建您的代码美丽图像
  cs: Vytvořte krásný obrázek svého zdrojového kódu.
  de: Erstellen Sie ein schönes Bild Ihres Quellcodes.
  es: Crea una bella imagen de tu código fuente.
  fr: Créez une belle image de votre code source.
  id: Buat gambar indah dari kode sumber Anda.
  it: Crea una bella immagine del tuo codice sorgente.
  ja: ソースコードの美しい画像を作成します。
  ko: 소스 코드의 아름다운 이미지를 만드세요.
  pl: Stwórz piękny obraz swojego kodu źródłowego.
  pt: Crie uma bela imagem do seu código-fonte.
  ro: Creați o imagine frumoasă a codului sursă.
  ru: Создайте красивое изображение своего исходного кода.
  th: สร้างภาพสวยของซอร์สโค้ดของคุณ
  tr: Kaynak kodunuzun güzel bir görselini oluşturun.
  uk: Створіть красиве зображення свого вихідного коду.
  vi: Tạo ảnh đẹp cho mã nguồn của bạn.
x:
  source: https://github.com/Aloxaf/silicon
  brew: silicon
  scoop: silicon
  cargo: silicon
rule:
  /cargo:
    cmd: cargo install silicon
    reference: https://github.com/Aloxaf/silicon?tab=readme-ov-file#cargo
    dsnap: silicon
  darwin/brew:
    cmd: brew install silicon
    reference: https://github.com/Aloxaf/silicon?tab=readme-ov-file#homebrew
  (win|wsl2)/scoop:
    cmd: x scoop install silicon
    reference: https://scoop.sh/#/apps?q=silicon
binlist:
- silicon

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 73 KB
          rating: 1
          desc:
            cn: 约 73 KB（估算）
            en: ~73 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
