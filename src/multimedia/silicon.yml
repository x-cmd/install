lang: Rust
homepage: https://github.com/Aloxaf/silicon
license: MIT
desc:
  en: Create beautiful image of your source code.
  cn: 创建您的代码美丽图像
x:
  source: https://github.com/Aloxaf/silicon
  brew: silicon
  scoop: silicon
  cargo: silicon
rule:
  /cargo:
    cmd: cargo install silicon
    reference: https://github.com/Aloxaf/silicon?tab=readme-ov-file#cargo
    dsnap: silicon
  darwin/brew:
    cmd: brew install silicon
    reference: https://github.com/Aloxaf/silicon?tab=readme-ov-file#homebrew
  (win|wsl2)/scoop:
    cmd: x scoop install silicon
    reference: https://scoop.sh/#/apps?q=silicon
binlist:
- silicon

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 73 KB
          rating: 1
          desc:
            cn: 约 73 KB（估算）
            en: ~73 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
