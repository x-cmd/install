lang: Rust
homepage: https://github.com/Aloxaf/silicon
license: MIT
desc:
  en: Create beautiful image of your source code.
  cn: 创建您的代码美丽图像
x:
  source: https://github.com/Aloxaf/silicon
rule:
  /cargo:
    cmd: cargo install silicon
    reference: https://github.com/Aloxaf/silicon?tab=readme-ov-file#cargo
    dsnap: silicon
  darwin/brew:
    cmd: brew install silicon
    reference: https://github.com/Aloxaf/silicon?tab=readme-ov-file#homebrew
  (win|wsl2)/scoop:
    cmd: x scoop install silicon
    reference: https://scoop.sh/#/apps?q=silicon
binlist:
- silicon

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
