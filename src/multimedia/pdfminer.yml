lang: Python
homepage: https://github.com/euske/pdfminer
license: MIT
desc:
  cn: PDFMiner 是 PDF 文档的文本提取工具
  en: PDFMiner is a text extraction tool for PDF documents
x:
  pkg:
    exist: true
  source: https://github.com/euske/pdfminer
rule:
  /x:
    cmd: x pkg use pdfminer
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install pdfminer
    reference: https://github.com/euske/pdfminer?tab=readme-ov-file#how-to-use
    dsnap: pdfminer
binlist:
- pdfminer

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
