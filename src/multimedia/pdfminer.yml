lang: Python
homepage: https://github.com/euske/pdfminer
license: MIT
desc:
  cn: PDFMiner 是 PDF 文档的文本提取工具
  en: PDFMiner is a text extraction tool for PDF documents
x:
  source: https://github.com/euske/pdfminer
  pip: pdfminer
rule:
  /x:
    cmd: x pkg use pdfminer
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install pdfminer
    reference: https://github.com/euske/pdfminer?tab=readme-ov-file#how-to-use
    dsnap: pdfminer
binlist:
- pdfminer

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 24 KB
          rating: 1
          desc:
            cn: 约 24 KB（估算）
            en: ~24 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
