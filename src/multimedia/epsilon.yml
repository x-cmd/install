lang: C++
homepage: https://sourceforge.net/projects/epsilon-project/
desc:
  en: EPSILON is a powerful Open Source wavelet image compressor
  cn: EPSILON 是一种强大的开源小波图像压缩器
  cs: EPSILON je výkonný open source wavelet kompresor obrázků
  de: EPSILON ist ein leistungsstarker quelloffener Wavelet-Bildkompressor
  es: EPSILON es un potente compresor de imágenes wavelet de código abierto
  fr: EPSILON est un powerful compresseur d'images par ondelettes open source
  id: EPSILON adalah kompresor gambar wavelet open source yang andal
  it: EPSILON è un potente compressore di immagini wavelet open source
  ja: EPSILON は強力なオープンソースのウェーブレット画像圧縮ツールです
  ko: EPSILON은 강력한 오픈소스 웨이블릿 이미지 압축기입니다
  pl: EPSILON to wydajny otwartoźródłowy kompresor obrazów falkowy
  pt: EPSILON é um poderoso compressor de imagens wavelet de código aberto
  ro: EPSILON este un puternic compresor de imagini wavelet open source
  ru: EPSILON — мощный компрессор изображений на основе вейвлетов с открытым исходным кодом
  th: EPSILON เป็นโปรแกรมบีบอัดภาพแบบเวฟเล็ตแบบโอเพนซอร์สที่ทรงพลัง
  tr: EPSILON, güçlü bir açık kaynaklı dalgacık görüntü sıkıştırıcıdır
  uk: EPSILON — потужний компресор зображень на основі вейвлетів з відкритим кодом
  vi: EPSILON là bộ nén ảnh wavelet mã nguồn mở mạnh mẽ
rule:
  darwin/brew:
    cmd: brew install epsilon
    reference: https://formulae.brew.sh/formula/epsilon#default
  debian/apt:
    cmd: sudo apt-get install epsilon-bin
    reference: https://command-not-found.com/epsilon
    dsnap: epsilon-bin
  ubuntu/apt:
    cmd: sudo apt-get install epsilon-bin
    reference: https://command-not-found.com/epsilon
    dsnap: epsilon-bin
  kali/apt:
    cmd: sudo apt-get install epsilon-bin
    reference: https://command-not-found.com/epsilon
    dsnap: epsilon-bin
  raspbian/apt:
    cmd: sudo apt-get install epsilon-bin
    reference: https://command-not-found.com/epsilon

x:
  apt: epsilon-bin
  apt-get: epsilon-bin
  brew: epsilon
binlist:
- epsilon
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
