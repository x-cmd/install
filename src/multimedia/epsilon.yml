lang: C++
homepage: https://sourceforge.net/projects/epsilon-project/
desc:
  en: EPSILON is a powerful Open Source wavelet image compressor
  cn: EPSILON 是一种强大的开源小波图像压缩器
rule:
  darwin/brew:
    cmd: brew install epsilon
    reference: https://formulae.brew.sh/formula/epsilon#default
  debian/apt:
    cmd: sudo apt-get install epsilon-bin
    reference: https://command-not-found.com/epsilon
    dsnap: epsilon-bin
  ubuntu/apt:
    cmd: sudo apt-get install epsilon-bin
    reference: https://command-not-found.com/epsilon
    dsnap: epsilon-bin
  kali/apt:
    cmd: sudo apt-get install epsilon-bin
    reference: https://command-not-found.com/epsilon
    dsnap: epsilon-bin
  raspbian/apt:
    cmd: sudo apt-get install epsilon-bin
    reference: https://command-not-found.com/epsilon
binlist:
- epsilon
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
