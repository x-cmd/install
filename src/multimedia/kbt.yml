lang: Rust
homepage: https://github.com/bloznelis/kbt
license: MIT
desc:
  cn: 终端中的键盘测试器
  en: Keyboard tester in terminal
x:
  source: https://github.com/bloznelis/kbt
  eget: https://github.com/bloznelis/kbt
rule:
  /eget:
    cmd: x eget bloznelis/kbt
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S kbt
    reference: https://github.com/bloznelis/kbt?tab=readme-ov-file#installation
  nix/nix-shell:
    cmd: nix-shell -p kbt
    reference: https://github.com/bloznelis/kbt?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install kbt
    reference: https://github.com/bloznelis/kbt?tab=readme-ov-file#installation
    dsnap: kbt
  /brew:
    cmd: 'brew tap bloznelis/tap

      brew install kbt

      '
    reference: https://github.com/bloznelis/kbt?tab=readme-ov-file#installation
binlist:
- kbt

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
