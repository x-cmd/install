lang: Rust
homepage: https://github.com/bloznelis/kbt
license: MIT
desc:
  cn: 终端中的键盘测试器
  en: Keyboard tester in terminal
x:
  source: https://github.com/bloznelis/kbt
  eget: bloznelis/kbt
  brew: kbt
  pacman: kbt
  cargo: kbt
rule:
  /eget:
    cmd: x eget bloznelis/kbt
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S kbt
    reference: https://github.com/bloznelis/kbt?tab=readme-ov-file#installation
  nix/nix-shell:
    cmd: nix-shell -p kbt
    reference: https://github.com/bloznelis/kbt?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install kbt
    reference: https://github.com/bloznelis/kbt?tab=readme-ov-file#installation
    dsnap: kbt
  /brew:
    cmd: 'brew tap bloznelis/tap

      brew install kbt

      '
    reference: https://github.com/bloznelis/kbt?tab=readme-ov-file#installation
binlist:
- kbt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
