lang: 'Python'
homepage: 'https://github.com/openai/whisper'
license: 'MIT'
desc:
  cn: 基于大规模弱监督的稳健语音识别
  en: 'Robust Speech Recognition via Large-Scale Weak Supervision'
x:
  source: https://github.com/openai/whisper
rule:
  /pip:
    cmd: pip install openai-whisper
    reference: https://pypi.org/project/openai-whisper/
    dsnap: openai-whisper
binlist:
  - 'whisper'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
