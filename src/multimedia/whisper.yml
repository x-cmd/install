lang: 'Python'
homepage: 'https://github.com/openai/whisper'
license: 'MIT'
desc:
  cn: 基于大规模弱监督的稳健语音识别
  en: 'Robust Speech Recognition via Large-Scale Weak Supervision'
x:
  source: https://github.com/openai/whisper
rule:
  /pip:
    cmd: pip install openai-whisper
    reference: https://pypi.org/project/openai-whisper/
    dsnap: openai-whisper
binlist:
  - 'whisper'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
