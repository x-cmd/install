lang: Rust
homepage: https://github.com/ImageOptim/gifski
desc:
  cn: 基于 libimagequant (pngquant) 的 GIF 编码器
  en: GIF encoder based on libimagequant (pngquant)
x:
  pkg:
    exist: true
  source: https://github.com/ImageOptim/gifski
  eget: https://github.com/ImageOptim/gifski
rule:
  /eget:
    cmd: x eget ImageOptim/gifski
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use gifski
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install gifski
    reference: https://github.com/ImageOptim/gifski/?tab=readme-ov-file#download-and-install
  /cargo:
    cmd: cargo install gifski
    reference: https://github.com/ImageOptim/gifski/?tab=readme-ov-file#download-and-install
    dsnap: gifski
binlist:
- gifski
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
