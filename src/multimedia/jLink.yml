lang: Shell
homepage: https://github.com/Watchdog0x/jLink
license: Apache-2.0
desc:
  cn: jLink 是在 Linux 上管理 Jabra 耳机和适配器的终极解决方案。
  en: jLink is the ultimate solution for managing Jabra headsets and dongles on Linux.
  cs: jLink je ultimální řešení pro správu sluchátek a adaptérů Jabra v Linuxu.
  de: jLink ist die ultimative Lösung zur Verwaltung von Jabra-Headsets und Dongles unter Linux.
  es: jLink es la solución definitiva para gestionar auriculares y adaptadores Jabra en Linux.
  fr: jLink est la solution ultime pour gérer les casques et dongles Jabra sous Linux.
  id: jLink adalah solusi terbaik untuk mengelola headset dan dongle Jabra di Linux.
  it: jLink è la soluzione definitiva per gestire cuffie e dongle Jabra su Linux.
  ja: jLink は Linux で Jabra のヘッドセットやドングルを管理するための最適なソリューションです。
  ko: jLink는 Linux에서 Jabra 헤드셋과 동글을 관리하기 위한 최적의 솔루션입니다.
  pl: jLink to ostateczne rozwiązanie do zarządzania zestawami słuchawkowymi i donglami Jabra w systemie Linux.
  pt: O jLink é a solução definitiva para gerenciar fones de ouvido e dongles Jabra no Linux.
  ro: jLink este soluția ideală pentru gestionarea căștilor și donglurilor Jabra pe Linux.
  ru: jLink — идеальное решение для управления гарнитурами и адаптерами Jabra в Linux.
  th: jLink คือทางออกที่ดีที่สุดสำหรับการจัดการหูฟังและดองเกิล Jabra บน Linux
  tr: jLink, Linux üzerinde Jabra kulaklıklarını ve dongle'ları yönetmek için nihai çözümdür.
  uk: jLink — це остаточне рішення для керування гарнітурами та адаптерами Jabra у Linux.
  vi: jLink là giải pháp tối ưu để quản lý tai nghe và dongle Jabra trên Linux.
x:
  source: https://github.com/Watchdog0x/jLink
  eget: Watchdog0x/jLink
rule:
  /eget:
    cmd: x eget Watchdog0x/jLink
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -so- https://raw.githubusercontent.com/Watchdog0x/jLink/main/install.sh | sudo bash
    reference: https://github.com/Watchdog0x/jLink?tab=readme-ov-file#option-1-using-curl
  /wget:
    cmd: wget -qO- https://raw.githubusercontent.com/Watchdog0x/jLink/main/install.sh | sudo bash
    reference: https://github.com/Watchdog0x/jLink?tab=readme-ov-file#option-2-using-wget
binlist:
- jLink

# complicated
