lang: JavaScript
homepage: https://github.com/tinify/tinify-nodejs
license: MIT
desc:
  en: Node.js client for the Tinify (Compression Image) API.
  cn: Node.js 客户端调用 Tinify (压缩图像) API。
x:
  source: https://github.com/tinify/tinify-nodejs
  npm: tinify
rule:
  /npm:
    cmd: npm install -g tinify
    reference: https://github.com/tinify/tinify-nodejs?tab=readme-ov-file#installation
    dsnap: tinify
binlist:
- tinify

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
