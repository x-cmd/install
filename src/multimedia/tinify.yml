lang: JavaScript
homepage: https://github.com/tinify/tinify-nodejs
license: MIT
desc:
  en: Node.js client for the Tinify (Compression Image) API.
  cn: Node.js 客户端调用 Tinify (压缩图像) API。
x:
  source: https://github.com/tinify/tinify-nodejs
rule:
  /npm:
    cmd: npm install -g tinify
    reference: https://github.com/tinify/tinify-nodejs?tab=readme-ov-file#installation
    dsnap: tinify
binlist:
- tinify

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
