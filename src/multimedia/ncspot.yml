lang: Rust
homepage: https://github.com/hrkfdn/ncspot
license: BSD-2-Clause
desc:
  cn: ncspot 是一个基于 ncurses 的 Spotify 客户端，使用 Rust 编写，并依赖 librespot 库。
  en: ncspot is an ncurses Spotify client written in Rust using librespot.
x:
  source: https://github.com/hrkfdn/ncspot
  eget: https://github.com/hrkfdn/ncspot
  brew: ncspot
  scoop: main/ncspot
  winget: hrkfdn.ncspot
  powershell: install
  yay: ncspot-git
  cargo: ncspot
rule:
  /eget:
    cmd: x eget hrkfdn/ncspot
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install ncspot
    reference: https://crates.io/crates/ncspot
    dsnap: ncspot
  darwin/brew:
    cmd: brew install ncspot
    reference: https://formulae.brew.sh/formula/ncspot#default
  (win|wsl2)/scoop:
    cmd: x scoop install main/ncspot
    reference: https://scoop.sh/#/apps?q=ncspot
  (win|wsl2)/winget:
    cmd: x winget install hrkfdn.ncspot
    reference: https://winget.run/search?query=hrkfdn.ncspot
  arch/yay:
    cmd: yay -S ncspot-git
    reference: https://aur.archlinux.org/packages/ncspot-git
binlist:
- ncspot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
