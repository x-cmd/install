lang: Go
homepage: https://github.com/MrMarble/termsvg
license: GPL-3.0
desc:
  cn: 记录，共享和导出您的终端作为一个动画 SVG 图像
  en: Record, share and export your terminal as a animated SVG image
  cs: Zaznamenat, sdílet a exportovat terminál jako animovaný obrázek SVG
  de: Terminal als animiertes SVG-Bild aufzeichnen, teilen und exportieren
  es: Grabar, compartir y exportar tu terminal como una imagen SVG animada
  fr: Enregistrer, partager et exporter votre terminal sous forme d'image SVG animée
  id: Rekam, bagikan, dan ekspor terminal Anda sebagai gambar SVG animasi
  it: Registra, condividi ed esporta il tuo terminale come immagine SVG animata
  ja: ターミナルをアニメーション SVG 画像として記録、共有、エクスポートする
  ko: 터미널을 애니메이션 SVG 이미지로 기록, 공유 및 내보내기
  pl: Nagrywaj, udostępniaj i eksportuj terminal jako animowany obraz SVG
  pt: Grave, compartilhe e exporte seu terminal como uma imagem SVG animada
  ro: Înregistrează, partajează și exportă terminalul ca imagine SVG animată
  ru: Запись, обмен и экспорт терминала в виде анимированного изображения SVG
  th: บันทึก แชร์ และส่งออกเทอร์มินัลของคุณเป็นภาพ SVG แบบเคลื่อนไหว
  tr: Terminalinizi animasyonlu bir SVG görseli olarak kaydedin, paylaşın ve dışa aktarın
  uk: Запис, обмін та експорт термінала у вигляді анімованого зображення SVG
  vi: Ghi lại, chia sẻ và xuất terminal của bạn dưới dạng ảnh SVG động
x:
  source: https://github.com/MrMarble/termsvg
  eget: MrMarble/termsvg
rule:
  /x:
    cmd: x pkg use termsvg
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget MrMarble/termsvg
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sL https://raw.githubusercontent.com/MrMarble/termsvg/master/scripts/install-termsvg.sh | sudo -E bash -
    reference: https://github.com/MrMarble/termsvg#installation
  /wget:
    cmd: wget -O - https://raw.githubusercontent.com/MrMarble/termsvg/master/scripts/install-termsvg.sh | sudo -E bash -
    reference: https://github.com/MrMarble/termsvg#installation
binlist:
- termsvg

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 398 KB
          rating: 1
          desc:
            cn: 约 398 KB（估算）
            en: ~398 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
