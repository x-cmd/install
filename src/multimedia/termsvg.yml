lang: Go
homepage: https://github.com/MrMarble/termsvg
license: GPL-3.0
desc:
  cn: 记录，共享和导出您的终端作为一个动画 SVG 图像
  en: Record, share and export your terminal as a animated SVG image
x:
  pkg:
    exist: true
  source: https://github.com/MrMarble/termsvg
  eget: https://github.com/MrMarble/termsvg
rule:
  /x:
    cmd: x pkg use termsvg
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget MrMarble/termsvg
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sL https://raw.githubusercontent.com/MrMarble/termsvg/master/scripts/install-termsvg.sh | sudo -E bash -
    reference: https://github.com/MrMarble/termsvg#installation
  /wget:
    cmd: wget -O - https://raw.githubusercontent.com/MrMarble/termsvg/master/scripts/install-termsvg.sh | sudo -E bash -
    reference: https://github.com/MrMarble/termsvg#installation
binlist:
- termsvg

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
