lang: Rust
homepage: https://github.com/fathyb/carbonyl
license: BSD-3-Clause
desc:
  cn: Carbonyl 是一款基于 Chromium 的浏览器，可在终端中运行
  en: Carbonyl is a Chromium based browser built to run in a terminal
x:
  pkg:
    exist: true
  source: https://github.com/fathyb/carbonyl
  eget: https://github.com/fathyb/carbonyl
rule:
  /x:
    cmd: x pkg use carbonyl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget fathyb/carbonyl
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install --global carbonyl
    reference: https://github.com/fathyb/carbonyl?tab=readme-ov-file#npm
    dsnap: carbonyl
  arch/yay:
    cmd: yay -S carbonyl
    reference: https://aur.archlinux.org/packages/carbonyl
binlist:
- carbonyl

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
