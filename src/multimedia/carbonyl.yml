lang: Rust
homepage: https://github.com/fathyb/carbonyl
license: BSD-3-Clause
desc:
  cn: Carbonyl 是一款基于 Chromium 的浏览器，可在终端中运行
  en: Carbonyl is a Chromium based browser built to run in a terminal
x:
  source: https://github.com/fathyb/carbonyl
  eget: fathyb/carbonyl
  yay: carbonyl
rule:
  /x:
    cmd: x pkg use carbonyl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget fathyb/carbonyl
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install --global carbonyl
    reference: https://github.com/fathyb/carbonyl?tab=readme-ov-file#npm
    dsnap: carbonyl
  arch/yay:
    cmd: yay -S carbonyl
    reference: https://aur.archlinux.org/packages/carbonyl
binlist:
- carbonyl

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 126 KB
          rating: 1
          desc:
            cn: 约 126 KB（估算）
            en: ~126 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
