lang: Rust
homepage: https://github.com/fathyb/carbonyl
license: BSD-3-Clause
desc:
  cn: Carbonyl 是一款基于 Chromium 的浏览器，可在终端中运行
  en: Carbonyl is a Chromium based browser built to run in a terminal
  cs: Carbonyl je prohlížeč založený na Chromium, navržený pro běh v terminálu
  de: Carbonyl ist ein auf Chromium basierender Browser, der für den Betrieb im Terminal entwickelt wurde
  es: Carbonyl es un navegador basado en Chromium diseñado para ejecutarse en una terminal
  fr: Carbonyl est un navigateur basé sur Chromium conçu pour fonctionner dans un terminal
  id: Carbonyl adalah browser berbasis Chromium yang dibangun untuk berjalan di terminal
  it: Carbonyl è un browser basato su Chromium progettato per funzionare in un terminale
  ja: Carbonyl はターミナルで動作するように設計された Chromium ベースのブラウザです
  ko: Carbonyl은 터미널에서 실행되도록 설계된 Chromium 기반 브라우저입니다
  pl: Carbonyl to przeglądarka oparta na Chromium, stworzona do działania w terminalu
  pt: Carbonyl é um navegador baseado no Chromium criado para rodar em um terminal
  ro: Carbonyl este un browser bazat pe Chromium, creat pentru a rula într-un terminal
  ru: Carbonyl — браузер на базе Chromium, созданный для работы в терминале
  th: Carbonyl คือเบราว์เซอร์ที่สร้างบน Chromium ซึ่งออกแบบมาให้ทำงานในเทอร์มินัล
  tr: Carbonyl, terminalde çalışmak üzere geliştirilmiş Chromium tabanlı bir tarayıcıdır
  uk: Carbonyl — браузер на базі Chromium, створений для роботи в терміналі
  vi: Carbonyl là trình duyệt dựa trên Chromium được xây dựng để chạy trong terminal
x:
  source: https://github.com/fathyb/carbonyl
  eget: fathyb/carbonyl
  yay: carbonyl
rule:
  /x:
    cmd: x pkg use carbonyl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget fathyb/carbonyl
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install --global carbonyl
    reference: https://github.com/fathyb/carbonyl?tab=readme-ov-file#npm
    dsnap: carbonyl
  arch/yay:
    cmd: yay -S carbonyl
    reference: https://aur.archlinux.org/packages/carbonyl
binlist:
- carbonyl

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 126 KB
          rating: 1
          desc:
            cn: 约 126 KB（估算）
            en: ~126 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
