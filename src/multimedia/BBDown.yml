lang: C#
homepage: https://github.com/nilaoda/BBDown
license: MIT
desc:
  cn: 一款命令行式哔哩哔哩下载器
  en: A command-line Bilibili Downloader
x:
  source: https://github.com/nilaoda/BBDown
  eget: https://github.com/nilaoda/BBDown
rule:
  /eget:
    cmd: x eget nilaoda/BBDown
    reference: https://x-cmd.com/mod/eget
  /dotnet:
    cmd: dotnet tool install --global BBDown
    reference: https://github.com/nilaoda/BBDown
  arch/yay:
    cmd: yay -S bbdown-bin
    reference: https://aur.archlinux.org/packages/bbdown-bin
binlist:
- BBDown

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
