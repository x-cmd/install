lang: C#
homepage: https://github.com/nilaoda/BBDown
license: MIT
desc:
  cn: 一款命令行式哔哩哔哩下载器
  en: A command-line Bilibili Downloader
  cs: Nástroj příkazové řádky pro stahování z Bilibili
  de: Ein Kommandozeilen-Downloader für Bilibili
  es: Un descargador de Bilibili para línea de comandos
  fr: Un téléchargeur Bilibili en ligne de commande
  id: Pengunduh Bilibili berbasis baris perintah
  it: Un downloader Bilibili da riga di comando
  ja: コマンドライン版の Bilibili ダウンローダー
  ko: 명령줄용 Bilibili 다운로더
  pl: Narzędzie wiersza poleceń do pobierania z Bilibili
  pt: Um downloader de Bilibili para linha de comando
  ro: Un program de descărcare Bilibili pentru linia de comandă
  ru: Консольный загрузчик для Bilibili
  th: ตัวดาวน์โหลด Bilibili สำหรับบรรทัดคำสั่ง
  tr: Bilibili için bir komut satırı indiricisi
  uk: Консольний завантажувач для Bilibili
  vi: Trình tải Bilibili cho dòng lệnh
x:
  source: https://github.com/nilaoda/BBDown
  eget: nilaoda/BBDown
  yay: bbdown-bin
rule:
  /eget:
    cmd: x eget nilaoda/BBDown
    reference: https://x-cmd.com/mod/eget
  /dotnet:
    cmd: dotnet tool install --global BBDown
    reference: https://github.com/nilaoda/BBDown
  arch/yay:
    cmd: yay -S bbdown-bin
    reference: https://aur.archlinux.org/packages/bbdown-bin
binlist:
- BBDown

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 21 MB
          rating: 2
          desc:
            cn: 安装 21 MB
            en: 21 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
