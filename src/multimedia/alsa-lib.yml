lang: C
homepage: https://github.com/alsa-project/alsa-lib
license: LGPL-2.1
desc:
  cn: 为 Linux 操作系统提供音频和 MIDI 功能
  en: Provides audio and MIDI functionality to the Linux operating system
x:
  source: https://github.com/alsa-project/alsa-lib
rule:
  darwin/brew:
    cmd: brew install alsa-lib
    reference: https://formulae.brew.sh/formula/alsa-lib#default
binlist:
- alsa-lib

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4.0 MB
          rating: 1
          desc:
            cn: 约 4.0 MB（估算）
            en: ~4.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
