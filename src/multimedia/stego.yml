lang: Rust
homepage: https://github.com/ajmwagar/stego
license: MIT
desc:
  en: stego is a steganographic swiss army knife
  cn: stego 是一把隐写瑞士军刀
x:
  source: https://github.com/ajmwagar/stego
rule:
  /cargo:
    cmd: cargo install stego
    reference: https://github.com/ajmwagar/stego?tab=readme-ov-file#-installation
    dsnap: stego
binlist:
- stego

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
