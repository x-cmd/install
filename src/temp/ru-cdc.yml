lang: Rust
homepage: https://github.com/ipconfiger/ru-cdc
license: Apache-2.0
desc:
  cn: 用 Rust 实现的 CDC 工具
  en: Another CDC Tool Written by Rust
x:
  source: https://github.com/ipconfiger/ru-cdc
rule:
  /curl:
    cmd: curl -L -o ru-cdc-ver-0.1.1-x86.zip https://github.com/ipconfiger/ru-cdc/releases/download/x86-ver-0.1.1/ru-cdc-ver-0.1.1-x86.zip
    reference: https://github.com/ipconfiger/ru-cdc/releases
binlist:
- ru-cdc

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
