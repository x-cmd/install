lang: JavaScript
homepage: https://github.com/DavidAnson/markdownlint-cli2
license: MIT
desc:
  cn: 快速、灵活、基于配置的命令行界面，用于使用 markdownlint 库对 Markdown/CommonMark 文件进行 linting
  en: A fast, flexible, configuration-based command-line interface for linting Markdown/CommonMark files with the markdownlint library
x:
  source: https://github.com/DavidAnson/markdownlint-cli2
  brew: markdownlint-cli2
  npm: markdownlint-cli2
rule:
  /npm:
    cmd: npm install markdownlint-cli2 --global
    reference: https://github.com/DavidAnson/markdownlint-cli2?tab=readme-ov-file#install
    dsnap: markdownlint-cli2
  darwin/brew:
    cmd: brew install markdownlint-cli2
    reference: https://github.com/DavidAnson/markdownlint-cli2?tab=readme-ov-file#install
binlist:
- markdownlint-cli2

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 KB
          rating: 1
          desc:
            cn: 约 10 KB（估算）
            en: ~10 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
