lang: Ocaml
homepage: https://baturin.org/tools/bnfgen/
desc:
  cn: BNFGen 是一个基于上下文无关语法的随机文本生成器
  en: BNFGen is a random text generator based on context-free grammars
rule:
  /opam:
    cmd: opam install bnfgen
    reference: https://github.com/dmbaturin/bnfgen?tab=readme-ov-file#installation
  /npm:
    cmd: npm install bnfgen
    reference: https://www.npmjs.com/package/bnfgen
    dsnap: bnfgen
binlist:
- bnfgen
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
