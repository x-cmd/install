lang: Ocaml
homepage: https://baturin.org/tools/bnfgen/
desc:
  cn: BNFGen 是一个基于上下文无关语法的随机文本生成器
  en: BNFGen is a random text generator based on context-free grammars
rule:
  /opam:
    cmd: opam install bnfgen
    reference: https://github.com/dmbaturin/bnfgen?tab=readme-ov-file#installation
  /npm:
    cmd: npm install bnfgen
    reference: https://www.npmjs.com/package/bnfgen
    dsnap: bnfgen
binlist:
- bnfgen
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
