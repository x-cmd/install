lang: Ocaml
homepage: https://baturin.org/tools/bnfgen/
desc:
  cn: BNFGen 是一个基于上下文无关语法的随机文本生成器
  en: BNFGen is a random text generator based on context-free grammars
  cs: BNFGen je generátor náhodného textu založený na bezkontextových gramatikách
  de: BNFGen ist ein Zufallstext-Generator, der auf kontextfreien Grammatiken basiert
  es: BNFGen es un generador de texto aleatorio basado en gramáticas libres de contexto
  fr: BNFGen est un générateur de texte aléatoire fondé sur des grammaires hors contexte
  id: BNFGen adalah generator teks acak berbasis tata bahasa bebas konteks
  it: BNFGen è un generatore di testo casuale basato su grammatiche libere dal contesto
  ja: BNFGen は文脈自由文法に基づくランダムテキスト生成器です
  ko: BNFGen은 문맥 자유 문법에 기반한 무작위 텍스트 생성기입니다
  pl: BNFGen to generator losowej tekstu oparty na gramatykach bezkontekstowych
  pt: BNFGen é um gerador de texto aleatório baseado em gramáticas livres de contexto
  ro: BNFGen este un generator de text aleatoriu bazat pe gramatici fără context
  ru: BNFGen — это генератор случайного текста на основе контекстно-свободных грамматик
  th: BNFGen คือตัวสร้างข้อความแบบสุ่มที่อาศัยไวยากรณ์ไม่ขึ้นกับบริบท
  tr: BNFGen, bağlamdan bağımsız gramerlere dayanan bir rastgele metin oluşturucudur
  uk: BNFGen — це генератор випадкового тексту на основі контекстно-вільних граматик
  vi: BNFGen là trình tạo văn bản ngẫu nhiên dựa trên ngữ pháp phi ngữ cảnh
rule:
  /opam:
    cmd: opam install bnfgen
    reference: https://github.com/dmbaturin/bnfgen?tab=readme-ov-file#installation
  /npm:
    cmd: npm install bnfgen
    reference: https://www.npmjs.com/package/bnfgen
    dsnap: bnfgen

x:
  npm: bnfgen
binlist:
- bnfgen
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
