lang: JavaScript
homepage: https://github.com/commenthol/markedpp
license: MIT
desc:
  cn: markedpp 是在 Markdown 编写的文档的预处理器
  en: markedpp is a preprocessor for documents written in markdown
x:
  source: https://github.com/commenthol/markedpp
  npm: markedpp
rule:
  /npm:
    cmd: npm install -g markedpp
    reference: https://github.com/commenthol/markedpp?tab=readme-ov-file#3-installation
    dsnap: markedpp
binlist:
- markedpp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 KB
          rating: 1
          desc:
            cn: 约 9 KB（估算）
            en: ~9 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
