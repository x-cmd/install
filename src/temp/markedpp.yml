lang: JavaScript
homepage: https://github.com/commenthol/markedpp
license: MIT
desc:
  cn: markedpp 是在 Markdown 编写的文档的预处理器
  en: markedpp is a preprocessor for documents written in markdown
x:
  source: https://github.com/commenthol/markedpp
rule:
  /npm:
    cmd: npm install -g markedpp
    reference: https://github.com/commenthol/markedpp?tab=readme-ov-file#3-installation
    dsnap: markedpp
binlist:
- markedpp

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
