lang: JavaScript
homepage: https://github.com/commenthol/markedpp
license: MIT
desc:
  cn: markedpp 是在 Markdown 编写的文档的预处理器
  en: markedpp is a preprocessor for documents written in markdown
  cs: markedpp je předzpracování dokumentů napsaných v markdownu
  de: markedpp ist ein Vorverarbeiter für in Markdown geschriebene Dokumente
  es: markedpp es un preprocesador de documentos escritos en markdown
  fr: markedpp est un préprocesseur pour les documents écrits en markdown
  id: markedpp adalah praprosesor untuk dokumen yang ditulis dengan markdown
  it: markedpp è un preprocessore per documenti scritti in markdown
  ja: markedpp は Markdown で書かれたドキュメントのプリプロセッサです
  ko: markedpp는 markdown로 작성된 문서를 전처리하는 도구입니다
  pl: markedpp to preprocesor dokumentów zapisanych w markdown
  pt: markedpp é um pré-processador de documentos escritos em markdown
  ro: markedpp este un preprocesor pentru documente scrise în markdown
  ru: markedpp — это препроцессор для документов, написанных в markdown
  th: markedpp คือตัวประมวลผลล่วงหน้าสำหรับเอกสารที่เขียนด้วย markdown
  tr: markedpp, markdown ile yazılmış belgeler için bir ön işleyicidir
  uk: markedpp — це препроцесор для документів, написаних у markdown
  vi: markedpp là bộ tiền xử lý cho các tài liệu viết bằng markdown
x:
  source: https://github.com/commenthol/markedpp
  npm: markedpp
rule:
  /npm:
    cmd: npm install -g markedpp
    reference: https://github.com/commenthol/markedpp?tab=readme-ov-file#3-installation
    dsnap: markedpp
binlist:
- markedpp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 KB
          rating: 1
          desc:
            cn: 约 9 KB（估算）
            en: ~9 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
