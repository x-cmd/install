lang: C
homepage: https://github.com/kohler/gifsicle
license: GPL-2.0
desc:
  cn: 创建、操作和优化 GIF 图像和动画
  en: Create, manipulate and optimize GIF images and animations
x:
  source: https://github.com/kohler/gifsicle
  apt: gifsicle
  dnf: gifsicle
  brew: gifsicle
  pacman: gifsicle
  apk: gifsicle
  apt-get: gifsicle
  scoop: main/gifsicle
  choco: gifsicle
rule:
  darwin/brew:
    cmd: brew install gifsicle
    reference: https://formulae.brew.sh/formula/gifsicle#default
  (win|wsl2)/scoop:
    cmd: x scoop install main/gifsicle
    reference: https://scoop.sh/#/apps?q=gifsicle
  (win|wsl2)/choco:
    cmd: x choco install gifsicle
    reference: https://community.chocolatey.org/packages/gifsicle
  debian/apt:
    cmd: sudo apt-get install gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  ubuntu/apt:
    cmd: sudo apt-get install gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  alpine/apk:
    cmd: sudo apk add gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  arch/pacman:
    cmd: sudo pacman -S gifsicle
    reference: https://command-not-found.com/gifsicle
  kali/apt:
    cmd: sudo apt-get install gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  fedora/dnf:
    cmd: sudo dnf install gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  raspbian/apt:
    cmd: sudo apt-get install gifsicle
    reference: https://command-not-found.com/gifsicle
binlist:
- gifsicle

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 730 KB
          rating: 1
          desc:
            cn: 约 730 KB（估算）
            en: ~730 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
