lang: C
homepage: https://github.com/kohler/gifsicle
license: GPL-2.0
desc:
  cn: 创建、操作和优化 GIF 图像和动画
  en: Create, manipulate and optimize GIF images and animations
  cs: Vytváří, upravuje a optimalizuje obrázky a animace GIF
  de: Erstellt, bearbeitet und optimiert GIF-Bilder und -Animationen
  es: Crea, manipula y optimiza imágenes y animaciones GIF
  fr: Crée, manipule et optimise des images et des animations GIF
  id: Membuat, memanipulasi, dan mengoptimalkan gambar serta animasi GIF
  it: Crea, manipola e ottimizza immagini e animazioni GIF
  ja: GIF 画像とアニメーションの作成、編集、最適化を行います
  ko: GIF 이미지와 애니메이션을 만들고, 조작하고, 최적화합니다
  pl: Tworzy, modyfikuje i optymalizuje obrazy oraz animacje GIF
  pt: Cria, manipula e otimiza imagens e animações GIF
  ro: Creează, manipulează și optimizează imagini și animații GIF
  ru: Создаёт, обрабатывает и оптимизирует изображения и анимации GIF
  th: สร้าง จัดการ และปรับให้ค่าภาพและแอนิเมชัน GIF
  tr: GIF görselleri ve animasyonları oluşturur, düzenler ve optimize eder
  uk: Створює, обробляє та оптимізує зображення й анімації GIF
  vi: Tạo, thao tác và tối ưu hóa hình ảnh và hoạt ảnh GIF
x:
  source: https://github.com/kohler/gifsicle
  apt: gifsicle
  dnf: gifsicle
  brew: gifsicle
  pacman: gifsicle
  apk: gifsicle
  apt-get: gifsicle
  scoop: main/gifsicle
  choco: gifsicle
rule:
  darwin/brew:
    cmd: brew install gifsicle
    reference: https://formulae.brew.sh/formula/gifsicle#default
  (win|wsl2)/scoop:
    cmd: x scoop install main/gifsicle
    reference: https://scoop.sh/#/apps?q=gifsicle
  (win|wsl2)/choco:
    cmd: x choco install gifsicle
    reference: https://community.chocolatey.org/packages/gifsicle
  debian/apt:
    cmd: sudo apt-get install gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  ubuntu/apt:
    cmd: sudo apt-get install gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  alpine/apk:
    cmd: sudo apk add gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  arch/pacman:
    cmd: sudo pacman -S gifsicle
    reference: https://command-not-found.com/gifsicle
  kali/apt:
    cmd: sudo apt-get install gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  fedora/dnf:
    cmd: sudo dnf install gifsicle
    reference: https://command-not-found.com/gifsicle
    dsnap: gifsicle
  raspbian/apt:
    cmd: sudo apt-get install gifsicle
    reference: https://command-not-found.com/gifsicle
binlist:
- gifsicle

