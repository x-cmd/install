lang: JavaScript
desc:
  cn: 将 Markdown 文档转换为单页应用程序 (SPA)
  en: Convert markdown documents to single page applications (SPA)
homepage: https://book.gemjs.org/cli
rule:
  /npm:
    cmd: npm install -g gem-book
    reference: https://book.gemjs.org/cli
    dsnap: gem-book

x:
  npm: gem-book
binlist:
- gem-book
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
