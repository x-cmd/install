lang: C++
homepage: https://github.com/wez/atomicparsley
license: GPL-2.0
desc:
  cn: AtomicParsley 是一个轻量级命令行程序，用于读取、解析元数据并将其设置为 MPEG-4 文件，特别是 iTunes 风格的元数据
  en: AtomicParsley is a lightweight command line program for reading, parsing and setting metadata into MPEG-4 files, in particular, iTunes-style metadata
x:
  source: https://github.com/wez/atomicparsley
  eget: https://github.com/wez/atomicparsley
rule:
  /eget:
    cmd: x eget wez/atomicparsley
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install atomicparsley
    reference: https://github.com/wez/atomicparsley?tab=readme-ov-file#macos
binlist:
- atomicparsley

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
