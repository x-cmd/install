lang: JavaScript
homepage: https://github.com/juliangruber/jilla
desc:
  cn: jilla 是专为懒人设计的 Jira 客户端
  en: jilla is a Jira client for lazy people
x:
  source: https://github.com/juliangruber/jilla
rule:
  /npm:
    cmd: npm install -g jilla
    reference: https://github.com/juliangruber/jilla?tab=readme-ov-file#installation
    dsnap: jilla
binlist:
- jilla
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
