lang: JavaScript
homepage: https://github.com/juliangruber/jilla
desc:
  cn: jilla 是专为懒人设计的 Jira 客户端
  en: jilla is a Jira client for lazy people
x:
  source: https://github.com/juliangruber/jilla
rule:
  /npm:
    cmd: npm install -g jilla
    reference: https://github.com/juliangruber/jilla?tab=readme-ov-file#installation
    dsnap: jilla
binlist:
- jilla
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
