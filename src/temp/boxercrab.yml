lang: Rust
homepage: https://github.com/PrivateRookie/boxercrab
license: Apache-2.0
desc:
  cn: 使用 Rust 实现 MySQL binlog 解析器
  en: MySQL binlog parser impl with Rust
x:
  source: https://github.com/PrivateRookie/boxercrab
rule:
  /cargo:
    cmd: cargo install --bin bcrab --git https://github.com/PrivateRookie/boxercrab.git
    reference: https://github.com/PrivateRookie/boxercrab?tab=readme-ov-file#cli
    dsnap: bcrab
binlist:
- boxercrab

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
