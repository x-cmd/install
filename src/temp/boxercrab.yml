lang: Rust
homepage: https://github.com/PrivateRookie/boxercrab
license: Apache-2.0
desc:
  cn: 使用 Rust 实现 MySQL binlog 解析器
  en: MySQL binlog parser impl with Rust
x:
  source: https://github.com/PrivateRookie/boxercrab
  cargo: --bin
rule:
  /cargo:
    cmd: cargo install --bin bcrab --git https://github.com/PrivateRookie/boxercrab.git
    reference: https://github.com/PrivateRookie/boxercrab?tab=readme-ov-file#cli
    dsnap: bcrab
binlist:
- boxercrab

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 121 KB
          rating: 1
          desc:
            cn: 约 121 KB（估算）
            en: ~121 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
