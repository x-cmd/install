lang: Ruby
homepage: https://github.com/ioquatix/activerecord-migrations
desc:
  cn: 用于简化非 Rails 项目中的 ActiveRecord 迁移的 gem
  en: A gem to simplify activerecord migrations in non-rails projects
x:
  source: https://github.com/ioquatix/activerecord-migrations
rule:
  /gem:
    cmd: gem 'activerecord-migrations'
    reference: https://github.com/ioquatix/activerecord-migrations?tab=readme-ov-file#installation
binlist:
- activerecord-migrations
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
