lang: JavaScript
homepage: https://github.com/coapjs/coap-cli
desc:
  cn: COAP-CLI 是基于 Node.js 和 Node-coap 建立的 COAP 的命令行接口
  en: CoAP-CLI is a command line interface for CoAP, built on node.js and node-coap
x:
  source: https://github.com/coapjs/coap-cli
rule:
  /npm:
    cmd: npm install coap-cli -g
    reference: https://github.com/coapjs/coap-cli?tab=readme-ov-file#install
    dsnap: coap-cli
binlist:
- coap-cli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
