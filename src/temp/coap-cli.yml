lang: JavaScript
homepage: https://github.com/coapjs/coap-cli
desc:
  cn: COAP-CLI 是基于 Node.js 和 Node-coap 建立的 COAP 的命令行接口
  en: CoAP-CLI is a command line interface for CoAP, built on node.js and node-coap
x:
  source: https://github.com/coapjs/coap-cli
rule:
  /npm:
    cmd: npm install coap-cli -g
    reference: https://github.com/coapjs/coap-cli?tab=readme-ov-file#install
    dsnap: coap-cli
binlist:
- coap-cli
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
