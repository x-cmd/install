lang: Go
homepage: https://github.com/therootcompany/sclient
desc:
  cn: 安全客户端，用于将 TLS（又名 SSL）安全服务公开为本地纯文本连接
  en: Secure Client for exposing TLS (aka SSL) secured services as plain-text connections locally
x:
  source: https://github.com/therootcompany/sclient
  eget: https://github.com/therootcompany/sclient
rule:
  /eget:
    cmd: x eget therootcompany/sclient
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -sS https://webinstall.dev/sclient | bash
    reference: https://github.com/therootcompany/sclient?tab=readme-ov-file#mac-linux
  linux/curl:
    cmd: curl -sS https://webinstall.dev/sclient | bash
    reference: https://github.com/therootcompany/sclient?tab=readme-ov-file#mac-linux
  win/curl:
    cmd: curl.exe -A MS https://webinstall.dev/sclient | powershell
    reference: https://github.com/therootcompany/sclient?tab=readme-ov-file#mac-linux
binlist:
- sclient
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
