lang: Go
homepage: https://github.com/therootcompany/keypairs
license: MIT
desc:
  cn: 跨平台命令行工具和 Golang 库，可与 RSA、ECDSA、PEM、DER、JWK 和 JOSE 套件配合使用
  en: A cross-platform Command Line Tool and Golang Library that works with RSA, ECDSA, PEM, DER, JWK, and the JOSE suite
x:
  source: https://github.com/therootcompany/keypairs
  eget: therootcompany/keypairs
rule:
  /eget:
    cmd: x eget therootcompany/keypairs
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -sS https://webinstall.dev/keypairs | bash
    reference: https://github.com/therootcompany/keypairs?tab=readme-ov-file#install
  linux/curl:
    cmd: curl -sS https://webinstall.dev/keypairs | bash
    reference: https://github.com/therootcompany/keypairs?tab=readme-ov-file#install
  win/curl:
    cmd: curl.exe -A MS https://webinstall.dev/keypairs | powershell
    reference: https://github.com/therootcompany/keypairs?tab=readme-ov-file#install
binlist:
- keypairs

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/arm64)
            en: ~2 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
