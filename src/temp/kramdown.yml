lang: Ruby
homepage: https://github.com/gettalong/kramdown
desc:
  cn: kramdown 首先是一个用于将 Markdown 超集编写的文本转换为 HTML 的库
  en: kramdown is first and foremost a library for converting text written in a superset of Markdown to HTML
x:
  source: https://github.com/gettalong/kramdown
  eget: https://github.com/gettalong/kramdown
rule:
  /eget:
    cmd: x eget gettalong/kramdown
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install ruby
    reference: https://kramdown.gettalong.org/installation.html
    dsnap: ruby
  ubuntu/apt:
    cmd: sudo apt-get install ruby
    reference: https://kramdown.gettalong.org/installation.html
    dsnap: ruby
  linux/gem:
    cmd: sudo gem install kramdown
    reference: https://kramdown.gettalong.org/installation.html
  darwin/gem:
    cmd: sudo gem install kramdown
    reference: https://kramdown.gettalong.org/installation.html
  win/gem:
    cmd: sudo gem install kramdown
    reference: https://kramdown.gettalong.org/installation.html
binlist:
- kramdown
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 1
          desc:
            cn: 安装 10 MB
            en: 10 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
