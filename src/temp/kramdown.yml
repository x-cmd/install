lang: Ruby
homepage: https://github.com/gettalong/kramdown
desc:
  cn: kramdown 首先是一个用于将 Markdown 超集编写的文本转换为 HTML 的库
  en: kramdown is first and foremost a library for converting text written in a superset of Markdown to HTML
x:
  source: https://github.com/gettalong/kramdown
  eget: https://github.com/gettalong/kramdown
  apt: ruby
  apt-get: ruby
  gem: kramdown
rule:
  /eget:
    cmd: x eget gettalong/kramdown
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install ruby
    reference: https://kramdown.gettalong.org/installation.html
    dsnap: ruby
  ubuntu/apt:
    cmd: sudo apt-get install ruby
    reference: https://kramdown.gettalong.org/installation.html
    dsnap: ruby
  linux/gem:
    cmd: sudo gem install kramdown
    reference: https://kramdown.gettalong.org/installation.html
  darwin/gem:
    cmd: sudo gem install kramdown
    reference: https://kramdown.gettalong.org/installation.html
  win/gem:
    cmd: sudo gem install kramdown
    reference: https://kramdown.gettalong.org/installation.html
binlist:
- kramdown
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 21 KB
          rating: 1
          desc:
            cn: 约 21 KB（估算）
            en: ~21 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
