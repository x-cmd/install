lang: TypeScript
homepage: https://github.com/mckaywrigley/chatbot-ui
license: MIT
desc:
  cn: 适用于每个模型的人工智能聊天
  en: AI chat for every model
x:
  source: https://github.com/mckaywrigley/chatbot-ui
rule:
  /npm:
    cmd: 'git clone https://github.com/mckaywrigley/chatbot-ui.git \

      && cd chatbot-ui/ \

      && npm install

      '
    reference: https://github.com/mckaywrigley/chatbot-ui?tab=readme-ov-file#local-quickstart
    dsnap: chatbot-ui
binlist:
- chatbot-ui

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 31 KB
          rating: 1
          desc:
            cn: 约 31 KB（估算）
            en: ~31 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
