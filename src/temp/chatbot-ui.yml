lang: TypeScript
homepage: https://github.com/mckaywrigley/chatbot-ui
license: MIT
desc:
  cn: 适用于每个模型的人工智能聊天
  en: AI chat for every model
x:
  source: https://github.com/mckaywrigley/chatbot-ui
rule:
  /npm:
    cmd: 'git clone https://github.com/mckaywrigley/chatbot-ui.git \

      && cd chatbot-ui/ \

      && npm install

      '
    reference: https://github.com/mckaywrigley/chatbot-ui?tab=readme-ov-file#local-quickstart
    dsnap: chatbot-ui
binlist:
- chatbot-ui

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
