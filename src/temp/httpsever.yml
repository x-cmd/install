lang: Shell
homepage: https://github.com/txthinking/httpserver
license: MIT
desc:
  cn: 一个非常简单的 http static server, 通常用于测试
  en: A very simple http static server, sometimes we need it for testing
  cs: Velmi jednoduchý http statický server, někdy ho potřebujeme pro testování
  de: Ein sehr einfacher statischer HTTP-Server, manchmal brauchen wir ihn zum Testen
  es: Un servidor estático http muy sencillo, a veces lo necesitamos para hacer pruebas
  fr: Un serveur statique http très simple, dont nous avons parfois besoin pour les tests
  id: Server statis http yang sangat sederhana, kadang kita membutuhkannya untuk pengujian
  it: Un server statico http molto semplice, a volte serve per i test
  ja: とてもシンプルな http 静的サーバー。テストのために必要になることがあります
  ko: 매우 간단한 http 정적 서버로, 테스트할 때 필요할 때가 있습니다
  pl: Bardzo prosty statyczny serwer http, czasem przydaje się do testów
  pt: Um servidor estático http muito simples, às vezes precisamos dele para testes
  ro: Un server static http foarte simplu, uneori avem nevoie de el pentru testare
  ru: Очень простой статический http-сервер, иногда он нужен для тестирования
  th: เซิร์ฟเวอร์คงที่ http ที่เรียบง่ายมาก ในบางครั้งเราต้องการมันเพื่อการทดสอบ
  tr: Çok basit bir http statik sunucusu, bazen test için ihtiyaç duyarız
  uk: Дуже простий статичний http-сервер, іноді він потрібен для тестування
  vi: Một máy chủ tĩnh http rất đơn giản, đôi khi chúng ta cần nó để kiểm thử
x:
  source: https://github.com/txthinking/httpserver
  eget: txthinking/httpserver
rule:
  /eget:
    cmd: x eget txthinking/httpserver
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install httpserver
    reference: https://github.com/txthinking/httpserver?tab=readme-ov-file#install-via-nami
binlist:
- httpsever

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
