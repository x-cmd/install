lang: Shell
homepage: https://github.com/txthinking/httpserver
license: MIT
desc:
  cn: 一个非常简单的 http static server, 通常用于测试
  en: A very simple http static server, sometimes we need it for testing
x:
  source: https://github.com/txthinking/httpserver
  eget: txthinking/httpserver
rule:
  /eget:
    cmd: x eget txthinking/httpserver
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install httpserver
    reference: https://github.com/txthinking/httpserver?tab=readme-ov-file#install-via-nami
binlist:
- httpsever

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
