lang: Shell
homepage: https://github.com/txthinking/httpserver
license: MIT
desc:
  cn: 一个非常简单的 http static server, 通常用于测试
  en: A very simple http static server, sometimes we need it for testing
x:
  source: https://github.com/txthinking/httpserver
  eget: https://github.com/txthinking/httpserver
rule:
  /eget:
    cmd: x eget txthinking/httpserver
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install httpserver
    reference: https://github.com/txthinking/httpserver?tab=readme-ov-file#install-via-nami
binlist:
- httpsever

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
