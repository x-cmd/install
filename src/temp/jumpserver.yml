lang: Python
homepage: https://github.com/jumpserver/jumpserver
license: GPL-3.0
desc:
  cn: JumpServer 是广受欢迎的开源堡垒机，是符合 4A 规范的专业运维安全审计系统
  en: JumpServer Privileged Access Management (PAM) Complying with 4A Secification
x:
  source: https://github.com/jumpserver/jumpserver
  eget: https://github.com/jumpserver/jumpserver
rule:
  /eget:
    cmd: x eget jumpserver/jumpserver
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: "if [ \"$___X_CMD_WEBSRC_REGION\" = \"cn\" ]; then\n  curl -sSL https://resource.fit2cloud.com/jumpserver/jumpserver/releases/latest/download/quick_start.sh | bash\nelse\n  curl -sSL https://github.com/jumpserver/jumpserver/releases/latest/download/quick_start.sh | bash\nfi\n"
    reference: https://docs.jumpserver.org/zh/v3/quick_start/
binlist:
- jumpserver
