lang: JavaScript
homepage: https://github.com/igorshubovych/markdownlint-cli
license: MIT
desc:
  cn: Markdownlint 命令行接口
  en: MarkdownLint Command Line Interface
x:
  source: https://github.com/igorshubovych/markdownlint-cli
rule:
  /npm:
    cmd: npm install -g markdownlint-cli
    reference: https://github.com/igorshubovych/markdownlint-cli?tab=readme-ov-file#installation
    dsnap: markdownlint-cli
  darwin/brew:
    cmd: brew install markdownlint-cli
    reference: https://github.com/igorshubovych/markdownlint-cli?tab=readme-ov-file#installation
binlist:
- markdownlint-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
