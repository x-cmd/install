lang: JavaScript
homepage: https://github.com/igorshubovych/markdownlint-cli
license: MIT
desc:
  cn: Markdownlint 命令行接口
  en: MarkdownLint Command Line Interface
  cs: MarkdownLint rozhraní příkazové řádky
  de: MarkdownLint-Kommandozeilenschnittstelle
  es: Interfaz de línea de comandos de MarkdownLint
  fr: Interface de ligne de commande MarkdownLint
  id: Antarmuka baris perintah MarkdownLint
  it: Interfaccia a riga di comando di MarkdownLint
  ja: MarkdownLint のコマンドラインインターフェース
  ko: MarkdownLint 명령줄 인터페이스
  pl: Interfejs wiersza poleceń MarkdownLint
  pt: Interface de linha de comando do MarkdownLint
  ro: Interfață de linie de comandă MarkdownLint
  ru: Интерфейс командной строки MarkdownLint
  th: อินเทอร์เฟซบรรทัดคำสั่งของ MarkdownLint
  tr: MarkdownLint komut satırı arayüzü
  uk: Інтерфейс командного рядка MarkdownLint
  vi: Giao diện dòng lệnh MarkdownLint
x:
  source: https://github.com/igorshubovych/markdownlint-cli
  brew: markdownlint-cli
  npm: markdownlint-cli
rule:
  /npm:
    cmd: npm install -g markdownlint-cli
    reference: https://github.com/igorshubovych/markdownlint-cli?tab=readme-ov-file#installation
    dsnap: markdownlint-cli
  darwin/brew:
    cmd: brew install markdownlint-cli
    reference: https://github.com/igorshubovych/markdownlint-cli?tab=readme-ov-file#installation
binlist:
- markdownlint-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
