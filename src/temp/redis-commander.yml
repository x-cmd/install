lang: JavaScript
homepage: https://github.com/joeferner/redis-commander
license: MIT
desc:
  cn: Redis-Commander 是一个 Node.js Web 应用程序，用于查看、编辑和管理 Redis 数据库
  en: Redis-Commander is a node.js web application used to view, edit, and manage a Redis Database
x:
  source: https://github.com/joeferner/redis-commander
rule:
  /npm:
    cmd: npm install -g redis-commander
    reference: https://github.com/joeferner/redis-commander?tab=readme-ov-file#install-and-run
    dsnap: redis-commander
binlist:
- redis-commander

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 KB
          rating: 1
          desc:
            cn: 约 15 KB（估算）
            en: ~15 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
