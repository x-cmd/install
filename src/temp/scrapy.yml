lang: Python
desc:
  cn: Scrapy 是一个 BSD 许可的快速高级网络爬行和网络抓取框架，用于爬行网站并从页面中提取结构化数据。它可用于多种用途，从数据挖掘到监控和自动化测试
  en: Scrapy is a BSD-licensed fast high-level web crawling and web scraping framework, used to crawl websites and extract structured data from their pages. It can be used for a wide range of purposes, from data mining to monitoring and automated testing
  cs: Scrapy je rychlý, vysoce úrovňový framework pro procházení webu a škrabání webu s licencí BSD, který se používá k procházení webových stránek a extrakci strukturovaných dat z jejich stránek. Může být použit pro širokou škálu účelů, od těžby dat po monitorování a automatizované testování
  de: Scrapy ist ein BSD-lizenziertes, schnelles und leistungsfähiges Framework zum Crawlen und Scrapen von Webs, das zum Crawlen von Websites und zum Extrahieren strukturierter Daten aus deren Seiten verwendet wird. Es kann für eine Vielzahl von Zwecken eingesetzt werden, von Data Mining bis hin zu Monitoring und automatisierten Tests
  es: Scrapy es un framework de rastreo web y scraping web rápido y de alto nivel con licencia BSD, que se usa para rastrear sitios web y extraer datos estructurados de sus páginas. Puede usarse para una gran variedad de fines, desde la minería de datos hasta la monitorización y las pruebas automatizadas
  fr: Scrapy est un framework de crawling web et de scraping web rapide et de haut niveau sous licence BSD, utilisé pour parcourir des sites web et extraire des données structurées de leurs pages. Il peut être utilisé pour une large gamme d'usages, de l'exploration de données à la surveillance et aux tests automatisés
  id: Scrapy adalah framework crawling web dan web scraping tingkat tinggi yang cepat dengan lisensi BSD, digunakan untuk merayapi situs web dan mengekstrak data terstruktur dari halamannya. Ini dapat digunakan untuk berbagai keperluan, dari penambangan data hingga pemantauan dan pengujian otomatis
  it: Scrapy è un framework di web crawling e web scraping veloce e di alto livello con licenza BSD, usato per eseguire il crawling di siti web ed estrarre dati strutturati dalle loro pagine. Può essere usato per un'ampia gamma di scopi, dal data mining al monitoraggio e ai test automatizzati
  ja: Scrapy は BSD ライセンスの高速で高レベルの Web クローリングおよび Web スクレイピングフレームワークで、Web サイトを巡回し、そのページから構造化データを抽出するために使われます。データマイニングから監視、自動化テストまで幅広い用途に利用できます
  ko: Scrapy는 BSD 라이선스 기반의 빠르고 고수준인 웹 크롤링 및 웹 스크래핑 프레임워크로, 웹사이트를 크롤링하고 페이지에서 구조화된 데이터를 추출하는 데 사용됩니다. 데이터 마이닝부터 모니터링과 자동화된 테스트까지 다양한 용도로 사용할 수 있습니다
  pl: Scrapy to szybki, wysokopoziomowy framework do crawlowania i scrapowania stron internetowych na licencji BSD, używany do indeksowania witryn i wyodrębniania z nich ustrukturyzowanych danych. Może być używany w wielu celach, od eksploracji danych po monitorowanie i testy automatyczne
  pt: O Scrapy é um framework de rastreamento web e web scraping rápido e de alto nível, licenciado sob a BSD, usado para rastrear sites e extrair dados estruturados de suas páginas. Pode ser usado para uma ampla variedade de finalidades, da mineração de dados ao monitoramento e aos testes automatizados
  ro: Scrapy este un framework rapid de nivel înalt pentru crawling web și web scraping, cu licență BSD, folosit pentru a parcurge site-uri web și a extrage date structurate din paginile lor. Poate fi folosit pentru o gamă largă de scopuri, de la data mining la monitorizare și testare automatizată
  ru: Scrapy — быстрый высокоуровневый фреймворк для веб-краулинга и веб-скрейпинга с лицензией BSD, используемый для обхода сайтов и извлечения структурированных данных с их страниц. Его можно применять для самых разных задач — от интеллектуального анализа данных до мониторинга и автоматизированного тестирования
  th: Scrapy เป็นเฟรมเวิร์กเว็บครอวลและเว็บสแกรปที่เร็วและระดับสูงภายใต้สัญญาอนุญาต BSD ใช้สำหรับครอวลเว็บไซต์และดึงข้อมูลแบบมีโครงสร้างจากหน้าเว็บ สามารถใช้ได้ในหลายวัตถุประสงค์ ตั้งแต่การทำเหมืองข้อมูลไปจนถึงการติดตามและการทดสอบอัตโนมัติ
  tr: Scrapy, BSD lisanslı, hızlı ve gelişmiş bir web tarama ve web kazıma çerçevesidir; web sitelerini taramak ve sayfalarından yapılandırılmış veri çıkarmak için kullanılır. Veri madenciliğinden izlemeye ve otomatik testlere kadar geniş bir yelpazede kullanılabilir
  uk: Scrapy — швидкий високорівневий фреймворк для веб-краулінгу та веб-скрейпінгу з ліцензією BSD, який використовується для обходу веб-сайтів і вилучення структурованих даних із їхніх сторінок. Його можна застосовувати для найширшого спектра завдань — від інтелектуального аналізу даних до моніторингу та автоматизованого тестування
  vi: Scrapy là framework thu thập và quét web cấp cao, tốc độ nhanh theo giấy phép BSD, dùng để thu thập các trang web và trích xuất dữ liệu có cấu trúc từ những trang đó. Nó có thể dùng cho nhiều mục đích, từ khai thác dữ liệu đến giám sát và kiểm thử tự động
homepage: https://github.com/scrapy/scrapy
