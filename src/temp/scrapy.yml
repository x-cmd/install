lang: Python
desc:
  cn: Scrapy 是一个 BSD 许可的快速高级网络爬行和网络抓取框架，用于爬行网站并从页面中提取结构化数据。它可用于多种用途，从数据挖掘到监控和自动化测试
  en: Scrapy is a BSD-licensed fast high-level web crawling and web scraping framework, used to crawl websites and extract structured data from their pages. It can be used for a wide range of purposes, from data mining to monitoring and automated testing
homepage: https://github.com/scrapy/scrapy
license: BSD-3-Clause
x:
  source: https://github.com/scrapy/scrapy
rule:
  /pip:
    cmd: pip install scrapy
    reference: https://github.com/scrapy/scrapy?tab=readme-ov-file#install
    dsnap: scrapy
binlist:
- scrapy

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
