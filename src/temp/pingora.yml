lang: Rust
homepage: https://github.com/cloudflare/pingora
license: Apache-2.0
desc:
  cn: Pingora 是一个 Rust 框架，用于构建快速、可靠和可编程的网络系统
  en: Pingora is a Rust framework to build fast, reliable and programmable networked systems
x:
  source: https://github.com/cloudflare/pingora
rule:
  /cargo:
    cmd: cargo new load_balancer
    reference: https://github.com/cloudflare/pingora/blob/main/docs/quick_start.md
    dsnap: load_balancer
binlist:
- pingora

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3.7 MB
          rating: 1
          desc:
            cn: 约 3.7 MB（估算）
            en: ~3.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
