lang: C
desc:
  cn: 基于命令行的 Markdown 演示工具
  en: Command line-based Markdown presentation tool
homepage: https://github.com/visit1985/mdp
license: GPL-3.0
x:
  source: https://github.com/visit1985/mdp
rule:
  debian/apt:
    cmd: sudo apt-get install mdp
    reference: https://github.com/visit1985/mdp
    dsnap: mdp
  ubuntu/apt:
    cmd: sudo apt-get install mdp
    reference: https://github.com/visit1985/mdp
    dsnap: mdp
  arch/yay:
    cmd: yay -S mdp-git
    reference: https://aur.archlinux.org/packages/mdp-git
binlist:
- mdp

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
