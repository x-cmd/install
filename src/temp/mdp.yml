lang: C
desc:
  cn: 基于命令行的 Markdown 演示工具
  en: Command line-based Markdown presentation tool
homepage: https://github.com/visit1985/mdp
license: GPL-3.0
x:
  source: https://github.com/visit1985/mdp
  apt: mdp
  apt-get: mdp
  yay: mdp-git
rule:
  debian/apt:
    cmd: sudo apt-get install mdp
    reference: https://github.com/visit1985/mdp
    dsnap: mdp
  ubuntu/apt:
    cmd: sudo apt-get install mdp
    reference: https://github.com/visit1985/mdp
    dsnap: mdp
  arch/yay:
    cmd: yay -S mdp-git
    reference: https://aur.archlinux.org/packages/mdp-git
binlist:
- mdp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 143 KB
          rating: 1
          desc:
            cn: 约 143 KB（估算）
            en: ~143 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
