lang: Ruby
homepage: https://github.com/ttscoff/mdless
license: MIT
desc:
  cn: mdless 是一个实用程序，可提供终端中标记文件的格式化和突出显示的视图
  en: mdless is a utility that provides a formatted and highlighted view of Markdown files in Terminal
x:
  source: https://github.com/ttscoff/mdless
rule:
  /gem:
    cmd: gem install mdless
    reference: https://github.com/ttscoff/mdless?tab=readme-ov-file#gem-install
  darwin/brew:
    cmd: brew install mdless
    reference: https://github.com/ttscoff/mdless?tab=readme-ov-file#homebrew
binlist:
- mdless

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
