lang: C++
desc:
  cn: 笔记本和 Markdown 编辑器
  en: Notebooks and Markdown editors
  cs: Notebooky a editory Markdown
  de: Notizbücher und Markdown-Editoren
  es: Cuadernos y editores Markdown
  fr: Carnets et éditeurs Markdown
  id: Buku catatan dan editor Markdown
  it: Taccuini ed editor Markdown
  ja: ノートブックと Markdown エディタ
  ko: 노트북과 Markdown 편집기
  pl: Notatniki i edytory Markdown
  pt: Cadernos e editores Markdown
  ro: Caiete de note și editori Markdown
  ru: Блокноты и редакторы Markdown
  th: สมุดจดบันทึกและโปรแกรมแก้ไข Markdown
  tr: Defterler ve Markdown düzenleyicileri
  uk: Блокноти та редактори Markdown
  vi: Sổ tay và trình soạn thảo Markdown
homepage: https://github.com/dvorka/mindforger
license: GPL-2.0
x:
  source: https://github.com/dvorka/mindforger
  apt: mindforger
  brew: mindforger
  yay: mindforger
rule:
  debian/apt:
    cmd: sudo apt install mindforger
    reference: https://github.com/dvorka/mindforger/wiki/Installation#debian
    dsnap: mindforger
  ubuntu/apt:
    cmd: sudo apt install mindforger
    reference: https://github.com/dvorka/mindforger/wiki/Installation#ubuntu
    dsnap: mindforger
  darwin/brew:
    cmd: brew install mindforger
    reference: https://github.com/dvorka/mindforger/wiki/Installation#macos
  fedora/dnf:
    cmd: sudo dnf install mindforger-MAJOR.MINOR.REVISION.rpm
    reference: https://github.com/dvorka/mindforger/wiki/Installation#fedora
    dsnap: mindforger-MAJOR.MINOR.REVISION.rpm
  arch/yay:
    cmd: yay -S mindforger
    reference: https://aur.archlinux.org/packages/mindforger
binlist:
- mindforger

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 93 MB
          rating: 3
          desc:
            cn: 安装 93 MB
            en: 93 MB install
        download:
          estimate: 93 MB
          desc:
            cn: 约 93 MB 下载 (dmg)
            en: ~93 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
