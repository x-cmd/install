lang: C++
desc:
  cn: 笔记本和 Markdown 编辑器
  en: Notebooks and Markdown editors
homepage: https://github.com/dvorka/mindforger
license: GPL-2.0
x:
  source: https://github.com/dvorka/mindforger
  apt: mindforger
  dnf: mindforger-MAJOR.MINOR.REVISION.rpm
  brew: mindforger
  yay: mindforger
rule:
  debian/apt:
    cmd: sudo apt install mindforger
    reference: https://github.com/dvorka/mindforger/wiki/Installation#debian
    dsnap: mindforger
  ubuntu/apt:
    cmd: sudo apt install mindforger
    reference: https://github.com/dvorka/mindforger/wiki/Installation#ubuntu
    dsnap: mindforger
  darwin/brew:
    cmd: brew install mindforger
    reference: https://github.com/dvorka/mindforger/wiki/Installation#macos
  fedora/dnf:
    cmd: sudo dnf install mindforger-MAJOR.MINOR.REVISION.rpm
    reference: https://github.com/dvorka/mindforger/wiki/Installation#fedora
    dsnap: mindforger-MAJOR.MINOR.REVISION.rpm
  arch/yay:
    cmd: yay -S mindforger
    reference: https://aur.archlinux.org/packages/mindforger
binlist:
- mindforger

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 93 MB
          rating: 3
          desc:
            cn: 安装 93 MB
            en: 93 MB install
        download:
          estimate: 93 MB
          desc:
            cn: 约 93 MB 下载 (dmg)
            en: ~93 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
