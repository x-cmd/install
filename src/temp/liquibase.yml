lang: Java
homepage: https://github.com/liquibase/liquibase
desc:
  cn: Liquibase 是一种数据库架构变更管理解决方案，使您能够更快、更安全地修改和发布从开发到生产的数据库变更
  en: Liquibase is a database schema change management solution that enables you to revise and release database changes faster and safer from development to production
x:
  source: https://github.com/liquibase/liquibase
  eget: https://github.com/liquibase/liquibase
rule:
  /eget:
    cmd: x eget liquibase/liquibase
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: 'wget -O- https://repo.liquibase.com/liquibase.asc | gpg --dearmor > liquibase-keyring.gpg && \

      cat liquibase-keyring.gpg | sudo tee /usr/share/keyrings/liquibase-keyring.gpg > /dev/null && \

      echo ''deb [arch=amd64 signed-by=/usr/share/keyrings/liquibase-keyring.gpg] https://repo.liquibase.com stable main'' | sudo tee /etc/apt/sources.list.d/liquibase.list && \

      sudo apt-get update && \

      sudo apt-get install liquibase

      '
    reference: https://docs.liquibase.com/start/install/liquibase-linux-debian-ubuntu.html
    dsnap: liquibase
  ubuntu/apt:
    cmd: 'wget -O- https://repo.liquibase.com/liquibase.asc | gpg --dearmor > liquibase-keyring.gpg && \

      cat liquibase-keyring.gpg | sudo tee /usr/share/keyrings/liquibase-keyring.gpg > /dev/null && \

      echo ''deb [arch=amd64 signed-by=/usr/share/keyrings/liquibase-keyring.gpg] https://repo.liquibase.com stable main'' | sudo tee /etc/apt/sources.list.d/liquibase.list && \

      sudo apt-get update && \

      sudo apt-get install liquibase

      '
    reference: https://docs.liquibase.com/start/install/liquibase-linux-debian-ubuntu.html
    dsnap: liquibase
  rhel/yum:
    cmd: 'sudo rpm --import https://repo.liquibase.com/liquibase.asc  && \

      sudo yum-config-manager --add-repo https://repo.liquibase.com/repo-liquibase-com.repo   && \

      sudo yum install liquibase

      '
    reference: https://docs.liquibase.com/start/install/liquibase-linux-redhat-centos.html
  centos/yum:
    cmd: 'sudo rpm --import https://repo.liquibase.com/liquibase.asc  && \

      sudo yum-config-manager --add-repo https://repo.liquibase.com/repo-liquibase-com.repo   && \

      sudo yum install liquibase

      '
    reference: https://docs.liquibase.com/start/install/liquibase-linux-redhat-centos.html
  darwin/brew:
    cmd: brew install liquibase
    reference: https://formulae.brew.sh/formula/liquibase#default
binlist:
- liquibase
license: NOASSERTION
