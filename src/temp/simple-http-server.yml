lang: Rust
homepage: https://github.com/TheWaWaR/simple-http-server
license: MIT
desc:
  cn: Rust 中的简单 http 服务器（Windows/Mac/Linux）
  en: Simple http server in Rust (Windows/Mac/Linux)
x:
  source: https://github.com/TheWaWaR/simple-http-server
  eget: TheWaWaR/simple-http-server
  yay: simple-http-server
  cargo: simple-http-server
rule:
  /eget:
    cmd: x eget TheWaWaR/simple-http-server
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install simple-http-server
    reference: https://github.com/TheWaWaR/simple-http-server?tab=readme-ov-file#install-by-cargo
    dsnap: simple-http-server
  arch/yay:
    cmd: yay -S simple-http-server
    reference: https://aur.archlinux.org/packages/simple-http-server
binlist:
- simple-http-server

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
