lang: Go
homepage: https://github.com/txthinking/mad
license: MIT
desc:
  cn: 为任何域名和 IP 签发证书
  en: Generate root CA and derivative certificate for any domains and any IPs
x:
  source: https://github.com/txthinking/mad
  eget: https://github.com/txthinking/mad
rule:
  /eget:
    cmd: x eget txthinking/mad
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install mad
    reference: https://github.com/txthinking/mad?tab=readme-ov-file#install-via-nami
binlist:
- mad

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
