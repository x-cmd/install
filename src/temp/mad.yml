lang: Go
homepage: https://github.com/txthinking/mad
license: MIT
desc:
  cn: 为任何域名和 IP 签发证书
  en: Generate root CA and derivative certificate for any domains and any IPs
  cs: Vystaví kořenovou CA a odvozené certifikáty pro libovolné domény a libovolné IP adresy
  de: Erzeugt eine Root-CA und abgeleitete Zertifikate für beliebige Domains und beliebige IPs
  es: Genera una CA raíz y certificados derivados para cualquier dominio y cualquier IP
  fr: Génère une autorité de certification racine et des certificats dérivés pour n'importe quels domaines et n'importe quelles adresses IP
  id: Membuat CA akar dan sertifikat turunan untuk domain apa pun dan IP apa pun
  it: Genera una CA radice e certificati derivati per qualsiasi dominio e qualsiasi IP
  ja: 任意のドメインと任意の IP に対してルート CA と派生証明書を発行します
  ko: 모든 도메인과 모든 IP에 대해 루트 CA와 파생 인증서를 발급합니다
  pl: Generuje urząd certyfikacji główny i certyfikaty pochodne dla dowolnych domen i dowolnych adresów IP
  pt: Gera uma CA raiz e certificados derivados para quaisquer domínios e quaisquer IPs
  ro: Generează o CA rădăcină și certificate derivate pentru orice domenii și orice adrese IP
  ru: Выпускает корневой ЦС и производные сертификаты для любых доменов и любых IP-адресов
  th: สร้าง CA รากและใบรับรองที่ได้รับสำหรับโดเมนใด ๆ และ IP ใด ๆ
  tr: Herhangi bir alan adı ve IP için kök CA ve türetilmiş sertifika üretir
  uk: Випускає кореневий ЦС та похідні сертифікати для будь-яких доменів і будь-яких IP-адрес
  vi: Tạo CA gốc và chứng thư dẫn xuất cho mọi tên miền và mọi địa chỉ IP
x:
  source: https://github.com/txthinking/mad
  eget: txthinking/mad
rule:
  /eget:
    cmd: x eget txthinking/mad
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install mad
    reference: https://github.com/txthinking/mad?tab=readme-ov-file#install-via-nami
binlist:
- mad

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
