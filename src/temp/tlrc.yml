lang: Rust
homepage: https://github.com/tldr-pages/tlrc
license: MIT
desc:
  cn: tlrc 是一个用 Rust 编写的 tldr 客户端
  en: tlrc is a tldr client written in Rust
x:
  source: https://github.com/tldr-pages/tlrc
  eget: tldr-pages/tlrc
  brew: tlrc
  zypper: tlrc
  port: tlrc
  winget: tldr-pages.tlrc
  yay: tlrc
  cargo: tlrc
rule:
  /eget:
    cmd: x eget tldr-pages/tlrc
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tlrc
    reference: https://github.com/tldr-pages/tlrc?tab=readme-ov-file#linuxmacos-using-homebrew
  linux/brew:
    cmd: brew install tlrc
    reference: https://github.com/tldr-pages/tlrc?tab=readme-ov-file#linuxmacos-using-homebrew
  darwin/nix-shell:
    cmd: nix-shell -p tlrc
    reference: https://search.nixos.org/packages?channel=unstable&show=tlrc&from=0&size=50&sort=relevance&type=packages&query=tlrc
  linux/nix-shell:
    cmd: nix-shell -p tlrc
    reference: https://search.nixos.org/packages?channel=unstable&show=tlrc&from=0&size=50&sort=relevance&type=packages&query=tlrc
  /nix-env:
    cmd: nix-env -iA nixos.tlrc
    reference: https://search.nixos.org/packages?channel=unstable&show=tlrc&from=0&size=50&sort=relevance&type=packages&query=tlrc
  opensuse/zypper:
    cmd: sudo zypper install tlrc
    reference: https://github.com/tldr-pages/tlrc?tab=readme-ov-file#opensuse
  (win|wsl2)/winget:
    cmd: x winget install tldr-pages.tlrc
    reference: https://github.com/tldr-pages/tlrc?tab=readme-ov-file#windows
  darwin/port:
    cmd: sudo port install tlrc
    reference: https://github.com/tldr-pages/tlrc?tab=readme-ov-file#macos-using-macports
  netbsd/pkgin:
    cmd: pkgin install tlrc
    reference: https://github.com/tldr-pages/tlrc?tab=readme-ov-file#netbsd
  /cargo:
    cmd: cargo install tlrc
    reference: https://github.com/tldr-pages/tlrc?tab=readme-ov-file#from-cratesio
    dsnap: tlrc
  arch/yay:
    cmd: yay -S tlrc
    reference: https://aur.archlinux.org/packages/tlrc
binlist:
- tlrc

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
