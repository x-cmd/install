lang: Rust
homepage: https://github.com/m4b/bingrep
license: MIT
desc:
  cn: 对来自各种操作系统和架构的二进制文件进行 Greps，并为它们着色
  en: Greps through binaries from various OSs and architectures, and colors them
x:
  source: https://github.com/m4b/bingrep
rule:
  /cargo:
    cmd: cargo install bingrep
    reference: https://github.com/m4b/bingrep?tab=readme-ov-file#install
    dsnap: bingrep
binlist:
- bingrep

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
