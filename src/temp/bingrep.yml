lang: Rust
homepage: https://github.com/m4b/bingrep
license: MIT
desc:
  cn: 对来自各种操作系统和架构的二进制文件进行 Greps，并为它们着色
  en: Greps through binaries from various OSs and architectures, and colors them
x:
  source: https://github.com/m4b/bingrep
  cargo: bingrep
rule:
  /cargo:
    cmd: cargo install bingrep
    reference: https://github.com/m4b/bingrep?tab=readme-ov-file#install
    dsnap: bingrep
binlist:
- bingrep

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 87 KB
          rating: 1
          desc:
            cn: 约 87 KB（估算）
            en: ~87 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
