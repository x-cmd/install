lang: Go
homepage: https://github.com/qeesung/image2ascii
license: MIT
desc:
  cn: 一个将图像转换为 ASCII 图像的库，并提供命令行工具以方便使用
  en: A library that converts images to ASCII images and provides command line tools for easy use
x:
  source: https://github.com/qeesung/image2ascii
rule:
  /go:
    cmd: go install github.com/qeesung/image2ascii@latest
    reference: https://github.com/qeesung/image2ascii?tab=readme-ov-file#installation
    dsnap: github.com/qeesung/image2ascii@latest
binlist:
- image2ascii

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 92 KB
          rating: 1
          desc:
            cn: 约 92 KB（估算）
            en: ~92 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
