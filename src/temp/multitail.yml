lang: C
homepage: https://github.com/folkertvanheusden/multitail
license: MIT
desc:
  cn: MultiTail 允许您在终端的多个窗口中监视日志文件和命令输出、着色、过滤和合并
  en: MultiTail allows you to monitor logfiles and command output in multiple windows in a terminal, colorize, filter and merge
x:
  source: https://github.com/folkertvanheusden/multitail
rule:
  darwin/brew:
    cmd: brew install multitail
    reference: https://formulae.brew.sh/formula/multitail#default
  debian/apt:
    cmd: sudo apt-get install multitail
    reference: https://command-not-found.com/multitail
    dsnap: multitail
  ubuntu/apt:
    cmd: sudo apt-get install multitail
    reference: https://command-not-found.com/multitail
    dsnap: multitail
  alpine/apk:
    cmd: sudo apk add multitail
    reference: https://command-not-found.com/multitail
    dsnap: multitail
  arch/pacman:
    cmd: sudo pacman -S multitail
    reference: https://command-not-found.com/multitail
  kali/apt:
    cmd: sudo apt-get install multitail
    reference: https://command-not-found.com/multitail
    dsnap: multitail
  centos/yum:
    cmd: sudo yum install multitail
    reference: https://command-not-found.com/multitail
  fedora/dnf:
    cmd: sudo dnf install multitail
    reference: https://command-not-found.com/multitail
    dsnap: multitail
  raspbian/apt:
    cmd: sudo apt-get install multitail
    reference: https://command-not-found.com/multitail
binlist:
- multitail

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
