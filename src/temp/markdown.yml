lang: JavaScript
homepage: https://github.com/txthinking/markdown
desc:
  cn: Markdown 转换器和文档生成器
  en: Markdown converter and documentation generator
x:
  source: https://github.com/txthinking/markdown
rule:
  /nami:
    cmd: nami install markdown
    reference: https://github.com/txthinking/markdown?tab=readme-ov-file#install-via-nami
binlist:
- markdown
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
