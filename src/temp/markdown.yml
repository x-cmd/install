lang: JavaScript
homepage: https://github.com/txthinking/markdown
desc:
  cn: Markdown 转换器和文档生成器
  en: Markdown converter and documentation generator
x:
  source: https://github.com/txthinking/markdown
rule:
  /nami:
    cmd: nami install markdown
    reference: https://github.com/txthinking/markdown?tab=readme-ov-file#install-via-nami
binlist:
- markdown
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
