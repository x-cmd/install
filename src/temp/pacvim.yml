lang: C++
homepage: https://github.com/jmoon018/PacVim/tree/master
license: LGPL-3.0
desc:
  cn: PacVim 是一款教你 vim 命令的游戏
  en: PacVim is a game that teaches you vim commands
rule:
  darwin/brew:
    cmd: brew install pacvim
    reference: https://github.com/jmoon018/PacVim/tree/master?tab=readme-ov-file#mac-os-x
  arch/yay:
    cmd: yay -S pacvim-git
    reference: https://aur.archlinux.org/packages/pacvim-git
binlist:
- pacvim

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
