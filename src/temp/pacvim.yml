lang: C++
homepage: https://github.com/jmoon018/PacVim/tree/master
license: LGPL-3.0
desc:
  cn: PacVim 是一款教你 vim 命令的游戏
  en: PacVim is a game that teaches you vim commands
rule:
  darwin/brew:
    cmd: brew install pacvim
    reference: https://github.com/jmoon018/PacVim/tree/master?tab=readme-ov-file#mac-os-x
  arch/yay:
    cmd: yay -S pacvim-git
    reference: https://aur.archlinux.org/packages/pacvim-git
binlist:
- pacvim

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 42 KB
          rating: 1
          desc:
            cn: 约 42 KB（估算）
            en: ~42 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
