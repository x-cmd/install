lang: C++
homepage: https://github.com/jmoon018/PacVim/tree/master
license: LGPL-3.0
desc:
  cn: PacVim 是一款教你 vim 命令的游戏
  en: PacVim is a game that teaches you vim commands
  cs: PacVim je hra, která vás naučí příkazům vim
  de: PacVim ist ein Spiel, das Ihnen vim-Befehle beibringt
  es: PacVim es un juego que te enseña los comandos de vim
  fr: PacVim est un jeu qui vous apprend les commandes de vim
  id: PacVim adalah permainan yang mengajarkan Anda perintah vim
  it: PacVim è un gioco che ti insegna i comandi di vim
  ja: PacVim は vim のコマンドを教えてくれるゲームです
  ko: PacVim은 vim 명령어를 배우게 해주는 게임입니다
  pl: PacVim to gra ucząca poleceń vima
  pt: PacVim é um jogo que ensina os comandos do vim
  ro: PacVim este un joc care vă învață comenzile de vim
  ru: PacVim — игра, которая обучает командам vim
  th: PacVim เป็นเกมที่สอนคำสั่ง vim ให้คุณ
  tr: PacVim, size vim komutlarını öğreten bir oyundur
  uk: PacVim — гра, яка навчає командам vim
  vi: PacVim là trò chơi dạy bạn các lệnh vim
rule:
  darwin/brew:
    cmd: brew install pacvim
    reference: https://github.com/jmoon018/PacVim/tree/master?tab=readme-ov-file#mac-os-x
  arch/yay:
    cmd: yay -S pacvim-git
    reference: https://aur.archlinux.org/packages/pacvim-git

x:
  brew: pacvim
  yay: pacvim-git
binlist:
- pacvim

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 42 KB
          rating: 1
          desc:
            cn: 约 42 KB（估算）
            en: ~42 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
