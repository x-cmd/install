lang: Go
homepage: https://github.com/txthinking/hancock
license: GPL-3.0
desc:
  cn: 管理多个远程服务器并远程执行命令
  en: Manage multiple remote servers and execute commands remotely
x:
  source: https://github.com/txthinking/hancock
  eget: https://github.com/txthinking/hancock
rule:
  /eget:
    cmd: x eget txthinking/hancock
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install hancock
    reference: https://github.com/txthinking/hancock?tab=readme-ov-file#install-via-nami
binlist:
- hancock

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
