lang: Go
homepage: https://github.com/txthinking/hancock
license: GPL-3.0
desc:
  cn: 管理多个远程服务器并远程执行命令
  en: Manage multiple remote servers and execute commands remotely
x:
  source: https://github.com/txthinking/hancock
  eget: https://github.com/txthinking/hancock
rule:
  /eget:
    cmd: x eget txthinking/hancock
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install hancock
    reference: https://github.com/txthinking/hancock?tab=readme-ov-file#install-via-nami
binlist:
- hancock

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
