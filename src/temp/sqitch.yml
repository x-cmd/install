lang: Perl
homepage: https://github.com/sqitchers/sqitch
license: MIT
desc:
  cn: Sqitch 是一个数据库变更管理应用程序
  en: Sqitch is a database change management application
x:
  source: https://github.com/sqitchers/sqitch
  eget: https://github.com/sqitchers/sqitch
rule:
  /eget:
    cmd: x eget sqitchers/sqitch
    reference: https://x-cmd.com/mod/eget
  /perl:
    cmd: 'perl Build.PL && \

      ./Build installdeps && \

      ./Build && \

      ./Build test && \

      ./Build install

      '
    reference: https://github.com/sqitchers/sqitch?tab=readme-ov-file#installation
binlist:
- sqitch

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
