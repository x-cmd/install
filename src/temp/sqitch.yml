lang: Perl
homepage: https://github.com/sqitchers/sqitch
license: MIT
desc:
  cn: Sqitch 是一个数据库变更管理应用程序
  en: Sqitch is a database change management application
  cs: Sqitch je aplikace pro správu změn databáze
  de: Sqitch ist eine Anwendung zur Verwaltung von Datenbankänderungen
  es: Sqitch es una aplicación de gestión de cambios en bases de datos
  fr: Sqitch est une application de gestion des modifications de bases de données
  id: Sqitch adalah aplikasi manajemen perubahan basis data
  it: Sqitch è un'applicazione per la gestione delle modifiche al database
  ja: Sqitch はデータベースの変更管理アプリケーションです
  ko: Sqitch는 데이터베이스 변경 관리 애플리케이션입니다
  pl: Sqitch to aplikacja do zarządzania zmianami w bazie danych
  pt: Sqitch é um aplicativo de gerenciamento de alterações em bancos de dados
  ro: Sqitch este o aplicație de gestionare a modificărilor în baza de date
  ru: Sqitch — приложение для управления изменениями в базе данных
  th: Sqitch เป็นแอปพลิเคชันจัดการการเปลี่ยนแปลงฐานข้อมูล
  tr: Sqitch, veritabanı değişikliklerini yönetmek için bir uygulamadır
  uk: Sqitch — застосунок для керування змінами в базі даних
  vi: Sqitch là ứng dụng quản lý thay đổi cơ sở dữ liệu
x:
  source: https://github.com/sqitchers/sqitch
  eget: sqitchers/sqitch
rule:
  /eget:
    cmd: x eget sqitchers/sqitch
    reference: https://x-cmd.com/mod/eget
  /perl:
    cmd: 'perl Build.PL && \

      ./Build installdeps && \

      ./Build && \

      ./Build test && \

      ./Build install

      '
    reference: https://github.com/sqitchers/sqitch?tab=readme-ov-file#installation
binlist:
- sqitch

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 93 KB
          rating: 1
          desc:
            cn: 约 93 KB（估算）
            en: ~93 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
