lang: C++
homepage: https://github.com/google/bloaty
license: Apache-2.0
desc:
  cn: Bloaty：二进制文件的大小分析器
  en: 'Bloaty: a size profiler for binaries'
  cs: "Bloaty: analyzátor velikosti binárních souborů"
  de: "Bloaty: ein Größenprofiler für Binärdateien"
  es: "Bloaty: un perfilador de tamaño para binarios"
  fr: "Bloaty : un profileur de taille pour les binaires"
  id: "Bloaty: profiler ukuran untuk berkas biner"
  it: "Bloaty: un profiler di dimensione per i binari"
  ja: "Bloaty: バイナリファイルのサイズプロファイラ"
  ko: "Bloaty: 바이너리 파일용 크기 프로파일러"
  pl: "Bloaty: profiler rozmiaru plików binarnych"
  pt: "Bloaty: um profiler de tamanho para binários"
  ro: "Bloaty: un profiler de dimensiune pentru binare"
  ru: "Bloaty: анализатор размера двоичных файлов"
  th: "Bloaty: เครื่องมือวิเคราะห์ขนาดสำหรับไฟล์ไบนารี"
  tr: "Bloaty: ikili dosyalar için bir boyut profil aracı"
  uk: "Bloaty: аналізатор розміру двійкових файлів"
  vi: "Bloaty: trình phân tích kích thước cho tệp nhị phân"
x:
  source: https://github.com/google/bloaty
  eget: google/bloaty
  yay: bloaty-git
rule:
  /eget:
    cmd: x eget google/bloaty
    reference: https://x-cmd.com/mod/eget
  /cmark:
    cmd: 'git clone https://github.com/google/bloaty.git

      git submodule update --init --recursive

      cmake -B build -G Ninja -S .

      cmake --build build

      cmake --build build --target install

      '
    reference: https://github.com/google/bloaty?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S bloaty-git
    reference: https://aur.archlinux.org/packages/bloaty-git
binlist:
- bloaty

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 508 KB
          rating: 1
          desc:
            cn: 约 508 KB（估算）
            en: ~508 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
