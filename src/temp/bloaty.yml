lang: C++
homepage: https://github.com/google/bloaty
license: Apache-2.0
desc:
  cn: Bloaty：二进制文件的大小分析器
  en: 'Bloaty: a size profiler for binaries'
x:
  source: https://github.com/google/bloaty
  eget: https://github.com/google/bloaty
rule:
  /eget:
    cmd: x eget google/bloaty
    reference: https://x-cmd.com/mod/eget
  /cmark:
    cmd: 'git clone https://github.com/google/bloaty.git

      git submodule update --init --recursive

      cmake -B build -G Ninja -S .

      cmake --build build

      cmake --build build --target install

      '
    reference: https://github.com/google/bloaty?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S bloaty-git
    reference: https://aur.archlinux.org/packages/bloaty-git
binlist:
- bloaty

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 508 KB
          rating: 1
          desc:
            cn: 约 508 KB（估算）
            en: ~508 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
