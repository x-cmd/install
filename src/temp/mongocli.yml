lang: Go
homepage: https://github.com/mongodb/mongodb-cli
license: Apache-2.0
desc:
  cn: MongoDB CLI 是现代命令行接口，使您能够从终端管理 MongoDB 服务
  en: The MongoDB CLI is a modern command line interface that enables you to manage your MongoDB services from the terminal
  cs: MongoDB CLI je moderní rozhraní příkazové řádky, které vám umožňuje spravovat služby MongoDB z terminálu
  de: Die MongoDB CLI ist eine moderne Kommandozeilenschnittstelle, mit der Sie Ihre MongoDB-Dienste vom Terminal aus verwalten können
  es: MongoDB CLI es una interfaz de línea de comandos moderna que le permite administrar sus servicios de MongoDB desde el terminal
  fr: MongoDB CLI est une interface de ligne de commande moderne qui vous permet de gérer vos services MongoDB depuis le terminal
  id: MongoDB CLI adalah antarmuka baris perintah modern yang memungkinkan Anda mengelola layanan MongoDB Anda dari terminal
  it: MongoDB CLI è un'interfaccia a riga di comando moderna che consente di gestire i propri servizi MongoDB dal terminale
  ja: MongoDB CLI は、ターミナルから MongoDB サービスを管理できるモダンなコマンドラインインターフェースです
  ko: MongoDB CLI은 터미널에서 MongoDB 서비스를 관리할 수 있게 하는 현대적인 명령줄 인터페이스입니다
  pl: MongoDB CLI to nowoczesne narzędzie wiersza poleceń, które umożliwia zarządzanie usługami MongoDB z terminala
  pt: O MongoDB CLI é uma interface de linha de comando moderna que permite gerenciar seus serviços MongoDB pelo terminal
  ro: MongoDB CLI este o interfață modernă de linie de comandă care vă permite să vă gestionați serviciile MongoDB din terminal
  ru: MongoDB CLI — современный интерфейс командной строки, позволяющий управлять службами MongoDB из терминала
  th: MongoDB CLI เป็นอินเทอร์เฟซบรรทัดคำสั่งสมัยใหม่ที่ช่วยให้คุณจัดการบริการ MongoDB จากเทอร์มินัลได้
  tr: MongoDB CLI, MongoDB hizmetlerinizi terminalden yönetmenizi sağlayan modern bir komut satırı arayüzüdür
  uk: MongoDB CLI — сучасний інтерфейс командного рядка, який дозволяє керувати службами MongoDB з термінала
  vi: MongoDB CLI là giao diện dòng lệnh hiện đại cho phép bạn quản lý các dịch vụ MongoDB từ terminal
x:
  source: https://github.com/mongodb/mongodb-cli
  eget: mongodb/mongodb-cli
  brew: mongocli
rule:
  /eget:
    cmd: x eget mongodb/mongodb-cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install mongocli
    reference: https://github.com/mongodb/mongodb-atlas-cli/blob/master/mongocli.md#homebrew-on-macos
binlist:
- mongocli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
