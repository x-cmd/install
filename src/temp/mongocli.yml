lang: Go
homepage: https://github.com/mongodb/mongodb-cli
license: Apache-2.0
desc:
  cn: MongoDB CLI 是现代命令行接口，使您能够从终端管理 MongoDB 服务
  en: The MongoDB CLI is a modern command line interface that enables you to manage your MongoDB services from the terminal
x:
  source: https://github.com/mongodb/mongodb-cli
  eget: https://github.com/mongodb/mongodb-cli
  brew: mongoclirule:
  /eget:
    cmd: x eget mongodb/mongodb-cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install mongocli
    reference: https://github.com/mongodb/mongodb-atlas-cli/blob/master/mongocli.md#homebrew-on-macos
binlist:
- mongocli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
