lang: Go
homepage: https://github.com/wallix/awless
license: Apache-2.0
desc:
  cn: awless 是一个功能强大、创新且小型的命令行界面 (CLI)，用于管理 Amazon Web Services
  en: awless is a powerful, innovative and small surface command line interface (CLI) to manage Amazon Web Services
x:
  source: https://github.com/wallix/awless
  eget: https://github.com/wallix/awless
rule:
  /eget:
    cmd: x eget wallix/awless
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew tap wallix/awless && brew install awless
    reference: https://github.com/wallix/awless?tab=readme-ov-file#install
  /curl:
    cmd: curl -sS https://raw.githubusercontent.com/wallix/awless/master/getawless.sh | bash
    reference: https://github.com/wallix/awless?tab=readme-ov-file#install
  /go:
    cmd: go get -u github.com/wallix/awless
    reference: https://github.com/wallix/awless?tab=readme-ov-file#install
    dsnap: awless
  arch/yay:
    cmd: yay -S awless
    reference: https://aur.archlinux.org/packages/awless
binlist:
- awless

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.3 MB
          rating: 1
          desc:
            cn: 约 9.3 MB（估算）
            en: ~9.3 MB estimated
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
