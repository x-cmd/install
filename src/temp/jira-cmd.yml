lang: JavaScript
homepage: https://github.com/palashkulsh/jira-cmd
license: MIT
desc:
  cn: 基于 jilla 的 Jira 命令行界面
  en: A Jira command line interface based on jilla
x:
  source: https://github.com/palashkulsh/jira-cmd
  npm: jira-cmd
rule:
  /npm:
    cmd: npm install -g jira-cmd
    reference: https://github.com/palashkulsh/jira-cmd?tab=readme-ov-file#installation
    dsnap: jira-cmd
binlist:
- jira-cmd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
