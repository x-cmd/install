lang: JavaScript
homepage: https://github.com/palashkulsh/jira-cmd
license: MIT
desc:
  cn: 基于 jilla 的 Jira 命令行界面
  en: A Jira command line interface based on jilla
x:
  source: https://github.com/palashkulsh/jira-cmd
rule:
  /npm:
    cmd: npm install -g jira-cmd
    reference: https://github.com/palashkulsh/jira-cmd?tab=readme-ov-file#installation
    dsnap: jira-cmd
binlist:
- jira-cmd

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
