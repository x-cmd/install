lang: Go
homepage: https://github.com/1Panel-dev/1Panel
license: GPL-3.0
desc:
  cn: 1Panel 是新一代的 Linux 服务器运维管理面板
  en: 1Panel is a modern and Open-Source linux server operation and management panel
  cs: 1Panel je moderní open-source panel pro správu a provoz linuxových serverů
  de: 1Panel ist eine moderne Open-Source-Verwaltungsoberfläche für Betrieb und Management von Linux-Servern
  es: 1Panel es un panel moderno y de código abierto para la operación y gestión de servidores linux
  fr: 1Panel est un panneau moderne et open source d'exploitation et de gestion des serveurs linux
  id: 1Panel adalah panel operasi dan manajemen server linux modern dan open-source
  it: 1Panel è un pannello moderno e open source per l'operatività e la gestione dei server linux
  ja: 1Panel はモダンでオープンソースな Linux サーバー運用・管理パネルです
  ko: 1Panel은 현대적이고 오픈 소스인 linux 서버 운영 및 관리 패널입니다
  pl: 1Panel to nowoczesny panel open source do obsługi i zarządzania serwerami linux
  pt: 1Panel é um painel moderno e de código aberto para operação e gerenciamento de servidores linux
  ro: 1Panel este un panou modern și open-source pentru operarea și gestionarea serverelor linux
  ru: 1Panel — современная панель с открытым исходным кодом для эксплуатации и управления Linux-серверами
  th: 1Panel เป็นแผงควบคุมการดูแลและจัดการเซิร์ฟเวอร์ linux สมัยใหม่แบบโอเพนซอร์ส
  tr: 1Panel, Linux sunucu işletimi ve yönetimi için modern ve açık kaynaklı bir paneldir
  uk: 1Panel — сучасна панель з відкритим кодом для експлуатації та керування Linux-серверами
  vi: 1Panel là bảng điều khiển hiện đại, mã nguồn mở để vận hành và quản lý máy chủ linux
x:
  source: https://github.com/1Panel-dev/1Panel
  yay: 1panel
rule:
  rhel/curl:
    cmd: curl -sSL https://resource.fit2cloud.com/1panel/package/quick_start.sh -o quick_start.sh && sh quick_start.sh
    reference: https://1panel.cn/docs/installation/online_installation/#2
  ubuntu/curl:
    cmd: curl -sSL https://resource.fit2cloud.com/1panel/package/quick_start.sh -o quick_start.sh && sudo bash quick_start.sh
    reference: https://1panel.cn/docs/installation/online_installation/#2
  debian/curl:
    cmd: curl -sSL https://resource.fit2cloud.com/1panel/package/quick_start.sh -o quick_start.sh && bash quick_start.sh
    reference: https://1panel.cn/docs/installation/online_installation/#2
  arch/yay:
    cmd: yay -S 1panel
    reference: https://aur.archlinux.org/packages/1panel
binlist:
- 1panel

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 42 MB
          rating: 2
          desc:
            cn: 约 42 MB（估算）
            en: ~42 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
