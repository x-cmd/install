lang: Go
homepage: https://github.com/hpcloud/tail
license: MIT
desc:
  cn: 一个致力于模拟 BSD tail 程序功能的 Go 包。
  en: A Go package striving to emulate the features of the BSD tail program
x:
  source: https://github.com/hpcloud/tail
rule:
  /go:
    cmd: go get github.com/hpcloud/tail/...
    reference: https://github.com/hpcloud/tail?tab=readme-ov-file#installing
    dsnap: hpcloud/tail
binlist:
- tail

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
