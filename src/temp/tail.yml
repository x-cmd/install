lang: Go
homepage: https://github.com/hpcloud/tail
license: MIT
desc:
  cn: 一个致力于模拟 BSD tail 程序功能的 Go 包。
  en: A Go package striving to emulate the features of the BSD tail program
x:
  source: https://github.com/hpcloud/tail
rule:
  /go:
    cmd: go get github.com/hpcloud/tail/...
    reference: https://github.com/hpcloud/tail?tab=readme-ov-file#installing
    dsnap: hpcloud/tail
binlist:
- tail

# complicated
footprint:
