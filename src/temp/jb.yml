lang: Zig
homepage: https://github.com/txthinking/jb
desc:
  cn: jb = javascript + bash
  en: jb = javascript + bash
x:
  source: https://github.com/txthinking/jb
  eget: https://github.com/txthinking/jb
rule:
  /eget:
    cmd: x eget txthinking/jb
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install jb
    reference: https://github.com/txthinking/jb?tab=readme-ov-file#install
binlist:
- jb
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
