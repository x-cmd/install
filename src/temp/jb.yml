lang: Zig
homepage: https://github.com/txthinking/jb
desc:
  cn: jb = javascript + bash
  en: jb = javascript + bash
x:
  source: https://github.com/txthinking/jb
  eget: https://github.com/txthinking/jb
rule:
  /eget:
    cmd: x eget txthinking/jb
    reference: https://x-cmd.com/mod/eget
  /nami:
    cmd: nami install jb
    reference: https://github.com/txthinking/jb?tab=readme-ov-file#install
binlist:
- jb
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 约 11 MB（估算）
            en: ~11 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
