lang: JavaScript
homepage: https://github.com/commenthol/md-fileserver
desc:
  cn: 在浏览器中本地查看 Markdown 文件。
  en: Locally view markdown files in a browser
x:
  source: https://github.com/commenthol/md-fileserver
rule:
  /npm:
    cmd: npm install -g md-fileserver
    reference: https://github.com/commenthol/md-fileserver?tab=readme-ov-file#installation
    dsnap: md-fileserver
binlist:
- md-fileserver
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
