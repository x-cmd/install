lang: JavaScript
homepage: https://github.com/commenthol/md-fileserver
desc:
  cn: 在浏览器中本地查看 Markdown 文件。
  en: Locally view markdown files in a browser
  cs: Místní prohlížení souborů markdown v prohlížeči
  de: Markdown-Dateien lokal im Browser ansehen
  es: Ver archivos markdown localmente en un navegador
  fr: Afficher localement les fichiers markdown dans un navigateur
  id: Menampilkan berkas markdown secara lokal di peramban
  it: Visualizza localmente i file markdown in un browser
  ja: ブラウザで markdown ファイルをローカル表示します
  ko: 브라우저에서 markdown 파일을 로컬로 보기
  pl: Lokalne przeglądanie plików markdown w przeglądarce
  pt: Ver arquivos markdown localmente em um navegador
  ro: Vizualizarea locală a fișierelor markdown într-un browser
  ru: Локальный просмотр файлов markdown в браузере
  th: ดูไฟล์ markdown ในเบราว์เซอร์แบบในเครื่อง
  tr: Markdown dosyalarını tarayıcıda yerel olarak görüntüleyin
  uk: Локальний перегляд файлів markdown у браузері
  vi: Xem tệp markdown cục bộ trong trình duyệt
x:
  source: https://github.com/commenthol/md-fileserver
  npm: md-fileserver
rule:
  /npm:
    cmd: npm install -g md-fileserver
    reference: https://github.com/commenthol/md-fileserver?tab=readme-ov-file#installation
    dsnap: md-fileserver
binlist:
- md-fileserver
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
