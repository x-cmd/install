lang: JavaScript
homepage: https://github.com/commenthol/md-fileserver
desc:
  cn: 在浏览器中本地查看 Markdown 文件。
  en: Locally view markdown files in a browser
x:
  source: https://github.com/commenthol/md-fileserver
rule:
  /npm:
    cmd: npm install -g md-fileserver
    reference: https://github.com/commenthol/md-fileserver?tab=readme-ov-file#installation
    dsnap: md-fileserver
binlist:
- md-fileserver
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
