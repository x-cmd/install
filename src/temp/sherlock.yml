lang: Python
homepage: https://github.com/sherlock-project/sherlock
license: MIT
desc:
  cn: Sherlock 是 Sherlock Project 提供的功能强大的命令行工具，可用于在许多社交网络中查找用户名
  en: Sherlock, a powerful command line tool provided by Sherlock Project, can be used to find usernames across many social networks
  cs: Sherlock je výkonný nástroj příkazové řádky poskytovaný projektem Sherlock Project, který umožňuje vyhledávat uživatelská jména napříč mnoha sociálními sítěmi
  de: Sherlock ist ein leistungsstarkes Kommandozeilenwerkzeug des Sherlock Project, mit dem Benutzernamen in vielen sozialen Netzwerken gefunden werden können
  es: Sherlock es una potente herramienta de línea de comandos proporcionada por Sherlock Project, que permite buscar nombres de usuario en muchas redes sociales
  fr: Sherlock est un outil en ligne de commande puissant fourni par Sherlock Project, permettant de trouver des noms d'utilisateur sur de nombreux réseaux sociaux
  id: Sherlock adalah alat baris perintah yang andal dari Sherlock Project untuk mencari nama pengguna di berbagai jejaring sosial
  it: Sherlock è un potente strumento da riga di comando fornito da Sherlock Project, che permette di trovare nomi utente in molti social network
  ja: Sherlock は Sherlock Project が提供する強力なコマンドラインツールで、多くのソーシャルネットワークでユーザー名を検索できます
  ko: Sherlock은 Sherlock Project에서 제공하는 강력한 명령줄 도구로, 여러 소셜 네트워크에서 사용자 이름을 찾을 수 있습니다
  pl: Sherlock to potężne narzędzie wiersza poleceń udostępnione przez Sherlock Project, które pozwala wyszukiwać nazwy użytkowników w wielu sieciach społecznościowych
  pt: O Sherlock é uma poderosa ferramenta de linha de comando fornecida pelo Sherlock Project, que permite encontrar nomes de usuário em muitas redes sociais
  ro: Sherlock este un instrument puternic de linie de comandă furnizat de Sherlock Project, care permite găsirea numelor de utilizator în multe rețele sociale
  ru: Sherlock — мощный инструмент командной строки от Sherlock Project, позволяющий искать имена пользователей во многих социальных сетях
  th: Sherlock เป็นเครื่องมือบรรทัดคำสั่งที่มีประสิทธิภาพจาก Sherlock Project สามารถใช้ค้นหาชื่อผู้ใช้ในเครือข่ายสังคมได้หลายเครือข่าย
  tr: Sherlock, Sherlock Project tarafından sağlanan ve birçok sosyal ağda kullanıcı adlarını bulmak için kullanılan güçlü bir komut satırı aracıdır
  uk: Sherlock — потужний інструмент командного рядка від Sherlock Project, який дозволяє шукати імена користувачів у багатьох соціальних мережах
  vi: Sherlock là công cụ dòng lệnh mạnh mẽ do Sherlock Project cung cấp, dùng để tìm tên người dùng trên nhiều mạng xã hội
x:
  source: https://github.com/sherlock-project/sherlock
  yay: sherlock
rule:
  /pip:
    cmd: 'git clone https://github.com/sherlock-project/sherlock.git \

      && cd sherlock \

      && python3 -m pip install -r requirements.txt

      '
    reference: https://github.com/sherlock-project/sherlock#installation
    dsnap: sherlock
  arch/yay:
    cmd: yay -S sherlock
    reference: https://aur.archlinux.org/packages/sherlock
binlist:
- sherlock

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
