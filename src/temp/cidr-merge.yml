lang: Go
homepage: https://github.com/zhanhb/cidr-merger
license: MIT
desc:
  cn: 一个简单的实用程序来合并 ip/ip cidr/ip 范围，支持 IPv4/IPv6
  en: A simple utility to merge ip/ip cidr/ip range, support IPv4/IPv6
x:
  source: https://github.com/zhanhb/cidr-merger
  eget: zhanhb/cidr-merger
rule:
  /eget:
    cmd: x eget zhanhb/cidr-merger
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -L -o cidr-merger-darwin-arm64 https://github.com/zhanhb/cidr-merger/releases/download/v1.1.3/cidr-merger-darwin-arm64
    reference: https://github.com/zhanhb/cidr-merger/releases
binlist:
- cidr-merge

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
