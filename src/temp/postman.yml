lang: JavaScript
homepage: https://github.com/postmanlabs/postman-app-support
desc:
  cn: Postman CLI 是由 Postman 开发、支持和签名的命令行配套工具
  en: The Postman CLI is the command-line companion that is developed, supported, and signed by Postman
x:
  source: https://github.com/postmanlabs/postman-app-support
rule:
  linux/curl:
    cmd: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
    reference: https://www.postman.com/downloads/?utm_source=postman-home
  darwin-x64/curl:
    cmd: curl -o- "https://dl-cli.pstmn.io/install/osx_64.sh" | sh
    reference: https://www.postman.com/downloads/?utm_source=postman-home
  darwin-arm64/curl:
    cmd: curl -o- "https://dl-cli.pstmn.io/install/osx_arm64.sh" | sh
    reference: https://www.postman.com/downloads/?utm_source=postman-home
  win/powershell:
    cmd: x pwsh powershell.exe -NoProfile -InputFormat None -ExecutionPolicy AllSigned -Command "[System.Net.ServicePointManager]::SecurityProtocol = 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://dl-cli.pstmn.io/install/win64.ps1'))"
    reference: https://www.postman.com/downloads/?utm_source=postman-home
  arch/yay:
    cmd: yay -S postman-bin
    reference: https://aur.archlinux.org/packages/postman-bin
binlist:
- postman
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
