lang: Java
homepage: https://github.com/Stirling-Tools/Stirling-PDF
desc:
  cn: 本地托管的 Web 应用程序，允许您对 PDF 文件执行各种操作
  en: locally hosted web application that allows you to perform various operations on PDF files
x:
  source: https://github.com/Stirling-Tools/Stirling-PDF
  eget: https://github.com/Stirling-Tools/Stirling-PDF
rule:
  /eget:
    cmd: x eget Stirling-Tools/Stirling-PDF
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: 'sudo apt-get install -y git  automake  autoconf  libtool  libleptonica-dev  pkg-config zlib1g-dev make g++ java-17-openjdk python3 python3-pip \

      && sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress unpaper ocrmypdf \

      && pip3 install uno opencv-python-headless unoconv pngquant WeasyPrint \

      && cd ~/.git \

      && git clone https://github.com/Stirling-Tools/Stirling-PDF.git \

      && cd Stirling-PDF \

      && chmod +x ./gradlew \

      && ./gradlew build \

      && sudo mkdir /opt/Stirling-PDF \

      && sudo mv ./build/libs/Stirling-PDF-*.jar /opt/Stirling-PDF/ \

      && sudo mv scripts /opt/Stirling-PDF/ \

      && echo "Scripts installed." \

      && ./gradlew bootRun

      '
    reference: https://github.com/Stirling-Tools/Stirling-PDF/blob/main/LocalRunGuide.md
  ubuntu/apt:
    cmd: 'sudo apt-get install -y git  automake  autoconf  libtool  libleptonica-dev  pkg-config zlib1g-dev make g++ java-17-openjdk python3 python3-pip \

      && sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress unpaper ocrmypdf \

      && pip3 install uno opencv-python-headless unoconv pngquant WeasyPrint \

      && cd ~/.git \

      && git clone https://github.com/Stirling-Tools/Stirling-PDF.git \

      && cd Stirling-PDF \

      && chmod +x ./gradlew \

      && ./gradlew build \

      && sudo mkdir /opt/Stirling-PDF \

      && sudo mv ./build/libs/Stirling-PDF-*.jar /opt/Stirling-PDF/ \

      && sudo mv scripts /opt/Stirling-PDF/ \

      && echo "Scripts installed." \

      && ./gradlew bootRun

      '
    reference: https://github.com/Stirling-Tools/Stirling-PDF/blob/main/LocalRunGuide.md
  fedora/dnf:
    cmd: 'sudo dnf install -y git automake autoconf libtool leptonica-devel pkg-config zlib-devel make gcc-c++ java-17-openjdk python3 python3-pip \

      && sudo dnf install -y libreoffice-writer libreoffice-calc libreoffice-impress unpaper ocrmypdf \

      && pip3 install uno opencv-python-headless unoconv pngquant WeasyPrint \

      && cd ~/.git \

      && git clone https://github.com/Stirling-Tools/Stirling-PDF.git \

      && cd Stirling-PDF \

      && chmod +x ./gradlew \

      && ./gradlew build \

      && sudo mkdir /opt/Stirling-PDF \

      && sudo mv ./build/libs/Stirling-PDF-*.jar /opt/Stirling-PDF/ \

      && sudo mv scripts /opt/Stirling-PDF/ \

      && echo "Scripts installed." \

      && ./gradlew bootRun

      '
    reference: https://github.com/Stirling-Tools/Stirling-PDF/blob/main/LocalRunGuide.md
binlist:
- stirling-pdf
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
