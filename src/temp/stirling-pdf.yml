lang: Java
homepage: https://github.com/Stirling-Tools/Stirling-PDF
desc:
  cn: 本地托管的 Web 应用程序，允许您对 PDF 文件执行各种操作
  en: locally hosted web application that allows you to perform various operations on PDF files
  cs: Webová aplikace hostovaná lokálně, která umožňuje provádět různé operace nad soubory PDF
  de: Lokal gehostete Webanwendung, mit der verschiedene Vorgänge an PDF-Dateien ausgeführt werden können
  es: Aplicación web alojada localmente que permite realizar diversas operaciones en archivos PDF
  fr: Application web hébergée localement permettant d'effectuer diverses opérations sur des fichiers PDF
  id: Aplikasi web yang di-host secara lokal untuk melakukan berbagai operasi pada berkas PDF
  it: Applicazione web ospitata localmente che consente di eseguire varie operazioni sui file PDF
  ja: ローカルでホストされる Web アプリケーションで、PDF ファイルに対してさまざまな操作を行えます
  ko: 로컬에서 호스팅되는 웹 애플리케이션으로 PDF 파일에 다양한 작업을 수행할 수 있습니다
  pl: Lokalnie hostowana aplikacja internetowa, która umożliwia wykonywanie różnych operacji na plikach PDF
  pt: Aplicativo web hospedado localmente que permite executar várias operações em arquivos PDF
  ro: Aplicație web găzduită local, care vă permite să efectuați diverse operațiuni pe fișierele PDF
  ru: Локально размещаемое веб-приложение, позволяющее выполнять различные операции над файлами PDF
  th: เว็บแอปพลิเคชันที่โฮสต์ในเครื่อง ช่วยให้คุณทำการดำเนินการต่าง ๆ กับไฟล์ PDF
  tr: PDF dosyaları üzerinde çeşitli işlemler yapmanızı sağlayan yerel olarak barındırılan web uygulaması
  uk: Локально розміщуваний вебзастосунок, який дає змогу виконувати різні операції з файлами PDF
  vi: Ứng dụng web chạy cục bộ cho phép bạn thực hiện nhiều thao tác khác nhau trên các tệp PDF
x:
  source: https://github.com/Stirling-Tools/Stirling-PDF
  eget: Stirling-Tools/Stirling-PDF
  pip: uno
rule:
  /eget:
    cmd: x eget Stirling-Tools/Stirling-PDF
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: 'sudo apt-get install -y git  automake  autoconf  libtool  libleptonica-dev  pkg-config zlib1g-dev make g++ java-17-openjdk python3 python3-pip \

      && sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress unpaper ocrmypdf \

      && pip3 install uno opencv-python-headless unoconv pngquant WeasyPrint \

      && cd ~/.git \

      && git clone https://github.com/Stirling-Tools/Stirling-PDF.git \

      && cd Stirling-PDF \

      && chmod +x ./gradlew \

      && ./gradlew build \

      && sudo mkdir /opt/Stirling-PDF \

      && sudo mv ./build/libs/Stirling-PDF-*.jar /opt/Stirling-PDF/ \

      && sudo mv scripts /opt/Stirling-PDF/ \

      && echo "Scripts installed." \

      && ./gradlew bootRun

      '
    reference: https://github.com/Stirling-Tools/Stirling-PDF/blob/main/LocalRunGuide.md
  ubuntu/apt:
    cmd: 'sudo apt-get install -y git  automake  autoconf  libtool  libleptonica-dev  pkg-config zlib1g-dev make g++ java-17-openjdk python3 python3-pip \

      && sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress unpaper ocrmypdf \

      && pip3 install uno opencv-python-headless unoconv pngquant WeasyPrint \

      && cd ~/.git \

      && git clone https://github.com/Stirling-Tools/Stirling-PDF.git \

      && cd Stirling-PDF \

      && chmod +x ./gradlew \

      && ./gradlew build \

      && sudo mkdir /opt/Stirling-PDF \

      && sudo mv ./build/libs/Stirling-PDF-*.jar /opt/Stirling-PDF/ \

      && sudo mv scripts /opt/Stirling-PDF/ \

      && echo "Scripts installed." \

      && ./gradlew bootRun

      '
    reference: https://github.com/Stirling-Tools/Stirling-PDF/blob/main/LocalRunGuide.md
  fedora/dnf:
    cmd: 'sudo dnf install -y git automake autoconf libtool leptonica-devel pkg-config zlib-devel make gcc-c++ java-17-openjdk python3 python3-pip \

      && sudo dnf install -y libreoffice-writer libreoffice-calc libreoffice-impress unpaper ocrmypdf \

      && pip3 install uno opencv-python-headless unoconv pngquant WeasyPrint \

      && cd ~/.git \

      && git clone https://github.com/Stirling-Tools/Stirling-PDF.git \

      && cd Stirling-PDF \

      && chmod +x ./gradlew \

      && ./gradlew build \

      && sudo mkdir /opt/Stirling-PDF \

      && sudo mv ./build/libs/Stirling-PDF-*.jar /opt/Stirling-PDF/ \

      && sudo mv scripts /opt/Stirling-PDF/ \

      && echo "Scripts installed." \

      && ./gradlew bootRun

      '
    reference: https://github.com/Stirling-Tools/Stirling-PDF/blob/main/LocalRunGuide.md
binlist:
- stirling-pdf
license: NOASSERTION

