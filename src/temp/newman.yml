lang: JavaScript
homepage: https://github.com/postmanlabs/newman
license: Apache-2.0
desc:
  cn: Newman 是 Postman 的命令行收集运行程序
  en: Newman is a command-line collection runner for Postman
x:
  source: https://github.com/postmanlabs/newman
rule:
  /npm:
    cmd: npm install -g newman
    reference: https://github.com/postmanlabs/newman?tab=readme-ov-file#installation
    dsnap: newman
  darwin/brew:
    cmd: brew install newman
    reference: https://github.com/postmanlabs/newman?tab=readme-ov-file#using-homebrew
  arch/yay:
    cmd: yay -S newman
    reference: https://aur.archlinux.org/packages/newman
binlist:
- newman

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
