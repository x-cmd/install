lang: JavaScript
homepage: https://github.com/postmanlabs/newman
license: Apache-2.0
desc:
  cn: Newman 是 Postman 的命令行收集运行程序
  en: Newman is a command-line collection runner for Postman
  cs: Newman je nástroj pro spouštění kolekcí Postmanu z příkazové řádky
  de: Newman ist ein Kommandozeilen-Sammlungsläufer für Postman
  es: Newman es un ejecutor de colecciones de Postman desde la línea de comandos
  fr: Newman est un exécuteur de collections Postman en ligne de commande
  id: Newman adalah runner koleksi Postman berbasis baris perintah
  it: Newman è un runner di raccolte Postman da riga di comando
  ja: Newman は Postman のコマンドライン コレクションランナーです
  ko: Newman은 Postman용 명령줄 컬렉션 러너입니다
  pl: Newman to uruchamianie kolekcji Postman z wiersza poleceń
  pt: O Newman é um executor de coleções do Postman pela linha de comando
  ro: Newman este un executor de colecții Postman din linia de comandă
  ru: Newman — инструмент запуска коллекций Postman из командной строки
  th: Newman เป็นตัวรันคอลเลกชันของ Postman จากบรรทัดคำสั่ง
  tr: Newman, Postman için komut satırı koleksiyon çalıştırıcısıdır
  uk: Newman — інструмент запуску колекцій Postman із командного рядка
  vi: Newman là trình chạy bộ sưu tập Postman qua dòng lệnh
x:
  source: https://github.com/postmanlabs/newman
  brew: newman
  yay: newman
  npm: newman
rule:
  /npm:
    cmd: npm install -g newman
    reference: https://github.com/postmanlabs/newman?tab=readme-ov-file#installation
    dsnap: newman
  darwin/brew:
    cmd: brew install newman
    reference: https://github.com/postmanlabs/newman?tab=readme-ov-file#using-homebrew
  arch/yay:
    cmd: yay -S newman
    reference: https://aur.archlinux.org/packages/newman
binlist:
- newman

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 KB
          rating: 1
          desc:
            cn: 约 16 KB（估算）
            en: ~16 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
