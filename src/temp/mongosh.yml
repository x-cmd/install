desc:
  cn: 用于与 MongoDB 数据库交互的 CLI
  en: A CLI for interacting with MongoDB databases
homepage: https://github.com/mongodb-js/mongosh
license: Apache-2.0
lang: JavaScript
x:
  source: https://github.com/mongodb-js/mongosh
  eget: https://github.com/mongodb-js/mongosh
  brew: mongosh
  yay: mongosh-bin
  npm: mongosh
rule:
  /eget:
    cmd: x eget mongodb-js/mongosh
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install mongosh
    reference: https://www.mongodb.com/docs/mongodb-shell/install
  /npm:
    cmd: npm install -g mongosh
    reference: https://www.npmjs.com/package/mongodb
    dsnap: mongosh
  arch/yay:
    cmd: yay -S mongosh-bin
    reference: https://aur.archlinux.org/packages/mongosh-bin
binlist:
- mongosh

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 86 MB
          rating: 3
          desc:
            cn: 安装 86 MB
            en: 86 MB install
        download:
          estimate: 86 MB
          desc:
            cn: 约 86 MB 下载 (linux/x64)
            en: ~86 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
