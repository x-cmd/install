desc:
  cn: 用于与 MongoDB 数据库交互的 CLI
  en: A CLI for interacting with MongoDB databases
homepage: https://github.com/mongodb-js/mongosh
license: Apache-2.0
lang: JavaScript
x:
  source: https://github.com/mongodb-js/mongosh
  eget: https://github.com/mongodb-js/mongosh
rule:
  /eget:
    cmd: x eget mongodb-js/mongosh
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install mongosh
    reference: https://www.mongodb.com/docs/mongodb-shell/install
  /npm:
    cmd: npm install -g mongosh
    reference: https://www.npmjs.com/package/mongodb
    dsnap: mongosh
  arch/yay:
    cmd: yay -S mongosh-bin
    reference: https://aur.archlinux.org/packages/mongosh-bin
binlist:
- mongosh

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
