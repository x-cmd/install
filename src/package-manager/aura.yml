lang: Haskell/Rust
homepage: https://github.com/fosskers/aura
license: GPL-3.0
desc:
  cn: Aura 是 Arch Linux 的软件包管理器
  en: Aura is a package manager for Arch Linux
x:
  source: https://github.com/fosskers/aura
rule:
  arch/stack:
    cmd: 'git clone https://github.com/fosskers/aura.git \

      && cd aura \

      && stack install -- aura

      '
    reference: https://fosskers.github.io/aura/install.html#building-from-source
  arch/yay:
    cmd: yay -S aura
    reference: https://aur.archlinux.org/packages/aura
binlist:
- aura

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 486 KB
          rating: 1
          desc:
            cn: 约 486 KB（估算）
            en: ~486 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
