lang: Haskell/Rust
homepage: https://github.com/fosskers/aura
license: GPL-3.0
desc:
  cn: Aura 是 Arch Linux 的软件包管理器
  en: Aura is a package manager for Arch Linux
  cs: Aura je správce balíčků pro Arch Linux
  de: Aura ist ein Paketmanager für Arch Linux
  es: Aura es un gestor de paquetes para Arch Linux
  fr: Aura est un gestionnaire de paquets pour Arch Linux
  id: Aura adalah pengelola paket untuk Arch Linux
  it: Aura è un gestore di pacchetti per Arch Linux
  ja: Aura は Arch Linux のパッケージマネージャーです
  ko: Aura는 Arch Linux용 패키지 관리자입니다
  pl: Aura to menedżer pakietów dla Arch Linux
  pt: Aura é um gerenciador de pacotes para o Arch Linux
  ro: Aura este un manager de pachete pentru Arch Linux
  ru: Aura — менеджер пакетов для Arch Linux
  th: Aura คือตัวจัดการแพ็กเกจสำหรับ Arch Linux
  tr: Aura, Arch Linux için bir paket yöneticisidir
  uk: Aura — менеджер пакетів для Arch Linux
  vi: Aura là trình quản lý gói cho Arch Linux
x:
  source: https://github.com/fosskers/aura
  yay: aura
rule:
  arch/stack:
    cmd: 'git clone https://github.com/fosskers/aura.git \

      && cd aura \

      && stack install -- aura

      '
    reference: https://fosskers.github.io/aura/install.html#building-from-source
  arch/yay:
    cmd: yay -S aura
    reference: https://aur.archlinux.org/packages/aura
binlist:
- aura

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 933 KB
          rating: 1
          desc:
            cn: 安装 933 KB
            en: 933 KB install
        download:
          estimate: 933 KB
          desc:
            cn: 约 933 KB 下载 (macos/x64)
            en: ~933 KB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
