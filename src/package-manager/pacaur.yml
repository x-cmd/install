lang: Shell
homepage: https://github.com/rmarquis/pacaur
license: ISC
desc:
  en: An AUR helper that minimizes user interaction
  cn: 一个最小化用户交互的 AUR 帮助程序
x:
  source: https://github.com/rmarquis/pacaur
  pacman: git
  makepkg: makepkg
  yay: pacaur
rule:
  arch/pacman:
    cmd: 'sudo pacman -S git base-devel \

      && git clone https://aur.archlinux.org/pacaur.git \

      && cd pacaur \

      && makepkg -si

      '
    reference: https://zhuanlan.zhihu.com/p/114904008
  arch/yay:
    cmd: yay -S pacaur
    reference: https://aur.archlinux.org/packages/pacaur
binlist:
- pacaur

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
