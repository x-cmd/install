lang: Shell
homepage: https://github.com/jenv/jenv
license: MIT
desc:
  cn: JEnv 是一个命令行工具，可以帮助您忘记如何设置 JAVA _ HOME 环境变量
  en: jEnv is a command line tool to help you forget how to set the JAVA_HOME environment variable
x:
  source: https://github.com/jenv/jenv
rule:
  darwin/brew:
    cmd: brew install jenv
    reference: https://www.jenv.be/
binlist:
- jenv

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
