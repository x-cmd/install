lang: Rust
homepage: https://github.com/rust-lang/rustup
license: Apache-2.0
desc:
  cn: rustup 从官方发布渠道安装 Rust 编程语言，使您能够轻松地在稳定版、测试版和夜间编译器之间切换并保持更新
  en: rustup installs The Rust Programming Language from the official release channels, enabling you to easily switch between stable, beta, and nightly compilers and keep them updated
x:
  source: https://github.com/rust-lang/rustup
rule:
  darwin/brew:
    cmd: brew install rustup-init
    reference: https://formulae.brew.sh/formula/rustup-init#default
  arch/pacman:
    cmd: sudo pacman -S rustup
    reference: https://command-not-found.com/rustup
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
    reference: https://www.rust-lang.org/tools/install
binlist:
- rustup

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
