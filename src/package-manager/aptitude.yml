lang: C++
homepage: https://salsa.debian.org/apt-team/aptitude
desc:
  cn: Aptitude 是一个基于 Ncurses 的 Apt 前端，debian 软件包管理器。既然它是基于文本的，从就要从终端或命令行(CLI，命令行界面)下启动
  en: Aptitude is an Ncurses and command-line based front-end to numerous Apt libraries, which are also used by Apt, the default Debian package manager
rule:
  debian/apt:
    cmd: sudo apt-get install aptitude
    reference: https://command-not-found.com/aptitude-curses
    dsnap: aptitude
  ubuntu/apt:
    cmd: sudo apt-get install aptitude
    reference: https://command-not-found.com/aptitude-curses
    dsnap: aptitude
  kali/apt:
    cmd: sudo apt-get install aptitude
    reference: https://command-not-found.com/aptitude-curses
    dsnap: aptitude
  raspbian/apt:
    cmd: sudo apt-get install aptitude
    reference: https://command-not-found.com/aptitude-curses
binlist:
- aptitude
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
