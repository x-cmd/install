lang: C++
homepage: https://linglong.dev/guide/start/install.html
desc:
  cn: 玲珑是统信软件自研的开源软件包格式，用于替代 deb、rpm 等包管理工具，实现了应用包管理、分发、容器、集成开发工具等功能。
  en: Linglong is a self -developed open source software package format for Fanxin Software. It is used to replace DEB, RPM and other package management tools, and realize the functions of application package management, distribution, container, integrated development tools.
rule:
  deepin/apt:
    cmd: sudo apt install linglong-builder linglong-box linglong-bin
    reference: https://linglong.dev/guide/start/install.html#deepin-v23
  openeuler/dnf:
    cmd: 'sudo curl -o /etc/yum.repos.d/linglong.repo -L https://eur.openeuler.openatom.cn/coprs/kamiyadm/linglong/repo/openeuler-24.03_LTS/kamiyadm-linglong-openeuler-24.03_LTS.repo && \

      sudo dnf update && \

      sudo dnf install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#openeuler-24-03
  uos/apt:
    cmd: 'echo "deb [trusted=yes] https://ci.deepin.com/repo/deepin/deepin-community/linglong-repo/ unstable main" | sudo tee -a /etc/apt/sources.list && \

      sudo apt update && \

      sudo apt install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#uos-1070
  ubuntu/apt:
    cmd: 'sudo apt install -y apt-transport-https ca-certificates curl gpg xdg-utils && \

      sudo mkdir -p /etc/apt/keyrings/ && \

      curl -fsSL https://download.opensuse.org/repositories/home:/kamiyadm/xUbuntu_24.04/Release.key && \

      sudo gpg --dearmor -o /etc/apt/keyrings/linglong-apt-keyring.gpg && \

      echo "deb [signed-by=/etc/apt/keyrings/linglong-apt-keyring.gpg] https://download.opensuse.org/repositories/home:/kamiyadm/xUbuntu_24.04/ ./" && \

      sudo tee /etc/apt/sources.list.d/linglong.list && \

      sudo apt update && \

      sudo apt install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#ubuntu-24-04
  debian/apt:
    cmd: 'sudo apt install -y apt-transport-https ca-certificates curl gpg xdg-utils && \

      sudo mkdir -p /etc/apt/keyrings/ && \

      curl -fsSL https://download.opensuse.org/repositories/home:/kamiyadm/Debian_12/Release.key && \

      sudo gpg --dearmor -o /etc/apt/keyrings/linglong-apt-keyring.gpg && \

      echo "deb [signed-by=/etc/apt/keyrings/linglong-apt-keyring.gpg] https://download.opensuse.org/repositories/home:/kamiyadm/Debian_12/ ./" && \

      sudo tee /etc/apt/sources.list.d/linglong.list && \

      sudo apt update && \

      sudo apt install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#debian-12
  openkylin/apt:
    cmd: 'sudo bash -c "echo ''deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/multi_distro/openkylin2.0_repo/ ./'' > /etc/apt/sources.list.d/linglong.list" && \

      sudo apt update && \

      sudo apt install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#openkylin-2-0rc
binlist:
- ll-cli
license: NOASSERTION
