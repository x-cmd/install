lang: C++
homepage: https://linglong.dev/guide/start/install.html
desc:
  cn: 玲珑是统信软件自研的开源软件包格式，用于替代 deb、rpm 等包管理工具，实现了应用包管理、分发、容器、集成开发工具等功能。
  en: Linglong is a self -developed open source software package format for Fanxin Software. It is used to replace DEB, RPM and other package management tools, and realize the functions of application package management, distribution, container, integrated development tools.
  cs: Linglong je vlastní open source formát softwarových balíčků od Fanxin Software. Nahrazuje DEB, RPM a další nástroje správy balíčků a realizuje funkce správy, distribuce a kontejnerizace aplikačních balíčků a integrovaných vývojových nástrojů.
  de: Linglong ist ein selbst entwickeltes Open-Source-Softwarepaketformat von Fanxin Software. Es ersetzt DEB, RPM und andere Paketverwaltungstools und ermöglicht Funktionen wie Anwendungspaketverwaltung, -verteilung, Container und integrierte Entwicklungstools.
  es: Linglong es un formato de paquete de software de código abierto desarrollado por Fanxin Software. Se usa para reemplazar DEB, RPM y otras herramientas de gestión de paquetes, y realizar funciones de gestión de paquetes de aplicaciones, distribución, contenedores y herramientas de desarrollo integradas.
  fr: Linglong est un format de paquet logiciel open source développé par Fanxin Software. Il remplace DEB, RPM et d'autres outils de gestion de paquets, et réalise les fonctions de gestion des paquets d'applications, de distribution, de conteneurisation et d'outils de développement intégrés.
  id: Linglong adalah format paket perangkat lunak sumber terbuka yang dikembangkan sendiri oleh Fanxin Software. Ini digunakan untuk menggantikan DEB, RPM dan alat manajemen paket lainnya, serta menyediakan fungsi manajemen paket aplikasi, distribusi, kontainer, dan alat pengembangan terintegrasi.
  it: Linglong è un formato di pacchetto software open source sviluppato da Fanxin Software. Viene usato per sostituire DEB, RPM e altri strumenti di gestione dei pacchetti, e realizza le funzioni di gestione dei pacchetti applicativi, distribuzione, container e strumenti di sviluppo integrati.
  ja: Linglong は Fanxin Software が独自に開発したオープンソースのソフトウェアパッケージ形式です。DEB、RPM などのパッケージ管理ツールを置き換えるために使用され、アプリケーションパッケージの管理・配布、コンテナ、統合開発ツールなどの機能を実現します。
  ko: Linglong은(는) Fanxin Software가 자체 개발한 오픈 소스 소프트웨어 패키지 형식입니다. DEB, RPM 및 기타 패키지 관리 도구를 대체하는 데 사용되며, 애플리케이션 패키지 관리, 배포, 컨테이너, 통합 개발 도구 기능을 제공합니다.
  pl: Linglong to opracowany przez Fanxin Software otwarty format pakietów oprogramowania. Służy do zastąpienia DEB, RPM i innych narzędzi zarządzania pakietami oraz realizuje funkcje zarządzania pakietami aplikacji, dystrybucji, kontenerów i zintegrowanych narzędzi deweloperskich.
  pt: Linglong é um formato de pacote de software de código aberto desenvolvido pela Fanxin Software. É usado para substituir DEB, RPM e outras ferramentas de gerenciamento de pacotes, e realiza as funções de gerenciamento de pacotes de aplicativos, distribuição, contêineres e ferramentas de desenvolvimento integradas.
  ro: Linglong este un format de pachet de software open source dezvoltat de Fanxin Software. Este folosit pentru a înlocui DEB, RPM și alte instrumente de gestionare a pachetelor și realizează funcțiile de gestionare a pachetelor de aplicații, distribuție, containere și unelte de dezvoltare integrate.
  ru: Linglong — это разработанный Fanxin Software формат пакетов с открытым исходным кодом. Он используется вместо DEB, RPM и других инструментов управления пакетами и обеспечивает управление пакетами приложений, распространение, контейнеризацию и интегрированные инструменты разработки.
  th: Linglong คือรูปแบบแพ็กเกจซอฟต์แวร์โอเพนซอร์สที่พัฒนาขึ้นเองโดย Fanxin Software ใช้แทน DEB, RPM และเครื่องมือจัดการแพ็กเกจอื่น ๆ พร้อมความสามารถในการจัดการแพ็กเกจแอปพลิเคชัน การกระจาย คอนเทนเนอร์ และเครื่องมือพัฒนาแบบบูรณาการ
  tr: Linglong, Fanxin Software tarafından kendi geliştirilen açık kaynaklı bir yazılım paketi biçimidir. DEB, RPM ve diğer paket yönetimi araçlarının yerine geçmek için kullanılır; uygulama paketi yönetimi, dağıtım, konteyner ve entegre geliştirme araçları işlevlerini gerçekleştirir.
  uk: Linglong — це розроблений Fanxin Software формат пакета з відкритим кодом. Він використовується замість DEB, RPM та інших інструментів керування пакетами і забезпечує функції керування пакетами застосунків, розповсюдження, контейнеризації та інтегровані засоби розробки.
  vi: Linglong là định dạng gói phần mềm mã nguồn mở do Fanxin Software tự phát triển. Nó được dùng để thay thế DEB, RPM và các công cụ quản lý gói khác, đồng thời thực hiện các chức năng quản lý gói ứng dụng, phân phối, container và công cụ phát triển tích hợp.
rule:
  deepin/apt:
    cmd: sudo apt install linglong-builder linglong-box linglong-bin
    reference: https://linglong.dev/guide/start/install.html#deepin-v23
  openeuler/dnf:
    cmd: 'sudo curl -o /etc/yum.repos.d/linglong.repo -L https://eur.openeuler.openatom.cn/coprs/kamiyadm/linglong/repo/openeuler-24.03_LTS/kamiyadm-linglong-openeuler-24.03_LTS.repo && \

      sudo dnf update && \

      sudo dnf install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#openeuler-24-03
  uos/apt:
    cmd: 'echo "deb [trusted=yes] https://ci.deepin.com/repo/deepin/deepin-community/linglong-repo/ unstable main" | sudo tee -a /etc/apt/sources.list && \

      sudo apt update && \

      sudo apt install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#uos-1070
  ubuntu/apt:
    cmd: 'sudo apt install -y apt-transport-https ca-certificates curl gpg xdg-utils && \

      sudo mkdir -p /etc/apt/keyrings/ && \

      curl -fsSL https://download.opensuse.org/repositories/home:/kamiyadm/xUbuntu_24.04/Release.key && \

      sudo gpg --dearmor -o /etc/apt/keyrings/linglong-apt-keyring.gpg && \

      echo "deb [signed-by=/etc/apt/keyrings/linglong-apt-keyring.gpg] https://download.opensuse.org/repositories/home:/kamiyadm/xUbuntu_24.04/ ./" && \

      sudo tee /etc/apt/sources.list.d/linglong.list && \

      sudo apt update && \

      sudo apt install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#ubuntu-24-04
  debian/apt:
    cmd: 'sudo apt install -y apt-transport-https ca-certificates curl gpg xdg-utils && \

      sudo mkdir -p /etc/apt/keyrings/ && \

      curl -fsSL https://download.opensuse.org/repositories/home:/kamiyadm/Debian_12/Release.key && \

      sudo gpg --dearmor -o /etc/apt/keyrings/linglong-apt-keyring.gpg && \

      echo "deb [signed-by=/etc/apt/keyrings/linglong-apt-keyring.gpg] https://download.opensuse.org/repositories/home:/kamiyadm/Debian_12/ ./" && \

      sudo tee /etc/apt/sources.list.d/linglong.list && \

      sudo apt update && \

      sudo apt install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#debian-12
  openkylin/apt:
    cmd: 'sudo bash -c "echo ''deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/multi_distro/openkylin2.0_repo/ ./'' > /etc/apt/sources.list.d/linglong.list" && \

      sudo apt update && \

      sudo apt install linglong-builder linglong-box linglong-bin

      '
    reference: https://linglong.dev/guide/start/install.html#openkylin-2-0rc

x:
  apt: linglong-builder
  dnf: linglong-builder
binlist:
- ll-cli
