lang: Go
homepage: https://github.com/orhun/pkgtop
license: GPL-3.0
desc:
  cn: 用于 GNU/Linux 系统的交互式包管理器和资源监视器
  en: An interactive package manager and resource monitor for GNU/Linux systems
  cs: Interaktivní správce balíčků a monitor zdrojů pro systémy GNU/Linux
  de: Ein interaktiver Paketmanager und Ressourcenmonitor für GNU/Linux-Systeme
  es: Un gestor de paquetes interactivo y monitor de recursos para sistemas GNU/Linux
  fr: Un gestionnaire de paquets interactif et moniteur de ressources pour les systèmes GNU/Linux
  id: Pengelola paket interaktif dan monitor sumber daya untuk sistem GNU/Linux
  it: Un gestore di pacchetti interattivo e monitor delle risorse per sistemi GNU/Linux
  ja: GNU/Linux システム向けの対話型パッケージマネージャー兼リソースモニター
  ko: GNU/Linux 시스템을 위한 대화형 패키지 관리자이자 자원 모니터
  pl: Interaktywny menedżer pakietów i monitor zasobów dla systemów GNU/Linux
  pt: Um gerenciador de pacotes interativo e monitor de recursos para sistemas GNU/Linux
  ro: Un manager de pachete interactiv și monitor de resurse pentru sistemele GNU/Linux
  ru: Интерактивный менеджер пакетов и монитор ресурсов для систем GNU/Linux
  th: ตัวจัดการแพ็กเกจแบบโต้ตอบและเครื่องมือตรวจสอบทรัพยากรสำหรับระบบ GNU/Linux
  tr: GNU/Linux sistemleri için etkileşimli paket yöneticisi ve kaynak izleyici
  uk: Інтерактивний менеджер пакетів і монітор ресурсів для систем GNU/Linux
  vi: Trình quản lý gói tương tác và trình giám sát tài nguyên cho các hệ thống GNU/Linux
x:
  source: https://github.com/orhun/pkgtop
  yay: pkgtop
  go: github.com/orhun/pkgtop/cmd@latest
rule:
  arch/yay:
    cmd: yay -S pkgtop
    reference: https://aur.archlinux.org/packages/pkgtop
  /nix-env:
    cmd: nix-env -iA nixos.pkgtop
    reference: https://github.com/orhun/pkgtop#installation
  /go:
    cmd: go install github.com/orhun/pkgtop/cmd@latest
    reference: https://github.com/orhun/pkgtop#installation
    dsnap: pkgtop
binlist:
- pkgtop

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 63 KB
          rating: 1
          desc:
            cn: 约 63 KB（估算）
            en: ~63 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
