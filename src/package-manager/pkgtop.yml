lang: Go
homepage: https://github.com/orhun/pkgtop
license: GPL-3.0
desc:
  cn: 用于 GNU/Linux 系统的交互式包管理器和资源监视器
  en: An interactive package manager and resource monitor for GNU/Linux systems
x:
  source: https://github.com/orhun/pkgtop
  yay: pkgtop
  go: github.com/orhun/pkgtop/cmd@latest
rule:
  arch/yay:
    cmd: yay -S pkgtop
    reference: https://aur.archlinux.org/packages/pkgtop
  /nix-env:
    cmd: nix-env -iA nixos.pkgtop
    reference: https://github.com/orhun/pkgtop#installation
  /go:
    cmd: go install github.com/orhun/pkgtop/cmd@latest
    reference: https://github.com/orhun/pkgtop#installation
    dsnap: pkgtop
binlist:
- pkgtop

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 63 KB
          rating: 1
          desc:
            cn: 约 63 KB（估算）
            en: ~63 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
