lang: Python
homepage: https://github.com/conan-io/conan
license: MIT
desc:
  cn: Conan 是 C 和 C++ 语言的依赖项和包管理器
  en: Conan is a dependency and package manager for C and C++ languages
x:
  source: https://github.com/conan-io/conan
  eget: https://github.com/conan-io/conan
rule:
  /eget:
    cmd: x eget conan-io/conan
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install conan
    reference: https://docs.conan.io/2/installation.html
    dsnap: conan
  /pipx:
    cmd: pipx install conan
    reference: https://docs.conan.io/2/installation.html
  arch/yay:
    cmd: yay -S conan-bin
    reference: https://aur.archlinux.org/packages/conan-bin
binlist:
- conan

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
