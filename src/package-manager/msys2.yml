lang: Shell
homepage: https://packages.msys2.org/queue
desc:
  cn: MSYS2 是一个工具和库的集合，为您提供了一个易于使用的环境，用于构建、安装和运行本地 Windows 软件
  en: MSYS2 is a collection of tools and libraries providing you with an easy-to-use environment for building, installing and running native Windows software
rule:
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add main \

      && x scoop install main/msys2

      '
    reference: https://scoop.sh/#/apps?q=msys2
  (win|wsl2)/choco:
    cmd: x choco install msys2
    reference: https://community.chocolatey.org/packages/msys2
  (win|wsl2)/winget:
    cmd: x winget install MSYS2.MSYS2
    reference: https://winget.run/pkg/MSYS2/MSYS2

x:
  scoop: main/msys2
  choco: msys2
  winget: MSYS2.MSYS2
  powershell: msys2
binlist:
- msys2
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
