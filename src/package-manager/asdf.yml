lang: Shell
homepage: https://github.com/asdf-vm/asdf
license: MIT
desc:
  cn: asdf 是一个 CLI 工具，可以在每个项目的基础上管理多个语言运行时版本
  en: asdf is a CLI tool that can manage multiple language runtime versions on a per-project basis
  cs: asdf je nástroj CLI, který umožňuje spravovat verze běhových prostředí jednotlivých jazyků pro každý projekt zvlášť
  de: asdf ist ein CLI-Tool, das mehrere Sprach-Laufzeitversionen pro jedes Projekt einzeln verwalten kann
  es: asdf es una herramienta de CLI que puede gestionar varias versiones de runtimes de lenguaje proyecto por proyecto
  fr: asdf est un outil CLI capable de gérer plusieurs versions d'environnements d'exécution par langage, projet par projet
  id: asdf adalah alat CLI yang dapat mengelola beberapa versi runtime bahasa untuk setiap proyek
  it: asdf è uno strumento CLI che può gestire più versioni di runtime per linguaggio, progetto per progetto
  ja: asdf は、プロジェクトごとに複数の言語ランタイムバージョンを管理できる CLI ツールです
  ko: asdf는 프로젝트별로 여러 언어 런타임 버전을 관리할 수 있는 CLI 도구입니다
  pl: asdf to narzędzie CLI, które pozwala zarządzać wieloma wersjami środowisk uruchomieniowych języków osobno dla każdego projektu
  pt: asdf é uma ferramenta de CLI que permite gerenciar várias versões de runtimes de linguagem em cada projeto
  ro: asdf este un instrument CLI care poate gestiona mai multe versiuni de rulare a limbajelor, pe bază de proiect
  ru: asdf — это CLI-инструмент для управления несколькими версиями сред выполнения языков в рамках каждого проекта
  th: asdf เป็นเครื่องมือ CLI ที่จัดการเวอร์ชันรันไทม์ของภาษาหลายเวอร์ชันในแต่ละโปรเจกต์ได้
  tr: asdf, her proje için birden fazla dil çalışma zamanı sürümünü yönetebilen bir CLI aracıdır
  uk: asdf — це CLI-інструмент для керування кількома версіями середовищ виконання мов окремо для кожного проєкту
  vi: asdf là công cụ CLI có thể quản lý nhiều phiên bản runtime ngôn ngữ cho từng dự án
x:
  source: https://github.com/asdf-vm/asdf
  eget: asdf-vm/asdf
  brew: asdf
  makepkg: makepkg
  yay: asdf-vm
  asdf: asdf
rule:
  /eget:
    cmd: x eget asdf-vm/asdf
    reference: https://x-cmd.com/mod/eget
  /git:
    cmd: x asdf --install
    reference: https://x-cmd.com/mod/asdf
  darwin/brew:
    cmd: brew install asdf
    reference: https://asdf-vm.com/guide/getting-started.html#community-supported-download-methods
  /pacman:
    cmd: git clone https://aur.archlinux.org/asdf-vm.git && cd asdf-vm && makepkg -si
    reference: https://asdf-vm.com/guide/getting-started.html#community-supported-download-methods
  arch/yay:
    cmd: yay -S asdf-vm
    reference: https://aur.archlinux.org/packages/asdf-vm
binlist:
- asdf
# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # git clones plugins
    filesystem:
      read:
        desc:
          cn: 读取 ~/.asdf, .tool-versions
          en: Reads ~/.asdf, .tool-versions
        sensitive: []
      write:
        desc:
          cn: 写入 ~/.asdf (插件/版本)
          en: Writes ~/.asdf (plugins/versions)
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4.2 MB
          rating: 1
          desc:
            cn: 安装 4.2 MB
            en: 4.2 MB install
        growth:
          desc:
            cn: ~/.asdf 随插件/版本安装线性增长
            en: ~/.asdf grows with plugin/version installs
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data:
        - "$HOME/.asdf"
        config:
        - ".tool-versions"
    memory:
      idle:
        estimate: 11 MB
        desc:
          cn: 11 MB
          en: 11 MB
      peak:
        estimate: 80 MB
        desc:
          cn: 安装版本时
          en: During version install
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 1
        desc:
          cn: 编译安装时短暂占用
          en: Brief spike on compile install
  platform:
    win: full
    linux: full
    darwin: full
