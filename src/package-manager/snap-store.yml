lang: Python
homepage: https://snapcraft.io/snap-store
desc:
  cn: Snap Store 是一个图形化桌面应用程序，用于发现、安装和管理 Linux 上的快照
  en: Snap Store is a graphical desktop application for discovering, installing and managing snaps on Linux
rule:
  arch/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/arch
  centos/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/centos
  debian/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/debian
  elementary/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/elementary
  fedora/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/fedora
  neon/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/kde-neon
  kubuntu/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/kubuntu
  manjaro/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/manjaro
  pop/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/pop
  opensuse/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/opensuse
  rhel/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/rhel
  ubuntu/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/ubuntu
  kali/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/ubuntu
  raspbian/snap:
    cmd: sudo snap-get install snap
    reference: https://snapcraft.io/install/snap-store/raspbian
binlist:
- snap-store
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
