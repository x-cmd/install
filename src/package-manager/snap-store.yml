lang: Python
homepage: https://snapcraft.io/snap-store
desc:
  cn: Snap Store 是一个图形化桌面应用程序，用于发现、安装和管理 Linux 上的快照
  en: Snap Store is a graphical desktop application for discovering, installing and managing snaps on Linux
  cs: Snap Store je grafická desktopová aplikace pro vyhledávání, instalaci a správu snapů v Linuxu
  de: Snap Store ist eine grafische Desktop-Anwendung zum Entdecken, Installieren und Verwalten von Snaps unter Linux
  es: Snap Store es una aplicación de escritorio gráfica para descubrir, instalar y gestionar snaps en Linux
  fr: Snap Store est une application de bureau graphique pour découvrir, installer et gérer les snaps sous Linux
  id: Snap Store adalah aplikasi desktop grafis untuk menemukan, memasang, dan mengelola snap di Linux
  it: Snap Store è un'applicazione desktop grafica per scoprire, installare e gestire gli snap su Linux
  ja: Snap Store は Linux でスナップを見つけてインストールし管理するためのグラフィカルなデスクトップアプリケーションです
  ko: Snap Store는 Linux에서 스냅을 검색, 설치 및 관리하는 그래픽 데스크톱 애플리케이션입니다
  pl: Snap Store to graficzna aplikacja komputerowa do wyszukiwania, instalowania i zarządzania snapami w systemie Linux
  pt: Snap Store é um aplicativo de desktop gráfico para descobrir, instalar e gerenciar snaps no Linux
  ro: Snap Store este o aplicație desktop grafică pentru descoperirea, instalarea și gestionarea pachetelor snap în Linux
  ru: Snap Store — графическое настольное приложение для поиска, установки и управления snap-пакетами в Linux
  th: Snap Store เป็นแอปพลิเคชันเดสก์ท็อปแบบกราฟิกสำหรับค้นหา ติดตั้ง และจัดการ snap บน Linux
  tr: Snap Store, Linux'ta snap'leri keşfetmek, kurmak ve yönetmek için grafik bir masaüstü uygulamasıdır
  uk: Snap Store — графічний настільний застосунок для пошуку, встановлення та керування snap-пакетами в Linux
  vi: Snap Store là ứng dụng máy tính đồ họa để khám phá, cài đặt và quản lý các gói snap trên Linux
rule:
  arch/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/arch
  centos/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/centos
  debian/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/debian
  elementary/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/elementary
  fedora/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/fedora
  neon/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/kde-neon
  kubuntu/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/kubuntu
  manjaro/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/manjaro
  pop/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/pop
  opensuse/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/opensuse
  rhel/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/rhel
  ubuntu/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/ubuntu
  kali/snap:
    cmd: sudo snap install snap-store
    reference: https://snapcraft.io/install/snap-store/ubuntu
  raspbian/snap:
    cmd: sudo snap-get install snap
    reference: https://snapcraft.io/install/snap-store/raspbian

x:
  snap: snap-store
binlist:
- snap-store
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
