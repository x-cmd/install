lang: Go
homepage: https://github.com/snapcore/snapd
license: GPL-3.0
desc:
  cn: Snaps 是易于安装，安全，跨平台和无依赖性的桌面，云和物联网的应用程序软件包
  en: Snaps are app packages for desktop, cloud and IoT that are easy to install, secure, cross‐platform and dependency‐free
x:
  source: https://github.com/snapcore/snapd
rule:
  debian/apt:
    cmd: sudo sudo apt install snapd
    reference: https://snapcraft.io/docs/installing-snap-on-debian
    dsnap: snapd
  ubuntu/apt:
    cmd: sudo sudo apt install snapd
    reference: https://snapcraft.io/docs/installing-snap-on-ubuntu
    dsnap: snapd
  kali/apt:
    cmd: sudo sudo apt install snapd
    reference: https://snapcraft.io/docs/installing-snap-on-ubuntu
    dsnap: sudo sudo apt install snapd
  fedora/dnf:
    cmd: sudo dnf install snapd
    reference: https://snapcraft.io/docs/installing-snap-on-fedora
  raspbian/apt:
    cmd: sudo apt install snapd
    reference: https://snapcraft.io/docs/installing-snap-on-raspbian
  opensuse/zypper:
    cmd: sudo zypper install snapd
    reference: https://snapcraft.io/docs/installing-snap-on-opensuse
  arch/git:
    cmd: 'git clone https://aur.archlinux.org/snapd.git \

      && cd snapd \

      && makepkg -si \

      && sudo systemctl enable --now snapd.socket \

      && sudo ln -s /var/lib/snapd/snap /snap

      '
    reference: https://snapcraft.io/docs/installing-snap-on-arch-linux
  arch/yay:
    cmd: yay -S snapd
    reference: https://aur.archlinux.org/packages/snapd
  manjaro/pacman:
    cmd: sudo pacman -S snapd
    reference: https://snapcraft.io/docs/installing-snap-on-manjaro-linux
binlist:
- snap

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
