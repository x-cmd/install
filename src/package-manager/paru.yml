lang: Rust
homepage: https://github.com/Morganamilo/paru
license: GPL-3.0
desc:
  cn: Paru 是一个标准的 pacman 包装器，同时也是 AUR 助手，它功能丰富且交互极简。
  en: Paru is your standard pacman wrapping AUR helper with lots of features and minimal interaction
x:
  source: https://github.com/Morganamilo/paru
  eget: https://github.com/Morganamilo/paru
rule:
  /eget:
    cmd: x eget Morganamilo/paru
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: sudo yay -S paru
    reference: https://aur.archlinux.org/packages/paru
  arch/pacman:
    cmd: 'sudo pacman -S --needed base-devel  \

      && git clone https://aur.archlinux.org/paru.git \

      && cd paru \

      && makepkg -si

      '
    reference: https://github.com/Morganamilo/paru?tab=readme-ov-file#installation
binlist:
- paru

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
