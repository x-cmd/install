lang: Rust
homepage: https://github.com/rust-lang/cargo
license: Apache-2.0
desc:
  cn: Cargo 是 Rust 包管理器
  en: Cargo is the Rust package manager
x:
  source: https://github.com/rust-lang/cargo
rule:
  linux/curl:
    cmd: curl https://sh.rustup.rs -sSf | sh
    reference: https://doc.rust-lang.org/stable/cargo/getting-started/installation.html#install-rust-and-cargo
  darwin/curl:
    cmd: curl https://sh.rustup.rs -sSf | sh
    reference: https://doc.rust-lang.org/stable/cargo/getting-started/installation.html#install-rust-and-cargo
binlist:
- cargo

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
