lang: c/shell
homepage: https://gitlab.archlinux.org/archlinux/pacman
desc:
  cn: Pacman 是一个在 Linux 中管理软件包的实用程序
  en: Pacman is a utility which manages software packages in Linux
rule:
  debian/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
  ubuntu/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
  alpine/apk:
    cmd: sudo apk add pacman
    reference: https://command-not-found.com/pacman
  arch/pacman:
    cmd: sudo pacman -S pacman
    reference: https://command-not-found.com/pacman
  kali/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
    dsnap: pacman
  fedora/dnf:
    cmd: sudo dnf install pacman
    reference: https://command-not-found.com/pacman
  raspbian/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
binlist:
- pacman
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
