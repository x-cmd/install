lang: c/shell
homepage: https://gitlab.archlinux.org/archlinux/pacman
desc:
  cn: Pacman 是一个在 Linux 中管理软件包的实用程序
  en: Pacman is a utility which manages software packages in Linux
  cs: Pacman je nástroj, který v Linuxu spravuje softwarové balíčky
  de: Pacman ist ein Werkzeug, das Softwarepakete unter Linux verwaltet
  es: Pacman es una utilidad que gestiona paquetes de software en Linux
  fr: Pacman est un utilitaire qui gère les paquets logiciels sous Linux
  id: Pacman adalah utilitas yang mengelola paket perangkat lunak di Linux
  it: Pacman è un'utilità che gestisce i pacchetti software in Linux
  ja: Pacman は Linux でソフトウェアパッケージを管理するユーティリティです
  ko: Pacman은 Linux에서 소프트웨어 패키지를 관리하는 유틸리티입니다
  pl: Pacman to narzędzie do zarządzania pakietami oprogramowania w systemie Linux
  pt: Pacman é um utilitário que gerencia pacotes de software no Linux
  ro: Pacman este o utilitate care gestionează pachetele de software în Linux
  ru: Pacman — это утилита для управления пакетами программ в Linux
  th: Pacman คือยูทิลิตี้ที่จัดการแพ็กเกจซอฟต์แวร์บน Linux
  tr: Pacman, Linux'ta yazılım paketlerini yöneten bir yardımcı programdır
  uk: Pacman — це утиліта для керування пакетами програм у Linux
  vi: Pacman là tiện ích quản lý các gói phần mềm trên Linux
rule:
  debian/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
  ubuntu/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
  alpine/apk:
    cmd: sudo apk add pacman
    reference: https://command-not-found.com/pacman
  arch/pacman:
    cmd: sudo pacman -S pacman
    reference: https://command-not-found.com/pacman
  kali/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
    dsnap: pacman
  fedora/dnf:
    cmd: sudo dnf install pacman
    reference: https://command-not-found.com/pacman
  raspbian/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman

x:
  apt: pacman
  apt-get: pacman
  dnf: pacman
  pacman: pacman
  apk: pacman
binlist:
- pacman
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
