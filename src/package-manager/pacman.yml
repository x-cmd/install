lang: c/shell
homepage: https://gitlab.archlinux.org/archlinux/pacman
desc:
  cn: Pacman 是一个在 Linux 中管理软件包的实用程序
  en: Pacman is a utility which manages software packages in Linux
rule:
  debian/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
  ubuntu/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
  alpine/apk:
    cmd: sudo apk add pacman
    reference: https://command-not-found.com/pacman
  arch/pacman:
    cmd: sudo pacman -S pacman
    reference: https://command-not-found.com/pacman
  kali/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
    dsnap: pacman
  fedora/dnf:
    cmd: sudo dnf install pacman
    reference: https://command-not-found.com/pacman
  raspbian/apt:
    cmd: sudo apt-get install pacman
    reference: https://command-not-found.com/pacman
binlist:
- pacman
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
