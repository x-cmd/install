lang: rust
homepage: https://github.com/lucasgelfond/zerobrew
license: apache-2.0
desc:
  cn: 比 Homebrew 快 5-20 倍的实验性替代品——用 uv 风格架构在 macOS/Linux 管理 Homebrew 包，命令为 zb
  en: A 5-20x faster experimental Homebrew alternative that brings uv-style architecture to Homebrew packages on macOS and Linux
x:
  source: https://github.com/lucasgelfond/zerobrew
rule:
  /curl:
    cmd: curl -fsSL https://zerobrew.rs/install | bash
    reference: https://github.com/lucasgelfond/zerobrew
  darwin/brew:
    cmd: brew install lucasgelfond/zerobrew/zerobrew
    reference: https://github.com/lucasgelfond/zerobrew
binlist:
- zb

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 813 KB
          rating: 1
          desc:
            cn: 约 813 KB（估算）
            en: ~813 KB estimated
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
