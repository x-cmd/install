lang: Go
homepage: https://github.com/linuxdeepin/linglong-pica
license: LGPL-3.0
desc:
  cn: 提供 deb 包转换为玲珑包的能力，生成构建玲珑应用需要的 linglong.yaml 文件，并依赖 ll-builder 来实现应用构建和导出。
  en: Provide the ability to convert the DEB package to the exquisite package, generate the linglong.yaml file required to build the exquisite application, and rely on LL-Builder to achieve application construction and export.
x:
  source: https://github.com/linuxdeepin/linglong-pica
  apt: linglong-pica
rule:
  deepin/apt:
    cmd: sudo apt install linglong-pica
    reference: https://linglong.dev/guide/start/install.html#deepin-v23-1
  uos/apt:
    cmd: sudo apt install linglong-pica
    reference: https://linglong.dev/guide/start/install.html#uos-1070-1
  arch/yay:
    cmd: yay -S linglong-pica
    reference: https://aur.archlinux.org/packages/linglong-pica
binlist:
- linglong-pica

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
