homepage: https://github.com/trizen/trizen
license: GPL-3.0
lang: Perl
desc:
  en: Lightweight AUR Package Manager
  cn: 轻量级 AUR 包管理器
x:
  source: https://github.com/trizen/trizen
rule:
  arch/pacman:
    cmd: 'git clone https://aur.archlinux.org/trizen.git \

      && cd trizen \

      && makepkg -si

      '
    reference: https://github.com/trizen/trizen/blob/master/TRIZEN.md#installation
  arch/yay:
    cmd: yay -S trizen
    reference: https://aur.archlinux.org/packages/trizen
binlist:
- trizen

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
