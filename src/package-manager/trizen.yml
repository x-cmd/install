homepage: https://github.com/trizen/trizen
license: GPL-3.0
lang: Perl
desc:
  en: Lightweight AUR Package Manager
  cn: 轻量级 AUR 包管理器
  cs: Lehký správce balíčků AUR
  de: Leichtgewichtiger AUR-Paketmanager
  es: Gestor de paquetes AUR ligero
  fr: Gestionnaire de paquets AUR léger
  id: Manajer paket AUR yang ringan
  it: Gestore di pacchetti AUR leggero
  ja: 軽量な AUR パッケージマネージャー
  ko: 가벼운 AUR 패키지 관리자
  pl: Lekki menedżer pakietów AUR
  pt: Gerenciador de pacotes AUR leve
  ro: Manager de pachete AUR ușor
  ru: Лёгкий менеджер пакетов AUR
  th: ตัวจัดการแพ็กเกจ AUR ขนาดเบา
  tr: Hafif AUR paket yöneticisi
  uk: Легкий менеджер пакетів AUR
  vi: Trình quản lý gói AUR nhẹ
x:
  source: https://github.com/trizen/trizen
  makepkg: makepkg
  yay: trizen
rule:
  arch/pacman:
    cmd: 'git clone https://aur.archlinux.org/trizen.git \

      && cd trizen \

      && makepkg -si

      '
    reference: https://github.com/trizen/trizen/blob/master/TRIZEN.md#installation
  arch/yay:
    cmd: yay -S trizen
    reference: https://aur.archlinux.org/packages/trizen
binlist:
- trizen

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
