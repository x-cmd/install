lang: Tcl
homepage: https://github.com/macports/macports-base
license: BSD-3-Clause
desc:
  cn: MacPorts 是一个易于使用的系统，用于编译、安装和管理开源软件
  en: MacPorts is an easy to use system for compiling, installing, and managing open source software
  cs: MacPorts je snadno použitelný systém pro kompilaci, instalaci a správu open source softwaru
  de: MacPorts ist ein leicht zu verwendendes System zum Kompilieren, Installieren und Verwalten von Open-Source-Software
  es: MacPorts es un sistema fácil de usar para compilar, instalar y gestionar software de código abierto
  fr: MacPorts est un système facile à utiliser pour compiler, installer et gérer des logiciels open source
  id: MacPorts adalah sistem yang mudah digunakan untuk mengompilasi, memasang, dan mengelola perangkat lunak sumber terbuka
  it: MacPorts è un sistema facile da usare per compilare, installare e gestire software open source
  ja: MacPorts はオープンソースソフトウェアをコンパイル・インストール・管理するための易于使うシステムです
  ko: MacPorts는 오픈 소스 소프트웨어를 컴파일, 설치 및 관리하기 위한 사용하기 쉬운 시스템입니다
  pl: MacPorts to łatwy w użyciu system do kompilacji, instalacji i zarządzania oprogramowaniem open source
  pt: MacPorts é um sistema fácil de usar para compilar, instalar e gerenciar software de código aberto
  ro: MacPorts este un sistem ușor de utilizat pentru compilarea, instalarea și gestionarea software-ului open source
  ru: MacPorts — это простая в использовании система для компиляции, установки и управления программным обеспечением с открытым исходным кодом
  th: MacPorts คือระบบที่ใช้งานง่ายสำหรับการคอมไพล์ ติดตั้ง และจัดการซอฟต์แวร์โอเพนซอร์ส
  tr: MacPorts, açık kaynaklı yazılımı derlemek, kurmak ve yönetmek için kullanımı kolay bir sistemdir
  uk: MacPorts — це проста у використанні система для компіляції, встановлення та керування програмним забезпеченням з відкритим кодом
  vi: MacPorts là hệ thống dễ sử dụng để biên dịch, cài đặt và quản lý phần mềm mã nguồn mở
x:
  source: https://github.com/macports/macports-base
  eget: macports/macports-base
rule:
  /eget:
    cmd: x eget macports/macports-base
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: 'curl -O https://distfiles.macports.org/MacPorts/MacPorts-2.8.1.tar.bz2 \

      && tar xf MacPorts-2.8.1.tar.bz2 \

      && cd MacPorts-2.8.1/ \

      && ./configure \

      && make \

      && sudo make install

      '
    reference: https://guide.macports.org/#installing.macports.source
  darwin/git:
    cmd: 'mkdir -p /opt/mports \

      && cd /opt/mports \

      && git clone https://github.com/macports/macports-base.git \

      && cd macports-base \

      && git checkout v2.8.1 \

      && sudo make install

      '
    reference: https://guide.macports.org/#installing.macports.git
binlist:
- macports

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
