  es: Verificador rápido de nuevas versiones de software 🚦 🦀
  fr: Vérificateur rapide des nouvelles versions de logiciels 🚦 🦀
  id: Pemeriksa versi baru perangkat lunak yang cepat 🚦 🦀
  it: Verificatore rapido delle nuove versioni del software 🚦 🦀
  ja: ソフトウェアの新しいバージョンを高速にチェックするツール 🚦 🦀
  ko: 소프트웨어의 새 버전을 빠르게 확인하는 도구 🚦 🦀
  pl: Szybka kontrola nowych wersji oprogramowania 🚦 🦀
  pt: Verificador rápido de novas versões de software 🚦 🦀
  ro: Verificator rapid pentru noi versiuni de software 🚦 🦀
  ru: Быстрая проверка новых версий программ 🚦 🦀
  th: ตัวตรวจสอบเวอร์ชันใหม่ของซอฟต์แวร์ที่รวดเร็ว 🚦 🦀
  tr: Yazılım için yeni sürüm denetleyicisi 🚦 🦀
  uk: Швидка перевірка нових версій програм 🚦 🦀
  vi: Trình kiểm tra phiên bản phần mềm mới nhanh chóng 🚦 🦀
x:
  source: https://github.com/adamperkowski/nvrs
  eget: adamperkowski/nvrs
rule:
  /eget:
    cmd: x eget adamperkowski/nvrs
    reference: https://github.com/adamperkowski/nvrs
binlist:
  - 'nvrs'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 57 KB
          rating: 1
          desc:
            cn: 约 57 KB（估算）
            en: ~57 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
