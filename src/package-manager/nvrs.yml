lang: 'Rust'
homepage: https://github.com/adamperkowski/nvrs
license: 'MIT'
desc:
  cn: 快速的软件发布新版本检查器
  en: '🚦 fast new version checker for software releases 🦀'
x:
  source: https://github.com/adamperkowski/nvrs
  eget: https://github.com/adamperkowski/nvrs
rule:
  /eget:
    cmd: x eget adamperkowski/nvrs
    reference: https://github.com/adamperkowski/nvrs
binlist:
  - 'nvrs'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 57 KB
          rating: 1
          desc:
            cn: 约 57 KB（估算）
            en: ~57 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
