lang: Go
homepage: https://github.com/jsonnet-bundler/jsonnet-bundler
license: Apache-2.0
desc:
  cn: 一个 jsonnet 包管理器
  en: A jsonnet package manager
  cs: Správce balíčků jsonnet
  de: Ein jsonnet-Paketmanager
  es: Un gestor de paquetes de jsonnet
  fr: Un gestionnaire de paquets jsonnet
  id: Manajer paket jsonnet
  it: Un gestore di pacchetti jsonnet
  ja: jsonnet パッケージマネージャー
  ko: jsonnet 패키지 관리자
  pl: Menedżer pakietów jsonnet
  pt: Um gerenciador de pacotes jsonnet
  ro: Un manager de pachete jsonnet
  ru: Менеджер пакетов jsonnet
  th: ตัวจัดการแพ็กเกจ jsonnet
  tr: Bir jsonnet paket yöneticisi
  uk: Менеджер пакетів jsonnet
  vi: Trình quản lý gói jsonnet
x:
  source: https://github.com/jsonnet-bundler/jsonnet-bundler
  eget: jsonnet-bundler/jsonnet-bundler
  brew: jsonnet-bundler
  go: github.com/jsonnet-bundler/jsonnet-bundler/cmd/jb@latest
rule:
  /eget:
    cmd: x eget jsonnet-bundler/jsonnet-bundler
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install jsonnet-bundler
    reference: https://tanka.dev/install#jsonnet-bundler
  arch/yay:
    cmd: yay jsonnet-bundler-bin
    reference: https://tanka.dev/install#jsonnet-bundler
  linux/curl:
    cmd: 'sudo curl -Lo /usr/local/bin/jb https://github.com/jsonnet-bundler/jsonnet-bundler/releases/latest/download/jb-linux-amd64 \

      && sudo chmod a+x /usr/local/bin/jb

      '
    reference: https://tanka.dev/install#jsonnet-bundler
  darwin/curl:
    cmd: 'sudo curl -Lo /usr/local/bin/jb https://github.com/jsonnet-bundler/jsonnet-bundler/releases/latest/download/jb-darwin-amd64 \

      && sudo chmod a+x /usr/local/bin/jb

      '
    reference: https://tanka.dev/install#jsonnet-bundler
  /go:
    cmd: go install github.com/jsonnet-bundler/jsonnet-bundler/cmd/jb@latest
    reference: https://tanka.dev/install#jsonnet-bundler
    dsnap: github.com/jsonnet-bundler/jsonnet-bundler/cmd/jb@latest
binlist:
- jsonnet-bundler

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
