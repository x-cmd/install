lang: zig
homepage: https://github.com/justrach/nanobrew
license: apache-2.0
desc:
  cn: Zig 写的极速 macOS/Linux 包管理器——原生安装 top 100 Homebrew formulae 与 cask（无需 brew/Ruby），warm 安装毫秒级，命令为 nb
  en: A blazing-fast macOS/Linux package manager written in Zig — native install pipeline for the top 100 Homebrew formulae and casks (no brew, no Ruby) with millisecond warm installs; command is nb
x:
  source: https://github.com/justrach/nanobrew
rule:
  /curl:
    cmd: curl -fsSL https://nanobrew.trilok.ai/install | bash
    reference: https://github.com/justrach/nanobrew
  darwin/brew:
    cmd: brew tap justrach/nanobrew https://github.com/justrach/nanobrew && brew install nanobrew
    reference: https://github.com/justrach/nanobrew
binlist:
- nb

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
