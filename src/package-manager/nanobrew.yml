x:
  source: https://github.com/justrach/nanobrew
  brew: justrach/nanobrew/nanobrew
rule:
  /curl:
    cmd: curl -fsSL https://nanobrew.trilok.ai/install | bash
    reference: https://github.com/justrach/nanobrew
  darwin/brew:
    cmd: brew tap justrach/nanobrew https://github.com/justrach/nanobrew && brew install nanobrew
    reference: https://github.com/justrach/nanobrew
binlist:
- nb

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
