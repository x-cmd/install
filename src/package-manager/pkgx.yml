lang: TypeScript
homepage: https://github.com/pkgxdev/pkgx
license: Apache-2.0
desc:
  cn: Pkgx 是一个快速、独立、跨平台的二进制程序，可以运行任何程序
  en: Pkgx is a blazingly fast, standalone, cross‐platform binary that runs anything
  cs: Pkgx je mimořádně rychlý samostatný multiplatformní binární soubor, který spouští cokoliv
  de: Pkgx ist ein blitzschnelles, eigenständiges plattformübergreifendes Binary, das alles ausführt
  es: Pkgx es un binario independiente multiplataforma ultrápido que ejecuta cualquier cosa
  fr: Pkgx est un binaire autonome multiplateforme extrêmement rapide qui exécute n'importe quoi
  id: Pkgx adalah biner mandiri lintas platform yang sangat cepat dan dapat menjalankan apa saja
  it: Pkgx è un binario autonomo multiplaforma velocissimo che esegue qualsiasi cosa
  ja: Pkgx はあらゆるものを実行できる、的高速なスタンドアロン・クロスプラットフォームバイナリです
  ko: Pkgx은 무엇이든 실행할 수 있는 아주 빠른 독립형 크로스 플랫폼 바이너리입니다
  pl: Pkgx to błyskawicznie szybki samodzielny binarny plik wieloplatformowy uruchamiający wszystko
  pt: Pkgx é um binário autônomo multiplataforma extremamente rápido que executa qualquer coisa
  ro: Pkgx este un binar independent multiplatformă extrem de rapid care rulează orice
  ru: Pkgx — сверхбыстрый автономный кроссплатформенный бинарный файл, запускающий что угодно
  th: Pkgx คือไบนารีแบบสแตนด์อโลนข้ามแพลตฟอร์มที่เร็วมากและรันได้ทุกอย่าง
  tr: Pkgx, her şeyi çalıştıran çok hızlı, bağımsız ve çok platformlu bir ikili dosyadır
  uk: Pkgx — надзвичайно швидкий автономний кросплатформний бінарний файл, який запускає будь-що
  vi: Pkgx là một tệp nhị phân độc lập đa nền tảng cực nhanh có thể chạy mọi thứ
x:
  source: https://github.com/pkgxdev/pkgx
  eget: pkgxdev/pkgx
  brew: pkgxdev/made/pkgx
  yay: pkgx
rule:
  /eget:
    cmd: x eget pkgxdev/pkgx
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S pkgx
    reference: https://aur.archlinux.org/packages/pkgx
  (linux|darwin|win|wsl2)/:
    cmd: x pkgx --install
    reference: https://x-cmd.com/mod/pkgx
  /curl:
    cmd: curl -Ssf https://pkgx.sh | sh
    reference: https://pkgx.sh/?via=curl
  darwin/brew:
    cmd: brew install pkgxdev/made/pkgx
    reference: https://pkgx.sh/?via=brew
binlist:
- pkgx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/arm64)
            en: ~4 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
