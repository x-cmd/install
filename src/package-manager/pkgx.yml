lang: TypeScript
homepage: https://github.com/pkgxdev/pkgx
license: Apache-2.0
desc:
  cn: Pkgx 是一个快速、独立、跨平台的二进制程序，可以运行任何程序
  en: Pkgx is a blazingly fast, standalone, cross‐platform binary that runs anything
x:
  source: https://github.com/pkgxdev/pkgx
  eget: https://github.com/pkgxdev/pkgx
  brew: pkgxdev/made/pkgx
rule:
  /eget:
    cmd: x eget pkgxdev/pkgx
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S pkgx
    reference: https://aur.archlinux.org/packages/pkgx
  (linux|darwin|win|wsl2)/:
    cmd: x pkgx --install
    reference: https://x-cmd.com/mod/pkgx
  /curl:
    cmd: curl -Ssf https://pkgx.sh | sh
    reference: https://pkgx.sh/?via=curl
  darwin/brew:
    cmd: brew install pkgxdev/made/pkgx
    reference: https://pkgx.sh/?via=brew
binlist:
- pkgx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/arm64)
            en: ~4 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
