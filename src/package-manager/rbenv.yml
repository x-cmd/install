lang: Shell
homepage: https://github.com/rbenv/rbenv
license: MIT
desc:
  cn: rbenv 是类 Unix 系统上 Ruby 编程语言的版本管理器工具
  en: rbenv is a version manager tool for the Ruby programming language on Unix-like systems
x:
  source: https://github.com/rbenv/rbenv
rule:
  darwin/brew:
    cmd: brew install rbenv
    reference: https://formulae.brew.sh/formula/rbenv
  debian/apt:
    cmd: sudo apt-get install gitapt-get install rbenv
    reference: https://command-not-found.com/rbenv
    dsnap: rbenv
  ubuntu/apt:
    cmd: sudo apt-get install rbenv
    reference: https://command-not-found.com/rbenv
    dsnap: rbenv
  kali/apt:
    cmd: sudo apt-get install rbenv
    reference: https://command-not-found.com/rbenv
    dsnap: rbenv
  raspbian/apt:
    cmd: sudo apt-get install rbenv
    reference: https://command-not-found.com/rbenv
binlist:
- rbenv

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
