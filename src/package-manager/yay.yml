lang: Go
desc:
  en: An AUR Helper written in Go
  cn: 用 Go 写的 AUR 帮助程序
homepage: https://github.com/Jguer/yay
license: GPL-3.0
x:
  source: https://github.com/Jguer/yay
  eget: https://github.com/Jguer/yay
rule:
  /eget:
    cmd: x eget Jguer/yay
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use yay
    reference: https://github.com/aaaaninja/asdf-yay
  arch/pacman:
    cmd: 'sudo pacman -S --needed git base-devel \

      && git clone https://aur.archlinux.org/yay.git \

      && cd yay \

      && makepkg -si

      '
    reference: https://github.com/Jguer/yay#source
  arch/yay:
    cmd: yay -S yay
    reference: https://aur.archlinux.org/packages/yay
binlist:
- yay
