lang: Go
desc:
  en: An AUR Helper written in Go
  cn: 用 Go 写的 AUR 帮助程序
homepage: https://github.com/Jguer/yay
license: GPL-3.0
x:
  source: https://github.com/Jguer/yay
  eget: Jguer/yay
  makepkg: makepkg
  yay: yay
  asdf: yay
rule:
  /eget:
    cmd: x eget Jguer/yay
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use yay
    reference: https://github.com/aaaaninja/asdf-yay
  arch/pacman:
    cmd: 'sudo pacman -S --needed git base-devel \

      && git clone https://aur.archlinux.org/yay.git \

      && cd yay \

      && makepkg -si

      '
    reference: https://github.com/Jguer/yay#source
  arch/yay:
    cmd: yay -S yay
    reference: https://aur.archlinux.org/packages/yay
binlist:
- yay

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (macos/x64)
            en: ~5 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
