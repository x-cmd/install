lang: Ruby
homepage: https://github.com/Homebrew/brew
license: BSD-2-Clause
desc:
  cn: MacOS (或 Linux)缺少的包管理器
  en: The missing package manager for macOS (or Linux)
x:
  source: https://github.com/Homebrew/brew
rule:
  /curl:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    reference: https://brew.sh/
  ubuntu/apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  debian//apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  kali//apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  raspbian/apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  arch/yay:
    cmd: yay -S brew-git
    reference: https://aur.archlinux.org/packages/brew-git
binlist:
- brew

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 536 KB
          rating: 1
          desc:
            cn: 约 536 KB（估算）
            en: ~536 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
