lang: Ruby
homepage: https://github.com/Homebrew/brew
license: BSD-2-Clause
desc:
  cn: MacOS (或 Linux)缺少的包管理器
  en: The missing package manager for macOS (or Linux)
x:
  source: https://github.com/Homebrew/brew
rule:
  /curl:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    reference: https://brew.sh/
  ubuntu/apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  debian//apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  kali//apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  raspbian/apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  arch/yay:
    cmd: yay -S brew-git
    reference: https://aur.archlinux.org/packages/brew-git
binlist:
- brew

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 1
          desc:
            cn: 安装 10 MB
            en: 10 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
