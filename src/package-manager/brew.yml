lang: Ruby
homepage: https://github.com/Homebrew/brew
license: BSD-2-Clause
desc:
  cn: MacOS (或 Linux)缺少的包管理器
  en: The missing package manager for macOS (or Linux)
  cs: Chybějící správce balíčků pro macOS (nebo Linux)
  de: Der fehlende Paketmanager für macOS (oder Linux)
  es: El gestor de paquetes que falta para macOS (o Linux)
  fr: Le gestionnaire de paquets qui manque à macOS (ou Linux)
  id: Pengelola paket yang hilang untuk macOS (atau Linux)
  it: Il gestore di pacchetti mancante per macOS (o Linux)
  ja: macOS（または Linux）に欠けているパッケージマネージャー
  ko: macOS(또는 Linux)에 꼭 필요한 패키지 관리자
  pl: Brakujący menedżer pakietów dla macOS (lub Linux)
  pt: O gerenciador de pacotes que falta no macOS (ou Linux)
  ro: Managerul de pachete care lipsește pentru macOS (sau Linux)
  ru: Недостающий менеджер пакетов для macOS (или Linux)
  th: ตัวจัดการแพ็กเกจที่ macOS (หรือ Linux) ขาดไป
  tr: macOS (veya Linux) için eksik paket yöneticisi
  uk: Менеджер пакетів, якого бракує для macOS (або Linux)
  vi: Trình quản lý gói còn thiếu cho macOS (hoặc Linux)
x:
  source: https://github.com/Homebrew/brew
  apt: linuxbrew-wrapper
  apt-get: linuxbrew-wrapper
  yay: brew-git
rule:
  /curl:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    reference: https://brew.sh/
  ubuntu/apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  debian//apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  kali//apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  raspbian/apt:
    cmd: sudo apt-get install linuxbrew-wrapper
    reference: https://command-not-found.com/brew
  arch/yay:
    cmd: yay -S brew-git
    reference: https://aur.archlinux.org/packages/brew-git
binlist:
- brew

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: none
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 536 KB
          rating: 1
          desc:
            cn: 约 536 KB（估算）
            en: ~536 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
