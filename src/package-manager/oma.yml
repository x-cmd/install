lang: Rust
homepage: https://github.com/aosc-dev/oma
license: GPL-3.0
desc:
  cn: oma (Oh My Ailurus) 是 liBapt-pkg 的包管理器前端
  en: oma (Oh My Ailurus) is a package manager frontend for libapt-pkg
x:
  source: https://github.com/aosc-dev/oma
  eget: https://github.com/aosc-dev/oma
rule:
  /eget:
    cmd: x eget aosc-dev/oma
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sSf https://repo.aosc.io/get-oma.sh | sh
    reference: https://github.com/aosc-dev/oma
  ubuntu/apt:
    cmd: sudo apt install oma
    reference: https://github.com/aosc-dev/oma
    dsnap: oma
  debian/apt:
    cmd: sudo apt install oma
    reference: https://github.com/aosc-dev/oma
    dsnap: oma
  kali/apt:
    cmd: sudo apt install oma
    reference: https://github.com/aosc-dev/oma
    dsnap: oma
binlist:
- oma

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
