lang: Rust
homepage: https://github.com/aosc-dev/oma
license: GPL-3.0
desc:
  cn: oma (Oh My Ailurus) 是 liBapt-pkg 的包管理器前端
  en: oma (Oh My Ailurus) is a package manager frontend for libapt-pkg
x:
  source: https://github.com/aosc-dev/oma
  eget: https://github.com/aosc-dev/oma
rule:
  /eget:
    cmd: x eget aosc-dev/oma
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sSf https://repo.aosc.io/get-oma.sh | sh
    reference: https://github.com/aosc-dev/oma
  ubuntu/apt:
    cmd: sudo apt install oma
    reference: https://github.com/aosc-dev/oma
    dsnap: oma
  debian/apt:
    cmd: sudo apt install oma
    reference: https://github.com/aosc-dev/oma
    dsnap: oma
  kali/apt:
    cmd: sudo apt install oma
    reference: https://github.com/aosc-dev/oma
    dsnap: oma
binlist:
- oma
