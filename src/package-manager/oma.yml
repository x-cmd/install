lang: Rust
homepage: https://github.com/aosc-dev/oma
license: GPL-3.0
desc:
  cn: oma (Oh My Ailurus) 是 liBapt-pkg 的包管理器前端
  en: oma (Oh My Ailurus) is a package manager frontend for libapt-pkg
  cs: oma (Oh My Ailurus) je frontend správce balíčků pro libapt-pkg
  de: oma (Oh My Ailurus) ist ein Frontend für den Paketmanager libapt-pkg
  es: oma (Oh My Ailurus) es una interfaz para el gestor de paquetes libapt-pkg
  fr: oma (Oh My Ailurus) est une interface pour le gestionnaire de paquets libapt-pkg
  id: oma (Oh My Ailurus) adalah antarmuka untuk pengelola paket libapt-pkg
  it: oma (Oh My Ailurus) è un frontend per il gestore di pacchetti libapt-pkg
  ja: oma (Oh My Ailurus) は libapt-pkg のパッケージマネージャフロントエンドです
  ko: oma (Oh My Ailurus)는 libapt-pkg의 패키지 관리자 프론트엔드입니다
  pl: oma (Oh My Ailurus) to frontend menedżera pakietów libapt-pkg
  pt: oma (Oh My Ailurus) é um frontend para o gerenciador de pacotes libapt-pkg
  ro: oma (Oh My Ailurus) este un frontend pentru managerul de pachete libapt-pkg
  ru: oma (Oh My Ailurus) — это фронтенд для менеджера пакетов libapt-pkg
  th: oma (Oh My Ailurus) เป็นส่วนหน้าสำหรับตัวจัดการแพ็กเกจ libapt-pkg
  tr: oma (Oh My Ailurus), libapt-pkg paket yöneticisi için bir ön uçtır
  uk: oma (Oh My Ailurus) — це фронтенд для менеджера пакетів libapt-pkg
  vi: oma (Oh My Ailurus) là giao diện cho trình quản lý gói libapt-pkg
x:
  source: https://github.com/aosc-dev/oma
  eget: aosc-dev/oma
  apt: oma
rule:
  /eget:
    cmd: x eget aosc-dev/oma
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sSf https://repo.aosc.io/get-oma.sh | sh
    reference: https://github.com/aosc-dev/oma
  ubuntu/apt:
    cmd: sudo apt install oma
    reference: https://github.com/aosc-dev/oma
    dsnap: oma
  debian/apt:
    cmd: sudo apt install oma
    reference: https://github.com/aosc-dev/oma
    dsnap: oma
  kali/apt:
    cmd: sudo apt install oma
    reference: https://github.com/aosc-dev/oma
    dsnap: oma
binlist:
- oma

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
