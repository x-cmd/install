lang: Lua
homepage: https://github.com/luarocks/luarocks
license: MIT
desc:
  cn: LuaRocks 是 Lua 模块的包管理器
  en: LuaRocks is the package manager for Lua modules
x:
  pkg:
    exist: true
  source: https://github.com/luarocks/luarocks
rule:
  /x:
    cmd: x pkg use luarocks
    reference: https://x-cmd.com/install/
  debian/make:
    cmd: 'sudo apt install build-essential libreadline-dev unzip && \

      curl -R -O http://www.lua.org/ftp/lua-5.3.5.tar.gz && \

      tar -zxf lua-5.3.5.tar.gz && \

      cd lua-5.3.5 && \

      make linux test && \

      sudo make install

      '
    reference: https://github.com/luarocks/luarocks/wiki/Installation-instructions-for-Unix#1ubuntudebian-user
  ubuntu/make:
    cmd: 'sudo apt install build-essential libreadline-dev unzip && \

      curl -R -O http://www.lua.org/ftp/lua-5.3.5.tar.gz && \

      tar -zxf lua-5.3.5.tar.gz && \

      cd lua-5.3.5 && \

      make linux test && \

      sudo make install

      '
    reference: https://github.com/luarocks/luarocks/wiki/Installation-instructions-for-Unix#1ubuntudebian-user
  kali/make:
    cmd: 'sudo apt install build-essential libreadline-dev unzip && \

      curl -R -O http://www.lua.org/ftp/lua-5.3.5.tar.gz && \

      tar -zxf lua-5.3.5.tar.gz && \

      cd lua-5.3.5 && \

      make linux test && \

      sudo make install

      '
    reference: https://github.com/luarocks/luarocks/wiki/Installation-instructions-for-Unix#1ubuntudebian-user
  fedora/make:
    cmd: 'sudo yum install libtermcap-devel ncurses-devel libevent-devel readline-devel && \

      curl -R -O http://www.lua.org/ftp/lua-5.3.5.tar.gz && \

      tar -zxf lua-5.3.5.tar.gz && \

      cd lua-5.3.5 && \

      make linux test && \

      sudo make install

      '
    reference: https://github.com/luarocks/luarocks/wiki/Installation-instructions-for-Unix#2-yum-based-distributions
  centos/make:
    cmd: 'sudo yum install libtermcap-devel ncurses-devel libevent-devel readline-devel && \

      curl -R -O http://www.lua.org/ftp/lua-5.3.5.tar.gz && \

      tar -zxf lua-5.3.5.tar.gz && \

      cd lua-5.3.5 && \

      make linux test && \

      sudo make install

      '
    reference: https://github.com/luarocks/luarocks/wiki/Installation-instructions-for-Unix#2-yum-based-distributions
  rhel/make:
    cmd: 'sudo yum install libtermcap-devel ncurses-devel libevent-devel readline-devel && \

      curl -R -O http://www.lua.org/ftp/lua-5.3.5.tar.gz && \

      tar -zxf lua-5.3.5.tar.gz && \

      cd lua-5.3.5 && \

      make linux test && \

      sudo make install

      '
    reference: https://github.com/luarocks/luarocks/wiki/Installation-instructions-for-Unix#2-yum-based-distributions
  darwin/brew:
    cmd: brew install luarocks
    reference: https://formulae.brew.sh/formula/luarocks#default
  (win|wsl2)/scoop:
    cmd: x scoop bucket add main && x scoop install main/luarocks
    reference: https://scoop.sh/#/apps?q=luarocks
  (win|wsl2)/choco:
    cmd: x choco install luarocks
    reference: https://community.chocolatey.org/packages/luarocks
  darwin/port:
    cmd: sudo port install lua-luarocks
    reference: https://ports.macports.org/port/lua-luarocks/
  debian/apt:
    cmd: sudo apt-get install luarocks
    reference: https://command-not-found.com/luarocks
    dsnap: luarocks
  ubuntu/apt:
    cmd: sudo apt-get install luarocks
    reference: https://command-not-found.com/luarocks
    dsnap: luarocks
  alpine/apk:
    cmd: sudo apk add luarocks
    reference: https://command-not-found.com/luarocks
  arch/pacman:
    cmd: sudo pacman -S luarocks
    reference: https://command-not-found.com/luarocks
  kali/apt:
    cmd: sudo apt-get install luarocks
    reference: https://command-not-found.com/luarocks
    dsnap: luarocks
  fedora/dnf:
    cmd: sudo dnf install luarocks
    reference: https://command-not-found.com/luarocks
  raspbian/apt:
    cmd: sudo apt-get install luarocks
    reference: https://command-not-found.com/luarocks
binlist:
- luarocks
