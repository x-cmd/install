lang: Gherkin/shell/Groovy
homepage: https://github.com/sdkman/sdkman-cli
license: Apache-2.0
desc:
  cn: SDKMAN 是在任何基于 Unix 的系统上管理多个软件开发工具包的并行版本的工具
  en: SDKMAN is a tool for managing parallel Versions of multiple Software Development Kits on any Unix based system
x:
  source: https://github.com/sdkman/sdkman-cli
  eget: https://github.com/sdkman/sdkman-cli
rule:
  /eget:
    cmd: x eget sdkman/sdkman-cli
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -s "https://get.sdkman.io" | bash
    reference: https://github.com/sdkman/sdkman-cli
binlist:
- sdkman

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
