lang: Nim
homepage: https://github.com/zqqw/pakku
license: GPL-3.0
desc:
  en: A pacman wrapper with additional features, such as AUR support
  cn: 一个带有额外功能的 pacman 包装器，例如 AUR 支持
  cs: Wrapper pro pacman s dalšími funkcemi, jako je podpora AUR
  de: Ein Wrapper für pacman mit zusätzlichen Funktionen, etwa AUR-Unterstützung
  es: Un envoltorio de pacman con funciones adicionales, como el soporte de AUR
  fr: Un wrapper de pacman avec des fonctionnalités supplémentaires, comme la prise en charge de l'AUR
  id: Pembungkus pacman dengan fitur tambahan, seperti dukungan AUR
  it: Un wrapper di pacman con funzionalità aggiuntive, come il supporto AUR
  ja: AUR サポートなどの追加機能を備えた pacman のラッパーです
  ko: AUR 지원과 같은 추가 기능을 갖춘 pacman 래퍼
  pl: Opakowanie pacman z dodatkowymi funkcjami, takimi jak obsługa AUR
  pt: Um wrapper do pacman com recursos adicionais, como suporte ao AUR
  ro: Un wrapper pentru pacman cu funcții suplimentare, precum suportul AUR
  ru: Обёртка pacman с дополнительными возможностями, например поддержкой AUR
  th: ตัวห่อหุ้ม pacman ที่มีความสามารถเพิ่มเติม เช่น การรองรับ AUR
  tr: AUR desteği gibi ek özelliklere sahip bir pacman sarmalayıcısı
  uk: Обгортка pacman з додатковими можливостями, наприклад підтримкою AUR
  vi: Trình bọc pacman với các tính năng bổ sung, như hỗ trợ AUR
x:
  source: https://github.com/zqqw/pakku
  pacman: git
  makepkg: makepkg
  yay: pakku
rule:
  arch/pacman:
    cmd: 'sudo pacman -S git base-devel \

      && git clone https://aur.archlinux.org/pakku.git \

      && cd pakku \

      && makepkg -si

      '
    reference: https://zhuanlan.zhihu.com/p/114904008
  arch/yay:
    cmd: yay -S pakku
    reference: https://aur.archlinux.org/packages/pakku
binlist:
- pakku

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 119 KB
          rating: 1
          desc:
            cn: 约 119 KB（估算）
            en: ~119 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
