lang: Nim
homepage: https://github.com/zqqw/pakku
license: GPL-3.0
desc:
  en: A pacman wrapper with additional features, such as AUR support
  cn: 一个带有额外功能的 pacman 包装器，例如 AUR 支持
x:
  source: https://github.com/zqqw/pakku
rule:
  arch/pacman:
    cmd: 'sudo pacman -S git base-devel \

      && git clone https://aur.archlinux.org/pakku.git \

      && cd pakku \

      && makepkg -si

      '
    reference: https://zhuanlan.zhihu.com/p/114904008
  arch/yay:
    cmd: yay -S pakku
    reference: https://aur.archlinux.org/packages/pakku
binlist:
- pakku

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
