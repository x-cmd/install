lang: Rust
homepage: https://github.com/quantbagel/gust
license: Apache-2.0
desc:
  cn: 一个用 Rust 编写的极速 Swift 包和项目管理器。
  en: An extremely fast Swift package and project manager, written in Rust.
  cs: Velmi rychlý správce balíčků a projektů Swift, napsaný v Rustu.
  de: Ein äußerst schneller Swift-Paket- und Projektmanager, geschrieben in Rust.
  es: Un gestor de paquetes y proyectos de Swift extremadamente rápido, escrito en Rust.
  fr: Un gestionnaire de paquets et de projets Swift extrêmement rapide, écrit en Rust.
  id: Manajer paket dan proyek Swift yang sangat cepat, ditulis dengan Rust.
  it: Un gestore di pacchetti e progetti Swift estremamente veloce, scritto in Rust.
  ja: Rust で書かれた超高速な Swift パッケージおよびプロジェクトマネージャー。
  ko: Rust로 작성된 매우 빠른 Swift 패키지 및 프로젝트 관리자.
  pl: Wyjątkowo szybki menedżer pakietów i projektów Swift, napisany w Rust.
  pt: Um gerenciador de pacotes e projetos Swift extremamente rápido, escrito em Rust.
  ro: Un manager de pachete și proiecte Swift extrem de rapid, scris în Rust.
  ru: Очень быстрый менеджер пакетов и проектов Swift, написанный на Rust.
  th: ตัวจัดการแพ็กเกจและโปรเจกต์ Swift ที่รวดเร็วมาก เขียนด้วย Rust
  tr: Rust ile yazılmış, son derece hızlı bir Swift paket ve proje yöneticisi.
  uk: Надзвичайно швидкий менеджер пакетів і проєктів Swift, написаний на Rust.
  vi: Trình quản lý gói và dự án Swift cực kỳ nhanh, viết bằng Rust.
x:
  source: https://github.com/quantbagel/gust
  eget: quantbagel/gust
  brew: quantbagel/tap/gust
  cargo: gust
rule:
  /eget:
    cmd: x eget quantbagel/gust
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL quantbagel.vercel.app/gust/install.sh | sh
    reference: https://github.com/quantbagel/gust/blob/main/docs/installation.md#quick-install-macoslinux
  darwin/brew:
    cmd: 'brew tap quantbagel/tap &&

      brew install gust

      '
    reference: https://github.com/quantbagel/gust/blob/main/docs/installation.md#homebrew
  /cargo:
    cmd: cargo install gust
    reference: https://github.com/quantbagel/gust/blob/main/docs/installation.md#cargo
binlist:
- gust

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
