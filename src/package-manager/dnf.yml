lang: Python
homepage: https://github.com/rpm-software-management/dnf
license: GPL-2.0
desc:
  cn: Dandied YUM (DNF)是 YUM 的下一个主要版本
  en: Dandified YUM (DNF) is the next upcoming major version of YUM
x:
  source: https://github.com/rpm-software-management/dnf
  eget: https://github.com/rpm-software-management/dnf
  dnf: dnf
  yum: dnf
rule:
  /eget:
    cmd: x eget rpm-software-management/dnf
    reference: https://x-cmd.com/mod/eget
  centos/yum:
    cmd: sudo yum install dnf
    reference: https://command-not-found.com/dnf
  fedora/dnf:
    cmd: sudo dnf install dnf
    reference: https://command-not-found.com/dnf
    dsnap: dnf
binlist:
- dnf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 80 KB
          rating: 1
          desc:
            cn: 约 80 KB（估算）
            en: ~80 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
