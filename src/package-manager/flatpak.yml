lang: C
homepage: https://github.com/flatpak/flatpak
license: LGPL-2.1
desc:
  cn: Flatpak 是一个用于在 Linux 上构建、分发和运行沙箱桌面应用程序的系统
  en: Flatpak is a system for building, distributing, and running sandboxed desktop applications on Linux
  cs: Flatpak je systém pro sestavování, distribuci a spouštění sandboxovaných desktopových aplikací v Linuxu
  de: Flatpak ist ein System zum Erstellen, Verteilen und Ausführen von sandboxierten Desktop-Anwendungen unter Linux
  es: Flatpak es un sistema para compilar, distribuir y ejecutar aplicaciones de escritorio aisladas en Linux
  fr: Flatpak est un système pour construire, distribuer et exécuter des applications de bureau isolées sous Linux
  id: Flatpak adalah sistem untuk membangun, mendistribusikan, dan menjalankan aplikasi desktop terisolasi di Linux
  it: Flatpak è un sistema per costruire, distribuire ed eseguire applicazioni desktop isolate su Linux
  ja: Flatpak は Linux 上でサンドボックス化されたデスクトップアプリケーションを構築・配布・実行するためのシステムです
  ko: Flatpak은(는) Linux에서 샌드박스된 데스크톱 애플리케이션을 빌드, 배포, 실행하기 위한 시스템입니다
  pl: Flatpak to system do budowania, dystrybucji i uruchamiania aplikacji desktopowych w piaskownicy na Linuksie
  pt: Flatpak é um sistema para compilar, distribuir e executar aplicações de desktop em sandbox no Linux
  ro: Flatpak este un sistem pentru compilarea, distribuirea și rularea aplicațiilor desktop izolate în sandbox pe Linux
  ru: Flatpak — это система для сборки, распространения и запуска изолированных настольных приложений в Linux
  th: Flatpak คือระบบสำหรับสร้าง แจกจ่าย และเรียกใช้แอปพลิเคชันเดสก์ท็อปแบบแซนด์บ็อกซ์บน Linux
  tr: Flatpak, Linux üzerinde sandbox içinde çalışan masaüstü uygulamaları oluşturmak, dağıtmak ve çalıştırmak için bir sistemdir
  uk: Flatpak — це система для збирання, розповсюдження та запуску ізольованих настільних застосунків у Linux
  vi: Flatpak là hệ thống để xây dựng, phân phối và chạy các ứng dụng máy tính trong sandbox trên Linux
x:
  source: https://github.com/flatpak/flatpak
  eget: flatpak/flatpak
  apt: flatpak
  dnf: flatpak
  pacman: flatpak
  apt-get: apt
  yum: flatpak
  zypper: flatpak
  emerge: sys-apps/flatpak
rule:
  /eget:
    cmd: x eget flatpak/flatpak
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt install flatpak
    reference: https://flatpak.org/setup/Debian
    dsnap: flatpak
  ubuntu/apt:
    cmd: sudo apt install flatpak
    reference: https://flatpak.org/setup/Ubuntu
    dsnap: flatpak
  chrome/apt:
    cmd: sudo apt install flatpak
    reference: https://flatpak.org/setup/Chrome%20OS
  rhel/yum:
    cmd: sudo yum install flatpak
    reference: https://flatpak.org/setup/Red%20Hat%20Enterprise%20Linux
  opensuse/zypper:
    cmd: sudo zypper install flatpak
    reference: https://flatpak.org/setup/openSUSE
  arch/pacman:
    cmd: sudo pacman -S flatpak
    reference: https://flatpak.org/setup/Arch
  rocky/dnf:
    cmd: sudo dnf install flatpak
    reference: https://flatpak.org/setup/Rocky%20Linux
  gentoo/emerge:
    cmd: 'echo -e ''sys-apps/flatpak ~amd64\nacct-user/flatpak ~amd64\nacct-group/flatpak ~amd64\ndev-util/ostree ~amd64'' >> /etc/portage/package.accept_keywords/flatpak \

      && sudo emerge sys-apps/flatpak

      '
    reference: https://flatpak.org/setup/Gentoo
  kali/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
    dsnap: apt
  raspbian/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
binlist:
- flatpak

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.1 MB
          rating: 1
          desc:
            cn: 约 5.1 MB（估算）
            en: ~5.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
