lang: JavaScript
homepage: https://github.com/pnpm/pnpm
license: MIT
desc:
  cn: 快速、节省磁盘空间的包管理器
  en: Fast, disk space efficient package manager
  cs: Rychlý správce balíčků šetrný na diskové místo
  de: Schneller, platzsparender Paketmanager
  es: Gestor de paquetes rápido y eficiente en espacio de disco
  fr: Gestionnaire de paquets rapide et économe en espace disque
  id: Pengelola paket cepat dan hemat ruang disk
  it: Gestore di pacchetti veloce ed efficiente in termini di spazio su disco
  ja: 高速でディスク容量を節約するパッケージマネージャー
  ko: 빠르고 디스크 공간을 효율적으로 사용하는 패키지 관리자
  pl: Szybki menedżer pakietów oszczędzający miejsce na dysku
  pt: Gerenciador de pacotes rápido e eficiente em espaço em disco
  ro: Manager de pachete rapid și eficient în privința spațiului pe disc
  ru: Быстрый менеджер пакетов, экономно расходующий дисковое пространство
  th: ตัวจัดการแพ็กเกจที่เร็วและประหยัดพื้นที่ดิสก์
  tr: Hızlı ve disk alanından tasarruf sağlayan paket yöneticisi
  uk: Швидкий менеджер пакетів, що заощаджує дисковий простір
  vi: Trình quản lý gói nhanh và tiết kiệm dung lượng đĩa
x:
  source: https://github.com/pnpm/pnpm
  eget: pnpm/pnpm
  brew: pnpm
  scoop: nodejs-lts
  choco: pnpm
  winget: pnpm
  npm: pnpm
  asdf: pnpm
rule:
  /eget:
    cmd: x eget pnpm/pnpm
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use pnpm
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use pnpm
    reference: https://github.com/jonathanmorley/asdf-pnpm
  win/powershell:
    cmd: x pwsh iwr https://get.pnpm.io/install.ps1 -useb | iex
    reference: https://pnpm.io/installation#on-windows
  /curl:
    cmd: curl -fsSL https://get.pnpm.io/install.sh | sh -
    reference: https://pnpm.io/installation#on-posix-systems
  /wget:
    cmd: wget -qO- https://get.pnpm.io/install.sh | sh -
    reference: https://pnpm.io/installation#on-posix-systems
  alpine/wget:
    cmd: wget -qO- https://get.pnpm.io/install.sh | ENV="$HOME/.shrc" SHELL="$(which sh)" sh -
    reference: https://pnpm.io/installation#on-alpine-linux
  darwin/brew:
    cmd: brew install pnpm
    reference: https://pnpm.io/installation#using-homebrew
  /npm:
    cmd: npm install -g pnpm
    reference: https://pnpm.io/installation#using-npm
    dsnap: pnpm
  (win|wsl2)/scoop:
    cmd: x scoop install nodejs-lts pnpm
    reference: https://pnpm.io/installation#using-scoop
  (win|wsl2)/choco:
    cmd: x choco install pnpm
    reference: https://pnpm.io/installation#using-choco
  (win|wsl2)/winget:
    cmd: x winget install pnpm
    reference: https://pnpm.io/installation#using-winget
  /volta:
    cmd: volta install pnpm
    reference: https://pnpm.io/installation#using-volta
binlist:
- pnpm

# already profiled
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 48 MB
          rating: 2
          desc:
            cn: 安装 48 MB
            en: 48 MB install
        download:
          estimate: 19 MB
          desc:
            cn: 约 19 MB 下载 (linux/x64)
            en: ~19 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
