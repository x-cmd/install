lang: Go
homepage: https://github.com/moson-mo/pacseek
license: MIT
desc:
  cn: 用于搜索和安装 Arch Linux 软件包的 TUI。
  en: A TUI for searching and installing Arch Linux packages.
x:
  source: https://github.com/moson-mo/pacseek
rule:
  arch/manjaro:
    cmd: pacman -S pacseek
    reference: https://github.com/moson-mo/pacseek#how-to-build--run--install
  arch/yay:
    cmd: yay -S pacseek
    reference: https://aur.archlinux.org/packages/pacseek
  /eget:
    cmd: eget moson-mo/pacseek
    reference: https://github.com/moson-mo/pacseek#how-to-build--run--install
binlist:
- pacseek

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
