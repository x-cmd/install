lang: Go
homepage: https://github.com/moson-mo/pacseek
license: MIT
desc:
  cn: 用于搜索和安装 Arch Linux 软件包的 TUI。
  en: A TUI for searching and installing Arch Linux packages.
x:
  source: https://github.com/moson-mo/pacseek
  pacman: pacseek
  yay: pacseek
rule:
  arch/manjaro:
    cmd: pacman -S pacseek
    reference: https://github.com/moson-mo/pacseek#how-to-build--run--install
  arch/yay:
    cmd: yay -S pacseek
    reference: https://aur.archlinux.org/packages/pacseek
  /eget:
    cmd: eget moson-mo/pacseek
    reference: https://github.com/moson-mo/pacseek#how-to-build--run--install
binlist:
- pacseek

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
