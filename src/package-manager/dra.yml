lang: Rust
homepage: https://github.com/devmatteini/dra
license: MIT
desc:
  cn: 用于从 GitHub 下载 release 资源的命令行工具。
  en: A command line tool to download release assets from GitHub.
  cs: Nástroj příkazové řádky pro stahování release aktiv z GitHubu.
  de: Ein Kommandozeilenwerkzeug zum Herunterladen von Release-Assets von GitHub.
  es: Una herramienta de línea de comandos para descargar assets de las releases de GitHub.
  fr: Un outil en ligne de commande pour télécharger les fichiers de release depuis GitHub.
  id: Alat baris perintah untuk mengunduh aset rilis dari GitHub.
  it: Uno strumento da riga di comando per scaricare gli asset delle release da GitHub.
  ja: GitHub のリリース資産をダウンロードするコマンドラインツール。
  ko: GitHub 릴리스 에셋을 다운로드하기 위한 명령줄 도구.
  pl: Narzędzie wiersza poleceń do pobierania zasobów wydań z GitHuba.
  pt: Uma ferramenta de linha de comando para baixar os assets das releases do GitHub.
  ro: Un instrument de linie de comandă pentru descărcarea activelor de versiune din GitHub.
  ru: Инструмент командной строки для загрузки файлов релизов из GitHub.
  th: เครื่องมือบรรทัดคำสั่งสำหรับดาวน์โหลดไฟล์รีลีสจาก GitHub
  tr: GitHub'daki sürüm varlıklarını indirmek için bir komut satırı aracı.
  uk: Інструмент командного рядка для завантаження файлів релізів з GitHub.
  vi: Công cụ dòng lệnh để tải các tài nguyên bản phát hành từ GitHub.
x:
  source: https://github.com/devmatteini/dra
  brew: dra
  pacman: dra
rule:
  arch/pacman:
    cmd: pacman -S dra
    reference: https://github.com/devmatteini/dra#installation
  /brew:
    cmd: brew install dra
    reference: https://github.com/devmatteini/dra#installation
  /eget:
    cmd: eget devmatteini/dra
    reference: https://github.com/devmatteini/dra#installation
binlist:
- dra

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
