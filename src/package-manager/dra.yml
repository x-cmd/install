lang: Rust
homepage: https://github.com/devmatteini/dra
license: MIT
desc:
  cn: 用于从 GitHub 下载 release 资源的命令行工具。
  en: A command line tool to download release assets from GitHub.
x:
  source: https://github.com/devmatteini/dra
rule:
  arch/pacman:
    cmd: pacman -S dra
    reference: https://github.com/devmatteini/dra#installation
  /brew:
    cmd: brew install dra
    reference: https://github.com/devmatteini/dra#installation
  /eget:
    cmd: eget devmatteini/dra
    reference: https://github.com/devmatteini/dra#installation
binlist:
- dra

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
