lang: Rust
homepage: https://github.com/devmatteini/dra
license: MIT
desc:
  cn: 用于从 GitHub 下载 release 资源的命令行工具。
  en: A command line tool to download release assets from GitHub.
x:
  source: https://github.com/devmatteini/dra
rule:
  arch/pacman:
    cmd: pacman -S dra
    reference: https://github.com/devmatteini/dra#installation
  /brew:
    cmd: brew install dra
    reference: https://github.com/devmatteini/dra#installation
  /eget:
    cmd: eget devmatteini/dra
    reference: https://github.com/devmatteini/dra#installation
binlist:
- dra

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 146 KB
          rating: 1
          desc:
            cn: 约 146 KB（估算）
            en: ~146 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
