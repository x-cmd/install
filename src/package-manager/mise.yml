lang: Rust
homepage: https://github.com/jdx/mise
license: MIT
desc:
  cn: mise (mise-en-place) 是一种开发环境设置工具，类似于 asdf，能用于安装和管理开发工具/运行时（如 Node、Python 或 terraform）、管理环境变量和项目任务。
  en: Mise (mise-en-place) is a development environment setup tool similar to asdf, used for installing and managing development tools/runtimes (such as Node, Python, or Terraform), managing environment variables, and handling project tasks.
x:
  source: https://github.com/jdx/mise
  eget: https://github.com/jdx/mise
rule:
  /eget:
    cmd: x eget jdx/mise
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl https://mise.run | sh
    reference: https://mise.jdx.dev/installing-mise.html
  /cargo:
    cmd: cargo install mise
    reference: https://mise.jdx.dev/installing-mise.html
    dsnap: mise
  /npm:
    cmd: npm install -g @jdxcode/mise
    reference: https://mise.jdx.dev/installing-mise.html
  fedora/dnf:
    cmd: 'dnf install -y dnf-plugins-core

      dnf config-manager --add-repo https://mise.jdx.dev/rpm/mise.repo

      dnf install -y mise

      '
    reference: https://mise.jdx.dev/installing-mise.html
  darwin/brew:
    cmd: brew install mise
    reference: https://mise.jdx.dev/installing-mise.html
  alpine/apk:
    cmd: apk add mise
    reference: https://mise.jdx.dev/installing-mise.html
  ubuntu/apt:
    cmd: sudo apt install -y mise
    reference: https://mise.jdx.dev/installing-mise.html
  (win|wsl2)/choco:
    cmd: choco install mise
    reference: https://mise.jdx.dev/installing-mise.html
  (win|wsl2)/winget:
    cmd: winget install jdx.mise
    reference: https://mise.jdx.dev/installing-mise.html
  (win|wsl2)/scoop:
    cmd: scoop install mise
    reference: https://mise.jdx.dev/installing-mise.html
binlist:
- mise

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
