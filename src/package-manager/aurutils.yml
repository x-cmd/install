lang: Shell
homepage: https://aur.archlinux.org/packages/aurutils
desc:
  en: Helper tools for the AUR
  cn: AUR 的辅助工具
  cs: Pomocné nástroje pro AUR
  de: Hilfswerkzeuge für das AUR
  es: Herramientas auxiliares para el AUR
  fr: Outils utilitaires pour l'AUR
  id: Alat bantu untuk AUR
  it: Strumenti ausiliari per l'AUR
  ja: AUR 用のヘルツール
  ko: AUR용 도우미 도구
  pl: Narzędzia pomocnicze dla AUR
  pt: Ferramentas auxiliares para a AUR
  ro: Instrumente auxiliare pentru AUR
  ru: Вспомогательные инструменты для AUR
  th: เครื่องมือช่วยสำหรับ AUR
  tr: AUR için yardımcı araçlar
  uk: Допоміжні інструменти для AUR
  vi: Các công cụ trợ giúp cho AUR
rule:
  arch/pacman:
    cmd: 'git clone https://aur.archlinux.org/aurutils.git

      cd aurutils

      makepkg -si

      '
    reference: https://aur.archlinux.org/packages/aurutils
  arch/yay:
    cmd: yay -S aurutils
    reference: https://aur.archlinux.org/packages/aurutils

x:
  makepkg: makepkg
  yay: aurutils
binlist:
- aurutils
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
