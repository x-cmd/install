lang: Shell
homepage: https://aur.archlinux.org/packages/aurutils
desc:
  en: Helper tools for the AUR
  cn: AUR 的辅助工具
rule:
  arch/pacman:
    cmd: 'git clone https://aur.archlinux.org/aurutils.git

      cd aurutils

      makepkg -si

      '
    reference: https://aur.archlinux.org/packages/aurutils
  arch/yay:
    cmd: yay -S aurutils
    reference: https://aur.archlinux.org/packages/aurutils
binlist:
- aurutils
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
