lang: JavaScript
homepage: https://github.com/yarnpkg/yarn
desc:
  cn: Yarn 是一个包管理器，同时也是项目管理器
  en: Yarn is a package manager that doubles down as project manager
x:
  source: https://github.com/yarnpkg/yarn
  eget: https://github.com/yarnpkg/yarn
rule:
  /eget:
    cmd: x eget yarnpkg/yarn
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use yarn
    reference: https://github.com/twuni/asdf-yarn
  /npm:
    cmd: npm i -g yarn
    reference: https://www.npmjs.com/package/yarn
    dsnap: yarn
  darwin/brew:
    cmd: brew install yarn
    reference: https://formulae.brew.sh/formula/yarn#default
  (win|wsl2)/scoop:
    cmd: x scoop install yarn
    reference: https://scoop.sh/#/apps?q=yarn
binlist:
- yarn
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
