lang: JavaScript
homepage: https://github.com/yarnpkg/yarn
desc:
  cn: Yarn 是一个包管理器，同时也是项目管理器
  en: Yarn is a package manager that doubles down as project manager
  cs: Yarn je správce balíčků, který zároveň slouží jako správce projektů
  de: Yarn ist ein Paketmanager, der zugleich als Projektmanager fungiert
  es: Yarn es un gestor de paquetes que también hace de gestor de proyectos
  fr: Yarn est un gestionnaire de paquets qui fait aussi office de gestionnaire de projet
  id: Yarn adalah manajer paket yang sekaligus menjadi manajer proyek
  it: Yarn è un gestore di pacchetti che fa anche da gestore di progetti
  ja: Yarn はパッケージマネージャーであり、プロジェクトマネージャーも兼ねる
  ko: Yarn는 프로젝트 관리자 역할도 겸하는 패키지 관리자입니다
  pl: Yarn to menedżer pakietów, który pełni również rolę menedżera projektów
  pt: Yarn é um gerenciador de pacotes que também atua como gerenciador de projetos
  ro: Yarn este un manager de pachete care face și oficiu de manager de proiect
  ru: Yarn — менеджер пакетов, который также выступает в роли менеджера проектов
  th: Yarn คือตัวจัดการแพ็กเกจที่ทำหน้าที่เป็นตัวจัดการโครงการด้วย
  tr: Yarn, aynı zamanda proje yöneticisi olarak da görev yapan bir paket yöneticisidir
  uk: Yarn — менеджер пакетів, який також виконує роль менеджера проєктів
  vi: Yarn là trình quản lý gói kiêm trình quản lý dự án
x:
  source: https://github.com/yarnpkg/yarn
  eget: yarnpkg/yarn
  brew: yarn
  scoop: yarn
  asdf: yarn
rule:
  /eget:
    cmd: x eget yarnpkg/yarn
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use yarn
    reference: https://github.com/twuni/asdf-yarn
  /npm:
    cmd: npm i -g yarn
    reference: https://www.npmjs.com/package/yarn
    dsnap: yarn
  darwin/brew:
    cmd: brew install yarn
    reference: https://formulae.brew.sh/formula/yarn#default
  (win|wsl2)/scoop:
    cmd: x scoop install yarn
    reference: https://scoop.sh/#/apps?q=yarn
binlist:
- yarn
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (msi)
            en: ~2 MB download (msi)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
