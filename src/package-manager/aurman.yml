desc:
  cn: AUR Helper
  en: AUR 帮助程序
lang: Python
homepage: https://github.com/polygamma/aurman
license: MIT
x:
  source: https://github.com/polygamma/aurman
rule:
  arch/pacman:
    cmd: 'git clone https://aur.archlinux.org/aurman.git

      cd aurman

      makepkg -si

      '
    reference: https://wiki.archlinux.org/title/Arch_User_Repository
  arch/yay:
    cmd: yay -S aurman
    reference: https://aur.archlinux.org/packages/aurman
binlist:
- aurman

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 12 KB
          rating: 1
          desc:
            cn: 约 12 KB（估算）
            en: ~12 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
