lang: Go
homepage: https://github.com/marwanhawari/stew
license: MIT
desc:
  cn: 一个用于已编译二进制文件的独立包管理器。
  en: An independent package manager for compiled binaries.
x:
  source: https://github.com/marwanhawari/stew
  eget: https://github.com/marwanhawari/stew
rule:
  /eget:
    cmd: x eget marwanhawari/stew
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S stew
    reference: https://github.com/marwanhawari/stew
  arch/yay:
    cmd: yay -S stew
    reference: https://aur.archlinux.org/packages/stew
  darwin/brew:
    cmd: brew install marwanhawari/tap/stew
    reference: https://github.com/marwanhawari/stew
  /go:
    cmd: go install github.com/marwanhawari/stew@latest
    reference: https://github.com/marwanhawari/stew
    dsnap: github.com/marwanhawari/stew
binlist:
- stew

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
