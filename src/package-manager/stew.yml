lang: Go
homepage: https://github.com/marwanhawari/stew
license: MIT
desc:
  cn: 一个用于已编译二进制文件的独立包管理器。
  en: An independent package manager for compiled binaries.
x:
  source: https://github.com/marwanhawari/stew
  eget: https://github.com/marwanhawari/stew
rule:
  /eget:
    cmd: x eget marwanhawari/stew
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S stew
    reference: https://github.com/marwanhawari/stew
  arch/yay:
    cmd: yay -S stew
    reference: https://aur.archlinux.org/packages/stew
  darwin/brew:
    cmd: brew install marwanhawari/tap/stew
    reference: https://github.com/marwanhawari/stew
  /go:
    cmd: go install github.com/marwanhawari/stew@latest
    reference: https://github.com/marwanhawari/stew
    dsnap: github.com/marwanhawari/stew
binlist:
- stew

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
