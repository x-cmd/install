homepage: https://github.com/conda/conda
lang: Python
desc:
  cn: 一个开源包管理和环境管理系统，用于安装、运行和升级跨语言和跨平台的软件包和依赖关系。被广泛用于科学计算和数据科学领域
  en: An open-source package management and environment management system for installing, running, and updating packages and their dependencies across multiple languages and platforms. Widely used in scientific computing and data science
x:
  source: https://github.com/conda/conda
  eget: https://github.com/conda/conda
rule:
  /eget:
    cmd: x eget conda/conda
    reference: https://x-cmd.com/mod/eget
  fedora/dnf:
    cmd: sudo dnf install conda
    reference: https://command-not-found.com/conda
    dsnap: conda
  arch/yay:
    cmd: yay -S python-conda
    reference: https://aur.archlinux.org/packages/python-conda
binlist:
- conda
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
