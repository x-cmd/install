lang: Python
homepage: https://github.com/actionless/pikaur
license: GPL-3.0
desc:
  cn: 具有最小依赖性的 AUR 助手
  en: AUR helper with minimal dependencies
x:
  source: https://github.com/actionless/pikaur
rule:
  arch/pacman:
    cmd: 'sudo pacman -S --needed base-devel git \

      && git clone https://aur.archlinux.org/pikaur.git \

      && cd pikaur \

      && makepkg -fsri

      '
    reference: https://github.com/actionless/pikaur#installation
  arch/yay:
    cmd: yay -S pikaur
    reference: https://aur.archlinux.org/packages/pikaur
binlist:
- pikaur

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
