lang: Python
homepage: https://github.com/actionless/pikaur
license: GPL-3.0
desc:
  cn: 具有最小依赖性的 AUR 助手
  en: AUR helper with minimal dependencies
x:
  source: https://github.com/actionless/pikaur
rule:
  arch/pacman:
    cmd: 'sudo pacman -S --needed base-devel git \

      && git clone https://aur.archlinux.org/pikaur.git \

      && cd pikaur \

      && makepkg -fsri

      '
    reference: https://github.com/actionless/pikaur#installation
  arch/yay:
    cmd: yay -S pikaur
    reference: https://aur.archlinux.org/packages/pikaur
binlist:
- pikaur

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 34 KB
          rating: 1
          desc:
            cn: 约 34 KB（估算）
            en: ~34 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
