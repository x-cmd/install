lang: C++
homepage: https://github.com/NixOS/nix
license: LGPL-2.1
desc:
  cn: Nix 是一种采用独特方法进行包管理和系统配置的工具
  en: Nix is a tool that takes a unique approach to package management and system configuration
x:
  source: https://github.com/NixOS/nix
rule:
  linux/curl:
    cmd: curl -L https://nixos.org/nix/install | sh -s -- --daemon
    reference: https://nix.dev/install-nix
  /curl:
    cmd: curl -L https://nixos.org/nix/install | sh
    reference: https://nix.dev/install-nix
  (win|wsl2)/curl:
    cmd: curl -L https://nixos.org/nix/install | sh -s -- --no-daemon
    reference: https://nix.dev/install-nix
  /nix:
    cmd: x nix --xinistall
    reference: https://nixos.org/manual/nix/stable/installation/installing-binary
binlist:
- nix

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 8.1 MB
          rating: 1
          desc:
            cn: 约 8.1 MB（估算）
            en: ~8.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
