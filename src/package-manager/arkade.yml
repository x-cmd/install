lang: Go
homepage: https://github.com/alexellis/arkade
license: MIT
desc:
  cn: arkade 是开发人员如何安装他们喜欢的 CLI 工具和 Kubernetes 应用的最新版本
  en: arkade is how developers install the latest versions of their favourite CLI tools and Kubernetes apps
x:
  source: https://github.com/alexellis/arkade
  eget: https://github.com/alexellis/arkade
rule:
  /eget:
    cmd: x eget alexellis/arkade
    reference: https://x-cmd.com/mod/eget
  linux/curl:
    cmd: curl -sLS https://get.arkade.dev | sudo sh
    reference: https://github.com/alexellis/arkade?tab=readme-ov-file#getting-arkade
  darwin/curl:
    cmd: curl -sLS https://get.arkade.dev | sudo sh
    reference: https://github.com/alexellis/arkade?tab=readme-ov-file#getting-arkade
  win/curl:
    cmd: curl -sLS https://get.arkade.dev | sh
    reference: https://github.com/alexellis/arkade?tab=readme-ov-file#getting-arkade
binlist:
- arkade
