lang: C++
homepage: https://salsa.debian.org/apt-team/apt
desc:
  cn: apt 是 Debian 及其衍生产品的主要命令行包管理器
  en: apt is the main command-line package manager for Debian and its derivatives
  cs: apt je hlavní správce balíčků pro Debian a jeho deriváty
  de: apt ist der wichtigste Paketmanager für Debian und seine Derivate
  es: apt es el gestor de paquetes de línea de comandos principal para Debian y sus derivados
  fr: apt est le principal gestionnaire de paquets en ligne de commande pour Debian et ses dérivées
  id: apt adalah pengelola paket baris perintah utama untuk Debian dan turunannya
  it: apt è il principale gestore di pacchetti da riga di comando per Debian e le sue derivate
  ja: apt は Debian とその派生ディストリビューションの主要なコマンドライン・パッケージマネージャーです
  ko: apt는 Debian과 그 파생 배포판을 위한 주요 명령줄 패키지 관리자입니다
  pl: apt jest głównym menedżerem pakietów wiersza poleceń dla Debiana i jego pochodnych
  pt: apt é o principal gerenciador de pacotes de linha de comando para o Debian e seus derivados
  ro: apt este principalul manager de pachete din linia de comandă pentru Debian și derivatele sale
  ru: apt — основной менеджер пакетов командной строки для Debian и его производных
  th: apt คือตัวจัดการแพ็กเกจบรรทัดคำสั่งหลักสำหรับ Debian และระบบที่สืบทอดมาจากมัน
  tr: apt, Debian ve türevleri için ana komut satırı paket yöneticisidir
  uk: apt — основний менеджер пакетів командного рядка для Debian та його похідних
  vi: apt là trình quản lý gói dòng lệnh chính cho Debian và các bản phái sinh của nó
rule:
  debian/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
    dsnap: apt
  ubuntu/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
    dsnap: apt
  kali/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
    dsnap: apt
  fedora/dnf:
    cmd: sudo dnf install apt
    reference: https://command-not-found.com/apt-get
  raspbian/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
  linux/brew:
    cmd: brew install apt
    reference: https://formulae.brew.sh/formula/apt#default

x:
  apt: apt
  apt-get: apt
  dnf: apt
  brew: apt
binlist:
- apt
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
