lang: C++
homepage: https://salsa.debian.org/apt-team/apt
desc:
  cn: apt 是 Debian 及其衍生产品的主要命令行包管理器
  en: apt is the main command-line package manager for Debian and its derivatives
rule:
  debian/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
    dsnap: apt
  ubuntu/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
    dsnap: apt
  kali/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
    dsnap: apt
  fedora/dnf:
    cmd: sudo dnf install apt
    reference: https://command-not-found.com/apt-get
  raspbian/apt:
    cmd: sudo apt-get install apt
    reference: https://command-not-found.com/apt-get
  linux/brew:
    cmd: brew install apt
    reference: https://formulae.brew.sh/formula/apt#default
binlist:
- apt
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
