lang: Ruby
homepage: https://github.com/CocoaPods/CocoaPods
desc:
  cn: CocoaPods 是 Swift 和 Objective-C Cocoa 项目的依赖管理器
  en: CocoaPods is a dependency manager for Swift and Objective-C Cocoa projects
x:
  source: https://github.com/CocoaPods/CocoaPods
rule:
  /asdf:
    cmd: x asdf use cocoapods
    reference: https://github.com/ronnnnn/asdf-cocoapods
  /gem:
    cmd: gem install cocoapods
    reference: https://cocoapods.org/
  darwin/brew:
    cmd: brew install cocoapods
    reference: https://formulae.brew.sh/formula/cocoapods#default
binlist:
- cocoapods
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 1
          desc:
            cn: 安装 10 MB
            en: 10 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
