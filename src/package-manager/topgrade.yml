lang: 'Rust'
homepage: 'https://github.com/topgrade-rs/topgrade'
license: 'GPL-3.0'
desc:
  cn: 一键升级所有软件
  en: 'Upgrade all the things'
x:
  source: https://github.com/topgrade-rs/topgrade
  eget: https://github.com/topgrade-rs/topgrade
rule:
  /cargo:
    cmd: 'cargo install topgrade'
    reference: https://github.com/topgrade-rs/topgrade
  darwin/brew:
    cmd: 'brew install topgrade'
    reference: https://github.com/topgrade-rs/topgrade
  /eget:
    cmd: x eget topgrade-rs/topgrade
    reference: https://github.com/topgrade-rs/topgrade
binlist:
- 'topgrade'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
