lang: 'Rust'
homepage: 'https://github.com/topgrade-rs/topgrade'
license: 'GPL-3.0'
desc:
  cn: 一键升级所有软件
  en: 'Upgrade all the things'
x:
  source: https://github.com/topgrade-rs/topgrade
  eget: https://github.com/topgrade-rs/topgrade
rule:
  /cargo:
    cmd: 'cargo install topgrade'
    reference: https://github.com/topgrade-rs/topgrade
  darwin/brew:
    cmd: 'brew install topgrade'
    reference: https://github.com/topgrade-rs/topgrade
  /eget:
    cmd: x eget topgrade-rs/topgrade
    reference: https://github.com/topgrade-rs/topgrade
binlist:
  - 'topgrade'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
