lang: C++
homepage: https://github.com/openSUSE/zypper
desc:
  cn: Zypper 是一个使用 libzypp 的命令行包管理器
  en: Zypper is a command line package manager which makes use of libzypp.
x:
  source: https://github.com/openSUSE/zypper
  apt: zypper
  dnf: zypper
rule:
  debian/apt:
    cmd: sudo apt-get install zypper
    reference: https://command-not-found.com/zypper
    dsnap: zypper
  ubuntu/apt:
    cmd: sudo apt-get install zypper
    reference: https://command-not-found.com/zypper
    dsnap: zypper
  kali/apt:
    cmd: sudo apt-get install zypper
    reference: https://command-not-found.com/zypper
    dsnap: zypper
  fedora/dnf:
    cmd: sudo dnf install zypper
    reference: https://command-not-found.com/zypper
    dsnap: zypper
  raspbian/apt:
    cmd: sudo apt-get install zypper
    reference: https://command-not-found.com/zypper
binlist:
- zypper
license: NOASSERTION
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # package repos
    filesystem:
      read:
        desc:
          cn: 读取 /etc/zypp, /var/cache/zypp
          en: Reads /etc/zypp, /var/cache/zypp
        sensitive: []
      write:
        desc:
          cn: 写入 /var/lib/rpm, 包缓存
          en: Writes /var/lib/rpm, package cache
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.6 MB
          rating: 1
          desc:
            cn: 约 1.6 MB（估算）
            en: ~1.6 MB estimated
        growth:
          desc:
            cn: 包缓存持续增长
            en: Package cache grows continuously
      paths:
        data:
          - "/var/cache/zypp"
          - "/var/lib/rpm"
        config:
          - "/etc/zypp"
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 200 MB
        desc:
          cn: 大型包下载/解压时
          en: Large package download/extract
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 依赖解析/GPG 校验时占用
          en: Spike during dep resolution / GPG verify
