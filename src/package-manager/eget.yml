lang: Go
homepage: https://github.com/zyedidia/eget
license: MIT
desc:
  cn: 用于从 GitHub release 轻松安装预构建二进制文件的命令行工具。
  en: A command-line tool for easily fetching and extracting pre-built binaries from GitHub releases.
x:
  source: https://github.com/zyedidia/eget
  eget: zyedidia/eget
  brew: eget
  pacman: eget-bin
  scoop: eget
  choco: eget
  yay: eget-bin
  go: github.com/zyedidia/eget@latest
rule:
  /eget:
    cmd: x eget zyedidia/eget
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl https://zyedidia.github.io/eget.sh | sh
    reference: https://github.com/zyedidia/eget#quick-install-script
  darwin/brew:
    cmd: brew install eget
    reference: https://github.com/zyedidia/eget#homebrew
  arch/pacman:
    cmd: pacman -S eget-bin
    reference: https://github.com/zyedidia/eget#quick-install-script
  arch/yay:
    cmd: yay -S eget-bin
    reference: https://aur.archlinux.org/packages/eget-bin
  (win|wsl2)/scoop:
    cmd: x scoop install eget
    reference: https://github.com/zyedidia/eget#how-to-get-eget
  (win|wsl2)/choco:
    cmd: x choco install eget
    reference: https://github.com/zyedidia/eget#chocolatey
  /go:
    cmd: go install github.com/zyedidia/eget@latest
    reference: https://github.com/zyedidia/eget#how-to-get-eget
    dsnap: github.com/zyedidia/eget@latest
binlist:
- eget

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
