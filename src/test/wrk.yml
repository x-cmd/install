lang: C
homepage: https://github.com/wg/wrk
desc:
  cn: HTTP 基准测试工具
  en: Modern HTTP benchmarking tool
x:
  source: https://github.com/wg/wrk
rule:
  /asdf:
    cmd: x asdf use wrk
    reference: https://github.com/ivanvc/asdf-wrk
  darwin/brew:
    cmd: brew install wrk
    reference: https://formulae.brew.sh/formula/wrk#default
  ubuntu/apt:
    cmd: sudo apt-get install wrk
    reference: https://github.com/wg/wrk
    dsnap: wrk
  debian/apt:
    cmd: sudo apt-get install wrk
    reference: https://github.com/wg/wrk
    dsnap: wrk
  arch/yay:
    cmd: yay -S wrk
    reference: https://aur.archlinux.org/packages/wrk
binlist:
- wrk
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
