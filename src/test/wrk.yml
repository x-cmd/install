lang: C
homepage: https://github.com/wg/wrk
desc:
  cn: HTTP 基准测试工具
  en: Modern HTTP benchmarking tool
x:
  source: https://github.com/wg/wrk
rule:
  /asdf:
    cmd: x asdf use wrk
    reference: https://github.com/ivanvc/asdf-wrk
  darwin/brew:
    cmd: brew install wrk
    reference: https://formulae.brew.sh/formula/wrk#default
  ubuntu/apt:
    cmd: sudo apt-get install wrk
    reference: https://github.com/wg/wrk
    dsnap: wrk
  debian/apt:
    cmd: sudo apt-get install wrk
    reference: https://github.com/wg/wrk
    dsnap: wrk
  arch/yay:
    cmd: yay -S wrk
    reference: https://aur.archlinux.org/packages/wrk
binlist:
- wrk
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 205 KB
          rating: 1
          desc:
            cn: 约 205 KB（估算）
            en: ~205 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
