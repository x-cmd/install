lang: Go
homepage: https://github.com/nakabonne/ali
license: MIT
desc:
  cn: 用于执行实时分析的负载测试工具
  en: A load testing tool capable of performing real-time analysis.
  cs: Nástroj pro zátěžové testování schopný provádět analýzu v reálném čase.
  de: Ein Load-Testing-Tool, das Analysen in Echtzeit durchführen kann.
  es: Una herramienta de pruebas de carga capaz de realizar análisis en tiempo real.
  fr: Un outil de test de charge capable d'effectuer des analyses en temps réel.
  id: Alat pengujian beban yang mampu melakukan analisis waktu nyata.
  it: Uno strumento di load testing in grado di eseguire analisi in tempo reale.
  ja: リアルタイム分析を実行できる負荷テストツール。
  ko: 실시간 분석을 수행할 수 있는 부하 테스트 도구.
  pl: Narzędzie do testów obciążeniowych zdolne do przeprowadzania analiz w czasie rzeczywistym.
  pt: Uma ferramenta de teste de carga capaz de realizar análises em tempo real.
  ro: Un instrument de testare la sarcină capabil să efectueze analize în timp real.
  ru: Инструмент нагрузочного тестирования, способный выполнять анализ в реальном времени.
  th: เครื่องมือทดสอบโหลดที่สามารถทำการวิเคราะห์แบบเรียลไทม์.
  tr: gerçek zamanlı analiz yapabilen bir yük testi aracı.
  uk: Інструмент навантажувального тестування, здатний виконувати аналіз у реальному часі.
  vi: Công cụ kiểm thử tải có khả năng thực hiện phân tích thời gian thực.
x:
  source: https://github.com/nakabonne/ali
  eget: nakabonne/ali
  brew: nakabonne/ali/ali
  pacman: ali
  apk: ali
  port: ali
  go: github.com/nakabonne/ali@latest
rule:
  /eget:
    cmd: x eget nakabonne/ali
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: sudo pacman -S ali
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
  /nix:
    cmd: nix-env -iA nixos.ali
    reference: https://search.nixos.org/packages?channel=unstable&show=ali&from=0&size=50&sort=relevance&type=packages&query=ali
  darwin/brew:
    cmd: brew install nakabonne/ali/ali
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
  darwin/port:
    cmd: sudo port selfupdate && sudo port install ali
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
  debian/apt:
    cmd: 'wget https://github.com/nakabonne/ali/releases/download/v0.7.3/ali_0.7.3_linux_amd64.deb && \

      sudo apt install ./ali_0.7.3_linux_amd64.deb

      '
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
    dsnap: ali
  ubuntu/apt:
    cmd: 'wget https://github.com/nakabonne/ali/releases/download/v0.7.3/ali_0.7.3_linux_amd64.deb && \

      sudo apt install ./ali_0.7.3_linux_amd64.deb

      '
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
    dsnap: ali
  mint/apt:
    cmd: 'wget https://github.com/nakabonne/ali/releases/download/v0.7.3/ali_0.7.3_linux_amd64.deb && \

      sudo apt install ./ali_0.7.3_linux_amd64.deb

      '
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
  kali/apt:
    cmd: 'wget https://github.com/nakabonne/ali/releases/download/v0.7.3/ali_0.7.3_linux_amd64.deb && \

      sudo apt install ./ali_0.7.3_linux_amd64.deb

      '
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
  raspbian/apt:
    cmd: 'wget https://github.com/nakabonne/ali/releases/download/v0.7.3/ali_0.7.3_linux_amd64.deb && \

      sudo apt install ./ali_0.7.3_linux_amd64.deb

      '
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
  fedora/rpm:
    cmd: rpm -ivh https://github.com/nakabonne/ali/releases/download/v0.7.3/ali_0.7.3_linux_amd64.rpm
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
  centos/rpm:
    cmd: rpm -ivh https://github.com/nakabonne/ali/releases/download/v0.7.3/ali_0.7.3_linux_amd64.rpm
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
  alpine/apk:
    cmd: apk add ali
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
    dsnap: ali
  freebsd/pkg:
    cmd: pkg install benchmarks/ali
    reference: https://github.com/nakabonne/ali#installation
  /go:
    cmd: go install github.com/nakabonne/ali@latest
    reference: https://github.com/nakabonne/ali?tab=readme-ov-file#installation
    dsnap: github.com/nakabonne/ali@latest
binlist:
- ali

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 242 KB
          rating: 1
          desc:
            cn: 约 242 KB（估算）
            en: ~242 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
