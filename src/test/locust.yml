lang: Python
homepage: https://github.com/locustio/locust
license: MIT
desc:
  cn: Locust 是一个用于 HTTP 和其他协议的开源性能/负载测试工具
  en: Locust is an open source performance/load testing tool for HTTP and other protocols
  cs: Locust je open source nástroj pro testování výkonu a zátěže pro HTTP a další protokoly
  de: Locust ist ein Open-Source-Werkzeug zum Performance- und Lasttesten für HTTP und andere Protokolle
  es: Locust es una herramienta de código abierto para pruebas de rendimiento y de carga para HTTP y otros protocolos
  fr: Locust est un outil open source de test de performance et de charge pour HTTP et d'autres protocoles
  id: Locust adalah alat pengujian performa/beban sumber terbuka untuk HTTP dan protokol lainnya
  it: Locust è uno strumento open source per test di prestazioni e di carico per HTTP e altri protocolli
  ja: Locust は HTTP およびその他のプロトコル向けのオープンソースな性能・負荷テストツールです
  ko: Locust는 HTTP 및 기타 프로토콜을 위한 오픈 소스 성능/부하 테스트 도구입니다
  pl: Locust to narzędzie open source do testowania wydajności i obciążenia dla HTTP i innych protokołów
  pt: Locust é uma ferramenta de código aberto para testes de desempenho e de carga em HTTP e outros protocolos
  ro: Locust este un instrument open source pentru testarea performanței și a încărcării pentru HTTP și alte protocoale
  ru: Locust — инструмент с открытым исходным кодом для нагрузочного и теста производительности по HTTP и другим протоколам
  th: Locust เป็นเครื่องมือทดสอบประสิทธิภาพ/โหลดโอเพนซอร์สสำหรับ HTTP และโปรโตคอลอื่น ๆ
  tr: Locust, HTTP ve diğer protokoller için performans/yük testi yapan açık kaynaklı bir araçtır
  uk: Locust — інструмент з відкритим кодом для тестування продуктивності та навантаження для HTTP та інших протоколів
  vi: Locust là công cụ mã nguồn mở để kiểm thử hiệu năng và tải cho HTTP và các giao thức khác
x:
  source: https://github.com/locustio/locust
  brew: locust
  yay: python-locust
  pip: locust
rule:
  /x:
    cmd: x pkg use locust
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install locust
    reference: https://docs.locust.io/en/stable/installation.html#installation
  darwin/brew:
    cmd: brew install locust
    reference: https://formulae.brew.sh/formula/locust#default
  arch/yay:
    cmd: yay -S python-locust
    reference: https://aur.archlinux.org/packages/python-locust
binlist:
- locust

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 70 KB
          rating: 1
          desc:
            cn: 约 70 KB（估算）
            en: ~70 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
