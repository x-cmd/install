lang: C
homepage: https://github.com/clibs/cmocka
license: Apache-2.0
desc:
  cn: C 的单元测试框架
  en: Unit testing framework for C
x:
  source: https://github.com/clibs/cmocka
rule:
  darwin/brew:
    cmd: brew install cmocka
    reference: https://formulae.brew.sh/formula/cmocka#default
  ubuntu/apt:
    cmd: sudo apt-get install libcmocka-dev
    reference: https://gitlab.com/cmocka/cmocka/-/blob/master/INSTALL.md?ref_type=heads
    dsnap: libcmocka-dev
  arch/yay:
    cmd: yay -S cmocka-git
    reference: https://aur.archlinux.org/packages/cmocka-git
binlist:
- cmocka

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
