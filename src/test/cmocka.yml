lang: C
homepage: https://github.com/clibs/cmocka
license: Apache-2.0
desc:
  cn: C 的单元测试框架
  en: Unit testing framework for C
x:
  source: https://github.com/clibs/cmocka
rule:
  darwin/brew:
    cmd: brew install cmocka
    reference: https://formulae.brew.sh/formula/cmocka#default
  ubuntu/apt:
    cmd: sudo apt-get install libcmocka-dev
    reference: https://gitlab.com/cmocka/cmocka/-/blob/master/INSTALL.md?ref_type=heads
    dsnap: libcmocka-dev
  arch/yay:
    cmd: yay -S cmocka-git
    reference: https://aur.archlinux.org/packages/cmocka-git
binlist:
- cmocka

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 353 KB
          rating: 1
          desc:
            cn: 约 353 KB（估算）
            en: ~353 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
