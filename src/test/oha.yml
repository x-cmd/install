homepage: https://github.com/hatoo/oha
license: MIT
lang: Rust
desc:
  cn: HTTP 负载生成器
  en: HTTP load generator
x:
  pkg:
    exist: true
  source: https://github.com/hatoo/oha
  eget: https://github.com/hatoo/oha
rule:
  /x:
    cmd: x pkg use oha
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget hatoo/oha
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install oha
    reference: https://formulae.brew.sh/formula/oha#default
  /cargo:
    cmd: cargo install oha
    reference: https://crates.io/crates/oha
    dsnap: oha
  arch/pacman:
    cmd: sudo pacman -S oha
    reference: https://github.com/hatoo/oha?tab=readme-ov-file#on-macos-homebrew
  arch/yay:
    cmd: yay -S oha-git
    reference: https://aur.archlinux.org/packages/oha-git
binlist:
- oha

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
