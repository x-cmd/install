homepage: https://github.com/hatoo/oha
license: MIT
lang: Rust
desc:
  cn: HTTP 负载生成器
  en: HTTP load generator
x:
  source: https://github.com/hatoo/oha
  eget: https://github.com/hatoo/oha
  brew: oha
  pacman: oha
  yay: oha-git
  cargo: oha
rule:
  /x:
    cmd: x pkg use oha
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget hatoo/oha
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install oha
    reference: https://formulae.brew.sh/formula/oha#default
  /cargo:
    cmd: cargo install oha
    reference: https://crates.io/crates/oha
    dsnap: oha
  arch/pacman:
    cmd: sudo pacman -S oha
    reference: https://github.com/hatoo/oha?tab=readme-ov-file#on-macos-homebrew
  arch/yay:
    cmd: yay -S oha-git
    reference: https://aur.archlinux.org/packages/oha-git
binlist:
- oha

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 安装 13 MB
            en: 13 MB install
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
