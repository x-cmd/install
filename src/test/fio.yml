lang: C
homepage: https://github.com/axboe/fio
license: GPL-2.0-only
desc:
  cn: fio（Flexible I/O Tester）由 Jens Axboe 编写，是 Linux 上事实标准的灵活 I/O 基准测试工具 —— 可自定义 IO 引擎、块大小、队列深度、读写模式，输出吞吐量与延迟分布。`ljh-sh/fio` 发行版提供 5 个目标的静态构建（x86_64/aarch64 Linux musl、aarch64/x86_64 macOS、x86_64 Windows）。
  en: fio (Flexible I/O Tester) by Jens Axboe is the de-facto flexible I/O benchmark on Linux — pluggable IO engines, block sizes, queue depths, and read/write patterns, with throughput + latency histograms as output. The `ljh-sh/fio` distribution ships static binaries for 5 targets (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  cs: fio (Flexible I/O Tester) od Jense Axboe je de facto standardním flexibilním I/O benchmarkem na Linuxu — vyměnné I/O enginy, velikosti bloků, hloubky front a vzory čtení/zápisu, s výstupem propustnosti a histogramů latence. Distribuce `ljh-sh/fio` dodává statické binárky pro 5 cílů (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  de: fio (Flexible I/O Tester) von Jens Axboe ist der de-facto flexible I/O-Benchmark unter Linux — austauschbare I/O-Engines, Blockgrößen, Queue-Tiefen sowie Lese-/Schreibmuster mit Durchsatz- und Latenzhistogrammen als Ausgabe. Die Distribution `ljh-sh/fio` liefert statische Binärdateien für 5 Ziele (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  es: fio (Flexible I/O Tester), de Jens Axboe, es el benchmark de E/S flexible de facto en Linux — motores de E/S intercambiables, tamaños de bloque, profundidades de cola y patrones de lectura/escritura, con histogramas de rendimiento y latencia como salida. La distribución `ljh-sh/fio` incluye binarios estáticos para 5 objetivos (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  fr: fio (Flexible I/O Tester) de Jens Axboe est le benchmark d'E/S flexible de référence sous Linux — moteurs d'E/S interchangeables, tailles de bloc, profondeurs de file et motifs de lecture/écriture, avec débit et histogrammes de latence en sortie. La distribution `ljh-sh/fio` fournit des binaires statiques pour 5 cibles (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  id: fio (Flexible I/O Tester) oleh Jens Axboe adalah benchmark I/O fleksibel de facto di Linux — mesin I/O yang dapat diganti, ukuran blok, kedalaman antrean, serta pola baca/tulis, dengan keluaran throughput dan histogram latensi. Distribusi `ljh-sh/fio` menyediakan biner statis untuk 5 target (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  it: fio (Flexible I/O Tester) di Jens Axboe è il benchmark di I/O flessibile di fatto su Linux — motori I/O intercambiabili, dimensioni dei blocchi, profondità delle code e pattern di lettura/scrittura, con output di throughput e istogrammi di latenza. La distribuzione `ljh-sh/fio` fornisce binari statici per 5 target (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  ja: fio (Flexible I/O Tester) は Jens Axboe による Linux 上の事実上の柔軟な I/O ベンチマークです。プラガブルな I/O エンジン、ブロックサイズ、キュー深度、読み書きパターンを変更でき、スループットとレイテンシのヒストグラムを出力します。`ljh-sh/fio` ディストリビューションは 5 つのターゲット (x86_64/aarch64 Linux musl、aarch64/x86_64 macOS、x86_64 Windows) 向けの静的バイナリを提供します。).
  ko: fio(Flexible I/O Tester)는 Jens Axboe가 만든 Linux의 사실상 표준 유연 I/O 벤치마크로, 교체 가능한 I/O 엔진, 블록 크기, 큐 깊이, 읽기/쓰기 패턴을 지원하며 처리량과 지연 시간 히스토그램을 출력합니다. `ljh-sh/fio` 배포판은 5개 대상(x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows)을 위한 정적 바이너리를 제공합니다).
  pl: fio (Flexible I/O Tester) autorstwa Jens Axboe jest de facto standardowym elastycznym benchmarkiem I/O w Linuksie — wymienne silniki I/O, rozmiary bloków, głębokości kolejek oraz wzorce odczytu i zapisu, z wydrukiem przepustowości i histogramów opóźnień. Dystrybucja `ljh-sh/fio` dostarcza statyczne binaria dla 5 platform (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  pt: fio (Flexible I/O Tester), de Jens Axboe, é o benchmark de E/S flexível de facto no Linux — motores de E/S substituíveis, tamanhos de bloco, profundidades de fila e padrões de leitura/escrita, com vazão e histogramas de latência na saída. A distribuição `ljh-sh/fio` fornece binários estáticos para 5 alvos (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  ro: fio (Flexible I/O Tester) de Jens Axboe este benchmarkul de I/O flexibil de facto pe Linux — motoare I/O interschimbabile, dimensiuni de bloc, adâncimi de coadă și tipare de citire/scriere, cu debit și histograme de latență ca ieșire. Distribuția `ljh-sh/fio` oferă binare statice pentru 5 ținte (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  ru: fio (Flexible I/O Tester) от Jens Axboe — де-факто гибкий эталон тестирования ввода-вывода в Linux — с подключаемыми движками ввода-вывода, размерами блоков, глубинами очередей и шаблонами чтения и записи, а на выходе — пропускная способность и гистограммы задержек. Дистрибутив `ljh-sh/fio` поставляет статические бинарные файлы для 5 целей (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  th: fio (Flexible I/O Tester) โดย Jens Axboe คือเกณฑ์มาตรฐานการทดสอบ I/O แบบยืดหยุ่นที่ใช้จริงใน Linux — รองรับ I/O engine ที่เปลี่ยนได้ ขนาดบล็อก ความลึกคิว และรูปแบบการอ่าน/เขียน พร้อมแสดงผลปริมาณงานและฮิสโตแกรมความหน่วง การแจกแจง `ljh-sh/fio` มีไบนารีแบบสถิตสำหรับ 5 เป้าหมาย (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  tr: fio (Flexible I/O Tester), Jens Axboe tarafından, Linux üzerinde fiili olarak esnek I/O kıyaslama aracıdır — değiştirilebilir I/O motorları, blok boyutları, kuyruk derinlikleri ve okuma/yazma kalıplarıyla, çıktı olarak işlem hacmi ve gecikme histogramları sunar. `ljh-sh/fio` dağıtımı 5 hedef için statik ikili dosyalar sunar (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  uk: fio (Flexible I/O Tester) від Jens Axboe — де-факто гнучкий еталон тестування вводу-виводу в Linux — із підключуваними движками вводу-виводу, розмірами блоків, глибинами черг і шаблонами читання та запису, а на виході — пропускна здатність і гістограми затримки. Дистрибутив `ljh-sh/fio` постачає статичні бінарні файли для 5 цілей (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
  vi: fio (Flexible I/O Tester) của Jens Axboe là bộ kiểm nghiệm I/O linh hoạt được sử dụng rộng rãi trên Linux — các engine I/O có thể thay thế, kích thước khối, độ sâu hàng đợi và mẫu đọc/ghi, kèm đầu ra là thông lượng và biểu đồ phân bố độ trễ. Bản phân phối `ljh-sh/fio` cung cấp tệp nhị phân tĩnh cho 5 nền tảng (x86_64/aarch64 Linux musl, aarch64/x86_64 macOS, x86_64 Windows).
rule:
  /eget:
    cmd: x eget ljh-sh/fio
    reference: https://github.com/ljh-sh/fio
  arch/yay:
    cmd: yay -S fio
    reference: https://archlinux.org/packages/extra/x86_64/fio/
  debian/apt:
    cmd: sudo apt install fio
    reference: https://packages.debian.org/bookworm/fio
    dsnap: fio
  ubuntu/apt:
    cmd: sudo apt install fio
    reference: https://launchpad.net/ubuntu/+source/fio
    dsnap: fio
  alpine/apk:
    cmd: sudo apk add fio
    reference: https://pkgs.alpinelinux.org/packages?name=fio
  freebsd/pkg:
    cmd: pkg install fio
    reference: https://www.freshports.org/benchmarks/fio/
  darwin/brew:
    cmd: brew install fio
    reference: https://formulae.brew.sh/formula/fio
  netbsd/pkgin:
    cmd: pkgin install fio
    reference: https://pkgin.net/package/fio
  void/xbps-install:
    cmd: sudo xbps-install fio
    reference: https://voidlinux.org/packages/?q=fio

x:
  apt: fio
  apk: fio
  xbps: fio
  brew: fio
  yay: fio
  eget: ljh-sh/fio
binlist:
- fio
- fio_generate_plots
- fio2gnuplot
