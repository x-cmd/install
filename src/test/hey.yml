lang: Go
homepage: https://github.com/rakyll/hey
license: Apache-2.0
desc:
  cn: HTTP 负载生成器，ApacheBench (ab) 的替代工具
  en: HTTP load generator, ApacheBench (ab) replacement
x:
  source: https://github.com/rakyll/hey
  apt: hey
  brew: hey
  apt-get: hey
  yay: hey-bin
  asdf: hey
rule:
  /x:
    cmd: x pkg use hey
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use hey
    reference: https://github.com/raimon49/asdf-hey
  darwin/brew:
    cmd: brew install hey
    reference: https://formulae.brew.sh/formula/hey#default
  ubuntu/apt:
    cmd: sudo apt-get install hey
    reference: https://github.com/rakyll/hey
    dsnap: hey
  arch/yay:
    cmd: yay -S hey-bin
    reference: https://aur.archlinux.org/packages/hey-bin
binlist:
- hey

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 88 KB
          rating: 1
          desc:
            cn: 约 88 KB（估算）
            en: ~88 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
