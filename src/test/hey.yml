lang: Go
homepage: https://github.com/rakyll/hey
license: Apache-2.0
desc:
  cn: HTTP 负载生成器，ApacheBench (ab) 的替代工具
  en: HTTP load generator, ApacheBench (ab) replacement
x:
  pkg:
    exist: true
  source: https://github.com/rakyll/hey
rule:
  /x:
    cmd: x pkg use hey
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use hey
    reference: https://github.com/raimon49/asdf-hey
  darwin/brew:
    cmd: brew install hey
    reference: https://formulae.brew.sh/formula/hey#default
  ubuntu/apt:
    cmd: sudo apt-get install hey
    reference: https://github.com/rakyll/hey
    dsnap: hey
  arch/yay:
    cmd: yay -S hey-bin
    reference: https://aur.archlinux.org/packages/hey-bin
binlist:
- hey

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
