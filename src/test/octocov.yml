lang: Go
homepage: https://github.com/k1LoW/octocov
desc:
  cn: 一个用于收集代码指标（代码覆盖率、代码与测试比率、测试执行时间和您自己的自定义指标）的工具包
  en: a toolkit for collecting code metrics (code coverage, code to test ratio, test execution time and your own custom metrics).
x:
  source: https://github.com/k1LoW/octocov
  eget: https://github.com/k1LoW/octocov
rule:
  /eget:
    cmd: x eget k1LoW/octocov
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install k1LoW/tap/octocov
    reference: https://github.com/k1LoW/octocov?tab=readme-ov-file#install
  /go:
    cmd: go install github.com/k1LoW/octocov@latest
    reference: https://github.com/k1LoW/octocov?tab=readme-ov-file#install
    dsnap: github.com/k1LoW/octocov@latest
binlist:
- octocov
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
