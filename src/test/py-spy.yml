lang: Rust
desc:
  cn: Py-Spy 是 Python 程序的抽样探测器
  en: py-spy is a sampling profiler for Python programs
  cs: py-spy je vzorkovací profiler programů napsaných v Pythonu
  de: py-spy ist ein Sampling-Profiler für Python-Programme
  es: py-spy es un perfilador de muestreo para programas en Python
  fr: py-spy est un profileur par échantillonnage pour les programmes Python
  id: py-spy adalah profiler sampling untuk program Python
  it: py-spy è un profiler a campionamento per programmi Python
  ja: py-spy は Python プログラムのサンプリングプロファイラです
  ko: py-spy는 Python 프로그램을 위한 샘플링 프로파일러입니다
  pl: py-spy to profiler próbkujący dla programów w Pythonie
  pt: py-spy é um profiler de amostragem para programas Python
  ro: py-spy este un profiler prin eșantionare pentru programe Python
  ru: py-spy — профилировщик с выборкой для программ на Python
  th: py-spy คือตัวโปรไฟล์แบบสุ่มตัวอย่างสำหรับโปรแกรม Python
  tr: py-spy, Python programları için örnekleme tabanlı bir profilleyicidir
  uk: py-spy — профілювач із вибіркою для програм на Python
  vi: py-spy là trình lấy mẫu hiệu năng cho các chương trình Python
homepage: https://github.com/benfred/py-spy
license: MIT
x:
  source: https://github.com/benfred/py-spy
  eget: benfred/py-spy
  yay: py-spy
  pip: py-spy
rule:
  /x:
    cmd: x pkg use py-spy
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget benfred/py-spy
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install py-spy
    reference: https://github.com/benfred/py-spy?tab=readme-ov-file#installation
    dsnap: py-spy
  arch/yay:
    cmd: yay -S py-spy
    reference: https://aur.archlinux.org/packages/py-spy
binlist:
- py-spy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 2.2 MB
          rating: 1
          desc:
            cn: 约 2.2 MB（估算）
            en: ~2.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
