lang: Go
homepage: https://github.com/goss-org/goss
license: Apache-2.0
desc:
  cn: Goss 是一个基于 YAML 的 serverspec 替代工具，用于验证服务器的配置。它允许用户从当前系统状态生成测试，从而简化了编写测试的过程
  en: Goss is a YAML based serverspec alternative tool for validating a server’s configuration. It eases the process of writing tests by allowing the user to generate tests from the current system state
x:
  source: https://github.com/goss-org/goss
  eget: goss-org/goss
  yay: goss-bin
rule:
  /x:
    cmd: x pkg use goss
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget goss-org/goss
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://goss.rocks/install | sh
    reference: https://github.com/goss-org/goss?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S goss-bin
    reference: https://aur.archlinux.org/packages/goss-bin
binlist:
- goss

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
