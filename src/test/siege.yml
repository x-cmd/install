lang: C
homepage: https://github.com/JoeDog/siege
license: GPL-3.0
desc:
  en: Siege is an open source regression test and benchmark utility
  cn: Siege 是一个开源的回归测试和基准测试工具
x:
  source: https://github.com/JoeDog/siege
rule:
  darwin/brew:
    cmd: brew install siege
    reference: https://formulae.brew.sh/formula/siege#default
  debian/apt:
    cmd: sudo apt-get install siege
    reference: https://command-not-found.com/siege
    dsnap: siege
  ubuntu/apt:
    cmd: sudo apt-get install siege
    reference: https://command-not-found.com/siege
    dsnap: siege
  alpine/apk:
    cmd: sudo apk add siege
    reference: https://command-not-found.com/siege
    dsnap: siege
  arch/pacman:
    cmd: sudo pacman -S siege
    reference: https://command-not-found.com/siege
  kali/apt:
    cmd: sudo apt-get install siege
    reference: https://command-not-found.com/siege
    dsnap: siege
  fedora/dnf:
    cmd: sudo dnf install siege
    reference: https://command-not-found.com/siege
    dsnap: siege
  raspbian/apt:
    cmd: sudo apt-get install siege
    reference: https://command-not-found.com/siege
binlist:
- siege

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
