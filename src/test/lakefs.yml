lang: Go
homepage: https://github.com/treeverse/lakeFS
license: Apache-2.0
desc:
  cn: 一个开源工具，可将对象存储转换为类似 Git 的存储库
  en: an open-source tool that transforms your object storage into a Git-like repository.
x:
  pkg:
    exist: true
  source: https://github.com/treeverse/lakeFS
  eget: https://github.com/treeverse/lakeFS
rule:
  /eget:
    cmd: x eget treeverse/lakeFS
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use lakefs
    reference: https://x-cmd.com/install/
  /docker:
    cmd: "docker run --pull always \\\n    --name lakefs \\\n    -p 8000:8000 \\\n    treeverse/lakefs:latest \\\n    run --quickstart\n"
    reference: https://github.com/treeverse/lakeFS?tab=readme-ov-file#getting-started
  arch/yay:
    cmd: yay -S lakefs-bin
    reference: https://aur.archlinux.org/packages/lakefs-bin
binlist:
- lakefs
