lang: JavaScript
homepage: https://github.com/alexfernandez/loadtest
license: MIT
desc:
  cn: 对选定的 HTTP 或 WebSockets URL 运行负载测试
  en: Runs a load test on the selected HTTP or WebSockets URL
x:
  pkg:
    exist: true
  source: https://github.com/alexfernandez/loadtest
rule:
  /x:
    cmd: x pkg use loadtest
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g loadtest
    reference: https://github.com/alexfernandez/loadtest?tab=readme-ov-file#installation
    dsnap: loadtest
binlist:
- loadtest

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
