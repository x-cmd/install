lang: Go
homepage: https://github.com/open-policy-agent/conftest
desc:
  cn: 使用 Open Policy Agent Rego 查询语言针对结构化配置数据编写测试
  en: Write tests against structured configuration data using the Open Policy Agent Rego query language
  cs: Psát testy proti strukturovaným konfiguračním datům pomocí dotazovacího jazyka Open Policy Agent Rego
  de: Tests gegen strukturierte Konfigurationsdaten mit der Open Policy Agent Abfragesprache Rego schreiben
  es: Escribir pruebas contra datos de configuración estructurados usando el lenguaje de consulta Open Policy Agent Rego
  fr: Écrire des tests sur des données de configuration structurées en utilisant le langage de requête Open Policy Agent Rego
  id: Menulis pengujian terhadap data konfigurasi terstruktur menggunakan bahasa kueri Open Policy Agent Rego
  it: Scrivi test su dati di configurazione strutturati usando il linguaggio di query Open Policy Agent Rego
  ja: Open Policy Agent の Rego クエリ言語を使って構造化設定データに対してテストを書く
  ko: Open Policy Agent Rego 쿼리 언어를 사용하여 구조화된 설정 데이터에 대해 테스트 작성
  pl: Pisanie testów wobec ustrukturyzowanych danych konfiguracyjnych przy użyciu języka zapytań Open Policy Agent Rego
  pt: Escreva testes contra dados de configuração estruturada usando a linguagem de consulta Open Policy Agent Rego
  ro: Scrieți teste pentru date de configurare structurate folosind limbajul de interogare Open Policy Agent Rego
  ru: Написание тестов для структурированных данных конфигурации с помощью языка запросов Open Policy Agent Rego
  th: เขียนการทดสอบกับข้อมูลการกำหนดค่าแบบโครงสร้างโดยใช้ภาษาคิวรีของ Open Policy Agent Rego
  tr: Open Policy Agent Rego sorgu dilini kullanarak yapılandırılmış yapılandırma verilerine karşı testler yazın
  uk: Написання тестів для структурованих даних конфігурації з використанням мови запитів Open Policy Agent Rego
  vi: Viết kiểm thử đối với dữ liệu cấu hình có cấu trúc bằng ngôn ngữ truy vấn Open Policy Agent Rego
x:
  source: https://github.com/open-policy-agent/conftest
  eget: open-policy-agent/conftest
  brew: conftest
  scoop: conftest
  yay: conftest
  asdf: conftest
rule:
  /eget:
    cmd: x eget open-policy-agent/conftest
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use conftest
    reference: https://github.com/looztra/asdf-conftest
  darwin/brew:
    cmd: brew install conftest
    reference: https://www.conftest.dev/install/
  /wget:
    cmd: 'LATEST_VERSION=$(wget -O - "https://api.github.com/repos/open-policy-agent/conftest/releases/latest" | grep ''"tag_name":'' | sed -E ''s/.*"([^"]+)".*/\1/'' | cut -c 2-) \

      && ARCH=$(arch) \

      && SYSTEM=$(uname) \

      && wget "https://github.com/open-policy-agent/conftest/releases/download/v${LATEST_VERSION}/conftest_${LATEST_VERSION}_${SYSTEM}_${ARCH}.tar.gz" \

      && tar xzf conftest_${LATEST_VERSION}_${SYSTEM}_${ARCH}.tar.gz \

      && sudo mv conftest /usr/local/bin

      '
    reference: https://www.conftest.dev/install/
  (win|wsl2)/scoop:
    cmd: x scoop install conftest
    reference: https://www.conftest.dev/install/
  arch/yay:
    cmd: yay -S conftest
    reference: https://aur.archlinux.org/packages/conftest
binlist:
- conftest
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 21 MB
          rating: 2
          desc:
            cn: 安装 21 MB
            en: 21 MB install
        download:
          estimate: 21 MB
          desc:
            cn: 约 21 MB 下载 (linux/x64)
            en: ~21 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
