lang: Rust
homepage: https://github.com/sharkdp/hyperfine
license: Apache-2.0
desc:
  cn: 命令行基准测试工具。
  en: A command-line benchmarking tool.
x:
  pkg:
    exist: true
  source: https://github.com/sharkdp/hyperfine
  eget: https://github.com/sharkdp/hyperfine
rule:
  /x:
    cmd: x pkg use hyperfine
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget sharkdp/hyperfine
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use hyperfine
    reference: https://github.com/volf52/asdf-hyperfine
  darwin/brew:
    cmd: brew install hyperfine
    reference: https://formulae.brew.sh/formula/hyperfine#default
  debian/apt:
    cmd: sudo apt install hyperfine
    reference: https://github.com/sharkdp/hyperfine
    dsnap: hyperfine
  ubuntu/wget:
    cmd: 'wget https://github.com/sharkdp/hyperfine/releases/download/v1.16.1/hyperfine_1.16.1_amd64.deb \

      && sudo dpkg -i hyperfine_1.16.1_amd64.deb

      '
    reference: https://github.com/sharkdp/hyperfine
  alpine/apk:
    cmd: sudo apk add hyperfine
    reference: https://github.com/sharkdp/hyperfine
    dsnap: hyperfine
  arch/pacman:
    cmd: sudo pacman -S hyperfine
    reference: https://github.com/sharkdp/hyperfine
  fedora/dnf:
    cmd: sudo dnf install hyperfine
    reference: https://github.com/sharkdp/hyperfine
    dsnap: hyperfine
  opensuse/zypper:
    cmd: sudo zypper install hyperfine
    reference: https://github.com/sharkdp/hyperfine
  funtoo/emerge:
    cmd: sudo emerge app-benchmarks/hyperfine
    reference: https://github.com/sharkdp/hyperfine
  void/xbps:
    cmd: sudo xbps-install -S hyperfine
    reference: https://github.com/sharkdp/hyperfine
  freebsd/pkg:
    cmd: pkg install hyperfine
    reference: https://github.com/sharkdp/hyperfine
  openbsd/pkg_add:
    cmd: doas pkg_add hyperfine
    reference: https://github.com/sharkdp/hyperfine
  nix/nixpkgs:
    cmd: nix-env -i hyperfine
    reference: https://github.com/sharkdp/hyperfine
  darwin/port:
    cmd: sudo port selfupdate && sudo port install hyperfine
    reference: https://github.com/sharkdp/hyperfine
  (win|wsl2)/winget:
    cmd: x winget install hyperfine
    reference: https://github.com/sharkdp/hyperfine
  (win|wsl2)/scoop:
    cmd: x scoop install hyperfine
    reference: https://github.com/sharkdp/hyperfine
  (win|wsl2)/choco:
    cmd: x choco install hyperfine
    reference: https://github.com/sharkdp/hyperfine
  arch/yay:
    cmd: yay -S hyperfine-git
    reference: https://aur.archlinux.org/packages/hyperfine-git
binlist:
- hyperfine

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
