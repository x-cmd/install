lang: Go
homepage: https://github.com/ffuf/ffuf
license: MIT
desc:
  cn: 用 Go 编写的快速 Web 模糊测试工具
  en: Fast web fuzzer written in Go
x:
  pkg:
    exist: true
  source: https://github.com/ffuf/ffuf
  eget: https://github.com/ffuf/ffuf
rule:
  /x:
    cmd: x pkg use ffuf
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ffuf/ffuf
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install ffuf
    reference: https://formulae.brew.sh/formula/ffuf#default
  /go:
    cmd: go install github.com/ffuf/ffuf/v2@latest
    reference: https://github.com/ffuf/ffuf?tab=readme-ov-file#installation
    dsnap: github.com/ffuf/ffuf/v2
  arch/yay:
    cmd: yay -S ffuf
    reference: https://aur.archlinux.org/packages/ffuf
binlist:
- ffuf

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
