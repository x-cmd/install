lang: Python
homepage: https://github.com/lxgr-linux/pokete
license: GPL-3.0
desc:
  cn: 类似口袋妖怪的游戏
  en: A terminal based Pokemon like game
x:
  source: https://github.com/lxgr-linux/pokete
rule:
  arch/yay:
    cmd: yay -S pokete
    reference: https://aur.archlinux.org/packages/pokete
  /pip:
    cmd: pip install pokete
    reference: https://github.com/lxgr-linux/pokete?tab=readme-ov-file#installation
    dsnap: pokete
binlist:
  - pokete

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
