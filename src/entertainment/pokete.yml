lang: Python
homepage: https://github.com/lxgr-linux/pokete
license: GPL-3.0
desc:
  cn: 类似口袋妖怪的游戏
  en: A terminal based Pokemon like game
x:
  source: https://github.com/lxgr-linux/pokete
  yay: pokete
  pip: pokete
rule:
  arch/yay:
    cmd: yay -S pokete
    reference: https://aur.archlinux.org/packages/pokete
  /pip:
    cmd: pip install pokete
    reference: https://github.com/lxgr-linux/pokete?tab=readme-ov-file#installation
    dsnap: pokete
binlist:
  - pokete

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 44 KB
          rating: 1
          desc:
            cn: 约 44 KB（估算）
            en: ~44 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
