lang: Rust
homepage: https://github.com/hlsxx/tukai
license: MIT
desc:
  cn: 基于终端的打字练习应用程序
  en: Terminal based touch typing application.
  cs: Terminálová aplikace pro trénink psaní na klávesnici.
  de: Terminalbasierte Touch-Typing-Anwendung.
  es: Aplicación de terminal para practicar la escritura al tacto.
  fr: Application de terminal pour s'entraîner à la frappe au toucher.
  id: Aplikasi terminal untuk latihan mengetik dengan sentuhan.
  it: Applicazione da terminale per l'addestramento alla digitazione.
  ja: タッチタイピングを練習するためのターミナルアプリケーション。
  ko: 터미널 기반 터치 타이핑 애플리케이션.
  pl: Terminalowa aplikacja do ćwiczenia pisania bezwzrokowego.
  pt: Aplicativo de terminal para praticar digitação por toque.
  ro: Aplicație de terminal pentru antrenamentul la tastare tactilă.
  ru: Терминальное приложение для тренировки слепой печати.
  th: แอปพลิเคชันเทอร์มินัลสำหรับฝึกพิมพ์แบบสัมผัส
  tr: Dokunarak yazmayı öğrenmek için terminal tabanlı uygulama.
  uk: Термінальний застосунок для тренування сліпого друку.
  vi: Ứng dụng terminal để luyện gõ phím bằng cảm giác
x:
  source: https://github.com/hlsxx/tukai
  pacman: tukai
  cargo: tukai
rule:
  arch/pacman:
    cmd: sudo pacman -S tukai
    reference: https://github.com/hlsxx/tukai?tab=readme-ov-file#arch-linux
  /cargo:
    cmd: cargo install tukai
    reference: https://github.com/hlsxx/tukai?tab=readme-ov-file#installation-from-the-cargo
    dsnap: tukai
binlist:
- tukai

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 89 KB
          rating: 1
          desc:
            cn: 约 89 KB（估算）
            en: ~89 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
