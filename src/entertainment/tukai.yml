lang: Rust
homepage: https://github.com/hlsxx/tukai
license: MIT
desc:
  cn: 基于终端的打字练习应用程序
  en: Terminal based touch typing application.
x:
  source: https://github.com/hlsxx/tukai
rule:
  arch/pacman:
    cmd: sudo pacman -S tukai
    reference: https://github.com/hlsxx/tukai?tab=readme-ov-file#arch-linux
  /cargo:
    cmd: cargo install tukai
    reference: https://github.com/hlsxx/tukai?tab=readme-ov-file#installation-from-the-cargo
    dsnap: tukai
binlist:
- tukai

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 89 KB
          rating: 1
          desc:
            cn: 约 89 KB（估算）
            en: ~89 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
