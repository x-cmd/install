lang: Python
homepage: https://github.com/lutris/lutris
license: GPL-3.0
desc:
  cn: Lutris 是 Linux 平台上的开源游戏平台，致力于帮助玩家安装和畅玩各个时代和平台的电子游戏
  en: Lutris is a video game preservation platform aiming to keep your video game collection up and running for the years to come
  cs: Lutris je platforma pro zachování videohier, jejímž cílem je udržet vaši sbírku her v chodu po nadcházející léta
  de: Lutris ist eine Plattform zur Bewahrung von Videospielen, die darauf abzielt, deine Spielesammlung über die kommenden Jahre hinweg am Laufen zu halten
  es: Lutris es una plataforma de preservación de videojuegos que busca mantener tu colección de videojuegos en marcha durante los próximos años
  fr: Lutris est une plateforme de préservation des jeux vidéo qui vise à garder votre collection de jeux en marche pour les années à venir
  id: Lutris adalah platform preservasi gim video yang bertujuan menjaga koleksi gim Anda tetap berjalan untuk tahun-tahun mendatang
  it: Lutris è una piattaforma di conservazione dei videogiochi che mira a mantenere la tua collezione in funzione per gli anni a venire
  ja: Lutris は、ゲームコレクションを今後とも動かし続けることを目指す、ビデオゲーム保存プラットフォームです
  ko: Lutris는 오랫동안 게임 컬렉션을 계속 사용할 수 있도록 하는 비디오 게임 보존 플랫폼입니다
  pl: Lutris to platforma zachowująca gry wideo, której celem jest utrzymanie Twojej kolekcji gier w działaniu na kolejne lata
  pt: O Lutris é uma plataforma de preservação de videogames que tem como objetivo manter sua coleção de jogos funcionando por muitos anos
  ro: Lutris este o platformă de conservare a jocurilor video, al cărei scop este să îți țină colecția de jocuri în funcțiune pentru anii următori
  ru: Lutris — платформа сохранения видеоигр, созданная для того, чтобы ваша коллекция игр работала и дальше, год за годом
  th: Lutris คือแพลตฟอร์มเพื่อการอนุรักษ์วิดีโอเกม ที่มุ่งหวังให้คอลเลกชันเกมของคุณยังคงใช้งานได้ต่อไปในอนาคต
  tr: Lutris, oyun koleksiyonunuzun gelecek yıllarda da çalışmaya devam etmesini amaçlayan bir video oyunu koruma platformudur
  uk: Lutris — платформа збереження відеоігор, створена для того, щоб ваша колекція ігор і далі працювала роками
  vi: Lutris là nền tảng bảo tồn trò chơi điện tử nhằm giữ bộ sưu tập game của bạn hoạt động mãi về sau
x:
  source: https://github.com/lutris/lutris
  eget: lutris/lutris
  apt: lutris
  dnf: lutris
  pacman: lutris
  zypper: lutris
  eopkg: lutris
  flatpak: flathub
rule:
  /eget:
    cmd: x eget lutris/lutris
    reference: https://x-cmd.com/mod/eget
  /flatpak:
    cmd: flatpak install flathub --user -y net.lutris.Lutris
    reference: https://lutris.net/downloads
  debian/apt:
    cmd: 'echo "deb [signed-by=/etc/apt/keyrings/lutris.gpg] https://download.opensuse.org/repositories/home:/strycore/Debian_12/ ./" | sudo tee /etc/apt/sources.list.d/lutris.list > /dev/null && \

      wget -q -O- https://download.opensuse.org/repositories/home:/strycore/Debian_12/Release.key | gpg --dearmor | sudo tee /etc/apt/keyrings/lutris.gpg > /dev/null && \

      sudo apt update && \

      sudo apt install lutris && \

      '
    reference: https://lutris.net/downloads
    dsnap: lutris
  fedora/dnf:
    cmd: sudo dnf install lutris
    reference: https://lutris.net/downloads
    dsnap: lutris
  opensuse/zypper:
    cmd: sudo zypper in lutris
    reference: https://lutris.net/downloads
  arch/pacman:
    cmd: sudo pacman -S lutris
    reference: https://lutris.net/downloads
  manjaro/pacman:
    cmd: sudo pacman -S lutris
    reference: https://lutris.net/downloads
  solus/eopkg:
    cmd: sudo eopkg install lutris
    reference: https://lutris.net/downloads
binlist:
- lutris

