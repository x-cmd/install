lang: Python
homepage: https://github.com/lutris/lutris
license: GPL-3.0
desc:
  cn: Lutris 是 Linux 平台上的开源游戏平台，致力于帮助玩家安装和畅玩各个时代和平台的电子游戏
  en: Lutris is a video game preservation platform aiming to keep your video game collection up and running for the years to come
x:
  source: https://github.com/lutris/lutris
  eget: https://github.com/lutris/lutris
rule:
  /eget:
    cmd: x eget lutris/lutris
    reference: https://x-cmd.com/mod/eget
  /flatpak:
    cmd: flatpak install flathub --user -y net.lutris.Lutris
    reference: https://lutris.net/downloads
  debian/apt:
    cmd: 'echo "deb [signed-by=/etc/apt/keyrings/lutris.gpg] https://download.opensuse.org/repositories/home:/strycore/Debian_12/ ./" | sudo tee /etc/apt/sources.list.d/lutris.list > /dev/null && \

      wget -q -O- https://download.opensuse.org/repositories/home:/strycore/Debian_12/Release.key | gpg --dearmor | sudo tee /etc/apt/keyrings/lutris.gpg > /dev/null && \

      sudo apt update && \

      sudo apt install lutris && \

      '
    reference: https://lutris.net/downloads
    dsnap: lutris
  fedora/dnf:
    cmd: sudo dnf install lutris
    reference: https://lutris.net/downloads
    dsnap: lutris
  opensuse/zypper:
    cmd: sudo zypper in lutris
    reference: https://lutris.net/downloads
  arch/pacman:
    cmd: sudo pacman -S lutris
    reference: https://lutris.net/downloads
  manjaro/pacman:
    cmd: sudo pacman -S lutris
    reference: https://lutris.net/downloads
  solus/eopkg:
    cmd: sudo eopkg install lutris
    reference: https://lutris.net/downloads
binlist:
- lutris
