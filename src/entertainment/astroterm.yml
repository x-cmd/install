lang: 'C'
homepage: 'https://github.com/da-luce/astroterm'
license: 'MIT'
desc:
  cn: 终端中的天文馆:探索恒星、行星、星座等,无需望远镜
  en: 'A planetarium for your terminal! Explore stars, planets, constellations, and more, all rendered right in the command line—no telescope required. ✨🪐'
x:
  source: https://github.com/da-luce/astroterm
  eget: https://github.com/da-luce/astroterm
rule:
  /eget:
    cmd: x eget da-luce/astroterm
    reference: https://github.com/da-luce/astroterm
binlist:
  - 'astroterm'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 247 KB
          rating: 1
          desc:
            cn: 约 247 KB（估算）
            en: ~247 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
