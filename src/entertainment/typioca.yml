lang: Go
homepage: https://github.com/bloznelis/typioca
license: MIT
desc:
  cn: 终端中舒适的打字速度测试器。
  en: Cozy typing speed tester in terminal.
  cs: Příjemný tester rychlosti psaní v terminálu.
  de: Gemütlicher Tippgeschwindigkeitstest im Terminal.
  es: Comodidadador prueba de velocidad de escritura en la terminal.
  fr: Test de vitesse de frappe convivial dans le terminal.
  id: Penguji kecepatan mengetik yang nyaman di terminal.
  it: Comodo test di velocità di scrittura nel terminale.
  ja: ターミナルで気楽に使えるタイピング速度テスター。
  ko: 터미널에서 편안하게 사용할 수 있는 타이핑 속도 테스터.
  pl: Przyjemny tester prędkości pisania w terminalu.
  pt: Testador de velocidade de digitação acolhedor no terminal.
  ro: Tester confortabil de viteză de scriere în terminal.
  ru: Уютный тестер скорости набора текста в терминале.
  th: เครื่องทดสอบความเร็วในการพิมพ์ที่ใช้งานสบายในเทอร์มินัล
  tr: Terminalde rahat kullanılabilen yazma hızı test aracı.
  uk: Затишний тестер швидкості набору тексту в терміналі.
  vi: Trình kiểm tra tốc độ gõ phím dễ chịu trong terminal
x:
  source: https://github.com/bloznelis/typioca
  eget: bloznelis/typioca
  brew: typioca
  zypper: typioca
  xbps: typioca
  scoop: typioca
  winget: bloznelis.typioca
  yay: typioca-git
  go: github.com/bloznelis/typioca@latest
rule:
  /eget:
    cmd: x eget bloznelis/typioca
    reference: https://x-cmd.com/mod/eget
  /yay:
    cmd: yay -S typioca-git
    reference: https://github.com/bloznelis/typioca?tab=readme-ov-file#aur
  nix/nix-shell:
    cmd: nix-shell -p typioca
    reference: https://github.com/bloznelis/typioca
  /brew:
    cmd: brew install typioca
    reference: https://github.com/bloznelis/typioca?tab=readme-ov-file#homebrew
  opensuse/zypper:
    cmd: sudo zypper install typioca
    reference: https://github.com/bloznelis/typioca?tab=readme-ov-file#opensuse-tumbleweed
  (win|wsl2)/scoop:
    cmd: scoop install typioca
    reference: https://github.com/bloznelis/typioca?tab=readme-ov-file#scoop
  (win|wsl2)/winget:
    cmd: winget install bloznelis.typioca
    reference: https://github.com/bloznelis/typioca?tab=readme-ov-file#winget
  void/xbps:
    cmd: sudo xbps-install typioca
    reference: https://github.com/bloznelis/typioca?tab=readme-ov-file#void-linux
  /go:
    cmd: go install github.com/bloznelis/typioca@latest
    reference: https://github.com/bloznelis/typioca?tab=readme-ov-file#go
    dsnap: github.com/bloznelis/typioca@latest
binlist:
- typioca

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
