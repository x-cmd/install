lang: Shell
homepage: https://github.com/contentsviewer/shtris
license: MIT
desc:
  cn: 一个由 shell 实现的俄罗斯方块游戏
  en: A Tetris game implemented by a shell
x:
  pkg:
    exist: true
  source: https://github.com/contentsviewer/shtris
rule:
  /x:
    cmd: x pkg use shtris
    reference: https://x-cmd.com/install/
  /wget:
    cmd: 'wget https://raw.githubusercontent.com/ContentsViewer/shtris/v3.0.0/shtris \

      && chmod +x shtris \

      && ./shtris

      '
    reference: https://github.com/ContentsViewer/shtris#usage
binlist:
- shtris

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
