lang: Shell
homepage: https://github.com/contentsviewer/shtris
license: MIT
desc:
  cn: 一个由 shell 实现的俄罗斯方块游戏
  en: A Tetris game implemented by a shell
  cs: Hra Tetris implementovaná v shellu
  de: Ein Tetris-Spiel, in Shell implementiert
  es: Un juego de Tetris implementado en shell
  fr: Un jeu de Tetris implémenté en shell
  id: Permainan Tetris yang diimplementasikan dengan shell
  it: Un gioco di Tetris implementato in shell
  ja: shell で実装されたテトリスゲーム
  ko: shell로 구현된 테트리스 게임
  pl: Gra Tetris zaimplementowana w shellu
  pt: Um jogo Tetris implementado em shell
  ro: Un joc Tetris implementat în shell
  ru: Игра «Тетрис», реализованная на shell
  th: เกม Tetris ที่เขียนด้วย shell
  tr: Shell ile uygulanmış bir Tetris oyunu
  uk: Гра «Тетріс», реалізована на shell
  vi: Trò chơi Tetris được viết bằng shell
x:
  source: https://github.com/contentsviewer/shtris
rule:
  /x:
    cmd: x pkg use shtris
    reference: https://x-cmd.com/install/
  /wget:
    cmd: 'wget https://raw.githubusercontent.com/ContentsViewer/shtris/v3.0.0/shtris \

      && chmod +x shtris \

      && ./shtris

      '
    reference: https://github.com/ContentsViewer/shtris#usage
binlist:
- shtris

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
