lang: Shell
homepage: https://github.com/contentsviewer/shtris
license: MIT
desc:
  cn: 一个由 shell 实现的俄罗斯方块游戏
  en: A Tetris game implemented by a shell
x:
  pkg:
    exist: true
  source: https://github.com/contentsviewer/shtris
rule:
  /x:
    cmd: x pkg use shtris
    reference: https://x-cmd.com/install/
  /wget:
    cmd: 'wget https://raw.githubusercontent.com/ContentsViewer/shtris/v3.0.0/shtris \

      && chmod +x shtris \

      && ./shtris

      '
    reference: https://github.com/ContentsViewer/shtris#usage
binlist:
- shtris
