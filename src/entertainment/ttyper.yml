lang: Rust
homepage: https://github.com/max-niederman/ttyper
license: MIT
desc:
  cn: ttyper 是一个使用 Rust 和 Ratatui 构建的基于终端的打字测试
  en: ttyper is a terminal-based typing test built with Rust and Ratatui
x:
  source: https://github.com/max-niederman/ttyper
  eget: https://github.com/max-niederman/ttyper
rule:
  /eget:
    cmd: x eget max-niederman/ttyper
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install ttyper
    reference: https://github.com/max-niederman/ttyper?tab=readme-ov-file#cargo
    dsnap: ttyper
  arch/pacman:
    cmd: sudo pacman -S ttyper
    reference: https://github.com/max-niederman/ttyper?tab=readme-ov-file#arch-linux
  /nix-env:
    cmd: nix-env -iA nixpkgs.ttyper
    reference: https://github.com/max-niederman/ttyper?tab=readme-ov-file#nix
  (win|wsl2)/scoop:
    cmd: x scoop install ttyper
    reference: https://github.com/max-niederman/ttyper?tab=readme-ov-file#scoop
binlist:
- ttyper

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
