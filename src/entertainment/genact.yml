lang: Rust
homepage: https://github.com/svenstaro/genact
license: MIT
desc:
  cn: 一个无意义的活动发生器
  en: A nonsense activity generator
x:
  pkg:
    exist: true
  source: https://github.com/svenstaro/genact
  eget: https://github.com/svenstaro/genact
rule:
  /eget:
    cmd: x eget svenstaro/genact
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use genact
    reference: https://x-cmd.com/install/
  freebsd/pkg:
    cmd: pkg install genact
    reference: https://github.com/svenstaro/genact?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install genact
    reference: https://github.com/svenstaro/genact?tab=readme-ov-file#installation
  /port:
    cmd: sudo port install genact
    reference: https://github.com/svenstaro/genact?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: x scoop install genact
    reference: https://github.com/svenstaro/genact?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install genact
    reference: https://github.com/svenstaro/genact?tab=readme-ov-file#installation
    dsnap: genact
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/svenstaro/genact/releases/download/v1.3.0/genact-1.3.0-x86_64-pc-windows-msvc.exe -OutFile genact-1.3.0-x86_64-pc-windows-msvc.exe
    reference: https://github.com/svenstaro/genact?tab=readme-ov-file#installation
  linux/curl:
    cmd: 'curl -L https://github.com/svenstaro/genact/releases/download/v1.3.0/genact-1.3.0-x86_64-unknown-linux-gnu -o genact-linux && \

      chmod +x genact-linux

      '
    reference: https://github.com/svenstaro/genact?tab=readme-ov-file#installation
  linux/wget:
    cmd: 'wget https://github.com/svenstaro/genact/releases/download/v1.3.0/genact-1.3.0-x86_64-unknown-linux-gnu -o genact-linux && \

      cbmod +x genact-linux

      '
    reference: https://github.com/svenstaro/genact?tab=readme-ov-file#installation
  darwin/curl:
    cmd: 'curl -L https://github.com/svenstaro/genact/releases/download/v1.3.0/genact-1.3.0-x86_64-apple-darwin -o genact-osx && \

      chmod +x genact-osx

      '
    reference: https://github.com/svenstaro/genact?tab=readme-ov-file#installation
binlist:
- genact
