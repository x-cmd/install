lang: Rust
homepage: https://github.com/ricott1/rebels-in-the-sky
license: GPL-3.0
desc:
  cn: 太空海盗穿越银河打篮球的 P2P 终端游戏
  en: P2P terminal game about spacepirates playing basketball across the galaxy
x:
  source: https://github.com/ricott1/rebels-in-the-sky
  eget: https://github.com/ricott1/rebels-in-the-sky
rule:
  /eget:
    cmd: x eget ricott1/rebels-in-the-sky
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: sudo pacman -S rebels-in-the-sky
    reference: https://github.com/ricott1/rebels-in-the-sky?tab=readme-ov-file#arch-linux
binlist:
- rebels-in-the-sky

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
