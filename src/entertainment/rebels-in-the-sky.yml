lang: Rust
homepage: https://github.com/ricott1/rebels-in-the-sky
license: GPL-3.0
desc:
  cn: 太空海盗穿越银河打篮球的 P2P 终端游戏
  en: P2P terminal game about spacepirates playing basketball across the galaxy
  cs: P2P terminálová hra o kosmických pirátech, kteří hrají basket přes celou galaxii
  de: Ein P2P-Terminalspiel über kosmische Piraten, die Basketball über die ganze Galaxis spielen
  es: Un juego de terminal P2P sobre piratas espaciales que juegan al baloncesto a través de la galaxia
  fr: Un jeu terminal P2P sur des pirates de l'espace qui jouent au basket à travers la galaxie
  id: Permainan terminal P2P tentang bajak laut ruang yang memutar basket melintasi galaksi
  it: Un gioco da terminale P2P sui pirati spaziali che giocano a basket attraverso la galassia
  ja: 銀河を股かってバスケットボールをする宇宙海賊の P2P ターミナルゲーム
  ko: 은하계를 가로질러 농구를 하는 우주 해적에 대한 P2P 터미널 게임
  pl: Terminalowa gra P2P o kosmicznych piratach, którzy grają w koszykówkę w całej galaktyce
  pt: Um jogo de terminal P2P sobre piratas espaciais que jogam basquete pela galáxia
  ro: Un joc de terminal P2P despre pirați spațiali care joacă baschet de-a lungul galaxiei
  ru: P2P-игра в терминале про космических пиратов, играющих в баскетбол по всей галактике
  th: เกมเทอร์มินัล P2P เกี่ยวกับโจรสีเวลาที่เล่นบาสเกตอบอลทั่วทั้งกาแล็กซี
  tr: Galaksi boyunca basketbol oynayan uzay korsanları hakkında P2P terminal oyunu
  uk: P2P-гра в терміналі про космічних піратів, що грають у баскетбол по всій галактиці
  vi: Trò chơi terminal P2P về những tên cướp vũ trụ chơi bóng rổ khắp thiên hà
x:
  source: https://github.com/ricott1/rebels-in-the-sky
  eget: ricott1/rebels-in-the-sky
  pacman: rebels-in-the-sky
rule:
  /eget:
    cmd: x eget ricott1/rebels-in-the-sky
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: sudo pacman -S rebels-in-the-sky
    reference: https://github.com/ricott1/rebels-in-the-sky?tab=readme-ov-file#arch-linux
binlist:
- rebels-in-the-sky

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
