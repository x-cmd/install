lang: C++
homepage: https://github.com/Baystation12/Baystation12
license: AGPL-3.0
desc:
  cn: 《Dwarf Fortress》（矮人要塞），一款极具深度的建造与模拟游戏，以复杂的系统与自由度闻名
  en: Dwarf Fortress is a deeply complex building and simulation game, known for its intricate systems and high player freedom.
x:
  source: https://github.com/Baystation12/Baystation12
rule:
  (win|wsl2)/scoop:
    cmd: |
      x scoop bucket add games
      x scoop install games/dwarf-fortress
    reference: https://scoop.sh/#/apps?q=dwarf-fortress
  ubuntu/apt:
    cmd: apt install dwarf-fortress
    reference: https://packages.ubuntu.com/oracular/dwarf-fortress
    dsnap: dwarf-fortress
binlist:
  - dwarffortress
