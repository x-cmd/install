lang: C++
homepage: https://github.com/Baystation12/Baystation12
license: AGPL-3.0
desc:
  cn: 《Dwarf Fortress》（矮人要塞），一款极具深度的建造与模拟游戏，以复杂的系统与自由度闻名
  en: Dwarf Fortress is a deeply complex building and simulation game, known for its intricate systems and high player freedom.
  cs: Dwarf Fortress je hluboce komplexní hrací a simulační hra, proslulá složitými systémy a vysokou svobodou hráče.
  de: Dwarf Fortress ist ein tiefgreifend komplexes Bau- und Simulationsspiel, das für seine intricaten Systeme und die hohe Freiheit der Spieler bekannt ist.
  es: Dwarf Fortress es un juego de construcción y simulación profundamente complejo, conocido por sus sistemas intrincados y la gran libertad del jugador.
  fr: Dwarf Fortress est un jeu de construction et de simulation profondément complexe, réputé pour ses systèmes complexes et la grande liberté offerte aux joueurs.
  id: Dwarf Fortress adalah permainan pembangunan dan simulasi yang sangat kompleks, terkenal dengan sistemnya yang rumit dan kebebasan pemain yang tinggi.
  it: Dwarf Fortress è un gioco di costruzione e simulazione profondamente complesso, noto per i suoi sistemi intricati e l'elevata libertà del giocatore.
  ja: Dwarf Fortress は、複雑なシステムと高い自由度で知られる、極めて作り込まれた建造・シミュレーションゲームです。
  ko: Dwarf Fortress는 정교한 시스템과 높은 자유도로 유명한, 매우 복잡한 건설 및 시뮬레이션 게임입니다.
  pl: Dwarf Fortress to głęboko złożona gra budowlano-symulacyjna, znana z rozbudowanych systemów i dużej swobody gracza.
  pt: Dwarf Fortress é um jogo de construção e simulação profundamente complexo, conhecido por seus sistemas intrincados e grande liberdade ao jogador.
  ro: Dwarf Fortress este un joc de construcție și simulare profund complex, cunoscut prin sistemele sale intricat și marea libertate oferită jucătorului.
  ru: Dwarf Fortress — глубоко сложная игра-строительство и симулятор, известная своими запутанными системами и большими свободами игрока.
  th: Dwarf Fortress เป็นเกมสร้างและจำลองที่ซับซ้อนอย่างลึกลัด รู้จักกันด้วยระบบที่ยากจะเข้าใจและอิสระสูงของผู้เล่น
  tr: Dwarf Fortress, karmaşık sistemleri ve oyuncuya verdiği yüksek özgürlük ile tanınan, son derece karmaşık bir inşaat ve simülasyon oyunudur.
  uk: Dwarf Fortress — надзвичайно складна гра-будівельник і симулятор, відома своїми заплутаними системами та великою свободою гравця.
  vi: Dwarf Fortress là trò chơi xây dựng và mô phỏng cực kỳ phức tạp, nổi tiếng với hệ thống rối rắm và sự tự do cao cho người chơi.
x:
  source: https://github.com/Baystation12/Baystation12
  apt: dwarf-fortress
  scoop: games/dwarf-fortress
rule:
  (win|wsl2)/scoop:
    cmd: |
      x scoop bucket add games
      x scoop install games/dwarf-fortress
    reference: https://scoop.sh/#/apps?q=dwarf-fortress
  ubuntu/apt:
    cmd: apt install dwarf-fortress
    reference: https://packages.ubuntu.com/oracular/dwarf-fortress
    dsnap: dwarf-fortress
binlist:
  - dwarffortress

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: partial
    linux: partial
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
