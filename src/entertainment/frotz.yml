lang: C
homepage: https://davidgriffith.gitlab.io/frotz/
desc:
  cn: Infocom 游戏和其他 Z-machine 游戏的解释器
  en: An interpreter for Infocom games and other Z-machine games.
rule:
  darwin/brew:
    cmd: brew install frotz
    reference: https://formulae.brew.sh/formula/frotz#default
  alpine/apk:
    cmd: apk add frotz
    reference: https://pkgs.alpinelinux.org/package/edge/community/x86_64/frotz
    dsnap: frotz
  ubuntu/apt:
    cmd: apt install frotz
    reference: https://packages.ubuntu.com/oracular/frotz
    dsnap: frotz
  fedora/dnf:
    cmd: dnf install frotz
    reference: https://packages.fedoraproject.org/pkgs/frotz/frotz/
    dsnap: frotz
  arch/pacman:
    cmd: pacman -S frotz
    reference: https://archlinux.org/packages/extra/x86_64/frotz/
binlist:
- frotz
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
