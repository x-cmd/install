lang: Python
homepage: https://github.com/adameste/anidbcli
license: MIT
desc:
  cn: Anidbcli 是一个简单的命令行界面，用于在本地计算机或 NAS 上管理动漫集合（仅使用 SSH）
  en: Anidbcli is a simple command line interface for managing your anime collection on your local computer or NAS (using only ssh)
x:
  source: https://github.com/adameste/anidbcli
  pip: anidbcli
rule:
  /x:
    cmd: x pkg use anidbcli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install anidbcli
    reference: https://github.com/adameste/anidbcli?tab=readme-ov-file#installation
    dsnap: anidbcli
binlist:
- anidbcli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
