lang: 'Rust'
homepage: https://github.com/thomas-mauran/chess-tui
license: 'MIT'
desc:
  cn: 在任意终端下棋:Rust TUI、Stockfish、Lichess
  en: 'Play chess in any terminal. Rust TUI, Stockfish, Lichess.'
  cs: Hrajte šachy v jakémkoli terminálu. Rust TUI, Stockfish, Lichess.
  de: Spiele Schach in jedem Terminal. Rust TUI, Stockfish, Lichess.
  es: Juega al ajedrez en cualquier terminal. Rust TUI, Stockfish, Lichess.
  fr: Jouez aux échecs dans n'importe quel terminal. Rust TUI, Stockfish, Lichess.
  id: Main catur di terminal mana pun. Rust TUI, Stockfish, Lichess.
  it: Gioca a scacchi in qualsiasi terminale. Rust TUI, Stockfish, Lichess.
  ja: どんなターミナルでもチェスを遊べます。Rust TUI、Stockfish、Lichess。
  ko: 어떤 터미널에서든 체스를 두세요. Rust TUI, Stockfish, Lichess.
  pl: Graj w szachy w dowolnym terminalu. Rust TUI, Stockfish, Lichess.
  pt: Jogue xadrez em qualquer terminal. Rust TUI, Stockfish, Lichess.
  ro: Joacă șah în orice terminal. Rust TUI, Stockfish, Lichess.
  ru: Играйте в шахматы в любом терминале. Rust TUI, Stockfish, Lichess.
  th: เล่นหมากรุกในเทอร์มินัลใดก็ได้ Rust TUI, Stockfish, Lichess.
  tr: Herhangi bir terminalde satranç oynayın. Rust TUI, Stockfish, Lichess.
  uk: Грайте в шахи в будь-якому терміналі. Rust TUI, Stockfish, Lichess.
  vi: Chơi cờ vua trên mọi terminal. Rust TUI, Stockfish, Lichess.
x:
  source: https://github.com/thomas-mauran/chess-tui
  eget: thomas-mauran/chess-tui
  brew: thomas-mauran/tap/chess-tui
  cargo: chess-tui
rule:
  /cargo:
    cmd: 'cargo install chess-tui'
    reference: https://github.com/thomas-mauran/chess-tui
  darwin/brew:
    cmd: 'brew install thomas-mauran/tap/chess-tui'
    reference: https://github.com/thomas-mauran/chess-tui
  /eget:
    cmd: x eget thomas-mauran/chess-tui
    reference: https://github.com/thomas-mauran/chess-tui
binlist:
- 'chess-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
