lang: 'Rust'
homepage: https://github.com/thomas-mauran/chess-tui
license: 'MIT'
desc:
  cn: 在任意终端下棋:Rust TUI、Stockfish、Lichess
  en: 'Play chess in any terminal. Rust TUI, Stockfish, Lichess.'
x:
  source: https://github.com/thomas-mauran/chess-tui
  eget: https://github.com/thomas-mauran/chess-tui
rule:
  /cargo:
    cmd: 'cargo install chess-tui'
    reference: https://github.com/thomas-mauran/chess-tui
  darwin/brew:
    cmd: 'brew install thomas-mauran/tap/chess-tui'
    reference: https://github.com/thomas-mauran/chess-tui
  /eget:
    cmd: x eget thomas-mauran/chess-tui
    reference: https://github.com/thomas-mauran/chess-tui
binlist:
- 'chess-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
