lang: Rust
homepage: https://github.com/ckaznable/poketex
license: MIT
desc:
  cn: 基于 TUI（终端用户界面）的简单图鉴
  en: Simple Pokedex based on TUI(Terminal User Interface)
  cs: Jednoduchý Pokedex založený na TUI (uživatelském rozhraní terminálu)
  de: Ein einfaches Pokédex auf Basis von TUI (Terminal User Interface)
  es: Simple Pokedex basado en TUI (Terminal User Interface)
  fr: Un simple Pokédex basé sur une TUI (interface utilisateur terminal)
  id: Pokedex sederhana berbasis TUI (Terminal User Interface)
  it: Semplice Pokédex basato su TUI (interfaccia utente da terminale)
  ja: TUI（ターミナルユーザーインターフェース）によるシンプルな pokedex
  ko: TUI(터미널 사용자 인터페이스) 기반의 간단한 포켓덱
  pl: Prosty Pokedex oparty na TUI (interfejsie użytkownika terminala)
  pt: Pokedex simples baseado em TUI (Terminal User Interface)
  ro: Un Pokedex simplu bazat pe TUI (Terminal User Interface)
  ru: Простой Pokedex на основе TUI (терминального пользовательского интерфейса)
  th: Pokedex ง่าย ๆ ที่สร้างบนพื้นฐานของ TUI (Terminal User Interface)
  tr: TUI (Terminal User Interface) tabanlı basit bir Pokédex
  uk: Простий Pokedex на основі TUI (термінального користувацького інтерфейсу)
  vi: Pokédex đơn giản dựa trên TUI (Terminal User Interface)
x:
  source: https://github.com/ckaznable/poketex
  eget: ckaznable/poketex
  pacman: poketex
  cargo: poketex
rule:
  /eget:
    cmd: x eget ckaznable/poketex
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install poketex --locked
    reference: https://github.com/ckaznable/poketex?tab=readme-ov-file#install-from-cratesio
    dsnap: poketex
  arch/pacman:
    cmd: sudo pacman -S poketex
    reference: https://github.com/ckaznable/poketex?tab=readme-ov-file#install-from-the-aur
binlist:
- poketex

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
