lang: Rust
homepage: https://github.com/ckaznable/poketex
license: MIT
desc:
  cn: 基于 TUI（终端用户界面）的简单图鉴
  en: Simple Pokedex based on TUI(Terminal User Interface)
x:
  source: https://github.com/ckaznable/poketex
  eget: https://github.com/ckaznable/poketex
rule:
  /eget:
    cmd: x eget ckaznable/poketex
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install poketex --locked
    reference: https://github.com/ckaznable/poketex?tab=readme-ov-file#install-from-cratesio
    dsnap: poketex
  arch/pacman:
    cmd: sudo pacman -S poketex
    reference: https://github.com/ckaznable/poketex?tab=readme-ov-file#install-from-the-aur
binlist:
- poketex

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
