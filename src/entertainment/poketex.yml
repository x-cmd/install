lang: Rust
homepage: https://github.com/ckaznable/poketex
license: MIT
desc:
  cn: 基于 TUI（终端用户界面）的简单图鉴
  en: Simple Pokedex based on TUI(Terminal User Interface)
x:
  source: https://github.com/ckaznable/poketex
  eget: https://github.com/ckaznable/poketex
rule:
  /eget:
    cmd: x eget ckaznable/poketex
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install poketex --locked
    reference: https://github.com/ckaznable/poketex?tab=readme-ov-file#install-from-cratesio
    dsnap: poketex
  arch/pacman:
    cmd: sudo pacman -S poketex
    reference: https://github.com/ckaznable/poketex?tab=readme-ov-file#install-from-the-aur
binlist:
- poketex

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 51 KB
          rating: 1
          desc:
            cn: 约 51 KB（估算）
            en: ~51 KB estimated
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
