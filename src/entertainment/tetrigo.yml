lang: Go
homepage: https://github.com/Broderick-Westrope/tetrigo
license: GPL-3.0
desc:
  cn: 俄罗斯方块的 Golang 实现，遵循官方 2009 年俄罗斯方块设计指南 。
  en: A Golang implementation of Tetris, following the official 2009 Tetris Design Guideline.
x:
  source: https://github.com/Broderick-Westrope/tetrigo
  eget: https://github.com/Broderick-Westrope/tetrigo
rule:
  /eget:
    cmd: x eget Broderick-Westrope/tetrigo
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S tetrigo-bin
    reference: https://aur.archlinux.org/packages/tetrigo-bin
  /go:
    cmd: go install github.com/Broderick-Westrope/tetrigo/cmd/tetrigo@v0.1.6
    reference: https://github.com/Broderick-Westrope/tetrigo?tab=readme-ov-file#build-from-source
    dsnap: github.com/Broderick-Westrope/tetrigo/cmd/tetrigo@v0.1.6
binlist:
- tetrigo

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 517 KB
          rating: 1
          desc:
            cn: 约 517 KB（估算）
            en: ~517 KB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
