lang: Go
homepage: https://github.com/Broderick-Westrope/tetrigo
license: GPL-3.0
desc:
  cn: 俄罗斯方块的 Golang 实现，遵循官方 2009 年俄罗斯方块设计指南 。
  en: A Golang implementation of Tetris, following the official 2009 Tetris Design Guideline.
  cs: Implementace hry Tetris v Golang podle oficiálního návrhového dokumentu Tetris z roku 2009.
  de: Eine Golang-Implementierung von Tetris, die dem offiziellen Tetris Design Guideline von 2009 folgt.
  es: Una implementación en Golang de Tetris, siguiendo la guía oficial de diseño de Tetris de 2009.
  fr: Une implémentation Golang de Tetris, suivant le guide officiel de conception de Tetris de 2009.
  id: Implementasi Tetris dengan Golang, mengikuti Panduan Desain Tetris resmi tahun 2009.
  it: Un'implementazione Golang di Tetris, che segue le linee guida di design ufficiali di Tetris del 2009.
  ja: Golang によるテトリスの実装で、2009 年の公式 Tetris Design Guideline に従っています。
  ko: 2009년 공식 Tetris 디자인 가이드라인을 따르는 Golang 기반 테트리스 구현입니다.
  pl: Implementacja Tetris w Golang, zgodna z oficjalnym wytycznym projektowania Tetris z 2009 roku.
  pt: Uma implementação de Tetris em Golang, seguindo o guia de design oficial do Tetris de 2009.
  ro: O implementare Tetris în Golang, care urmează ghidul oficial de design Tetris din 2009.
  ru: Реализация игры «Тетрис» на Golang, следующая официальному руководству по дизайну Tetris 2009 года.
  th: การพัฒนาเกม Tetris ด้วย Golang ตามแนวทางการออกแบบ Tetris อย่างเป็นทางการปี 2009
  tr: 2009 tarihli resmî Tetris Tasarım Kılavuzu'na uygun Golang ile bir Tetris uygulaması.
  uk: Реалізація гри «Тетріс» на Golang, що відповідає офіційному посібнику з дизайну Tetris 2009 року.
  vi: Bản triển khai Tetris bằng Golang, tuân theo hướng dẫn thiết kế Tetris chính thức năm 2009.
x:
  source: https://github.com/Broderick-Westrope/tetrigo
  eget: Broderick-Westrope/tetrigo
  yay: tetrigo-bin
  go: github.com/Broderick-Westrope/tetrigo/cmd/tetrigo@v0.1.6
rule:
  /eget:
    cmd: x eget Broderick-Westrope/tetrigo
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S tetrigo-bin
    reference: https://aur.archlinux.org/packages/tetrigo-bin
  /go:
    cmd: go install github.com/Broderick-Westrope/tetrigo/cmd/tetrigo@v0.1.6
    reference: https://github.com/Broderick-Westrope/tetrigo?tab=readme-ov-file#build-from-source
    dsnap: github.com/Broderick-Westrope/tetrigo/cmd/tetrigo@v0.1.6
binlist:
- tetrigo

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
