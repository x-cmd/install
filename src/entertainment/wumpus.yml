lang: C
homepage: http://www.catb.org/~esr/wumpus/
desc:
  en: Exact clone of the ancient BASIC Hunt the Wumpus game
  cn: 古代 BASIC 狩猎的精确克隆 Wumpus 游戏
rule:
  darwin/brew:
    cmd: brew install wumpus
    reference: https://formulae.brew.sh/formula/wumpus#default
binlist:
- wumpus
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
