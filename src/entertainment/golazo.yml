lang: 'Go'
homepage: https://github.com/0xjuanma/golazo
license: 'MIT'
desc:
  cn: 终端里的足球赛事追踪工具,Go 编写的极简 TUI,关注实时和近期比赛
  en: 'The beautiful game in your terminal. Minimal TUI app to keep up with live & recent football/soccer matches written in Go.'
x:
  source: https://github.com/0xjuanma/golazo
  eget: https://github.com/0xjuanma/golazo
rule:
  darwin/brew:
    cmd: 'brew install 0xjuanma/tap/golazo'
    reference: https://github.com/0xjuanma/golazo
  /eget:
    cmd: x eget 0xjuanma/golazo
    reference: https://github.com/0xjuanma/golazo
binlist:
  - 'golazo'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.4 MB
          rating: 1
          desc:
            cn: 约 2.4 MB（估算）
            en: ~2.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
