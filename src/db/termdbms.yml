lang: Go
homepage: https://github.com/mathaou/termdbms
license: MIT
desc:
  en: A TUI for viewing and editing databases
  cn: 用于查看和编辑数据库的图形用户界面（TUI）
  cs: TUI pro prohlížení a úpravu databází
  de: Ein TUI zum Anzeigen und Bearbeiten von Datenbanken
  es: Un TUI para ver y editar bases de datos
  fr: Un TUI pour consulter et modifier des bases de données
  id: TUI untuk melihat dan mengedit basis data
  it: Un TUI per visualizzare e modificare database
  ja: データベースの閲覧と編集のための TUI
  ko: 데이터베이스를 조회하고 편집하기 위한 TUI
  pl: TUI do przeglądania i edycji baz danych
  pt: Um TUI para visualizar e editar bancos de dados
  ro: Un TUI pentru vizualizarea și editarea bazelor de date
  ru: TUI для просмотра и редактирования баз данных
  th: TUI สำหรับดูและแก้ไขฐานข้อมูล
  tr: Veritabanlarını görüntülemek ve düzenlemek için TUI
  uk: TUI для перегляду та редагування баз даних
  vi: Giao diện TUI để xem và chỉnh sửa cơ sở dữ liệu
x:
  source: https://github.com/mathaou/termdbms
  pacman: termdbms-git
  yay: termdbms-git
  go: github.com/mathaou/termdbms@latest
rule:
  /go:
    cmd: go install github.com/mathaou/termdbms@latest
    reference: https://github.com/mathaou/termdbms?tab=readme-ov-file#installation-instructions
    dsnap: github.com/mathaou/termdbms@latest
  arch/pacman:
    cmd: sudo pacman -S termdbms-git
    reference: https://github.com/mathaou/termdbms?tab=readme-ov-file#installation-instructions
  arch/yay:
    cmd: yay -S termdbms-git
    reference: https://github.com/mathaou/termdbms?tab=readme-ov-file#installation-instructions
binlist:
- termdbms

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 366 KB
          rating: 1
          desc:
            cn: 约 366 KB（估算）
            en: ~366 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
