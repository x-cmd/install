lang: Go
homepage: https://github.com/mathaou/termdbms
license: MIT
desc:
  en: A TUI for viewing and editing databases
  cn: 用于查看和编辑数据库的图形用户界面（TUI）
x:
  source: https://github.com/mathaou/termdbms
rule:
  /go:
    cmd: go install github.com/mathaou/termdbms@latest
    reference: https://github.com/mathaou/termdbms?tab=readme-ov-file#installation-instructions
    dsnap: github.com/mathaou/termdbms@latest
  arch/pacman:
    cmd: sudo pacman -S termdbms-git
    reference: https://github.com/mathaou/termdbms?tab=readme-ov-file#installation-instructions
  arch/yay:
    cmd: yay -S termdbms-git
    reference: https://github.com/mathaou/termdbms?tab=readme-ov-file#installation-instructions
binlist:
- termdbms

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
