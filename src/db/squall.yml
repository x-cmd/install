lang: 'Python'
homepage: 'https://github.com/driscollis/squall'
license: 'MIT'
desc:
  cn: SQLite 的 TUI 查看器与编辑器
  en: 'A TUI SQLite Viewer and Editor'
  cs: TUI prohlížeč a editor SQLite
  de: Ein TUI-Viewer und -Editor für SQLite
  es: Un visor y editor de SQLite con TUI
  fr: Un visualiseur et éditeur SQLite en TUI
  id: Viewer dan editor SQLite berbasis TUI
  it: Un visualizzatore ed editor SQLite con TUI
  ja: TUI 製の SQLite ビューアー兼エディター
  ko: TUI 기반 SQLite 뷰어 및 편집기
  pl: Przeglądarka i edytor SQLite w TUI
  pt: Um visualizador e editor de SQLite com TUI
  ro: Un vizualizator și editor SQLite bazat pe TUI
  ru: TUI-просмотрщик и редактор SQLite
  th: โปรแกรมดูและแก้ไข SQLite แบบ TUI
  tr: SQLite için TUI görüntüleyici ve düzenleyici
  uk: TUI-переглядач і редактор SQLite
  vi: Trình xem và chỉnh sửa SQLite dựa trên TUI
x:
  source: https://github.com/driscollis/squall
  eget: driscollis/squall
  pip: squall-sql
rule:
  /pip:
    cmd: 'pip install squall-sql'
    reference: https://github.com/driscollis/squall
  /eget:
    cmd: x eget driscollis/squall
    reference: https://github.com/driscollis/squall
binlist:
- 'squall'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 安装 11 KB
            en: 11 KB install
        download:
          estimate: 11 KB
          desc:
            cn: 约 11 KB 下载 (whl)
            en: ~11 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
