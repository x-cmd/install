lang: 'Python'
homepage: 'https://github.com/driscollis/squall'
license: 'MIT'
desc:
  cn: SQLite 的 TUI 查看器与编辑器
  en: 'A TUI SQLite Viewer and Editor'
x:
  source: https://github.com/driscollis/squall
  eget: https://github.com/driscollis/squall
rule:
  /pip:
    cmd: 'pip install squall-sql'
    reference: https://github.com/driscollis/squall
  /eget:
    cmd: x eget driscollis/squall
    reference: https://github.com/driscollis/squall
binlist:
  - 'squall'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
