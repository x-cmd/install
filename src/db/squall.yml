lang: 'Python'
homepage: 'https://github.com/driscollis/squall'
license: 'MIT'
desc:
  cn: SQLite 的 TUI 查看器与编辑器
  en: 'A TUI SQLite Viewer and Editor'
x:
  source: https://github.com/driscollis/squall
  eget: https://github.com/driscollis/squall
rule:
  /pip:
    cmd: 'pip install squall-sql'
    reference: https://github.com/driscollis/squall
  /eget:
    cmd: x eget driscollis/squall
    reference: https://github.com/driscollis/squall
binlist:
- 'squall'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 安装 11 KB
            en: 11 KB install
        download:
          estimate: 11 KB
          desc:
            cn: 约 11 KB 下载 (whl)
            en: ~11 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
