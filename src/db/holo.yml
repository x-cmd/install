lang: 'Rust'
homepage: 'https://github.com/measure-sh/holo'
license: 'MIT'
desc:
  cn: 面向 Android 开发者的终端 UI，监控性能、查看日志与查询数据库
  en: 'A terminal UI for Android developers. Monitor performance, browse logs, query databases, record traces, and control devices — without leaving the terminal.'
x:
  source: https://github.com/measure-sh/holo
  eget: https://github.com/measure-sh/holo
rule:
  /eget:
    cmd: x eget measure-sh/holo
    reference: https://github.com/measure-sh/holo
binlist:
  - 'holo'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 719 KB
          rating: 1
          desc:
            cn: 约 719 KB（估算）
            en: ~719 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
