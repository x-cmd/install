lang: 'Go'
homepage: https://github.com/kopecmaciej/vi-mongo
license: 'Apache-2.0'
desc:
  cn: 简化 MongoDB 数据可视化与快速操作的 TUI 管理器
  en: 'MongoDB TUI manager designed to simplify data visualization and quick manipulation'
x:
  source: https://github.com/kopecmaciej/vi-mongo
  eget: https://github.com/kopecmaciej/vi-mongo
rule:
  /eget:
    cmd: x eget kopecmaciej/vi-mongo
    reference: https://github.com/kopecmaciej/vi-mongo
binlist:
  - 'vi-mongo'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
