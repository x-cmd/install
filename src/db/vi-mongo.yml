lang: 'Go'
homepage: https://github.com/kopecmaciej/vi-mongo
license: 'Apache-2.0'
desc:
  cn: 简化 MongoDB 数据可视化与快速操作的 TUI 管理器
  en: 'MongoDB TUI manager designed to simplify data visualization and quick manipulation'
x:
  source: https://github.com/kopecmaciej/vi-mongo
  eget: https://github.com/kopecmaciej/vi-mongo
rule:
  /eget:
    cmd: x eget kopecmaciej/vi-mongo
    reference: https://github.com/kopecmaciej/vi-mongo
binlist:
- 'vi-mongo'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
