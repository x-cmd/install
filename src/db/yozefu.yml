lang: Rust
homepage: https://github.com/MAIF/yozefu
desc:
  cn: 探索 Kafka 集群数据的交互式终端 UI
  en: An interactive terminal user interface (TUI) application for exploring data of a kafka cluster.
x:
  source: https://github.com/MAIF/yozefu
  eget: https://github.com/MAIF/yozefu
rule:
  /eget:
    cmd: x eget MAIF/yozefu
    reference: https://github.com/MAIF/yozefu
binlist:
- yozefu
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 456 KB
          rating: 1
          desc:
            cn: 约 456 KB（估算）
            en: ~456 KB estimated
        download:
          estimate: 14 MB
          desc:
            cn: 约 14 MB 下载 (linux/x64)
            en: ~14 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
