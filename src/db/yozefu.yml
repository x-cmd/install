lang: Rust
homepage: https://github.com/MAIF/yozefu
desc:
  cn: 探索 Kafka 集群数据的交互式终端 UI
  en: An interactive terminal user interface (TUI) application for exploring data of a kafka cluster.
x:
  source: https://github.com/MAIF/yozefu
  eget: https://github.com/MAIF/yozefu
rule:
  /eget:
    cmd: x eget MAIF/yozefu
    reference: https://github.com/MAIF/yozefu
binlist:
- yozefu
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
