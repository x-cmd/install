lang: Rust
homepage: https://github.com/darakian/ddh
desc:
  cn: DDH  是一个快速的重复文件查找器
  en: DDH is a fast duplicate file finder
x:
  source: https://github.com/darakian/ddh
  eget: https://github.com/darakian/ddh
rule:
  /eget:
    cmd: x eget darakian/ddh
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install --git https://github.com/darakian/ddh ddh
    reference: https://github.com/darakian/ddh?tab=readme-ov-file#cli-install
    dsnap: ddh
  darwin/brew:
    cmd: brew install ddh
    reference: https://formulae.brew.sh/formula/ddh#default
  arch/yay:
    cmd: yay -S ddh
    reference: https://aur.archlinux.org/packages/ddh
binlist:
- ddh
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
