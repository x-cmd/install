lang: Rust
homepage: https://codeberg.org/lukeflo/bibiman
desc:
  cn: 用于处理 BibLaTeX 数据库的简单 TUI
  en: A simple TUI for handling your BibLaTeX database.
  cs: Jednoduché TUI pro správu vaší databáze BibLaTeX.
  de: Ein einfaches TUI zur Verwaltung Ihrer BibLaTeX-Datenbank.
  es: Un TUI sencillo para gestionar tu base de datos BibLaTeX.
  fr: Un TUI simple pour gérer votre base de données BibLaTeX.
  id: TUI sederhana untuk mengelola basis data BibLaTeX Anda.
  it: Una semplice TUI per gestire il tuo database BibLaTeX.
  ja: BibLaTeX データベースを管理するためのシンプルな TUI です。
  ko: BibLaTeX 데이터베이스를 관리하기 위한 간단한 TUI입니다.
  pl: Proste TUI do zarządzania bazą danych BibLaTeX.
  pt: Uma TUI simples para gerenciar seu banco de dados BibLaTeX.
  ro: Un TUI simplu pentru gestionarea bazei de date BibLaTeX.
  ru: Простой TUI для работы с базой данных BibLaTeX.
  th: TUI อย่างง่ายสำหรับจัดการฐานข้อมูล BibLaTeX ของคุณ
  tr: BibLaTeX veritabanınızı yönetmek için basit bir TUI.
  uk: Простий TUI для керування базою даних BibLaTeX.
  vi: TUI đơn giản để quản lý cơ sở dữ liệu BibLaTeX của bạn.
rule:
  /cargo:
    cmd: cargo install bibiman
    reference: https://codeberg.org/lukeflo/bibiman
    dsnap: bibiman
  arch/paru:
    cmd: yay -S bibiman
    reference: https://codeberg.org/lukeflo/bibiman
  arch/yay:
    cmd: yay -S bibiman
    reference: https://aur.archlinux.org/packages/bibiman
  /nix-env:
    cmd: nix-env -iA bibiman
    reference: https://codeberg.org/lukeflo/bibiman

x:
  yay: bibiman
  cargo: bibiman
binlist:
- bibiman
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
