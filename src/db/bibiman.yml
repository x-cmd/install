lang: Rust
homepage: https://codeberg.org/lukeflo/bibiman
desc:
  cn: 用于处理 BibLaTeX 数据库的简单 TUI
  en: A simple TUI for handling your BibLaTeX database.
rule:
  /cargo:
    cmd: cargo install bibiman
    reference: https://codeberg.org/lukeflo/bibiman
    dsnap: bibiman
  arch/paru:
    cmd: yay -S bibiman
    reference: https://codeberg.org/lukeflo/bibiman
  arch/yay:
    cmd: yay -S bibiman
    reference: https://aur.archlinux.org/packages/bibiman
  /nix-env:
    cmd: nix-env -iA bibiman
    reference: https://codeberg.org/lukeflo/bibiman
binlist:
- bibiman
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
