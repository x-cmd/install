  en: 'CLI password manager with sessions'
  cs: CLI správce hesel se sessions
  de: CLI-Passwortmanager mit Sitzungen
  es: Gestor de contraseñas de CLI con sesiones
  fr: Gestionnaire de mots de passe CLI avec sessions
  id: Manajer kata sandi CLI dengan sesi
  it: Gestore di password da CLI con sessioni
  ja: セッションに対応した CLI パスワードマネージャー
  ko: 세션을 지원하는 CLI 비밀번호 관리자
  pl: Menedżer haseł w CLI z sesjami
  pt: Gerenciador de senhas de CLI com sessões
  ro: Manager de parole CLI cu sesiuni
  ru: CLI-менеджер паролей с сессиями
  th: ตัวจัดการรหัสผ่านแบบ CLI พร้อมเซสชัน
  tr: Oturum destekli CLI parola yöneticisi
  uk: CLI-менеджер паролів із сесіями
  vi: Trình quản lý mật khẩu CLI có hỗ trợ phiên làm việc
x:
  source: https://github.com/GGP1/kure
  eget: GGP1/kure
rule:
  /eget:
    cmd: x eget GGP1/kure
    reference: https://github.com/GGP1/kure
binlist:
- 'kure'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
