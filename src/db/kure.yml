lang: 'Go'
homepage: 'https://github.com/GGP1/kure'
license: 'Apache-2.0'
desc:
  cn: 支持会话的 CLI 密码管理器
  en: 'CLI password manager with sessions'
x:
  source: https://github.com/GGP1/kure
  eget: GGP1/kure
rule:
  /eget:
    cmd: x eget GGP1/kure
    reference: https://github.com/GGP1/kure
binlist:
- 'kure'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
