lang: 'Go'
homepage: 'https://github.com/GGP1/kure'
license: 'Apache-2.0'
desc:
  cn: 支持会话的 CLI 密码管理器
  en: 'CLI password manager with sessions'
x:
  source: https://github.com/GGP1/kure
  eget: https://github.com/GGP1/kure
rule:
  /eget:
    cmd: x eget GGP1/kure
    reference: https://github.com/GGP1/kure
binlist:
  - 'kure'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
