lang: 'Rust'
homepage: https://github.com/derekwisong/datui
license: 'MIT'
desc:
  cn: 终端中的数据探索工具
  en: 'Data Exploration in the Terminal'
x:
  source: https://github.com/derekwisong/datui
  eget: https://github.com/derekwisong/datui
rule:
  /eget:
    cmd: x eget derekwisong/datui
    reference: https://github.com/derekwisong/datui
binlist:
  - 'datui'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
