lang: 'Rust'
homepage: https://github.com/derekwisong/datui
license: 'MIT'
desc:
  cn: 终端中的数据探索工具
  en: 'Data Exploration in the Terminal'
x:
  source: https://github.com/derekwisong/datui
  eget: https://github.com/derekwisong/datui
rule:
  /eget:
    cmd: x eget derekwisong/datui
    reference: https://github.com/derekwisong/datui
binlist:
- 'datui'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 MB
          rating: 2
          desc:
            cn: 安装 23 MB
            en: 23 MB install
        download:
          estimate: 23 MB
          desc:
            cn: 约 23 MB 下载 (macos/x64)
            en: ~23 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
