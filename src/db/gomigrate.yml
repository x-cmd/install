lang: Go
homepage: https://github.com/golang-migrate/migrate
desc:
  cn: (数据库) 数据库迁移工具 (MySQL PostgreSQL SQLite)
  en: Database migrations. CLI and Golang library
  cs: Migrace databází. CLI a knihovna Golang
  de: Datenbankmigrationen. CLI und Golang-Bibliothek
  es: Migraciones de bases de datos. CLI y biblioteca de Golang
  fr: Migrations de bases de données. CLI et bibliothèque Golang
  id: Migrasi basis data. CLI dan pustaka Golang
  it: Migrazioni di database. CLI e libreria Golang
  ja: データベースマイグレーション。CLI と Golang ライブラリ
  ko: 데이터베이스 마이그레이션. CLI 및 Golang 라이브러리
  pl: Migracje baz danych. CLI i biblioteka Golang
  pt: Migrações de banco de dados. CLI e biblioteca Golang
  ro: Migrări de baze de date. CLI și bibliotecă Golang
  ru: Миграции баз данных. CLI и библиотека Golang
  th: การย้ายฐานข้อมูล CLI และไลบรารี Golang
  tr: Veritabanı geçişleri. CLI ve Golang kütüphanesi
  uk: Міграції баз даних. CLI та бібліотека Golang
  vi: Di chuyển cơ sở dữ liệu. CLI và thư viện Golang
x:
  source: https://github.com/golang-migrate/migrate
  eget: golang-migrate/migrate
  brew: golang-migrate
  scoop: migrate
  asdf: gomigrate
rule:
  /eget:
    cmd: x eget golang-migrate/migrate
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use gomigrate
    reference: https://github.com/joschi/asdf-gomigrate
  darwin/brew:
    cmd: brew install golang-migrate
    reference: https://vale.sh/docs/vale-cli/installation/#package-managers
  /curl:
    cmd: curl -L https://github.com/golang-migrate/migrate/releases/download/$version/migrate.$os-$arch.tar.gz | tar xvz
    reference: https://github.com/golang-migrate/migrate/tree/master/cmd/migrate#download-pre-built-binary-windows-macos-or-linux
  (win|wsl2)/scoop:
    cmd: x scoop install migrate
    reference: https://github.com/golang-migrate/migrate/tree/master/cmd/migrate#windows
  /go:
    cmd: go get -tags 'postgres' -u github.com/golang-migrate/migrate/cmd/migrate
    reference: https://github.com/golang-migrate/migrate/tree/master/cmd/migrate#versioned
    dsnap: github.com/golang-migrate/migrate/cmd/migrate
binlist:
- gomigrate
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
