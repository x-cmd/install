lang: Rust
homepage: https://github.com/nrempel/sleek
license: MIT
desc:
  cn: Sleek 是一个用于格式化 SQL 的 CLI 工具。它可以帮助您在 SQL 代码中保持一致的样式，从而提高可读性和生产力
  en: Sleek is a CLI tool for formatting SQL. It helps you maintain a consistent style across your SQL code, enhancing readability and productivity
x:
  source: https://github.com/nrempel/sleek
  eget: https://github.com/nrempel/sleek
rule:
  /eget:
    cmd: x eget nrempel/sleek
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install sleek
    reference: https://github.com/nrempel/sleek?tab=readme-ov-file#install-with-cargo
    dsnap: sleek
  darwin/brew:
    cmd: brew install --cask sleek
    reference: https://formulae.brew.sh/cask/sleek#default
binlist:
- sleek

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
