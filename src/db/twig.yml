lang: 'Python'
homepage: https://github.com/workdone0/twig
license: 'MIT'
desc:
  cn: 快速、交互、注重隐私的终端 JSON 与 YAML 查看 TUI
  en: 'Terminal-based JSON & YAML viewer (TUI) for exploring and searching large files — fast, interactive, and privacy-first.'
x:
  source: https://github.com/workdone0/twig
  eget: https://github.com/workdone0/twig
rule:
  /eget:
    cmd: x eget workdone0/twig
    reference: https://github.com/workdone0/twig
binlist:
- 'twig'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
