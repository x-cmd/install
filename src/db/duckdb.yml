lang: C++
homepage: https://github.com/duckdb/duckdb
license: MIT
desc:
  cn: DuckDB 是一个 in-process 数据库管理系统
  en: DuckDB is an in-process SQL OLAP database management system
  cs: DuckDB je systém správy databází SQL OLAP běžící v procesu
  de: DuckDB ist ein In-Process-SQL-OLAP-Datenbankmanagementsystem
  es: DuckDB es un sistema de gestión de bases de datos SQL OLAP en proceso
  fr: DuckDB est un système de gestion de bases de données SQL OLAP embarqué
  id: DuckDB adalah sistem manajemen basis data SQL OLAP in-process
  it: DuckDB è un sistema di gestione di database SQL OLAP in-process
  ja: DuckDB はインプロセス型の SQL OLAP データベース管理システムです
  ko: DuckDB는 인프로세스 SQL OLAP 데이터베이스 관리 시스템입니다
  pl: DuckDB to system zarządzania bazami danych SQL OLAP działający w procesie
  pt: O DuckDB é um sistema de gerenciamento de banco de dados SQL OLAP no processo
  ro: DuckDB este un sistem de administrare a bazelor de date SQL OLAP rulând în proces
  ru: DuckDB — это встроенная система управления базами данных SQL OLAP
  th: DuckDB คือระบบจัดการฐานข้อมูล SQL OLAP แบบ in-process
  tr: DuckDB, süreç içi (in-process) bir SQL OLAP veritabanı yönetim sistemidir
  uk: DuckDB — це вбудована система управління базами даних SQL OLAP
  vi: DuckDB là hệ thống quản lý cơ sở dữ liệu SQL OLAP chạy trong tiến trình
x:
  source: https://github.com/duckdb/duckdb
  eget: duckdb/duckdb
  brew: duckdb
  scoop: duckdb
  winget: DuckDB.cli
rule:
  /eget:
    cmd: x eget duckdb/duckdb
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install duckdb
    reference: https://duckdb.org/docs/installation/?version=latest&environment=cli&installer=binary&platform=macos
  (win|wsl2)/scoop:
    cmd: x scoop install duckdb
    reference: https://scoop.sh/#/apps?q=duckdb
  (win|wsl2)/winget:
    cmd: x winget install DuckDB.cli
    reference: https://duckdb.org/docs/installation/?version=latest&environment=cli&installer=binary&platform=win
binlist:
- duckdb

# already profiled
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 63 MB
          rating: 3
          desc:
            cn: 安装 63 MB
            en: 63 MB install
        download:
          estimate: 21 MB
          desc:
            cn: 约 21 MB 下载 (linux/x64)
            en: ~21 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
