lang: C++
homepage: https://github.com/duckdb/duckdb
license: MIT
desc:
  cn: DuckDB 是一个 in-process 数据库管理系统
  en: DuckDB is an in-process SQL OLAP database management system
x:
  source: https://github.com/duckdb/duckdb
  eget: https://github.com/duckdb/duckdb
rule:
  /eget:
    cmd: x eget duckdb/duckdb
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install duckdb
    reference: https://duckdb.org/docs/installation/?version=latest&environment=cli&installer=binary&platform=macos
  (win|wsl2)/scoop:
    cmd: x scoop install duckdb
    reference: https://scoop.sh/#/apps?q=duckdb
  (win|wsl2)/winget:
    cmd: x winget install DuckDB.cli
    reference: https://duckdb.org/docs/installation/?version=latest&environment=cli&installer=binary&platform=win
binlist:
- duckdb

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
