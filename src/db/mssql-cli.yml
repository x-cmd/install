lang: Python
homepage: https://github.com/dbcli/mssql-cli
license: BSD-3-Clause
desc:
  cn: SQL Server 命令行客户端，具有自动补全和语法突出显示功能
  en: A command-line client for SQL Server with auto-completion and syntax highlighting
x:
  pkg:
    exist: true
  source: https://github.com/dbcli/mssql-cli
rule:
  /x:
    cmd: x pkg use mssql-cli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install mssql-cli
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/pip.md
    dsnap: mssql-cli
  debian8/apt:
    cmd: 'wget -qO- https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

      echo "deb [arch=amd64] https://packages.microsoft.com/debian/8/prod jessie main" | sudo tee /etc/apt/sources.list.d/mssql-cli.list

      sudo apt-get update

      sudo apt-get install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#debian-8
  debian9/apt:
    cmd: 'wget -qO- https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

      echo "deb [arch=amd64] https://packages.microsoft.com/debian/9/prod jessie main" | sudo tee /etc/apt/sources.list.d/mssql-cli.list

      sudo apt-get update

      sudo apt-get install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#debian-9
  ubuntu16.04/apt:
    cmd: 'curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

      sudo apt-add-repository https://packages.microsoft.com/ubuntu/16.04/prod

      sudo apt-get update

      sudo apt-get install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#ubuntu-1604-xenial
  ubuntu18.04/apt:
    cmd: 'curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

      sudo apt-add-repository https://packages.microsoft.com/ubuntu/18.04/prod

      sudo apt-get update

      sudo apt-get install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#ubuntu-1804-bionic
  centos7/yum:
    cmd: 'sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc

      curl https://packages.microsoft.com/config/centos/7/prod.repo > /etc/yum.repos.d/msprod.repo

      sudo yum install libunwind

      sudo yum install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#centos-7
  centos8/yum:
    cmd: 'sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc

      curl https://packages.microsoft.com/config/centos/8/prod.repo > /etc/yum.repos.d/msprod.repo

      sudo yum install libunwind

      sudo yum install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#centos-8
  rhel7/yum:
    cmd: 'sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc

      curl https://packages.microsoft.com/config/rhel/7/prod.repo > /etc/yum.repos.d/msprod.repo

      sudo yum install libunwind

      sudo yum install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#rhel-7
binlist:
- mssql-cli
