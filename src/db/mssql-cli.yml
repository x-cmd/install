lang: Python
homepage: https://github.com/dbcli/mssql-cli
license: BSD-3-Clause
desc:
  cn: SQL Server 命令行客户端，具有自动补全和语法突出显示功能
  en: A command-line client for SQL Server with auto-completion and syntax highlighting
  cs: Klient příkazové řádky pro SQL Server s automatickým doplňováním a zvýrazňováním syntaxe
  de: Ein Kommandozeilen-Client für SQL Server mit Autovervollständigung und Syntaxhervorhebung
  es: Un cliente de línea de comandos para SQL Server con autocompletado y resaltado de sintaxis
  fr: Un client en ligne de commande pour SQL Server avec complétion automatique et coloration syntaxique
  id: Klien baris perintah untuk SQL Server dengan pelengkapan otomatis dan penyorotan sintaks
  it: Un client da riga di comando per SQL Server con completamento automatico ed evidenziazione della sintassi
  ja: SQL Server 用のコマンドラインクライアント。自動補完と構文ハイライトに対応。
  ko: 자동 완성과 구문 강조 표시를 지원하는 SQL Server용 명령줄 클라이언트
  pl: Klient wiersza poleceń dla SQL Server z automatycznym uzupełnianiem i podświetlaniem składni
  pt: Um cliente de linha de comando para o SQL Server com preenchimento automático e realce de sintaxe
  ro: Un client de linie de comandă pentru SQL Server cu completare automată și evidențierea sintaxei
  ru: Командный клиент для SQL Server с автодополнением и подсветкой синтаксиса
  th: ไคลเอนต์บรรทัดคำสั่งสำหรับ SQL Server พร้อมการเติมคำอัตโนมัติและการเน้นไวยากรณ์
  tr: SQL Server için otomatik tamamlama ve sözdizimi vurgulama özellikli bir komut satırı istemcisi
  uk: Командний клієнт для SQL Server з автозавершенням і підсвічуванням синтаксису
  vi: Client dòng lệnh cho SQL Server với tính năng tự động hoàn thành và tô sáng cú pháp
x:
  source: https://github.com/dbcli/mssql-cli
  apt: mssql-cli
  dnf: libunwind
  apt-get: mssql-cli
  yum: libunwind
  pip: mssql-cli
rule:
  /x:
    cmd: x pkg use mssql-cli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install mssql-cli
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/pip.md
    dsnap: mssql-cli
  debian8/apt:
    cmd: 'wget -qO- https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

      echo "deb [arch=amd64] https://packages.microsoft.com/debian/8/prod jessie main" | sudo tee /etc/apt/sources.list.d/mssql-cli.list

      sudo apt-get update

      sudo apt-get install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#debian-8
  debian9/apt:
    cmd: 'wget -qO- https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

      echo "deb [arch=amd64] https://packages.microsoft.com/debian/9/prod jessie main" | sudo tee /etc/apt/sources.list.d/mssql-cli.list

      sudo apt-get update

      sudo apt-get install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#debian-9
  ubuntu16.04/apt:
    cmd: 'curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

      sudo apt-add-repository https://packages.microsoft.com/ubuntu/16.04/prod

      sudo apt-get update

      sudo apt-get install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#ubuntu-1604-xenial
  ubuntu18.04/apt:
    cmd: 'curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

      sudo apt-add-repository https://packages.microsoft.com/ubuntu/18.04/prod

      sudo apt-get update

      sudo apt-get install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#ubuntu-1804-bionic
  centos7/yum:
    cmd: 'sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc

      curl https://packages.microsoft.com/config/centos/7/prod.repo > /etc/yum.repos.d/msprod.repo

      sudo yum install libunwind

      sudo yum install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#centos-7
  centos8/yum:
    cmd: 'sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc

      curl https://packages.microsoft.com/config/centos/8/prod.repo > /etc/yum.repos.d/msprod.repo

      sudo yum install libunwind

      sudo yum install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#centos-8
  rhel7/yum:
    cmd: 'sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc

      curl https://packages.microsoft.com/config/rhel/7/prod.repo > /etc/yum.repos.d/msprod.repo

      sudo yum install libunwind

      sudo yum install mssql-cli

      '
    reference: https://github.com/dbcli/mssql-cli/blob/main/doc/installation/linux.md#rhel-7
binlist:
- mssql-cli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 26 KB
          rating: 1
          desc:
            cn: 约 26 KB（估算）
            en: ~26 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
