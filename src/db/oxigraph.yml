lang: Rust
homepage: https://github.com/oxigraph/oxigraph
license: Apache-2.0
desc:
  cn: 用 Rust 编写的 SPARQL 图数据库（同时提供 RDF 解析/序列化、HTTP 服务与命令行工具）
  en: SPARQL graph database written in Rust, with RDF parsing/serialization, HTTP server and CLI
x:
  source: https://github.com/oxigraph/oxigraph
  eget: oxigraph/oxigraph
  pip: oxigraph
  cargo: oxigraph-cli
rule:
  /eget:
    cmd: x eget oxigraph/oxigraph
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install oxigraph-cli
    reference: https://github.com/oxigraph/oxigraph/blob/main/cli/README.md#installation
  /pip:
    cmd: pip install oxigraph
    reference: https://pypi.org/project/oxigraph/
binlist:
- oxigraph

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 21 MB
          rating: 2
          desc:
            cn: 安装 21 MB
            en: 21 MB install
        download:
          estimate: 21 MB
          desc:
            cn: 约 21 MB 下载 (linux/x64)
            en: ~21 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
