lang: Rust
homepage: https://github.com/oxigraph/oxigraph
license: Apache-2.0
desc:
  cn: 用 Rust 编写的 SPARQL 图数据库（同时提供 RDF 解析/序列化、HTTP 服务与命令行工具）
  en: SPARQL graph database written in Rust, with RDF parsing/serialization, HTTP server and CLI
x:
  source: https://github.com/oxigraph/oxigraph
  eget: https://github.com/oxigraph/oxigraph
rule:
  /eget:
    cmd: x eget oxigraph/oxigraph
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install oxigraph-cli
    reference: https://github.com/oxigraph/oxigraph/blob/main/cli/README.md#installation
  /pip:
    cmd: pip install oxigraph
    reference: https://pypi.org/project/oxigraph/
binlist:
  - oxigraph

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
