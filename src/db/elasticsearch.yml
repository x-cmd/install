lang: Java
homepage: https://github.com/elastic/elasticsearch
desc:
  cn: Elasticsearch 是一个分布式、RESTful 风格的搜索和数据分析引擎，同时是可扩展的数据存储和矢量数据库，能够应对日益增多的各种用例
  en: Elasticsearch is a distributed, RESTful search and analytics engine, scalable data store, and vector database capable of addressing a growing number of use cases
x:
  source: https://github.com/elastic/elasticsearch
rule:
  debian/apt:
    cmd: 'sudo apt-get install apt-transport-https && \

      echo "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main" | sudo tee /etc/apt/sources.list.d/elastic-8.x.list && \

      sudo apt-get update && \

      sudo apt-get install elasticsearch

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/deb.html#deb-repo
    dsnap: elasticsearch
  ubuntu/apt:
    cmd: 'sudo apt-get install apt-transport-https && \

      echo "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main" | sudo tee /etc/apt/sources.list.d/elastic-8.x.list && \

      sudo apt-get update && \

      sudo apt-get install elasticsearch

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/deb.html#deb-repo
    dsnap: elasticsearch
  debian/wget:
    cmd: 'wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-amd64.deb && \

      wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-amd64.deb.sha512 && \

      shasum -a 512 -c elasticsearch-8.15.0-amd64.deb.sha512 && \

      sudo dpkg -i elasticsearch-8.15.0-amd64.deb

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/deb.html#install-deb
  ubuntu/wget:
    cmd: 'wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-amd64.deb && \

      wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-amd64.deb.sha512 && \

      shasum -a 512 -c elasticsearch-8.15.0-amd64.deb.sha512 && \

      sudo dpkg -i elasticsearch-8.15.0-amd64.deb

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/deb.html#install-deb
  centos/yum:
    cmd: '[elasticsearch] && \

      name=Elasticsearch repository for 8.x packages && \

      baseurl=https://artifacts.elastic.co/packages/8.x/yum && \

      gpgcheck=1 && \

      gpgkey=https://artifacts.elastic.co/GPG-KEY-elasticsearch && \

      enabled=0 && \

      autorefresh=1 && \

      type=rpm-md && \

      sudo yum install --enablerepo=elasticsearch elasticsearch

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#rpm-repo
  rhel/yum:
    cmd: '[elasticsearch] && \

      name=Elasticsearch repository for 8.x packages && \

      baseurl=https://artifacts.elastic.co/packages/8.x/yum && \

      gpgcheck=1 && \

      gpgkey=https://artifacts.elastic.co/GPG-KEY-elasticsearch && \

      enabled=0 && \

      autorefresh=1 && \

      type=rpm-md && \

      sudo yum install --enablerepo=elasticsearch elasticsearch

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#rpm-repo
  fedora/dnf:
    cmd: '[elasticsearch] && \

      name=Elasticsearch repository for 8.x packages && \

      baseurl=https://artifacts.elastic.co/packages/8.x/yum && \

      gpgcheck=1 && \

      gpgkey=https://artifacts.elastic.co/GPG-KEY-elasticsearch && \

      enabled=0 && \

      autorefresh=1 && \

      type=rpm-md && \

      sudo dnf install --enablerepo=elasticsearch elasticsearch

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#rpm-repo
    dsnap: elasticsearch
  rhel/dnf:
    cmd: '[elasticsearch] && \

      name=Elasticsearch repository for 8.x packages && \

      baseurl=https://artifacts.elastic.co/packages/8.x/yum && \

      gpgcheck=1 && \

      gpgkey=https://artifacts.elastic.co/GPG-KEY-elasticsearch && \

      enabled=0 && \

      autorefresh=1 && \

      type=rpm-md && \

      sudo dnf install --enablerepo=elasticsearch elasticsearch

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#rpm-repo
  rocky/dnf:
    cmd: '[elasticsearch] && \

      name=Elasticsearch repository for 8.x packages && \

      baseurl=https://artifacts.elastic.co/packages/8.x/yum && \

      gpgcheck=1 && \

      gpgkey=https://artifacts.elastic.co/GPG-KEY-elasticsearch && \

      enabled=0 && \

      autorefresh=1 && \

      type=rpm-md && \

      sudo dnf install --enablerepo=elasticsearch elasticsearch

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#rpm-repo
  opensuse/zypper:
    cmd: '[elasticsearch] && \

      name=Elasticsearch repository for 8.x packages && \

      baseurl=https://artifacts.elastic.co/packages/8.x/yum && \

      gpgcheck=1 && \

      gpgkey=https://artifacts.elastic.co/GPG-KEY-elasticsearch && \

      enabled=0 && \

      autorefresh=1 && \

      type=rpm-md && \

      sudo zypper modifyrepo --enable elasticsearch && \

      sudo zypper install elasticsearch && \

      sudo zypper modifyrepo --disable elasticsearch

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#rpm-repo
  rhel/wget:
    cmd: 'wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-x86_64.rpm && \

      wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-x86_64.rpm.sha512 && \

      shasum -a 512 -c elasticsearch-8.15.0-x86_64.rpm.sha512 && \

      sudo rpm --install elasticsearch-8.15.0-x86_64.rpm

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#install-rpm
  centos/wget:
    cmd: 'wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-x86_64.rpm && \

      wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-x86_64.rpm.sha512 && \

      shasum -a 512 -c elasticsearch-8.15.0-x86_64.rpm.sha512 && \

      sudo rpm --install elasticsearch-8.15.0-x86_64.rpm

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#install-rpm
  fedora/wget:
    cmd: 'wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-x86_64.rpm && \

      wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-x86_64.rpm.sha512 && \

      shasum -a 512 -c elasticsearch-8.15.0-x86_64.rpm.sha512 && \

      sudo rpm --install elasticsearch-8.15.0-x86_64.rpm

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#install-rpm
  rocky/wget:
    cmd: 'wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-x86_64.rpm && \

      wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-x86_64.rpm.sha512 && \

      shasum -a 512 -c elasticsearch-8.15.0-x86_64.rpm.sha512 && \

      sudo rpm --install elasticsearch-8.15.0-x86_64.rpm

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/rpm.html#install-rpm
  darwin/curl:
    cmd: 'curl -O https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-darwin-x86_64.tar.gz && \

      curl https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-darwin-x86_64.tar.gz.sha512 | shasum -a 512 -c - && \

      tar -xzf elasticsearch-8.15.0-darwin-x86_64.tar.gz && \

      cd elasticsearch-8.15.0/ && \

      '
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/targz.html#install-macos
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-windows-x86_64.zip -OutFile elasticsearch-8.15.0-windows-x86_64.zip
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/zip-windows.html#install-windows
  (win|wsl2)/curl:
    cmd: curl -OL https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-windows-x86_64.zip
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/zip-windows.html#install-windows
  (win|wsl2)/wget:
    cmd: wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-8.15.0-windows-x86_64.zip
    reference: https://www.elastic.co/guide/en/elasticsearch/reference/8.15/zip-windows.html#install-windows
  arch/yay:
    cmd: yay -S elasticsearch
    reference: https://aur.archlinux.org/packages/elasticsearch
binlist:
- elasticsearch
license: NOASSERTION
