lang: Python
homepage: https://github.com/simonw/datasette
license: Apache-2.0
desc:
  cn: Datasette 是一个用于探索和发布数据的工具。它可以帮助人们获取任何形式的数据，分析和探索它，并将其作为交互式网站和相应的 API 发布。
  en: Datasette is a tool for exploring and publishing data. It helps people take data of any shape, analyze and explore it, and publish it as an interactive website and accompanying API.
x:
  pkg:
    exist: true
  source: https://github.com/simonw/datasette
  brew: datasette
rule:
  /x:
    cmd: x pkg use datasette
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install datasette
    reference: https://github.com/simonw/datasette#installation
    dsnap: datasette
  /pipx:
    cmd: pipx install datasette
    reference: https://github.com/simonw/datasette#installation
  darwin/brew:
    cmd: brew install datasette
    reference: https://github.com/simonw/datasette#installation
binlist:
- datasette

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 145 KB
          rating: 1
          desc:
            cn: 约 145 KB（估算）
            en: ~145 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
