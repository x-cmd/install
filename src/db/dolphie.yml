lang: Python
homepage: https://github.com/charles-001/dolphie
license: GPL-3.0
desc:
  cn: 用于对 MySQL/MariaDB 和 ProxySQL 进行实时分析的单一管理平台。
  en: Your single pane of glass for real-time analytics into MySQL/MariaDB & ProxySQL.
x:
  source: https://github.com/charles-001/dolphie
rule:
  /brew:
    cmd: brew install dolphie
    reference: https://github.com/charles-001/dolphie#installation
  /pip:
    cmd: pip install dolphie
    reference: https://github.com/charles-001/dolphie#installation
    dsnap: dolphie
  arch/yay:
    cmd: yay -S dolphie
    reference: https://aur.archlinux.org/packages/dolphie
binlist:
- dolphie

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
