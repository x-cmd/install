lang: Python
homepage: https://github.com/charles-001/dolphie
license: GPL-3.0
desc:
  cn: 用于对 MySQL/MariaDB 和 ProxySQL 进行实时分析的单一管理平台。
  en: Your single pane of glass for real-time analytics into MySQL/MariaDB & ProxySQL.
x:
  source: https://github.com/charles-001/dolphie
rule:
  /brew:
    cmd: brew install dolphie
    reference: https://github.com/charles-001/dolphie#installation
  /pip:
    cmd: pip install dolphie
    reference: https://github.com/charles-001/dolphie#installation
    dsnap: dolphie
  arch/yay:
    cmd: yay -S dolphie
    reference: https://aur.archlinux.org/packages/dolphie
binlist:
- dolphie

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 43 KB
          rating: 1
          desc:
            cn: 约 43 KB（估算）
            en: ~43 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
