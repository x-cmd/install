lang: Python
homepage: https://houseplant.readthedocs.io/en/latest/#
desc:
  cn: Houseplant 是一个命令行工具，帮助你管理 ClickHouse 数据库的迁移。
  en: Houseplant is a CLI tool that helps you manage database migrations for ClickHouse.
rule:
  /pip:
    cmd: pip install houseplant
    reference: https://houseplant.readthedocs.io/en/latest/install.html
    dsnap: houseplant
binlist:
- houseplant
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
