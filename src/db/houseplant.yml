lang: Python
homepage: https://houseplant.readthedocs.io/en/latest/#
desc:
  cn: Houseplant 是一个命令行工具，帮助你管理 ClickHouse 数据库的迁移。
  en: Houseplant is a CLI tool that helps you manage database migrations for ClickHouse.
rule:
  /pip:
    cmd: pip install houseplant
    reference: https://houseplant.readthedocs.io/en/latest/install.html
    dsnap: houseplant
binlist:
- houseplant
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
