lang: 'C'
homepage: 'https://github.com/okbob/pspg'
license: 'BSD-2-Clause'
desc:
  cn: 专为表格设计的功能丰富的 Unix 分页器，支持 PostgreSQL/MySQL 及 CSV/TSV 查看
  en: 'Unix pager (with very rich functionality) designed for work with tables. Designed for PostgreSQL, but MySQL is supported too. Works well with pgcli too. Can be used as CSV or TSV viewer too. It sup...'
x:
  source: https://github.com/okbob/pspg
  eget: https://github.com/okbob/pspg
rule:
  darwin/brew:
    cmd: 'brew install pspg'
    reference: https://github.com/okbob/pspg
  /eget:
    cmd: x eget okbob/pspg
    reference: https://github.com/okbob/pspg
binlist:
  - 'pspg'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 855 KB
          rating: 1
          desc:
            cn: 约 855 KB（估算）
            en: ~855 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
