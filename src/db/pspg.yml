x:
  source: https://github.com/okbob/pspg
  eget: okbob/pspg
  brew: pspg
rule:
  darwin/brew:
    cmd: 'brew install pspg'
    reference: https://github.com/okbob/pspg
  /eget:
    cmd: x eget okbob/pspg
    reference: https://github.com/okbob/pspg
binlist:
  - 'pspg'

