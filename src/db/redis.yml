lang: C
homepage: https://github.com/redis/redis
desc:
  cn: Redis 是一个开源(BSD 许可)的内存中数据结构存储，用作数据库、缓存、消息代理和流引擎
  en: Redis is an open source (BSD licensed), in-memory data structure store used as a database, cache, message broker, and streaming engine
x:
  source: https://github.com/redis/redis
rule:
  /asdf:
    cmd: x asdf use redis
    reference: https://github.com/smashedtoatoms/asdf-redis
  darwin/brew:
    cmd: brew install redis
    reference: https://formulae.brew.sh/formula/redis#default
  debian/apt:
    cmd: sudo apt-get install redis-tools
    reference: https://command-not-found.com/redis-cli
    dsnap: redis-tools
  ubuntu/apt:
    cmd: sudo apt-get install redis-tools
    reference: https://command-not-found.com/redis-cli
    dsnap: redis-tools
  alpine/apk:
    cmd: sudo apk add redis
    reference: https://command-not-found.com/redis-cli
    dsnap: redis
  arch/pacman:
    cmd: sudo pacman -S redis
    reference: https://command-not-found.com/redis-cli
  arch/yay:
    cmd: yay -S redis
    reference: https://aur.archlinux.org/packages/redis
  kali/apt:
    cmd: sudo apt-get install redis-tools
    reference: https://command-not-found.com/redis-cli
    dsnap: redis-tools
  fedora/dnf:
    cmd: sudo dnf install redis
    reference: https://command-not-found.com/redis-cli
    dsnap: redis
  raspbian/apt:
    cmd: sudo apt-get install redis-tools
    reference: https://command-not-found.com/redis-cli
binlist:
- redis
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
