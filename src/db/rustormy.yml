lang: 'Rust'
homepage: 'https://github.com/Tairesh/rustormy'
license: 'MIT'
desc:
  cn: 极简的 neofetch 风格天气 CLI
  en: '🌦️ Minimal neofetch-like weather CLI'
  cs: 🌦️ minimalistní CLI pro počasí ve stylu neofetch
  de: 🌦️ minimalistische Wetter-CLI im Stil von neofetch
  es: 🌦️ CLI minimalista del tiempo al estilo neofetch
  fr: 🌦️ CLI météo minimaliste à la neofetch
  id: 🌦️ CLI cuaca minimalistis ala neofetch
  it: 🌦️ CLI meteo minimalista in stile neofetch
  ja: 🌦️ neofetch 風のミニマルな天気 CLI
  ko: 🌦️ neofetch 스타일의 미니멀한 날씨 CLI
  pl: 🌦️ minimalistyczne CLI pogodowe w stylu neofetch
  pt: 🌦️ CLI de previsão do tempo minimalista no estilo neofetch
  ro: 🌦️ CLI minimalist pentru vreme, în stil neofetch
  ru: 🌦️ минималистичный CLI погоды в стиле neofetch
  th: 🌦️ CLI สภาพอากาศแบบเรียบง่ายในสไตล์ neofetch
  tr: 🌦️ neofetch tarzında minimalist hava durumu CLI
  uk: 🌦️ мінімалістичний CLI погоди у стилі neofetch
  vi: 🌦️ CLI thời tiết tối giản theo phong cách neofetch
x:
  source: https://github.com/Tairesh/rustormy
  eget: Tairesh/rustormy
rule:
  /eget:
    cmd: x eget Tairesh/rustormy
    reference: https://github.com/Tairesh/rustormy
binlist:
- 'rustormy'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/arm64)
            en: ~4 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
