lang: 'Rust'
homepage: 'https://github.com/Tairesh/rustormy'
license: 'MIT'
desc:
  cn: 极简的 neofetch 风格天气 CLI
  en: '🌦️ Minimal neofetch-like weather CLI'
x:
  source: https://github.com/Tairesh/rustormy
  eget: https://github.com/Tairesh/rustormy
rule:
  /eget:
    cmd: x eget Tairesh/rustormy
    reference: https://github.com/Tairesh/rustormy
binlist:
  - 'rustormy'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
