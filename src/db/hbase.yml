lang: Java
homepage: https://github.com/apache/hbase
license: Apache-2.0
desc:
  cn: Apache HBase™ 是 Hadoop 数据库，一个分布式、可伸缩的大型数据存储
  en: Apache HBase™ is the Hadoop database, a distributed, scalable, big data store
x:
  source: https://github.com/apache/hbase
  brew: hbase
rule:
  darwin/brew:
    cmd: brew install hbase
    reference: https://formulae.brew.sh/formula/hbase#default
  arch/yay:
    cmd: yay -S hbase
    reference: https://aur.archlinux.org/packages/hbase
binlist:
- hbase

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 约 20 MB（估算）
            en: ~20 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
