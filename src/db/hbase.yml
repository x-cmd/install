lang: Java
homepage: https://github.com/apache/hbase
license: Apache-2.0
desc:
  cn: Apache HBase™ 是 Hadoop 数据库，一个分布式、可伸缩的大型数据存储
  en: Apache HBase™ is the Hadoop database, a distributed, scalable, big data store
x:
  source: https://github.com/apache/hbase
rule:
  darwin/brew:
    cmd: brew install hbase
    reference: https://formulae.brew.sh/formula/hbase#default
  arch/yay:
    cmd: yay -S hbase
    reference: https://aur.archlinux.org/packages/hbase
binlist:
- hbase

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
