lang: Go
homepage: https://github.com/jorgerojas26/lazysql
license: MIT
desc:
  cn: 用 Go 编写的跨平台 TUI 数据库管理工具
  en: A cross-platform TUI database management tool written in Go
  cs: Nástroj pro správu databází TUI napsaný v Go, dostupný na různých platformách
  de: Ein plattformübergreifendes TUI-Datenbankverwaltungstool, geschrieben in Go
  es: Una herramienta TUI multiplataforma de gestión de bases de datos escrita en Go
  fr: Un outil de gestion de bases de données TUI multiplateforme écrit en Go
  id: Alat manajemen database TUI lintas platform yang ditulis dengan Go
  it: Uno strumento di gestione dei database TUI multipiattaforma scritto in Go
  ja: Go で書かれたクロスプラットフォームの TUI データベース管理ツール
  ko: Go로 작성된 크로스 플랫폼 TUI 데이터베이스 관리 도구
  pl: Narzędzie do zarządzania bazami danych w TUI, napisane w Go, działające na różnych platformach
  pt: Uma ferramenta TUI multiplataforma de gerenciamento de banco de dados escrita em Go
  ro: Un instrument TUI de gestionare a bazelor de date, scris în Go, pentru mai multe platforme
  ru: Кроссплатформенный TUI-инструмент для управления базами данных, написанный на Go
  th: เครื่องมือจัดการฐานข้อมูลแบบ TUI ข้ามแพลตฟอร์มที่เขียนด้วย Go
  tr: Go ile yazılmış, platformlar arası TUI veritabanı yönetim aracı
  uk: Кроссплатформний TUI-інструмент для керування базами даних, написаний на Go
  vi: Công cụ quản lý cơ sở dữ liệu TUI đa nền tảng được viết bằng Go
x:
  source: https://github.com/jorgerojas26/lazysql
  eget: jorgerojas26/lazysql
  brew: jorgerojas26/lazysql/lazysql
  yay: lazysql
  paru: lazysql
  go: github.com/jorgerojas26/lazysql@latest
rule:
  /x:
    cmd: x pkg use lazysql
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jorgerojas26/lazysql
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap jorgerojas26/lazysql

      brew install lazysql

      '
    reference: https://github.com/jorgerojas26/lazysql?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/jorgerojas26/lazysql@latest
    reference: https://github.com/jorgerojas26/lazysql?tab=readme-ov-file#installation
    dsnap: github.com/jorgerojas26/lazysql@latest
  arch/paru:
    cmd: paru -S lazysql
    reference: https://github.com/jorgerojas26/lazysql?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S lazysql
    reference: https://github.com/jorgerojas26/lazysql?tab=readme-ov-file#installation
binlist:
- lazysql

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
