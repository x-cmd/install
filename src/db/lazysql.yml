lang: Go
homepage: https://github.com/jorgerojas26/lazysql
license: MIT
desc:
  cn: 用 Go 编写的跨平台 TUI 数据库管理工具
  en: A cross-platform TUI database management tool written in Go
x:
  pkg:
    exist: true
  source: https://github.com/jorgerojas26/lazysql
  eget: https://github.com/jorgerojas26/lazysql
rule:
  /x:
    cmd: x pkg use lazysql
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jorgerojas26/lazysql
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap jorgerojas26/lazysql

      brew install lazysql

      '
    reference: https://github.com/jorgerojas26/lazysql?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/jorgerojas26/lazysql@latest
    reference: https://github.com/jorgerojas26/lazysql?tab=readme-ov-file#installation
    dsnap: github.com/jorgerojas26/lazysql@latest
  arch/paru:
    cmd: paru -S lazysql
    reference: https://github.com/jorgerojas26/lazysql?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S lazysql
    reference: https://github.com/jorgerojas26/lazysql?tab=readme-ov-file#installation
binlist:
- lazysql

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
