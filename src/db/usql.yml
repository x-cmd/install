homepage: https://github.com/xo/usql
license: MIT
desc:
  cn: 用于与 SQL 数据库交互的通用命令行界面
  en: Universal command-line interface for SQL databases
lang: Go
x:
  pkg:
    exist: true
  source: https://github.com/xo/usql
  eget: https://github.com/xo/usql
rule:
  /x:
    cmd: x pkg use usql
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget xo/usql
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use usql
    reference: https://github.com/itspngu/asdf-usql
  darwin/brew:
    cmd: brew install xo/xo/usql
    reference: https://github.com/xo/usql?tab=readme-ov-file#installing-via-homebrew-macos-and-linux
  arch/pacman:
    cmd: sudo pacman -S usql
    reference: https://github.com/xo/usql?tab=readme-ov-file#installing-via-aur-arch-linux
  arch/yay:
    cmd: yay -S usql
    reference: https://aur.archlinux.org/packages/usql
  (win|wsl2)/scoop:
    cmd: x scoop install usql
    reference: https://github.com/xo/usql#installing
binlist:
- usql

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 53 MB
          rating: 3
          desc:
            cn: 安装 53 MB
            en: 53 MB install
        download:
          estimate: 53 MB
          desc:
            cn: 约 53 MB 下载 (macos/x64)
            en: ~53 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
