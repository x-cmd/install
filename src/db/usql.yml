homepage: https://github.com/xo/usql
license: MIT
desc:
  cn: 用于与 SQL 数据库交互的通用命令行界面
  en: Universal command-line interface for SQL databases
lang: Go
x:
  pkg:
    exist: true
  source: https://github.com/xo/usql
  eget: https://github.com/xo/usql
rule:
  /x:
    cmd: x pkg use usql
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget xo/usql
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use usql
    reference: https://github.com/itspngu/asdf-usql
  darwin/brew:
    cmd: brew install xo/xo/usql
    reference: https://github.com/xo/usql?tab=readme-ov-file#installing-via-homebrew-macos-and-linux
  arch/pacman:
    cmd: sudo pacman -S usql
    reference: https://github.com/xo/usql?tab=readme-ov-file#installing-via-aur-arch-linux
  arch/yay:
    cmd: yay -S usql
    reference: https://aur.archlinux.org/packages/usql
  (win|wsl2)/scoop:
    cmd: x scoop install usql
    reference: https://github.com/xo/usql#installing
binlist:
- usql

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
