lang: Go
homepage: https://github.com/ariga/atlas
license: Apache-2.0
desc:
  cn: Atlas 是使用现代 DevOps 原则管理和迁移数据库模式的语言无关工具
  en: Atlas is a language-agnostic tool for managing and migrating database schemas using modern DevOps principles
x:
  source: https://github.com/ariga/atlas
rule:
  /curl:
    cmd: curl -sSf https://atlasgo.sh | sh
    reference: https://github.com/ariga/atlas?tab=readme-ov-file#quick-installation
  darwin/brew:
    cmd: brew install ariga/tap/atlas
    reference: https://github.com/ariga/atlas?tab=readme-ov-file#quick-installation
  /npm:
    cmd: npx @ariga/atlas
    reference: https://github.com/ariga/atlas?tab=readme-ov-file#quick-installation
binlist:
- atlasgo

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
