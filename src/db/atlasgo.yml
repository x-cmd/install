lang: Go
homepage: https://github.com/ariga/atlas
license: Apache-2.0
desc:
  cn: Atlas 是使用现代 DevOps 原则管理和迁移数据库模式的语言无关工具
  en: Atlas is a language-agnostic tool for managing and migrating database schemas using modern DevOps principles
x:
  source: https://github.com/ariga/atlas
rule:
  /curl:
    cmd: curl -sSf https://atlasgo.sh | sh
    reference: https://github.com/ariga/atlas?tab=readme-ov-file#quick-installation
  darwin/brew:
    cmd: brew install ariga/tap/atlas
    reference: https://github.com/ariga/atlas?tab=readme-ov-file#quick-installation
  /npm:
    cmd: npx @ariga/atlas
    reference: https://github.com/ariga/atlas?tab=readme-ov-file#quick-installation
binlist:
- atlasgo

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
