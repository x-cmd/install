lang: Go
homepage: https://github.com/golang-migrate/migrate
desc:
  cn: 用 Go 编写的数据库迁移工具，用作 CLI 或导入为库
  en: Database migrations written in Go,use as CLI or import as library
x:
  pkg:
    exist: true
  source: https://github.com/golang-migrate/migrate
  eget: https://github.com/golang-migrate/migrate
rule:
  /x:
    cmd: x pkg use migrate
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget golang-migrate/migrate
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install golang-migrate
    reference: https://formulae.brew.sh/formula/golang-migrate#default
  /scoop:
    cmd: scoop install main/migrate
    reference: https://scoop.sh/#/apps?q=migrate
  arch/yay:
    cmd: yay -S migrate
    reference: https://aur.archlinux.org/packages/migrate
binlist:
- migrate
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 MB
          rating: 2
          desc:
            cn: 安装 17 MB
            en: 17 MB install
        download:
          estimate: 17 MB
          desc:
            cn: 约 17 MB 下载 (linux/x64)
            en: ~17 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
