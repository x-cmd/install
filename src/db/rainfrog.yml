lang: 'Rust'
homepage: https://github.com/achristmascarl/rainfrog
license: 'MIT'
desc:
  cn: 终端中的数据库工具
  en: '🐸 a database tool for the terminal'
x:
  source: https://github.com/achristmascarl/rainfrog
  eget: https://github.com/achristmascarl/rainfrog
rule:
  /eget:
    cmd: x eget achristmascarl/rainfrog
    reference: https://github.com/achristmascarl/rainfrog
binlist:
- 'rainfrog'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 22 MB
          rating: 2
          desc:
            cn: 安装 22 MB
            en: 22 MB install
        download:
          estimate: 22 MB
          desc:
            cn: 约 22 MB 下载 (linux/x64)
            en: ~22 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
