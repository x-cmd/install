lang: 'Rust'
homepage: https://github.com/achristmascarl/rainfrog
license: 'MIT'
desc:
  cn: 终端中的数据库工具
  en: '🐸 a database tool for the terminal'
  cs: 🐸 nástroj pro práci s databázemi v terminálu
  de: 🐸 ein Datenbanktool für das Terminal
  es: 🐸 una herramienta de base de datos para la terminal
  fr: 🐸 un outil de base de données pour le terminal
  id: 🐸 alat basis data untuk terminal
  it: 🐸 uno strumento per database da terminale
  ja: 🐸 ターミナル向けのデータベースツール
  ko: 🐸 터미널용 데이터베이스 도구
  pl: 🐸 narzędzie do baz danych dla terminala
  pt: 🐸 uma ferramenta de banco de dados para o terminal
  ro: 🐸 un instrument pentru baze de date pentru terminal
  ru: 🐸 инструмент для работы с базами данных в терминале
  th: 🐸 เครื่องมือฐานข้อมูลสำหรับเทอร์มินัล
  tr: 🐸 terminal için bir veritabanı aracı
  uk: 🐸 інструмент для роботи з базами даних у терміналі
  vi: 🐸 công cụ cơ sở dữ liệu cho terminal
x:
  source: https://github.com/achristmascarl/rainfrog
  eget: achristmascarl/rainfrog
rule:
  /eget:
    cmd: x eget achristmascarl/rainfrog
    reference: https://github.com/achristmascarl/rainfrog
binlist:
- 'rainfrog'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 22 MB
          rating: 2
          desc:
            cn: 安装 22 MB
            en: 22 MB install
        download:
          estimate: 22 MB
          desc:
            cn: 约 22 MB 下载 (linux/x64)
            en: ~22 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
