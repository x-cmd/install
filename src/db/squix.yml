lang: 'Go'
homepage: https://github.com/eduardofuncao/squix
license: 'MIT'
desc:
  cn: 用 Go 编写、基于 BubbleTea 的跨多数据库 SQL 查询管理 CLI
  en: 'A minimal CLI tool for managing and executing SQL queries across multiple databases. Written in Go, made beautiful with BubbleTea'
x:
  source: https://github.com/eduardofuncao/squix
  eget: https://github.com/eduardofuncao/squix
rule:
  /eget:
    cmd: x eget eduardofuncao/squix
    reference: https://github.com/eduardofuncao/squix
binlist:
  - 'squix'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
