lang: 'Go'
homepage: https://github.com/eduardofuncao/squix
license: 'MIT'
desc:
  cn: 用 Go 编写、基于 BubbleTea 的跨多数据库 SQL 查询管理 CLI
  en: 'A minimal CLI tool for managing and executing SQL queries across multiple databases. Written in Go, made beautiful with BubbleTea'
x:
  source: https://github.com/eduardofuncao/squix
  eget: eduardofuncao/squix
rule:
  /eget:
    cmd: x eget eduardofuncao/squix
    reference: https://github.com/eduardofuncao/squix
binlist:
- 'squix'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 108 MB
          rating: 3
          desc:
            cn: 安装 108 MB
            en: 108 MB install
        download:
          estimate: 108 MB
          desc:
            cn: 约 108 MB 下载 (linux/x64)
            en: ~108 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
