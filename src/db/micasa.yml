lang: 'Go'
homepage: https://github.com/cpcloud/micasa
license: 'Apache-2.0'
desc:
  cn: 用于追踪家居项目、维护计划与家电报价的模态 TUI
  en: 'A modal TUI for tracking home projects, maintenance schedules, appliances, and vendor quotes.'
x:
  source: https://github.com/cpcloud/micasa
  eget: https://github.com/cpcloud/micasa
rule:
  /eget:
    cmd: x eget cpcloud/micasa
    reference: https://github.com/cpcloud/micasa
binlist:
  - 'micasa'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7.5 MB
          rating: 1
          desc:
            cn: 约 7.5 MB（估算）
            en: ~7.5 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
