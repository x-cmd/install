lang: 'Go'
homepage: https://github.com/cpcloud/micasa
license: 'Apache-2.0'
desc:
  cn: 用于追踪家居项目、维护计划与家电报价的模态 TUI
  en: 'A modal TUI for tracking home projects, maintenance schedules, appliances, and vendor quotes.'
  cs: Modální TUI pro sledování domácích projektů, plánů údržby, spotřebičů a nabídek dodavatelů.
  de: Ein modales TUI zur Verfolgung von Heimprojekten, Wartungsplänen, Geräten und Anbieterangeboten.
  es: Una TUI modal para seguir proyectos del hogar, calendarios de mantenimiento, electrodomésticos y cotizaciones de proveedores.
  fr: Une TUI modale pour suivre les projets domestiques, les calendriers d'entretien, les appareils et les devis des fournisseurs.
  id: TUI modal untuk melacak proyek rumah, jadwal perawatan, peralatan, dan penawaran vendor.
  it: Una TUI modale per monitorare progetti domestici, piani di manutenzione, elettrodomestici e preventivi dei fornitori.
  ja: 家庭プロジェクト、メンテナンス計画、家電、ベンダーの見積を追跡するモーダル TUI。
  ko: 가정 프로젝트, 유지 보수 일정, 가전제품, 공급업체 견적을 관리하는 모달 TUI.
  pl: Modalne TUI do śledzenia projektów domowych, harmonogramów konserwacji, urządzeń i ofert dostawców.
  pt: Uma TUI modal para acompanhar projetos domésticos, cronogramas de manutenção, eletrodomésticos e cotações de fornecedores.
  ro: Un TUI modal pentru urmărirea proiectelor casnice, planurilor de întreținere, electrocasnicelor și ofertelor furnizorilor.
  ru: Модальный TUI для отслеживания домашних проектов, графиков обслуживания, бытовой техники и предложений поставщиков.
  th: TUI แบบโมดัลสำหรับติดตามโครงการบ้าน ตารางบำรุงรักษา เครื่องใช้ไฟฟ้า และใบเสนอราคาจากผู้ขาย
  tr: Ev projelerini, bakım planlarını, cihazları ve tedarikçi tekliflerini takip etmek için modal bir TUI.
  uk: Модальний TUI для відстеження домашніх проєктів, графіків обслуговування, побутової техніки та пропозицій постачальників.
  vi: TUI kiểu modal để theo dõi các dự án nhà, lịch bảo trì, thiết bị gia dụng và báo giá từ nhà cung cấp.
x:
  source: https://github.com/cpcloud/micasa
  eget: cpcloud/micasa
rule:
  /eget:
    cmd: x eget cpcloud/micasa
    reference: https://github.com/cpcloud/micasa
binlist:
  - 'micasa'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7.5 MB
          rating: 1
          desc:
            cn: 约 7.5 MB（估算）
            en: ~7.5 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
