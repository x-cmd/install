lang: 'Python'
homepage: 'https://github.com/Kohei-Wada/taskdog'
license: 'MIT'
desc:
  cn: 智能调度优化的终端任务管理器，纯键盘操作
  en: 'Terminal task manager with intelligent schedule optimization.Keyboard-only. No dragging, no micromanagement.'
x:
  source: https://github.com/Kohei-Wada/taskdog
  eget: https://github.com/Kohei-Wada/taskdog
rule:
  /eget:
    cmd: x eget Kohei-Wada/taskdog
    reference: https://github.com/Kohei-Wada/taskdog
binlist:
  - 'taskdog'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
