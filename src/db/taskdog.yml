lang: 'Python'
homepage: 'https://github.com/Kohei-Wada/taskdog'
license: 'MIT'
desc:
  cn: 智能调度优化的终端任务管理器，纯键盘操作
  en: 'Terminal task manager with intelligent schedule optimization.Keyboard-only. No dragging, no micromanagement.'
x:
  source: https://github.com/Kohei-Wada/taskdog
  eget: https://github.com/Kohei-Wada/taskdog
rule:
  /eget:
    cmd: x eget Kohei-Wada/taskdog
    reference: https://github.com/Kohei-Wada/taskdog
binlist:
  - 'taskdog'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 158 KB
          rating: 1
          desc:
            cn: 约 158 KB（估算）
            en: ~158 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
