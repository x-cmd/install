lang: Go
homepage: https://github.com/gobackup/gobackup
license: MIT
desc:
  cn: GoBackup 是一款专为应用服务器设计的备份工具，用于定期将您的数据库( MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd)、文件备份到云存储（FTP、SCP、S3、GCS、阿里云 OSS...）
  en: GoBackup is a backup tool specifically designed for application servers, used to regularly back up your databases (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) and files to cloud storage (FTP, SCP, S3, GCS, Alibaba Cloud OSS, etc.).
  cs: GoBackup je nástroj pro zálohování navržený speciálně pro aplikační servery, který slouží k pravidelnému zálohování vašich databází (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) a souborů do cloudového úložiště (FTP, SCP, S3, GCS, Alibaba Cloud OSS atd.).
  de: GoBackup ist ein Backup-Tool, das speziell für Anwendungsserver entwickelt wurde und mit dem regelmäßigen Sichern Ihrer Datenbanken (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) und Dateien in einen Cloud-Speicher (FTP, SCP, S3, GCS, Alibaba Cloud OSS usw.) verwendet wird.
  es: GoBackup es una herramienta de copia de seguridad diseñada específicamente para servidores de aplicaciones, que se usa para respaldar periódicamente sus bases de datos (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) y archivos en almacenamiento en la nube (FTP, SCP, S3, GCS, Alibaba Cloud OSS, etc.).
  fr: GoBackup est un outil de sauvegarde spécifiquement conçu pour les serveurs d'applications, utilisé pour sauvegarder régulièrement vos bases de données (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) et vos fichiers vers un stockage cloud (FTP, SCP, S3, GCS, Alibaba Cloud OSS, etc.).
  id: GoBackup adalah alat pencadangan yang dirancang khusus untuk server aplikasi, digunakan untuk secara rutin mencadangkan basis data Anda (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) dan berkas ke penyimpanan cloud (FTP, SCP, S3, GCS, Alibaba Cloud OSS, dll.).
  it: GoBackup è uno strumento di backup progettato specificamente per i server applicativi, usato per eseguire regolarmente il backup dei tuoi database (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) e dei file su storage cloud (FTP, SCP, S3, GCS, Alibaba Cloud OSS, ecc.).
  ja: GoBackup はアプリケーションサーバー向けに特別に設計されたバックアップツールで、データベース（MySQL、PostgreSQL、Redis、MongoDB、SQLite、Microsoft SQL Server、InfluxDB、MariaDB、etcd）やファイルをクラウドストレージ（FTP、SCP、S3、GCS、Alibaba Cloud OSS など）へ定期的にバックアップします。
  ko: GoBackup는 애플리케이션 서버를 위해 특별히 설계된 백업 도구로, 데이터베이스(MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd)와 파일을 클라우드 저장소(FTP, SCP, S3, GCS, Alibaba Cloud OSS 등)에 정기적으로 백업하는 데 사용됩니다.
  pl: GoBackup to narzędzie do tworzenia kopii zapasowych zaprojektowane specjalnie dla serwerów aplikacji, używane do regularnego backupowania baz danych (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) i plików w chmurze (FTP, SCP, S3, GCS, Alibaba Cloud OSS itd.).
  pt: O GoBackup é uma ferramenta de backup projetada especificamente para servidores de aplicativos, usada para fazer backup regularmente de seus bancos de dados (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) e arquivos em armazenamento em nuvem (FTP, SCP, S3, GCS, Alibaba Cloud OSS, etc.).
  ro: GoBackup este un instrument de backup creat special pentru serverele de aplicații, folosit pentru a face periodic copii de rezervă ale bazelor de date (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) și ale fișierelor în stocare în cloud (FTP, SCP, S3, GCS, Alibaba Cloud OSS etc.).
  ru: GoBackup — это инструмент резервного копирования, специально разработанный для серверов приложений, который регулярно сохраняет ваши базы данных (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) и файлы в облачное хранилище (FTP, SCP, S3, GCS, Alibaba Cloud OSS и др.).
  th: GoBackup คือเครื่องมือสำรองข้อมูลที่ออกแบบมาเฉพาะสำหรับแอปเซิร์ฟเวอร์ ใช้สำรองฐานข้อมูล (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) และไฟล์ของคุณไปยังที่เก็บข้อมูลบนคลาวด์ (FTP, SCP, S3, GCS, Alibaba Cloud OSS ฯลฯ) อย่างสม่ำเสมอ
  tr: GoBackup, özellikle uygulama sunucuları için tasarlanmış bir yedekleme aracıdır; veritabanlarınızı (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) ve dosyalarınızı düzenli olarak bulut depolamaya (FTP, SCP, S3, GCS, Alibaba Cloud OSS vb.) yedeklemek için kullanılır.
  uk: GoBackup — це інструмент резервного копіювання, спеціально розроблений для серверів застосунків, який регулярно зберігає ваші бази даних (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) та файли в хмарне сховище (FTP, SCP, S3, GCS, Alibaba Cloud OSS тощо).
  vi: GoBackup là công cụ sao lưu được thiết kế riêng cho máy chủ ứng dụng, dùng để thường xuyên sao lưu cơ sở dữ liệu (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) và tệp của bạn lên bộ nhớ đám mây (FTP, SCP, S3, GCS, Alibaba Cloud OSS, v.v.).
x:
  source: https://github.com/gobackup/gobackup
  eget: gobackup/gobackup
  brew: gobackup
rule:
  /x:
    cmd: x pkg use gobackup
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget gobackup/gobackup
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sSL https://gobackup.github.io/install | sh
    reference: https://github.com/gobackup/gobackup?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install gobackup
    reference: https://github.com/gobackup/gobackup?tab=readme-ov-file#installation
binlist:
- gobackup

