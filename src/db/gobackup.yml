lang: Go
homepage: https://github.com/gobackup/gobackup
license: MIT
desc:
  cn: GoBackup 是一款专为应用服务器设计的备份工具，用于定期将您的数据库( MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd)、文件备份到云存储（FTP、SCP、S3、GCS、阿里云 OSS...）
  en: GoBackup is a backup tool specifically designed for application servers, used to regularly back up your databases (MySQL, PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd) and files to cloud storage (FTP, SCP, S3, GCS, Alibaba Cloud OSS, etc.).
x:
  source: https://github.com/gobackup/gobackup
  eget: https://github.com/gobackup/gobackup
  brew: gobackup
rule:
  /x:
    cmd: x pkg use gobackup
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget gobackup/gobackup
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sSL https://gobackup.github.io/install | sh
    reference: https://github.com/gobackup/gobackup?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install gobackup
    reference: https://github.com/gobackup/gobackup?tab=readme-ov-file#installation
binlist:
- gobackup

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
