lang: Rust
homepage: https://github.com/t8y2/dbx
license: Apache-2.0
desc:
  cn: 轻量级跨平台数据库管理工具，单文件 ~20MB 二进制支持 MySQL、 PostgreSQL、 SQLite、 Redis、 MongoDB、 DuckDB、 SQL Server、 达梦等 80+ 数据库，内置 AI、 MCP Server、 CLI、 桌面端与 Docker 部署
  en: DBX is a lightweight, cross-platform database management tool — a single ~20 MB binary that supports 80+ databases (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng, and more), with built-in AI, MCP Server, CLI, desktop and Docker deployments
  cs: DBX je lehký, multiplatformní nástroj pro správu databází — jediný binární soubor ~20 MB, který podporuje 80+ databází (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng a další), s vestavěnou AI, MCP Server, CLI, desktopovými a Docker nasazeními
  de: DBX ist ein leichtgewichtiges, plattformübergreifendes Datenbankverwaltungstool — eine einzelne ~20 MB große Binärdatei, die 80+ Datenbanken unterstützt (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng und mehr), mit integrierter KI, MCP Server, CLI, Desktop- und Docker-Bereitstellung
  es: "DBX es una herramienta ligera y multiplataforma de gestión de bases de datos: un único binario de ~20 MB que admite más de 80 bases de datos (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng y más), con IA, MCP Server, CLI, escritorio y despliegues con Docker integrados"
  fr: DBX est un outil léger et multiplateforme de gestion de bases de données — un seul binaire d'environ 20 Mo prenant en charge plus de 80 bases de données (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng et plus), avec IA intégrée, MCP Server, CLI, versions desktop et déploiements Docker
  id: DBX adalah alat manajemen basis data lintas platform yang ringan — satu biner ~20 MB yang mendukung 80+ basis data (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng, dan lainnya), dengan AI bawaan, MCP Server, CLI, serta versi desktop dan Docker
  it: "DBX è un leggero strumento di gestione di database multipiattaforma: un unico binario di ~20 MB che supporta oltre 80 database (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng e altri), con AI integrata, MCP Server, CLI, versione desktop e distribuzioni Docker"
  ja: DBX は軽量なクロスプラットフォームのデータベース管理ツールで、80 以上のデータベース（MySQL、PostgreSQL、SQLite、Redis、MongoDB、DuckDB、SQL Server、Dameng など）に対応した約 20 MB の単一バイナリです。組み込み AI、MCP Server、CLI、デスクトップ版、Docker デプロイに対応しています
  ko: DBX는 가벼운 크로스 플랫폼 데이터베이스 관리 도구로, 80개 이상의 데이터베이스(MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng 등)를 지원하는 약 20 MB 단일 바이너리이며 내장 AI, MCP Server, CLI, 데스크톱 및 Docker 배포를 제공합니다
  pl: DBX to lekki, wieloplatformowy narzędzie do zarządzania bazami danych — pojedynczy plik binarny o ~20 MB obsługujący 80+ baz danych (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng i inne), z wbudowaną AI, MCP Server, CLI, wersjami desktopowymi i wdrożeniami Docker
  pt: O DBX é uma ferramenta leve e multiplataforma de gerenciamento de bancos de dados — um único binário de ~20 MB que suporta mais de 80 bancos de dados (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng e mais), com IA integrada, MCP Server, CLI, versões desktop e implantações via Docker
  ro: DBX este un instrument ușor, multiplatformă de administrare a bazelor de date — un singur binar de ~20 MB care acceptă 80+ baze de date (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng și altele), cu AI integrat, MCP Server, CLI, versiuni desktop și implementări Docker
  ru: "DBX — лёгкий кроссплатформенный инструмент управления базами данных: единый бинарный файл размером ~20 МБ, поддерживающий более 80 баз данных (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng и другие), со встроенным ИИ, MCP Server, CLI, настольной версией и развёртыванием в Docker"
  th: DBX คือเครื่องมือจัดการฐานข้อมูลข้ามแพลตฟอร์มที่มีน้ำหนักเบา — ไฟล์ไบนารีเดียวขนาด ~20 MB รองรับฐานข้อมูลกว่า 80 รายการ (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng และอื่น ๆ) พร้อม AI ในตัว, MCP Server, CLI และการติดตั้งแบบเดสก์ท็อปและ Docker
  tr: DBX, hafif ve platformlar arası bir veritabanı yönetim aracıdır — 80'den fazla veritabanını (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng ve daha fazlası) destekleyen ~20 MB'lık tek bir ikili dosya; gömülü AI, MCP Server, CLI, masaüstü ve Docker dağıtım seçenekleriyle birlikte gelir
  uk: "DBX — це легкий кроссплатформний інструмент керування базами даних: єдиний бінарний файл розміром ~20 МБ, який підтримує понад 80 баз даних (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng та інші), зі вбудованим ШІ, MCP Server, CLI, десктопною версією та розгортанням у Docker"
  vi: DBX là công cụ quản lý cơ sở dữ liệu đa nền tảng, nhẹ — một tệp nhị phân duy nhất khoảng 20 MB hỗ trợ hơn 80 cơ sở dữ liệu (MySQL, PostgreSQL, SQLite, Redis, MongoDB, DuckDB, SQL Server, Dameng và hơn nữa), tích hợp AI, MCP Server, CLI, bản desktop và triển khai Docker
x:
  source: https://github.com/t8y2/dbx
  eget: t8y2/dbx
  scoop: dbx
  winget: t8y2.dbx
rule:
  /eget:
    cmd: x eget t8y2/dbx
    reference: https://github.com/t8y2/dbx
  darwin/brew:
    cmd: brew install --cask dbx
    reference: https://github.com/t8y2/dbx#install
  win/scoop:
    cmd: |
      scoop bucket add dbx https://github.com/t8y2/scoop-bucket
      scoop install dbx
    reference: https://github.com/t8y2/dbx#install
  win/winget:
    cmd: winget install t8y2.dbx
    reference: https://github.com/t8y2/dbx#install
binlist:
  - dbx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取数据库连接配置与查询文件
          en: Reads database connection config and query files
        sensitive: []
      write:
        desc:
          cn: 写入本地缓存与 MCP 服务状态
          en: Writes local cache and MCP server state
        sensitive:
          - "$HOME/.config/dbx"
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
