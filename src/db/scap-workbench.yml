lang: C++
homepage: https://github.com/OpenSCAP/scap-workbench
license: GPL-3.0
desc:
  cn: SCAP Workbench 是一个图形化实用程序，它提供了一种执行常见 oscap 任务的简单方法
  en: SCAP Workbench is a graphical utility that offers an easy way to perform common  oscap  tasks
x:
  source: https://github.com/OpenSCAP/scap-workbench
  eget: https://github.com/OpenSCAP/scap-workbench
rule:
  /eget:
    cmd: x eget OpenSCAP/scap-workbench
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install scap-workbench
    reference: https://command-not-found.com/scap-workbench
    dsnap: scap-workbench
  ubuntu/apt:
    cmd: sudo apt-get install scap-workbench
    reference: https://command-not-found.com/scap-workbench
    dsnap: scap-workbench
  kali/apt:
    cmd: sudo apt-get install scap-workbench
    reference: https://command-not-found.com/scap-workbench
    dsnap: scap-workbench
  centos/yum:
    cmd: sudo yum install scap-workbench
    reference: https://command-not-found.com/scap-workbench
  fedora/dnf:
    cmd: sudo dnf install scap-workbench
    reference: https://command-not-found.com/scap-workbench
    dsnap: scap-workbench
  raspbian/apt:
    cmd: sudo apt-get install scap-workbench
    reference: https://command-not-found.com/scap-workbench
  arch/yay:
    cmd: yay -S scap-workbench
    reference: https://aur.archlinux.org/packages/scap-workbench
binlist:
- scap-workbench

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 104 MB
          rating: 3
          desc:
            cn: 安装 104 MB
            en: 104 MB install
        download:
          estimate: 104 MB
          desc:
            cn: 约 104 MB 下载 (dmg)
            en: ~104 MB download (dmg)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
