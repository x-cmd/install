lang: 'Go'
homepage: 'https://github.com/kiki-ki/go-qo'
license: 'MIT'
desc:
  cn: 用 SQL 查询 JSON 与 CSV 的极简交互式 TUI
  en: 'qo is an interactive minimalist TUI to query JSON and CSV using SQL.'
x:
  source: https://github.com/kiki-ki/go-qo
  eget: kiki-ki/go-qo
rule:
  /eget:
    cmd: x eget kiki-ki/go-qo
    reference: https://github.com/kiki-ki/go-qo
binlist:
  - 'qo'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
