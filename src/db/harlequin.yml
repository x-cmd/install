lang: Python
homepage: https://github.com/tconbeer/harlequin
license: MIT
desc:
  cn: Harlequin 是一个 SQL IDE，适用于 DuckDB、SQLite 和在终端中运行的其他数据库
  en: Harlequin is a SQL IDE for DuckDB, SQLite, and other databases that runs in your Terminal
x:
  pkg:
    exist: true
  source: https://github.com/tconbeer/harlequin
  eget: https://github.com/tconbeer/harlequin
rule:
  /eget:
    cmd: x eget tconbeer/harlequin
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use harlequin
    reference: https://x-cmd.com/install/
  /uv:
    cmd: uv tool install harlequin
    reference: https://github.com/tconbeer/harlequin?tab=readme-ov-file#installing-harlequin
    dsnap: harlequin
  /pip:
    cmd: pip install harlequin
    reference: https://github.com/tconbeer/harlequin?tab=readme-ov-file#installing-harlequin
    dsnap: harlequin
  darwin/brew:
    cmd: brew install harlequin
    reference: https://github.com/tconbeer/harlequin?tab=readme-ov-file#installing-harlequin
  /pipx:
    cmd: pipx install harlequin
    reference: https://harlequin.sh/docs/getting-started
  arch/yay:
    cmd: yay -S harlequin
    reference: https://aur.archlinux.org/packages/harlequin
binlist:
- harlequin

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 86 KB
          rating: 1
          desc:
            cn: 约 86 KB（估算）
            en: ~86 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
