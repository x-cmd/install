lang: Rust
desc:
  en: Scalable datastore for metrics, events, and real-time analytics
  cn: 用于指标、事件和实时分析的可扩展数据存储
homepage: https://github.com/influxdata/influxdb
license: Apache-2.0
x:
  source: https://github.com/influxdata/influxdb
  brew: influxdbrule:
  /x:
    cmd: x pkg use influxdb
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install influxdb
    reference: https://docs.influxdata.com/influxdb/v2/install/#use-homebrew
binlist:
- influxdb

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 约 14 MB（估算）
            en: ~14 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
