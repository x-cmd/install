lang: Rust
desc:
  en: Scalable datastore for metrics, events, and real-time analytics
  cn: 用于指标、事件和实时分析的可扩展数据存储
  cs: Škálovatelný datový sklad pro metriky, události a analýzu v reálném čase
  de: Skalierbarer Datenspeicher für Metriken, Ereignisse und Echtzeitanalyse
  es: Almacén de datos escalable para métricas, eventos y análisis en tiempo real
  fr: Magasin de données évolutif pour les métriques, les événements et l'analyse en temps réel
  id: Penyimpanan data yang dapat diskalakan untuk metrik, peristiwa, dan analitik real-time
  it: Archivio dati scalabile per metriche, eventi e analisi in tempo reale
  ja: メトリクス、イベント、リアルタイム分析のためのスケーラブルなデータストア
  ko: 메트릭, 이벤트 및 실시간 분석을 위한 확장 가능한 데이터 저장소
  pl: Skalowalny magazyn danych dla metryk, zdarzeń i analityki w czasie rzeczywistym
  pt: Armazenamento de dados escalável para métricas, eventos e análises em tempo real
  ro: Depozit de date scalabil pentru metrici, evenimente și analiză în timp real
  ru: Масштабируемое хранилище данных для метрик, событий и аналитики в реальном времени
  th: คลังข้อมูลที่ปรับขยายได้สำหรับเมตริก เหตุการณ์ และการวิเคราะห์แบบเรียลไทม์
  tr: Metrikler, olaylar ve gerçek zamanlı analitik için ölçeklenebilir veri deposu
  uk: Масштабоване сховище даних для метрик, подій та аналітики в реальному часі
  vi: Kho dữ liệu có thể mở rộng cho số liệu, sự kiện và phân tích thời gian thực
homepage: https://github.com/influxdata/influxdb
license: Apache-2.0
x:
  source: https://github.com/influxdata/influxdb
  brew: influxdb
rule:
  /x:
    cmd: x pkg use influxdb
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install influxdb
    reference: https://docs.influxdata.com/influxdb/v2/install/#use-homebrew
binlist:
- influxdb

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 约 14 MB（估算）
            en: ~14 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
