lang: 'Rust'
homepage: https://github.com/ricardodantas/perch
license: 'GPL-3.0'
desc:
  cn: Mastodon 与 Bluesky 的精美终端社交客户端
  en: 'A beautiful terminal social client for Mastodon and Bluesky 🐦'
  cs: Krásný terminálový sociální klient pro Mastodon a Bluesky 🐦
  de: Ein schöner Social-Client im Terminal für Mastodon und Bluesky 🐦
  es: Unhurioso cliente social de terminal para Mastodon y Bluesky 🐦
  fr: Un beau client social pour terminal pour Mastodon et Bluesky 🐦
  id: Klien sosial terminal yang indah untuk Mastodon dan Bluesky 🐦
  it: Un bel client sociale da terminale per Mastodon e Bluesky 🐦
  ja: Mastodon と Bluesky の美しいターミナルソーシャルクライアント 🐦
  ko: Mastodon과 Bluesky를 위한 아름다운 터미널 소셜 클라이언트 🐦
  pl: Piękny terminalowy klient społecznościowy dla Mastodon i Bluesky 🐦
  pt: Um belo cliente social de terminal para Mastodon e Bluesky 🐦
  ro: Un frumos client social de terminal pentru Mastodon și Bluesky 🐦
  ru: Красивый терминальный социальный клиент для Mastodon и Bluesky 🐦
  th: ไคลเอนต์โซเชียลเทอร์มินัลที่สวยงามสำหรับ Mastodon และ Bluesky 🐦
  tr: Mastodon ve Bluesky için harika bir terminal sosyal istemcisi 🐦
  uk: Гарний термінальний соціальний клієнт для Mastodon і Bluesky 🐦
  vi: Một client mạng xã hội trên terminal tuyệt đẹp cho Mastodon và Bluesky 🐦
x:
  source: https://github.com/ricardodantas/perch
  eget: ricardodantas/perch
rule:
  /eget:
    cmd: x eget ricardodantas/perch
    reference: https://github.com/ricardodantas/perch
binlist:
- 'perch'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
