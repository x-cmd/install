lang: 'Rust'
homepage: https://github.com/ricardodantas/perch
license: 'GPL-3.0'
desc:
  cn: Mastodon 与 Bluesky 的精美终端社交客户端
  en: 'A beautiful terminal social client for Mastodon and Bluesky 🐦'
x:
  source: https://github.com/ricardodantas/perch
  eget: https://github.com/ricardodantas/perch
rule:
  /eget:
    cmd: x eget ricardodantas/perch
    reference: https://github.com/ricardodantas/perch
binlist:
  - 'perch'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
