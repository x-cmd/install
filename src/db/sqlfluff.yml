lang: Python
homepage: https://github.com/sqlfluff/sqlfluff
license: MIT
desc:
  cn: SQL linter 和格式化工具，支持多种 SQL ，如  MySQL、Oracle 等
  en: A modular SQL linter and auto-formatter with support for multiple dialects and templated code
x:
  pkg:
    exist: true
  source: https://github.com/sqlfluff/sqlfluff
rule:
  /x:
    cmd: x pkg use sqlfluff
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install sqlfluff
    reference: https://github.com/sqlfluff/sqlfluff#getting-started
    dsnap: sqlfluff
  darwin/brew:
    cmd: brew install sqlfluff
    reference: https://formulae.brew.sh/formula/sqlfluff#default
binlist:
- sqlfluff

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 425 KB
          rating: 1
          desc:
            cn: 约 425 KB（估算）
            en: ~425 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
