lang: Python
homepage: https://github.com/sqlfluff/sqlfluff
license: MIT
desc:
  cn: SQL linter 和格式化工具，支持多种 SQL ，如  MySQL、Oracle 等
  en: A modular SQL linter and auto-formatter with support for multiple dialects and templated code
x:
  pkg:
    exist: true
  source: https://github.com/sqlfluff/sqlfluff
rule:
  /x:
    cmd: x pkg use sqlfluff
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install sqlfluff
    reference: https://github.com/sqlfluff/sqlfluff#getting-started
    dsnap: sqlfluff
  darwin/brew:
    cmd: brew install sqlfluff
    reference: https://formulae.brew.sh/formula/sqlfluff#default
binlist:
- sqlfluff

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
