lang: Go
homepage: https://github.com/etcd-io/etcd
license: Apache-2.0
desc:
  cn: etcd 是一个具有强一致性的分布式键值存储，提供了一种可靠的方式来存储需要被分布式系统或机器集群访问的数据
  en: etcd is a strongly consistent, distributed key-value store that provides a reliable way to store data that needs to be accessed by a distributed system or cluster of machines
x:
  pkg:
    exist: true
  source: https://github.com/etcd-io/etcd
  eget: https://github.com/etcd-io/etcd
rule:
  /eget:
    cmd: x eget etcd-io/etcd
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use etcd
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use etcd
    reference: https://github.com/particledecay/asdf-etcd
  darwin/brew:
    cmd: brew install etcd
    reference: https://formulae.brew.sh/formula/etcd#default
  arch/yay:
    cmd: yay -S etcd
    reference: https://aur.archlinux.org/packages/etcd
binlist:
- etcd

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
