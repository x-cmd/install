lang: Go
homepage: https://github.com/etcd-io/etcd
license: Apache-2.0
desc:
  cn: etcd 是一个具有强一致性的分布式键值存储，提供了一种可靠的方式来存储需要被分布式系统或机器集群访问的数据
  en: etcd is a strongly consistent, distributed key-value store that provides a reliable way to store data that needs to be accessed by a distributed system or cluster of machines
x:
  source: https://github.com/etcd-io/etcd
  eget: https://github.com/etcd-io/etcd
  brew: etcd
  yay: etcd
  asdf: asdf
rule:
  /eget:
    cmd: x eget etcd-io/etcd
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use etcd
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use etcd
    reference: https://github.com/particledecay/asdf-etcd
  darwin/brew:
    cmd: brew install etcd
    reference: https://formulae.brew.sh/formula/etcd#default
  arch/yay:
    cmd: yay -S etcd
    reference: https://aur.archlinux.org/packages/etcd
binlist:
- etcd

# already profiled
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 59 MB
          rating: 3
          desc:
            cn: 安装 59 MB
            en: 59 MB install
        download:
          estimate: 23 MB
          desc:
            cn: 约 23 MB 下载 (linux/x64)
            en: ~23 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
