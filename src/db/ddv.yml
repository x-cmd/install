lang: Rust
homepage: https://github.com/Lusingander/ddv
license: MIT
desc:
  cn: DDV 是一款 TUI 应用程序，可在终端中查看 Amazon DynamoDB。
  en: DDV is a TUI application to view Amazon DynamoDB in the terminal.
x:
  source: https://github.com/Lusingander/ddv
  eget: Lusingander/ddv
  brew: lusingander/tap/ddv
  yay: ddv
  cargo: ddv
rule:
  /eget:
    cmd: x eget Lusingander/ddv
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install ddv
    reference: https://github.com/lusingander/ddv?tab=readme-ov-file#cargo
    dsnap: ddv
  darwin/brew:
    cmd: brew install lusingander/tap/ddv
    reference: https://github.com/lusingander/ddv?tab=readme-ov-file#homebrew-macos
  arch/yay:
    cmd: yay -S ddv
    reference: https://aur.archlinux.org/packages/ddv
binlist:
- ddv

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
