lang: Rust
homepage: https://github.com/Lusingander/ddv
license: MIT
desc:
  cn: DDV 是一款 TUI 应用程序，可在终端中查看 Amazon DynamoDB。
  en: DDV is a TUI application to view Amazon DynamoDB in the terminal.
x:
  source: https://github.com/Lusingander/ddv
  eget: https://github.com/Lusingander/ddv
rule:
  /eget:
    cmd: x eget Lusingander/ddv
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install ddv
    reference: https://github.com/lusingander/ddv?tab=readme-ov-file#cargo
    dsnap: ddv
  darwin/brew:
    cmd: brew install lusingander/tap/ddv
    reference: https://github.com/lusingander/ddv?tab=readme-ov-file#homebrew-macos
  arch/yay:
    cmd: yay -S ddv
    reference: https://aur.archlinux.org/packages/ddv
binlist:
- ddv

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
