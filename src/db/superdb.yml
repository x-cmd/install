lang: Go
homepage: https://superdb.org/
desc:
  cn: SuperDB 是一个新的分析型数据库，支持关系表和 JSON 数据结构，并且在这两者之间提供平等的支持。
  en: SuperDB is a new analytics database that supports relational tables and JSON on an equal footing.
rule:
  darwin/brew:
    cmd: brew install brimdata/tap/super
    reference: https://superdb.org/docs/install/#homebrew
  linux/brew:
    cmd: brew install brimdata/tap/super
    reference: https://superdb.org/docs/install/#homebrew
  /go:
    cmd: go install github.com/brimdata/super/cmd/super@latest
    reference: https://superdb.org/docs/install/#building-from-source
    dsnap: super
  arch/yay:
    cmd: yay -S superdb-bin
    reference: https://aur.archlinux.org/packages/superdb-bin
binlist:
- superdb
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
