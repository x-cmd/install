x:
  source: https://github.com/Cod-e-Codes/marchat
  eget: Cod-e-Codes/marchat
  apt: xclip
rule:
  debian/apt:
    cmd: 'sudo apt install xclip'
    reference: https://github.com/Cod-e-Codes/marchat
  /eget:
    cmd: x eget Cod-e-Codes/marchat
    reference: https://github.com/Cod-e-Codes/marchat
binlist:
- 'marchat'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 MB
          rating: 2
          desc:
            cn: 安装 25 MB
            en: 25 MB install
        download:
          estimate: 25 MB
          desc:
            cn: 约 25 MB 下载 (linux/x64)
            en: ~25 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
