lang: 'Rust'
homepage: 'https://github.com/gluesql/glues'
license: 'Apache-2.0'
desc:
  cn: 受 Vim 启发、注重隐私的多后端 TUI 笔记应用
  en: 'Vim-inspired TUI note-taking app with multi-backend storage — privacy-focused'
x:
  source: https://github.com/gluesql/glues
  eget: https://github.com/gluesql/glues
rule:
  /eget:
    cmd: x eget gluesql/glues
    reference: https://github.com/gluesql/glues
binlist:
  - 'glues'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
