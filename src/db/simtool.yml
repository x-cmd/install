lang: 'Go'
homepage: 'https://github.com/azizuysal/simtool'
license: 'MIT'
desc:
  cn: 管理 iOS 模拟器的精美强大 TUI
  en: 'A beautiful and powerful TUI for managing iOS Simulators'
x:
  source: https://github.com/azizuysal/simtool
  eget: azizuysal/simtool
rule:
  darwin/brew:
    cmd: 'brew install'
    reference: https://github.com/azizuysal/simtool
  /eget:
    cmd: x eget azizuysal/simtool
    reference: https://github.com/azizuysal/simtool
binlist:
- 'simtool'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (macos/arm64)
            en: ~9 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
