lang: 'Go'
homepage: 'https://github.com/azizuysal/simtool'
license: 'MIT'
desc:
  cn: 管理 iOS 模拟器的精美强大 TUI
  en: 'A beautiful and powerful TUI for managing iOS Simulators'
  cs: Krásné a mocné TUI pro správu simulátorů iOS
  de: Ein schönes und leistungsstarkes TUI zur Verwaltung von iOS-Simulatoren
  es: Un TUI bonito y potente para gestionar simuladores de iOS
  fr: Un TUI élégant et puissant pour gérer les simulateurs iOS
  id: TUI yang indah dan kuat untuk mengelola Simulator iOS
  it: Un TUI bello e potente per gestire i Simulator di iOS
  ja: iOS Simulator を管理するための美观で強力な TUI
  ko: iOS 시뮬레이터를 관리하기 위한 보기 좋고 강력한 TUI
  pl: Ładny i potężny TUI do zarządzania symulatorami iOS
  pt: Um TUI bonito e poderoso para gerenciar simuladores do iOS
  ro: Un TUI frumos și puternic pentru gestionarea simulatoarelor iOS
  ru: Красивый и мощный TUI для управления симуляторами iOS
  th: TUI ที่สวยงามและทรงพลังสำหรับจัดการ iOS Simulator
  tr: iOS Simulators yönetmek için güzel ve güçlü bir TUI
  uk: Гарний і потужний TUI для керування симуляторами iOS
  vi: Giao diện TUI đẹp và mạnh mẽ để quản lý Trình mô phỏng iOS
x:
  source: https://github.com/azizuysal/simtool
  eget: azizuysal/simtool
rule:
  darwin/brew:
    cmd: 'brew install'
    reference: https://github.com/azizuysal/simtool
  /eget:
    cmd: x eget azizuysal/simtool
    reference: https://github.com/azizuysal/simtool
binlist:
- 'simtool'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (macos/arm64)
            en: ~9 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
