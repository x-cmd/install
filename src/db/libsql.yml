lang: Shell
homepage: https://github.com/libsql/libsql
license: NOASSERTION
desc:
  cn: libsql 软件安装工具
  en: libsql — software install
x:
  source: https://github.com/libsql/libsql
  eget: https://github.com/libsql/libsql
rule:
  /eget:
    cmd: x eget libsql/libsql
    reference: https://github.com/libsql/libsql
binlist:
- libsql

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
