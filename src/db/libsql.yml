lang: Shell
homepage: https://github.com/libsql/libsql
license: NOASSERTION
desc:
  cn: libsql 软件安装工具
  en: libsql — software install
x:
  source: https://github.com/libsql/libsql
  eget: https://github.com/libsql/libsql
rule:
  /eget:
    cmd: x eget libsql/libsql
    reference: https://github.com/libsql/libsql
binlist:
- libsql

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 55 MB
          rating: 3
          desc:
            cn: 约 55 MB（估算）
            en: ~55 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
