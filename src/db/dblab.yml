lang: Go
homepage: https://github.com/danvergara/dblab
license: MIT
desc:
  cn: Dblab 是一个快速、轻量级的基于交互式终端的用于 PostgreSQL、 MySQL 和 SQLite3 的 UI 应用程序，用 Go 编写，可以在 OSX、 Linux 和 Windows 机器上运行
  en: Dblab is a fast and lightweight interactive terminal based UI application for PostgreSQL, MySQL and SQLite3, written in Go and works on OSX, Linux and Windows machines
x:
  source: https://github.com/danvergara/dblab
  eget: https://github.com/danvergara/dblab
  brew: danvergara/tools/dblab
  yay: dblab
  curl: curl
rule:
  /eget:
    cmd: x eget danvergara/dblab
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install danvergara/tools/dblab
    reference: https://github.com/danvergara/dblab?tab=readme-ov-file#homebrew
  /curl:
    cmd: curl https://raw.githubusercontent.com/danvergara/dblab/master/scripts/install_update_linux.sh | bash
    reference: https://github.com/danvergara/dblab?tab=readme-ov-file#automated-installationupdate
  arch/yay:
    cmd: yay -S dblab
    reference: https://aur.archlinux.org/packages/dblab
binlist:
- dblab

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 安装 12 MB
            en: 12 MB install
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
