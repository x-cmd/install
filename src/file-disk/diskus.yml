lang: Rust
homepage: https://github.com/sharkdp/diskus
license: Apache-2.0
desc:
  cn: Diskus 是一个非常简单的计算工作目录总大小的程序
  en: Diskus is a very simple program that computes the total size of the current directory
  cs: Diskus je velmi jednoduchý program, který vypočítá celkovou velikost aktuálního adresáře
  de: Diskus ist ein sehr einfaches Programm, das die Gesamtgröße des aktuellen Verzeichnisses berechnet
  es: Diskus es un programa muy sencillo que calcula el tamaño total del directorio actual
  fr: Diskus est un programme très simple qui calcule la taille totale du répertoire courant
  id: Diskus adalah program sederhana yang menghitung total ukuran direktori saat ini
  it: Diskus è un programma molto semplice che calcola la dimensione totale della directory corrente
  ja: Diskus は現在のディレクトリの合計サイズを計算するとてもシンプルなプログラムです
  ko: Diskus는 현재 디렉터리의 전체 크기를 계산하는 매우 간단한 프로그램입니다
  pl: Diskus to bardzo prosty program obliczający całkowity rozmiar bieżącego katalogu
  pt: O Diskus é um programa muito simples que calcula o tamanho total do diretório atual
  ro: Diskus este un program foarte simplu care calculează dimensiunea totală a directorului curent
  ru: Diskus — очень простая программа, вычисляющая общий размер текущего каталога
  th: Diskus เป็นโปรแกรมที่เรียบง่ายมากในการคำนวณขนาดรวมของไดเรกทอรีปัจจุบัน
  tr: Diskus, geçerli dizinin toplam boyutunu hesaplayan çok basit bir programdır
  uk: Diskus — дуже проста програма, яка обчислює загальний розмір поточного каталогу
  vi: Diskus là chương trình rất đơn giản tính tổng kích thước của thư mục hiện tại
x:
  source: https://github.com/sharkdp/diskus
  eget: sharkdp/diskus
  brew: diskus
  pacman: diskus
  yay: diskus-git
  cargo: diskus
rule:
  /eget:
    cmd: x eget sharkdp/diskus
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install diskus
    reference: https://github.com/sharkdp/diskus?tab=readme-ov-file#via-cargo
    dsnap: diskus
  darwin/brew:
    cmd: brew install diskus
    reference: https://github.com/sharkdp/diskus?tab=readme-ov-file#on-macos
  nix/:
    cmd: nix-env -iA nixos.diskus
    reference: https://github.com/sharkdp/diskus?tab=readme-ov-file#on-nixos
  debian/wget:
    cmd: 'wget "https://github.com/sharkdp/diskus/releases/download/v0.7.0/diskus_0.7.0_amd64.deb"

      sudo dpkg -i diskus_0.7.0_amd64.deb

      '
    reference: https://github.com/sharkdp/diskus?tab=readme-ov-file#on-debian-based-systems
  /pacman:
    cmd: pacman -S diskus
    reference: https://github.com/sharkdp/diskus?tab=readme-ov-file#on-arch-based-systems
  arch/yay:
    cmd: yay -S diskus-git
    reference: https://aur.archlinux.org/packages/diskus-git
binlist:
- diskus

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 420 KB
          rating: 1
          desc:
            cn: 安装 420 KB
            en: 420 KB install
        download:
          estimate: 420 KB
          desc:
            cn: 约 420 KB 下载 (linux/x64)
            en: ~420 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
