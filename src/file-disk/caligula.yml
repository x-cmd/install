lang: 'Rust'
homepage: 'https://github.com/ifd3f/caligula'
license: 'GPL-3.0'
desc:
  cn: 用户友好的轻量级磁盘镜像 TUI
  en: 'A user-friendly, lightweight TUI for disk imaging'
x:
  source: https://github.com/ifd3f/caligula
  eget: https://github.com/ifd3f/caligula
rule:
  /cargo:
    cmd: 'cargo install caligula'
    reference: https://github.com/ifd3f/caligula
  arch/pacman:
    cmd: 'pacman -S caligula'
    reference: https://github.com/ifd3f/caligula
  /eget:
    cmd: x eget ifd3f/caligula
    reference: https://github.com/ifd3f/caligula
binlist:
  - 'caligula'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
