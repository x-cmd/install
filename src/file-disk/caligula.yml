lang: 'Rust'
homepage: 'https://github.com/ifd3f/caligula'
license: 'GPL-3.0'
desc:
  cn: 用户友好的轻量级磁盘镜像 TUI
  en: 'A user-friendly, lightweight TUI for disk imaging'
  cs: Uživatelsky přátelské lehké TUI pro vytváření obrazů disků
  de: Ein benutzerfreundliches, leichtgewichtiges TUI zum Erstellen von Disk-Abbildern
  es: Una TUI ligera y fácil de usar para crear imágenes de disco
  fr: Une TUI légère et conviviale pour créer des images de disque
  id: TUI ringan yang ramah pengguna untuk pembuatan citra disk
  it: Una TUI leggera e user-friendly per la creazione di immagini disco
  ja: ディスクイメージ作成のための軽量でユーザーフレンドリーな TUI
  ko: 디스크 이미징을 위한 가볍고 사용자 친화적인 TUI
  pl: Lekki, przyjazny użytkownikowi TUI do tworzenia obrazów dysków
  pt: Uma TUI leve e amigável para criar imagens de disco
  ro: O interfață TUI ușoară și prietenoasă cu utilizatorul pentru crearea imaginilor de disc
  ru: Лёгкий и удобный TUI для создания образов дисков
  th: TUI ที่ใช้งานง่ายและมีน้ำหนักเบา สำหรับสร้างอิมเมจดิสก์
  tr: Disk imajı oluşturmak için kullanıcı dostu, hafif bir TUI
  uk: Легкий і зручний TUI для створення образів дисків
  vi: Giao diện TUI nhẹ, thân thiện với người dùng để tạo ảnh đĩa
x:
  source: https://github.com/ifd3f/caligula
  eget: ifd3f/caligula
  pacman: caligula
  cargo: caligula
rule:
  /cargo:
    cmd: 'cargo install caligula'
    reference: https://github.com/ifd3f/caligula
  arch/pacman:
    cmd: 'pacman -S caligula'
    reference: https://github.com/ifd3f/caligula
  /eget:
    cmd: x eget ifd3f/caligula
    reference: https://github.com/ifd3f/caligula
binlist:
- 'caligula'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
