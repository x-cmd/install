lang: Go
homepage: https://github.com/restic/restic
license: BSD-2-Clause
desc:
  cn: Restic 是一个快速，高效且安全的备份程序
  en: Restic is a backup program that is fast, efficient and secure
  cs: Restic je program pro zálohování, který je rychlý, efektivní a bezpečný
  de: Restic ist ein Backup-Programm, das schnell, effizient und sicher ist
  es: Restic es un programa de copia de seguridad que es rápido, eficiente y seguro
  fr: Restic est un programme de sauvegarde qui est rapide, efficace et sûr
  id: Restic adalah program cadangan yang cepat, efisien, dan aman
  it: Restic è un programma di backup che è veloce, efficiente e sicuro
  ja: Restic は高速で効率的かつ安全なバックアッププログラムです
  ko: Restic는 빠르고 효율적이며 안전한 백업 프로그램입니다
  pl: Restic to program do tworzenia kopii zapasowych, który jest szybki, wydajny i bezpieczny
  pt: Restic é um programa de backup que é rápido, eficiente e seguro
  ro: Restic este un program de backup care este rapid, eficient și sigur
  ru: Restic — это программа резервного копирования, которая быстра, эффективна и безопасна
  th: Restic คือโปรแกรมสำรองข้อมูลที่ทำงานได้เร็ว มีประสิทธิภาพ และปลอดภัย
  tr: Restic hızlı, verimli ve güvenli bir yedekleme programıdır
  uk: Restic — це програма резервного копіювання, яка швидка, ефективна та безпечна
  vi: Restic là chương trình sao lưu nhanh, hiệu quả và an toàn
x:
  source: https://github.com/restic/restic
  eget: restic/restic
  apt: restic
  dnf: restic
  brew: restic
  pacman: restic
  apk: restic
  apt-get: restic
  zypper: restic
  port: restic
  eopkg: restic
  scoop: restic
  choco: restic
  winget: restic.restic
  asdf: restic
rule:
  /eget:
    cmd: x eget restic/restic
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use restic
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use restic
    reference: https://github.com/xataz/asdf-restic
  alpine/apk:
    cmd: sudo apk add restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#alpine-linux
    dsnap: restic
  darwin/brew:
    cmd: brew install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#macos
  darwin/port:
    cmd: sudo port install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#macos
  /go:
    cmd: 'git clone https://github.com/restic/restic

      cd restic

      go run build.go

      '
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#from-source
    dsnap: restic
  debian/apt:
    cmd: sudo apt-get install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#debian
    dsnap: restic
  ubuntu/apt:
    cmd: sudo apt-get install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#debian
    dsnap: restic
  arch/pacman:
    cmd: sudo pacman -S restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#arch-linux
  kali/apt:
    cmd: sudo apt-get install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#debian
    dsnap: restic
  fedora/dnf:
    cmd: sudo dnf install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#fedora
    dsnap: restic
  centos/dnf:
    cmd: 'sudo dnf install epel-release \

      && sudo dnf install restic

      '
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#rhel-centos
  rhel/dnf:
    cmd: 'sudo dnf install epel-release \

      && sudo dnf install restic

      '
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#rhel-centos
  raspbian/apt:
    cmd: sudo apt-get install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#debian
  nix/:
    cmd: sudo nix-env --install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#nix-nixos
  openbsd/pkg_add:
    cmd: sudo pkg_add restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#openbsd
  freebsd/pkg:
    cmd: sudo pkg install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#freebsd
  opensuse/zypper:
    cmd: sudo zypper install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#opensuse
  solus/eopkg:
    cmd: sudo eopkg install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#solus
  (win|wsl2)/scoop:
    cmd: x scoop install restic
    reference: https://restic.readthedocs.io/en/stable/020_installation.html#windows
  (win|wsl2)/choco:
    cmd: x choco install restic
    reference: https://community.chocolatey.org/packages/restic
  (win|wsl2)/winget:
    cmd: x winget install restic.restic
    reference: https://winget.run/pkg/restic/restic
binlist:
- restic

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 安装 30 MB
            en: 30 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
