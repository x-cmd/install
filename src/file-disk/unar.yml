lang: C
homepage: https://github.com/ashang/unar
desc:
  cn: unar 是 The Unarchiver 的命令行解压引擎，支持 Zip、RAR、7z、Tar 等数十种归档格式，具备文件名编码自动检测功能。
  en: unar is the command-line unarchiving engine of The Unarchiver, supporting dozens of archive formats with automatic filename encoding detection.
  cs: unar je nástroj pro rozbalování z příkazové řádky od The Unarchiver, který podporuje desítky archivních formátů s automatickou detekcí kódování názvů souborů.
  de: unar ist die Kommandozeilen-Entpack-Engine von The Unarchiver und unterstützt Dutzende Archivformate mit automatischer Erkennung der Dateinamen-Kodierung.
  es: unar es el motor de descompresión de línea de comandos de The Unarchiver, compatible con decenas de formatos de archivo con detección automática de la codificación de nombres de archivo.
  fr: unar est le moteur de décompression en ligne de commande de The Unarchiver, prenant en charge des dizaines de formats d'archives avec détection automatique de l'encodage des noms de fichiers.
  id: unar adalah mesin ekstraksi baris perintah dari The Unarchiver, mendukung puluhan format arsip dengan deteksi pengkodean nama file otomatis.
  it: unar è il motore di decompressione da riga di comando di The Unarchiver, supporta dozzine di formati di archivio con rilevamento automatico della codifica dei nomi dei file.
  ja: unar は The Unarchiver のコマンドライン解凍エンジンで、数十のアーカイブ形式に対応し、ファイル名のエンコーディングを自動検出します。
  ko: unar는 The Unarchiver의 명령줄 압축 해제 엔진으로, 수십 가지 아카이브 형식을 지원하며 파일 이름 인코딩을 자동으로 감지합니다.
  pl: unar to silnik rozpakowywania z wiersza poleceń The Unarchiver, obsługujący dziesiątki formatów archiwów z automatycznym wykrywaniem kodowania nazw plików.
  pt: unar é o mecanismo de descompactação de linha de comando do The Unarchiver, com suporte a dezenas de formatos de arquivo e detecção automática da codificação de nomes de arquivo.
  ro: unar este motorul de decomprimare din linia de comandă al The Unarchiver, care acceptă zeci de formate de arhivă cu detectarea automată a codificării numelor de fișiere.
  ru: unar — это движок распаковки из командной строки от The Unarchiver, поддерживающий десятки форматов архивов с автоматическим определением кодировки имён файлов.
  th: unar คือเอนจินแตกแพ็กจากบรรทัดคำสั่งของ The Unarchiver รองรับรูปแบบไฟล์บีบอัดหลายสิบรูปแบบ พร้อมตรวจจับการเข้ารหัสชื่อไฟล์อัตโนมัติ
  tr: unar, The Unarchiver'ın komut satırı açma motorudur; dosya adı kodlamasını otomatik algılama özelliğiyle onlarca arşiv biçimini destekler.
  uk: unar — це двигун розпакування з командного рядка від The Unarchiver, що підтримує десятки форматів архівів з автоматичним визначенням кодування назв файлів.
  vi: unar là công cụ giải nén dòng lệnh của The Unarchiver, hỗ trợ hàng chục định dạng lưu trữ với tính năng tự động nhận diện mã hóa tên tệp.
x:
  source: https://github.com/ashang/unar
  apt: unar
  brew: unar
rule:
  darwin/brew:
    cmd: brew install unar
    reference: https://github.com/ashang/unar#build-on-macos-via-brew
  debian/apt:
    cmd: sudo apt install unar
    reference: https://command-not-found.com/unar
    dsnap: unar
  ubuntu/apt:
    cmd: sudo apt install unar
    reference: https://command-not-found.com/unar
    dsnap: unar
binlist:
- unar
license: NOASSERTION

