lang: Go
homepage: https://github.com/dundee/gdu
license: MIT
desc:
  cn: 用 Go 编写的磁盘使用分析器
  en: Pretty fast disk usage analyzer written in Go
x:
  pkg:
    exist: true
  source: https://github.com/dundee/gdu
  eget: https://github.com/dundee/gdu
rule:
  /x:
    cmd: x pkg use gdu
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dundee/gdu
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: 'curl -L https://github.com/dundee/gdu/releases/latest/download/gdu_linux_amd64.tgz | tar xz \

      && chmod +x gdu_linux_amd64 \

      && mv gdu_linux_amd64 /usr/bin/gdu

      '
    reference: https://github.com/dundee/gdu?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S gdu-bin
    reference: https://aur.archlinux.org/packages/gdu-bin
binlist:
- gdu

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.4 MB
          rating: 1
          desc:
            cn: 约 2.4 MB（估算）
            en: ~2.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
