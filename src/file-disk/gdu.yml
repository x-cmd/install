lang: Go
homepage: https://github.com/dundee/gdu
license: MIT
desc:
  cn: 用 Go 编写的磁盘使用分析器
  en: Pretty fast disk usage analyzer written in Go
  cs: Docela rychlý analyzér využití disku napsaný v Go
  de: Ziemlich schneller, in Go geschriebener Datenträgernutzungs-Analysator
  es: Analizador de uso de disco bastante rápido escrito en Go
  fr: Analyseur d'utilisation de disque assez rapide écrit en Go
  id: Analyzer penggunaan disk yang Pretty cepat dan ditulis dengan Go
  it: Analizzatore dell'uso del disco abbastanza veloce scritto in Go
  ja: Go で書かれた高速なディスク使用量アナライザー
  ko: Go로 작성된 빠른 디스크 사용량 분석기
  pl: Dość szybki analizator zużycia dysku napisany w Go
  pt: Analisador de uso de disco bastante rápido escrito em Go
  ro: Un analizor de utilizare a discului destul de rapid, scris în Go
  ru: Довольно быстрый анализатор использования диска, написанный на Go
  th: ตัววิเคราะห์การใช้พื้นที่ดิสก์ที่ค่อนข้างเร็ว เขียนด้วย Go
  tr: Go ile yazılmış oldukça hızlı bir disk kullanımı analizcisi
  uk: Досить швидкий аналізатор використання диска, написаний на Go
  vi: Trình phân tích mức sử dụng đĩa khá nhanh, viết bằng Go
x:
  source: https://github.com/dundee/gdu
  eget: dundee/gdu
  yay: gdu-bin
rule:
  /x:
    cmd: x pkg use gdu
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dundee/gdu
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: 'curl -L https://github.com/dundee/gdu/releases/latest/download/gdu_linux_amd64.tgz | tar xz \

      && chmod +x gdu_linux_amd64 \

      && mv gdu_linux_amd64 /usr/bin/gdu

      '
    reference: https://github.com/dundee/gdu?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S gdu-bin
    reference: https://aur.archlinux.org/packages/gdu-bin
binlist:
- gdu

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
