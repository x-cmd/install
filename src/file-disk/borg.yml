lang: Python
homepage: https://github.com/borgbackup/borg
desc:
  cn: 'BorgBackup (简称: Borg)是一个去重复的备份程序。它可以选择支持压缩和认证加密'
  en: 'BorgBackup (short: Borg) is a deduplicating backup program. Optionally, it supports compression and authenticated encryption'
  cs: BorgBackup (zkráceně Borg) je program pro zálohování s deduplikací. Volitelně podporuje kompresi a autentizované šifrování
  de: "BorgBackup (kurz: Borg) ist ein deduplizierendes Backup-Programm. Optional unterstützt es Komprimierung und authentifizierte Verschlüsselung"
  es: "BorgBackup (abrev: Borg) es un programa de copia de seguridad con deduplicación. Opcionalmente admite compresión y cifrado autenticado"
  fr: "BorgBackup (en bref : Borg) est un programme de sauvegarde dédupliquante. Il prend en charge la compression et le chiffrement authentifié en option"
  id: "BorgBackup (singkat: Borg) adalah program cadangan dengan deduplikasi. Secara opsional, ini mendukung kompresi dan enkripsi ter autentikasi"
  it: "BorgBackup (in breve: Borg) è un programma di backup con deduplicazione. Facoltativamente supporta compressione e crittografia autenticata"
  ja: "BorgBackup (略称: Borg) は重複排除型のバックアッププログラムです。任意で圧縮と認証済み暗号化に対応しています"
  ko: BorgBackup(줄여서 Borg)는 중복 제거 백업 프로그램입니다. 선택적으로 압축과 인증된 암호화를 지원합니다
  pl: "BorgBackup (w skrócie: Borg) to program do tworzenia kopii zapasowych z deduplikacją. Opcjonalnie obsługuje kompresję i szyfrowanie uwierzytelnione"
  pt: "BorgBackup (abreviado: Borg) é um programa de backup com desduplicação. Opcionalmente, oferece suporte a compactação e criptografia autenticada"
  ro: "BorgBackup (scurt: Borg) este un program de backup cu deduplicare. Opțional, acceptă compresie și criptare autentificată"
  ru: BorgBackup (сокр. Borg) — это программа резервного копирования с дедупликацией. При желании поддерживает сжатие и аутентифицированное шифрование
  th: "BorgBackup (ย่อ: Borg) คือโปรแกรมสำรองข้อมูลแบบลดข้อมูลซ้ำ รองรับการบีบอัดและการเข้ารหัสแบบยืนยันตัวตนได้เป็นตัวเลือก"
  tr: "BorgBackup (kısaca: Borg), tekilleştirme yapan bir yedekleme programıdır. İsteğe bağlı olarak sıkıştırma ve kimlik doğrulamalı şifrelemeyi destekler"
  uk: "BorgBackup (скорочено: Borg) — це програма резервного копіювання з дедуплікацією. За бажанням підтримує стиснення та автентифіковане шифрування"
  vi: "BorgBackup (viết tắt: Borg) là chương trình sao lưu có khử trùng lặp. Tùy chọn, nó hỗ trợ nén và mã hóa có xác thực"
x:
  source: https://github.com/borgbackup/borg
  eget: borgbackup/borg
  apt: borgbackup
  dnf: borgbackup
  brew: borgbackup
  pacman: borg
  apk: borgbackup
  apt-get: borgbackup
  zypper: borgbackup
  emerge: borgbackup
  pip: borgbackup
  asdf: borg
rule:
  /eget:
    cmd: x eget borgbackup/borg
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use borg
    reference: https://github.com/lwiechec/asdf-borg
  /pip:
    cmd: pip install borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#using-pip
    dsnap: borgbackup
  darwin/brew:
    cmd: brew install borgbackup
    reference: https://formulae.brew.sh/formula/borgbackup#default
  debian/apt:
    cmd: sudo apt install borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
    dsnap: borgbackup
  ubuntu/apt:
    cmd: sudo apt install borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
    dsnap: borgbackup
  alpine/apk:
    cmd: sudo apk add borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
    dsnap: borgbackup
  arch/pacman:
    cmd: sudo pacman -S borg
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  kali/apt:
    cmd: sudo apt-get install borgbackup
    reference: https://command-not-found.com/borg
    dsnap: borgbackup
  fedora/dnf:
    cmd: sudo dnf install borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
    dsnap: borgbackup
  raspbian/apt:
    cmd: sudo apt install borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  gentoo/emerge:
    cmd: sudo emerge borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  guixos/guix:
    cmd: guix package --install borg
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  freebsd/ports:
    cmd: cd /usr/ports/archivers/py-borgbackup && make install clean
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  mageia/urpmi:
    cmd: sudo urpmi borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  netbsd/pkg_add:
    cmd: pkg_add py-borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  openbsd/pkg_add:
    cmd: pkg_add borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  nix/nixpkgs:
    cmd: nix-env -i borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  openindiana/pkg:
    cmd: pkg install borg
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
  opensuse/zypper:
    cmd: sudo zypper in borgbackup
    reference: https://borgbackup.readthedocs.io/en/stable/installation.html#distribution-package
binlist:
- borg
license: NOASSERTION

