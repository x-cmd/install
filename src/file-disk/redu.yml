lang: Rust
homepage: https://github.com/drdo/redu
license: MIT
desc:
  en: it's ncdu for your restic repo
  cn: redu 是您的 restic repo 的 ncdu
x:
  source: https://github.com/drdo/redu
  eget: https://github.com/drdo/redu
rule:
  /eget:
    cmd: x eget drdo/redu
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo +nightly install redu --locked
    reference: https://github.com/drdo/redu?tab=readme-ov-file#installing
    dsnap: redu
  arch/yay:
    cmd: yay -S redu
    reference: https://aur.archlinux.org/packages/redu
binlist:
- redu

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
