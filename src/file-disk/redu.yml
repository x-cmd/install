lang: Rust
homepage: https://github.com/drdo/redu
license: MIT
desc:
  en: it's ncdu for your restic repo
  cn: redu 是您的 restic repo 的 ncdu
x:
  source: https://github.com/drdo/redu
  eget: https://github.com/drdo/redu
rule:
  /eget:
    cmd: x eget drdo/redu
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo +nightly install redu --locked
    reference: https://github.com/drdo/redu?tab=readme-ov-file#installing
    dsnap: redu
  arch/yay:
    cmd: yay -S redu
    reference: https://aur.archlinux.org/packages/redu
binlist:
- redu

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
