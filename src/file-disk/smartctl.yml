lang: C++
homepage: https://github.com/smartmontools/smartmontools
license: GPL-2.0
desc:
  cn: smartctl 是类 Unix 系统下实施 SMART 任务命令行套件或工具
  en: smartctl is a command-line suite or tool that implements SMART tasks under Unix-like systems
x:
  pkg:
    exist: true
  source: https://github.com/smartmontools/smartmontools
  eget: https://github.com/smartmontools/smartmontools
rule:
  /eget:
    cmd: x eget smartmontools/smartmontools
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use smartctl
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install smartmontools
    reference: https://formulae.brew.sh/formula/smartmontools#default
  debian/apt:
    cmd: sudo apt-get install smartmontools
    reference: https://command-not-found.com/smartctl
    dsnap: smartmontools
  ubuntu/apt:
    cmd: sudo apt-get install smartmontools
    reference: https://command-not-found.com/smartctl
    dsnap: smartmontools
  alpine/apk:
    cmd: sudo apk add smartmontools
    reference: https://command-not-found.com/smartctl
    dsnap: smartmontools
  arch/pacman:
    cmd: sudo pacman -S smartmontools
    reference: https://command-not-found.com/smartctl
  kali/apt:
    cmd: sudo apt-get install smartmontools
    reference: https://command-not-found.com/smartctl
    dsnap: smartmontools
  fedora/dnf:
    cmd: sudo dnf install smartmontools-1
    reference: https://command-not-found.com/smartctl
    dsnap: smartmontools-1
  raspbian/apt:
    cmd: sudo apt-get install smartmontools
    reference: https://command-not-found.com/smartctl
binlist:
- smartctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
