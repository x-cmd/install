lang: Go
homepage: https://github.com/muesli/duf
desc:
  cn: '`df` 命令的现代化替代品， 用于查看磁盘空间使用情况和磁盘文件系统信息'
  en: A modern alternative to the `df` command, used to view disk space usage and disk file system information
  cs: Moderní alternativa k příkazu `df`, která se používá k zobrazení využití diskového prostoru a informací o souborových systémech disku
  de: Eine moderne Alternative zum Befehl `df`, die zum Anzeigen des Datenträgerplatzbedarfs und der Dateisysteminformationen des Datenträgers verwendet wird
  es: Una alternativa moderna al comando `df`, que se usa para ver el uso del espacio en disco y la información del sistema de archivos del disco
  fr: Une alternative moderne à la commande `df`, utilisée pour consulter l'utilisation de l'espace disque et les informations du système de fichiers du disque
  id: Alternatif modern untuk perintah `df`, digunakan untuk melihat penggunaan ruang disk dan informasi sistem berkas disk
  it: Un'alternativa moderna al comando `df`, usata per visualizzare l'uso dello spazio disco e le informazioni sul file system del disco
  ja: "`df` コマンドのモダンな代替品で、ディスク容量の使用状況とディスクのファイルシステム情報を表示するために使われます"
  ko: "`df` 명령의 현대적인 대안으로, 디스크 공간 사용량과 디스크 파일 시스템 정보를 확인하는 데 사용됩니다"
  pl: Nowoczesna alternatywa dla polecenia `df`, używana do przeglądania wykorzystania miejsca na dysku i informacji o systemie plików dysku
  pt: Uma alternativa moderna ao comando `df`, usada para ver o uso de espaço em disco e as informações do sistema de arquivos do disco
  ro: O alternativă modernă la comanda `df`, folosită pentru a vedea utilizarea spațiului pe disc și informațiile sistemului de fișiere al discului
  ru: Современная альтернатива команде `df`, используемая для просмотра использования дискового пространства и сведений о файловой системе диска
  th: ทางเลือกสมัยใหม่ของคำสั่ง `df` ใช้ดูการใช้พื้นที่ดิสก์และข้อมูลระบบไฟล์ของดิสก์
  tr: "`df` komutuna modern bir alternatiftir; disk alanı kullanımını ve disk dosya sistemi bilgilerini görüntülemek için kullanılır"
  uk: Сучасна альтернатива команді `df`, яка використовується для перегляду використання дискового простору та відомостей про файлову систему диска
  vi: Một giải pháp thay thế hiện đại cho lệnh `df`, dùng để xem mức sử dụng dung lượng đĩa và thông tin hệ thống tệp của đĩa
x:
  source: https://github.com/muesli/duf
  eget: muesli/duf
  apt: duf
  brew: duf
  pacman: duf
  port: duf
  emerge: sys-fs/duf
  xbps: duf
  scoop: duf
  choco: duf
  asdf: duf
rule:
  /x:
    cmd: x pkg use duf
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget muesli/duf
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use duf
    reference: https://github.com/NeoHsu/asdf-duf
  darwin/brew:
    cmd: brew install duf
    reference: https://github.com/muesli/duf
  debian/apt:
    cmd: sudo apt install duf
    reference: https://github.com/muesli/duf
    dsnap: duf
  ubuntu/apt:
    cmd: sudo apt install duf
    reference: https://github.com/muesli/duf
    dsnap: duf
  arch/pacman:
    cmd: sudo pacman -S duf
    reference: https://github.com/muesli/duf
  gentoo/emerge:
    cmd: sudo emerge sys-fs/duf
    reference: https://github.com/muesli/duf
  void/xbps:
    cmd: sudo xbps-install -S duf
    reference: https://github.com/muesli/duf
  freebsd/pkg:
    cmd: pkg install duf
    reference: https://github.com/muesli/duf
  openbsd/pkg_add:
    cmd: pkg_add duf
    reference: https://github.com/muesli/duf
  nix/nixpkgs:
    cmd: nix-env -iA nixpkgs.duf
    reference: https://github.com/muesli/duf
  darwin/port:
    cmd: sudo port selfupdate && sudo port install duf
    reference: https://github.com/muesli/duf
  (win|wsl2)/scoop:
    cmd: x scoop install duf
    reference: https://github.com/muesli/duf
  (win|wsl2)/choco:
    cmd: x choco install duf
    reference: https://github.com/muesli/duf
binlist:
- duf
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
