lang: Go
homepage: https://github.com/muesli/duf
desc:
  cn: '`df` 命令的现代化替代品， 用于查看磁盘空间使用情况和磁盘文件系统信息'
  en: A modern alternative to the `df` command, used to view disk space usage and disk file system information
x:
  source: https://github.com/muesli/duf
  eget: https://github.com/muesli/duf
  apt: duf
  brew: duf
  pacman: duf
  port: duf
  emerge: sys-fs/duf
  xbps: duf
  scoop: duf
  choco: duf
  powershell: duf
  asdf: asdf
  pkg: duf
rule:
  /x:
    cmd: x pkg use duf
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget muesli/duf
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use duf
    reference: https://github.com/NeoHsu/asdf-duf
  darwin/brew:
    cmd: brew install duf
    reference: https://github.com/muesli/duf
  debian/apt:
    cmd: sudo apt install duf
    reference: https://github.com/muesli/duf
    dsnap: duf
  ubuntu/apt:
    cmd: sudo apt install duf
    reference: https://github.com/muesli/duf
    dsnap: duf
  arch/pacman:
    cmd: sudo pacman -S duf
    reference: https://github.com/muesli/duf
  gentoo/emerge:
    cmd: sudo emerge sys-fs/duf
    reference: https://github.com/muesli/duf
  void/xbps:
    cmd: sudo xbps-install -S duf
    reference: https://github.com/muesli/duf
  freebsd/pkg:
    cmd: pkg install duf
    reference: https://github.com/muesli/duf
  openbsd/pkg_add:
    cmd: pkg_add duf
    reference: https://github.com/muesli/duf
  nix/nixpkgs:
    cmd: nix-env -iA nixpkgs.duf
    reference: https://github.com/muesli/duf
  darwin/port:
    cmd: sudo port selfupdate && sudo port install duf
    reference: https://github.com/muesli/duf
  (win|wsl2)/scoop:
    cmd: x scoop install duf
    reference: https://github.com/muesli/duf
  (win|wsl2)/choco:
    cmd: x choco install duf
    reference: https://github.com/muesli/duf
binlist:
- duf
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
