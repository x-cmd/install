lang: Go
homepage: https://github.com/muesli/duf
desc:
  cn: '`df` 命令的现代化替代品， 用于查看磁盘空间使用情况和磁盘文件系统信息'
  en: A modern alternative to the `df` command, used to view disk space usage and disk file system information
x:
  pkg:
    exist: true
  source: https://github.com/muesli/duf
  eget: https://github.com/muesli/duf
rule:
  /x:
    cmd: x pkg use duf
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget muesli/duf
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use duf
    reference: https://github.com/NeoHsu/asdf-duf
  darwin/brew:
    cmd: brew install duf
    reference: https://github.com/muesli/duf
  debian/apt:
    cmd: sudo apt install duf
    reference: https://github.com/muesli/duf
    dsnap: duf
  ubuntu/apt:
    cmd: sudo apt install duf
    reference: https://github.com/muesli/duf
    dsnap: duf
  arch/pacman:
    cmd: sudo pacman -S duf
    reference: https://github.com/muesli/duf
  gentoo/emerge:
    cmd: sudo emerge sys-fs/duf
    reference: https://github.com/muesli/duf
  void/xbps:
    cmd: sudo xbps-install -S duf
    reference: https://github.com/muesli/duf
  freebsd/pkg:
    cmd: pkg install duf
    reference: https://github.com/muesli/duf
  openbsd/pkg_add:
    cmd: pkg_add duf
    reference: https://github.com/muesli/duf
  nix/nixpkgs:
    cmd: nix-env -iA nixpkgs.duf
    reference: https://github.com/muesli/duf
  darwin/port:
    cmd: sudo port selfupdate && sudo port install duf
    reference: https://github.com/muesli/duf
  (win|wsl2)/scoop:
    cmd: x scoop install duf
    reference: https://github.com/muesli/duf
  (win|wsl2)/choco:
    cmd: x choco install duf
    reference: https://github.com/muesli/duf
binlist:
- duf
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
