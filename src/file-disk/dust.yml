lang: Rust
homepage: https://github.com/bootandy/dust
license: Apache-2.0
desc:
  cn: '`du` 命令的现代化替代品， 用于查看磁盘空间使用情况'
  en: A modern alternative to the `du` command, used to view disk space usage
x:
  pkg:
    exist: true
  source: https://github.com/bootandy/dust
  eget: https://github.com/bootandy/dust
rule:
  /eget:
    cmd: x eget bootandy/dust
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use dust
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use dust
    reference: https://github.com/looztra/asdf-dust
  darwin/brew:
    cmd: brew install dust
    reference: https://github.com/bootandy/dust#-homebrew-mac-os
  linux/brew:
    cmd: 'brew tap tgotwig/linux-dust \

      && brew install dust

      '
    reference: https://github.com/bootandy/dust#-homebrew-linux
  debian/deb-get:
    cmd: sudo deb-get install du-dust
    reference: https://github.com/bootandy/dust
  ubuntu/deb-get:
    cmd: sudo deb-get install du-dust
    reference: https://github.com/bootandy/dust
  debian/pacstall:
    cmd: sudo pacstall -I dust-bin
    reference: https://github.com/bootandy/dust
  ubuntu/pacstall:
    cmd: sudo pacstall -I dust-bin
    reference: https://github.com/bootandy/dust
  (win|wsl2)/scoop:
    cmd: x scoop install dust
    reference: https://github.com/bootandy/dust
  arch/yay:
    cmd: yay -S dust-git
    reference: https://aur.archlinux.org/packages/dust-git
binlist:
- dust

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
