lang: Rust
homepage: https://github.com/Byron/dua-cli
license: MIT
desc:
  cn: dua（-> Disk Usage Analyzer）是一个可以方便地了解给定目录的磁盘空间使用情况的工具
  en: dua (-> Disk Usage Analyzer) is a tool to conveniently learn about the usage of disk space of a given directory
  cs: dua (-> Disk Usage Analyzer) je nástroj, který pohodlně ukazuje využití diskového prostoru daného adresáře
  de: dua (-> Disk Usage Analyzer) ist ein Werkzeug, das bequem Aufschluss über die Belegung des Datenträgers eines Verzeichnisses gibt
  es: dua (-> Disk Usage Analyzer) es una herramienta para conocer cómodamente el uso del espacio en disco de un directorio dado
  fr: dua (-> Disk Usage Analyzer) est un outil permettant de connaître facilement l'utilisation de l'espace disque d'un répertoire donné
  id: dua (-> Disk Usage Analyzer) adalah alat untuk dengan mudah mengetahui penggunaan ruang disk pada direktori tertentu
  it: dua (-> Disk Usage Analyzer) è uno strumento per conoscere comodamente l'uso dello spazio disco di una directory data
  ja: dua (-> Disk Usage Analyzer) は、指定したディレクトリのディスク使用量を分かりやすく確認できるツールです
  ko: dua (-> Disk Usage Analyzer)는 특정 디렉터리의 디스크 공간 사용량을 편리하게 확인해 주는 도구입니다
  pl: dua (-> Disk Usage Analyzer) to narzędzie, które wygodnie pokazuje wykorzystanie miejsca na dysku w danym katalogu
  pt: dua (-> Disk Usage Analyzer) é uma ferramenta para conveniently saber o uso de espaço em disco de um diretório
  ro: dua (-> Disk Usage Analyzer) este un instrument care permite aflarea cu ușurință a utilizării spațiului pe disc a unui director dat
  ru: dua (-> Disk Usage Analyzer) — это инструмент, позволяющий удобно узнать использование дискового пространства в указанном каталоге
  th: dua (-> Disk Usage Analyzer) คือเครื่องมือที่ช่วยให้ทราบการใช้พื้นที่ดิสก์ของไดเรกทอรีที่ระบุได้อย่างสะดวก
  tr: dua (-> Disk Usage Analyzer), belirli bir dizinin disk alanı kullanımını kolayca öğrenmek için bir araçtır
  uk: dua (-> Disk Usage Analyzer) — це інструмент, який зручно показує використання дискового простору у вказаному каталозі
  vi: dua (-> Disk Usage Analyzer) là công cụ giúp dễ dàng biết mức sử dụng dung lượng đĩa của một thư mục
x:
  source: https://github.com/Byron/dua-cli
  eget: Byron/dua-cli
  dnf: dua-cli
  brew: dua-cli
  pacman: dua-cli
  port: dua-cli
  scoop: dua
  cargo: dua-cli
rule:
  /eget:
    cmd: x eget Byron/dua-cli
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use dua
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install dua-cli
    reference: https://lib.rs/install/dua-cli
  darwin/port:
    cmd: sudo port install dua-cli
    reference: https://lib.rs/install/dua-cli
  fedora/dnf:
    cmd: sudo dnf install dua-cli
    reference: https://lib.rs/install/dua-cli
  arch/pacman:
    cmd: sudo pacman -S dua-cli
    reference: https://lib.rs/install/dua-cli
  darwin/curl:
    cmd: curl -LSfs https://raw.githubusercontent.com/Byron/dua-cli/master/ci/install.sh | sh -s -- --git Byron/dua-cli --crate dua --tag v2.17.4
    reference: https://lib.rs/install/dua-cli
  linux/curl:
    cmd: curl -LSfs https://raw.githubusercontent.com/Byron/dua-cli/master/ci/install.sh | sh -s -- --git Byron/dua-cli --target x86_64-unknown-linux-musl --crate dua --tag v2.17.4
    reference: https://lib.rs/install/dua-cli
  /cargo:
    cmd: cargo install dua-cli
    reference: https://lib.rs/install/dua-cli
    dsnap: dua-cli
  (win|wsl2)/scoop:
    cmd: x scoop install dua
    reference: https://lib.rs/install/dua-cli
binlist:
- dua

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
