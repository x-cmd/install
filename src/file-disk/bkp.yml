lang: Python
homepage: https://github.com/gergelyk/bkp
desc:
  cn: 用于备份文件/目录的实用程序。
  en: Utility that makes backups of your files/directories.
x:
  source: https://github.com/gergelyk/bkp
rule:
  /pip:
    cmd: pip install bkp
    reference: https://github.com/gergelyk/bkp#installation
    dsnap: bkp
binlist:
- bkp
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
