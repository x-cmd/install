lang: Python
homepage: https://github.com/gergelyk/bkp
desc:
  cn: 用于备份文件/目录的实用程序。
  en: Utility that makes backups of your files/directories.
x:
  source: https://github.com/gergelyk/bkp
rule:
  /pip:
    cmd: pip install bkp
    reference: https://github.com/gergelyk/bkp#installation
    dsnap: bkp
binlist:
- bkp
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
