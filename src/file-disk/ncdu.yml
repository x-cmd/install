lang: C
homepage: https://dev.yorhel.nl/ncdu
desc:
  cn: Ncdu 是一个带有 ncurses 接口的磁盘使用分析器
  en: Ncdu is a disk usage analyzer with an ncurses interface
  cs: Ncdu je analyzér využití disku s rozhraním ncurses
  de: Ncdu ist ein Datenträgernutzungs-Analysator mit einer ncurses-Oberfläche
  es: Ncdu es un analizador de uso de disco con una interfaz ncurses
  fr: Ncdu est un analyseur d'utilisation de disque avec une interface ncurses
  id: Ncdu adalah analyzer penggunaan disk dengan antarmuka ncurses
  it: Ncdu è un analizzatore dell'uso del disco con un'interfaccia ncurses
  ja: Ncdu は ncurses インターフェースを備えたディスク使用量アナライザーです
  ko: Ncdu는 ncurses 인터페이스를 가진 디스크 사용량 분석기입니다
  pl: Ncdu to analizator wykorzystania dysku z interfejsem ncurses
  pt: Ncdu é um analisador de uso de disco com uma interface ncurses
  ro: Ncdu este un analizor de utilizare a discului cu o interfață ncurses
  ru: Ncdu — это анализатор использования диска с интерфейсом ncurses
  th: Ncdu คือตัววิเคราะห์การใช้พื้นที่ดิสก์ที่มีอินเทอร์เฟซ ncurses
  tr: Ncdu, ncurses arayüzüne sahip bir disk kullanımı analizcisidir
  uk: Ncdu — це аналізатор використання диска з інтерфейсом ncurses
  vi: Ncdu là trình phân tích mức sử dụng đĩa với giao diện ncurses
x:
  apt: ncdu
  dnf: ncdu
  brew: ncdu
  pacman: ncdu
  apk: ncdu
  apt-get: ncdu
  yum: ncdu
  zypper: ncdu
rule:
  /x:
    cmd: x pkg use ncdu
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install ncdu
    reference: https://formulae.brew.sh/formula/ncdu#default
  debian/apt:
    cmd: sudo apt-get install ncdu
    reference: https://command-not-found.com/ncdu
    dsnap: ncdu
  ubuntu/apt:
    cmd: sudo apt-get install ncdu
    reference: https://command-not-found.com/ncdu
    dsnap: ncdu
  alpine/apk:
    cmd: sudo apk add ncdu
    reference: https://command-not-found.com/ncdu
    dsnap: ncdu
  arch/pacman:
    cmd: sudo pacman -S ncdu
    reference: https://command-not-found.com/ncdu
  kali/apt:
    cmd: sudo apt-get install ncdu
    reference: https://command-not-found.com/ncdu
    dsnap: ncdu
  centos/yum:
    cmd: sudo yum install ncdu
    reference: https://www.cyberciti.biz/open-source/install-ncdu-on-linux-unix-ncurses-disk-usage/
  fedora/dnf:
    cmd: sudo dnf install ncdu
    reference: https://command-not-found.com/ncdu
    dsnap: ncdu
  raspbian/apt:
    cmd: sudo apt-get install ncdu
    reference: https://command-not-found.com/ncdu
  opensuse/zypper:
    cmd: sudo zypper in ncdu
    reference: https://www.cyberciti.biz/open-source/install-ncdu-on-linux-unix-ncurses-disk-usage/
  freebsd/pkg:
    cmd: sudo pkg install ncdu
    reference: https://www.cyberciti.biz/open-source/install-ncdu-on-linux-unix-ncurses-disk-usage/
  openbsd/pkg_add:
    cmd: doas pkg_add ncdu
    reference: https://www.cyberciti.biz/open-source/install-ncdu-on-linux-unix-ncurses-disk-usage/
binlist:
- ncdu
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
