lang: C
homepage: https://github.com/util-linux/util-linux
license: GPL-2.0
desc:
  cn: 一个用于使用 Curss ui 的硬盘上管理分区表和分区的程序
  en: A program for managing partition tables and partitions on a hard disk using a curses UI
x:
  source: https://github.com/util-linux/util-linux
rule:
  debian/apt:
    cmd: sudo apt-get install util-linux
    reference: https://command-not-found.com/cfdisk
    dsnap: util-linux
  ubuntu/apt:
    cmd: sudo apt-get install util-linux
    reference: https://command-not-found.com/cfdisk
    dsnap: util-linux
  alpine/apt:
    cmd: sudo apk add util-linux
    reference: https://command-not-found.com/cfdisk
  arch/pacman:
    cmd: sudo pacman -S util-linux
    reference: https://command-not-found.com/cfdisk
  kali/apt:
    cmd: sudo apt-get install util-linux
    reference: https://command-not-found.com/cfdisk
    dsnap: util-linux
  centos/yum:
    cmd: sudo yum install util-linux
    reference: https://command-not-found.com/cfdisk
  fedora/dnf:
    cmd: sudo dnf install util-linux
    reference: https://command-not-found.com/cfdisk
  raspbian/apt:
    cmd: sudo apt-get install util-linux
    reference: https://command-not-found.com/cfdisk
  darwin/brew:
    cmd: brew install util-linux
    reference: https://formulae.brew.sh/formula/util-linux#default
binlist:
- cfdisk

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
