lang: Go
homepage: https://github.com/viktomas/godu
license: MIT
desc:
  cn: 用于发现大文件或文件夹的 golang 程序
  en: Simple golang utility helping to discover large files/folders
x:
  pkg:
    exist: true
  source: https://github.com/viktomas/godu
  eget: https://github.com/viktomas/godu
rule:
  /x:
    cmd: x pkg use godu
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget viktomas/godu
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew tap viktomas/taps && brew install godu
    reference: https://github.com/viktomas/godu?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/viktomas/godu@latest
    reference: https://github.com/viktomas/godu?tab=readme-ov-file#installation
    dsnap: github.com/viktomas/godu
binlist:
- godu
