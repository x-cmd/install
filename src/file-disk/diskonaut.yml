lang: Rust
homepage: https://github.com/imsnif/diskonaut
license: MIT
desc:
  cn: 终端磁盘空间导航器
  en: Terminal disk space navigator
x:
  source: https://github.com/imsnif/diskonaut
rule:
  /cargo:
    cmd: cargo install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#with-cargo-linux--macos--windows
    dsnap: diskonaut
  darwin/brew:
    cmd: brew install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#macos
  nix/nix-env:
    cmd: nix-env --install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#nix--nixos
  centos/dnf:
    cmd: sudo dnf install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#fedoracentos
  fedora/dnf:
    cmd: sudo dnf install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#fedoracentos
    dsnap: diskonaut
  arch/yay:
    cmd: yay diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#arch-linux
binlist:
- diskonaut

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 255 KB
          rating: 1
          desc:
            cn: 约 255 KB（估算）
            en: ~255 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
