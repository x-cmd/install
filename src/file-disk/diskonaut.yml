lang: Rust
homepage: https://github.com/imsnif/diskonaut
license: MIT
desc:
  cn: 终端磁盘空间导航器
  en: Terminal disk space navigator
  cs: Terminálový prohlížeč místa na disku
  de: Terminalbasierter Navigator für den Speicherplatz auf der Festplatte
  es: Navegador de espacio en disco para la terminal
  fr: Navigateur d'espace disque dans le terminal
  id: Penjelajah ruang disk di terminal
  it: Navigatore dello spazio su disco da terminale
  ja: 端末のディスク容量ナビゲーター
  ko: 터미널 디스크 공간 탐색기
  pl: Terminalowy nawigator przestrzeni dyskowej
  pt: Navegador de espaço em disco no terminal
  ro: Navigator de spațiu pe disc în terminal
  ru: Навигатор дискового пространства в терминале
  th: ตัวนำทางพื้นที่ดิสก์ในเทอร์มินัล
  tr: Terminal tabanlı disk alanı gezgini
  uk: Навігатор дискового простору в терміналі
  vi: Trình duyệt dung lượng đĩa trên terminal
x:
  source: https://github.com/imsnif/diskonaut
  dnf: diskonaut
  brew: diskonaut
  cargo: diskonaut
rule:
  /cargo:
    cmd: cargo install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#with-cargo-linux--macos--windows
    dsnap: diskonaut
  darwin/brew:
    cmd: brew install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#macos
  nix/nix-env:
    cmd: nix-env --install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#nix--nixos
  centos/dnf:
    cmd: sudo dnf install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#fedoracentos
  fedora/dnf:
    cmd: sudo dnf install diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#fedoracentos
    dsnap: diskonaut
  arch/yay:
    cmd: yay diskonaut
    reference: https://github.com/imsnif/diskonaut?tab=readme-ov-file#arch-linux
binlist:
- diskonaut

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/arm64)
            en: ~1 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
