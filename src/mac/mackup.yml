lang: Python
homepage: https://github.com/lra/mackup
license: GPL-3.0
desc:
  cn: 用于保持应用程序设置同步 (OS X/Linux)
  en: Keep your application settings in sync (OS X/Linux)
x:
  pkg:
    exist: true
  source: https://github.com/lra/mackup
rule:
  /x:
    cmd: x pkg use mackup
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S mackup
    reference: https://aur.archlinux.org/packages/mackup
  /pip:
    cmd: pip install --upgrade mackup
    reference: https://github.com/lra/mackup#quickstart
    dsnap: mackup
  darwin/brew:
    cmd: brew install mackup
    reference: https://github.com/lra/mackup#quickstart
binlist:
- mackup

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 204 KB
          rating: 1
          desc:
            cn: 安装 204 KB
            en: 204 KB install
        download:
          estimate: 204 KB
          desc:
            cn: 约 204 KB 下载 (whl)
            en: ~204 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
