lang: Python
homepage: https://github.com/lra/mackup
license: GPL-3.0
desc:
  cn: 用于保持应用程序设置同步 (OS X/Linux)
  en: Keep your application settings in sync (OS X/Linux)
x:
  pkg:
    exist: true
  source: https://github.com/lra/mackup
rule:
  /x:
    cmd: x pkg use mackup
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S mackup
    reference: https://aur.archlinux.org/packages/mackup
  /pip:
    cmd: pip install --upgrade mackup
    reference: https://github.com/lra/mackup#quickstart
    dsnap: mackup
  darwin/brew:
    cmd: brew install mackup
    reference: https://github.com/lra/mackup#quickstart
binlist:
- mackup

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
