lang: Python
homepage: https://github.com/lra/mackup
license: GPL-3.0
desc:
  cn: 用于保持应用程序设置同步 (OS X/Linux)
  en: Keep your application settings in sync (OS X/Linux)
  cs: Udržujte nastavení aplikací v synchronizaci (OS X/Linux)
  de: Halten Sie Ihre Anwendungseinstellungen synchron (OS X/Linux)
  es: Mantenga sus preferencias de aplicaciones sincronizadas (OS X/Linux)
  fr: Gardez vos réglages d'applications synchronisés (OS X/Linux)
  id: Jaga pengaturan aplikasi Anda tetap sinkron (OS X/Linux)
  it: Mantieni sincronizzate le impostazioni delle tue applicazioni (OS X/Linux)
  ja: アプリケーションの設定を同期させます (OS X/Linux)
  ko: 애플리케이션 설정을 동기화하여 유지합니다 (OS X/Linux)
  pl: Utrzymuj ustawienia aplikacji w synchronizacji (OS X/Linux)
  pt: Mantenha as configurações dos seus aplicativos sincronizadas (OS X/Linux)
  ro: Păstrați setările aplicațiilor sincronizate (OS X/Linux)
  ru: Держите настройки приложений синхронизированными (OS X/Linux)
  th: ให้การตั้งค่าแอปพลิเคชันของคุณอยู่ในความสอดคล้องกัน (OS X/Linux)
  tr: Uygulama ayarlarınızı eşitlenmiş tutun (OS X/Linux)
  uk: Тримайте налаштування застосунків синхронізованими (OS X/Linux)
  vi: Giữ cho cài đặt ứng dụng của bạn luôn đồng bộ (OS X/Linux)
x:
  source: https://github.com/lra/mackup
  brew: mackup
  yay: mackup
rule:
  /x:
    cmd: x pkg use mackup
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S mackup
    reference: https://aur.archlinux.org/packages/mackup
  /pip:
    cmd: pip install --upgrade mackup
    reference: https://github.com/lra/mackup#quickstart
    dsnap: mackup
  darwin/brew:
    cmd: brew install mackup
    reference: https://github.com/lra/mackup#quickstart
binlist:
- mackup

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 204 KB
          rating: 1
          desc:
            cn: 安装 204 KB
            en: 204 KB install
        download:
          estimate: 204 KB
          desc:
            cn: 约 204 KB 下载 (whl)
            en: ~204 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
