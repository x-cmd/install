lang: Rust
homepage: https://github.com/graelo/pumas
license: MIT
desc:
  cn: 用于监控 Apple Silicon Mac 的 TUI 电源使用情况监控工具
  en: A TUI power usage monitoring tool for Apple Silicon Macs
x:
  source: https://github.com/graelo/pumas
  eget: https://github.com/graelo/pumas
  brew: graelo/tap/pumas
rule:
  /eget:
    cmd: x eget graelo/pumas
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install pumas
    reference: https://github.com/graelo/pumas#installation
    dsnap: pumas
  darwin/brew:
    cmd: brew install graelo/tap/pumas
    reference: https://github.com/graelo/pumas#installation
binlist:
- pumas

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 599 KB
          rating: 1
          desc:
            cn: 安装 599 KB
            en: 599 KB install
        download:
          estimate: 599 KB
          desc:
            cn: 约 599 KB 下载 (macos/arm64)
            en: ~599 KB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
