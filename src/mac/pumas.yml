lang: Rust
homepage: https://github.com/graelo/pumas
license: MIT
desc:
  cn: 用于监控 Apple Silicon Mac 的 TUI 电源使用情况监控工具
  en: A TUI power usage monitoring tool for Apple Silicon Macs
  cs: Nástroj TUI pro monitorování spotřeby energie na Apple Silicon Macích
  de: Ein TUI-Werkzeug zur Überwachung des Stromverbrauchs auf Apple-Silicon-Macs
  es: Una herramienta TUI para supervisar el consumo de energía en Mac con Apple Silicon
  fr: Un outil TUI de surveillance de la consommation d'énergie sur les Mac Apple Silicon
  id: Alat pemantauan penggunaan daya TUI untuk Mac dengan Apple Silicon
  it: Uno strumento TUI per monitorare il consumo energetico sui Mac Apple Silicon
  ja: Apple Silicon Mac の電力使用量を監視する TUI ツール
  ko: Apple Silicon Mac의 전력 사용량을 모니터링하는 TUI 도구
  pl: Narzędzie TUI do monitorowania zużycia energii na Macach z Apple Silicon
  pt: Uma ferramenta TUI para monitorar o consumo de energia em Macs com Apple Silicon
  ro: Un instrument TUI pentru monitorizarea consumului de energie pe Mac-urile cu Apple Silicon
  ru: TUI-инструмент для мониторинга потребления энергии на Mac с Apple Silicon
  th: เครื่องมือ TUI สำหรับติดตามการใช้พลังงานบน Mac ที่ใช้ Apple Silicon
  tr: Apple Silicon Mac'lerde güç tüketimini izlemek için bir TUI aracı
  uk: TUI-інструмент для моніторингу споживання енергії на Mac з Apple Silicon
  vi: Công cụ TUI để theo dõi mức sử dụng điện năng trên Mac dùng Apple Silicon
x:
  source: https://github.com/graelo/pumas
  eget: graelo/pumas
  brew: graelo/tap/pumas
  cargo: pumas
rule:
  /eget:
    cmd: x eget graelo/pumas
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install pumas
    reference: https://github.com/graelo/pumas#installation
    dsnap: pumas
  darwin/brew:
    cmd: brew install graelo/tap/pumas
    reference: https://github.com/graelo/pumas#installation
binlist:
- pumas

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 599 KB
          rating: 1
          desc:
            cn: 安装 599 KB
            en: 599 KB install
        download:
          estimate: 599 KB
          desc:
            cn: 约 599 KB 下载 (macos/arm64)
            en: ~599 KB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
