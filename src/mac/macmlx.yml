lang: swift
homepage: https://github.com/ljh-sh/macmlx
license: apache-2.0
desc:
  cn: macOS 本地大模型 CLI —— ljh-sh agent IO 栈的「推理/大脑」层。基于 Apple MLX 框架设备端运行 MLX 模型与 LoRA adapter；FIFO daemon 常驻模型；紧凑 JSON 输出。隐私不离机，省 API 费用
  en: macOS on-device LLM CLI — the "reasoning" layer of the ljh-sh agent IO stack. Run MLX models and LoRA adapters locally via Apple's MLX framework; FIFO daemon keeps the model resident; compact JSON output. Private, no API bills
x:
  source: https://github.com/ljh-sh/macmlx
  eget: https://github.com/ljh-sh/macmlx
rule:
  /eget:
    cmd: x eget ljh-sh/macmlx
    reference: https://github.com/ljh-sh/macmlx
binlist:
  - macmlx

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
