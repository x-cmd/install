lang: swift
homepage: https://github.com/mas-cli/mas
license: MIT
desc:
  cn: 专为 Mac App Store 设计的命令行界面，用于编写脚本和自动化操作
  en: a command-line interface for the Mac App Store that is designed for scripting & automation.
x:
  source: https://github.com/mas-cli/mas
  eget: https://github.com/mas-cli/mas
  brew: mas
rule:
  /eget:
    cmd: x eget mas-cli/mas
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install mas
    reference: https://github.com/mas-cli/mas?tab=readme-ov-file
binlist:
  - mas

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 375 KB
          rating: 1
          desc:
            cn: 约 375 KB（估算）
            en: ~375 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
