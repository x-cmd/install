lang: swift
homepage: https://github.com/mas-cli/mas
license: MIT
desc:
  cn: 专为 Mac App Store 设计的命令行界面，用于编写脚本和自动化操作
  en: a command-line interface for the Mac App Store that is designed for scripting & automation.
x:
  source: https://github.com/mas-cli/mas
  eget: https://github.com/mas-cli/mas
rule:
  /eget:
    cmd: x eget mas-cli/mas
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install mas
    reference: https://github.com/mas-cli/mas?tab=readme-ov-file
binlist:
  - mas

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
