lang: swift
homepage: https://github.com/ljh-sh/maclisten
license: apache-2.0
desc:
  cn: 轻量 macOS 语音转文字（ASR）CLI —— ljh-sh agent IO 栈的「耳朵」层。原生 Speech 框架，多语言自动选择，流式/文件转录，紧凑 JSON 输出
  en: Lightweight macOS speech-to-text (ASR) CLI — the "hearing" layer of the ljh-sh agent IO stack. Native Speech framework, multi-locale auto-pick, streaming/file transcription, compact JSON output
x:
  source: https://github.com/ljh-sh/maclisten
  eget: ljh-sh/maclisten
  brew: ljh-sh/cli/maclisten
rule:
  /eget:
    cmd: x eget ljh-sh/maclisten
    reference: https://github.com/ljh-sh/maclisten
  darwin/brew:
    cmd: brew install ljh-sh/cli/maclisten
    reference: https://github.com/ljh-sh/homebrew-cli
binlist:
- maclisten

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 88 KB
          rating: 1
          desc:
            cn: 约 88 KB（估算）
            en: ~88 KB estimated
        download:
          estimate: 53 KB
          desc:
            cn: 约 53 KB 下载 (macos/arm64)
            en: ~53 KB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
