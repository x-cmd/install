lang: Shell
homepage: https://github.com/tw93/Mole
license: MIT
desc:
  cn: 深度清理并优化您的 Mac 电脑
  en: Deep clean and optimize your Mac.
x:
  source: https://github.com/tw93/Mole
  eget: https://github.com/tw93/Mole
rule:
  /eget:
    cmd: x eget tw93/Mole
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/tw93/mole/main/install.sh | bash
    reference: https://github.com/tw93/Mole?tab=readme-ov-file#quick-start
  darwin/brew:
    cmd: brew install tw93/tap/mole
    reference: https://github.com/tw93/Mole?tab=readme-ov-file#quick-start
binlist:
  - mo
  - mole

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
