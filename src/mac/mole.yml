lang: Shell
homepage: https://github.com/tw93/Mole
license: GPL-3.0
desc:
  cn: 在终端深度清理、卸载应用、优化系统、分析磁盘占用并实时监控 Mac
  en: Deep-clean, uninstall apps, optimize, analyze disk and monitor your Mac from the terminal.
  cs: Hluboce čistí, odinstaluje aplikace, optimalizuje, analyzuje disk a monitoruje váš Mac přímo z terminálu.
  de: Bereinigt gründlich, deinstalliert Apps, optimiert, analysiert den Speicher und überwacht euren Mac direkt vom Terminal aus.
  es: Limpia a fondo, desinstala apps, optimiza, analiza el disco y monitoriza tu Mac desde el terminal.
  fr: Nettoie en profondeur, désinstalle des apps, optimise, analyse le disque et surveille votre Mac depuis le terminal.
  id: Membersihkan mendalam, mencopot aplikasi, mengoptimalkan, menganalisis disk, dan memantau Mac Anda langsung dari terminal.
  it: Pulisce a fondo, disinstalla app, ottimizza, analizza il disco e monitora il tuo Mac dal terminale.
  ja: ターミナルから Mac の徹底清掃、アプリのアンインストール、最適化、ディスク分析、リアルタイム監視を行います。
  ko: 터미널에서 Mac을 심층 정리하고, 앱을 삭제하고, 최적화하며, 디스크를 분석하고 실시간으로 모니터링합니다.
  pl: Dogłębnie czyści, odinstalowuje aplikacje, optymalizuje, analizuje dysk i monitoruje Maca z poziomu terminala.
  pt: Limpa profundamente, desinstala apps, otimiza, analisa o disco e monitoriza o seu Mac a partir do terminal.
  ro: Curăță profund, dezinstalează aplicații, optimizează, analizează discul și monitorizează Mac-ul din terminal.
  ru: Глубокая очистка, удаление приложений, оптимизация, анализ диска и мониторинг Mac прямо из терминала.
  th: ทำความสะอาดเชิงลึก ถอนแอป เพิ่มประสิทธิภาพ วิเคราะห์ดิสก์ และตรวจสอบ Mac แบบเรียลไทม์ผ่านเทอร์มินัล
  tr: Terminalden Mac'inizi derinlemesine temizler, uygulamaları kaldırır, optimize eder, diski analiz eder ve gerçek zamanlı izler.
  uk: Глибоке очищення, видалення застосунків, оптимізація, аналіз диска та моніторинг Mac прямо з термінала.
  vi: Dọn sạch sâu, gỡ ứng dụng, tối ưu, phân tích ổ đĩa và giám sát Mac theo thời gian thực ngay trong terminal.
x:
  source: https://github.com/tw93/Mole
  brew: mole
rule:
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/tw93/mole/main/install.sh | bash
    reference: https://github.com/tw93/Mole?tab=readme-ov-file#quick-start
  darwin/brew:
    cmd: brew install mole
    reference: https://formulae.brew.sh/formula/mole
binlist:
  - mo
  - mole

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 扫描主目录、/Applications 与磁盘上的缓存、日志和应用残留以分析占用
          en: Scans the home directory, /Applications and disks for caches, logs and app leftovers
        sensitive: []
      write:
        desc:
          cn: 删除缓存、日志与应用残留，卸载应用，并写入 ~/.config/mole 配置
          en: Deletes caches, logs and app leftovers, uninstalls apps, and writes ~/.config/mole config
        sensitive: []
  platform:
    win: partial
    linux: partial
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 约 9 MB（mo/mole 脚本及 analyze、status 辅助二进制）
            en: ~9 MB (mo/mole scripts plus analyze and status helper binaries)
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载（darwin/arm64 辅助二进制包）
            en: ~3 MB download (darwin/arm64 helper binaries)
      paths:
        data: []
        config:
          - ~/.config/mole
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 30 MB
        desc:
          cn: 分析大型目录或实时监控时升高
          en: Higher while analyzing large directories or live monitoring
    cpu:
      workload: ['io']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 菜单等待输入时几乎为零
          en: Near-zero while waiting at the menu
      peak:
        rating: 2
        desc:
          cn: 扫描与清理大量文件时短暂占用
          en: Brief load while scanning and cleaning large numbers of files
