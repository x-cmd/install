lang: Shell
homepage: https://github.com/tw93/Mole
license: MIT
desc:
  cn: 深度清理并优化您的 Mac 电脑
  en: Deep clean and optimize your Mac.
  cs: Hluboce vyčistí a optimalizujte váš Mac.
  de: Führen Sie eine gründliche Bereinigung und Optimierung Ihres Mac durch.
  es: Limpia a fondo y optimiza tu Mac.
  fr: Nettoyez en profondeur et optimisez votre Mac.
  id: Lakukan pembersihan mendalam dan optimalkan Mac Anda.
  it: Esegui una pulizia approfondita e ottimizza il tuo Mac.
  ja: Mac を隅々まで清掃し、最適化します。
  ko: Mac을 심층 정리하고 최적화합니다.
  pl: Dokładnie wyczyść i zoptymalizuj swój Mac.
  pt: Faça uma limpeza profunda e otimize o seu Mac.
  ro: Curăță profund și optimizează-ți Mac-ul.
  ru: Глубокая очистка и оптимизация вашего Mac.
  th: ทำความสะอาดอย่างลึกและปรับแต่ง Mac ของคุณ
  tr: Mac'inizi derinlemesine temizleyin ve optimize edin.
  uk: Глибоке очищення та оптимізація вашого Mac.
  vi: Dọn sạch sâu và tối ưu hóa Mac của bạn.
x:
  source: https://github.com/tw93/Mole
  eget: tw93/Mole
  brew: tw93/tap/mole
rule:
  /eget:
    cmd: x eget tw93/Mole
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/tw93/mole/main/install.sh | bash
    reference: https://github.com/tw93/Mole?tab=readme-ov-file#quick-start
  darwin/brew:
    cmd: brew install tw93/tap/mole
    reference: https://github.com/tw93/Mole?tab=readme-ov-file#quick-start
binlist:
  - mo
  - mole

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 87 KB
          rating: 1
          desc:
            cn: 约 87 KB（估算）
            en: ~87 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
