lang: swift
homepage: https://github.com/ljh-sh/macli
license: Apache-2.0
desc:
  cn: 面向 AI agent 的 macOS 系统工具。Swift 原生 Apple framework，JSON/TSV 输出 —— SMC 传感器、流式监控、EventKit 日历/提醒、TTS/通知
  en: macOS system tools for AI agents. Native Apple frameworks with JSON/TSV output — SMC sensors, streaming monitor, EventKit calendar/reminders, TTS/notifications
x:
  source: https://github.com/ljh-sh/macli
  eget: https://github.com/ljh-sh/macli
rule:
  /eget:
    cmd: x eget ljh-sh/macli
    reference: https://github.com/ljh-sh/macli
  darwin/brew:
    cmd: brew install ljh-sh/macli/macli
    reference: https://github.com/ljh-sh/homebrew-macli
binlist:
  - macli

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 319 KB
          rating: 1
          desc:
            cn: 约 319 KB（估算）
            en: ~319 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
