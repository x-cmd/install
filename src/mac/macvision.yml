lang: swift
homepage: https://github.com/ljh-sh/macvision
license: apache-2.0
desc:
  cn: 面向 AI agent 的 macOS Vision CLI —— ljh-sh agent IO 栈的「眼睛」层。把任意图像变成 agent 友好的 JSON：多语言 OCR、人脸/条码/文档检测、分类、显著性、特征指纹。设备端运行，隐私不离机
  en: macOS Vision CLI for AI agents — the "sight" layer of the ljh-sh agent IO stack. Turn any image into agent-friendly JSON — multi-language OCR, face/barcode/document detection, classification, saliency, feature fingerprints. On-device, private, no upload
x:
  source: https://github.com/ljh-sh/macvision
  eget: https://github.com/ljh-sh/macvision
rule:
  /eget:
    cmd: x eget ljh-sh/macvision
    reference: https://github.com/ljh-sh/macvision
binlist:
- macvision

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 260 KB
          rating: 1
          desc:
            cn: 约 260 KB（估算）
            en: ~260 KB estimated
        download:
          estimate: 115 KB
          desc:
            cn: 约 115 KB 下载 (macos/arm64)
            en: ~115 KB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
