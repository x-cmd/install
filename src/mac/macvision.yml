lang: swift
homepage: https://github.com/ljh-sh/macvision
license: apache-2.0
desc:
  cn: 面向 AI agent 的 macOS Vision CLI —— ljh-sh agent IO 栈的「眼睛」层。把任意图像变成 agent 友好的 JSON：多语言 OCR、人脸/条码/文档检测、分类、显著性、特征指纹。设备端运行，隐私不离机
  en: macOS Vision CLI for AI agents — the "sight" layer of the ljh-sh agent IO stack. Turn any image into agent-friendly JSON — multi-language OCR, face/barcode/document detection, classification, saliency, feature fingerprints. On-device, private, no upload
  cs: "macOS Vision CLI pro AI agenty — \"zrak\" vrstva agent IO stacku ljh-sh. Přemění libovolný obrázek na JSON přátelský agentům: vícejazyčné OCR, detekce obličejů/barcodes/dokumentů, klasifikace, salientnost, otisky příznaků. Na zařízení, soukromé, bez nahrávání"
  de: "macOS Vision-CLI für KI-Agenten — die \"Sicht\"-Schicht des ljh-sh Agent-IO-Stacks. Verwandelt jedes Bild in agentenfreundliches JSON: mehrsprachiges OCR, Gesichts-/Barcode-/Dokumentenerkennung, Klassifikation, Salienz, Merkmals-Fingerprints. Auf dem Gerät, privat, kein Upload"
  es: "CLI de macOS Vision para agentes de IA: la capa de \"visión\" de la pila de E/S de agentes ljh-sh. Convierte cualquier imagen en JSON amenable a agentes: OCR multilingüe, detección de caras/códigos de barras/documentos, clasificación, saliencia, huellas de características. En el dispositivo, privado, sin subir nada"
  fr: "CLI macOS Vision pour les agents IA : la couche « vision » de la pile d'E/S d'agents ljh-sh. Transforme n'importe quelle image en JSON adapté aux agents : OCR multilingue, détection de visages/codes-barres/documents, classification, saillance, empreintes de caractéristiques. Sur l'appareil, privé, sans envoi"
  id: "CLI macOS Vision untuk agen AI: lapisan \"penglihatan\" pada stack IO agen ljh-sh. Mengubah gambar apa pun menjadi JSON ramah agen: OCR multibahasa, deteksi wajah/barcode/dokumen, klasifikasi, saliency, sidik jari fitur. Berjalan di perangkat, privat, tanpa unggah"
  it: "CLI macOS Vision per agenti AI: il livello di \"vista\" dello stack IO per agenti ljh-sh. Trasforma qualsiasi immagine in JSON adatto agli agenti: OCR multilingue, rilevamento di volti/codici a barre/documenti, classificazione, salienza, impronte delle caratteristiche. Sul dispositivo, privato, senza upload"
  ja: AI エージェント向けの macOS Vision CLI — ljh-sh エージェント IO スタックの「視覚」レイヤー。任意の画像をエージェント向けの JSON に変換し、多言語 OCR、顔・バーコード・書類検出、分類、際立ちの検出、特徴フィンガープリントに対応。オンデバイス実行でプライバシーを守ります
  ko: AI 에이전트를 위한 macOS Vision CLI — ljh-sh 에이전트 IO 스택의 "시각" 계층. 모든 이미지를 에이전트에 적합한 JSON으로 변환합니다. 다국어 OCR, 얼굴/바코드/문서 감지, 분류, 살리언스, 특징 지문 등을 지원하며, 온디바이스에서 동작해 업로드 없이 비공개성을 유지합니다
  pl: "CLI macOS Vision dla agentów AI — warstwa „wzroku\" w stosie IO agentów ljh-sh. Zamienia dowolny obraz w JSON przyjazny agentom: wielojęzyczne OCR, wykrywanie twarzy/kodów kreskowych/dokumentów, klasyfikacja, saliencja, odciski cech. Na urządzeniu, prywatnie, bez wysyłania"
  pt: "CLI macOS Vision para agentes de IA — a camada de \"visão\" da pilha de IO de agentes ljh-sh. Transforma qualquer imagem em JSON amigável para agentes: OCR multilíngue, detecção de rostos/códigos de barras/documentos, classificação, saliência, impressões de recursos. No dispositivo, privado, sem upload"
  ro: "CLI macOS Vision pentru agenți AI — stratul de \"vedere\" al stivei IO pentru agenți ljh-sh. Transformă orice imagine în JSON prietenos agenților: OCR multilingv, detectare fețe/coduri de bare/documente, clasificare, saliență, amprente ale caracteristicilor. Pe dispozitiv, privat, fără încărcare"
  ru: "macOS Vision CLI для ИИ-агентов — слой «зрения» в стеке ввода-вывода агентов ljh-sh. Превращает любое изображение в JSON, удобный для агентов: многоязычный OCR, распознавание лиц/штрихкодов/документов, классификация, выделенность, отпечатки признаков. Работает на устройстве, приватно, без загрузки"
  th: "macOS Vision CLI สำหรับเอเจนต์ AI — ชั้น \"การมองเห็น\" ของสแต็ก IO สำหรับเอเจนต์ ljh-sh. เปลี่ยนรูปภาพใด ๆ ให้เป็น JSON ที่เอเจนต์ใช้ได้: OCR หลายภาษา การตรวจจับใบหน้า/บาร์โค้ด/เอกสาร การจำแนก ความโดดเด่น และลายนิ้วมือของคุณสมบัติ รันบนอุปกรณ์ เป็นส่วนตัว ไม่มีการอัปโหลด"
  tr: "Yapay zekâ ajanları için macOS Vision CLI — ljh-sh agent IO yığınının \"görme\" katmanı. Her görüntüyü ajanların kullanabileceği JSON'a dönüştürür: çok dilli OCR, yüz/ barkod/belge algılama, sınıflandırma, belirginlik, öznitelik parmak izleri. Cihazda çalışır, gizli, yükleme yok"
  uk: "macOS Vision CLI для ІІ-агентів — шар «зору» в стекі введення-виведення агентів ljh-sh. Перетворює будь-яке зображення на JSON, зручний для агентів: багатомовний OCR, виявлення облич/штрихкодів/документів, класифікація, виразність, відбитки ознак. Працює на пристрої, приватно, без завантаження"
  vi: "CLI macOS Vision cho agent AI — lớp \"thị giác\" của ngăn xếp IO agent ljh-sh. Biến mọi hình ảnh thành JSON thân thiện với agent: OCR đa ngôn ngữ, phát hiện khuôn mặt/mã vạch/tài liệu, phân loại, độ nổi bật, vân tay đặc trưng. Chạy tại thiết bị, riêng tư, không tải lên"
