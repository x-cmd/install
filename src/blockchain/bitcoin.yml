lang: C++
homepage: https://github.com/bitcoin/bitcoin
license: MIT
desc:
  en: Bitcoin Core connects to the Bitcoin peer-to-peer network to download and fully validate blocks and transactions
  cn: 比特币核心连接到比特币对等网络以下载并完全验证块和交易
x:
  source: https://github.com/bitcoin/bitcoin
rule:
  darwin/brew:
    cmd: brew install bitcoin
    reference: https://formulae.brew.sh/formula/bitcoin#default
binlist:
- bitcoin

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
