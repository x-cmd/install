lang: C++
homepage: https://github.com/bitcoin/bitcoin
license: MIT
desc:
  en: Bitcoin Core connects to the Bitcoin peer-to-peer network to download and fully validate blocks and transactions
  cn: 比特币核心连接到比特币对等网络以下载并完全验证块和交易
x:
  source: https://github.com/bitcoin/bitcoin
rule:
  darwin/brew:
    cmd: brew install bitcoin
    reference: https://formulae.brew.sh/formula/bitcoin#default
binlist:
- bitcoin

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 27 MB
          rating: 2
          desc:
            cn: 约 27 MB（估算）
            en: ~27 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
