lang: Rust
homepage: https://github.com/ordinals/ord
license: CC0-1.0
desc:
  cn: ord 是一个索引、区块浏览器和命令行钱包
  en: ord is an index, block explorer, and command-line wallet
  cs: ord je index, prohlížeč bloků a peněženka příkazové řádky
  de: ord ist ein Index, ein Block-Explorer und eine Kommandozeilen-Wallet
  es: ord es un índice, un explorador de bloques y una cartera de línea de comandos
  fr: ord est un index, un explorateur de blocs et un portefeuille en ligne de commande
  id: ord adalah indeks, penjelajah blok, dan dompet baris perintah
  it: ord è un indice, un esploratore di blocchi e un portafoglio da riga di comando
  ja: ord はインデクサー、ブロックエクスプローラー、コマンドラインウォレットです
  ko: ord는 인덱서, 블록 탐색기이자 명령줄 지갑입니다
  pl: ord to indeks, eksplorator bloków i portfel wiersza poleceń
  pt: ord é um índice, explorador de blocos e carteira de linha de comando
  ro: ord este un index, un explorator de blocuri și un portfel de linie de comandă
  ru: ord — это индекс, обозреватель блоков и кошелёк командной строки
  th: ord คือดัชนี ตัวสำรวจบล็อก และกระเป๋าเงินบนบรรทัดคำสั่ง
  tr: ord bir dizin, blok gezgini ve komut satırı cüzdanıdır
  uk: ord — це індекс, оглядач блоків і гаманець командного рядка
  vi: ord là chỉ mục, trình duyệt khối và ví dòng lệnh
x:
  source: https://github.com/ordinals/ord
  eget: ordinals/ord
  brew: ord
rule:
  /eget:
    cmd: x eget ordinals/ord
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -fsLS https://ordinals.com/install.sh | bash -s
    reference: https://github.com/ordinals/ord?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install ord
    reference: https://github.com/ordinals/ord?tab=readme-ov-file#homebrew
binlist:
- ord

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
