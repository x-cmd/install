lang: Rust
homepage: https://github.com/ordinals/ord
license: CC0-1.0
desc:
  cn: ord 是一个索引、区块浏览器和命令行钱包
  en: ord is an index, block explorer, and command-line wallet
x:
  source: https://github.com/ordinals/ord
  eget: https://github.com/ordinals/ord
rule:
  /eget:
    cmd: x eget ordinals/ord
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -fsLS https://ordinals.com/install.sh | bash -s
    reference: https://github.com/ordinals/ord?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install ord
    reference: https://github.com/ordinals/ord?tab=readme-ov-file#homebrew
binlist:
- ord

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
