lang: Rust
homepage: https://github.com/ordinals/ord
license: CC0-1.0
desc:
  cn: ord 是一个索引、区块浏览器和命令行钱包
  en: ord is an index, block explorer, and command-line wallet
x:
  source: https://github.com/ordinals/ord
  eget: https://github.com/ordinals/ord
  brew: ordrule:
  /eget:
    cmd: x eget ordinals/ord
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -fsLS https://ordinals.com/install.sh | bash -s
    reference: https://github.com/ordinals/ord?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install ord
    reference: https://github.com/ordinals/ord?tab=readme-ov-file#homebrew
binlist:
- ord

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
