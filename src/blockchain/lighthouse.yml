lang: Rust
homepage: https://github.com/sigp/lighthouse
license: Apache-2.0
desc:
  en: An open-source Ethereum consensus client, written in Rust and maintained by Sigma Prime
  cn: 一个开源以太网共识客户端，用 Rust 语言编写，由 Sigma Prime 维护
  cs: Open source klient konsenzu Ethereum napsaný v Rustu a udržovaný společností Sigma Prime
  de: Ein Open-Source-Ethereum-Konsensclient, geschrieben in Rust und gepflegt von Sigma Prime
  es: Un cliente de consenso de Ethereum de código abierto, escrito en Rust y mantenido por Sigma Prime
  fr: Un client de consensus Ethereum open source, écrit en Rust et maintenu par Sigma Prime
  id: Klien konsensus Ethereum sumber terbuka yang ditulis dalam Rust dan dipelihara oleh Sigma Prime
  it: Un client di consenso Ethereum open source, scritto in Rust e mantenuto da Sigma Prime
  ja: Rust で書かれたオープンソースの Ethereum コンセンサスクライアンで、Sigma Prime が保守しています
  ko: Rust로 작성되고 Sigma Prime에서 관리하는 오픈 소스 Ethereum 컨센서스 클라이언트입니다
  pl: Klient konsensusu Ethereum o otwartym kodzie, napisany w Rust i utrzymywany przez Sigma Prime
  pt: Um cliente de consenso do Ethereum de código aberto, escrito em Rust e mantido pela Sigma Prime
  ro: Un client de consens Ethereum cu sursă deschisă, scris în Rust și întreținut de Sigma Prime
  ru: Клиент консенсуса Ethereum с открытым исходным кодом, написанный на Rust и поддерживаемый Sigma Prime
  th: ไคลเอนต์ฉันทามติของ Ethereum แบบโอเพนซอร์ส เขียนด้วย Rust และดูแลโดย Sigma Prime
  tr: Rust ile yazılmış ve Sigma Prime tarafından sürdürülen açık kaynaklı bir Ethereum konsensüs istemcisi
  uk: Відкритий клієнт консенсусу Ethereum, написаний на Rust і підтримуваний Sigma Prime
  vi: Khách hàng đồng thuận Ethereum mã nguồn mở, viết bằng Rust và được Sigma Prime duy trì
x:
  source: https://github.com/sigp/lighthouse
  eget: sigp/lighthouse
  brew: lighthouse
  yay: lighthouse-ethereum-bin
rule:
  /eget:
    cmd: x eget sigp/lighthouse
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install lighthouse
    reference: https://formulae.brew.sh/formula/lighthouse#default
  arch/yay:
    cmd: yay -S lighthouse-ethereum-bin
    reference: https://aur.archlinux.org/packages/lighthouse-ethereum-bin
binlist:
- lighthouse

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 MB
          rating: 2
          desc:
            cn: 安装 28 MB
            en: 28 MB install
        download:
          estimate: 28 MB
          desc:
            cn: 约 28 MB 下载 (linux/x64)
            en: ~28 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
