lang: Rust
homepage: https://github.com/sigp/lighthouse
license: Apache-2.0
desc:
  en: An open-source Ethereum consensus client, written in Rust and maintained by Sigma Prime
  cn: 一个开源以太网共识客户端，用 Rust 语言编写，由 Sigma Prime 维护
x:
  source: https://github.com/sigp/lighthouse
  eget: https://github.com/sigp/lighthouse
rule:
  /eget:
    cmd: x eget sigp/lighthouse
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install lighthouse
    reference: https://formulae.brew.sh/formula/lighthouse#default
  arch/yay:
    cmd: yay -S lighthouse-ethereum-bin
    reference: https://aur.archlinux.org/packages/lighthouse-ethereum-bin
binlist:
- lighthouse

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
