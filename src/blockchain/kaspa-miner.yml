lang: Rust
homepage: https://github.com/elichai/kaspa-miner
license: Apache-2.0
desc:
  en: A fast CPU miner for Kaspa
  cn: Kaspa 的快速 CPU 矿工
  cs: Rychlý těžič CPU pro Kaspa
  de: Ein schneller CPU-Miner für Kaspa
  es: Un minero de CPU rápido para Kaspa
  fr: Un mineur CPU rapide pour Kaspa
  id: Penambang CPU cepat untuk Kaspa
  it: Un miner CPU veloce per Kaspa
  ja: Kaspa 用の高速 CPU マイナー
  ko: Kaspa를 위한 빠른 CPU 마이너
  pl: Szybki kopacz CPU dla Kaspa
  pt: Um minerador de CPU rápido para Kaspa
  ro: Un miner de CPU rapid pentru Kaspa
  ru: Быстрый CPU-майнер для Kaspa
  th: มายเนอร์ CPU ความเร็วสูงสำหรับ Kaspa
  tr: Kaspa için hızlı bir CPU madenci
  uk: Швидкий CPU-майнер для Kaspa
  vi: Mỏ CPU nhanh cho Kaspa
x:
  source: https://github.com/elichai/kaspa-miner
  eget: elichai/kaspa-miner
  cargo: kaspa-miner
rule:
  /eget:
    cmd: x eget elichai/kaspa-miner
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install kaspa-miner
    reference: https://github.com/elichai/kaspa-miner?tab=readme-ov-file#from-sources
    dsnap: kaspa-miner
binlist:
- kaspa-miner

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
