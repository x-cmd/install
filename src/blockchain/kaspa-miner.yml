lang: Rust
homepage: https://github.com/elichai/kaspa-miner
license: Apache-2.0
desc:
  en: A fast CPU miner for Kaspa
  cn: Kaspa 的快速 CPU 矿工
x:
  source: https://github.com/elichai/kaspa-miner
  eget: https://github.com/elichai/kaspa-miner
rule:
  /eget:
    cmd: x eget elichai/kaspa-miner
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install kaspa-miner
    reference: https://github.com/elichai/kaspa-miner?tab=readme-ov-file#from-sources
    dsnap: kaspa-miner
binlist:
- kaspa-miner

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
