lang: JavaScript
homepage: https://github.com/webtorrent/webtorrent-cli
license: MIT
desc:
  cn: webtorrent-cli 是一个简单的 torrent 客户端，可用于 Node.js，作为命令行应用
  en: webtorrent-cli is a simple torrent client for use in node.js, as a command line app
x:
  source: https://github.com/webtorrent/webtorrent-cli
  yay: webtorrent-cli
  npm: webtorrent-cli
rule:
  /x:
    cmd: x pkg use webtorrent-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install webtorrent-cli -g
    reference: https://github.com/webtorrent/webtorrent-cli?tab=readme-ov-file#install
    dsnap: webtorrent-cli
  arch/yay:
    cmd: yay -S webtorrent-cli
    reference: https://aur.archlinux.org/packages/webtorrent-cli
binlist:
- webtorrent-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
