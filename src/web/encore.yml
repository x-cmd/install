lang: Go
homepage: https://github.com/encoredev/encore
license: MPL-2.0
desc:
  en: Encore is the Development Platform that automatically provisions type-safe infrastructure, from developing locally to scaling production in your cloud on AWS/GCP
  cn: Encore 是自动提供类型安全基础设施的开发平台，从本地开发到在 AWS/GCP 上在云中扩展生产
x:
  source: https://github.com/encoredev/encore
  brew: encoredev/tap/encorerule:
  darwin/brew:
    cmd: brew install encoredev/tap/encore
    reference: https://encore.dev/docs/quick-start#1-install-the-encore-cli
  /curl:
    cmd: curl -L https://encore.dev/install.sh | bash
    reference: https://encore.dev/docs/quick-start#1-install-the-encore-cli
    reference: https://encore.dev/docs/quick-start#1-install-the-encore-cli
binlist:
- encore

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 18 MB
          rating: 2
          desc:
            cn: 约 18 MB（估算）
            en: ~18 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
