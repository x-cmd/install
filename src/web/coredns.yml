lang: Go
homepage: https://github.com/coredns/coredns
license: Apache-2.0
desc:
  cn: CoreDNS 是一个 DNS 服务器/转发器，用 Go 编写，链接插件。每个插件执行 (DNS) 功能。
  en: CoreDNS is a DNS server/forwarder, written in Go, that chains plugins. Each plugin performs a (DNS) function.
x:
  source: https://github.com/coredns/coredns
  eget: https://github.com/coredns/coredns
rule:
  /eget:
    cmd: x eget coredns/coredns
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install coredns
    reference: https://formulae.brew.sh/formula/coredns#default
  (win|wsl2)/scoop:
    cmd: x scoop install coredns
    reference: https://scoop.sh/#/apps?q=coredns
  arch/yay:
    cmd: yay -S coredns
    reference: https://aur.archlinux.org/packages/coredns
binlist:
- coredns

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
