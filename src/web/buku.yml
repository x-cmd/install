lang: Python
homepage: https://github.com/jarun/buku
license: GPL-3.0
desc:
  cn: buku 是一个书签管理器和个人文本迷你网络
  en: buku is a powerful bookmark manager and a personal textual mini-web
  cs: buku je výkonný správce záložek a osobní textový mini-web
  de: buku ist ein leistungsstarker Lesezeichen-Manager und ein persönliches textuelles Mini-Web
  es: buku es un gestor de marcadores potente y un mini-web textual personal
  fr: buku est un gestionnaire de favoris puissant et un mini-web textuel personnel
  id: buku adalah pengelola penanda yang andal serta mini-web tekstual pribadi
  it: buku è un gestore di segnalibri potente e un mini-web testuale personale
  ja: buku は強力なブックマークマネージャーであり、個人用のテキストミニウェブです
  ko: buku는 강력한 북마크 관리자이자 개인용 텍스트 미니웹입니다
  pl: buku to wydajny menedżer zakładek i osobisty tekstowy mini-web
  pt: buku é um gerenciador de favoritos poderoso e um mini-web textual pessoal
  ro: buku este un manager de marcaje puternic și un mini-web textual personal
  ru: buku — мощный менеджер закладок и персональный текстовый мини-веб
  th: buku คือตัวจัดการบุ๊กมาร์กที่ทรงพลังและมินิเว็บแบบข้อความส่วนตัว
  tr: buku, güçlü bir yer imi yöneticisi ve kişisel bir metin mini-web'idir
  uk: buku — потужний менеджер закладок і персональний текстовий міні-веб
  vi: buku là trình quản lý dấu trang mạnh mẽ và một mini-web văn bản cá nhân
x:
  source: https://github.com/jarun/buku
  brew: buku
  yay: buku
  pip: buku
rule:
  /x:
    cmd: x pkg use buku
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install buku
    reference: https://github.com/jarun/buku?tab=readme-ov-file#from-a-package-manager
  /pip:
    cmd: pip install buku
    reference: https://pypi.org/project/buku/
    dsnap: buku
  darwin/brew:
    cmd: brew install buku
    reference: https://formulae.brew.sh/formula/buku#default
  arch/yay:
    cmd: yay -S buku
    reference: https://aur.archlinux.org/packages/buku
binlist:
- buku

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 KB
          rating: 1
          desc:
            cn: 约 28 KB（估算）
            en: ~28 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
