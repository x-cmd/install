lang: Python
homepage: https://github.com/jarun/buku
license: GPL-3.0
desc:
  cn: buku 是一个书签管理器和个人文本迷你网络
  en: buku is a powerful bookmark manager and a personal textual mini-web
x:
  pkg:
    exist: true
  source: https://github.com/jarun/buku
rule:
  /x:
    cmd: x pkg use buku
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install buku
    reference: https://github.com/jarun/buku?tab=readme-ov-file#from-a-package-manager
  /pip:
    cmd: pip install buku
    reference: https://pypi.org/project/buku/
    dsnap: buku
  darwin/brew:
    cmd: brew install buku
    reference: https://formulae.brew.sh/formula/buku#default
  arch/yay:
    cmd: yay -S buku
    reference: https://aur.archlinux.org/packages/buku
binlist:
- buku

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 KB
          rating: 1
          desc:
            cn: 约 28 KB（估算）
            en: ~28 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
