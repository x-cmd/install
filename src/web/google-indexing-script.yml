lang: JavaScript
homepage: https://github.com/goenning/google-indexing-script
license: MIT
desc:
  en: Get your site indexed on Google in less than 48 hours
  cn: 在 48 小时内让你的网站被 Google 收录
  cs: Nechte svůj web zaindexovat na Google za méně než 48 hodin
  de: Lassen Sie Ihre Website in weniger als 48 Stunden von Google indexieren
  es: Haz que tu sitio sea indexado por Google en menos de 48 horas
  fr: Faites indexer votre site par Google en moins de 48 heures
  id: Buat situs Anda terindeks di Google dalam waktu kurang dari 48 jam
  it: Fai indicizzare il tuo sito su Google in meno di 48 ore
  ja: 48 時間以内にサイトを Google にインデックスさせます
  ko: 48시간 이내에 사이트를 Google에 색인하게 하세요
  pl: Spraw, aby Twoja witryna została zindeksowana w Google w mniej niż 48 godzin
  pt: Faça seu site ser indexado no Google em menos de 48 horas
  ro: Fă-ți site-ul indexat de Google în mai puțin de 48 de ore
  ru: Добавьте свой сайт в индекс Google менее чем за 48 часов
  th: ให้เว็บไซต์ของคุณได้รับการจัดทำดัชนีใน Google ภายในไม่ถึง 48 ชั่วโมง
  tr: Sitenizin Google'da 48 saatten kısa sürede dizine eklenmesini sağlayın
  uk: Добавте свій сайт до індексу Google менш ніж за 48 годин
  vi: Để trang của bạn được Google lập chỉ mục trong vòng chưa đầy 48 giờ
x:
  source: https://github.com/goenning/google-indexing-script
  npm: google-indexing-script
rule:
  /npm:
    cmd: npm install -g google-indexing-script
    reference: https://github.com/goenning/google-indexing-script?tab=readme-ov-file#installation
    dsnap: google-indexing-script
binlist:
- google-indexing-script

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
