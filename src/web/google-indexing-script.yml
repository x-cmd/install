lang: JavaScript
homepage: https://github.com/goenning/google-indexing-script
license: MIT
desc:
  en: Get your site indexed on Google in less than 48 hours
  cn: 在 48 小时内让你的网站被 Google 收录
x:
  source: https://github.com/goenning/google-indexing-script
rule:
  /npm:
    cmd: npm install -g google-indexing-script
    reference: https://github.com/goenning/google-indexing-script?tab=readme-ov-file#installation
    dsnap: google-indexing-script
binlist:
- google-indexing-script

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
