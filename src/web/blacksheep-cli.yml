lang: Python
homepage: https://github.com/Neoteroi/BlackSheep
license: MIT
desc:
  cn: 启动 BlackSheep 项目的客户端
  en: CLI to start BlackSheep projects.
x:
  source: https://github.com/Neoteroi/BlackSheep
rule:
  /pip:
    cmd: pip install blacksheep-cli
    reference: https://www.neoteroi.dev/blacksheep/cli/#installing-the-cli
    dsnap: blacksheep-cli
binlist:
- blacksheep-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
