lang: Python
homepage: https://github.com/Neoteroi/BlackSheep
license: MIT
desc:
  cn: 启动 BlackSheep 项目的客户端
  en: CLI to start BlackSheep projects.
x:
  source: https://github.com/Neoteroi/BlackSheep
rule:
  /pip:
    cmd: pip install blacksheep-cli
    reference: https://www.neoteroi.dev/blacksheep/cli/#installing-the-cli
    dsnap: blacksheep-cli
binlist:
- blacksheep-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
