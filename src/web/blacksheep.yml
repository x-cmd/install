lang: Python
homepage: https://github.com/Neoteroi/BlackSheep
license: MIT
desc:
  cn: BlackSheep 是一个异步 Web 框架，用于使用 Python 构建基于事件的 Web 应用程序
  en: BlackSheep is an asynchronous web framework to build event-based web applications with Python.
x:
  source: https://github.com/Neoteroi/BlackSheep
rule:
  /pip:
    cmd: pip install blacksheep
    reference: https://github.com/Neoteroi/BlackSheep?tab=readme-ov-file#blacksheep
    dsnap: blacksheep
  arch/yay:
    cmd: yay -S python-blacksheep
    reference: https://aur.archlinux.org/packages/python-blacksheep
binlist:
- blacksheep

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
