lang: Rust
homepage: https://github.com/alexpasmantier/television
license: MIT
desc:
  cn: 一个跨平台、快速且可扩展的 TUI 模糊查找器
  en: A cross-platform, fast and extensible fuzzy finder TUI
  cs: TUI fuzzy vyhledávač, který je multiplatformní, rychlý a rozšiřitelný
  de: Ein plattformübergreifendes, schnelles und erweiterbares fuzzy TUI-Suchwerkzeug
  es: Un TUI de búsqueda difusa multiplataforma, rápido y extensible
  fr: Un TUI de recherche flou multiplateforme, rapide et extensible
  id: TUI fuzzy finder lintas platform yang cepat dan dapat diperluas
  it: Una TUI di ricerca fuzzy multipiattaforma, veloce ed estensibile
  ja: クロスプラットフォームで高速かつ拡張可能なファジー検索TUI
  ko: 크로스 플랫폼이며 빠르고 확장 가능한 퍼지 파인더 TUI
  pl: Wieloplatformowy, szybki i rozszerzalny wyszukiwacz fuzzy w TUI
  pt: Um TUI de busca difusa multiplataforma, rápido e extensível
  ro: Un TUI de căutare fuzzy multiplatformă, rapid și extensibil
  ru: Кроссплатформенный, быстрый и расширяемый нечёткий поисковик с TUI
  th: ตัวค้นหาแบบ fuzzy ใน TUI ที่ใช้งานข้ามแพลตฟอร์ม เร็วและขยายได้
  tr: Platformlar arası, hızlı ve genişletilebilir fuzzy finder TUI
  uk: Кросплатформовий, швидкий і розширюваний нечіткий пошуковик із TUI
  vi: TUI fuzzy finder đa nền tảng, nhanh và có thể mở rộng
x:
  source: https://github.com/alexpasmantier/television
  eget: alexpasmantier/television
  brew: television
  pacman: television
  apk: chimera-repo-user
  scoop: television
rule:
  /x:
    cmd: x pkg use television
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget alexpasmantier/television
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install television
    reference: https://github.com/alexpasmantier/television/wiki/Installation
  /nix:
    cmd: nix run nixpkgs#television
    reference: https://github.com/alexpasmantier/television/wiki/Installation
  (win|wsl2)/scoop:
    cmd: 'scoop bucket add extras

      scoop install television

      '
    reference: https://github.com/alexpasmantier/television/wiki/Installation
  (win|wsl2)/winget:
    cmd: winget install --exact --id alexpasmantier.television
    reference: https://github.com/alexpasmantier/television/wiki/Installation
  arch/pacman:
    cmd: pacman -S television
    reference: https://github.com/alexpasmantier/television/wiki/Installation
  alpine/apk:
    cmd: 'apk add chimera-repo-user

      apk add television

      '
    reference: https://github.com/alexpasmantier/television/wiki/Installation
    dsnap: television
  (ubuntu|debian)/dpkg:
    cmd: 'VER=`curl -s "https://api.github.com/repos/alexpasmantier/television/releases/latest" | grep ''"tag_name":'' | sed -E ''s/.*"tag_name": "([^"]+)".*/\1/''`

      curl -LO https://github.com/alexpasmantier/television/releases/download/$VER/television_$VER-1_amd64.deb

      echo $VER

      sudo dpkg -i television_$VER-1_amd64.deb

      '
    reference: https://github.com/alexpasmantier/television/wiki/Installation
  /pixi:
    cmd: x pixi global install television
    reference: https://github.com/alexpasmantier/television/wiki/Installation
  /cargo:
    cmd: cargo install --locked television
    reference: https://github.com/alexpasmantier/television/wiki/Installation
    dsnap: television
binlist:
- television

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
