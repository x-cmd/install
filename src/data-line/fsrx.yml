lang: Rust
homepage: https://github.com/wooorm/franc/tree/main#readme
license: MIT
desc:
  cn: 终端中的流状态读取
  en: (f)low (s)tate (r)eading e(x)change – flow state reading in the terminal
rule:
  /cargo:
    cmd: cargo install fsrx
    reference: https://github.com/jrnxf/fsrx?tab=readme-ov-file#cargo
    dsnap: fsrx
binlist:
- fsrx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
