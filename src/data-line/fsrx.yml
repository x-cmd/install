lang: Rust
homepage: https://github.com/wooorm/franc/tree/main#readme
license: MIT
desc:
  cn: 终端中的流状态读取
  en: (f)low (s)tate (r)eading e(x)change – flow state reading in the terminal
rule:
  /cargo:
    cmd: cargo install fsrx
    reference: https://github.com/jrnxf/fsrx?tab=readme-ov-file#cargo
    dsnap: fsrx
binlist:
- fsrx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
