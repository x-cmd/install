lang: Rust
homepage: https://github.com/wooorm/franc/tree/main#readme
license: MIT
desc:
  cn: 终端中的流状态读取
  en: (f)low (s)tate (r)eading e(x)change – flow state reading in the terminal
  cs: (f)low (s)tate (r)eading e(x)change – čtení stavu toku v terminálu
  de: (f)low (s)tate (r)eading e(x)change – Flusszustandsablesen im Terminal
  es: "(f)low (s)tate (r)eading e(x)change: lectura del estado del flujo en la terminal"
  fr: (f)low (s)tate (r)eading e(x)change – lecture de l'état de flux dans le terminal
  id: (f)low (s)tate (r)eading e(x)change – pembacaan status aliran di terminal
  it: (f)low (s)tate (r)eading e(x)change – lettura dello stato del flusso nel terminale
  ja: (f)low (s)tate (r)eading e(x)change – ターミナルでのフロー状態の読み取り
  ko: (f)low (s)tate (r)eading e(x)change – 터미널에서 흐름 상태 읽기
  pl: (f)low (s)tate (r)eading e(x)change – odczyt stanu przepływu w terminalu
  pt: (f)low (s)tate (r)eading e(x)change – leitura do estado do fluxo no terminal
  ro: (f)low (s)tate (r)eading e(x)change – citirea stării fluxului în terminal
  ru: (f)low (s)tate (r)eading e(x)change — чтение состояния потока в терминале
  th: (f)low (s)tate (r)eading e(x)change – การอ่านสถานะการไหลในเทอร์มินัล
  tr: (f)low (s)tate (r)eading e(x)change – terminalde akış durumu okuma
  uk: (f)low (s)tate (r)eading e(x)change — читання стану потоку в терміналі
  vi: (f)low (s)tate (r)eading e(x)change – đọc trạng thái luồng trong terminal
rule:
  /cargo:
    cmd: cargo install fsrx
    reference: https://github.com/jrnxf/fsrx?tab=readme-ov-file#cargo
    dsnap: fsrx

x:
  cargo: fsrx
binlist:
- fsrx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
