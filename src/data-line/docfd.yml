lang: Ocaml
homepage: https://github.com/darrenldl/docfd
license: MIT
desc:
  en: TUI multiline fuzzy document finder
  cn: TUI 多行模糊文档查找器
  cs: TUI víceřádkový fuzzy vyhledávač dokumentů
  de: TUI-mehrzeiliger unscharfer Dokumentensucher
  es: Buscador difuso de documentos multilínea en TUI
  fr: Rechercheur de documents flou multiligne en TUI
  id: Pencari dokumen fuzzy multiline berbasis TUI
  it: Ricercatore fuzzy di documenti multilinea in TUI
  ja: TUIの複数行対応ファジードキュメント検索
  ko: TUI 기반 여러 줄 퍼지 문서 검색기
  pl: Wielowierszowy wyszukiwacz rozmytych dokumentów w TUI
  pt: Localizador difuso de documentos multilinha em TUI
  ro: Căutător fuzzy de documente pe mai multe linii în TUI
  ru: Многострочный нечёткий поисковик документов с TUI
  th: ตัวค้นหาเอกสารแบบ fuzzy หลายบรรทัดใน TUI
  tr: TUI çok satırlı fuzzy belge bulucu
  uk: Багаторядковий нечіткий пошуковик документів з TUI
  vi: Trình tìm tài liệu fuzzy nhiều dòng trong TUI
x:
  source: https://github.com/darrenldl/docfd
  eget: darrenldl/docfd
  pacman: docfd
rule:
  /eget:
    cmd: x eget darrenldl/docfd
    reference: https://x-cmd.com/mod/eget
  /opam:
    cmd: opam install docfd
    reference: https://ocaml.org/p/docfd/latest
  arch/pacman:
    cmd: pacman -S docfd
    reference: https://github.com/darrenldl/docfd?tab=readme-ov-file#installation
  nix/nix-shell:
    cmd: nix-shell -p docfd
    reference: https://search.nixos.org/packages?query=docfd
binlist:
- docfd

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/arm64)
            en: ~5 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
