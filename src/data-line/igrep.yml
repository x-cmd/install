lang: Rust
homepage: https://github.com/konradsz/igrep
license: MIT
desc:
  cn: 交互式 Grep
  en: Interactive Grep
x:
  source: https://github.com/konradsz/igrep
  eget: https://github.com/konradsz/igrep
rule:
  /eget:
    cmd: x eget konradsz/igrep
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap konradsz/igrep https://github.com/konradsz/igrep.git && \

      brew install igrep

      '
    reference: https://github.com/konradsz/igrep?tab=readme-ov-file#homebrew
  (win|wsl2)/scoop:
    cmd: x scoop install igrep
    reference: https://github.com/konradsz/igrep?tab=readme-ov-file#scoop
  arch/pacman:
    cmd: sudo pacman -S igrep
    reference: https://github.com/konradsz/igrep?tab=readme-ov-file#arch-linux
  alpine/apk:
    cmd: apk add igrep
    reference: https://github.com/konradsz/igrep?tab=readme-ov-file#alpine-linux
binlist:
- igrep

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
