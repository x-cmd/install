lang: Rust
desc:
  cn: Rust 中的模糊查找器
  en: A fuzzy finder for Rust
  cs: Fuzzy vyhledávač pro Rust
  de: Unscharfer Suchfinder für Rust
  es: Buscador difuso para Rust
  fr: Rechercheur flou pour Rust
  id: Pencari fuzzy untuk Rust
  it: Ricercatore fuzzy per Rust
  ja: Rust用のファジーファインダー
  ko: Rust용 퍼지 파인더
  pl: Wyszukiwacz rozmyty dla Rust
  pt: Localizador difuso para Rust
  ro: Căutător fuzzy pentru Rust
  ru: Нечёткий поисковик для Rust
  th: ตัวค้นหาแบบ fuzzy สำหรับ Rust
  tr: Rust için fuzzy bulucu
  uk: Нечіткий пошуковик для Rust
  vi: Trình tìm fuzzy cho Rust
homepage: https://github.com/lotabout/skim
license: MIT
x:
  source: https://github.com/lotabout/skim
  eget: lotabout/skim
  dnf: skim
  brew: sk
  pacman: skim
  apk: skim
  port: skim
  emerge: app-misc/skim
  cargo: skim
rule:
  /x:
    cmd: x pkg use skim
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget lotabout/skim
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#hard-core
    dsnap: skim
  darwin/brew:
    cmd: brew install sk
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
  darwin/port:
    cmd: sudo port install skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
  fedora/dnf:
    cmd: dnf install skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
    dsnap: skim
  alpine/apk:
    cmd: apk add skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
    dsnap: skim
  arch/pacman:
    cmd: pacman -S skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
  gentoo/emerge:
    cmd: emerge --ask app-misc/skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
binlist:
- skim

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 1.6 MB
          rating: 1
          desc:
            cn: 约 1.6 MB（估算）
            en: ~1.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
