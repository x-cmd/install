lang: Rust
desc:
  cn: Rust 中的模糊查找器
  en: A fuzzy finder for Rust
homepage: https://github.com/lotabout/skim
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/lotabout/skim
  eget: https://github.com/lotabout/skim
rule:
  /x:
    cmd: x pkg use skim
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget lotabout/skim
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#hard-core
    dsnap: skim
  darwin/brew:
    cmd: brew install sk
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
  darwin/port:
    cmd: sudo port install skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
  fedora/dnf:
    cmd: dnf install skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
    dsnap: skim
  alpine/apk:
    cmd: apk add skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
    dsnap: skim
  arch/pacman:
    cmd: pacman -S skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
  gentoo/emerge:
    cmd: emerge --ask app-misc/skim
    reference: https://github.com/lotabout/skim?tab=readme-ov-file#package-managers
binlist:
- skim

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
