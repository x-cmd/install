lang: Rust
homepage: https://github.com/koraa/huniq
desc:
  cn: 筛选出命令行上的副本
  en: Filter out duplicates on the command line
x:
  source: https://github.com/koraa/huniq
rule:
  /cargo:
    cmd: cargo install huniq
    reference: https://github.com/koraa/huniq?tab=readme-ov-file#installation
    dsnap: huniq
binlist:
- huniq
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
