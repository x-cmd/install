lang: Rust
homepage: https://github.com/koraa/huniq
desc:
  cn: 筛选出命令行上的副本
  en: Filter out duplicates on the command line
x:
  source: https://github.com/koraa/huniq
rule:
  /cargo:
    cmd: cargo install huniq
    reference: https://github.com/koraa/huniq?tab=readme-ov-file#installation
    dsnap: huniq
binlist:
- huniq
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 KB
          rating: 1
          desc:
            cn: 约 10 KB（估算）
            en: ~10 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
