lang: Rust
homepage: https://github.com/yassinebridi/serpl
license: MIT
desc:
  cn: 用于搜索和替换的简单终端 UI，类似于 VS Code 界面风格
  en: A simple terminal UI for search and replace, ala VS Code.
  cs: Jednoduché terminálové UI pro vyhledávání a nahrazování, ve stylu VS Code.
  de: Eine einfache Terminal-Benutzeroberfläche zum Suchen und Ersetzen, à la VS Code.
  es: Una interfaz de terminal sencilla para buscar y reemplazar, al estilo de VS Code.
  fr: Une simple interface de terminal pour la recherche et le remplacement, à la VS Code.
  id: UI terminal sederhana untuk mencari dan mengganti, ala VS Code.
  it: Una semplice interfaccia a terminale per cercare e sostituire, in stile VS Code.
  ja: VS Code風の、simple な検索・置換用ターミナル UI
  ko: VS Code 스타일의 간단한 검색 및 바꾸기 터미널 UI
  pl: Prosty interfejs terminala do wyszukiwania i zamiany, w stylu VS Code.
  pt: Uma interface de terminal simples para pesquisar e substituir, ao estilo do VS Code.
  ro: O interfață de terminal simplă pentru căutare și înlocuire, în stilul VS Code.
  ru: Простой терминальный интерфейс для поиска и замены, как в VS Code.
  th: UI เทอร์มินัลอย่างง่ายสำหรับการค้นหาและแทนที่ คล้าย VS Code
  tr: VS Code tarzında basit bir terminal arama ve değiştirme arayüzü
  uk: Простий термінальний інтерфейс для пошуку та заміни, як у VS Code.
  vi: Giao diện terminal đơn giản để tìm kiếm và thay thế, phong cách VS Code
x:
  source: https://github.com/yassinebridi/serpl
  eget: yassinebridi/serpl
  brew: serpl
  pacman: serpl
  nix: nixpkgs#serpl
  cargo: serpl
rule:
  /eget:
    cmd: x eget yassinebridi/serpl
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install serpl
    reference: https://github.com/yassinebridi/serpl?tab=readme-ov-file#prerequisites
    dsnap: serpl
  darwin/brew:
    cmd: brew install serpl
    reference: https://github.com/yassinebridi/serpl?tab=readme-ov-file#os-specific-installation
  arch/pacman:
    cmd: pacman -S serpl
    reference: https://github.com/yassinebridi/serpl?tab=readme-ov-file#os-specific-installation
  nix/nixpkgs:
    cmd: nix profile install nixpkgs#serpl
    reference: https://github.com/yassinebridi/serpl?tab=readme-ov-file#nixnixos
binlist:
- serpl

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
