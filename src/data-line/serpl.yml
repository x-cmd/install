lang: Rust
homepage: https://github.com/yassinebridi/serpl
license: MIT
desc:
  cn: 用于搜索和替换的简单终端 UI，类似于 VS Code 界面风格
  en: A simple terminal UI for search and replace, ala VS Code.
x:
  source: https://github.com/yassinebridi/serpl
  eget: https://github.com/yassinebridi/serpl
  brew: serpl
  pacman: serpl
rule:
  /eget:
    cmd: x eget yassinebridi/serpl
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install serpl
    reference: https://github.com/yassinebridi/serpl?tab=readme-ov-file#prerequisites
    dsnap: serpl
  darwin/brew:
    cmd: brew install serpl
    reference: https://github.com/yassinebridi/serpl?tab=readme-ov-file#os-specific-installation
  arch/pacman:
    cmd: pacman -S serpl
    reference: https://github.com/yassinebridi/serpl?tab=readme-ov-file#os-specific-installation
  nix/nixpkgs:
    cmd: nix profile install nixpkgs#serpl
    reference: https://github.com/yassinebridi/serpl?tab=readme-ov-file#nixnixos
binlist:
- serpl

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
