lang: Go
desc:
  cn: 简单的交互式过滤工具
  en: Simplistic interactive filtering tool
homepage: https://github.com/peco/peco
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/peco/peco
  eget: https://github.com/peco/peco
rule:
  /x:
    cmd: x pkg use peco
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget peco/peco
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install peco
    reference: https://github.com/peco/peco#installation
  /scarf:
    cmd: scarf install peco
    reference: https://github.com/peco/peco#installation
  /apt:
    cmd: apt install peco
    reference: https://github.com/peco/peco#installation
  void/xbps:
    cmd: sudo xbps-install -S peco
    reference: https://github.com/peco/peco#installation
  arch/pacman:
    cmd: pacman -Syu peco
    reference: https://github.com/peco/peco#installation
  (win|wsl2)/choco:
    cmd: x choco install peco
    reference: https://github.com/peco/peco#installation
binlist:
- peco

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
