lang: Python
homepage: https://github.com/unoconv/unoconv
license: GPL-2.0
desc:
  cn: 在 LibreOffice/OpenOffice 支持的任何文档格式之间进行转换
  en: Convert between any document format supported by LibreOffice/OpenOffice
  cs: Převádí mezi libovolnými formáty dokumentů podporovanými LibreOffice/OpenOffice
  de: Konvertiert zwischen allen von LibreOffice/OpenOffice unterstützten Dokumentformaten
  es: Convierte entre cualquier formato de documento compatible con LibreOffice/OpenOffice
  fr: Convertit entre tous les formats de documents pris en charge par LibreOffice/OpenOffice
  id: Mengonversi antar berbagai format dokumen yang didukung oleh LibreOffice/OpenOffice
  it: Converte tra qualsiasi formato di documento supportato da LibreOffice/OpenOffice
  ja: LibreOffice/OpenOffice がサポートする任意の文書形式の間で変換します
  ko: LibreOffice/OpenOffice가 지원하는 모든 문서 형식 간에 변환합니다
  pl: Konwertuje między dowolnymi formatami dokumentów obsługiwanymi przez LibreOffice/OpenOffice
  pt: Converte entre qualquer formato de documento suportado por LibreOffice/OpenOffice
  ro: Convertește între orice format de document acceptat de LibreOffice/OpenOffice
  ru: Преобразует любые форматы документов, поддерживаемые LibreOffice/OpenOffice
  th: แปลงระหว่างรูปแบบเอกสารใดก็ตามที่ LibreOffice/OpenOffice รองรับ
  tr: LibreOffice/OpenOffice tarafından desteklenen herhangi bir belge biçimi arasında dönüştürür
  uk: Конвертує між будь-якими форматами документів, підтримуваними LibreOffice/OpenOffice
  vi: Chuyển đổi giữa mọi định dạng tài liệu được LibreOffice/OpenOffice hỗ trợ
x:
  source: https://github.com/unoconv/unoconv
rule:
  /x:
    cmd: x pkg use unoconv
    reference: https://x-cmd.com/install/
  /wget:
    cmd: 'cd /tmp \

      && wget -l https://gist.githubusercontent.com/regebro/036da022dc7d5241a0ee97efdf1458eb/raw/1bc0655423d196acd79a5d9fa60d2baada8dd534/find_uno.py \

      && python3 find_uno.py

      '
    reference: https://github.com/unoconv/unoconv?tab=readme-ov-file#installing-unoconv
binlist:
- unoconv

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
