lang: Python
homepage: https://github.com/unoconv/unoconv
license: GPL-2.0
desc:
  cn: 在 LibreOffice/OpenOffice 支持的任何文档格式之间进行转换
  en: Convert between any document format supported by LibreOffice/OpenOffice
x:
  pkg:
    exist: true
  source: https://github.com/unoconv/unoconv
rule:
  /x:
    cmd: x pkg use unoconv
    reference: https://x-cmd.com/install/
  /wget:
    cmd: 'cd /tmp \

      && wget -l https://gist.githubusercontent.com/regebro/036da022dc7d5241a0ee97efdf1458eb/raw/1bc0655423d196acd79a5d9fa60d2baada8dd534/find_uno.py \

      && python3 find_uno.py

      '
    reference: https://github.com/unoconv/unoconv?tab=readme-ov-file#installing-unoconv
binlist:
- unoconv
