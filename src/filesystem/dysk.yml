lang: 'Rust'
homepage: https://github.com/canop/dysk
license: 'MIT'
desc:
  cn: Linux 文件系统信息工具,比 df 更好用
  en: 'A linux utility to get information on filesystems, like df but better'
x:
  source: https://github.com/canop/dysk
  eget: https://github.com/canop/dysk
rule:
  /eget:
    cmd: x eget canop/dysk
    reference: https://github.com/canop/dysk
binlist:
  - 'dysk'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
