lang: Rust
homepage: https://github.com/veeso/termscp
license: MIT
desc:
  cn: termscp 是一个功能丰富的终端文件传输和浏览器，支持 SCP/SFTP/FTP/S3
  en: Termscp is a feature rich terminal file transfer and explorer, with support for SCP/SFTP/FTP/S3
x:
  pkg:
    exist: true
  source: https://github.com/veeso/termscp
  eget: https://github.com/veeso/termscp
rule:
  /x:
    cmd: x pkg use termscp
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget veeso/termscp
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -sSLf "https://git.io/JBhDb" | sh
    reference: https://github.com/veeso/termscp?tab=readme-ov-file#get-started-
  (win|wsl2)/choco:
    cmd: choco install termscp
    reference: https://github.com/veeso/termscp?tab=readme-ov-file#get-started-
  netbsd/pkgin:
    cmd: pkgin install termscp
    reference: https://github.com/veeso/termscp?tab=readme-ov-file#get-started-
  arch/pacman:
    cmd: pacman -S termscp
    reference: https://github.com/veeso/termscp?tab=readme-ov-file#get-started-
binlist:
- termscp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 MB
          rating: 2
          desc:
            cn: 安装 25 MB
            en: 25 MB install
        download:
          estimate: 25 MB
          desc:
            cn: 约 25 MB 下载 (linux/x64)
            en: ~25 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
