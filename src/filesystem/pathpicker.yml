lang: Python
homepage: https://github.com/facebook/PathPicker
license: MIT
desc:
  cn: Facebook PathPicker 是一个简单的命令行工具，它解决了从 bash 输出中选择文件的永久性问题
  en: Facebook PathPicker is a simple command line tool that solves the perpetual problem of selecting files out of bash output
x:
  source: https://github.com/facebook/PathPicker
rule:
  darwin/brew:
    cmd: brew install fpp
    reference: https://github.com/facebook/PathPicker?tab=readme-ov-file#homebrew
binlist:
- pathpicker

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
