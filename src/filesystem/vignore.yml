lang: Python
homepage: https://github.com/james4ever0/vignore
license: Unlicense
desc:
  en: A powerful tool to visualize ignored files
  cn: 一个强大的工具，用于可视化被忽略的文件
x:
  source: https://github.com/james4ever0/vignore
rule:
  /pip3:
    cmd: pip3 install vignore
    reference: https://github.com/james4ever0/vignore?tab=readme-ov-file#install
binlist:
- vignore

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
