lang: Python
homepage: https://github.com/james4ever0/vignore
license: Unlicense
desc:
  en: A powerful tool to visualize ignored files
  cn: 一个强大的工具，用于可视化被忽略的文件
x:
  source: https://github.com/james4ever0/vignore
rule:
  /pip3:
    cmd: pip3 install vignore
    reference: https://github.com/james4ever0/vignore?tab=readme-ov-file#install
binlist:
- vignore

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
