lang: JavaScript
homepage: https://github.com/AvianFlu/ncp
license: MIT
desc:
  cn: 异步递归文件复制实用程序
  en: Asynchronous recursive file copy utility.
  cs: Asynchronní rekurzivní nástroj pro kopírování souborů.
  de: Asynchrones rekursives Dateikopierwerkzeug.
  es: Utilidad asíncrona recursiva para copiar archivos.
  fr: Utilitaire asynchrone récursif de copie de fichiers.
  id: Utilitas salin rekursif untuk menyalin berkas.
  it: Utilità asincrona ricorsiva per la copia di file.
  ja: 非同期再帰型のファイルコピーユーティリティ。
  ko: 비동기 재귀 파일 복사 유틸리티.
  pl: Asynchroniczne rekurencyjne narzędzie do kopiowania plików.
  pt: Utilitário assíncrono recursivo de cópia de arquivos.
  ro: Utilitar asincron recursiv pentru copierea fișierelor.
  ru: Асинхронная рекурсивная утилита для копирования файлов.
  th: ยูทิลิตี้คัดลอกไฟล์แบบอะซิงโครนัสและแบบเรียกซ้ำ
  tr: Asenkron özyinelemeli dosya kopyalama aracı.
  uk: Асинхронна рекурсивна утиліта для копіювання файлів.
  vi: Tiện ích sao chép tệp đệ quy bất đồng bộ.
x:
  source: https://github.com/AvianFlu/ncp
  yay: ncp
rule:
  /x:
    cmd: x pkg use ncp
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S ncp
    reference: https://aur.archlinux.org/packages/ncp
  /npm:
    cmd: npm i ncp
    reference: https://www.npmjs.com/package/ncp
    dsnap: ncp
binlist:
- ncp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
