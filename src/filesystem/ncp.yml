lang: JavaScript
homepage: https://github.com/AvianFlu/ncp
license: MIT
desc:
  cn: 异步递归文件复制实用程序
  en: Asynchronous recursive file copy utility.
x:
  pkg:
    exist: true
  source: https://github.com/AvianFlu/ncp
rule:
  /x:
    cmd: x pkg use ncp
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S ncp
    reference: https://aur.archlinux.org/packages/ncp
  /npm:
    cmd: npm i ncp
    reference: https://www.npmjs.com/package/ncp
    dsnap: ncp
binlist:
- ncp

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
