lang: Python
homepage: https://github.com/andreafrancia/trash-cli
license: GPL-2.0
desc:
  cn: trash-cli 用于移动文件到回收站，同时会记录文件的原地址和删除日期
  en: trash-cli trashes files recording the original path, deletion date
x:
  pkg:
    exist: true
  source: https://github.com/andreafrancia/trash-cli
rule:
  /x:
    cmd: x pkg use trash-cli
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install trash-cli
    reference: https://formulae.brew.sh/formula/trash-cli#default
  /pip:
    cmd: pip install trash-cli
    reference: https://github.com/andreafrancia/trash-cli?tab=readme-ov-file#installation
    dsnap: trash-cli
  ubuntu/apt:
    cmd: sudo apt install trash-cli
    reference: https://github.com/andreafrancia/trash-cli?tab=readme-ov-file#from-package-manager
    dsnap: trash-cli
  debian/apt:
    cmd: sudo apt install trash-cli
    reference: https://github.com/andreafrancia/trash-cli?tab=readme-ov-file#from-package-manager
    dsnap: trash-cli
  arch/pacman:
    cmd: sudo pacman -S trash-cli
    reference: https://github.com/andreafrancia/trash-cli?tab=readme-ov-file#from-package-manager
  fedora/dnf:
    cmd: sudo dnf install trash-cli
    reference: https://github.com/andreafrancia/trash-cli?tab=readme-ov-file#from-package-manager
    dsnap: trash-cli
  arch/yay:
    cmd: yay -S trash-cli-git
    reference: https://aur.archlinux.org/packages/trash-cli-git
binlist:
- trash-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
