lang: C
homepage: https://oldmanprogrammer.net/source.php?dir=projects/tree
desc:
  cn: 以树的形式显示当前目录的内容
  en: Show the contents of the current directory as a tree
rule:
  darwin/brew:
    cmd: brew install tree
    reference: https://formulae.brew.sh/formula/tree
  debian/apt:
    cmd: sudo apt-get install tree
    reference: https://command-not-found.com/tree
    dsnap: tree
  ubuntu/apt:
    cmd: sudo apt-get install tree
    reference: https://command-not-found.com/tree
    dsnap: tree
  alpine/apk:
    cmd: sudo apk add tree
    reference: https://command-not-found.com/tree
    dsnap: tree
  arch/pacman:
    cmd: sudo pacman -S tree
    reference: https://command-not-found.com/tree
  kali/apt:
    cmd: sudo apt-get install tree
    reference: https://command-not-found.com/tree
    dsnap: tree
  centos/yum:
    cmd: sudo yum install tree
    reference: https://command-not-found.com/tree
  rhel/yum:
    cmd: sudo yum install tree
    reference: https://command-not-found.com/tree
  fedora/dnf:
    cmd: sudo dnf install tree
    reference: https://command-not-found.com/tree
    dsnap: tree
  rhel/dnf:
    cmd: sudo dnf install tree
    reference: https://command-not-found.com/tree
  raspbian/apt:
    cmd: sudo apt-get install tree
    reference: https://command-not-found.com/tree
  opensuse/zypper:
    cmd: sudo zypper in tree
    reference: https://command-not-found.com/tree
  opensuse/snap:
    cmd: sudo snap install tree
    reference: https://snapcraft.io/install/tree/opensuse
binlist:
- tree
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
