lang: Python
homepage: https://github.com/google/magika
license: Apache-2.0
desc:
  cn: Magika 是使用深度学习检测常见文件内容类型的工具
  en: Magika is a tool to detect common file content types, using deep learning
x:
  pkg:
    exist: true
  source: https://github.com/google/magika
  eget: https://github.com/google/magika
rule:
  /x:
    cmd: x pkg use magika
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget google/magika
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S magika
    reference: https://aur.archlinux.org/packages/magika
  /pip:
    cmd: pip install magika
    reference: https://github.com/google/magika/?tab=readme-ov-file#installation
    dsnap: magika
binlist:
- magika

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
