lang: Python
homepage: https://github.com/google/magika
license: Apache-2.0
desc:
  cn: Magika 是使用深度学习检测常见文件内容类型的工具
  en: Magika is a tool to detect common file content types, using deep learning
x:
  pkg:
    exist: true
  source: https://github.com/google/magika
  eget: https://github.com/google/magika
rule:
  /x:
    cmd: x pkg use magika
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget google/magika
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S magika
    reference: https://aur.archlinux.org/packages/magika
  /pip:
    cmd: pip install magika
    reference: https://github.com/google/magika/?tab=readme-ov-file#installation
    dsnap: magika
binlist:
- magika

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9 MB
          rating: 1
          desc:
            cn: 安装 9 MB
            en: 9 MB install
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
