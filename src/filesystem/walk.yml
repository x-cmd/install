lang: Go
homepage: https://github.com/antonmedv/walk
license: MIT
desc:
  cn: Walk 是一个基于终端的导航器，可以替代传统的 ls 和 cd 命令
  en: Walk is a terminal-based navigator that serves as an alternative to the traditional ls and cd commands
x:
  source: https://github.com/antonmedv/walk
  eget: https://github.com/antonmedv/walk
rule:
  /eget:
    cmd: x eget antonmedv/walk
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S walk
    reference: https://aur.archlinux.org/packages/walk
  darwin/brew:
    cmd: brew install walk
    reference: https://github.com/antonmedv/walk?tab=readme-ov-file#install
  openbsd/pkg_add:
    cmd: pkg_add walk
    reference: https://github.com/antonmedv/walk?tab=readme-ov-file#install
  /go:
    cmd: go install github.com/antonmedv/walk@latest
    reference: https://github.com/antonmedv/walk?tab=readme-ov-file#install
    dsnap: github.com/antonmedv/walk
binlist:
- walk

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
