lang: Go
homepage: https://github.com/antonmedv/walk
license: MIT
desc:
  cn: Walk 是一个基于终端的导航器，可以替代传统的 ls 和 cd 命令
  en: Walk is a terminal-based navigator that serves as an alternative to the traditional ls and cd commands
  cs: Walk je terminálový navigátor, který slouží jako alternativa k tradičním příkazům ls a cd
  de: Walk ist ein Terminal-Navigator, der eine Alternative zu den traditionellen Befehlen ls und cd darstellt
  es: Walk es un navegador de terminal que sirve como alternativa a los comandos tradicionales ls y cd
  fr: Walk est un navigateur de terminal qui sert d'alternative aux commandes traditionnelles ls et cd
  id: Walk adalah navigator berbasis terminal yang menjadi alternatif dari perintah tradisional ls dan cd
  it: Walk è un navigatore da terminale che funge da alternativa ai comandi tradizionali ls e cd
  ja: Walk は従来型の ls と cd コマンドの代替となるターミナルナビゲーターです
  ko: Walk는 기존 ls 및 cd 명령을 대체하는 터미널 탐색 도구입니다
  pl: Walk to nawigator terminalowy stanowiący alternatywę dla tradycyjnych poleceń ls i cd
  pt: Walk é um navegador de terminal que serve como alternativa aos comandos tradicionais ls e cd
  ro: Walk este un navigator de terminal care servește ca alternativă la comenzile tradiționale ls și cd
  ru: Walk — терминальный навигатор, служащий альтернативой традиционным командам ls и cd
  th: Walk คือตัวนำทางบนเทอร์มินัลที่ใช้แทนคำสั่ง ls และ cd แบบเดิม
  tr: Walk, geleneksel ls ve cd komutlarına alternatif olan terminal tabanlı bir gezgin
  uk: Walk — термінальний навігатор, що є альтернативою традиційним командам ls та cd
  vi: Walk là trình duyệt dựa trên terminal, thay thế cho các lệnh ls và cd truyền thống
x:
  source: https://github.com/antonmedv/walk
  eget: antonmedv/walk
  brew: walk
  yay: walk
  go: github.com/antonmedv/walk@latest
rule:
  /eget:
    cmd: x eget antonmedv/walk
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S walk
    reference: https://aur.archlinux.org/packages/walk
  darwin/brew:
    cmd: brew install walk
    reference: https://github.com/antonmedv/walk?tab=readme-ov-file#install
  openbsd/pkg_add:
    cmd: pkg_add walk
    reference: https://github.com/antonmedv/walk?tab=readme-ov-file#install
  /go:
    cmd: go install github.com/antonmedv/walk@latest
    reference: https://github.com/antonmedv/walk?tab=readme-ov-file#install
    dsnap: github.com/antonmedv/walk
binlist:
- walk

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
