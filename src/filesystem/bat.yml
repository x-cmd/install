homepage: https://github.com/sharkdp/bat
license: Apache-2.0
desc:
  cn: '`cat` 命令的克隆，带有 git 集成，支持语法高亮显示'
  en: A `cat` clone with git integration and syntax highlighting support
lang: Go
x:
  pkg:
    exist: true
  source: https://github.com/sharkdp/bat
  eget: https://github.com/sharkdp/bat
rule:
  /x:
    cmd: x pkg use bat
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget sharkdp/bat
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use bat
    reference: https://gitlab.com/wt0f/asdf-bat
  darwin/brew:
    cmd: brew install bat
    reference: https://formulae.brew.sh/formula/bat#default
  debian/apt:
    cmd: sudo apt-get install bat
    reference: https://command-not-found.com/bat
    dsnap: bat
  ubuntu/apt:
    cmd: sudo apt-get install bat
    reference: https://command-not-found.com/bat
    dsnap: bat
  alpine/apk:
    cmd: sudo apk add bat
    reference: https://github.com/sharkdp/bat
    dsnap: bat
  arch/pacman:
    cmd: sudo pacman -S bat
    reference: https://command-not-found.com/bat
  kali/apt:
    cmd: sudo apt-get install bat
    reference: https://command-not-found.com/bat
    dsnap: bat
  centos/yum:
    cmd: sudo yum install bat
    reference: https://command-not-found.com/bat
  fedora/dnf:
    cmd: sudo dnf install bat
    reference: https://command-not-found.com/bat
    dsnap: bat
  raspbian/apt:
    cmd: sudo apt-get install bat
    reference: https://command-not-found.com/bat
  opensuse/zypper:
    cmd: sudo zypper install bat
    reference: https://github.com/sharkdp/bat
  funtoo/emerge:
    cmd: sudo emerge sys-apps/bat
    reference: https://github.com/sharkdp/bat
  gentoo/emerge:
    cmd: sudo emerge sys-apps/bat
    reference: https://github.com/sharkdp/bat
  void/xbps:
    cmd: sudo xbps-install -S bat
    reference: https://github.com/sharkdp/bat
  freebsd/pkg:
    cmd: pkg install bat
    reference: https://github.com/sharkdp/bat
  openbsd/pkg_add:
    cmd: pkg_add bat
    reference: https://github.com/sharkdp/bat
  nix/nixpkgs:
    cmd: nix-env -i bat
    reference: https://github.com/sharkdp/bat
  darwin/port:
    cmd: sudo port selfupdate && sudo port install bat
    reference: https://github.com/sharkdp/bat
  (win|wsl2)/winget:
    cmd: x winget install sharkdp.bat
    reference: https://github.com/sharkdp/bat
  (win|wsl2)/scoop:
    cmd: x scoop install bat
    reference: https://github.com/sharkdp/bat
  (win|wsl2)/choco:
    cmd: x choco install bat
    reference: https://github.com/sharkdp/bat
binlist:
- bat

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
