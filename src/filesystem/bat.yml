homepage: https://github.com/sharkdp/bat
license: Apache-2.0
desc:
  cn: '`cat` 命令的克隆，带有 git 集成，支持语法高亮显示'
  en: A `cat` clone with git integration and syntax highlighting support
  cs: Klon příkazu `cat` s integrací git a podporou zvýrazňování syntaxe
  de: Ein Klon von `cat` mit git-Integration und Unterstützung für Syntaxhervorhebung
  es: Un clon de `cat` con integración de git y soporte para el resaltado de sintaxis
  fr: Un clone de `cat` avec intégration de git et prise en charge de la coloration syntaxique
  id: Klon `cat` dengan integrasi git dan dukungan sorotan sintaks
  it: Un clone di `cat` con integrazione git e supporto per l'evidenziazione della sintassi
  ja: "`cat` のクローンで、git 統合と構文ハイライトに対応しています"
  ko: git 통합과 구문 강조 표시를 지원하는 `cat` 클론
  pl: Klon polecenia `cat` z integracją git i obsługą podświetlania składni
  pt: Um clone do `cat` com integração git e suporte a realce de sintaxe
  ro: Un clone al comenzii `cat` cu integrare git și suport pentru evidențierea sintaxei
  ru: Клон `cat` с интеграцией git и поддержкой подсветки синтаксиса
  th: โคลนของ `cat` พร้อมการผสานรวมกับ git และรองรับการไฮไลต์ไวยากรณ์
  tr: git entegrasyonu ve sözdizimi vurgulama desteğiyle `cat` klonu
  uk: Клон `cat` з інтеграцією git та підтримкою підсвічування синтаксису
  vi: Bản sao chép của `cat` có tích hợp git và hỗ trợ tô sáng cú pháp
lang: Go
x:
  source: https://github.com/sharkdp/bat
  eget: sharkdp/bat
  apt: bat
  dnf: bat
  brew: bat
  pacman: bat
  apk: bat
  apt-get: bat
  yum: bat
  zypper: bat
  port: bat
  emerge: sys-apps/bat
  xbps: bat
  scoop: bat
  choco: bat
  winget: sharkdp.bat
  asdf: bat
rule:
  /x:
    cmd: x pkg use bat
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget sharkdp/bat
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use bat
    reference: https://gitlab.com/wt0f/asdf-bat
  darwin/brew:
    cmd: brew install bat
    reference: https://formulae.brew.sh/formula/bat#default
  debian/apt:
    cmd: sudo apt-get install bat
    reference: https://command-not-found.com/bat
    dsnap: bat
  ubuntu/apt:
    cmd: sudo apt-get install bat
    reference: https://command-not-found.com/bat
    dsnap: bat
  alpine/apk:
    cmd: sudo apk add bat
    reference: https://github.com/sharkdp/bat
    dsnap: bat
  arch/pacman:
    cmd: sudo pacman -S bat
    reference: https://command-not-found.com/bat
  kali/apt:
    cmd: sudo apt-get install bat
    reference: https://command-not-found.com/bat
    dsnap: bat
  centos/yum:
    cmd: sudo yum install bat
    reference: https://command-not-found.com/bat
  fedora/dnf:
    cmd: sudo dnf install bat
    reference: https://command-not-found.com/bat
    dsnap: bat
  raspbian/apt:
    cmd: sudo apt-get install bat
    reference: https://command-not-found.com/bat
  opensuse/zypper:
    cmd: sudo zypper install bat
    reference: https://github.com/sharkdp/bat
  funtoo/emerge:
    cmd: sudo emerge sys-apps/bat
    reference: https://github.com/sharkdp/bat
  gentoo/emerge:
    cmd: sudo emerge sys-apps/bat
    reference: https://github.com/sharkdp/bat
  void/xbps:
    cmd: sudo xbps-install -S bat
    reference: https://github.com/sharkdp/bat
  freebsd/pkg:
    cmd: pkg install bat
    reference: https://github.com/sharkdp/bat
  openbsd/pkg_add:
    cmd: pkg_add bat
    reference: https://github.com/sharkdp/bat
  nix/nixpkgs:
    cmd: nix-env -i bat
    reference: https://github.com/sharkdp/bat
  darwin/port:
    cmd: sudo port selfupdate && sudo port install bat
    reference: https://github.com/sharkdp/bat
  (win|wsl2)/winget:
    cmd: x winget install sharkdp.bat
    reference: https://github.com/sharkdp/bat
  (win|wsl2)/scoop:
    cmd: x scoop install bat
    reference: https://github.com/sharkdp/bat
  (win|wsl2)/choco:
    cmd: x choco install bat
    reference: https://github.com/sharkdp/bat
binlist:
- bat

