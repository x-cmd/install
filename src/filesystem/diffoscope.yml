lang: Python
desc:
  cn: 文件、档案和目录的深入比较。
  en: In-depth comparison of files, archives, and directories.
  cs: Podrobné porovnání souborů, archivů a adresářů.
  de: Tiefgehender Vergleich von Dateien, Archiven und Verzeichnissen.
  es: Comparación detallada de archivos, archivos comprimidos y directorios.
  fr: Comparaison approfondie des fichiers, des archives et des répertoires.
  id: Perbandingan mendetail file, arsip, dan direktori.
  it: Confronto approfondito di file, archivi e directory.
  ja: ファイル、アーカイブ、ディレクトリの詳細な比較。
  ko: 파일, 아카이브, 디렉터리의 심층 비교.
  pl: Dogłębne porównanie plików, archiwów i katalogów.
  pt: Comparação detalhada de arquivos, arquivos compactados e diretórios.
  ro: Comparare detaliată a fișierelor, arhivelor și directoarelor.
  ru: Подробное сравнение файлов, архивов и каталогов.
  th: การเปรียบเทียบอย่างละเอียดของไฟล์ คลังซิป และไดเรกทอรี
  tr: Dosyaların, arşivlerin ve dizinlerin ayrıntılı karşılaştırması.
  uk: Поглиблене порівняння файлів, архівів і каталогів.
  vi: So sánh chuyên sâu các tệp, kho lưu trữ và thư mục.
homepage: https://diffoscope.org/
x:
  apt: diffoscope
  dnf: diffoscope
  brew: diffoscope
  pacman: diffoscope
  zypper: diffoscope
  yay: diffoscope-git
  pip: diffoscope
rule:
  /x:
    cmd: x pkg use diffoscope
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install diffoscope
    reference: https://diffoscope.org
    dsnap: diffoscope
  darwin/brew:
    cmd: brew install diffoscope
    reference: https://diffoscope.org
  debian/apt:
    cmd: sudo apt install diffoscope
    reference: https://diffoscope.org
    dsnap: diffoscope
  /docker:
    cmd: docker run --rm -t -w $(pwd) -v $(pwd):$(pwd):ro registry.salsa.debian.org/reproducible-builds/diffoscope
    reference: https://diffoscope.org
  fedora/dnf:
    cmd: sudo dnf install diffoscope
    reference: https://diffoscope.org
    dsnap: diffoscope
  opensuse/zypper:
    cmd: sudo zypper in diffoscope
    reference: https://diffoscope.org
  arch/pacman:
    cmd: sudo pacman -S diffoscope
    reference: https://diffoscope.org
  freebsd/pkg:
    cmd: sudo pkg install py38-diffoscope
    reference: https://diffoscope.org
  openbsd/pkg_add:
    cmd: sudo pkg_add diffoscope
    reference: https://diffoscope.org
  nixos/nix:
    cmd: nix-shell -p diffoscope
    reference: https://diffoscope.org
  arch/yay:
    cmd: yay -S diffoscope-git
    reference: https://aur.archlinux.org/packages/diffoscope-git
  /git:
    cmd: git clone https://salsa.debian.org/reproducible-builds/diffoscope.git
    reference: https://diffoscope.org
binlist:
- diffoscope
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
