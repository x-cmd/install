lang: C
homepage: https://cscope.sourceforge.net/
desc:
  cn: Cscope 是一个用于浏览源代码的开发人员工具
  en: Cscope is a developer's tool for browsing source code
rule:
  darwin/brew:
    cmd: brew install cscope
    reference: https://formulae.brew.sh/formula/cscope#default
  (win|wsl2)/scoop:
    cmd: x scoop install cscope
    reference: https://scoop.sh/#/apps?q=cscope
binlist:
- cscope
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
