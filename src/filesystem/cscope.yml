lang: C
homepage: https://cscope.sourceforge.net/
desc:
  cn: Cscope 是一个用于浏览源代码的开发人员工具
  en: Cscope is a developer's tool for browsing source code
  cs: Cscope je nástroj pro vývojáře k procházení zdrojového kódu
  de: Cscope ist ein Entwicklerwerkzeug zum Browsen im Quellcode
  es: Cscope es una herramienta para desarrolladores para explorar código fuente
  fr: Cscope est un outil de développement permettant de parcourir le code source
  id: Cscope adalah alat pengembang untuk menelusuri kode sumber
  it: Cscope è uno strumento per sviluppatori per sfogliare il codice sorgente
  ja: Cscope はソースコードを閲覧するための開発者向けツールです
  ko: Cscope은 소스 코드를 탐색하기 위한 개발자 도구입니다
  pl: Cscope to narzędzie dla programistów do przeglądania kodu źródłowego
  pt: O Cscope é uma ferramenta para desenvolvedores navegarem pelo código-fonte
  ro: Cscope este un instrument pentru dezvoltatori pentru parcurgerea codului sursă
  ru: Cscope — инструмент разработчика для просмотра исходного кода
  th: Cscope คือเครื่องมือสำหรับนักพัฒนาเพื่อสำรวจโค้ดต้นฉบับ
  tr: Cscope, kaynak kodda gezinmek için geliştiricilere yönelik bir araçtır
  uk: Cscope — інструмент для розробників для перегляду вихідного коду
  vi: Cscope là công cụ dành cho nhà phát triển để duyệt mã nguồn
rule:
  darwin/brew:
    cmd: brew install cscope
    reference: https://formulae.brew.sh/formula/cscope#default
  (win|wsl2)/scoop:
    cmd: x scoop install cscope
    reference: https://scoop.sh/#/apps?q=cscope

x:
  scoop: cscope
  brew: cscope
binlist:
- cscope
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
