lang: Python
homepage: https://github.com/laktak/rsyncy
license: MIT
desc:
  cn: 用于 rsync 的状态/进度条
  en: A status/progress bar for rsync.
  cs: Stavový/progresový ukazatel pro rsync.
  de: Eine Status-/Fortschrittsanzeige für rsync.
  es: Una barra de estado/progreso para rsync.
  fr: Une barre d'état/progression pour rsync.
  id: Bilah status/progres untuk rsync.
  it: Una barra di stato/progresso per rsync.
  ja: rsync用のステータス／プログレスバー。
  ko: rsync용 상태/진행률 표시줄.
  pl: Pasek stanu/postępu dla rsync.
  pt: Uma barra de status/progresso para o rsync.
  ro: O bară de stare/progres pentru rsync.
  ru: Строка состояния/прогресса для rsync.
  th: แถบสถานะ/ความคืบหน้าสำหรับ rsync
  tr: rsync için durum/ilerleme çubuğu.
  uk: Рядок стану/прогресу для rsync.
  vi: Thanh trạng thái/tiến trình cho rsync.
x:
  source: https://github.com/laktak/rsyncy
  eget: laktak/rsyncy
  brew: rsyncy
  yay: rsyncy-bin
  pip: rsyncy
rule:
  /eget:
    cmd: x eget laktak/rsyncy
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S rsyncy-bin
    reference: https://aur.archlinux.org/packages/rsyncy-bin
  /brew:
    cmd: brew install rsyncy
    reference: https://github.com/laktak/rsyncy#installation
  /pipx:
    cmd: pipx install rsyncy
    reference: https://github.com/laktak/rsyncy#installation
  /pip:
    cmd: pip install rsyncy
    reference: https://github.com/laktak/rsyncy#installation
    dsnap: rsyncy
binlist:
- rsyncy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
