lang: Python
homepage: https://github.com/laktak/rsyncy
license: MIT
desc:
  cn: 用于 rsync 的状态/进度条
  en: A status/progress bar for rsync.
x:
  source: https://github.com/laktak/rsyncy
  eget: https://github.com/laktak/rsyncy
rule:
  /eget:
    cmd: x eget laktak/rsyncy
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S rsyncy-bin
    reference: https://aur.archlinux.org/packages/rsyncy-bin
  /brew:
    cmd: brew install rsyncy
    reference: https://github.com/laktak/rsyncy#installation
  /pipx:
    cmd: pipx install rsyncy
    reference: https://github.com/laktak/rsyncy#installation
  /pip:
    cmd: pip install rsyncy
    reference: https://github.com/laktak/rsyncy#installation
    dsnap: rsyncy
binlist:
- rsyncy

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
