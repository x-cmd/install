lang: 'Python'
homepage: https://github.com/andrianllmm/renux
license: 'MIT'
desc:
  cn: 带 TUI 的终端批量文件重命名工具
  en: 'A terminal-based bulk file renamer with a TUI'
x:
  source: https://github.com/andrianllmm/renux
  eget: https://github.com/andrianllmm/renux
rule:
  /eget:
    cmd: x eget andrianllmm/renux
    reference: https://github.com/andrianllmm/renux
binlist:
  - 'renux'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
