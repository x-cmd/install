lang: Rust
homepage: https://github.com/mgunyho/tere
license: EUPL-1.2
desc:
  en: tere is a terminal file explorer. It is a faster alternative to using cd and ls to browse folders in your terminal.
  cn: Tere 是一个终端文件浏览器。它比使用 cd 和 ls 在终端中浏览文件夹更快的替代方案。
x:
  source: https://github.com/mgunyho/tere
rule:
  darwin/brew:
    cmd: brew install tere
    reference: https://github.com/mgunyho/tere?tab=readme-ov-file#step-1-obtain-a-copy-of-tere
  /nix-env:
    cmd: nix-env -i tere
    reference: https://github.com/mgunyho/tere?tab=readme-ov-file#step-1-obtain-a-copy-of-tere
  /cargo:
    cmd: cargo install tere
    reference: https://github.com/mgunyho/tere?tab=readme-ov-file#step-1-obtain-a-copy-of-tere
    dsnap: tere
  arch/pacman:
    cmd: pacman -S tere
    reference: https://github.com/mgunyho/tere?tab=readme-ov-file#step-1-obtain-a-copy-of-tere
  (win|wsl2)/scoop:
    cmd: x scoop install tere
    reference: https://github.com/mgunyho/tere?tab=readme-ov-file#step-1-obtain-a-copy-of-tere
binlist:
- tere
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取并浏览文件系统
          en: Reads and browses filesystem
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 ~5 MB
            en: ~5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: ~20 MB
          en: ~20 MB
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 列目录时短暂占用
          en: Brief spike on directory listing
