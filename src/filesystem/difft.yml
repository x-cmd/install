lang: Rust
homepage: https://github.com/Wilfred/difftastic
license: MIT
desc:
  cn: Difftastic 是一种结构差异工具，可根据语法对文件进行比较。
  en: Difftastic is a structural diff tool that compares files based on their syntax.
  cs: Difftastic je nástroj pro strukturální porovnávání, který porovnává soubory na základě jejich syntaxe.
  de: Difftastic ist ein strukturelles Diff-Werkzeug, das Dateien anhand ihrer Syntax vergleicht.
  es: Difftastic es una herramienta de diferencias estructurales que compara archivos según su sintaxis.
  fr: Difftastic est un outil de diff structurel qui compare les fichiers en fonction de leur syntaxe.
  id: Difftastic adalah alat diff struktural yang membandingkan file berdasarkan sintaksnya.
  it: Difftastic è uno strumento di diff strutturale che confronta i file in base alla loro sintassi.
  ja: Difftastic は構文に基づいてファイルを比較する構造差分ツールです。
  ko: Difftastic는 구문을 기준으로 파일을 비교하는 구조적 diff 도구입니다.
  pl: Difftastic to narzędzie do porównywania strukturalnego, które porównuje pliki na podstawie ich składni.
  pt: O Difftastic é uma ferramenta de diff estrutural que compara arquivos com base em sua sintaxe.
  ro: Difftastic este un instrument de diferențe structurale care compară fișierele în funcție de sintaxa lor.
  ru: Difftastic — инструмент структурного сравнения, сравнивающий файлы по их синтаксису.
  th: Difftastic คือเครื่องมือเปรียบเทียบโครงสร้างที่เปรียบเทียบไฟล์ตามไวยากรณ์ของไฟล์
  tr: Difftastic, dosyaları söz dizimlerine göre karşılaştıran yapısal bir diff aracıdır.
  uk: Difftastic — інструмент структурного порівняння, який порівнює файли за їхнім синтаксисом.
  vi: Difftastic là công cụ so sánh cấu trúc, so sánh các tệp dựa trên cú pháp của chúng.
x:
  source: https://github.com/Wilfred/difftastic
  eget: Wilfred/difftastic
  brew: difftastic
  yay: difftastic-git
rule:
  /x:
    cmd: x pkg use difft
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget Wilfred/difftastic
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S difftastic-git
    reference: https://aur.archlinux.org/packages/difftastic-git
  darwin/brew:
    cmd: brew install difftastic
    reference: https://formulae.brew.sh/formula/difftastic#default
binlist:
- difft

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
