lang: Rust
homepage: https://github.com/Wilfred/difftastic
license: MIT
desc:
  cn: Difftastic 是一种结构差异工具，可根据语法对文件进行比较。
  en: Difftastic is a structural diff tool that compares files based on their syntax.
x:
  pkg:
    exist: true
  source: https://github.com/Wilfred/difftastic
  eget: https://github.com/Wilfred/difftastic
rule:
  /x:
    cmd: x pkg use difft
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget Wilfred/difftastic
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S difftastic-git
    reference: https://aur.archlinux.org/packages/difftastic-git
  darwin/brew:
    cmd: brew install difftastic
    reference: https://formulae.brew.sh/formula/difftastic#default
binlist:
- difft

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
