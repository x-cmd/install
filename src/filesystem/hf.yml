lang: Rust
homepage: https://github.com/sorairolake/hf
desc:
  en: Cross-platform hidden file library and utility
  cn: 跨平台隐藏文件库与工具
x:
  source: https://github.com/sorairolake/hf
  eget: https://github.com/sorairolake/hf
rule:
  /eget:
    cmd: x eget sorairolake/hf
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install hf
    reference: https://github.com/sorairolake/hf?tab=readme-ov-file#installation
    dsnap: hf
binlist:
- hf
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
