  fr: Bibliothèque et outil multiplateforme pour les fichiers cachés
  id: Pustaka dan utilitas file tersembunyi lintas platform
  it: Libreria e utilità multipiattaforma per file nascosti
  ja: クロスプラットフォームの隠しファイル向けライブラリとユーティリティ
  ko: 크로스 플랫폼 숨김 파일 라이브러리 및 유틸리티
  pl: Wieloplatformowa biblioteka i narzędzie do ukrytych plików
