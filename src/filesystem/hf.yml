  ro: Bibliotecă și utilitar multiplatformă pentru fișiere ascunse
  ru: Кроссплатформенная библиотека и утилита для скрытых файлов
  th: ไลบรารีและยูทิลิตี้ข้ามแพลตฟอร์มสำหรับไฟล์ซ่อน
  tr: Gizli dosyalar için platformlar arası kütüphane ve araç
  uk: Кросплатформна бібліотека та утиліта для прихованих файлів
  vi: Thư viện và tiện ích đa nền tảng cho tệp ẩn
x:
  source: https://github.com/sorairolake/hf
  eget: sorairolake/hf
  cargo: hf
rule:
  /eget:
    cmd: x eget sorairolake/hf
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install hf
    reference: https://github.com/sorairolake/hf?tab=readme-ov-file#installation
    dsnap: hf
binlist:
- hf
license: NOASSERTION

# complicated
