lang: Rust
homepage: https://github.com/sorairolake/hf
desc:
  en: Cross-platform hidden file library and utility
  cn: 跨平台隐藏文件库与工具
x:
  source: https://github.com/sorairolake/hf
  eget: https://github.com/sorairolake/hf
rule:
  /eget:
    cmd: x eget sorairolake/hf
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install hf
    reference: https://github.com/sorairolake/hf?tab=readme-ov-file#installation
    dsnap: hf
binlist:
- hf
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 458 KB
          rating: 1
          desc:
            cn: 安装 458 KB
            en: 458 KB install
        download:
          estimate: 458 KB
          desc:
            cn: 约 458 KB 下载 (linux/x64)
            en: ~458 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
