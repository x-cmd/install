lang: 'Rust'
homepage: 'https://github.com/thomasschafer/scooter'
license: 'MIT'
desc:
  cn: 终端中的交互式查找替换工具
  en: 'Interactive find-and-replace in the terminal'
  cs: Interaktivní hledání a nahrazování v terminálu
  de: Interaktives Suchen und Ersetzen im Terminal
  es: Búsqueda y reemplazo interactivos en la terminal
  fr: Recherche et remplacement interactifs dans le terminal
  id: Pencarian dan penggantian interaktif di terminal
  it: Trova e sostituisci interattivo nel terminale
  ja: ターミナルでの対話的な検索と置換
  ko: 터미널에서의 대화형 찾기 및 바꾸기
  pl: Interaktywne wyszukiwanie i zastępowanie w terminalu
  pt: Busca e substituição interativas no terminal
  ro: Căutare și înlocuire interactivă în terminal
  ru: Интерактивный поиск и замена в терминале
  th: ค้นหาและแทนที่แบบโต้ตอบในเทอร์มินัล
  tr: Terminalde etkileşimli bul ve değiştir
  uk: Інтерактивний пошук і заміна в терміналі
  vi: Tìm và thay thế tương tác trong terminal
x:
  source: https://github.com/thomasschafer/scooter
  eget: thomasschafer/scooter
rule:
  /eget:
    cmd: x eget thomasschafer/scooter
    reference: https://github.com/thomasschafer/scooter
binlist:
- 'scooter'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
