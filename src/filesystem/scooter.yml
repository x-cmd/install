lang: 'Rust'
homepage: 'https://github.com/thomasschafer/scooter'
license: 'MIT'
desc:
  cn: 终端中的交互式查找替换工具
  en: 'Interactive find-and-replace in the terminal'
x:
  source: https://github.com/thomasschafer/scooter
  eget: https://github.com/thomasschafer/scooter
rule:
  /eget:
    cmd: x eget thomasschafer/scooter
    reference: https://github.com/thomasschafer/scooter
binlist:
- 'scooter'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
