lang: Rust
homepage: https://github.com/efugier/smartcat
license: Apache-2.0
desc:
  en: Putting a brain behind `cat` Integrating language models in the Unix commands ecosystem through text streams
  cn: 在 `cat` 背后放置一个大脑 将语言模型融入 Unix 命令生态系统，通过文本流进行集成
x:
  source: https://github.com/efugier/smartcat
  eget: https://github.com/efugier/smartcat
rule:
  /eget:
    cmd: x eget efugier/smartcat
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install smartcat
    reference: https://github.com/efugier/smartcat?tab=readme-ov-file#installation
    dsnap: smartcat
  arch/pacman:
    cmd: pacman -S smartcat
    reference: https://github.com/efugier/smartcat?tab=readme-ov-file#installation
binlist:
- smartcat

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
