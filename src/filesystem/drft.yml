lang: Rust
homepage: https://codeberg.org/nightsail/drft
desc:
  en: A diff re/viewer that navigates by files, as a tree, so larger patches are no longer a pain to read.
  cn: 差异查看器通过文件以树的形式进行导航，因此较大的补丁不再难以阅读。
rule:
  /cargo:
    cmd: cargo install drft
    reference: https://codeberg.org/nightsail/drft
    dsnap: drft
binlist:
- drft
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
