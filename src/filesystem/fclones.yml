lang: Rust
homepage: https://github.com/pkolaczk/fclones
license: MIT
desc:
  cn: 高效的重复文件查找器和删除器
  en: Efficient duplicate file finder and remover
x:
  source: https://github.com/pkolaczk/fclones
rule:
  linux/snap:
    cmd: snap install fclones
    reference: https://github.com/pkolaczk/fclones?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install fclones
    reference: https://github.com/pkolaczk/fclones?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install fclones
    reference: https://github.com/pkolaczk/fclones?tab=readme-ov-file#installation
    dsnap: fclones
  arch/yay:
    cmd: yay -S fclones-git
    reference: https://aur.archlinux.org/packages/fclones-git
binlist:
- fclones

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
