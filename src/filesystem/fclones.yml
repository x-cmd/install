lang: Rust
homepage: https://github.com/pkolaczk/fclones
license: MIT
desc:
  cn: 高效的重复文件查找器和删除器
  en: Efficient duplicate file finder and remover
  cs: Efektivní nástroj na hledání a odstraňování duplicitních souborů
  de: Effizienter Duplicate-File-Finder und -Entferner
  es: Buscador y eliminador de archivos duplicados eficiente
  fr: Détecteur et suppresseur de fichiers en double efficace
  id: Alat efisien untuk mencari dan menghapus file duplikat
  it: Efficiente finder e rimuovere di file duplicati
  ja: 高速な重複ファイルの発見と削除ツール
  ko: 효율적인 중복 파일 찾기 및 삭제 도구
  pl: Wydajny finder i usuwacz duplikatów plików
  pt: Localizador e removedor eficiente de arquivos duplicados
  ro: Găsitor și eliminator eficient de fișiere duplicate
  ru: Эффективный поиск и удаление дубликатов файлов
  th: เครื่องมือค้นหาและลบไฟล์ซ้ำอย่างมีประสิทธิภาพ
  tr: Verimli yinelenen dosya bulma ve silme aracı
  uk: Ефективний пошук і видалення дублікатів файлів
  vi: Công cụ tìm và xóa tệp trùng lặp hiệu quả
x:
  source: https://github.com/pkolaczk/fclones
  brew: fclones
  snap: fclones
  yay: fclones-git
  cargo: fclones
rule:
  linux/snap:
    cmd: snap install fclones
    reference: https://github.com/pkolaczk/fclones?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install fclones
    reference: https://github.com/pkolaczk/fclones?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install fclones
    reference: https://github.com/pkolaczk/fclones?tab=readme-ov-file#installation
    dsnap: fclones
  arch/yay:
    cmd: yay -S fclones-git
    reference: https://aur.archlinux.org/packages/fclones-git
binlist:
- fclones

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
