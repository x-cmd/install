lang: Rust
homepage: https://github.com/jhspetersson/fselect
license: Apache-2.0
desc:
  cn: find 命令的现代化替代品，用于在文件系统中进行快速查找文件和目录
  en: A modern replacement for the find command for quickly finding files and directories in a file system
x:
  pkg:
    exist: true
  source: https://github.com/jhspetersson/fselect
rule:
  /x:
    cmd: x pkg use fselect
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#mac-via-homebrew
  darwin/port:
    cmd: sudo port selfupdate && sudo port install fselect
    reference: https://fselect.rocks/#mac-via-macports
  (win|wsl2)/choco:
    cmd: x choco install fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#windows-via-chocolatey
  (win|wsl2)/scoop:
    cmd: x scoop install fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#windows-via-scoop
  (win|wsl2)/winget:
    cmd: x winget install -e --id fselect.fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#windows-via-winget
  /cargo:
    cmd: cargo install fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#latest-release-from-source
    dsnap: fselect
  arch/yay:
    cmd: yay -S fselect
    reference: https://aur.archlinux.org/packages/fselect
binlist:
- fselect

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
