lang: Rust
homepage: https://github.com/jhspetersson/fselect
license: Apache-2.0
desc:
  cn: find 命令的现代化替代品，用于在文件系统中进行快速查找文件和目录
  en: A modern replacement for the find command for quickly finding files and directories in a file system
  cs: Moderní náhrada příkazu find pro rychlé hledání souborů a adresářů v souborovém systému
  de: Ein moderner Ersatz für den Befehl find zum schnellen Finden von Dateien und Verzeichnissen in einem Dateisystem
  es: Un sustituto moderno del comando find para encontrar rápidamente archivos y directorios en un sistema de archivos
  fr: Un remplaçant moderne de la commande find pour trouver rapidement des fichiers et des répertoires dans un système de fichiers
  id: Pengganti modern perintah find untuk dengan cepat menemukan berkas dan direktori dalam sistem berkas
  it: Un sostituto moderno del comando find per trovare rapidamente file e directory in un file system
  ja: ファイルシステム内のファイルとディレクトリをすばやく見つけるための、find コマンドのモダンな代替
  ko: 파일 시스템에서 파일과 디렉터리를 빠르게 찾기 위한 find 명령의 현대적인 대체
  pl: Nowoczesny zamiennik polecenia find do szybkiego wyszukiwania plików i katalogów w systemie plików
  pt: Um substituto moderno do comando find para encontrar rapidamente arquivos e diretórios em um sistema de arquivos
  ro: O înlocuitor modern al comenzii find pentru găsirea rapidă a fișierelor și directoarelor într-un sistem de fișiere
  ru: Современная замена команде find для быстрого поиска файлов и каталогов в файловой системе
  th: ตัวแทนสมัยใหม่ของคำสั่ง find สำหรับค้นหาไฟล์และไดเรกทอรีอย่างรวดเร็วในระบบไฟล์
  tr: Dosya sisteminde dosyaları ve dizinleri hızlıca bulmak için find komutuna modern bir alternatif
  uk: Сучасна заміна команді find для швидкого пошуку файлів і каталогів у файловій системі
  vi: Bản thay thế hiện đại cho lệnh find để nhanh chóng tìm tệp và thư mục trong hệ thống tệp
x:
  source: https://github.com/jhspetersson/fselect
  brew: fselect
  port: fselect
  scoop: fselect
  choco: fselect
  yay: fselect
  cargo: fselect
rule:
  /x:
    cmd: x pkg use fselect
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#mac-via-homebrew
  darwin/port:
    cmd: sudo port selfupdate && sudo port install fselect
    reference: https://fselect.rocks/#mac-via-macports
  (win|wsl2)/choco:
    cmd: x choco install fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#windows-via-chocolatey
  (win|wsl2)/scoop:
    cmd: x scoop install fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#windows-via-scoop
  (win|wsl2)/winget:
    cmd: x winget install -e --id fselect.fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#windows-via-winget
  /cargo:
    cmd: cargo install fselect
    reference: https://github.com/jhspetersson/fselect?tab=readme-ov-file#latest-release-from-source
    dsnap: fselect
  arch/yay:
    cmd: yay -S fselect
    reference: https://aur.archlinux.org/packages/fselect
binlist:
- fselect

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
