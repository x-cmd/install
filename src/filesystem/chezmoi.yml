lang: Go
homepage: https://github.com/twpayne/chezmoi
license: MIT
desc:
  cn: 跨多个不同的机器安全地管理您的 dotfiles
  en: Manage your dotfiles across multiple diverse machines, securely
  cs: Bezpečně spravujte své dotfiles na více různých počítačích
  de: Verwalten Sie Ihre Dotfiles sicher auf mehreren unterschiedlichen Rechnern
  es: Gestiona tus dotfiles de forma segura en varias máquinas distintas
  fr: Gérez vos dotfiles de manière sécurisée sur plusieurs machines différentes
  id: Kelola dotfile Anda secara aman di berbagai mesin yang beragam
  it: Gestisci in modo sicuro i tuoi dotfile su macchine diverse e molteplici
  ja: 多様なマシン全体で dotfiles を安全に管理します
  ko: 다양한 여러 대의 머신에서 dotfiles를 안전하게 관리하세요
  pl: Bezpiecznie zarządzaj swoimi plikami dotfiles na wielu różnych maszynach
  pt: Gerencie seus dotfiles com segurança em várias máquinas diferentes
  ro: Gestionați-vă dotfiles în siguranță pe mai multe mașini diferite
  ru: Безопасно управляйте своими dotfiles на множестве различных машин
  th: จัดการไฟล์ dotfiles ของคุณอย่างปลอดภัยบนเครื่องหลากหลายเครื่อง
  tr: Dotfile'larınızı çeşitli makinelerde güvenli bir şekilde yönetin
  uk: Безпечно керуйте своїми dotfiles на багатьох різних машинах
  vi: Quản lý dotfiles của bạn một cách an toàn trên nhiều máy khác nhau
x:
  source: https://github.com/twpayne/chezmoi
  eget: twpayne/chezmoi
  brew: chezmoi
  pacman: chezmoi
  apk: chezmoi
  snap: chezmoi
  zypper: chezmoi
  port: chezmoi
  xbps: chezmoi
  scoop: chezmoi
  choco: chezmoi
  winget: twpayne.chezmoi
  asdf: chezmoi
rule:
  /eget:
    cmd: x eget twpayne/chezmoi
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use chezmoi
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use chezmoi
    reference: https://github.com/joke/asdf-chezmoi
  /curl:
    cmd: sh -c "$(curl -fsLS get.chezmoi.io)"
    reference: https://www.chezmoi.io/install/
  /wget:
    cmd: sh -c "$(wget -qO- get.chezmoi.io)"
    reference: https://www.chezmoi.io/install/
  win/powershell:
    cmd: x pwsh (irm -useb https://get.chezmoi.io/ps1) | powershell -c -
    reference: https://www.chezmoi.io/install/
  alpine/apk:
    cmd: sudo apk add chezmoi
    reference: https://www.chezmoi.io/install/
  arch/pacman:
    cmd: sudo pacman -S chezmoi
    reference: https://www.chezmoi.io/install/
  nix/:
    cmd: nix-env -i chezmoi
    reference: https://www.chezmoi.io/install/
  opensuse/zypper:
    cmd: sudo zypper install chezmoi
    reference: https://www.chezmoi.io/install/
  termux/pkg:
    cmd: sudo pkg install chezmoi
    reference: https://www.chezmoi.io/install/
  void/xbps:
    cmd: sudo xbps-install -S chezmoi
    reference: https://www.chezmoi.io/install/
  darwin/brew:
    cmd: brew install chezmoi
    reference: https://formulae.brew.sh/formula/chezmoi#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install chezmoi
    reference: https://www.chezmoi.io/install/
  /snap:
    cmd: snap install chezmoi --classic
    reference: https://www.chezmoi.io/install/#one-line-package-install
  (win|wsl2)/scoop:
    cmd: x scoop install chezmoi
    reference: https://www.chezmoi.io/install/
  (win|wsl2)/choco:
    cmd: x choco install chezmoi
    reference: https://www.chezmoi.io/install/
  (win|wsl2)/winget:
    cmd: x winget install twpayne.chezmoi
    reference: https://www.chezmoi.io/install/
  freebsd/pkg:
    cmd: pkg install chezmoi
    reference: https://www.chezmoi.io/install/
  openindiana/pkg:
    cmd: pkg install application/chezmoi
    reference: https://www.chezmoi.io/install/
  /build:
    cmd: 'git clone https://github.com/twpayne/chezmoi.git \

      && cd chezmoi \

      && make install-from-git-working-copy

      '
    reference: https://www.chezmoi.io/install/#install-from-source
binlist:
- chezmoi

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 39 MB
          rating: 2
          desc:
            cn: 安装 39 MB
            en: 39 MB install
        download:
          estimate: 39 MB
          desc:
            cn: 约 39 MB 下载 (linux/x64)
            en: ~39 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
