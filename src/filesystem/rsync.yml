lang: C
homepage: https://github.com/RsyncProject/rsync
desc:
  en: Rsync is a fast and extraordinarily versatile file copying tool for both remote and local files
  cn: Rsync 是一个用于远程和本地文件的快速且通用的文件复制工具
x:
  source: https://github.com/RsyncProject/rsync
  eget: https://github.com/RsyncProject/rsync
rule:
  /eget:
    cmd: x eget RsyncProject/rsync
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install rsync
    reference: https://formulae.brew.sh/formula/rsync#default
  (win|wsl2)/scoop:
    cmd: x scoop install main/cwrsync
    reference: https://scoop.sh/#/apps?q=rsync
  debian/apt:
    cmd: sudo apt-get install rsync
    reference: https://command-not-found.com/rsync
    dsnap: rsync
  ubuntu/apt:
    cmd: sudo apt-get install rsync
    reference: https://command-not-found.com/rsync
    dsnap: rsync
  alpine/apk:
    cmd: sudo apk add rsync
    reference: https://command-not-found.com/rsync
    dsnap: rsync
  arch/pacman:
    cmd: sudo pacman -S rsync
    reference: https://command-not-found.com/rsync
  kali/apt:
    cmd: sudo apt-get install rsync
    reference: https://command-not-found.com/rsync
    dsnap: rsync
  fedora/dnf:
    cmd: sudo dnf install rsync
    reference: https://command-not-found.com/rsync
    dsnap: rsync
  raspbian/apt:
    cmd: sudo apt-get install rsync
    reference: https://command-not-found.com/rsync
binlist:
- rsync
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
