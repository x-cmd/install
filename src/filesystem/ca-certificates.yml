lang: Go
homepage: https://github.com/curl/curl
desc:
  cn: 云本机构建包，将自定义 CA 证书添加到构建和创建的图像
  en: A Cloud Native Buildpack that adds custom CA certificates to a build and a created image
x:
  source: https://github.com/curl/curl
  eget: https://github.com/curl/curl
rule:
  /eget:
    cmd: x eget curl/curl
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install ca-certificates
    reference: https://formulae.brew.sh/formula/ca-certificates#default
  (win|wsl2)/scoop:
    cmd: x scoop install cacert
    reference: https://scoop.sh/#/apps?q=ca-certificates
  /curl:
    cmd: curl --etag-compare etag.txt --etag-save etag.txt --remote-name https://curl.se/ca/cacert.pem
    reference: https://curl.se/docs/caextract.html
binlist:
- ca-certificates
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
