lang: Go
homepage: https://github.com/syncthing/syncthing
license: MPL-2.0
desc:
  cn: Syncthing 是一个连续文件同步程序
  en: Syncthing is a continuous file synchronization program
x:
  source: https://github.com/syncthing/syncthing
  eget: syncthing/syncthing
  apt: syncthing
  dnf: syncthing
  pacman: syncthing
  apk: syncthing
  apt-get: syncthing
  yay: syncthing-bin
rule:
  /eget:
    cmd: x eget syncthing/syncthing
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use syncthing
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -sS https://webinstall.dev/syncthing | bash
    reference: https://docs.syncthing.net/users/contrib.html#id1
  debian/apt:
    cmd: sudo apt-get install syncthing
    reference: https://apt.syncthing.net/
    dsnap: syncthing
  ubuntu/apt:
    cmd: sudo apt-get install syncthing
    reference: https://apt.syncthing.net/
    dsnap: syncthing
  alpine/apk:
    cmd: apk add syncthing
    reference: https://command-not-found.com/syncthing
  kali/apt:
    cmd: sudo apt-get install syncthing
    reference: https://command-not-found.com/syncthing
    dsnap: syncthing
  arch/pacman:
    cmd: sudo pacman -S syncthing
    reference: https://command-not-found.com/syncthing
  fedora/dnf:
    cmd: sudo dnf install syncthing
    reference: https://command-not-found.com/syncthing
  raspbian/apt:
    cmd: sudo apt-get install syncthing
    reference: https://command-not-found.com/syncthing
  arch/yay:
    cmd: yay -S syncthing-bin
    reference: https://aur.archlinux.org/packages/syncthing-bin
binlist:
- syncthing

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 26 MB
          rating: 2
          desc:
            cn: 安装 26 MB
            en: 26 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 51 MB
        desc:
          cn: 51 MB
          en: 51 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
