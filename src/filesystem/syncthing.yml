lang: Go
homepage: https://github.com/syncthing/syncthing
license: MPL-2.0
desc:
  cn: Syncthing 是一个连续文件同步程序
  en: Syncthing is a continuous file synchronization program
x:
  pkg:
    exist: true
  source: https://github.com/syncthing/syncthing
  eget: https://github.com/syncthing/syncthing
rule:
  /eget:
    cmd: x eget syncthing/syncthing
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use syncthing
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -sS https://webinstall.dev/syncthing | bash
    reference: https://docs.syncthing.net/users/contrib.html#id1
  debian/apt:
    cmd: sudo apt-get install syncthing
    reference: https://apt.syncthing.net/
    dsnap: syncthing
  ubuntu/apt:
    cmd: sudo apt-get install syncthing
    reference: https://apt.syncthing.net/
    dsnap: syncthing
  alpine/apk:
    cmd: apk add syncthing
    reference: https://command-not-found.com/syncthing
  kali/apt:
    cmd: sudo apt-get install syncthing
    reference: https://command-not-found.com/syncthing
    dsnap: syncthing
  arch/pacman:
    cmd: sudo pacman -S syncthing
    reference: https://command-not-found.com/syncthing
  fedora/dnf:
    cmd: sudo dnf install syncthing
    reference: https://command-not-found.com/syncthing
  raspbian/apt:
    cmd: sudo apt-get install syncthing
    reference: https://command-not-found.com/syncthing
  arch/yay:
    cmd: yay -S syncthing-bin
    reference: https://aur.archlinux.org/packages/syncthing-bin
binlist:
- syncthing

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
