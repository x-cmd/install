lang: Rust
homepage: https://github.com/sharkdp/fd
license: Apache-2.0
desc:
  cn: '`find` 命令的现代化替代品，用于在文件系统中进行快速查找文件和目录'
  en: A modern alternative for the `find` command, used for quickly searching files and directories in the file system
  cs: Moderní alternativa k příkazu `find`, která slouží k rychlému hledání souborů a adresářů v souborovém systému
  de: Eine moderne Alternative zum Befehl `find` zum schnellen Suchen von Dateien und Verzeichnissen im Dateisystem
  es: Una alternativa moderna al comando `find`, que sirve para buscar rápidamente archivos y directorios en el sistema de archivos
  fr: Une alternative moderne à la commande `find`, pour rechercher rapidement des fichiers et des répertoires dans le système de fichiers
  id: Alternatif modern untuk perintah `find`, digunakan untuk mencari berkas dan direktori dengan cepat di sistem berkas
  it: Un'alternativa moderna al comando `find`, usata per cercare rapidamente file e directory nel file system
  ja: ファイルシステム内のファイルとディレクトリをすばやく検索するための、`find` コマンドのモダンな代替品
  ko: 파일 시스템에서 파일과 디렉터리를 빠르게 검색하기 위한 `find` 명령의 현대적인 대안
  pl: Nowoczesna alternatywa dla polecenia `find`, służąca do szybkiego wyszukiwania plików i katalogów w systemie plików
  pt: Uma alternativa moderna ao comando `find`, usada para pesquisar rapidamente arquivos e diretórios no sistema de arquivos
  ro: O alternativă modernă la comanda `find`, folosită pentru căutarea rapidă a fișierelor și directoarelor în sistemul de fișiere
  ru: Современная альтернатива команде `find` для быстрого поиска файлов и каталогов в файловой системе
  th: ทางเลือกสมัยใหม่ของคำสั่ง `find` สำหรับค้นหาไฟล์และไดเรกทอรีอย่างรวดเร็วในระบบไฟล์
  tr: Dosya sisteminde dosyaları ve dizinleri hızlıca aramak için `find` komutuna modern bir alternatif
  uk: Сучасна альтернатива команді `find` для швидкого пошуку файлів і каталогів у файловій системі
  vi: Bản thay thế hiện đại cho lệnh `find`, dùng để nhanh chóng tìm tệp và thư mục trong hệ thống tệp
x:
  source: https://github.com/sharkdp/fd
  eget: sharkdp/fd
  apt: fd-find
  dnf: fd-find
  brew: fd
  pacman: fd
  apk: fd
  apt-get: fd-find
  zypper: fd
  port: fd
  xbps: fd
  scoop: fd
  choco: fd
  winget: sharkdp.fd
  npm: fd-find
  asdf: fd
rule:
  /x:
    cmd: x pkg use fd
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget sharkdp/fd
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use fd
    reference: https://gitlab.com/wt0f/asdf-fd
  darwin/brew:
    cmd: brew install fd
    reference: https://github.com/sharkdp/fd
  debian/apt:
    cmd: sudo apt-get install fd-find
    reference: https://github.com/sharkdp/fd
    dsnap: fd-find
  ubuntu/apt:
    cmd: sudo apt install fd-find
    reference: https://github.com/sharkdp/fd
    dsnap: fd-find
  alpine/apk:
    cmd: sudo apk add fd
    reference: https://github.com/sharkdp/fd
    dsnap: fd
  arch/pacman:
    cmd: sudo pacman -S fd
    reference: https://github.com/sharkdp/fd
  kali/apt:
    cmd: sudo apt-get install fdclone
    reference: https://command-not-found.com/fd
    dsnap: fdclone
  fedora/dnf:
    cmd: sudo dnf install fd-find
    reference: https://github.com/sharkdp/fd
    dsnap: fd-find
  raspbian/apt:
    cmd: sudo apt-get install fdclone
    reference: https://command-not-found.com/fd
  opensuse/zypper:
    cmd: sudo zypper in fd
    reference: https://github.com/sharkdp/fd
  gentoo/emerge:
    cmd: sudo emerge -av fd
    reference: https://github.com/sharkdp/fd
  void/xbps:
    cmd: sudo xbps-install -S fd
    reference: https://github.com/sharkdp/fd
  freebsd/pkg:
    cmd: pkg install fd-find
    reference: https://github.com/sharkdp/fd
  openbsd/pkg_add:
    cmd: pkg_add fd
    reference: https://github.com/sharkdp/fd
  nix/nixpkgs:
    cmd: nix-env -i fd
    reference: https://github.com/sharkdp/fd
  guixos/guix:
    cmd: guix install fd
    reference: https://github.com/sharkdp/fd
  /npm:
    cmd: npm install -g fd-find
    reference: https://github.com/sharkdp/fd
    dsnap: fd-find
  darwin/port:
    cmd: sudo port selfupdate && sudo port install fd
    reference: https://github.com/sharkdp/fd
  (win|wsl2)/winget:
    cmd: x winget install sharkdp.fd
    reference: https://github.com/sharkdp/fd
  (win|wsl2)/scoop:
    cmd: x scoop install fd
    reference: https://github.com/sharkdp/fd
  (win|wsl2)/choco:
    cmd: x choco install fd
    reference: https://github.com/sharkdp/fd
binlist:
- fd

