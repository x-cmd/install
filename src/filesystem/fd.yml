lang: Rust
homepage: https://github.com/sharkdp/fd
license: Apache-2.0
desc:
  cn: '`find` 命令的现代化替代品，用于在文件系统中进行快速查找文件和目录'
  en: A modern alternative for the `find` command, used for quickly searching files and directories in the file system
x:
  source: https://github.com/sharkdp/fd
  eget: https://github.com/sharkdp/fd
  apt: fd-find
  dnf: fd-find
  brew: fd
  pacman: fd
  apk: fd
  apt-get: fd-find
  zypper: fd
  port: fd
  emerge: -av
  xbps: fd
  scoop: fd
  choco: fd
  winget: sharkdp.fd
  powershell: install
  npm: fd-find
  asdf: fd
  pkg: fd-find
rule:
  /x:
    cmd: x pkg use fd
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget sharkdp/fd
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use fd
    reference: https://gitlab.com/wt0f/asdf-fd
  darwin/brew:
    cmd: brew install fd
    reference: https://github.com/sharkdp/fd
  debian/apt:
    cmd: sudo apt-get install fd-find
    reference: https://github.com/sharkdp/fd
    dsnap: fd-find
  ubuntu/apt:
    cmd: sudo apt install fd-find
    reference: https://github.com/sharkdp/fd
    dsnap: fd-find
  alpine/apk:
    cmd: sudo apk add fd
    reference: https://github.com/sharkdp/fd
    dsnap: fd
  arch/pacman:
    cmd: sudo pacman -S fd
    reference: https://github.com/sharkdp/fd
  kali/apt:
    cmd: sudo apt-get install fdclone
    reference: https://command-not-found.com/fd
    dsnap: fdclone
  fedora/dnf:
    cmd: sudo dnf install fd-find
    reference: https://github.com/sharkdp/fd
    dsnap: fd-find
  raspbian/apt:
    cmd: sudo apt-get install fdclone
    reference: https://command-not-found.com/fd
  opensuse/zypper:
    cmd: sudo zypper in fd
    reference: https://github.com/sharkdp/fd
  gentoo/emerge:
    cmd: sudo emerge -av fd
    reference: https://github.com/sharkdp/fd
  void/xbps:
    cmd: sudo xbps-install -S fd
    reference: https://github.com/sharkdp/fd
  freebsd/pkg:
    cmd: pkg install fd-find
    reference: https://github.com/sharkdp/fd
  openbsd/pkg_add:
    cmd: pkg_add fd
    reference: https://github.com/sharkdp/fd
  nix/nixpkgs:
    cmd: nix-env -i fd
    reference: https://github.com/sharkdp/fd
  guixos/guix:
    cmd: guix install fd
    reference: https://github.com/sharkdp/fd
  /npm:
    cmd: npm install -g fd-find
    reference: https://github.com/sharkdp/fd
    dsnap: fd-find
  darwin/port:
    cmd: sudo port selfupdate && sudo port install fd
    reference: https://github.com/sharkdp/fd
  (win|wsl2)/winget:
    cmd: x winget install sharkdp.fd
    reference: https://github.com/sharkdp/fd
  (win|wsl2)/scoop:
    cmd: x scoop install fd
    reference: https://github.com/sharkdp/fd
  (win|wsl2)/choco:
    cmd: x choco install fd
    reference: https://github.com/sharkdp/fd
binlist:
- fd

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.6 MB
          rating: 1
          desc:
            cn: 安装 3.6 MB
            en: 3.6 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
