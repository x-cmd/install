lang: 'C'
homepage: https://github.com/tavianator/bfs
license: '0BSD'
desc:
  cn: UNIX find 命令的广度优先版本
  en: 'A breadth-first version of the UNIX find command'
x:
  source: https://github.com/tavianator/bfs
  eget: tavianator/bfs
rule:
  /eget:
    cmd: x eget tavianator/bfs
    reference: https://github.com/tavianator/bfs
binlist:
  - 'bfs'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 907 KB
          rating: 1
          desc:
            cn: 约 907 KB（估算）
            en: ~907 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
