lang: 'C'
homepage: https://github.com/tavianator/bfs
license: '0BSD'
desc:
  cn: UNIX find 命令的广度优先版本
  en: 'A breadth-first version of the UNIX find command'
x:
  source: https://github.com/tavianator/bfs
  eget: https://github.com/tavianator/bfs
rule:
  /eget:
    cmd: x eget tavianator/bfs
    reference: https://github.com/tavianator/bfs
binlist:
  - 'bfs'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
