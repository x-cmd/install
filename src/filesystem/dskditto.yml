lang: 'Go'
homepage: 'https://github.com/jdefrancesco/dskDitto'
license: 'Apache-2.0'
desc:
  cn: 超快易用的重复文件查找器,配 TUI/GUI 管理结果
  en: 'Ultra fast and easy duplicate file finder. Awesome TUI/GUI to manage results.'
x:
  source: https://github.com/jdefrancesco/dskDitto
  eget: https://github.com/jdefrancesco/dskDitto
  go: github.com/securego/gosec/v2/cmd/gosec@latest'
rule:
  /go:
    cmd: 'go install github.com/securego/gosec/v2/cmd/gosec@latest'
    reference: https://github.com/jdefrancesco/dskDitto
  /eget:
    cmd: x eget jdefrancesco/dskDitto
    reference: https://github.com/jdefrancesco/dskDitto
binlist:
  - 'dskditto'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 882 KB
          rating: 1
          desc:
            cn: 约 882 KB（估算）
            en: ~882 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
