lang: Rust
homepage: https://github.com/dduan/tre
license: MIT
desc:
  en: A modern alternative to the tree command
  cn: 树状结构命令的现代替代方案
x:
  source: https://github.com/dduan/tre
  eget: dduan/tre
  apt: tre-command
  brew: tre-command
  port: tre-tree
  scoop: tre-command
  winget: tre-command
  yay: tre-command
  cargo: tre-command
rule:
  /eget:
    cmd: x eget dduan/tre
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tre-command
    reference: https://github.com/dduan/tre?tab=readme-ov-file#install
  darwin/port:
    cmd: sudo port install tre-tree
    reference: https://github.com/dduan/tre?tab=readme-ov-file#install
  debian/apt:
    cmd: sudo apt install tre-command
    reference: https://github.com/dduan/tre?tab=readme-ov-file#install
    dsnap: tre-command
  (win|wsl2)/scoop:
    cmd: x scoop install tre-command
    reference: https://github.com/dduan/tre?tab=readme-ov-file#install
  (win|wsl2)/winget:
    cmd: x winget install tre-command
    reference: https://github.com/dduan/tre?tab=readme-ov-file#install
  /cargo:
    cmd: cargo install tre-command
    reference: https://github.com/dduan/tre?tab=readme-ov-file#install
    dsnap: tre-command
  arch/yay:
    cmd: yay -S tre-command
    reference: https://github.com/dduan/tre?tab=readme-ov-file#install
  netbsd/pkgin:
    cmd: pkgin install tre-command
    reference: https://github.com/dduan/tre?tab=readme-ov-file#install
binlist:
- tre

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 783 KB
          rating: 1
          desc:
            cn: 安装 783 KB
            en: 783 KB install
        download:
          estimate: 783 KB
          desc:
            cn: 约 783 KB 下载 (linux/x64)
            en: ~783 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
