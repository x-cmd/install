lang: Rust/shell
homepage: https://github.com/nikolassv/bartib
license: GPL-3.0
desc:
  en: Bartib is an easy to use time tracking tool for the command line
  cn: Bartib 是一个易于使用的命令行时间跟踪工具
  cs: Bartib je snadno použitelný nástroj pro sledování času v příkazovém řádku
  de: Bartib ist ein leicht zu bedienendes Zeit-tracking-Tool für die Kommandozeile
  es: Bartib es una herramienta fácil de usar para el seguimiento del tiempo en la línea de comandos
  fr: Bartib est un outil de suivi du temps facile à utiliser en ligne de commande
  id: Bartib adalah alat pelacakan waktu yang mudah digunakan untuk baris perintah
  it: Bartib è un facile strumento di tracciamento del tempo per la riga di comando
  ja: Bartib はコマンドライン向けの使いやすい時間追跡ツールです
  ko: Bartib은 명령줄에서 쉽게 사용할 수 있는 시간 추적 도구입니다
  pl: Bartib to łatwy w użyciu narzędzie do śledzenia czasu w wierszu poleceń
  pt: Bartib é uma ferramenta fácil de usar para rastreamento de tempo na linha de comando
  ro: Bartib este un instrument ușor de utilizat pentru urmărirea timpului în linia de comandă
  ru: Bartib — простой в использовании инструмент учёта времени для командной строки
  th: Bartib เป็นเครื่องมือติดตามเวลาที่ใช้งานง่ายสำหรับบรรทัดคำสั่ง
  tr: Bartib, komut satırı için kullanımı kolay bir zaman takibi aracıdır
  uk: Bartib — простий у використанні інструмент обліку часу для командного рядка
  vi: Bartib là công cụ theo dõi thời gian dễ sử dụng cho dòng lệnh
x:
  source: https://github.com/nikolassv/bartib
  eget: nikolassv/bartib
  brew: bartib
  apk: bartib
  yay: bartib
  cargo: bartib
rule:
  /eget:
    cmd: x eget nikolassv/bartib
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install bartib
    reference: https://github.com/nikolassv/bartib?tab=readme-ov-file#with-cargo
    dsnap: bartib
  arch/yay:
    cmd: sudo yay -S bartib
    reference: https://github.com/nikolassv/bartib?tab=readme-ov-file#from-the-aur-arch-linux
  darwin/brew:
    cmd: brew install bartib
    reference: https://formulae.brew.sh/formula/bartib#default
  alpine/apk:
    cmd: sudo apk add bartib
    reference: https://github.com/nikolassv/bartib?tab=readme-ov-file#via-apk-alpine-linux
    dsnap: bartib
binlist:
- bartib

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 830 KB
          rating: 1
          desc:
            cn: 安装 830 KB
            en: 830 KB install
        download:
          estimate: 830 KB
          desc:
            cn: 约 830 KB 下载 (linux/x64)
            en: ~830 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
