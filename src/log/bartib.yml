lang: Rust/shell
homepage: https://github.com/nikolassv/bartib
license: GPL-3.0
desc:
  en: Bartib is an easy to use time tracking tool for the command line
  cn: Bartib 是一个易于使用的命令行时间跟踪工具
x:
  source: https://github.com/nikolassv/bartib
  eget: https://github.com/nikolassv/bartib
rule:
  /eget:
    cmd: x eget nikolassv/bartib
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install bartib
    reference: https://github.com/nikolassv/bartib?tab=readme-ov-file#with-cargo
    dsnap: bartib
  arch/yay:
    cmd: sudo yay -S bartib
    reference: https://github.com/nikolassv/bartib?tab=readme-ov-file#from-the-aur-arch-linux
  darwin/brew:
    cmd: brew install bartib
    reference: https://formulae.brew.sh/formula/bartib#default
  alpine/apk:
    cmd: sudo apk add bartib
    reference: https://github.com/nikolassv/bartib?tab=readme-ov-file#via-apk-alpine-linux
    dsnap: bartib
binlist:
- bartib

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
