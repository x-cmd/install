lang: C++
homepage: https://github.com/tstack/lnav
license: BSD-2-Clause
desc:
  cn: 日志文件导航器 lnav 是终端的高级日志文件查看器
  en: The Log File Navigator, lnav, is an advanced log file viewer for the terminal
  cs: Log File Navigator, lnav, je pokročilý prohlížeč souborů protokolů pro terminál
  de: Der Log File Navigator, lnav, ist ein fortgeschrittener Log-Dateibetrachter für das Terminal
  es: El Log File Navigator, lnav, es un visor avanzado de archivos de registro para el terminal
  fr: Le Log File Navigator, lnav, est un visualiseur avancé de fichiers journaux pour le terminal
  id: Log File Navigator, lnav, adalah penampil berkas log lanjutan untuk terminal
  it: Il Log File Navigator, lnav, è un visualizzatore avanzato di file di log per il terminale
  ja: ログファイルナビゲーター lnav は、ターミナル向けの高度なログファイルビューアです
  ko: Log File Navigator, lnav는 터미널을 위한 고급 로그 파일 뷰어입니다
  pl: Log File Navigator, lnav, to zaawansowany podgląd plików logów dla terminala
  pt: O Log File Navigator, lnav, é um visualizador avançado de arquivos de log para o terminal
  ro: Log File Navigator, lnav, este un vizualizator avansat de fișiere de jurnal pentru terminal
  ru: Log File Navigator, lnav — продвинутый просмотрщик файлов журналов для терминала
  th: Log File Navigator, lnav คือตัวดูภาพไฟล์บันทึกขั้นสูงสำหรับเทอร์มินัล
  tr: Log File Navigator, lnav, terminal için gelişmiş bir günlük dosyası görüntüleyicisidir
  uk: Log File Navigator, lnav — розширений переглядач файлів журналів для термінала
  vi: Log File Navigator, lnav là trình xem tệp nhật ký nâng cao cho terminal
x:
  source: https://github.com/tstack/lnav
  eget: tstack/lnav
  dnf: lnav
  brew: lnav
  snap: lnav
  yum: lnav
  yay: lnav-git
rule:
  /eget:
    cmd: x eget tstack/lnav
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S lnav-git
    reference: https://aur.archlinux.org/packages/lnav-git
  darwin/brew:
    cmd: brew install lnav
    reference: https://github.com/tstack/lnav?tab=readme-ov-file#brew-on-macos
  /snap:
    cmd: sudo snap install lnav
    reference: https://lnav.org/downloads
  /yum:
    cmd: 'curl -s https://packagecloud.io/install/repositories/tstack/lnav/script.rpm.sh | sudo bash && \

      sudo yum install lnav

      '
    reference: https://lnav.org/downloads
binlist:
- lnav

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 40 MB
          rating: 2
          desc:
            cn: 安装 40 MB
            en: 40 MB install
        download:
          estimate: 40 MB
          desc:
            cn: 约 40 MB 下载 (linux/x64)
            en: ~40 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
