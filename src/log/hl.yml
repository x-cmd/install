lang: 'Rust'
homepage: 'https://github.com/pamburus/hl'
license: 'MIT'
desc:
  cn: 快速强大的日志查看与处理工具,将 JSON 或 logfmt 日志转为清晰的可读格式
  en: 'A fast and powerful log viewer and processor that converts JSON logs or logfmt logs into a clear human-readable format.'
x:
  source: https://github.com/pamburus/hl
  eget: https://github.com/pamburus/hl
rule:
  /eget:
    cmd: x eget pamburus/hl
    reference: https://github.com/pamburus/hl
binlist:
- 'hl'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
