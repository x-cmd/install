lang: 'Rust'
homepage: 'https://github.com/pamburus/hl'
license: 'MIT'
desc:
  cn: 快速强大的日志查看与处理工具,将 JSON 或 logfmt 日志转为清晰的可读格式
  en: 'A fast and powerful log viewer and processor that converts JSON logs or logfmt logs into a clear human-readable format.'
x:
  source: https://github.com/pamburus/hl
  eget: https://github.com/pamburus/hl
rule:
  /eget:
    cmd: x eget pamburus/hl
    reference: https://github.com/pamburus/hl
binlist:
  - 'hl'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
