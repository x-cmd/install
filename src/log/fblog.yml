lang: Rust
homepage: https://github.com/brocode/fblog
license: WTFPL
desc:
  en: A small tool to view json log files
  cn: 查看 json 日志文件的小工具
  cs: Malý nástroj pro prohlížení souborů protokolů json
  de: Ein kleines Tool zum Ansehen von json-Protokolldateien
  es: Una pequeña herramienta para ver archivos de registro json
  fr: Un petit outil pour consulter les fichiers de journaux json
  id: Alat kecil untuk melihat berkas log json
  it: Un piccolo strumento per visualizzare i file di log json
  ja: json ログファイルを表示するための小さなツールです
  ko: json 로그 파일을 확인하는 작은 도구입니다
  pl: Małe narzędzie do przeglądania plików logów json
  pt: Uma pequena ferramenta para visualizar arquivos de log json
  ro: Un instrument mic pentru vizualizarea fișierelor de jurnal json
  ru: Небольшой инструмент для просмотра файлов журналов json
  th: เครื่องมือเล็ก ๆ สำหรับดูไฟล์บันทึก json
  tr: json günlük dosyalarını görüntülemek için küçük bir araç
  uk: Невеликий інструмент для перегляду файлів журналів json
  vi: Một công cụ nhỏ để xem các tệp nhật ký json
x:
  source: https://github.com/brocode/fblog
  eget: brocode/fblog
  brew: fblog
  yay: fblog
  cargo: fblog
rule:
  /eget:
    cmd: x eget brocode/fblog
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S fblog
    reference: https://aur.archlinux.org/packages/fblog
  /cargo:
    cmd: cargo install fblog
    reference: https://github.com/brocode/fblog?tab=readme-ov-file#installation
    dsnap: fblog
  darwin/brew:
    cmd: brew install fblog
    reference: https://formulae.brew.sh/formula/fblog#default
binlist:
- fblog

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 49 KB
          rating: 1
          desc:
            cn: 约 49 KB（估算）
            en: ~49 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
