lang: Rust
homepage: https://github.com/brocode/fblog
license: WTFPL
desc:
  en: A small tool to view json log files
  cn: 查看 json 日志文件的小工具
x:
  source: https://github.com/brocode/fblog
  eget: https://github.com/brocode/fblog
rule:
  /eget:
    cmd: x eget brocode/fblog
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S fblog
    reference: https://aur.archlinux.org/packages/fblog
  /cargo:
    cmd: cargo install fblog
    reference: https://github.com/brocode/fblog?tab=readme-ov-file#installation
    dsnap: fblog
  darwin/brew:
    cmd: brew install fblog
    reference: https://formulae.brew.sh/formula/fblog#default
binlist:
- fblog

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 49 KB
          rating: 1
          desc:
            cn: 约 49 KB（估算）
            en: ~49 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
