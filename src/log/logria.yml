lang: Rust
homepage: https://github.com/ReagentX/Logria
license: GPL-3.0
desc:
  cn: 一个强大的 CLI 工具，可以将日志聚合放在您的指尖。
  en: A powerful CLI tool that puts log aggregation at your fingertips.
x:
  source: https://github.com/ReagentX/Logria
  eget: https://github.com/ReagentX/Logria
rule:
  /eget:
    cmd: x eget ReagentX/Logria
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S logria
    reference: https://aur.archlinux.org/packages/logria
  /cargo:
    cmd: cargo install logria
    reference: https://github.com/ReagentX/Logria?tab=readme-ov-file#cargo-recommended
    dsnap: logria
binlist:
- logria

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (macos/x64)
            en: ~2 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: full
