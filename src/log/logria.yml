lang: Rust
homepage: https://github.com/ReagentX/Logria
license: GPL-3.0
desc:
  cn: 一个强大的 CLI 工具，可以将日志聚合放在您的指尖。
  en: A powerful CLI tool that puts log aggregation at your fingertips.
x:
  source: https://github.com/ReagentX/Logria
  eget: https://github.com/ReagentX/Logria
rule:
  /eget:
    cmd: x eget ReagentX/Logria
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S logria
    reference: https://aur.archlinux.org/packages/logria
  /cargo:
    cmd: cargo install logria
    reference: https://github.com/ReagentX/Logria?tab=readme-ov-file#cargo-recommended
    dsnap: logria
binlist:
- logria

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
