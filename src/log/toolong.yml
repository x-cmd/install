lang: Python
homepage: https://github.com/Textualize/toolong
license: MIT
desc:
  cn: 一个终端应用程序，用于查看、跟踪、合并和搜索日志文件（以及 JSONL）。
  en: A terminal application to view, tail, merge, and search log files (plus JSONL).
x:
  source: https://github.com/Textualize/toolong
  yay: toolong
  pip: toolong
rule:
  arch/yay:
    cmd: yay -S toolong
    reference: https://aur.archlinux.org/packages/toolong
  /pip:
    cmd: pip install toolong
    reference: https://github.com/Textualize/toolong?tab=readme-ov-file#how
    dsnap: toolong
  /pipx:
    cmd: pipx install toolong
    reference: https://github.com/Textualize/toolong?tab=readme-ov-file#how
binlist:
- toolong

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
