lang: Python
homepage: https://github.com/Textualize/toolong
license: MIT
desc:
  cn: 一个终端应用程序，用于查看、跟踪、合并和搜索日志文件（以及 JSONL）。
  en: A terminal application to view, tail, merge, and search log files (plus JSONL).
x:
  source: https://github.com/Textualize/toolong
rule:
  arch/yay:
    cmd: yay -S toolong
    reference: https://aur.archlinux.org/packages/toolong
  /pip:
    cmd: pip install toolong
    reference: https://github.com/Textualize/toolong?tab=readme-ov-file#how
    dsnap: toolong
  /pipx:
    cmd: pipx install toolong
    reference: https://github.com/Textualize/toolong?tab=readme-ov-file#how
binlist:
- toolong

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
