lang: 'Rust'
homepage: 'https://github.com/todoesverso/logss'
license: 'MIT'
desc:
  cn: 简单的日志分割 CLI
  en: 'A simple cli for logs splitting'
  cs: Jednoduchý nástroj CLI pro rozdělování protokolů
  de: Ein einfaches CLI zum Aufteilen von Logs
  es: Una simple CLI para dividir logs
  fr: Une simple CLI pour séparer les journaux
  id: CLI sederhana untuk pemisahan log
  it: Una semplice CLI per la divisione dei log
  ja: ログ分割用のシンプルな CLI
  ko: 로그 분할을 위한 간단한 CLI
  pl: Proste narzędzie CLI do dzielenia logów
  pt: Uma CLI simples para divisão de logs
  ro: Un CLI simplu pentru împărțirea jurnalelor
  ru: Простой CLI для разделения журналов
  th: CLI อย่างง่ายสำหรับการแยกบันทึก
  tr: Günlükleri bölmek için basit bir CLI
  uk: Простий CLI для розділення журналів
  vi: CLI đơn giản để tách nhật ký
x:
  source: https://github.com/todoesverso/logss
  eget: todoesverso/logss
rule:
  /eget:
    cmd: x eget todoesverso/logss
    reference: https://github.com/todoesverso/logss
binlist:
- 'logss'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
