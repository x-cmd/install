lang: 'Rust'
homepage: 'https://github.com/todoesverso/logss'
license: 'MIT'
desc:
  cn: 简单的日志分割 CLI
  en: 'A simple cli for logs splitting'
x:
  source: https://github.com/todoesverso/logss
  eget: https://github.com/todoesverso/logss
rule:
  /eget:
    cmd: x eget todoesverso/logss
    reference: https://github.com/todoesverso/logss
binlist:
  - 'logss'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
