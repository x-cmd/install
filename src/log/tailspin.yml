lang: Rust
homepage: https://github.com/bensadeh/tailspin
license: MIT
desc:
  cn: 日志文件荧光笔
  en: A log file highlighter
x:
  source: https://github.com/bensadeh/tailspin
  eget: https://github.com/bensadeh/tailspin
rule:
  /eget:
    cmd: x eget bensadeh/tailspin
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
  /cargo:
    cmd: cargo install tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
    dsnap: tailspin
  arch/pacman:
    cmd: pacman -S tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
  /nix-shell:
    cmd: nix-shell -p tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
  netbsd/pkgin:
    cmd: pkgin install tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
  freebsd/pkg:
    cmd: pkg install tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
binlist:
- tailspin

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
