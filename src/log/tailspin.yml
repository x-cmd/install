lang: Rust
homepage: https://github.com/bensadeh/tailspin
license: MIT
desc:
  cn: 日志文件荧光笔
  en: A log file highlighter
  cs: Zvýrazňovač souborů protokolů
  de: Ein Log-Dateihighlighter
  es: Un resaltador de archivos de registro
  fr: Un surligneur de fichiers journaux
  id: Penyorot berkas log
  it: Un evidenziatore di file di log
  ja: ログファイル用ハイライターです。
  ko: 로그 파일 하이라이터입니다.
  pl: Podświetlacz plików logów
  pt: Um realçador de arquivos de log
  ro: Un marker pentru fișierele de jurnal
  ru: Подсветка синтаксиса для файлов журналов
  th: เครื่องไฮไลต์ไฟล์บันทึก
  tr: Bir günlük dosyası vurgulayıcısı
  uk: Підсвічувач файлів журналів
  vi: Trình tô sáng tệp nhật ký
x:
  source: https://github.com/bensadeh/tailspin
  eget: bensadeh/tailspin
  brew: tailspin
  pacman: tailspin
  cargo: tailspin
rule:
  /eget:
    cmd: x eget bensadeh/tailspin
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
  /cargo:
    cmd: cargo install tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
    dsnap: tailspin
  arch/pacman:
    cmd: pacman -S tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
  /nix-shell:
    cmd: nix-shell -p tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
  netbsd/pkgin:
    cmd: pkgin install tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
  freebsd/pkg:
    cmd: pkg install tailspin
    reference: https://github.com/bensadeh/tailspin?tab=readme-ov-file#installing
binlist:
- tailspin

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
