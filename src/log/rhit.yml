lang: Rust
homepage: https://github.com/Canop/rhit
license: MIT
desc:
  cn: Nginx 日志探索器。
  en: A nginx log explorer.
x:
  source: https://github.com/Canop/rhit
  eget: https://github.com/Canop/rhit
  brew: bmon
  pacman: rhit
  port: rhit
  cargo: rhit
rule:
  /eget:
    cmd: x eget Canop/rhit
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install rhit
    reference: https://dystroy.org/rhit/install/
    dsnap: rhit
  arch/pacman:
    cmd: pacman -S rhit
    reference: https://dystroy.org/rhit/install/
  manjaro/pacman:
    cmd: pacman -S rhit
    reference: https://dystroy.org/rhit/install/
  darwin/brew:
    cmd: brew install bmon
    reference: https://github.com/tgraf/bmon#osx-installation
  darwin/port:
    cmd: sudo port install rhit
    reference: https://github.com/tgraf/bmon#osx-installation
binlist:
- rhit

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 129 KB
          rating: 1
          desc:
            cn: 约 129 KB（估算）
            en: ~129 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
