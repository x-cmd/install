lang: Rust
homepage: https://github.com/Canop/rhit
license: MIT
desc:
  cn: Nginx 日志探索器。
  en: A nginx log explorer.
x:
  source: https://github.com/Canop/rhit
  eget: https://github.com/Canop/rhit
rule:
  /eget:
    cmd: x eget Canop/rhit
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install rhit
    reference: https://dystroy.org/rhit/install/
    dsnap: rhit
  arch/pacman:
    cmd: pacman -S rhit
    reference: https://dystroy.org/rhit/install/
  manjaro/pacman:
    cmd: pacman -S rhit
    reference: https://dystroy.org/rhit/install/
  darwin/brew:
    cmd: brew install bmon
    reference: https://github.com/tgraf/bmon#osx-installation
  darwin/port:
    cmd: sudo port install rhit
    reference: https://github.com/tgraf/bmon#osx-installation
binlist:
- rhit

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
