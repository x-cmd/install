lang: Go
homepage: https://gitea.com/gitea/act_runner
desc:
  en: Gitea Actions runner
  cn: 运行 Gitea Actions
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use act_runner
    reference: https://x-cmd.com/install/
  /build:
    cmd: "git clone https://gitea.com/gitea/act_runner.git &&\n  cd act_runner &&\n  make build\n"
    reference: https://gitea.com/gitea/act_runner#installation
  arch/yay:
    cmd: yay -S act-runner-bin
    reference: https://aur.archlinux.org/packages/act-runner-bin
binlist:
- act_runner
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
