lang: Go
homepage: https://gitea.com/gitea/act_runner
desc:
  en: Gitea Actions runner
  cn: 运行 Gitea Actions
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use act_runner
    reference: https://x-cmd.com/install/
  /build:
    cmd: "git clone https://gitea.com/gitea/act_runner.git &&\n  cd act_runner &&\n  make build\n"
    reference: https://gitea.com/gitea/act_runner#installation
  arch/yay:
    cmd: yay -S act-runner-bin
    reference: https://aur.archlinux.org/packages/act-runner-bin
binlist:
- act_runner
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
