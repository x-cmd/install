lang: Go
homepage: https://atomgit.com/hust-open-atom-club/atomgit-cli
license: MulanPSL-2.0
desc:
  cn: AtomGit 命令行工具，用于管理仓库、议题、拉取请求和发布
  en: Command-line interface for AtomGit to manage repositories, issues, pull requests, and releases
  cs: Příkazový řádek pro AtomGit pro správu repozitářů, issues, pull requestů a releasů
  de: Kommandozeilen-Schnittstelle für AtomGit zur Verwaltung von Repositories, Issues, Pull Requests und Releases
  es: Interfaz de línea de comandos para AtomGit para gestionar repositorios, incidencias, pull requests y versiones
  fr: Interface de ligne de commande pour AtomGit pour gérer les dépôts, les tickets, les pull requests et les versions
  id: Antarmuka baris perintah untuk AtomGit untuk mengelola repositori, isu, pull request, dan rilis
  it: Interfaccia a riga di comando per AtomGit per gestire repository, issue, pull request e release
  ja: AtomGit のコマンドラインインターフェースで、リポジトリ・Issues・プルリクエスト・リリースを管理します
  ko: 저장소, 이슈, 풀 리퀘스트, 릴리스를 관리하기 위한 AtomGit용 명령줄 인터페이스
  pl: Interfejs wiersza poleceń dla AtomGit do zarządzania repozytoriami, zgłoszeniami, pull requestami i wydaniami
  pt: Interface de linha de comando para o AtomGit para gerenciar repositórios, issues, pull requests e releases
  ro: Interfață de linie de comandă pentru AtomGit pentru a gestiona depozite, probleme, pull request-uri și versiuni
  ru: Интерфейс командной строки для AtomGit для управления репозиториями, задачами, pull request'ами и релизами
  th: อินเทอร์เฟซบรรทัดคำสั่งสำหรับ AtomGit เพื่อจัดการที่เก็บข้อมูล ปัญหา pull request และรุ่น
  tr: Depoları, sorunları, pull request'leri ve sürümleri yönetmek için AtomGit komut satırı arayüzü
  uk: Інтерфейс командного рядка для AtomGit для керування репозиторіями, задачами, pull request'ами та релізами
  vi: Giao diện dòng lệnh cho AtomGit để quản lý kho lưu trữ, issue, pull request và bản phát hành
x:
  source: https://atomgit.com/hust-open-atom-club/atomgit-cli
  brew: atomgit-cli
  scoop: hust-open-atom-club/atomgit-cli
  winget: HUSTOpenAtomClub.AtomGitCLI
  nix: github:NixOS/nixpkgs/nixos-unstable#atomgit-cli
  yay: atomgit-cli-bin
  npm: "@hust-open-atom-club/atomgit-cli"
  go: atomgit.com/hust-open-atom-club/atomgit-cli/cmd/ag@latest
rule:
  /npm:
    cmd: npm install -g @hust-open-atom-club/atomgit-cli
    reference: https://atomgit.com/hust-open-atom-club/atomgit-cli/blob/main/docs/installation.md
    dsnap: '@hust-open-atom-club/atomgit-cli'
  (darwin|linux)/brew:
    cmd: brew install atomgit-cli
    reference: https://formulae.brew.sh/formula/atomgit-cli
  (win|wsl2)/winget:
    cmd: x winget install --id HUSTOpenAtomClub.AtomGitCLI
    reference: https://atomgit.com/hust-open-atom-club/atomgit-cli/blob/main/docs/installation.md
  (win|wsl2)/scoop:
    cmd: |
      x scoop bucket add hust-open-atom-club https://github.com/hust-open-atom-club/ScoopBucket
      x scoop install hust-open-atom-club/atomgit-cli
    reference: https://github.com/hust-open-atom-club/ScoopBucket/blob/master/bucket/atomgit-cli.json
  /nix:
    cmd: nix profile install github:NixOS/nixpkgs/nixos-unstable#atomgit-cli
    reference: https://atomgit.com/hust-open-atom-club/atomgit-cli/blob/main/docs/installation.md
  arch/yay:
    cmd: yay -S atomgit-cli-bin
    reference: https://aur.archlinux.org/packages/atomgit-cli-bin
  /go:
    cmd: go install atomgit.com/hust-open-atom-club/atomgit-cli/cmd/ag@latest
    reference: https://atomgit.com/hust-open-atom-club/atomgit-cli/blob/main/docs/installation.md
    dsnap: atomgit.com/hust-open-atom-club/atomgit-cli/cmd/ag
binlist:
  - ag
