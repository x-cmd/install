lang: Go
homepage: https://gitea.com/gitea/tea
desc:
  cn: 与 Gitea 服务器交互，Gitea 官方 CLI
  en: Interact with Gitea servers, Official CLI for Gitea
  cs: Interakce se servery Gitea, oficiální CLI pro Gitea
  de: Interaktion mit Gitea-Servern, offizielle CLI für Gitea
  es: Interactúa con servidores Gitea, CLI oficial para Gitea
  fr: Interagissez avec les serveurs Gitea, CLI officielle pour Gitea
  id: Berinteraksi dengan server Gitea, CLI resmi untuk Gitea
  it: Interagisci con i server Gitea, CLI ufficiale per Gitea
  ja: Gitea サーバーと対話するための公式 CLI
  ko: Gitea 서버와 상호작용하기 위한 Gitea 공식 CLI
  pl: Interakcja z serwerami Gitea, oficjalne CLI dla Gitea
  pt: Interaja com servidores Gitea, a CLI oficial do Gitea
  ro: Interacționează cu serverele Gitea, CLI oficial pentru Gitea
  ru: Взаимодействие с серверами Gitea, официальный CLI для Gitea
  th: โต้ตอบกับเซิร์ฟเวอร์ Gitea, CLI อย่างเป็นทางการของ Gitea
  tr: Gitea sunucularıyla etkileşim kurun, Gitea için resmi CLI
  uk: Взаємодія з серверами Gitea, офіційний CLI для Gitea
  vi: Tương tác với máy chủ Gitea, CLI chính thức của Gitea
x:
  apt: tea
  brew: tea
  apt-get: tea
  scoop: tea
  asdf: tea
rule:
  /x:
    cmd: x pkg use tea
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use tea
    reference: https://github.com/mvaldes14/asdf-tea
  darwin/brew:
    cmd: brew install tea
    reference: https://formulae.brew.sh/formula/tea#default
  debian/apt:
    cmd: sudo apt-get install tea
    reference: https://command-not-found.com/tea
    dsnap: tea
  ubuntu/apt:
    cmd: sudo apt-get install tea
    reference: https://command-not-found.com/tea
    dsnap: tea
  kali/apt:
    cmd: sudo apt-get install tea
    reference: https://command-not-found.com/tea
    dsnap: tea
  (win|wsl2)/scoop:
    cmd: x scoop install tea
    reference: https://scoop.sh/#/apps?q=tea
  /build:
    cmd: 'git clone https://gitea.com/gitea/tea.git # or: tea clone gitea.com/gitea/tea ;)

      cd tea

      make

      '
    reference: https://gitea.com/gitea/tea#compilation
binlist:
- tea
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
