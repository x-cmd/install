lang: Go
homepage: https://gitea.com/gitea/tea
desc:
  cn: 与 Gitea 服务器交互，Gitea 官方 CLI
  en: Interact with Gitea servers, Official CLI for Gitea
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use tea
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use tea
    reference: https://github.com/mvaldes14/asdf-tea
  darwin/brew:
    cmd: brew install tea
    reference: https://formulae.brew.sh/formula/tea#default
  debian/apt:
    cmd: sudo apt-get install tea
    reference: https://command-not-found.com/tea
    dsnap: tea
  ubuntu/apt:
    cmd: sudo apt-get install tea
    reference: https://command-not-found.com/tea
    dsnap: tea
  kali/apt:
    cmd: sudo apt-get install tea
    reference: https://command-not-found.com/tea
    dsnap: tea
  (win|wsl2)/scoop:
    cmd: x scoop install tea
    reference: https://scoop.sh/#/apps?q=tea
  /build:
    cmd: 'git clone https://gitea.com/gitea/tea.git # or: tea clone gitea.com/gitea/tea ;)

      cd tea

      make

      '
    reference: https://gitea.com/gitea/tea#compilation
binlist:
- tea
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
