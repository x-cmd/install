lang: Go
homepage: https://gitlab.com/gitlab-org/cli
desc:
  cn: GitLab CLI 工具将 GitLab 带到您的命令行
  en: A GitLab CLI tool bringing GitLab to your command line
  cs: Nástroj GitLab CLI, který přináší GitLab do vaší příkazové řádky
  de: Ein GitLab-CLI-Tool, das GitLab in Ihre Kommandozeile bringt
  es: Una herramienta CLI de GitLab que lleva GitLab a tu línea de comandos
  fr: Un outil CLI GitLab qui apporte GitLab à votre ligne de commande
  id: Alat CLI GitLab yang menghadirkan GitLab ke baris perintah Anda
  it: Uno strumento CLI per GitLab che porta GitLab nella tua riga di comando
  ja: GitLab をコマンドラインにもたらす GitLab CLI ツール
  ko: GitLab을 명령줄로 가져오는 GitLab CLI 도구
  pl: Narzędzie CLI GitLab, które przenosi GitLab do wiersza poleceń
  pt: Uma ferramenta CLI do GitLab que leva o GitLab à sua linha de comando
  ro: Un instrument CLI GitLab care aduce GitLab în linia ta de comandă
  ru: Инструмент командной строки GitLab, который переносит GitLab в вашу командную строку
  th: เครื่องมือ GitLab CLI ที่นำ GitLab มาไว้ที่บรรทัดคำสั่งของคุณ
  tr: GitLab'ı komut satırınıza taşıyan bir GitLab CLI aracı
  uk: Інструмент командного рядка GitLab, який переносить GitLab у ваш командний рядок
  vi: Công cụ GitLab CLI mang GitLab đến với dòng lệnh của bạn
x:
  dnf: glab
  brew: glab
  pacman: glab
  port: glab
  scoop: glab
  choco: glab
  winget: glab.glab
  asdf: glab
rule:
  /x:
    cmd: x pkg use glab
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use glab
    reference: https://github.com/particledecay/asdf-glab
  darwin/brew:
    cmd: brew install glab
    reference: https://gitlab.com/gitlab-org/cli#homebrew
  darwin/port:
    cmd: sudo port install glab
    reference: https://ports.macports.org/port/glab/details/
  /curl:
    cmd: curl -s "https://gitlab.com/gitlab-org/cli/-/raw/main/scripts/install.sh" | sudo sh
    reference: https://gitlab.com/gitlab-org/cli/-/blob/main/docs/installation_options.md
  (win|wsl2)/scoop:
    cmd: x scoop install glab
    reference: https://scoop.sh/#/apps?q=glab
  (win|wsl2)/winget:
    cmd: x choco install glab
    reference: https://gitlab.com/gitlab-org/cli/-/blob/main/docs/installation_options.md#windows
  (win|wsl2)/choco:
    cmd: x winget install glab.glab
    reference: https://gitlab.com/gitlab-org/cli/-/blob/main/docs/installation_options.md#windows
  arch/pacman:
    cmd: sudo pacman -S glab
    reference: https://gitlab.com/gitlab-org/cli/-/blob/main/docs/installation_options.md#arch-linux
  alpine/apk:
    cmd: sudo apk add --no-cache glab
    reference: https://gitlab.com/gitlab-org/cli/-/blob/main/docs/installation_options.md#alpine-linux
    dsnap: glab
  fedora/dnf:
    cmd: sudo dnf install glab
    reference: https://gitlab.com/gitlab-org/cli/-/blob/main/docs/installation_options.md#fedora
    dsnap: glab
  nix/:
    cmd: nix-env -iA nixos.glab
    reference: https://gitlab.com/gitlab-org/cli/-/blob/main/docs/installation_options.md#nixnixos
binlist:
- glab
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
