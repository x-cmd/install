lang: Go
homepage: https://github.com/goreleaser/goreleaser
license: MIT
desc:
  cn: goreleaser 是 Go 项目的发布自动化工具
  en: goreleaser is a release automation tool for Go projects
x:
  pkg:
    exist: true
  source: https://github.com/goreleaser/goreleaser
  eget: https://github.com/goreleaser/goreleaser
  apt: goreleaser
  brew: goreleaser
  snap: --classic
rule:
  /x:
    cmd: x pkg use goreleaser
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget goreleaser/goreleaser
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use goreleaser
    reference: https://github.com/kforsthoevel/asdf-goreleaser
  /bash:
    cmd: 'curl -sfL https://goreleaser.com/static/run | bash

      '
    reference: https://goreleaser.com/install/#go-install
  (win|wsl2)/scoop:
    cmd: x scoop install goreleaser
    reference: https://scoop.sh/#/apps?q=goreleaser
  /snap:
    cmd: sudo snap install --classic goreleaser
    reference: https://goreleaser.com/install/#snapcraft
  /apt:
    cmd: 'echo ''deb [trusted=yes] https://repo.goreleaser.com/apt/ /'' | sudo tee /etc/apt/sources.list.d/goreleaser.list

      sudo apt update

      sudo apt install goreleaser

      '
    reference: https://goreleaser.com/install/#apt
  /nix:
    cmd: nix-env -iA goreleaser
    reference: https://goreleaser.com/install/#nix
  /go:
    cmd: go install github.com/goreleaser/goreleaser@latest
    reference: https://goreleaser.com/install/#go-install
    dsnap: github.com/goreleaser/goreleaser@latest
  darwin/brew:
    cmd: brew install goreleaser
    reference: https://formulae.brew.sh/formula/goreleaser#default
  arch/yay:
    cmd: yay -S goreleaser-bin
    reference: https://aur.archlinux.org/packages/goreleaser-bin
binlist:
- goreleaser

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 MB
          rating: 2
          desc:
            cn: 安装 25 MB
            en: 25 MB install
        download:
          estimate: 25 MB
          desc:
            cn: 约 25 MB 下载 (linux/x64)
            en: ~25 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
