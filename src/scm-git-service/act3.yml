lang: Go
homepage: https://github.com/dhth/act3
license: MIT
desc:
  cn: 用于查看 Github Actions 最近 3 次运行结果的命令行工具
  en: A command line tool to view the results of your last three Github Actions runs.
x:
  source: https://github.com/dhth/act3
  eget: https://github.com/dhth/act3
rule:
  /eget:
    cmd: x eget dhth/act3
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install dhth/tap/act3
    reference: https://github.com/dhth/act3?tab=readme-ov-file#-installation
  /go:
    cmd: go install github.com/dhth/act3@latest
    reference: https://github.com/dhth/act3?tab=readme-ov-file#-installation
    dsnap: act3
binlist:
- act3

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
