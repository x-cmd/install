lang: Go
homepage: https://github.com/dhth/act3
license: MIT
desc:
  cn: 用于查看 Github Actions 最近 3 次运行结果的命令行工具
  en: A command line tool to view the results of your last three Github Actions runs.
  cs: Nástroj příkazové řádky pro zobrazení výsledků posledních tří běhů Github Actions.
  de: Ein Befehlszeilenwerkzeug zum Anzeigen der Ergebnisse Ihrer letzten drei Github Actions-Läufe.
  es: Una herramienta de línea de comandos para ver los resultados de sus últimas tres ejecuciones de Github Actions.
  fr: Un outil en ligne de commande pour afficher les résultats de vos trois dernières exécutions Github Actions.
  id: Alat baris perintah untuk melihat hasil tiga eksekusi Github Actions terakhir Anda.
  it: Uno strumento a riga di comando per visualizzare i risultati delle ultime tre esecuzioni di Github Actions.
  ja: 直近 3 回の Github Actions の実行結果を表示するコマンドラインツール。
  ko: 최근 세 번의 Github Actions 실행 결과를 확인하는 명령줄 도구입니다.
  pl: Narzędzie wiersza poleceń do wyświetlania wyników ostatnich trzech uruchomień Github Actions.
  pt: Uma ferramenta de linha de comando para ver os resultados das suas últimas três execuções do Github Actions.
  ro: Un instrument de linie de comandă pentru a vedea rezultatele ultimelor trei rulări Github Actions.
  ru: Инструмент командной строки для просмотра результатов последних трех запусков Github Actions.
  th: เครื่องมือบรรทัดคำสั่งเพื่อดูผลลัพธ์ของการรัน Github Actions สามครั้งล่าสุดของคุณ.
  tr: Son üç Github Actions çalıştırmanızın sonuçlarını görüntülemek için bir komut satırı aracı.
  uk: Інструмент командного рядка для перегляду результатів трьох останніх запусків Github Actions.
  vi: Công cụ dòng lệnh để xem kết quả ba lần chạy Github Actions gần nhất của bạn.
x:
  source: https://github.com/dhth/act3
  eget: dhth/act3
  brew: dhth/tap/act3
  go: github.com/dhth/act3@latest
rule:
  /eget:
    cmd: x eget dhth/act3
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install dhth/tap/act3
    reference: https://github.com/dhth/act3?tab=readme-ov-file#-installation
  /go:
    cmd: go install github.com/dhth/act3@latest
    reference: https://github.com/dhth/act3?tab=readme-ov-file#-installation
    dsnap: act3
binlist:
- act3

