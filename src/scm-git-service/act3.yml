lang: Go
homepage: https://github.com/dhth/act3
license: MIT
desc:
  cn: 用于查看 Github Actions 最近 3 次运行结果的命令行工具
  en: A command line tool to view the results of your last three Github Actions runs.
x:
  source: https://github.com/dhth/act3
  eget: https://github.com/dhth/act3
rule:
  /eget:
    cmd: x eget dhth/act3
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install dhth/tap/act3
    reference: https://github.com/dhth/act3?tab=readme-ov-file#-installation
  /go:
    cmd: go install github.com/dhth/act3@latest
    reference: https://github.com/dhth/act3?tab=readme-ov-file#-installation
    dsnap: act3
binlist:
- act3

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
