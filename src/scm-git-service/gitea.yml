lang: Go
homepage: https://about.gitea.com/
desc:
  cn: 无痛自托管一体化软件开发服务，包括 Git 托管、代码审查、团队协作、包注册和 CI/CD
  en: Painless self-hosted all-in-one software development service, including Git hosting, code review, team collaboration, package registry and CI/CD
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use gitea
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install gitea
    reference: https://formulae.brew.sh/formula/gitea#default
  alpine/apk:
    cmd: sudo apk add gitea
    reference: https://command-not-found.com/gitea
    dsnap: gitea
  arch/pacman:
    cmd: sudo pacman -S gitea
    reference: https://command-not-found.com/gitea
binlist:
- gitea
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
