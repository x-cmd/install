lang: Go
homepage: https://about.gitea.com/
desc:
  cn: 无痛自托管一体化软件开发服务，包括 Git 托管、代码审查、团队协作、包注册和 CI/CD
  en: Painless self-hosted all-in-one software development service, including Git hosting, code review, team collaboration, package registry and CI/CD
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use gitea
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install gitea
    reference: https://formulae.brew.sh/formula/gitea#default
  alpine/apk:
    cmd: sudo apk add gitea
    reference: https://command-not-found.com/gitea
    dsnap: gitea
  arch/pacman:
    cmd: sudo pacman -S gitea
    reference: https://command-not-found.com/gitea
binlist:
- gitea
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
