lang: 'Go'
homepage: https://github.com/gitsocial-org/gitsocial
license: 'MIT'
desc:
  cn: 跨代码托管平台的协作平台
  en: 'Cross-forge collaboration platform'
  cs: Platforma pro spolupráci napříč kódex hostingovými službami
  de: Plattform für Zusammenarbeit über Forge-Plattformen hinweg
  es: Plataforma de colaboración entre forjas de código
  fr: Plateforme de collaboration entre forges de code
  id: Platform kolaborasi lintas forge
  it: Piattaforma di collaborazione tra forge di codice
  ja: コード forge 横断的なコラボレーションプラットフォーム
  ko: 코드 포지 간 협업 플랫폼
  pl: Platforma współpracy między platformami forge
  pt: Plataforma de colaboração entre forjas de código
  ro: Platformă de colaborare între forjele de cod
  ru: Платформа совместной работы между разными forge-сервисами
  th: แพลตฟอร์มการทำงานร่วมกันข้ามแพลตฟอร์มฝังโค้ด
  tr: Kod forge'leri arasında işbirliği platformu
  uk: Платформа спільної роботи між різними forge-сервісами
  vi: Nền tảng cộng tác xuyên nhiều nền tảng forge mã
x:
  source: https://github.com/gitsocial-org/gitsocial
  eget: gitsocial-org/gitsocial
rule:
  /eget:
    cmd: x eget gitsocial-org/gitsocial
    reference: https://github.com/gitsocial-org/gitsocial
binlist:
- 'gitsocial'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 约 16 MB（估算）
            en: ~16 MB estimated
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
