lang: 'Go'
homepage: https://github.com/gitsocial-org/gitsocial
license: 'MIT'
desc:
  cn: 跨代码托管平台的协作平台
  en: 'Cross-forge collaboration platform'
x:
  source: https://github.com/gitsocial-org/gitsocial
  eget: https://github.com/gitsocial-org/gitsocial
rule:
  /eget:
    cmd: x eget gitsocial-org/gitsocial
    reference: https://github.com/gitsocial-org/gitsocial
binlist:
- 'gitsocial'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 约 16 MB（估算）
            en: ~16 MB estimated
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
