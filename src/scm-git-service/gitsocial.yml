lang: 'Go'
homepage: https://github.com/gitsocial-org/gitsocial
license: 'MIT'
desc:
  cn: 跨代码托管平台的协作平台
  en: 'Cross-forge collaboration platform'
x:
  source: https://github.com/gitsocial-org/gitsocial
  eget: https://github.com/gitsocial-org/gitsocial
rule:
  /eget:
    cmd: x eget gitsocial-org/gitsocial
    reference: https://github.com/gitsocial-org/gitsocial
binlist:
  - 'gitsocial'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
