lang: 'Rust'
homepage: 'https://github.com/mahlquistj/octotype'
license: 'MIT'
desc:
  cn: 受 monkeytype 启发、注重自定义的 TUI 打字训练器（开发中）
  en: 'A WIP TUI typing trainer inspired by monkeytype with a focus on customization'
x:
  source: https://github.com/mahlquistj/octotype
  eget: https://github.com/mahlquistj/octotype
rule:
  /cargo:
    cmd: 'cargo install octotype'
    reference: https://github.com/mahlquistj/octotype
  /eget:
    cmd: x eget mahlquistj/octotype
    reference: https://github.com/mahlquistj/octotype
binlist:
  - 'octotype'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 129 KB
          rating: 1
          desc:
            cn: 约 129 KB（估算）
            en: ~129 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
