lang: 'Rust'
homepage: 'https://github.com/mahlquistj/octotype'
license: 'MIT'
desc:
  cn: 受 monkeytype 启发、注重自定义的 TUI 打字训练器（开发中）
  en: 'A WIP TUI typing trainer inspired by monkeytype with a focus on customization'
x:
  source: https://github.com/mahlquistj/octotype
  eget: https://github.com/mahlquistj/octotype
rule:
  /cargo:
    cmd: 'cargo install octotype'
    reference: https://github.com/mahlquistj/octotype
  /eget:
    cmd: x eget mahlquistj/octotype
    reference: https://github.com/mahlquistj/octotype
binlist:
  - 'octotype'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
