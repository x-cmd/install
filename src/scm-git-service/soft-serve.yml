lang: Go
homepage: https://github.com/charmbracelet/soft-serve
license: MIT
desc:
  cn: soft-serve 是一个用于命令行的自托管 Git 服务器
  en: soft-serve is a self-hostable Git server for the command-line
x:
  pkg:
    exist: true
  source: https://github.com/charmbracelet/soft-serve
  eget: https://github.com/charmbracelet/soft-serve
rule:
  /x:
    cmd: x pkg use soft-serve
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget charmbracelet/soft-serve
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use soft-serve
    reference: https://github.com/chessmango/asdf-soft-serve
  darwin/brew:
    cmd: brew tap charmbracelet/tap && brew install charmbracelet/tap/soft-serve
    reference: https://github.com/charmbracelet/soft-serve#installation
  darwin/port:
    cmd: sudo port selfupdate && sudo port install lazygit
    reference: https://github.com/jesseduffield/lazygit#macports
  debian/curl:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
  ubuntu/curl:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
  arch/pacman:
    cmd: sudo pacman -S soft-serve
    reference: https://github.com/jesseduffield/lazygit#arch-linux
  kali/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
    dsnap: soft-serve
  fedora/dnf:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' | sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
    dsnap: soft-serve
  rhel/dnf:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' | sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
  raspbian/curl:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
  nix/nixpkgs:
    cmd: nix-env -iA nixpkgs.soft-serve
    reference: https://github.com/charmbracelet/soft-serve#installation
binlist:
- soft-serve
