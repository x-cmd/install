lang: Go
homepage: https://github.com/charmbracelet/soft-serve
license: MIT
desc:
  cn: soft-serve 是一个用于命令行的自托管 Git 服务器
  en: soft-serve is a self-hostable Git server for the command-line
  cs: soft-serve je self-hostovatelný Git server pro příkazovou řádku
  de: soft-serve ist ein selbst hostbarer Git-Server für die Kommandozeile
  es: soft-serve es un servidor Git autoalojable para la línea de comandos
  fr: soft-serve est un serveur Git auto-hébergeable pour la ligne de commande
  id: soft-serve adalah server Git yang dapat di-hosting sendiri untuk baris perintah
  it: soft-serve è un server Git self-hostable per la riga di comando
  ja: soft-serve はコマンドライン向けのセルフホスト可能な Git サーバーです
  ko: soft-serve는 명령줄을 위한 자체 호스팅 가능한 Git 서버입니다
  pl: soft-serve to samodzielnie hostowany serwer Git dla wiersza poleceń
  pt: soft-serve é um servidor Git auto-hospedável para a linha de comando
  ro: soft-serve este un server Git auto-găzduit pentru linia de comandă
  ru: soft-serve — самостоятельно размещаемый Git-сервер для командной строки
  th: soft-serve คือเซิร์ฟเวอร์ Git ที่พร้อมให้โฮสต์เองสำหรับบรรทัดคำสั่ง
  tr: soft-serve, komut satırı için kendi sunucunuzda barındırılabilen bir Git sunucusudur
  uk: soft-serve — Git-сервер для командного рядка, який можна розмістити власними силами
  vi: soft-serve là máy chủ Git tự lưu trữ cho dòng lệnh
x:
  source: https://github.com/charmbracelet/soft-serve
  eget: charmbracelet/soft-serve
  apt: soft-serve
  dnf: soft-serve
  brew: charmbracelet/tap/soft-serve
  pacman: soft-serve
  yum: soft-serve
  port: lazygit
  asdf: soft-serve
rule:
  /x:
    cmd: x pkg use soft-serve
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget charmbracelet/soft-serve
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use soft-serve
    reference: https://github.com/chessmango/asdf-soft-serve
  darwin/brew:
    cmd: brew tap charmbracelet/tap && brew install charmbracelet/tap/soft-serve
    reference: https://github.com/charmbracelet/soft-serve#installation
  darwin/port:
    cmd: sudo port selfupdate && sudo port install lazygit
    reference: https://github.com/jesseduffield/lazygit#macports
  debian/curl:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
  ubuntu/curl:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
  arch/pacman:
    cmd: sudo pacman -S soft-serve
    reference: https://github.com/jesseduffield/lazygit#arch-linux
  kali/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
    dsnap: soft-serve
  fedora/dnf:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' | sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
    dsnap: soft-serve
  rhel/dnf:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' | sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
  raspbian/curl:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install soft-serve

      '
    reference: https://github.com/charmbracelet/soft-serve#installation
  nix/nixpkgs:
    cmd: nix-env -iA nixpkgs.soft-serve
    reference: https://github.com/charmbracelet/soft-serve#installation
binlist:
- soft-serve

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
