lang: 'C'
homepage: https://github.com/herrhotzenplotz/gcli
license: 'BSD-2-Clause'
desc:
  cn: 可移植的 Git(hub|lab|tea)/Forgejo/Bugzilla CLI 工具
  en: 'Portable Git(hub|lab|tea)/Forgejo/Bugzilla CLI tool, Submit patches here: https://lists.sr.ht/~herrhotzenplotz/gcli-devel'
x:
  source: https://github.com/herrhotzenplotz/gcli
  eget: https://github.com/herrhotzenplotz/gcli
rule:
  /eget:
    cmd: x eget herrhotzenplotz/gcli
    reference: https://github.com/herrhotzenplotz/gcli
binlist:
  - 'gcli'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
