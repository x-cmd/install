lang: 'C'
homepage: https://github.com/herrhotzenplotz/gcli
license: 'BSD-2-Clause'
desc:
  cn: 可移植的 Git(hub|lab|tea)/Forgejo/Bugzilla CLI 工具
  en: 'Portable Git(hub|lab|tea)/Forgejo/Bugzilla CLI tool, Submit patches here: https://lists.sr.ht/~herrhotzenplotz/gcli-devel'
x:
  source: https://github.com/herrhotzenplotz/gcli
  eget: herrhotzenplotz/gcli
rule:
  /eget:
    cmd: x eget herrhotzenplotz/gcli
    reference: https://github.com/herrhotzenplotz/gcli
binlist:
  - 'gcli'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
