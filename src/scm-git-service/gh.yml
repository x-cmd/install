lang: Go
homepage: https://github.com/cli/cli
desc:
  cn: GitHub 官方的命令行工具，用于在命令行界面中与 GitHub 进行交互
  en: GitHub's official command line tool is used to interact with GitHub in the Command-line interface
  cs: Oficiální nástroj příkazové řádky GitHubu, který se používá k interakci s GitHubem v příkazovém řádku
  de: Das offizielle Befehlszeilenwerkzeug von GitHub wird verwendet, um über die Kommandozeile mit GitHub zu interagieren
  es: La herramienta oficial de línea de comandos de GitHub se usa para interactuar con GitHub en la interfaz de línea de comandos
  fr: L'outil de ligne de commande officiel de GitHub est utilisé pour interagir avec GitHub dans l'interface de ligne de commande
  id: Alat baris perintah resmi GitHub digunakan untuk berinteraksi dengan GitHub melalui antarmuka baris perintah
  it: Lo strumento ufficiale a riga di comando di GitHub viene usato per interagire con GitHub dall'interfaccia a riga di comando
  ja: GitHub の公式コマンドラインツールで、コマンドラインから GitHub と対話します
  ko: GitHub의 공식 명령줄 도구로, 명령줄 인터페이스에서 GitHub과 상호작용합니다
  pl: Oficjalne narzędzie wiersza poleceń GitHub służy do interakcji z GitHub w interfejsie wiersza poleceń
  pt: A ferramenta oficial de linha de comando do GitHub é usada para interagir com o GitHub na interface de linha de comando
  ro: Instrumentul oficial de linie de comandă al GitHub este folosit pentru a interacționa cu GitHub în interfața de linie de comandă
  ru: Официальный инструмент командной строки GitHub используется для взаимодействия с GitHub из командной строки
  th: เครื่องมือบรรทัดคำสั่งอย่างเป็นทางการของ GitHub ใช้เพื่อโต้ตอบกับ GitHub ผ่านอินเทอร์เฟซบรรทัดคำสั่ง
  tr: GitHub'ın resmi komut satırı aracı, komut satırı arayüzünde GitHub ile etkileşim kurmak için kullanılır
  uk: Офіційний інструмент командного рядка GitHub використовується для взаємодії з GitHub у командному рядку
  vi: Công cụ dòng lệnh chính thức của GitHub được dùng để tương tác với GitHub trong giao diện dòng lệnh
license: MIT
x:
  source: https://github.com/cli/cli
  eget: cli/cli
  apt: wget
  dnf: gh
  brew: gh
  pacman: github-cli
  apk: github-cli
  apt-get: wget
  zypper: gh
  port: gh
  xbps: github-cli
  scoop: gh
  choco: gh
  winget: GitHub.cli
rule:
  /eget:
    cmd: x eget use cli/cli
    reference: https://github.com/cli/cli/releases
  /x:
    cmd: x pkg use gh
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install gh
    reference: https://formulae.brew.sh/formula/gh#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install gh
    reference: https://github.com/cli/cli#macports
  (debian|ubuntu|raspberry)/apt:
    cmd: "(type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y)) \\\n  && sudo mkdir -p -m 755 /etc/apt/keyrings \\\n  && wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \\\n  && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \\\n  && echo \"deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \\\n  && sudo apt update \\\n  && sudo apt install gh -y\n"
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#debian-ubuntu-linux-raspberry-pi-os-apt
  (fedora|centos|rhel)/dnf:
    cmd: sudo dnf install gh
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#fedora-centos-red-hat-enterprise-linux-dnf
  alpine/apk:
    cmd: sudo apk add github-cli
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#alpine-linux
  arch/pacman:
    cmd: sudo pacman -S github-cli
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#arch-linux
  opensuse/zypper:
    cmd: 'sudo zypper addrepo https://cli.github.com/packages/rpm/gh-cli.repo \

      && sudo zypper ref \

      && sudo zypper install gh

      '
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#opensusesuse-linux-zypper
  (win|wsl2)/winget:
    cmd: x winget install --id GitHub.cli
    reference: https://github.com/cli/cli#winget
  (win|wsl2)/scoop:
    cmd: x scoop install gh
    reference: https://github.com/cli/cli#scoop
  (win|wsl2)/choco:
    cmd: x choco install gh
    reference: https://github.com/cli/cli#chocolatey
  freebsd/pkg:
    cmd: pkg install gh
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#freebsd
  openbsd/pkg_add:
    cmd: pkg_add github-cli
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#openbsd
  netbsd/pkgsrc:
    cmd: pkgin install gh
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#netbsdpkgsrc
  (funtoo|gentoo)/emerge:
    cmd: sudo emerge -av github-cli
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#funtoo
  kiss/kiss:
    cmd: 'kiss b github-cli \

      && kiss i github-cli

      '
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#kiss-linux
  nix/nixpkgs:
    cmd: nix-env -iA nixos.gh
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#nixnixos
  void/xbps:
    cmd: sudo xbps-install github-cli
    reference: https://github.com/cli/cli/blob/trunk/docs/install_linux.md#void-linux
binlist:
  - gh


# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
