lang: C
homepage: https://gitlab.freedesktop.org/slirp/libslirp
desc:
  en: libslirp is a user-mode networking library used by virtual machines, containers or various tools
  cn: Libslirp 是一个用户模式的网络库，由虚拟机、容器或各种工具使用
rule:
  darwin/brew:
    cmd: brew install libslirp
    reference: https://formulae.brew.sh/formula/libslirp#default
binlist:
- libslirp
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
