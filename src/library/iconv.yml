lang: Shell
homepage: https://github.com/processone/iconv
desc:
  cn: Erlang / Elixir 的快速编码转换库
  en: Fast encoding conversion library for Erlang / Elixir
x:
  source: https://github.com/processone/iconv
rule:
  darwin/brew:
    cmd: brew install plan9port
    reference: https://command-not-found.com/iconv
  debian/apt:
    cmd: sudo apt-get install libc-bin
    reference: https://command-not-found.com/iconv
    dsnap: libc-bin
  ubuntu/apt:
    cmd: sudo apt-get install libc-bin
    reference: https://command-not-found.com/iconv
    dsnap: libc-bin
  arch/pacman:
    cmd: sudo pacman -S plan9port
    reference: https://command-not-found.com/iconv
  kali/apt:
    cmd: sudo apt-get install libc-bin
    reference: https://command-not-found.com/iconv
    dsnap: libc-bin
  centos/yum:
    cmd: sudo yum install glibc-common
    reference: https://command-not-found.com/iconv
  fedora/yum:
    cmd: sudo dnf install glibc-common
    reference: https://command-not-found.com/iconv
  raspbian/apt:
    cmd: sudo apt-get install libc-bin
    reference: https://command-not-found.com/iconv
binlist:
- iconv
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
