lang: C++
homepage: https://gitlab.com/libeigen/eigen
desc:
  en: 'Eigen is a C++ template library for linear algebra: matrices, vectors, numerical solvers, and related algorithms'
  cn: eigen 特征是线性代数的 C ++模板库：矩阵，向量，数值求解器和相关算法
rule:
  darwin/brew:
    cmd: brew install eigen
    reference: https://formulae.brew.sh/formula/eigen#default
binlist:
- eigen
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
