lang: C++
homepage: https://gitlab.com/libeigen/eigen
desc:
  en: 'Eigen is a C++ template library for linear algebra: matrices, vectors, numerical solvers, and related algorithms'
  cn: eigen 特征是线性代数的 C ++模板库：矩阵，向量，数值求解器和相关算法
rule:
  darwin/brew:
    cmd: brew install eigen
    reference: https://formulae.brew.sh/formula/eigen#default

x:
  brew: eigenbinlist:
- eigen
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
