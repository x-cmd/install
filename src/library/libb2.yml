x:
  source: https://github.com/BLAKE2/libb2
  eget: BLAKE2/libb2
  yay: libb2-git
rule:
  /eget:
    cmd: x eget BLAKE2/libb2
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S libb2-git
    reference: https://aur.archlinux.org/packages/libb2-git
binlist:
- libb2

