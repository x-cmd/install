lang: C
homepage: https://github.com/BLAKE2/libb2
license: CC0-1.0
desc:
  cn: C 库提供了 BLAKE2b，BLAKE2s，BLAKE2bp，BLAKE2sp
  en: C library providing BLAKE2b, BLAKE2s, BLAKE2bp, BLAKE2sp
x:
  source: https://github.com/BLAKE2/libb2
  eget: BLAKE2/libb2
  yay: libb2-git
rule:
  /eget:
    cmd: x eget BLAKE2/libb2
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S libb2-git
    reference: https://aur.archlinux.org/packages/libb2-git
binlist:
- libb2

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 796 KB
          rating: 1
          desc:
            cn: 约 796 KB（估算）
            en: ~796 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
