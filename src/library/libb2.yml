lang: C
homepage: https://github.com/BLAKE2/libb2
license: CC0-1.0
desc:
  cn: C 库提供了 BLAKE2b，BLAKE2s，BLAKE2bp，BLAKE2sp
  en: C library providing BLAKE2b, BLAKE2s, BLAKE2bp, BLAKE2sp
x:
  source: https://github.com/BLAKE2/libb2
  eget: https://github.com/BLAKE2/libb2
rule:
  /eget:
    cmd: x eget BLAKE2/libb2
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S libb2-git
    reference: https://aur.archlinux.org/packages/libb2-git
binlist:
- libb2

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
