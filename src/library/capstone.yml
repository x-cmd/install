lang: C
homepage: https://github.com/capstone-engine/capstone
desc:
  cn: Capstone 是一个轻量级的多平台、多体系结构的拆卸框架
  en: Capstone is a lightweight multi-platform, multi-architecture disassembly framework
  cs: Capstone je lehký víceplatformní vícearchitekturní framework pro disasembler
  de: Capstone ist ein leichtgewichtiges Disassembly-Framework für mehrere Plattformen und Architekturen
  es: Capstone es un framework de desensamblado ligero, multiplataforma y multiarquitectura
  fr: Capstone est un framework de désassemblage léger, multiplateforme et multiarchitecture
  id: Capstone adalah kerangka kerja disassembly ringan yang multi-platform dan multi-arsitektur
  it: Capstone è un framework di disassembly leggero, multipiattaforma e multiarchitettura
  ja: Capstone は軽量なマルチプラットフォーム・マルチアーキテクチャの逆アセンブルフレームワークです
  ko: Capstone은 가벼운 다중 플랫폼, 다중 아키텍처 디스어셈블리 프레임워크입니다
  pl: Capstone to lekka, wieloplatformowa i wieloarchitekturowa ramka do deasemblacji
  pt: Capstone é um framework de desmontagem leve, multiplataforma e multiarquitetura
  ro: Capstone este un framework de dezassembly ușor, multiplatformă și multiarhitectură
  ru: Capstone — это лёгкий кроссплатформенный и мультиархитектурный фреймворк для дизассемблирования
  th: Capstone คือเฟรมเวิร์กการถอดแอสเซมบลีแบบเบา ใช้ได้หลายแพลตฟอร์มและหลายสถาปัตยกรรม
  tr: Capstone, çoklu platform ve çoklu mimari için hafif bir ayrıştırma çerçevesidir
  uk: Capstone — це легкий кроссплатформний і мультиархітектурний фреймворк для дизасемблювання
  vi: Capstone là khung dịch ngược nhẹ, đa nền tảng và đa kiến trúc
x:
  source: https://github.com/capstone-engine/capstone
  eget: capstone-engine/capstone
  brew: capstone
  scoop: ecapstone
  yay: capstone-git
rule:
  /eget:
    cmd: x eget capstone-engine/capstone
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S capstone-git
    reference: https://aur.archlinux.org/packages/capstone-git
  darwin/brew:
    cmd: brew install capstone
    reference: https://formulae.brew.sh/formula/capstone#default
  (win|wsl2)/scoop:
    cmd: x scoop install ecapstone
    reference: https://scoop.sh/#/apps?q=capstone
binlist:
- capstone
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: full
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 71 MB
          rating: 3
          desc:
            cn: 约 71 MB（估算）
            en: ~71 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
