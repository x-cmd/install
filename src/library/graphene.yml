lang: C
homepage: https://github.com/ebassi/graphene
desc:
  cn: 图形数据类型的薄层
  en: A thin layer of graphic data types
  cs: Tenká vrstva grafických datových typů
  de: Eine dünne Schicht aus Grafik-Datentypen
  es: Una capa fina de tipos de datos gráficos
  fr: Une fine couche de types de données graphiques
  id: Lapisan tipis dari tipe data grafis
  it: Un sottile strato di tipi di dati grafici
  ja: グラフィックデータ型の薄い抽象レイヤー
  ko: 그래픽 데이터 타입에 대한 얇은 추상화 계층
  pl: Cienka warstwa typów danych graficznych
  pt: Uma camada fina de tipos de dados gráficos
  ro: Un strat subțire de tipuri de date grafice
  ru: Тонкий слой над типами графических данных
  th: ชั้นบางของชนิดข้อมูลกราฟิก
  tr: Grafik veri türleri için ince bir katman
  uk: Тонкий шар над типами графічних даних
  vi: Một lớp mỏng các kiểu dữ liệu đồ họa
x:
  source: https://github.com/ebassi/graphene
  brew: graphene
  yay: graphene-git
rule:
  arch/yay:
    cmd: yay -S graphene-git
    reference: https://aur.archlinux.org/packages/graphene-git
  darwin/brew:
    cmd: brew install graphene
    reference: https://formulae.brew.sh/formula/graphene#defaultt
binlist:
- graphene
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 931 KB
          rating: 1
          desc:
            cn: 约 931 KB（估算）
            en: ~931 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
