lang: C
homepage: https://github.com/ebassi/graphene
desc:
  cn: 图形数据类型的薄层
  en: A thin layer of graphic data types
x:
  source: https://github.com/ebassi/graphene
rule:
  arch/yay:
    cmd: yay -S graphene-git
    reference: https://aur.archlinux.org/packages/graphene-git
  darwin/brew:
    cmd: brew install graphene
    reference: https://formulae.brew.sh/formula/graphene#defaultt
binlist:
- graphene
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 931 KB
          rating: 1
          desc:
            cn: 约 931 KB（估算）
            en: ~931 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
