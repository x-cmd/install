lang: C
homepage: https://github.com/ebassi/graphene
desc:
  cn: 图形数据类型的薄层
  en: A thin layer of graphic data types
x:
  source: https://github.com/ebassi/graphene
rule:
  arch/yay:
    cmd: yay -S graphene-git
    reference: https://aur.archlinux.org/packages/graphene-git
  darwin/brew:
    cmd: brew install graphene
    reference: https://formulae.brew.sh/formula/graphene#defaultt
binlist:
- graphene
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
