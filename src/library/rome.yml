lang: Rust
homepage: https://github.com/rome/tools
license: MIT
desc:
  cn: Rome 是用于 JavaScript、 TypeScript、 JSON、 HTML、 Markdown 和 CSS 的格式化程序、行程序、捆绑包和更多程序
  en: Rome is a formatter, linter, bundler, and more for JavaScript, TypeScript, JSON, HTML, Markdown, and CSS
x:
  source: https://github.com/rome/tools
  eget: https://github.com/rome/tools
rule:
  /eget:
    cmd: x eget rome/tools
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use rome
    reference: https://github.com/kichiemon/asdf-rome
  /cargo:
    cmd: cargo add roman
    reference: https://crates.io/crates/roman
    dsnap: roman
binlist:
- rome

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
