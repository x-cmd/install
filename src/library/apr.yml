lang: C
homepage: https://github.com/apache/apr
license: Apache-2.0
desc:
  cn: Apache 可移植运行时项目的任务是创建和维护软件库，为基础平台特定的实现提供可预测和一致的接口
  en: The mission of the Apache Portable Runtime (APR) project is to create and maintain software libraries that provide a predictable and consistent interface to underlying platform-specific implementations
x:
  source: https://github.com/apache/apr
  brew: apr
rule:
  darwin/brew:
    cmd: brew install apr
    reference: https://formulae.brew.sh/formula/apr#default
binlist:
- apr

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5.4 MB
          rating: 1
          desc:
            cn: 约 5.4 MB（估算）
            en: ~5.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
