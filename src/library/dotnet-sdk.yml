lang: C#
homepage: https://github.com/dotnet/sdk
license: MIT
desc:
  cn: .NET 是免费的、开源的、跨平台的框架，用于构建新式应用和强大的云服务
  en: .NET is the free, open-source, cross-platform framework for building modern apps and powerful cloud services
x:
  source: https://github.com/dotnet/sdk
rule:
  arch/yay:
    cmd: yay -S dotnet-sdk-bin
    reference: https://aur.archlinux.org/packages/dotnet-sdk-bin
  /homebrew:
    cmd: brew install --cask dotnet-sdk@9
    reference: https://formulae.brew.sh/cask/dotnet-sdk@9
binlist:
- dotnet-sdk

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
