lang: C#
homepage: https://github.com/dotnet/sdk
license: MIT
desc:
  cn: .NET 是免费的、开源的、跨平台的框架，用于构建新式应用和强大的云服务
  en: .NET is the free, open-source, cross-platform framework for building modern apps and powerful cloud services
x:
  source: https://github.com/dotnet/sdk
  brew: --cask
rule:
  arch/yay:
    cmd: yay -S dotnet-sdk-bin
    reference: https://aur.archlinux.org/packages/dotnet-sdk-bin
  /homebrew:
    cmd: brew install --cask dotnet-sdk@9
    reference: https://formulae.brew.sh/cask/dotnet-sdk@9
binlist:
- dotnet-sdk

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 约 30 MB（估算）
            en: ~30 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
