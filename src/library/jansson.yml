lang: C
homepage: https://github.com/akheron/jansson
desc:
  cn: Jansson 是一个用于编码、解码和操作 JSON 数据的 C 库
  en: Jansson is a C library for encoding, decoding and manipulating JSON data
x:
  source: https://github.com/akheron/jansson
  eget: https://github.com/akheron/jansson
rule:
  /eget:
    cmd: x eget akheron/jansson
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S jansson-git
    reference: https://aur.archlinux.org/packages/jansson-git
  darwin/brew:
    cmd: brew install jansson
    reference: https://formulae.brew.sh/formula/jansson#default
binlist:
- jansson
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
