lang: C
homepage: https://github.com/akheron/jansson
desc:
  cn: Jansson 是一个用于编码、解码和操作 JSON 数据的 C 库
  en: Jansson is a C library for encoding, decoding and manipulating JSON data
  cs: Jansson je knihovna jazyka C pro kódování, dekódování a manipulaci s daty JSON
  de: Jansson ist eine C-Bibliothek zum Kodieren, Dekodieren und Manipulieren von JSON-Daten
  es: Jansson es una biblioteca en C para codificar, decodificar y manipular datos JSON
  fr: Jansson est une bibliothèque C pour l'encodage, le décodage et la manipulation de données JSON
  id: Jansson adalah pustaka C untuk pengodean, pendekodean, dan memanipulasi data JSON
  it: Jansson è una libreria C per codificare, decodificare e manipolare dati JSON
  ja: Jansson は JSON データのエンコード、デコード、操作のための C ライブラリです
  ko: Jansson은 JSON 데이터를 인코딩, 디코딩하고 조작하기 위한 C 라이브러리입니다
  pl: Jansson to biblioteka C do kodowania, dekodowania i manipulacji danymi JSON
  pt: Jansson é uma biblioteca C para codificar, decodificar e manipular dados JSON
  ro: Jansson este o bibliotecă C pentru codificarea, decodificarea și manipularea datelor JSON
  ru: Jansson — это библиотека на C для кодирования, декодирования и обработки данных JSON
  th: Jansson คือไลบรารี C สำหรับเข้ารหัส ถอดรหัส และจัดการข้อมูล JSON
  tr: Jansson, JSON verilerini kodlamak, kod çözmek ve işlemek için bir C kitaplığıdır
  uk: Jansson — це бібліотека на C для кодування, декодування та обробки даних JSON
  vi: Jansson là thư viện C để mã hóa, giải mã và thao tác dữ liệu JSON
x:
  source: https://github.com/akheron/jansson
  eget: akheron/jansson
  brew: jansson
  yay: jansson-git
rule:
  /eget:
    cmd: x eget akheron/jansson
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S jansson-git
    reference: https://aur.archlinux.org/packages/jansson-git
  darwin/brew:
    cmd: brew install jansson
    reference: https://formulae.brew.sh/formula/jansson#default
binlist:
- jansson
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 576 KB
          rating: 1
          desc:
            cn: 约 576 KB（估算）
            en: ~576 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
