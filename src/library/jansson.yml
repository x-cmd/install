lang: C
homepage: https://github.com/akheron/jansson
desc:
  cn: Jansson 是一个用于编码、解码和操作 JSON 数据的 C 库
  en: Jansson is a C library for encoding, decoding and manipulating JSON data
x:
  source: https://github.com/akheron/jansson
  eget: https://github.com/akheron/jansson
  brew: jansson
rule:
  /eget:
    cmd: x eget akheron/jansson
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S jansson-git
    reference: https://aur.archlinux.org/packages/jansson-git
  darwin/brew:
    cmd: brew install jansson
    reference: https://formulae.brew.sh/formula/jansson#default
binlist:
- jansson
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 576 KB
          rating: 1
          desc:
            cn: 约 576 KB（估算）
            en: ~576 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
