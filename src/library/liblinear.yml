lang: C++
homepage: https://github.com/cjlin1/liblinear
license: BSD-3-Clause
desc:
  en: LIBLINEAR is a linear classifier for data with millions of instances and features
  cn: Liblinear 是具有数百万个实例和功能的数据的线性分类器
x:
  source: https://github.com/cjlin1/liblinear
  brew: liblinear
  yay: liblinear
  pip: -U
rule:
  arch/yay:
    cmd: yay -S liblinear
    reference: https://aur.archlinux.org/packages/liblinear
  /pip:
    cmd: pip install -U liblinear-official
    reference: https://www.checkov.io/1.Welcome/Quick%20Start.html#install-checkov-from-pypi
    dsnap: liblinear-official
  darwin/brew:
    cmd: brew install liblinear
    reference: https://formulae.brew.sh/formula/liblinear#default
binlist:
- liblinear

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 250 KB
          rating: 1
          desc:
            cn: 约 250 KB（估算）
            en: ~250 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
