lang: C
homepage: https://gitlab.freedesktop.org/libbsd/libbsd
desc:
  en: Utility functions from BSD systems
  cn: 来自 BSD 系统的实用程序函数
  cs: Užitečné funkce ze systémů BSD
  de: Hilfsfunktionen aus BSD-Systemen
  es: Funciones de utilidad de los sistemas BSD
  fr: Fonctions utilitaires issues des systèmes BSD
  id: Fungsi utilitas dari sistem BSD
  it: Funzioni di utilità dai sistemi BSD
  ja: BSD システム由来のユーティリティ関数
  ko: BSD 시스템의 유틸리티 함수
  pl: Funkcje narzędziowe z systemów BSD
  pt: Funções utilitárias dos sistemas BSD
  ro: Funcții utilitare din sistemele BSD
  ru: Вспомогательные функции из систем BSD
  th: ฟังก์ชันอรรถประโยชน์จากระบบ BSD
  tr: BSD sistemlerinden yardımcı işlevler
  uk: Допоміжні функції з систем BSD
  vi: Các hàm tiện ích từ hệ thống BSD
rule:
  arch/yay:
    cmd: yay -S libbsd-git
    reference: https://aur.archlinux.org/packages/libbsd-git
  darwin/brew:
    cmd: brew install libbsd
    reference: https://formulae.brew.sh/formula/libbsd#default

x:
  brew: libbsd
  yay: libbsd-git
binlist:
- libbsd
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
