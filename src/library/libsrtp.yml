lang: C
homepage: https://github.com/cisco/libsrtp
desc:
  cn: libSRTP 提供安全实时传输协议 （SRTP）、通用安全转换 （UST） 和支持加密内核的实现。SRTP API 记录在 include/srtp.h 中，库位于 libsrtp2.a 中（编译后）
  en: libSRTP provides an implementation of the Secure Real-time Transport Protocol (SRTP), the Universal Security Transform (UST), and a supporting cryptographic kernel. The SRTP API is documented in include/srtp.h, and the library is in libsrtp2.a (after compilation)
  cs: libSRTP poskytuje implementaci protokolu Secure Real-time Transport Protocol (SRTP), Universal Security Transform (UST) a podpůrnou kryptografickou jádro. API SRTP je dokumentováno v include/srtp.h a knihovna je v libsrtp2.a (po kompilaci)
  de: libSRTP stellt eine Implementierung des Secure Real-time Transport Protocol (SRTP), des Universal Security Transform (UST) und einer unterstützenden kryptografischen Kernel bereit. Die SRTP-API ist in include/srtp.h dokumentiert, und die Bibliothek befindet sich in libsrtp2.a (nach der Kompilierung)
  es: libSRTP proporciona una implementación del Protocolo de Transporte Seguro en Tiempo Real (SRTP), la Transformación Universal de Seguridad (UST) y un núcleo criptográfico de soporte. La API de SRTP está documentada en include/srtp.h, y la biblioteca está en libsrtp2.a (después de compilar)
  fr: libSRTP fournit une implémentation du Secure Real-time Transport Protocol (SRTP), de l'Universal Security Transform (UST) et d'un noyau cryptographique de prise en charge. L'API SRTP est documentée dans include/srtp.h, et la bibliothèque se trouve dans libsrtp2.a (après compilation)
  id: libSRTP menyediakan implementasi Secure Real-time Transport Protocol (SRTP), Universal Security Transform (UST), dan inti kriptografi pendukung. API SRTP terdokumentasi di include/srtp.h, dan pustaka berada di libsrtp2.a (setelah dikompilasi)
  it: libSRTP fornisce un'implementazione del Secure Real-time Transport Protocol (SRTP), dell'Universal Security Transform (UST) e di un kernel crittografico di supporto. L'API SRTP è documentata in include/srtp.h e la libreria si trova in libsrtp2.a (dopo la compilazione)
  ja: libSRTP は、Secure Real-time Transport Protocol (SRTP)、Universal Security Transform (UST)、および支援する暗号カーネルの実装を提供します。SRTP API は include/srtp.h に文書化されており、ライブラリは libsrtp2.a にあります (コンパイル後)
  ko: libSRTP는 Secure Real-time Transport Protocol(SRTP), Universal Security Transform(UST) 및 지원 암호화 커널을 구현합니다. SRTP API는 include/srtp.h에 문서화되어 있으며 라이브러리는 컴파일 후 libsrtp2.a에 있습니다
  pl: libSRTP dostarcza implementację protokołu Secure Real-time Transport Protocol (SRTP), Universal Security Transform (UST) oraz wspierającego jądra kryptograficznego. API SRTP jest udokumentowane w include/srtp.h, a biblioteka znajduje się w libsrtp2.a (po kompilacji)
  pt: libSRTP fornece uma implementação do Protocolo de Transporte Seguro em Tempo Real (SRTP), da Transformação Universal de Segurança (UST) e de um núcleo criptográfico de suporte. A API do SRTP está documentada em include/srtp.h, e a biblioteca está em libsrtp2.a (após a compilação)
  ro: libSRTP oferă o implementare a protocolului Secure Real-time Transport Protocol (SRTP), a Universal Security Transform (UST) și a unui nucleu criptografic de suport. API-ul SRTP este documentat în include/srtp.h, iar biblioteca se află în libsrtp2.a (după compilare)
  ru: libSRTP предоставляет реализацию протокола Secure Real-time Transport Protocol (SRTP), Universal Security Transform (UST) и вспомогательного криптографического ядра. API SRTP документирован в include/srtp.h, а библиотека находится в libsrtp2.a (после компиляции)
  th: libSRTP ให้การทำงานของ Secure Real-time Transport Protocol (SRTP), Universal Security Transform (UST) และแกนเข้ารหัสที่รองรับ เอกสาร API ของ SRTP อยู่ใน include/srtp.h และไลบรารีอยู่ใน libsrtp2.a (หลังจากคอมไพล์)
  tr: libSRTP, Secure Real-time Transport Protocol (SRTP), Universal Security Transform (UST) ve destekleyici kriptografik çekirdek için bir uygulama sağlar. SRTP API'si include/srtp.h içinde belgelenmiştir ve kitaplık derlemeden sonra libsrtp2.a içinde bulunur
  uk: libSRTP надає реалізацію протоколу Secure Real-time Transport Protocol (SRTP), Universal Security Transform (UST) та допоміжне криптографічне ядро. API SRTP задокументований у include/srtp.h, а бібліотека міститься у libsrtp2.a (після компіляції)
  vi: libSRTP cung cấp hiện thực giao thức Secure Real-time Transport Protocol (SRTP), Universal Security Transform (UST) và lõi mật mã hỗ trợ. API của SRTP được tài liệu hóa trong include/srtp.h, và thư viện nằm trong libsrtp2.a (sau khi biên dịch)
x:
  source: https://github.com/cisco/libsrtp
  yay: libsrtp-git
rule:
  arch/yay:
    cmd: yay -S libsrtp-git
    reference: https://aur.archlinux.org/packages/libsrtp-git
  /git:
    reference: https://github.com/cisco/libsrtp?tab=readme-ov-file#installing-and-building-libsrtp
    cmd: 'git clone https://github.com/cisco/libsrtp.git

      cd libsrtp

      make

      '
binlist:
- libsrtp
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
