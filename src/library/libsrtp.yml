lang: C
homepage: https://github.com/cisco/libsrtp
desc:
  cn: libSRTP 提供安全实时传输协议 （SRTP）、通用安全转换 （UST） 和支持加密内核的实现。SRTP API 记录在 include/srtp.h 中，库位于 libsrtp2.a 中（编译后）
  en: libSRTP provides an implementation of the Secure Real-time Transport Protocol (SRTP), the Universal Security Transform (UST), and a supporting cryptographic kernel. The SRTP API is documented in include/srtp.h, and the library is in libsrtp2.a (after compilation)
x:
  source: https://github.com/cisco/libsrtp
  yay: libsrtp-git
rule:
  arch/yay:
    cmd: yay -S libsrtp-git
    reference: https://aur.archlinux.org/packages/libsrtp-git
  /git:
    reference: https://github.com/cisco/libsrtp?tab=readme-ov-file#installing-and-building-libsrtp
    cmd: 'git clone https://github.com/cisco/libsrtp.git

      cd libsrtp

      make

      '
binlist:
- libsrtp
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
