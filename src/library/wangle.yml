lang: C++
homepage: https://github.com/facebook/wangle
license: Apache-2.0
desc:
  en: Wangle is a library that makes it easy to build protocols, application clients, and application servers
  cn: Wangle 是一个可以轻松构建协议、应用程序客户端和应用服务器的库
  cs: Wangle je knihovna, která usnadňuje tvorbu protokolů, aplikačních klientů a aplikačních serverů
  de: Wangle ist eine Bibliothek, die das Erstellen von Protokollen, Anwendung-Clients und Anwendung-Servern erleichtert
  es: Wangle es una biblioteca que facilita la creación de protocolos, clientes de aplicaciones y servidores de aplicaciones
  fr: Wangle est une bibliothèque qui facilite la création de protocoles, de clients d'application et de serveurs d'application
  id: Wangle adalah pustaka yang memudahkan pembuatan protokol, klien aplikasi, dan server aplikasi
  it: Wangle è una libreria che facilita la creazione di protocolli, client applicativi e server applicativi
  ja: Wangle は、プロトコル、アプリケーションクライアント、アプリケーションサーバーを簡単に構築できるライブラリです
  ko: Wangle은 프로토콜, 애플리케이션 클라이언트 및 애플리케이션 서버를 쉽게 구축할 수 있게 하는 라이브러리입니다
  pl: Wangle to biblioteka ułatwiająca tworzenie protokołów, klientów aplikacji i serwerów aplikacji
  pt: Wangle é uma biblioteca que facilita a criação de protocolos, clientes de aplicativo e servidores de aplicativo
  ro: Wangle este o bibliotecă care facilitează construirea de protocoale, clienți de aplicații și servere de aplicații
  ru: Wangle — это библиотека, упрощающая создание протоколов, клиентов приложений и серверов приложений
  th: Wangle คือไลบรารีที่ช่วยให้สร้างโปรโตคอล ไคลเอนต์แอปพลิเคชัน และเซิร์ฟเวอร์แอปพลิเคชันได้อย่างง่ายดาย
  tr: Wangle, protokoller, uygulama istemcileri ve uygulama sunucuları oluşturmayı kolaylaştıran bir kitaplıktır
  uk: Wangle — це бібліотека, яка полегшує створення протоколів, клієнтів застосунків і серверів застосунків
  vi: Wangle là thư viện giúp dễ dàng xây dựng giao thức, client ứng dụng và server ứng dụng
x:
  source: https://github.com/facebook/wangle
  eget: facebook/wangle
  brew: wangle
  yay: wangle
rule:
  /eget:
    cmd: x eget facebook/wangle
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S wangle
    reference: https://aur.archlinux.org/packages/wangle
  darwin/brew:
    cmd: brew install wangle
    reference: https://formulae.brew.sh/formula/wangle#default
binlist:
- wangle

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.0 MB
          rating: 1
          desc:
            cn: 约 2.0 MB（估算）
            en: ~2.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
