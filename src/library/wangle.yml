lang: C++
homepage: https://github.com/facebook/wangle
license: Apache-2.0
desc:
  en: Wangle is a library that makes it easy to build protocols, application clients, and application servers
  cn: Wangle 是一个可以轻松构建协议、应用程序客户端和应用服务器的库
x:
  source: https://github.com/facebook/wangle
  eget: https://github.com/facebook/wangle
rule:
  /eget:
    cmd: x eget facebook/wangle
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S wangle
    reference: https://aur.archlinux.org/packages/wangle
  darwin/brew:
    cmd: brew install wangle
    reference: https://formulae.brew.sh/formula/wangle#default
binlist:
- wangle

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
