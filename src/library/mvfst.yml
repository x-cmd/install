lang: C++
homepage: https://github.com/facebook/mvfst
license: MIT
desc:
  en: mvfst is a client and server implementation of IETF QUIC protocol in C++ by Facebook
  cn: mvfst 是 Facebook 在 C++ 中实现 IETF QUIC 协议的客户端和服务器
x:
  source: https://github.com/facebook/mvfst
rule:
  arch/yay:
    cmd: yay -S mvfst
    reference: https://aur.archlinux.org/packages/mvfst
  darwin/brew:
    cmd: brew install mvfst
    reference: https://formulae.brew.sh/formula/mvfst#default
binlist:
- mvfst

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
