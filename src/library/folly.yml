lang: C++
homepage: https://github.com/facebook/folly
license: Apache-2.0
desc:
  en: Folly is a library of C++14 components designed with practicality and efficiency in mind
  cn: Folly 是一个由 C++ 14 组件构成的库，其设计考虑到了实用性和效率
x:
  source: https://github.com/facebook/folly
  eget: facebook/folly
  brew: folly
  yay: folly
rule:
  /eget:
    cmd: x eget facebook/folly
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S folly
    reference: https://aur.archlinux.org/packages/folly
  darwin/brew:
    cmd: brew install folly
    reference: https://github.com/facebook/folly?tab=readme-ov-file#homebrew
binlist:
- folly

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 28 MB
          rating: 2
          desc:
            cn: 约 28 MB（估算）
            en: ~28 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
