lang: C++
homepage: https://github.com/facebook/folly
license: Apache-2.0
desc:
  en: Folly is a library of C++14 components designed with practicality and efficiency in mind
  cn: Folly 是一个由 C++ 14 组件构成的库，其设计考虑到了实用性和效率
  cs: Folly je knihovna komponent C++14 navržená s ohledem na praktičnost a efektivitu
  de: Folly ist eine Bibliothek aus C++14-Komponenten, die mit Blick auf Praktikabilität und Effizienz entworfen wurde
  es: Folly es una biblioteca de componentes C++14 diseñada teniendo en cuenta la practicidad y la eficiencia
  fr: Folly est une bibliothèque de composants C++14 conçue en ayant à l'esprit la praticité et l'efficacité
  id: Folly adalah pustaka komponen C++14 yang dirancang dengan mempertimbangkan kepraktisan dan efisiensi
  it: Folly è una libreria di componenti C++14 progettata tenendo conto della praticità e dell'efficienza
  ja: Folly は実用性と効率性を重視して設計された C++14 コンポーネントのライブラリです
  ko: Folly는 실용성과 효율성을 고려해 설계된 C++14 컴포넌트 라이브러리입니다
  pl: Folly to biblioteka komponentów C++14 zaprojektowana z myślą o praktyczności i wydajności
  pt: Folly é uma biblioteca de componentes C++14 projetada com foco em praticidade e eficiência
  ro: Folly este o bibliotecă de componente C++14 concepută având în vedere practicitatea și eficiența
  ru: Folly — это библиотека компонентов на C++14, спроектированная с учётом практичности и эффективности
  th: Folly คือไลบรารีคอมโพเนนต์ C++14 ที่ออกแบบโดยคำนึงถึงความใช้งานจริงและประสิทธิภาพ
  tr: Folly, pratiklik ve verimlilik göz önünde bulundurularak tasarlanmış bir C++14 bileşen kitaplığıdır
  uk: Folly — це бібліотека компонентів на C++14, спроєктована з урахуванням практичності та ефективності
  vi: Folly là thư viện các thành phần C++14 được thiết kế với sự thực tế và hiệu quả
x:
  source: https://github.com/facebook/folly
  eget: facebook/folly
  brew: folly
  yay: folly
rule:
  /eget:
    cmd: x eget facebook/folly
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S folly
    reference: https://aur.archlinux.org/packages/folly
  darwin/brew:
    cmd: brew install folly
    reference: https://github.com/facebook/folly?tab=readme-ov-file#homebrew
binlist:
- folly

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 28 MB
          rating: 2
          desc:
            cn: 约 28 MB（估算）
            en: ~28 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
