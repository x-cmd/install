lang: C
homepage: https://gitlab.dkrz.de/k202009/libaec
desc:
  cn: 自适应熵编码库
  en: Adaptive Entropy Coding library
rule:
  arch/yay:
    cmd: yay -S libaec-git
    reference: https://aur.archlinux.org/packages/libaec-git
  darwin/brew:
    cmd: brew install libaec
    reference: https://formulae.brew.sh/formula/libaec#default
binlist:
- libaec
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
