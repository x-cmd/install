lang: C
homepage: https://gitlab.gnome.org/GNOME/at-spi2-atk
desc:
  cn: 根据 libatspi2API 实现 ATK 接口
  en: Implementation of the ATK interfaces in terms of the libatspi2 API
rule:
  /asdf:
    cmd: x asdf use at-spi2-atk
    reference: https://github.com/GNOME/at-spi2-atk
binlist:
- at-spi2-atk
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
