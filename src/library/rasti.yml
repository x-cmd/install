lang: JavaScript
homepage: https://rasti.js.org/#gettingstarted
desc:
  cn: Rasti 是一个轻量级的 MVC 库，用于构建快速、响应式的用户界面。
  en: Rasti is a lightweight MVC library for building fast, reactive user interfaces.
rule:
  /npm:
    cmd: npm install rasti
    reference: https://rasti.js.org/#gettingstarted
    dsnap: rasti
binlist:
- rasti
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
