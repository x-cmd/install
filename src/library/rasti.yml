lang: JavaScript
homepage: https://rasti.js.org/#gettingstarted
desc:
  cn: Rasti 是一个轻量级的 MVC 库，用于构建快速、响应式的用户界面。
  en: Rasti is a lightweight MVC library for building fast, reactive user interfaces.
rule:
  /npm:
    cmd: npm install rasti
    reference: https://rasti.js.org/#gettingstarted
    dsnap: rasti
binlist:
- rasti
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
