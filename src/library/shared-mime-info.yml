lang: Ruby
homepage: https://gitlab.freedesktop.org/xdg/shared-mime-info
desc:
  en: Share-MIME-info is a pure Ruby library for accessing the MIME info database provided by Freedesktop on Standards/shared-mime-info-spec
  cn: Share-MIME-info 是一个纯 Ruby 库，用于访问标准/share-MIME-info-spec 上的 Freedesktop 提供的 MIME 信息数据库
rule:
  arch/yay:
    cmd: yay -S shared-mime-info-git
    reference: https://aur.archlinux.org/packages/shared-mime-info-git
  darwin/brew:
    cmd: brew install shared-mime-info
    reference: https://formulae.brew.sh/formula/shared-mime-info#default
binlist:
- shared-mime-info
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 1
          desc:
            cn: 安装 10 MB
            en: 10 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
