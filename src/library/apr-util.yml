lang: C
homepage: https://github.com/apache/apr-util
license: Apache-2.0
desc:
  cn: Apache 可移植运行时库
  en: Companion library to apr, the Apache Portable Runtime library
x:
  source: https://github.com/apache/apr-util
rule:
  darwin/brew:
    cmd: brew install apr-util
    reference: https://formulae.brew.sh/formula/apr-util#default
binlist:
- apr-util

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
