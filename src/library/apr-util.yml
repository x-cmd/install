lang: C
homepage: https://github.com/apache/apr-util
license: Apache-2.0
desc:
  cn: Apache 可移植运行时库
  en: Companion library to apr, the Apache Portable Runtime library
x:
  source: https://github.com/apache/apr-util
rule:
  darwin/brew:
    cmd: brew install apr-util
    reference: https://formulae.brew.sh/formula/apr-util#default
binlist:
- apr-util

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2.7 MB
          rating: 1
          desc:
            cn: 约 2.7 MB（估算）
            en: ~2.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
