lang: C
homepage: https://github.com/apache/apr-util
license: Apache-2.0
desc:
  cn: Apache 可移植运行时库
  en: Companion library to apr, the Apache Portable Runtime library
  cs: Doplňková knihovna k apr, knihovně Apache Portable Runtime
  de: Begleitbibliothek zu apr, der Apache Portable Runtime-Bibliothek
  es: Biblioteca complementaria de apr, la biblioteca Apache Portable Runtime
  fr: Bibliothèque compagnon de apr, la bibliothèque Apache Portable Runtime
  id: Pustaka pendamping untuk apr, pustaka Apache Portable Runtime
  it: Libreria di supporto a apr, la libreria Apache Portable Runtime
  ja: apr、Apache Portable Runtime ライブラリの付属ライブラリです
  ko: apr, Apache Portable Runtime 라이브러리의 보조 라이브러리
  pl: Biblioteka towarzysząca apr, bibliotece Apache Portable Runtime
  pt: Biblioteca complementar do apr, a biblioteca Apache Portable Runtime
  ro: Bibliotecă însoțitoare pentru apr, biblioteca Apache Portable Runtime
  ru: Сопутствующая библиотека к apr, библиотеке Apache Portable Runtime
  th: ไลบรารีประกอบของ apr ซึ่งเป็นไลบรารี Apache Portable Runtime
  tr: apr, Apache Portable Runtime kitaplığının yardımcı kitaplığı
  uk: Супутня бібліотека до apr, бібліотеки Apache Portable Runtime
  vi: Thư viện đi kèm của apr, thư viện Apache Portable Runtime
x:
  source: https://github.com/apache/apr-util
  brew: apr-util
rule:
  darwin/brew:
    cmd: brew install apr-util
    reference: https://formulae.brew.sh/formula/apr-util#default
binlist:
- apr-util

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2.7 MB
          rating: 1
          desc:
            cn: 约 2.7 MB（估算）
            en: ~2.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
