lang: C
homepage: https://github.com/GNOME/at-spi2-core
license: LGPL-2.1
desc:
  cn: 'At-spi2-core 是一个辅助技术服务供应介面，它提供了两个功能: 一组用于可访问性的 DBus 接口，以及一个用于使用这些接口的 C 语言绑定'
  en: 'at-spi2-core is the Assistive Technology Service Provider Interface, which provides two things: a set of DBus interfaces for accessibility, and a C language binding to use those interfaces'
x:
  source: https://github.com/GNOME/at-spi2-core
rule:
  arch/yay:
    cmd: yay -S at-spi2-core-git
    reference: https://aur.archlinux.org/packages/at-spi2-core-git
  /asdf:
    cmd: x asdf use at-spi2-core
    reference: https://github.com/GNOME/at-spi2-core
  darwin/brew:
    cmd: brew install at-spi2-core
    reference: https://formulae.brew.sh/formula/at-spi2-core#default
binlist:
- at-spi2-core

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.3 MB
          rating: 1
          desc:
            cn: 约 2.3 MB（估算）
            en: ~2.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
