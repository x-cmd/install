lang: C++
homepage: https://github.com/facebook/fbthrift
license: Apache-2.0
desc:
  en: Thrift is a serialization and RPC framework for service communication
  cn: Thrift 是一种用于服务通信的序列化和 RPC 框架
x:
  source: https://github.com/facebook/fbthrift
  brew: fbthrift
  yay: fbthrift-git
rule:
  arch/yay:
    cmd: yay -S fbthrift-git
    reference: https://aur.archlinux.org/packages/fbthrift-git
  darwin/brew:
    cmd: brew install fbthrift
    reference: https://formulae.brew.sh/formula/fbthrift#default
binlist:
- fbthrift

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 45 MB
          rating: 2
          desc:
            cn: 约 45 MB（估算）
            en: ~45 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
