lang: C++
homepage: https://github.com/facebook/fbthrift
license: Apache-2.0
desc:
  en: Thrift is a serialization and RPC framework for service communication
  cn: Thrift 是一种用于服务通信的序列化和 RPC 框架
  cs: Thrift je framework pro serializaci a RPC pro komunikaci mezi službami
  de: Thrift ist ein Serialisierungs- und RPC-Framework für die Kommunikation zwischen Diensten
  es: Thrift es un framework de serialización y RPC para la comunicación entre servicios
  fr: Thrift est un framework de sérialisation et de RPC pour la communication entre services
  id: Thrift adalah kerangka kerja serialisasi dan RPC untuk komunikasi antar-layanan
  it: Thrift è un framework di serializzazione e RPC per la comunicazione tra servizi
  ja: Thrift はサービス間の通信のためのシリアライズおよび RPC フレームワークです
  ko: Thrift는 서비스 간 통신을 위한 직렬화 및 RPC 프레임워크입니다
  pl: Thrift to framework do serializacji i RPC służący do komunikacji między usługami
  pt: Thrift é um framework de serialização e RPC para comunicação entre serviços
  ro: Thrift este un framework de serializare și RPC pentru comunicarea între servicii
  ru: Thrift — это фреймворк сериализации и RPC для взаимодействия между сервисами
  th: Thrift คือเฟรมเวิร์กการทำ serialization และ RPC สำหรับการสื่อสารระหว่างบริการ
  tr: Thrift, servisler arası iletişim için bir serileştirme ve RPC çerçevesidir
  uk: Thrift — це фреймворк серіалізації та RPC для взаємодії між сервісами
  vi: Thrift là framework tuần tự hóa và RPC dùng cho giao tiếp giữa các dịch vụ
x:
  source: https://github.com/facebook/fbthrift
  brew: fbthrift
  yay: fbthrift-git
rule:
  arch/yay:
    cmd: yay -S fbthrift-git
    reference: https://aur.archlinux.org/packages/fbthrift-git
  darwin/brew:
    cmd: brew install fbthrift
    reference: https://formulae.brew.sh/formula/fbthrift#default
binlist:
- fbthrift

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 45 MB
          rating: 2
          desc:
            cn: 约 45 MB（估算）
            en: ~45 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
