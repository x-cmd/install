lang: C++
homepage: https://github.com/facebook/fbthrift
license: Apache-2.0
desc:
  en: Thrift is a serialization and RPC framework for service communication
  cn: Thrift 是一种用于服务通信的序列化和 RPC 框架
x:
  source: https://github.com/facebook/fbthrift
rule:
  arch/yay:
    cmd: yay -S fbthrift-git
    reference: https://aur.archlinux.org/packages/fbthrift-git
  darwin/brew:
    cmd: brew install fbthrift
    reference: https://formulae.brew.sh/formula/fbthrift#default
binlist:
- fbthrift

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
