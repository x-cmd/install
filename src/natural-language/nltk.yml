lang: Python
homepage: https://github.com/nltk/nltk
license: Apache-2.0
desc:
  cn: NLTK（自然语言工具包）是一套开源 Python 模块、数据集和教程，支持自然语言处理的研究和开发。
  en: NLTK -- the Natural Language Toolkit -- is a suite of open source Python modules, data sets, and tutorials supporting research and development in Natural Language Processing.
x:
  source: https://github.com/nltk/nltk
rule:
  /pip:
    cmd: pip install --user -U nltk
    reference: https://www.nltk.org/install.html#mac-unix
    dsnap: nltk
binlist:
- nltk

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 364 KB
          rating: 1
          desc:
            cn: 约 364 KB（估算）
            en: ~364 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
