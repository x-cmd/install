lang: Python
homepage: https://github.com/mozillazg/python-pinyin
license: MIT
desc:
  cn: 将汉字转为拼音。可以用于汉字注音、排序、检索
  en: Convert Chinese characters to Pinyin. Can be used for Chinese character phonetic notation, sorting, and retrieval
x:
  pkg:
    exist: true
  source: https://github.com/mozillazg/python-pinyin
rule:
  /x:
    cmd: x pkg use pypinyin
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install pypinyin
    reference: https://pypinyin.readthedocs.io/zh-cn/master/installation.html
    dsnap: pypinyin
  /easy_install:
    cmd: easy_install pypinyin
    reference: https://pypinyin.readthedocs.io/zh-cn/master/installation.html
binlist:
- pypinyin

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
