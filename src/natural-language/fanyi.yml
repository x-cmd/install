lang: JavaScript
homepage: https://github.com/afc163/fanyi
license: MIT
desc:
  en: Chinese-English translation tool, powered by youDao/iciba/ChatGPT
  cn: 中英文翻译工具，由 youDao/iciba/ChatGPT 提供支持
x:
  pkg:
    exist: true
  source: https://github.com/afc163/fanyi
rule:
  /x:
    cmd: x pkg use fanyi
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install fanyi -g
    reference: https://github.com/afc163/fanyi?tab=readme-ov-file#install
    dsnap: fanyi
  arch/yay:
    cmd: yay -S nodejs-fanyi
    reference: https://aur.archlinux.org/packages/nodejs-fanyi
  linux/npm:
    cmd: sudo apt-get install festival festvox-kallpc16k && npm install fanyi -g
    reference: https://github.com/afc163/fanyi?tab=readme-ov-file#error-spawn-festival-enoent
binlist:
- fanyi

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
