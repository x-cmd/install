lang: JavaScript
homepage: https://github.com/afc163/fanyi
license: MIT
desc:
  en: Chinese-English translation tool, powered by youDao/iciba/ChatGPT
  cn: 中英文翻译工具，由 youDao/iciba/ChatGPT 提供支持
  cs: Nástroj pro překlad čínštiny a angličtiny, podporovaný youDao/iciba/ChatGPT
  de: Chinesisch-Englisch-Übersetzungswerkzeug, unterstützt von youDao/iciba/ChatGPT
  es: Herramienta de traducción chino-inglés, respaldada por youDao/iciba/ChatGPT
  fr: Outil de traduction chinois-anglais, propulsé par youDao/iciba/ChatGPT
  id: Alat terjemahan Mandarin-Inggris, didukung oleh youDao/iciba/ChatGPT
  it: Strumento di traduzione cinese-inglese, supportato da youDao/iciba/ChatGPT
  ja: 中国語と英語の翻訳ツール。youDao/iciba/ChatGPTが対応しています
  ko: 중국어-영어 번역 도구로 youDao/iciba/ChatGPT를 지원합니다
  pl: Narzędzie do tłumaczenia chińskiego i angielskiego, wspierane przez youDao/iciba/ChatGPT
  pt: Ferramenta de tradução chinês-inglês, com suporte de youDao/iciba/ChatGPT
  ro: Instrument de traducere chineză-engleză, susținut de youDao/iciba/ChatGPT
  ru: Инструмент перевода китайского и английского, поддерживаемый youDao/iciba/ChatGPT
  th: เครื่องมือแปลภาษาจีน-อังกฤษ รองรับโดย youDao/iciba/ChatGPT
  tr: Çince-İngilizce çeviri aracı, youDao/iciba/ChatGPT desteklidir
  uk: Інструмент перекладу китайської та англійської, підтримується youDao/iciba/ChatGPT
  vi: Công cụ dịch Trung-Anh, được hỗ trợ bởi youDao/iciba/ChatGPT
x:
  source: https://github.com/afc163/fanyi
  apt: festival
  apt-get: festival
  yay: nodejs-fanyi
  npm: fanyi
rule:
  /x:
    cmd: x pkg use fanyi
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install fanyi -g
    reference: https://github.com/afc163/fanyi?tab=readme-ov-file#install
    dsnap: fanyi
  arch/yay:
    cmd: yay -S nodejs-fanyi
    reference: https://aur.archlinux.org/packages/nodejs-fanyi
  linux/npm:
    cmd: sudo apt-get install festival festvox-kallpc16k && npm install fanyi -g
    reference: https://github.com/afc163/fanyi?tab=readme-ov-file#error-spawn-festival-enoent
binlist:
- fanyi

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
