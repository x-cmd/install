lang: Python
homepage: https://github.com/deeplcom/deepl-python
license: MIT
desc:
  cn: 用于 DeepL 语言翻译 API 的官方 Python 库
  en: Official Python library for the DeepL language translation API
x:
  pkg:
    exist: true
  source: https://github.com/deeplcom/deepl-python
rule:
  /x:
    cmd: x pkg use deepl
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install --upgrade deepl
    reference: https://github.com/deeplcom/deepl-python?tab=readme-ov-file#installation
    dsnap: deepl
binlist:
- deepl

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
