lang: Python
homepage: https://github.com/fxsjy/jieba
license: MIT
desc:
  cn: 结巴中文分词 做最好的 Python 中文分词组件
  en: Jieba Chinese word segmentation, built to be the best Python Chinese word segmentation component
x:
  pkg:
    exist: true
  source: https://github.com/fxsjy/jieba
rule:
  /x:
    cmd: x pkg use jieba
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install jieba
    reference: https://github.com/fxsjy/jieba#%E5%AE%89%E8%A3%85%E8%AF%B4%E6%98%8E
    dsnap: jieba
  arch/yay:
    cmd: yay -S python-jieba3
    reference: https://aur.archlinux.org/packages/python-jieba3
  /pip3:
    cmd: pip3 install jieba
    reference: https://github.com/fxsjy/jieba#%E5%AE%89%E8%A3%85%E8%AF%B4%E6%98%8E
  /easy_install:
    cmd: easy_install jieba
    reference: https://github.com/fxsjy/jieba#%E5%AE%89%E8%A3%85%E8%AF%B4%E6%98%8E
binlist:
- jieba

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 689 KB
          rating: 1
          desc:
            cn: 约 689 KB（估算）
            en: ~689 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
