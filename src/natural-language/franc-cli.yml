lang: JavaScript
homepage: https://github.com/wooorm/franc/tree/main
license: MIT
desc:
  cn: 用于检测文本自然语言的 CLI
  en: CLI to detect the language of text
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use franc-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install franc-cli --global
    reference: https://github.com/wooorm/franc/tree/main?tab=readme-ov-file#cli
    dsnap: franc-cli
binlist:
- franc-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
