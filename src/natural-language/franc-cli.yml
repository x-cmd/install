lang: JavaScript
homepage: https://github.com/wooorm/franc/tree/main
license: MIT
desc:
  cn: 用于检测文本自然语言的 CLI
  en: CLI to detect the language of text
  cs: CLI pro detekci jazyka textu
  de: CLI zur Erkennung der Sprache von Text
  es: CLI para detectar el idioma del texto
  fr: CLI pour détecter la langue d'un texte
  id: CLI untuk mendeteksi bahasa teks
  it: CLI per rilevare la lingua del testo
  ja: テキストの言語を検出するCLI
  ko: 텍스트의 언어를 감지하는 CLI
  pl: CLI do wykrywania języka tekstu
  pt: CLI para detectar o idioma do texto
  ro: CLI pentru detectarea limbii textului
  ru: CLI для определения языка текста
  th: CLI สำหรับตรวจจับภาษาของข้อความ
  tr: Metin dilini algılamak için CLI
  uk: CLI для визначення мови тексту
  vi: CLI để phát hiện ngôn ngữ của văn bản
x:
  npm: franc-cli
rule:
  /x:
    cmd: x pkg use franc-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install franc-cli --global
    reference: https://github.com/wooorm/franc/tree/main?tab=readme-ov-file#cli
    dsnap: franc-cli
binlist:
- franc-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
