lang: Go
homepage: https://github.com/jenkins-x/jx
license: Apache-2.0
desc:
  cn: Jenkins X 为云上的开发人员自动化并加速持续集成和持续交付，以便他们可以专注于构建出色的软件
  en: Jenkins X automates and accelerates Continuous Integration and Continuous Delivery for developers on the cloud, so they can focus on building awesome software
x:
  source: https://github.com/jenkins-x/jx
  eget: https://github.com/jenkins-x/jx
rule:
  /eget:
    cmd: x eget jenkins-x/jx
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use jx
    reference: https://github.com/vbehar/asdf-jx?tab=readme-ov-file#install
binlist:
- jx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
