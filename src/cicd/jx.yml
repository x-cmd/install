lang: Go
homepage: https://github.com/jenkins-x/jx
license: Apache-2.0
desc:
  cn: Jenkins X 为云上的开发人员自动化并加速持续集成和持续交付，以便他们可以专注于构建出色的软件
  en: Jenkins X automates and accelerates Continuous Integration and Continuous Delivery for developers on the cloud, so they can focus on building awesome software
  cs: Jenkins X automatizuje a urychluje Continuous Integration a Continuous Delivery pro vývojáře v cloudu, takže se mohou soustředit na tvorbu skvělého softwaru
  de: Jenkins X automatisiert und beschleunigt Continuous Integration und Continuous Delivery für Entwickler in der Cloud, damit sie sich auf die Entwicklung ausgezeichneter Software konzentrieren können
  es: Jenkins X automatiza y acelera la Integración Continua y la Entrega Continua para los desarrolladores en la nube, para que puedan centrarse en crear software excelente
  fr: Jenkins X automatise et accélère l'Intégration Continue et la Livraison Continue pour les développeurs dans le cloud, afin qu'ils puissent se concentrer sur la création de logiciels de qualité
  id: Jenkins X mengotomasi dan mempercepat Integrasi Berkelanjutan dan Pengiriman Berkelanjutan bagi pengembang di cloud, sehingga mereka dapat berfokus membangun perangkat lunak yang luar biasa
  it: Jenkins X automatizza e accelera l'integrazione continua e la consegna continua per gli sviluppatori nel cloud, così possono concentrarsi sulla creazione di software eccellenti
  ja: Jenkins X はクラウド上の開発者向けに継続的インテグレーションと継続的デリバリーを自動化し加速させるので、開発者は優れたソフトウェアの構築に集中できます
  ko: Jenkins X는 클라우드에서 개발자를 위해 지속적 통합과 지속적 전달을 자동화하고 가속화하여 훌륭한 소프트웨어 개발에 집중할 수 있게 합니다
  pl: Jenkins X automatyzuje i przyspiesza ciągłą integrację i ciągłe dostarczanie dla deweloperów w chmurze, dzięki czemu mogą skupić się na tworzeniu świetnego oprogramowania
  pt: O Jenkins X automatiza e acelera a Integração Contínua e a Entrega Contínua para desenvolvedores na nuvem, para que eles possam se concentrar em criar software excelente
  ro: Jenkins X automatizează și accelerează integrarea continuă și livrările continue pentru dezvoltatorii din cloud, astfel încât aceștia să se poată concentra pe dezvoltarea de software de calitate
  ru: Jenkins X автоматизирует и ускоряет непрерывную интеграцию и непрерывную доставку для разработчиков в облаке, чтобы они могли сосредоточиться на создании отличного программного обеспечения
  th: Jenkins X ทำให้การรวมแบบต่อเนื่องและการส่งมอบแบบต่อเนื่องสำหรับนักพัฒนาในคลาวด์เป็นอัตโนมัติและเร็วขึ้น เพื่อให้พวกเขาโฟกัสกับการสร้างซอฟต์แวร์ที่ยอดเยี่ยม
  tr: Jenkins X, bulut üzerinde çalışan geliştiriciler için Sürekli Entegrasyon ve Sürekli Teslimatı otomatikleştirir ve hızlandırır, böylece geliştiriciler harika yazılımlar geliştirmeye odaklanabilir
  uk: Jenkins X автоматизує та пришвидшує безперервну інтеграцію та безперервну доставку для розробників у хмарі, щоб вони могли зосередитися на створенні чудового програмного забезпечення
  vi: Jenkins X tự động hóa và tăng tốc Tích hợp liên tục và Triển khai liên tục cho các nhà phát triển trên đám mây, giúp họ tập trung xây dựng phần mềm tuyệt vời
x:
  source: https://github.com/jenkins-x/jx
  eget: jenkins-x/jx
  asdf: jx
rule:
  /eget:
    cmd: x eget jenkins-x/jx
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use jx
    reference: https://github.com/vbehar/asdf-jx?tab=readme-ov-file#install
binlist:
- jx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 31 MB
          rating: 2
          desc:
            cn: 安装 31 MB
            en: 31 MB install
        download:
          estimate: 31 MB
          desc:
            cn: 约 31 MB 下载 (linux/x64)
            en: ~31 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
