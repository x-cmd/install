lang: 'Rust'
homepage: 'https://github.com/bahdotsh/wrkflw'
license: 'MIT'
desc:
  cn: 本地验证并运行 GitHub Actions
  en: 'Validate and Run GitHub Actions locally.'
x:
  source: https://github.com/bahdotsh/wrkflw
  eget: https://github.com/bahdotsh/wrkflw
rule:
  /eget:
    cmd: x eget bahdotsh/wrkflw
    reference: https://github.com/bahdotsh/wrkflw
binlist:
- 'wrkflw'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
