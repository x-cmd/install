lang: 'Rust'
homepage: 'https://github.com/bahdotsh/wrkflw'
license: 'MIT'
desc:
  cn: 本地验证并运行 GitHub Actions
  en: 'Validate and Run GitHub Actions locally.'
x:
  source: https://github.com/bahdotsh/wrkflw
  eget: https://github.com/bahdotsh/wrkflw
rule:
  /eget:
    cmd: x eget bahdotsh/wrkflw
    reference: https://github.com/bahdotsh/wrkflw
binlist:
  - 'wrkflw'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
