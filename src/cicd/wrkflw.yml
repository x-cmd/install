lang: 'Rust'
homepage: 'https://github.com/bahdotsh/wrkflw'
license: 'MIT'
desc:
  cn: 本地验证并运行 GitHub Actions
  en: 'Validate and Run GitHub Actions locally.'
  cs: Validovat a spouštět GitHub Actions lokálně.
  de: GitHub Actions lokal validieren und ausführen.
  es: Validar y ejecutar GitHub Actions de forma local.
  fr: Valider et exécuter GitHub Actions localement.
  id: Validasi dan jalankan GitHub Actions secara lokal.
  it: Valida ed esegui GitHub Actions localmente.
  ja: GitHub Actions をローカルで検証して実行する。
  ko: GitHub Actions를 로컬에서 검증하고 실행합니다.
  pl: Waliduj i uruchamiaj GitHub Actions lokalnie.
  pt: Validar e executar o GitHub Actions localmente.
  ro: Validează și rulează GitHub Actions local.
  ru: Проверять и запускать GitHub Actions локально.
  th: ตรวจสอบและเรียกใช้ GitHub Actions ในเครื่อง
  tr: GitHub Actions işlemlerini yerel olarak doğrulayın ve çalıştırın.
  uk: Валідувати та запускати GitHub Actions локально.
  vi: Kiểm tra và chạy GitHub Actions cục bộ.
x:
  source: https://github.com/bahdotsh/wrkflw
  eget: bahdotsh/wrkflw
rule:
  /eget:
    cmd: x eget bahdotsh/wrkflw
    reference: https://github.com/bahdotsh/wrkflw
binlist:
- 'wrkflw'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
