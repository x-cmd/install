lang: TypeScript
homepage: https://github.com/fluentci-io/fluentci
license: MPL-2.0
desc:
  en: Fluent CI is a CI/CD tool that allows you to build, test, and deploy your code
  cn: FluentCI 是一个 CI/CD 工具，允许您构建、测试和部署代码
  cs: Fluent CI je nástroj CI/CD, který vám umožňuje sestavovat, testovat a nasazovat váš kód
  de: Fluent CI ist ein CI/CD-Werkzeug, mit dem Sie Ihren Code bauen, testen und bereitstellen können
  es: Fluent CI es una herramienta de CI/CD que le permite compilar, probar y desplegar su código
  fr: Fluent CI est un outil CI/CD qui vous permet de build, tester et déployer votre code
  id: Fluent CI adalah alat CI/CD yang memungkinkan Anda membangun, menguji, dan men-deploy kode Anda
  it: Fluent CI è uno strumento CI/CD che ti consente di compilare, testare e distribuire il tuo codice
  ja: Fluent CI は、コードのビルド、テスト、デプロイを行うことを可能にする CI/CD ツールです
  ko: Fluent CI는 코드를 빌드, 테스트 및 배포할 수 있게 해주는 CI/CD 도구입니다
  pl: Fluent CI to narzędzie CI/CD, które pozwala budować, testować i wdrażać kod
  pt: Fluent CI é uma ferramenta de CI/CD que permite compilar, testar e implantar seu código
  ro: Fluent CI este un instrument CI/CD care vă permite să construiți, testați și să deployați codul
  ru: Fluent CI — это инструмент CI/CD, позволяющий собирать, тестировать и разворачивать ваш код
  th: Fluent CI คือเครื่องมือ CI/CD ที่ให้คุณสร้าง ทดสอบ และปล่อยใช้โค้ดของคุณ
  tr: Fluent CI, kodunuzu derlemenize, test etmenize ve dağıtmanıza olanak tanıyan bir CI/CD aracıdır
  uk: Fluent CI — це інструмент CI/CD, який дає змогу збирати, тестувати та розгортати ваш код
  vi: Fluent CI là công cụ CI/CD cho phép bạn build, test và triển khai mã của mình
x:
  source: https://github.com/fluentci-io/fluentci
  eget: fluentci-io/fluentci
  brew: fluentci-io/tap/cli
  yay: fluentci
rule:
  /eget:
    cmd: x eget fluentci-io/fluentci
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install fluentci-io/tap/cli
    reference: https://github.com/fluentci-io/fluentci?tab=readme-ov-file#-installation
  arch/yay:
    cmd: yay -S fluentci
    reference: https://aur.archlinux.org/packages/fluentci
  /deno:
    cmd: deno install -A -r https://cli.fluentci.io -n fluentci
    reference: https://github.com/fluentci-io/fluentci?tab=readme-ov-file#-installation
  /pkgx:
    cmd: pkgx install fluentci
    reference: https://github.com/fluentci-io/fluentci?tab=readme-ov-file#-installation
  /nix:
    cmd: nix profile install --experimental-features "nix-command flakes" github:fluentci-io/fluentci
    reference: https://github.com/fluentci-io/fluentci?tab=readme-ov-file#-installation
binlist:
- fluentci

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 40 MB
          rating: 2
          desc:
            cn: 安装 40 MB
            en: 40 MB install
        download:
          estimate: 40 MB
          desc:
            cn: 约 40 MB 下载 (linux/x64)
            en: ~40 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
