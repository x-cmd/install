lang: Go
homepage: https://github.com/CircleCI-Public/circleci-cli
license: MIT
desc:
  cn: circleci 是 CircleCI 的控制台应用
  en: circleci is CircleCI's command-line application
x:
  source: https://github.com/CircleCI-Public/circleci-cli
  eget: CircleCI-Public/circleci-cli
  brew: circleci
  snap: circleci
  choco: circleci-cli
  yay: circleci-cli-bin
rule:
  /eget:
    cmd: x eget CircleCI-Public/circleci-cli
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh | bash
    reference: https://github.com/CircleCI-Public/circleci-cli?tab=readme-ov-file#install-script
  arch/yay:
    cmd: yay -S circleci-cli-bin
    reference: https://aur.archlinux.org/packages/circleci-cli-bin
  darwin/brew:
    cmd: brew install circleci
    reference: https://github.com/CircleCI-Public/circleci-cli?tab=readme-ov-file#homebrew
  /snap:
    cmd: sudo snap install circleci
    reference: https://github.com/CircleCI-Public/circleci-cli?tab=readme-ov-file#snap
  (win|wsl2)/choco:
    cmd: x choco install circleci-cli -y
    reference: https://github.com/CircleCI-Public/circleci-cli?tab=readme-ov-file#chocolatey
binlist:
- circleci

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
