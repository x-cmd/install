lang: Rust
homepage: https://smolmachines.com
license: Apache-2.0

desc:
  cn: 可移植、轻量、自包含的虚拟机，用于在本地以硬件隔离方式运行 Linux 工作负载
  en: Portable, lightweight, self-contained virtual machine for running Linux workloads locally with hardware isolation

x:
  source: https://github.com/smol-machines/smolvm
  eget: https://github.com/smol-machines/smolvm
rule:
  /eget:
    cmd: x eget smol-machines/smolvm
    reference: https://github.com/smol-machines/smolvm/releases
  /curl:
    cmd: curl -sSL https://smolmachines.com/install.sh | bash
    reference: https://github.com/smol-machines/smolvm?tab=readme-ov-file#install

binlist:
  - smolvm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取镜像与配置文件
          en: Reads images and config files
        sensitive: []
      write:
        desc:
          cn: 写入 VM 镜像与运行时状态
          en: Writes VM images and runtime state
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
