lang: Rust
homepage: https://github.com/superradcompany/microsandbox
license: Apache-2.0

desc:
  cn: 简单、快速、本地化的微型虚拟机，适用于不受信任的工作负载
  en: easy, fast, local microVMs for untrusted workloads
  cs: snadné, rychlé a lokální microVM pro nedůvěryhodné pracovní zatížení
  de: einfache, schnelle, lokale MicroVMs für nicht vertrauenswürdige Workloads
  es: microVMs fáciles, rápidas y locales para cargas de trabajo no confiables
  fr: des microVM simples, rapides et locales pour les charges de travail non fiables
  id: microVM yang mudah, cepat, dan lokal untuk beban kerja yang tidak tepercaya
  it: microVM semplici, veloci e locali per carichi di lavoro non attendibili
  ja: 信頼できないワークロード向けの、簡単かつ高速なローカルマイクロVM
  ko: 신뢰할 수 없는 워크로드 위한 간단하고 빠른 로컬 microVM
  pl: łatwe, szybkie i lokalne microVM dla niezaufanych obciążeń roboczych
  pt: microVMs fáceis, rápidos e locais para cargas de trabalho não confiáveis
  ro: microVM-uri simple, rapide și locale pentru sarcini de lucru neîncrezute
  ru: простые, быстрые локальные microVM для недоверенных рабочих нагрузок
  th: microVM ที่ใช้งานง่าย เร็ว และเป็นแบบ local สำหรับเวิร์กโหลดที่ไม่น่าเชื่อถือ
  tr: güvenilmeyen iş yükleri için kolay, hızlı, yerel microVM'ler
  uk: прості, швидкі локальні microVM для недовірених робочих навантажень
  vi: microVM dễ dùng, nhanh và cục bộ cho các tác vụ không tin cậy

x:
  source: https://github.com/superradcompany/microsandbox
  eget: superradcompany/microsandbox
  brew: superradcompany/tap/microsandbox
  cargo: microsandbox
rule:
  /eget:
    cmd: x eget superradcompany/microsandbox
    reference: https://github.com/superradcompany/microsandbox/releases
  /curl:
    cmd: curl -fsSL https://install.microsandbox.dev | sh
    reference: https://github.com/superradcompany/microsandbox?tab=readme-ov-file#install-the-cli
  /cargo:
    cmd: cargo install microsandbox
    reference: https://github.com/superradcompany/microsandbox?tab=readme-ov-file#install-the-cli
  /npm:
    cmd: npm i -g microsandbox
    reference: https://github.com/superradcompany/microsandbox?tab=readme-ov-file#install-the-cli
  /uv:
    cmd: uv tool install microsandbox
    reference: https://github.com/superradcompany/microsandbox?tab=readme-ov-file#install-the-cli
  darwin/brew:
    cmd: brew install superradcompany/tap/microsandbox
    reference: https://github.com/superradcompany/homebrew-tap
  win/powershell:
    cmd: x pwsh 'irm https://install.microsandbox.dev/windows | iex'
    reference: https://github.com/superradcompany/microsandbox?tab=readme-ov-file#install-the-cli

binlist:
  - msb

footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 OCI 镜像缓存与配置文件
          en: Reads OCI image cache and config files
        sensitive: []
      write:
        desc:
          cn: 写入 microVM 镜像、根文件系统与运行时状态（默认位于 ~/.microsandbox/）
          en: Writes microVM images, root filesystems and runtime state under ~/.microsandbox/
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 2
          desc:
            cn: 安装约 50 MB
            en: ~50 MB install
      paths:
        data: ['~/.microsandbox/']
        config: ['~/.microsandbox/config.json']
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 约 80 MB 空闲（不含启动后的 microVM）
          en: ~80 MB idle (excluding launched microVMs)
    cpu:
      workload: ['compute', 'io']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 启动与拉取镜像时短时峰值较高
          en: Brief spikes during boot or image pull
