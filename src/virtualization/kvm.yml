lang: C
homepage: https://github.com/qemu/qemu
desc:
  en: KVM (for Kernel-based Virtual Machine) is a full virtualization
  cn: KVM (Kernel-based Virtual Machine)是一种完全虚拟化
x:
  source: https://github.com/qemu/qemu
rule:
  debian/apt:
    cmd: sudo apt-get install qemu-kvm
    reference: https://command-not-found.com/kvm
    dsnap: qemu-kvm
  ubuntu/apt:
    cmd: sudo apt-get install qemu-kvm
    reference: https://command-not-found.com/kvm
    dsnap: qemu-kvm
  kali/apt:
    cmd: sudo apt-get install qemu-kvm
    reference: https://command-not-found.com/kvm
    dsnap: qemu-kvm
  centos/yum:
    cmd: sudo yum install qemu-kvm
    reference: https://www.qemu.org/download/#linux
  fedora/dnf:
    cmd: sudo dnf install qemu-kvm
    reference: https://www.qemu.org/download/#linux
    dsnap: qemu-kvm
binlist:
- kvm
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
