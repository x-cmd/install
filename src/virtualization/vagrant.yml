lang: Ruby
homepage: https://github.com/hashicorp/vagrant
desc:
  en: Vagrant is the command line utility for managing the lifecycle of virtual machines
  cn: Vagrant 是用于管理虚拟机生命周期的命令行实用程序
  cs: Vagrant je nástroj příkazového řádku pro správu životního cyklu virtuálních počítačů
  de: Vagrant ist das Kommandozeilenwerkzeug zur Verwaltung des Lebenszyklus virtueller Maschinen
  es: Vagrant es la utilidad de línea de comandos para gestionar el ciclo de vida de las máquinas virtuales
  fr: Vagrant est l'utilitaire en ligne de commande pour gérer le cycle de vie des machines virtuelles
  id: Vagrant adalah utilitas baris perintah untuk mengelola siklus hidup mesin virtual
  it: Vagrant è l'utilità della riga di comando per gestire il ciclo di vita delle macchine virtuali
  ja: Vagrant は仮想マシンのライフサイクルを管理するコマンドラインユーティリティです
  ko: Vagrant는 가상 머신의 수명 주기를 관리하는 명령줄 도구입니다
  pl: Vagrant to narzędzie wiersza poleceń do zarządzania cyklem życia maszyn wirtualnych
  pt: Vagrant é o utilitário de linha de comando para gerenciar o ciclo de vida de máquinas virtuais
  ro: Vagrant este utilitarul de linie de comandă pentru gestionarea ciclului de viață al mașinilor virtuale
  ru: Vagrant — это утилита командной строки для управления жизненным циклом виртуальных машин
  th: Vagrant เป็นเครื่องมือบรรทัดคำสั่งสำหรับจัดการวงจรชีวิตของเครื่องเสมือน
  tr: Vagrant, sanal makinelerin yaşam döngüsünü yönetmek için komut satırı aracıdır
  uk: Vagrant — це утиліта командного рядка для керування життєвим циклом віртуальних машин
  vi: Vagrant là tiện ích dòng lệnh để quản lý vòng đời của máy ảo
x:
  source: https://github.com/hashicorp/vagrant
  apt: vagrant
  dnf: vagrant
  pacman: vagrant
  apt-get: vagrant
  yum: vagrant
  scoop: main/vagrant
  choco: vagrant
  winget: Hashicorp.Vagrant
  yay: vagrant
rule:
  (win|wsl2)/scoop:
    cmd: x scoop install main/vagrant
    reference: https://scoop.sh/#/apps?q=vagrant
  (win|wsl2)/choco:
    cmd: x choco install vagrant
    reference: https://community.chocolatey.org/packages/vagrant
  (win|wsl2)/winget:
    cmd: x winget install Hashicorp.Vagrant
    reference: https://winget.run/pkg/Hashicorp/Vagrant
  darwin/brew:
    cmd: brew install --cask vagrant
    reference: https://formulae.brew.sh/cask/vagrant#default
  debian/apt:
    cmd: sudo apt-get install vagrant
    reference: https://command-not-found.com/vagrant
  ubuntu/apt:
    cmd: sudo apt-get install vagrant
    reference: https://command-not-found.com/vagrant
  arch/pacman:
    cmd: sudo pacman -S vagrant
    reference: https://command-not-found.com/vagrant
  kali/apt:
    cmd: sudo apt-get install vagrant
    reference: https://command-not-found.com/vagrant
    dsnap: vagrant
  centos/yum:
    cmd: sudo yum install vagrant
    reference: https://www.qemu.org/download/#linux
  fedora/dnf:
    cmd: sudo dnf install vagrant
    reference: https://www.qemu.org/download/#linux
  raspbian/apt:
    cmd: sudo apt-get install vagrant
    reference: https://command-not-found.com/vagrant
  arch/yay:
    cmd: yay -S vagrant
    reference: https://aur.archlinux.org/packages/vagrant
binlist:
- vagrant
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: partial
    linux: partial
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 243 KB
          rating: 1
          desc:
            cn: 约 243 KB（估算）
            en: ~243 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
