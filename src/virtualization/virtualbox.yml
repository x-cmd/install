lang: C
homepage: https://www.virtualbox.org/wiki/Contributor_information
desc:
  cn: VirtualBox 是一款开源虚拟机软件
  en: VirtualBox is an open-source virtual machine software
rule:
  darwin/brew:
    cmd: brew install --cask virtualbox
    reference: https://formulae.brew.sh/cask/virtualbox#default
  (win|wsl2)/scoop:
    cmd: x scoop bucket add nonportable && x scoop install extras/portable-virtualbox
    reference: https://scoop.sh/#/apps?q=virtualbox
  (win|wsl2)/choco:
    cmd: x choco install virtualbox
    reference: https://community.chocolatey.org/packages/virtualbox
  (win|wsl2)/winget:
    cmd: x winget install Oracle.VirtualBox
    reference: https://winstall.app/apps/Oracle.VirtualBox
  ubuntu/apt:
    cmd: sudo apt-get install virtualbox-qt
    reference: https://command-not-found.com/VirtualBox
    dsnap: virtualbox-qt
  debian/apt:
    cmd: sudo apt-get install virtualbox-qt
    reference: https://command-not-found.com/VirtualBox
    dsnap: virtualbox-qt
  arch/pacman:
    cmd: sudo pacman -S virtualbox
    reference: https://command-not-found.com/VirtualBox
  kali/apt:
    cmd: sudo apt-get install virtualbox-qt
    reference: https://command-not-found.com/VirtualBox
    dsnap: virtualbox-qt
  opensuse/zypper:
    cmd: sudo zypper in virtualbox
    reference: https://zh.opensuse.org/Virtualbox
  arch/yay:
    cmd: yay -S virtualbox-bin
    reference: https://aur.archlinux.org/packages/virtualbox-bin
binlist:
- virtualbox
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
