lang: C
homepage: https://www.virtualbox.org/wiki/Contributor_information
desc:
  cn: VirtualBox 是一款开源虚拟机软件
  en: VirtualBox is an open-source virtual machine software
  cs: VirtualBox je open-source software pro virtuální počítače
  de: VirtualBox ist eine Open-Source-Virtualisierungsoftware
  es: VirtualBox es un software de máquina virtual de código abierto
  fr: VirtualBox est un logiciel de machine virtuelle open source
  id: VirtualBox adalah perangkat lunak mesin virtual sumber terbuka
  it: VirtualBox è un software per macchine virtuali open source
  ja: VirtualBox はオープンソースの仮想マシンソフトウェアです
  ko: VirtualBox는 오픈 소스 가상 머신 소프트웨어입니다
  pl: VirtualBox to oprogramowanie do maszyn wirtualnych o otwartym kodzie źródłowym
  pt: VirtualBox é um software de máquina virtual de código aberto
  ro: VirtualBox este un software de mașină virtuală cu cod sursă deschis
  ru: VirtualBox — это программное обеспечение для виртуальных машин с открытым исходным кодом
  th: VirtualBox คือซอฟต์แวร์เครื่องเสมือนโอเพนซอร์ส
  tr: VirtualBox açık kaynaklı bir sanal makine yazılımıdır
  uk: VirtualBox — це програмне забезпечення для віртуальних машин з відкритим кодом
  vi: VirtualBox là phần mềm máy ảo mã nguồn mở
rule:
  darwin/brew:
    cmd: brew install --cask virtualbox
    reference: https://formulae.brew.sh/cask/virtualbox#default
  (win|wsl2)/scoop:
    cmd: x scoop bucket add nonportable && x scoop install extras/portable-virtualbox
    reference: https://scoop.sh/#/apps?q=virtualbox
  (win|wsl2)/choco:
    cmd: x choco install virtualbox
    reference: https://community.chocolatey.org/packages/virtualbox
  (win|wsl2)/winget:
    cmd: x winget install Oracle.VirtualBox
    reference: https://winstall.app/apps/Oracle.VirtualBox
  ubuntu/apt:
    cmd: sudo apt-get install virtualbox-qt
    reference: https://command-not-found.com/VirtualBox
    dsnap: virtualbox-qt
  debian/apt:
    cmd: sudo apt-get install virtualbox-qt
    reference: https://command-not-found.com/VirtualBox
    dsnap: virtualbox-qt
  arch/pacman:
    cmd: sudo pacman -S virtualbox
    reference: https://command-not-found.com/VirtualBox
  kali/apt:
    cmd: sudo apt-get install virtualbox-qt
    reference: https://command-not-found.com/VirtualBox
    dsnap: virtualbox-qt
  opensuse/zypper:
    cmd: sudo zypper in virtualbox
    reference: https://zh.opensuse.org/Virtualbox
  arch/yay:
    cmd: yay -S virtualbox-bin
    reference: https://aur.archlinux.org/packages/virtualbox-bin

x:
  apt: virtualbox-qt
  apt-get: virtualbox-qt
  zypper: virtualbox
  pacman: virtualbox
  scoop: extras/portable-virtualbox
  choco: virtualbox
  winget: Oracle.VirtualBox
  yay: virtualbox-bin
binlist:
- virtualbox
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
