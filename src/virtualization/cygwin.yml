lang: C
homepage: https://cygwin.com/git/cygwin-apps.git
desc:
  cn: Cygwin 是 GNU 和开源工具的大型集合，它们提供类似于 Windows 上的 Linux 发行版的功能
  en: Cygwin is a large collection of GNU and Open Source tools which provide functionality similar to a Linux distribution on Windows
rule:
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://www.cygwin.com/setup-x86_64.exe -OutFile setup-x86_64.exe
    reference: https://www.cygwin.com/install.html
binlist:
- cygwin
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
