lang: C
homepage: https://github.com/qemu/qemu
desc:
  en: A generic and open source machine emulator and virtualizer
  cn: 一个通用的开源机器模拟器和虚拟化器
x:
  source: https://github.com/qemu/qemu
rule:
  darwin/brew:
    cmd: brew install qemu
    reference: https://formulae.brew.sh/formula/qemu#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install qemu
    reference: https://www.qemu.org/download/#macos
  arch/pacman:
    cmd: sudo pacman -S qemu
    reference: https://www.qemu.org/download/#linux
  centos/yum:
    cmd: sudo yum install qemu-kvm
    reference: https://www.qemu.org/download/#linux
  debian/apt:
    cmd: sudo apt-get install qemu-system
    reference: https://www.qemu.org/download/#linux
    dsnap: qemu-system
  ubuntu/apt:
    cmd: sudo apt-get install qemu-system
    reference: https://www.qemu.org/download/#linux
    dsnap: qemu-system
  fedora/dnf:
    cmd: sudo dnf install @virtualization
    reference: https://www.qemu.org/download/#linux
    dsnap: qemu
  gentoo/emerge:
    cmd: sudo emerge --ask app-emulation/qemu
    reference: https://www.qemu.org/download/#linux
  opensuse/zypper:
    cmd: sudo zypper install qemu
    reference: https://www.qemu.org/download/#linux
  raspbian/apt:
    cmd: sudo apt-get install qemu-system
    reference: https://www.qemu.org/download/#linux
  rhel/yum:
    cmd: sudo yum install qemu-kvm
    reference: https://www.qemu.org/download/#linux
  win/msys2:
    cmd: sudo pacman -S mingw-w64-x86_64-qemu
    reference: https://www.qemu.org/download/#windows
  arch/yay:
    cmd: yay -S qemu-git
    reference: https://aur.archlinux.org/packages/qemu-git
binlist:
- qemu
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
