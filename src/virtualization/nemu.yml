lang: C
homepage: https://github.com/nemuTUI/nemu
license: BSD-2-Clause
desc:
  en: Ncurses UI for QEMU
  cn: QEMU 的 Ncurses UI
  cs: Ncurses UI pro QEMU
  de: Ncurses-UI für QEMU
  es: Interfaz de usuario Ncurses para QEMU
  fr: Interface utilisateur Ncurses pour QEMU
  id: Antarmuka Ncurses untuk QEMU
  it: Interfaccia utente Ncurses per QEMU
  ja: QEMU の Ncurses UI
  ko: QEMU를 위한 Ncurses UI
  pl: Interfejs Ncurses dla QEMU
  pt: Interface de usuário Ncurses para QEMU
  ro: Interfață Ncurses pentru QEMU
  ru: Ncurses UI для QEMU
  th: ส่วนติดต่อผู้ใช้ Ncurses สำหรับ QEMU
  tr: QEMU için Ncurses arayüzü
  uk: Ncurses UI для QEMU
  vi: Giao diện Ncurses cho QEMU
x:
  source: https://github.com/nemuTUI/nemu
  brew: nemu
  apk: nemu
  yay: nemu
rule:
  alpine/apk:
    cmd: apk add nemu
    reference: https://github.com/nemuTUI/nemu?tab=readme-ov-file#packages
    dsnap: nemu
  freebsd/pkg:
    cmd: pkg install nemu
    reference: https://github.com/nemuTUI/nemu?tab=readme-ov-file#packages
  darwin/brew:
    cmd: brew install nemu
    reference: https://github.com/nemuTUI/nemu?tab=readme-ov-file#packages
  arch/yay:
    cmd: yay -S nemu
    reference: https://aur.archlinux.org/packages/nemu
binlist:
- nemu

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 771 KB
          rating: 1
          desc:
            cn: 约 771 KB（估算）
            en: ~771 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
