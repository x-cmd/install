lang: C
homepage: https://github.com/nemuTUI/nemu
license: BSD-2-Clause
desc:
  en: Ncurses UI for QEMU
  cn: QEMU 的 Ncurses UI
x:
  source: https://github.com/nemuTUI/nemu
rule:
  alpine/apk:
    cmd: apk add nemu
    reference: https://github.com/nemuTUI/nemu?tab=readme-ov-file#packages
    dsnap: nemu
  freebsd/pkg:
    cmd: pkg install nemu
    reference: https://github.com/nemuTUI/nemu?tab=readme-ov-file#packages
  darwin/brew:
    cmd: brew install nemu
    reference: https://github.com/nemuTUI/nemu?tab=readme-ov-file#packages
  arch/yay:
    cmd: yay -S nemu
    reference: https://aur.archlinux.org/packages/nemu
binlist:
- nemu

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
