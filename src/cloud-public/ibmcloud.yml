lang: Go
homepage: https://github.com/IBM-Cloud/ibm-cloud-cli-release
license: Apache-2.0
desc:
  cn: IBM Cloud 的命令行客户端
  en: This is the command line client for IBM Cloud
  cs: Toto je klient příkazové řádky pro IBM Cloud
  de: Dies ist der Befehlszeilen-Client für IBM Cloud
  es: Este es el cliente de línea de comandos de IBM Cloud
  fr: Il s'agit du client de ligne de commande pour IBM Cloud
  id: Ini adalah klien baris perintah untuk IBM Cloud
  it: Questo è il client a riga di comando per IBM Cloud
  ja: これは IBM Cloud のコマンドラインクライアントです
  ko: 이것은 IBM Cloud용 명령줄 클라이언트입니다
  pl: To jest klient wiersza poleceń dla IBM Cloud
  pt: Este é o cliente de linha de comando do IBM Cloud
  ro: Acesta este clientul de linie de comandă pentru IBM Cloud
  ru: Это клиент командной строки для IBM Cloud
  th: นี่คือไคลเอนต์บรรทัดคำสั่งสำหรับ IBM Cloud
  tr: IBM Cloud için komut satırı istemcisidir
  uk: Це клієнт командного рядка для IBM Cloud
  vi: Đây là client dòng lệnh cho IBM Cloud
x:
  source: https://github.com/IBM-Cloud/ibm-cloud-cli-release
  yay: ibmcloud-cli
  asdf: ibmcloud
rule:
  /x:
    cmd: x pkg use ibmcloud
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use ibmcloud
    reference: https://github.com/triangletodd/asdf-ibmcloud
  arch/yay:
    cmd: yay -S ibmcloud-cli
    reference: https://aur.archlinux.org/packages/ibmcloud-cli
  darwin/curl:
    cmd: curl -fsSL https://clis.cloud.ibm.com/install/osx | sh
    reference: https://cloud.ibm.com/docs/cli?topic=cli-install-ibmcloud-cli#shell_install
  linux/curl:
    cmd: curl -fsSL https://clis.cloud.ibm.com/install/osx | sh
    reference: https://cloud.ibm.com/docs/cli?topic=cli-install-ibmcloud-cli#shell_install
  win/powershell:
    cmd: x pwsh iex (New-Object Net.WebClient).DownloadString('https://clis.cloud.ibm.com/install/powershell')
    reference: https://cloud.ibm.com/docs/cli?topic=cli-install-ibmcloud-cli#shell_install
binlist:
- ibmcloud

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
