lang: Python
homepage: https://github.com/ovh/ovh-cli
desc:
  cn: OVH 命令行界面
  en: OVH command line interface
x:
  source: https://github.com/ovh/ovh-cli
rule:
  /pip:
    cmd: pip install ovhcli
    reference: https://github.com/ovh/ovh-cli?tab=readme-ov-file#installation
    dsnap: ovhcli
  /git:
    cmd: pip install -e git+https://github.com/ovh/ovh-cli.git#egg=ovh-cli
    reference: https://github.com/ovh/ovh-cli?tab=readme-ov-file#installation
binlist:
- ovhcli
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
