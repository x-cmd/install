lang: Python
homepage: https://github.com/ovh/ovh-cli
desc:
  cn: OVH 命令行界面
  en: OVH command line interface
  cs: Příkazové rozhraní OVH
  de: OVH Befehlszeilenschnittstelle
  es: Interfaz de línea de comandos de OVH
  fr: Interface de ligne de commande OVH
  id: Antarmuka baris perintah OVH
  it: Interfaccia a riga di comando di OVH
  ja: OVH コマンドラインインターフェース
  ko: OVH 명령줄 인터페이스
  pl: Interfejs wiersza poleceń OVH
  pt: Interface de linha de comando da OVH
  ro: Interfață de linie de comandă OVH
  ru: Интерфейс командной строки OVH
  th: อินเทอร์เฟซบรรทัดคำสั่งของ OVH
  tr: OVH komut satırı arayüzü
  uk: Інтерфейс командного рядка OVH
  vi: Giao diện dòng lệnh của OVH
x:
  source: https://github.com/ovh/ovh-cli
  pip: ovhcli
rule:
  /pip:
    cmd: pip install ovhcli
    reference: https://github.com/ovh/ovh-cli?tab=readme-ov-file#installation
    dsnap: ovhcli
  /git:
    cmd: pip install -e git+https://github.com/ovh/ovh-cli.git#egg=ovh-cli
    reference: https://github.com/ovh/ovh-cli?tab=readme-ov-file#installation
binlist:
- ovhcli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
