lang: Go
homepage: https://github.com/hetznercloud/cli
license: MIT
desc:
  cn: hcloud 是用于与 Hetzner Cloud 交互的命令行工具。
  en: hcloud is a command-line interface for interacting with Hetzner Cloud.
x:
  pkg:
    exist: true
  source: https://github.com/hetznercloud/cli
  eget: https://github.com/hetznercloud/cli
rule:
  /x:
    cmd: x pkg use hcloud
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget hetznercloud/cli
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use hcloud
    reference: https://github.com/chessmango/asdf-hcloud
  darwin/brew:
    cmd: brew install hcloud
    reference: https://github.com/hetznercloud/cli?tab=readme-ov-file#installation
  ubuntu/apt:
    cmd: sudo apt-get install hcloud-cli
    reference: https://packages.ubuntu.com/source/focal/hcloud-cli
  (win|wsl2)/scoop:
    cmd: x scoop install hcloud
    reference: https://scoop.sh/#/apps?q=hcloud
binlist:
- hcloud

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
