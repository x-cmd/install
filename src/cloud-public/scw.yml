lang: Go
desc:
  cn: Scaleway CLI 是一款帮助您直接从终端试用 Scaleway 基础设施的工具
  en: Scaleway CLI is a tool to help you pilot your Scaleway infrastructure directly from your terminal
  cs: Scaleway CLI je nástroj, který vám pomůže přímo z terminálu pilotovat svou infrastrukturu Scaleway
  de: Die Scaleway CLI ist ein Werkzeug, mit dem Sie Ihre Scaleway-Infrastruktur direkt vom Terminal aus steuern können
  es: Scaleway CLI es una herramienta que te ayuda a pilotar tu infraestructura de Scaleway directamente desde tu terminal
  fr: Scaleway CLI est un outil qui vous aide à piloter votre infrastructure Scaleway directement depuis votre terminal
  id: Scaleway CLI adalah alat untuk membantu Anda mengelola infrastruktur Scaleway langsung dari terminal Anda
  it: Scaleway CLI è uno strumento che ti aiuta a gestire la tua infrastruttura Scaleway direttamente dal terminale
  ja: Scaleway CLI は、ターミナルから直接 Scaleway のインフラを操作するためのツールです
  ko: Scaleway CLI는 터미널에서 직접 Scaleway 인프라를 운영할 수 있도록 돕는 도구입니다
  pl: Scaleway CLI to narzędzie, które pomaga zarządzać infrastrukturą Scaleway bezpośrednio z terminala
  pt: O Scaleway CLI é uma ferramenta que ajuda você a pilotar sua infraestrutura Scaleway diretamente do terminal
  ro: Scaleway CLI este un instrument care vă ajută să vă controlați infrastructura Scaleway direct din terminal
  ru: Scaleway CLI — это инструмент, который помогает управлять инфраструктурой Scaleway прямо из терминала
  th: Scaleway CLI เป็นเครื่องมือที่ช่วยคุณควบคุมโครงสร้างพื้นฐาน Scaleway ได้โดยตรงจากเทอร์มินัล
  tr: Scaleway CLI, Scaleway altyapınızı doğrudan terminalden yönetmenize yardımcı olan bir araçtır
  uk: Scaleway CLI — це інструмент, який допомагає керувати інфраструктурою Scaleway безпосередньо з терміналу
  vi: Scaleway CLI là công cụ giúp bạn điều hành hạ tầng Scaleway trực tiếp từ terminal
homepage: https://github.com/scaleway/scaleway-cli
license: Apache-2.0
x:
  source: https://github.com/scaleway/scaleway-cli
  eget: scaleway/scaleway-cli
  brew: scw
  pacman: scaleway-cli
  choco: scaleway-cli
rule:
  /x:
    cmd: x pkg use scw
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget scaleway/scaleway-cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install scw
    reference: https://github.com/scaleway/scaleway-cli?tab=readme-ov-file#homebrew
  arch/pacman:
    cmd: sudo pacman -S scaleway-cli
    reference: https://github.com/scaleway/scaleway-cli?tab=readme-ov-file#arch-linux
  (win|wsl2)/choco:
    cmd: x choco install scaleway-cli
    reference: https://github.com/scaleway/scaleway-cli?tab=readme-ov-file#chocolatey
  /curl:
    cmd: curl -s https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh
    reference: https://github.com/scaleway/scaleway-cli?tab=readme-ov-file#linux
binlist:
- scw

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
