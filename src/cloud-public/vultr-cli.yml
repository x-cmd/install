lang: Go
homepage: https://github.com/vultr/vultr-cli
license: Apache-2.0
desc:
  cn: Vultr 服务的官方命令行工具
  en: Official command line tool for Vultr services
  cs: Oficiální nástroj příkazové řádky pro služby Vultr
  de: Offizielles Kommandozeilen-Werkzeug für Vultr-Dienste
  es: Herramienta de línea de comandos oficial para los servicios de Vultr
  fr: Outil en ligne de commande officiel pour les services Vultr
  id: Alat baris perintah resmi untuk layanan Vultr
  it: Strumento a riga di comando ufficiale per i servizi Vultr
  ja: Vultr サービス用の公式コマンドラインツール
  ko: Vultr 서비스를 위한 공식 명령줄 도구
  pl: Oficjalne narzędzie wiersza poleceń dla usług Vultr
  pt: Ferramenta de linha de comando oficial para os serviços da Vultr
  ro: Instrument oficial de linie de comandă pentru serviciile Vultr
  ru: Официальный инструмент командной строки для сервисов Vultr
  th: เครื่องมือบรรทัดคำสั่งอย่างเป็นทางการสำหรับบริการ Vultr
  tr: Vultr hizmetleri için resmi komut satırı aracı
  uk: Офіційний інструмент командного рядка для сервісів Vultr
  vi: Công cụ dòng lệnh chính thức cho các dịch vụ Vultr
x:
  source: https://github.com/vultr/vultr-cli
  eget: vultr/vultr-cli
  dnf: vultr-cli
  brew: vultr/vultr-cli/vultr-cli
  pacman: vultr-cli
  asdf: vultr-cli
rule:
  /x:
    cmd: x pkg use vultr-cli
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget vultr/vultr-cli
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use vultr-cli
    reference: https://github.com/ikuradon/asdf-vultr-cli
  darwin/brew:
    cmd: brew install vultr/vultr-cli/vultr-cli
    reference: https://formulae.brew.sh/formula/vultr#default
  arch/pacman:
    cmd: sudo pacman -S vultr-cli
    reference: https://github.com/vultr/vultr-cli?tab=readme-ov-file#installing-on-arch-linux
  fedora/dnf:
    cmd: sudo dnf install vultr-cli
    reference: https://github.com/vultr/vultr-cli?tab=readme-ov-file#installing-on-fedora
    dsnap: vultr-cli
  openbsd/pkg_add:
    cmd: pkg_add vultr-cli
    reference: https://github.com/vultr/vultr-cli?tab=readme-ov-file#installing-on-openbsd
binlist:
- vultr-cli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
