lang: Go
desc:
  cn: 用于命令行的 Google Drive 客户端
  en: Google Drive client for command line
homepage: https://github.com/odeke-em/drive
license: Apache-2.0
x:
  pkg:
    exist: true
  source: https://github.com/odeke-em/drive
  eget: https://github.com/odeke-em/drive
rule:
  /x:
    cmd: x pkg use drive
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget odeke-em/drive
    reference: https://x-cmd.com/mod/eget
  fedora/dnf:
    cmd: 'sudo dnf copr enable vaughan/drive-google \

      && sudo dnf install drive-google

      '
    reference: https://github.com/odeke-em/drive/blob/master/platform_packages.md#fedora-distro
    dsnap: drive-google
  arch/yay:
    cmd: yay -S drive-bin
    reference: https://github.com/odeke-em/drive/blob/master/platform_packages.md#arch-linux-or-arch-based-distros
binlist:
- drive

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
