lang: Go
desc:
  cn: 用于命令行的 Google Drive 客户端
  en: Google Drive client for command line
homepage: https://github.com/odeke-em/drive
license: Apache-2.0
x:
  pkg:
    exist: true
  source: https://github.com/odeke-em/drive
  eget: https://github.com/odeke-em/drive
  dnf: drive-google
rule:
  /x:
    cmd: x pkg use drive
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget odeke-em/drive
    reference: https://x-cmd.com/mod/eget
  fedora/dnf:
    cmd: 'sudo dnf copr enable vaughan/drive-google \

      && sudo dnf install drive-google

      '
    reference: https://github.com/odeke-em/drive/blob/master/platform_packages.md#fedora-distro
    dsnap: drive-google
  arch/yay:
    cmd: yay -S drive-bin
    reference: https://github.com/odeke-em/drive/blob/master/platform_packages.md#arch-linux-or-arch-based-distros
binlist:
- drive

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/arm64)
            en: ~15 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
