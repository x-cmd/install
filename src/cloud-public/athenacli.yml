lang: Python
homepage: https://github.com/dbcli/athenacli
license: BSD-3-Clause
desc:
  cn: AthenaCLI 是 AWS Athena 服务的一个 CLI 工具，可以自动补全和语法突显。
  en: AthenaCLI is a CLI tool for AWS Athena service that can do auto-completion and syntax highlighting.
x:
  pkg:
    exist: true
  source: https://github.com/dbcli/athenacli
rule:
  /x:
    cmd: x pkg use athenacli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install athenacli
    reference: https://github.com/dbcli/athenacli#install-via-pip
    dsnap: athenacli
  darwin/brew:
    cmd: brew install athenacli
    reference: https://formulae.brew.sh/formula/athenacli#default
binlist:
- athenacli

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
