lang: Python
homepage: https://github.com/linode/linode-cli
license: BSD-3-Clause
desc:
  cn: Linode 命令行界面
  en: The Linode Command Line Interface
x:
  pkg:
    exist: true
  source: https://github.com/linode/linode-cli
rule:
  /x:
    cmd: x pkg use linode-cli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip3 install linode-cli
    reference: https://github.com/linode/linode-cli?tab=readme-ov-file#install
    dsnap: linode-cli
  arch/yay:
    cmd: yay -S linode-cli
    reference: https://aur.archlinux.org/packages/linode-cli
  darwin/brew:
    cmd: brew install linode-cli
    reference: https://github.com/linode/linode-cli/wiki/Installation#homebrew
binlist:
- linode-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 42 KB
          rating: 1
          desc:
            cn: 约 42 KB（估算）
            en: ~42 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
