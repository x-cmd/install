lang: Python
homepage: https://github.com/linode/linode-cli
license: BSD-3-Clause
desc:
  cn: Linode 命令行界面
  en: The Linode Command Line Interface
  cs: Příkazové rozhraní Linode
  de: Die Linode Command Line Interface
  es: La interfaz de línea de comandos de Linode
  fr: L'interface de ligne de commande Linode
  id: Antarmuka baris perintah Linode
  it: L'interfaccia a riga di comando di Linode
  ja: Linode コマンドラインインターフェース
  ko: Linode 명령줄 인터페이스
  pl: Interfejs wiersza poleceń Linode
  pt: A interface de linha de comando do Linode
  ro: Interfața de linie de comandă Linode
  ru: Интерфейс командной строки Linode
  th: อินเทอร์เฟซบรรทัดคำสั่งของ Linode
  tr: Linode Komut Satırı Arayüzü
  uk: Інтерфейс командного рядка Linode
  vi: Giao diện dòng lệnh của Linode
x:
  source: https://github.com/linode/linode-cli
  brew: linode-cli
  yay: linode-cli
  pip: linode-cli
rule:
  /x:
    cmd: x pkg use linode-cli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip3 install linode-cli
    reference: https://github.com/linode/linode-cli?tab=readme-ov-file#install
    dsnap: linode-cli
  arch/yay:
    cmd: yay -S linode-cli
    reference: https://aur.archlinux.org/packages/linode-cli
  darwin/brew:
    cmd: brew install linode-cli
    reference: https://github.com/linode/linode-cli/wiki/Installation#homebrew
binlist:
- linode-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 42 KB
          rating: 1
          desc:
            cn: 约 42 KB（估算）
            en: ~42 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
