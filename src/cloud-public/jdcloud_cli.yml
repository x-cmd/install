lang: Python
homepage: https://github.com/jdcloud-api/jdcloud-cli
license: Apache-2.0
desc:
  cn: 京东云 CLI
  en: jdcloud CLI
x:
  pkg:
    exist: true
  source: https://github.com/jdcloud-api/jdcloud-cli
rule:
  /x:
    cmd: x pkg use jdcloud_cli
    reference: https://x-cmd.com/install/
  linux/pip:
    cmd: pip install -U jdcloud_cli
    reference: https://github.com/jdcloud-api/jdcloud-cli#linux--mac
  darwin/pip:
    cmd: pip install -U jdcloud_cli
    reference: https://github.com/jdcloud-api/jdcloud-cli#linux--mac
  (win|wsl2)/curl:
    cmd: 'curl https://raw.githubusercontent.com/jdcloud-api/jdcloud-cli/master/jdcloud_cli/resources/jdc.rc > ~/jdc.rc \

      && echo ''source ~/jdc.rc'' >> ~/.bashrc \

      && echo ''export PYTHONIOENCODING="UTF-8"'' >> ~/.bashrc \

      && source ~/.bashrc

      '
    reference: https://github.com/jdcloud-api/jdcloud-cli#windows
binlist:
- jdcloud_cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
