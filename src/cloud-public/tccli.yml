lang: Python
homepage: https://github.com/TencentCloud/tencentcloud-cli
license: Apache-2.0
desc:
  cn: tccli 是管理腾讯云资源的命令行工具
  en: tccli is a command-line tool for managing Tencent Cloud resources
x:
  source: https://github.com/TencentCloud/tencentcloud-cli
  brew: tccli
  pip: tccli
rule:
  /x:
    cmd: x pkg use tccli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install tccli
    reference: https://github.com/TencentCloud/tencentcloud-cli?tab=readme-ov-file#%E5%AE%89%E8%A3%85tccli
    dsnap: tccli
  darwin/brew:
    cmd: 'brew tap tencentcloud/tccli \

      && brew install tccli

      '
    reference: https://github.com/TencentCloud/tencentcloud-cli?tab=readme-ov-file#%E5%AE%89%E8%A3%85tccli
binlist:
- tccli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
