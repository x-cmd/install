lang: Python
homepage: https://github.com/TencentCloud/tencentcloud-cli
license: Apache-2.0
desc:
  cn: tccli 是管理腾讯云资源的命令行工具
  en: tccli is a command-line tool for managing Tencent Cloud resources
x:
  pkg:
    exist: true
  source: https://github.com/TencentCloud/tencentcloud-cli
rule:
  /x:
    cmd: x pkg use tccli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install tccli
    reference: https://github.com/TencentCloud/tencentcloud-cli?tab=readme-ov-file#%E5%AE%89%E8%A3%85tccli
    dsnap: tccli
  darwin/brew:
    cmd: 'brew tap tencentcloud/tccli \

      && brew install tccli

      '
    reference: https://github.com/TencentCloud/tencentcloud-cli?tab=readme-ov-file#%E5%AE%89%E8%A3%85tccli
binlist:
- tccli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
