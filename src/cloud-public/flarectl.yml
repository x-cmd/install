lang: Go
homepage: https://github.com/cloudflare/cloudflare-go
license: Apache-2.0
desc:
  cn: 用于与 Cloudflare 帐户交互的 CLI 应用程序
  en: A CLI application for interacting with a Cloudflare account
  cs: CLI aplikace pro interakci s účtem Cloudflare
  de: Eine CLI-Anwendung zur Interaktion mit einem Cloudflare-Konto
  es: Una aplicación de CLI para interactuar con una cuenta de Cloudflare
  fr: Une application CLI pour interagir avec un compte Cloudflare
  id: Aplikasi CLI untuk berinteraksi dengan akun Cloudflare
  it: Un'applicazione CLI per interagire con un account Cloudflare
  ja: Cloudflare アカウントと対話するための CLI アプリケーション
  ko: Cloudflare 계정과 상호작용하기 위한 CLI 애플리케이션
  pl: Aplikacja CLI do interakcji z kontem Cloudflare
  pt: Um aplicativo de CLI para interagir com uma conta do Cloudflare
  ro: O aplicație CLI pentru interacțiunea cu un cont Cloudflare
  ru: CLI-приложение для взаимодействия с учётной записью Cloudflare
  th: แอปพลิเคชัน CLI สำหรับโต้ตอบกับบัญชี Cloudflare
  tr: Cloudflare hesabıyla etkileşim kurmak için bir CLI uygulaması
  uk: CLI-застосунок для взаємодії з обліковим записом Cloudflare
  vi: Ứng dụng CLI để tương tác với tài khoản Cloudflare
x:
  source: https://github.com/cloudflare/cloudflare-go
  yay: flarectl-bin
  asdf: flarectl
rule:
  /x:
    cmd: x pkg use flarectl
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use flarectl
    reference: https://github.com/ORCID/asdf-flarectl
  arch/yay:
    cmd: yay -S flarectl-bin
    reference: https://aur.archlinux.org/packages/flarectl-bin
  /go:
    cmd: go get github.com/cloudflare/cloudflare-go
    reference: https://github.com/cloudflare/cloudflare-go?tab=readme-ov-file#installation
    dsnap: github.com/cloudflare/cloudflare-go
binlist:
- flarectl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
