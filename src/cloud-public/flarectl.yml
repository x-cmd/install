lang: Go
homepage: https://github.com/cloudflare/cloudflare-go
license: Apache-2.0
desc:
  cn: 用于与 Cloudflare 帐户交互的 CLI 应用程序
  en: A CLI application for interacting with a Cloudflare account
x:
  source: https://github.com/cloudflare/cloudflare-go
  yay: flarectl-bin
  asdf: flarectl
rule:
  /x:
    cmd: x pkg use flarectl
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use flarectl
    reference: https://github.com/ORCID/asdf-flarectl
  arch/yay:
    cmd: yay -S flarectl-bin
    reference: https://aur.archlinux.org/packages/flarectl-bin
  /go:
    cmd: go get github.com/cloudflare/cloudflare-go
    reference: https://github.com/cloudflare/cloudflare-go?tab=readme-ov-file#installation
    dsnap: github.com/cloudflare/cloudflare-go
binlist:
- flarectl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
