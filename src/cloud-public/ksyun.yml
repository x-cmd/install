lang: Shell
homepage: https://www.ksyun.com
license: NOASSERTION
desc:
  cn: 金山云软件安装工具
  en: ksyun — software install
rule:
  /curl:
    cmd: x env use ksyun
    reference: https://github.com/x-cmd/doc-2026/blob/main/data/install/cloud-public/ksyun.cn.md
binlist:
- ksyun

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
