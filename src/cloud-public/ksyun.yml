lang: Shell
homepage: https://www.ksyun.com
license: NOASSERTION
desc:
  cn: 金山云软件安装工具
  en: ksyun — software install
rule:
  /curl:
    cmd: x env use ksyun
    reference: https://github.com/x-cmd/doc-2026/blob/main/data/install/cloud-public/ksyun.cn.md
binlist:
- ksyun

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
