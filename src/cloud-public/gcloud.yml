lang: Go
homepage: https://cloud.google.com/
desc:
  cn: Google Cloud 命令行工具，用于管理 Google Cloud 上托管的资源和应用
  en: Google Cloud command-line tools to manage resources and apps hosted on Google Cloud
  cs: Nástroje příkazové řádky Google Cloud pro správu zdrojů a aplikací hostovaných v Google Cloud
  de: Google Cloud Befehlszeilen-Tools zum Verwalten von Ressourcen und Anwendungen, die in Google Cloud gehostet sind
  es: Herramientas de línea de comandos de Google Cloud para gestionar recursos y aplicaciones alojados en Google Cloud
  fr: Outils de ligne de commande Google Cloud pour gérer les ressources et les applications hébergées sur Google Cloud
  id: Alat baris perintah Google Cloud untuk mengelola sumber daya dan aplikasi yang di-hosting di Google Cloud
  it: Strumenti a riga di comando di Google Cloud per gestire risorse e app ospitate su Google Cloud
  ja: Google Cloud でホストされたリソースとアプリケーションを管理するための Google Cloud コマンドラインツール
  ko: Google Cloud에서 호스팅되는 리소스와 애플리케이션을 관리하는 Google Cloud 명령줄 도구
  pl: Narzędzia wiersza poleceń Google Cloud do zarządzania zasobami i aplikacjami hostowanymi w Google Cloud
  pt: Ferramentas de linha de comando do Google Cloud para gerenciar recursos e aplicativos hospedados no Google Cloud
  ro: Instrumente de linie de comandă Google Cloud pentru gestionarea resurselor și a aplicațiilor găzduite în Google Cloud
  ru: Инструменты командной строки Google Cloud для управления ресурсами и приложениями, размещёнными в Google Cloud
  th: เครื่องมือบรรทัดคำสั่งของ Google Cloud สำหรับจัดการทรัพยากรและแอปที่โฮสต์บน Google Cloud
  tr: Google Cloud'da barındırılan kaynakları ve uygulamaları yönetmek için Google Cloud komut satırı araçları
  uk: Інструменти командного рядка Google Cloud для керування ресурсами та застосунками, розміщеними в Google Cloud
  vi: Công cụ dòng lệnh Google Cloud để quản lý các tài nguyên và ứng dụng được lưu trữ trên Google Cloud
x:
  snap: google-cloud-cli
  asdf: gcloud
rule:
  /x:
    cmd: x pkg use gcloud
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use gcloud
    reference: https://github.com/jthegedus/asdf-gcloud
  darwin/brew:
    cmd: brew install --cask google-cloud-sdk
    reference: https://formulae.brew.sh/cask/google-cloud-sdk#default
  ubuntu/snap:
    cmd: sudo snap install google-cloud-cli --classic
    reference: https://cloud.google.com/sdk/docs/downloads-snap
  win/powershell:
    cmd: 'x pwsh (New-Object Net.WebClient).DownloadFile("https://dl.google.com/dl/cloudsdk/channels/rapid/GoogleCloudSDKInstaller.exe", "$env:Temp\GoogleCloudSDKInstaller.exe")

      & $env:Temp\GoogleCloudSDKInstaller.exe

      '
    reference: https://cloud.google.com/sdk/docs/install#windows
binlist:
- gcloud
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
