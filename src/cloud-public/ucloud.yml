lang: Go
homepage: https://github.com/ucloud/ucloud-cli
license: Apache-2.0
desc:
  cn: UCloud 命令行界面
  en: UCloud Command Line Interface
  cs: UCloud Command Line Interface
  de: UCloud Command Line Interface
  es: Interfaz de línea de comandos de UCloud
  fr: Interface de ligne de commande UCloud
  id: Antarmuka baris perintah UCloud
  it: Interfaccia a riga di comando di UCloud
  ja: UCloud コマンドラインインターフェース
  ko: UCloud 명령줄 인터페이스
  pl: Interfejs wiersza poleceń UCloud
  pt: Interface de linha de comando do UCloud
  ro: Interfață de linie de comandă UCloud
  ru: Командный интерфейс UCloud
  th: ส่วนติดต่อบรรทัดคำสั่งของ UCloud
  tr: UCloud komut satırı arayüzü
  uk: Командний інтерфейс UCloud
  vi: Giao diện dòng lệnh UCloud
x:
  source: https://github.com/ucloud/ucloud-cli
  eget: ucloud/ucloud-cli
  brew: ucloud
rule:
  /x:
    cmd: x pkg use ucloud
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ucloud/ucloud-cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install ucloud
    reference: https://formulae.brew.sh/formula/ucloud#default
binlist:
- ucloud

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
