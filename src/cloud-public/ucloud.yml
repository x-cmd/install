lang: Go
homepage: https://github.com/ucloud/ucloud-cli
license: Apache-2.0
desc:
  cn: UCloud 命令行界面
  en: UCloud Command Line Interface
x:
  pkg:
    exist: true
  source: https://github.com/ucloud/ucloud-cli
  eget: https://github.com/ucloud/ucloud-cli
rule:
  /x:
    cmd: x pkg use ucloud
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ucloud/ucloud-cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install ucloud
    reference: https://formulae.brew.sh/formula/ucloud#default
binlist:
- ucloud

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
