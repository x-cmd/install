lang: Go
homepage: https://github.com/aliyun/aliyun-cli
license: Apache-2.0
desc:
  cn: 阿里云 CLI 是一种通过命令行界面管理和使用阿里云资源的工具
  en: The Alibaba Cloud CLI is a tool to manage and use Alibaba Cloud resources through a command line interface
x:
  pkg:
    exist: true
  source: https://github.com/aliyun/aliyun-cli
  eget: https://github.com/aliyun/aliyun-cli
rule:
  /x:
    cmd: x pkg use aliyun
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget aliyun/aliyun-cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install aliyun-cli
    reference: https://formulae.brew.sh/formula/aliyun-cli#default
  /curl:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/aliyun/aliyun-cli/HEAD/install.sh)"
    reference: https://github.com/aliyun/aliyun-cli#installation
  arch/yay:
    cmd: yay -S aliyun-cli-bin
    reference: https://aur.archlinux.org/packages/aliyun-cli-bin
binlist:
- aliyun

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
