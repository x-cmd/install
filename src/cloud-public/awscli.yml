lang: Python
homepage: https://github.com/aws/aws-cli
desc:
  cn: Amazon Web Services 的通用命令行界面
  en: Universal Command Line Interface for Amazon Web Services
  cs: Univerzální příkazový řádek pro Amazon Web Services
  de: Universelle Kommandozeile für Amazon Web Services
  es: Interfaz de línea de comandos universal para Amazon Web Services
  fr: Interface de ligne de commande universelle pour Amazon Web Services
  id: Antarmuka Baris Perintah Universal untuk Amazon Web Services
  it: Interfaccia a riga di comando universale per Amazon Web Services
  ja: Amazon Web Services 用の汎用コマンドラインインターフェース
  ko: Amazon Web Services를 위한 범용 명령줄 인터페이스
  pl: Uniwersalny interfejs wiersza poleceń dla Amazon Web Services
  pt: Interface de linha de comando universal para a Amazon Web Services
  ro: Interfață de linie de comandă universală pentru Amazon Web Services
  ru: Универсальный интерфейс командной строки для Amazon Web Services
  th: อินเทอร์เฟซบรรทัดคำสั่งสากลสำหรับ Amazon Web Services
  tr: Amazon Web Services için evrensel komut satırı arayüzü
  uk: Універсальний інтерфейс командного рядка для Amazon Web Services
  vi: Giao diện dòng lệnh phổ quát cho Amazon Web Services
x:
  source: https://github.com/aws/aws-cli
  brew: awscli
  scoop: aws
  pip: awscli
  asdf: awscli
rule:
  /x:
    cmd: x pkg use awscli
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use awscli
    reference: https://github.com/MetricMike/asdf-awscli
  /pip:
    cmd: pip3 install awscli
    reference: https://docs.aws.amazon.com/cli/v1/userguide/install-linux.html
    dsnap: awscli
  darwin/brew:
    cmd: brew install awscli
    reference: https://formulae.brew.sh/formula/awscli#default
  (win|wsl2)/scoop:
    cmd: x scoop install aws
    reference: https://scoop.sh/#/apps?q=aws
binlist:
- aws
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: none
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
