lang: TypeScript
homepage: https://github.com/cloudflare/workers-sdk
license: Apache-2.0
desc:
  cn: Cloudflare Workers 的 CLI
  en: the CLI for Cloudflare Workers
  cs: CLI pro Cloudflare Workers
  de: Die CLI für Cloudflare Workers
  es: La CLI para Cloudflare Workers
  fr: La CLI pour Cloudflare Workers
  id: CLI untuk Cloudflare Workers
  it: La CLI per Cloudflare Workers
  ja: Cloudflare Workers の CLI
  ko: Cloudflare Workers용 CLI
  pl: CLI dla Cloudflare Workers
  pt: A CLI para Cloudflare Workers
  ro: CLI pentru Cloudflare Workers
  ru: CLI для Cloudflare Workers
  th: CLI สำหรับ Cloudflare Workers
  tr: Cloudflare Workers için CLI
  uk: CLI для Cloudflare Workers
  vi: CLI cho Cloudflare Workers
x:
  source: https://github.com/cloudflare/workers-sdk
  npm: wrangler
rule:
  /x:
    cmd: x pkg use wrangler
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g wrangler
    reference: https://github.com/cloudflare/workers-sdk?tab=readme-ov-file#quick-start
    dsnap: wrangler
binlist:
- wrangler

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
