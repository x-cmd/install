lang: TypeScript
homepage: https://github.com/cloudflare/workers-sdk
license: Apache-2.0
desc:
  cn: Cloudflare Workers 的 CLI
  en: the CLI for Cloudflare Workers
x:
  pkg:
    exist: true
  source: https://github.com/cloudflare/workers-sdk
rule:
  /x:
    cmd: x pkg use wrangler
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g wrangler
    reference: https://github.com/cloudflare/workers-sdk?tab=readme-ov-file#quick-start
    dsnap: wrangler
binlist:
- wrangler

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
