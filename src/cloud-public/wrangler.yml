lang: TypeScript
homepage: https://github.com/cloudflare/workers-sdk
license: Apache-2.0
desc:
  cn: Cloudflare Workers 的 CLI
  en: the CLI for Cloudflare Workers
x:
  pkg:
    exist: true
  source: https://github.com/cloudflare/workers-sdk
rule:
  /x:
    cmd: x pkg use wrangler
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g wrangler
    reference: https://github.com/cloudflare/workers-sdk?tab=readme-ov-file#quick-start
    dsnap: wrangler
binlist:
- wrangler

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
