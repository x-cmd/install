lang: TypeScript
homepage: https://github.com/aws/aws-cdk
license: Apache-2.0
desc:
  cn: AWS 云开发工具包是一个用于在代码中定义云基础设施的框架
  en: The AWS Cloud Development Kit is a framework for defining cloud infrastructure in code
x:
  source: https://github.com/aws/aws-cdk
  eget: https://github.com/aws/aws-cdk
rule:
  /eget:
    cmd: x eget aws/aws-cdk
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm i -g aws-cdk
    reference: https://github.com/aws/aws-cdk?tab=readme-ov-file#at-a-glance
    dsnap: aws-cdk
  arch/yay:
    cmd: yay -S aws-cdk
    reference: https://aur.archlinux.org/packages/aws-cdk
  darwin/brew:
    cmd: brew install aws-cdk
    reference: https://formulae.brew.sh/formula/aws-cdk#default
  /pip:
    cmd: pip install aws-cdk-lib
    reference: https://pypi.org/project/aws-cdk-lib/
    dsnap: aws-cdk-lib
binlist:
- aws-cdk

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
