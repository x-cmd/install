lang: Go
desc:
  en: CLI for managing resources in InfluxDB v2
  cn: 用于管理 InfluxDB v2 中资源的 CLI
  cs: CLI pro správu zdrojů v InfluxDB v2
  de: CLI zur Verwaltung von Ressourcen in InfluxDB v2
  es: CLI para gestionar recursos en InfluxDB v2
  fr: CLI pour gérer les ressources dans InfluxDB v2
  id: CLI untuk mengelola sumber daya di InfluxDB v2
  it: CLI per gestire le risorse in InfluxDB v2
  ja: InfluxDB v2 のリソースを管理するための CLI
  ko: InfluxDB v2에서 리소스를 관리하는 CLI
  pl: CLI do zarządzania zasobami w InfluxDB v2
  pt: CLI para gerenciar recursos no InfluxDB v2
  ro: CLI pentru gestionarea resurselor în InfluxDB v2
  ru: CLI для управления ресурсами в InfluxDB v2
  th: CLI สำหรับจัดการทรัพยากรใน InfluxDB v2
  tr: InfluxDB v2 içindeki kaynakları yönetmek için CLI
  uk: CLI для керування ресурсами в InfluxDB v2
  vi: CLI để quản lý các tài nguyên trong InfluxDB v2
homepage: https://github.com/influxdata/influx-cli
license: MIT
x:
  source: https://github.com/influxdata/influx-cli
  brew: influxdb-cli
rule:
  /x:
    cmd: x pkg use influx
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install influxdb-cli
    reference: https://docs.influxdata.com/influxdb/v2/tools/influx-cli/#use-homebrew
binlist:
- influx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
