lang: Go
desc:
  en: CLI for managing resources in InfluxDB v2
  cn: 用于管理 InfluxDB v2 中资源的 CLI
homepage: https://github.com/influxdata/influx-cli
license: MIT
x:
  source: https://github.com/influxdata/influx-cli
  brew: influxdb-clirule:
  /x:
    cmd: x pkg use influx
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install influxdb-cli
    reference: https://docs.influxdata.com/influxdb/v2/tools/influx-cli/#use-homebrew
binlist:
- influx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
