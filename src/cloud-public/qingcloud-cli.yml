lang: Python
homepage: https://github.com/yunify/qingcloud-cli
license: Apache-2.0
desc:
  cn: qingcloud-cli 是管理青云资源的命令行接口
  en: qingcloud-cli is a command-line interface for managing qingcloud resources
x:
  pkg:
    exist: true
  source: https://github.com/yunify/qingcloud-cli
rule:
  /x:
    cmd: x pkg use qingcloud-cli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install qingcloud-cli
    reference: https://github.com/yunify/qingcloud-cli?tab=readme-ov-file#installation
    dsnap: qingcloud-cli
binlist:
- qingcloud-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
