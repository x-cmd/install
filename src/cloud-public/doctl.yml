lang: Go
homepage: https://github.com/digitalocean/doctl
license: Apache-2.0
desc:
  cn: DigitalOcean API 的官方命令行工具。
  en: The official command line interface for the DigitalOcean API.
  cs: Oficiální příkazový řádek pro API DigitalOcean.
  de: Die offizielle Kommandozeile für die DigitalOcean-API.
  es: La interfaz de línea de comandos oficial para la API de DigitalOcean.
  fr: L'interface de ligne de commande officielle pour l'API DigitalOcean.
  id: Antarmuka baris perintah resmi untuk API DigitalOcean.
  it: L'interfaccia a riga di comando ufficiale per l'API DigitalOcean.
  ja: DigitalOcean API の公式コマンドラインインターフェース。
  ko: DigitalOcean API용 공식 명령줄 인터페이스.
  pl: Oficjalny wiersz poleceń dla API DigitalOcean.
  pt: A interface de linha de comando oficial para a API do DigitalOcean.
  ro: Interfața de linie de comandă oficială pentru API-ul DigitalOcean.
  ru: Официальный интерфейс командной строки для API DigitalOcean.
  th: อินเทอร์เฟซบรรทัดคำสั่งอย่างเป็นทางการสำหรับ DigitalOcean API
  tr: DigitalOcean API için resmi komut satırı arayüzü.
  uk: Офіційний інтерфейс командного рядка для API DigitalOcean.
  vi: Giao diện dòng lệnh chính thức cho API DigitalOcean.
x:
  source: https://github.com/digitalocean/doctl
  eget: digitalocean/doctl
  dnf: doctl
  brew: doctl
  pacman: doctl
  snap: doctl
  port: doctl
  asdf: doctl
rule:
  /x:
    cmd: x pkg use doctl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget digitalocean/doctl
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use doctl
    reference: https://github.com/maristgeek/asdf-doctl
  darwin/brew:
    cmd: brew install doctl
    reference: https://github.com/digitalocean/doctl?tab=readme-ov-file#macos
  darwin/port:
    cmd: sudo port install doctl
    reference: https://ports.macports.org/port/doctl/
  /snap:
    cmd: sudo snap install doctl
    reference: https://github.com/digitalocean/doctl?tab=readme-ov-file#snap-supported-os
  arch/pacman:
    cmd: sudo pacman -S doctl
    reference: https://github.com/digitalocean/doctl?tab=readme-ov-file#arch-linux
  fedora/dnf:
    cmd: sudo dnf install doctl
    reference: https://github.com/digitalocean/doctl?tab=readme-ov-file#fedora
  nix/:
    cmd: nix-shell -p doctl
    reference: https://search.nixos.org/packages?channel=23.11&show=doctl&from=0&size=50&sort=relevance&type=packages&query=doctl
binlist:
- doctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 18 MB
          rating: 2
          desc:
            cn: 安装 18 MB
            en: 18 MB install
        download:
          estimate: 18 MB
          desc:
            cn: 约 18 MB 下载 (linux/x64)
            en: ~18 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
