lang: JavaScript
homepage: https://github.com/firebase/firebase-tools
license: MIT
desc:
  cn: Firebase 命令行界面 (CLI) 工具可用于从命令行测试、管理和部署 Firebase 项目
  en: The Firebase Command Line Interface (CLI) Tools can be used to test, manage, and deploy your Firebase project from the command line
  cs: Nástroje Firebase Command Line Interface (CLI) lze použít k testování, správě a nasazování vašeho projektu Firebase z příkazového řádku
  de: Mit den Firebase Command Line Interface (CLI) Tools können Sie Ihr Firebase-Projekt über die Kommandozeile testen, verwalten und bereitstellen
  es: Las herramientas de la interfaz de línea de comandos (CLI) de Firebase se pueden usar para probar, administrar y desplegar tu proyecto de Firebase desde la línea de comandos
  fr: Les outils Firebase Command Line Interface (CLI) peuvent être utilisés pour tester, gérer et déployer votre projet Firebase depuis la ligne de commande
  id: Firebase Command Line Interface (CLI) Tools dapat digunakan untuk menguji, mengelola, dan men-deploy proyek Firebase Anda dari baris perintah
  it: Gli strumenti Firebase Command Line Interface (CLI) possono essere usati per testare, gestire e distribuire il tuo progetto Firebase dalla riga di comando
  ja: Firebase Command Line Interface (CLI) ツールは、コマンドラインから Firebase プロジェクトをテスト、管理、デプロイするために使用できます
  ko: Firebase Command Line Interface (CLI) 도구는 명령줄에서 Firebase 프로젝트를 테스트하고 관리하며 배포하는 데 사용할 수 있습니다
  pl: Narzędzia Firebase Command Line Interface (CLI) służą do testowania, zarządzania i wdrażania projektu Firebase z wiersza poleceń
  pt: As ferramentas da Interface de Linha de Comando (CLI) do Firebase podem ser usadas para testar, gerenciar e implantar seu projeto do Firebase a partir da linha de comando
  ro: Instrumentele Firebase Command Line Interface (CLI) pot fi folosite pentru a testa, administra și implementa proiectul Firebase din linia de comandă
  ru: Инструменты Firebase Command Line Interface (CLI) можно использовать для тестирования, управления и развёртывания проекта Firebase из командной строки
  th: เครื่องมือ Firebase Command Line Interface (CLI) สามารถใช้เพื่อทดสอบ จัดการ และปล่อยโปรเจกต์ Firebase ของคุณจากบรรทัดคำสั่ง
  tr: Firebase Command Line Interface (CLI) araçları, Firebase projenizi komut satırından test etmek, yönetmek ve dağıtmak için kullanılabilir
  uk: Інструменти Firebase Command Line Interface (CLI) можна використовувати для тестування, керування та розгортання вашого проєкту Firebase із командного рядка
  vi: Các công cụ Firebase Command Line Interface (CLI) có thể dùng để kiểm thử, quản lý và triển khai dự án Firebase của bạn từ dòng lệnh
x:
  source: https://github.com/firebase/firebase-tools
  eget: firebase/firebase-tools
  yay: firebase-tools
  npm: firebase-tools
rule:
  /x:
    cmd: x pkg use firebase-tools
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget firebase/firebase-tools
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install -g firebase-tools
    reference: https://github.com/firebase/firebase-tools?tab=readme-ov-file#node-package
    dsnap: firebase-tools
  arch/yay:
    cmd: yay -S firebase-tools
    reference: https://aur.archlinux.org/packages/firebase-tools
  /curl:
    cmd: curl -sL firebase.tools | bash
    reference: https://github.com/firebase/firebase-tools?tab=readme-ov-file#standalone-binary
binlist:
- firebase-tools
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # Firebase API
    filesystem:
      read:
        desc:
          cn: 读取 firebase.json, .firebaserc
          en: Reads firebase.json, .firebaserc
        sensitive:
        - "$HOME/.config/firebase"
      write:
        desc:
          cn: 无文件系统读写
          en: No filesystem reads or writes
  resource:
    disk:
      size:
        install:
          estimate: 240 MB
          rating: 4
          desc:
            cn: 安装 240 MB
            en: 240 MB install
        download:
          estimate: 240 MB
          desc:
            cn: 约 240 MB 下载 (linux/arm64)
            en: ~240 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 300 MB
        desc:
          cn: 部署时
          en: During deploy
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 上传资源时占用
          en: Spike on asset upload
  platform:
    win: full
    linux: full
    darwin: full
