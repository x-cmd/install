lang: TypeScript
homepage: https://github.com/cloudflare/workers-sdk
license: Apache-2.0
desc:
  cn: Cloudflare Workers 的 CLI
  en: the CLI for Cloudflare Workers
x:
  pkg:
    exist: true
  source: https://github.com/cloudflare/workers-sdk
rule:
  /x:
    cmd: x pkg use create-cloudflare
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm create cloudflare@latest
    reference: https://developers.cloudflare.com/workers/get-started/guide/#1-create-a-new-worker-project
    dsnap: cloudflare
  /yarn:
    cmd: yarn create cloudflare
    reference: https://developers.cloudflare.com/workers/get-started/guide/#1-create-a-new-worker-project
binlist:
- create-cloudflare
footprint:
  behavior:
    runtime:
      type: oneshot
    network:
      local: true
      internet: true   # npm registry, cloudflare API
    filesystem:
      read:
        desc:
          cn: 读取项目目录
          en: Reads project directory
        sensitive: []
      write:
        desc:
          cn: 生成 worker 项目脚手架
          en: Generates worker project scaffold
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 安装 ~50 MB（含 wrangler）
            en: ~50 MB install (with wrangler)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: ~100 MB Node.js
          en: ~100 MB Node.js
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 3
        desc:
          cn: 安装 npm 依赖时短暂占用
          en: Brief spike on npm install
