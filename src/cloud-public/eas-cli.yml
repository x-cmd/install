lang: TypeScript
homepage: https://github.com/expo/eas-cli
license: MIT
desc:
  cn: Expo 应用服务(EAS)是世博会背后的团队为世博会和 React 本地应用提供的深度集成云服务
  en: Expo Application Services (EAS) are deeply integrated cloud services for Expo and React Native apps, from the team behind Expo
x:
  source: https://github.com/expo/eas-cli
rule:
  /npm:
    cmd: npm install -g eas-cli
    reference: https://github.com/expo/eas-cli?tab=readme-ov-file#installation
    dsnap: eas-cli
  /yarn:
    cmd: yarn global add eas-cli
    reference: https://github.com/expo/eas-cli?tab=readme-ov-file#installation
binlist:
- eas-cli

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
