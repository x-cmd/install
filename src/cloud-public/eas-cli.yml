lang: TypeScript
homepage: https://github.com/expo/eas-cli
license: MIT
desc:
  cn: Expo 应用服务(EAS)是世博会背后的团队为世博会和 React 本地应用提供的深度集成云服务
  en: Expo Application Services (EAS) are deeply integrated cloud services for Expo and React Native apps, from the team behind Expo
x:
  source: https://github.com/expo/eas-cli
rule:
  /npm:
    cmd: npm install -g eas-cli
    reference: https://github.com/expo/eas-cli?tab=readme-ov-file#installation
    dsnap: eas-cli
  /yarn:
    cmd: yarn global add eas-cli
    reference: https://github.com/expo/eas-cli?tab=readme-ov-file#installation
binlist:
- eas-cli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 329 KB
          rating: 1
          desc:
            cn: 约 329 KB（估算）
            en: ~329 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
