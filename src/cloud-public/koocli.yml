lang: Go
homepage: https://www.huaweicloud.com/
desc:
  cn: 华为云命令行工具，提供了一种通过 CLI 调用云服务 API 的方法
  en: HUAWEI cloud Command Line Tool provides a way to call cloud service APIs through the CLI
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use koocli
    reference: https://x-cmd.com/install/
  linux/curl:
    cmd: 'curl -sSL https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/hcloud_install.sh -o ./hcloud_install.sh \

      && bash ./hcloud_install.sh

      '
    reference: https://support.huaweicloud.com/qs-hcli/hcli_02_003_02.html
  darwin/curl:
    cmd: 'curl -sSL https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/hcloud_install.sh -o ./hcloud_install.sh \

      && bash ./hcloud_install.sh

      '
    reference: https://support.huaweicloud.com/qs-hcli/hcli_02_003_03.html
binlist:
- koocli
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
