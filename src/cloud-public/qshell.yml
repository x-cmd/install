lang: Go
homepage: https://github.com/qiniu/qshell
license: MIT
desc:
  cn: 使用七牛云 API 服务的命令行工具
  en: Shell Tools for Qiniu Cloud
x:
  pkg:
    exist: true
  source: https://github.com/qiniu/qshell
  eget: https://github.com/qiniu/qshell
rule:
  /x:
    cmd: x pkg use qshell
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget qiniu/qshell
    reference: https://x-cmd.com/mod/eget
  /curl/amd64:
    cmd: curl -sSL https://github.com/qiniu/qshell/releases/download/latest/qshell-v2.18.0-darwin-amd64.tar.gz | tar xzvf - -C ~/.local/bin
    reference: https://github.com/qiniu/qshell/releases
  arch/yay:
    cmd: yay -S qiniu-qshell-bin
    reference: https://aur.archlinux.org/packages/qiniu-qshell-bin
binlist:
- qshell

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2.7 MB
          rating: 1
          desc:
            cn: 约 2.7 MB（估算）
            en: ~2.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
