lang: Go
homepage: https://github.com/qiniu/qshell
license: MIT
desc:
  cn: 使用七牛云 API 服务的命令行工具
  en: Shell Tools for Qiniu Cloud
x:
  source: https://github.com/qiniu/qshell
  eget: qiniu/qshell
  yay: qiniu-qshell-bin
rule:
  /x:
    cmd: x pkg use qshell
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget qiniu/qshell
    reference: https://x-cmd.com/mod/eget
  /curl/amd64:
    cmd: curl -sSL https://github.com/qiniu/qshell/releases/download/latest/qshell-v2.18.0-darwin-amd64.tar.gz | tar xzvf - -C ~/.local/bin
    reference: https://github.com/qiniu/qshell/releases
  arch/yay:
    cmd: yay -S qiniu-qshell-bin
    reference: https://aur.archlinux.org/packages/qiniu-qshell-bin
binlist:
- qshell

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
