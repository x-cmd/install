lang: JavaScript
desc:
  cn: Heroku CLI 用于从命令行管理 Heroku 应用程序
  en: Heroku CLI for managing Heroku applications from the command line
homepage: https://github.com/heroku/cli
license: ISC
x:
  pkg:
    exist: true
  source: https://github.com/heroku/cli
rule:
  /x:
    cmd: x pkg use heroku
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl https://cli-assets.heroku.com/install.sh | sh
    reference: https://github.com/heroku/cli
  darwin/brew:
    cmd: brew tap heroku/brew && brew install heroku
    reference: https://github.com/heroku/cli
  win/choco:
    cmd: choco install heroku-cli
    reference: https://github.com/heroku/cli
binlist:
- heroku

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
