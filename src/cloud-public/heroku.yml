lang: JavaScript
desc:
  cn: Heroku CLI 用于从命令行管理 Heroku 应用程序
  en: Heroku CLI for managing Heroku applications from the command line
homepage: https://github.com/heroku/cli
license: ISC
x:
  pkg:
    exist: true
  source: https://github.com/heroku/cli
rule:
  /x:
    cmd: x pkg use heroku
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl https://cli-assets.heroku.com/install.sh | sh
    reference: https://github.com/heroku/cli
  darwin/brew:
    cmd: brew tap heroku/brew && brew install heroku
    reference: https://github.com/heroku/cli
  win/choco:
    cmd: choco install heroku-cli
    reference: https://github.com/heroku/cli
binlist:
- heroku

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
