lang: JavaScript
desc:
  cn: Heroku CLI 用于从命令行管理 Heroku 应用程序
  en: Heroku CLI for managing Heroku applications from the command line
  cs: Heroku CLI pro správu aplikací Heroku z příkazové řádky
  de: Heroku CLI zum Verwalten von Heroku-Anwendungen über die Befehlszeile
  es: Heroku CLI para gestionar aplicaciones de Heroku desde la línea de comandos
  fr: Heroku CLI pour gérer les applications Heroku depuis la ligne de commande
  id: Heroku CLI untuk mengelola aplikasi Heroku dari baris perintah
  it: Heroku CLI per gestire le applicazioni Heroku dalla riga di comando
  ja: コマンドラインから Heroku アプリケーションを管理するための Heroku CLI
  ko: 명령줄에서 Heroku 애플리케이션을 관리하기 위한 Heroku CLI
  pl: Heroku CLI do zarządzania aplikacjami Heroku z wiersza poleceń
  pt: Heroku CLI para gerenciar aplicativos Heroku pela linha de comando
  ro: Heroku CLI pentru gestionarea aplicațiilor Heroku din linia de comandă
  ru: Heroku CLI для управления приложениями Heroku из командной строки
  th: Heroku CLI สำหรับจัดการแอปพลิเคชัน Heroku จากบรรทัดคำสั่ง
  tr: Heroku uygulamalarını komut satırından yönetmek için Heroku CLI
  uk: Heroku CLI для керування застосунками Heroku з командного рядка
  vi: Heroku CLI để quản lý các ứng dụng Heroku từ dòng lệnh
homepage: https://github.com/heroku/cli
license: ISC
x:
  source: https://github.com/heroku/cli
  brew: heroku/brew/heroku
  choco: heroku-cli
rule:
  /x:
    cmd: x pkg use heroku
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl https://cli-assets.heroku.com/install.sh | sh
    reference: https://github.com/heroku/cli
  darwin/brew:
    cmd: brew tap heroku/brew && brew install heroku
    reference: https://github.com/heroku/cli
  win/choco:
    cmd: choco install heroku-cli
    reference: https://github.com/heroku/cli
binlist:
- heroku

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB（估算）
          en: 30 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
