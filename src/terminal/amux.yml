lang: 'Go'
homepage: 'https://github.com/andyrewlee/amux'
license: 'MIT'
desc:
  cn: 轻松并行运行多个编程 Agent 的 TUI
  en: 'TUI for easily running parallel coding agents'
x:
  source: https://github.com/andyrewlee/amux
  eget: https://github.com/andyrewlee/amux
rule:
  /eget:
    cmd: x eget andyrewlee/amux
    reference: https://github.com/andyrewlee/amux
binlist:
  - 'amux'
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取 session 配置
          en: Reads session config
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 ~5 MB
            en: ~5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: ~20 MB
          en: ~20 MB
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
