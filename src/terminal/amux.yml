lang: 'Go'
homepage: 'https://github.com/andyrewlee/amux'
license: 'MIT'
desc:
  cn: 轻松并行运行多个编程 Agent 的 TUI
  en: 'TUI for easily running parallel coding agents'
x:
  source: https://github.com/andyrewlee/amux
  eget: https://github.com/andyrewlee/amux
rule:
  /eget:
    cmd: x eget andyrewlee/amux
    reference: https://github.com/andyrewlee/amux
binlist:
- 'amux'
# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 session 配置
          en: Reads session config
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 约 13 MB（估算）
            en: ~13 MB estimated
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
