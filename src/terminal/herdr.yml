lang: Rust
homepage: https://github.com/herdrdev/herdr
license: Apache-2.0
desc:
  cn: 驻留于终端的 Agent 多路复用器
  en: agent multiplexer that lives in your terminal.
x:
  source: https://github.com/herdrdev/herdr
  eget: https://github.com/herdrdev/herdr
rule:
  /eget:
    cmd: x eget use herdrdev/herdr
    reference: https://github.com/herdrdev/herdr/releases
  /curl:
    cmd: curl -fsSL https://herdr.dev/install.sh | sh
    reference: https://github.com/herdrdev/herdr#install
binlist:
- herdr

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 24 MB
          rating: 2
          desc:
            cn: 安装 24 MB
            en: 24 MB install
        download:
          estimate: 24 MB
          desc:
            cn: 约 24 MB 下载 (linux/x64)
            en: ~24 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
