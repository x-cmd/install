lang: 'Go'
homepage: 'https://github.com/jon4hz/fztea'
license: 'MIT'
desc:
  cn: 在本地终端或通过 SSH 远程控制 Flipper 设备
  en: '🐬🧋 Remote control your flipper from the local terminal or over SSH'
x:
  source: https://github.com/jon4hz/fztea
  eget: https://github.com/jon4hz/fztea
rule:
  /eget:
    cmd: x eget jon4hz/fztea
    reference: https://github.com/jon4hz/fztea
binlist:
- 'fztea'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 63 KB
          rating: 1
          desc:
            cn: 约 63 KB（估算）
            en: ~63 KB estimated
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
