lang: 'Go'
homepage: 'https://github.com/jon4hz/fztea'
license: 'MIT'
desc:
  cn: 在本地终端或通过 SSH 远程控制 Flipper 设备
  en: '🐬🧋 Remote control your flipper from the local terminal or over SSH'
x:
  source: https://github.com/jon4hz/fztea
  eget: https://github.com/jon4hz/fztea
rule:
  /eget:
    cmd: x eget jon4hz/fztea
    reference: https://github.com/jon4hz/fztea
binlist:
  - 'fztea'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
