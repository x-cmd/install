lang: 'Go'
homepage: 'https://github.com/jon4hz/fztea'
license: 'MIT'
desc:
  cn: 在本地终端或通过 SSH 远程控制 Flipper 设备
  en: '🐬🧋 Remote control your flipper from the local terminal or over SSH'
  cs: 🐬🧋 Ovládejte svůj flipper z lokálního terminálu nebo přes SSH
  de: 🐬🧋 Steuern Sie Ihren Flipper lokal im Terminal oder über SSH
