desc:
  cn: gum 是一个集成了多款 Terminal UI 命令行工具，可帮助用户在编写脚本提供一个用户友好的命令行界面
  en: Gum is an integrated Terminal UI command line tool that helps users write scripts with a user-friendly Command-line interface
  cs: Gum je integrovaný nástroj CLI s rozhraním Terminal UI, který pomáhá uživatelům psát skripty s uživatelsky přívětivým rozhraním příkazové řádky
  de: Gum ist ein integriertes Terminal-UI-Kommandozeilenwerkzeug, das Nutzern hilft, Skripte mit einer benutzerfreundlichen Kommandozeilenoberfläche zu schreiben
  es: Gum es una herramienta de línea de comandos Terminal UI integrada que ayuda a los usuarios a escribir scripts con una interfaz de línea de comandos fácil de usar
  fr: Gum est un outil en ligne de commande Terminal UI intégré qui aide les utilisateurs à écrire des scripts avec une interface de ligne de commande conviviale
  id: Gum adalah alat command line Terminal UI terintegrasi yang membantu pengguna menulis skrip dengan antarmuka command-line yang ramah pengguna
  it: Gum è uno strumento da riga di comando Terminal UI integrato che aiuta gli utenti a scrivere script con un'interfaccia a riga di comando intuitiva
  ja: Gum は Terminal UI の統合型コマンドラインツールで、ユーザーに親切なコマンドラインインターフェースでスクリプトを書けるようにします
  ko: Gum은 Terminal UI 통합 command line 도구로, 사용자에게 친숙한 명령줄 인터페이스로 스크립트를 작성하도록 돕습니다
  pl: Gum to zintegrowane narzędzie wiersza poleceń Terminal UI, które pomaga użytkownikom pisać skrypty przyjaznym interfejsem wiersza poleceń
  pt: Gum é uma ferramenta de linha de comando Terminal UI integrada que ajuda os usuários a escrever scripts com uma interface de linha de comando amigável
  ro: Gum este un instrument de linie de comandă Terminal UI integrat care îi ajută pe utilizatori să scrie scripturi cu o interfață de linie de comandă prietenoasă
  ru: Gum — интегрированный инструмент командной строки с Terminal UI, который помогает пользователям писать скрипты с удобным интерфейсом командной строки
  th: Gum คือเครื่องมือบรรทัดคำสั่งแบบ Terminal UI แบบรวม ช่วยให้ผู้ใช้เขียนสคริปต์ด้วยอินเทอร์เฟซบรรทัดคำสั่งที่ใช้งานง่าย
  tr: Gum, kullanıcıların kullanıcı dostu bir komut satırı arayüzüyle betik yazmasına yardımcı olan entegre bir Terminal UI komut satırı aracıdır
  uk: Gum — інтегрований інструмент командного рядка з Terminal UI, який допомагає користувачам писати скрипти зручним інтерфейсом командного рядка
  vi: Gum là công cụ dòng lệnh Terminal UI tích hợp, giúp người dùng viết script với giao diện dòng lệnh thân thiện
homepage: https://github.com/charmbracelet/gum
license: MIT
lang: Go
x:
  source: https://github.com/charmbracelet/gum
  eget: charmbracelet/gum
  apt: gum
  dnf: gum
  brew: gum
  pacman: gum
  apk: gum
  yum: gum
  scoop: charm-gum
  winget: charmbracelet.gum
  asdf: gum
rule:
  /x:
    cmd: x pkg use gum
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget charmbracelet/gum
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use gum
    reference: https://github.com/lwiechec/asdf-gum
  darwin/brew:
    cmd: brew install gum
    reference: https://formulae.brew.sh/formula/gum#default
  alpine/apk:
    cmd: sudo apk add gum
    reference: https://github.com/charmbracelet/gum#installation
    dsnap: gum
  debian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install gum

      '
    reference: https://github.com/charmbracelet/gum#installation
    dsnap: gum
  ubuntu/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install gum

      '
    reference: https://github.com/charmbracelet/gum#installation
    dsnap: gum
  arch/pacman:
    cmd: sudo pacman -S gum
    reference: https://github.com/charmbracelet/glow#package-manager
  kali/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install gum

      '
    reference: https://github.com/charmbracelet/gum#installation
    dsnap: gum
  rhel/yum:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' \

      && sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install gum

      '
    reference: https://github.com/charmbracelet/gum#installation
  fedora/yum:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' \

      && sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install gum

      '
    reference: https://github.com/charmbracelet/gum#installation
  raspbian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update && sudo apt install gum

      '
    reference: https://github.com/charmbracelet/gum#installation
  nix/nixpkgs:
    cmd: sudo nix-env -iA nixpkgs.gum
    reference: https://github.com/charmbracelet/gum#installation
  nix/flakes:
    cmd: sudo nix run "github:charmbracelet/gum" -- --help
    reference: https://github.com/charmbracelet/gum#installation
  (win|wsl2)/scoop:
    cmd: x scoop install charm-gum
    reference: https://github.com/charmbracelet/gum#installation
  (win|wsl2)/winget:
    cmd: x winget install charmbracelet.gum
    reference: https://github.com/charmbracelet/gum#installation
binlist:
- gum

# already profiled
