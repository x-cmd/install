lang: Ruby
homepage: https://github.com/red-data-tools/YouPlot
license: MIT
desc:
  en: YouPlot is a command line tool that draws plots on the terminal
  cn: YouPlot 是一个在终端上绘制图形的命令行工具
x:
  source: https://github.com/red-data-tools/YouPlot
  brew: youplot
rule:
  darwin/brew:
    cmd: brew install youplot
    reference: https://github.com/red-data-tools/YouPlot?tab=readme-ov-file#installation
  /guix:
    cmd: guix install youplot
    reference: https://github.com/red-data-tools/YouPlot?tab=readme-ov-file#installation
  /gem:
    cmd: gem install youplot
    reference: https://github.com/red-data-tools/YouPlot?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S ruby-youplot
    reference: https://aur.archlinux.org/packages/ruby-youplot
binlist:
- youplot

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
