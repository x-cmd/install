lang: Rust
desc:
  cn: 用于在控制台中显示好看的 ANSI 字体
  en: A pretty ANSI font for the console
  cs: Pěkné ANSI písmo pro konzoli
  de: Ein schönes ANSI-Schriftart für die Konsole
  es: Una fuente ANSI bonita para la consola
  fr: Une jolie police ANSI pour la console
  id: Font ANSI yang cantik untuk konsol
  it: Un bel carattere ANSI per la console
  ja: コンソール用の美しいANSIフォント
  ko: 콘솔용으로 보기 좋은 ANSI 글꼴
  pl: Ładna czcionka ANSI dla konsoli
  pt: Uma fonte ANSI bonita para o console
  ro: Un font ANSI frumos pentru consolă
  ru: Красивый шрифт ANSI для консоли
  th: ฟอนต์ ANSI สวยงามสำหรับคอนโซล
  tr: Konsol için güzel bir ANSI yazı tipi
  uk: Гарний шрифт ANSI для консолі
  vi: Phông chữ ANSI đẹp cho bảng điều khiển
homepage: https://github.com/dominikwilkowski/cfonts
license: GPL-3.0
x:
  source: https://github.com/dominikwilkowski/cfonts
  brew: cfonts
  port: cfonts
  yay: cfonts
  cargo: cfonts
rule:
  darwin/brew:
    cmd: brew install cfonts
    reference: https://github.com/dominikwilkowski/cfonts?tab=readme-ov-file#homebrew
  arch/yay:
    cmd: yay -S cfonts
    reference: https://github.com/dominikwilkowski/cfonts?tab=readme-ov-file#arch-user-repository
  darwin/port:
    cmd: sudo port install cfonts
    reference: https://github.com/dominikwilkowski/cfonts?tab=readme-ov-file#macports
  /cargo:
    cmd: cargo install cfonts
    reference: https://github.com/dominikwilkowski/cfonts?tab=readme-ov-file#cargo
    dsnap: cfonts
  /npm:
    cmd: npm i cfonts -g
    reference: https://github.com/dominikwilkowski/cfonts?tab=readme-ov-file#nodejs-1
    dsnap: cfonts
  /yarn:
    cmd: yarn global add cfonts
    reference: https://github.com/dominikwilkowski/cfonts?tab=readme-ov-file#yarn
binlist:
- cfonts

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.1 MB
          rating: 1
          desc:
            cn: 约 1.1 MB（估算）
            en: ~1.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
