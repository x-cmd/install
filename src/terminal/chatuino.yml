lang: 'Go'
homepage: https://github.com/julez-dev/chatuino
license: 'MIT'
desc:
  cn: 功能丰富的 TUI Twitch IRC 客户端
  en: 'A feature rich TUI Twitch IRC Client'
x:
  source: https://github.com/julez-dev/chatuino
  eget: https://github.com/julez-dev/chatuino
rule:
  /eget:
    cmd: x eget julez-dev/chatuino
    reference: https://github.com/julez-dev/chatuino
binlist:
  - 'chatuino'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.0 MB
          rating: 1
          desc:
            cn: 约 2.0 MB（估算）
            en: ~2.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
