lang: 'Go'
homepage: https://github.com/julez-dev/chatuino
license: 'MIT'
desc:
  cn: 功能丰富的 TUI Twitch IRC 客户端
  en: 'A feature rich TUI Twitch IRC Client'
  cs: TUI klient pro Twitch IRC s mnoha funkcemi
  de: Funktionsreicher TUI-Twitch-IRC-Client
  es: Un cliente TUI de Twitch IRC rico en funciones
  fr: Un client TUI Twitch IRC riche en fonctionnalités
  id: Klien IRC Twitch berbasis TUI dengan banyak fitur
  it: Un client TUI per Twitch IRC ricco di funzionalità
  ja: 機能豊富なTUI Twitch IRCクライアント
  ko: 기능이 풍부한 TUI Twitch IRC 클라이언트
  pl: Bogaty w funkcje klient IRC Twitch w TUI
  pt: Um cliente TUI de IRC do Twitch cheio de recursos
  ro: Un client TUI pentru IRC Twitch bogat în funcții
  ru: Функциональный TUI-клиент для Twitch IRC
  th: ไคลเอนต์ IRC ของ Twitch แบบ TUI ที่มีฟีเจอร์ครบถ้วน
  tr: Özellik yönlü TUI Twitch IRC istemcisi
  uk: Функціональний TUI-клієнт для Twitch IRC
  vi: Ứng dụng TUI IRC Twitch giàu tính năng
x:
  source: https://github.com/julez-dev/chatuino
  eget: julez-dev/chatuino
rule:
  /eget:
    cmd: x eget julez-dev/chatuino
    reference: https://github.com/julez-dev/chatuino
binlist:
- 'chatuino'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 安装 20 MB
            en: 20 MB install
        download:
          estimate: 20 MB
          desc:
            cn: 约 20 MB 下载 (linux/x64)
            en: ~20 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
