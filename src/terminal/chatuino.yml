lang: 'Go'
homepage: https://github.com/julez-dev/chatuino
license: 'MIT'
desc:
  cn: 功能丰富的 TUI Twitch IRC 客户端
  en: 'A feature rich TUI Twitch IRC Client'
x:
  source: https://github.com/julez-dev/chatuino
  eget: https://github.com/julez-dev/chatuino
rule:
  /eget:
    cmd: x eget julez-dev/chatuino
    reference: https://github.com/julez-dev/chatuino
binlist:
  - 'chatuino'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
