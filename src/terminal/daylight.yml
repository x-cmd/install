lang: 'Go'
homepage: 'https://github.com/jbreckmckye/daylight'
license: 'GPL-3.0'
desc:
  cn: 追踪日出与日落时间的命令行工具
  en: 'a command-line program for tracking sunrise and sunset times'
x:
  source: https://github.com/jbreckmckye/daylight
  eget: https://github.com/jbreckmckye/daylight
rule:
  /eget:
    cmd: x eget jbreckmckye/daylight
    reference: https://github.com/jbreckmckye/daylight
binlist:
  - 'daylight'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 75 KB
          rating: 1
          desc:
            cn: 约 75 KB（估算）
            en: ~75 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
