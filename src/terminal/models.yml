lang: 'Rust'
homepage: https://github.com/arimxyer/models
license: 'MIT'
desc:
  cn: 浏览各 AI 供应商模型、跑分、编程 Agent 与状态的 TUI 和 CLI
  en: 'TUI and CLI for browsing AI models, benchmarks, coding agents, and statuses for AI providers.'
x:
  source: https://github.com/arimxyer/models
  eget: https://github.com/arimxyer/models
rule:
  /eget:
    cmd: x eget arimxyer/models
    reference: https://github.com/arimxyer/models
binlist:
  - 'models'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
