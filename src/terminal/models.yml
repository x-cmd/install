lang: 'Rust'
homepage: https://github.com/arimxyer/models
license: 'MIT'
desc:
  cn: 浏览各 AI 供应商模型、跑分、编程 Agent 与状态的 TUI 和 CLI
  en: 'TUI and CLI for browsing AI models, benchmarks, coding agents, and statuses for AI providers.'
x:
  source: https://github.com/arimxyer/models
  eget: https://github.com/arimxyer/models
rule:
  /eget:
    cmd: x eget arimxyer/models
    reference: https://github.com/arimxyer/models
binlist:
- 'models'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
