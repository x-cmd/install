lang: Python
homepage: https://github.com/kovidgoyal/kitty
license: GPL-3.0
desc:
  cn: 快速，功能丰富，基于图形处理器的虚拟终端
  en: The fast, feature-rich, GPU based terminal emulator
x:
  source: https://github.com/kovidgoyal/kitty
  eget: https://github.com/kovidgoyal/kitty
rule:
  /eget:
    cmd: x eget kovidgoyal/kitty
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
    reference: https://sw.kovidgoyal.net/kitty/binary/#binary-install
  linux/curl:
    cmd: curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
    reference: https://sw.kovidgoyal.net/kitty/binary/#binary-install
binlist:
- kitty

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
