lang: Python
homepage: https://github.com/kovidgoyal/kitty
license: GPL-3.0
desc:
  cn: 快速，功能丰富，基于图形处理器的虚拟终端
  en: The fast, feature-rich, GPU based terminal emulator
  cs: Rychlý, bohatě vybavený emulátor terminálu založený na GPU
  de: Der schnelle, funktionsreiche, GPU-basierte Terminalemulator
  es: El emulador de terminal rápido, rico en funciones y basado en GPU
  fr: L'émulateur de terminal rapide, riche en fonctionnalités et basé sur le GPU
  id: Emulator terminal berbasis GPU yang cepat dan fitur lengkap
  it: Il rapido emulatore di terminale ricco di funzionalità basato su GPU
  ja: 高速で機能豊富な GPU ベースのターミナルエミュレーター
  ko: 빠르고 기능이 풍부한 GPU 기반 터미널 에뮬레이터
  pl: Szybki, bogaty w funkcje emulator terminala oparty na GPU
  pt: O emulador de terminal rápido, cheio de recursos e baseado em GPU
  ro: Emulatorul de terminal rapid, bogat în funcții, bazat pe GPU
  ru: Быстрый, богатый возможностями эмулятор терминала на базе GPU
  th: เทอร์มินัลอีมูเลเตอร์ที่เร็ว มีฟีเจอร์ครบ และใช้ GPU
  tr: Hızlı, özellik dolu, GPU tabanlı terminal emülatörü
  uk: Швидкий, багатофункціональний емулятор термінала на базі GPU
  vi: Trình mô phỏng terminal nhanh, giàu tính năng, dựa trên GPU
x:
  source: https://github.com/kovidgoyal/kitty
  eget: kovidgoyal/kitty
rule:
  /eget:
    cmd: x eget kovidgoyal/kitty
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
    reference: https://sw.kovidgoyal.net/kitty/binary/#binary-install
  linux/curl:
    cmd: curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
    reference: https://sw.kovidgoyal.net/kitty/binary/#binary-install
binlist:
- kitty

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 MB
          rating: 2
          desc:
            cn: 安装 25 MB
            en: 25 MB install
        download:
          estimate: 25 MB
          desc:
            cn: 约 25 MB 下载 (linux/x64)
            en: ~25 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 49 MB
        desc:
          cn: 49 MB
          en: 49 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
