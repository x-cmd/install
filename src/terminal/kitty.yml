lang: Python
homepage: https://github.com/kovidgoyal/kitty
license: GPL-3.0
desc:
  cn: 快速，功能丰富，基于图形处理器的虚拟终端
  en: The fast, feature-rich, GPU based terminal emulator
x:
  source: https://github.com/kovidgoyal/kitty
  eget: kovidgoyal/kitty
rule:
  /eget:
    cmd: x eget kovidgoyal/kitty
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
    reference: https://sw.kovidgoyal.net/kitty/binary/#binary-install
  linux/curl:
    cmd: curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
    reference: https://sw.kovidgoyal.net/kitty/binary/#binary-install
binlist:
- kitty

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 MB
          rating: 2
          desc:
            cn: 安装 25 MB
            en: 25 MB install
        download:
          estimate: 25 MB
          desc:
            cn: 约 25 MB 下载 (linux/x64)
            en: ~25 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 49 MB
        desc:
          cn: 49 MB
          en: 49 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
