lang: 'Rust'
homepage: https://github.com/mfontanini/presenterm
license: 'BSD-2-Clause'
desc:
  cn: 基于 Markdown 的终端演示工具
  en: 'A markdown terminal slideshow tool'
x:
  source: https://github.com/mfontanini/presenterm
  eget: https://github.com/mfontanini/presenterm
rule:
  /eget:
    cmd: x eget mfontanini/presenterm
    reference: https://github.com/mfontanini/presenterm
binlist:
- 'presenterm'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 841 KB
          rating: 1
          desc:
            cn: 约 841 KB（估算）
            en: ~841 KB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
