lang: 'Rust'
homepage: https://github.com/mfontanini/presenterm
license: 'BSD-2-Clause'
desc:
  cn: 基于 Markdown 的终端演示工具
  en: 'A markdown terminal slideshow tool'
x:
  source: https://github.com/mfontanini/presenterm
  eget: https://github.com/mfontanini/presenterm
rule:
  /eget:
    cmd: x eget mfontanini/presenterm
    reference: https://github.com/mfontanini/presenterm
binlist:
  - 'presenterm'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
