lang: 'Rust'
homepage: https://github.com/mfontanini/presenterm
license: 'BSD-2-Clause'
desc:
  cn: 基于 Markdown 的终端演示工具
  en: 'A markdown terminal slideshow tool'
  cs: Nástroj pro prezentace v terminálu založený na Markdown
  de: Ein Markdown-basiertes Präsentationswerkzeug für das Terminal
  es: Una herramienta de presentaciones de terminal basada en Markdown
  fr: Un outil de présentation en terminal basé sur Markdown
  id: Alat slideshow terminal berbasis Markdown
  it: Uno strumento per presentazioni da terminale basato su Markdown
  ja: Markdown ベースのターミナル スライドショー ツール
  ko: Markdown 기반 터미널 슬라이드쇼 도구
  pl: Narzędzie do prezentacji w terminalu oparte na Markdown
  pt: Uma ferramenta de apresentação em terminal baseada em Markdown
  ro: Un instrument de prezentări în terminal bazat pe Markdown
  ru: Инструмент для показа презентаций в терминале на основе Markdown
  th: เครื่องมือสไลด์โชว์บนเทอร์มินัลที่ใช้ Markdown
  tr: Markdown tabanlı bir terminal slayt gösterisi aracı
  uk: Інструмент для показу презентацій у терміналі на основі Markdown
  vi: Công cụ trình chiếu slide trên terminal dựa trên Markdown
x:
  source: https://github.com/mfontanini/presenterm
  eget: mfontanini/presenterm
rule:
  /eget:
    cmd: x eget mfontanini/presenterm
    reference: https://github.com/mfontanini/presenterm
binlist:
- 'presenterm'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
