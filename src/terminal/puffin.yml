lang: 'Go'
homepage: 'https://github.com/siddhantac/puffin'
license: 'MIT'
desc:
  cn: 美观的 hledger 终端仪表盘
  en: 'A beautiful terminal dashboard for hledger 💰'
  cs: Krásný terminálový panel pro hledger 💰
  de: Ein schönes Terminal-Dashboard für hledger 💰
  es: Un panel de terminal bonito para hledger 💰
  fr: Un beau tableau de bord terminal pour hledger 💰
  id: Dasbor terminal yang indah untuk hledger 💰
  it: Un bellissimo cruscotto da terminale per hledger 💰
  ja: hledger 向けの美しいターミナルダッシュボード 💰
  ko: hledger를 위한 아름다운 터미널 대시보드 💰
  pl: Ładny terminalowy pulpit nawigacyjny dla hledger 💰
  pt: Um belo painel de terminal para hledger 💰
  ro: Un tablou de bord de terminal frumos pentru hledger 💰
  ru: Красивая терминальная панель для hledger 💰
  th: แดชบอร์ดเทอร์มินัลสวยงามสำหรับ hledger 💰
  tr: hledger için güzel bir terminal panosu 💰
  uk: Гарна термінальна панель для hledger 💰
  vi: Bảng điều khiển terminal xinh đẹp cho hledger 💰
x:
  source: https://github.com/siddhantac/puffin
  eget: siddhantac/puffin
rule:
  /eget:
    cmd: x eget siddhantac/puffin
    reference: https://github.com/siddhantac/puffin
binlist:
- 'puffin'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
