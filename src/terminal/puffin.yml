lang: 'Go'
homepage: 'https://github.com/siddhantac/puffin'
license: 'MIT'
desc:
  cn: 美观的 hledger 终端仪表盘
  en: 'A beautiful terminal dashboard for hledger 💰'
x:
  source: https://github.com/siddhantac/puffin
  eget: https://github.com/siddhantac/puffin
rule:
  /eget:
    cmd: x eget siddhantac/puffin
    reference: https://github.com/siddhantac/puffin
binlist:
  - 'puffin'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
