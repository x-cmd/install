lang: Go
homepage: https://github.com/guptarohit/asciigraph
license: BSD-3-Clause
desc:
  cn: 在命令行应用程序中制作轻量级 ASCII 线图╭┈╯，无需其他依赖项
  en: Go package to make lightweight ASCII line graph ╭┈╯ in command line apps with no other dependencies
x:
  pkg:
    exist: true
  source: https://github.com/guptarohit/asciigraph
rule:
  /x:
    cmd: x pkg use asciigraph
    reference: https://x-cmd.com/install/
  /go:
    cmd: go get -u github.com/guptarohit/asciigraph@latest
    reference: https://github.com/guptarohit/asciigraph?tab=readme-ov-file#installation
    dsnap: github.com/guptarohit/asciigraph@latest
binlist:
- asciigraph

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 772 KB
          rating: 1
          desc:
            cn: 安装 772 KB
            en: 772 KB install
        download:
          estimate: 772 KB
          desc:
            cn: 约 772 KB 下载 (linux/x64)
            en: ~772 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
