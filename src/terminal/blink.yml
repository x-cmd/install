lang: 'C'
homepage: 'https://github.com/jart/blink'
license: 'ISC'
desc:
  cn: 最小的 x86-64-linux 模拟器
  en: 'tiniest x86-64-linux emulator'
x:
  source: https://github.com/jart/blink
  eget: https://github.com/jart/blink
rule:
  /eget:
    cmd: x eget jart/blink
    reference: https://github.com/jart/blink
binlist:
  - 'blink'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
