lang: 'Rust'
homepage: https://github.com/tassiovirginio/try-rs
license: 'MIT'
desc:
  cn: 基于 Rust 的极速临时实验工作区管理器
  en: 'A blazing fast, Rust-based workspace manager for your temporary experiments.'
x:
  source: https://github.com/tassiovirginio/try-rs
  eget: https://github.com/tassiovirginio/try-rs
rule:
  /eget:
    cmd: x eget tassiovirginio/try-rs
    reference: https://github.com/tassiovirginio/try-rs
binlist:
  - 'try-rs'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
