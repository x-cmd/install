lang: 'Rust'
homepage: https://github.com/tassiovirginio/try-rs
license: 'MIT'
desc:
  cn: 基于 Rust 的极速临时实验工作区管理器
  en: 'A blazing fast, Rust-based workspace manager for your temporary experiments.'
x:
  source: https://github.com/tassiovirginio/try-rs
  eget: tassiovirginio/try-rs
rule:
  /eget:
    cmd: x eget tassiovirginio/try-rs
    reference: https://github.com/tassiovirginio/try-rs
binlist:
- 'try-rs'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 561 KB
          rating: 1
          desc:
            cn: 安装 561 KB
            en: 561 KB install
        download:
          estimate: 561 KB
          desc:
            cn: 约 561 KB 下载 (linux/x64)
            en: ~561 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
