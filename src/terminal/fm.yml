lang: 'Go'
homepage: 'https://github.com/mistakenelf/fm'
license: 'MIT'
desc:
  cn: 终端文件管理器
  en: 'A terminal based file manager'
x:
  source: https://github.com/mistakenelf/fm
  eget: https://github.com/mistakenelf/fm
rule:
  /eget:
    cmd: x eget mistakenelf/fm
    reference: https://github.com/mistakenelf/fm
binlist:
  - 'fm'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 275 KB
          rating: 1
          desc:
            cn: 约 275 KB（估算）
            en: ~275 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
