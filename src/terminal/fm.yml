lang: 'Go'
homepage: 'https://github.com/mistakenelf/fm'
license: 'MIT'
desc:
  cn: 终端文件管理器
  en: 'A terminal based file manager'
x:
  source: https://github.com/mistakenelf/fm
  eget: https://github.com/mistakenelf/fm
rule:
  /eget:
    cmd: x eget mistakenelf/fm
    reference: https://github.com/mistakenelf/fm
binlist:
  - 'fm'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
