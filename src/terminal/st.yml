lang: C
homepage: https://st.suckless.org/
license: MIT
desc:
  cn: st 是 suckless.org 的极简 X11 终端模拟器源码，需要手动编译与补丁。
  en: st is the suckless minimal X11 terminal emulator source — requires manual build and patching.
x:
  source: https://git.suckless.org/st
  pacman: st
  dnf: st
  apt: stterm
rule:
  (linux|arch|manjaro)/pacman:
    cmd: sudo pacman -S st
    reference: https://st.suckless.org/
  (linux|fedora|rhel|centos)/dnf:
    cmd: sudo dnf install st
    reference: https://src.fedoraproject.org/rpms/st
    dsnap: st
  (linux|debian|ubuntu)/apt:
    cmd: sudo apt-get install stterm
    reference: https://packages.debian.org/sid/stterm
    dsnap: stterm
  /source:
    cmd: 'git clone https://git.suckless.org/st && cd st && make clean install'
    reference: https://st.suckless.org/
    dsnap: st
binlist:
- st
license: NOASSERTION
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件（Xresources）
          en: Reads config files (Xresources)
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 约 1 MB（源码 + 编译产物）
            en: ~1 MB (source + binary)
      paths:
        data: []
        config:
          - ~/.Xresources
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 约 5 MB 闲置
          en: ~5 MB idle
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none