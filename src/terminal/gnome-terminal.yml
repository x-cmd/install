lang: C
homepage: https://gitlab.gnome.org/GNOME/gnome-terminal
license: GPL-2.0
desc:
  cn: GNOME Terminal 是 GNOME 桌面的默认终端模拟器，使用 VTE 库。
  en: GNOME Terminal is the default terminal emulator of the GNOME desktop, built on the VTE library.
  cs: GNOME Terminal je výchozí emulátor terminálu desktopového prostředí GNOME, postavený na knihovně VTE.
  de: GNOME Terminal ist der Standard-Terminalemulator der GNOME-Desktop-Umgebung, basierend auf der VTE-Bibliothek.
  es: GNOME Terminal es el emulador de terminal predeterminado del escritorio GNOME, construido sobre la biblioteca VTE.
  fr: GNOME Terminal est l'émulateur de terminal par défaut de l'environnement de bureau GNOME, bâti sur la bibliothèque VTE.
  id: GNOME Terminal adalah emulator terminal bawaan dari desktop GNOME, yang dibangun di atas pustaka VTE.
  it: GNOME Terminal è l'emulatore di terminale predefinito dell'ambiente desktop GNOME, basato sulla libreria VTE.
  ja: GNOME Terminal は GNOME デスクトップの標準ターミナルエミュレーターで、VTE ライブラリに基づいて構築されています。
  ko: GNOME Terminal은 VTE 라이브러리를 기반으로 제작된 GNOME 데스크톱의 기본 터미널 에뮬레이터입니다.
  pl: GNOME Terminal to domyślny emulator terminala środowiska pulpitu GNOME, zbudowany na bibliotece VTE.
  pt: O GNOME Terminal é o emulador de terminal padrão do ambiente de desktop GNOME, construído sobre a biblioteca VTE.
  ro: GNOME Terminal este emulatorul de terminal implicit al mediului desktop GNOME, construit pe baza bibliotecii VTE.
  ru: GNOME Terminal — стандартный эмулятор терминала среды рабочего стола GNOME, построенный на библиотеке VTE.
  th: GNOME Terminal คือเทอร์มินัลอีมูเลเตอร์เริ่มต้นของเดสก์ท็อป GNOME สร้างขึ้นบนไลบรารี VTE
  tr: GNOME Terminal, GNOME masaüstünün varsayılan terminal emülatörüdür ve VTE kütüphanesi üzerine kurulmuştur.
  uk: GNOME Terminal — стандартний емулятор термінала робочого столу GNOME, побудований на бібліотеці VTE.
  vi: GNOME Terminal là trình giả lập terminal mặc định của môi trường GNOME, xây dựng trên thư viện VTE.
x:
  source: https://gitlab.gnome.org/GNOME/gnome-terminal
  apt: gnome-terminal
  dnf: gnome-terminal
  pacman: gnome-terminal
  brew: gnome-terminal
rule:
  (linux|debian|ubuntu|kali|mint)/apt:
    cmd: sudo apt-get install gnome-terminal
    reference: https://help.gnome.org/users/gnome-terminal/stable/
    dsnap: gnome-terminal
  (linux|fedora|rhel|centos)/dnf:
    cmd: sudo dnf install gnome-terminal
    reference: https://src.fedoraproject.org/rpms/gnome-terminal
    dsnap: gnome-terminal
  (linux|arch|manjaro)/pacman:
    cmd: sudo pacman -S gnome-terminal
    reference: https://wiki.archlinux.org/title/GNOME_Terminal
  darwin/brew:
    cmd: brew install --cask gnome-terminal
    reference: https://formulae.brew.sh/cask/gnome-terminal
binlist:
- gnome-terminal
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 约 30 MB 安装
            en: ~30 MB install
      paths:
        data: []
        config:
          - ~/.gconf/apps/gnome-terminal
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 约 50 MB 闲置
          en: ~50 MB idle
    cpu:
      workload: ['io', 'compute']
      processes: 2
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none