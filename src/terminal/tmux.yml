homepage: https://github.com/tmux/tmux
license: ISC
desc:
  cn: tmux 是一个终端多路复用器。
  en: tmux is a terminal multiplexer.
lang: C
x:
  pkg:
    exist: true
  source: https://github.com/tmux/tmux
  eget: https://github.com/tmux/tmux
rule:
  /eget:
    cmd: x eget tmux/tmux
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use tmux
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use tmux
    reference: https://github.com/aphecetche/asdf-tmux
  darwin/brew:
    cmd: brew install tmux
    reference: https://formulae.brew.sh/formula/tmux#default
  debian/apt:
    cmd: sudo apt-get install tmux
    reference: https://command-not-found.com/tmux
    dsnap: tmux
  ubuntu/apt:
    cmd: sudo apt-get install tmux
    reference: https://command-not-found.com/tmux
    dsnap: tmux
  alpine/apk:
    cmd: sudo apk add tmux
    reference: https://command-not-found.com/tmux
    dsnap: tmux
  arch/pacman:
    cmd: sudo pacman -S tmux
    reference: https://command-not-found.com/tmux
  kali/apt:
    cmd: sudo apt-get install tmux
    reference: https://command-not-found.com/tmux
    dsnap: tmux
  centos/yum:
    cmd: sudo yum install tmux
    reference: https://command-not-found.com/tmux
  fedora/dnf:
    cmd: sudo dnf install tmux
    reference: https://command-not-found.com/tmux
    dsnap: tmux
  raspbian/apt:
    cmd: sudo apt-get install tmux
    reference: https://command-not-found.com/tmux
binlist:
- tmux

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
