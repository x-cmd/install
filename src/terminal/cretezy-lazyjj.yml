lang: Rust
homepage: https://github.com/Cretezy/lazyjj
license: apache-2.0
desc:
  cn: Jujutsu/jj 的 TUI 界面
  en: TUI for Jujutsu/jj
x:
  source: https://github.com/Cretezy/lazyjj
  eget: https://github.com/Cretezy/lazyjj
rule:
  /eget:
    cmd: x eget Cretezy/lazyjj
    reference: https://github.com/Cretezy/lazyjj
binlist:
- lazyjj

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
