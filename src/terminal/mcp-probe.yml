lang: Rust
homepage: https://github.com/conikeec/mcp-probe
license: mit
desc:
  cn: Rust 实现的 MCP 客户端库与调试工具集，既是构建 MCP 集成的生产级 SDK，也是交互式调试器核心
  en: A Model Context Protocol (MCP) client library and debugging toolkit in Rust. This foundation provides both a production-ready SDK for building MCP integrations and the core architecture for an interactive debugger.
x:
  source: https://github.com/conikeec/mcp-probe
  eget: conikeec/mcp-probe
rule:
  /eget:
    cmd: x eget conikeec/mcp-probe
    reference: https://github.com/conikeec/mcp-probe
binlist:
- mcp-probe

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 769 KB
          rating: 1
          desc:
            cn: 约 769 KB（估算）
            en: ~769 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
