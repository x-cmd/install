lang: 'Rust'
homepage: https://github.com/sharkdp/numbat
license: 'Apache-2.0'
desc:
  cn: 支持物理量纲与单位的静态类型科学计算编程语言
  en: 'A statically typed programming language for scientific computations with first class support for physical dimensions and units'
x:
  source: https://github.com/sharkdp/numbat
  eget: https://github.com/sharkdp/numbat
rule:
  /eget:
    cmd: x eget sharkdp/numbat
    reference: https://github.com/sharkdp/numbat
binlist:
- 'numbat'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.1 MB
          rating: 1
          desc:
            cn: 约 1.1 MB（估算）
            en: ~1.1 MB estimated
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
