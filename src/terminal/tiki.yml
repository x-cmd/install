lang: 'Go'
homepage: 'https://github.com/boolean-maybe/tiki'
license: 'Apache-2.0'
desc:
  cn: 基于 Markdown 的终端无固定形态工作流构建器
  en: 'Terminal Markdown-based shapeless workflow builder'
x:
  source: https://github.com/boolean-maybe/tiki
  eget: https://github.com/boolean-maybe/tiki
rule:
  /eget:
    cmd: x eget boolean-maybe/tiki
    reference: https://github.com/boolean-maybe/tiki
binlist:
- 'tiki'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.8 MB
          rating: 1
          desc:
            cn: 约 6.8 MB（估算）
            en: ~6.8 MB estimated
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
