lang: 'Go'
homepage: 'https://github.com/boolean-maybe/tiki'
license: 'Apache-2.0'
desc:
  cn: 基于 Markdown 的终端无固定形态工作流构建器
  en: 'Terminal Markdown-based shapeless workflow builder'
x:
  source: https://github.com/boolean-maybe/tiki
  eget: https://github.com/boolean-maybe/tiki
rule:
  /eget:
    cmd: x eget boolean-maybe/tiki
    reference: https://github.com/boolean-maybe/tiki
binlist:
  - 'tiki'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
