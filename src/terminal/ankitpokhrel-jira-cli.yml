lang: Go
homepage: https://github.com/ankitpokhrel/jira-cli
license: mit
desc:
  cn: 功能丰富的交互式 Jira 命令行工具
  en: 🔥 Feature-rich interactive Jira command line.
x:
  source: https://github.com/ankitpokhrel/jira-cli
  eget: https://github.com/ankitpokhrel/jira-cli
rule:
  /eget:
    cmd: x eget ankitpokhrel/jira-cli
    reference: https://github.com/ankitpokhrel/jira-cli
binlist:
- jira-cli

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
