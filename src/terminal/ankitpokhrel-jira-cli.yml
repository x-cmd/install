lang: Go
homepage: https://github.com/ankitpokhrel/jira-cli
license: mit
desc:
  cn: 功能丰富的交互式 Jira 命令行工具
  en: 🔥 Feature-rich interactive Jira command line.
  cs: 🔥 Funkčně bohaté interaktivní rozhraní příkazové řádky pro Jira.
  de: 🔥 Funktionsreiche interaktive Jira-Kommandozeile.
  es: 🔥 Línea de comandos de Jira interactiva y rica en funciones.
  fr: 🔥 Ligne de commande Jira interactive et riche en fonctionnalités.
  id: 🔥 Baris perintah Jira interaktif yang kaya fitur.
  it: 🔥 Riga di comando Jira interattiva e ricca di funzionalità.
  ja: 🔥 機能が豊富なインタラクティブな Jira コマンドライン。
  ko: 🔥 기능이 풍부한 대화형 Jira 명령줄.
  pl: 🔥 Bogaty w funkcje interaktywne polecenie Jira.
  pt: 🔥 Linha de comando do Jira interativa e rica em recursos.
  ro: 🔥 Linie de comandă Jira interactivă și bogată în funcții.
  ru: 🔥 Богатая возможностями интерактивная командная строка Jira.
  th: 🔥 เครื่องมือบรรทัดคำสั่ง Jira แบบโต้ตอบที่มีความสามารถหลากหลาย.
  tr: 🔥 Özellik açısından zengin etkileşimli Jira komut satırı.
  uk: 🔥 Багатофункціональний інтерактивний командний рядок Jira.
  vi: 🔥 Dòng lệnh Jira tương tác giàu tính năng.
x:
  source: https://github.com/ankitpokhrel/jira-cli
  eget: ankitpokhrel/jira-cli
rule:
  /eget:
    cmd: x eget ankitpokhrel/jira-cli
    reference: https://github.com/ankitpokhrel/jira-cli
binlist:
- jira-cli

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
