lang: Go
homepage: https://github.com/ankitpokhrel/jira-cli
license: mit
desc:
  cn: 功能丰富的交互式 Jira 命令行工具
  en: 🔥 Feature-rich interactive Jira command line.
x:
  source: https://github.com/ankitpokhrel/jira-cli
  eget: https://github.com/ankitpokhrel/jira-cli
rule:
  /eget:
    cmd: x eget ankitpokhrel/jira-cli
    reference: https://github.com/ankitpokhrel/jira-cli
binlist:
- jira-cli

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
