lang: 'Rust'
homepage: https://github.com/ricardodantas/hazelnut
license: 'GPL-3.0'
desc:
  cn: 灵感来自 Hazel 的终端自动文件整理器，监控文件夹并按规则归档
  en: '🌰 Terminal-based automated file organizer inspired by Hazel. Watch folders and organize files with rules.'
x:
  source: https://github.com/ricardodantas/hazelnut
  eget: https://github.com/ricardodantas/hazelnut
rule:
  /eget:
    cmd: x eget ricardodantas/hazelnut
    reference: https://github.com/ricardodantas/hazelnut
binlist:
  - 'hazelnut'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
