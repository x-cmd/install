lang: 'Rust'
homepage: https://github.com/ricardodantas/hazelnut
license: 'GPL-3.0'
desc:
  cn: 灵感来自 Hazel 的终端自动文件整理器，监控文件夹并按规则归档
  en: '🌰 Terminal-based automated file organizer inspired by Hazel. Watch folders and organize files with rules.'
x:
  source: https://github.com/ricardodantas/hazelnut
  eget: ricardodantas/hazelnut
rule:
  /eget:
    cmd: x eget ricardodantas/hazelnut
    reference: https://github.com/ricardodantas/hazelnut
binlist:
- 'hazelnut'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
