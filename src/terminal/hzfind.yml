lang: Rust
homepage: https://github.com/clouedoc/hzfind
desc:
  cn: 寻找 Hetzner 专用服务器拍卖最佳性价比的 TUI，内置 PassMark CPU 跑分
  en: A TUI to find the best Hetzner dedicated server auction deals, with PassMark CPU benchmarks built-in
x:
  source: https://github.com/clouedoc/hzfind
  eget: https://github.com/clouedoc/hzfind
rule:
  /eget:
    cmd: x eget clouedoc/hzfind
    reference: https://github.com/clouedoc/hzfind
binlist:
- hzfind
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
