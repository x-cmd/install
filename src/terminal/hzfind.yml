lang: Rust
homepage: https://github.com/clouedoc/hzfind
desc:
  cn: 寻找 Hetzner 专用服务器拍卖最佳性价比的 TUI，内置 PassMark CPU 跑分
  en: A TUI to find the best Hetzner dedicated server auction deals, with PassMark CPU benchmarks built-in
x:
  source: https://github.com/clouedoc/hzfind
  eget: clouedoc/hzfind
rule:
  /eget:
    cmd: x eget clouedoc/hzfind
    reference: https://github.com/clouedoc/hzfind
binlist:
- hzfind
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 97 KB
          rating: 1
          desc:
            cn: 约 97 KB（估算）
            en: ~97 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
