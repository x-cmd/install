lang: Python
homepage: https://github.com/JoshKarpel/spiel
license: MIT
desc:
  cn: 使用终端显示丰富样式的演示文稿的 CLI 工具和框架。
  en: A CLI tool and framework for creating and presenting richly-styled terminal presentations.
x:
  source: https://github.com/JoshKarpel/spiel
  pip: spiel
rule:
  /pip:
    cmd: pip install spiel
    reference: https://www.spiel.how/quickstart/
    dsnap: spiel
binlist:
- spiel

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
