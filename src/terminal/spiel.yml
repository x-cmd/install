lang: Python
homepage: https://github.com/JoshKarpel/spiel
license: MIT
desc:
  cn: 使用终端显示丰富样式的演示文稿的 CLI 工具和框架。
  en: A CLI tool and framework for creating and presenting richly-styled terminal presentations.
x:
  source: https://github.com/JoshKarpel/spiel
rule:
  /pip:
    cmd: pip install spiel
    reference: https://www.spiel.how/quickstart/
    dsnap: spiel
binlist:
- spiel

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
