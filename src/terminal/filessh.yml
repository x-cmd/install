lang: 'Rust'
homepage: https://github.com/JayanAXHF/filessh
license: 'Unlicense'
desc:
  cn: 面向远程服务器的快速便捷 TUI 文件浏览器
  en: 'A fast and convenient TUI file browser for remote servers'
x:
  source: https://github.com/JayanAXHF/filessh
  eget: https://github.com/JayanAXHF/filessh
rule:
  /eget:
    cmd: x eget JayanAXHF/filessh
    reference: https://github.com/JayanAXHF/filessh
binlist:
  - 'filessh'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
