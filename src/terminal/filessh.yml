lang: 'Rust'
homepage: https://github.com/JayanAXHF/filessh
license: 'Unlicense'
desc:
  cn: 面向远程服务器的快速便捷 TUI 文件浏览器
  en: 'A fast and convenient TUI file browser for remote servers'
  cs: Rychlý a pohodlný prohlížeč souborů TUI pro vzdálené servery
  de: Ein schneller und bequemer TUI-Dateibrowser für entfernte Server
  es: Un explorador de archivos TUI rápido y práctico para servidores remotos
  fr: Un navigateur de fichiers TUI rapide et pratique pour les serveurs distants
  id: Penjelajah file TUI yang cepat dan nyaman untuk server jarak jauh
  it: Un browser di file TUI veloce e comodo per server remoti
  ja: リモートサーバー向けの高速で便利なTUIファイルブラウザー
  ko: 원격 서버를 위한 빠르고 편리한 TUI 파일 브라우저
  pl: Szybki i wygodny przeglądarka plików TUI dla zdalnych serwerów
  pt: Um navegador de arquivos TUI rápido e conveniente para servidores remotos
  ro: Un explorator de fișiere TUI rapid și convenabil pentru servere la distanță
  ru: Быстрый и удобный TUI-браузер файлов для удалённых серверов
  th: ตัวเรียกดูไฟล์ TUI ที่รวดเร็วและสะดวกสำหรับเซิร์ฟเวอร์ระยะไกล
  tr: Uzak sunucular için hızlı ve kullanışlı TUI dosya tarayıcısı
  uk: Швидкий і зручний TUI-браузер файлів для віддалених серверів
  vi: Trình duyệt tệp TUI nhanh và tiện lợi cho máy chủ từ xa
x:
  source: https://github.com/JayanAXHF/filessh
  eget: JayanAXHF/filessh
rule:
  /eget:
    cmd: x eget JayanAXHF/filessh
    reference: https://github.com/JayanAXHF/filessh
binlist:
  - 'filessh'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 162 KB
          rating: 1
          desc:
            cn: 约 162 KB（估算）
            en: ~162 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
