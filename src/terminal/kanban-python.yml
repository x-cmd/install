lang: Python
homepage: https://github.com/Zaloog/kanban-python
license: MIT
desc:
  cn: 用 Python 编写的终端看板应用程序，可提高您的工作效率🚀
  en: A Terminal Kanban Application written in Python to boost your productivity 🚀
x:
  pkg:
    exist: true
  source: https://github.com/Zaloog/kanban-python
rule:
  /x:
    cmd: x pkg use kanban-python
    reference: https://x-cmd.com/install/
  /pip:
    cmd: python -m pip install kanban-python
    reference: https://github.com/Zaloog/kanban-python?tab=readme-ov-file#installation
    dsnap: kanban-python
  /pipx:
    cmd: pipx install kanban-python
    reference: https://github.com/Zaloog/kanban-python?tab=readme-ov-file#installation
binlist:
- kanban-python

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
