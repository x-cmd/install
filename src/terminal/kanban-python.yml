  th: แอปพลิเคชัน Kanban บนเทอร์มินัลที่เขียนด้วย Python เพื่อเพิ่มประสิทธิภาพของคุณ 🚀
  tr: Üretkenliğinizi artırmak için Python ile yazılmış terminal Kanban uygulaması 🚀
  uk: Термінальний застосунок Kanban, написаний на Python, для підвищення вашої продуктивності 🚀
  vi: Ứng dụng Kanban trên terminal viết bằng Python giúp tăng năng suất của bạn 🚀
x:
  source: https://github.com/Zaloog/kanban-python
  pip: kanban-python
rule:
  /x:
    cmd: x pkg use kanban-python
    reference: https://x-cmd.com/install/
  /pip:
    cmd: python -m pip install kanban-python
    reference: https://github.com/Zaloog/kanban-python?tab=readme-ov-file#installation
    dsnap: kanban-python
  /pipx:
    cmd: pipx install kanban-python
    reference: https://github.com/Zaloog/kanban-python?tab=readme-ov-file#installation
binlist:
- kanban-python

