lang: Python
homepage: https://github.com/sauljabin/kaskade
license: MIT
desc:
  en: Kaskade is a text user interface (TUI) for Apache Kafka
  cn: Kaskade 是一个用于 Apache Kafka 的文本用户界面（TUI）。
  cs: Kaskade je textové uživatelské rozhraní (TUI) pro Apache Kafka
  de: Kaskade ist eine textbasierte Benutzeroberfläche (TUI) für Apache Kafka
  es: Kaskade es una interfaz de usuario de texto (TUI) para Apache Kafka
  fr: Kaskade est une interface utilisateur textuelle (TUI) pour Apache Kafka
  id: Kaskade adalah antarmuka pengguna berbasis teks (TUI) untuk Apache Kafka
  it: Kaskade è un'interfaccia utente testuale (TUI) per Apache Kafka
  ja: Kaskade は Apache Kafka のためのテキストユーザーインターフェース (TUI) です
  ko: Kaskade는 Apache Kafka를 위한 텍스트 사용자 인터페이스(TUI)입니다
  pl: Kaskade to tekstowy interfejs użytkownika (TUI) dla Apache Kafka
  pt: Kaskade é uma interface de usuário em texto (TUI) para Apache Kafka
  ro: Kaskade este o interfață utilizator bazată pe text (TUI) pentru Apache Kafka
  ru: Kaskade — текстовый пользовательский интерфейс (TUI) для Apache Kafka
  th: Kaskade คือส่วนติดต่อผู้ใช้แบบข้อความ (TUI) สำหรับ Apache Kafka
  tr: Kaskade, Apache Kafka için metin tabanlı bir kullanıcı arayüzüdür (TUI)
  uk: Kaskade — текстовий інтерфейс користувача (TUI) для Apache Kafka
  vi: Kaskade là giao diện người dùng dạng văn bản (TUI) cho Apache Kafka
x:
  source: https://github.com/sauljabin/kaskade
  eget: sauljabin/kaskade
  brew: kaskade
rule:
  /eget:
    cmd: x eget sauljabin/kaskade
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install kaskade
    reference: https://github.com/sauljabin/kaskade?tab=readme-ov-file#installation
  /pipx:
    cmd: pipx install kaskade
    reference: https://github.com/sauljabin/kaskade?tab=readme-ov-file#installation
binlist:
- kaskade

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 71 KB
          rating: 1
          desc:
            cn: 安装 71 KB
            en: 71 KB install
        download:
          estimate: 71 KB
          desc:
            cn: 约 71 KB 下载 (whl)
            en: ~71 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
