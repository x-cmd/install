lang: Python
homepage: https://github.com/sauljabin/kaskade
license: MIT
desc:
  en: Kaskade is a text user interface (TUI) for Apache Kafka
  cn: Kaskade 是一个用于 Apache Kafka 的文本用户界面（TUI）。
x:
  source: https://github.com/sauljabin/kaskade
  eget: https://github.com/sauljabin/kaskade
  brew: kaskade
rule:
  /eget:
    cmd: x eget sauljabin/kaskade
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install kaskade
    reference: https://github.com/sauljabin/kaskade?tab=readme-ov-file#installation
  /pipx:
    cmd: pipx install kaskade
    reference: https://github.com/sauljabin/kaskade?tab=readme-ov-file#installation
binlist:
- kaskade

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 71 KB
          rating: 1
          desc:
            cn: 安装 71 KB
            en: 71 KB install
        download:
          estimate: 71 KB
          desc:
            cn: 约 71 KB 下载 (whl)
            en: ~71 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
