lang: Python
homepage: https://github.com/sauljabin/kaskade
license: MIT
desc:
  en: Kaskade is a text user interface (TUI) for Apache Kafka
  cn: Kaskade 是一个用于 Apache Kafka 的文本用户界面（TUI）。
x:
  source: https://github.com/sauljabin/kaskade
  eget: https://github.com/sauljabin/kaskade
rule:
  /eget:
    cmd: x eget sauljabin/kaskade
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install kaskade
    reference: https://github.com/sauljabin/kaskade?tab=readme-ov-file#installation
  /pipx:
    cmd: pipx install kaskade
    reference: https://github.com/sauljabin/kaskade?tab=readme-ov-file#installation
binlist:
- kaskade

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
