lang: 'Rust'
homepage: https://github.com/arnica/depsguard
license: 'MIT'
desc:
  cn: 加固包管理器配置以抵御供应链攻击
  en: 'Harden your package manager configs against supply chain attacks.'
x:
  source: https://github.com/arnica/depsguard
  eget: https://github.com/arnica/depsguard
rule:
  /cargo:
    cmd: 'cargo install depsguard'
    reference: https://github.com/arnica/depsguard
  /eget:
    cmd: x eget arnica/depsguard
    reference: https://github.com/arnica/depsguard
binlist:
  - 'depsguard'

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 369 KB
          rating: 1
          desc:
            cn: 约 369 KB（估算）
            en: ~369 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
