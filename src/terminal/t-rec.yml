lang: Rust
homepage: https://github.com/sassman/t-rec-rs
license: GPL-3.0
desc:
  cn: 用 Rust 编写的极快的终端记录器，用于为网络生成动画 gif 图像
  en: Blazingly fast terminal recorder that generates animated gif images for the web written in rust
  cs: Bleskově rychlý zaznamovadlo terminálu, které generuje animované gif obrázky pro web, napsáno v Rustu
  de: Blitzschneller Terminal-Recorder, der animierte GIF-Bilder für das Web erzeugt, geschrieben in Rust
  es: Grabador de terminal ultrápido que genera imágenes gif animadas para la web, escrito en Rust
  fr: Enregistreur de terminal très rapide qui génère des images gif animées pour le web, écrit en Rust
  id: Perekam terminal sangat cepat yang menghasilkan gambar gif animasi untuk web, ditulis dalam Rust
  it: Registratore da terminale velocissimo che genera immagini gif animate per il web, scritto in Rust
  ja: Rust で書かれた超高速のターミナルレコーダで、ウェブ向けのアニメーション GIF を生成します
  ko: Rust로 작성된 매우 빠른 터미널 레코더로 웹용 애니메이션 gif 이미지를 생성합니다
  pl: Błyskawicznie szybki rejestrator terminala generujący animowane obrazy gif dla sieci, napisany w Rust
  pt: Gravador de terminal extremamente rápido que gera imagens gif animadas para a web, escrito em Rust
  ro: Înregistrator de terminal foarte rapid care generează imagini gif animate pentru web, scris în Rust
  ru: Сверхбыстрый рекордер терминала, генерирующий анимированные gif-изображения для веба, написанный на Rust
  th: ตัวบันทึกเทอร์มินัลที่เร็วดั่งพริบไฟ สร้างภาพ gif แบบเคลื่อนไหวสำหรับเว็บ เขียนด้วย Rust
  tr: Web için animasyonlu gif görselleri üreten, Rust ile yazılmış çok hızlı terminal kaydedici
  uk: Надшвидкий рекордер термінала, що генерує анімовані gif-зображення для вебу, написаний на Rust
  vi: Trình ghi hình terminal cực nhanh tạo ảnh gif động cho web, viết bằng Rust
x:
  source: https://github.com/sassman/t-rec-rs
  eget: sassman/t-rec-rs
  apt: imagemagick
  brew: t-rec
  snap: t-rec
  apt-get: imagemagick
  port: t-rec
  yay: t-rec
  paru: t-rec
rule:
  /eget:
    cmd: x eget sassman/t-rec-rs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install t-rec
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-macos
  darwin/port:
    cmd: 'sudo port selfupdate

      sudo port install t-rec

      '
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-macos
  /cargo:
    cmd: cargo install -f t-rec
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-macos
    dsnap: t-rec
  ubuntu/dpkg:
    cmd: 'sudo apt-get install imagemagick

      wget https://github.com/sassman/t-rec-rs/releases/download/v0.5.0/t-rec_0.5.0_amd64.deb

      sudo dpkg -i t-rec_0.5.0_amd64.deb

      '
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-linux
  ubuntu/snap:
    cmd: sudo snap install t-rec --classic
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-linux
  arch/paru:
    cmd: paru -S t-rec
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#from-aur
  arch/yay:
    cmd: yay -S t-rec
    reference: https://aur.archlinux.org/packages/t-rec
  netbsd/pkgin:
    cmd: pkgin install t-rec
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-netbsd
binlist:
- t-rec

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
