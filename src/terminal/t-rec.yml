lang: Rust
homepage: https://github.com/sassman/t-rec-rs
license: GPL-3.0
desc:
  cn: 用 Rust 编写的极快的终端记录器，用于为网络生成动画 gif 图像
  en: Blazingly fast terminal recorder that generates animated gif images for the web written in rust
x:
  source: https://github.com/sassman/t-rec-rs
  eget: https://github.com/sassman/t-rec-rs
rule:
  /eget:
    cmd: x eget sassman/t-rec-rs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install t-rec
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-macos
  darwin/port:
    cmd: 'sudo port selfupdate

      sudo port install t-rec

      '
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-macos
  /cargo:
    cmd: cargo install -f t-rec
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-macos
    dsnap: t-rec
  ubuntu/dpkg:
    cmd: 'sudo apt-get install imagemagick

      wget https://github.com/sassman/t-rec-rs/releases/download/v0.5.0/t-rec_0.5.0_amd64.deb

      sudo dpkg -i t-rec_0.5.0_amd64.deb

      '
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-linux
  ubuntu/snap:
    cmd: sudo snap install t-rec --classic
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-linux
  arch/paru:
    cmd: paru -S t-rec
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#from-aur
  arch/yay:
    cmd: yay -S t-rec
    reference: https://aur.archlinux.org/packages/t-rec
  netbsd/pkgin:
    cmd: pkgin install t-rec
    reference: https://github.com/sassman/t-rec-rs?tab=readme-ov-file#installation-on-netbsd
binlist:
- t-rec

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
