lang: 'Rust'
homepage: 'https://github.com/reekta92/clin-rs'
license: 'GPL-3.0'
desc:
  cn: 灵感来自 Obsidian 的 TUI 笔记管理应用
  en: 'TUI note management app inspired by Obsidian'
x:
  source: https://github.com/reekta92/clin-rs
  eget: https://github.com/reekta92/clin-rs
rule:
  /eget:
    cmd: x eget reekta92/clin-rs
    reference: https://github.com/reekta92/clin-rs
binlist:
  - 'clin'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
