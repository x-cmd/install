lang: 'Rust'
homepage: 'https://github.com/reekta92/clin-rs'
license: 'GPL-3.0'
desc:
  cn: 灵感来自 Obsidian 的 TUI 笔记管理应用
  en: 'TUI note management app inspired by Obsidian'
  cs: TUI aplikace pro správu poznámek inspirovaná Obsidianem
  de: TUI-Notizverwaltungs-App, inspiriert von Obsidian
  es: Aplicación TUI de gestión de notas inspirada en Obsidian
  fr: Application TUI de gestion de notes inspirée d'Obsidian
  id: Aplikasi manajemen catatan TUI yang terinspirasi Obsidian
  it: App TUI per la gestione delle note ispirata a Obsidian
  ja: Obsidianから着想を得たTUIノート管理アプリ
  ko: Obsidian에서 영감을 받은 TUI 노트 관리 앱
  pl: Aplikacja TUI do zarządzania notatkami inspirowana Obsidianem
  pt: Aplicativo TUI de gerenciamento de notas inspirado no Obsidian
  ro: Aplicație TUI pentru gestionarea notițelor inspirată de Obsidian
  ru: TUI-приложение для управления заметками, вдохновлённое Obsidian
  th: แอปจัดการโน้ตแบบ TUI ที่ได้แรงบันดาลใจจาก Obsidian
  tr: Obsidian'dan esinlenen TUI not yönetim uygulaması
  uk: TUI-застосунок для керування нотатками, натхненний Obsidian
  vi: Ứng dụng quản lý ghi chú TUI lấy cảm hứng từ Obsidian
x:
  source: https://github.com/reekta92/clin-rs
  eget: reekta92/clin-rs
rule:
  /eget:
    cmd: x eget reekta92/clin-rs
    reference: https://github.com/reekta92/clin-rs
binlist:
  - 'clin'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
