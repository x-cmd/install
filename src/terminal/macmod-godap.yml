lang: Go
homepage: https://github.com/Macmod/godap
license: mit
desc:
  cn: 功能完整的 LDAP TUI
  en: A complete terminal user interface (TUI) for LDAP.
x:
  source: https://github.com/Macmod/godap
  eget: https://github.com/Macmod/godap
rule:
  /eget:
    cmd: x eget Macmod/godap
    reference: https://github.com/Macmod/godap
binlist:
- godap

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
