lang: 'Go'
homepage: 'https://github.com/legostin/cull'
license: 'MIT'
desc:
  cn: 交互式 TUI 磁盘空间分析器
  en: 'Interactive TUI disk space analyzer'
x:
  source: https://github.com/legostin/cull
  eget: https://github.com/legostin/cull
rule:
  /eget:
    cmd: x eget legostin/cull
    reference: https://github.com/legostin/cull
binlist:
- 'cull'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
