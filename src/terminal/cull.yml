lang: 'Go'
homepage: 'https://github.com/legostin/cull'
license: 'MIT'
desc:
  cn: 交互式 TUI 磁盘空间分析器
  en: 'Interactive TUI disk space analyzer'
  cs: Interaktivní TUI analyzátor místa na disku
  de: Interaktiver TUI-Datenträger-Analysator
  es: Un analizador interactivo de espacio en disco con TUI
  fr: Un analyseur d'espace disque TUI interactif
  id: Analisis ruang disk TUI interaktif
  it: Un analizzatore interattivo dello spazio su disco basato su TUI
  ja: 対話型のTUIディスク使用量アナライザー
  ko: 대화형 TUI 디스크 공간 분석기
  pl: Interaktywny analizator zajętości dysku w TUI
  pt: Um analisador interativo de espaço em disco com TUI
  ro: Un analizor interactiv de spațiu pe disc cu TUI
  ru: Интерактивный TUI-анализатор дискового пространства
  th: ตัววิเคราะห์พื้นที่ดิสก์แบบ TUI แบบโต้ตอบ
  tr: Etkileşimli TUI disk alanı çözümleyicisi
  uk: Інтерактивний TUI-аналізатор дискового простору
  vi: Trình phân tích dung lượng đĩa TUI tương tác
x:
  source: https://github.com/legostin/cull
  eget: legostin/cull
rule:
  /eget:
    cmd: x eget legostin/cull
    reference: https://github.com/legostin/cull
binlist:
- 'cull'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
