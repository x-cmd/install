lang: 'Go'
homepage: 'https://github.com/legostin/cull'
license: 'MIT'
desc:
  cn: 交互式 TUI 磁盘空间分析器
  en: 'Interactive TUI disk space analyzer'
x:
  source: https://github.com/legostin/cull
  eget: https://github.com/legostin/cull
rule:
  /eget:
    cmd: x eget legostin/cull
    reference: https://github.com/legostin/cull
binlist:
  - 'cull'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
