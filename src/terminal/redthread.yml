lang: 'Go'
homepage: 'https://github.com/B33pBeeps/redthread'
license: 'MIT'
desc:
  cn: 终端便利贴钉板 TUI，可在 ASCII 软木板上拖动便签、连红线、切换命名面板，Go 编写
  en: 'A sticky-note pegboard TUI for your terminal — drag notes around an ASCII corkboard, dangle red strings between them, switch through named boards. Mouse-first, written in Go.'
x:
  source: https://github.com/B33pBeeps/redthread
  eget: https://github.com/B33pBeeps/redthread
rule:
  /eget:
    cmd: x eget B33pBeeps/redthread
    reference: https://github.com/B33pBeeps/redthread
binlist:
  - 'redthread'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
