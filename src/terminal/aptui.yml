lang: 'Go'
homepage: 'https://github.com/mexirica/aptui'
license: 'MIT'
desc:
  cn: 面向 APT 系 Linux 发行版的 TUI 包管理器
  en: 'TUI package manager for APT-based Linux distributions'
x:
  source: https://github.com/mexirica/aptui
  eget: https://github.com/mexirica/aptui
rule:
  /eget:
    cmd: x eget mexirica/aptui
    reference: https://github.com/mexirica/aptui
binlist:
  - 'aptui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
