lang: 'Go'
homepage: 'https://github.com/mexirica/aptui'
license: 'MIT'
desc:
  cn: 面向 APT 系 Linux 发行版的 TUI 包管理器
  en: 'TUI package manager for APT-based Linux distributions'
  cs: TUI správce balíčků pro linuxové distribuce založené na APT
  de: TUI-Paketmanager für APT-basierte Linux-Distributionen
  es: Gestor de paquetes TUI para distribuciones de Linux basadas en APT
  fr: Gestionnaire de paquets TUI pour les distributions Linux basées sur APT
  id: Manajer paket TUI untuk distribusi Linux berbasis APT
  it: Gestore di pacchetti TUI per distribuzioni Linux basate su APT
  ja: APT ベースの Linux ディストリビューション向けの TUI パッケージマネージャー
  ko: APT 기반 Linux 배포판을 위한 TUI 패키지 관리자
  pl: Menedżer pakietów TUI dla dystrybucji Linuksa opartych na APT
  pt: Gerenciador de pacotes TUI para distribuições Linux baseadas em APT
  ro: Manager de pachete TUI pentru distribuțiile Linux bazate pe APT
  ru: TUI-менеджер пакетов для дистрибутивов Linux на базе APT
  th: ตัวจัดการแพ็กเกจแบบ TUI สำหรับดิสโทร Linux ที่ใช้ APT
  tr: APT tabanlı Linux dağıtımları için TUI paket yöneticisi
  uk: TUI-менеджер пакетів для дистрибутивів Linux на базі APT
  vi: Trình quản lý gói TUI cho các bản phân phối Linux dựa trên APT
x:
  source: https://github.com/mexirica/aptui
  eget: mexirica/aptui
rule:
  /eget:
    cmd: x eget mexirica/aptui
    reference: https://github.com/mexirica/aptui
binlist:
- 'aptui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
