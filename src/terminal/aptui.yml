lang: 'Go'
homepage: 'https://github.com/mexirica/aptui'
license: 'MIT'
desc:
  cn: 面向 APT 系 Linux 发行版的 TUI 包管理器
  en: 'TUI package manager for APT-based Linux distributions'
x:
  source: https://github.com/mexirica/aptui
  eget: https://github.com/mexirica/aptui
rule:
  /eget:
    cmd: x eget mexirica/aptui
    reference: https://github.com/mexirica/aptui
binlist:
- 'aptui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
