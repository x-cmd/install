lang: Rust
homepage: https://github.com/nthnd/tuime
license: GPL-3.0
desc:
  cn: 使用 Rust 编写的简单终端时钟。
  en: A simple clock for your terminal made using Rust.
x:
  source: https://github.com/nthnd/tuime
  eget: https://github.com/nthnd/tuime
rule:
  /eget:
    cmd: x eget nthnd/tuime
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install --git https://github.com/nate-sys/tuime
    reference: https://github.com/nate-sys/tuime?tab=readme-ov-file#install
    dsnap: tuime
  /nix:
    cmd: nix profile install github:nate-sys/tuime
    reference: https://github.com/nate-sys/tuime?tab=readme-ov-file#nix
  arch/yay:
    cmd: yay -S tuime
    reference: https://aur.archlinux.org/packages/tuime
binlist:
- tuime

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
