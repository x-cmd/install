lang: Rust
homepage: https://github.com/nthnd/tuime
license: GPL-3.0
desc:
  cn: 使用 Rust 编写的简单终端时钟。
  en: A simple clock for your terminal made using Rust.
  cs: Jednoduché hodiny pro váš terminál napsané v Rust.
  de: Eine einfache Uhr für dein Terminal, geschrieben in Rust.
  es: Un reloj sencillo para tu terminal hecho con Rust.
  fr: Une horloge simple pour votre terminal réalisée en Rust.
  id: Jam sederhana untuk terminal Anda yang dibuat dengan Rust.
  it: Un semplice orologio per il tuo terminale realizzato con Rust.
  ja: Rust で書かれたシンプルなターミナル用時計。
  ko: Rust로 만든 간단한 터미널 시계.
  pl: Prosty zegar dla twojego terminala napisany w Rust.
  pt: Um relógio simples para o seu terminal feito com Rust.
  ro: Un ceas simplu pentru terminalul tău, scris în Rust.
  ru: Простые часы для вашего терминала, написанные на Rust.
  th: นาฬิกาอย่างง่ายสำหรับเทอร์มินัลของคุณ เขียนด้วย Rust.
  tr: Rust ile yapılmış terminaliniz için basit bir saat.
  uk: Прості годинник для вашого термінала, написаний на Rust.
  vi: Một chiếc đồng hồ đơn giản cho terminal của bạn được viết bằng Rust.
x:
  source: https://github.com/nthnd/tuime
  eget: nthnd/tuime
  nix: github:nate-sys/tuime
  yay: tuime
rule:
  /eget:
    cmd: x eget nthnd/tuime
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install --git https://github.com/nate-sys/tuime
    reference: https://github.com/nate-sys/tuime?tab=readme-ov-file#install
    dsnap: tuime
  /nix:
    cmd: nix profile install github:nate-sys/tuime
    reference: https://github.com/nate-sys/tuime?tab=readme-ov-file#nix
  arch/yay:
    cmd: yay -S tuime
    reference: https://aur.archlinux.org/packages/tuime
binlist:
- tuime

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
