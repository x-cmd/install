lang: Rust
homepage: https://github.com/coastalwhite/lemurs
license: apache-2.0
desc:
  cn: 用 Rust 编写的可定制 TUI 显示/登录管理器
  en: A customizable TUI display/login manager written in Rust 🐒
  cs: Přizpůsobitelný TUI správce zobrazení/přihlášení napsaný v Rustu 🐒
  de: Anpassbarer TUI-Display-/Anmelde-Manager, geschrieben in Rust 🐒
  es: Un gestor TUI de visualización/inicio de sesión personalizable escrito en Rust 🐒
  fr: Un gestionnaire TUI d'affichage/de connexion personnalisable écrit en Rust 🐒
  id: Manajer tampilan/login TUI yang dapat dikustomisasi, ditulis dengan Rust 🐒
  it: Un gestore TUI di visualizzazione/accesso personalizzabile scritto in Rust 🐒
  ja: Rustで書かれたカスタマイズ可能なTUI表示/ログインマネージャー🐒
  ko: Rust로 작성된 사용자 정의 가능한 TUI 디스플레이/로그인 관리자 🐒
  pl: Konfigurowalny menadżer TUI wyświetlania/logowania napisany w Rust 🐒
  pt: Um gerenciador TUI de exibição/login personalizável escrito em Rust 🐒
  ro: Un manager TUI de afișare/autentificare personalizabil scris în Rust 🐒
  ru: Настраиваемый TUI-менеджер отображения/входа, написанный на Rust 🐒
  th: ตัวจัดการแสดงผล/เข้าสู่ระบบแบบ TUI ที่ปรับแต่งได้ เขียนด้วย Rust 🐒
  tr: Rust ile yazılmış özelleştirilebilir TUI ekran/giriş yöneticisi 🐒
  uk: Налаштовуваний TUI-менеджер відображення/входу, написаний на Rust 🐒
  vi: Trình quản lý hiển thị/đăng nhập TUI có thể tùy chỉnh, viết bằng Rust 🐒
x:
  source: https://github.com/coastalwhite/lemurs
  eget: coastalwhite/lemurs
rule:
  /eget:
    cmd: x eget coastalwhite/lemurs
    reference: https://github.com/coastalwhite/lemurs
binlist:
- lemurs

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
