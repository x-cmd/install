lang: Rust
homepage: https://github.com/coastalwhite/lemurs
license: apache-2.0
desc:
  cn: 用 Rust 编写的可定制 TUI 显示/登录管理器
  en: A customizable TUI display/login manager written in Rust 🐒
x:
  source: https://github.com/coastalwhite/lemurs
  eget: https://github.com/coastalwhite/lemurs
rule:
  /eget:
    cmd: x eget coastalwhite/lemurs
    reference: https://github.com/coastalwhite/lemurs
binlist:
- lemurs

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
