lang: Rust
homepage: https://github.com/coastalwhite/lemurs
license: apache-2.0
desc:
  cn: 用 Rust 编写的可定制 TUI 显示/登录管理器
  en: A customizable TUI display/login manager written in Rust 🐒
x:
  source: https://github.com/coastalwhite/lemurs
  eget: coastalwhite/lemurs
rule:
  /eget:
    cmd: x eget coastalwhite/lemurs
    reference: https://github.com/coastalwhite/lemurs
binlist:
- lemurs

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
