lang: 'Rust'
homepage: 'https://github.com/vaibhav-mattoo/bitchat-tui'
license: 'MIT'
desc:
  cn: 终端内的安全、匿名 P2P 蓝牙聊天，Rust 实现的离网加密 TUI 即时通讯
  en: '🔒 Secure, anonymous, peer-to-peer (P2P) Bluetooth chat in your terminal. An off-grid, encrypted TUI messenger built with Rust.'
x:
  source: https://github.com/vaibhav-mattoo/bitchat-tui
  eget: vaibhav-mattoo/bitchat-tui
rule:
  /eget:
    cmd: x eget vaibhav-mattoo/bitchat-tui
    reference: https://github.com/vaibhav-mattoo/bitchat-tui
binlist:
- 'bitchat-tui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
