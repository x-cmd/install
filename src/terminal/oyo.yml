lang: 'Rust'
homepage: https://github.com/ahkohd/oyo
license: 'MIT'
desc:
  cn: 差异对比与代码审查工具
  en: 'Diff & Review'
  cs: Nástroj pro porovnávání rozdílů a revizi kódu
  de: Diff- und Review-Werkzeug
  es: Herramienta de comparación de diferencias y revisión de código
  fr: Outil de comparaison des différences et de revue de code
  id: Alat pembeda dan peninjau kode
  it: Strumento di confronto delle differenze e revisione del codice
  ja: 差分比較とコードレビュー用のツール
  ko: 차이 비교 및 코드 검토 도구
  pl: Narzędzie do porównywania różnic i przeglądu kodu
  pt: Ferramenta de comparação de diferenças e revisão de código
  ro: Instrument de comparare a diferențelor și de revizuire a codului
  ru: Инструмент для сравнения различий и ревью кода
  th: เครื่องมือเปรียบเทียบความแตกต่างและตรวจสอบโค้ด
  tr: Fark karşılaştırma ve kod inceleme aracı
  uk: Інструмент для порівняння відмінностей та рев'ю коду
  vi: Công cụ so sánh khác biệt và rà soát mã
x:
  source: https://github.com/ahkohd/oyo
  eget: ahkohd/oyo
rule:
  /eget:
    cmd: x eget ahkohd/oyo
    reference: https://github.com/ahkohd/oyo
binlist:
- 'oyo'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
