lang: 'Rust'
homepage: https://github.com/ahkohd/oyo
license: 'MIT'
desc:
  cn: 差异对比与代码审查工具
  en: 'Diff & Review'
x:
  source: https://github.com/ahkohd/oyo
  eget: https://github.com/ahkohd/oyo
rule:
  /eget:
    cmd: x eget ahkohd/oyo
    reference: https://github.com/ahkohd/oyo
binlist:
  - 'oyo'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.6 MB
          rating: 1
          desc:
            cn: 约 3.6 MB（估算）
            en: ~3.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
