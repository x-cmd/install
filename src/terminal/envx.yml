lang: 'Rust'
homepage: 'https://github.com/mikeleppane/envx'
license: 'MIT'
desc:
  cn: 面向开发者的安全强大的环境变量管理器，提供直观 TUI 与完整 CLI
  en: 'A powerful and secure environment variable manager for developers, featuring an intuitive Terminal User Interface (TUI) and comprehensive command-line interface.'
x:
  source: https://github.com/mikeleppane/envx
  eget: https://github.com/mikeleppane/envx
rule:
  /eget:
    cmd: x eget mikeleppane/envx
    reference: https://github.com/mikeleppane/envx
binlist:
  - 'envx'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 579 KB
          rating: 1
          desc:
            cn: 约 579 KB（估算）
            en: ~579 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
