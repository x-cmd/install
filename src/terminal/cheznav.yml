lang: 'Python'
homepage: 'https://github.com/djetelina/cheznav'
license: 'MIT'
desc:
  cn: chezmoi 的 TUI 界面
  en: 'TUI for chezmoi'
x:
  source: https://github.com/djetelina/cheznav
  eget: https://github.com/djetelina/cheznav
rule:
  /eget:
    cmd: x eget djetelina/cheznav
    reference: https://github.com/djetelina/cheznav
binlist:
  - 'cheznav'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 KB
          rating: 1
          desc:
            cn: 约 5 KB（估算）
            en: ~5 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
