lang: Python
homepage: https://github.com/napisani/procmux
license: MIT
desc:
  cn: 用于进程的终端多路复用器
  en: A terminal multiplexer for processes.
x:
  source: https://github.com/napisani/procmux
rule:
  /pip:
    cmd: pip install procmux
    reference: https://github.com/napisani/procmux#installation
    dsnap: procmux
  /pipx:
    cmd: pipx install procmux
    reference: https://github.com/napisani/procmux#installation
  /brew:
    cmd: 'brew tap napisani/procmux \

      && brew install procmux

      '
    reference: https://github.com/napisani/procmux#installation
binlist:
- procmux

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
