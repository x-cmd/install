lang: Python
homepage: https://github.com/napisani/procmux
license: MIT
desc:
  cn: 用于进程的终端多路复用器
  en: A terminal multiplexer for processes.
x:
  source: https://github.com/napisani/procmux
rule:
  /pip:
    cmd: pip install procmux
    reference: https://github.com/napisani/procmux#installation
    dsnap: procmux
  /pipx:
    cmd: pipx install procmux
    reference: https://github.com/napisani/procmux#installation
  /brew:
    cmd: 'brew tap napisani/procmux \

      && brew install procmux

      '
    reference: https://github.com/napisani/procmux#installation
binlist:
- procmux

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
