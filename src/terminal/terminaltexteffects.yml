lang: Python
homepage: https://github.com/ChrisBuilds/terminaltexteffects
license: MIT
desc:
  en: TerminalTextEffects (TTE) is a terminal visual effects engine, application, and Python library.
  cn: TerminalTextEffects（TTE）是一个终端视觉效果引擎、应用程序和 Python 库。
x:
  source: https://github.com/ChrisBuilds/terminaltexteffects
rule:
  /pip:
    cmd: pip install terminaltexteffects
    reference: https://github.com/ChrisBuilds/terminaltexteffects?tab=readme-ov-file#installation
    dsnap: terminaltexteffects
  /pipx:
    cmd: pipx install terminaltexteffects
    reference: https://github.com/ChrisBuilds/terminaltexteffects?tab=readme-ov-file#installation
binlist:
- terminaltexteffects

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
