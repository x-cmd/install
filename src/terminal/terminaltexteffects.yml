lang: Python
homepage: https://github.com/ChrisBuilds/terminaltexteffects
license: MIT
desc:
  en: TerminalTextEffects (TTE) is a terminal visual effects engine, application, and Python library.
  cn: TerminalTextEffects（TTE）是一个终端视觉效果引擎、应用程序和 Python 库。
  cs: TerminalTextEffects (TTE) je engine vizuálních efektů terminálu, aplikace a knihovna pro Python.
  de: TerminalTextEffects (TTE) ist eine Engine für visuelle Terminal-Effekte, eine Anwendung und eine Python-Bibliothek.
  es: TerminalTextEffects (TTE) es un motor de efectos visuales de terminal, una aplicación y una biblioteca de Python.
  fr: TerminalTextEffects (TTE) est un moteur d'effets visuels pour le terminal, une application et une bibliothèque Python.
  id: TerminalTextEffects (TTE) adalah mesin efek visual terminal, aplikasi, dan pustaka Python.
  it: TerminalTextEffects (TTE) è un motore di effetti visivi per il terminale, un'applicazione e una libreria Python.
  ja: TerminalTextEffects (TTE) は、ターミナルの視覚効果エンジン、アプリケーション、Python ライブラリです。
  ko: TerminalTextEffects (TTE)는 터미널 시각 효과 엔진, 애플리케이션이자 Python 라이브러리입니다.
  pl: TerminalTextEffects (TTE) to silnik wizualnych efektów terminala, aplikacja i biblioteka Pythona.
  pt: TerminalTextEffects (TTE) é um motor de efeitos visuais de terminal, um aplicativo e uma biblioteca Python.
  ro: TerminalTextEffects (TTE) este un motor de efecte vizuale pentru terminal, o aplicație și o bibliotecă Python.
  ru: TerminalTextEffects (TTE) — движок визуальных эффектов терминала, приложение и библиотека на Python.
  th: TerminalTextEffects (TTE) คือเอนจินเอฟเฟกต์ภาพสำหรับเทอร์มินัล แอปพลิเคชัน และไลบรารี Python.
  tr: TerminalTextEffects (TTE), terminal görsel efektleri için bir motor, bir uygulama ve bir Python kitaplığıdır.
  uk: TerminalTextEffects (TTE) — рушій візуальних ефектів термінала, застосунок і бібліотека Python.
  vi: TerminalTextEffects (TTE) là engine hiệu ứng thị giác cho terminal, một ứng dụng và một thư viện Python.
