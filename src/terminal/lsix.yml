lang: Shell
homepage: https://github.com/hackerb9/lsix
license: GPL-3.0
desc:
  cn: 像 “ls”，但用于图像。使用 sixel 图形在终端中显示缩略图。
  en: Like "ls", but for images. Shows thumbnails in terminal using sixel graphics.
  cs: Podobné k "ls", ale pro obrázky. Zobrazuje náhledy v terminálu pomocí grafiky sixel.
  de: Wie "ls", aber für Bilder. Zeigt Thumbnails im Terminal mit Sixel-Grafik.
  es: Como "ls", pero para imágenes. Muestra miniaturas en la terminal usando gráficos sixel.
  fr: Comme "ls", mais pour les images. Affiche les miniatures dans le terminal en utilisant les graphismes sixel.
  id: Seperti "ls", tapi untuk gambar. Menampilkan thumbnail di terminal menggunakan grafik sixel.
  it: Come "ls", ma per le immagini. Mostra le miniature nel terminale usando la grafica sixel.
  ja: 「ls」と似ていますが、画像用のツールです。sixel グラフィックスを使ってターミナルにサムネイルを表示します。
  ko: "\"ls\"와 비슷하지만 이미지를 위한 도구입니다. sixel 그래픽으로 터미널에 썸네일을 표시합니다."
  pl: Jak "ls", ale dla obrazów. Wyświetla miniatury w terminalu za pomocą grafiki sixel.
  pt: Como "ls", mas para imagens. Mostra miniaturas no terminal usando gráficos sixel.
  ro: Ca "ls", dar pentru imagini. Afișează miniaturi în terminal folosind grafică sixel.
  ru: Как "ls", но для изображений. Показывает миниатюры в терминале с помощью графики sixel.
  th: คล้าย "ls" แต่สำหรับรูปภาพ แสดงภาพขนาดย่อในเทอร์มินัลด้วยกราฟิก sixel
  tr: "\"ls\" gibidir, ancak görseller içindir. sixel grafikleriyle terminalde küçük resimleri gösterir."
  uk: Як "ls", але для зображень. Показує мініатюри в терміналі за допомогою графіки sixel.
  vi: Giống "ls" nhưng dành cho hình ảnh. Hiển thị hình thu nhỏ trong terminal bằng đồ hoạ sixel.
x:
  source: https://github.com/hackerb9/lsix
rule:
  /wget:
    cmd: 'wget https://raw.githubusercontent.com/hackerb9/lsix/master/lsix && \

      sudo mv lsix /usr/local/bin && \

      sudo chmod +x /usr/local/bin/lsix

      '
    reference: https://github.com/hackerb9/lsix?tab=readme-ov-file#installation
  /curl:
    cmd: 'curl https://raw.githubusercontent.com/hackerb9/lsix/master/lsix > lsix && \

      sudo mv lsix /usr/local/bin && \

      sudo chmod +x /usr/local/bin/lsix

      '
    reference: https://github.com/hackerb9/lsix?tab=readme-ov-file#installation
binlist:
- lsix

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
