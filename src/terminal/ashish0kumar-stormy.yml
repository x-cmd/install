lang: Go
homepage: https://github.com/ashish0kumar/stormy
license: mit
desc:
  cn: 极简的 neofetch 风格天气 CLI
  en: minimal neofetch-style weather cli
x:
  source: https://github.com/ashish0kumar/stormy
  eget: https://github.com/ashish0kumar/stormy
rule:
  /eget:
    cmd: x eget ashish0kumar/stormy
    reference: https://github.com/ashish0kumar/stormy
binlist:
- stormy

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
