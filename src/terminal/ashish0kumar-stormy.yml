lang: Go
homepage: https://github.com/ashish0kumar/stormy
license: mit
desc:
  cn: 极简的 neofetch 风格天气 CLI
  en: minimal neofetch-style weather cli
x:
  source: https://github.com/ashish0kumar/stormy
  eget: https://github.com/ashish0kumar/stormy
rule:
  /eget:
    cmd: x eget ashish0kumar/stormy
    reference: https://github.com/ashish0kumar/stormy
binlist:
- stormy

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
