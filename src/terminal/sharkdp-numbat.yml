lang: Rust
homepage: https://github.com/sharkdp/numbat
license: apache-2.0
desc:
  cn: 支持物理量纲与单位的静态类型科学计算编程语言
  en: A statically typed programming language for scientific computations with first class support for physical dimensions and units
x:
  source: https://github.com/sharkdp/numbat
  eget: https://github.com/sharkdp/numbat
rule:
  /eget:
    cmd: x eget sharkdp/numbat
    reference: https://github.com/sharkdp/numbat
binlist:
- numbat

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
