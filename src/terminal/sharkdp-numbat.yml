lang: Rust
homepage: https://github.com/sharkdp/numbat
license: apache-2.0
desc:
  cn: 支持物理量纲与单位的静态类型科学计算编程语言
  en: A statically typed programming language for scientific computations with first class support for physical dimensions and units
x:
  source: https://github.com/sharkdp/numbat
  eget: https://github.com/sharkdp/numbat
rule:
  /eget:
    cmd: x eget sharkdp/numbat
    reference: https://github.com/sharkdp/numbat
binlist:
- numbat

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
