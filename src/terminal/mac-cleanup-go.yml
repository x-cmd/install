lang: 'Go'
homepage: 'https://github.com/2ykwang/mac-cleanup-go'
license: 'MIT'
desc:
  cn: macOS 清理 TUI，扫描缓存与日志、显示大小与路径，可在移入废纸篓前选择性删除
  en: 'TUI macOS cleaner that scans caches/logs, shows sizes/paths, lets you select what to delete before Trash.'
x:
  source: https://github.com/2ykwang/mac-cleanup-go
  eget: https://github.com/2ykwang/mac-cleanup-go
rule:
  /eget:
    cmd: x eget 2ykwang/mac-cleanup-go
    reference: https://github.com/2ykwang/mac-cleanup-go
binlist:
- 'mac-cleanup-go'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (macos/x64)
            en: ~4 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
