lang: 'Go'
homepage: 'https://github.com/2ykwang/mac-cleanup-go'
license: 'MIT'
desc:
  cn: macOS 清理 TUI，扫描缓存与日志、显示大小与路径，可在移入废纸篓前选择性删除
  en: 'TUI macOS cleaner that scans caches/logs, shows sizes/paths, lets you select what to delete before Trash.'
x:
  source: https://github.com/2ykwang/mac-cleanup-go
  eget: https://github.com/2ykwang/mac-cleanup-go
rule:
  /eget:
    cmd: x eget 2ykwang/mac-cleanup-go
    reference: https://github.com/2ykwang/mac-cleanup-go
binlist:
  - 'mac-cleanup-go'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
