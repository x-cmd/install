lang: 'Go'
homepage: 'https://github.com/ankitpokhrel/jira-cli'
license: 'MIT'
desc:
  cn: 功能丰富的交互式 Jira 命令行工具
  en: '🔥 Feature-rich interactive Jira command line.'
x:
  source: https://github.com/ankitpokhrel/jira-cli
  eget: https://github.com/ankitpokhrel/jira-cli
rule:
  /eget:
    cmd: x eget ankitpokhrel/jira-cli
    reference: https://github.com/ankitpokhrel/jira-cli
binlist:
  - 'jira-cli'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
