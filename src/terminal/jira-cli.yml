lang: 'Go'
homepage: 'https://github.com/ankitpokhrel/jira-cli'
license: 'MIT'
desc:
  cn: 功能丰富的交互式 Jira 命令行工具
  en: '🔥 Feature-rich interactive Jira command line.'
  cs: 🔥 Bohatě vybavený interaktivní nástroj příkazové řádky pro Jira
  de: 🔥 Funktionsreiches interaktives Jira-Kommandozeilenwerkzeug
  es: 🔥 Herramienta de línea de comandos interactiva y rica en funciones para Jira
  fr: 🔥 Outil en ligne de commande Jira interactif et riche en fonctionnalités
  id: 🔥 Alat command line Jira interaktif yang kaya fitur
  it: 🔥 Strumento da riga di comando Jira interattivo e ricco di funzionalità
  ja: 🔥 機能豊富な対話型 Jira コマンドラインツール
  ko: 🔥 기능이 풍부한 대화형 Jira 명령줄 도구
  pl: 🔥 Bogaty w funkcje interaktywny program wiersza poleceń dla Jira
  pt: 🔥 Ferramenta de linha de comando interativa e cheia de recursos para o Jira
  ro: 🔥 Instrument de linie de comandă Jira interactiv și bogat în funcții
  ru: 🔥 Богатый возможностями интерактивный инструмент командной строки для Jira
  th: 🔥 เครื่องมือบรรทัดคำสั่ง Jira แบบโต้ตอบที่มีฟีเจอร์ครบถ้วน
  tr: 🔥 Özellik dolu, etkileşimli Jira komut satırı aracı
  uk: 🔥 Багатофункціональний інтерактивний інструмент командного рядка для Jira
  vi: 🔥 Công cụ dòng lệnh Jira tương tác giàu tính năng
x:
  source: https://github.com/ankitpokhrel/jira-cli
  eget: ankitpokhrel/jira-cli
rule:
  /eget:
    cmd: x eget ankitpokhrel/jira-cli
    reference: https://github.com/ankitpokhrel/jira-cli
binlist:
  - 'jira-cli'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
