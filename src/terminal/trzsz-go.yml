lang: Go
homepage: https://github.com/trzsz/trzsz-go
license: MIT
desc:
  cn: trzsz-go 使所有支持本地 shell 的终端都支持 trzsz ( trz / tsz )，类似于 ( rz / sz )，并且兼容 tmux
  en: trzsz-go makes all terminals that support local shell to support trzsz ( trz / tsz ), which similar to ( rz / sz ), and compatible with tmux
  cs: trzsz-go umožňuje všem terminálům podporujícím místní shell podporovat trzsz ( trz / tsz ), podobně jako ( rz / sz ), a je kompatibilní s tmux
  de: trzsz-go ermöglicht es allen Terminals mit lokaler Shell-Unterstützung, trzsz ( trz / tsz ) zu unterstützen, ähnlich wie ( rz / sz ), und ist mit tmux kompatibel
  es: trzsz-go hace que todos los terminales que admiten shell local admitan trzsz ( trz / tsz ), similar a ( rz / sz ), y es compatible con tmux
  fr: trzsz-go permet à tous les terminaux prenant en charge un shell local de prendre en charge trzsz ( trz / tsz ), similaire à ( rz / sz ), et est compatible avec tmux
  id: trzsz-go membuat semua terminal yang mendukung shell lokal untuk mendukung trzsz ( trz / tsz ), mirip dengan ( rz / sz ), dan kompatibel dengan tmux
  it: trzsz-go fa sì che tutti i terminali che supportano la shell locale supportino trzsz ( trz / tsz ), simile a ( rz / sz ), ed è compatibile con tmux
  ja: trzsz-go は、ローカルシェルをサポートするすべてのターミナルで trzsz ( trz / tsz ) が使えるようにします ( ( rz / sz ) に似ています)。tmux とも互換性があります
  ko: trzsz-go는 로컬 셸을 지원하는 모든 터미널에서 trzsz ( trz / tsz )를 사용할 수 있게 하며, ( rz / sz )와 유사하고 tmux와 호환됩니다
  pl: trzsz-go umożliwia wszystkim terminalom obsługującym lokalną powłokę korzystanie z trzsz ( trz / tsz ), podobnie jak ( rz / sz ), i jest kompatybilny z tmux
  pt: trzsz-go faz com que todos os terminais que suportam shell local suportem trzsz ( trz / tsz ), semelhante a ( rz / sz ), e é compatível com tmux
  ro: trzsz-go face ca toate terminalele care acceptă shell local să suporte trzsz ( trz / tsz ), similar cu ( rz / sz ), și este compatibil cu tmux
  ru: trzsz-go позволяет всем терминалам с поддержкой локальной оболочки использовать trzsz ( trz / tsz ), аналогично ( rz / sz ), и совместим с tmux
  th: trzsz-go ทำให้เทอร์มินัลทุกตัวที่รองรับ local shell สามารถรองรับ trzsz ( trz / tsz ) ซึ่งคล้ายกับ ( rz / sz ) และเข้ากันได้กับ tmux
  tr: trzsz-go, yerel kabuğu destekleyen tüm terminallerin trzsz ( trz / tsz ) desteğini kullanmasını sağlar, ( rz / sz )'ye benzer şekilde ve tmux ile uyumludur
  uk: trzsz-go дозволяє всім терміналам із підтримкою локальної оболонки використовувати trzsz ( trz / tsz ), аналогічно до ( rz / sz ), і сумісний з tmux
  vi: trzsz-go giúp mọi terminal hỗ trợ shell cục bộ hỗ trợ trzsz ( trz / tsz ), tương tự ( rz / sz ), và tương thích với tmux
x:
  source: https://github.com/trzsz/trzsz-go
  eget: trzsz/trzsz-go
  apt: software-properties-common
  dnf: trzsz
  brew: trzsz-go
  yum: trzsz
  scoop: trzsz
  choco: trzsz
  winget: trzsz
  yay: trzsz
  go: github.com/trzsz/trzsz-go/cmd/trzsz@latest
rule:
  /eget:
    cmd: x eget trzsz/trzsz-go
    reference: https://x-cmd.com/mod/eget
  ubuntu/apt:
    cmd: 'sudo apt update && sudo apt install software-properties-common && \

      sudo add-apt-repository ppa:trzsz/ppa && sudo apt update && \

      sudo apt install trzsz

      '
    reference: https://github.com/trzsz/trzsz-go?tab=readme-ov-file#installation
  debian/apt:
    cmd: "sudo apt install curl gpg && \\\ncurl -s 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x7074ce75da7cc691c1ae1a7c7e51d1ad956055ca' \\\n    | gpg --dearmor -o /usr/share/keyrings/trzsz.gpg && \\\necho 'deb [signed-by=/usr/share/keyrings/trzsz.gpg] https://ppa.launchpadcontent.net/trzsz/ppa/ubuntu jammy main' \\\n    | sudo tee /etc/apt/sources.list.d/trzsz.list && \\\nsudo apt update && \\\nsudo apt install trzsz\n"
    reference: https://github.com/trzsz/trzsz-go?tab=readme-ov-file#installation
    dsnap: trzsz
  centos/yum:
    cmd: 'curl -fsSL "https://sh.wlnmp.com/wlnmp.sh" | bash && \

      sudo yum install trzsz

      '
    reference: https://github.com/trzsz/trzsz-go?tab=readme-ov-file#installation
  arch/yay:
    cmd: sudo yay -Syu && sudo yay -S trzsz
    reference: https://github.com/trzsz/trzsz-go?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew update && brew install trzsz-go
    reference: https://github.com/trzsz/trzsz-go?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: x scoop install trzsz
    reference: https://github.com/trzsz/trzsz-go?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install trzsz
    reference: https://github.com/trzsz/trzsz-go?tab=readme-ov-file#installation
  (win|wsl2)/winget:
    cmd: x winget install trzsz
    reference: https://github.com/trzsz/trzsz-go?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/trzsz/trzsz-go/cmd/trzsz@latest
    reference: https://github.com/trzsz/trzsz-go?tab=readme-ov-file#installation
    dsnap: github.com/trzsz/trzsz-go/cmd/trzsz@latest
binlist:
- trzsz-go

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
