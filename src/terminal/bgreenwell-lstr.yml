lang: Rust
homepage: https://github.com/bgreenwell/lstr
license: mit
desc:
  cn: 用 Rust 编写的快速、极简目录树查看器
  en: A fast, minimalist directory tree viewer, written in Rust.
  cs: Rychlý, minimalistický prohlížeč stromu adresářů napsaný v Rustu.
  de: Ein schneller, minimalistischer Verzeichnisbaum-Browser, geschrieben in Rust.
  es: Un visor de árbol de directorios rápido y minimalista, escrito en Rust.
  fr: Un explorateur d'arborescence de répertoires rapide et minimaliste, écrit en Rust.
  id: Penjelajah pohon direktori yang cepat dan minimal, ditulis dengan Rust.
  it: Un visualizzatore ad albero di directory veloce e minimalista, scritto in Rust.
  ja: Rustで書かれた高速でミニマルなディレクトリツリー閲覧ツール。
  ko: Rust로 작성된 빠르고 미니멀한 디렉터리 트리 뷰어.
  pl: Szybki, minimalistyczny przeglądarka drzewa katalogów, napisana w Rust.
  pt: Um visualizador de árvore de diretórios rápido e minimalista, escrito em Rust.
  ro: Un vizualizator de arbore de directoare rapid și minimalist, scris în Rust.
  ru: Быстрый минималистичный просмотрщик дерева каталогов, написанный на Rust.
  th: ตัวดูแผนผังไดเรกทอรีที่เร็วและเรียบง่าย เขียนด้วย Rust
  tr: Rust ile yazılmış hızlı, minimalist dizin ağacı görüntüleyici.
  uk: Швидкий мінімалістичний переглядач дерева каталогів, написаний на Rust.
  vi: Trình xem cây thư mục nhanh và tối giản, viết bằng Rust.
x:
  source: https://github.com/bgreenwell/lstr
  eget: bgreenwell/lstr
rule:
  /eget:
    cmd: x eget bgreenwell/lstr
    reference: https://github.com/bgreenwell/lstr
binlist:
- lstr

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
