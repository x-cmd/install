lang: 'Rust'
homepage: https://github.com/yamafaktory/jql
license: 'Apache-2.0'
desc:
  cn: JSON 查询语言 CLI 工具
  en: 'A JSON Query Language CLI tool'
x:
  source: https://github.com/yamafaktory/jql
  eget: https://github.com/yamafaktory/jql
rule:
  /eget:
    cmd: x eget yamafaktory/jql
    reference: https://github.com/yamafaktory/jql
binlist:
- 'jql'

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 安装 1.3 MB
            en: 1.3 MB install
        download:
          estimate: 567 KB
          desc:
            cn: 约 567 KB 下载 (linux/x64)
            en: ~567 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
