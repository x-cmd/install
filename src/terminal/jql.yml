  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 安装 1.3 MB
            en: 1.3 MB install
        download:
          estimate: 567 KB
          desc:
            cn: 约 567 KB 下载 (linux/x64)
            en: ~567 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
