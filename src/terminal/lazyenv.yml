lang: 'Go'
homepage: 'https://github.com/lazynop/lazyenv'
license: 'MIT'
desc:
  cn: 管理 .env 文件的 TUI
  en: 'TUI for managing .env files'
x:
  source: https://github.com/lazynop/lazyenv
  eget: https://github.com/lazynop/lazyenv
rule:
  /eget:
    cmd: x eget lazynop/lazyenv
    reference: https://github.com/lazynop/lazyenv
binlist:
  - 'lazyenv'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
