lang: Go
homepage: https://github.com/whoop-t/manly
license: MIT
desc:
  cn: 一个用于在终端中查看手册页面的 TUI。
  en: A TUI for viewing man pages in the terminal.
  cs: TUI pro prohlížení man stránek v terminálu.
  de: Eine TUI zum Anzeigen von Man Pages im Terminal.
  es: Una TUI para ver páginas de manual en la terminal.
  fr: Une TUI pour consulter les pages de manuel dans le terminal.
  id: TUI untuk melihat halaman manual di terminal.
  it: Una TUI per visualizzare le pagine di manuale nel terminale.
  ja: ターミナルで man ページを表示するための TUI。
  ko: 터미널에서 man 페이지를 보기 위한 TUI.
  pl: TUI do przeglądania stron podręcznika man w terminalu.
  pt: Uma TUI para ver páginas de manual no terminal.
  ro: Un TUI pentru vizualizarea paginilor man în terminal.
  ru: TUI для просмотра man-страниц в терминале.
  th: TUI สำหรับดูหน้า man ในเทอร์มินัล
  tr: Terminalde man sayfalarını görüntülemek için bir TUI.
  uk: TUI для перегляду man-сторінок у терміналі.
  vi: TUI để xem trang man trong terminal.
x:
  source: https://github.com/whoop-t/manly
  go: github.com/whoop-t/manly@latest
rule:
  /go:
    cmd: go install github.com/whoop-t/manly@latest
    reference: https://github.com/whoop-t/manly
    dsnap: github.com/whoop-t/manly@latest
binlist:
- manly

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 KB
          rating: 1
          desc:
            cn: 约 23 KB（估算）
            en: ~23 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
