lang: Go
homepage: https://github.com/whoop-t/manly
license: MIT
desc:
  cn: 一个用于在终端中查看手册页面的 TUI。
  en: A TUI for viewing man pages in the terminal.
x:
  source: https://github.com/whoop-t/manly
rule:
  /go:
    cmd: go install github.com/whoop-t/manly@latest
    reference: https://github.com/whoop-t/manly
    dsnap: github.com/whoop-t/manly@latest
binlist:
- manly

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
