lang: Go
homepage: https://github.com/whoop-t/manly
license: MIT
desc:
  cn: 一个用于在终端中查看手册页面的 TUI。
  en: A TUI for viewing man pages in the terminal.
x:
  source: https://github.com/whoop-t/manly
rule:
  /go:
    cmd: go install github.com/whoop-t/manly@latest
    reference: https://github.com/whoop-t/manly
    dsnap: github.com/whoop-t/manly@latest
binlist:
- manly

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 KB
          rating: 1
          desc:
            cn: 约 23 KB（估算）
            en: ~23 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
