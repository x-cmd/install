lang: 'Rust'
homepage: 'https://github.com/affromero/gitpane'
license: 'MIT'
desc:
  cn: 面向终端的多仓库 Git 工作区仪表盘
  en: 'Multi-repo Git workspace dashboard for the terminal'
  cs: Ovládací panel Git pracovního prostoru s více repozitáři pro terminál
  de: Multi-Repo-Git-Arbeitsbereich-Dashboard für das Terminal
  es: Panel de control del espacio de trabajo Git multi-repositorio para el terminal
  fr: Tableau de bord de l'espace de travail Git multi-dépôts pour le terminal
  id: Dasbor ruang kerja Git multi-repo untuk terminal
  it: Cruscotto dell'area di lavoro Git multi-repository per il terminale
  ja: ターミナル向けマルチリポジトリGitワークスペースダッシュボード
  ko: 터미널용 다중 저장소 Git 워크스페이스 대시보드
  pl: Panel sterowania przestrzenią roboczą Git dla wielu repozytoriów w terminalu
  pt: Painel do espaço de trabalho Git multirrepositório para o terminal
  ro: Panou de bord pentru spațiul de lucru Git cu mai multe depozite, pentru terminal
  ru: Панель рабочего пространства Git с несколькими репозиториями для терминала
  th: แดชบอร์ดพื้นที่ทำงาน Git หลาย repo สำหรับเทอร์มินัล
  tr: Terminal için çoklu depo Git çalışma alanı panosu
  uk: Панель робочого простору Git із кількома репозиторіями для термінала
  vi: Bảng điều khiển không gian làm việc Git đa kho lưu trữ cho terminal
x:
  source: https://github.com/affromero/gitpane
  eget: affromero/gitpane
rule:
  /cargo:
    cmd: 'cargo install'
    reference: https://github.com/affromero/gitpane
  /eget:
    cmd: x eget affromero/gitpane
    reference: https://github.com/affromero/gitpane
binlist:
- 'gitpane'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
