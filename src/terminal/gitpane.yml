lang: 'Rust'
homepage: 'https://github.com/affromero/gitpane'
license: 'MIT'
desc:
  cn: 面向终端的多仓库 Git 工作区仪表盘
  en: 'Multi-repo Git workspace dashboard for the terminal'
x:
  source: https://github.com/affromero/gitpane
  eget: https://github.com/affromero/gitpane
rule:
  /cargo:
    cmd: 'cargo install'
    reference: https://github.com/affromero/gitpane
  /eget:
    cmd: x eget affromero/gitpane
    reference: https://github.com/affromero/gitpane
binlist:
- 'gitpane'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
