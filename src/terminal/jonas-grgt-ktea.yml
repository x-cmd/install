lang: Go
homepage: https://github.com/jonas-grgt/ktea
license: apache-2.0
desc:
  cn: Kafka 的 TUI 客户端
  en: Kafka TUI client
x:
  source: https://github.com/jonas-grgt/ktea
  eget: https://github.com/jonas-grgt/ktea
rule:
  /eget:
    cmd: x eget jonas-grgt/ktea
    reference: https://github.com/jonas-grgt/ktea
binlist:
- ktea

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
