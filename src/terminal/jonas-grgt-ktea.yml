lang: Go
homepage: https://github.com/jonas-grgt/ktea
license: apache-2.0
desc:
  cn: Kafka 的 TUI 客户端
  en: Kafka TUI client
x:
  source: https://github.com/jonas-grgt/ktea
  eget: https://github.com/jonas-grgt/ktea
rule:
  /eget:
    cmd: x eget jonas-grgt/ktea
    reference: https://github.com/jonas-grgt/ktea
binlist:
- ktea

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
