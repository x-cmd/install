lang: Python
homepage: https://github.com/nickolaj-jepsen/fnug
license: GPL-3.0
desc:
  cn: 一个在终端中同时运行所有 lint、测试和命令的 多路复用器
  en: A TUI and multiplexer designed for running lints, tests, and other commands concurrently in the terminal.
x:
  source: https://github.com/nickolaj-jepsen/fnug
  eget: https://github.com/nickolaj-jepsen/fnug
rule:
  /eget:
    cmd: x eget nickolaj-jepsen/fnug
    reference: https://x-cmd.com/mod/eget
  /pipx:
    cmd: pipx install fnug
    reference: https://github.com/nickolaj-jepsen/fnug#installation
  /rye:
    cmd: rye install fnug
    reference: https://github.com/nickolaj-jepsen/fnug#installation
  /pip:
    cmd: pip install fnug
    reference: https://github.com/nickolaj-jepsen/fnug#installation
    dsnap: fnug
binlist:
- fnug

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 326 KB
          rating: 1
          desc:
            cn: 约 326 KB（估算）
            en: ~326 KB estimated
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
