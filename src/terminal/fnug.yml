lang: Python
homepage: https://github.com/nickolaj-jepsen/fnug
license: GPL-3.0
desc:
  cn: 一个在终端中同时运行所有 lint、测试和命令的 多路复用器
  en: A TUI and multiplexer designed for running lints, tests, and other commands concurrently in the terminal.
  cs: TUI a multiplexor navržený pro souběžné spouštění lintů, testů a dalších příkazů v terminálu.
  de: Eine TUI und ein Multiplexer zum gleichzeitigen Ausführen von Lints, Tests und anderen Befehlen im Terminal.
  es: Una TUI y multiplexor diseñada para ejecutar linters, pruebas y otros comandos de forma concurrente en el terminal.
  fr: Une TUI et un multiplexeur conçus pour exécuter simultanément des linters, des tests et d'autres commandes dans le terminal.
  id: TUI dan multiplexer yang dirancang untuk menjalankan lint, tes, dan perintah lain secara bersamaan di terminal.
  it: Una TUI e un multiplexer progettati per eseguire contemporaneamente linter, test e altri comandi nel terminale.
  ja: ターミナルでlint、テスト、その他のコマンドを並行実行するために設計されたTUI兼マルチプレクサ
  ko: 터미널에서 린트, 테스트 및 기타 명령을 동시에 실행하도록 설계된 TUI 및 멀티플렉서
  pl: TUI i multiplekser zaprojektowany do równoległego uruchamiania linterów, testów i innych poleceń w terminalu.
  pt: Uma TUI e multiplexador projetados para executar linters, testes e outros comandos simultaneamente no terminal.
  ro: O TUI și un multiplexor concepute pentru a rula verificatoare de stil, teste și alte comenzi concurent în terminal.
  ru: TUI и мультиплексор, разработанные для параллельного запуска линтеров, тестов и других команд в терминале.
  th: TUI และมัลติเพล็กเซอร์ที่ออกแบบมาเพื่อรัน linter, เทสต์ และคำสั่งอื่น ๆ พร้อมกันในเทอร์มินัล
  tr: Terminalde lint, test ve diğer komutları eş zamanlı çalıştırmak için tasarlanmış bir TUI ve çoklayıcı
  uk: TUI та мультиплексор, призначені для паралельного запуску лінтерів, тестів та інших команд у терміналі.
  vi: TUI và bộ ghép kênh được thiết kế để chạy đồng thời các trình lint, kiểm thử và lệnh khác trong terminal
x:
  source: https://github.com/nickolaj-jepsen/fnug
  eget: nickolaj-jepsen/fnug
  pip: fnug
rule:
  /eget:
    cmd: x eget nickolaj-jepsen/fnug
    reference: https://x-cmd.com/mod/eget
  /pipx:
    cmd: pipx install fnug
    reference: https://github.com/nickolaj-jepsen/fnug#installation
  /rye:
    cmd: rye install fnug
    reference: https://github.com/nickolaj-jepsen/fnug#installation
  /pip:
    cmd: pip install fnug
    reference: https://github.com/nickolaj-jepsen/fnug#installation
    dsnap: fnug
binlist:
- fnug

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
