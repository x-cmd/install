lang: Python
homepage: https://github.com/nickolaj-jepsen/fnug
license: GPL-3.0
desc:
  cn: 一个在终端中同时运行所有 lint、测试和命令的 多路复用器
  en: A TUI and multiplexer designed for running lints, tests, and other commands concurrently in the terminal.
x:
  source: https://github.com/nickolaj-jepsen/fnug
  eget: https://github.com/nickolaj-jepsen/fnug
rule:
  /eget:
    cmd: x eget nickolaj-jepsen/fnug
    reference: https://x-cmd.com/mod/eget
  /pipx:
    cmd: pipx install fnug
    reference: https://github.com/nickolaj-jepsen/fnug#installation
  /rye:
    cmd: rye install fnug
    reference: https://github.com/nickolaj-jepsen/fnug#installation
  /pip:
    cmd: pip install fnug
    reference: https://github.com/nickolaj-jepsen/fnug#installation
    dsnap: fnug
binlist:
- fnug

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
