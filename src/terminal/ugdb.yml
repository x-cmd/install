lang: 'Rust'
homepage: 'https://github.com/ftilde/ugdb'
license: 'MIT'
desc:
  cn: gdb 的替代 TUI
  en: 'An alternative TUI for gdb'
x:
  source: https://github.com/ftilde/ugdb
  eget: https://github.com/ftilde/ugdb
rule:
  /eget:
    cmd: x eget ftilde/ugdb
    reference: https://github.com/ftilde/ugdb
binlist:
  - 'ugdb'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 215 KB
          rating: 1
          desc:
            cn: 约 215 KB（估算）
            en: ~215 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
