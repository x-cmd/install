lang: 'Rust'
homepage: 'https://github.com/ftilde/ugdb'
license: 'MIT'
desc:
  cn: gdb 的替代 TUI
  en: 'An alternative TUI for gdb'
x:
  source: https://github.com/ftilde/ugdb
  eget: https://github.com/ftilde/ugdb
rule:
  /eget:
    cmd: x eget ftilde/ugdb
    reference: https://github.com/ftilde/ugdb
binlist:
  - 'ugdb'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
