lang: 'Rust'
homepage: 'https://github.com/ftilde/ugdb'
license: 'MIT'
desc:
  cn: gdb 的替代 TUI
  en: 'An alternative TUI for gdb'
  cs: Alternativní TUI pro gdb
  de: Eine alternative TUI für gdb
  es: Una TUI alternativa para gdb
  fr: Une TUI alternative pour gdb
  id: TUI alternatif untuk gdb
  it: Una TUI alternativa per gdb
  ja: gdb の代替 TUI
  ko: gdb를 위한 대안적 TUI
  pl: Alternatywne TUI dla gdb
  pt: Uma TUI alternativa para o gdb
  ro: O interfață TUI alternativă pentru gdb
  ru: Альтернативный TUI для gdb
  th: TUI ทางเลือกสำหรับ gdb
  tr: gdb için alternatif bir TUI
  uk: Альтернативний TUI для gdb
  vi: Giao diện TUI thay thế cho gdb
x:
  source: https://github.com/ftilde/ugdb
  eget: ftilde/ugdb
rule:
  /eget:
    cmd: x eget ftilde/ugdb
    reference: https://github.com/ftilde/ugdb
binlist:
  - 'ugdb'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 215 KB
          rating: 1
          desc:
            cn: 约 215 KB（估算）
            en: ~215 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
