lang: Rust
homepage: https://github.com/warpdotdev/Warp
license: AGPL-3.0
desc:
  cn: Warp 是一款基于 Rust 的现代终端，内置 AI，帮助你和你的团队更快地构建出色的软件。
  en: Warp is a modern, Rust-based terminal with AI built in so you and your team can build great software, faster.
x:
  source: https://github.com/warpdotdev/Warp
rule:
  darwin/brew:
    cmd: brew install --cask warp
    reference: https://www.warp.dev/download
  (win|wsl2)/winget:
    cmd: x winget install Warp.Warp
    reference: https://www.warp.dev/download
binlist:
- warp

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
