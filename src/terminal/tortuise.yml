lang: 'Rust'
homepage: 'https://github.com/buildoak/tortuise'
license: 'MIT'
desc:
  cn: 在终端中查看高斯溅射点云
  en: 'Gaussian splats in your terminal.'
x:
  source: https://github.com/buildoak/tortuise
  eget: https://github.com/buildoak/tortuise
rule:
  /eget:
    cmd: x eget buildoak/tortuise
    reference: https://github.com/buildoak/tortuise
binlist:
  - 'tortuise'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 529 KB
          rating: 1
          desc:
            cn: 约 529 KB（估算）
            en: ~529 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
