lang: 'Rust'
homepage: 'https://github.com/buildoak/tortuise'
license: 'MIT'
desc:
  cn: 在终端中查看高斯溅射点云
  en: 'Gaussian splats in your terminal.'
x:
  source: https://github.com/buildoak/tortuise
  eget: https://github.com/buildoak/tortuise
rule:
  /eget:
    cmd: x eget buildoak/tortuise
    reference: https://github.com/buildoak/tortuise
binlist:
  - 'tortuise'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
