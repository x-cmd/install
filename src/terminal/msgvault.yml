lang: 'Go'
homepage: https://github.com/wesm/msgvault
license: 'MIT'
desc:
  cn: 归档一生的邮件与聊天，基于 DuckDB 实现离线检索、分析与 AI 查询
  en: 'Archive a lifetime of email and chat. Offline search, analytics, and AI query over your full message history. Powered by DuckDB'
x:
  source: https://github.com/wesm/msgvault
  eget: https://github.com/wesm/msgvault
  brew: prekrule:
  darwin/brew:
    cmd: 'brew install prek'
    reference: https://github.com/wesm/msgvault
  /eget:
    cmd: x eget wesm/msgvault
    reference: https://github.com/wesm/msgvault
binlist:
- 'msgvault'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 85 MB
          rating: 3
          desc:
            cn: 约 85 MB（估算）
            en: ~85 MB estimated
        download:
          estimate: 39 MB
          desc:
            cn: 约 39 MB 下载 (linux/x64)
            en: ~39 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
