lang: 'Go'
homepage: https://github.com/wesm/msgvault
license: 'MIT'
desc:
  cn: 归档一生的邮件与聊天，基于 DuckDB 实现离线检索、分析与 AI 查询
  en: 'Archive a lifetime of email and chat. Offline search, analytics, and AI query over your full message history. Powered by DuckDB'
x:
  source: https://github.com/wesm/msgvault
  eget: https://github.com/wesm/msgvault
rule:
  darwin/brew:
    cmd: 'brew install prek'
    reference: https://github.com/wesm/msgvault
  /eget:
    cmd: x eget wesm/msgvault
    reference: https://github.com/wesm/msgvault
binlist:
  - 'msgvault'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
