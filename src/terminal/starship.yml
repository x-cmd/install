lang: Rust
desc:
  cn: 适用于任何 shell 的最小、速度极快且可无限定制的提示
  en: The minimal, blazing-fast, and infinitely customizable prompt for any shell
  cs: Minimální, bleskově rychlý a neomezeně přizpůsobitelný prompt pro jakýkoli shell
  de: Die minimale, blitzschnelle und unbegrenzt anpassbare Prompt für jede Shell
  es: El prompt minimalista, velocísimo e infinitamente personalizable para cualquier shell
  fr: L'invite minimaliste, ultrarapide et infiniment personnalisable pour n'importe quel shell
  id: Prompt minimal, sangat cepat, dan dapat dikustomisasi tanpa batas untuk shell apa pun
  it: Il prompt minimale, velocissimo e infinitamente personalizzabile per qualsiasi shell
  ja: あらゆるシェルに対応する、最小限で超高速、そして無限にカスタマイズできるプロンプト
  ko: 어떤 셸에서도 사용할 수 있는 최소한의, 아주 빠른, 무한히 사용자 정의 가능한 프롬프트
  pl: Minimalny, błyskawicznie szybki i nieograniczalny prompt dla każdej powłoki
  pt: O prompt mínimo, ultra-rápido e infinitamente customizável para qualquer shell
  ro: Promptul minim, rapid ca fulgerul și infinit personalizabil pentru orice shell
  ru: Минимальный, сверхбыстрый и бесконечно настраиваемый промпт для любой оболочки
  th: พรอมต์ที่เล็กที่สุด เร็วดั่งพริบไฟ และปรับแต่งได้ไม่จำกัด สำหรับเชลล์ใดก็ตาม
  tr: Herhangi bir kabuk için minimal, çok hızlı ve sınırsız özelleştirilebilir istem
  uk: Мінімальний, надшвидкий і необмежено налаштовуваний промпт для будь-якої оболонки
  vi: Prompt tối giản, siêu nhanh và tùy chỉnh không giới hạn cho mọi shell
homepage: https://github.com/starship/starship
license: ISC
x:
  source: https://github.com/starship/starship
  eget: starship/starship
  dnf: starship
  brew: starship
  pacman: starship
  apk: starship
  zypper: starship
  port: starship
  emerge: app-shells/starship
  xbps: starship
  scoop: starship
  choco: starship
  winget: starship
  cargo: starship
rule:
  /x:
    cmd: x pkg use starship
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget starship/starship
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install starship --locked
    reference: https://github.com/starship/starship
    dsnap: starship
  termux/pkg:
    cmd: pkg install starship
    reference: https://github.com/starship/starship
  freebsd/pkg:
    cmd: pkg install starship
    reference: https://github.com/starship/starship
  netbsd/pkgin:
    cmd: pkgin install starship
    reference: https://github.com/starship/starship
  /curl:
    cmd: curl -sS https://starship.rs/install.sh | sh
    reference: https://github.com/starship/starship
  /conda:
    cmd: conda install -c conda-forge starship
    reference: https://github.com/starship/starship
  linux/brew:
    cmd: brew install starship
    reference: https://github.com/starship/starship
  alpine/apk:
    cmd: apk add starship
    reference: https://github.com/starship/starship
    dsnap: starship
  arch/pacman:
    cmd: sudo pacman -S starship
    reference: https://github.com/starship/starship
  centos/dnf:
    cmd: 'sudo dnf copr enable atim/starship

      sudo dnf install starship

      '
    reference: https://github.com/starship/starship
  gentoo/emerge:
    cmd: sudo emerge app-shells/starship
    reference: https://github.com/starship/starship
  manjaro/pacman:
    cmd: sudo pacman -S starship
    reference: https://github.com/starship/starship
  /nix-env:
    cmd: nix-env -iA nixpkgs.starship
    reference: https://github.com/starship/starship
  opensuse/zypper:
    cmd: sudo zypper in starship
    reference: https://github.com/starship/starship
  void/xbps:
    cmd: xbps-install -S starship
    reference: https://github.com/starship/starship
  darwin/brew:
    cmd: brew install starship
    reference: https://github.com/starship/starship
  darwin/port:
    cmd: sudo port install starship
    reference: https://github.com/starship/starship
  (win|wsl2)/choco:
    cmd: x choco install starship
    reference: https://github.com/starship/starship
  (win|wsl2)/scoop:
    cmd: x scoop install starship
    reference: https://github.com/starship/starship
  (win|wsl2)/winget:
    cmd: x winget install starship
    reference: https://github.com/starship/starship
binlist:
- starship

# already profiled
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 安装 12 MB
            en: 12 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
