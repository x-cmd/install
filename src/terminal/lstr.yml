lang: 'Rust'
homepage: https://github.com/bgreenwell/lstr
license: 'MIT'
desc:
  cn: 用 Rust 编写的快速、极简目录树查看器
  en: 'A fast, minimalist directory tree viewer, written in Rust.'
x:
  source: https://github.com/bgreenwell/lstr
  eget: https://github.com/bgreenwell/lstr
rule:
  /eget:
    cmd: x eget bgreenwell/lstr
    reference: https://github.com/bgreenwell/lstr
binlist:
- 'lstr'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 156 KB
          rating: 1
          desc:
            cn: 约 156 KB（估算）
            en: ~156 KB estimated
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
