lang: 'Go'
homepage: 'https://github.com/babycommando/zuse'
license: 'Apache-2.0'
desc:
  cn: 用 Go 和 Bubbletea 编写的终端 IRC 客户端
  en: 'ZUSE is an irc client for the terminal made in Go with Bubbletea'
x:
  source: https://github.com/babycommando/zuse
  eget: https://github.com/babycommando/zuse
rule:
  /eget:
    cmd: x eget babycommando/zuse
    reference: https://github.com/babycommando/zuse
binlist:
  - 'zuse'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 71 KB
          rating: 1
          desc:
            cn: 约 71 KB（估算）
            en: ~71 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
