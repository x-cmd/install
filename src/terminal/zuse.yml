lang: 'Go'
homepage: 'https://github.com/babycommando/zuse'
license: 'Apache-2.0'
desc:
  cn: 用 Go 和 Bubbletea 编写的终端 IRC 客户端
  en: 'ZUSE is an irc client for the terminal made in Go with Bubbletea'
x:
  source: https://github.com/babycommando/zuse
  eget: https://github.com/babycommando/zuse
rule:
  /eget:
    cmd: x eget babycommando/zuse
    reference: https://github.com/babycommando/zuse
binlist:
  - 'zuse'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
