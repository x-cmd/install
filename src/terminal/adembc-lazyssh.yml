lang: Go
homepage: https://github.com/Adembc/lazyssh
license: apache-2.0
desc:
  cn: 灵感来自 lazydocker 和 k9s 的终端 SSH 管理器，用 Go 编写
  en: A terminal-based SSH manager inspired by lazydocker and k9s - Written in go
x:
  source: https://github.com/Adembc/lazyssh
  eget: Adembc/lazyssh
rule:
  /eget:
    cmd: x eget Adembc/lazyssh
    reference: https://github.com/Adembc/lazyssh
binlist:
- lazyssh

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
