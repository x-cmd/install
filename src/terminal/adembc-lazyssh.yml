lang: Go
homepage: https://github.com/Adembc/lazyssh
license: apache-2.0
desc:
  cn: 灵感来自 lazydocker 和 k9s 的终端 SSH 管理器，用 Go 编写
  en: A terminal-based SSH manager inspired by lazydocker and k9s - Written in go
x:
  source: https://github.com/Adembc/lazyssh
  eget: https://github.com/Adembc/lazyssh
rule:
  /eget:
    cmd: x eget Adembc/lazyssh
    reference: https://github.com/Adembc/lazyssh
binlist:
- lazyssh

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
