lang: 'Rust'
homepage: https://github.com/kurama/dealve-tui
license: 'Apache-2.0'
desc:
  cn: 在终端中淘游戏折扣
  en: 'Delve into game deals from your terminal 👾'
x:
  source: https://github.com/kurama/dealve-tui
  eget: https://github.com/kurama/dealve-tui
rule:
  /eget:
    cmd: x eget kurama/dealve-tui
    reference: https://github.com/kurama/dealve-tui
binlist:
  - 'dealve-tui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
