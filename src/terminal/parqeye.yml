lang: 'Rust'
homepage: 'https://github.com/kaushiksrini/parqeye'
license: 'MIT'
desc:
  cn: 在终端直接查看 Parquet 文件内容
  en: 'Peek inside Parquet files right from your terminal'
x:
  source: https://github.com/kaushiksrini/parqeye
  eget: https://github.com/kaushiksrini/parqeye
rule:
  /eget:
    cmd: x eget kaushiksrini/parqeye
    reference: https://github.com/kaushiksrini/parqeye
binlist:
- 'parqeye'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 安装 13 MB
            en: 13 MB install
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
