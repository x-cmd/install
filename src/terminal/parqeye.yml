lang: 'Rust'
homepage: 'https://github.com/kaushiksrini/parqeye'
license: 'MIT'
desc:
  cn: 在终端直接查看 Parquet 文件内容
  en: 'Peek inside Parquet files right from your terminal'
x:
  source: https://github.com/kaushiksrini/parqeye
  eget: https://github.com/kaushiksrini/parqeye
rule:
  /eget:
    cmd: x eget kaushiksrini/parqeye
    reference: https://github.com/kaushiksrini/parqeye
binlist:
  - 'parqeye'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
