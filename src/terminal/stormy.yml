lang: 'Go'
homepage: https://github.com/ashish0kumar/stormy
license: 'MIT'
desc:
  cn: 极简的 neofetch 风格天气 CLI
  en: 'minimal neofetch-style weather cli'
x:
  source: https://github.com/ashish0kumar/stormy
  eget: https://github.com/ashish0kumar/stormy
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/ashish0kumar/stormy
  /eget:
    cmd: x eget ashish0kumar/stormy
    reference: https://github.com/ashish0kumar/stormy
binlist:
- 'stormy'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
