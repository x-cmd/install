lang: 'Go'
homepage: https://github.com/ashish0kumar/stormy
license: 'MIT'
desc:
  cn: 极简的 neofetch 风格天气 CLI
  en: 'minimal neofetch-style weather cli'
  cs: Minimální CLI pro počasí ve stylu neofetch
  de: Minimale Wetter-CLI im neofetch-Stil
  es: CLI minimalista del tiempo al estilo de neofetch
  fr: CLI météo minimaliste de style neofetch
  id: CLI cuaca minimal bergaya neofetch
  it: CLI meteo minimalista in stile neofetch
  ja: neofetch 風のミニマルな天気 CLI
  ko: neofetch 스타일의 미니멀한 날씨 CLI
  pl: Minimalne CLI pogody w stylu neofetch
  pt: CLI de clima minimalista ao estilo do neofetch
  ro: CLI de vreme minimalist, în stil neofetch
  ru: Минималистичный CLI погоды в стиле neofetch
  th: CLI สภาพอากาศแบบเรียบง่ายในสไตล์ neofetch
  tr: neofetch tarzı minimalist hava durumu CLI
  uk: Мінімалістичний CLI погоди у стилі neofetch
  vi: CLI thời tiết tối giản theo phong cách neofetch
x:
  source: https://github.com/ashish0kumar/stormy
  eget: ashish0kumar/stormy
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/ashish0kumar/stormy
  /eget:
    cmd: x eget ashish0kumar/stormy
    reference: https://github.com/ashish0kumar/stormy
binlist:
- 'stormy'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
