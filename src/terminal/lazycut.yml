lang: 'Go'
homepage: 'https://github.com/ozemin/lazycut'
license: 'MIT'
desc:
  cn: 简洁的终端视频裁剪界面
  en: 'A simple terminal UI for video trimming'
x:
  source: https://github.com/ozemin/lazycut
  eget: https://github.com/ozemin/lazycut
rule:
  /eget:
    cmd: x eget ozemin/lazycut
    reference: https://github.com/ozemin/lazycut
binlist:
  - 'lazycut'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 159 KB
          rating: 1
          desc:
            cn: 约 159 KB（估算）
            en: ~159 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
