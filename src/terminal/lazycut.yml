lang: 'Go'
homepage: 'https://github.com/ozemin/lazycut'
license: 'MIT'
desc:
  cn: 简洁的终端视频裁剪界面
  en: 'A simple terminal UI for video trimming'
x:
  source: https://github.com/ozemin/lazycut
  eget: https://github.com/ozemin/lazycut
rule:
  /eget:
    cmd: x eget ozemin/lazycut
    reference: https://github.com/ozemin/lazycut
binlist:
- 'lazycut'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (macos/arm64)
            en: ~1 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
