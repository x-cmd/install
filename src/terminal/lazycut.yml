lang: 'Go'
homepage: 'https://github.com/ozemin/lazycut'
license: 'MIT'
desc:
  cn: 简洁的终端视频裁剪界面
  en: 'A simple terminal UI for video trimming'
x:
  source: https://github.com/ozemin/lazycut
  eget: https://github.com/ozemin/lazycut
rule:
  /eget:
    cmd: x eget ozemin/lazycut
    reference: https://github.com/ozemin/lazycut
binlist:
  - 'lazycut'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
