lang: Python
homepage: https://github.com/Guake/guake
license: GPL-2.0
desc:
  cn: Guake 是为 GNOME 桌面环境制作的基于 Python 的下拉终端
  en: Guake is a python based dropdown terminal made for the GNOME desktop environment
  cs: Guake je dropdownový terminál založený na Pythonu, vytvořený pro desktopové prostředí GNOME
  de: Guake ist ein auf Python basierendes Dropdown-Terminal für die GNOME-Desktop-Umgebung
  es: Guake es un terminal desplegable basado en Python creado para el entorno de escritorio GNOME
  fr: Guake est un terminal déroulant basé sur Python, conçu pour l'environnement de bureau GNOME
  id: Guake adalah terminal dropdown berbasis Python yang dibuat untuk lingkungan desktop GNOME
  it: Guake è un terminale a tendina basato su Python, creato per l'ambiente desktop GNOME
  ja: Guake は GNOME デスクトップ環境のために作られた Python ベースのドロップダウンターミナルです
  ko: Guake는 GNOME 데스크톱 환경을 위해 만들어진 Python 기반 드롭다운 터미널입니다
  pl: Guake to terminal rozwijany oparty na Pythonie, stworzony dla środowiska pulpitu GNOME
  pt: Guake é um terminal suspenso baseado em Python, feito para o ambiente de desktop GNOME
  ro: Guake este un terminal dropdown bazat pe Python, creat pentru mediul desktop GNOME
  ru: Guake — выпадающий терминал на базе Python, созданный для настольной среды GNOME
  th: Guake คือเทอร์มินัลแบบดรอปดาวน์ที่เขียนด้วย Python สำหรับสภาพแวดล้อมเดสก์ท็อป GNOME
  tr: Guake, GNOME masaüstü ortamı için yapılmış Python tabanlı bir açılır terminaldir
  uk: Guake — висувний термінал на базі Python, створений для робочого столу GNOME
  vi: Guake là terminal thả xuống dựa trên Python, được tạo cho môi trường desktop GNOME
x:
  source: https://github.com/Guake/guake
  apt: guake
  dnf: guake
  pacman: guake
  apt-get: guake
rule:
  debian/apt:
    cmd: sudo apt install guake
    reference: https://guake.readthedocs.io/en/latest/user/installing.html#debian-ubuntu
    dsnap: guake
  ubuntu/apt:
    cmd: sudo apt install guake
    reference: https://guake.readthedocs.io/en/latest/user/installing.html#debian-ubuntu
    dsnap: guake
  fedora/dnf:
    cmd: sudo dnf install guake
    reference: https://guake.readthedocs.io/en/latest/user/installing.html#fedora
    dsnap: guake
  arch/pacman:
    cmd: sudo pacman -S guake
    reference: https://guake.readthedocs.io/en/latest/user/installing.html#arch-linux
  kali/apt:
    cmd: sudo apt-get install guake
    reference: https://command-not-found.com/guake
    dsnap: guake
  raspbian/apt:
    cmd: sudo apt-get install guake
    reference: https://command-not-found.com/guake
  manjaro/pacman:
    cmd: sudo pacman -S guake
    reference: https://guake.readthedocs.io/en/latest/user/installing.html#manjaro
  /pipx:
    cmd: pipx install guake
    reference: https://guake.readthedocs.io/en/latest/user/installing.html#install-from-pypi
  /pip:
    cmd: pip install --user guake
    reference: https://guake.readthedocs.io/en/latest/user/installing.html#install-from-pypi
    dsnap: guake
binlist:
- guake

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 21 KB
          rating: 1
          desc:
            cn: 约 21 KB（估算）
            en: ~21 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
