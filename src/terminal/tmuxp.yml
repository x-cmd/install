lang: Python
homepage: https://github.com/tmux-python/tmuxp
license: MIT
desc:
  cn: ession manager for tmux, which allows users to save and load tmux sessions through simple configuration files
  en: tmux 的 Session Manager，允许用户通过简单的配置文件保存和加载 tmux 会话
x:
  pkg:
    exist: true
  source: https://github.com/tmux-python/tmuxp
rule:
  /x:
    cmd: x pkg use tmuxp
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install --user tmuxp
    reference: https://tmuxp.git-pull.com/#installation
    dsnap: tmuxp
  darwin/brew:
    cmd: brew install tmuxp
    reference: https://tmuxp.git-pull.com/#installation
  debian/apt:
    cmd: sudo apt install tmuxp
    reference: https://tmuxp.git-pull.com/#installation
    dsnap: tmuxp
  ubuntu/apt:
    cmd: sudo apt install tmuxp
    reference: https://tmuxp.git-pull.com/#installation
    dsnap: tmuxp
  /nix-env:
    cmd: '[[ -z $(which tmux) ]] && (nix-env -i tmux && nix-env -i tmuxp) || nix-env -i tmuxp

      '
    reference: https://tmuxp.git-pull.com/#installation
binlist:
- tmuxp

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
