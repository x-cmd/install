lang: 'Python'
homepage: 'https://github.com/ptmcg/logmerger'
license: 'MIT'
desc:
  cn: 按合并时间线查看多个日志文件的 TUI 工具
  en: 'TUI utility to view multiple log files with merged timeline'
x:
  source: https://github.com/ptmcg/logmerger
  eget: https://github.com/ptmcg/logmerger
rule:
  /eget:
    cmd: x eget ptmcg/logmerger
    reference: https://github.com/ptmcg/logmerger
binlist:
  - 'logmerger'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
