lang: 'Python'
homepage: 'https://github.com/ptmcg/logmerger'
license: 'MIT'
desc:
  cn: 按合并时间线查看多个日志文件的 TUI 工具
  en: 'TUI utility to view multiple log files with merged timeline'
  cs: Nástroj TUI pro zobrazení více souborů logů se sloučenou časovou osou
  de: TUI-Dienstprogramm zur Anzeige mehrerer Logdateien mit zusammengeführter Zeitleiste
  es: Utilidad TUI para ver varios archivos de registro con una línea de tiempo combinada
  fr: Utilitaire TUI pour afficher plusieurs fichiers journaux avec une chronologie fusionnée
  id: Utilitas TUI untuk melihat beberapa berkas log dengan garis waktu gabungan
  it: Utilità TUI per visualizzare più file di log con una linea temporale unificata
  ja: 複数のログファイルを統合したタイムラインで表示する TUI ユーティリティ
  ko: 여러 로그 파일을 통합된 타임라인으로 확인하는 TUI 도구
  pl: Narzędzie TUI do przeglądania wielu plików logów ze scaloną osią czasu
  pt: Utilitário TUI para ver vários arquivos de log com linha do tempo unificada
  ro: Utilitar TUI pentru a vedea mai multe fișiere jurnal cu o cronologie combinată
  ru: TUI-утилита для просмотра нескольких файлов журналов с объединённой временной шкалой
  th: ยูทิลิตี้ TUI สำหรับดูไฟล์บันทึกหลายไฟล์พร้อมไทม์ไลน์ที่รวมกัน
  tr: Birleştirilmiş zaman çizelgesiyle birden çok günlük dosyasını görüntülemek için TUI aracı
  uk: TUI-утиліта для перегляду кількох файлів журналів з об'єднаною часовою шкалою
  vi: Tiện ích TUI để xem nhiều tệp log với dòng thời gian hợp nhất
x:
  source: https://github.com/ptmcg/logmerger
  eget: ptmcg/logmerger
rule:
  /eget:
    cmd: x eget ptmcg/logmerger
    reference: https://github.com/ptmcg/logmerger
binlist:
- 'logmerger'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 32 KB
          rating: 1
          desc:
            cn: 安装 32 KB
            en: 32 KB install
        download:
          estimate: 32 KB
          desc:
            cn: 约 32 KB 下载 (whl)
            en: ~32 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
