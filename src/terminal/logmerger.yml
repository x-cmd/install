lang: 'Python'
homepage: 'https://github.com/ptmcg/logmerger'
license: 'MIT'
desc:
  cn: 按合并时间线查看多个日志文件的 TUI 工具
  en: 'TUI utility to view multiple log files with merged timeline'
x:
  source: https://github.com/ptmcg/logmerger
  eget: https://github.com/ptmcg/logmerger
rule:
  /eget:
    cmd: x eget ptmcg/logmerger
    reference: https://github.com/ptmcg/logmerger
binlist:
- 'logmerger'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 32 KB
          rating: 1
          desc:
            cn: 安装 32 KB
            en: 32 KB install
        download:
          estimate: 32 KB
          desc:
            cn: 约 32 KB 下载 (whl)
            en: ~32 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
