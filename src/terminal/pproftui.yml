lang: 'Go'
homepage: 'https://github.com/Oloruntobi1/pproftui'
license: 'MIT'
desc:
  cn: 面向 Go pprof 数据的终端诊断工具
  en: 'A terminal-based diagnostic tool for Go pprof data'
x:
  source: https://github.com/Oloruntobi1/pproftui
  eget: https://github.com/Oloruntobi1/pproftui
rule:
  /eget:
    cmd: x eget Oloruntobi1/pproftui
    reference: https://github.com/Oloruntobi1/pproftui
binlist:
  - 'pproftui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 186 KB
          rating: 1
          desc:
            cn: 约 186 KB（估算）
            en: ~186 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
