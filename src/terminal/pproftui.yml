lang: 'Go'
homepage: 'https://github.com/Oloruntobi1/pproftui'
license: 'MIT'
desc:
  cn: 面向 Go pprof 数据的终端诊断工具
  en: 'A terminal-based diagnostic tool for Go pprof data'
x:
  source: https://github.com/Oloruntobi1/pproftui
  eget: https://github.com/Oloruntobi1/pproftui
rule:
  /eget:
    cmd: x eget Oloruntobi1/pproftui
    reference: https://github.com/Oloruntobi1/pproftui
binlist:
  - 'pproftui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
