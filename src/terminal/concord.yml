lang: 'Rust'
homepage: 'https://github.com/chojs23/concord'
license: 'GPL-3.0'
desc:
  cn: 功能丰富的 Discord TUI 客户端
  en: 'A feature-rich TUI client for Discord'
x:
  source: https://github.com/chojs23/concord
  eget: https://github.com/chojs23/concord
rule:
  /eget:
    cmd: x eget chojs23/concord
    reference: https://github.com/chojs23/concord
binlist:
  - 'concord'
# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read: []
  resource:
    disk:
      size:
        install:
          estimate: 6.8 MB
          rating: 1
          desc:
            cn: 约 6.8 MB（估算）
            en: ~6.8 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
