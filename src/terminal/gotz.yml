lang: Go
homepage: https://github.com/merschformann/gotz
license: MIT
desc:
  cn: 一个简单的命令行工具，用于显示终端中的多个时区信息。
  en: A simple CLI timezone info tool.
  cs: Jednoduchý nástroj CLI s informacemi o časových pásmech.
  de: Ein einfaches CLI-Werkzeug für Zeitzoneninformationen.
  es: Una sencilla herramienta CLI de información de zonas horarias.
  fr: Un simple outil CLI d'information sur les fuseaux horaires.
  id: Alat CLI sederhana untuk informasi zona waktu.
  it: Un semplice strumento CLI per le informazioni sul fuso orario.
  ja: シンプルなタイムゾーン情報 CLI ツール。
  ko: 간단한 시간대 정보 CLI 도구.
  pl: Proste narzędzie CLI z informacjami o strefach czasowych.
  pt: Uma ferramenta CLI simples para informações de fuso horário.
  ro: Un instrument CLI simplu cu informații despre fuse orare.
  ru: Простой CLI-инструмент для информации о часовых поясах.
  th: เครื่องมือ CLI แสดงข้อมูลเขตเวลาอย่างง่ายดาย
  tr: Saat dilimi bilgisi için basit bir CLI aracı.
  uk: Простий CLI-інструмент для інформації про часові пояси.
  vi: Công cụ CLI đơn giản hiển thị thông tin múi giờ.
x:
  source: https://github.com/merschformann/gotz
  brew: gotz
  pacman: gotz-bin
  go: github.com/merschformann/gotz@latest
rule:
  /go:
    cmd: go install github.com/merschformann/gotz@latest
    reference: https://github.com/merschformann/gotz#installation
    dsnap: github.com/merschformann/gotz@latest
  /brew:
    cmd: 'brew tap merschformann/gotz \

      && brew install gotz

      '
    reference: https://github.com/merschformann/gotz#installation
  arch/pacman:
    cmd: pacman -S gotz-bin
    reference: https://github.com/merschformann/gotz#installation
  /eget:
    cmd: eget merschformann/gotz
    reference: https://github.com/merschformann/gotz#installation
binlist:
- gotz

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
