lang: Go
homepage: https://github.com/merschformann/gotz
license: MIT
desc:
  cn: 一个简单的命令行工具，用于显示终端中的多个时区信息。
  en: A simple CLI timezone info tool.
x:
  source: https://github.com/merschformann/gotz
rule:
  /go:
    cmd: go install github.com/merschformann/gotz@latest
    reference: https://github.com/merschformann/gotz#installation
    dsnap: github.com/merschformann/gotz@latest
  /brew:
    cmd: 'brew tap merschformann/gotz \

      && brew install gotz

      '
    reference: https://github.com/merschformann/gotz#installation
  arch/pacman:
    cmd: pacman -S gotz-bin
    reference: https://github.com/merschformann/gotz#installation
  /eget:
    cmd: eget merschformann/gotz
    reference: https://github.com/merschformann/gotz#installation
binlist:
- gotz

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
