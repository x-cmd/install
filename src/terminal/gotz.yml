lang: Go
homepage: https://github.com/merschformann/gotz
license: MIT
desc:
  cn: 一个简单的命令行工具，用于显示终端中的多个时区信息。
  en: A simple CLI timezone info tool.
x:
  source: https://github.com/merschformann/gotz
rule:
  /go:
    cmd: go install github.com/merschformann/gotz@latest
    reference: https://github.com/merschformann/gotz#installation
    dsnap: github.com/merschformann/gotz@latest
  /brew:
    cmd: 'brew tap merschformann/gotz \

      && brew install gotz

      '
    reference: https://github.com/merschformann/gotz#installation
  arch/pacman:
    cmd: pacman -S gotz-bin
    reference: https://github.com/merschformann/gotz#installation
  /eget:
    cmd: eget merschformann/gotz
    reference: https://github.com/merschformann/gotz#installation
binlist:
- gotz

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 105 KB
          rating: 1
          desc:
            cn: 约 105 KB（估算）
            en: ~105 KB estimated
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
