lang: Rust
homepage: https://github.com/matheus-git/systemd-manager-tui
license: mit
desc:
  cn: 管理 systemd 服务的 TUI 应用
  en: A TUI application for managing systemd services.
x:
  source: https://github.com/matheus-git/systemd-manager-tui
  eget: https://github.com/matheus-git/systemd-manager-tui
rule:
  /eget:
    cmd: x eget matheus-git/systemd-manager-tui
    reference: https://github.com/matheus-git/systemd-manager-tui
binlist:
- systemd-manager-tui

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
