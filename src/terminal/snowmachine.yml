lang: Python
homepage: https://github.com/sontek/snowmachine
license: BSD-3-Clause
desc:
  cn: 在终端中模拟下雪效果的小工具
  en: A small, fun and easy way to make it snow in your terminal
x:
  source: https://github.com/sontek/snowmachine
rule:
  nix/nix-shell:
    cmd: nix-shell -p snowmachine --command snowmachine
    reference: https://github.com/sontek/snowmachine#snowmachine
  /brew:
    cmd: brew install sontek/snowmachine/snowmachine
    reference: https://github.com/sontek/snowmachine#snowmachine
  /pip:
    cmd: pip install snowmachine
    reference: https://github.com/sontek/snowmachine#snowmachine
    dsnap: snowmachine
  /pipx:
    cmd: pipx install snowmachine
    reference: https://github.com/sontek/snowmachine#snowmachine
binlist:
- snowmachine

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
