lang: 'Kotlin'
homepage: https://github.com/ericschmar/moribito
license: 'MIT'
desc:
  cn: 基于终端的 LDAP 浏览器，可遍历目录树、记录和自定义 LDAP 查询
  en: 'moribito is a terminal-based LDAP explorer for browsing directory trees, records, and custom LDAP queries.'
x:
  source: https://github.com/ericschmar/moribito
  eget: https://github.com/ericschmar/moribito
rule:
  /eget:
    cmd: x eget ericschmar/moribito
    reference: https://github.com/ericschmar/moribito
binlist:
  - 'moribito'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
