lang: 'Kotlin'
homepage: https://github.com/ericschmar/moribito
license: 'MIT'
desc:
  cn: 基于终端的 LDAP 浏览器，可遍历目录树、记录和自定义 LDAP 查询
  en: 'moribito is a terminal-based LDAP explorer for browsing directory trees, records, and custom LDAP queries.'
x:
  source: https://github.com/ericschmar/moribito
  eget: https://github.com/ericschmar/moribito
rule:
  /eget:
    cmd: x eget ericschmar/moribito
    reference: https://github.com/ericschmar/moribito
binlist:
- 'moribito'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
