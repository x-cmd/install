lang: 'Go'
homepage: https://github.com/ashish0kumar/typtea
license: 'MIT'
desc:
  cn: 极简终端打字测试工具
  en: 'minimal terminal typing tester'
  cs: minimální test rychlosti psaní v terminálu
  de: minimaler Tipptest für das Terminal
  es: tester de escritura mínimo para terminal
  fr: testeur de frappe minimal pour terminal
  id: pengetes ketik terminal minimal
  it: tester di scrittura minimalista per terminale
  ja: ミニマルなターミナルタイピングテスター
  ko: 미니멀한 터미널 타이핑 테스터
  pl: minimalistyczny tester pisania w terminalu
  pt: testador de digitação mínimo para terminal
  ro: tester de tastare minim pentru terminal
  ru: минимальный тестер скорости набора в терминале
  th: เครื่องมือทดสอบการพิมพ์แบบเรียบง่ายสำหรับเทอร์มินัล
  tr: minimal terminal yazma testi aracı
  uk: мінімальний тестер швидкості набору в терміналі
  vi: trình kiểm tra gõ phím tối giản cho terminal
x:
  source: https://github.com/ashish0kumar/typtea
  eget: ashish0kumar/typtea
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/ashish0kumar/typtea
  /eget:
    cmd: x eget ashish0kumar/typtea
    reference: https://github.com/ashish0kumar/typtea
binlist:
- 'typtea'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
