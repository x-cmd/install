lang: Rust
homepage: https://github.com/wezterm/wezterm
desc:
  cn: WezTerm 是一个功能强大的跨平台终端仿真器和多路复用器，由 @wez 编写，用 Rust winget install 实现
  en: WezTerm is a powerful cross-platform terminal emulator and multiplexer written by @wez and implemented in Rust
  cs: WezTerm je výkonný multiplatformní emulátor terminálu a multiplexer napsaný @wez a implementovaný v Rust
  de: WezTerm ist ein leistungsfähiger plattformübergreifender Terminal-Emulator und Multiplexer, geschrieben von @wez und in Rust implementiert
  es: WezTerm es un potente emulador de terminal multiplataforma y multiplexor escrito por @wez e implementado en Rust
  fr: WezTerm est un émulateur de terminal multplateforme et un multiplexeur puissant, écrit par @wez et implémenté en Rust
  id: WezTerm adalah emulator terminal dan multiplexer lintas platform yang kuat, ditulis oleh @wez dan diimplementasikan dengan Rust
  it: WezTerm è un potente emulatore di terminale multipiattaforma e multiplexer scritto da @wez e implementato in Rust
  ja: WezTerm は @wez が编写し Rust で実装された強力なクロスプラットフォームのターミナルエミュレータ兼マルチプレクサ
  ko: WezTerm은 @wez가 작성하고 Rust로 구현한 강력한 크로스 플랫폼 터미널 에뮬레이터 및 멀티플렉서입니다
  pl: WezTerm to wydajny, wieloplatformowy emulator terminala i multiplekser napisany przez @wez i zaimplementowany w Rust
  pt: WezTerm é um emulador de terminal multiplataforma e multiplexer poderoso, escrito por @wez e implementado em Rust
  ro: WezTerm este un emulator de terminal cross-platform și un multiplexor puternic, scris de @wez și implementat în Rust
  ru: WezTerm — мощный кроссплатформенный эмулятор терминала и мультиплексор, написанный @wez и реализованный на Rust
  th: WezTerm คือโปรแกรมจำลองเทอร์มินัลและมัลติเพล็กเซอร์ข้ามแพลตฟอร์มที่ทรงพลัง เขียนโดย @wez และพัฒนาด้วย Rust
  tr: WezTerm, @wez tarafından yazılan ve Rust ile uygulanan güçlü, platformlar arası bir terminal emülatörü ve çoklayıcıdır
  uk: WezTerm — потужний кроссплатформний емулятор термінала та мультиплексор, написаний @wez і реалізований на Rust
  vi: WezTerm là trình giả lập terminal đa nền tảng mạnh mẽ và bộ ghép kênh, được @wez viết và triển khai bằng Rust
x:
  source: https://github.com/wezterm/wezterm
  apt: wezterm
  zypper: wezterm
  port: wezterm
  scoop: wezterm
  choco: wezterm
  winget: wez.wezterm
  flatpak: flathub
rule:
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras && x scoop install wezterm

      '
    reference: https://wezfurlong.org/wezterm/install/windows.html#for-scoop-users
  (win|wsl2)/choco:
    cmd: x choco install wezterm -y
    reference: https://wezfurlong.org/wezterm/install/windows.html#for-chocolatey-users
  (win|wsl2)/winget:
    cmd: x winget install wez.wezterm
    reference: https://wezfurlong.org/wezterm/install/windows.html#for-winget-users
  darwin/brew:
    cmd: brew install --cask wezterm
    reference: https://wezfurlong.org/wezterm/install/macos.html#homebrew
  darwin/port:
    cmd: sudo port install wezterm
    reference: https://wezfurlong.org/wezterm/install/macos.html#macports
  /flatpak:
    cmd: flatpak install flathub org.wezfurlong.wezterm
    reference: https://wezfurlong.org/wezterm/install/linux.html#installing-on-linux-via-flathub
  ubuntu/apt:
    cmd: 'curl -fsSL https://apt.fury.io/wez/gpg.key | sudo gpg --yes --dearmor -o /usr/share/keyrings/wezterm-fury.gpg && \

      echo ''deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *'' | sudo tee /etc/apt/sources.list.d/wezterm.list && \

      sudo apt update && \

      sudo apt install wezterm

      '
    reference: https://wezfurlong.org/wezterm/install/linux.html#using-the-apt-repo
    dsnap: wezterm
  ubuntu/curl:
    cmd: 'curl -LO https://github.com/wezterm/wezterm/releases/download/20240203-110809-5046fc22/wezterm-20240203-110809-5046fc22.Ubuntu22.04.deb && \

      sudo apt install -y ./wezterm-20240203-110809-5046fc22.Ubuntu22.04.deb

      '
    reference: https://wezfurlong.org/wezterm/install/linux.html#pre-built-deb-packages
  debian/apt:
    cmd: 'curl -fsSL https://apt.fury.io/wez/gpg.key | sudo gpg --yes --dearmor -o /usr/share/keyrings/wezterm-fury.gpg && \

      echo ''deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *'' | sudo tee /etc/apt/sources.list.d/wezterm.list && \

      sudo apt update && \

      sudo apt install wezterm

      '
    reference: https://wezfurlong.org/wezterm/install/linux.html#using-the-apt-repo
    dsnap: wezterm
  fedora/dnf:
    cmd: sudo dnf install -y https://github.com/wezterm/wezterm/releases/download/20240203-110809-5046fc22/wezterm-20240203_110809_5046fc22-1.fedora39.x86_64.rpm
    reference: https://wezfurlong.org/wezterm/install/linux.html#installing-on-fedora-and-rpm-based-systems
    dsnap: wezterm
  opensuse/zypper:
    cmd: sudo zypper install wezterm
    reference: https://wezfurlong.org/wezterm/install/linux.html#opensuse
  linux/brew:
    cmd: 'brew tap wez/wezterm-linuxbrew && \

      brew install wezterm

      '
    reference: https://wezfurlong.org/wezterm/install/linux.html#linuxbrew-tap
  freebsd/pkg:
    cmd: pkg install wezterm
    reference: https://wezfurlong.org/wezterm/install/freebsd.html#installing-on-freebsd
  /cargo:
    cmd: cargo build --release --no-default-features --features vendored-fonts
    reference: https://wezfurlong.org/wezterm/install/source.html#building-without-wayland-support-on-unix-systems
    dsnap: wezterm
binlist:
- wezterm
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
        download:
          estimate: 166 KB
          desc:
            cn: 约 166 KB 下载 (linux/arm64)
            en: ~166 KB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
