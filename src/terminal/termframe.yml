lang: 'Rust'
homepage: 'https://github.com/pamburus/termframe'
license: 'MIT'
desc:
  cn: 终端输出 SVG 截图工具
  en: '📸 Terminal output SVG screenshot tool'
x:
  source: https://github.com/pamburus/termframe
  eget: https://github.com/pamburus/termframe
rule:
  /eget:
    cmd: x eget pamburus/termframe
    reference: https://github.com/pamburus/termframe
binlist:
  - 'termframe'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
