lang: 'Go'
homepage: 'https://github.com/orlangure/gocovsh'
license: 'GPL-3.0'
desc:
  cn: 在终端中浏览 Go 覆盖率报告的工具
  en: 'Go Coverage in your terminal: a tool for exploring Go Coverage reports from the command line 💻'
x:
  source: https://github.com/orlangure/gocovsh
  eget: https://github.com/orlangure/gocovsh
rule:
  /eget:
    cmd: x eget orlangure/gocovsh
    reference: https://github.com/orlangure/gocovsh
binlist:
  - 'gocovsh'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
