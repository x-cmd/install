lang: 'Go'
homepage: 'https://github.com/orlangure/gocovsh'
license: 'GPL-3.0'
desc:
  cn: 在终端中浏览 Go 覆盖率报告的工具
  en: 'Go Coverage in your terminal: a tool for exploring Go Coverage reports from the command line 💻'
x:
  source: https://github.com/orlangure/gocovsh
  eget: https://github.com/orlangure/gocovsh
rule:
  /eget:
    cmd: x eget orlangure/gocovsh
    reference: https://github.com/orlangure/gocovsh
binlist:
- 'gocovsh'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
