lang: Rust
homepage: https://github.com/j4v3l/ADS-B_TUI
desc:
  cn: 基于 ADS-B 数据的现代航班跟踪终端界面，以美观表格展示实时航班信息、国旗与航线
  en: A modern, fast, and user-friendly terminal interface for tracking aircraft using ADS-B data. Display real-time flight information in a beautiful table format with country flags, routes, and more.
x:
  source: https://github.com/j4v3l/ADS-B_TUI
  eget: https://github.com/j4v3l/ADS-B_TUI
rule:
  /eget:
    cmd: x eget j4v3l/ADS-B_TUI
    reference: https://github.com/j4v3l/ADS-B_TUI
binlist:
- adsb-tui
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
