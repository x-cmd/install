lang: Go
homepage: https://github.com/Code-Hex/Neo-cowsay
license: Artistic-2.0
desc:
  cn: Neo Cowsay 是用 Go 编写的。这个 cowsay 是原始 cowsay 的扩展。添加了更多有趣的选项，并且可以用作库
  en: Neo Cowsay is written in Go. This cowsay is extended the original cowsay. added fun more options, and you can be used as a library
  cs: Neo Cowsay je napsán v Go. Tento cowsay rozšiřuje původní cowsay. Přidává další zábavné možnosti a lze jej použít také jako knihovnu
  de: Neo Cowsay ist in Go geschrieben. Dieses cowsay erweitert das ursprüngliche cowsay. Es fügt weitere lustige Optionen hinzu und kann auch als Bibliothek verwendet werden
  es: Neo Cowsay está escrito en Go. Este cowsay amplía el cowsay original. Añade más opciones divertidas y también se puede usar como biblioteca
  fr: Neo Cowsay est écrit en Go. Ce cowsay étend le cowsay d'origine. Il ajoute des options plus amusantes et peut aussi être utilisé comme bibliothèque
  id: Neo Cowsay ditulis dengan Go. cowsay ini memperluas cowsay asli. Menambah opsi seru lainnya, dan juga dapat digunakan sebagai pustaka
  it: Neo Cowsay è scritto in Go. Questo cowsay estende il cowsay originale. Aggiunge altre opzioni divertenti e può essere usato anche come libreria
  ja: Neo Cowsay は Go で書かれています。この cowsay はオリジナルの cowsay を拡張しています。より楽しいオプションを追加し、ライブラリとしても使用できます
  ko: Neo Cowsay는 Go로 작성되었습니다. 이 cowsay는 원래 cowsay를 확장하여 더 재미있는 옵션을 추가했으며, 라이브러리로도 사용할 수 있습니다
  pl: Neo Cowsay jest napisany w Go. Ten cowsay rozszerza oryginalnego cowsay. Dodaje więcej ciekawych opcji i może być używany także jako biblioteka
  pt: O Neo Cowsay é escrito em Go. Este cowsay estende o cowsay original. Adiciona mais opções divertidas e também pode ser usado como biblioteca
  ro: Neo Cowsay este scris în Go. Acest cowsay extinde cowsay-ul original. Adaugă mai multe opțiuni amuzante și poate fi folosit și ca bibliotecă
  ru: Neo Cowsay написан на Go. Этот cowsay расширяет оригинальный cowsay. Добавлено больше забавных опций, и его также можно использовать как библиотеку
  th: Neo Cowsay เขียนด้วย Go โปรแกรม cowsay นี้เป็นส่วนขยายของ cowsay ดั้งเดิม เพิ่มตัวเลือกสนุก ๆ และยังใช้เป็นไลบรารีได้
  tr: Neo Cowsay Go ile yazılmıştır. Bu cowsay, orijinal cowsay'i genişletir. Daha eğlenceli seçenekler ekler ve bir kütüphane olarak da kullanılabilir
  uk: Neo Cowsay написаний на Go. Цей cowsay розширює оригінальний cowsay. Додано більше цікавих опцій, і його також можна використовувати як бібліотеку
  vi: Neo Cowsay được viết bằng Go. Cowsay này mở rộng cowsay gốc. Nó bổ sung thêm nhiều tùy chọn thú vị và cũng có thể dùng như một thư viện
x:
  source: https://github.com/Code-Hex/Neo-cowsay
  eget: Code-Hex/Neo-cowsay
  brew: Code-Hex/tap/neo-cowsay
  scoop: neo-cowsay
  winget: neo-cowsay
  go: github.com/Code-Hex/Neo-cowsay/cmd/v2/cowsay@latest
rule:
  /eget:
    cmd: x eget Code-Hex/Neo-cowsay
    reference: https://x-cmd.com/mod/eget
  (win|wsl2)/scoop:
    cmd: x scoop install neo-cowsay
    reference: https://github.com/Code-Hex/Neo-cowsay?tab=readme-ov-file#windows-users-via-scoop
  (win|wsl2)/winget:
    cmd: x winget install neo-cowsay
    reference: https://github.com/Code-Hex/Neo-cowsay?tab=readme-ov-file#windows-users-via-winget
  darwin/brew:
    cmd: brew install Code-Hex/tap/neo-cowsay
    reference: https://github.com/Code-Hex/Neo-cowsay?tab=readme-ov-file#mac-and-linux-users-via-homebrew
  /go:
    cmd: go install github.com/Code-Hex/Neo-cowsay/cmd/v2/cowsay@latest
    reference: https://github.com/Code-Hex/Neo-cowsay?tab=readme-ov-file#go
    dsnap: github.com/Code-Hex/Neo-cowsay/cmd/v2/cowsay
binlist:
- cowsay

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
