lang: TyperScript
homepage: https://github.com/Eugeny/tabby
license: MIT
desc:
  cn: Tabby 是 Windows 标准终端 (conhost)、PowerShell ISE、PuTTY、macOS Terminal.app 和 iTerm 的替代品
  en: Tabby is an alternative to Windows' standard terminal (conhost), PowerShell ISE, PuTTY, macOS Terminal.app and iTerm
  cs: Tabby je alternativou ke standardnímu terminálu Windows (conhost), PowerShell ISE, PuTTY, macOS Terminal.app a iTerm
  de: Tabby ist eine Alternative zum Standard-Terminal von Windows (conhost), zu PowerShell ISE, PuTTY, macOS Terminal.app und iTerm
  es: Tabby es una alternativa al terminal estándar de Windows (conhost), PowerShell ISE, PuTTY, macOS Terminal.app e iTerm
  fr: Tabby est une alternative au terminal standard de Windows (conhost), à PowerShell ISE, à PuTTY, à macOS Terminal.app et à iTerm
  id: Tabby adalah alternatif untuk terminal standar Windows (conhost), PowerShell ISE, PuTTY, macOS Terminal.app, dan iTerm
  it: Tabby è un'alternativa al terminale standard di Windows (conhost), a PowerShell ISE, PuTTY, macOS Terminal.app e iTerm
  ja: TabbyはWindows標準のターミナル (conhost)、PowerShell ISE、PuTTY、macOS Terminal.app、iTermの代替となります
  ko: Tabby는 Windows 표준 터미널(conhost), PowerShell ISE, PuTTY, macOS Terminal.app, iTerm의 대체품입니다
  pl: Tabby to alternatywa dla standardowego terminala Windows (conhost), PowerShell ISE, PuTTY, macOS Terminal.app oraz iTerm
  pt: O Tabby é uma alternativa ao terminal padrão do Windows (conhost), ao PowerShell ISE, ao PuTTY, ao macOS Terminal.app e ao iTerm
  ro: Tabby este o alternativă la terminalul standard al Windows (conhost), PowerShell ISE, PuTTY, macOS Terminal.app și iTerm
  ru: Tabby — альтернатива стандартному терминалу Windows (conhost), PowerShell ISE, PuTTY, macOS Terminal.app и iTerm
  th: Tabby เป็นทางเลือกแทนเทอร์มินัลมาตรฐานของ Windows (conhost), PowerShell ISE, PuTTY, macOS Terminal.app และ iTerm
  tr: Tabby, Windows'un standart terminalinin (conhost), PowerShell ISE'nin, PuTTY'nın, macOS Terminal.app'in ve iTerm'in alternatifidir
  uk: Tabby — альтернатива стандартному терміналу Windows (conhost), PowerShell ISE, PuTTY, macOS Terminal.app та iTerm
  vi: Tabby là sự thay thế cho terminal tiêu chuẩn của Windows (conhost), PowerShell ISE, PuTTY, macOS Terminal.app và iTerm
x:
  source: https://github.com/Eugeny/tabby
  eget: Eugeny/tabby
  scoop: extras/tabby
  choco: tabby
  yay: tabby-bin
rule:
  /eget:
    cmd: x eget Eugeny/tabby
    reference: https://x-cmd.com/mod/eget
  ubuntu/curl:
    cmd: 'curl -OL https://github.com/Eugeny/tabby/releases/download/v1.0.211/tabby-1.0.211-linux-x64.deb && \

      sudo dpkg -i tabby-1.0.211-linux-x64.deb

      '
    reference: https://github.com/Eugeny/tabby/releases/tag/v1.0.211
  debian/curl:
    cmd: 'curl -OL https://github.com/Eugeny/tabby/releases/download/v1.0.211/tabby-1.0.211-linux-x64.deb && \

      sudo dpkg -i tabby-1.0.211-linux-x64.deb

      '
    reference: https://github.com/Eugeny/tabby/releases/tag/v1.0.211
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/tabby
    reference: https://scoop.sh/#/apps?q=Tabby
  (win|wsl2)/winget:
    cmd: x winget install -e --id Eugeny.Tabby
    reference: https://winget.run/pkg/Eugeny/Tabby
  (win|wsl2)/choco:
    cmd: x choco install tabby
    reference: https://community.chocolatey.org/packages/tabby
  arch/yay:
    cmd: yay -S tabby-bin
    reference: https://aur.archlinux.org/packages/tabby-bin
binlist:
- tabby

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
