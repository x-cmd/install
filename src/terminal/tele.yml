lang: Go
homepage: https://github.com/sorokin-vladimir/tele
license: GPL-3.0
desc:
  en: tele is a keyboard-first Telegram client for the terminal — vim-style navigation, inline photos and voice notes, reactions and chat folders, plus a daemon mode that keeps the account connected and delivers desktop notifications with no window open.
  cn: tele 是面向终端的键盘优先 Telegram 客户端：vim 风格导航、内联图片与语音消息、表情回应与会话文件夹，并支持守护进程模式——没有窗口打开时仍保持账号在线并推送桌面通知。
  cs: tele je klient Telegram pro terminál s orientací na klávesnici — navigace ve stylu vimu, vložené fotografie a hlasové poznámky, reakce a složky chatů a navíc režim daemonu, který udržuje účet připojený a doručuje oznámení na plochu bez otevřeného okna.
  de: tele ist ein tastaturorientierter Telegram-Client für das Terminal — Navigation im vim-Stil, Inline-Fotos und Sprachnachrichten, Reaktionen und Chat-Ordner sowie ein Daemon-Modus, der das Konto verbunden hält und Desktop-Benachrichtigungen sendet, ohne dass ein Fenster geöffnet ist.
  es: "tele es un cliente de Telegram para la terminal centrado en el teclado: navegación al estilo de vim, fotos y notas de voz en línea, reacciones y carpetas de chat, además de un modo demonio que mantiene la cuenta conectada y entrega notificaciones de escritorio sin ventana abierta."
  fr: tele est un client Telegram pour le terminal axé sur le clavier — navigation de style vim, photos et notes vocales en ligne, réactions et dossiers de discussion, ainsi qu'un mode démon qui garde le compte connecté et délivre des notifications de bureau sans fenêtre ouverte.
  id: tele adalah klien Telegram untuk terminal yang mengutamakan papan ketik — navigasi bergaya vim, foto dan catatan suara sebaris, reaksi dan folder obrolan, serta mode daemon yang menjaga akun tetap terhubung dan mengirim notifikasi desktop tanpa jendela terbuka.
  it: tele è un client Telegram per terminale orientato alla tastiera — navigazione in stile vim, foto e note vocali in linea, reazioni e cartelle di chat, più una modalità daemon che mantiene l'account connesso e invia notifiche desktop senza aprire alcuna finestra.
  ja: tele はキーボードファーストの Telegram クライアントで、ターミナル向けです。vim 風ナビゲーション、インライン画像とボイスメモ、リアクションとチャットフォルダに加えて、アカウントを接続したまま維持し、ウィンドウを開かずにデスクトップ通知を送るデーモンモードも備えています。
  ko: tele은 터미널용 키보드 우선 Telegram 클라이언트로, vim 스타일 탐색, 인라인 사진과 음성 메모, 반응과 채팅 폴더를 지원하며, 창을 열지 않고 계정을 계속 연결 상태로 유지하면서 데스크톱 알림을 전달하는 데몬 모드도 제공합니다.
  pl: tele to klient Telegramu dla terminala, oparty na klawiaturze — nawigacja w stylu vima, wbudowane zdjęcia i notatki głosowe, reakcje i foldery czatów, a także tryb demona, który utrzymuje konto połączone i dostarcza powiadomienia pulpitu bez otwierania okna.
  pt: tele é um cliente do Telegram para terminal, focado no teclado — navegação ao estilo vim, fotos e notas de voz embutidas, reações e pastas de conversa, além de um modo daemon que mantém a conta conectada e entrega notificações de desktop sem janela aberta.
  ro: tele este un client Telegram pentru terminal, orientat pe tastatură — navigare în stil vim, fotografii și note vocale în linie, reacții și foldere de chat, plus un mod daemon care păstrează contul conectat și trimite notificări pe desktop fără a deschide o fereastră.
  ru: "tele — клиент Telegram для терминала, ориентированный на клавиатуру: навигация в стиле vim, встроенные фото и голосовые заметки, реакции и папки чатов, а также режим демона, который сохраняет аккаунт подключённым и присылает уведомления на рабочий стол без открытого окна."
  th: tele คือไคลเอนต์ Telegram สำหรับเทอร์มินัลที่ให้ความสำคัญกับคีย์บอร์ด — การนำทางสไตล์ vim, รูปภาพและบันทึกเสียงแบบฝังในบทสนทนา, ปฏิกิริยาและโฟลเดอร์แชท รวมถึงโหมด daemon ที่คงบัญชีเชื่อมต่ออยู่และส่งการแจ้งเตือนบนเดสก์ท็อปโดยไม่ต้องเปิดหน้าต่าง.
  tr: tele, terminal için klavye odaklı bir Telegram istemcisidir — vim tarzı gezinme, satır içi fotoğraflar ve sesli notlar, tepkiler ve sohbet klasörleri, ayrıca hesabı bağlı tutan ve pencere açılmadan masaüstü bildirimleri gönderen bir arka plan modu sunar.
  uk: "tele — клієнт Telegram для термінала, орієнтований на клавіатуру: навігація у стилі vim, вбудовані фото та голосові нотатки, реакції та теки чатів, а також режим демона, який утримує обліковий запис підключеним і надсилає сповіщення на робочий стіл без відкритого вікна."
  vi: tele là ứng dụng Telegram cho terminal với triết lý bàn phím trước — điều hướng phong cách vim, ảnh và ghi chú giọng nói nội tuyến, biểu cảm và thư mục trò chuyện, cùng chế độ daemon giúp tài khoản luôn kết nối và gửi thông báo máy tính mà không cần mở cửa sổ.
x:
  source: https://github.com/sorokin-vladimir/tele
  eget: sorokin-vladimir/tele
  brew: tele
  winget: sorokin-vladimir.tele
rule:
  /eget:
    cmd: x eget sorokin-vladimir/tele
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sL https://raw.githubusercontent.com/sorokin-vladimir/tele/main/scripts/install.sh | sh
    reference: https://github.com/sorokin-vladimir/tele#installation
  darwin/brew:
    cmd: brew install tele
    reference: https://github.com/sorokin-vladimir/tele#installation
  (win|wsl2)/scoop:
    cmd: |
      x scoop bucket add tele https://github.com/sorokin-vladimir/scoop-tele && \
      x scoop install tele
    reference: https://github.com/sorokin-vladimir/tele#installation
  (win|wsl2)/winget:
    cmd: x winget install sorokin-vladimir.tele
    reference: https://github.com/sorokin-vladimir/tele#installation
  nixos/nix:
    cmd: nix profile install github:sorokin-vladimir/tele
    reference: https://github.com/sorokin-vladimir/tele#installation

binlist:
- tele

# complicated
footprint:
  behavior:
    runtime:
      type: ['tui', 'daemon']
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置、Telegram 会话与本地历史数据库、媒体缓存
          en: Reads the config, the Telegram session and local history database, and the media cache
        sensitive: []
      write:
        desc:
          cn: 写入配置、会话与本地数据库、媒体缓存及日志
          en: Writes the config, the session and local database, the media cache and logs
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 29 MB
          rating: 2
          desc:
            cn: 约 29 MB 安装
            en: ~29 MB install
        download:
          estimate: 29 MB
          desc:
            cn: 约 29 MB 下载 (linux/x64)
            en: ~29 MB download (linux/x64)
        growth:
          desc:
            cn: 媒体缓存默认 256 MB 预算，头像另有 16 MB 预算
            en: Media cache defaults to a 256 MB budget, with a separate 16 MB budget for avatars
      paths:
        data:
          - ~/.local/state/tele/
        config:
          - ~/.config/tele/
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 约 50 MB 闲置
          en: ~50 MB idle
    cpu:
      workload: ['compute', 'network', 'io']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 中等（长期运行的 TUI）
          en: Moderate (long-running TUI)
  platform:
    win: full
    linux: full
    darwin: full
