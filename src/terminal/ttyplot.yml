lang: C
homepage: https://github.com/tenox7/ttyplot
license: Apache-2.0
desc:
  en: a realtime plotting utility for terminal/console with data input from stdin
  cn: 一个用于终端/控制台的实时绘图工具，数据来源于标准输入 (stdin)
x:
  source: https://github.com/tenox7/ttyplot
rule:
  ubuntu/snap:
    cmd: snap install ttyplot
    reference: https://github.com/tenox7/ttyplot?tab=readme-ov-file#get
  debian/apt:
    cmd: apt install ttyplot
    reference: https://github.com/tenox7/ttyplot?tab=readme-ov-file#get
    dsnap: ttyplot
  gentoo/emerge:
    cmd: emerge -av app-admin/ttyplot
    reference: https://github.com/tenox7/ttyplot?tab=readme-ov-file#get
  darwin/brew:
    cmd: brew install ttyplot
    reference: https://github.com/tenox7/ttyplot?tab=readme-ov-file#get
  termux/pkg:
    cmd: pkg install ttyplot
    reference: https://github.com/tenox7/ttyplot?tab=readme-ov-file#get
  freebsd/pkg:
    cmd: pkg install ttyplot
    reference: https://github.com/tenox7/ttyplot?tab=readme-ov-file#get
  arch/yay:
    cmd: yay -S ttyplot
    reference: https://aur.archlinux.org/packages/ttyplot
binlist:
- ttyplot

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
