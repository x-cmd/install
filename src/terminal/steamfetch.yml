lang: 'Rust'
homepage: 'https://github.com/unhappychoice/steamfetch'
license: 'ISC'
desc:
  cn: Steam 版 neofetch，在终端展示你的 Steam 统计
  en: 'neofetch for Steam - Display your Steam stats in terminal'
  cs: neofetch pro Steam — zobrazte své Steam statistiky v terminálu
  de: neofetch für Steam – Zeige deine Steam-Statistiken im Terminal
  es: "neofetch para Steam: muestra tus estadísticas de Steam en la terminal"
  fr: neofetch pour Steam - Affichez vos statistiques Steam dans le terminal
  id: neofetch untuk Steam - Tampilkan statistik Steam Anda di terminal
  it: neofetch per Steam - Visualizza le tue statistiche Steam nel terminale
  ja: Steam 版の neofetch - ターミナルに Steam の統計を表示します
  ko: Steam용 neofetch - 터미널에서 Steam 통계를 표시합니다
  pl: neofetch dla Steam — wyświetlaj swoje statystyki Steam w terminalu
  pt: neofetch para Steam - Exiba suas estatísticas do Steam no terminal
  ro: neofetch pentru Steam - Afișează-ți statisticile Steam în terminal
  ru: neofetch для Steam — показывайте статистику Steam в терминале
  th: neofetch สำหรับ Steam - แสดงสถิติ Steam ของคุณในเทอร์มินัล
  tr: Steam için neofetch - Steam istatistiklerinizi terminalde gösterin
  uk: neofetch для Steam — показуйте статистику Steam у терміналі
  vi: neofetch cho Steam - Hiển thị thống kê Steam của bạn trong terminal
x:
  source: https://github.com/unhappychoice/steamfetch
  eget: unhappychoice/steamfetch
rule:
  /eget:
    cmd: x eget unhappychoice/steamfetch
    reference: https://github.com/unhappychoice/steamfetch
binlist:
- 'steamfetch'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
