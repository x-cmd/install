lang: 'Rust'
homepage: 'https://github.com/unhappychoice/steamfetch'
license: 'ISC'
desc:
  cn: Steam 版 neofetch，在终端展示你的 Steam 统计
  en: 'neofetch for Steam - Display your Steam stats in terminal'
x:
  source: https://github.com/unhappychoice/steamfetch
  eget: https://github.com/unhappychoice/steamfetch
rule:
  /eget:
    cmd: x eget unhappychoice/steamfetch
    reference: https://github.com/unhappychoice/steamfetch
binlist:
  - 'steamfetch'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
