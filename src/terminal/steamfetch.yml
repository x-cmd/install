lang: 'Rust'
homepage: 'https://github.com/unhappychoice/steamfetch'
license: 'ISC'
desc:
  cn: Steam 版 neofetch，在终端展示你的 Steam 统计
  en: 'neofetch for Steam - Display your Steam stats in terminal'
x:
  source: https://github.com/unhappychoice/steamfetch
  eget: https://github.com/unhappychoice/steamfetch
rule:
  /eget:
    cmd: x eget unhappychoice/steamfetch
    reference: https://github.com/unhappychoice/steamfetch
binlist:
- 'steamfetch'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
