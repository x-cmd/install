lang: Go
homepage: https://github.com/ddworken/hishtory
license: mit
desc:
  cn: 可同步、可检索、带上下文的 Shell 历史记录
  en: 'Your shell history: synced, queryable, and in context'
x:
  source: https://github.com/ddworken/hishtory
  eget: https://github.com/ddworken/hishtory
rule:
  /eget:
    cmd: x eget ddworken/hishtory
    reference: https://github.com/ddworken/hishtory
binlist:
- hishtory

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
