lang: Go
homepage: https://github.com/ddworken/hishtory
license: mit
desc:
  cn: 可同步、可检索、带上下文的 Shell 历史记录
  en: 'Your shell history: synced, queryable, and in context'
x:
  source: https://github.com/ddworken/hishtory
  eget: https://github.com/ddworken/hishtory
rule:
  /eget:
    cmd: x eget ddworken/hishtory
    reference: https://github.com/ddworken/hishtory
binlist:
- hishtory

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
