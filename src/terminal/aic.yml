lang: 'Go'
homepage: 'https://github.com/reyamira/aic'
license: 'MIT'
desc:
  cn: 获取 AI 编程助手最新更新日志的 CLI，覆盖 Claude Code、Codex、Gemini CLI 等
  en: 'CLI to fetch the latest changelogs for AI coding assistants — Claude Code, Codex, OpenCode, Gemini CLI, Openclaw, and a few more'
x:
  source: https://github.com/reyamira/aic
  eget: https://github.com/reyamira/aic
rule:
  /eget:
    cmd: x eget reyamira/aic
    reference: https://github.com/reyamira/aic
binlist:
  - 'aic'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
