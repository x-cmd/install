lang: 'Rust'
homepage: 'https://github.com/akinoiro/ssh-list'
license: 'GPL-3.0'
desc:
  cn: 带 TUI 界面的 SSH 连接管理器
  en: '🧑‍💻 SSH connection manager with a TUI interface'
x:
  source: https://github.com/akinoiro/ssh-list
  eget: https://github.com/akinoiro/ssh-list
rule:
  /eget:
    cmd: x eget akinoiro/ssh-list
    reference: https://github.com/akinoiro/ssh-list
binlist:
  - 'ssh-list'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
