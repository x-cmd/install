lang: 'Rust'
homepage: 'https://github.com/akinoiro/ssh-list'
license: 'GPL-3.0'
desc:
  cn: 带 TUI 界面的 SSH 连接管理器
  en: '🧑‍💻 SSH connection manager with a TUI interface'
x:
  source: https://github.com/akinoiro/ssh-list
  eget: https://github.com/akinoiro/ssh-list
rule:
  /eget:
    cmd: x eget akinoiro/ssh-list
    reference: https://github.com/akinoiro/ssh-list
binlist:
- 'ssh-list'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 763 KB
          rating: 1
          desc:
            cn: 安装 763 KB
            en: 763 KB install
        download:
          estimate: 763 KB
          desc:
            cn: 约 763 KB 下载 (linux/x64)
            en: ~763 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
