lang: TypeScript
homepage: https://github.com/vincelwt/gloomberb
desc:
  cn: 运行于终端的金融终端
  en: Finance terminal, in your terminal.
x:
  source: https://github.com/vincelwt/gloomberb
  eget: https://github.com/vincelwt/gloomberb
rule:
  /eget:
    cmd: x eget vincelwt/gloomberb
    reference: https://github.com/vincelwt/gloomberb
binlist:
- gloomberb
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 448 KB
          rating: 1
          desc:
            cn: 约 448 KB（估算）
            en: ~448 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
