lang: TypeScript
homepage: https://github.com/vincelwt/gloomberb
desc:
  cn: 运行于终端的金融终端
  en: Finance terminal, in your terminal.
x:
  source: https://github.com/vincelwt/gloomberb
  eget: https://github.com/vincelwt/gloomberb
rule:
  /eget:
    cmd: x eget vincelwt/gloomberb
    reference: https://github.com/vincelwt/gloomberb
binlist:
- gloomberb
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
