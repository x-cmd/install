lang: Go
homepage: https://github.com/kencx/keyb
license: MIT
desc:
  cn: 在终端中创建和查看自定义热键备忘单
  en: Create and view custom hotkey cheatsheets in the terminal
x:
  source: https://github.com/kencx/keyb
  eget: https://github.com/kencx/keyb
rule:
  /eget:
    cmd: x eget kencx/keyb
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/kencx/keyb@latest
    reference: https://github.com/kencx/keyb?tab=readme-ov-file#install
    dsnap: kencx/keyb
  /make:
    cmd: git clone https://github.com/kencx/keyb && cd keyb && make build
    reference: https://github.com/kencx/keyb?tab=readme-ov-file#build-from-source
binlist:
- keyb

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
