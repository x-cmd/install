lang: Go
homepage: https://github.com/kencx/keyb
license: MIT
desc:
  cn: 在终端中创建和查看自定义热键备忘单
  en: Create and view custom hotkey cheatsheets in the terminal
  cs: Vytvářejte a zobrazujte vlastní přehledy klávesových zkratek v terminálu
  de: Erstellen und Ansehen eigener Hotkey-Spickzettel im Terminal
  es: Crea y consulta fichas de atajos de teclado personalizadas en la terminal
  fr: Créez et consultez des aide-mémoire de raccourcis clavier personnalisés dans le terminal
  id: Buat dan lihat lembar contekan hotkey kustom di terminal
  it: Crea e consulta fogli di appunti con scorciatoie personalizzate nel terminale
  ja: ターミナルで独自のホットキー早見表を作成・表示する
  ko: 터미널에서 사용자 정의 단축키 치트시트를 만들고 확인합니다
  pl: Twórz i przeglądaj własne ściągawki skrótów w terminalu
  pt: Crie e consulte fichas de referência de atalhos personalizados no terminal
  ro: Creează și consultă fișe cu scurtături de tastă personalizate în terminal
  ru: Создавайте и просматривайте собственные шпаргалки по горячим клавишам в терминале
  th: สร้างและดูชีตกดลัดแบบกำหนดเองในเทอร์มินัล
  tr: Terminalde kendi kısayol referanslarınızı oluşturun ve görüntüleyin
  uk: Створюйте та переглядайте власні шпаргалки з гарячими клавішами в терміналі
  vi: Tạo và xem bảng tra cứu phím tắt tùy chỉnh trong terminal
x:
  source: https://github.com/kencx/keyb
  eget: kencx/keyb
  go: github.com/kencx/keyb@latest
rule:
  /eget:
    cmd: x eget kencx/keyb
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/kencx/keyb@latest
    reference: https://github.com/kencx/keyb?tab=readme-ov-file#install
    dsnap: kencx/keyb
  /make:
    cmd: git clone https://github.com/kencx/keyb && cd keyb && make build
    reference: https://github.com/kencx/keyb?tab=readme-ov-file#build-from-source
binlist:
- keyb

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
