lang: 'Go'
homepage: https://github.com/ashish0kumar/mufetch
license: 'MIT'
desc:
  cn: neofetch 风格的音乐 CLI
  en: 'neofetch-style music cli'
x:
  source: https://github.com/ashish0kumar/mufetch
  eget: ashish0kumar/mufetch
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/ashish0kumar/mufetch
  /eget:
    cmd: x eget ashish0kumar/mufetch
    reference: https://github.com/ashish0kumar/mufetch
binlist:
- 'mufetch'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
