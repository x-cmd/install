lang: 'Go'
homepage: 'https://github.com/kts982/wintui'
license: 'MIT'
desc:
  cn: winget 的 Go TUI 前端，基于 Bubble Tea、Bubbles 和 Lip Gloss 构建
  en: 'Go TUI frontend for winget (Windows Package Manager) — built with Bubble Tea, Bubbles, and Lip Gloss'
x:
  source: https://github.com/kts982/wintui
  eget: https://github.com/kts982/wintui
rule:
  /eget:
    cmd: x eget kts982/wintui
    reference: https://github.com/kts982/wintui
binlist:
- 'wintui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (win/x64)
            en: ~3 MB download (win/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: none
