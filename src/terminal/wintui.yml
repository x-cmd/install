  ja: winget (Windows Package Manager) 向けの Go製 TUI フロントエンド — Bubble Tea、Bubbles、Lip Gloss で構築
  ko: winget(Windows Package Manager)을 위한 Go TUI 프론트엔드 — Bubble Tea, Bubbles, Lip Gloss로 구축
