  th: ส่วนติดต่อ TUI ภาษา Go สำหรับ winget (Windows Package Manager) — สร้างด้วย Bubble Tea, Bubbles และ Lip Gloss
  tr: winget (Windows Package Manager) için Go TUI ön yüzü — Bubble Tea, Bubbles ve Lip Gloss ile geliştirildi
  uk: Go-фронтенд TUI для winget (Windows Package Manager) — створено на Bubble Tea, Bubbles та Lip Gloss
  vi: Giao diện TUI viết bằng Go cho winget (Windows Package Manager) — xây dựng với Bubble Tea, Bubbles và Lip Gloss
x:
  source: https://github.com/kts982/wintui
  eget: kts982/wintui
rule:
  /eget:
    cmd: x eget kts982/wintui
    reference: https://github.com/kts982/wintui
binlist:
- 'wintui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (win/x64)
            en: ~3 MB download (win/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: none
