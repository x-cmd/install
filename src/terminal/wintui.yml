lang: 'Go'
homepage: 'https://github.com/kts982/wintui'
license: 'MIT'
desc:
  cn: winget 的 Go TUI 前端，基于 Bubble Tea、Bubbles 和 Lip Gloss 构建
  en: 'Go TUI frontend for winget (Windows Package Manager) — built with Bubble Tea, Bubbles, and Lip Gloss'
x:
  source: https://github.com/kts982/wintui
  eget: https://github.com/kts982/wintui
rule:
  /eget:
    cmd: x eget kts982/wintui
    reference: https://github.com/kts982/wintui
binlist:
  - 'wintui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
