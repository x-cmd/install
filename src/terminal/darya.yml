lang: Rust
homepage: https://github.com/mrkatebzadeh/darya
desc:
  cn: 带 TUI 和实时矩形树的磁盘占用分析器
  en: Disk usage explorer with a TUI and live treemap
x:
  source: https://github.com/mrkatebzadeh/darya
  eget: https://github.com/mrkatebzadeh/darya
rule:
  /eget:
    cmd: x eget mrkatebzadeh/darya
    reference: https://github.com/mrkatebzadeh/darya
binlist:
- darya
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
