lang: Rust
homepage: https://github.com/mrkatebzadeh/darya
desc:
  cn: 带 TUI 和实时矩形树的磁盘占用分析器
  en: Disk usage explorer with a TUI and live treemap
x:
  source: https://github.com/mrkatebzadeh/darya
  eget: https://github.com/mrkatebzadeh/darya
rule:
  /eget:
    cmd: x eget mrkatebzadeh/darya
    reference: https://github.com/mrkatebzadeh/darya
binlist:
- darya
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
