lang: Rust
homepage: https://github.com/mrkatebzadeh/darya
desc:
  cn: 带 TUI 和实时矩形树的磁盘占用分析器
  en: Disk usage explorer with a TUI and live treemap
  cs: Průzkumník využití disku s TUI a živou stromovou mapou
  de: Datenträger-Explorer mit TUI und Live-Treemap
  es: Explorador de uso de disco con TUI y treemap en vivo
  fr: Explorateur d'espace disque avec TUI et treemap en direct
  id: Penjelajah penggunaan disk dengan TUI dan treemap langsung
  it: Esploratore dell'uso del disco con TUI e treemap live
  ja: TUIとライブツリーマップを備えたディスク使用量エクスプローラー
  ko: TUI와 실시간 트리맵을 갖춘 디스크 사용량 탐색기
  pl: Przeglądarka zajętości dysku z TUI i dynamiczną mapą drzewa
  pt: Explorador de uso de disco com TUI e treemap ao vivo
  ro: Explorator de utilizare a discului cu TUI și hartă de arbore în timp real
  ru: Обозреватель использования диска с TUI и живой treemap-картой
  th: ตัวสำรวจการใช้พื้นที่ดิสก์พร้อม TUI และ treemap แบบเรียลไทม์
  tr: TUI ve canlı treemap ile disk kullanımı gezgini
  uk: Оглядач використання диска з TUI та живою treemap-картою
  vi: Trình khám phá mức sử dụng đĩa với TUI và treemap trực tiếp
x:
  source: https://github.com/mrkatebzadeh/darya
  eget: mrkatebzadeh/darya
rule:
  /eget:
    cmd: x eget mrkatebzadeh/darya
    reference: https://github.com/mrkatebzadeh/darya
binlist:
- darya
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
