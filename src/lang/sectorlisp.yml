lang: C
homepage: https://github.com/jart/sectorlisp
license: isc
desc:
  cn: 在引导扇区中引导 LISP
  en: Bootstrapping LISP in a Boot Sector
x:
  source: https://github.com/jart/sectorlisp
  eget: https://github.com/jart/sectorlisp
rule:
  /eget:
    cmd: x eget jart/sectorlisp
    reference: https://github.com/jart/sectorlisp
binlist:
- sectorlisp

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
