lang: C
homepage: https://github.com/jart/sectorlisp
license: isc
desc:
  cn: 在引导扇区中引导 LISP
  en: Bootstrapping LISP in a Boot Sector
x:
  source: https://github.com/jart/sectorlisp
  eget: https://github.com/jart/sectorlisp
rule:
  /eget:
    cmd: x eget jart/sectorlisp
    reference: https://github.com/jart/sectorlisp
binlist:
- sectorlisp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 169 KB
          rating: 1
          desc:
            cn: 约 169 KB（估算）
            en: ~169 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
