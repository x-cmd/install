lang: Zig
homepage: https://github.com/ziglang/zig
license: MIT
desc:
  cn: Zig 是一个通用的编程语言和工具链，用于维护稳健、高效和可重用的软件
  en: Zig is a general-purpose programming language and toolchain for maintaining robust, optimal and reusable software
  cs: Zig je univerzální programovací jazyk a sada nástrojů pro údržbu robustního, optimálního a opakovaně použitelného softwaru
  de: Zig ist eine allgemeine Programmiersprache und Toolchain für die Wartung robuster, optimaler und wiederverwendbarer Software
  es: Zig es un lenguaje de programación y un conjunto de herramientas de propósito general para mantener software robusto, óptimo y reutilizable
  fr: Zig est un langage de programmation et une chaîne d'outils à usage général pour maintenir des logiciels robustes, optimaux et réutilisables
  id: Zig adalah bahasa pemrograman serbaguna dan perangkat lunak untuk mengelola perangkat lunak yang kuat, optimal, dan dapat digunakan kembali
  it: Zig è un linguaggio di programmazione e una toolchain general-purpose per mantenere software robusto, ottimale e riutilizzabile
  ja: Zig は、堅牢で最適かつ再利用可能なソフトウェアを維持するための汎用プログラミング言語とツールチェーンです
  ko: Zig은 견고하고 최적이며 재사용 가능한 소프트웨어를 관리하기 위한 범용 프로그래밍 언어이자 툴체인입니다
  pl: Zig to uniwersalny język programowania i łańcuch narzędzi do utrzymywania solidnego, optymalnego i wielokrotnego użytku oprogramowania
  pt: Zig é uma linguagem de programação e um conjunto de ferramentas de uso geral para manter software robusto, ideal e reutilizável
  ro: Zig este un limbaj de programare și un lanț de instrumente de uz general pentru întreținerea software-ului robust, optim și reutilizabil
  ru: Zig — это универсальный язык программирования и набор инструментов для сопровождения надёжного, оптимального и переиспользуемого программного обеспечения
  th: Zig เป็นภาษาโปรแกรมและชุดเครื่องมืออเนกประสงค์สำหรับการดูแลซอฟต์แวร์ที่มั่นคง เหมาะยม และนำกลับมาใช้ได้
  tr: Zig, sağlam, en uygun ve yeniden kullanılabilir yazılımı sürdürmek için genel amaçlı bir programlama dili ve araç zinciridir
  uk: Zig — це універсальна мова програмування та інструментарій для підтримки надійного, оптимального та придатного для повторного використання програмного забезпечення
  vi: Zig là ngôn ngữ lập trình và bộ công cụ đa năng để duy trì phần mềm vững chắc, tối ưu và có thể tái sử dụng
x:
  source: https://github.com/ziglang/zig
  eget: ziglang/zig
  apt: helix
  dnf: zig
  brew: zig
  pacman: zig
  snap: zig
  port: zig
  scoop: zig
  choco: zig
  winget: zig.zig
  asdf: zig
rule:
  /eget:
    cmd: x eget ziglang/zig
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use zig
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use zig
    reference: https://github.com/cheetah/asdf-zig
  darwin/brew:
    cmd: brew install zig
    reference: https://formulae.brew.sh/formula/zig#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#macports
  dragonflybsd/ravensw:
    cmd: sudo ravensw install zig-single-standard
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#dragonflybsd-ravenports
  ubuntu/snap:
    cmd: sudo snap install zig --classic --beta
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#ubuntu-snap
  arch/pacman:
    cmd: sudo pacman -S zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#arch-linux
  fedora/dnf:
    cmd: sudo dnf install zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#fedora
    dsnap: zig
  silverblue/ostree:
    cmd: sudo rpm-ostree install zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#fedora-silverblue
  rhel/dnf:
    cmd: 'sudo dnf copr enable varlad/helix \

      && sudo dnf install helix

      '
    reference: https://docs.helix-editor.com/install.html#fedorarhel
  raspbian/apt:
    cmd: 'sudo add-apt-repository ppa:maveonair/helix-editor \

      && sudo apt update \

      && sudo apt install helix

      '
    reference: https://docs.helix-editor.com/install.html#ubuntu
  (win|wsl2)/winget:
    cmd: x winget install zig.zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#windows-winget
  (win|wsl2)/scoop:
    cmd: x scoop install zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#windows-scoop
  (win|wsl2)/choco:
    cmd: x choco install zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#windows-choco
  /snap:
    cmd: snap install --classic helix
    reference: https://docs.helix-editor.com/install.html#snap
  win/msys2:
    cmd: sudo pacman -S mingw-w64-x86_64-zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#windows-msys2
  freebsd/pkg:
    cmd: pkg install lang/zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#freebsd
  gentoo/emerge:
    cmd: sudo emerge -av dev-lang/zig-bin
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#gentoo
  nix/nixpkgs:
    cmd: nix-env -i zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#nixos
  void/xbps:
    cmd: sudo xbps-install -Su zig
    reference: https://github.com/ziglang/zig/wiki/Install-Zig-from-a-Package-Manager#void-linux
binlist:
- zig

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 29 MB
          rating: 2
          desc:
            cn: 约 29 MB（估算）
            en: ~29 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
