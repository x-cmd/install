lang: Python
homepage: https://github.com/python/cpython
desc:
  cn: Python 是一种结合了解释性、编译性、互动性和面向对象的脚本语言
  en: Python is a Scripting language that combines interpretability, compilation, interactivity and object orientation
x:
  source: https://github.com/python/cpython
rule:
  /asdf:
    cmd: x asdf use python
    reference: https://github.com/danhper/asdf-python
  darwin/brew:
    cmd: brew install python3
    reference: https://formulae.brew.sh/formula/python@3.13#default
  debian/apt:
    cmd: apt-get install python3
    reference: https://command-not-found.com/python3
    dsnap: python3
  ubuntu/apt:
    cmd: apt-get install python3
    reference: https://command-not-found.com/python3
    dsnap: python3
  alpine/apk:
    cmd: apk add python3
    reference: https://command-not-found.com/python3
    dsnap: python3
  arch/pacman:
    cmd: pacman -S python3
    reference: https://command-not-found.com/python3
  kali/apt:
    cmd: apt-get install python3
    reference: https://command-not-found.com/python3
    dsnap: python3
  fedora/dnf:
    cmd: dnf install python3
    reference: https://command-not-found.com/python3
    dsnap: python3
  raspbian/apt:
    cmd: apt-get install python3
    reference: https://command-not-found.com/python3
binlist:
- python
- python3
- pip
- pip3
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
