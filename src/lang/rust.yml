lang: Rust
homepage: https://github.com/rust-lang/rust
license: Apache-2.0
desc:
  cn: 一门赋予每个人构建可靠且高效软件能力的语言
  en: A language empowering everyone to build reliable and efficient software
x:
  source: https://github.com/rust-lang/rust
rule:
  /asdf:
    cmd: x asdf use rust
    reference: https://github.com/code-lever/asdf-rust
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
    reference: https://www.rust-lang.org/tools/install
  darwin/brew:
    cmd: brew install rust
    reference: https://formulae.brew.sh/formula/rust#default
binlist:
- rust

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 155 MB
          rating: 3
          desc:
            cn: 约 155 MB（估算）
            en: ~155 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 极低
          en: Negligible
