lang: Rust
homepage: https://github.com/rust-lang/rust
license: Apache-2.0
desc:
  cn: 一门赋予每个人构建可靠且高效软件能力的语言
  en: A language empowering everyone to build reliable and efficient software
x:
  source: https://github.com/rust-lang/rust
rule:
  /asdf:
    cmd: x asdf use rust
    reference: https://github.com/code-lever/asdf-rust
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
    reference: https://www.rust-lang.org/tools/install
  darwin/brew:
    cmd: brew install rust
    reference: https://formulae.brew.sh/formula/rust#default
binlist:
- rust

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
