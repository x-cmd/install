lang: Rust
homepage: https://github.com/rust-lang/rust
license: Apache-2.0
desc:
  cn: 一门赋予每个人构建可靠且高效软件能力的语言
  en: A language empowering everyone to build reliable and efficient software
  cs: Jazyk, který dává každému možnost stavět spolehlivý a efektivní software
  de: Eine Sprache, die allen ermöglicht, zuverlässige und effiziente Software zu entwickeln
  es: Un lenguaje que permite a cualquiera crear software fiable y eficiente
  fr: Un langage qui permet à chacun de développer des logiciels fiables et efficaces
  id: Bahasa yang memberdayakan siapa pun untuk membangun perangkat lunak yang andal dan efisien
  it: Un linguaggio che permette a chiunque di costruire software affidabile ed efficiente
  ja: 誰もが信頼できる効率的なソフトウェアを構築できるようにする言語です
  ko: 누구나 안정적이고 효율적인 소프트웨어를 만들 수 있게 해 주는 언어입니다
  pl: Język, który pozwala każdemu tworzyć niezawodne i wydajne oprogramowanie
  pt: Uma linguagem que capacita todos a construir software confiável e eficiente
  ro: O limbaj care îi împuternicește pe toți să construiască software de încredere și eficient
  ru: Язык, который даёт каждому возможность создавать надёжное и эффективное программное обеспечение
  th: ภาษาที่ให้อำนาจทุกคนสร้างซอฟต์แวร์ที่เชื่อถือได้และมีประสิทธิภาพ
  tr: Herkesin güvenilir ve verimli yazılım geliştirmesini sağlayan bir dil
  uk: Мова, що дає кожному змогу створювати надійне та ефективне програмне забезпечення
  vi: Ngôn ngữ giúp mọi người xây dựng phần mềm đáng tin cậy và hiệu quả
x:
  source: https://github.com/rust-lang/rust
  brew: rust
  asdf: rust
rule:
  /asdf:
    cmd: x asdf use rust
    reference: https://github.com/code-lever/asdf-rust
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
    reference: https://www.rust-lang.org/tools/install
  darwin/brew:
    cmd: brew install rust
    reference: https://formulae.brew.sh/formula/rust#default
binlist:
- rust

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 155 MB
          rating: 3
          desc:
            cn: 约 155 MB（估算）
            en: ~155 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 3
        desc:
          cn: 极低
          en: Negligible
