lang: Julia
homepage: https://github.com/JuliaLang/julia
license: MIT
desc:
  cn: Julia 是一种高性能，动态，多范式的编程语言，它专注于数值计算和数据分析。Julia 有着简洁的语法，强大的多重派发机制，丰富的内置类型和函数，以及易于扩展的特性。Julia 也支持并行，分布式，元编程等编程风格。
  en: Julia is a high-level, high-performance dynamic language for technical computing
x:
  pkg:
    exist: true
  source: https://github.com/JuliaLang/julia
  eget: https://github.com/JuliaLang/julia
rule:
  /eget:
    cmd: x eget JuliaLang/julia
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use julia
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use julia
    reference: https://github.com/rkyleg/asdf-julia
  darwin/brew:
    cmd: brew install julia
    reference: https://formulae.brew.sh/formula/julia#default
  debian/apt:
    cmd: sudo apt-get install julia
    reference: https://command-not-found.com/julia
    dsnap: julia
  ubuntu/apt:
    cmd: sudo apt-get install julia
    reference: https://command-not-found.com/julia
    dsnap: julia
  alpine/apk:
    cmd: sudo apk add julia
    reference: https://command-not-found.com/julia
    dsnap: julia
  arch/pacman:
    cmd: sudo pacman -S julia
    reference: https://command-not-found.com/julia
  kali/apt:
    cmd: sudo apt-get install julia
    reference: https://command-not-found.com/julia
    dsnap: julia
  fedora/dnf:
    cmd: sudo dnf install julia
    reference: https://command-not-found.com/julia
    dsnap: julia
  raspbian/apt:
    cmd: sudo apt-get install julia
    reference: https://command-not-found.com/julia
binlist:
- julia
footprint:
  behavior:
    runtime:
      type: [cli, interactive]
    network:
      local: true
      internet: true   # Pkg registry
    filesystem:
      read:
        desc:
          cn: 读取 .jl 源文件
          en: Reads .jl source files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 200 MB
          rating: 3
          desc:
            cn: 安装 ~200 MB
            en: ~200 MB install
        growth:
          desc:
            cn: ~/.julia/packages 随包安装增长
            en: ~/.julia/packages grows with packages
      paths:
        data:
          - "$HOME/.julia"
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: ~100 MB
          en: ~100 MB
      peak:
        estimate: 4 GB
        desc:
          cn: JIT 编译时可达数 GB
          en: Several GB during JIT compile
    cpu:
      workload: [compute]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 7
        desc:
          cn: 计算密集任务时占用多核
          en: Saturates cores on compute-heavy tasks
