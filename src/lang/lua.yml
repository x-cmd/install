lang: C
homepage: https://github.com/lua/lua
desc:
  cn: Lua 是一种强大、高效、轻量级、可嵌入的脚本语言。它支持过程式编程、面向对象编程、函数式编程、数据驱动编程和数据描述。
  en: Lua is a powerful, efficient, lightweight, embeddable scripting language. It supports procedural programming, object-oriented programming, functional programming, data-driven programming, and data description.
  cs: Lua je mocný, efektivní, lehký a vložitelný skriptovací jazyk. Podporuje procedurální, objektově orientované, funkcionální, datově řízené programování a datové popisy.
  de: Lua ist eine mächtige, effiziente, leichtgewichtige, einbettbare Skriptsprache. Sie unterstützt prozedurale, objektorientierte, funktionale, datengetriebene Programmierparadigmen und Datenbeschreibungen.
  es: Lua es un lenguaje de scripts potente, eficiente, ligero y embebible. Admite programación procedural, orientada a objetos, funcional, orientada a datos y descripciones de datos.
  fr: Lua est un langage de script puissant, efficace, léger et intégrable. Il prend en charge la programmation procédurale, orientée objet, fonctionnelle, pilotée par les données et la description de données.
  id: Lua adalah bahasa skrip yang kuat, efisien, ringan, dan dapat disematkan. Mendukung pemrograman prosedural, berorientasi objek, fungsional, berbasis data, dan deskripsi data.
  it: Lua è un linguaggio di scripting potente, efficiente, leggero e incorporabile. Supporta la programmazione procedurale, orientata agli oggetti, funzionale, guidata dai dati e la descrizione dei dati.
  ja: Lua は強力で効率的、軽くて埋め込み可能なスクリプト言語です。手続き型、オブジェクト指向型、関数型、データ駆動型のプログラミングとデータ記述に対応しています。
  ko: Lua는 강력하고 효율적이며 가볍고 임베드 가능한 스크립트 언어입니다. 절차적, 객체 지향, 함수형, 데이터 기반 프로그래밍과 데이터 설명을 지원합니다.
  pl: Lua to potężny, wydajny, lekki i osadzalny język skryptowy. Obsługuje programowanie proceduralne, obiektowe, funkcyjne, sterowane danymi oraz opisy danych.
  pt: Lua é uma linguagem de script poderosa, eficiente, leve e incorporável. Suporta programação procedural, orientada a objetos, funcional, orientada a dados e descrição de dados.
  ro: Lua este un limbaj de scripting puternic, eficient, ușor și încorporabil. Acceptă programare procedurală, orientată pe obiecte, funcțională, bazată pe date și descrierea datelor.
  ru: Lua — мощный, эффективный, легковесный встраиваемый скриптовый язык. Поддерживает процедурное, объектно-ориентированное, функциональное и управляемое данными программирование, а также описание данных.
  th: Lua เป็นภาษาสคริปต์ที่ทรงพลัง มีประสิทธิภาพ เบา และฝังได้ รองรับการเขียนโปรแกรมแบบกระบวนการ เชิงวัตถุ เชิงฟังก์ชัน แบบข้อมูลขับเคลื่อน และคำอธิบายข้อมูล
  tr: Lua, güçlü, verimli, hafif ve gömülebilir bir betik dilidir. Prosedürel, nesne yönelimli, fonksiyonel, veri güdümlü programlamayı ve veri betimlemeyi destekler.
  uk: Lua — потужна, ефективна, легка та вбудовувана скриптова мова. Підтримує процедурне, об'єктно-орієнтоване, функціональне та кероване даними програмування, а також опис даних.
  vi: Lua là ngôn ngữ kịch bản mạnh mẽ, hiệu quả, nhẹ và có thể nhúng. Nó hỗ trợ lập trình thủ tục, hướng đối tượng, hàm, dựa trên dữ liệu và mô tả dữ liệu.
x:
  source: https://github.com/lua/lua
  dnf: lua
  brew: lua
  pacman: lua
  apk: lua
  yum: lua
  asdf: lua
rule:
  /x:
    cmd: x pkg use lua
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use lua
    reference: https://github.com/Stratus3D/asdf-lua
  darwin/brew:
    cmd: brew install lua
    reference: https://formulae.brew.sh/formula/lua#default
  alpine/apk:
    cmd: sudo apk add lua
    reference: https://command-not-found.com/lua
    dsnap: lua
  arch/pacman:
    cmd: sudo pacman -S lua
    reference: https://command-not-found.com/lua
  centos/yum:
    cmd: sudo yum install lua
    reference: https://command-not-found.com/lua
  fedora/dnf:
    cmd: sudo dnf install lua
    reference: https://command-not-found.com/lua
    dsnap: lua
binlist:
- lua
license: NOASSERTION
# complicated
footprint:
  behavior:
    runtime:
      type: [cli, interactive]
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 .lua 脚本文件
          en: Reads .lua scripts
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 约 1.4 MB（估算）
            en: ~1.4 MB estimated
      paths:
        data: []
        config:
          - "$HOME/.lua"
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 50 MB
        desc:
          cn: 大型脚本 ~50 MB
          en: ~50 MB on large scripts
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 脚本执行时占用
          en: Spike during script execution
