lang: C
homepage: https://github.com/php/php-src
license: BSD-3-Clause
desc:
  cn: PHP 解释器（PHP 是一种流行的通用脚本语言，特别适合 Web 开发。）
  en: A popular general-purpose scripting language that is especially suited to web development
x:
  source: https://github.com/php/php-src
rule:
  /asdf:
    cmd: x asdf use php
    reference: https://github.com/asdf-community/asdf-php
  darwin/brew:
    cmd: brew install php
    reference: https://formulae.brew.sh/formula/php#default
  debian/apt:
    cmd: sudo apt-get install php
    reference: https://command-not-found.com/php
    dsnap: php
  ubuntu/apt:
    cmd: sudo apt-get install php
    reference: https://command-not-found.com/php
    dsnap: php
  alpine/apk:
    cmd: sudo apk add php
    reference: https://command-not-found.com/php
    dsnap: php
  arch/pacman:
    cmd: sudo pacman -S php
    reference: https://command-not-found.com/php
  kali/apt:
    cmd: sudo apt-get install php
    reference: https://command-not-found.com/php
    dsnap: php
  centos/yum:
    cmd: sudo yum install php-cli
    reference: https://command-not-found.com/php
  fedora/dnf:
    cmd: sudo dnf install php-cli
    reference: https://command-not-found.com/php
    dsnap: php-cli
  raspbian/apt:
    cmd: sudo apt-get install php
    reference: https://command-not-found.com/php
binlist:
- php

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
