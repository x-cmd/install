lang: Rust
homepage: https://github.com/ratatui-org/crates-tui
license: MIT
desc:
  en: crates-tui is a simple terminal user interface explorer for crates.io based on Ratatui
  cn: crates-tui 是一个基于 Ratatui 的、用于 crates.io 的简洁终端用户界面浏览器。
x:
  source: https://github.com/ratatui-org/crates-tui
  eget: https://github.com/ratatui-org/crates-tui
rule:
  /eget:
    cmd: x eget ratatui-org/crates-tui
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install crates-tui
    reference: https://github.com/ratatui/crates-tui?tab=readme-ov-file#install
    dsnap: crates-tui
  arch/paru:
    cmd: paru -S crates-tui
    reference: https://github.com/ratatui/crates-tui?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S crates-tui
    reference: https://aur.archlinux.org/packages/crates-tui
binlist:
- crates-tui

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
