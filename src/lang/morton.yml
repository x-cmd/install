lang: C
homepage: https://github.com/jart/morton
license: isc
desc:
  cn: Morton 编码（Z 阶曲线）库——把多维坐标映射成一维，加速空间索引与范围查询。
  en: Morton encoding (Z-order curve) library — maps multi-dimensional coordinates to one dimension for faster spatial indexing and range queries.
x:
  source: https://github.com/jart/morton
  eget: https://github.com/jart/morton
rule:
  /eget:
    cmd: x eget jart/morton
    reference: https://github.com/jart/morton
binlist:
- morton

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
