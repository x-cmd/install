lang: dart
homepage: https://github.com/dart-lang/sdk
license: BSD-3-Clause
desc:
  cn: Dart 是一种客户端优化的语言，用于在任何平台上开发快速应用程序
  en: Dart is a client-optimized language for developing fast apps on any platform
x:
  source: https://github.com/dart-lang/sdk
rule:
  darwin/brew:
    cmd: brew install dart-sdk
    reference: https://formulae.brew.sh/formula/dart-sdk#default
  (win|wsl2)/choco:
    cmd: x choco install dart-sdk
    reference: https://dart.dev/get-dart#install
  (win|wsl2)/scoop:
    cmd: x scoop install dart
    reference: https://scoop.sh/#/apps?q=dart
binlist:
- dart-sdk

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
