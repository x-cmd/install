lang: TypeScript
homepage: https://www.moonbitlang.com/
desc:
  cn: MoonBit 是一个用于云计算和边缘计算的 WebAssembly 端到端的编程语言工具链
  en: MoonBit is an end-to-end programming language toolchain for cloud and edge computing using WebAssembly
  cs: MoonBit je kompletní sada nástrojů programovacího jazyka pro cloudové a edgeové výpočty s využitím WebAssembly
  de: MoonBit ist eine durchgängige Programiersprache-Toolchain für Cloud- und Edge-Computing mit WebAssembly
  es: MoonBit es una cadena de herramientas completa de lenguaje de programación para computación en la nube y en el borde con WebAssembly
  fr: MoonBit est une chaîne d'outils de langage de programmation de bout en bout pour le cloud et l'inférence en périphérie utilisant WebAssembly
  id: MoonBit adalah toolchain bahasa pemrograman ujung-ke-ujung untuk komputasi cloud dan edge dengan WebAssembly
  it: MoonBit è una toolchain completa per linguaggi di programmazione per il cloud computing e l'edge computing basata su WebAssembly
  ja: MoonBit は WebAssembly を利用したクラウドおよびエッジコンピューティング向けのエンドツーエンドのプログラミング言語ツールチェーンです
  ko: MoonBit는 WebAssembly를 사용하는 클라우드 및 엣지 컴퓨팅용 엔드투엔드 프로그래밍 언어 툴체인입니다
  pl: MoonBit to kompletny łańcuch narzędzi języka programowania do obliczeń chmurowych i brzegowych oparty na WebAssembly
  pt: MoonBit é um conjunto de ferramentas de linguagem de programação de ponta a ponta para computação em nuvem e na borda usando WebAssembly
  ro: MoonBit este un lanț de instrumente pentru limbajul de programare, de la un capăt la altul, pentru calcul în cloud și la margine, bazat pe WebAssembly
  ru: MoonBit — полноценный инструментарий языка программирования для облачных и периферийных вычислений на базе WebAssembly
  th: MoonBit เป็นชุดเครื่องมือภาษาโปรแกรมแบบครบวงจรสำหรับการประมวลผลแบบคลาวด์และเอดจ์ด้วย WebAssembly
  tr: MoonBit, WebAssembly kullanarak bulut ve uç bilişim için uçtan uca programlama dili araç zinciridir
  uk: MoonBit — наскрізний інструментарій мови програмування для хмарних та периферійних обчислень на базі WebAssembly
  vi: MoonBit là bộ công cụ ngôn ngữ lập trình end-to-end cho điện toán đám mây và biên, dựa trên WebAssembly
rule:
  arch/yay:
    cmd: yay -S moonbit-bin
    reference: https://aur.archlinux.org/packages/moonbit-bin
  darwin/curl:
    cmd: curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
    reference: https://www.moonbitlang.com/download/#moonbit-cli-tools
  linux/curl:
    cmd: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
    reference: https://www.moonbitlang.com/download/#moonbit-cli-tools
  win/powershell:
    cmd: x pwsh Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
    reference: https://www.moonbitlang.com/download/#moonbit-cli-tools

x:
  yay: moonbit-bin
binlist:
- moonbit
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 35 MB
        desc:
          cn: 35 MB（估算）
          en: 35 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
