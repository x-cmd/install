lang: C
homepage: https://github.com/jart/cosmopolitan
license: isc
desc:
  cn: 一次构建处处运行的 C 库
  en: build-once run-anywhere c library
x:
  source: https://github.com/jart/cosmopolitan
  eget: https://github.com/jart/cosmopolitan
rule:
  /eget:
    cmd: x eget jart/cosmopolitan
    reference: https://github.com/jart/cosmopolitan
binlist:
- cosmopolitan

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 24 MB
          rating: 2
          desc:
            cn: 约 24 MB（估算）
            en: ~24 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
