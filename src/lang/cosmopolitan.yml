lang: C
homepage: https://github.com/jart/cosmopolitan
license: isc
desc:
  cn: 一次构建处处运行的 C 库
  en: build-once run-anywhere c library
x:
  source: https://github.com/jart/cosmopolitan
  eget: https://github.com/jart/cosmopolitan
rule:
  /eget:
    cmd: x eget jart/cosmopolitan
    reference: https://github.com/jart/cosmopolitan
binlist:
- cosmopolitan

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
