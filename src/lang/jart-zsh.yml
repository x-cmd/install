  ja: Actually Portable Executables に対応したパッチ済み zsh git://git.code.sf.net/p/zsh/code (上流での対応待ち)
  ko: Actually Portable Executables를 지원하도록 패치된 zsh git://git.code.sf.net/p/zsh/code (업스트림 대기 중)
  pl: Zsh z łatką obsługującą Actually Portable Executables git://git.code.sf.net/p/zsh/code (oczekiwanie na upstream)
  pt: Zsh corrigido para oferecer suporte a Actually Portable Executables git://git.code.sf.net/p/zsh/code (pendente no upstream)
  ro: Zsh patchuit pentru a suporta Actually Portable Executables git://git.code.sf.net/p/zsh/code (în așteptare în upstream)
  ru: Zsh с патчем для поддержки Actually Portable Executables git://git.code.sf.net/p/zsh/code (ожидается в upstream)
  th: Zsh ที่แพตช์เพื่อรองรับ Actually Portable Executables git://git.code.sf.net/p/zsh/code (กำลังรอการอัปสตรีม)
  tr: Actually Portable Executables destekleyecek şekilde yamalanmış Zsh git://git.code.sf.net/p/zsh/code (upstream bekleniyor)
