lang: C
homepage: https://github.com/jart/zsh
license: noassertion
desc:
  cn: 支持真正可移植可执行文件的 zsh 补丁版本
  en: Zsh patched to support Actually Portable Executables git://git.code.sf.net/p/zsh/code (upstream pending)
x:
  source: https://github.com/jart/zsh
  eget: https://github.com/jart/zsh
rule:
  /eget:
    cmd: x eget jart/zsh
    reference: https://github.com/jart/zsh
binlist:
- zsh

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
