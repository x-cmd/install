lang: Go
homepage: https://github.com/tinygo-org/tinygo
desc:
  cn: 适用于小型场景的 Go 编译器
  en: Go compiler for small places
x:
  pkg:
    exist: true
  source: https://github.com/tinygo-org/tinygo
  eget: https://github.com/tinygo-org/tinygo
rule:
  /eget:
    cmd: x eget tinygo-org/tinygo
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use tinygo
    reference: https://x-cmd.com/install/
  debian/wget:
    cmd: 'wget https://github.com/tinygo-org/tinygo/releases/download/v0.31.0/tinygo_0.31.0_amd64.deb \

      && sudo dpkg -i tinygo_0.31.0_amd64.deb \

      && export PATH=$PATH:/usr/local/bin

      '
    reference: https://tinygo.org/getting-started/install/linux/#ubuntudebian
  ubuntu/wget:
    cmd: 'wget https://github.com/tinygo-org/tinygo/releases/download/v0.31.0/tinygo_0.31.0_amd64.deb \

      && sudo dpkg -i tinygo_0.31.0_amd64.deb \

      && export PATH=$PATH:/usr/local/bin

      '
    reference: https://tinygo.org/getting-started/install/linux/#ubuntudebian
  raspbian/apt:
    cmd: 'wget https://github.com/tinygo-org/tinygo/releases/download/v0.31.0/tinygo_0.31.0_armhf.deb \

      && sudo dpkg -i tinygo_0.31.0_armhf.deb \

      && export PATH=$PATH:/usr/local/bin

      '
    reference: https://tinygo.org/getting-started/install/linux/#ubuntudebian
  fedora/dnf:
    cmd: sudo dnf install tinygo
    reference: https://tinygo.org/getting-started/install/linux/#fedora-linux
    dsnap: tinygo
  darwin/brew:
    cmd: brew tap tinygo-org/tools && brew install tinygo
    reference: https://tinygo.org/getting-started/install/macos/
  (win|wsl2)/scoop:
    cmd: x scoop install tinygo
    reference: https://tinygo.org/getting-started/install/windows/#quick-install-via-scoop
  arch/yay:
    cmd: yay -S tinygo-bin
    reference: https://aur.archlinux.org/packages/tinygo-bin
binlist:
- tinygo
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
