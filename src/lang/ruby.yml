lang: Ruby
homepage: https://github.com/ruby/ruby
desc:
  cn: Ruby 是一种解释型的面向对象编程语言，常用于 Web 开发。
  en: Ruby is an interpreted object-oriented programming language often used for web development.
  cs: Ruby je interpretovaný objektově orientovaný programovací jazyk, často používaný pro vývoj webových aplikací.
  de: Ruby ist eine interpretierte objektorientierte Programmiersprache, die häufig für die Webentwicklung verwendet wird.
  es: Ruby es un lenguaje de programación interpretado y orientado a objetos, muy usado para el desarrollo web.
  fr: Ruby est un langage de programmation interprété et orienté objet, souvent utilisé pour le développement web.
  id: Ruby adalah bahasa pemrograman berorientasi objek yang ditafsirkan, sering digunakan untuk pengembangan web.
  it: Ruby è un linguaggio di programmazione interpretato e orientato agli oggetti, spesso usato per lo sviluppo web.
  ja: Ruby は、解釈型のオブジェクト指向プログラミング言語で、Web 開発に広く使われています。
  ko: Ruby는 웹 개발에 자주 쓰이는 해석형 객체 지향 프로그래밍 언어입니다.
  pl: Ruby to interpretowany, obiektowy język programowania, często używany do tworzenia aplikacji webowych.
  pt: Ruby é uma linguagem de programação interpretada e orientada a objetos, frequentemente usada para desenvolvimento web.
  ro: Ruby este un limbaj de programare interpretat și orientat pe obiecte, folosit adesea pentru dezvoltarea web.
  ru: Ruby — интерпретируемый объектно-ориентированный язык программирования, широко используемый для веб-разработки.
  th: Ruby เป็นภาษาโปรแกรมแบบตีความที่มีแนวคิดเชิงวัตถุ และมักใช้สำหรับการพัฒนาเว็บ
  tr: Ruby, web geliştirme için sıklıkla kullanılan yorumlanan bir nesne yönelimli programlama dilidir.
  uk: Ruby — інтерпретована об'єктно-орієнтована мова програмування, яка часто використовується для веброзробки.
  vi: Ruby là một ngôn ngữ lập trình hướng đối tượng được diễn giải, thường dùng cho phát triển web.
x:
  source: https://github.com/ruby/ruby
  apt: ruby-full
  dnf: ruby
  brew: ruby
  pacman: ruby
  snap: ruby
  apt-get: ruby-full
  yum: ruby
  emerge: dev-lang/ruby
  scoop: main/ruby
  choco: ruby
  winget: RubyInstallerTeam.Ruby.3.4.1
rule:
  debian/apt:
    cmd: sudo apt-get install ruby-full
    reference: https://www.ruby-lang.org/en/documentation/installation/#apt
    dsnap: ruby-full
  ubuntu/apt:
    cmd: sudo apt-get install ruby-full
    reference: https://www.ruby-lang.org/en/documentation/installation/#apt
    dsnap: ruby-full
  kali/apt:
    cmd: sudo apt-get install ruby-full
    reference: https://www.ruby-lang.org/en/documentation/installation/#apt
    dsnap: ruby-full
  mint/apt:
    cmd: sudo apt-get install ruby-full
    reference: https://www.ruby-lang.org/en/documentation/installation/#apt
  raspbian/apt:
    cmd: sudo apt-get install ruby-full
    reference: https://www.ruby-lang.org/en/documentation/installation/#apt
  centos/yum:
    cmd: sudo yum install ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#yum
  fedora/yum:
    cmd: sudo yum install ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#yum
  rhel/yum:
    cmd: sudo yum install ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#yum
  /snap:
    cmd: sudo snap install ruby --classic
    reference: https://www.ruby-lang.org/en/documentation/installation/#snap
  gentoo/emerge:
    cmd: sudo emerge dev-lang/ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#portage
  arch/pacman:
    cmd: sudo pacman -S ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#pacman
  manjaro/pacman:
    cmd: sudo pacman -S ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#pacman
  darwin/brew:
    cmd: brew install ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#homebrew
  freebsd/pkg:
    cmd: pkg install ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#freebsd
  openbsd/pkg:
    cmd: doas pkg_add ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#openbsd
  openindiana/pkg:
    cmd: pkg install runtime/ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#openindiana
  (win|wsl2)/scoop:
    cmd: x scoop install main/ruby
    reference: https://scoop.sh/#/apps?q=ruby&id=91ca43614f32771193826fcb32068d75507885a0
  (win|wsl2)/choco:
    cmd: x choco install ruby
    reference: https://www.ruby-lang.org/en/documentation/installation/#chocolatey
  (win|wsl2)/winget:
    cmd: x winget install RubyInstallerTeam.Ruby.3.4.1
    reference: https://www.ruby-lang.org/en/documentation/installation/#winget
binlist:
- ruby
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.9 MB
          rating: 1
          desc:
            cn: 约 2.9 MB（估算）
            en: ~2.9 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
