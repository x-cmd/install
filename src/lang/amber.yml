lang: Rust
homepage: https://github.com/amber-lang/Amber
license: LGPL-3.0
desc:
  cn: 可编译为 Bash 的编程语言
  en: Programming language that compiles to Bash
x:
  source: https://github.com/amber-lang/Amber
  eget: https://github.com/amber-lang/Amber
rule:
  /eget:
    cmd: x eget amber-lang/Amber
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S amber-bash-bin
    reference: https://aur.archlinux.org/packages/amber-bash-bin
  /curl:
    cmd: bash -- <(curl -sL "https://github.com/amber-lang/amber/releases/download/0.4.0-alpha/install.sh") --user
    reference: https://docs.amber-lang.com/getting_started/installation
  darwin/brew:
    cmd: brew install amber-lang/amber/amber-lang
    reference: https://docs.amber-lang.com/getting_started/installation
binlist:
- amber

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
