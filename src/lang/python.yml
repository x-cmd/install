lang: Python
homepage: https://github.com/python/cpython
desc:
  cn: Python 是一种结合了解释性、编译性、互动性和面向对象的脚本语言
  en: Python is a Scripting language that combines interpretability, compilation, interactivity and object orientation
  cs: Python je skriptovací jazyk, který spojuje interpretovatelnost, kompilaci, interaktivitu a objektovou orientaci
  de: Python ist eine Skriptsprache, die Interpretierbarkeit, Kompilierung, Interaktivität und Objektorientierung vereint
  es: Python es un lenguaje de scripting que combina interpretabilidad, compilación, interactividad y orientación a objetos
  fr: Python est un langage de script qui combine l'interprétabilité, la compilation, l'interactivité et l'orientation objet
  id: Python adalah bahasa skrip yang menggabungkan interpretabilitas, kompilasi, interaktivitas, dan orientasi objek
  it: Python è un linguaggio di scripting che unisce interpretabilità, compilazione, interattività e orientamento agli oggetti
  ja: Python は、解釈性、コンパイル、インタラクティブ性、オブジェクト指向を統合したスクリプト言語です
  ko: Python은 해석 가능성, 컴파일, 상호작용성, 객체 지향성을 결합한 스크립팅 언어입니다
  pl: Python to język skryptowy łączący interpretowalność, kompilację, interaktywność i orientację obiektową
  pt: Python é uma linguagem de script que combina interpretabilidade, compilação, interatividade e orientação a objetos
  ro: Python este un limbaj de script care combină interpretabilitatea, compilarea, interactivitatea și orientarea pe obiecte
  ru: Python — это скриптовый язык, сочетающий интерпретируемость, компиляцию, интерактивность и объектно-ориентированный подход
  th: Python เป็นภาษาสคริปต์ที่รวมความสามารถในการตีความ การคอมไพล์ การโต้ตอบ และแนวคิดเชิงวัตถุเข้าด้วยกัน
  tr: Python, yorumlanabilirliği, derlemeyi, etkileşimi ve nesne yönelimini bir araya getiren bir betik dilidir
  uk: Python — це скриптова мова, що поєднує інтерпретованість, компіляцію, інтерактивність та об'єктно-орієнтованість
  vi: Python là một ngôn ngữ kịch bản kết hợp khả năng diễn giải, biên dịch, tương tác và hướng đối tượng
x:
  source: https://github.com/python/cpython
  apt: python-minimal
  dnf: python
  brew: python
  pacman: python
  apk: python
  apt-get: python-minimal
  yum: python
  asdf: python
rule:
  /x:
    cmd: x pkg use python
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use python
    reference: https://github.com/danhper/asdf-python
  darwin/brew:
    cmd: brew install python
    reference: https://command-not-found.com/python
  debian/apt:
    cmd: sudo apt-get install python-minimal
    reference: https://command-not-found.com/python
    dsnap: python-minimal
  ubuntu/apt:
    cmd: sudo apt-get install python-minimal
    reference: https://command-not-found.com/python
    dsnap: python-minimal
  alpine/apk:
    cmd: sudo apk add python
    reference: https://command-not-found.com/python
    dsnap: python
  arch/pacman:
    cmd: sudo pacman -S python
    reference: https://command-not-found.com/python
  kali/apt:
    cmd: sudo apt-get install python-minimal
    reference: https://command-not-found.com/python
    dsnap: python-minimal
  centos/yum:
    cmd: sudo yum install python
    reference: https://command-not-found.com/python
  fedora/dnf:
    cmd: sudo dnf install python-minimal
    reference: https://command-not-found.com/python
    dsnap: python-minimal
  raspbian/apt:
    cmd: sudo apt-get install python-minimal
    reference: https://command-not-found.com/python
binlist:
- python
- python3
- pip
- pip3
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
