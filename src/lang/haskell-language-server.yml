lang: Haskell
homepage: https://github.com/haskell/haskell-language-server
license: Apache-2.0
desc:
  cn: 通过语言服务器(LSP)对 haskell-ide 的官方支持
  en: Official haskell ide support via language server (LSP). Successor of ghcide & haskell-ide-engine
  cs: Oficiální podpora haskell IDE prostřednictvím language serveru (LSP). Nástupce ghcide a haskell-ide-engine
  de: Offizielle haskell-IDE-Unterstützung über den Language Server (LSP). Nachfolger von ghcide und haskell-ide-engine
  es: Soporte oficial para IDE de haskell mediante language server (LSP). Sucesor de ghcide y haskell-ide-engine
  fr: Prise en charge officielle de l'IDE haskell via le langage serveur (LSP). Successeur de ghcide et haskell-ide-engine
  id: Dukungan resmi IDE haskell melalui language server (LSP). Penerus dari ghcide dan haskell-ide-engine
  it: Supporto ufficiale per l'IDE haskell tramite language server (LSP). Successore di ghcide e haskell-ide-engine
  ja: language server (LSP) による公式の haskell IDE サポート。ghcide と haskell-ide-engine の後継
  ko: language server(LSP)를 통한 공식 haskell IDE 지원. ghcide 및 haskell-ide-engine의 후속
  pl: Oficjalne wsparcie IDE dla haskell przez language server (LSP). Następca ghcide i haskell-ide-engine
  pt: Suporte oficial ao IDE do haskell via language server (LSP). Sucessor de ghcide e haskell-ide-engine
  ro: Suport oficial pentru IDE haskell prin language server (LSP). Succesorul lui ghcide și haskell-ide-engine
  ru: Официальная поддержка IDE для haskell через language server (LSP). Преемник ghcide и haskell-ide-engine
  th: การรองรับ IDE ของ haskell อย่างเป็นทางการผ่าน language server (LSP) ตัวสืบทอดของ ghcide และ haskell-ide-engine
  tr: Language server (LSP) aracılığıyla resmi haskell IDE desteği. ghcide ve haskell-ide-engine'in halefi
  uk: Офіційна підтримка IDE для haskell через language server (LSP). Наступник ghcide та haskell-ide-engine
  vi: Hỗ trợ IDE haskell chính thức thông qua language server (LSP). Kế thừa của ghcide và haskell-ide-engine
x:
  source: https://github.com/haskell/haskell-language-server
  eget: haskell/haskell-language-server
  brew: haskell-language-server
  yay: haskell-language-server-static
rule:
  /eget:
    cmd: x eget haskell/haskell-language-server
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S haskell-language-server-static
    reference: https://aur.archlinux.org/packages/haskell-language-server-static
  darwin/brew:
    cmd: brew install haskell-language-server
    reference: https://formulae.brew.sh/formula/haskell-language-server#default
binlist:
- haskell-language-server

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 255 MB
          rating: 4
          desc:
            cn: 安装 255 MB
            en: 255 MB install
        download:
          estimate: 255 MB
          desc:
            cn: 约 255 MB 下载 (linux/x64)
            en: ~255 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
