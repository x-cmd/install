lang: Go
homepage: https://github.com/golang/go
license: BSD-3-Clause
desc:
  cn: Go 是一种开源编程语言，它使得构建简单、可靠和高效的软件变得非常容易
  en: Go is an open source programming language that makes it easy to build simple, reliable, and efficient software.
x:
  pkg:
    exist: true
  source: https://github.com/golang/go
rule:
  /x:
    cmd: x pkg use go
    reference: https://x-cmd.com/install/
  debian/apt:
    cmd: sudo apt-get install golang-go
    reference: https://command-not-found.com/golang-go
  ubuntu/apt:
    cmd: sudo apt-get install golang-go
    reference: https://command-not-found.com/golang-go
  kali/apt:
    cmd: sudo apt-get install golang-go
    reference: https://command-not-found.com/golang-go
    dsnap: golang-go
  raspbian/apt:
    cmd: sudo apt-get install golang-go
    reference: https://command-not-found.com/golang-go
binlist:
- go

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
