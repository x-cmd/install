lang: C
homepage: https://github.com/jart/bestline
license: noassertion
desc:
  cn: ANSI X3.64 标准的电传命令会话库
  en: ANSI Standard X3.64 Teletypewriter Command Session Library
x:
  source: https://github.com/jart/bestline
  eget: jart/bestline
rule:
  /eget:
    cmd: x eget jart/bestline
    reference: https://github.com/jart/bestline
binlist:
- bestline

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 165 KB
          rating: 1
          desc:
            cn: 约 165 KB（估算）
            en: ~165 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
