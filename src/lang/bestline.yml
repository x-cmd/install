lang: C
homepage: https://github.com/jart/bestline
license: noassertion
desc:
  cn: ANSI X3.64 标准的电传命令会话库
  en: ANSI Standard X3.64 Teletypewriter Command Session Library
x:
  source: https://github.com/jart/bestline
  eget: https://github.com/jart/bestline
rule:
  /eget:
    cmd: x eget jart/bestline
    reference: https://github.com/jart/bestline
binlist:
- bestline

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
