lang: C
homepage: https://github.com/jart/libc-test
license: noassertion
desc:
  cn: musl libc 的测试套件——验证 C 库实现正确性的回归测试集。
  en: Test suite for musl libc — regression tests verifying C library correctness.
x:
  source: https://github.com/jart/libc-test
  eget: https://github.com/jart/libc-test
rule:
  /eget:
    cmd: x eget jart/libc-test
    reference: https://github.com/jart/libc-test
binlist:
- libc-test

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
