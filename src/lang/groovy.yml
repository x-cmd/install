lang: Groovy/Java
homepage: https://github.com/apache/groovy
license: Apache-2.0
desc:
  cn: Groovy 是用于 JVM 平台的一种强大的多方面编程语言
  en: Groovy is a powerful multi-faceted programming language for the JVM platform
  cs: Groovy je výkonný mnohostranný programovací jazyk pro platformu JVM
  de: Groovy ist eine leistungsfähige, vielseitige Programmiersprache für die JVM-Plattform
  es: Groovy es un potente lenguaje de programación multifacético para la plataforma JVM
  fr: Groovy est un langage de programmation puissant et polyvalent pour la plateforme JVM
  id: Groovy adalah bahasa pemrograman serbaguna yang kuat untuk platform JVM
  it: Groovy è un potente linguaggio di programmazione polifacetico per la piattaforma JVM
  ja: Groovy は JVM プラットフォーム向けの強力な多機能プログラミング言語です
  ko: Groovy는 JVM 플랫폼을 위한 강력한 다목적 프로그래밍 언어입니다
  pl: Groovy to potężny, wielofunkcyjny język programowania dla platformy JVM
  pt: Groovy é uma linguagem de programação poderosa e multifacetada para a plataforma JVM
  ro: Groovy este un limbaj de programare puternic și polifaceted pentru platforma JVM
  ru: Groovy — мощный многофункциональный язык программирования для платформы JVM
  th: Groovy คือภาษาโปรแกรมที่ทรงพลังและมีหลายความสามารถสำหรับแพลตฟอร์ม JVM
  tr: Groovy, JVM platformu için güçlü ve çok yönlü bir programlama dilidir
  uk: Groovy — потужна багатофункціональна мова програмування для платформи JVM
  vi: Groovy là ngôn ngữ lập trình mạnh mẽ và đa năng cho nền tảng JVM
x:
  source: https://github.com/apache/groovy
  apt: groovy
  dnf: groovy
  brew: groovy
  pacman: groovy
  apt-get: groovy
  yum: groovy
  asdf: groovy
rule:
  /x:
    cmd: x pkg use groovy
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use groovy
    reference: https://github.com/weibemoura/asdf-groovy
  darwin/brew:
    cmd: brew install groovy
    reference: https://formulae.brew.sh/formula/groovy#default
  debian/apt:
    cmd: sudo apt-get install groovy
    reference: https://command-not-found.com/groovy
    dsnap: groovy
  ubuntu/apt:
    cmd: sudo apt-get install groovy
    reference: https://command-not-found.com/groovy
    dsnap: groovy
  arch/pacman:
    cmd: sudo pacman -S groovy
    reference: https://command-not-found.com/groovy
  kali/apt:
    cmd: sudo apt-get install groovy
    reference: https://command-not-found.com/groovy
    dsnap: groovy
  centos/yum:
    cmd: sudo yum install groovy
    reference: https://command-not-found.com/groovy
  fedora/dnf:
    cmd: sudo dnf install groovy
    reference: https://command-not-found.com/groovy
    dsnap: groovy
  raspbian/apt:
    cmd: sudo apt-get install groovy
    reference: https://command-not-found.com/groovy
binlist:
- groovy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 约 14 MB（估算）
            en: ~14 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
