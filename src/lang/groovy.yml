lang: Groovy/Java
homepage: https://github.com/apache/groovy
license: Apache-2.0
desc:
  cn: Groovy 是用于 JVM 平台的一种强大的多方面编程语言
  en: Groovy is a powerful multi-faceted programming language for the JVM platform
x:
  pkg:
    exist: true
  source: https://github.com/apache/groovy
rule:
  /x:
    cmd: x pkg use groovy
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use groovy
    reference: https://github.com/weibemoura/asdf-groovy
  darwin/brew:
    cmd: brew install groovy
    reference: https://formulae.brew.sh/formula/groovy#default
  debian/apt:
    cmd: sudo apt-get install groovy
    reference: https://command-not-found.com/groovy
    dsnap: groovy
  ubuntu/apt:
    cmd: sudo apt-get install groovy
    reference: https://command-not-found.com/groovy
    dsnap: groovy
  arch/pacman:
    cmd: sudo pacman -S groovy
    reference: https://command-not-found.com/groovy
  kali/apt:
    cmd: sudo apt-get install groovy
    reference: https://command-not-found.com/groovy
    dsnap: groovy
  centos/yum:
    cmd: sudo yum install groovy
    reference: https://command-not-found.com/groovy
  fedora/dnf:
    cmd: sudo dnf install groovy
    reference: https://command-not-found.com/groovy
    dsnap: groovy
  raspbian/apt:
    cmd: sudo apt-get install groovy
    reference: https://command-not-found.com/groovy
binlist:
- groovy

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
