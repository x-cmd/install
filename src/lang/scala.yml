lang: Scala
homepage: https://github.com/scala/scala
license: Apache-2.0
desc:
  cn: 一种强大的静态类型高级通用编程语言，支持面向对象编程和函数式编程。
  en: a strong statically typed high-level general-purpose programming language that supports both object-oriented programming and functional programming.
x:
  pkg:
    exist: true
  source: https://github.com/scala/scala
  eget: https://github.com/scala/scala
rule:
  /eget:
    cmd: x eget scala/scala
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use scala
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use scala
    reference: https://github.com/asdf-community/asdf-scala
  darwin/brew:
    cmd: brew install scala
    reference: https://formulae.brew.sh/formula/scala#default
  debian/apt:
    cmd: sudo apt-get install scala
    reference: https://command-not-found.com/scala
    dsnap: scala
  ubuntu/apt:
    cmd: sudo apt-get install scala
    reference: https://command-not-found.com/scala
    dsnap: scala
  arch/pacman:
    cmd: sudo pacman -S scala
    reference: https://command-not-found.com/scala
  kali/apt:
    cmd: sudo apt-get install scala
    reference: https://command-not-found.com/scala
    dsnap: scala
  fedora/dnf:
    cmd: sudo dnf install scala
    reference: https://command-not-found.com/scala
    dsnap: scala
  raspbian/apt:
    cmd: sudo apt-get install scala
    reference: https://command-not-found.com/scala
binlist:
- scala

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
