lang: Scala
homepage: https://github.com/scala/scala
license: Apache-2.0
desc:
  cn: 一种强大的静态类型高级通用编程语言，支持面向对象编程和函数式编程。
  en: a strong statically typed high-level general-purpose programming language that supports both object-oriented programming and functional programming.
  cs: silný staticky typovaný vysokoúrovňový univerzální programovací jazyk, který podporuje jak objektově orientované, tak funkcionální programování.
  de: eine starke, statisch typisierte, High-Level-Programmiersprache, die sowohl objektorientierte als auch funktionale Programmierung unterstützt.
  es: un lenguaje de programación de alto nivel, de tipado estático y propósito general, que admite tanto la programación orientada a objetos como la funcional.
  fr: un langage de programmation de haut niveau, à typage statique et polyvalent, qui prend en charge la programmation orientée objet et la programmation fonctionnelle.
  id: bahasa pemrograman umum tingkat tinggi yang kuat dan bertipe statis, mendukung pemrograman berorientasi objek maupun fungsional.
  it: un linguaggio di programmazione di alto livello, fortemente tipizzato e a uso generale, che supporta sia la programmazione orientata agli oggetti sia quella funzionale.
  ja: 静的型を備えた強力な汎用高级プログラミング言語で、オブジェクト指向プログラミングと関数型プログラミングの両方をサポートします。
  ko: 객체 지향 프로그래밍과 함수형 프로그래밍을 모두 지원하는 강력한 정적 타입 범용 고급 프로그래밍 언어입니다.
  pl: potężny, statycznie typowany, wysokopoziomowy język programowania ogólnego przeznaczenia, obsługujący zarówno programowanie obiektowe, jak i funkcyjne.
  pt: uma linguagem de programação de alto nível, fortemente tipada estaticamente e de uso geral, que oferece suporte tanto à programação orientada a objetos quanto à funcional.
  ro: un limbaj de programare de nivel înalt, cu tipare statică, puternic și de uz generală, care acceptă atât programarea orientată pe obiecte, cât și cea funcțională.
  ru: мощный статически типизированный высокоуровневый универсальный язык программирования, поддерживающий как объектно-ориентированное, так и функциональное программирование.
  th: ภาษาโปรแกรมระดับสูงแบบทั่วไปที่มีประสิทธิภาพและกำหนดชนิดแบบคงที่ รองรับทั้งการเขียนโปรแกรมเชิงวัตถุและเชิงฟังก์ชัน
  tr: hem nesne yönelimli hem de fonksiyonel programlamayı destekleyen güçlü, statik tipli, yüksek seviyeli genel amaçlı bir programlama dili.
  uk: сильна статично типізована високорівнева універсальна мова програмування, що підтримує як об'єктно-орієнтоване, так і функціональне програмування.
  vi: ngôn ngữ lập trình bậc cao, mạnh mẽ, có kiểu tĩnh và đa năng, hỗ trợ cả lập trình hướng đối tượng lẫn lập trình hàm
x:
  source: https://github.com/scala/scala
  eget: scala/scala
  apt: scala
  dnf: scala
  brew: scala
  pacman: scala
  apt-get: scala
  asdf: scala
rule:
  /eget:
    cmd: x eget scala/scala
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use scala
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use scala
    reference: https://github.com/asdf-community/asdf-scala
  darwin/brew:
    cmd: brew install scala
    reference: https://formulae.brew.sh/formula/scala#default
  debian/apt:
    cmd: sudo apt-get install scala
    reference: https://command-not-found.com/scala
    dsnap: scala
  ubuntu/apt:
    cmd: sudo apt-get install scala
    reference: https://command-not-found.com/scala
    dsnap: scala
  arch/pacman:
    cmd: sudo pacman -S scala
    reference: https://command-not-found.com/scala
  kali/apt:
    cmd: sudo apt-get install scala
    reference: https://command-not-found.com/scala
    dsnap: scala
  fedora/dnf:
    cmd: sudo dnf install scala
    reference: https://command-not-found.com/scala
    dsnap: scala
  raspbian/apt:
    cmd: sudo apt-get install scala
    reference: https://command-not-found.com/scala
binlist:
- scala

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 131 MB
          rating: 3
          desc:
            cn: 安装 131 MB
            en: 131 MB install
        download:
          estimate: 131 MB
          desc:
            cn: 约 131 MB 下载 (msi)
            en: ~131 MB download (msi)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
