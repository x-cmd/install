lang: erlang
homepage: https://github.com/erlang/otp
license: Apache-2.0
desc:
  cn: Erlang 是一种编程语言，用于构建对高可用性有要求的大规模可扩展软实时系统
  en: Erlang is a programming language used to build massively scalable soft real-time systems with requirements on high availability
x:
  source: https://github.com/erlang/otp
  eget: https://github.com/erlang/otp
rule:
  /eget:
    cmd: x eget erlang/otp
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install erlang
    reference: https://formulae.brew.sh/formula/erlang#default
  /apt:
    cmd: sudo apt-get install erlang
    reference: https://github.com/erlang/otp?tab=readme-ov-file#binary-distributions
  (win|wsl2)/scoop:
    cmd: x scoop install erlang
    reference: https://scoop.sh/#/apps?q=erlang
binlist:
- erlang

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
