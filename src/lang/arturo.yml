lang: Nim
homepage: https://github.com/arturo-lang/arturo
license: MIT
desc:
  cn: arturo 编程语言
  en: arturo programming language
x:
  pkg:
    exist: true
  source: https://github.com/arturo-lang/arturo
  eget: https://github.com/arturo-lang/arturo
rule:
  /x:
    cmd: x pkg use arturo
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget arturo-lang/arturo
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S arturo
    reference: https://aur.archlinux.org/packages/arturo
  /curl:
    cmd: curl -sSL https://get.arturo-lang.io | sh
    reference: https://github.com/arturo-lang/arturo?tab=readme-ov-file#the-alternative-way
  darwin/brew:
    cmd: brew install arturo
    reference: https://github.com/arturo-lang/arturo?tab=readme-ov-file#homebrew
binlist:
- arturo

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
