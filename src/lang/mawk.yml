lang: C
homepage: https://github.com/ThomasDickey/original-mawk
desc:
  en: mawk is an interpreter for the AWK Programming Language.
  cn: Mawk 是 AWK 编程语言的解释器。
x:
  pkg:
    exist: true
  source: https://github.com/ThomasDickey/original-mawk
rule:
  /x:
    cmd: x pkg use mawk
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install mawk
    reference: https://formulae.brew.sh/formula/mawk
  debian/apt:
    cmd: sudo apt-get install mawk
    reference: https://command-not-found.com/mawk
    dsnap: mawk
  ubuntu/apt:
    cmd: sudo apt-get install mawk
    reference: https://command-not-found.com/mawk
    dsnap: mawk
  kali/apt:
    cmd: sudo apt-get install mawk
    reference: https://command-not-found.com/mawk
    dsnap: mawk
  fedora/dnf:
    cmd: sudo dnf install mawk
    reference: https://command-not-found.com/mawk
    dsnap: mawk
  arch/yay:
    cmd: yay -S mawk
    reference: https://aur.archlinux.org/packages/mawk
  raspbian/apt:
    cmd: sudo apt-get install mawk
    reference: https://command-not-found.com/mawk
binlist:
- mawk
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
