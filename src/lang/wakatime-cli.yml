lang: Go
homepage: https://github.com/wakatime/wakatime-cli
license: BSD-3-Clause
desc:
  cn: WakaTime 致力于使每个程序员的时间跟踪完全自动化
  en: WakaTime is committed to making time tracking fully automatic for every programmer
x:
  source: https://github.com/wakatime/wakatime-cli
  eget: https://github.com/wakatime/wakatime-cli
rule:
  /eget:
    cmd: x eget wakatime/wakatime-cli
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S wakatime
    reference: https://aur.archlinux.org/packages/wakatime
  darwin/brew:
    cmd: brew install wakatime-cli
    reference: https://formulae.brew.sh/formula/wakatime-cli#default
binlist:
- wakatime-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
