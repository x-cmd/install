lang: Go
homepage: https://github.com/jart/gosip
license: apache-2.0
desc:
  cn: 面向公共交换电话网络(PSTN)的工具
  en: Public Switched Telecommunications Network Unleashed
x:
  source: https://github.com/jart/gosip
  eget: https://github.com/jart/gosip
rule:
  /eget:
    cmd: x eget jart/gosip
    reference: https://github.com/jart/gosip
binlist:
- gosip
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false   # SIP signaling
    filesystem:
      read:
        desc:
          cn: 读取 SIP 配置文件
          en: Reads SIP config files
        sensitive:
          - "$HOME/.gosip/config"
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: SIP 信令时短暂占用
          en: Brief spike on SIP signaling
