lang: C
homepage: https://www.wolfram.com/language/
desc:
  cn: Wolfram 语言是一种高度发展的基于知识的语言，它集合了大量编程模式，并且使用独特的符号编程理念，以对基本编程概念增加灵活度.
  en: Wolfram Language is a symbolic language, deliberately designed with the breadth and unity needed to develop powerful programs quickly.
rule:
  darwin/brew:
    cmd: brew cask install wolfram-engine
    reference: https://www.wolfram.com/engine/
  (win|wsl2)/winget:
    cmd: x winget install WolframEngine
    reference: https://www.wolfram.com/engine/
binlist:
- wolfram
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
