lang: crystal
homepage: https://github.com/crystal-lang/crystal
license: Apache-2.0
desc:
  cn: Crystal 是人类和计算机的语言
  en: Crystal is a language for humans and computers
x:
  source: https://github.com/crystal-lang/crystal
  eget: https://github.com/crystal-lang/crystal
rule:
  /eget:
    cmd: x eget crystal-lang/crystal
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use crystal
    reference: https://github.com/asdf-community/asdf-crystal
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add crystal-preview https://github.com/neatorobito/scoop-crystal \

      && x scoop install vs_2022_cpp_build_tools \

      && x scoop install crystal

      '
    reference: https://crystal-lang.org/install/on_windows/
  darwin/brew:
    cmd: brew install crystal
    reference: https://crystal-lang.org/install/on_mac_os/
binlist:
- crystal
