lang: Go
homepage: https://github.com/goplus/gop
license: Apache-2.0
desc:
  cn: Go+ 编程语言旨在工程、STEM 教育和数据科学领域应用。
  en: The Go+ programming language is designed for engineering, STEM education, and data science.
  cs: Programovací jazyk Go+ je navržen pro strojířství, vzdělávání v STEM a datovou vědu.
  de: Die Programmiersprache Go+ ist für Ingenieurwesen, STEM-Bildung und Datenwissenschaft konzipiert.
  es: El lenguaje de programación Go+ está diseñado para ingeniería, educación STEM y ciencia de datos.
  fr: Le langage de programmation Go+ est conçu pour l'ingénierie, l'éducation STEM et la science des données.
  id: Bahasa pemrograman Go+ dirancang untuk rekayasa, pendidikan STEM, dan ilmu data.
  it: Il linguaggio di programmazione Go+ è progettato per l'ingegneria, l'istruzione STEM e la scienza dei dati.
  ja: Go+ プログラミング言語は、エンジニアリング、STEM 教育、データサイエンスのために設計されています。
  ko: Go+ 프로그래밍 언어는 엔지니어링, STEM 교육 및 데이터 과학을 위해 설계되었습니다.
  pl: Język programowania Go+ jest zaprojektowany z myślą o inżynierii, edukacji STEM i nauce o danych.
  pt: A linguagem de programação Go+ foi projetada para engenharia, educação STEM e ciência de dados.
  ro: Limbajul de programare Go+ este conceput pentru inginerie, educație STEM și știința datelor.
  ru: Язык программирования Go+ создан для инженерии, STEM-образования и науки о данных.
  th: ภาษาโปรแกรม Go+ ออกแบบมาเพื่อวิศวกรรม การศึกษา STEM และวิทยาศาสตร์ข้อมูล
  tr: Go+ programlama dili mühendislik, STEM eğitimi ve veri bilimi için tasarlanmıştır.
  uk: Мова програмування Go+ створена для інженерії, STEM-освіти та науки про дані.
  vi: Ngôn ngữ lập trình Go+ được thiết kế cho kỹ thuật, giáo dục STEM và khoa học dữ liệu
x:
  source: https://github.com/goplus/gop
  apt: gop
  dnf: gop
  brew: goplus
  yum: gop
  winget: goplus.gop
  yay: gop
rule:
  /x:
    cmd: x pkg use gop
    reference: https://x-cmd.com/install/
  (win|wsl2)/winget:
    cmd: x winget install goplus.gop
    reference: https://github.com/goplus/gop/?tab=readme-ov-file#how-to-install
  (debian|ubuntu)/apt:
    cmd: 'sudo bash -c '' echo "deb [trusted=yes] https://pkgs.goplus.org/apt/ /" > /etc/apt/sources.list.d/goplus.list''

      sudo apt update

      sudo apt install gop

      '
    reference: https://github.com/goplus/gop/?tab=readme-ov-file#how-to-install
  fedora/yum:
    cmd: 'sudo bash -c ''echo -e "[goplus]\nname=Go+ Repo\nbaseurl=https://pkgs.goplus.org/yum/\nenabled=1\ngpgcheck=0" > /etc/yum.repos.d/goplus.repo''

      sudo yum install gop

      '
    reference: https://github.com/goplus/gop/?tab=readme-ov-file#how-to-install
  darwin/brew:
    cmd: brew install goplus
    reference: https://github.com/goplus/gop/?tab=readme-ov-file#how-to-install
  arch/yay:
    cmd: yay -S gop
    reference: https://aur.archlinux.org/packages/gop
binlist:
- gop

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 安装 20 MB
            en: 20 MB install
        download:
          estimate: 20 MB
          desc:
            cn: 约 20 MB 下载 (linux/x64)
            en: ~20 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
