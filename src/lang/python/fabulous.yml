lang: Python
homepage: https://github.com/jart/fabulous
license: apache-2.0
desc:
  cn: 让 Python 程序在终端打印彩色文字、风格化 ASCII 艺术与位图，并自带一种「瞬时日志」让 verbose 输出不再淹没 WARNING。
  en: Print colored text, stylized ASCII art and bitmap images from Python — plus a transient-logging handler that keeps verbose output from drowning out warnings.
x:
  source: https://github.com/jart/fabulous
rule:
  /pip:
    cmd: pip install fabulous
    reference: https://github.com/jart/fabulous#installation
binlist:
- fabulous

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
