lang: Python
homepage: https://github.com/jart/fabulous
license: apache-2.0
desc:
  cn: 让 Python 程序在终端打印彩色文字、风格化 ASCII 艺术与位图，并自带一种「瞬时日志」让 verbose 输出不再淹没 WARNING。
  en: Print colored text, stylized ASCII art and bitmap images from Python — plus a transient-logging handler that keeps verbose output from drowning out warnings.
x:
  source: https://github.com/jart/fabulous
rule:
  /pip:
    cmd: pip install fabulous
    reference: https://github.com/jart/fabulous#installation
binlist:
- fabulous

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 KB
          rating: 1
          desc:
            cn: 约 10 KB（估算）
            en: ~10 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
