lang: C
homepage: https://github.com/python/cpython
desc:
  cn: python3 的 venv 模块（默认 python3 版本）
  en: venv module for python3 (default python3 version)
x:
  source: https://github.com/python/cpython
  apt: python3-venv
rule:
  debian/apt:
    cmd: x apt install python3-venv
    reference: https://packages.ubuntu.com/
    dsnap: python3-venv
  ubuntu/apt:
    cmd: x apt install python3-venv
    reference: https://packages.ubuntu.com/
    dsnap: python3-venv
binlist:
- python3-venv
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
