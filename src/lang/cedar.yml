lang: Rust
homepage: https://github.com/cedar-policy/cedar
license: Apache-2.0
desc:
  cn: Cedar 是一种将权限定义为策略的语言，它描述了谁应该有权访问什么。它还是评估这些策略的规范
  en: Cedar is a language for defining permissions as policies, which describe who should have access to what. It is also a specification for evaluating those policies
x:
  source: https://github.com/cedar-policy/cedar
rule:
  /cargo:
    cmd: cargo add cedar-policy
    reference: https://github.com/cedar-policy/cedar/?tab=readme-ov-file#using-cedar
    dsnap: cedar-policy
binlist:
- cedar

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7.6 MB
          rating: 1
          desc:
            cn: 约 7.6 MB（估算）
            en: ~7.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
