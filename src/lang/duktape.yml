lang: JavaScript
homepage: https://duktape.org/
desc:
  cn: Dukape 是一个可嵌入的 Javascript 引擎，侧重于可移植性和紧凑的内存占用
  en: Duktape is an embeddable Javascript engine, with a focus on portability and compact footprint
rule:
  darwin/brew:
    cmd: brew install duktape
    reference: https://formulae.brew.sh/formula/duktape#default
binlist:
- duktape
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
