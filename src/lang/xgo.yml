lang: Go
homepage: https://github.com/goplus/xgo
license: Apache-2.0
desc:
  cn: XGo 是第一个将软件工程整合为统一整体的 AI 原生编程语言
  en: XGo is the first AI-native programming language that integrates software engineering into a unified whole.
  cs: XGo je první AI-nativní programovací jazyk, který integruje softwarové inženýrství do jednotného celku.
  de: XGo ist die erste KI-native Programmiersprache, die Software-Engineering in ein einheitliches Ganzes integriert.
  es: XGo es el primer lenguaje de programación nativo de IA que integra la ingeniería de software en un todo unificado.
  fr: XGo est le premier langage de programmation natif IA qui intègre le génie logiciel en un tout unifié.
  id: XGo adalah bahasa pemrograman AI-native pertama yang mengintegrasikan rekayasa perangkat lunak menjadi satu kesatuan.
  it: XGo è il primo linguaggio di programmazione nativo dell'AI che integra l'ingegneria del software in un unico insieme.
  ja: XGo は、ソフトウェア工学を一つの統一体に統合した最初の AI ネイティブなプログラミング言語です。
  ko: XGo는 소프트웨어 엔지니어링을 하나의 통일된 전체로 통합한 최초의 AI 네이티브 프로그래밍 언어입니다.
  pl: XGo to pierwszy natywny dla AI język programowania, który integruje inżynierię oprogramowania w jedną spójną całość.
  pt: XGo é a primeira linguagem de programação nativa de IA que integra a engenharia de software em um todo unificado.
  ro: XGo este primul limbaj de programare nativ AI care integrează ingineria software într-un tot unitar.
  ru: XGo — первый AI-нативный язык программирования, объединяющий программную инженерию в единое целое.
  th: XGo เป็นภาษาโปรแกรม AI-native ภาษาแรกที่รวมวิศวกรรมซอฟต์แวร์เข้าด้วยกันเป็นหนึ่งเดียว
  tr: XGo, yazılım mühendisliğini tek bir bütün haline getiren ilk yapay zekâ odaklı programlama dilidir.
  uk: XGo — перша мова програмування з нативною підтримкою ШІ, що інтегрує інженерію програмного забезпечення в єдине ціле.
  vi: XGo là ngôn ngữ lập trình lấy AI làm gốc đầu tiên, hợp nhất kỹ thuật phần mềm thành một tổng thể thống nhất.
x:
  source: https://github.com/goplus/xgo
  eget: goplus/xgo
  apt: gop
  dnf: gop
  brew: goplus
  yum: gop
  winget: goplus.gop
  yay: xgo
rule:
  /eget:
    cmd: x eget goplus/xgo
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use xgo
    reference: https://x-cmd.com/install/
  (win|wsl2)/winget:
    cmd: x winget install goplus.gop
    reference: https://github.com/goplus/xgo/?tab=readme-ov-file#how-to-install
  (debian|ubuntu)/apt:
    cmd: 'sudo bash -c '' echo "deb [trusted=yes] https://pkgs.goplus.org/apt/ /" > /etc/apt/sources.list.d/goplus.list''

      sudo apt update

      sudo apt install gop

      '
    reference: https://github.com/goplus/xgo/?tab=readme-ov-file#how-to-install
  fedora/yum:
    cmd: 'sudo bash -c ''echo -e "[goplus]\nname=Go+ Repo\nbaseurl=https://pkgs.goplus.org/yum/\nenabled=1\ngpgcheck=0" > /etc/yum.repos.d/goplus.repo''

      sudo yum install gop

      '
    reference: https://github.com/goplus/xgo/?tab=readme-ov-file#how-to-install
  darwin/brew:
    cmd: brew install goplus
    reference: https://github.com/goplus/xgo/?tab=readme-ov-file#how-to-install
  arch/yay:
    cmd: yay -S xgo
    reference: https://aur.archlinux.org/packages/xgo
binlist:
- xgo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 4.3 MB
          rating: 1
          desc:
            cn: 约 4.3 MB（估算）
            en: ~4.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
