lang: C++
homepage: https://github.com/jart/tensorflow-makefile
license: noassertion
desc:
  cn: 用纯 Makefile 构建 TensorFlow 1.10 静态库（无需 Bazel），适合嵌入与交叉编译。
  en: Build TensorFlow 1.10 as a static library using plain Makefile (no Bazel), for embedding and cross-compilation.
x:
  source: https://github.com/jart/tensorflow-makefile
  eget: https://github.com/jart/tensorflow-makefile
rule:
  /eget:
    cmd: x eget jart/tensorflow-makefile
    reference: https://github.com/jart/tensorflow-makefile
binlist:
- tensorflow-makefile

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 44 MB
          rating: 2
          desc:
            cn: 约 44 MB（估算）
            en: ~44 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
