lang: C++
homepage: https://github.com/jart/json.cpp
license: noassertion
desc:
  cn: 面向经典 C++ 的 JSON 库
  en: JSON for Classic C++
x:
  source: https://github.com/jart/json.cpp
  eget: jart/json.cpp
rule:
  /eget:
    cmd: x eget jart/json.cpp
    reference: https://github.com/jart/json.cpp
binlist:
- json.cpp

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.7 MB
          rating: 1
          desc:
            cn: 约 5.7 MB（估算）
            en: ~5.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
