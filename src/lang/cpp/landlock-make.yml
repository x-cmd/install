lang: 'C++'
homepage: 'https://github.com/jart/landlock-make'
license: noassertion
desc:
  cn: 更轻松地为 GNU Make 提供沙箱支持
  en: 'Sandboxing for GNU Make has never been easier'
  cs: Sandboxování pro GNU Make nikdy nebylo jednodušší
  de: Sandboxing für GNU Make war noch nie einfacher
  es: El sandboxing para GNU Make nunca ha sido tan fácil
  fr: Le sandboxing pour GNU Make n'a jamais été aussi simple
  id: Sandboxing untuk GNU Make belum pernah semudah ini
  it: Il sandboxing per GNU Make non è mai stato così facile
  ja: GNU Make のサンドボックス化がかつてないほど簡単に
  ko: GNU Make의 샌드박싱이 이렇게 쉬운 적은 없습니다
  pl: Piaskowanie dla GNU Make nigdy nie było łatwiejsze
  pt: O sandboxing para GNU Make nunca foi tão fácil
  ro: Sandboxing-ul pentru GNU Make nu a fost niciodată mai ușor
  ru: Песочница для GNU Make ещё никогда не была такой простой
  th: การแซนด์บ็อกซ์สำหรับ GNU Make ไม่เคยง่ายแบบนี้มาก่อน
  tr: GNU Make için sandbox hiç bu kadar kolay olmamıştı
  uk: Песочниця для GNU Make ніколи не була такою простою
  vi: Sandbox cho GNU Make chưa bao giờ dễ dàng như vậy
x:
  source: https://github.com/jart/landlock-make
  eget: jart/landlock-make
rule:
  /eget:
    cmd: x eget jart/landlock-make
    reference: https://github.com/jart/landlock-make
binlist:
  - 'landlock-make'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 MB
          rating: 2
          desc:
            cn: 约 17 MB（估算）
            en: ~17 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
