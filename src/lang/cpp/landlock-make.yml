lang: 'C++'
homepage: 'https://github.com/jart/landlock-make'
license: noassertion
desc:
  cn: 更轻松地为 GNU Make 提供沙箱支持
  en: 'Sandboxing for GNU Make has never been easier'
x:
  source: https://github.com/jart/landlock-make
  eget: https://github.com/jart/landlock-make
rule:
  /eget:
    cmd: x eget jart/landlock-make
    reference: https://github.com/jart/landlock-make
binlist:
  - 'landlock-make'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 MB
          rating: 2
          desc:
            cn: 约 17 MB（估算）
            en: ~17 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
