lang: 'C++'
homepage: 'https://github.com/jart/landlock-make'
license: noassertion
desc:
  cn: 更轻松地为 GNU Make 提供沙箱支持
  en: 'Sandboxing for GNU Make has never been easier'
x:
  source: https://github.com/jart/landlock-make
  eget: https://github.com/jart/landlock-make
rule:
  /eget:
    cmd: x eget jart/landlock-make
    reference: https://github.com/jart/landlock-make
binlist:
  - 'landlock-make'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
