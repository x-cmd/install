lang: 'C++'
homepage: 'https://github.com/jart/chessy'
license: noassertion
desc:
  cn: 趣味性玩具国际象棋引擎,仅供娱乐
  en: 'A happy toy chess engine, just for fun :) If you want a proper chess engine, check out Stockfish.'
x:
  source: https://github.com/jart/chessy
  eget: https://github.com/jart/chessy
rule:
  /eget:
    cmd: x eget jart/chessy
    reference: https://github.com/jart/chessy
binlist:
  - 'chessy'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4.1 MB
          rating: 1
          desc:
            cn: 约 4.1 MB（估算）
            en: ~4.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
