lang: C++
homepage: https://github.com/jart/jtckdint
license: isc
desc:
  cn: C23 带检查的算术运算
  en: C23 Checked Arithmetic
x:
  source: https://github.com/jart/jtckdint
  eget: https://github.com/jart/jtckdint
rule:
  /eget:
    cmd: x eget jart/jtckdint
    reference: https://github.com/jart/jtckdint
binlist:
- jtckdint

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
