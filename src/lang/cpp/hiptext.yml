lang: C++
homepage: https://github.com/jart/hiptext
license: apache-2.0
desc:
  cn: 将图像转为文本,效果优于 caca/aalib
  en: Turn images into text better than caca/aalib
x:
  source: https://github.com/jart/hiptext
  eget: https://github.com/jart/hiptext
rule:
  /eget:
    cmd: x eget jart/hiptext
    reference: https://github.com/jart/hiptext
binlist:
- hiptext

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
