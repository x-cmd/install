  ubuntu/apt:
    cmd: sudo apt-get install java
    reference: https://command-not-found.com/java
    dsnap: java
  arch/pacman:
    cmd: sudo pacman -S java
    reference: https://command-not-found.com/java
  kali/apt:
    cmd: sudo apt-get install java
    reference: https://command-not-found.com/java
    dsnap: java
  centos/yum:
    cmd: sudo yum install java
    reference: https://command-not-found.com/java
  fedora/dnf:
    cmd: sudo dnf install java
    reference: https://command-not-found.com/java
