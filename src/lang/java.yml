lang: Java
homepage: https://github.com/openjdk/jdk
license: GPL-2.0
desc:
  cn: Java 是一种编程语言和计算平台，由 Sun Microsystems 于 1995 年首次发布
  en: Java is a programming language and computing platform first released by Sun Microsystems in 1995
x:
  pkg:
    exist: true
  source: https://github.com/openjdk/jdk
rule:
  /x:
    cmd: x pkg use java
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use java
    reference: https://github.com/halcyon/asdf-java
  debian/apt:
    cmd: sudo apt-get install java
    reference: https://command-not-found.com/java
    dsnap: java
  ubuntu/apt:
    cmd: sudo apt-get install java
    reference: https://command-not-found.com/java
    dsnap: java
  arch/pacman:
    cmd: sudo pacman -S java
    reference: https://command-not-found.com/java
  kali/apt:
    cmd: sudo apt-get install java
    reference: https://command-not-found.com/java
    dsnap: java
  centos/yum:
    cmd: sudo yum install java
    reference: https://command-not-found.com/java
  fedora/dnf:
    cmd: sudo dnf install java
    reference: https://command-not-found.com/java
    dsnap: java
  raspbian/apt:
    cmd: sudo apt-get install java
    reference: https://command-not-found.com/java
binlist:
- java

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 3
          desc:
            cn: 约 50 MB（估算）
            en: ~50 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB（估算）
          en: 80 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
