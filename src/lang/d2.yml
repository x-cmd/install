lang: Go
homepage: https://github.com/terrastruct/d2
license: MPL-2.0
desc:
  cn: D2 是一个将文本转换为图表的图表脚本语言，它代表了声明性图表
  en: D2 is a diagram scripting language that turns text to diagrams. It stands for Declarative Diagramming
x:
  source: https://github.com/terrastruct/d2
  eget: https://github.com/terrastruct/d2
  brew: d2
  scoop: d2
  go: oss.terrastruct.com/d2
rule:
  /eget:
    cmd: x eget terrastruct/d2
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use d2
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -fsSL https://d2lang.com/install.sh | sh -s --
    reference: https://d2lang.com/tour/install#install-script
  darwin/brew:
    cmd: brew install d2
    reference: https://formulae.brew.sh/formula/d2#default
  /go:
    cmd: go install oss.terrastruct.com/d2
    reference: https://d2lang.com/tour/install#install-from-source
    dsnap: oss.terrastruct.com/d2
  (win|wsl2)/scoop:
    cmd: x scoop install d2
    reference: https://scoop.sh/#/apps?q=d2
binlist:
- d2

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 MB
          rating: 2
          desc:
            cn: 约 23 MB（估算）
            en: ~23 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
