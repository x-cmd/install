lang: dart
homepage: https://github.com/sass/dart-sass
license: MIT
desc:
  en: Compile Sass to CSS
  cn: 将 Sass 编译为 CSS
x:
  source: https://github.com/sass/dart-sass
  eget: https://github.com/sass/dart-sass
rule:
  /eget:
    cmd: x eget sass/dart-sass
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install -g sass
    reference: https://www.npmjs.com/package/sass
    dsnap: sass
  darwin/brew:
    cmd: brew install node-sass
    reference: https://formulae.brew.sh/formula/node-sass
  (win|wsl2)/scoop:
    cmd: x scoop install sass
    reference: https://scoop.sh/#/apps?q=sass
  (win|wsl2)/choco:
    cmd: x choco install sass
    reference: https://community.chocolatey.org/packages/sass
binlist:
- dart-sass

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.9 MB
          rating: 1
          desc:
            cn: 约 1.9 MB（估算）
            en: ~1.9 MB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
