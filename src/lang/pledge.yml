lang: C
homepage: https://github.com/jart/pledge
license: isc
desc:
  cn: 通过 SECCOMP BPF 和 Landlock LSM 将 OpenBSD API 移植到 Linux 用户态
  en: OpenBSD APIs ported to Linux userspace using SECCOMP BPF and Landlock LSM
x:
  source: https://github.com/jart/pledge
  eget: https://github.com/jart/pledge
rule:
  /eget:
    cmd: x eget jart/pledge
    reference: https://github.com/jart/pledge
binlist:
- pledge

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 204 KB
          rating: 1
          desc:
            cn: 约 204 KB（估算）
            en: ~204 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
