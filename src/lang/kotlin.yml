lang: Kotlin
homepage: https://github.com/JetBrains/kotlin
desc:
  cn: Kotlin 是一种现代但已经成熟的编程语言，旨在让开发人员更快乐
  en: Kotlin is a modern but already mature programming language designed to make developers happier
x:
  pkg:
    exist: true
  source: https://github.com/JetBrains/kotlin
  eget: https://github.com/JetBrains/kotlin
rule:
  /eget:
    cmd: x eget JetBrains/kotlin
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use kotlin
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use kotlin
    reference: https://github.com/asdf-community/asdf-kotlin
  darwin/brew:
    cmd: brew install kotlin
    reference: https://formulae.brew.sh/formula/kotlin#default
  arch/pacman:
    cmd: sudo pacman -S kotlin
    reference: https://command-not-found.com/kotlin
binlist:
- kotlin
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
