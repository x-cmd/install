lang: Kotlin
homepage: https://github.com/JetBrains/kotlin
desc:
  cn: Kotlin 是一种现代但已经成熟的编程语言，旨在让开发人员更快乐
  en: Kotlin is a modern but already mature programming language designed to make developers happier
x:
  pkg:
    exist: true
  source: https://github.com/JetBrains/kotlin
  eget: https://github.com/JetBrains/kotlin
rule:
  /eget:
    cmd: x eget JetBrains/kotlin
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use kotlin
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use kotlin
    reference: https://github.com/asdf-community/asdf-kotlin
  darwin/brew:
    cmd: brew install kotlin
    reference: https://formulae.brew.sh/formula/kotlin#default
  arch/pacman:
    cmd: sudo pacman -S kotlin
    reference: https://command-not-found.com/kotlin
binlist:
- kotlin
license: NOASSERTION

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 194 MB
          rating: 3
          desc:
            cn: 安装 194 MB
            en: 194 MB install
        download:
          estimate: 104 MB
          desc:
            cn: 约 104 MB 下载 (linux/x64)
            en: ~104 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 19 MB
        desc:
          cn: 19 MB
          en: 19 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
