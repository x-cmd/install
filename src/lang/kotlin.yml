lang: Kotlin
homepage: https://github.com/JetBrains/kotlin
desc:
  cn: Kotlin 是一种现代但已经成熟的编程语言，旨在让开发人员更快乐
  en: Kotlin is a modern but already mature programming language designed to make developers happier
  cs: Kotlin je moderní, ale již zralý programovací jazyk navržený, aby vývojáři byli šťastnější
  de: Kotlin ist eine moderne, bereits ausgereifte Programmiersprache, die entwickelt wurde, um Entwickler glücklicher zu machen
  es: Kotlin es un lenguaje de programación moderno pero ya maduro, diseñado para hacer más felices a los desarrolladores
  fr: Kotlin est un langage de programmation moderne mais déjà mature, conçu pour rendre les développeurs plus heureux
  id: Kotlin adalah bahasa pemrograman modern yang sudah matang, dirancang untuk membuat pengembang lebih bahagia
  it: Kotlin è un linguaggio di programmazione moderno ma già maturo, progettato per rendere più felici gli sviluppatori
  ja: Kotlin は、開発者をより幸せにするために設計された、現代的で既に成熟したプログラミング言語です
  ko: Kotlin은 개발자가 더 행복해지도록 설계된 현대적이면서 이미 성숙한 프로그래밍 언어입니다
  pl: Kotlin to nowoczesny, ale już dojrzały język programowania, zaprojektowany, by programiści byli szczęśliwsi
  pt: Kotlin é uma linguagem de programação moderna, mas já madura, projetada para deixar os desenvolvedores mais felizes
  ro: Kotlin este un limbaj de programare modern, dar deja matur, conceput pentru a-i face pe dezvoltatori mai fericiți
  ru: Kotlin — современный, но уже зрелый язык программирования, созданный, чтобы разработчикам стало проще работать
  th: Kotlin เป็นภาษาโปรแกรมสมัยใหม่แต่มีความเป็นน้ำหนักแล้ว ออกแบบมาเพื่อให้นักพัฒนามีความสุขมากขึ้น
  tr: Kotlin, geliştiricileri daha mutlu etmek için tasarlanmış modern ama olgunlaşmış bir programlama dilidir
  uk: Kotlin — сучасна, але вже зріла мова програмування, створена, щоб розробникам було приємніше працювати
  vi: Kotlin là ngôn ngữ lập trình hiện đại nhưng đã trưởng thành, được thiết kế để giúp lập trình viên hạnh phúc hơn
x:
  source: https://github.com/JetBrains/kotlin
  eget: JetBrains/kotlin
  brew: kotlin
  pacman: kotlin
  asdf: kotlin
rule:
  /eget:
    cmd: x eget JetBrains/kotlin
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use kotlin
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use kotlin
    reference: https://github.com/asdf-community/asdf-kotlin
  darwin/brew:
    cmd: brew install kotlin
    reference: https://formulae.brew.sh/formula/kotlin#default
  arch/pacman:
    cmd: sudo pacman -S kotlin
    reference: https://command-not-found.com/kotlin
binlist:
- kotlin
license: NOASSERTION

