lang: Go
homepage: https://github.com/szktkfm/mdtt
license: MIT
desc:
  cn: 用于编辑 markdown 表格的 TUI
  en: A TUI for editing markdown tables
x:
  source: https://github.com/szktkfm/mdtt
  eget: szktkfm/mdtt
  yay: mdtt
  go: github.com/szktkfm/mdtt/cmd/mdtt@latest
rule:
  /eget:
    cmd: x eget szktkfm/mdtt
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S mdtt
    reference: https://aur.archlinux.org/packages/mdtt
  /go:
    cmd: go install github.com/szktkfm/mdtt/cmd/mdtt@latest
    reference: https://github.com/szktkfm/mdtt?tab=readme-ov-file#-installation
    dsnap: github.com/szktkfm/mdtt/cmd/mdtt
binlist:
- mdtt

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
