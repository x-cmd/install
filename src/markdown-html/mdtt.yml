lang: Go
homepage: https://github.com/szktkfm/mdtt
license: MIT
desc:
  cn: 用于编辑 markdown 表格的 TUI
  en: A TUI for editing markdown tables
x:
  source: https://github.com/szktkfm/mdtt
  eget: https://github.com/szktkfm/mdtt
rule:
  /eget:
    cmd: x eget szktkfm/mdtt
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S mdtt
    reference: https://aur.archlinux.org/packages/mdtt
  /go:
    cmd: go install github.com/szktkfm/mdtt/cmd/mdtt@latest
    reference: https://github.com/szktkfm/mdtt?tab=readme-ov-file#-installation
    dsnap: github.com/szktkfm/mdtt/cmd/mdtt
binlist:
- mdtt
