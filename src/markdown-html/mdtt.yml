lang: Go
homepage: https://github.com/szktkfm/mdtt
license: MIT
desc:
  cn: 用于编辑 markdown 表格的 TUI
  en: A TUI for editing markdown tables
x:
  source: https://github.com/szktkfm/mdtt
  eget: https://github.com/szktkfm/mdtt
rule:
  /eget:
    cmd: x eget szktkfm/mdtt
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S mdtt
    reference: https://aur.archlinux.org/packages/mdtt
  /go:
    cmd: go install github.com/szktkfm/mdtt/cmd/mdtt@latest
    reference: https://github.com/szktkfm/mdtt?tab=readme-ov-file#-installation
    dsnap: github.com/szktkfm/mdtt/cmd/mdtt
binlist:
- mdtt

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
