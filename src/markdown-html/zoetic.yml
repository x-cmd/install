lang: JavaScript
homepage: https://github.com/kantord/zoetic
license: MIT
desc:
  cn: 使用网络摄像头进行 Markdown 演示
  en: Markdown presentations using your webcam
x:
  source: https://github.com/kantord/zoetic
rule:
  /yarn:
    cmd: 'git clone git@github.com:kantord/zoetic.git \

      && cd zoetic \

      && yarn install

      '
    reference: https://github.com/kantord/zoetic?tab=readme-ov-file#setup
binlist:
- zoetic

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
