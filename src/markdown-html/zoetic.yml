lang: JavaScript
homepage: https://github.com/kantord/zoetic
license: MIT
desc:
  cn: 使用网络摄像头进行 Markdown 演示
  en: Markdown presentations using your webcam
x:
  source: https://github.com/kantord/zoetic
  git: git@github.com:kantord/zoetic.git
rule:
  /yarn:
    cmd: 'git clone git@github.com:kantord/zoetic.git \

      && cd zoetic \

      && yarn install

      '
    reference: https://github.com/kantord/zoetic?tab=readme-ov-file#setup
binlist:
- zoetic

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
