lang: 'Rust'
homepage: https://github.com/benjajaja/mdfried
license: 'GPL-3.0'
desc:
  cn: 终端中的 Markdown 查看器,支持渲染图片和大号标题
  en: 'A markdown viewer for the terminal that renders images and Big Headers™'
x:
  source: https://github.com/benjajaja/mdfried
  eget: https://github.com/benjajaja/mdfried
rule:
  /cargo:
    cmd: 'cargo install mdfried'
    reference: https://github.com/benjajaja/mdfried
  /eget:
    cmd: x eget benjajaja/mdfried
    reference: https://github.com/benjajaja/mdfried
binlist:
- 'mdfried'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 182 MB
          rating: 3
          desc:
            cn: 安装 182 MB
            en: 182 MB install
        download:
          estimate: 182 MB
          desc:
            cn: 约 182 MB 下载 (macos/x64)
            en: ~182 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
