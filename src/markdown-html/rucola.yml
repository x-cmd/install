lang: Rust
homepage: https://github.com/Linus-Mussmaecher/rucola
license: GPL-3.0
desc:
  cn: 一个基于终端的 Markdown 笔记管理器，专为 Zettelkasten 风格的笔记系统而设计。
  en: A terminal based markdown note manager designed for zettelkasten-style note systems.
x:
  source: https://github.com/Linus-Mussmaecher/rucola
rule:
  arch/yay:
    cmd: yay -S rucola-notes-bin
    reference: https://aur.archlinux.org/packages/rucola-notes-bin
  arch/pacman:
    cmd: pacman -S rucola
    reference: https://github.com/Linus-Mussmaecher/rucola#installation
  /brew:
    cmd: brew install Linus-Mussmaecher/tap/rucola
    reference: https://github.com/Linus-Mussmaecher/rucola#installation
  /cargo:
    cmd: cargo install --locked rucola-notes
    reference: https://github.com/Linus-Mussmaecher/rucola#installation
    dsnap: rucola-notes
  /eget:
    cmd: eget Linus-Mussmaecher/rucola
    reference: https://github.com/Linus-Mussmaecher/rucola#installation
binlist:
- rucola

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
