lang: Python
homepage: https://github.com/davep/hike
license: GPL-3.0
desc:
  cn: Hike 是终端的 Markdown 浏览器。
  en: Hike is a Markdown browser for the terminal.
  cs: Hike je prohlížeč Markdownu pro terminál.
  de: Hike ist ein Markdown-Browser für das Terminal.
  es: Hike es un navegador Markdown para la terminal.
  fr: Hike est un navigateur Markdown pour le terminal.
  id: Hike adalah peramban Markdown untuk terminal.
  it: Hike è un browser Markdown per il terminale.
  ja: Hike はターミナル向け Markdown ブラウザです。
  ko: Hike는 터미널용 Markdown 브라우저입니다.
  pl: Hike to przeglądarka Markdown dla terminala.
  pt: Hike é um navegador Markdown para o terminal.
  ro: Hike este un browser Markdown pentru terminal.
  ru: Hike — браузер Markdown для терминала.
  th: Hike คือเบราว์เซอร์ Markdown สำหรับเทอร์มินัล
  tr: Hike, terminal için bir Markdown tarayıcısıdır.
  uk: Hike — це браузер Markdown для термінала.
  vi: Hike là trình duyệt Markdown cho terminal.
x:
  source: https://github.com/davep/hike
  brew: davep/homebrew/hike
rule:
  /pipx:
    cmd: pipx install hike
    reference: https://github.com/davep/hike?tab=readme-ov-file#pipx
  darwin/brew:
    cmd: brew tap davep/homebrew && brew install hike
    reference: https://github.com/davep/hike?tab=readme-ov-file#homebrew
binlist:
- hike

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
