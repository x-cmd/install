lang: Python
homepage: https://github.com/davep/hike
license: GPL-3.0
desc:
  cn: Hike 是终端的 Markdown 浏览器。
  en: Hike is a Markdown browser for the terminal.
x:
  source: https://github.com/davep/hike
rule:
  /pipx:
    cmd: pipx install hike
    reference: https://github.com/davep/hike?tab=readme-ov-file#pipx
  darwin/brew:
    cmd: brew tap davep/homebrew && brew install hike
    reference: https://github.com/davep/hike?tab=readme-ov-file#homebrew
binlist:
- hike

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
