lang: Python
homepage: https://github.com/davep/hike
license: GPL-3.0
desc:
  cn: Hike 是终端的 Markdown 浏览器。
  en: Hike is a Markdown browser for the terminal.
x:
  source: https://github.com/davep/hike
rule:
  /pipx:
    cmd: pipx install hike
    reference: https://github.com/davep/hike?tab=readme-ov-file#pipx
  darwin/brew:
    cmd: brew tap davep/homebrew && brew install hike
    reference: https://github.com/davep/hike?tab=readme-ov-file#homebrew
binlist:
- hike

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
