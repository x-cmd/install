lang: Rust
homepage: https://github.com/swsnr/mdcat
license: MPL-2.0
desc:
  cn: 在终端中显示 markdown 文档
  en: Show markdown documents in terminals
  cs: Zobrazovat markdown dokumenty v terminálech
  de: Markdown-Dokumente in Terminals anzeigen
  es: Mostrar documentos markdown en terminales
  fr: Afficher des documents markdown dans les terminaux
  id: Menampilkan dokumen markdown di terminal
  it: Mostra i documenti markdown nei terminali
  ja: ターミナルで markdown ドキュメントを表示する
  ko: 터미널에서 markdown 문서 표시
  pl: Wyświetlanie dokumentów markdown w terminalach
  pt: Exibir documentos markdown em terminais
  ro: Afișarea documentelor markdown în terminale
  ru: Показывать документы markdown в терминалах
  th: แสดงเอกสาร markdown ในเทอร์มินัล
  tr: Markdown belgelerini terminallerde gösterme
  uk: Показувати документи markdown у терміналах
  vi: Hiển thị tài liệu markdown trong terminal
x:
  source: https://github.com/swsnr/mdcat
  yay: mdcat
  cargo: mdcat
rule:
  /x:
    cmd: x pkg use mdcat
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S mdcat
    reference: https://aur.archlinux.org/packages/mdcat
  /cargo:
    cmd: cargo install mdcat
    reference: https://crates.io/crates/mdcat
    dsnap: mdcat
binlist:
- mdcat

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
