lang: Rust
homepage: https://github.com/swsnr/mdcat
license: MPL-2.0
desc:
  cn: 在终端中显示 markdown 文档
  en: Show markdown documents in terminals
x:
  pkg:
    exist: true
  source: https://github.com/swsnr/mdcat
rule:
  /x:
    cmd: x pkg use mdcat
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S mdcat
    reference: https://aur.archlinux.org/packages/mdcat
  /cargo:
    cmd: cargo install mdcat
    reference: https://crates.io/crates/mdcat
    dsnap: mdcat
binlist:
- mdcat

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
