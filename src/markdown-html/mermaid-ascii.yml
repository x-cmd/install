lang: Go
homepage: https://mermaid-ascii.art/
desc:
  cn: 在终端中渲染 Mermaid 图表
  en: Render Mermaid graphs inside your terminal
x:
  pkg:
    exist: true
rule:
  /x:
    cmd: x pkg use mermaid-ascii
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S mermaid-ascii-git
    reference: https://aur.archlinux.org/packages/mermaid-ascii-git
  /curl:
    cmd: 'curl -s https://api.github.com/repos/AlexanderGrooff/mermaid-ascii/releases/latest | grep "browser_download_url.*mermaid-ascii" | grep "$(uname)_$(uname -m)" | cut -d: -f2,3 | tr -d \" | wget -qi - && \

      tar xvzf mermaid-ascii_*.tar.gz && \

      ./mermaid-ascii --help

      '
    reference: https://github.com/AlexanderGrooff/mermaid-ascii?tab=readme-ov-file#installation
binlist:
- mermaid-ascii
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
