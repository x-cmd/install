lang: JavaScript
homepage: https://github.com/stylelint/stylelint
license: MIT
desc:
  en: css code analysis tool to find and fix problems in CSS code
  cn: css 代码分析校验工具，用于查找并修复 CSS 代码中的问题
  cs: Nástroj pro analýzu kódu CSS, který nachází a opravuje problémy v kódu CSS
  de: CSS-Code-Analysewerkzeug zum Finden und Beheben von Problemen im CSS-Code
  es: Herramienta de análisis de código css para encontrar y corregir problemas en el código CSS
  fr: Outil d'analyse de code css pour trouver et corriger les problèmes dans le code CSS
  id: Alat analisis kode css untuk menemukan dan memperbaiki masalah dalam kode CSS
  it: Strumento di analisi del codice css per individuare e correggere i problemi nel codice CSS
  ja: CSS コードの解析ツールで、CSS コードの問題を見つけて修正します
  ko: CSS 코드를 분석하여 CSS 코드의 문제를 찾고 수정하는 도구
  pl: Narzędzie do analizy kodu css, które znajduje i naprawia problemy w kodzie CSS
  pt: Ferramenta de análise de código css para encontrar e corrigir problemas no código CSS
  ro: Instrument de analiză a codului css pentru identificarea și repararea problemelor din codul CSS
  ru: Инструмент анализа CSS-кода для поиска и исправления проблем в коде CSS
  th: เครื่องมือวิเคราะห์โค้ด css เพื่อค้นหาและแก้ไขปัญหาในโค้ด CSS
  tr: CSS kodundaki sorunları bulmak ve düzeltmek için css kod analiz aracı
  uk: Інструмент аналізу коду css для пошуку та виправлення проблем у коді CSS
  vi: Công cụ phân tích mã css để tìm và sửa các vấn đề trong mã CSS
x:
  source: https://github.com/stylelint/stylelint
  brew: stylelint
  yay: stylelint
  npm: stylelint
rule:
  /x:
    cmd: x pkg use stylelint
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S stylelint
    reference: https://aur.archlinux.org/packages/stylelint
  /npm:
    cmd: npm install -g stylelint
    reference: https://www.npmjs.com/package/stylelint
    dsnap: stylelint
  darwin/brew:
    cmd: brew install stylelint
    reference: https://formulae.brew.sh/formula/stylelint#default
binlist:
- stylelint

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 141 KB
          rating: 1
          desc:
            cn: 约 141 KB（估算）
            en: ~141 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
