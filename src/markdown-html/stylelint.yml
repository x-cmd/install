lang: JavaScript
homepage: https://github.com/stylelint/stylelint
license: MIT
desc:
  en: css code analysis tool to find and fix problems in CSS code
  cn: css 代码分析校验工具，用于查找并修复 CSS 代码中的问题
x:
  pkg:
    exist: true
  source: https://github.com/stylelint/stylelint
rule:
  /x:
    cmd: x pkg use stylelint
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S stylelint
    reference: https://aur.archlinux.org/packages/stylelint
  /npm:
    cmd: npm install -g stylelint
    reference: https://www.npmjs.com/package/stylelint
    dsnap: stylelint
  darwin/brew:
    cmd: brew install stylelint
    reference: https://formulae.brew.sh/formula/stylelint#default
binlist:
- stylelint

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 141 KB
          rating: 1
          desc:
            cn: 约 141 KB（估算）
            en: ~141 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
