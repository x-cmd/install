lang: Rust
homepage: https://github.com/Doctave/doctave
license: MIT
desc:
  cn: Doctave 是一个固执己见的文档站点生成器，可以将 Markdown 文件转换为漂亮的开发人员文档站点
  en: Doctave is an opinionated documentation site generator that converts your Markdown files into a beautiful developer documentation site
x:
  source: https://github.com/Doctave/doctave
  eget: https://github.com/Doctave/doctave
rule:
  /eget:
    cmd: x eget Doctave/doctave
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S doctave
    reference: https://aur.archlinux.org/packages/doctave
  darwin/brew:
    cmd: brew install doctave/doctave/doctave
    reference: https://github.com/Doctave/doctave?tab=readme-ov-file#homebrew
  /cargo:
    cmd: cargo install --git https://github.com/Doctave/doctave --tag 0.4.2
    reference: https://github.com/Doctave/doctave?tab=readme-ov-file#cargo-rust-package-manager
    dsnap: doctave
binlist:
- doctave

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
