lang: Go
homepage: https://github.com/noborus/mdtsql
license: MIT
desc:
  cn: 执行 SQL 查询并将结果转换为 Markdown 表的 CLI 工具
  en: A CLI tool that executes SQL queries and converts the results into a Markdown table
  cs: Nástroj CLI, který spouští dotazy SQL a převádí výsledky do tabulky Markdown
  de: Ein CLI-Werkzeug, das SQL-Abfragen ausführt und die Ergebnisse in eine Markdown-Tabelle umwandelt
  es: Una herramienta de CLI que ejecuta consultas SQL y convierte los resultados en una tabla Markdown
  fr: Un outil en ligne de commande qui exécute des requêtes SQL et convertit les résultats en tableau Markdown
  id: Alat CLI yang menjalankan kueri SQL dan mengonversi hasilnya menjadi tabel Markdown
  it: Uno strumento CLI che esegue query SQL e converte i risultati in una tabella Markdown
  ja: SQL クエリを実行し、結果を Markdown テーブルに変換する CLI ツール
  ko: SQL 쿼리를 실행하고 결과를 Markdown 테이블로 변환하는 CLI 도구
  pl: Narzędzie CLI, które wykonuje zapytania SQL i konwertuje wyniki na tabelę Markdown
  pt: Uma ferramenta de CLI que executa consultas SQL e converte os resultados em uma tabela Markdown
  ro: Un instrument CLI care execută interogări SQL și convertește rezultatele într-un tabel Markdown
  ru: CLI-инструмент, который выполняет SQL-запросы и преобразует результаты в таблицу Markdown
  th: เครื่องมือ CLI ที่รันคำสั่ง SQL และแปลงผลลัพธ์เป็นตาราง Markdown
  tr: SQL sorgularını çalıştıran ve sonuçları Markdown tablosuna dönüştüren bir CLI aracı
  uk: CLI-інструмент, який виконує SQL-запити та перетворює результати на таблицю Markdown
  vi: Công cụ CLI chạy các truy vấn SQL và chuyển đổi kết quả thành bảng Markdown
x:
  source: https://github.com/noborus/mdtsql
  eget: noborus/mdtsql
  brew: noborus/tap/mdtsql
  yay: mdtsql-bin
  go: github.com/noborus/mdtsql/cmd/mdtsql@latest
rule:
  /x:
    cmd: x pkg use mdtsql
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget noborus/mdtsql
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S mdtsql-bin
    reference: https://aur.archlinux.org/packages/mdtsql-bin
  darwin/brew:
    cmd: brew install noborus/tap/mdtsql
    reference: https://github.com/noborus/mdtsql?tab=readme-ov-file#homebrew
  /go:
    cmd: go install github.com/noborus/mdtsql/cmd/mdtsql@latest
    reference: https://github.com/noborus/mdtsql?tab=readme-ov-file#go-install
    dsnap: github.com/noborus/mdtsql/cmd/mdtsql@latest
binlist:
- mdtsql

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
