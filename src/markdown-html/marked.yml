lang: JavaScript
homepage: https://github.com/markedjs/marked
desc:
  cn: markdown 处理器和编译器
  en: A markdown parser and compiler
x:
  pkg:
    exist: true
  source: https://github.com/markedjs/marked
rule:
  /x:
    cmd: x pkg use marked
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S nodejs-marked
    reference: https://aur.archlinux.org/packages/nodejs-marked
  /npm:
    cmd: npm install -g marked
    reference: https://github.com/markedjs/marked?tab=readme-ov-file#installation
    dsnap: marked
binlist:
- marked
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
