lang: JavaScript
homepage: https://github.com/markedjs/marked
desc:
  cn: markdown 处理器和编译器
  en: A markdown parser and compiler
  cs: Markdown parser a kompilátor
  de: Ein Markdown-Parser und -Compiler
  es: Un analizador y compilador de Markdown
  fr: Un analyseur et compilateur Markdown
  id: Parser dan kompilator Markdown
  it: Un parser e compilatore Markdown
  ja: Markdown のパーサーとコンパイラ
  ko: Markdown 파서 및 컴파일러
  pl: Parser i kompilator Markdown
  pt: Um analisador e compilador de Markdown
  ro: Un parser și compilator Markdown
  ru: Парсер и компилятор Markdown
  th: ตัวแยกวิเคราะห์และคอมไพล์ Markdown
  tr: Bir Markdown ayrıştırıcısı ve derleyicisi
  uk: Парсер і компілятор Markdown
  vi: Trình phân tích và biên dịch Markdown
x:
  source: https://github.com/markedjs/marked
  yay: nodejs-marked
  npm: marked
rule:
  /x:
    cmd: x pkg use marked
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S nodejs-marked
    reference: https://aur.archlinux.org/packages/nodejs-marked
  /npm:
    cmd: npm install -g marked
    reference: https://github.com/markedjs/marked?tab=readme-ov-file#installation
    dsnap: marked
binlist:
- marked
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 18 KB
          rating: 1
          desc:
            cn: 约 18 KB（估算）
            en: ~18 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
