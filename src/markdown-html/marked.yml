lang: JavaScript
homepage: https://github.com/markedjs/marked
desc:
  cn: markdown 处理器和编译器
  en: A markdown parser and compiler
x:
  source: https://github.com/markedjs/marked
  yay: nodejs-marked
  npm: marked
rule:
  /x:
    cmd: x pkg use marked
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S nodejs-marked
    reference: https://aur.archlinux.org/packages/nodejs-marked
  /npm:
    cmd: npm install -g marked
    reference: https://github.com/markedjs/marked?tab=readme-ov-file#installation
    dsnap: marked
binlist:
- marked
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 18 KB
          rating: 1
          desc:
            cn: 约 18 KB（估算）
            en: ~18 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
