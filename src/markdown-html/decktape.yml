lang: JavaScript
homepage: https://github.com/astefanutti/decktape
license: MIT
desc:
  cn: DeckTape 是用于 HTML 的高质量 PDF 导出程序
  en: DeckTape is a high-quality PDF exporter for HTML presentation frameworks'
  cs: DeckTape je vysoce kvalitní exportér PDF pro HTML prezentační frameworky
  de: DeckTape ist ein hochwertiger PDF-Exporter für HTML-Präsentationsframeworks
  es: DeckTape es un exportador de PDF de alta calidad para frameworks de presentaciones HTML
  fr: DeckTape est un exportateur PDF de haute qualité pour les frameworks de présentation HTML
  id: DeckTape adalah eksportir PDF berkualitas tinggi untuk framework presentasi HTML
  it: DeckTape è un esportatore PDF di alta qualità per i framework di presentazione HTML
  ja: DeckTape は HTML プレゼンテーションフレームワーク向けの高品質な PDF エクスポートツールです
  ko: DeckTape는 HTML 프레젠테이션 프레임워크를 위한 고품질 PDF 내보내기 도구입니다
  pl: DeckTape to wysokiej jakości eksporter PDF dla frameworków prezentacji HTML
  pt: DeckTape é um exportador de PDF de alta qualidade para frameworks de apresentação HTML
  ro: DeckTape este un exportor PDF de înaltă calitate pentru framework-uri de prezentare HTML
  ru: DeckTape — высококачественный экспортёр PDF для HTML-фреймворков презентаций
  th: DeckTape คือตัวส่งออก PDF คุณภาพสูงสำหรับเฟรมเวิร์กงานนำเสนอแบบ HTML
  tr: DeckTape, HTML sunum çerçeveleri için yüksek kaliteli bir PDF dışa aktarıcıdır
  uk: DeckTape — високоякісний експортер PDF для HTML-фреймворків презентацій
  vi: DeckTape là trình xuất PDF chất lượng cao cho các framework trình bày HTML
x:
  source: https://github.com/astefanutti/decktape
  npm: decktape
rule:
  /x:
    cmd: x pkg use decktape
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g decktape
    reference: https://github.com/astefanutti/decktape?tab=readme-ov-file#npm
    dsnap: decktape
binlist:
- decktape

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
