lang: JavaScript
homepage: https://github.com/astefanutti/decktape
license: MIT
desc:
  cn: DeckTape 是用于 HTML 的高质量 PDF 导出程序
  en: DeckTape is a high-quality PDF exporter for HTML presentation frameworks'
x:
  pkg:
    exist: true
  source: https://github.com/astefanutti/decktape
rule:
  /x:
    cmd: x pkg use decktape
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g decktape
    reference: https://github.com/astefanutti/decktape?tab=readme-ov-file#npm
    dsnap: decktape
binlist:
- decktape

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
