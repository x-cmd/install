lang: JavaScript
homepage: https://github.com/astefanutti/decktape
license: MIT
desc:
  cn: DeckTape 是用于 HTML 的高质量 PDF 导出程序
  en: DeckTape is a high-quality PDF exporter for HTML presentation frameworks'
x:
  pkg:
    exist: true
  source: https://github.com/astefanutti/decktape
rule:
  /x:
    cmd: x pkg use decktape
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install -g decktape
    reference: https://github.com/astefanutti/decktape?tab=readme-ov-file#npm
    dsnap: decktape
binlist:
- decktape

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
