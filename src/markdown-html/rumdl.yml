lang: Rust
homepage: https://github.com/rvben/rumdl
license: MIT
desc:
  cn: "rumdl 是 Rust 编写的 Markdown 检查和格式化工具，帮助你自动发现并修复文档问题。"
  en: "rumdl is a Markdown linter and formatter written in Rust, helping you automatically detect and fix document issues. Install via x-cmd for cleaner documents."
x:
  pkg:
    exist: true
  source: https://github.com/rvben/rumdl
  eget: https://github.com/rvben/rumdl
rule:
  /x:
    cmd: x pkg use rumdl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget rvben/rumdl
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
    dsnap: rumdl
  /npm:
    cmd: npm install -g rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
    dsnap: rumdl
  /pip:
    cmd: pip install rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
  /uv:
    cmd: uv tool install rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
  /mise:
    cmd: mise install rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
  arch/pacman:
    cmd: pacman -S rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
binlist:
  - rumdl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
