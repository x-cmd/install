lang: Rust
homepage: https://github.com/rvben/rumdl
license: MIT
desc:
  cn: "rumdl 是 Rust 编写的 Markdown 检查和格式化工具，帮助你自动发现并修复文档问题。"
  en: "rumdl is a Markdown linter and formatter written in Rust, helping you automatically detect and fix document issues. Install via x-cmd for cleaner documents."
x:
  source: https://github.com/rvben/rumdl
  eget: rvben/rumdl
  pacman: rumdl
  pip: rumdl
  npm: rumdl
  cargo: rumdl
rule:
  /x:
    cmd: x pkg use rumdl
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget rvben/rumdl
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
    dsnap: rumdl
  /npm:
    cmd: npm install -g rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
    dsnap: rumdl
  /pip:
    cmd: pip install rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
  /uv:
    cmd: uv tool install rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
  /mise:
    cmd: mise install rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
  arch/pacman:
    cmd: pacman -S rumdl
    reference: https://github.com/rvben/rumdl?tab=readme-ov-file#installation
binlist:
- rumdl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
