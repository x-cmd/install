lang: Python
homepage: https://github.com/Textualize/frogmouth
license: MIT
desc:
  cn: 使用 Textual 构建的终端 Markdown 查看器/浏览器
  en: A Markdown viewer/browser for your terminal, built with Textual
x:
  source: https://github.com/Textualize/frogmouth
rule:
  arch/yay:
    cmd: yay -S frogmouth
    reference: https://aur.archlinux.org/packages/frogmouth
  /pipx:
    cmd: pipx install frogmouth
    reference: https://github.com/Textualize/frogmouth?tab=readme-ov-file#installing
  /pip:
    cmd: pip install frogmouth
    reference: https://github.com/Textualize/frogmouth?tab=readme-ov-file#installing
    dsnap: frogmouth
  darwin/brew:
    cmd: brew install textualize/homebrew/frogmouth
    reference: https://github.com/Textualize/frogmouth?tab=readme-ov-file#installing
binlist:
- frogmouth

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
