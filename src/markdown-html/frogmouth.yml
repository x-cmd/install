lang: Python
homepage: https://github.com/Textualize/frogmouth
license: MIT
desc:
  cn: 使用 Textual 构建的终端 Markdown 查看器/浏览器
  en: A Markdown viewer/browser for your terminal, built with Textual
  cs: Prohlížeč Markdownu pro váš terminál, postavený s Textual
  de: Ein Markdown-Betrachter/-Browser für dein Terminal, gebaut mit Textual
  es: Un visor/navegador Markdown para tu terminal, construido con Textual
  fr: Un visualiseur/navigateur Markdown pour votre terminal, conçu avec Textual
  id: Penampil/peramban Markdown untuk terminal Anda, dibuat dengan Textual
  it: Un visualizzatore/browser Markdown per il tuo terminale, costruito con Textual
  ja: Textual で構築されたターミナル用 Markdown ビューア／ブラウザ
  ko: Textual로 만든 터미널용 Markdown 뷰어/브라우저
  pl: Przeglądarka Markdown dla terminala, zbudowana z użyciem Textual
  pt: Um visualizador/navegador Markdown para o seu terminal, construído com Textual
  ro: Un vizualizator/navigator Markdown pentru terminalul dvs., construit cu Textual
  ru: Просмотрщик/браузер Markdown для вашего терминала, созданный на Textual
  th: ตัวดูและเบราว์เซอร์ Markdown สำหรับเทอร์มินัลของคุณ สร้างด้วย Textual
  tr: Terminaliniz için Textual ile hazırlanmış bir Markdown görüntüleyici/tarayıcı
  uk: Переглядач/браузер Markdown для вашого термінала, створений на Textual
  vi: Trình xem/trình duyệt Markdown cho terminal của bạn, xây dựng bằng Textual
x:
  source: https://github.com/Textualize/frogmouth
  brew: textualize/homebrew/frogmouth
  yay: frogmouth
  pip: frogmouth
rule:
  arch/yay:
    cmd: yay -S frogmouth
    reference: https://aur.archlinux.org/packages/frogmouth
  /pipx:
    cmd: pipx install frogmouth
    reference: https://github.com/Textualize/frogmouth?tab=readme-ov-file#installing
  /pip:
    cmd: pip install frogmouth
    reference: https://github.com/Textualize/frogmouth?tab=readme-ov-file#installing
    dsnap: frogmouth
  darwin/brew:
    cmd: brew install textualize/homebrew/frogmouth
    reference: https://github.com/Textualize/frogmouth?tab=readme-ov-file#installing
binlist:
- frogmouth

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
