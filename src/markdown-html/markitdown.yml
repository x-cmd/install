lang: Python
homepage: https://github.com/microsoft/markitdown
license: MIT
desc:
  cn: 用于将文件和办公文档转换为 Markdown 的 Python 工具
  en: Python tool for converting files and office documents to Markdown.
  cs: Nástroj v Pythonu pro převod souborů a kancelářských dokumentů do Markdownu.
  de: Python-Tool zum Konvertieren von Dateien und Office-Dokumenten in Markdown.
  es: Herramienta de Python para convertir archivos y documentos de oficina en Markdown.
  fr: Outil Python pour convertir des fichiers et des documents bureautiques en Markdown.
  id: Alat Python untuk mengonversi berkas dan dokumen kantor ke Markdown.
  it: Strumento Python per convertire file e documenti office in Markdown.
  ja: ファイルやオフィスドキュメントを Markdown に変換する Python ツール。
  ko: 파일과 사무 문서를 Markdown로 변환하는 Python 도구.
  pl: Narzędzie w Pythonie do konwersji plików i dokumentów biurowych do Markdown.
  pt: Ferramenta Python para converter arquivos e documentos do escritório em Markdown.
  ro: Instrument Python pentru conversirea fișierelor și a documentelor de birou în Markdown.
  ru: Инструмент на Python для преобразования файлов и офисных документов в Markdown.
  th: เครื่องมือ Python สำหรับแปลงไฟล์และเอกสารสำนักงานเป็น Markdown
  tr: Dosyaları ve ofis belgelerini Markdown'a dönüştürmek için Python aracı.
  uk: Інструмент на Python для перетворення файлів та офісних документів у Markdown.
  vi: Công cụ Python để chuyển đổi tệp và tài liệu văn phòng sang Markdown.
x:
  source: https://github.com/microsoft/markitdown
  yay: python-markitdown-git
  pip: 'markitdown[all]'
rule:
  /x:
    cmd: x pkg use markitdown
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S python-markitdown-git
    reference: https://aur.archlinux.org/packages/python-markitdown-git
  /pip:
    cmd: pip install 'markitdown[all]'
    reference: https://github.com/microsoft/markitdown?tab=readme-ov-file#installation
    dsnap: markitdown[all]
binlist:
- markitdown

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 27 KB
          rating: 1
          desc:
            cn: 约 27 KB（估算）
            en: ~27 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
