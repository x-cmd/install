lang: Python
homepage: https://github.com/microsoft/markitdown
license: MIT
desc:
  cn: 用于将文件和办公文档转换为 Markdown 的 Python 工具
  en: Python tool for converting files and office documents to Markdown.
x:
  pkg:
    exist: true
  source: https://github.com/microsoft/markitdown
rule:
  /x:
    cmd: x pkg use markitdown
    reference: https://x-cmd.com/install/
  arch/yay:
    cmd: yay -S python-markitdown-git
    reference: https://aur.archlinux.org/packages/python-markitdown-git
  /pip:
    cmd: pip install 'markitdown[all]'
    reference: https://github.com/microsoft/markitdown?tab=readme-ov-file#installation
    dsnap: markitdown[all]
binlist:
- markitdown

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 27 KB
          rating: 1
          desc:
            cn: 约 27 KB（估算）
            en: ~27 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
