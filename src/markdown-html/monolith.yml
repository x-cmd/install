lang: Rust
desc:
  en: CLI tool for saving complete web pages as a single HTML file
  cn: 用于将完整的网页保存为单个 HTML 文件的 CLI 工具
homepage: https://github.com/y2z/monolith
license: CC0-1.0
x:
  pkg:
    exist: true
  source: https://github.com/y2z/monolith
rule:
  /x:
    cmd: x pkg use monolith
    reference: https://x-cmd.com/install/
  /cargo:
    cmd: cargo install monolith
    reference: https://github.com/y2z/monolith?tab=readme-ov-file#installation
    dsnap: monolith
  darwin/brew:
    cmd: brew install monolith
    reference: https://github.com/y2z/monolith?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install monolith
    reference: https://github.com/y2z/monolith?tab=readme-ov-file#installation
  darwin/port:
    cmd: port install monolith
    reference: https://github.com/y2z/monolith?tab=readme-ov-file#installation
  /snap:
    cmd: snap install monolith
    reference: https://github.com/y2z/monolith?tab=readme-ov-file#installation
  guixos/guix:
    cmd: guix install monolith
    reference: https://github.com/y2z/monolith?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay monolith
    reference: https://github.com/y2z/monolith?tab=readme-ov-file#installation
  alpine/apk:
    cmd: apk add monolith
    reference: https://github.com/y2z/monolith?tab=readme-ov-file#installation
  freebsd/pkg:
    cmd: pkg install monolith
    reference: https://github.com/y2z/monolith?tab=readme-ov-file#installation
binlist:
- monolith

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
