lang: Python
homepage: https://github.com/httpie/cli
license: BSD-3-Clause
desc:
  cn: httpie - 命令行 HTTP 客户端，用户友好的 cURL 替代品
  en: HTTPie is making APIs simple and intuitive for those building the tools of our time
x:
  pkg:
    exist: true
  source: https://github.com/httpie/cli
rule:
  /x:
    cmd: x pkg use httpie
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install httpie
    reference: https://httpie.io/docs/cli/macos
  /pip:
    cmd: 'python -m pip install --upgrade pip wheel \

      && python -m pip install httpie

      '
    reference: https://httpie.io/docs/cli/pypi
    dsnap: httpie
  /port:
    cmd: sudo port selfupdate && sudo port install httpie
    reference: https://httpie.io/docs/cli/macports
  (win|wsl2)/choco:
    cmd: x choco install httpie
    reference: https://httpie.io/docs/cli/chocolatey
  debian/apt:
    cmd: 'curl -SsL https://packages.httpie.io/deb/KEY.gpg | sudo gpg --dearmor -o /usr/share/keyrings/httpie.gpg \

      && sudo echo "deb [arch=amd64 signed-by=/usr/share/keyrings/httpie.gpg] https://packages.httpie.io/deb ./" > /etc/apt/sources.list.d/httpie.list \

      && sudo apt update \

      && sudo apt install httpie

      '
    reference: https://httpie.io/docs/cli/debian-and-ubuntu
  ubuntu/apt:
    cmd: 'curl -SsL https://packages.httpie.io/deb/KEY.gpg | sudo gpg --dearmor -o /usr/share/keyrings/httpie.gpg \

      && sudo echo "deb [arch=amd64 signed-by=/usr/share/keyrings/httpie.gpg] https://packages.httpie.io/deb ./" > /etc/apt/sources.list.d/httpie.list \

      && sudo apt update \

      && sudo apt install httpie

      '
    reference: https://httpie.io/docs/cli/debian-and-ubuntu
  fedora/dnf:
    cmd: sudo dnf install httpie
    reference: https://httpie.io/docs/cli/fedora
  centos/yum:
    cmd: 'yum install epel-release \

      && yum install httpie

      '
    reference: https://httpie.io/docs/cli/centos-and-rhel
  rhel/yum:
    cmd: 'yum install epel-release \

      && yum install httpie

      '
    reference: https://httpie.io/docs/cli/centos-and-rhel
  /snap:
    cmd: sudo snap install httpie
    reference: https://httpie.io/docs/cli/snapcraft-linux
  linux/brew:
    cmd: brew install httpie
    reference: https://httpie.io/docs/cli/linuxbrew
  arch/pacman:
    cmd: sudo pacman -Syu httpie
    reference: https://httpie.io/docs/cli/arch-linux
  freebsd/pkg:
    cmd: pkg install www/py-httpie
    reference: https://httpie.io/docs/cli/freebsd
binlist:
- httpie
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true   # HTTP requests
    filesystem:
      read:
        desc:
          cn: 读取 ~/.netrc, ~/.httpie 配置
          en: Reads ~/.netrc, ~/.httpie config
        sensitive:
          - "$HOME/.netrc"
      write: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 安装 ~30 MB
            en: ~30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: ~80 MB Python
          en: ~80 MB Python
      peak:
        estimate: 150 MB
        desc:
          cn: ~150 MB
          en: ~150 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 3
        desc:
          cn: 请求响应处理时短暂占用
          en: Brief spike on response handling
