lang: Rust
homepage: https://github.com/preiter93/wireman
license: MIT
desc:
  cn: WireMan 是一个基于终端的 gRPC 客户端。
  en: WireMan is a terminal-based gRPC client with a user-friendly interface.
x:
  source: https://github.com/preiter93/wireman
  eget: https://github.com/preiter93/wireman
rule:
  /eget:
    cmd: x eget preiter93/wireman
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install wireman
    reference: https://github.com/preiter93/wireman#installation
    dsnap: wireman
  /brew:
    cmd: brew install preiter93/wireman/wireman
    reference: https://github.com/preiter93/wireman#installation
binlist:
- wireman

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
