lang: TypeScript
homepage: https://github.com/stoplightio/elements
license: Apache-2.0
desc:
  en: Elements is an API Documentation toolkit leveraging OpenAPI and Markdown (CommonMark) to provide beautiful, interactive API reference documentation that you can integrate with any existing content-management system or single-page application
  cn: Elements 是一个 API 文档工具包，利用 OpenAPI 和 Markdown (CommonMark)提供漂亮的、交互式的 API 参考文档，可以与任何现有的内容管理系统或单页应用集成
x:
  source: https://github.com/stoplightio/elements
rule:
  /npm:
    cmd: npm install @stoplight/elements
    reference: https://github.com/stoplightio/elements?tab=readme-ov-file#react-component
    dsnap: '@stoplight/elements'
binlist:
- elements

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 58 KB
          rating: 1
          desc:
            cn: 约 58 KB（估算）
            en: ~58 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
