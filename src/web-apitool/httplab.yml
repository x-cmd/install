lang: Go
homepage: https://github.com/qustavo/httplab
license: MIT
desc:
  cn: 用于检查 HTTP 请求并在终端中模拟其响应的交互式 Web 服务器。
  en: An interactive web server for inspecting HTTP requests and mocking their responses in the terminal.
x:
  source: https://github.com/qustavo/httplab
rule:
  arch/yaourt:
    cmd: yaourt httplab
    reference: https://github.com/qustavo/httplab#install
  /eget:
    cmd: eget qustavo/httplab
    reference: https://github.com/qustavo/httplab#install
  /go:
    cmd: go install github.com/gchaincl/httplab/cmd/httplab@latest
    reference: https://github.com/qustavo/httplab#install
    dsnap: github.com/gchaincl/httplab/cmd/httplab@latest
binlist:
- httplab

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
