lang: Go
homepage: https://github.com/qustavo/httplab
license: MIT
desc:
  cn: 用于检查 HTTP 请求并在终端中模拟其响应的交互式 Web 服务器。
  en: An interactive web server for inspecting HTTP requests and mocking their responses in the terminal.
  cs: Interaktivní webový server pro kontrolu HTTP požadavků a simulaci jejich odpovědí v terminálu.
  de: Ein interaktiver Webserver zum Inspectieren von HTTP-Anfragen und Mocken ihrer Antworten im Terminal.
  es: Un servidor web interactivo para inspeccionar solicitudes HTTP y simular sus respuestas en la terminal.
  fr: Un serveur web interactif pour inspecter les requêtes HTTP et simuler leurs réponses dans le terminal.
  id: Server web interaktif untuk memeriksa permintaan HTTP dan meniru responsnya di terminal.
  it: Un server web interattivo per ispezionare le richieste HTTP e simulare le relative risposte nel terminale.
  ja: ターミナル上で HTTP リクエストを検査し、そのレスポンスをモックするインタラクティブな Web サーバー。
  ko: 터미널에서 HTTP 요청을 검사하고 응답을 모킹하는 대화형 웹 서버.
  pl: Interaktywny serwer WWW do inspekcji żądań HTTP i symulowania ich odpowiedzi w terminalu.
  pt: Um servidor web interativo para inspecionar requisições HTTP e simular suas respostas no terminal.
  ro: Un server web interactiv pentru inspectarea cererilor HTTP și simularea răspunsurilor lor în terminal.
  ru: Интерактивный веб-сервер для проверки HTTP-запросов и имитации их ответов в терминале.
  th: เว็บเซิร์ฟเวอร์แบบโต้ตอบสำหรับตรวจสอบคำขอ HTTP และจำลองการตอบกลับในเทอร์มินัล๏
  tr: Terminalde HTTP isteklerini incelemek ve yanıtlarını taklit etmek için etkileşimli web sunucusu.
  uk: Інтерактивний вебсервер для перевірки HTTP-запитів та імітації їх відповідей у терміналі.
  vi: Máy chủ web tương tác để kiểm tra các yêu cầu HTTP và mô phỏng phản hồi của chúng trong terminal.
x:
  source: https://github.com/qustavo/httplab
  go: github.com/gchaincl/httplab/cmd/httplab@latest
rule:
  arch/yaourt:
    cmd: yaourt httplab
    reference: https://github.com/qustavo/httplab#install
  /eget:
    cmd: eget qustavo/httplab
    reference: https://github.com/qustavo/httplab#install
  /go:
    cmd: go install github.com/gchaincl/httplab/cmd/httplab@latest
    reference: https://github.com/qustavo/httplab#install
    dsnap: github.com/gchaincl/httplab/cmd/httplab@latest
binlist:
- httplab

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
