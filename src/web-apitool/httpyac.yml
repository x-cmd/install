lang: TypeScript
homepage: https://github.com/anweber/httpyac
license: MIT
desc:
  cn: 用于执行 *.http, *.rest 文件的命令行工具
  en: A command line interface to execute *.http, *.rest files.
x:
  source: https://github.com/anweber/httpyac
rule:
  /npm:
    cmd: npm install -g httpyac
    reference: https://github.com/anweber/httpyac#installation
    dsnap: httpyac
binlist:
- httpyac

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 28 KB
          rating: 1
          desc:
            cn: 约 28 KB（估算）
            en: ~28 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
