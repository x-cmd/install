lang: TypeScript
homepage: https://github.com/anweber/httpyac
license: MIT
desc:
  cn: 用于执行 *.http, *.rest 文件的命令行工具
  en: A command line interface to execute *.http, *.rest files.
x:
  source: https://github.com/anweber/httpyac
rule:
  /npm:
    cmd: npm install -g httpyac
    reference: https://github.com/anweber/httpyac#installation
    dsnap: httpyac
binlist:
- httpyac

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
