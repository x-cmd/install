lang: Python
homepage: https://github.com/darrenburns/posting
license: Apache-2.0
desc:
  cn: Posting 是一个 HTTP 客户端，与 Postman 和 Insomnia 类似。
  en: Posting is an HTTP client, not unlike Postman and Insomnia.
x:
  source: https://github.com/darrenburns/posting
rule:
  /curl:
    cmd: curl -LsSf https://astral.sh/uv/install.sh | sh
    reference: https://github.com/darrenburns/posting#installation
  /uv:
    cmd: uv tool install --python 3.13 posting
    reference: https://github.com/darrenburns/posting#installation
    dsnap: posting
  /pipx:
    cmd: pipx install posting
    reference: https://github.com/darrenburns/posting#installation
  arch/yay:
    cmd: yay -S posting
    reference: https://aur.archlinux.org/packages/posting
binlist:
- posting

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
