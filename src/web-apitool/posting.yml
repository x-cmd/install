lang: Python
homepage: https://github.com/darrenburns/posting
license: Apache-2.0
desc:
  cn: Posting 是一个 HTTP 客户端，与 Postman 和 Insomnia 类似。
  en: Posting is an HTTP client, not unlike Postman and Insomnia.
x:
  source: https://github.com/darrenburns/posting
  yay: posting
rule:
  /curl:
    cmd: curl -LsSf https://astral.sh/uv/install.sh | sh
    reference: https://github.com/darrenburns/posting#installation
  /uv:
    cmd: uv tool install --python 3.13 posting
    reference: https://github.com/darrenburns/posting#installation
    dsnap: posting
  /pipx:
    cmd: pipx install posting
    reference: https://github.com/darrenburns/posting#installation
  arch/yay:
    cmd: yay -S posting
    reference: https://aur.archlinux.org/packages/posting
binlist:
- posting

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 KB
          rating: 1
          desc:
            cn: 约 25 KB（估算）
            en: ~25 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
