lang: Rust
homepage: https://github.com/Orange-OpenSource/hurl
license: Apache-2.0
desc:
  cn: 用于运行以简单纯文本格式定义的 HTTP 请求
  en: runs HTTP requests defined in a simple plain text format
x:
  pkg:
    exist: true
  source: https://github.com/Orange-OpenSource/hurl
  eget: https://github.com/Orange-OpenSource/hurl
rule:
  /eget:
    cmd: x eget Orange-OpenSource/hurl
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use hurl
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use hurl
    reference: https://github.com/raimon49/asdf-hurl
  linux/curl:
    cmd: 'INSTALL_DIR=/tmp \

      && VERSION=4.1.0 \

      && curl --silent --location https://github.com/Orange-OpenSource/hurl/releases/download/$VERSION/hurl-$VERSION-x86_64-unknown-linux-gnu.tar.gz | tar xvz -C $INSTALL_DIR \

      && export PATH=$INSTALL_DIR/hurl-$VERSION:$PATH

      '
    reference: https://hurl.dev/docs/installation.html#linux
  darwin/brew:
    cmd: brew install hurl
    reference: https://formulae.brew.sh/formula/hurl#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install hurl
    reference: https://hurl.dev/docs/installation.html#macports
  (win|wsl2)/choco:
    cmd: x choco install hurl
    reference: https://hurl.dev/docs/installation.html#chocolatey
  (win|wsl2)/scoop:
    cmd: x scoop install hurl
    reference: https://hurl.dev/docs/installation.html#scoop
  win/winget:
    cmd: x winget install hurl
    reference: https://hurl.dev/docs/installation.html#windows-package-manager
  debian/apt:
    cmd: 'VERSION=4.1.0 \

      && curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/$VERSION/hurl_$VERSION_amd64.deb \

      && sudo apt update \

      && sudo apt install ./hurl_$VERSION_amd64.deb

      '
    reference: https://hurl.dev/docs/installation.html#debian-ubuntu
    dsnap: hurl
  ubuntu/apt:
    cmd: 'VERSION=4.1.0 \

      && curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/$VERSION/hurl_$VERSION_amd64.deb \

      && sudo apt update \

      && sudo apt install ./hurl_$VERSION_amd64.deb

      '
    reference: https://hurl.dev/docs/installation.html#debian-ubuntu
    dsnap: hurl
  alpine/apk:
    cmd: sudo apk add --repository http://dl-cdn.alpinelinux.org/alpine/edge/testing hurl
    reference: https://hurl.dev/docs/installation.html#alpine
    dsnap: hurl
  arch/pacman:
    cmd: sudo pacman -S hurl-bin
    reference: https://hurl.dev/docs/installation.html#arch-linux-manjaro
  kali/apt:
    cmd: sudo apt-get install hurl
    reference: https://command-not-found.com/hURL
    dsnap: hurl
  freebsd/pkg:
    cmd: sudo pkg install hurl
    reference: https://hurl.dev/docs/installation.html#freebsd
  /npm:
    cmd: npm install --save-dev @orangeopensource/hurl
    reference: https://hurl.dev/docs/installation.html#npm
    dsnap: '@orangeopensource/hurl'
binlist:
- hurl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
