lang: Python
homepage: https://github.com/encode/httpx
license: BSD-3-Clause
desc:
  cn: Python 的下一代 HTTP 客户端
  en: A next generation HTTP client for Python
x:
  pkg:
    exist: true
  source: https://github.com/encode/httpx
rule:
  /x:
    cmd: x pkg use httpx
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install 'httpx[cli]'
    reference: https://github.com/encode/httpx?tab=readme-ov-file#installation
    dsnap: httpx[cli]
binlist:
- httpx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
