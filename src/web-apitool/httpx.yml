lang: Python
homepage: https://github.com/encode/httpx
license: BSD-3-Clause
desc:
  cn: Python 的下一代 HTTP 客户端
  en: A next generation HTTP client for Python
x:
  pkg:
    exist: true
  source: https://github.com/encode/httpx
rule:
  /x:
    cmd: x pkg use httpx
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install 'httpx[cli]'
    reference: https://github.com/encode/httpx?tab=readme-ov-file#installation
    dsnap: httpx[cli]
binlist:
- httpx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 27 KB
          rating: 1
          desc:
            cn: 约 27 KB（估算）
            en: ~27 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
