lang: C
homepage: https://www.chiark.greenend.org.uk/~sgtatham/putty/
desc:
  cn: PuTTY 是一个针对 Windows 和 Unix 平台的免费 SSH 和 Telnet 实现，还有一个 xterm 虚拟终端
  en: PuTTY is a free implementation of SSH and Telnet for Windows and Unix platforms, along with an xterm terminal emulator
rule:
  darwin/brew:
    cmd: brew install putty
    reference: https://formulae.brew.sh/formula/putty#default
binlist:
- putty
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
