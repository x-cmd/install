lang: C
homepage: https://github.com/openssh/openssh-portable
desc:
  cn: OpenSSH 是使用 SSH 协议进行远程登录的连接工具
  en: OpenSSH is the premier connectivity tool for remote login with the SSH protocol
x:
  source: https://github.com/openssh/openssh-portable
rule:
  darwin/brew:
    cmd: brew install openssh
    reference: https://formulae.brew.sh/formula/openssh
  alpine/apk:
    cmd: sudo apk add openssh
    reference: https://www.cyberciti.biz/faq/how-to-install-openssh-server-on-alpine-linux-including-docker/
    dsnap: openssh
  arch/pacman:
    cmd: sudo pacman -Sy openssh
    reference: https://www.unixmen.com/how-to-install-openssh-in-archinux/
  fedora/dnf:
    cmd: sudo dnf -y install openssh
    reference: https://installati.one/fedora/34/openssh/
    dsnap: openssh
  opensuse/zypper:
    cmd: sudo zypper install openssh
    reference: https://linuxways.net/opensuse/how-to-enable-ssh-on-opensuse/
binlist:
- openssh
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
