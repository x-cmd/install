lang: C
homepage: https://github.com/openssh/openssh-portable
desc:
  cn: OpenSSH 是使用 SSH 协议进行远程登录的连接工具
  en: OpenSSH is the premier connectivity tool for remote login with the SSH protocol
  cs: OpenSSH je hlavní nástroj pro vzdálené přihlášení protokolem SSH
  de: OpenSSH ist das führende Verbindungswerkzeug für Fernzugriffe über das SSH-Protokoll
  es: OpenSSH es la principal herramienta de conectividad para el acceso remoto con el protocolo SSH
  fr: OpenSSH est le principal outil de connectivité pour l'accès à distance avec le protocole SSH
  id: OpenSSH adalah alat konektivitas utama untuk login jarak jauh dengan protokol SSH
  it: OpenSSH è il principale strumento di connettività per l'accesso remoto con il protocollo SSH
  ja: OpenSSH は SSH プロトコルによるリモートログインの主要ツールです
  ko: OpenSSH는 SSH 프로토콜로 원격 로그인하는 대표적인 연결 도구입니다
  pl: OpenSSH to główne narzędzie łączności do zdalnego logowania przy użyciu protokołu SSH
  pt: OpenSSH é a principal ferramenta de conectividade para login remoto com o protocolo SSH
  ro: OpenSSH este principalul instrument de conectivitate pentru autentificare la distanță cu protocolul SSH
  ru: OpenSSH — основной инструмент удалённого доступа по протоколу SSH
  th: OpenSSH เป็นเครื่องมือเชื่อมต่อหลักสำหรับการเข้าสู่ระบบระยะไกลด้วยโปรโตคอล SSH
  tr: OpenSSH, SSH protokolü ile uzak oturum açma için önde gelen bağlantı aracıdır
  uk: OpenSSH — провідний інструмент віддаленого входу за протоколом SSH
  vi: OpenSSH là công cụ kết nối chính để đăng nhập từ xa bằng giao thức SSH
x:
  source: https://github.com/openssh/openssh-portable
  brew: openssh
  apk: openssh
  zypper: openssh
  pacman: openssh
rule:
  darwin/brew:
    cmd: brew install openssh
    reference: https://formulae.brew.sh/formula/openssh
  alpine/apk:
    cmd: sudo apk add openssh
    reference: https://www.cyberciti.biz/faq/how-to-install-openssh-server-on-alpine-linux-including-docker/
    dsnap: openssh
  arch/pacman:
    cmd: sudo pacman -Sy openssh
    reference: https://www.unixmen.com/how-to-install-openssh-in-archinux/
  fedora/dnf:
    cmd: sudo dnf -y install openssh
    reference: https://installati.one/fedora/34/openssh/
    dsnap: openssh
  opensuse/zypper:
    cmd: sudo zypper install openssh
    reference: https://linuxways.net/opensuse/how-to-enable-ssh-on-opensuse/
binlist:
- openssh
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
