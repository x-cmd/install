lang: Python
homepage: https://github.com/xxh/xxh
license: BSD-2-Clause
desc:
  cn: xxh 允许您通过 ssh 在没有 root 访问权限或系统安装的情况下，将喜爱的 Shell 带到您所在的任何地方。支持 Xonsh Shell、Fish、Zsh、Osquery 等等
  en: The mission of xxh is to bring your favorite shell wherever you go through ssh without root access or system installations. Xonsh shell, fish, zsh, osquery and so on
x:
  pkg:
    exist: true
  source: https://github.com/xxh/xxh
rule:
  /x:
    cmd: x pkg use xxh-xxh
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install xxh-xxh
    reference: https://github.com/xxh/xxh#pypi-3
  /pipx:
    cmd: pipx install xxh-xxh
    reference: https://github.com/xxh/xxh#pipx---good-alternative-to-brew-and-pip-read-comparison
  /xpip:
    cmd: xpip install xxh-xxh
    reference: https://github.com/xxh/xxh#xonsh-shell
  darwin/brew:
    cmd: brew install xxh
    reference: https://formulae.brew.sh/formula/xxh#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install xxh
    reference: https://github.com/xxh/xxh#macports
  linux/wget:
    cmd: 'mkdir ~/xxh \

      && cd ~/xxh \

      && wget https://github.com/xxh/xxh/releases/download/0.8.12/xxh-portable-musl-alpine-Linux-x86_64.tar.gz \

      && tar -xzf xxh-portable-musl-alpine-Linux-x86_64.tar.gz \

      && ./xxh

      '
    reference: https://github.com/xxh/xxh#linux-portable-binary
binlist:
- xxh-xxh
