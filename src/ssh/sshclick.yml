lang: 'Python'
homepage: 'https://github.com/karlot/sshclick'
license: 'MIT'
desc:
  cn: 基于 Python 和 Click 框架、配 Rich 与 Textual UI 的 SSH 配置终端管理器
  en: 'SSH Config terminal manager based on Python and Click framework with Rich and Textual UI'
x:
  source: https://github.com/karlot/sshclick
  eget: https://github.com/karlot/sshclick
rule:
  /eget:
    cmd: x eget karlot/sshclick
    reference: https://github.com/karlot/sshclick
binlist:
  - 'sshclick'

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
