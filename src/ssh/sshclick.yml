lang: 'Python'
homepage: 'https://github.com/karlot/sshclick'
license: 'MIT'
desc:
  cn: 基于 Python 和 Click 框架、配 Rich 与 Textual UI 的 SSH 配置终端管理器
  en: 'SSH Config terminal manager based on Python and Click framework with Rich and Textual UI'
x:
  source: https://github.com/karlot/sshclick
  eget: karlot/sshclick
rule:
  /eget:
    cmd: x eget karlot/sshclick
    reference: https://github.com/karlot/sshclick
binlist:
  - 'sshclick'

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
