lang: Go
homepage: https://github.com/trzsz/trzsz-ssh
license: MIT
desc:
  en: An alternative to ssh client, offers additional useful features, such as login prompt, trzsz ( trz / tsz ), batch login, remember password, zmodem ( rz / sz ), etc.
  cn: 一个 ssh 客户端的替代品，提供了额外的有用功能，如登录提示、trzsz（trz / tsz）、批量登录、记住密码、zmodem（rz / sz）等。
x:
  source: https://github.com/trzsz/trzsz-ssh
  eget: https://github.com/trzsz/trzsz-ssh
rule:
  /eget:
    cmd: x eget trzsz/trzsz-ssh
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install trzsz-ssh
    reference: https://formulae.brew.sh/formula/trzsz-ssh#default
binlist:
- trzsz-ssh

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
