lang: C
homepage: https://github.com/openssh/openssh-portable
desc:
  cn: openssh-server 是 OpenSSH 连接工具的客户端
  en: openssh-server is a client for the OpenSSH connection tool
  cs: openssh-server je klient pro nástroj pro připojování OpenSSH
  de: openssh-server ist ein Client für das OpenSSH-Verbindungswerkzeug
  es: openssh-server es un cliente para la herramienta de conexión OpenSSH
  fr: openssh-server est un client pour l'outil de connexion OpenSSH
  id: openssh-server adalah klien untuk alat koneksi OpenSSH
  it: openssh-server è un client per lo strumento di connessione OpenSSH
  ja: openssh-server は OpenSSH 接続ツールのクライアントです
  ko: openssh-server는 OpenSSH 연결 도구의 클라이언트입니다
  pl: openssh-server to klient narzędzia połączenia OpenSSH
  pt: openssh-server é um cliente para a ferramenta de conexão OpenSSH
  ro: openssh-server este un client pentru instrumentul de conectare OpenSSH
  ru: openssh-server — это клиент для инструмента подключения OpenSSH
  th: openssh-server เป็นไคลเอนต์สำหรับเครื่องมือเชื่อมต่อ OpenSSH
  tr: openssh-server, OpenSSH bağlantı aracı için bir istemcidir
  uk: openssh-server — це клієнт для інструмента підключення OpenSSH
  vi: openssh-server là client cho công cụ kết nối OpenSSH
x:
  source: https://github.com/openssh/openssh-portable
  apt: openssh-client
  brew: openssh
  apk: openssh
  apt-get: openssh-client
  zypper: openssh
  pacman: openssh
rule:
  darwin/brew:
    cmd: brew install openssh
    reference: https://formulae.brew.sh/formula/openssh#default
  debian/apt:
    cmd: sudo apt-get install openssh-client
    reference: https://www.cyberciti.biz/faq/how-to-install-ssh-on-ubuntu-linux-using-apt-get/
    dsnap: openssh-client
  ubuntu/apt:
    cmd: sudo apt-get install openssh-client
    reference: https://www.cyberciti.biz/faq/how-to-install-ssh-on-ubuntu-linux-using-apt-get/
    dsnap: openssh-client
  alpine/apk:
    cmd: sudo apk add openssh
    reference: https://www.cyberciti.biz/faq/how-to-install-openssh-server-on-alpine-linux-including-docker/
    dsnap: openssh
  arch/pacman:
    cmd: sudo pacman -Sy openssh
    reference: https://www.unixmen.com/how-to-install-openssh-in-archinux/
  kali/apt:
    cmd: sudo apt-get install openssh-client
    reference: https://www.kali.org/tools/openssh/
    dsnap: openssh-client
  centos/yum:
    cmd: sudo yum -y install openssh-server openssh-clients
    reference: https://phoenixnap.com/kb/how-to-enable-ssh-centos-7
  fedora/dnf:
    cmd: sudo dnf -y install openssh
    reference: https://installati.one/fedora/34/openssh/
    dsnap: openssh
  opensuse/zypper:
    cmd: sudo zypper install openssh
    reference: https://linuxways.net/opensuse/how-to-enable-ssh-on-opensuse/
binlist:
- openssh-client
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
