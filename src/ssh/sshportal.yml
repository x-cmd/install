lang: Go
homepage: https://v1.manfred.life/sshportal/
desc:
  cn: 一个简单、有趣且透明的 SSH（和 Telnet）跳板机
  en: simple, fun and transparent SSH (and telnet) bastion
rule:
  darwin/brew:
    cmd: brew install sshportal
    reference: https://formulae.brew.sh/formula/sshportal#default
  /go:
    cmd: GO111MODULE=on go get -u moul.io/sshportal
    reference: https://github.com/moul/sshportal?tab=readme-ov-file#manual-install
    dsnap: moul.io/sshportal
binlist:
- sshportal
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
