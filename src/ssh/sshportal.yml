lang: Go
homepage: https://v1.manfred.life/sshportal/
desc:
  cn: 一个简单、有趣且透明的 SSH（和 Telnet）跳板机
  en: simple, fun and transparent SSH (and telnet) bastion
rule:
  darwin/brew:
    cmd: brew install sshportal
    reference: https://formulae.brew.sh/formula/sshportal#default
  /go:
    cmd: GO111MODULE=on go get -u moul.io/sshportal
    reference: https://github.com/moul/sshportal?tab=readme-ov-file#manual-install
    dsnap: moul.io/sshportal

x:
  brew: sshportal
binlist:
- sshportal
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
