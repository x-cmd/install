lang: C
homepage: https://github.com/openssh/openssh-portable
desc:
  cn: openssh-server 是 OpenSSH 连接工具的服务端
  en: openssh-server is the server side of the OpenSSH connection tool
  cs: openssh-server je serverová strana nástroje pro připojování OpenSSH
  de: openssh-server ist die Serverseite des OpenSSH-Verbindungswerkzeugs
  es: openssh-server es el lado del servidor de la herramienta de conexión OpenSSH
  fr: openssh-server est le côté serveur de l'outil de connexion OpenSSH
  id: openssh-server adalah sisi server dari alat koneksi OpenSSH
  it: openssh-server è il lato server dello strumento di connessione OpenSSH
  ja: openssh-server は OpenSSH 接続ツールのサーバー側です
  ko: openssh-server는 OpenSSH 연결 도구의 서버 측입니다
  pl: openssh-server to strona serwerowa narzędzia połączenia OpenSSH
  pt: openssh-server é o lado do servidor da ferramenta de conexão OpenSSH
  ro: openssh-server este partea de server a instrumentului de conectare OpenSSH
  ru: openssh-server — это серверная сторона инструмента подключения OpenSSH
  th: openssh-server เป็นฝั่งเซิร์ฟเวอร์ของเครื่องมือเชื่อมต่อ OpenSSH
  tr: openssh-server, OpenSSH bağlantı aracının sunucu tarafıdır
  uk: openssh-server — це серверна сторона інструмента підключення OpenSSH
  vi: openssh-server là phía máy chủ của công cụ kết nối OpenSSH
x:
  source: https://github.com/openssh/openssh-portable
  apt: openssh-server
  dnf: openssh-server
  brew: openssh
  apk: openssh
  apt-get: openssh-server
  zypper: openssh
  pacman: openssh
rule:
  darwin/brew:
    cmd: brew install openssh
    reference: https://formulae.brew.sh/formula/openssh#default
  debian/apt:
    cmd: sudo apt-get install openssh-server
    reference: https://www.cyberciti.biz/faq/ubuntu-linux-install-openssh-server/
    dsnap: openssh-server
  ubuntu/apt:
    cmd: sudo apt-get install openssh-server
    reference: https://www.cyberciti.biz/faq/ubuntu-linux-install-openssh-server/
    dsnap: openssh-server
  alpine/apk:
    cmd: apk add openssh
    reference: https://www.cyberciti.biz/faq/how-to-install-openssh-server-on-alpine-linux-including-docker/
    dsnap: openssh
  arch/pacman:
    cmd: sudo pacman -Sy openssh
    reference: https://www.unixmen.com/how-to-install-openssh-in-archinux/
  kali/apt:
    cmd: sudo apt install openssh-server
    reference: https://www.kali.org/tools/openssh/
    dsnap: openssh-server
  centos/yum:
    cmd: sudo yum -y install openssh-server openssh-server
    reference: https://phoenixnap.com/kb/how-to-enable-ssh-centos-7
  fedora/dnf:
    cmd: sudo dnf install openssh-server
    reference: https://linuxconfig.org/how-to-install-start-and-connect-to-ssh-server-on-fedora-linux
    dsnap: openssh-server
  opensuse/zypper:
    cmd: sudo zypper install openssh
    reference: https://linuxways.net/opensuse/how-to-enable-ssh-on-opensuse/
binlist:
- openssh-server
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
