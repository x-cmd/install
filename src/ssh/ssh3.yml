lang: Go
homepage: https://github.com/francoismichel/ssh3
license: Apache-2.0
desc:
  cn: SSH3 是对 SSH 协议的彻底重新审视，将其语义映射到 HTTP 机制之上
  en: SSH3 is a complete revisit of the SSH protocol, mapping its semantics on top of the HTTP mechanisms
x:
  source: https://github.com/francoismichel/ssh3
  eget: https://github.com/francoismichel/ssh3
rule:
  /eget:
    cmd: x eget francoismichel/ssh3
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/francoismichel/ssh3/cmd/...@latest
    reference: https://github.com/francoismichel/ssh3?tab=readme-ov-file#installing-ssh3-and-ssh3-server-using-go-install
    dsnap: github.com/francoismichel/ssh3/cmd/...@latest
  darwin/brew:
    cmd: brew install ssh3
    reference: https://formulae.brew.sh/formula/ssh3#default
  (win|wsl2)/scoop:
    cmd: x scoop bucket add main && x scoop install main/ssh3
    reference: https://scoop.sh/#/apps?q=ssh3
  arch/yay:
    cmd: yay -S ssh3
    reference: https://aur.archlinux.org/packages/ssh3
binlist:
- ssh3

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
