lang: Go
homepage: https://github.com/francoismichel/ssh3
license: Apache-2.0
desc:
  cn: SSH3 是对 SSH 协议的彻底重新审视，将其语义映射到 HTTP 机制之上
  en: SSH3 is a complete revisit of the SSH protocol, mapping its semantics on top of the HTTP mechanisms
  cs: SSH3 je důkladný přehodnocení protokolu SSH, které mapuje jeho sémantiku na mechanizmy HTTP
  de: SSH3 ist eine vollständige Neugestaltung des SSH-Protokolls, die dessen Semantik auf die HTTP-Mechanismen abbildet
  es: SSH3 es un replanteamiento completo del protocolo SSH, que mapea su semántica sobre los mecanismos de HTTP
  fr: SSH3 est une refonte complète du protocole SSH, qui mappe sa sémantique sur les mécanismes de HTTP
  id: SSH3 adalah peninjauan ulang menyeluruh atas protokol SSH, memetakan semantiknya di atas mekanisme HTTP
  it: SSH3 è un ripensamento completo del protocollo SSH, che ne mappa la semantica sui meccanismi HTTP
  ja: SSH3 は SSH プロトコルを完全に見直したもので、そのセマンティクスを HTTP の仕組みにマッピングしています
  ko: SSH3는 SSH 프로토콜을 완전히 재검토하여 그 의미를 HTTP 메커니즘 위에 매핑한 것입니다
  pl: SSH3 to całkowite przemyślenie protokołu SSH, mapujące jego semantykę na mechanizmy HTTP
  pt: SSH3 é uma reformulação completa do protocolo SSH, mapeando sua semântica sobre os mecanismos do HTTP
  ro: SSH3 este o revizuire completă a protocolului SSH, care își mapează semantica peste mecanismele HTTP
  ru: SSH3 — полная переработка протокола SSH, отображающая его семантику поверх механизмов HTTP
  th: SSH3 เป็นการปรับโฉมโปรโตคอล SSH ใหม่ทั้งหมด โดยนำความหมายของมันมาแมปบนกลไกของ HTTP
  tr: SSH3, anlambilirini HTTP mekanizmalarının üzerine eşleyen, SSH protokolünün kapsamlı bir yeniden ele alımıdır
  uk: SSH3 — повна переробка протоколу SSH, що відображає його семантику поверх механізмів HTTP
  vi: SSH3 là sự xem xét lại toàn diện giao thức SSH, ánh xạ ngữ nghĩa của nó lên trên các cơ chế HTTP
x:
  source: https://github.com/francoismichel/ssh3
  eget: francoismichel/ssh3
  brew: ssh3
  scoop: main/ssh3
  yay: ssh3
  go: github.com/francoismichel/ssh3/cmd/...@latest
rule:
  /eget:
    cmd: x eget francoismichel/ssh3
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/francoismichel/ssh3/cmd/...@latest
    reference: https://github.com/francoismichel/ssh3?tab=readme-ov-file#installing-ssh3-and-ssh3-server-using-go-install
    dsnap: github.com/francoismichel/ssh3/cmd/...@latest
  darwin/brew:
    cmd: brew install ssh3
    reference: https://formulae.brew.sh/formula/ssh3#default
  (win|wsl2)/scoop:
    cmd: x scoop bucket add main && x scoop install main/ssh3
    reference: https://scoop.sh/#/apps?q=ssh3
  arch/yay:
    cmd: yay -S ssh3
    reference: https://aur.archlinux.org/packages/ssh3
binlist:
- ssh3

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
