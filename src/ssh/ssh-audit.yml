lang: Python
desc:
  cn: 一个用于 ssh 服务器和客户端配置审核的工具
  en: ssh-audit is a tool for ssh server & client configuration auditing.
homepage: https://github.com/jtesta/ssh-audit
license: MIT
x:
  source: https://github.com/jtesta/ssh-audit
  eget: jtesta/ssh-audit
  snap: ssh-audit
  yay: ssh-audit-git
  pip: ssh-audit
rule:
  /eget:
    cmd: x eget jtesta/ssh-audit
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use ssh-audit
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: x pip3 install ssh-audit
    reference: https://github.com/jtesta/ssh-audit#pre-built-packages
  /snap:
    cmd: snap install ssh-audit
    reference: https://github.com/jtesta/ssh-audit#pre-built-packages
  /docker:
    cmd: 'docker pull positronsecurity/ssh-audit

      docker run -it -p 2222:2222 positronsecurity/ssh-audit 10.1.1.1

      '
    reference: https://github.com/jtesta/ssh-audit#pre-built-packages
  arch/yay:
    cmd: yay -S ssh-audit-git
    reference: https://aur.archlinux.org/packages/ssh-audit-git
binlist:
- ssh-audit

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 33 KB
          rating: 1
          desc:
            cn: 约 33 KB（估算）
            en: ~33 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
