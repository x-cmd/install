lang: 'Go'
homepage: 'https://github.com/blacknon/lssh'
license: 'MIT'
desc:
  cn: 原生终端的远程访问套件，覆盖 SSH、云资产清单、并行命令、mux 工作区、文件传输与监控
  en: 'A terminal-native remote access suite for SSH, cloud inventories, provider-backed connectors, parallel commands, mux workspaces, file transfer, and monitoring.'
x:
  source: https://github.com/blacknon/lssh
  eget: https://github.com/blacknon/lssh
rule:
  /eget:
    cmd: x eget blacknon/lssh
    reference: https://github.com/blacknon/lssh
binlist:
- 'lssh'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 174 MB
          rating: 3
          desc:
            cn: 安装 174 MB
            en: 174 MB install
        download:
          estimate: 174 MB
          desc:
            cn: 约 174 MB 下载 (linux/x64)
            en: ~174 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
