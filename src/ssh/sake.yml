lang: Go
homepage: https://github.com/alajmo/sake
license: MIT
desc:
  cn: sake 是一个用于本地和远程主机的命令执行工具。
  en: sake is a command runner for local and remote hosts.
  cs: sake je nástroj pro spouštění příkazů na místních a vzdálených hostitelích.
  de: sake ist ein Befehlsausführer für lokale und entfernte Hosts.
  es: sake es un ejecutor de comandos para hosts locales y remotos.
  fr: sake est un exécuteur de commandes pour les hôtes locaux et distants.
  id: sake adalah pelari perintah untuk host lokal dan remote.
  it: sake è un esecutore di comandi per host locali e remoti.
  ja: sake はローカルおよびリモートホストでコマンドを実行するためのツールです。
  ko: sake는 로컬 및 원격 호스트에서 명령을 실행하는 도구입니다.
  pl: sake to narzędzie do uruchamiania poleceń na hostach lokalnych i zdalnych.
  pt: sake é um executor de comandos para hosts locais e remotos.
  ro: sake este un executor de comenzi pentru gazde locale și la distanță.
  ru: sake — инструмент выполнения команд на локальных и удалённых узлах.
  th: sake เป็นเครื่องมือรันคำสั่งสำหรับโฮสต์ในเครื่องและระยะไกล
  tr: sake, yerel ve uzak ana bilgisayarlar için bir komut çalıştırıcısıdır.
  uk: sake — інструмент виконання команд на локальних і віддалених вузлах.
  vi: sake là công cụ chạy lệnh cho các máy cục bộ và từ xa.
x:
  source: https://github.com/alajmo/sake
  eget: alajmo/sake
  brew: alajmo/sake/sake
  pacman: sake
  port: sake
  go: github.com/alajmo/sake@latest
rule:
  /eget:
    cmd: x eget alajmo/sake
    reference: https://x-cmd.com/mod/eget
  linux/curl:
    cmd: curl -sfL https://raw.githubusercontent.com/alajmo/sake/main/install.sh | sh
    reference: https://sakecli.com/installation
  darwin/curl:
    cmd: curl -sfL https://raw.githubusercontent.com/alajmo/sake/main/install.sh | sh
    reference: https://sakecli.com/installation
  linux/brew:
    cmd: brew tap alajmo/sake && brew install sake
    reference: https://sakecli.com/installation
  darwin/brew:
    cmd: brew tap alajmo/sake && brew install sake
    reference: https://sakecli.com/installation
  darwin/port:
    cmd: sudo port install sake
    reference: https://sakecli.com/installation/
  arch/pacman:
    cmd: sudo pacman -S sake
    reference: https://sakecli.com/installation/
  freebsd/pkg:
    cmd: pkg install sake
    reference: https://sakecli.com/installation/
  /go:
    cmd: go install github.com/alajmo/sake@latest
    reference: https://sakecli.com/installation/
    dsnap: github.com/alajmo/sake@latest
binlist:
- sake

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
