lang: Go
homepage: https://github.com/moul/assh
license: MIT
desc:
  cn: assh 是一个智能工具，旨在紧密包裹您的 SSH 和增强它，就像一个超级英雄服装，有各种小工具安装
  en: assh is a smart tool that was designed to wrap tightly around your SSH and enhance it, like a superhero suit that has various gadgets installed
x:
  source: https://github.com/moul/assh
  eget: moul/assh
  brew: assh
  yay: assh-bin
  go: moul.io/assh/v2@latest
  asdf: assh
rule:
  /x:
    cmd: x pkg use assh
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget moul/assh
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use assh
    reference: https://github.com/zekker6/asdf-assh
  /go:
    cmd: go install moul.io/assh/v2@latest
    reference: https://github.com/moul/assh?tab=readme-ov-file#install
    dsnap: moul.io/assh/v2
  darwin/brew:
    cmd: brew install assh
    reference: https://github.com/moul/assh?tab=readme-ov-file#install
  arch/yay:
    cmd: yay -S assh-bin
    reference: https://aur.archlinux.org/packages/assh-bin
binlist:
- assh

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (linux/x64)
            en: ~8 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
