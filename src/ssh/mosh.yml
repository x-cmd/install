lang: C++
homepage: https://github.com/mobile-shell/mosh
license: GPL-3.0
desc:
  cn: Mosh 是一种替代交互式 SSH 终端的工具。它在 Wi-Fi、蜂窝网络和长距离连接上更加稳定和灵敏。
  en: Mosh is a replacement for interactive SSH terminals. It's more robust and responsive, especially over Wi-Fi, cellular, and long-distance links.
x:
  source: https://github.com/mobile-shell/mosh
  eget: https://github.com/mobile-shell/mosh
rule:
  /eget:
    cmd: x eget mobile-shell/mosh
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install mosh
    reference: https://mosh.org/#getting
  darwin/port:
    cmd: sudo port install mosh
    reference: https://mosh.org/#getting
  alpine/apk:
    cmd: apk add mosh
    reference: https://mosh.org/#getting
    dsnap: mosh
  arch/pacman:
    cmd: sudo pacman -S mosh
    reference: https://mosh.org/#getting
  debian/apt:
    cmd: sudo apt-get install mosh
    reference: https://mosh.org/#getting
    dsnap: mosh
  ubuntu/apt:
    cmd: sudo apt-get install mosh
    reference: https://mosh.org/#getting
    dsnap: mosh
  fedora/dnf:
    cmd: sudo dnf install mosh
    reference: https://mosh.org/#getting
    dsnap: mosh
  gentoo/emerge:
    cmd: sudo emerge net-misc/mosh
    reference: https://mosh.org/#getting
  guixsd/guix:
    cmd: sudo guix package -i mosh
    reference: https://mosh.org/#getting
  opensuse/zypper:
    cmd: sudo zypper in mosh
    reference: https://mosh.org/#getting
  freebsd/pkg:
    cmd: pkg install net/mosh
    reference: https://mosh.org/#getting
  openbsd/pkg_add:
    cmd: pkg_add mosh
    reference: https://mosh.org/#getting
  netbsd/make:
    cmd: cd net/mosh; make install clean
    reference: https://mosh.org/#getting
  opencsw/pkgutil:
    cmd: pkgutil -i mosh
    reference: https://mosh.org/#getting
binlist:
- mosh

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
