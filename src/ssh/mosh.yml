      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 896 KB
          rating: 1
          desc:
            cn: 约 896 KB（估算）
            en: ~896 KB estimated
        download:
          estimate: 164 KB
          desc:
            cn: 约 164 KB 下载 (macos/arm64)
            en: ~164 KB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
