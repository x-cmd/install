lang: Rust
homepage: https://github.com/quantumsheep/sshs
license: MIT
desc:
  cn: 用于管理 SSH 连接的 TUI 工具
  en: A TUI tool for managing SSH connections
x:
  source: https://github.com/quantumsheep/sshs
  eget: quantumsheep/sshs
  brew: sshs
  pacman: sshs
  apk: sshs
  scoop: extras/sshs
  choco: sshs
  nix: 'github:quantumsheep/sshs'
rule:
  /eget:
    cmd: x eget quantumsheep/sshs
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install --git https://github.com/quantumsheep/sshs
    reference: https://github.com/quantumsheep/sshs?tab=readme-ov-file#from-sources
    dsnap: https://github.com/quantumsheep/sshs
  darwin/brew:
    cmd: brew install sshs
    reference: https://github.com/quantumsheep/sshs?tab=readme-ov-file#homebrew
  linux/brew:
    cmd: brew install sshs
    reference: https://github.com/quantumsheep/sshs?tab=readme-ov-file#homebrew
  (win|wsl2)/choco:
    cmd: x choco install sshs
    reference: https://github.com/quantumsheep/sshs?tab=readme-ov-file#chocolatey
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras && \

      x scoop install extras/sshs

      '
    reference: https://scoop.sh/#/apps?q=sshs&id=c56d6b708809daa775746de1590f0622f063641f
  arch/pacman:
    cmd: sudo pacman -S sshs
    reference: https://github.com/quantumsheep/sshs?tab=readme-ov-file#arch-linux
  alpine/apk:
    cmd: apk add sshs
    reference: https://github.com/quantumsheep/sshs?tab=readme-ov-file#alpine-linux
    dsnap: sshs
  nix/nix:
    cmd: nix profile install 'github:quantumsheep/sshs'
    reference: https://github.com/quantumsheep/sshs?tab=readme-ov-file#nixos--nix
binlist:
- sshs

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 70 KB
          rating: 1
          desc:
            cn: 约 70 KB（估算）
            en: ~70 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
