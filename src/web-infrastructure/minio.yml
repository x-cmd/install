lang: Go
homepage: https://github.com/minio/minio
license: AGPL-3.0
desc:
  cn: MinIO 是一个高性能、兼容 S3 的对象存储
  en: MinIO is a high-performance, S3 compatible object store
  cs: MinIO je vysoce výkonné úložiště objektů kompatibilní s S3
  de: MinIO ist ein hochleistungsfähiger, S3-kompatibler Objektspeicher
  es: MinIO es un almacén de objetos de alto rendimiento compatible con S3
  fr: MinIO est un stockage d'objets performant compatible avec S3
  id: MinIO adalah penyimpanan objek berkinerja tinggi yang kompatibel dengan S3
  it: MinIO è un object store ad alte prestazioni compatibile con S3
  ja: MinIO は S3 互換の高性能オブジェクトストレージです
  ko: MinIO는 S3 호환 고성능 객체 스토리지입니다
  pl: MinIO to wysokowydajności magazyn obiektów zgodny z S3
  pt: O MinIO é um armazenamento de objetos de alto desempenho compatível com S3
  ro: MinIO este un depozit de obiecte de înaltă performanță compatibil cu S3
  ru: MinIO — высокопроизводительное объектное хранилище, совместимое с S3
  th: MinIO คือที่เก็บข้อมูลอ็อบเจกต์ประสิทธิภาพสูงที่เข้ากันได้กับ S3
  tr: MinIO, S3 uyumlu yüksek performanslı bir nesne deposudur
  uk: MinIO — високопродуктивне об'єктне сховище, сумісне з S3
  vi: MinIO là kho lưu trữ đối tượng hiệu năng cao tương thích với S3
x:
  source: https://github.com/minio/minio
  brew: minio/stable/minio
  yay: minio
  pip: minio
rule:
  darwin/brew:
    cmd: 'brew install minio/stable/minio && \

      MINIO_ROOT_USER=admin MINIO_ROOT_PASSWORD=password minio server /mnt/data --console-address ":9001"

      '
    reference: https://min.io/download?license=agpl&platform=macos
  /go:
    cmd: go get github.com/minio/minio-go/v7
    reference: https://min.io/download?license=agpl&platform=linux
    dsnap: github.com/minio/minio-go/v7
  /npm:
    cmd: npm install --save minio
    reference: https://min.io/download?license=agpl&platform=linux
    dsnap: minio
  /pip:
    cmd: pip install minio
    reference: https://min.io/download?license=agpl&platform=linux
    dsnap: minio
  /stack:
    cmd: stack install minio-hs
    reference: https://min.io/download?license=agpl&platform=linux
  /vcpkg:
    cmd: vcpkg install minio-cpp
    reference: https://min.io/download?license=agpl&platform=linux
  /cargo:
    cmd: cargo add minio
    reference: https://min.io/download?license=agpl&platform=linux
    dsnap: minio
  arch/yay:
    cmd: yay -S minio
    reference: https://aur.archlinux.org/packages/minio
binlist:
- minio

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 21 MB
          rating: 2
          desc:
            cn: 约 21 MB（估算）
            en: ~21 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
