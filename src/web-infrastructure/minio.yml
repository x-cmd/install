lang: Go
homepage: https://github.com/minio/minio
license: AGPL-3.0
desc:
  cn: MinIO 是一个高性能、兼容 S3 的对象存储
  en: MinIO is a high-performance, S3 compatible object store
x:
  source: https://github.com/minio/minio
rule:
  darwin/brew:
    cmd: 'brew install minio/stable/minio && \

      MINIO_ROOT_USER=admin MINIO_ROOT_PASSWORD=password minio server /mnt/data --console-address ":9001"

      '
    reference: https://min.io/download?license=agpl&platform=macos
  /go:
    cmd: go get github.com/minio/minio-go/v7
    reference: https://min.io/download?license=agpl&platform=linux
    dsnap: github.com/minio/minio-go/v7
  /npm:
    cmd: npm install --save minio
    reference: https://min.io/download?license=agpl&platform=linux
    dsnap: minio
  /pip:
    cmd: pip install minio
    reference: https://min.io/download?license=agpl&platform=linux
    dsnap: minio
  /stack:
    cmd: stack install minio-hs
    reference: https://min.io/download?license=agpl&platform=linux
  /vcpkg:
    cmd: vcpkg install minio-cpp
    reference: https://min.io/download?license=agpl&platform=linux
  /cargo:
    cmd: cargo add minio
    reference: https://min.io/download?license=agpl&platform=linux
    dsnap: minio
  arch/yay:
    cmd: yay -S minio
    reference: https://aur.archlinux.org/packages/minio
binlist:
- minio

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
