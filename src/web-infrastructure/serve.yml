lang: TypeScript
homepage: https://github.com/vercel/serve#readme
license: MIT
desc:
  cn: 在本地设备或局域网上启动静态网站、单页应用，甚至是单个静态文件
  en: Serve static sites, single-page apps and assets (HTML, JavaScript, CSS, and images)
x:
  pkg:
    exist: true
  source: https://github.com/vercel/serve#readme
rule:
  /x:
    cmd: x pkg use serve
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global serve
    reference: https://github.com/vercel/serve?tab=readme-ov-file#usage
    dsnap: serve
binlist:
- serve

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
