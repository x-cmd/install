lang: Go
homepage: https://github.com/caddyserver/caddy
license: Apache-2.0
desc:
  cn: 多功能多平台的 HTTP/1-2-3 Web 服务器
  en: Fast, multi-platform web server with automatic HTTPS
x:
  pkg:
    exist: true
  source: https://github.com/caddyserver/caddy
rule:
  /x:
    cmd: x pkg use caddy
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use caddy
    reference: https://github.com/salasrod/asdf-caddy
  /build:
    cmd: 'git clone "https://github.com/caddyserver/caddy.git" \

      && cd caddy/cmd/caddy/ \

      && go build

      '
    reference: https://github.com/caddyserver/caddy?tab=readme-ov-file#for-development
  arch/yay:
    cmd: yay -S caddy-git
    reference: https://aur.archlinux.org/packages/caddy-git
binlist:
- caddy

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
