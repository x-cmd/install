lang: Go
homepage: https://github.com/caddyserver/caddy
license: Apache-2.0
desc:
  cn: 多功能多平台的 HTTP/1-2-3 Web 服务器
  en: Fast, multi-platform web server with automatic HTTPS
  cs: Rychlý víceplatformní webový server s automatickým HTTPS
  de: Schneller, plattformübergreifender Webserver mit automatischem HTTPS
  es: Servidor web rápido y multiplataforma con HTTPS automático
  fr: Serveur web rapide et multiplateforme avec HTTPS automatique
  id: Server web cepat multiplatform dengan HTTPS otomatis
  it: Server web veloce e multipiattaforma con HTTPS automatico
  ja: HTTPS を自動設定する高速なマルチプラットフォーム Web サーバー
  ko: 자동 HTTPS를 지원하는 빠르고 여러 플랫폼에서 동작하는 웹 서버
  pl: Szybki, wieloplatformowy serwer WWW z automatycznym HTTPS
  pt: Servidor web rápido e multiplataforma com HTTPS automático
  ro: Server web rapid și multiplatformă cu HTTPS automat
  ru: Быстрый кроссплатформенный веб-сервер с автоматическим HTTPS
  th: เว็บเซิร์ฟเวอร์ที่รวดเร็วและรองรับหลายแพลตฟอร์ม พร้อม HTTPS อัตโนมัติ
  tr: Otomatik HTTPS destekleyen hızlı, çok platformlu web sunucusu
  uk: Швидкий кросплатформний веб-сервер з автоматичним HTTPS
  vi: Máy chủ web nhanh, đa nền tảng với HTTPS tự động
x:
  source: https://github.com/caddyserver/caddy
  yay: caddy-git
  asdf: caddy
rule:
  /x:
    cmd: x pkg use caddy
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use caddy
    reference: https://github.com/salasrod/asdf-caddy
  /build:
    cmd: 'git clone "https://github.com/caddyserver/caddy.git" \

      && cd caddy/cmd/caddy/ \

      && go build

      '
    reference: https://github.com/caddyserver/caddy?tab=readme-ov-file#for-development
  arch/yay:
    cmd: yay -S caddy-git
    reference: https://aur.archlinux.org/packages/caddy-git
binlist:
- caddy

# already profiled
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 46 MB
          rating: 2
          desc:
            cn: 安装 46 MB
            en: 46 MB install
        download:
          estimate: 16 MB
          desc:
            cn: 约 16 MB 下载 (linux/x64)
            en: ~16 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
