lang: Rust
homepage: https://github.com/rustfs/cli
license: Apache-2.0
desc:
  cn: 用 Rust 编写的与 S3 兼容的命令行客户端
  en: A S3-compatible command-line client written in Rust
x:
  source: https://github.com/rustfs/cli
rule:
  (darwin|linux)/brew:
    cmd: brew install rustfs/tap/rc
    reference: https://github.com/rustfs/cli?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: |
      scoop bucket add rustfs https://github.com/rustfs/scoop-bucket
      scoop install rustfs/rc
    reference: https://github.com/rustfs/cli?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install rustfs-cli
    reference: https://github.com/rustfs/cli?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S rustfs-cli-bin
    reference: https://aur.archlinux.org/packages/rustfs-cli-bin
binlist:
  - rc

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
