lang: Python
desc:
  cn: nginx 服务器的实时监控工具
  en: Real-time monitoring tool for nginx server
  cs: Nástroj pro monitorování serveru nginx v reálném čase
  de: Echtzeit-Überwachungstool für nginx-Server
  es: Herramienta de monitorización en tiempo real para el servidor nginx
  fr: Outil de surveillance en temps réel pour le serveur nginx
  id: Alat pemantauan waktu nyata untuk server nginx
  it: Strumento di monitoraggio in tempo reale per il server nginx
  ja: nginx サーバをリアルタイムで監視するツール
  ko: nginx 서버를 실시간으로 모니터링하는 도구
  pl: Narzędzie do monitorowania serwera nginx w czasie rzeczywistym
  pt: Ferramenta de monitoramento em tempo real para o servidor nginx
  ro: Instrument de monitorizare în timp real pentru serverul nginx
  ru: Инструмент мониторинга сервера nginx в реальном времени
  th: เครื่องมือติดตามเซิร์ฟเวอร์ nginx แบบเรียลไทม์
  tr: nginx sunucusu için gerçek zamanlı izleme aracı
  uk: Інструмент моніторингу сервера nginx у реальному часі
  vi: Công cụ giám sát thời gian thực cho máy chủ nginx
homepage: https://github.com/lebinh/ngxtop
license: MIT
x:
  source: https://github.com/lebinh/ngxtop
  pip: ngxtop
rule:
  /x:
    cmd: x pkg use ngxtop
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install ngxtop
    reference: https://github.com/lebinh/ngxtop?tab=readme-ov-file#installation
    dsnap: ngxtop
binlist:
- ngxtop

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 KB
          rating: 1
          desc:
            cn: 约 2 KB（估算）
            en: ~2 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
