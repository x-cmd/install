lang: Python
desc:
  cn: nginx 服务器的实时监控工具
  en: Real-time monitoring tool for nginx server
homepage: https://github.com/lebinh/ngxtop
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/lebinh/ngxtop
rule:
  /x:
    cmd: x pkg use ngxtop
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install ngxtop
    reference: https://github.com/lebinh/ngxtop?tab=readme-ov-file#installation
    dsnap: ngxtop
binlist:
- ngxtop

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
