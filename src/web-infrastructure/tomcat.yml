lang: Java
homepage: https://github.com/apache/tomcat
license: Apache-2.0
desc:
  cn: Apache Tomcat
  en: Apache Tomcat
x:
  source: https://github.com/apache/tomcat
rule:
  /asdf:
    cmd: x asdf use tomcat
    reference: https://github.com/mbutov/asdf-tomcat
  darwin/brew:
    cmd: brew install tomcat
    reference: https://formulae.brew.sh/formula/tomcat#default
  centos/yum:
    cmd: sudo yum install tomcat
    reference: https://command-not-found.com/tomcat
  fedora/dnf:
    cmd: sudo dnf install tomcat-1
    reference: https://command-not-found.com/tomcat
binlist:
- tomcat

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
