lang: Java
homepage: https://github.com/apache/tomcat
license: Apache-2.0
desc:
  cn: Apache Tomcat
  en: Apache Tomcat
x:
  source: https://github.com/apache/tomcat
rule:
  /asdf:
    cmd: x asdf use tomcat
    reference: https://github.com/mbutov/asdf-tomcat
  darwin/brew:
    cmd: brew install tomcat
    reference: https://formulae.brew.sh/formula/tomcat#default
  centos/yum:
    cmd: sudo yum install tomcat
    reference: https://command-not-found.com/tomcat
  fedora/dnf:
    cmd: sudo dnf install tomcat-1
    reference: https://command-not-found.com/tomcat
binlist:
- tomcat

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.7 MB
          rating: 1
          desc:
            cn: 约 9.7 MB（估算）
            en: ~9.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
