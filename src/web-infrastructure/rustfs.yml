lang: Rust
homepage: https://github.com/rustfs/rustfs
license: Apache-2.0
desc:
  cn: 用 Rust 构建的高性能分布式对象存储系统
  en: A high-performance, distributed object storage system built in Rust
  cs: Vysoce výkonný distribuovaný systém úložiště objektů postavený v Rustu
  de: Ein in Rust entwickeltes, hochleistungsfähiges verteiltes Objektspeichersystem
  es: Sistema de almacenamiento de objetos distribuido y de alto rendimiento construido en Rust
  fr: Un système de stockage d'objets distribué et performant conçu en Rust
  id: Sistem penyimpanan objek terdistribusi berkinerja tinggi yang dibangun dengan Rust
  it: Un sistema di archiviazione oggetti distribuito ad alte prestazioni costruito in Rust
  ja: Rust で構築された高性能な分散オブジェクトストレージシステム
  ko: Rust로 구축된 고성능 분산 객체 스토리지 시스템
  pl: Wysokowydajny rozproszony system magazynowania obiektów zbudowany w Rust
  pt: Um sistema de armazenamento de objetos distribuído e de alto desempenho construído em Rust
  ro: Un sistem de stocare distribuită de obiecte, de înaltă performanță, construit în Rust
  ru: Высокопроизводительная распределённая система объектного хранения, построенная на Rust
  th: ระบบจัดเก็บอ็อบเจกต์แบบกระจายประสิทธิภาพสูงที่สร้างด้วย Rust
  tr: Rust ile derlenmiş, yüksek performanslı dağıtık nesne depolama sistemi
  uk: Високопродуктивна розподілена система об'єктного зберігання, побудована на Rust
  vi: Hệ thống lưu trữ đối tượng phân tán hiệu năng cao được xây dựng bằng Rust
x:
  source: https://github.com/rustfs/rustfs
  brew: rustfs
  yay: rustfs
rule:
  /x:
    cmd: x pkg use rustfs
    reference: https://x-cmd.com/install/
  /curl:
    cmd: curl -O https://rustfs.com/install_rustfs.sh && bash install_rustfs.sh
    reference: https://rustfs.com/download/?platform=linux
  darwin/rustfs:
    cmd: brew tap rustfs/homebrew-tap && brew install rustfs
    reference: https://rustfs.com/download/?platform=macos
  /docker:
    cmd: |
      docker pull rustfs/rustfs:latest
      docker run -d \
        --name rustfs \
        -p 9000:9000 \
        -p 9001:9001 \
        -v /data:/data \
        rustfs/rustfs:latest
    reference: https://rustfs.com/download/?platform=docker
  arch/yay:
    cmd: yay -S rustfs
    reference: https://aur.archlinux.org/packages/rustfs
binlist:
  - rustfs

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 58 MB
          rating: 3
          desc:
            cn: 约 58 MB（估算）
            en: ~58 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
