          desc:
            cn: 安装 58 MB
            en: 58 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 63 MB
        desc:
          cn: 63 MB
          en: 63 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
