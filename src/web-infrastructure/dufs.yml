lang: Rust
homepage: https://github.com/sigoden/dufs
license: Apache-2.0
desc:
  cn: Dufs 是一款独特的实用文件服务器，支持静态服务、上传、搜索、访问控制、webdav...
  en: Dufs is a distinctive utility file server that supports static serving, uploading, searching, accessing control, webdav...
  cs: Dufs je výjimečný užitečný souborový server, který podporuje statické servírování, nahrávání, vyhledávání, řízení přístupu a webdav...
  de: Dufs ist ein charakteristischer Utility-Dateiserver, der statisches Ausliefern, Hochladen, Suchen, Zugriffskontrolle und WebDAV unterstützt...
  es: Dufs es un servidor de archivos utilitario y distintivo que admite servicio estático, subida, búsqueda, control de acceso y webdav...
  fr: Dufs est un serveur de fichiers utilitaire et original qui prend en charge le service statique, l'envoi de fichiers, la recherche, le contrôle d'accès et WebDAV...
  id: Dufs adalah server berkas utilitas yang khas dengan dukungan penyajian statis, unggah, pencarian, kontrol akses, dan webdav...
  it: Dufs è un server di file utility distintivo che supporta il servizio statico, il caricamento, la ricerca, il controllo degli accessi e webdav...
  ja: Dufs は、静的配信、アップロード、検索、アクセス制御、webdav に対応した独特な実用ファイルサーバーです...
  ko: Dufs는 정적 서빙, 업로드, 검색, 접근 제어, webdav를 지원하는 독특한 실용 파일 서버입니다...
  pl: Dufs to charakterystyczny użyteczny serwer plików, który obsługuje statyczne udostępnianie, przesyłanie, wyszukiwanie, kontrolę dostępu i webdav...
  pt: O Dufs é um servidor de arquivos utilitário e distinto que oferece suporte a serviço estático, upload, busca, controle de acesso e webdav...
  ro: Dufs este un server de fișiere utilitar și distinct, care acceptă servirea statică, încărcarea, căutarea, controlul accesului și webdav...
  ru: "Dufs — это удобный файловый сервер с необычным набором возможностей: статическая раздача, загрузка, поиск, контроль доступа и webdav..."
  th: Dufs เป็นเซิร์ฟเวอร์ไฟล์ที่ใช้งานได้จริงและมีเอกลักษณ์ รองรับการเสิร์ฟแบบคงที่ การอัปโหลด การค้นหา การควบคุมการเข้าถึง และ webdav...
  tr: Dufs, statik sunmayı, yüklemeyi, aramayı, erişim denetimini ve webdav'ı destekleyen ayırt edici bir pratik dosya sunucusudur...
  uk: "Dufs — це зручний файловий сервер з характерним набором можливостей: статична роздача, завантаження, пошук, контроль доступу та webdav..."
  vi: Dufs là máy chủ tệp thực dụng với nét đặc trưng, hỗ trợ phục vụ tĩnh, tải lên, tìm kiếm, kiểm soát truy cập và webdav...
x:
  source: https://github.com/sigoden/dufs
  eget: sigoden/dufs
  brew: dufs
  yay: dufs
  cargo: dufs
rule:
  /x:
    cmd: x pkg use dufs
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget sigoden/dufs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install dufs
    reference: https://github.com/sigoden/dufs?tab=readme-ov-file#with-homebrew
  /cargo:
    cmd: cargo install dufs
    reference: https://github.com/sigoden/dufs?tab=readme-ov-file#with-cargo
    dsnap: dufs
  arch/yay:
    cmd: yay -S dufs
    reference: https://aur.archlinux.org/packages/dufs
binlist:
- dufs

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
