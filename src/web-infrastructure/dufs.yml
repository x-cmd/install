lang: Rust
homepage: https://github.com/sigoden/dufs
license: Apache-2.0
desc:
  cn: Dufs 是一款独特的实用文件服务器，支持静态服务、上传、搜索、访问控制、webdav...
  en: Dufs is a distinctive utility file server that supports static serving, uploading, searching, accessing control, webdav...
x:
  pkg:
    exist: true
  source: https://github.com/sigoden/dufs
  eget: https://github.com/sigoden/dufs
rule:
  /x:
    cmd: x pkg use dufs
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget sigoden/dufs
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install dufs
    reference: https://github.com/sigoden/dufs?tab=readme-ov-file#with-homebrew
  /cargo:
    cmd: cargo install dufs
    reference: https://github.com/sigoden/dufs?tab=readme-ov-file#with-cargo
    dsnap: dufs
  arch/yay:
    cmd: yay -S dufs
    reference: https://aur.archlinux.org/packages/dufs
binlist:
- dufs

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
