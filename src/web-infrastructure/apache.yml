lang: C
homepage: https://github.com/apache/httpd
license: Apache-2.0
desc:
  cn: Apache HTTP 服务器项目致力于为现代操作系统（包括 UNIX 和 Windows）开发和维护开源 HTTP 服务器
  en: The Apache HTTP Server Project is an effort to develop and maintain an open-source HTTP server for modern operating systems including UNIX and Windows
  cs: Projekt Apache HTTP Server se snaží vyvíjet a udržovat open-source HTTP server pro moderní operační systémy včetně UNIX a Windows
  de: Das Apache HTTP Server Project ist ein Bestreben, einen quelloffenen HTTP-Server für moderne Betriebssysteme einschließlich UNIX und Windows zu entwickeln und zu pflegen
  es: El Proyecto Apache HTTP Server es un esfuerzo por desarrollar y mantener un servidor HTTP de código abierto para sistemas operativos modernos como UNIX y Windows
  fr: Le projet Apache HTTP Server est un effort pour développer et maintenir un serveur HTTP open source pour les systèmes d'exploitation modernes, notamment UNIX et Windows
  id: Proyek Apache HTTP Server adalah upaya untuk mengembangkan dan memelihara server HTTP sumber terbuka untuk sistem operasi modern termasuk UNIX dan Windows
  it: Il progetto Apache HTTP Server è un'iniziativa per sviluppare e mantenere un server HTTP open source per i sistemi operativi moderni, tra cui UNIX e Windows
  ja: Apache HTTP Server Project は、UNIX や Windows を含む近代的なオペレーティングシステム向けのオープンソース HTTP サーバの開発と保守を行っています
  ko: Apache HTTP Server Project는 UNIX와 Windows를 포함한 현대 운영 체제를 위한 오픈소스 HTTP 서버를 개발하고 유지하는 프로젝트입니다
  pl: Projekt Apache HTTP Server to dążenie do opracowywania i utrzymywania otwartego serwera HTTP dla nowoczesnych systemów operacyjnych, w tym UNIX i Windows
  pt: O Projeto Apache HTTP Server é um esforço para desenvolver e manter um servidor HTTP de código aberto para sistemas operacionais modernos, incluindo UNIX e Windows
  ro: Proiectul Apache HTTP Server este un efort de a dezvolta și menține un server HTTP open source pentru sisteme de operare moderne, inclusiv UNIX și Windows
  ru: Проект Apache HTTP Server — это усилие по разработке и поддержке HTTP-сервера с открытым исходным кодом для современных операционных систем, включая UNIX и Windows
  th: โครงการ Apache HTTP Server เป็นความพยายามในการพัฒนาและดูแลเซิร์ฟเวอร์ HTTP แบบโอเพนซอร์สสำหรับระบบปฏิบัติการสมัยใหม่ รวมถึง UNIX และ Windows
  tr: Apache HTTP Server Projesi, UNIX ve Windows dahil modern işletim sistemleri için açık kaynaklı bir HTTP sunucusu geliştirmeyi ve sürdürmeyi amaçlayan bir çalışmadır
  uk: Проєкт Apache HTTP Server — це зусилля щодо розробки та підтримки HTTP-сервера з відкритим кодом для сучасних операційних систем, зокрема UNIX і Windows
  vi: Dự án Apache HTTP Server là nỗ lực phát triển và duy trì máy chủ HTTP mã nguồn mở cho các hệ điều hành hiện đại, bao gồm UNIX và Windows
x:
  source: https://github.com/apache/httpd
  apt: apache2
  dnf: httpd
  brew: httpd
  pacman: apache
  yum: httpd
rule:
  darwin/brew:
    cmd: brew install httpd
    reference: https://formulae.brew.sh/formula/httpd#default
  debian/apt:
    cmd: sudo apt install apache2
    reference: https://www.digitalocean.com/community/tutorials/how-to-install-the-apache-web-server-on-debian-11
    dsnap: apache2
  ubuntu/apt:
    cmd: sudo apt install apache2
    reference: https://ubuntu.com/tutorials/install-and-configure-apache#2-installing-apache
    dsnap: apache2
  arch/pacman:
    cmd: sudo pacman -S apache
    reference: https://www.atlantic.net/dedicated-server-hosting/how-to-install-apache-web-server-on-arch-linux/
  kali/apt:
    cmd: sudo apt install apache2
    reference: https://www.kali.org/tools/apache2/
    dsnap: apache2
  centos/yum:
    cmd: sudo yum install httpd
    reference: https://www.digitalocean.com/community/tutorials/how-to-install-the-apache-web-server-on-centos-7
  fedora/dnf:
    cmd: sudo dnf install httpd -y
    reference: https://docs.fedoraproject.org/en-US/quick-docs/getting-started-with-apache-http-server/
    dsnap: httpd
  raspbian/apt:
    cmd: sudo apt install apache2 -y
    reference: https://linuxhint.com/set-up-apache-web-server-raspberry-pi/
binlist:
- apache

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
