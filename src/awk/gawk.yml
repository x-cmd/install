lang: C
homepage: https://git.savannah.gnu.org/cgit/gawk.git
desc:
  en: The awk utility interprets a special-purpose programming language that makes it possible to handle simple data-reformatting jobs with just a few lines of code
  cn: Awk 实用程序解释了一种特殊用途的编程语言，它可以用几行代码处理简单的数据重新格式化工作
rule:
  darwin/brew:
    cmd: brew install gawk
    reference: https://formulae.brew.sh/formula/gawk#default
  debian/apt:
    cmd: sudo apt-get install gawk
    reference: https://command-not-found.com/gawk
    dsnap: gawk
  ubuntu/apt:
    cmd: sudo apt-get install gawk
    reference: https://command-not-found.com/gawk
    dsnap: gawk
  alpine/apk:
    cmd: sudo apk add gawk
    reference: https://command-not-found.com/gawk
    dsnap: gawk
  arch/pacman:
    cmd: sudo pacman -S gawk
    reference: https://command-not-found.com/gawk
  kali/apt:
    cmd: sudo apt-get install gawk
    reference: https://command-not-found.com/gawk
    dsnap: gawk
  centos/dnf:
    cmd: sudo dnf install gawk
    reference: https://command-not-found.com/gawk
  fedora/yum:
    cmd: sudo yum install gawk
    reference: https://command-not-found.com/gawk
  raspbian/apt:
    cmd: sudo apt-get install gawk
    reference: https://command-not-found.com/gawk
  gentoo/emerge:
    cmd: sudo emerge gawk
    reference: http://blog.fpliu.com/it/software/GNU/awk
  opensuse/zypper:
    cmd: sudo zypper install -y gawk
    reference: http://blog.fpliu.com/it/software/GNU/awk

x:
  apt: gawk
  apt-get: gawk
  dnf: gawk
  yum: gawk
  pacman: gawk
  apk: gawk
  emerge: gawk
  brew: gawk
binlist:
- gawk
license: NOASSERTION

# complicated
footprint:
