lang: C
homepage: https://github.com/mturk/nawk
desc:
  en: '"The one true awk" descended from UNIX V7'
  cn: '"真正的 awk" 源自 UNIX V7'
x:
  source: https://github.com/mturk/nawk
rule:
  arch/pacman:
    cmd: sudo pacman -S nawk
    reference: https://command-not-found.com/nawk
  fedora/dnf:
    cmd: sudo dnf install nawk
    reference: https://command-not-found.com/nawk
    dsnap: nawk
binlist:
- nawk
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
