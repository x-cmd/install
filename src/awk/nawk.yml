      size:
        install:
          estimate: 333 KB
          rating: 1
          desc:
            cn: 约 333 KB（估算）
            en: ~333 KB estimated
        download:
          estimate: 57 KB
          desc:
            cn: 约 57 KB 下载 (macos/x64)
            en: ~57 KB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
