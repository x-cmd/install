lang: C
homepage: https://github.com/onetrueawk/awk
desc:
  en: The original awk described in "The AWK Programming Language"
  cn: “AWK 编程语言” 中描述的最初 AWK
x:
  source: https://github.com/onetrueawk/awk
rule:
  debian/apt:
    cmd: sudo apt-get install original-awk
    reference: https://command-not-found.com/original-awk
    dsnap: original-awk
  ubuntu/apt:
    cmd: sudo apt-get install original-awk
    reference: https://command-not-found.com/original-awk
    dsnap: original-awk
  kali/apt:
    cmd: sudo apt-get install original-awk
    reference: https://command-not-found.com/original-awk
    dsnap: original-awk
  raspbian/apt:
    cmd: sudo apt-get install original-awk
    reference: https://command-not-found.com/original-awk
binlist:
- original-awk
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
