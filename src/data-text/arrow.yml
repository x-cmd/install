lang: C++
homepage: https://github.com/apache/arrow
license: Apache-2.0
desc:
  cn: ApacheArrow 是一个用于加速数据交换和内存处理的多语言工具箱
  en: Apache Arrow is a multi-language toolbox for accelerated data interchange and in-memory processing
x:
  source: https://github.com/apache/arrow
  eget: https://github.com/apache/arrow
  brew: apache-arrow
rule:
  /eget:
    cmd: x eget apache/arrow
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install apache-arrow
    reference: https://formulae.brew.sh/formula/apache-arrow#default
binlist:
- arrow

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 259 MB
          rating: 4
          desc:
            cn: 安装 259 MB
            en: 259 MB install
        download:
          estimate: 259 MB
          desc:
            cn: 约 259 MB 下载 (linux/x64)
            en: ~259 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB（估算）
          en: 50 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
