lang: C++
homepage: https://github.com/apache/arrow
license: Apache-2.0
desc:
  cn: ApacheArrow 是一个用于加速数据交换和内存处理的多语言工具箱
  en: Apache Arrow is a multi-language toolbox for accelerated data interchange and in-memory processing
x:
  source: https://github.com/apache/arrow
  eget: https://github.com/apache/arrow
rule:
  /eget:
    cmd: x eget apache/arrow
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install apache-arrow
    reference: https://formulae.brew.sh/formula/apache-arrow#default
binlist:
- arrow

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
