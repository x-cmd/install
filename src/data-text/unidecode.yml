lang: Python
homepage: https://github.com/avian2/unidecode#installation
license: GPL-2.0
desc:
  cn: 用 ASCII 转译 Unicode 文本
  en: ASCII transliterations of Unicode text
x:
  pkg:
    exist: true
  source: https://github.com/avian2/unidecode#installation
rule:
  /x:
    cmd: x pkg use unidecode
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install unidecode
    reference: https://github.com/avian2/unidecode#installation
    dsnap: unidecode
  debian/apt:
    cmd: sudo apt-get install python3-unidecode
    reference: https://command-not-found.com/unidecode
  ubuntu/apt:
    cmd: sudo apt-get install python3-unidecode
    reference: https://command-not-found.com/unidecode
  arch/pacman:
    cmd: sudo pacman -S python3-unidecode
    reference: https://command-not-found.com/unidecode
  kali/apt:
    cmd: sudo apt-get install python3-unidecode
    reference: https://command-not-found.com/unidecode
    dsnap: python3-unidecode
  fedora/dnf:
    cmd: sudo dnf install python3-unidecode
    reference: https://command-not-found.com/unidecode
  raspbian/apt:
    cmd: sudo apt-get install python3-unidecode
    reference: https://command-not-found.com/unidecode
binlist:
- unidecode

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
