lang: Rust
homepage: https://github.com/anistark/feluda
desc:
  cn: 检测项目中的许可证使用限制
  en: Detect license usage restrictions in your project!
x:
  source: https://github.com/anistark/feluda
  eget: https://github.com/anistark/feluda
rule:
  /eget:
    cmd: x eget anistark/feluda
    reference: https://github.com/anistark/feluda
binlist:
- feluda
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
