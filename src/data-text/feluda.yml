lang: Rust
homepage: https://github.com/anistark/feluda
desc:
  cn: 检测项目中的许可证使用限制
  en: Detect license usage restrictions in your project!
  cs: Zjistit omezení v používání licencí ve vašem projektu!
  de: Nutzungsbeschränkungen der Lizenz in Ihrem Projekt erkennen!
  es: ¡Detecta las restricciones de uso de la licencia en tu proyecto!
  fr: Détectez les restrictions d'utilisation de la licence dans votre projet !
  id: Deteksi pembatasan penggunaan lisensi di proyek Anda!
  it: Rileva le restrizioni d'uso della licenza nel tuo progetto!
  ja: プロジェクトにおけるライセンス使用の制限を検出します!
  ko: 프로젝트에서 라이선스 사용 제한을 감지하세요!
  pl: Wykryj ograniczenia użytkowania licencji w swoim projekcie!
  pt: Detecte as restrições de uso da licença no seu projeto!
  ro: Detectează restricțiile de utilizare a licenței în proiectul tău!
  ru: Выявляйте ограничения использования лицензии в вашем проекте!
  th: ตรวจจับข้อจำกัดการใช้สัญญาอนุญาตในโครงการของคุณ!
  tr: Projenizde lisans kullanımı kısıtlamalarını algılayın!
  uk: Виявляйте обмеження використання ліцензії у вашому проєкті!
  vi: Phát hiện các hạn chế sử dụng giấy phép trong dự án của bạn!
x:
  source: https://github.com/anistark/feluda
  eget: anistark/feluda
rule:
  /eget:
    cmd: x eget anistark/feluda
    reference: https://github.com/anistark/feluda
binlist:
- feluda
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
