lang: rust
homepage: https://github.com/ljh-sh/roff
license: apache-2.0
desc:
  cn: 把 Unix man page（roff/mdoc）转成结构化 JSON 或可读 Markdown 的 CLI——适合文档管线、LLM 上下文，或脱离 pager 快速查阅
  en: Turn Unix man pages (roff/mdoc) into structured JSON or readable Markdown — for documentation pipelines, LLM context, or quick inspection without a pager
x:
  source: https://github.com/ljh-sh/roff
  eget: https://github.com/ljh-sh/roff
rule:
  /cargo:
    cmd: cargo install roff-cli
    reference: https://github.com/ljh-sh/roff
  /eget:
    cmd: x eget ljh-sh/roff
    reference: https://github.com/ljh-sh/roff
binlist:
- roff

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 243 KB
          rating: 1
          desc:
            cn: 安装 243 KB
            en: 243 KB install
        download:
          estimate: 243 KB
          desc:
            cn: 约 243 KB 下载 (linux/x64)
            en: ~243 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
