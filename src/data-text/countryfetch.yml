lang: 'Rust'
homepage: 'https://github.com/nik-rev/countryfetch'
license: 'Apache-2.0'
desc:
  cn: 类似 Neofetch 的国家信息查询命令行工具
  en: 'A Command-line tool similar to Neofetch for obtaining information about your country'
x:
  source: https://github.com/nik-rev/countryfetch
  eget: https://github.com/nik-rev/countryfetch
rule:
  /eget:
    cmd: x eget nik-rev/countryfetch
    reference: https://github.com/nik-rev/countryfetch
binlist:
- 'countryfetch'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
