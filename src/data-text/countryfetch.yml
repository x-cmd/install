lang: 'Rust'
homepage: 'https://github.com/nik-rev/countryfetch'
license: 'Apache-2.0'
desc:
  cn: 类似 Neofetch 的国家信息查询命令行工具
  en: 'A Command-line tool similar to Neofetch for obtaining information about your country'
x:
  source: https://github.com/nik-rev/countryfetch
  eget: https://github.com/nik-rev/countryfetch
rule:
  /eget:
    cmd: x eget nik-rev/countryfetch
    reference: https://github.com/nik-rev/countryfetch
binlist:
  - 'countryfetch'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 103 KB
          rating: 1
          desc:
            cn: 约 103 KB（估算）
            en: ~103 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
