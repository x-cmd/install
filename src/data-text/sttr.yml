lang: Go
homepage: https://github.com/abhimanyu003/sttr
license: MIT
desc:
  cn: sttr 是一款命令行软件，允许你快速对字符串执行各种转换操作。
  en: sttr is command line software that allows you to quickly run various transformation operations on the string.
  cs: sttr je software pro příkazovou řádku, který umožňuje rychle provádět různé transformace na řetězci.
  de: sttr ist Kommandozeilen-Software, mit der sich schnell verschiedene Transformationsoperationen auf Zeichenketten ausführen lassen.
  es: sttr es un software de línea de comandos que te permite realizar rápidamente varias operaciones de transformación sobre la cadena.
  fr: sttr est un logiciel en ligne de commande qui permet d'effectuer rapidement diverses opérations de transformation sur une chaîne.
  id: sttr adalah perangkat lunak baris perintah yang memungkinkan Anda dengan cepat menjalankan berbagai operasi transformasi pada string.
  it: sttr è un software da riga di comando che consente di eseguire rapidamente varie operazioni di trasformazione sulle stringhe.
  ja: sttr は文字列にさまざまな変換操作をすばやく実行できるコマンドラインソフトウェアです。
  ko: sttr는 문자열에 다양한 변환 작업을 빠르게 수행할 수 있게 하는 명령줄 소프트웨어입니다.
  pl: sttr to oprogramowanie wiersza poleceń, które pozwala szybko wykonywać różne operacje transformacji na ciągach znaków.
  pt: sttr é um software de linha de comando que permite executar rapidamente várias operações de transformação em strings.
  ro: sttr este un software de linie de comandă care vă permite să rulați rapid diverse operații de transformare asupra șirurilor.
  ru: sttr — программа командной строки, позволяющая быстро выполнять различные преобразования над строками.
  th: sttr เป็นซอฟต์แวร์บรรทัดคำสั่งที่ให้คุณรันการแปลงรูปแบบต่าง ๆ บนสตริงได้อย่างรวดเร็ว
  tr: sttr, dizeler üzerinde hızlıca çeşitli dönüşüm işlemleri çalıştırmanıza olanak tanıyan komut satırı yazılımıdır.
  uk: sttr — програма командного рядка, що дозволяє швидко виконувати різні перетворення над рядками.
  vi: sttr là phần mềm dòng lệnh cho phép bạn nhanh chóng thực hiện các thao tác chuyển đổi khác nhau trên chuỗi
x:
  source: https://github.com/abhimanyu003/sttr
  eget: abhimanyu003/sttr
  brew: abhimanyu003/sttr/sttr
  snap: sttr
  scoop: sttr
  yay: sttr-bin
  go: github.com/abhimanyu003/sttr@latest
rule:
  /eget:
    cmd: x eget abhimanyu003/sttr
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sfL https://raw.githubusercontent.com/abhimanyu003/sttr/main/install.sh | sh
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  arch/yay:
    cmd: yay -S sttr-bin
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  manjaro/yay:
    cmd: yay -S sttr-bin
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  /nix-env:
    cmd: nix-env -iA sttr
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  linux/snap:
    cmd: sudo snap install sttr
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  darwin/brew:
    cmd: brew install abhimanyu003/sttr/sttr
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  (win|wsl2)/winget:
    cmd: x winget install -e --id abhimanyu003.sttr
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add sttr https://github.com/abhimanyu003/scoop-bucket.git \

      && x scoop install sttr

      '
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  win/powershell:
    cmd: curl.exe https://webi.ms/sttr | x powershell
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  /go:
    cmd: go install github.com/abhimanyu003/sttr@latest
    reference: https://github.com/abhimanyu003/sttr#battery-installation
    dsnap: github.com/abhimanyu003/sttr@latest
binlist:
- sttr

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
