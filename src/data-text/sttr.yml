lang: Go
homepage: https://github.com/abhimanyu003/sttr
license: MIT
desc:
  cn: sttr 是一款命令行软件，允许你快速对字符串执行各种转换操作。
  en: sttr is command line software that allows you to quickly run various transformation operations on the string.
x:
  source: https://github.com/abhimanyu003/sttr
  eget: https://github.com/abhimanyu003/sttr
rule:
  /eget:
    cmd: x eget abhimanyu003/sttr
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sfL https://raw.githubusercontent.com/abhimanyu003/sttr/main/install.sh | sh
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  arch/yay:
    cmd: yay -S sttr-bin
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  manjaro/yay:
    cmd: yay -S sttr-bin
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  /nix-env:
    cmd: nix-env -iA sttr
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  linux/snap:
    cmd: sudo snap install sttr
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  darwin/brew:
    cmd: brew install abhimanyu003/sttr/sttr
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  (win|wsl2)/winget:
    cmd: x winget install -e --id abhimanyu003.sttr
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add sttr https://github.com/abhimanyu003/scoop-bucket.git \

      && x scoop install sttr

      '
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  win/powershell:
    cmd: curl.exe https://webi.ms/sttr | x powershell
    reference: https://github.com/abhimanyu003/sttr#battery-installation
  /go:
    cmd: go install github.com/abhimanyu003/sttr@latest
    reference: https://github.com/abhimanyu003/sttr#battery-installation
    dsnap: github.com/abhimanyu003/sttr@latest
binlist:
- sttr

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
