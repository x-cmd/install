lang: 'Rust'
homepage: 'https://github.com/Skardyy/mcat'
license: 'MIT'
desc:
  cn: 终端图片、视频与 Markdown 查看器
  en: 'Terminal image, video, and Markdown viewer'
  cs: Prohlížeč obrázků, videí a Markdownu v terminálu
  de: Bild-, Video- und Markdown-Betrachter für das Terminal
  es: Visor de imágenes, vídeo y Markdown para la terminal
  fr: Visionneuse d'images, de vidéos et de Markdown pour le terminal
  id: Penampil gambar, video, dan Markdown di terminal
  it: Visualizzatore di immagini, video e Markdown per il terminale
  ja: ターミナル用の画像・動画・Markdown ビューア
  ko: 터미널용 이미지, 비디오 및 Markdown 뷰어
  pl: Przeglądarka obrazów, wideo i Markdown w terminalu
  pt: Visualizador de imagens, vídeo e Markdown no terminal
  ro: Vizualizator de imagini, video și Markdown pentru terminal
  ru: Просмотрщик изображений, видео и Markdown для терминала
  th: เครื่องมือดูภาพ วิดีโอ และ Markdown ในเทอร์มินัล
  tr: Terminal için görsel, video ve Markdown görüntüleyici
  uk: Переглядач зображень, відео та Markdown для термінала
  vi: Trình xem ảnh, video và Markdown trong terminal
x:
  source: https://github.com/Skardyy/mcat
  eget: Skardyy/mcat
rule:
  /eget:
    cmd: x eget Skardyy/mcat
    reference: https://github.com/Skardyy/mcat
binlist:
- 'mcat'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
