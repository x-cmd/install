lang: 'Rust'
homepage: 'https://github.com/Skardyy/mcat'
license: 'MIT'
desc:
  cn: 终端图片、视频与 Markdown 查看器
  en: 'Terminal image, video, and Markdown viewer'
x:
  source: https://github.com/Skardyy/mcat
  eget: https://github.com/Skardyy/mcat
rule:
  /eget:
    cmd: x eget Skardyy/mcat
    reference: https://github.com/Skardyy/mcat
binlist:
  - 'mcat'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 455 KB
          rating: 1
          desc:
            cn: 约 455 KB（估算）
            en: ~455 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
