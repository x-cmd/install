lang: Rust
homepage: https://github.com/chmln/sd
license: MIT
desc:
  cn: sd 是一个直观的查找和替换 CLI
  en: sd is an intuitive find & replace CLI
x:
  pkg:
    exist: true
  source: https://github.com/chmln/sd
  eget: https://github.com/chmln/sd
rule:
  /x:
    cmd: x pkg use sd
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget chmln/sd
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install sd
    reference: https://formulae.brew.sh/formula/sd#default
  ubuntu/apt:
    cmd: sudo apt-get install sd
    reference: https://command-not-found.com/sd
  raspbian/apt:
    cmd: sudo apt-get install sd
    reference: https://command-not-found.com/sd
binlist:
- sd

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
