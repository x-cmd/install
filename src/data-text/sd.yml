lang: Rust
homepage: https://github.com/chmln/sd
license: MIT
desc:
  cn: sd 是一个直观的查找和替换 CLI
  en: sd is an intuitive find & replace CLI
x:
  source: https://github.com/chmln/sd
  eget: https://github.com/chmln/sd
  apt: sd
  brew: sd
  apt-get: sd
rule:
  /x:
    cmd: x pkg use sd
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget chmln/sd
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install sd
    reference: https://formulae.brew.sh/formula/sd#default
  ubuntu/apt:
    cmd: sudo apt-get install sd
    reference: https://command-not-found.com/sd
  raspbian/apt:
    cmd: sudo apt-get install sd
    reference: https://command-not-found.com/sd
binlist:
- sd

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 966 KB
          rating: 1
          desc:
            cn: 安装 966 KB
            en: 966 KB install
        download:
          estimate: 966 KB
          desc:
            cn: 约 966 KB 下载 (linux/x64)
            en: ~966 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
