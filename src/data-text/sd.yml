lang: Rust
homepage: https://github.com/chmln/sd
license: MIT
desc:
  cn: sd 是一个直观的查找和替换 CLI
  en: sd is an intuitive find & replace CLI
  cs: sd je intuitivní nástroj pro nahrazování textu v souborech
  de: sd ist ein intuitives CLI zum Suchen und Ersetzen
  es: sd es una CLI intuitiva para buscar y reemplazar
  fr: sd est une CLI intuitive de recherche et remplacement
  id: sd adalah CLI intuitif untuk mencari dan mengganti
  it: sd è una CLI intuitiva per cercare e sostituire
  ja: sd は直感的な検索・置換の CLI です
  ko: sd는 직관적인 검색 및 교체 CLI입니다
  pl: sd to intuicyjne narzędzie CLI do wyszukiwania i zastępowania
  pt: sd é uma CLI intuitiva para buscar e substituir
  ro: sd este un instrument CLI intuitiv de căutare și înlocuire
  ru: sd — интуитивный CLI для поиска и замены
  th: sd เป็น CLI ที่ใช้งานง่ายสำหรับการค้นหาและแทนที่
  tr: sd, bul ve değiştir için sezgisel bir CLI'dır
  uk: sd — інтуїтивний CLI для пошуку та заміни
  vi: sd là CLI trực quan để tìm kiếm và thay thế
x:
  source: https://github.com/chmln/sd
  eget: chmln/sd
  apt: sd
  brew: sd
  apt-get: sd
rule:
  /x:
    cmd: x pkg use sd
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget chmln/sd
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install sd
    reference: https://formulae.brew.sh/formula/sd#default
  ubuntu/apt:
    cmd: sudo apt-get install sd
    reference: https://command-not-found.com/sd
  raspbian/apt:
    cmd: sudo apt-get install sd
    reference: https://command-not-found.com/sd
binlist:
- sd

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 966 KB
          rating: 1
          desc:
            cn: 安装 966 KB
            en: 966 KB install
        download:
          estimate: 966 KB
          desc:
            cn: 约 966 KB 下载 (linux/x64)
            en: ~966 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
