lang: rust
homepage: https://github.com/ljh-sh/chardet
license: apache-2.0
desc:
  cn: 通过 chardetng 检测文本文件编码的 CLI——先查 BOM 再用启发式，输出编码名、置信度和路径
  en: Detect text file encoding via chardetng — BOM-aware, single-binary Rust CLI; prints encoding, confidence, and path
x:
  source: https://github.com/ljh-sh/chardet
rule:
  /cargo:
    cmd: cargo install chardet-cli
    reference: https://github.com/ljh-sh/chardet
binlist:
- chardet

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 295 KB
          rating: 1
          desc:
            cn: 安装 295 KB
            en: 295 KB install
        download:
          estimate: 295 KB
          desc:
            cn: 约 295 KB 下载 (linux/x64)
            en: ~295 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
