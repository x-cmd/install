lang: rust
homepage: https://github.com/ljh-sh/chardet
license: apache-2.0
desc:
  cn: 通过 chardetng 检测文本文件编码的 CLI——先查 BOM 再用启发式，输出编码名、置信度和路径
  en: Detect text file encoding via chardetng — BOM-aware, single-binary Rust CLI; prints encoding, confidence, and path
x:
  source: https://github.com/ljh-sh/chardet
rule:
  /cargo:
    cmd: cargo install chardet-cli
    reference: https://github.com/ljh-sh/chardet
binlist:
- chardet

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
