lang: 'Rust'
homepage: https://github.com/Wilfred/difftastic
license: 'MIT'
desc:
  cn: 理解语法的结构化 diff 工具
  en: 'a structural diff that understands syntax 🟥🟩'
x:
  source: https://github.com/Wilfred/difftastic
  eget: https://github.com/Wilfred/difftastic
rule:
  /eget:
    cmd: x eget Wilfred/difftastic
    reference: https://github.com/Wilfred/difftastic
binlist:
- 'difftastic'

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 114 MB
          rating: 3
          desc:
            cn: 安装 114 MB
            en: 114 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
