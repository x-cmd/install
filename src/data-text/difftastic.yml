lang: 'Rust'
homepage: https://github.com/Wilfred/difftastic
license: 'MIT'
desc:
  cn: 理解语法的结构化 diff 工具
  en: 'a structural diff that understands syntax 🟥🟩'
x:
  source: https://github.com/Wilfred/difftastic
  eget: https://github.com/Wilfred/difftastic
rule:
  /eget:
    cmd: x eget Wilfred/difftastic
    reference: https://github.com/Wilfred/difftastic
binlist:
  - 'difftastic'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 694 KB
          rating: 1
          desc:
            cn: 约 694 KB（估算）
            en: ~694 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
