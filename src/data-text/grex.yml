lang: Rust
homepage: https://github.com/pemistahl/grex
license: Apache-2.0
desc:
  cn: 命令行工具和 Rust 库，用于从用户提供的测试用例生成正则表达式
  en: A command-line tool and Rust library for generating regular expressions from user-provided test cases
x:
  pkg:
    exist: true
  source: https://github.com/pemistahl/grex
  eget: https://github.com/pemistahl/grex
  brew: grex
rule:
  /x:
    cmd: x pkg use grex
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget pemistahl/grex
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use grex
    reference: https://github.com/ouest/asdf-grex
  darwin/brew:
    cmd: brew install grex
    reference: https://formulae.brew.sh/formula/grex#default
  (win|wsl2)/scoop:
    cmd: x scoop install grex
    reference: https://github.com/pemistahl/grex#41-the-command-line-tool
  (win|wsl2)/choco:
    cmd: x choco install grex
    reference: https://github.com/pemistahl/grex#41-the-command-line-tool
  darwin/port:
    cmd: sudo port selfupdate && sudo port install grex
    reference: https://github.com/pemistahl/grex#41-the-command-line-tool
binlist:
- grex

# already profiled
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3.8 MB
          rating: 1
          desc:
            cn: 安装 3.8 MB
            en: 3.8 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
