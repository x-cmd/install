lang: Rust
desc:
  cn: Typst 的 CLI(Typst 是一种新的基于标记的排版系统，其设计与 LaTeX 一样强大，同时更易于学习和使用)
  en: The CLI of Typst (Typst is a new mark-up typesetting system, designed to be as powerful as LaTeX, but easier to learn and use)
homepage: https://github.com/typst/typst
license: Apache-2.0
x:
  pkg:
    exist: true
  source: https://github.com/typst/typst
  eget: https://github.com/typst/typst
rule:
  /x:
    cmd: x pkg use typst
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget typst/typst
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install typst
    reference: https://github.com/typst/typst?tab=readme-ov-file#installation
  (win|wsl2)/winget:
    cmd: winget install --id Typst.Typst
    reference: https://github.com/typst/typst?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install --git https://github.com/typst/typst typst-cli
    reference: https://github.com/typst/typst?tab=readme-ov-file#installation
    dsnap: typst-cli
  /nix:
    cmd: nix run github:typst/typst -- --version
    reference: https://github.com/typst/typst?tab=readme-ov-file#installation
binlist:
- typst

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
