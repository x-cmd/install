lang: 'Rust'
homepage: 'https://github.com/sharkdp/pastel'
license: 'Apache-2.0'
desc:
  cn: 生成、分析、转换与操作颜色的命令行工具
  en: 'A command-line tool to generate, analyze, convert and manipulate colors'
x:
  source: https://github.com/sharkdp/pastel
  eget: https://github.com/sharkdp/pastel
rule:
  /eget:
    cmd: x eget sharkdp/pastel
    reference: https://github.com/sharkdp/pastel
binlist:
  - 'pastel'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
