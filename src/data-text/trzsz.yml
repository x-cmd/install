lang: Python
homepage: https://github.com/trzsz/trzsz
license: MIT
desc:
  cn: trzsz 是一种简单的文件传输工具，类似于 lrzsz ( rz / sz )，并且与 tmux 兼容
  en: trzsz is a simple file transfer tools, which similar to lrzsz ( rz / sz ), and compatible with tmux
x:
  source: https://github.com/trzsz/trzsz
rule:
  /pip:
    cmd: sudo python3 -m pip install --upgrade trzsz
    reference: https://github.com/trzsz/trzsz?tab=readme-ov-file#installation
    dsnap: trzsz
  darwin/brew:
    cmd: brew install trzsz
    reference: https://github.com/trzsz/trzsz?tab=readme-ov-file#installation
  /npm:
    cmd: sudo npm install -g trzsz
    reference: https://github.com/trzsz/trzsz?tab=readme-ov-file#installation
    dsnap: trzsz
binlist:
- trzsz

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
