lang: Python
homepage: https://github.com/trzsz/trzsz
license: MIT
desc:
  cn: trzsz 是一种简单的文件传输工具，类似于 lrzsz ( rz / sz )，并且与 tmux 兼容
  en: trzsz is a simple file transfer tools, which similar to lrzsz ( rz / sz ), and compatible with tmux
  cs: trzsz je jednoduchý nástroj pro přenos souborů, podobný lrzsz (rz / sz), a je kompatibilní s tmux
  de: trzsz ist ein einfaches Dateiübertragungswerkzeug, ähnlich lrzsz (rz / sz), und kompatibel mit tmux
  es: trzsz es una sencilla herramienta de transferencia de archivos, similar a lrzsz (rz / sz), y compatible con tmux
  fr: trzsz est un outil simple de transfert de fichiers, similaire à lrzsz (rz / sz), et compatible avec tmux
  id: trzsz adalah alat transfer file sederhana mirip lrzsz (rz / sz), dan kompatibel dengan tmux
  it: trzsz è un semplice strumento di trasferimento file, simile a lrzsz (rz / sz), e compatibile con tmux
  ja: trzsz は lrzsz (rz / sz) に似たシンプルなファイル転送ツールで、tmux とも互換性があります
  ko: trzsz는 lrzsz(rz / sz)와 유사한 간단한 파일 전송 도구이며 tmux와 호환됩니다
  pl: trzsz to proste narzędzie do przesyłania plików, podobne do lrzsz (rz / sz) i kompatybilne z tmux
  pt: trzsz é uma ferramenta simples de transferência de arquivos, semelhante a lrzsz (rz / sz), e compatível com tmux
  ro: trzsz este un instrument simplu de transfer de fișiere, similar cu lrzsz (rz / sz), și compatibil cu tmux
  ru: trzsz — простой инструмент передачи файлов, похожий на lrzsz (rz / sz) и совместимый с tmux
  th: trzsz เป็นเครื่องมือถ่ายโอนไฟล์อย่างง่าย คล้าย lrzsz (rz / sz) และเข้ากันได้กับ tmux
  tr: trzsz, lrzsz (rz / sz) benzeri basit bir dosya aktarma aracıdır ve tmux ile uyumludur
  uk: trzsz — простий інструмент передачі файлів, схожий на lrzsz (rz / sz) та сумісний з tmux
  vi: trzsz là công cụ truyền tệp đơn giản, tương tự lrzsz (rz / sz) và tương thích với tmux
x:
  source: https://github.com/trzsz/trzsz
  brew: trzsz
  npm: trzsz
rule:
  /pip:
    cmd: sudo python3 -m pip install --upgrade trzsz
    reference: https://github.com/trzsz/trzsz?tab=readme-ov-file#installation
    dsnap: trzsz
  darwin/brew:
    cmd: brew install trzsz
    reference: https://github.com/trzsz/trzsz?tab=readme-ov-file#installation
  /npm:
    cmd: sudo npm install -g trzsz
    reference: https://github.com/trzsz/trzsz?tab=readme-ov-file#installation
    dsnap: trzsz
binlist:
- trzsz

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
