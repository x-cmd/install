lang: 'CMake'
homepage: 'https://github.com/InCom-0/incplot'
license: 'MIT'
desc:
  cn: 注重易用性与简洁的终端与 HTML 绘图 CLI 工具
  en: 'CLI tool for drawing great looking plots in the terminal and in HTML focused on user ergonomics and simplicity'
x:
  source: https://github.com/InCom-0/incplot
  eget: https://github.com/InCom-0/incplot
rule:
  /eget:
    cmd: x eget InCom-0/incplot
    reference: https://github.com/InCom-0/incplot
binlist:
  - 'incplot'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
