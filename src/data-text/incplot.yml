lang: 'CMake'
homepage: 'https://github.com/InCom-0/incplot'
license: 'MIT'
desc:
  cn: 注重易用性与简洁的终端与 HTML 绘图 CLI 工具
  en: 'CLI tool for drawing great looking plots in the terminal and in HTML focused on user ergonomics and simplicity'
x:
  source: https://github.com/InCom-0/incplot
  eget: https://github.com/InCom-0/incplot
rule:
  /eget:
    cmd: x eget InCom-0/incplot
    reference: https://github.com/InCom-0/incplot
binlist:
- 'incplot'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 120 KB
          rating: 1
          desc:
            cn: 约 120 KB（估算）
            en: ~120 KB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (win/x64)
            en: ~4 MB download (win/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: none
    darwin: none
