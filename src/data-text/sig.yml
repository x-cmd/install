lang: Rust
homepage: https://github.com/ynqa/sig
license: MIT
desc:
  cn: 交互式的 grep 工具，用于流式数据。
  en: Interactive grep (for streaming)
x:
  source: https://github.com/ynqa/sig
  eget: https://github.com/ynqa/sig
rule:
  /eget:
    cmd: x eget ynqa/sig
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install ynqa/tap/sigrs
    reference: https://github.com/ynqa/sig#homebrew
  /cargo:
    cmd: cargo install sigrs
    reference: https://github.com/ynqa/sig#cargo
    dsnap: sigrs
  arch/pacman:
    cmd: pacman -S sig
    reference: https://github.com/ynqa/sig#arch-linux
binlist:
- sig

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
