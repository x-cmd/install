lang: Rust
homepage: https://github.com/ynqa/sig
license: MIT
desc:
  cn: 交互式的 grep 工具，用于流式数据。
  en: Interactive grep (for streaming)
x:
  source: https://github.com/ynqa/sig
  eget: https://github.com/ynqa/sig
rule:
  /eget:
    cmd: x eget ynqa/sig
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install ynqa/tap/sigrs
    reference: https://github.com/ynqa/sig#homebrew
  /cargo:
    cmd: cargo install sigrs
    reference: https://github.com/ynqa/sig#cargo
    dsnap: sigrs
  arch/pacman:
    cmd: pacman -S sig
    reference: https://github.com/ynqa/sig#arch-linux
binlist:
- sig

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
