lang: Python
desc:
  cn: 用 Python 完全重写的文章提取器
  en: Article extractor completely rewritten in Python
homepage: https://github.com/goose3/goose3
license: Apache-2.0
x:
  source: https://github.com/goose3/goose3
rule:
  /pip:
    cmd: pip install goose3
    reference: https://github.com/goose3/goose3?tab=readme-ov-file#setup
    dsnap: goose3
binlist:
- goose3

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
