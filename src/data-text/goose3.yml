lang: Python
desc:
  cn: 用 Python 完全重写的文章提取器
  en: Article extractor completely rewritten in Python
homepage: https://github.com/goose3/goose3
license: Apache-2.0
x:
  source: https://github.com/goose3/goose3
  pip: goose3
rule:
  /pip:
    cmd: pip install goose3
    reference: https://github.com/goose3/goose3?tab=readme-ov-file#setup
    dsnap: goose3
binlist:
- goose3

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.9 MB
          rating: 1
          desc:
            cn: 约 2.9 MB（估算）
            en: ~2.9 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
