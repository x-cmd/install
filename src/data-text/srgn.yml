lang: 'Rust'
homepage: https://github.com/alexpovel/srgn
license: 'MIT'
desc:
  cn: 理解源码语法并支持搜索与修改的 grep 类工具
  en: 'A grep-like tool which understands source code syntax and allows for manipulation in addition to search'
x:
  source: https://github.com/alexpovel/srgn
  eget: https://github.com/alexpovel/srgn
rule:
  /cargo:
    cmd: 'cargo install cargo-binstall'
    reference: https://github.com/alexpovel/srgn
  /eget:
    cmd: x eget alexpovel/srgn
    reference: https://github.com/alexpovel/srgn
binlist:
  - 'srgn'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
