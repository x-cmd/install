lang: Python
homepage: https://sourceforge.net/projects/docutils/
desc:
  cn: Docutils 是一个开源的文本处理系统，用于将明文文档处理成有用的格式
  en: Docutils is an open-source text processing system for processing plaintext documentation into useful formats
rule:
  darwin/brew:
    cmd: brew install docutils
    reference: https://formulae.brew.sh/formula/docutils#default
  /pip:
    cmd: pip install docutils
    reference: https://pypi.org/project/docutils/#files
    dsnap: docutils
binlist:
- docutils
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
