lang: Python
homepage: https://sourceforge.net/projects/docutils/
desc:
  cn: Docutils 是一个开源的文本处理系统，用于将明文文档处理成有用的格式
  en: Docutils is an open-source text processing system for processing plaintext documentation into useful formats
rule:
  darwin/brew:
    cmd: brew install docutils
    reference: https://formulae.brew.sh/formula/docutils#default
  /pip:
    cmd: pip install docutils
    reference: https://pypi.org/project/docutils/#files
    dsnap: docutils
binlist:
- docutils
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
