lang: Go
homepage: https://github.com/hairyhenderson/gomplate
license: MIT
desc:
  cn: gomplate 是一个用于模板渲染的命令行工具，支持许多本地和远程数据源
  en: gomplate is a flexible commandline tool for template rendering. Supports lots of local and remote datasources
  cs: gomplate je flexibilní nástroj příkazové řádky pro vykreslování šablon. Podporuje mnoho místních i vzdálených zdrojů dat
  de: gomplate ist ein flexibles Kommandozeilenwerkzeug zum Rendern von Templates. Unterstützt viele lokale und entfernte Datenquellen
  es: gomplate es una herramienta de línea de comandos flexible para renderizar plantillas. Admite muchas fuentes de datos locales y remotas
  fr: gomplate est un outil en ligne de commande flexible pour le rendu de gabarits. Prend en charge de nombreuses sources de données locales et distantes
  id: gomplate adalah alat baris perintah yang fleksibel untuk rendering template. Mendukung banyak sumber data lokal dan jarak jauh
  it: gomplate è uno strumento a riga di comando flessibile per il rendering dei template. Supporta molte fonti di dati locali e remote
  ja: gomplate はテンプレートレンダリング用の柔軟なコマンドラインツールです。たくさんのローカル・リモートデータソースに対応しています
  ko: gomplate는 템플릿 렌더링을 위한 유연한 명령줄 도구로, 다양한 로컬 및 원격 데이터 소스를 지원합니다
  pl: gomplate to elastyczne narzędzie wiersza poleceń do renderowania szablonów. Obsługuje wiele lokalnych i zdalnych źródeł danych
  pt: gomplate é uma ferramenta de linha de comando flexível para renderização de templates. Suporta muitos fontes de dados locais e remotas
  ro: gomplate este un instrument de linie de comandă flexibil pentru randarea șablonurilor. Acceptă multe surse de date locale și la distanță
  ru: gomplate — гибкий инструмент командной строки для рендеринга шаблонов. Поддерживает множество локальных и удалённых источников данных
  th: gomplate เป็นเครื่องมือบรรทัดคำสั่งที่ยืดหยุ่นสำหรับการเรนเดอร์เทมเพลต รองรับแหล่งข้อมูลทั้งในเครื่องและระยะไกลจำนวนมาก
  tr: gomplate, şablon oluşturma için esnek bir komut satırı aracıdır. Birçok yerel ve uzak veri kaynağını destekler
  uk: gomplate — гнучкий інструмент командного рядка для рендерингу шаблонів. Підтримує багато локальних і віддалених джерел даних
  vi: gomplate là công cụ dòng lệnh linh hoạt để kết xuất template. Hỗ trợ nhiều nguồn dữ liệu cục bộ và từ xa
x:
  source: https://github.com/hairyhenderson/gomplate
  eget: hairyhenderson/gomplate
  brew: gomplate
  port: gomplate
  choco: gomplate
  yay: gomplate-bin
  npm: gomplate
  go: github.com/hairyhenderson/gomplate/v4/cmd/gomplate@latest
  asdf: gomplate
rule:
  /x:
    cmd: x pkg use gomplate
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget hairyhenderson/gomplate
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install gomplate
    reference: https://docs.gomplate.ca/installing/#macoslinux-with-homebrew
  linux/brew:
    cmd: brew install gomplate
    reference: https://docs.gomplate.ca/installing/
  darwin/port:
    cmd: sudo port install gomplate
    reference: https://docs.gomplate.ca/installing/#macos-with-macports
  /asdf:
    cmd: x asdf use gomplate
    reference: https://github.com/sneakybeaky/asdf-gomplate
  (win|wsl2)/choco:
    cmd: x choco install gomplate
    reference: https://docs.gomplate.ca/installing/#windows-with-chocolatey
  alpine/apk:
    cmd: sudo apk add --no-cache gomplate
    reference: https://docs.gomplate.ca/installing/#alpine-linux
    dsnap: gomplate
  /go:
    cmd: go install github.com/hairyhenderson/gomplate/v4/cmd/gomplate@latest
    reference: https://docs.gomplate.ca/installing/#install-with-go-install
    dsnap: gomplate
  /npm:
    cmd: npm install -g gomplate
    reference: https://docs.gomplate.ca/installing/#install-with-npm
    dsnap: gomplate
  /tea.xyz:
    cmd: sh <(curl https://tea.xyz) +gomplate.ca sh
    reference: https://docs.gomplate.ca/installing/#install-with-teaxyz
  arch/yay:
    cmd: yay -S gomplate-bin
    reference: https://aur.archlinux.org/packages/gomplate-bin
binlist:
- gomplate

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 104 MB
          rating: 3
          desc:
            cn: 安装 104 MB
            en: 104 MB install
        download:
          estimate: 104 MB
          desc:
            cn: 约 104 MB 下载 (linux/x64)
            en: ~104 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
