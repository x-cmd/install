lang: C++
homepage: https://github.com/assimp/assimp
desc:
  cn: Open Asset Import Library 是一个将各种 3d 文件格式加载到共享内存格式的库
  en: Open Asset Import Library is a library to load various 3d file formats into a shared, in-memory format
  cs: Open Asset Import Library je knihovna pro načítání různých 3D formátů souborů do společného formátu v paměti
  de: Open Asset Import Library ist eine Bibliothek, die verschiedene 3D-Dateiformate in ein gemeinsames In-Memory-Format lädt
  es: Open Asset Import Library es una biblioteca que carga varios formatos de archivo 3D en un formato compartido en memoria
  fr: Open Asset Import Library est une bibliothèque qui charge différents formats de fichiers 3D dans un format partagé en mémoire
  id: Open Asset Import Library adalah pustaka untuk memuat berbagai format file 3D ke dalam format bersama di memori
  it: Open Asset Import Library è una libreria che carica vari formati di file 3D in un formato condiviso in memoria
  ja: Open Asset Import Library は、さまざまな 3D ファイル形式をメモリ上の共通形式に読み込むライブラリです
  ko: Open Asset Import Library는 다양한 3D 파일 형식을 메모리의 공통 형식으로 불러오는 라이브러리입니다
  pl: Open Asset Import Library to biblioteka ładująca różne formaty plików 3D do wspólnego formatu w pamięci
  pt: Open Asset Import Library é uma biblioteca que carrega vários formatos de arquivo 3D em um formato compartilhado na memória
  ro: Open Asset Import Library este o bibliotecă care încarcă diverse formate de fișiere 3D într-un format comun, în memorie
  ru: Open Asset Import Library — это библиотека для загрузки различных 3D-форматов файлов в единый формат в памяти
  th: Open Asset Import Library คือไลบรารีที่โหลดรูปแบบไฟล์ 3D ต่าง ๆ เข้าสู่รูปแบบร่วมกันในหน่วยความจำ
  tr: Open Asset Import Library, çeşitli 3B dosya biçimlerini bellekte ortak bir biçime yükleyen bir kütüphanedir
  uk: Open Asset Import Library — це бібліотека для завантаження різних 3D-форматів файлів у спільний формат у пам'яті
  vi: Open Asset Import Library là thư viện tải nhiều định dạng tệp 3D khác nhau vào một định dạng chung trong bộ nhớ
x:
  source: https://github.com/assimp/assimp
  eget: assimp/assimp
  apt: libassimp-dev
  brew: assimp
  apt-get: libassimp-dev
  scoop: versions/assimp3
  yay: assimp-git
  pip: pyassimp
rule:
  /eget:
    cmd: x eget assimp/assimp
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install assimp
    reference: https://formulae.brew.sh/formula/assimp#default
  arch/yay:
    cmd: yay -S assimp-git
    reference: https://aur.archlinux.org/packages/assimp-git
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add versions \

      && x scoop install versions/assimp3

      '
    reference: https://scoop.sh/#/apps?q=assimp
  /git:
    cmd: 'git clone https://github.com/Microsoft/vcpkg.git \

      && cd vcpkg \

      && ./bootstrap-vcpkg.sh \

      && ./vcpkg integrate install \

      && ./vcpkg install assimp

      '
    reference: https://github.com/assimp/assimp/blob/master/Build.md#install-on-all-platforms-using-vcpkg
  ubuntu/apt:
    cmd: sudo apt-get install libassimp-dev
    reference: https://github.com/assimp/assimp/blob/master/Build.md#install-on-ubuntu
    dsnap: libassimp-dev
  /pip:
    cmd: pip install pyassimp
    reference: https://github.com/assimp/assimp/blob/master/Build.md#install-pyassimp
    dsnap: pyassimp
binlist:
- assimp
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 约 30 MB（估算）
            en: ~30 MB estimated
        download:
          estimate: 14 MB
          desc:
            cn: 约 14 MB 下载 (linux/x64)
            en: ~14 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
