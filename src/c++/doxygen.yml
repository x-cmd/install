lang: C++
homepage: https://github.com/doxygen/doxygen
license: GPL-2.0
desc:
  cn: 对于从带注释的 c + + 源代码中生成文档，doxy 是一个行业标准的工具
  en: Doxygen is the de facto standard tool for generating documentation from annotated C++ sources
x:
  source: https://github.com/doxygen/doxygen
  eget: https://github.com/doxygen/doxygen
rule:
  /eget:
    cmd: x eget doxygen/doxygen
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install doxygen
    reference: https://formulae.brew.sh/formula/doxygen#default
  (win|wsl2)/scoop:
    cmd: x scoop install doxygen
    reference: https://scoop.sh/#/apps?q=Doxygen
  arch/yay:
    cmd: yay -S doxygen-git
    reference: https://aur.archlinux.org/packages/doxygen-git
binlist:
- doxygen

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
