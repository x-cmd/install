lang: C++
homepage: https://github.com/doxygen/doxygen
license: GPL-2.0
desc:
  cn: 对于从带注释的 c + + 源代码中生成文档，doxy 是一个行业标准的工具
  en: Doxygen is the de facto standard tool for generating documentation from annotated C++ sources
x:
  source: https://github.com/doxygen/doxygen
  eget: https://github.com/doxygen/doxygen
  brew: doxygen
  scoop: doxygen
  yay: doxygen-git
rule:
  /eget:
    cmd: x eget doxygen/doxygen
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install doxygen
    reference: https://formulae.brew.sh/formula/doxygen#default
  (win|wsl2)/scoop:
    cmd: x scoop install doxygen
    reference: https://scoop.sh/#/apps?q=Doxygen
  arch/yay:
    cmd: yay -S doxygen-git
    reference: https://aur.archlinux.org/packages/doxygen-git
binlist:
- doxygen

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 45 MB
          rating: 2
          desc:
            cn: 安装 45 MB
            en: 45 MB install
        download:
          estimate: 45 MB
          desc:
            cn: 约 45 MB 下载 (win/x64)
            en: ~45 MB download (win/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
