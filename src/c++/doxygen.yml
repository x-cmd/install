lang: C++
homepage: https://github.com/doxygen/doxygen
license: GPL-2.0
desc:
  cn: 对于从带注释的 c + + 源代码中生成文档，doxy 是一个行业标准的工具
  en: Doxygen is the de facto standard tool for generating documentation from annotated C++ sources
  cs: Doxygen je de facto standardní nástroj pro generování dokumentace z anotovaných zdrojů C++
  de: Doxygen ist das de facto Standardwerkzeug zur Erzeugung von Dokumentation aus kommentierten C++-Quellen
  es: Doxygen es la herramienta estándar de facto para generar documentación a partir de fuentes C++ anotadas
  fr: Doxygen est l'outil standard de facto pour générer de la documentation à partir de sources C++ annotées
  id: Doxygen adalah alat standar de facto untuk membuat dokumentasi dari sumber C++ yang beranotasi
  it: Doxygen è lo strumento standard de facto per generare documentazione da sorgenti C++ annotati
  ja: Doxygen は、注釈付きの C++ ソースからドキュメントを生成する事実上の標準ツールです
  ko: Doxygen는 주석이 달린 C++ 소스에서 문서를 생성하는 사실상 표준 도구입니다
  pl: Doxygen jest de facto standardowym narzędziem do generowania dokumentacji z opatrzonych komentarzami źródeł C++
  pt: Doxygen é a ferramenta padrão de facto para gerar documentação a partir de fontes C++ anotadas
  ro: Doxygen este instrumentul standard de facto pentru generarea documentației din surse C++ adnotate
  ru: Doxygen — де-факто стандартный инструмент для генерации документации из аннотированных исходников C++
  th: Doxygen คือเครื่องมือมาตรฐานโดยพฤติกรรมสำหรับสร้างเอกสารจากซอร์สโค้ด C++ ที่มีคำอธิบาย
  tr: Doxygen, açıklamalı C++ kaynaklarından belge üretmek için fiili standart araçtır
  uk: Doxygen — це де-факто стандартний інструмент для генерації документації з анотованих вихідних кодів C++
  vi: Doxygen là công cụ tiêu chuẩn de facto để tạo tài liệu từ mã nguồn C++ có chú thích
x:
  source: https://github.com/doxygen/doxygen
  eget: doxygen/doxygen
  brew: doxygen
  scoop: doxygen
  yay: doxygen-git
rule:
  /eget:
    cmd: x eget doxygen/doxygen
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install doxygen
    reference: https://formulae.brew.sh/formula/doxygen#default
  (win|wsl2)/scoop:
    cmd: x scoop install doxygen
    reference: https://scoop.sh/#/apps?q=Doxygen
  arch/yay:
    cmd: yay -S doxygen-git
    reference: https://aur.archlinux.org/packages/doxygen-git
binlist:
- doxygen

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 45 MB
          rating: 2
          desc:
            cn: 安装 45 MB
            en: 45 MB install
        download:
          estimate: 45 MB
          desc:
            cn: 约 45 MB 下载 (win/x64)
            en: ~45 MB download (win/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
