lang: C++
homepage: https://github.com/abseil/abseil-cpp
license: Apache-2.0
desc:
  cn: Abseil 是一个开源的 C + + 代码集合(兼容 C + + 14) , 旨在增强 C++标准程式库
  en: Abseil is an open-source collection of C++ code (compliant to C++14) designed to augment the C++ standard library
x:
  source: https://github.com/abseil/abseil-cpp
  eget: https://github.com/abseil/abseil-cpp
  brew: abseil
rule:
  /eget:
    cmd: x eget abseil/abseil-cpp
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install abseil
    reference: https://formulae.brew.sh/formula/abseil#default
  arch/yay:
    cmd: yay -S abseil-cpp-git
    reference: https://aur.archlinux.org/packages/abseil-cpp-git
binlist:
- abseil

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
