lang: C
homepage: https://gcc.gnu.org/git/gcc.git
desc:
  cn: GCC 包括 C、 C + + 、 Objective-C、 Fortran、 Ada、 Go 和 d 的前端，以及这些语言的库(libstdc + + ，...)
  en: The GNU Compiler Collection includes front ends for C, C++, Objective-C, Fortran, Ada, Go, and D, as well as libraries for these languages (libstdc++,...)
rule:
  darwin/brew:
    cmd: brew install gcc
    reference: https://formulae.brew.sh/formula/gcc#default
  /apt:
    cmd: sudo apt-get install gcc
    reference: https://command-not-found.com/gcc
  alpine/apk:
    cmd: sudo apk add gcc
    reference: https://command-not-found.com/gcc
    dsnap: gcc
  arch/pacman:
    cmd: sudo pacman -S gcc
    reference: https://command-not-found.com/gcc
  kali/apt:
    cmd: sudo apt-get install gcc
    reference: https://command-not-found.com/gcc
    dsnap: gcc
  centos/yum:
    cmd: sudo yum install gcc
    reference: https://command-not-found.com/gcc
  fedora/dnf:
    cmd: sudo dnf install gcc
    reference: https://command-not-found.com/gcc
    dsnap: gcc

x:
  apt: gcc
  apt-get: gcc
  dnf: gcc
  yum: gcc
  pacman: gcc
  apk: gcc
  brew: gccbinlist:
- gcc
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
