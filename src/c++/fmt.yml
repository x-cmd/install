lang: C++
homepage: https://github.com/fmtlib/fmt
license: MIT
desc:
  en: '{fmt} is an open-source formatting library providing a fast and safe alternative to C stdio and C++ iostreams'
  cn: '{fmt} 是一个开放源码的格式化库，提供了一个快速而安全的 C stdio 和 C + + iostream 的替代品'
x:
  source: https://github.com/fmtlib/fmt
  eget: https://github.com/fmtlib/fmt
rule:
  /eget:
    cmd: x eget fmtlib/fmt
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install fmt
    reference: https://formulae.brew.sh/formula/fmt#default
binlist:
- fmt

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
