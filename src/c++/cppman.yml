lang: Python
homepage: https://github.com/aitjcize/cppman
license: GPL-3.0
desc:
  cn: 适用于 Linux 的 C++ 98/11/14/17/20 手册页
  en: C++ 98/11/14/17/20 man page for Linux
x:
  pkg:
    exist: true
  source: https://github.com/aitjcize/cppman
  eget: https://github.com/aitjcize/cppman
rule:
  /eget:
    cmd: x eget aitjcize/cppman
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use cppman
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install cppman
    reference: https://github.com/aitjcize/cppman?tab=readme-ov-file#installation
    dsnap: cppman
  arch/trizen:
    cmd: sudo trizen -S cppman
    reference: https://github.com/aitjcize/cppman?tab=readme-ov-file#installation
  debian/apt:
    cmd: sudo apt-get install cppman
    reference: https://github.com/aitjcize/cppman?tab=readme-ov-file#installation
    dsnap: cppman
  ubuntu/apt:
    cmd: sudo apt-get install cppman
    reference: https://github.com/aitjcize/cppman?tab=readme-ov-file#installation
    dsnap: cppman
  darwin/brew:
    cmd: brew install cppman
    reference: https://github.com/aitjcize/cppman?tab=readme-ov-file#installation
  darwin/port:
    cmd: sudo port install cppman
    reference: https://github.com/aitjcize/cppman?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S cppman
    reference: https://aur.archlinux.org/packages/cppman
binlist:
- cppman

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
