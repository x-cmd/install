lang: C++
homepage: https://www.freedesktop.org/wiki/Software/uchardet/
desc:
  en: Encoding detector library
  cn: 编码检测器库
  cs: Knihovna pro detekci kódování
  de: Bibliothek zur Erkennung der Zeichencodierung
  es: Biblioteca de detección de codificaciones
  fr: Bibliothèque de détection d'encodage
  id: Pustaka detektor enkode
  it: Libreria di rilevamento della codifica
  ja: エンコーディング検出ライブラリ
  ko: 인코딩 감지 라이브러리
  pl: Biblioteka do wykrywania kodowania
  pt: Biblioteca de detecção de codificação
  ro: Bibliotecă de detectare a codificării
  ru: Библиотека определения кодировки
  th: ไลบรารีตรวจจับการเข้ารหัสอักขระ
  tr: Kodlama algılama kitaplığı
  uk: Бібліотека визначення кодування
  vi: Thư viện phát hiện bảng mã
rule:
  darwin/brew:
    cmd: brew install uchardet
    reference: https://formulae.brew.sh/formula/uchardet#default
  arch/yay:
    cmd: yay -S uchardet-git
    reference: https://aur.archlinux.org/packages/uchardet-git

x:
  brew: uchardet
  yay: uchardet-git
binlist:
- uchardet
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
