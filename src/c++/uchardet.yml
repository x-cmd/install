lang: C++
homepage: https://www.freedesktop.org/wiki/Software/uchardet/
desc:
  en: Encoding detector library
  cn: 编码检测器库
rule:
  darwin/brew:
    cmd: brew install uchardet
    reference: https://formulae.brew.sh/formula/uchardet#default
  arch/yay:
    cmd: yay -S uchardet-git
    reference: https://aur.archlinux.org/packages/uchardet-git
binlist:
- uchardet
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
