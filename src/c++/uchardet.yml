lang: C++
homepage: https://www.freedesktop.org/wiki/Software/uchardet/
desc:
  en: Encoding detector library
  cn: 编码检测器库
rule:
  darwin/brew:
    cmd: brew install uchardet
    reference: https://formulae.brew.sh/formula/uchardet#default
  arch/yay:
    cmd: yay -S uchardet-git
    reference: https://aur.archlinux.org/packages/uchardet-git
binlist:
- uchardet
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
