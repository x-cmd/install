lang: C++
homepage: https://github.com/ceres-solver/ceres-solver
desc:
  cn: Ceres Solver 是一个开源的 C + + 库，用于建模和解决大型、复杂的优化问题
  en: Ceres Solver is an open source C++ library for modeling and solving large, complicated optimization problems
x:
  source: https://github.com/ceres-solver/ceres-solver
rule:
  darwin/brew:
    cmd: brew install ceres-solver
    reference: http://ceres-solver.org/installation.html#macos
  darwin/port:
    cmd: sudo port install ceres-solver
    reference: http://ceres-solver.org/installation.html#macos
  arch/yay:
    cmd: yay -S ceres-solver-git
    reference: https://aur.archlinux.org/packages/ceres-solver-git
binlist:
- ceres-solver
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
