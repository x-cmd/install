lang: C++
homepage: https://github.com/Ultimaker/CppUnit
license: LGPL-2.1
desc:
  en: CppUnit is the C++ port of the famous JUnit framework for unit testing
  cn: CppUnit 是著名的 JUnit 框架 for unit 的 C + + 端口测试
x:
  source: https://github.com/Ultimaker/CppUnit
rule:
  darwin/brew:
    cmd: brew install cppunit
    reference: https://formulae.brew.sh/formula/cppunit#default
binlist:
- cppunit

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
