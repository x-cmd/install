lang: C
homepage: https://github.com/sqlite/sqlite
desc:
  cn: SQLite 是一个 C 语言库，它实现了一个小型、快速、自包含、高可靠、功能齐全的 SQL 数据库引擎
  en: SQLite is a C-language library that implements a small, fast, self-contained, high-reliability, full-featured, SQL database engine
x:
  pkg:
    exist: true
  source: https://github.com/sqlite/sqlite
rule:
  /x:
    cmd: x pkg use sqlite3
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install sqlite
    reference: https://formulae.brew.sh/formula/sqlite#default
  debian/apt:
    cmd: sudo apt-get install sqlite3
    reference: https://command-not-found.com/sqlite3
    dsnap: sqlite3
  ubuntu/apt:
    cmd: sudo apt-get install sqlite3
    reference: https://command-not-found.com/sqlite3
    dsnap: sqlite3
  alpine/apk:
    cmd: sudo apk add sqlite
    reference: https://command-not-found.com/sqlite3
    dsnap: sqlite
  arch/pacman:
    cmd: sudo pacman -S sqlite3
    reference: https://command-not-found.com/sqlite3
  kali/apt:
    cmd: sudo apt-get install sqlite
    reference: https://command-not-found.com/sqlite3
    dsnap: sqlite
  centos/yum:
    cmd: sudo yum install sqlite
    reference: https://command-not-found.com/sqlite3
  fedora/dnf:
    cmd: sudo dnf install sqlite
    reference: https://command-not-found.com/sqlite3
    dsnap: sqlite
  raspbian/apt:
    cmd: sudo apt-get install sqlite3
    reference: https://command-not-found.com/sqlite3
binlist:
- sqlite3
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
