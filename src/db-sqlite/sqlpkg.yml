lang: Go
homepage: https://github.com/nalgeon/sqlpkg-cli
license: MIT
desc:
  cn: sqlpkg 管理 SQLite 扩展，就像 pip 对 Python 包所做的操作或 brew 对 macOS 程序所做的操作一样
  en: sqlpkg manages SQLite extensions, just like pip does with Python packages or brew does with macOS programs
x:
  source: https://github.com/nalgeon/sqlpkg-cli
  eget: https://github.com/nalgeon/sqlpkg-cli
rule:
  /eget:
    cmd: x eget nalgeon/sqlpkg-cli
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -sS https://webi.sh/sqlpkg | sh
    reference: https://github.com/nalgeon/sqlpkg-cli?tab=readme-ov-file#download-and-install-preferred-method
  linux/curl:
    cmd: curl -sS https://webi.sh/sqlpkg | sh
    reference: https://github.com/nalgeon/sqlpkg-cli?tab=readme-ov-file#download-and-install-preferred-method
  win/curl:
    cmd: curl.exe https://webi.ms/sqlpkg | powershell
    reference: https://github.com/nalgeon/sqlpkg-cli?tab=readme-ov-file#download-and-install-preferred-method
binlist:
- sqlpkg
