lang: 'Python'
homepage: 'https://github.com/Maxteabag/sqlit'
license: 'MIT'
desc:
  cn: Python 编写的友好 SQL 数据库 TUI，支持多种数据库
  en: 'A user friendly TUI for SQL databases. Written in python. Supports SQL server, Mysql, PostreSQL, SQLite, Turso and more.'
x:
  source: https://github.com/Maxteabag/sqlit
  eget: https://github.com/Maxteabag/sqlit
rule:
  /eget:
    cmd: x eget Maxteabag/sqlit
    reference: https://github.com/Maxteabag/sqlit
binlist:
  - 'sqlit'

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 203 KB
          rating: 1
          desc:
            cn: 约 203 KB（估算）
            en: ~203 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
