lang: 'Python'
homepage: 'https://github.com/Maxteabag/sqlit'
license: 'MIT'
desc:
  cn: Python 编写的友好 SQL 数据库 TUI，支持多种数据库
  en: 'A user friendly TUI for SQL databases. Written in python. Supports SQL server, Mysql, PostreSQL, SQLite, Turso and more.'
x:
  source: https://github.com/Maxteabag/sqlit
  eget: https://github.com/Maxteabag/sqlit
rule:
  /eget:
    cmd: x eget Maxteabag/sqlit
    reference: https://github.com/Maxteabag/sqlit
binlist:
  - 'sqlit'

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
