lang: Go
homepage: https://github.com/proofrock/ws4sqlite
license: ISC
desc:
  cn: ws4sqlite 是一个服务器端应用程序，应用于一个或多个 SQLite 文件，允许通过 REST（或更好地说，通过 HTTP 上的 JSON）对它们执行 SQL 查询和语句
  en: ws4sqlite is a server-side application that, applied to one or more SQLite files, allows to perform SQL queries and statements on them via REST (or better, JSON over HTTP)
x:
  pkg:
    exist: true
  source: https://github.com/proofrock/ws4sqlite
  eget: https://github.com/proofrock/ws4sqlite
rule:
  /x:
    cmd: x pkg use ws4sqlite
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget proofrock/ws4sqlite
    reference: https://x-cmd.com/mod/eget
  linux/build:
    cmd: 'git clone https://github.com/proofrock/ws4sqlite \

      && cd ws4sqlite \

      && make build

      '
    reference: https://germ.gitbook.io/ws4sqlite/building-and-testing#building
  darwin/build:
    cmd: 'git clone https://github.com/proofrock/ws4sqlite \

      && cd ws4sqlite \

      && make build-nostatic

      '
    reference: https://germ.gitbook.io/ws4sqlite/building-and-testing#building
  arch/yay:
    cmd: yay -S ws4sqlite-bin
    reference: https://aur.archlinux.org/packages/ws4sqlite-bin
binlist:
- ws4sqlite

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
