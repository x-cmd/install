lang: Go
homepage: https://github.com/benbjohnson/litestream
license: Apache-2.0
desc:
  cn: Litestream 是 SQLite 的独立灾难恢复工具
  en: Litestream is a standalone disaster recovery tool for SQLite
  cs: Litestream je samostatný nástroj pro obnovu po katastrofách pro SQLite
  de: Litestream ist ein eigenständiges Disaster-Recovery-Tool für SQLite
  es: Litestream es una herramienta independiente de recuperación ante desastres para SQLite
  fr: Litestream est un outil de reprise après sinistre autonome pour SQLite
  id: Litestream adalah alat pemulihan bencana mandiri untuk SQLite
  it: Litestream è uno strumento di ripristino dopo i disastri autonomo per SQLite
  ja: Litestream は SQLite 向けの独立した災害復旧ツールです
  ko: Litestream은 SQLite를 위한 독립적인 재해 복구 도구입니다
  pl: Litestream to samodzielne narzędzie do odtwarzania po awariach dla SQLite
  pt: Litestream é uma ferramenta independente de recuperação de desastres para o SQLite
  ro: Litestream este un instrument independent de recuperare în caz de dezastre pentru SQLite
  ru: Litestream — автономный инструмент аварийного восстановления для SQLite
  th: Litestream เป็นเครื่องมือกู้คืนระบบภัยภาพสำหรับ SQLite แบบสแตนด์อโลน
  tr: Litestream, SQLite için bağımsız bir felaket kurtarma aracıdır
  uk: Litestream — автономний інструмент аварійного відновлення для SQLite
  vi: Litestream là công cụ khôi phục thảm họa độc lập cho SQLite
x:
  source: https://github.com/benbjohnson/litestream
  eget: benbjohnson/litestream
  brew: benbjohnson/litestream/litestream
  yay: litestream
rule:
  /eget:
    cmd: x eget benbjohnson/litestream
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install benbjohnson/litestream/litestream
    reference: https://litestream.io/install/mac/
  debian/wget:
    cmd: 'wget https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.deb \

      && sudo dpkg -i litestream-v0.3.13-linux-amd64.deb

      '
    reference: https://litestream.io/install/debian/
  /go:
    cmd: go install ./cmd/litestream
    reference: https://litestream.io/install/source/
    dsnap: litestream
  arch/yay:
    cmd: yay -S litestream
    reference: https://aur.archlinux.org/packages/litestream
binlist:
- litestream

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 安装 13 MB
            en: 13 MB install
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
