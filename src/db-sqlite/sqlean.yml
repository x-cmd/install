lang: C
homepage: https://github.com/nalgeon/sqlean
license: MIT
desc:
  cn: sqlean 是 sqlite 的扩展集合
  en: sqlean is an extended collection of sqlite
x:
  source: https://github.com/nalgeon/sqlean
  eget: https://github.com/nalgeon/sqlean
  yay: sqlean-bin
  curl: curl
rule:
  /x:
    cmd: x pkg use sqlean
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget nalgeon/sqlean
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -OL https://github.com/nalgeon/sqlite/releases/download/3.44.0/sqlean-macos
    reference: https://github.com/nalgeon/sqlite/releases/tag/3.44.0
  linux/curl:
    cmd: curl -OL https://github.com/nalgeon/sqlite/releases/download/3.44.0/sqlean-macos
    reference: https://github.com/nalgeon/sqlite/releases/tag/3.44.0
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/nalgeon/sqlite/releases/download/3.44.0/sqlean.exe -OutFile sqlean.exe
    reference: https://github.com/nalgeon/sqlite/releases/tag/3.44.0
  arch/yay:
    cmd: yay -S sqlean-bin
    reference: https://aur.archlinux.org/packages/sqlean-bin
binlist:
- sqlean

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.9 MB
          rating: 1
          desc:
            cn: 约 2.9 MB（估算）
            en: ~2.9 MB estimated
        download:
          estimate: 642 KB
          desc:
            cn: 约 642 KB 下载 (linux/x64)
            en: ~642 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
