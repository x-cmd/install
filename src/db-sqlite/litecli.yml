lang: Python
homepage: https://github.com/dbcli/litecli
license: BSD-3-Clause
desc:
  cn: 用于 SQLite 数据库的 CLI，具有自动完成和语法突出显示功能
  en: CLI for SQLite Databases with auto-completion and syntax highlighting
x:
  pkg:
    exist: true
  source: https://github.com/dbcli/litecli
rule:
  /x:
    cmd: x pkg use litecli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install -U litecli
    reference: https://github.com/dbcli/litecli#installation
    dsnap: litecli
  darwin/brew:
    cmd: brew install litecli
    reference: https://formulae.brew.sh/formula/litecli#default
  arch/yay:
    cmd: yay -S litecli
    reference: https://github.com/dbcli/litecli#installation
binlist:
- litecli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 约 11 KB（估算）
            en: ~11 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
