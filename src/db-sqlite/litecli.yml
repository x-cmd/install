lang: Python
homepage: https://github.com/dbcli/litecli
license: BSD-3-Clause
desc:
  cn: 用于 SQLite 数据库的 CLI，具有自动完成和语法突出显示功能
  en: CLI for SQLite Databases with auto-completion and syntax highlighting
  cs: CLI pro databáze SQLite s automatickým dokončováním a zvýrazňováním syntaxe
  de: CLI für SQLite-Datenbanken mit Autovervollständigung und Syntaxhervorhebung
  es: CLI para bases de datos SQLite con autocompletado y resaltado de sintaxis
  fr: CLI pour les bases de données SQLite avec auto-complétion et coloration syntaxique
  id: CLI untuk basis data SQLite dengan autocompletion dan penyorotan sintaks
  it: CLI per database SQLite con completamento automatico ed evidenziazione della sintassi
  ja: 自動補完とシンタックスハイライトを備えた SQLite データベース用の CLI
  ko: 자동 완성 및 구문 강조 기능을 갖춘 SQLite 데이터베이스용 CLI
  pl: CLI dla baz danych SQLite z autouzupełnianiem i podświetlaniem składni
  pt: CLI para bancos de dados SQLite com autocompletar e realce de sintaxe
  ro: CLI pentru baze de date SQLite cu autocompletare și evidențierea sintaxei
  ru: CLI для баз данных SQLite с автодополнением и подсветкой синтаксиса
  th: CLI สำหรับฐานข้อมูล SQLite พร้อมการเติมเต็มอัตโนมัติและการเน้นไวยากรณ์
  tr: Otomatik tamamlama ve sözdizimi vurgulama özellikli SQLite veritabanları için CLI
  uk: CLI для баз даних SQLite з автозавершенням і підсвічуванням синтаксису
  vi: CLI cho cơ sở dữ liệu SQLite với tự động hoàn thành và tô sáng cú pháp
x:
  source: https://github.com/dbcli/litecli
  brew: litecli
  yay: litecli
rule:
  /x:
    cmd: x pkg use litecli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install -U litecli
    reference: https://github.com/dbcli/litecli#installation
    dsnap: litecli
  darwin/brew:
    cmd: brew install litecli
    reference: https://formulae.brew.sh/formula/litecli#default
  arch/yay:
    cmd: yay -S litecli
    reference: https://github.com/dbcli/litecli#installation
binlist:
- litecli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 约 11 KB（估算）
            en: ~11 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
