lang: Python
homepage: https://github.com/dbcli/litecli
license: BSD-3-Clause
desc:
  cn: 用于 SQLite 数据库的 CLI，具有自动完成和语法突出显示功能
  en: CLI for SQLite Databases with auto-completion and syntax highlighting
x:
  pkg:
    exist: true
  source: https://github.com/dbcli/litecli
rule:
  /x:
    cmd: x pkg use litecli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install -U litecli
    reference: https://github.com/dbcli/litecli#installation
    dsnap: litecli
  darwin/brew:
    cmd: brew install litecli
    reference: https://formulae.brew.sh/formula/litecli#default
  arch/yay:
    cmd: yay -S litecli
    reference: https://github.com/dbcli/litecli#installation
binlist:
- litecli

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
