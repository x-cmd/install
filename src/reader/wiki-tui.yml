lang: Rust
homepage: https://github.com/Builditluc/wiki-tui
license: MIT
desc:
  cn: wiki-tui 是一个简单易用的 Rust 编写的维基百科文本用户界面。
  en: wiki-tui is a simple and easy-to-use Wikipedia text user interface written in rust
x:
  source: https://github.com/Builditluc/wiki-tui
  eget: https://github.com/Builditluc/wiki-tui
  xbps: wiki-tui
  cargo: wiki-tui
rule:
  /eget:
    cmd: x eget Builditluc/wiki-tui
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
    dsnap: wiki-tui
  void/xbps:
    cmd: xbps-install -S wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
  nix/nix-env:
    cmd: nix-env -iA wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
  freebsd/pkg:
    cmd: pkg install wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
  netbsd/pkgin:
    cmd: pkgin install wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
binlist:
- wiki-tui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/arm64)
            en: ~3 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
