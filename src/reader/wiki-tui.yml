lang: Rust
homepage: https://github.com/Builditluc/wiki-tui
license: MIT
desc:
  cn: wiki-tui 是一个简单易用的 Rust 编写的维基百科文本用户界面。
  en: wiki-tui is a simple and easy-to-use Wikipedia text user interface written in rust
  cs: wiki-tui je jednoduché a uživatelsky přívětivé textové uživatelské rozhraní Wikipedie napsané v Rustu
  de: wiki-tui ist eine einfache, benutzerfreundliche textbasierte Wikipedia-Oberfläche, geschrieben in Rust
  es: wiki-tui es una interfaz de usuario de texto de Wikipedia simple y fácil de usar escrita en Rust
  fr: wiki-tui est une interface utilisateur textuelle de Wikipedia simple et facile à utiliser, écrite en Rust
  id: wiki-tui adalah antarmuka pengguna teks Wikipedia yang sederhana dan mudah digunakan, ditulis dengan Rust
  it: wiki-tui è un'interfaccia utente testuale di Wikipedia semplice e facile da usare, scritta in Rust
  ja: wiki-tui は Rust で書かれたシンプルで使いやすい Wikipedia のテキストユーザーインターフェースです
  ko: wiki-tui는 Rust로 작성된 간단하고 사용하기 쉬운 Wikipedia 텍스트 사용자 인터페이스입니다
  pl: wiki-tui to prosty i łatwy w użyciu tekstowy interfejs użytkownika Wikipedii napisany w Rust
  pt: wiki-tui é uma interface de usuário de texto da Wikipedia simples e fácil de usar, escrita em Rust
  ro: wiki-tui este o interfață textuală simplă și ușor de folosit pentru Wikipedia, scrisă în Rust
  ru: wiki-tui — простой и удобный текстовый интерфейс Википедии, написанный на Rust
  th: wiki-tui คือส่วนติดต่อผู้ใช้แบบข้อความของวิกิพีเดียที่เรียบง่ายและใช้งานง่าย เขียนด้วย Rust
  tr: wiki-tui, Rust ile yazılmış basit ve kullanımı kolay bir Wikipedia metin kullanıcı arayüzüdür
  uk: wiki-tui — простий і зручний текстовий інтерфейс користувача Вікіпедії, написаний на Rust
  vi: wiki-tui là giao diện người dùng văn bản của Wikipedia đơn giản và dễ dùng, viết bằng Rust
x:
  source: https://github.com/Builditluc/wiki-tui
  eget: Builditluc/wiki-tui
  xbps: wiki-tui
  cargo: wiki-tui
rule:
  /eget:
    cmd: x eget Builditluc/wiki-tui
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
    dsnap: wiki-tui
  void/xbps:
    cmd: xbps-install -S wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
  nix/nix-env:
    cmd: nix-env -iA wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
  freebsd/pkg:
    cmd: pkg install wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
  netbsd/pkgin:
    cmd: pkgin install wiki-tui
    reference: https://wiki-tui.net/latest/getting-started/installation/
binlist:
- wiki-tui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/arm64)
            en: ~3 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
