lang: 'Rust'
homepage: https://github.com/bgreenwell/doxx
license: 'MIT'
desc:
  cn: 在终端中直接查看 .docx 文件内容，无需 Office
  en: 'Expose the contents of .docx files without leaving your terminal. Fast, safe, and smart — no Office required!'
x:
  source: https://github.com/bgreenwell/doxx
  eget: bgreenwell/doxx
rule:
  /eget:
    cmd: x eget bgreenwell/doxx
    reference: https://github.com/bgreenwell/doxx
binlist:
- 'doxx'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
