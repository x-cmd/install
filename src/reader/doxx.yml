lang: 'Rust'
homepage: https://github.com/bgreenwell/doxx
license: 'MIT'
desc:
  cn: 在终端中直接查看 .docx 文件内容，无需 Office
  en: 'Expose the contents of .docx files without leaving your terminal. Fast, safe, and smart — no Office required!'
x:
  source: https://github.com/bgreenwell/doxx
  eget: https://github.com/bgreenwell/doxx
rule:
  /eget:
    cmd: x eget bgreenwell/doxx
    reference: https://github.com/bgreenwell/doxx
binlist:
  - 'doxx'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
