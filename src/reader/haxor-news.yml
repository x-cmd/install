lang: Python
homepage: https://github.com/donnemartin/haxor-news
desc:
  cn: 在命令行查看和过滤 Hacker News 的帖子、评论和链接的 Web 内容
  en: 'View and filter Hacker News from the command line: Posts, comments, and linked web content.'
x:
  source: https://github.com/donnemartin/haxor-news
  yay: haxor-news
  pip: haxor-news
rule:
  /x:
    cmd: x pkg use haxor-news
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install haxor-news
    reference: https://github.com/donnemartin/haxor-news#pip-installation
    dsnap: haxor-news
  darwin/pip:
    cmd: sudo pip install haxor-news --upgrade --ignore-installed six
    reference: https://github.com/donnemartin/haxor-news#mac-os-x-1011-el-capitan-users
  arch/yay:
    cmd: yay -S haxor-news
    reference: https://aur.archlinux.org/packages/haxor-news
binlist:
- haxor-news
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 KB
          rating: 1
          desc:
            cn: 约 13 KB（估算）
            en: ~13 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
