lang: Go
homepage: https://github.com/charmbracelet/glow
license: MIT
desc:
  cn: glow 是一个基于终端的 markdown 阅读器
  en: glow is a terminal based markdown reader
x:
  source: https://github.com/charmbracelet/glow
  eget: https://github.com/charmbracelet/glow
rule:
  /eget:
    cmd: x eget charmbracelet/glow
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use glow
    reference: https://github.com/chessmango/asdf-glow
  darwin/brew:
    cmd: brew install glow
    reference: https://formulae.brew.sh/formula/glow#default
  darwin/port:
    cmd: sudo port install glow
    reference: https://github.com/charmbracelet/glow#package-manager
  debian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
    dsnap: glow
  ubuntu/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
    dsnap: glow
  arch/pacman:
    cmd: sudo pacman -S glow
    reference: https://github.com/charmbracelet/glow#package-manager
  kali/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
    dsnap: glow
  rhel/yum:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' \

      && sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
  fedora/yum:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' \

      && sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
  raspbian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
  nix/nixpkgs:
    cmd: sudo nix-env -iA nixpkgs.glow
    reference: https://github.com/charmbracelet/glow#package-manager
  (win|wsl2)/scoop:
    cmd: x scoop install glow
    reference: https://github.com/charmbracelet/glow#package-manager
  (win|wsl2)/choco:
    cmd: x choco install glow
    reference: https://github.com/charmbracelet/glow#package-manager
  void/xbps:
    cmd: sudo xbps-install -S glow
    reference: https://github.com/charmbracelet/glow#package-manager
  freebsd/pkg:
    cmd: pkg install glow
    reference: https://github.com/charmbracelet/glow#package-manager
  solus/eopkg:
    cmd: sudo eopkg install glow
    reference: https://github.com/charmbracelet/glow#package-manager
binlist:
- glow
