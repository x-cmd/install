lang: Go
homepage: https://github.com/charmbracelet/glow
license: MIT
desc:
  cn: glow 是一个基于终端的 markdown 阅读器
  en: glow is a terminal based markdown reader
  cs: glow je čtečka markdownu pro terminál
  de: glow ist ein Markdown-Reader für das Terminal
  es: glow es un lector de markdown basado en terminal
  fr: glow est un lecteur markdown pour le terminal
  id: glow adalah pembaca markdown berbasis terminal
  it: glow è un lettore markdown basato su terminale
  ja: glow はターミナルベースの markdown リーダーです
  ko: glow는 터미널 기반 markdown 리더입니다
  pl: glow to czytnik markdown dla terminala
  pt: glow é um leitor de markdown baseado em terminal
  ro: glow este un cititor de markdown pentru terminal
  ru: glow — это терминальный просмотрщик markdown
  th: glow เป็นโปรแกรมอ่าน markdown บนเทอร์มินัล
  tr: glow, terminal için bir markdown okuyucusudur
  uk: glow — це термінальний переглядач markdown
  vi: glow là trình đọc markdown chạy trên terminal
x:
  source: https://github.com/charmbracelet/glow
  eget: charmbracelet/glow
  apt: glow
  dnf: glow
  brew: glow
  pacman: glow
  yum: glow
  port: glow
  xbps: glow
  eopkg: glow
  scoop: glow
  choco: glow
  asdf: glow
rule:
  /eget:
    cmd: x eget charmbracelet/glow
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use glow
    reference: https://github.com/chessmango/asdf-glow
  darwin/brew:
    cmd: brew install glow
    reference: https://formulae.brew.sh/formula/glow#default
  darwin/port:
    cmd: sudo port install glow
    reference: https://github.com/charmbracelet/glow#package-manager
  debian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
    dsnap: glow
  ubuntu/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
    dsnap: glow
  arch/pacman:
    cmd: sudo pacman -S glow
    reference: https://github.com/charmbracelet/glow#package-manager
  kali/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
    dsnap: glow
  rhel/yum:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' \

      && sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
  fedora/yum:
    cmd: 'echo ''[charm] \

      && name=Charm \

      && baseurl=https://repo.charm.sh/yum/ \

      && enabled=1 \

      && gpgcheck=1 \

      && gpgkey=https://repo.charm.sh/yum/gpg.key'' \

      && sudo tee /etc/yum.repos.d/charm.repo \

      && sudo yum install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
  raspbian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings \

      && curl -fsSL https://repo.charm.sh/apt/gpg.key \

      && sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg \

      && echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \

      && sudo tee /etc/apt/sources.list.d/charm.list \

      && sudo apt update \

      && sudo apt install glow

      '
    reference: https://github.com/charmbracelet/glow#package-manager
  nix/nixpkgs:
    cmd: sudo nix-env -iA nixpkgs.glow
    reference: https://github.com/charmbracelet/glow#package-manager
  (win|wsl2)/scoop:
    cmd: x scoop install glow
    reference: https://github.com/charmbracelet/glow#package-manager
  (win|wsl2)/choco:
    cmd: x choco install glow
    reference: https://github.com/charmbracelet/glow#package-manager
  void/xbps:
    cmd: sudo xbps-install -S glow
    reference: https://github.com/charmbracelet/glow#package-manager
  freebsd/pkg:
    cmd: pkg install glow
    reference: https://github.com/charmbracelet/glow#package-manager
  solus/eopkg:
    cmd: sudo eopkg install glow
    reference: https://github.com/charmbracelet/glow#package-manager
binlist:
- glow

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 18 MB
          rating: 2
          desc:
            cn: 安装 18 MB
            en: 18 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 51 MB
        desc:
          cn: 51 MB
          en: 51 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
