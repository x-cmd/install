lang: Rust
homepage: https://github.com/kivikakk/comrak
desc:
  cn: CommonMark + GFM 兼容的 Markdown 解析器和渲染器
  en: CommonMark + GFM compatible Markdown parser and renderer
x:
  source: https://github.com/kivikakk/comrak
  eget: https://github.com/kivikakk/comrak
rule:
  /eget:
    cmd: x eget kivikakk/comrak
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl https://webinstall.dev/comrak | bash
    reference: https://github.com/kivikakk/comrak?tab=readme-ov-file#mac--linux-binaries
  linux/curl:
    cmd: curl https://webinstall.dev/comrak | bash
    reference: https://github.com/kivikakk/comrak?tab=readme-ov-file#mac--linux-binaries
  win/curl:
    cmd: curl.exe -A "MS" https://webinstall.dev/comrak | powershell
    reference: https://github.com/kivikakk/comrak?tab=readme-ov-file#windows-10-binaries
  arch/yay:
    cmd: yay -S comrak
    reference: https://aur.archlinux.org/packages/comrak
binlist:
- comrak
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 957 KB
          rating: 1
          desc:
            cn: 约 957 KB（估算）
            en: ~957 KB estimated
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
