lang: Go
homepage: https://github.com/guyfedwards/nom
license: GPL-3.0
desc:
  en: RSS reader for the terminal
  cn: 终端上的 RSS 阅读器
x:
  source: https://github.com/guyfedwards/nom
  eget: https://github.com/guyfedwards/nom
rule:
  /eget:
    cmd: x eget guyfedwards/nom
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/guyfedwards/nom/cmd/nom@latest
    reference: https://github.com/guyfedwards/nom?tab=readme-ov-file#install
    dsnap: github.com/guyfedwards/nom/cmd/nom@latest
binlist:
- nom

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
