lang: Go
homepage: https://github.com/guyfedwards/nom
license: GPL-3.0
desc:
  en: RSS reader for the terminal
  cn: 终端上的 RSS 阅读器
  cs: Čtečka RSS pro terminál
  de: RSS-Reader für das Terminal
  es: Lector de RSS para el terminal
  fr: Lecteur RSS pour le terminal
  id: Pembaca RSS untuk terminal
  it: Lettore RSS per il terminale
  ja: ターミナル用の RSS リーダー
  ko: 터미널용 RSS 리더
  pl: Czytnik RSS dla terminala
  pt: Leitor de RSS para o terminal
  ro: Cititor RSS pentru terminal
  ru: RSS-читалка для терминала
  th: โปรแกรมอ่าน RSS สำหรับเทอร์มินัล
  tr: Terminal için bir RSS okuyucu
  uk: RSS-читалка для термінала
  vi: Trình đọc RSS cho terminal
x:
  source: https://github.com/guyfedwards/nom
  eget: guyfedwards/nom
  go: github.com/guyfedwards/nom/cmd/nom@latest
rule:
  /eget:
    cmd: x eget guyfedwards/nom
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/guyfedwards/nom/cmd/nom@latest
    reference: https://github.com/guyfedwards/nom?tab=readme-ov-file#install
    dsnap: github.com/guyfedwards/nom/cmd/nom@latest
binlist:
- nom

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
