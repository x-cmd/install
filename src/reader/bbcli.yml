lang: Python
homepage: https://hako.github.io/bbcli/
desc:
  cn: 用于在终端访问 BBC 新闻的 TUI。
  en: A TUI for accessing BBC News in the terminal.
rule:
  /pip:
    cmd: pip install bbcli
    reference: https://github.com/hako/bbcli?tab=readme-ov-file#installation--usage
    dsnap: bbcli

x:
  pip: bbcli
binlist:
- bbcli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
