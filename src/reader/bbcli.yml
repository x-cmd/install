lang: Python
homepage: https://hako.github.io/bbcli/
desc:
  cn: 用于在终端访问 BBC 新闻的 TUI。
  en: A TUI for accessing BBC News in the terminal.
  cs: TUI pro přístup k BBC News v terminálu.
  de: Ein TUI für den Zugriff auf BBC News im Terminal.
  es: Una TUI para acceder a BBC News en la terminal.
  fr: Une TUI pour accéder à BBC News dans le terminal.
  id: TUI untuk mengakses BBC News di terminal.
  it: Una TUI per accedere alle notizie BBC dal terminale.
  ja: ターミナルで BBC News を閲覧するための TUI。
  ko: 터미널에서 BBC News에 접속하기 위한 TUI입니다.
  pl: TUI do przeglądania BBC News w terminalu.
  pt: Uma TUI para acessar a BBC News no terminal.
  ro: O TUI pentru accesarea BBC News în terminal.
  ru: TUI для доступа к BBC News в терминале.
  th: TUI สำหรับเข้าถึงข่าว BBC ในเทอร์มินัล
  tr: Terminalde BBC News'e erişmek için bir TUI.
  uk: TUI для доступу до BBC News у терміналі.
  vi: Giao diện TUI để truy cập BBC News trong terminal
rule:
  /pip:
    cmd: pip install bbcli
    reference: https://github.com/hako/bbcli?tab=readme-ov-file#installation--usage
    dsnap: bbcli

x:
  pip: bbcli
binlist:
- bbcli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
