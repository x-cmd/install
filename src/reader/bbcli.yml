lang: Python
homepage: https://hako.github.io/bbcli/
desc:
  cn: 用于在终端访问 BBC 新闻的 TUI。
  en: A TUI for accessing BBC News in the terminal.
rule:
  /pip:
    cmd: pip install bbcli
    reference: https://github.com/hako/bbcli?tab=readme-ov-file#installation--usage
    dsnap: bbcli
binlist:
- bbcli
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
