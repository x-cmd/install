lang: Go
homepage: https://github.com/miniflux/v2
license: Apache-2.0
desc:
  cn: 极简风格的自托管 RSS / Atom / JSON Feed 阅读器，Go 单二进制 + PostgreSQL
  en: A minimalist self-hosted RSS / Atom / JSON Feed reader. Go single binary + PostgreSQL.
  cs: Minimalistická samohostovaná čtečka RSS / Atom / JSON Feed. Jeden binární soubor v Go + PostgreSQL.
  de: Minimalistischer selbst gehosteter RSS / Atom / JSON Feed-Reader. Einzelnes Go-Binärdatei + PostgreSQL.
  es: Lector RSS / Atom / JSON Feed minimalista y autoalojado. Un único binario de Go + PostgreSQL.
  fr: Lecteur RSS / Atom / JSON Feed minimaliste et auto-hébergé. Binaire Go unique + PostgreSQL.
  id: Pembaca RSS / Atom / JSON Feed minimalistik yang di-hosting sendiri. Binari Go tunggal + PostgreSQL.
  it: Lettore RSS / Atom / JSON Feed minimalista e self-hosted. Singolo binario Go + PostgreSQL.
  ja: ミニマルなセルフホスト型 RSS / Atom / JSON Feed リーダー。Go シングルバイナリ + PostgreSQL。
  ko: 미니멀한 셀프호스팅 RSS / Atom / JSON Feed 리더. Go 단일 바이너리 + PostgreSQL.
  pl: Minimalistyczny, samodzielnie hostowany czytnik RSS / Atom / JSON Feed. Jeden plik binarny Go + PostgreSQL.
  pt: Leitor RSS / Atom / JSON Feed minimalista e auto-hospedado. Binário único em Go + PostgreSQL.
  ro: Cititor RSS / Atom / JSON Feed minimalist, găzduit propriu. Un singur binar Go + PostgreSQL.
  ru: Минималистичный самостоятельно размещаемый ридер RSS / Atom / JSON Feed. Один бинарник на Go + PostgreSQL.
  th: ตัวอ่าน RSS / Atom / JSON Feed แบบมินิมัลและโฮสต์เอง ไบนารี Go ไฟล์เดียว + PostgreSQL
  tr: Minimalist, kendi barındırdığınız RSS / Atom / JSON Feed okuyucu. Tek Go ikili dosyası + PostgreSQL.
  uk: Мінімалістичний самостійно розміщуваний рідер RSS / Atom / JSON Feed. Один бінарник на Go + PostgreSQL.
  vi: Trình đọc RSS / Atom / JSON Feed tối giản, tự host. Một tệp nhị phân Go duy nhất + PostgreSQL.
x:
  source: https://github.com/miniflux/v2
  eget: miniflux/v2
  brew: miniflux
  snap: miniflux
rule:
  /x:
    cmd: x pkg use miniflux
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget miniflux/v2
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install miniflux
    reference: https://formulae.brew.sh/formula/miniflux
  /snap:
    cmd: sudo snap install miniflux
    reference: https://snapcraft.io/miniflux
  /docker:
    cmd: "docker run -d --name miniflux \\\n    -p 8080:8080 \\\n    -e DATABASE_URL=postgres://miniflux:secret@db/miniflux?sslmode=disable \\\n    -e RUN_MIGRATIONS=1 \\\n    -e CREATE_ADMIN=1 \\\n    -e ADMIN_USERNAME=admin \\\n    -e ADMIN_PASSWORD=changeme \\\n    miniflux/miniflux:2.2\n"
    reference: https://miniflux.app/docs/installation.html
binlist:
- miniflux

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
