lang: Go
homepage: https://github.com/bensadeh/circumflex
license: MIT
desc:
  en: circumflex is a command line tool for browsing Hacker News in your terminal
  cn: circumflex 是一个命令行工具，用于在终端中浏览 Hacker News
x:
  source: https://github.com/bensadeh/circumflex
  eget: https://github.com/bensadeh/circumflex
rule:
  /eget:
    cmd: x eget bensadeh/circumflex
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install circumflex
    reference: https://formulae.brew.sh/formula/circumflex
  arch/yay:
    cmd: yay -S circumflex
    reference: https://aur.archlinux.org/packages/circumflex
binlist:
- circumflex

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 安装 12 MB
            en: 12 MB install
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
