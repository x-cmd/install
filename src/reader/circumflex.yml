lang: Go
homepage: https://github.com/bensadeh/circumflex
license: MIT
desc:
  en: circumflex is a command line tool for browsing Hacker News in your terminal
  cn: circumflex 是一个命令行工具，用于在终端中浏览 Hacker News
  cs: circumflex je nástroj příkazové řádky pro prohlížení Hacker News v terminálu
  de: circumflex ist ein Kommandozeilenwerkzeug zum Browsen von Hacker News im Terminal
  es: circumflex es una herramienta de línea de comandos para navegar por Hacker News en tu terminal
  fr: circumflex est un outil en ligne de commande pour parcourir Hacker News dans votre terminal
  id: circumflex adalah alat baris perintah untuk menjelajahi Hacker News di terminal Anda
  it: circumflex è uno strumento da riga di comando per esplorare Hacker News nel terminale
  ja: circumflex はターミナルで Hacker News を閲覧するためのコマンドラインツールです
  ko: circumflex는 터미널에서 Hacker News를 탐색하기 위한 명령줄 도구입니다
  pl: circumflex to narzędzie wiersza poleceń do przeglądania Hacker News w terminalu
  pt: circumflex é uma ferramenta de linha de comando para navegar no Hacker News no seu terminal
  ro: circumflex este un instrument de linie de comandă pentru a parcurge Hacker News în terminalul dvs.
  ru: circumflex — это инструмент командной строки для просмотра Hacker News в терминале
  th: circumflex คือเครื่องมือบรรทัดคำสั่งสำหรับเลือกดู Hacker News ในเทอร์มินัลของคุณ
  tr: circumflex, terminalde Hacker News gezmek için bir komut satırı aracıdır
  uk: circumflex — це інструмент командного рядка для перегляду Hacker News у терміналі
  vi: circumflex là công cụ dòng lệnh để duyệt Hacker News trong terminal của bạn
x:
  source: https://github.com/bensadeh/circumflex
  eget: bensadeh/circumflex
  brew: circumflex
  yay: circumflex
rule:
  /eget:
    cmd: x eget bensadeh/circumflex
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install circumflex
    reference: https://formulae.brew.sh/formula/circumflex
  arch/yay:
    cmd: yay -S circumflex
    reference: https://aur.archlinux.org/packages/circumflex
binlist:
- circumflex

