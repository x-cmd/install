lang: Python
homepage: https://github.com/thread53/pqviewer?ref=terminaltrove
license: MIT
desc:
  cn: pqviewer 是一个 TUI 工具，用于直接在终端中查看 Apache Parquet 文件。
  en: pqviewer is a TUI tool for viewing Apache Parquet files directly in the terminal.
x:
  source: https://github.com/thread53/pqviewer?ref=terminaltrove
rule:
  /pip:
    cmd: pip install pqviewer
    reference: https://github.com/thread53/pqviewer?tab=readme-ov-file#installing-pqviewer
    dsnap: pqviewer
binlist:
- pqviewer

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: false
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
