lang: Python
homepage: https://github.com/thread53/pqviewer?ref=terminaltrove
license: MIT
desc:
  cn: pqviewer 是一个 TUI 工具，用于直接在终端中查看 Apache Parquet 文件。
  en: pqviewer is a TUI tool for viewing Apache Parquet files directly in the terminal.
x:
  source: https://github.com/thread53/pqviewer?ref=terminaltrove
rule:
  /pip:
    cmd: pip install pqviewer
    reference: https://github.com/thread53/pqviewer?tab=readme-ov-file#installing-pqviewer
    dsnap: pqviewer
binlist:
- pqviewer

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
