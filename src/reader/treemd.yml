lang: 'Rust'
homepage: https://github.com/Epistates/treemd
license: 'MIT'
desc:
  cn: 基于树状结构导航的 Markdown 浏览器（TUI/CLI）
  en: 'A (TUI/CLI) markdown navigator with tree-based structural navigation.'
x:
  source: https://github.com/Epistates/treemd
  eget: https://github.com/Epistates/treemd
rule:
  /eget:
    cmd: x eget Epistates/treemd
    reference: https://github.com/Epistates/treemd
binlist:
- 'treemd'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
