lang: 'Rust'
homepage: https://github.com/Epistates/treemd
license: 'MIT'
desc:
  cn: 基于树状结构导航的 Markdown 浏览器（TUI/CLI）
  en: 'A (TUI/CLI) markdown navigator with tree-based structural navigation.'
  cs: Markdown navigátor (TUI/CLI) se stromovou strukturální navigací.
  de: Ein (TUI/CLI) Markdown-Navigator mit baumbasierter Struktur-Navigation.
  es: Un navegador de markdown (TUI/CLI) con navegación estructural basada en árbol.
  fr: Un navigateur markdown (TUI/CLI) avec une navigation structurelle arborescente.
  id: Penjelajah markdown (TUI/CLI) dengan navigasi struktural berbasis pohon.
  it: Un navigatore markdown (TUI/CLI) con navigazione strutturale ad albero.
  ja: ツリー構造ナビゲーションを備えた (TUI/CLI) markdown ナビゲーター。
  ko: 트리 구조 탐색을 지원하는 (TUI/CLI) markdown 탐색기.
  pl: Nawigator markdown (TUI/CLI) z nawigacją strukturalną opartą na drzewie.
  pt: Um navegador de markdown (TUI/CLI) com navegação estrutural em árvore.
  ro: Un navigator markdown (TUI/CLI) cu navigare structurală bazată pe arbore.
  ru: Markdown-навигатор (TUI/CLI) с древовидной структурной навигацией.
  th: ตัวนำทาง markdown (TUI/CLI) พร้อมการนำทางโครงสร้างแบบต้นไม้
  tr: Ağaç tabanlı yapısal gezinmeye sahip (TUI/CLI) markdown gezgini.
  uk: Markdown-навігатор (TUI/CLI) з деревоподібною структурною навігацією.
  vi: Trình duyệt markdown (TUI/CLI) với điều hướng cấu trúc dạng cây.
x:
  source: https://github.com/Epistates/treemd
  eget: Epistates/treemd
rule:
  /eget:
    cmd: x eget Epistates/treemd
    reference: https://github.com/Epistates/treemd
binlist:
- 'treemd'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
