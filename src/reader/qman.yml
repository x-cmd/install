lang: 'C'
homepage: 'https://github.com/plp13/qman'
license: 'BSD-2-Clause'
desc:
  cn: 更现代的终端 man 手册查看器
  en: 'A more modern man page viewer for our terminals'
x:
  source: https://github.com/plp13/qman
  eget: https://github.com/plp13/qman
rule:
  /eget:
    cmd: x eget plp13/qman
    reference: https://github.com/plp13/qman
binlist:
  - 'qman'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
