lang: 'C'
homepage: 'https://github.com/plp13/qman'
license: 'BSD-2-Clause'
desc:
  cn: 更现代的终端 man 手册查看器
  en: 'A more modern man page viewer for our terminals'
x:
  source: https://github.com/plp13/qman
  eget: plp13/qman
rule:
  /eget:
    cmd: x eget plp13/qman
    reference: https://github.com/plp13/qman
binlist:
  - 'qman'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 296 KB
          rating: 1
          desc:
            cn: 约 296 KB（估算）
            en: ~296 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
