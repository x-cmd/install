lang: 'Rust'
homepage: 'https://github.com/christo-auer/eilmeldung'
license: 'GPL-3.0'
desc:
  cn: 基于 news-flash 库的 TUI RSS 阅读器
  en: 'eilmeldung is a TUI RSS reader based on the awesome news-flash library.'
  cs: eilmeldung je TUI čtečka RSS postavená na skvělé knihovně news-flash.
  de: eilmeldung ist ein TUI-RSS-Reader auf Basis der tollen news-flash-Bibliothek.
  es: eilmeldung es un lector RSS de TUI basado en la excelente biblioteca news-flash.
  fr: eilmeldung est un lecteur RSS en TUI basé sur l'excellente bibliothèque news-flash.
  id: eilmeldung adalah pembaca RSS TUI berbasis pada pustaka news-flash yang luar biasa.
  it: eilmeldung è un lettore RSS TUI basato sull'eccellente libreria news-flash.
  ja: eilmeldung は皮下な news-flash ライブラリに基づいた TUI RSS リーダーです。
  ko: eilmeldung은 훌륭한 news-flash 라이브러리를 기반으로 한 TUI RSS 리더입니다.
  pl: eilmeldung to czytnik RSS w TUI oparty na świetnej bibliotece news-flash.
  pt: eilmeldung é um leitor RSS de TUI baseado na excelente biblioteca news-flash.
  ro: eilmeldung este un cititor RSS TUI bazat pe excelenta bibliotecă news-flash.
  ru: eilmeldung — это TUI-читалка RSS на основе замечательной библиотеки news-flash.
  th: eilmeldung คือโปรแกรมอ่าน RSS แบบ TUI ที่สร้างบนไลบรารี news-flash อันยอดเยี่ยม
  tr: eilmeldung, harika news-flash kütüphanesine dayanan bir TUI RSS okuyucusudur.
  uk: eilmeldung — це TUI-читалка RSS на основі чудової бібліотеки news-flash.
  vi: eilmeldung là trình đọc RSS TUI dựa trên thư viện news-flash tuyệt vời
x:
  source: https://github.com/christo-auer/eilmeldung
  eget: christo-auer/eilmeldung
  yay: eilmeldung
  cargo: eilmeldung
rule:
  /cargo:
    cmd: 'cargo install eilmeldung --locked'
    reference: https://github.com/christo-auer/eilmeldung
  arch/pacman:
    cmd: 'yay -S eilmeldung'
    reference: https://github.com/christo-auer/eilmeldung
  /eget:
    cmd: x eget christo-auer/eilmeldung
    reference: https://github.com/christo-auer/eilmeldung
binlist:
  - 'eilmeldung'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 581 KB
          rating: 1
          desc:
            cn: 约 581 KB（估算）
            en: ~581 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
