lang: 'Rust'
homepage: 'https://github.com/christo-auer/eilmeldung'
license: 'GPL-3.0'
desc:
  cn: 基于 news-flash 库的 TUI RSS 阅读器
  en: 'eilmeldung is a TUI RSS reader based on the awesome news-flash library.'
x:
  source: https://github.com/christo-auer/eilmeldung
  eget: https://github.com/christo-auer/eilmeldung
rule:
  /cargo:
    cmd: 'cargo install eilmeldung --locked'
    reference: https://github.com/christo-auer/eilmeldung
  arch/pacman:
    cmd: 'yay -S eilmeldung'
    reference: https://github.com/christo-auer/eilmeldung
  /eget:
    cmd: x eget christo-auer/eilmeldung
    reference: https://github.com/christo-auer/eilmeldung
binlist:
  - 'eilmeldung'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
