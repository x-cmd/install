lang: 'Haskell'
homepage: 'https://github.com/jaspervdj/patat'
license: 'GPL-2.0'
desc:
  cn: 基于 Pandoc 的终端演示工具
  en: 'Terminal-based presentations using Pandoc'
x:
  source: https://github.com/jaspervdj/patat
  eget: https://github.com/jaspervdj/patat
rule:
  /eget:
    cmd: x eget jaspervdj/patat
    reference: https://github.com/jaspervdj/patat
binlist:
- 'patat'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
