lang: 'Haskell'
homepage: 'https://github.com/jaspervdj/patat'
license: 'GPL-2.0'
desc:
  cn: 基于 Pandoc 的终端演示工具
  en: 'Terminal-based presentations using Pandoc'
x:
  source: https://github.com/jaspervdj/patat
  eget: https://github.com/jaspervdj/patat
rule:
  /eget:
    cmd: x eget jaspervdj/patat
    reference: https://github.com/jaspervdj/patat
binlist:
  - 'patat'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
