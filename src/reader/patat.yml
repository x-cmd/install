lang: 'Haskell'
homepage: 'https://github.com/jaspervdj/patat'
license: 'GPL-2.0'
desc:
  cn: 基于 Pandoc 的终端演示工具
  en: 'Terminal-based presentations using Pandoc'
  cs: Prezentace v terminálu založené na Pandoc
  de: Terminalbasierte Präsentationen mit Pandoc
  es: Presentaciones basadas en terminal que usan Pandoc
  fr: Présentations en terminal utilisant Pandoc
  id: Presentasi berbasis terminal yang menggunakan Pandoc
  it: Presentazioni basate su terminale che usano Pandoc
  ja: Pandoc を使ったターミナルベースのプレゼンテーション
  ko: Pandoc을 사용하는 터미널 기반 프레젠테이션
  pl: Prezentacje w terminalu oparte na Pandoc
  pt: Apresentações baseadas em terminal usando o Pandoc
  ro: Prezentări bazate pe terminal care folosesc Pandoc
  ru: Презентации в терминале на базе Pandoc
  th: งานนำเสนอบนเทอร์มินัลโดยใช้ Pandoc
  tr: Pandoc kullanan terminal tabanlı sunumlar
  uk: Презентації в терміналі на основі Pandoc
  vi: Bài trình bày trên terminal dựa trên Pandoc
x:
  source: https://github.com/jaspervdj/patat
  eget: jaspervdj/patat
rule:
  /eget:
    cmd: x eget jaspervdj/patat
    reference: https://github.com/jaspervdj/patat
binlist:
- 'patat'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
