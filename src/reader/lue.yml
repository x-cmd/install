lang: 'Python'
homepage: 'https://github.com/superstarryeyes/lue'
license: 'GPL-3.0'
desc:
  cn: 支持语音合成朗读的终端电子书阅读器，支持 EPUB、PDF、DOCX、HTML、RTF、TXT 和 MD
  en: 'Terminal eBook Reader with Audiobook-Quality Text-to-Speech — Supports EPUB, PDF, DOCX, HTML, RTF, TXT, and MD.'
x:
  source: https://github.com/superstarryeyes/lue
  eget: https://github.com/superstarryeyes/lue
rule:
  /eget:
    cmd: x eget superstarryeyes/lue
    reference: https://github.com/superstarryeyes/lue
binlist:
  - 'lue'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 KB
          rating: 1
          desc:
            cn: 约 13 KB（估算）
            en: ~13 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
