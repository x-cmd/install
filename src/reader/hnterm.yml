lang: C++
homepage: https://github.com/ggerganov/hnterm
license: MIT
desc:
  cn: HNTerm 是一个用 C++ 编写的小型控制台应用程序，用于浏览 Hacker News
  en: HNTerm is a small console application written in C++ for browsing Hacker News.
x:
  source: https://github.com/ggerganov/hnterm
rule:
  linux/snap:
    cmd: sudo snap install hnterm
    reference: https://github.com/ggerganov/hnterm?tab=readme-ov-file#installing
  darwin/brew:
    cmd: brew install ggerganov/ggerganov/hnterm
    reference: https://github.com/ggerganov/hnterm?tab=readme-ov-file#installing
binlist:
- hnterm

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
