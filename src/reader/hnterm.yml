lang: C++
homepage: https://github.com/ggerganov/hnterm
license: MIT
desc:
  cn: HNTerm 是一个用 C++ 编写的小型控制台应用程序，用于浏览 Hacker News
  en: HNTerm is a small console application written in C++ for browsing Hacker News.
  cs: HNTerm je malá konzolová aplikace napsaná v C++ pro procházení Hacker News.
  de: HNTerm ist eine kleine Konsolenanwendung in C++ zum Stöbern in Hacker News.
  es: HNTerm es una pequeña aplicación de consola escrita en C++ para navegar por Hacker News.
  fr: HNTerm est une petite application console écrite en C++ pour parcourir Hacker News.
  id: HNTerm adalah aplikasi konsol kecil yang ditulis dengan C++ untuk menjelajahi Hacker News.
  it: HNTerm è una piccola applicazione console scritta in C++ per esplorare Hacker News.
  ja: HNTerm は C++ で書かれた Hacker News 用の小さなコンソールアプリケーションです。
  ko: HNTerm은 Hacker News를 탐색하기 위해 C++로 작성된 소형 콘솔 애플리케이션입니다.
  pl: HNTerm to niewielka aplikacja konsolowa napisana w C++ do przeglądania Hacker News.
  pt: O HNTerm é um pequeno aplicativo de console escrito em C++ para navegar no Hacker News.
  ro: HNTerm este o mică aplicație pentru consolă scrisă în C++ pentru a parcurge Hacker News.
  ru: HNTerm — небольшое консольное приложение на C++ для просмотра Hacker News.
  th: HNTerm เป็นแอปคอนโซลขนาดเล็กที่เขียนด้วย C++ เพื่อท่องเที่ยว Hacker News
  tr: HNTerm, Hacker News'te gezinmek için C++ ile yazılmış küçük bir konsol uygulamasıdır.
  uk: HNTerm — невелика консольна програма на C++ для перегляду Hacker News.
  vi: HNTerm là một ứng dụng console nhỏ viết bằng C++ để duyệt Hacker News.
x:
  source: https://github.com/ggerganov/hnterm
  brew: ggerganov/ggerganov/hnterm
  snap: hnterm
rule:
  linux/snap:
    cmd: sudo snap install hnterm
    reference: https://github.com/ggerganov/hnterm?tab=readme-ov-file#installing
  darwin/brew:
    cmd: brew install ggerganov/ggerganov/hnterm
    reference: https://github.com/ggerganov/hnterm?tab=readme-ov-file#installing
binlist:
- hnterm

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 116 KB
          rating: 1
          desc:
            cn: 约 116 KB（估算）
            en: ~116 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
