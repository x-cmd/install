lang: Python
homepage: https://github.com/wustho/epr
license: MIT
desc:
  cn: CLI Epub 阅读器
  en: CLI Epub Reader
x:
  source: https://github.com/wustho/epr
  brew: epr
  choco: epr
  powershell: epr
  yay: epr-git
  pip: epr-reader
rule:
  /x:
    cmd: x pkg use epr
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install epr-reader
    reference: https://github.com/wustho/epr?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install epr
    reference: https://github.com/wustho/epr?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install epr
    reference: https://github.com/wustho/epr?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S epr-git
    reference: https://aur.archlinux.org/packages/epr-git
binlist:
- epr

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
