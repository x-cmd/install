lang: Python
homepage: https://github.com/wustho/epr
license: MIT
desc:
  cn: CLI Epub 阅读器
  en: CLI Epub Reader
  cs: Čtečka Epub v příkazové řádce
  de: Epub-Reader für die Kommandozeile
  es: Lector de Epub para la línea de comandos
  fr: Lecteur Epub en ligne de commande
  id: Pembaca Epub untuk baris perintah
  it: Lettore Epub da riga di comando
  ja: コマンドライン用の Epub リーダー
  ko: 명령줄용 Epub 리더
  pl: Czytnik Epub dla wiersza poleceń
  pt: Leitor de Epub para linha de comando
  ro: Cititor Epub pentru linia de comandă
  ru: Читалка Epub для командной строки
  th: โปรแกรมอ่าน Epub สำหรับบรรทัดคำสั่ง
  tr: Komut satırı için Epub okuyucu
  uk: Читалка Epub для командного рядка
  vi: Trình đọc Epub cho dòng lệnh
x:
  source: https://github.com/wustho/epr
  brew: epr
  choco: epr
  yay: epr-git
  pip: epr-reader
rule:
  /x:
    cmd: x pkg use epr
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install epr-reader
    reference: https://github.com/wustho/epr?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install epr
    reference: https://github.com/wustho/epr?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install epr
    reference: https://github.com/wustho/epr?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S epr-git
    reference: https://aur.archlinux.org/packages/epr-git
binlist:
- epr

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: none
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
