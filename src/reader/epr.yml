lang: Python
homepage: https://github.com/wustho/epr
license: MIT
desc:
  cn: CLI Epub 阅读器
  en: CLI Epub Reader
x:
  pkg:
    exist: true
  source: https://github.com/wustho/epr
rule:
  /x:
    cmd: x pkg use epr
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install epr-reader
    reference: https://github.com/wustho/epr?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install epr
    reference: https://github.com/wustho/epr?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install epr
    reference: https://github.com/wustho/epr?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S epr-git
    reference: https://aur.archlinux.org/packages/epr-git
binlist:
- epr

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
