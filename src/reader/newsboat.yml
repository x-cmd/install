lang: C++
homepage: https://github.com/newsboat/newsboat
license: MIT
desc:
  en: An RSS/Atom feed reader for text terminals
  cn: 一个 terminal 上的 RSS/Atom feed 阅读器
  cs: Čtečka RSS/Atom feedů pro textové terminály
  de: Ein RSS/Atom-Feed-Reader für Textterminals
  es: Un lector de feeds RSS/Atom para terminales de texto
  fr: Un lecteur de flux RSS/Atom pour terminaux texte
  id: Pembaca feed RSS/Atom untuk terminal teks
  it: Un lettore di feed RSS/Atom per terminali testuali
  ja: テキスト端末向けの RSS/Atom フィードリーダー
  ko: 텍스트 터미널을 위한 RSS/Atom 피드 리더
  pl: Czytnik kanałów RSS/Atom dla terminali tekstowych
  pt: Um leitor de feeds RSS/Atom para terminais de texto
  ro: Un cititor de fluxuri RSS/Atom pentru terminale text
  ru: Читалка RSS/Atom-лент для текстовых терминалов
  th: โปรแกรมอ่านฟีด RSS/Atom สำหรับเทอร์มินัลข้อความ
  tr: Metin terminalleri için bir RSS/Atom akış okuyucu
  uk: Читалка RSS/Atom-стрімів для текстових терміналів
  vi: Trình đọc nguồn tin RSS/Atom cho terminal văn bản
x:
  source: https://github.com/newsboat/newsboat
  brew: newsboat
  snap: newsboat
rule:
  /snap:
    cmd: sudo snap install newsboat
    reference: https://newsboat.org/releases/2.34/docs/newsboat.html
  darwin/brew:
    cmd: brew install newsboat
    reference: https://formulae.brew.sh/formula/newsboat
binlist:
- newsboat

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.7 MB
          rating: 1
          desc:
            cn: 约 2.7 MB（估算）
            en: ~2.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
