lang: C++
homepage: https://github.com/newsboat/newsboat
license: MIT
desc:
  en: An RSS/Atom feed reader for text terminals
  cn: 一个 terminal 上的 RSS/Atom feed 阅读器
x:
  source: https://github.com/newsboat/newsboat
rule:
  /snap:
    cmd: sudo snap install newsboat
    reference: https://newsboat.org/releases/2.34/docs/newsboat.html
  darwin/brew:
    cmd: brew install newsboat
    reference: https://formulae.brew.sh/formula/newsboat
binlist:
- newsboat

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
