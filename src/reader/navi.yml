lang: Rust
homepage: https://github.com/denisidoro/navi
license: Apache-2.0
desc:
  cn: 用于命令行的交互式备忘单工具
  en: An interactive cheatsheet tool for the command-line
x:
  pkg:
    exist: true
  source: https://github.com/denisidoro/navi
rule:
  /x:
    cmd: x pkg use navi
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install navi
    reference: https://formulae.brew.sh/formula/navi#default
  (win|wsl2)/choco:
    cmd: x choco install navi
    reference: https://community.chocolatey.org/packages/navi
  (win|wsl2)/scoop:
    cmd: x scoop install navi
    reference: https://scoop.sh/#/apps?q=navi
binlist:
- navi
footprint:
  behavior:
    runtime:
      type: [cli, interactive]
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取 cheatsheet 文件
          en: Reads cheatsheet files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 ~5 MB
            en: ~5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: ~30 MB
          en: ~30 MB
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
