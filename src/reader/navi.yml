lang: Rust
homepage: https://github.com/denisidoro/navi
license: Apache-2.0
desc:
  cn: 用于命令行的交互式备忘单工具
  en: An interactive cheatsheet tool for the command-line
  cs: Interaktivní nástroj pro přehledky příkazové řádky
  de: Ein interaktives Cheatsheet-Werkzeug für die Kommandozeile
  es: Una herramienta interactiva de hojas de referencia para la línea de comandos
  fr: Un outil interactif de mémo pour la ligne de commande
  id: Alat cheatsheet interaktif untuk baris perintah
  it: Uno strumento interattivo di cheat sheet per la riga di comando
  ja: コマンドライン用の対話式チートシートツール
  ko: 명령줄을 위한 대화형 치트시트 도구
  pl: Interaktywne narzędzie do ściąg na wiersz poleceń
  pt: Uma ferramenta interativa de cola para a linha de comando
  ro: Un instrument interactiv de cheat sheet pentru linia de comandă
  ru: Интерактивный инструмент-шпаргалка для командной строки
  th: เครื่องมือชีตชีตแบบโต้ตอบสำหรับบรรทัดคำสั่ง
  tr: Komut satırı için etkileşimli bir cheatsheet aracı
  uk: Інтерактивний інструмент-шпаргалка для командного рядка
  vi: Công cụ bảng tra cứu tương tác cho dòng lệnh
x:
  source: https://github.com/denisidoro/navi
  brew: navi
  scoop: navi
  choco: navi
rule:
  /x:
    cmd: x pkg use navi
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install navi
    reference: https://formulae.brew.sh/formula/navi#default
  (win|wsl2)/choco:
    cmd: x choco install navi
    reference: https://community.chocolatey.org/packages/navi
  (win|wsl2)/scoop:
    cmd: x scoop install navi
    reference: https://scoop.sh/#/apps?q=navi
binlist:
- navi
# already profiled
footprint:
  behavior:
    runtime:
      type: [cli, interactive]
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 cheatsheet 文件
          en: Reads cheatsheet files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 安装 1.4 MB
            en: 1.4 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
      peak:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
