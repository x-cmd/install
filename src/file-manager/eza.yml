lang: Rust
homepage: https://github.com/eza-community/eza
license: EUPL-1.2
desc:
  cn: ls 的现代、维护替代品，构建于 exa 之上，功能更加丰富
  en: A modern, maintained replacement for ls
x:
  pkg:
    exist: true
  source: https://github.com/eza-community/eza
  eget: https://github.com/eza-community/eza
  apt: -y
  dnf: eza
  brew: eza
  pacman: eza
rule:
  /x:
    cmd: x pkg use eza
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget eza-community/eza
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use eza
    reference: https://github.com/lwiechec/asdf-eza
  darwin/brew:
    cmd: brew install eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#brew-macos
  darwin/port:
    cmd: sudo port install eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#macports-macos
  arch/pacman:
    cmd: sudo pacman -S eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#arch-linux
  /nix:
    cmd: nix-env -i eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#nix-linux-macos
  debian/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings

      wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | sudo gpg --dearmor -o /etc/apt/keyrings/gierens.gpg

      echo "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main" | sudo tee /etc/apt/sources.list.d/gierens.list

      sudo chmod 644 /etc/apt/keyrings/gierens.gpg /etc/apt/sources.list.d/gierens.list

      sudo apt update

      sudo apt install -y eza

      '
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#debian-and-ubuntu
    dsnap: eza
  ubuntu/apt:
    cmd: 'sudo mkdir -p /etc/apt/keyrings

      wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | sudo gpg --dearmor -o /etc/apt/keyrings/gierens.gpg

      echo "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main" | sudo tee /etc/apt/sources.list.d/gierens.list

      sudo chmod 644 /etc/apt/keyrings/gierens.gpg /etc/apt/sources.list.d/gierens.list

      sudo apt update

      sudo apt install -y eza

      '
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#debian-and-ubuntu
    dsnap: eza
  gentoo/emerge:
    cmd: sudo emerge --ask sys-apps/eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#gentoo
  opensuse/zypper:
    cmd: 'sudo zypper ar https://download.opensuse.org/tumbleweed/repo/oss/ factory-oss

      sudo zypper in eza

      '
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#opensuse
  fedora/dnf:
    cmd: sudo dnf install eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#fedora
    dsnap: eza
  void/xbps:
    cmd: sudo xbps-install eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#void-linux
  termux/pkg:
    cmd: sudo pkg install eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#termux
  (win|wsl2)/winget:
    cmd: x winget install eza-community.eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#winget-windows
  (win|wsl2)/scoop:
    cmd: x scoop install eza
    reference: https://github.com/eza-community/eza/blob/main/INSTALL.md#scoop-windows
binlist:
- eza

# already profiled
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2.6 MB
          rating: 1
          desc:
            cn: 安装 2.6 MB
            en: 2.6 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
