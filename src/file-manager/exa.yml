lang: Rust
homepage: https://github.com/ogham/exa
license: MIT
desc:
  cn: '`ls` 命令的现代化替代品，更具特色且更为用户友好'
  en: A modern alternative to the `ls` command, More distinctive and user-friendly
  cs: Moderní alternativa k příkazu `ls`, odlišnější a uživatelsky přívětivější
  de: Eine moderne Alternative zum Befehl `ls`, markanter und benutzerfreundlicher
  es: Una alternativa moderna al comando `ls`, más distintiva y fácil de usar
  fr: Une alternative moderne à la commande `ls`, plus distinctive et conviviale
  id: Alternatif modern untuk perintah `ls`, lebih khas dan ramah pengguna
  it: Un'alternativa moderna al comando `ls`, più caratteristica e user-friendly
  ja: "`ls` コマンドの現代的な代替であり、より特徴的でユーザーフレンドリーです"
  ko: "`ls` 명령의 현대적인 대안으로, 더 돋보이고 사용자 친화적입니다"
  pl: Nowoczesna alternatywa dla polecenia `ls`, bardziej charakterystyczna i przyjazna użytkownikowi
  pt: Uma alternativa moderna ao comando `ls`, mais distinta e amigável ao usuário
  ro: O alternativă modernă la comanda `ls`, mai distinctivă și prietenoasă cu utilizatorul
  ru: Современная альтернатива команде `ls`, более выразительная и удобная для пользователя
  th: ทางเลือกสมัยใหม่ของคำสั่ง `ls` ที่โดดเด่นและใช้งานง่ายกว่า
  tr: "`ls` komutuna modern bir alternatif; daha karakteristik ve kullanıcı dostu"
  uk: Сучасна альтернатива команді `ls`, більш виразна та зручна для користувача
  vi: Một giải pháp thay thế hiện đại cho lệnh `ls`, nổi bật và thân thiện với người dùng hơn
x:
  source: https://github.com/ogham/exa
  apt: exa
  dnf: exa
  pacman: exa
  zypper: exa
  emerge: sys-apps/exa
  asdf: exa
rule:
  /x:
    cmd: x pkg use exa
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use exa
    reference: https://github.com/nyrst/asdf-exa
  debian/apt:
    cmd: sudo apt install exa
    reference: https://the.exa.website/
    dsnap: exa
  ubuntu/apt:
    cmd: sudo apt install exa
    reference: https://the.exa.website/
    dsnap: exa
  arch/pacman:
    cmd: sudo pacman -S exa
    reference: https://the.exa.website/
  kali/apt:
    cmd: sudo apt install exa
    reference: https://the.exa.website/
    dsnap: exa
  fedora/dnf:
    cmd: sudo dnf install exa
    reference: https://the.exa.website/
    dsnap: exa
  raspbian/apt:
    cmd: sudo apt install exa
    reference: https://the.exa.website/
  opensuse/zypper:
    cmd: sudo zypper install exa
    reference: https://the.exa.website/
  gentoo/emerge:
    cmd: sudo emerge sys-apps/exa
    reference: https://the.exa.website/
  nix/nixpkgs:
    cmd: nix-env -i exa
    reference: https://the.exa.website/
binlist:
- exa

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.7 MB
          rating: 1
          desc:
            cn: 安装 1.7 MB
            en: 1.7 MB install
        download:
          estimate: 879 KB
          desc:
            cn: 约 879 KB 下载 (linux/x64)
            en: ~879 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
