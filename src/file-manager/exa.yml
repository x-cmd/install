lang: Rust
homepage: https://github.com/ogham/exa
license: MIT
desc:
  cn: '`ls` 命令的现代化替代品，更具特色且更为用户友好'
  en: A modern alternative to the `ls` command, More distinctive and user-friendly
x:
  source: https://github.com/ogham/exa
  apt: exa
  dnf: exa
  pacman: exa
  zypper: exa
  emerge: sys-apps/exa
  asdf: asdf
rule:
  /x:
    cmd: x pkg use exa
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use exa
    reference: https://github.com/nyrst/asdf-exa
  debian/apt:
    cmd: sudo apt install exa
    reference: https://the.exa.website/
    dsnap: exa
  ubuntu/apt:
    cmd: sudo apt install exa
    reference: https://the.exa.website/
    dsnap: exa
  arch/pacman:
    cmd: sudo pacman -S exa
    reference: https://the.exa.website/
  kali/apt:
    cmd: sudo apt install exa
    reference: https://the.exa.website/
    dsnap: exa
  fedora/dnf:
    cmd: sudo dnf install exa
    reference: https://the.exa.website/
    dsnap: exa
  raspbian/apt:
    cmd: sudo apt install exa
    reference: https://the.exa.website/
  opensuse/zypper:
    cmd: sudo zypper install exa
    reference: https://the.exa.website/
  gentoo/emerge:
    cmd: sudo emerge sys-apps/exa
    reference: https://the.exa.website/
  nix/nixpkgs:
    cmd: nix-env -i exa
    reference: https://the.exa.website/
binlist:
- exa

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.7 MB
          rating: 1
          desc:
            cn: 安装 1.7 MB
            en: 1.7 MB install
        download:
          estimate: 879 KB
          desc:
            cn: 约 879 KB 下载 (linux/x64)
            en: ~879 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
