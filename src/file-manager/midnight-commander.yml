lang: C
homepage: https://github.com/MidnightCommander/mc
desc:
  cn: 可视化文件管理器，提供了类似 Norton Commander 的界面和功能, 左右两侧显示文件系统的不同目录，支持多种文件操作以及内置的文本编辑器和文件查看器。它是一个跨平台的工具，支持多种操作系统，包括 Linux 和 macOS。
  en: A visual file manager, providing a Norton Commander-like interface and functionality, displaying different directories of the file system on the left and right sides, supporting various file operations, and including built-in text editors and file viewers. It is a cross-platform tool that supports multiple operating systems, including Linux and macOS.
  cs: Vizuální správce souborů s rozhraním a funkcemi podobnými Norton Commanderu, zobrazující různé adresáře souborového systému vlevo a vpravo, podporující různé operace se soubory a obsahující vestavěné textové editory a prohlížeče souborů. Jde o multiplatformní nástroj, který podporuje více operačních systémů včetně Linuxu a macOS.
  de: Ein visueller Dateimanager mit einer Norton Commander-artigen Oberfläche und Funktionalität, der verschiedene Verzeichnisse des Dateisystems links und rechts anzeigt, verschiedene Dateioperationen unterstützt und integrierte Texteditoren und Dateibetrachter enthält. Es ist ein plattformübergreifendes Werkzeug, das mehrere Betriebssysteme einschließlich Linux und macOS unterstützt.
  es: Un gestor de archivos visual que ofrece una interfaz y funcionalidades similares a Norton Commander, muestra distintos directorios del sistema de archivos a la izquierda y a la derecha, admite diversas operaciones con archivos e incluye editores de texto y visores de archivos integrados. Es una herramienta multiplataforma compatible con varios sistemas operativos, incluidos Linux y macOS.
  fr: Un gestionnaire de fichiers visuel offrant une interface et des fonctionnalités semblables à Norton Commander, affichant différents répertoires du système de fichiers à gauche et à droite, prenant en charge diverses opérations sur les fichiers et intégrant des éditeurs de texte et des visionneuses de fichiers. C'est un outil multiplateforme compatible avec plusieurs systèmes d'exploitation, dont Linux et macOS.
  id: Manajer file visual dengan antarmuka dan fitur mirip Norton Commander, menampilkan direktori berbeda dari sistem berkas di sisi kiri dan kanan, mendukung berbagai operasi berkas, serta menyertakan editor teks dan penampil berkas bawaan. Ini adalah alat lintas platform yang mendukung berbagai sistem operasi, termasuk Linux dan macOS.
  it: Un gestore di file visuale che offre un'interfaccia e funzionalità simili a Norton Commander, mostrando directory diversi del file system a sinistra e a destra, supportando varie operazioni sui file e includendo editor di testo e visualizzatori di file integrati. È uno strumento multipiattaforma che supporta diversi sistemi operativi, tra cui Linux e macOS.
  ja: Norton Commander に似たインターフェースと機能を備えたビジュアルファイルマネージャーで、左右に異なるファイルシステムのディレクトリを表示し、多様なファイル操作に対応し、内蔵のテキストエディタとファイルビューアを備えています。Linux や macOS を含む複数の OS に対応したクロスプラットフォームツールです。
  ko: Norton Commander와 유사한 인터페이스와 기능을 제공하는 시각적 파일 관리자로, 파일 시스템의 서로 다른 디렉터리를 왼쪽과 오른쪽에 표시하고, 다양한 파일 작업을 지원하며, 내장 텍스트 편집기와 파일 뷰어를 포함합니다. Linux와 macOS를 포함한 여러 운영 체제를 지원하는 크로스 플랫폼 도구입니다.
  pl: Wizualny menedżer plików oferujący interfejs i funkcje podobne do Norton Commandera, wyświetlający różne katalogi systemu plików po lewej i prawej stronie, obsługujący różne operacje na plikach oraz zawierający wbudowane edytory tekstu i przeglądarki plików. Jest to narzędzie wieloplatformowe obsługujące wiele systemów operacyjnych, w tym Linux i macOS.
  pt: Um gerenciador de arquivos visual que oferece interface e funcionalidades semelhantes às do Norton Commander, exibindo diretórios diferentes do sistema de arquivos à esquerda e à direita, com suporte a várias operações de arquivos e editores de texto e visualizadores de arquivos integrados. É uma ferramenta multiplataforma que suporta vários sistemas operacionais, incluindo Linux e macOS.
  ro: Un manager de fișiere vizual care oferă o interfață și funcționalități asemănătoare Norton Commander, afișând directoare diferite ale sistemului de fișiere în stânga și în dreapta, acceptând diverse operații pe fișiere și incluzând editori de text și vizualizatoare de fișiere integrate. Este un instrument multiplatformă care acceptă mai multe sisteme de operare, inclusiv Linux și macOS.
  ru: Визуальный файловый менеджер с интерфейсом и функциональностью, похожими на Norton Commander, отображающий разные каталоги файловой системы слева и справа, поддерживающий различные операции с файлами и включающий встроенные текстовые редакторы и просмотрщики файлов. Это кроссплатформенный инструмент, поддерживающий множество операционных систем, включая Linux и macOS.
  th: ตัวจัดการไฟล์แบบภาพที่มีส่วนติดต่อและความสามารถคล้าย Norton Commander แสดงไดเรกทอรีต่าง ๆ ของระบบไฟล์ทางด้านซ้ายและด้านขวา รองรับการดำเนินการกับไฟล์หลากหลายรูปแบบ และมีตัวแก้ไขข้อความกับตัวดูไฟล์ในตัว เป็นเครื่องมือข้ามแพลตฟอร์มที่รองรับระบบปฏิบัติการหลายแบบ รวมถึง Linux และ macOS
  tr: Norton Commander benzeri arayüz ve işlevler sunan, dosya sisteminin farklı dizinlerini sol ve sağ tarafta gösteren, çeşitli dosya işlemlerini destekleyen ve yerleşik metin düzenleyicileri ile dosya görüntüleyicileri içeren görsel bir dosya yöneticisi. Linux ve macOS dahil birden fazla işletim sistemini destekleyen çok platformlu bir araçtır.
  uk: Візуальний файловий менеджер з інтерфейсом і функціональністю, схожими на Norton Commander, який відображає різні каталоги файлової системи зліва і справа, підтримує різні операції з файлами та включає вбудовані текстові редактори й переглядачі файлів. Це кроссплатформний інструмент, який підтримує багато операційних систем, зокрема Linux і macOS.
  vi: Trình quản lý tệp trực quan với giao diện và tính năng giống Norton Commander, hiển thị các thư mục khác nhau của hệ thống tệp ở bên trái và bên phải, hỗ trợ nhiều thao tác tệp, đồng thời tích hợp trình soạn thảo văn bản và trình xem tệp. Đây là công cụ đa nền tảng hỗ trợ nhiều hệ điều hành, bao gồm Linux và macOS.
x:
  source: https://github.com/MidnightCommander/mc
  apt: mc
  dnf: mc
  brew: midnight-commander
  pacman: mc
  apk: mc
  apt-get: mc
  yum: mc
  zypper: mc
  scoop: extras/mc
  choco: mc
rule:
  darwin/brew:
    cmd: brew install midnight-commander
    reference: https://formulae.brew.sh/formula/midnight-commander#default
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/mc
    reference: https://scoop.sh/#/apps?q=mc&id=4ae94213f5c7b87d4ed614f6aa257cdca3d6fc08
  debian/apt:
    cmd: sudo apt-get install mc
    reference: https://command-not-found.com/mc
    dsnap: mc
  ubuntu/apt:
    cmd: sudo apt-get install mc
    reference: https://command-not-found.com/mc
    dsnap: mc
  alpine/apk:
    cmd: sudo apk add mc
    reference: https://command-not-found.com/mc
    dsnap: mc
  arch/pacman:
    cmd: sudo pacman -S mc
    reference: https://command-not-found.com/mc
  kali/apt:
    cmd: sudo apt-get install mc
    reference: https://command-not-found.com/mc
    dsnap: mc
  centos/yum:
    cmd: sudo yum install mc
    reference: https://command-not-found.com/mc
  fedora/dnf:
    cmd: sudo dnf install mc
    reference: https://command-not-found.com/mc
    dsnap: mc
  fedora/yum:
    cmd: sudo yum install mc
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  rhel/yum:
    cmd: sudo yum install mc
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  rocky/yum:
    cmd: sudo yum install mc
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  alma/yum:
    cmd: sudo yum install mc
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  raspbian/apt:
    cmd: sudo apt-get install mc
    reference: https://command-not-found.com/mc
  (win|wsl2)/choco:
    cmd: x choco install mc
    reference: https://community.chocolatey.org/packages/mc
  (win|wsl2)/winget:
    cmd: x winget install -e --id GNU.MidnightCommander
    reference: https://winget.run/pkg/GNU/MidnightCommander
  gentoo/emerge:
    cmd: sudo emerge -a sys-apps/mc
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  opensuse/zypper:
