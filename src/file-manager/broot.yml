lang: Rust
homepage: https://github.com/Canop/broot
license: MIT
desc:
  cn: '`broot` 是一款用于快速定位、操作文件和目录的终端文件管理器，可以按照多种标准排序、过滤、操作文件和目录'
  en: '`broot` is a terminal-based file manager that allows for quick locating and manipulation of files and directories. It enables sorting, filtering, and operations on files and directories based on various criteria'
  cs: "`broot` je terminálový správce souborů, který umožňuje rychlé vyhledávání a manipulaci se soubory a adresáři. Podporuje řazení, filtrování a operace nad soubory a adresáři podle různých kritérií"
  de: "`broot` ist ein Terminal-Dateimanager, der schnell das Auffinden und Bearbeiten von Dateien und Verzeichnissen ermöglicht. Er erlaubt das Sortieren, Filtern und Bearbeiten von Dateien und Verzeichnissen nach verschiedenen Kriterien"
  es: "`broot` es un gestor de archivos de terminal que permite localizar y manipular rápidamente archivos y directorios. Permite ordenar, filtrar y operar sobre archivos y directorios según varios criterios"
  fr: "`broot` est un gestionnaire de fichiers en terminal permettant de localiser et de manipuler rapidement des fichiers et des répertoires. Il permet de trier, filtrer et d'effectuer des opérations sur les fichiers et répertoires selon différents critères"
  id: "`broot` adalah pengelola file terminal yang memungkinkan menemukan dan memanipulasi file serta direktori dengan cepat. Alat ini dapat mengurutkan, memfilter, dan melakukan operasi pada file dan direktori berdasarkan berbagai kriteria"
  it: "`broot` è un file manager da terminale che consente di individuare e manipolare rapidamente file e directory. Consente di ordinare, filtrare ed eseguire operazioni su file e directory in base a diversi criteri"
  ja: "`broot` は、ファイルとディレクトリの迅速な検索と操作を行うターミナルファイルマネージャーです。さまざまな基準でファイルの並べ替え、絞り込み、操作ができます"
  ko: "`broot`는 파일과 디렉터리를 빠르게 찾고 조작할 수 있는 터미널 파일 관리자입니다. 다양한 기준에 따라 파일과 디렉터리를 정렬, 필터링, 작업할 수 있습니다"
  pl: "`broot` to terminalowy menedżer plików umożliwiający szybkie odnajdywanie i manipulowanie plikami oraz katalogami. Pozwala na sortowanie, filtrowanie i wykonywanie operacji na plikach i katalogach według różnych kryteriów"
  pt: "`broot` é um gerenciador de arquivos de terminal que permite localizar e manipular arquivos e diretórios rapidamente. Permite classificar, filtrar e executar operações em arquivos e diretórios com base em vários critérios"
  ro: "`broot` este un manager de fișiere pentru terminal care permite localizarea rapidă și manipularea fișierelor și directoarelor. Permite sortarea, filtrarea și operarea pe fișiere și directoare după criterii variate"
  ru: "`broot` — терминальный файловый менеджер, который позволяет быстро находить и работать с файлами и каталогами. Он умеет сортировать, фильтровать и выполнять операции над файлами и каталогами по различным критериям"
  th: "`broot` เป็นตัวจัดการไฟล์บนเทอร์มินัลที่ช่วยค้นหาและจัดการไฟล์และไดเรกทอรีได้อย่างรวดเร็ว รองรับการเรียงลำดับ การกรอง และการดำเนินการกับไฟล์และไดเรกทอรีตามเกณฑ์ต่าง ๆ"
  tr: "`broot`, dosyaları ve dizinleri hızlıca bulmayı ve düzenlemeyi sağlayan bir terminal dosya yöneticisidir. Dosyaları ve dizinleri çeşitli ölçütlere göre sıralama, filtreleme ve işlem yapma özellikleri sunar"
  uk: "`broot` — термінальний файловий менеджер, який дає змогу швидко знаходити та маніпулювати файлами й каталогами. Він підтримує сортування, фільтрацію та операції над файлами й каталогами за різними критеріями"
  vi: "`broot` là trình quản lý tệp dòng lệnh cho phép nhanh chóng tìm kiếm và thao tác với tệp và thư mục. Nó hỗ trợ sắp xếp, lọc và thực hiện các thao tác trên tệp và thư mục theo nhiều tiêu chí khác nhau"
x:
  source: https://github.com/Canop/broot
  eget: Canop/broot
  apt: broot
  brew: broot
  apk: broot
  apt-get: broot
  zypper: broot
  port: broot
  emerge: broot
  scoop: broot
  yay: broot-git
rule:
  /eget:
    cmd: x eget Canop/broot
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use broot
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install broot
    reference: https://formulae.brew.sh/formula/broot#default
  alpine/apk:
    cmd: sudo apk add broot
    reference: https://dystroy.org/broot/install/#alpine-linux
    dsnap: broot
  netbsd/pkgin:
    cmd: pkgin install broot
    reference: https://dystroy.org/broot/install/#netbsd
  darwin/port:
    cmd: sudo port selfupdate && sudo port install broot
    reference: https://dystroy.org/broot/install/#macports
  (win|wsl2)/scoop:
    cmd: x scoop install broot
    reference: https://dystroy.org/broot/install/#scoop
  /cargo:
    cmd: cargo install --locked --path .
    reference: https://dystroy.org/broot/install/#from-source
    dsnap: broot
  debian/apt:
    cmd: sudo apt-get install broot
    reference: https://dystroy.org/broot/install/#apt-deb
    dsnap: broot
  ubuntu/apt:
    cmd: sudo apt install broot
    reference: https://dystroy.org/broot/install/#apt-deb
    dsnap: broot
  gentoo/emerge:
    cmd: sudo emerge broot
    reference: https://dystroy.org/broot/install/#gentoo-linux
  opensuse/zypper:
    cmd: sudo zypper install broot
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=broot
  arch/yay:
    cmd: yay -S broot-git
    reference: https://aur.archlinux.org/packages/broot-git
binlist:
- broot

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 约 1.4 MB（估算）
            en: ~1.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
