lang: Rust
homepage: https://github.com/Canop/broot
license: MIT
desc:
  cn: '`broot` 是一款用于快速定位、操作文件和目录的终端文件管理器，可以按照多种标准排序、过滤、操作文件和目录'
  en: '`broot` is a terminal-based file manager that allows for quick locating and manipulation of files and directories. It enables sorting, filtering, and operations on files and directories based on various criteria'
x:
  pkg:
    exist: true
  source: https://github.com/Canop/broot
  eget: https://github.com/Canop/broot
rule:
  /eget:
    cmd: x eget Canop/broot
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use broot
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install broot
    reference: https://formulae.brew.sh/formula/broot#default
  alpine/apk:
    cmd: sudo apk add broot
    reference: https://dystroy.org/broot/install/#alpine-linux
    dsnap: broot
  netbsd/pkgin:
    cmd: pkgin install broot
    reference: https://dystroy.org/broot/install/#netbsd
  darwin/port:
    cmd: sudo port selfupdate && sudo port install broot
    reference: https://dystroy.org/broot/install/#macports
  (win|wsl2)/scoop:
    cmd: x scoop install broot
    reference: https://dystroy.org/broot/install/#scoop
  /cargo:
    cmd: cargo install --locked --path .
    reference: https://dystroy.org/broot/install/#from-source
    dsnap: broot
  debian/apt:
    cmd: sudo apt-get install broot
    reference: https://dystroy.org/broot/install/#apt-deb
    dsnap: broot
  ubuntu/apt:
    cmd: sudo apt install broot
    reference: https://dystroy.org/broot/install/#apt-deb
    dsnap: broot
  gentoo/emerge:
    cmd: sudo emerge broot
    reference: https://dystroy.org/broot/install/#gentoo-linux
  opensuse/zypper:
    cmd: sudo zypper install broot
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=broot
  arch/yay:
    cmd: yay -S broot-git
    reference: https://aur.archlinux.org/packages/broot-git
binlist:
- broot

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
