lang: Go
homepage: https://github.com/yorukot/superfile
license: MIT
desc:
  cn: 非常漂亮和现代的终端文件管理器
  en: Pretty fancy and modern terminal file manager
x:
  pkg:
    exist: true
  source: https://github.com/yorukot/superfile
  eget: https://github.com/yorukot/superfile
rule:
  /x:
    cmd: x pkg use superfile
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget yorukot/superfile
    reference: https://x-cmd.com/mod/eget
  (wsl2|linux|darwin)/curl:
    cmd: bash -c "$(curl -sLo- https://superfile.netlify.app/install.sh)"
    reference: https://superfile.netlify.app/getting-started/installation/
  (wsl2|linux|darwin)/wget:
    cmd: bash -c "$(wget -qO- https://superfile.netlify.app/install.sh)"
    reference: https://superfile.netlify.app/getting-started/installation/
  win/powershell:
    cmd: powershell -ExecutionPolicy Bypass -Command "Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://superfile.netlify.app/install.ps1'))"
    reference: https://superfile.netlify.app/getting-started/installation/
  /pacman:
    cmd: sudo pacman -S superfile
    reference: https://superfile.netlify.app/getting-started/installation/
  darwin/brew:
    cmd: brew install superfile
    reference: https://superfile.netlify.app/getting-started/installation/
  /nix:
    cmd: nix profile install github:yorukot/superfile#superfile
    reference: https://superfile.netlify.app/getting-started/installation/
binlist:
- superfile

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.6 MB
          rating: 1
          desc:
            cn: 约 2.6 MB（估算）
            en: ~2.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
