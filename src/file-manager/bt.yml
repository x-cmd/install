lang: Go
homepage: https://github.com/LeperGnome/bt
license: MIT
desc:
  cn: 交互式树状终端文件管理器
  en: Interactive tree-like terminal file manager
x:
  source: https://github.com/LeperGnome/bt
rule:
  /go:
    cmd: go install github.com/LeperGnome/bt/cmd/bt@v1.1.0
    reference: https://github.com/LeperGnome/bt?tab=readme-ov-file#installation
    dsnap: github.com/LeperGnome/bt/cmd/bt@v1.1.0
binlist:
- bt

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
