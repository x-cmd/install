lang: Go
homepage: https://github.com/LeperGnome/bt
license: MIT
desc:
  cn: 交互式树状终端文件管理器
  en: Interactive tree-like terminal file manager
x:
  source: https://github.com/LeperGnome/bt
rule:
  /go:
    cmd: go install github.com/LeperGnome/bt/cmd/bt@v1.1.0
    reference: https://github.com/LeperGnome/bt?tab=readme-ov-file#installation
    dsnap: github.com/LeperGnome/bt/cmd/bt@v1.1.0
binlist:
- bt

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 108 KB
          rating: 1
          desc:
            cn: 约 108 KB（估算）
            en: ~108 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
