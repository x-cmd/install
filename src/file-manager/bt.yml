lang: Go
homepage: https://github.com/LeperGnome/bt
license: MIT
desc:
  cn: 交互式树状终端文件管理器
  en: Interactive tree-like terminal file manager
  cs: Interaktivní stromový správce souborů v terminálu
  de: Interaktiver, baumartiger Terminal-Dateimanager
  es: Gestor de archivos de terminal interactivo con vista de árbol
  fr: Gestionnaire de fichiers en terminal interactif arborescent
  id: Pengelola file terminal interaktif berbentuk pohon
  it: File manager da terminale interattivo ad albero
  ja: 対話型のツリー風ターミナルファイルマネージャー
  ko: 대화형 트리 구조 터미널 파일 관리자
  pl: Interaktywny, drzewiasty terminalowy menedżer plików
  pt: Gerenciador de arquivos de terminal interativo em forma de árvore
  ro: Manager de fișiere pentru terminal, interactiv, cu structură de arbore
  ru: Интерактивный древовидный файловый менеджер для терминала
  th: ตัวจัดการไฟล์บนเทอร์มินัลแบบต้นไม้แบบอินเตอร์แอกทีฟ
  tr: Etkileşimli, ağaç yapılı terminal dosya yöneticisi
  uk: Інтерактивний деревоподібний файловий менеджер для термінала
  vi: Trình quản lý tệp dòng lệnh tương tác dạng cây
x:
  source: https://github.com/LeperGnome/bt
  go: github.com/LeperGnome/bt/cmd/bt@v1.1.0
rule:
  /go:
    cmd: go install github.com/LeperGnome/bt/cmd/bt@v1.1.0
    reference: https://github.com/LeperGnome/bt?tab=readme-ov-file#installation
    dsnap: github.com/LeperGnome/bt/cmd/bt@v1.1.0
binlist:
- bt

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
