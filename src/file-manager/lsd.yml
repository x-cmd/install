lang: Rust
homepage: https://github.com/lsd-rs/lsd
license: Apache-2.0
desc:
  cn: 下一代 ls 命令
  en: The next gen ls command
x:
  pkg:
    exist: true
  source: https://github.com/lsd-rs/lsd
  eget: https://github.com/lsd-rs/lsd
  apt: lsd
  dnf: lsd
  brew: lsd
  pacman: lsd
rule:
  /x:
    cmd: x pkg use lsd
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget lsd-rs/lsd
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: sudo pacman -S lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  fedora/dnf:
    cmd: sudo dnf install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  gentoo/emerge:
    cmd: sudo emerge sys-apps/lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  darwin/port:
    cmd: sudo port install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  /nix-env:
    cmd: sudo nix-env -iA nixos.lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  freebsd/pkg:
    cmd: pkg install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  netbsd/pkgin:
    cmd: pkgin install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  openbsd/pkg_add:
    cmd: pkg_add lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: x scoop install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  (win|wsl2)/winget:
    cmd: x winget install --id lsd-rs.lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  debian/apt:
    cmd: sudo apt install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  ubuntu/apt:
    cmd: sudo apt install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  solus/eopkg:
    cmd: sudo eopkg it lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  void/xbps:
    cmd: sudo xbps-install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  opensuse/zypper:
    cmd: sudo zypper install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install lsd
    reference: https://github.com/lsd-rs/lsd?tab=readme-ov-file#from-source
    dsnap: lsd
binlist:
- lsd

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.7 MB
          rating: 1
          desc:
            cn: 安装 3.7 MB
            en: 3.7 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 6 MB
        desc:
          cn: 6 MB
          en: 6 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
