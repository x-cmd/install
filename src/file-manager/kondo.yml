lang: Rust
homepage: https://github.com/tbillington/kondo
license: MIT
desc:
  cn: 用于从项目中清除 node_modules、target、build 以及相关依赖项的命令行工具。
  en: A command line tool to clean node_modules, target, build, and friends from your projects.
  cs: Nástroj příkazové řádky pro čištění adresářů node_modules, target, build a podobných z vašich projektů.
  de: Ein Kommandozeilenwerkzeug, um node_modules, target, build und Ähnliches aus Ihren Projekten zu entfernen.
  es: Una herramienta de línea de comandos para limpiar node_modules, target, build y similares de sus proyectos.
  fr: Un outil en ligne de commande pour nettoyer node_modules, target, build et similaires de vos projets.
  id: Alat baris perintah untuk membersihkan node_modules, target, build, dan sejenisnya dari proyek Anda.
  it: Uno strumento da riga di comando per ripulire node_modules, target, build e simili dai tuoi progetti.
  ja: プロジェクトから node_modules、target、build などの不要なものを削除するコマンドラインツール。
  ko: 프로젝트에서 node_modules, target, build 등의 불필요한 항목을 정리하는 명령줄 도구입니다.
  pl: Narzędzie wiersza poleceń do czyszczenia katalogów node_modules, target, build i podobnych z projektów.
  pt: Uma ferramenta de linha de comando para limpar node_modules, target, build e afins dos seus projetos.
  ro: Un instrument de linie de comandă pentru curățarea node_modules, target, build și a altor directoare similare din proiectele tale.
  ru: Инструмент командной строки для очистки каталогов node_modules, target, build и подобных в ваших проектах.
  th: เครื่องมือบรรทัดคำสั่งสำหรับล้าง node_modules, target, build และตัวคล้ายกันออกจากโปรเจกต์ของคุณ
  tr: Projelerinizden node_modules, target, build ve benzerlerini temizlemek için bir komut satırı aracı.
  uk: Інструмент командного рядка для очищення каталогів node_modules, target, build та подібних у ваших проєктах.
  vi: Công cụ dòng lệnh để dọn node_modules, target, build và các thư mục tương tự khỏi dự án của bạn
x:
  source: https://github.com/tbillington/kondo
  brew: kondo
  pacman: kondo
  apk: kondo
  port: kondo
  scoop: kondo
  winget: kondo
rule:
  arch/pacman:
    cmd: pacman -S kondo
    reference: https://github.com/tbillington/kondo#installation
  alpine/apk:
    cmd: apk add kondo
    reference: https://github.com/tbillington/kondo#installation
  /nix-env:
    cmd: nix-env -iA kondo
    reference: https://github.com/tbillington/kondo#installation
  darwin/port:
    cmd: sudo port install kondo
    reference: https://github.com/tbillington/kondo#installation
  /brew:
    cmd: brew install kondo
    reference: https://github.com/tbillington/kondo#installation
  (win|wsl2)/scoop:
    cmd: x scoop install kondo
    reference: https://github.com/tbillington/kondo#installation
  (win|wsl2)/winget:
    cmd: x winget install kondo
    reference: https://github.com/tbillington/kondo#installation
  /eget:
    cmd: eget tbillington/kondo
    reference: https://github.com/tbillington/kondo#installation
binlist:
- kondo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 57 KB
          rating: 1
          desc:
            cn: 约 57 KB（估算）
            en: ~57 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
