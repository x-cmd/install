lang: Rust
homepage: https://github.com/tbillington/kondo
license: MIT
desc:
  cn: 用于从项目中清除 node_modules、target、build 以及相关依赖项的命令行工具。
  en: A command line tool to clean node_modules, target, build, and friends from your projects.
x:
  source: https://github.com/tbillington/kondo
rule:
  arch/pacman:
    cmd: pacman -S kondo
    reference: https://github.com/tbillington/kondo#installation
  alpine/apk:
    cmd: apk add kondo
    reference: https://github.com/tbillington/kondo#installation
  /nix-env:
    cmd: nix-env -iA kondo
    reference: https://github.com/tbillington/kondo#installation
  darwin/port:
    cmd: sudo port install kondo
    reference: https://github.com/tbillington/kondo#installation
  /brew:
    cmd: brew install kondo
    reference: https://github.com/tbillington/kondo#installation
  (win|wsl2)/scoop:
    cmd: x scoop install kondo
    reference: https://github.com/tbillington/kondo#installation
  (win|wsl2)/winget:
    cmd: x winget install kondo
    reference: https://github.com/tbillington/kondo#installation
  /eget:
    cmd: eget tbillington/kondo
    reference: https://github.com/tbillington/kondo#installation
binlist:
- kondo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 57 KB
          rating: 1
          desc:
            cn: 约 57 KB（估算）
            en: ~57 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
