lang: C
homepage: https://github.com/leo-arch/clifm/wiki
desc:
  cn: Clifm 是一个类似 shell 的基于文本的终端文件管理器，运行在命令行界面上。
  en: Clifm is a shell-like, text-based terminal file manager that sits on the command line.
rule:
  darwin/port:
    cmd: sudo port install clifm
    reference: https://github.com/leo-arch/clifm/wiki/Introduction#small_blue_diamond-f-macos
  darwin/brew:
    cmd: brew install clifm
    reference: https://formulae.brew.sh/formula/clifm#default
  ubuntu/apt:
    cmd: 'echo ''deb http://download.opensuse.org/repositories/home:/archcrack/xUbuntu_24.04/ /'' | sudo tee /etc/apt/sources.list.d/home:archcrack.list && \

      curl -fsSL https://download.opensuse.org/repositories/home:archcrack/xUbuntu_24.04/Release.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/home_archcrack.gpg > /dev/null && \

      sudo apt update && \

      sudo apt install clifm

      '
    reference: https://software.opensuse.org//download.html?project=home%3Aarchcrack&package=clifm
    dsnap: clifm
  debian/apt:
    cmd: 'echo ''deb http://download.opensuse.org/repositories/home:/archcrack/Debian_Testing/ /'' | sudo tee /etc/apt/sources.list.d/home:archcrack.list && \

      curl -fsSL https://download.opensuse.org/repositories/home:archcrack/Debian_Testing/Release.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/home_archcrack.gpg > /dev/null && \

      sudo apt update && \

      sudo apt install clifm

      '
    reference: https://software.opensuse.org//download.html?project=home%3Aarchcrack&package=clifm
    dsnap: clifm
  arch/pacman:
    cmd: 'echo ''[home_archcrack_Arch] \n

      Server = https://download.opensuse.org/repositories/home:/archcrack/Arch/$arch'' >> /etc/pacman.conf && \

      key=$(curl -fsSL https://download.opensuse.org/repositories/home:archcrack/Arch/$(uname -m)/home_archcrack_Arch.key) && \

      fingerprint=$(gpg --quiet --with-colons --import-options show-only --import --fingerprint <<< "${key}" | awk -F: ''$1 == "fpr" { print $10 }'') && \

      sudo pacman-key --init && \

      sudo pacman-key --add - <<< "${key}" && \

      sudo pacman-key --lsign-key "${fingerprint}" && \

      sudo pacman -Sy home_archcrack_Arch/clifm

      '
    reference: https://software.opensuse.org//download.html?project=home%3Aarchcrack&package=clifm
  centos/yum:
    cmd: 'cd /etc/yum.repos.d/ && \

      wget https://download.opensuse.org/repositories/home:archcrack/CentOS_8/home:archcrack.repo && \

      sudo yum install clifm

      '
    reference: https://software.opensuse.org//download.html?project=home%3Aarchcrack&package=clifm
  fedora/dnf:
    cmd: 'sudo dnf config-manager --add-repo https://download.opensuse.org/repositories/home:archcrack/Fedora_40/home:archcrack.repo && \

      sudo dnf install clifm

      '
    reference: https://software.opensuse.org//download.html?project=home%3Aarchcrack&package=clifm
  opensuse/zypper:
    cmd: 'sudo zypper addrepo https://download.opensuse.org/repositories/home:archcrack/openSUSE_Tumbleweed/home:archcrack.repo && \

      sudo zypper refresh && \

      sudo zypper install clifm

      '
    reference: https://software.opensuse.org//download.html?project=home%3Aarchcrack&package=clifm
  raspbian/apt:
    cmd: 'echo ''deb http://download.opensuse.org/repositories/home:/archcrack/Raspbian_12/ /'' | sudo tee /etc/apt/sources.list.d/home:archcrack.list && \

      curl -fsSL https://download.opensuse.org/repositories/home:archcrack/Raspbian_12/Release.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/home_archcrack.gpg > /dev/null && \

      sudo apt update && \

      sudo apt install clifm

      '
    reference: https://software.opensuse.org//download.html?project=home%3Aarchcrack&package=clifm
  arch/yay:
    cmd: yay -S clifm
    reference: https://aur.archlinux.org/packages/clifm
binlist:
- clifm
license: NOASSERTION
