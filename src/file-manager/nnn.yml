lang: C
desc:
  en: Full-featured terminal file manager
  cn: 全功能终端文件管理器
homepage: https://github.com/jarun/nnn
license: BSD-2-Clause
x:
  source: https://github.com/jarun/nnn
  eget: https://github.com/jarun/nnn
rule:
  /eget:
    cmd: x eget jarun/nnn
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install nnn
    reference: https://formulae.brew.sh/formula/nnn#default
  debian/apt:
    cmd: sudo apt-get install nnn
    reference: https://command-not-found.com/nnn
    dsnap: nnn
  ubuntu/apt:
    cmd: sudo apt-get install nnn
    reference: https://command-not-found.com/nnn
    dsnap: nnn
  alpine/apk:
    cmd: sudo apk add nnn
    reference: https://command-not-found.com/nnn
    dsnap: nnn
  arch/pacman:
    cmd: sudo pacman -S nnn
    reference: https://command-not-found.com/nnn
  kali/apt:
    cmd: sudo apt-get install nnn
    reference: https://command-not-found.com/nnn
    dsnap: nnn
  centos/yum:
    cmd: sudo yum install nnn
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  fedora/dnf:
    cmd: sudo dnf install nnn
    reference: https://command-not-found.com/nnn
    dsnap: nnn
  fedora/yum:
    cmd: sudo yum install nnn
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  rhel/yum:
    cmd: sudo yum install nnn
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  rocky/yum:
    cmd: sudo yum install nnn
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  alma/yum:
    cmd: sudo yum install nnn
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  raspbian/apt:
    cmd: sudo apt-get install nnn
    reference: https://command-not-found.com/nnn
  gentoo/emerge:
    cmd: sudo emerge -a sys-apps/nnn
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  opensuse/zypper:
    cmd: sudo zypper install nnn
    reference: https://www.tecmint.com/linux-terminal-file-managers/
binlist:
- nnn

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
