lang: C
homepage: https://github.com/jmattaa/laser
license: MIT
desc:
  cn: lsr 本质上就是 ls 但添加了颜色和排序功能，但可用 lua 进行配置
  en: basically `ls` but `lsr`, and configurable with lua!
  cs: V podstatě `ls`, ale `lsr`, a konfigurovatelný pomocí lua!
  de: Im Grunde `ls`, aber `lsr`, und mit lua konfigurierbar!
  es: Básicamente `ls` pero `lsr`, y configurable con lua!
  fr: En gros `ls` mais `lsr`, et configurable avec lua !
  id: Intinya `ls` tapi `lsr`, dan dapat dikonfigurasi dengan lua!
  it: Praticamente `ls` ma `lsr`, e configurabile con lua!
  ja: ほぼ `ls` ですが `lsr` で、lua で設定変更できます!
  ko: 사실상 `ls`인데 `lsr`이며, lua로 설정할 수 있습니다!
  pl: W zasadzie `ls`, ale `lsr`, konfigurowalny za pomocą lua!
  pt: Basicamente `ls` mas `lsr`, e configurável com lua!
  ro: În esență `ls`, dar `lsr`, și configurabil cu lua!
  ru: По сути `ls`, но `lsr`, и настраивается через lua!
  th: โดยพื้นฐานคือ `ls` แต่เป็น `lsr` และตั้งค่าได้ด้วย lua!
  tr: Temelde `ls` ama `lsr`, ve lua ile yapılandırılabilir!
  uk: Фактично `ls`, але `lsr`, і налаштовується через lua!
  vi: Về cơ bản là `ls` nhưng `lsr`, và có thể cấu hình bằng lua!
x:
  source: https://github.com/jmattaa/laser
  yay: laser-git
rule:
  /brew:
    cmd: 'brew tap jmattaa/laser

      brew install --formula laser

      '
    reference: https://github.com/jmattaa/laser?tab=readme-ov-file#installation
  arch/pacman:
    cmd: yay -S laser-git
    reference: https://github.com/jmattaa/laser?tab=readme-ov-file#installation
binlist:
- laser

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 78 KB
          rating: 1
          desc:
            cn: 约 78 KB（估算）
            en: ~78 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
