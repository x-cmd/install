lang: C
homepage: https://github.com/jmattaa/laser
license: MIT
desc:
  cn: lsr 本质上就是 ls 但添加了颜色和排序功能，但可用 lua 进行配置
  en: basically `ls` but `lsr`, and configurable with lua!
x:
  source: https://github.com/jmattaa/laser
rule:
  /brew:
    cmd: 'brew tap jmattaa/laser

      brew install --formula laser

      '
    reference: https://github.com/jmattaa/laser?tab=readme-ov-file#installation
  arch/pacman:
    cmd: yay -S laser-git
    reference: https://github.com/jmattaa/laser?tab=readme-ov-file#installation
binlist:
- laser

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 78 KB
          rating: 1
          desc:
            cn: 约 78 KB（估算）
            en: ~78 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
