lang: C
homepage: https://github.com/jmattaa/laser
license: MIT
desc:
  cn: lsr 本质上就是 ls 但添加了颜色和排序功能，但可用 lua 进行配置
  en: basically `ls` but `lsr`, and configurable with lua!
x:
  source: https://github.com/jmattaa/laser
rule:
  /brew:
    cmd: 'brew tap jmattaa/laser

      brew install --formula laser

      '
    reference: https://github.com/jmattaa/laser?tab=readme-ov-file#installation
  arch/pacman:
    cmd: yay -S laser-git
    reference: https://github.com/jmattaa/laser?tab=readme-ov-file#installation
binlist:
- laser

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
