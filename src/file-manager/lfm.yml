lang: Python
homepage: https://inigo.katxi.org/devel/lfm/
desc:
  cn: Last File Manager 是 UNIX 控制台的一个强大的文件管理器。它有一个 curses 接口，并且是用 Python v3.4 + 编写的
  en: Last File Manager is a powerful file manager for the UNIX console. It has a curses interface and it’s written in Python v3.4+
rule:
  /pip:
    cmd: pip install lfm
    reference: https://pypi.org/project/lfm/
    dsnap: lfm
  debian/apt:
    cmd: sudo apt-get install lfm
    reference: https://inigo.katxi.org/devel/lfm/#download-and-installation
  ubuntu/apt:
    cmd: sudo apt-get install lfm
    reference: https://inigo.katxi.org/devel/lfm/#download-and-installation
  mint/apt:
    cmd: sudo apt-get install lfm
    reference: https://inigo.katxi.org/devel/lfm/#download-and-installation
  kali/apt:
    cmd: sudo apt-get install lfm
    reference: https://inigo.katxi.org/devel/lfm/#download-and-installation
    dsnap: lfm
  arch/pacman:
    cmd: sudo pacman -S lfm
    reference: https://inigo.katxi.org/devel/lfm/#download-and-installation
  fedora/dnf:
    cmd: sudo dnf install lfm
    reference: https://inigo.katxi.org/devel/lfm/#download-and-installation
  rehl/dnf:
    cmd: sudo dnf install lfm
    reference: https://inigo.katxi.org/devel/lfm/#download-and-installation
  centos/dnf:
    cmd: sudo dnf install lfm
    reference: https://inigo.katxi.org/devel/lfm/#download-and-installation
  fedora/yum:
    cmd: sudo yum install lfm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  rehl/yum:
    cmd: sudo yum install lfm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  centos/yum:
    cmd: sudo yum install lfm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  rocky/yum:
    cmd: sudo yum install lfm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  alma/yum:
    cmd: sudo yum install lfm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  gentoo/emerge:
    cmd: sudo emerge -a sys-apps/lfm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  opensuse/zypper:
    cmd: sudo zypper install lfm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  alpine/apk:
    cmd: sudo apk add lfm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
binlist:
- lfm
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
