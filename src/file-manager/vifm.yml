lang: C
homepage: https://github.com/vifm/vifm
license: GPL-2.0
desc:
  cn: Vifm 是一个带 curses 接口的文件管理器，它提供了类似于 Vim 的环境，用于管理文件系统中的对象，扩展了 mutt 的一些有用的想法
  en: Vifm is a file manager with curses interface, which provides Vim-like environment for managing objects within file systems, extended with some useful ideas from mutt
x:
  source: https://github.com/vifm/vifm
  eget: https://github.com/vifm/vifm
rule:
  /eget:
    cmd: x eget vifm/vifm
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install vifm
    reference: https://formulae.brew.sh/formula/vifm#default
  debian/apt:
    cmd: sudo apt-get install vifm
    reference: https://command-not-found.com/vifm
    dsnap: vifm
  ubuntu/apt:
    cmd: sudo apt-get install vifm
    reference: https://command-not-found.com/vifm
    dsnap: vifm
  alpine/apk:
    cmd: sudo apk add vifm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  arch/pacman:
    cmd: sudo pacman -S vifm
    reference: https://command-not-found.com/vifm
  kali/apt:
    cmd: sudo apt-get install vifm
    reference: https://command-not-found.com/vifm
    dsnap: vifm
  centos/yum:
    cmd: sudo yum install vifm
    reference: https://command-not-found.com/vifm
  fedora/dnf:
    cmd: sudo dnf install vifm
    reference: https://command-not-found.com/vifm
  raspbian/apt:
    cmd: sudo apt-get install vifm
    reference: https://command-not-found.com/vifm
  gentoo/emerge:
    cmd: sudo emerge -a sys-apps/vifm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  opensuse/zypper:
    cmd: sudo zypper install vifm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  fedora/yum:
    cmd: sudo yum install vifm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  rhel/yum:
    cmd: sudo yum install vifm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  rocky/yum:
    cmd: sudo yum install vifm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  alma/yum:
    cmd: sudo yum install vifm
    reference: https://www.tecmint.com/linux-terminal-file-managers/
  (win|wsl2)/choco:
    cmd: x choco install vifm
    reference: https://community.chocolatey.org/packages/vifm/0.11
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/vifm
    reference: https://scoop.sh/#/apps?q=vifm&id=5ea69e532338aff7bff48a0b678de032fad5716d
binlist:
- vifm

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
