lang: Rust
homepage: https://github.com/chaqchase/lla
license: MIT
desc:
  cn: 一个快速的 ls 命令替代品，具有强大的功能。
  en: A blazing fast ls replacement with superpowers.
x:
  source: https://github.com/chaqchase/lla
  eget: https://github.com/chaqchase/lla
  brew: lla
  paru: lla
  cargo: lla
  curl: curl
rule:
  /eget:
    cmd: x eget chaqchase/lla
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -sSL https://raw.githubusercontent.com/chaqchase/lla/main/install.sh | bash
    reference: https://github.com/chaqchase/lla?tab=readme-ov-file#using-installation-script
  /cargo:
    cmd: cargo install lla
    reference: https://github.com/chaqchase/lla?tab=readme-ov-file#using-package-manager
    dsnap: lla
  arch/paru:
    cmd: paru -S lla
    reference: https://github.com/chaqchase/lla?tab=readme-ov-file#using-package-manager
  darwin/brew:
    cmd: brew install lla
    reference: https://github.com/chaqchase/lla?tab=readme-ov-file#using-package-manager
  netbsd/pkgin:
    cmd: pkgin install lla
    reference: https://github.com/chaqchase/lla?tab=readme-ov-file#using-package-manager
binlist:
- lla

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 23 MB
          rating: 2
          desc:
            cn: 安装 23 MB
            en: 23 MB install
        download:
          estimate: 23 MB
          desc:
            cn: 约 23 MB 下载 (linux/x64)
            en: ~23 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
