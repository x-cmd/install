lang: Rust
homepage: https://github.com/kamiyaa/joshuto
license: LGPL-3.0
desc:
  cn: 受 Ranger 启发的终端文件管理器
  en: Terminal file manager inspired by ranger
  cs: Správce souborů v terminálu inspirovaný programem ranger
  de: Terminal-Dateimanager, inspiriert von ranger
  es: Gestor de archivos de terminal inspirado en ranger
  fr: Gestionnaire de fichiers en terminal inspiré de ranger
  id: Pengelola file terminal terinspirasi oleh ranger
  it: File manager da terminale ispirato a ranger
  ja: ranger から着想を得たターミナルファイルマネージャー
  ko: ranger에서 영감을 받은 터미널 파일 관리자
  pl: Terminalowy menedżer plików inspirowany programem ranger
  pt: Gerenciador de arquivos de terminal inspirado no ranger
  ro: Manager de fișiere pentru terminal inspirat de ranger
  ru: Терминальный файловый менеджер, вдохновлённый ranger
  th: ตัวจัดการไฟล์บนเทอร์มินัลที่ได้แรงบันดาลใจจาก ranger
  tr: ranger'dan esinlenen terminal dosya yöneticisi
  uk: Термінальний файловий менеджер, натхненний ranger
  vi: Trình quản lý tệp dòng lệnh lấy cảm hứng từ ranger
x:
  source: https://github.com/kamiyaa/joshuto
  dnf: joshuto
  brew: joshuto
  port: joshuto
  yay: joshuto
  paru: joshuto
rule:
  /cargo:
    cmd: cargo install --git https://github.com/kamiyaa/joshuto.git --force
    reference: https://github.com/kamiyaa/joshuto?tab=readme-ov-file#for-single-user-with-cargo
    dsnap: kamiyaa/joshuto
  /curl:
    cmd: bash <(curl -s https://raw.githubusercontent.com/kamiyaa/joshuto/master/utils/install.sh)
    reference: https://github.com/kamiyaa/joshuto?tab=readme-ov-file#from-pre-compiled-binary
  fedora/dnf:
    cmd: 'sudo dnf copr enable atim/joshuto -y && \

      sudo dnf install joshuto

      '
    reference: https://github.com/kamiyaa/joshuto?tab=readme-ov-file#fedora-copr
  arch/yay:
    cmd: yay -S joshuto
    reference: https://github.com/kamiyaa/joshuto?tab=readme-ov-file#arch-aur
  arch/paru:
    cmd: paru -S joshuto
    reference: https://github.com/kamiyaa/joshuto?tab=readme-ov-file#arch-aur
  gentoo/emerge:
    cmd: 'sudo eselect repository enable gentoo-zh && \

      sudo emerge -av app-misc/joshuto

      '
    reference: https://github.com/kamiyaa/joshuto?tab=readme-ov-file#gentoo-gentoo-zh
  darwin/port:
    cmd: sudo port install joshuto
    reference: https://github.com/kamiyaa/joshuto?tab=readme-ov-file#macos-macports
  darwin/brew:
    cmd: brew install joshuto
    reference: https://github.com/kamiyaa/joshuto?tab=readme-ov-file#macoslinux-homebrew
  linux/brew:
    cmd: brew install joshuto
    reference: https://github.com/kamiyaa/joshuto?tab=readme-ov-file#macoslinux-homebrew
binlist:
- joshuto

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 602 KB
          rating: 1
          desc:
            cn: 约 602 KB（估算）
            en: ~602 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
