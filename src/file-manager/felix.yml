lang: Rust
homepage: https://github.com/kyoheiu/felix
license: MIT
desc:
  cn: 一个具有 Vim 风格键映射的 TUI 文件管理器，使用 Rust 编写。
  en: A tui file manager with Vim-like key mapping, written in Rust.
x:
  source: https://github.com/kyoheiu/felix
  pacman: felix-rs
rule:
  /cargo:
    cmd: cargo install felix
    reference: https://kyoheiu.dev/felix/#installation
    dsnap: felix
  arch/pacman:
    cmd: sudo pacman -S felix-rs
    reference: https://kyoheiu.dev/felix/#installation
  netbsd/pkgin:
    cmd: pkgin install felix
    reference: https://kyoheiu.dev/felix/#installation
binlist:
- felix

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 305 KB
          rating: 1
          desc:
            cn: 约 305 KB（估算）
            en: ~305 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
