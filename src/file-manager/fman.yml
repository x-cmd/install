lang: Go
homepage: https://github.com/nore-dev/fman
license: MIT
desc:
  cn: TUI 文件管理器
  en: TUI File Manager
x:
  source: https://github.com/nore-dev/fman
  eget: https://github.com/nore-dev/fman
rule:
  /eget:
    cmd: x eget nore-dev/fman
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/nore-dev/fman@latest
    reference: https://github.com/nore-dev/fman?tab=readme-ov-file#go
    dsnap: github.com/nore-dev/fman
  /npm:
    cmd: npm i @nore-dev/fman
    reference: https://github.com/nore-dev/fman?tab=readme-ov-file#npm
    dsnap: '@nore-dev/fman'
  darwin/brew:
    cmd: brew install fman/tap/fman
    reference: https://github.com/nore-dev/fman?tab=readme-ov-file#brew
binlist:
- fman

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
