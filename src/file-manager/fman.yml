lang: Go
homepage: https://github.com/nore-dev/fman
license: MIT
desc:
  cn: TUI 文件管理器
  en: TUI File Manager
x:
  source: https://github.com/nore-dev/fman
  eget: https://github.com/nore-dev/fman
rule:
  /eget:
    cmd: x eget nore-dev/fman
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/nore-dev/fman@latest
    reference: https://github.com/nore-dev/fman?tab=readme-ov-file#go
    dsnap: github.com/nore-dev/fman
  /npm:
    cmd: npm i @nore-dev/fman
    reference: https://github.com/nore-dev/fman?tab=readme-ov-file#npm
    dsnap: '@nore-dev/fman'
  darwin/brew:
    cmd: brew install fman/tap/fman
    reference: https://github.com/nore-dev/fman?tab=readme-ov-file#brew
binlist:
- fman

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
