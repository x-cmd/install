lang: Rust
homepage: https://github.com/sxyazi/yazi
license: MIT
desc:
  en: Blazing Fast Terminal File Manager
  cn: 超快终端文件管理器
x:
  pkg:
    exist: true
  source: https://github.com/sxyazi/yazi
  eget: https://github.com/sxyazi/yazi
rule:
  /eget:
    cmd: x eget sxyazi/yazi
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use yazi
    reference: https://x-cmd.com/install/
  arch/pacman:
    cmd: sudo pacman -S yazi ffmpegthumbnailer unarchiver jq poppler fd ripgrep fzf zoxide
    reference: https://yazi-rs.github.io/docs/installation#arch-linux
  arch/paru:
    cmd: paru -S yazi-git ffmpegthumbnailer unarchiver jq poppler fd ripgrep fzf zoxide
    reference: https://yazi-rs.github.io/docs/installation#arch-linux
  darwin/brew:
    cmd: 'brew install yazi ffmpegthumbnailer unar jq poppler fd ripgrep fzf zoxide \

      && brew tap homebrew/cask-fonts && brew install --cask font-symbols-only-nerd-font

      '
    reference: https://yazi-rs.github.io/docs/installation#macos
  /nix-env:
    cmd: nix-env -iA nixos.yazi
    reference: https://yazi-rs.github.io/docs/installation#nix
  /nixpkgs:
    cmd: nix-env -iA nixpkgs.yazi
    reference: https://yazi-rs.github.io/docs/installation#nix
  netbsd/pkgin:
    cmd: pkgin install yazi
    reference: https://yazi-rs.github.io/docs/installation#netbsd
  (win|wsl2)/scoop:
    cmd: x scoop install yazi unar jq poppler fd ripgrep fzf zoxide
    reference: https://yazi-rs.github.io/docs/installation#installation-1
  aosc/oma:
    cmd: sudo oma install yazi
    reference: https://yazi-rs.github.io/docs/installation#aosc-os
  /cargo:
    cmd: 'curl --proto ''=https'' --tlsv1.2 -sSf https://sh.rustup.rs | sh \

      && cargo install --locked yazi-fm yazi-cli

      '
    reference: https://yazi-rs.github.io/docs/installation#cargo
    dsnap: yazi-fm yazi-cli
  opensuse/zypper:
    cmd: sudo zypper install yazi
    reference: https://software.opensuse.org//download.html?project=openSUSE%3AFactory&package=yazi
binlist:
- yazi

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
