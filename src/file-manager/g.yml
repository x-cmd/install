lang: Go
desc:
  cn: ls 命令替代品
  en: A modern replacement for ls
  cs: Moderní náhrada příkazu ls
  de: Ein moderner Ersatz für ls
  es: Un reemplazo moderno de ls
  fr: Un remplaçant moderne de ls
  id: Pengganti modern untuk ls
  it: Un sostituto moderno di ls
  ja: ls コマンドのモダンな代替
  ko: ls의 현대적인 대체품
  pl: Nowoczesny zamiennik polecenia ls
  pt: Um substituto moderno para ls
  ro: O înlocuitor modern pentru ls
  ru: Современная замена ls
  th: ตัวแทนสมัยใหม่ของคำสั่ง ls
  tr: ls için modern bir ikame
  uk: Сучасна заміна ls
  vi: Bản thay thế hiện đại cho ls
homepage: https://github.com/Equationzhao/g
license: MIT
x:
  source: https://github.com/Equationzhao/g
  eget: Equationzhao/g
  brew: g-ls
  scoop: https://raw.githubusercontent.com/Equationzhao/g/master/scoop/g.json
  yay: g-ls
rule:
  /x:
    cmd: x pkg use g
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget Equationzhao/g
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S g-ls
    reference: https://github.com/Equationzhao/g?tab=readme-ov-file#arch-linux-aur
  darwin/brew:
    cmd: brew install g-ls
    reference: https://github.com/Equationzhao/g?tab=readme-ov-file#homebrew
  (win|wsl2)/scoop:
    cmd: scoop install https://raw.githubusercontent.com/Equationzhao/g/master/scoop/g.json
    reference: https://github.com/Equationzhao/g?tab=readme-ov-file#windows-scoop
  /curl:
    cmd: bash -c "$(curl -fsSLk https://raw.githubusercontent.com/Equationzhao/g/master/script/install.sh)"
    reference: https://github.com/Equationzhao/g?tab=readme-ov-file#install-script
  /dpkg:
    cmd: sudo dpkg -i g_$version_$arch.deb
    reference: https://github.com/Equationzhao/g?tab=readme-ov-file#deb
  /go:
    cmd: go install -ldflags="-s -w"  github.com/Equationzhao/g@latest
    reference: https://github.com/Equationzhao/g?tab=readme-ov-file#from-source
    dsnap: github.com/Equationzhao/g@latest
binlist:
- g

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
