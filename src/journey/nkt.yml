lang: Zig
homepage: https://github.com/fjebaker/nkt
license: GPL-3.0
desc:
  cn: nkt 是一个命令行工具，可帮助您跟踪和构建笔记、待办事项列表、习惯等
  en: nkt is a command line tool for helping you track and build your notes, todo lists, habits, and more.
x:
  source: https://github.com/fjebaker/nkt
  eget: https://github.com/fjebaker/nkt
rule:
  /eget:
    cmd: x eget fjebaker/nkt
    reference: https://x-cmd.com/mod/eget
  /zig:
    cmd: "git clone https://github.com/fjebaker/nkt \\\n    && cd nkt \\\n    && zig build -Doptimize=ReleaseSafe\n"
    reference: https://github.com/fjebaker/nkt?tab=readme-ov-file#installation-
binlist:
- nkt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
