lang: Shell
homepage: https://github.com/JianZcar/FuzPad
license: GPL-3.0
desc:
  en: A minimalistic note management solution.
  cn: 一个极简的笔记管理解决方案
  cs: minimalistické řešení pro správu poznámek.
  de: Eine minimalistische Lösung zur Notizverwaltung.
  es: Una solución minimalista para la gestión de notas.
  fr: Une solution minimaliste de gestion de notes.
  id: Solusi manajemen catatan yang minimalistis.
  it: Una soluzione minimalista per la gestione delle note.
  ja: ミニマルなノート管理ソリューション。
  ko: 미니멀한 노트 관리 솔루션.
  pl: Minimalistyczne rozwiązanie do zarządzania notatkami.
  pt: Uma solução minimalista de gestão de notas.
  ro: O soluție minimalistă pentru gestionarea notițelor.
  ru: Минималистичное решение для управления заметками.
  th: โซลูชันจัดการโน้ตแบบเรียบง่าย
  tr: Minimalist bir not yönetimi çözümü.
  uk: Мінімалістичне рішення для керування нотатками.
  vi: Giải pháp quản lý ghi chú tối giản
x:
  source: https://github.com/JianZcar/FuzPad
  eget: JianZcar/FuzPad
  brew: JianZcar/packages/fuzpad
rule:
  /eget:
    cmd: x eget JianZcar/FuzPad
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -s https://gist.githubusercontent.com/JianZcar/df050e108b462e469f413f0eec229143/raw | bash
    reference: https://github.com/JianZcar/FuzPad?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install JianZcar/packages/fuzpad
    reference: https://github.com/JianZcar/FuzPad?tab=readme-ov-file#installation
binlist:
- fuzpad

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
