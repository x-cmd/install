lang: Shell
homepage: https://github.com/JianZcar/FuzPad
license: GPL-3.0
desc:
  en: A minimalistic note management solution.
  cn: 一个极简的笔记管理解决方案
x:
  source: https://github.com/JianZcar/FuzPad
  eget: https://github.com/JianZcar/FuzPad
rule:
  /eget:
    cmd: x eget JianZcar/FuzPad
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -s https://gist.githubusercontent.com/JianZcar/df050e108b462e469f413f0eec229143/raw | bash
    reference: https://github.com/JianZcar/FuzPad?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install JianZcar/packages/fuzpad
    reference: https://github.com/JianZcar/FuzPad?tab=readme-ov-file#installation
binlist:
- fuzpad

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
