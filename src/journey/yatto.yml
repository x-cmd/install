lang: 'Go'
homepage: 'https://github.com/handlebargh/yatto'
license: 'MIT'
desc:
  cn: 命令行下版本可控的交互式待办清单
  en: 'Interactive version-controlled todo-list for the command-line'
x:
  source: https://github.com/handlebargh/yatto
  eget: https://github.com/handlebargh/yatto
rule:
  /eget:
    cmd: x eget handlebargh/yatto
    reference: https://github.com/handlebargh/yatto
binlist:
- 'yatto'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
