lang: 'Go'
homepage: 'https://github.com/handlebargh/yatto'
license: 'MIT'
desc:
  cn: 命令行下版本可控的交互式待办清单
  en: 'Interactive version-controlled todo-list for the command-line'
x:
  source: https://github.com/handlebargh/yatto
  eget: https://github.com/handlebargh/yatto
rule:
  /eget:
    cmd: x eget handlebargh/yatto
    reference: https://github.com/handlebargh/yatto
binlist:
  - 'yatto'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
