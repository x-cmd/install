lang: 'Go'
homepage: 'https://github.com/handlebargh/yatto'
license: 'MIT'
desc:
  cn: 命令行下版本可控的交互式待办清单
  en: 'Interactive version-controlled todo-list for the command-line'
  cs: Interaktivní todo seznam pod verzí pro příkazovou řádu
  de: Interaktive, versionskontrollierte Aufgabenliste für die Kommandozeile
  es: Lista de tareas interactiva y versionada para la línea de comandos
  fr: Liste de tâches interactive et versionnée pour la ligne de commande
  id: Daftar tugas interaktif dengan kontrol versi untuk baris perintah
  it: Elenco di attività interattivo e versionato per la riga di comando
  ja: コマンドライン向けの対話型バージョン管理ToDoリスト
  ko: 명령줄을 위한 대화형 버전 관리 할 일 목록
  pl: Interaktywna, wersjonowana lista zadań dla wiersza poleceń
  pt: Lista de tarefas interativa e versionada para a linha de comando
  ro: O listă de sarcini interactivă și versionată pentru linia de comandă
  ru: Интерактивный список дел с контролем версий для командной строки
  th: รายการงานแบบโต้ตอบที่มีการควบคุมเวอร์ชันสำหรับบรรทัดคำสั่ง
  tr: Komut satırı için etkileşimli, sürüm kontrolü olan yapılacaklar listesi
  uk: Інтерактивний список справ із контролем версій для командного рядка
  vi: Danh sách việc cần làm tương tác có kiểm soát phiên bản cho dòng lệnh
x:
  source: https://github.com/handlebargh/yatto
  eget: handlebargh/yatto
rule:
  /eget:
    cmd: x eget handlebargh/yatto
    reference: https://github.com/handlebargh/yatto
binlist:
- 'yatto'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
