lang: C
homepage: https://github.com/lfos/calcurse
license: BSD-2-Clause
desc:
  cn: 一款命令行日历和日程安排应用。它可以帮助用户追踪事件、约会和日常任务。
  en: A calendar and scheduling application for the command line. It helps keep track of events, appointments and everyday tasks.
x:
  source: https://github.com/lfos/calcurse
rule:
  darwin/brew:
    cmd: brew install calcurse
    reference: https://formulae.brew.sh/formula/calcurse
  ubuntu/apt:
    cmd: x apt install calcurse
    reference: https://packages.ubuntu.com/search?keywords=calcurse
  debian/apt:
    cmd: x apt install calcurse
    reference: https://packages.debian.org/search?keywords=calcurse
  arch/pacman:
    cmd: x pacman -S calcurse
    reference: https://archlinux.org/packages/?q=calcurse
  fedora/dnf:
    cmd: x dnf install calcurse
    reference: https://packages.fedoraproject.org/pkgs/calcurse/calcurse/
  arch/yay:
    cmd: yay -S calcurse-git
    reference: https://aur.archlinux.org/packages/calcurse-git
binlist:
- calcurse

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 961 KB
          rating: 1
          desc:
            cn: 约 961 KB（估算）
            en: ~961 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
