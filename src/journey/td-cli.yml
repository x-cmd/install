lang: Python
homepage: https://github.com/darrikonn/td-cli
license: MIT
desc:
  cn: 一个命令行待办事项管理器
  en: A todo command line todo manager
x:
  pkg:
    exist: true
  source: https://github.com/darrikonn/td-cli
rule:
  /x:
    cmd: x pkg use td-cli
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install td-cli
    reference: https://github.com/darrikonn/td-cli?tab=readme-ov-file#installation
  win/pip:
    cmd: pip install windows-curses
    reference: https://github.com/darrikonn/td-cli?tab=readme-ov-file#windows-10
binlist:
- td-cli
