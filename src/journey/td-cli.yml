lang: Python
homepage: https://github.com/darrikonn/td-cli
license: MIT
desc:
  cn: 一个命令行待办事项管理器
  en: A todo command line todo manager
x:
  pkg:
    exist: true
  source: https://github.com/darrikonn/td-cli
rule:
  /x:
    cmd: x pkg use td-cli
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install td-cli
    reference: https://github.com/darrikonn/td-cli?tab=readme-ov-file#installation
  win/pip:
    cmd: pip install windows-curses
    reference: https://github.com/darrikonn/td-cli?tab=readme-ov-file#windows-10
binlist:
- td-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
