lang: Python
homepage: https://github.com/darrikonn/td-cli
license: MIT
desc:
  cn: 一个命令行待办事项管理器
  en: A todo command line todo manager
  cs: Nástroj pro správu úkolů v příkazovém řádku
  de: Ein Aufgabenverwalter für die Kommandozeile
  es: Un gestor de tareas de la línea de comandos
  fr: Un gestionnaire de tâches en ligne de commande
  id: Manajer tugas baris perintah
  it: Un gestore di attività da riga di comando
  ja: コマンドラインの ToDo マネージャー
  ko: 명령줄 할 일 관리자
  pl: Menedżer zadań w wierszu poleceń
  pt: Um gerenciador de tarefas de linha de comando
  ro: Un manager de sarcini pentru linia de comandă
  ru: Менеджер задач для командной строки
  th: ตัวจัดการงานที่ต้องทำบนบรรทัดคำสั่ง
  tr: Komut satırı için bir yapılacaklar yöneticisi
  uk: Менеджер завдань для командного рядка
  vi: Trình quản lý việc cần làm trên dòng lệnh
x:
  source: https://github.com/darrikonn/td-cli
  pip: td-cli
rule:
  /x:
    cmd: x pkg use td-cli
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install td-cli
    reference: https://github.com/darrikonn/td-cli?tab=readme-ov-file#installation
  win/pip:
    cmd: pip install windows-curses
    reference: https://github.com/darrikonn/td-cli?tab=readme-ov-file#windows-10
binlist:
- td-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
