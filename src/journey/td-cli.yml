lang: Python
homepage: https://github.com/darrikonn/td-cli
license: MIT
desc:
  cn: 一个命令行待办事项管理器
  en: A todo command line todo manager
x:
  pkg:
    exist: true
  source: https://github.com/darrikonn/td-cli
rule:
  /x:
    cmd: x pkg use td-cli
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install td-cli
    reference: https://github.com/darrikonn/td-cli?tab=readme-ov-file#installation
  win/pip:
    cmd: pip install windows-curses
    reference: https://github.com/darrikonn/td-cli?tab=readme-ov-file#windows-10
binlist:
- td-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
