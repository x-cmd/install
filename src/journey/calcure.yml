lang: Python
homepage: https://github.com/anufrievroman/calcure
license: MIT
desc:
  cn: 现代 TUI 日历和任务管理器，界面可自定义。
  en: Modern TUI calendar and task manager with customizable interface
x:
  pkg:
    exist: true
  source: https://github.com/anufrievroman/calcure
rule:
  /x:
    cmd: x pkg use calcure
    reference: https://x-cmd.com/install/
  /pipx:
    cmd: pipx install calcure
    reference: https://github.com/anufrievroman/calcure?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S calcure
    reference: https://github.com/anufrievroman/calcure?tab=readme-ov-file#installation
  nix/nix-shell:
    cmd: nix-shell -p calcure
    reference: https://search.nixos.org/packages?query=calcure
binlist:
- calcure

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
