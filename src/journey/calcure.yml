lang: Python
homepage: https://github.com/anufrievroman/calcure
license: MIT
desc:
  cn: 现代 TUI 日历和任务管理器，界面可自定义。
  en: Modern TUI calendar and task manager with customizable interface
x:
  pkg:
    exist: true
  source: https://github.com/anufrievroman/calcure
rule:
  /x:
    cmd: x pkg use calcure
    reference: https://x-cmd.com/install/
  /pipx:
    cmd: pipx install calcure
    reference: https://github.com/anufrievroman/calcure?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S calcure
    reference: https://github.com/anufrievroman/calcure?tab=readme-ov-file#installation
  nix/nix-shell:
    cmd: nix-shell -p calcure
    reference: https://search.nixos.org/packages?query=calcure
binlist:
- calcure

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
