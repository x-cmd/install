lang: 'Python'
homepage: https://github.com/fjonasALICE/arTui
license: 'MIT'
desc:
  cn: 阅读和追踪近期 arXiv 论文的小型 TUI
  en: 'A small TUI to read and track recent arXiv papers'
x:
  source: https://github.com/fjonasALICE/arTui
  eget: https://github.com/fjonasALICE/arTui
rule:
  /eget:
    cmd: x eget fjonasALICE/arTui
    reference: https://github.com/fjonasALICE/arTui
binlist:
  - 'artui'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
