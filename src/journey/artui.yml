lang: 'Python'
homepage: https://github.com/fjonasALICE/arTui
license: 'MIT'
desc:
  cn: 阅读和追踪近期 arXiv 论文的小型 TUI
  en: 'A small TUI to read and track recent arXiv papers'
  cs: Malé TUI pro čtení a sledování nedávných arXiv článků
  de: Eine kleine TUI zum Lesen und Verfolgen aktueller arXiv-Publikationen
  es: Una pequeña TUI para leer y seguir las publicaciones recientes de arXiv
  fr: Une petite TUI pour lire et suivre les récents articles arXiv
  id: TUI kecil untuk membaca dan melacak makalah arXiv terbaru
  it: Una piccola TUI per leggere e seguire le recenti pubblicazioni arXiv
  ja: 最近の arXiv 論文を読んで追跡するための小さな TUI
  ko: 최근 arXiv 논문을 읽고 추적하기 위한 작은 TUI입니다
  pl: Mały TUI do czytania i śledzenia najnowszych publikacji arXiv
  pt: Uma pequena TUI para ler e acompanhar artigos recentes do arXiv
  ro: O mică interfață TUI pentru citirea și urmărirea articolelor recente de pe arXiv
  ru: Небольшой TUI для чтения и отслеживания свежих статей arXiv
  th: TUI ขนาดเล็กสำหรับอ่านและติดตามบทความ arXiv ล่าสุด
  tr: Son arXiv makalelerini okumak ve takip etmek için küçük bir TUI.
  uk: Невеликий TUI для читання та відстеження свіжих статей arXiv
  vi: Giao diện TUI nhỏ để đọc và theo dõi các bài báo arXiv gần đây
x:
  source: https://github.com/fjonasALICE/arTui
  eget: fjonasALICE/arTui
rule:
  /eget:
    cmd: x eget fjonasALICE/arTui
    reference: https://github.com/fjonasALICE/arTui
binlist:
  - 'artui'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 KB
          rating: 1
          desc:
            cn: 约 11 KB（估算）
            en: ~11 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
