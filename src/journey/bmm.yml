lang: Rust
homepage: https://github.com/dhth/bmm
license: MIT
desc:
  cn: 一个命令行书签管理器，它将链接存储在本地。
  en: A CLI tool bookmark manager that stores your links locally.
x:
  source: https://github.com/dhth/bmm
  eget: https://github.com/dhth/bmm
rule:
  /eget:
    cmd: x eget dhth/bmm
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S bmm
    reference: https://aur.archlinux.org/packages/bmm
  /cargo:
    cmd: cargo install bmm
    reference: https://github.com/dhth/bmm?tab=readme-ov-file#-installation
    dsnap: bmm
  /brew:
    cmd: brew install dhth/tap/bmm
    reference: https://github.com/dhth/bmm?tab=readme-ov-file#-installation
binlist:
- bmm

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
