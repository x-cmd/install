lang: Rust
homepage: https://github.com/dhth/bmm
license: MIT
desc:
  cn: 一个命令行书签管理器，它将链接存储在本地。
  en: A CLI tool bookmark manager that stores your links locally.
  cs: CLI nástroj pro správu záložek, který ukládá odkazy lokálně.
  de: Ein CLI-Bookmark-Manager, der Ihre Links lokal speichert.
  es: Una herramienta CLI de gestión de marcadores que almacena tus enlaces localmente.
  fr: Un gestionnaire de favoris en ligne de commande qui stocke vos liens localement.
  id: Alat pengelola bookmark CLI yang menyimpan tautan Anda secara lokal.
  it: Un gestore di segnalibri da riga di comando che salva i tuoi link localmente.
  ja: リンクをローカルに保存する CLI ブックマークマネージャー。
  ko: 링크를 로컬에 저장하는 CLI 북마크 관리자입니다.
  pl: Narzędzie CLI do zarządzania zakładkami, które przechowuje linki lokalnie.
  pt: Um gerenciador de marcadores de linha de comando que armazena seus links localmente.
  ro: Un manager de marcaje din linie de comandă care stochează local linkurile tale.
  ru: Командный менеджер закладок, который хранит ваши ссылки локально.
  th: เครื่องมือจัดการบุ๊กมาร์กแบบ CLI ที่เก็บลิงก์ของคุณไว้ในเครื่อง
  tr: Bağlantılarınızı yerel olarak saklayan bir CLI yer imi yöneticisi.
  uk: Командний менеджер закладок, який локально зберігає ваші посилання.
  vi: Trình quản lý dấu trang dòng lệnh lưu trữ liên kết của bạn cục bộ.
x:
  source: https://github.com/dhth/bmm
  eget: dhth/bmm
  brew: dhth/tap/bmm
  yay: bmm
  cargo: bmm
rule:
  /eget:
    cmd: x eget dhth/bmm
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S bmm
    reference: https://aur.archlinux.org/packages/bmm
  /cargo:
    cmd: cargo install bmm
    reference: https://github.com/dhth/bmm?tab=readme-ov-file#-installation
    dsnap: bmm
  /brew:
    cmd: brew install dhth/tap/bmm
    reference: https://github.com/dhth/bmm?tab=readme-ov-file#-installation
binlist:
- bmm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
