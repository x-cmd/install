lang: Rust
homepage: https://github.com/GabAlpha/basilk
license: Apache-2.0
desc:
  cn: 一个使用最少看板逻辑管理任务的 TUI。
  en: A TUI to manage your tasks with minimal kanban logic.
x:
  source: https://github.com/GabAlpha/basilk
  eget: https://github.com/GabAlpha/basilk
rule:
  /eget:
    cmd: x eget GabAlpha/basilk
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install basilk
    reference: https://github.com/GabAlpha/basilk#installation
    dsnap: basilk
  linux/paru:
    cmd: paru -S basilk
    reference: https://github.com/GabAlpha/basilk#installation
  /brew:
    cmd: brew install GabAlpha/tap/basilk
    reference: https://github.com/GabAlpha/basilk#installation
binlist:
- basilk

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
