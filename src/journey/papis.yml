lang: Python
homepage: https://github.com/papis/papis
license: GPL-3.0
desc:
  en: Papis is a powerful and highly extensible CLI document and bibliography manager
  cn: Papis 是一个功能强大且高度可扩展的命令行文档和参考文献管理工具。
  cs: Papis je mocný a vysoce rozšiřitelný nástroj CLI pro správu dokumentů a bibliografií
  de: Papis ist ein leistungsstarkes und hoch erweiterbares CLI-Werkzeug zur Dokumenten- und Literaturverwaltung
  es: Papis es una potente y altamente extensible herramienta de línea de comandos para gestionar documentos y bibliografía
  fr: Papis est un outil CLI puissant et hautement extensible de gestion de documents et de bibliographie
  id: Papis adalah alat CLI yang kuat dan sangat dapat diperluas untuk mengelola dokumen dan bibliografi
  it: Papis è un potente strumento CLI per la gestione di documenti e bibliografie, altamente estensibile
  ja: Papisは強力かつ非常に拡張可能なCLIの文書・文献管理ツールです
  ko: Papis은 문서와 참고문헌을 관리하는 강력하고 확장성이 뛰어난 CLI 도구입니다
  pl: Papis to potężne i wysoce rozszerzalne narzędzie CLI do zarządzania dokumentami i bibliografią
  pt: Papis é uma ferramenta de linha de comando poderosa e altamente extensível para gerenciamento de documentos e bibliografia
  ro: Papis este un instrument CLI puternic și foarte extensibil pentru gestionarea documentelor și a bibliografiei
  ru: Papis — мощный и легко расширяемый инструмент командной строки для управления документами и библиографией
  th: Papis เป็นเครื่องมือบรรทัดคำสั่งที่ทรงพลังและขยายได้สูงสำหรับการจัดการเอกสารและบรรณานุกรม
  tr: Papis, belge ve kaynakça yönetimi için güçlü ve son derece genişletilebilir bir CLI aracıdır
  uk: Papis — потужний і надзвичайно розширюваний інструмент командного рядка для керування документами та бібліографією
  vi: Papis là công cụ dòng lệnh mạnh mẽ và có thể mở rộng cao để quản lý tài liệu và thư mục tra cứu
x:
  source: https://github.com/papis/papis
  eget: papis/papis
  yay: papis
rule:
  /eget:
    cmd: x eget papis/papis
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install --user papis
    reference: https://papis.readthedocs.io/en/latest/install.html
    dsnap: papis
  arch/yay:
    cmd: yay -S papis
    reference: https://papis.readthedocs.io/en/latest/install.html
  /nix-env:
    cmd: nix-env -i papis
    reference: https://papis.readthedocs.io/en/latest/install.html
binlist:
- papis

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.9 MB
          rating: 1
          desc:
            cn: 约 1.9 MB（估算）
            en: ~1.9 MB estimated
        download:
          estimate: 307 KB
          desc:
            cn: 约 307 KB 下载 (whl)
            en: ~307 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
