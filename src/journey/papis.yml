lang: Python
homepage: https://github.com/papis/papis
license: GPL-3.0
desc:
  en: Papis is a powerful and highly extensible CLI document and bibliography manager
  cn: Papis 是一个功能强大且高度可扩展的命令行文档和参考文献管理工具。
x:
  source: https://github.com/papis/papis
  eget: https://github.com/papis/papis
rule:
  /eget:
    cmd: x eget papis/papis
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install --user papis
    reference: https://papis.readthedocs.io/en/latest/install.html
    dsnap: papis
  arch/yay:
    cmd: yay -S papis
    reference: https://papis.readthedocs.io/en/latest/install.html
  /nix-env:
    cmd: nix-env -i papis
    reference: https://papis.readthedocs.io/en/latest/install.html
binlist:
- papis

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
