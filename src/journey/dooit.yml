lang: Python
homepage: https://github.com/dooit-org/dooit
license: MIT
desc:
  cn: 出色的 TUI 待办事项管理器
  en: An awesome TUI todo manager
x:
  source: https://github.com/dooit-org/dooit
  eget: https://github.com/dooit-org/dooit
rule:
  /eget:
    cmd: x eget dooit-org/dooit
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install dooit dooit-extras
    reference: https://dooit-org.github.io/dooit/getting_started/installation.html
  arch/yay:
    cmd: yay -S dooit dooit-extras
    reference: https://dooit-org.github.io/dooit/getting_started/installation.html
binlist:
- dooit

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 32 MB
          rating: 2
          desc:
            cn: 安装 32 MB
            en: 32 MB install
        download:
          estimate: 32 MB
          desc:
            cn: 约 32 MB 下载 (linux/arm64)
            en: ~32 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
