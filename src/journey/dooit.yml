lang: Python
homepage: https://github.com/dooit-org/dooit
license: MIT
desc:
  cn: 出色的 TUI 待办事项管理器
  en: An awesome TUI todo manager
x:
  source: https://github.com/dooit-org/dooit
  eget: https://github.com/dooit-org/dooit
rule:
  /eget:
    cmd: x eget dooit-org/dooit
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install dooit dooit-extras
    reference: https://dooit-org.github.io/dooit/getting_started/installation.html
  arch/yay:
    cmd: yay -S dooit dooit-extras
    reference: https://dooit-org.github.io/dooit/getting_started/installation.html
binlist:
- dooit

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
