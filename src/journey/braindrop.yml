lang: Python
homepage: https://github.com/davep/braindrop
license: GPL-3.0
desc:
  cn: Braindrop 是 raindrop.io 书签服务的基于终端的客户端应用程序
  en: Braindrop is a terminal-based client application for the raindrop.io bookmarking service.
x:
  source: https://github.com/davep/braindrop
rule:
  /pipx:
    cmd: pipx install braindrop
    reference: https://github.com/davep/braindrop?tab=readme-ov-file#installing
  /brew:
    cmd: 'brew tap davep/homebrew

      brew install braindrop

      '
    reference: https://github.com/davep/braindrop?tab=readme-ov-file#installing
binlist:
- braindrop

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
