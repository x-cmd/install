lang: Rust
homepage: https://github.com/Nukesor/pueue
license: Apache-2.0
desc:
  cn: Pueue 是一个命令行任务管理工具，用于顺序执行和并行执行长时间运行的任务
  en: Pueue is a command-line task management tool for sequential and parallel execution of long-running tasks
  cs: Pueue je nástroj pro správu úkolů v příkazové řádce, který umožňuje sekvenční i paralelní spouštění dlouhotrvajících úkolů
  de: Pueue ist ein Befehlszeilen-Tool zur Aufgabenverwaltung, das die sequentielle und parallele Ausführung von langlebigen Aufgaben ermöglicht
  es: Pueue es una herramienta de gestión de tareas de línea de comandos para la ejecución secuencial y paralela de tareas de larga duración
  fr: Pueue est un outil de gestion des tâches en ligne de commande permettant l'exécution séquentielle et parallèle de tâches de longue durée
  id: Pueue adalah alat manajemen tugas baris perintah untuk eksekusi berurutan dan paralel dari tugas berdurasi panjang
  it: Pueue è uno strumento di gestione delle attività da riga di comando per l'esecuzione sequenziale e parallela di attività di lunga durata
  ja: Pueueは、長時間実行されるタスクを逐次実行および並列実行するためのコマンドラインタスク管理ツールです
  ko: Pueue는 장시간 실행되는 작업을 순차적 및 병렬로 실행하기 위한 명령줄 작업 관리 도구입니다
  pl: Pueue to narzędzie do zarządzania zadaniami w wierszu poleceń, umożliwiające sekwencyjne i równoległe wykonywanie długotrwałych zadań
  pt: Pueue é uma ferramenta de gerenciamento de tarefas de linha de comando para execução sequencial e paralela de tarefas de longa duração
  ro: Pueue este un instrument de management al sarcinilor în linia de comandă pentru execuție secvențială și paralelă a sarcinilor de lungă durată
  ru: Pueue — инструмент командной строки для управления задачами, обеспечивающий последовательное и параллельное выполнение долгих задач
  th: Pueue เป็นเครื่องมือจัดการงานบรรทัดคำสั่งสำหรับการทำงานแบบตามลำดับและแบบขนานของงานที่ใช้เวลานาน
  tr: Pueue, uzun süren görevlerin sıralı ve paralel olarak yürütülmesi için bir komut satırı görev yönetimi aracıdır
  uk: Pueue — інструмент командного рядка для керування завданнями, що забезпечує послідовне та паралельне виконання тривалих завдань
  vi: Pueue là công cụ quản lý công việc dòng lệnh để chạy tuần tự và song song các công việc kéo dài
x:
  source: https://github.com/Nukesor/pueue
  eget: Nukesor/pueue
  brew: pueue
  scoop: pueue
  yay: pueue-git
rule:
  /x:
    cmd: x pkg use pueue
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget Nukesor/pueue
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install --locked pueue
    reference: https://github.com/Nukesor/pueue?tab=readme-ov-file#via-cargo
    dsnap: pueue
  darwin/brew:
    cmd: brew install pueue
    reference: https://formulae.brew.sh/formula/pueue#default
  (win|wsl2)/scoop:
    cmd: x scoop install pueue
    reference: https://scoop.sh/#/apps?q=pueue
  arch/yay:
    cmd: yay -S pueue-git
    reference: https://aur.archlinux.org/packages/pueue-git
binlist:
- pueue
# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取 ~/.config/pueue 状态
          en: Reads ~/.config/pueue state
        sensitive: []
      write:
        desc:
          cn: 写入 ~/.config/pueue 状态和日志
          en: Writes ~/.config/pueue state and logs
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        growth:
          desc:
            cn: 日志随任务输出增长
            en: Logs grow with task output
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data:
        - "$HOME/.local/share/pueue"
        config:
        - "$HOME/.config/pueue"
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 30 MB
        desc:
          cn: ~30 MB
          en: ~30 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 任务调度时短暂占用
          en: Brief spike on task scheduling
  platform:
    win: full
    linux: full
    darwin: full
