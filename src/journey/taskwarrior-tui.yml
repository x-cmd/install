lang: Rust
homepage: https://github.com/kdheepak/taskwarrior-tui
license: MIT
desc:
  en: A terminal user interface for taskwarrior
  cn: Taskwarrior 的终端用户界面
x:
  source: https://github.com/kdheepak/taskwarrior-tui
  eget: https://github.com/kdheepak/taskwarrior-tui
rule:
  /eget:
    cmd: x eget kdheepak/taskwarrior-tui
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install taskwarrior-tui
    reference: https://kdheepak.com/taskwarrior-tui/installation/
  arch/pacman:
    cmd: pacman -S taskwarrior-tui
    reference: https://kdheepak.com/taskwarrior-tui/installation/
  arch/yay:
    cmd: yay -S taskwarrior-tui-git
    reference: https://kdheepak.com/taskwarrior-tui/installation/
  linux/snap:
    cmd: snap install taskwarrior-tui
    reference: https://kdheepak.com/taskwarrior-tui/installation/
binlist:
- taskwarrior-tui

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
