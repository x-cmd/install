lang: Python
homepage: https://github.com/pimutils/khal
license: MIT
desc:
  cn: Khal 是基于标准的 CLI（控制台）日历程序，能够通过 vdirsyncer 与 CalDAV 服务器同步
  en: Khal is a standards based CLI (console) calendar program, able to synchronize with CalDAV servers through vdirsyncer
x:
  pkg:
    exist: true
  source: https://github.com/pimutils/khal
rule:
  /x:
    cmd: x pkg use khal
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install khal
    reference: https://lostpackets.de/khal/install.html
    dsnap: khal
  debian/apt:
    cmd: sudo apt install khal
    reference: https://github.com/pimutils/khal?tab=readme-ov-file#debianubuntu
    dsnap: khal
  ubuntu/apt:
    cmd: sudo apt install khal
    reference: https://github.com/pimutils/khal?tab=readme-ov-file#debianubuntu
    dsnap: khal
  fedora/dnf:
    cmd: sudo dnf install khal
    reference: https://github.com/pimutils/khal?tab=readme-ov-file#fedora
    dsnap: khal
  arch/yay:
    cmd: yay -S khal-git
    reference: https://aur.archlinux.org/packages/khal-git
binlist:
- khal

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
