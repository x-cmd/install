lang: Python
homepage: https://github.com/Zaloog/kanban-tui
license: MIT
desc:
  cn: 用 Python 编写的带有 TUI 的任务管理器
  en: Task Manager with a TUI written in Python
x:
  source: https://github.com/Zaloog/kanban-tui
rule:
  /pip:
    cmd: pip install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
    dsnap: kanban-tui
  /pipx:
    cmd: pipx install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
  /rye:
    cmd: rye install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
  /uv:
    cmd: uv tool install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
    dsnap: kanban-tui
binlist:
- kanban-tui

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
