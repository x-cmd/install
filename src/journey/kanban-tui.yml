  en: Task Manager with a TUI written in Python
  cs: Správce úkolů s TUI napsaný v Pythonu
  de: Aufgabenmanager mit TUI, in Python geschrieben
  es: Gestor de tareas con TUI escrito en Python
  fr: Gestionnaire de tâches avec TUI écrit en Python
  id: Manajer tugas dengan TUI yang ditulis dengan Python
  it: Gestore delle attività con TUI scritto in Python
  ja: Pythonで書かれたTUI付きタスクマネージャー
  ko: Python으로 작성된 TUI 작업 관리 도구
  pl: Menedżer zadań z TUI napisany w Pythonie
  pt: Gerenciador de tarefas com TUI escrito em Python
  ro: Manager de sarcini cu TUI scris în Python
  ru: Менеджер задач с TUI, написанный на Python
  th: ตัวจัดการงานพร้อม TUI ที่เขียนด้วย Python
  tr: Python ile yazılmış TUI destekli görev yöneticisi
  uk: Менеджер завдань з TUI, написаний на Python
  vi: Trình quản lý công việc có TUI viết bằng Python
x:
  source: https://github.com/Zaloog/kanban-tui
  pip: kanban-tui
rule:
  /pip:
    cmd: pip install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
    dsnap: kanban-tui
  /pipx:
    cmd: pipx install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
  /rye:
    cmd: rye install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
  /uv:
    cmd: uv tool install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
    dsnap: kanban-tui
binlist:
- kanban-tui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 KB
          rating: 1
          desc:
            cn: 约 30 KB（估算）
            en: ~30 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
