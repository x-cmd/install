lang: Python
homepage: https://github.com/Zaloog/kanban-tui
license: MIT
desc:
  cn: 用 Python 编写的带有 TUI 的任务管理器
  en: Task Manager with a TUI written in Python
x:
  source: https://github.com/Zaloog/kanban-tui
rule:
  /pip:
    cmd: pip install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
    dsnap: kanban-tui
  /pipx:
    cmd: pipx install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
  /rye:
    cmd: rye install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
  /uv:
    cmd: uv tool install kanban-tui
    reference: https://github.com/Zaloog/kanban-tui?tab=readme-ov-file#installation
    dsnap: kanban-tui
binlist:
- kanban-tui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 KB
          rating: 1
          desc:
            cn: 约 30 KB（估算）
            en: ~30 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
