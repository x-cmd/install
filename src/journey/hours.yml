lang: Go
homepage: https://github.com/dhth/hours
license: MIT
desc:
  cn: hours 是一个用于命令行的简洁的时间跟踪工具包
  en: hours is a no-frills time tracking toolkit for the command line.
x:
  source: https://github.com/dhth/hours
  eget: dhth/hours
  brew: dhth/tap/hours
  yay: hours
  go: github.com/dhth/hours@latest
rule:
  /eget:
    cmd: x eget dhth/hours
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S hours
    reference: https://aur.archlinux.org/packages/hours
  /brew:
    cmd: brew install dhth/tap/hours
    reference: https://github.com/dhth/hours?tab=readme-ov-file#-install
  /go:
    cmd: go install github.com/dhth/hours@latest
    reference: https://github.com/dhth/hours?tab=readme-ov-file#-install
    dsnap: github.com/dhth/hours@latest
binlist:
- hours

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
