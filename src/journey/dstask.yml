lang: Go
homepage: https://github.com/naggie/dstask
license: MIT
desc:
  cn: Dstask 是一款个人任务追踪器，旨在帮助你集中注意力。它类似于 Taskwarrior 但使用 git 来同步而不是特殊协议。
  en: Dstask is a personal task tracker designed to help you focus. It is similar to Taskwarrior but uses git to synchronise instead of a special protocol.
x:
  source: https://github.com/naggie/dstask
  eget: https://github.com/naggie/dstask
rule:
  /eget:
    cmd: x eget naggie/dstask
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install dstask
    reference: https://github.com/naggie/dstask?tab=readme-ov-file
  arch/pacman:
    cmd: pacman -S dstask
    reference: https://github.com/naggie/dstask?tab=readme-ov-file
  alpine/apk:
    cmd: apk add dstask
    reference: https://github.com/naggie/dstask?tab=readme-ov-file
    dsnap: dstask
  freebsd/pkg:
    cmd: pkg install dstask
    reference: https://github.com/naggie/dstask?tab=readme-ov-file
  /nix-shell:
    cmd: nix-shell -p dstask
    reference: https://search.nixos.org/packages?query=dstask
  arch/yay:
    cmd: yay -S dstask
    reference: https://aur.archlinux.org/packages/dstask
binlist:
- dstask

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 424 KB
          rating: 1
          desc:
            cn: 约 424 KB（估算）
            en: ~424 KB estimated
        download:
          estimate: 9 MB
          desc:
            cn: 约 9 MB 下载 (linux/x64)
            en: ~9 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
