lang: Go
homepage: https://github.com/mrusme/zeit
desc:
  cn: 用于跟踪任务和项目所花费时间的命令行工具
  en: A command line tool for tracking time spent on tasks & projects.
  cs: Nástroj příkazového řádku pro sledování času stráveného na úkolech a projektech.
  de: Ein Kommandozeilen-Tool zum Erfassen der Zeit, die für Aufgaben und Projekte aufgewendet wird.
  es: Una herramienta de línea de comandos para rastrear el tiempo dedicado a tareas y proyectos.
  fr: Un outil en ligne de commande pour suivre le temps passé sur les tâches et les projets.
  id: Alat baris perintah untuk melacak waktu yang dihabiskan pada tugas & proyek.
  it: Uno strumento da riga di comando per tracciare il tempo impiegato su attività e progetti.
  ja: タスクやプロジェクトに費やした時間を計測するコマンドラインツール。
  ko: 작업 및 프로젝트에 사용한 시간을 추적하는 명령줄 도구입니다.
  pl: Narzędzie wiersza poleceń do śledzenia czasu spędzonego na zadaniach i projektach.
  pt: Uma ferramenta de linha de comando para rastrear o tempo gasto em tarefas e projetos.
  ro: Un instrument de linie de comandă pentru urmărirea timpului petrecut pe sarcini și proiecte.
  ru: Инструмент командной строки для отслеживания времени, затраченного на задачи и проекты.
  th: เครื่องมือบรรทัดคำสั่งสำหรับติดตามเวลาที่ใช้กับงานและโครงการ
  tr: Görevler ve projelerde harcanan süreyi izlemek için komut satırı aracı.
  uk: Інструмент командного рядка для відстеження часу, витраченого на завдання та проєкти.
  vi: Công cụ dòng lệnh để theo dõi thời gian đã dùng cho công việc và dự án.
x:
  source: https://github.com/mrusme/zeit
  eget: mrusme/zeit
  yay: zeit
  go: github.com/mrusme/zeit@latest
rule:
  /eget:
    cmd: x eget mrusme/zeit
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S zeit
    reference: https://aur.archlinux.org/packages/zeit
  /go:
    cmd: go install github.com/mrusme/zeit@latest
    reference: https://pkg.go.dev/github.com/mrusme/zeit
    dsnap: github.com/mrusme/zeit
binlist:
- zeit
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
