lang: Go
homepage: https://github.com/mrusme/zeit
desc:
  cn: 用于跟踪任务和项目所花费时间的命令行工具
  en: A command line tool for tracking time spent on tasks & projects.
x:
  source: https://github.com/mrusme/zeit
  eget: https://github.com/mrusme/zeit
rule:
  /eget:
    cmd: x eget mrusme/zeit
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S zeit
    reference: https://aur.archlinux.org/packages/zeit
  /go:
    cmd: go install github.com/mrusme/zeit@latest
    reference: https://pkg.go.dev/github.com/mrusme/zeit
    dsnap: github.com/mrusme/zeit
binlist:
- zeit
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
