lang: Go
homepage: https://github.com/mrusme/zeit
desc:
  cn: 用于跟踪任务和项目所花费时间的命令行工具
  en: A command line tool for tracking time spent on tasks & projects.
x:
  source: https://github.com/mrusme/zeit
  eget: https://github.com/mrusme/zeit
rule:
  /eget:
    cmd: x eget mrusme/zeit
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S zeit
    reference: https://aur.archlinux.org/packages/zeit
  /go:
    cmd: go install github.com/mrusme/zeit@latest
    reference: https://pkg.go.dev/github.com/mrusme/zeit
    dsnap: github.com/mrusme/zeit
binlist:
- zeit
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
