lang: Go
homepage: https://github.com/dhth/omm
license: MIT
desc:
  cn: 一个基于键盘的终端任务管理器。
  en: A keyboard-driven task manager for the terminal.
x:
  source: https://github.com/dhth/omm
  eget: https://github.com/dhth/omm
rule:
  /eget:
    cmd: x eget dhth/omm
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install dhth/tap/omm
    reference: https://github.com/dhth/omm#-installation
  /go:
    cmd: go install github.com/dhth/omm@latest
    reference: https://github.com/dhth/omm#-installation
    dsnap: omm
binlist:
- omm

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
