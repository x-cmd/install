lang: Go
homepage: https://github.com/dhth/omm
license: MIT
desc:
  cn: 一个基于键盘的终端任务管理器。
  en: A keyboard-driven task manager for the terminal.
  cs: Správce úkolů pro terminál ovládaný klávesnicí.
  de: Ein tastaturgesteuerter Aufgabenmanager für das Terminal.
  es: Un gestor de tareas para la terminal controlado por teclado.
  fr: Un gestionnaire de tâches pour le terminal piloté au clavier.
  id: Manajer tugas untuk terminal yang dikendalikan keyboard.
  it: Un gestore delle attività per il terminale controllato tramite tastiera.
  ja: キーボード操作で動くターミナル向けタスクマネージャー。
  ko: 키보드로 조작하는 터미널 작업 관리 도구.
  pl: Menedżer zadań dla terminala sterowany klawiaturą.
  pt: Um gerenciador de tarefas para terminal controlado por teclado.
  ro: Un manager de sarcini pentru terminal, controlat prin tastatură.
  ru: Диспетчер задач для терминала с управлением с клавиатуры.
  th: ตัวจัดการงานสำหรับเทอร์มินัลที่ควบคุมด้วยแป้นพิมพ์
  tr: Terminal için klavye kontrollü bir görev yöneticisi.
  uk: Диспетчер завдань для термінала з керуванням з клавіатури.
  vi: Trình quản lý công việc cho terminal điều khiển bằng bàn phím.
x:
  source: https://github.com/dhth/omm
  eget: dhth/omm
  brew: dhth/tap/omm
  go: github.com/dhth/omm@latest
rule:
  /eget:
    cmd: x eget dhth/omm
    reference: https://x-cmd.com/mod/eget
  /brew:
    cmd: brew install dhth/tap/omm
    reference: https://github.com/dhth/omm#-installation
  /go:
    cmd: go install github.com/dhth/omm@latest
    reference: https://github.com/dhth/omm#-installation
    dsnap: omm
binlist:
- omm

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
