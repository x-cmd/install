lang: 'Rust'
homepage: https://github.com/erikjuhani/basalt
license: 'MIT'
desc:
  cn: 直接在终端管理 Obsidian 笔记的 TUI 应用
  en: 'TUI Application to manage Obsidian notes directly from the terminal'
  cs: TUI aplikace pro správu poznámek Obsidian přímo z terminálu
  de: Eine TUI-Anwendung zum Verwalten von Obsidian-Notizen direkt aus dem Terminal
  es: Una aplicación TUI para gestionar notas de Obsidian directamente desde la terminal
  fr: Une application TUI pour gérer les notes Obsidian directement depuis le terminal
  id: Aplikasi TUI untuk mengelola catatan Obsidian langsung dari terminal
  it: Un'applicazione TUI per gestire le note di Obsidian direttamente dal terminale
  ja: ターミナルから直接 Obsidian のノートを管理する TUI アプリケーション
  ko: 터미널에서 직접 Obsidian 노트를 관리하는 TUI 애플리케이션입니다
  pl: Aplikacja TUI do zarządzania notatkami Obsidian bezpośrednio z terminala
  pt: Um aplicativo TUI para gerenciar notas do Obsidian diretamente do terminal
  ro: O aplicație TUI pentru gestionarea notițelor Obsidian direct din terminal
  ru: TUI-приложение для управления заметками Obsidian прямо из терминала
  th: แอปพลิเคชัน TUI สำหรับจัดการบันทึก Obsidian โดยตรงจากเทอร์มินัล
  tr: Obsidian notlarını doğrudan terminalden yönetmek için bir TUI uygulaması.
  uk: TUI-застосунок для керування ночатками Obsidian прямо з термінала
  vi: Ứng dụng TUI để quản lý ghi chú Obsidian ngay trong terminal
x:
  source: https://github.com/erikjuhani/basalt
  eget: erikjuhani/basalt
rule:
  /eget:
    cmd: x eget erikjuhani/basalt
    reference: https://github.com/erikjuhani/basalt
binlist:
- 'basalt'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
