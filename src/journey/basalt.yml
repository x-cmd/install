lang: 'Rust'
homepage: https://github.com/erikjuhani/basalt
license: 'MIT'
desc:
  cn: 直接在终端管理 Obsidian 笔记的 TUI 应用
  en: 'TUI Application to manage Obsidian notes directly from the terminal'
x:
  source: https://github.com/erikjuhani/basalt
  eget: https://github.com/erikjuhani/basalt
rule:
  /eget:
    cmd: x eget erikjuhani/basalt
    reference: https://github.com/erikjuhani/basalt
binlist:
  - 'basalt'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
