lang: JavaScript
homepage: https://github.com/klaussinani/taskbook
license: MIT
desc:
  cn: 命令行栖息地的任务、看板和注释
  en: Tasks, boards & notes for the command-line habitat
  cs: Úkoly, nástěnky a poznámky pro příkazovou řádu
  de: Aufgaben, Boards und Notizen für die Kommandozeile
  es: Tareas, tableros y notas para la línea de comandos
  fr: Tâches, tableaux et notes pour la ligne de commande
  id: Tugas, papan, dan catatan untuk baris perintah
  it: Attività, bacheche e note per la riga di comando
  ja: コマンドライン環境のためのタスク、ボード、ノート
  ko: 명령줄 환경을 위한 작업, 보드, 노트
  pl: Zadania, tablice i notatki dla wiersza poleceń
  pt: Tarefas, quadros e notas para a linha de comando
  ro: Sarcini, tablouri și note pentru linia de comandă
  ru: Задачи, доски и заметки для командной строки
  th: งาน บอร์ด และบันทึกสำหรับบรรทัดคำสั่ง
  tr: Komut satırı için görevler, panolar ve notlar
  uk: Завдання, дошки та нотатки для командного рядка
  vi: Nhiệm vụ, bảng và ghi chú cho dòng lệnh
x:
  source: https://github.com/klaussinani/taskbook
  snap: taskbook
  yay: taskbook-bin
rule:
  /x:
    cmd: x pkg use taskbook
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global taskbook
    reference: https://github.com/klaudiosinani/taskbook?tab=readme-ov-file#npm
    dsnap: taskbook
  /yarn:
    cmd: yarn global add taskbook
    reference: https://github.com/klaudiosinani/taskbook?tab=readme-ov-file#yarn
  /snap:
    cmd: snap install taskbook
    reference: https://github.com/klaudiosinani/taskbook?tab=readme-ov-file#snapcraft
  arch/yay:
    cmd: yay -S taskbook-bin
    reference: https://aur.archlinux.org/packages/taskbook-bin
binlist:
- taskbook

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
