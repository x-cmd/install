lang: Python
homepage: https://github.com/insanum/gcalcli
license: MIT
desc:
  cn: Google 日历命令行界面
  en: Google Calendar Command Line Interface
x:
  pkg:
    exist: true
  source: https://github.com/insanum/gcalcli
rule:
  /x:
    cmd: x pkg use gcalcli
    reference: https://x-cmd.com/install/
  debian/apt:
    cmd: sudo apt-get install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#debianubuntu
  ubuntu/apt:
    cmd: sudo apt-get install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#debianubuntu
  void/xbps:
    cmd: xbps-install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#void-linux
  nix/nixpkgs:
    cmd: nix-env -i gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#install-using-nix
  darwin/brew:
    cmd: brew install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#install-using-homebrew-macos
  /pip:
    cmd: pip install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#install-from-pypi
    dsnap: gcalcli
  arch/yay:
    cmd: yay -S gcalcli
    reference: https://aur.archlinux.org/packages/gcalcli
binlist:
- gcalcli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
