lang: Python
homepage: https://github.com/insanum/gcalcli
license: MIT
desc:
  cn: Google 日历命令行界面
  en: Google Calendar Command Line Interface
  cs: Příkazová konzole Google Kalendáře
  de: Kommandozeilen-Schnittstelle für Google Calendar
  es: Interfaz de línea de comandos de Google Calendar
  fr: Interface de ligne de commande de Google Calendar
  id: Antarmuka Baris Perintah Google Kalender
  it: Interfaccia a riga di comando di Google Calendar
  ja: Google カレンダーのコマンドラインインターフェース
  ko: Google 캘린더 명령줄 인터페이스
  pl: Interfejs wiersza poleceń Google Calendar
  pt: Interface de linha de comando do Google Calendar
  ro: Interfață de linie de comandă pentru Google Calendar
  ru: Интерфейс командной строки Google Calendar
  th: ส่วนติดต่อบรรทัดคำสั่งของ Google ปฏิทิน
  tr: Google Takvim komut satırı arayüzü
  uk: Інтерфейс командного рядка Google Calendar
  vi: Giao diện dòng lệnh của Google Lịch
x:
  source: https://github.com/insanum/gcalcli
  apt: gcalcli
  brew: gcalcli
  apt-get: gcalcli
  xbps: gcalcli
  yay: gcalcli
  pip: gcalcli
rule:
  /x:
    cmd: x pkg use gcalcli
    reference: https://x-cmd.com/install/
  debian/apt:
    cmd: sudo apt-get install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#debianubuntu
  ubuntu/apt:
    cmd: sudo apt-get install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#debianubuntu
  void/xbps:
    cmd: xbps-install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#void-linux
  nix/nixpkgs:
    cmd: nix-env -i gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#install-using-nix
  darwin/brew:
    cmd: brew install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#install-using-homebrew-macos
  /pip:
    cmd: pip install gcalcli
    reference: https://github.com/insanum/gcalcli?tab=readme-ov-file#install-from-pypi
    dsnap: gcalcli
  arch/yay:
    cmd: yay -S gcalcli
    reference: https://aur.archlinux.org/packages/gcalcli
binlist:
- gcalcli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 KB
          rating: 1
          desc:
            cn: 约 10 KB（估算）
            en: ~10 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
