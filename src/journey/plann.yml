lang: Python
homepage: https://github.com/tobixen/plann
license: GPL-3.0
desc:
  cn: 简单的命令行 CalDAV 客户端，可以添加日历事件、浏览议程和进行任务管理
  en: Simple command-line CalDAV client, making it possible to add calendar events, browse an agenda and do task management
x:
  source: https://github.com/tobixen/plann
rule:
  arch/yay:
    cmd: yay -S plann
    reference: https://aur.archlinux.org/packages/plann
binlist:
- plann

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 KB
          rating: 1
          desc:
            cn: 约 7 KB（估算）
            en: ~7 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
