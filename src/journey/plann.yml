lang: Python
homepage: https://github.com/tobixen/plann
license: GPL-3.0
desc:
  cn: 简单的命令行 CalDAV 客户端，可以添加日历事件、浏览议程和进行任务管理
  en: Simple command-line CalDAV client, making it possible to add calendar events, browse an agenda and do task management
x:
  source: https://github.com/tobixen/plann
rule:
  arch/yay:
    cmd: yay -S plann
    reference: https://aur.archlinux.org/packages/plann
binlist:
- plann

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
