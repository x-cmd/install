lang: C++
homepage: https://github.com/GothenburgBitFactory/taskwarrior
license: MIT
desc:
  en: Taskwarrior is a command line task list management utility with a multitude of features
  cn: Taskwarrior 是一个具有多种特性的命令行任务列表管理实用程序
x:
  source: https://github.com/GothenburgBitFactory/taskwarrior
  eget: https://github.com/GothenburgBitFactory/taskwarrior
rule:
  /eget:
    cmd: x eget GothenburgBitFactory/taskwarrior
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install task
    reference: https://taskwarrior.org/download/
  debian/apt:
    cmd: sudo apt-get install taskwarrior
    reference: https://taskwarrior.org/download/
    dsnap: taskwarrior
  ubuntu/apt:
    cmd: sudo apt-get install taskwarrior
    reference: https://taskwarrior.org/download/
    dsnap: taskwarrior
  arch/pacman:
    cmd: sudo pacman -S task
    reference: https://taskwarrior.org/download/
  kali/apt:
    cmd: sudo apt-get install taskwarrior
    reference: https://taskwarrior.org/download/
    dsnap: taskwarrior
  fedora/yum:
    cmd: sudo yum install task
    reference: https://taskwarrior.org/download/
  raspbian/apt:
    cmd: sudo apt-get install taskwarrior
    reference: https://taskwarrior.org/download/
  opensuse/zypper:
    cmd: "sudo \tzypper install taskwarrior"
    reference: https://taskwarrior.org/download/
  gentoo/emerge:
    cmd: sudo emerge task
    reference: https://taskwarrior.org/download/
  freebsd/pkg:
    cmd: pkg install taskwarrior
    reference: https://taskwarrior.org/download/
  openbsd/pkg_add:
    cmd: doas pkg_add -i taskwarrior
    reference: https://taskwarrior.org/download/
  win/msys2:
    cmd: sudo pacman -S task
    reference: https://taskwarrior.org/download/
  nix/nixpkgs:
    cmd: nix-env -i taskwarrior
    reference: https://taskwarrior.org/download/
  void/xbps:
    cmd: sudo xbps-install task
    reference: https://taskwarrior.org/download/
binlist:
- taskwarrior

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
