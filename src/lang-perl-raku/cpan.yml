lang: Perl
homepage: https://metacpan.org/
desc:
  cn: 免费、开放的 API，可满足您想了解的有关 CPAN 的所有信息
  en: A free, open API for everything you want to know about CPAN
rule:
  /cpan:
    cmd: cpan App::cpanminus
    reference: https://www.cpan.org/modules/INSTALL.html
binlist:
- cpan
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 8 MB
        desc:
          cn: 8 MB（估算）
          en: 8 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
