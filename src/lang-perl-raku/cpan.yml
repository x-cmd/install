lang: Perl
homepage: https://metacpan.org/
desc:
  cn: 免费、开放的 API，可满足您想了解的有关 CPAN 的所有信息
  en: A free, open API for everything you want to know about CPAN
rule:
  /cpan:
    cmd: cpan App::cpanminus
    reference: https://www.cpan.org/modules/INSTALL.html
binlist:
- cpan
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
