lang: Perl
homepage: https://github.com/Perl/perl5
desc:
  cn: 一种通用脚本语言，具有强大的文本处理和正则表达式功能
  en: A general scripting language with powerful text processing and regular expression functions
x:
  source: https://github.com/Perl/perl5
  yay: perl
  asdf: perl
rule:
  /x:
    cmd: x pkg use perl
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use perl
    reference: https://github.com/ouest/asdf-perl
  darwin/curl:
    cmd: yayhttp://xrl.us/installperlosx | bash
    reference: https://learn.perl.org/installing/osx.html
  linux/curl:
    cmd: curl -L http://xrl.us/installperlnix | bash
    reference: https://learn.perl.org/installing/unix_linux.html
  arch/yay:
    cmd: sudo yay -S perl
    reference: https://archlinux.org/packages/core/x86_64/perl/
binlist:
- perl
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 8 MB
        desc:
          cn: 8 MB（估算）
          en: 8 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
