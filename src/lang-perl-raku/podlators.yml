lang: Perl
homepage: https://www.eyrie.org/~eagle/software/podlators/
desc:
  en: Install podlators
  cn: 安装 podlators
  cs: Instalovat podlators
  de: podlators installieren
  es: Instalar podlators
  fr: Installer podlators
  id: Instal podlators
  it: Installa podlators
  ja: podlators をインストールする
  ko: podlators 설치
  pl: Zainstaluj podlators
  pt: Instalar podlators
  ro: Instalează podlators
  ru: Установить podlators
  th: ติดตั้ง podlators
  tr: podlators kur
  uk: Встановити podlators
  vi: Cài đặt podlators
rule:
  /perl:
    cmd: 'perl Makefile.PL

      make

      make install

      '
    reference: https://github.com/rra/podlators

x: {}
binlist:
- podlators
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 8 MB
        desc:
          cn: 8 MB（估算）
          en: 8 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
