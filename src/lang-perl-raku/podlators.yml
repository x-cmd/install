lang: Perl
homepage: https://www.eyrie.org/~eagle/software/podlators/
desc:
  en: Install podlators
  cn: 安装 podlators
rule:
  /perl:
    cmd: 'perl Makefile.PL

      make

      make install

      '
    reference: https://github.com/rra/podlators
binlist:
- podlators
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
