lang: Perl
homepage: https://github.com/miyagawa/cpanminus
desc:
  cn: 从 CPAN 获取、解压缩、构建和安装模块
  en: Get, unpack, build, and install modules from CPAN
x:
  source: https://github.com/miyagawa/cpanminus
rule:
  darwin/brew:
    cmd: brew install cpanminus
    reference: https://formulae.brew.sh/formula/cpanminus#default
binlist:
- cpanminus
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 110 KB
          rating: 1
          desc:
            cn: 约 110 KB（估算）
            en: ~110 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
