lang: Perl
homepage: https://github.com/miyagawa/cpanminus
desc:
  cn: 从 CPAN 获取、解压缩、构建和安装模块
  en: Get, unpack, build, and install modules from CPAN
x:
  source: https://github.com/miyagawa/cpanminus
rule:
  darwin/brew:
    cmd: brew install cpanminus
    reference: https://formulae.brew.sh/formula/cpanminus#default
binlist:
- cpanminus
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB
          en: 20 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
