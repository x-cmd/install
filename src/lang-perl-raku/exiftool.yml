lang: Perl
homepage: https://github.com/exiftool/exiftool
license: GPL-3.0
desc:
  en: Perl lib for reading and writing EXIF metadata
  cn: 用于读取和写入 EXIF 元数据的 Perl 库
x:
  source: https://github.com/exiftool/exiftool
rule:
  darwin/brew:
    cmd: yaytall exiftool
    reference: https://formulae.brew.sh/formula/exiftool#default
  (win|wsl2)/scoop:
    cmd: x scoop install exiftool
    reference: https://scoop.sh/#/apps?q=ExifTool
  arch/yay:
    cmd: sudo yay -S perl-image-exiftool
    reference: https://www.archlinux.org/packages/extra/any/perl-image-exiftool/
binlist:
- exiftool

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.2 MB
          rating: 1
          desc:
            cn: 约 1.2 MB（估算）
            en: ~1.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
