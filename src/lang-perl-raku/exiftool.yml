lang: Perl
homepage: https://github.com/exiftool/exiftool
license: GPL-3.0
desc:
  en: Perl lib for reading and writing EXIF metadata
  cn: 用于读取和写入 EXIF 元数据的 Perl 库
  cs: Perl knihovna pro čtení a zápis metadat EXIF
  de: Perl-Bibliothek zum Lesen und Schreiben von EXIF-Metadaten
  es: Biblioteca de Perl para leer y escribir metadatos EXIF
  fr: Bibliothèque Perl pour lire et écrire les métadonnées EXIF
  id: Pustaka Perl untuk membaca dan menulis metadata EXIF
  it: Libreria Perl per leggere e scrivere metadati EXIF
  ja: EXIF メタデータを読み書きするための Perl ライブラリ
  ko: EXIF 메타데이터를 읽고 쓰기 위한 Perl 라이브러리
  pl: Biblioteka Perl do odczytu i zapisu metadanych EXIF
  pt: Biblioteca Perl para ler e escrever metadados EXIF
  ro: Bibliotecă Perl pentru citirea și scrierea metadelor EXIF
  ru: Библиотека Perl для чтения и записи метаданных EXIF
  th: ไลบรารี Perl สำหรับอ่านและเขียนเมทาดาทา EXIF
  tr: EXIF meta verisi okumak ve yazmak için Perl kitaplığı
  uk: Бібліотека Perl для читання та запису метаданих EXIF
  vi: Thư viện Perl để đọc và ghi siêu dữ liệu EXIF
x:
  source: https://github.com/exiftool/exiftool
  scoop: exiftool
  yay: perl-image-exiftool
rule:
  darwin/brew:
    cmd: yaytall exiftool
    reference: https://formulae.brew.sh/formula/exiftool#default
  (win|wsl2)/scoop:
    cmd: x scoop install exiftool
    reference: https://scoop.sh/#/apps?q=ExifTool
  arch/yay:
    cmd: sudo yay -S perl-image-exiftool
    reference: https://www.archlinux.org/packages/extra/any/perl-image-exiftool/
binlist:
- exiftool

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.2 MB
          rating: 1
          desc:
            cn: 约 1.2 MB（估算）
            en: ~1.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
