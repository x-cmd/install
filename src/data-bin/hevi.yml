lang: Zig
homepage: https://github.com/Arnau478/hevi
license: GPL-3.0
desc:
  cn: 一个简单的十六进制查看器。
  en: A simple hex viewer.
x:
  source: https://github.com/Arnau478/hevi
rule:
  arch/pacman:
    cmd: pacman -S hevi
    reference: https://github.com/Arnau478/hevi#installation
  arch/yay:
    cmd: yay -S hevi
    reference: https://aur.archlinux.org/packages/hevi
  /brew:
    cmd: brew install hevi
    reference: https://github.com/Arnau478/hevi#installation
  /nix:
    cmd: nix shell github:Arnau478/hevi
    reference: https://github.com/Arnau478/hevi#installation
  /eget:
    cmd: eget Arnau478/hevi
    reference: https://github.com/Arnau478/hevi#installation
binlist:
- hevi

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 24 KB
          rating: 1
          desc:
            cn: 约 24 KB（估算）
            en: ~24 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
