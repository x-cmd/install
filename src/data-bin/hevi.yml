lang: Zig
homepage: https://github.com/Arnau478/hevi
license: GPL-3.0
desc:
  cn: 一个简单的十六进制查看器。
  en: A simple hex viewer.
  cs: Jednoduchý prohlížeč hexadecimálních hodnot.
  de: Ein einfacher Hex-Viewer.
  es: Un visor hexadecimal sencillo.
  fr: Un simple visualiseur hexadécimal.
  id: Penampil heksadesimal sederhana.
  it: Un semplice visualizzatore esadecimale.
  ja: シンプルな十六進ビューア。
  ko: 간단한 16진수 뷰어.
  pl: Prosty podglądacz szesnastkowy.
  pt: Um visualizador hexadecimal simples.
  ro: Un vizualizator hexazecimal simplu.
  ru: Простой просмотрщик шестнадцатеричных данных.
  th: ตัวดูเลขฐานสิบหกอย่างง่าย
  tr: Basit bir onaltılık görüntüleyici.
  uk: Простий переглядач шістнадцяткових даних.
  vi: Trình xem hex đơn giản.
x:
  source: https://github.com/Arnau478/hevi
  brew: hevi
  pacman: hevi
  yay: hevi
rule:
  arch/pacman:
    cmd: pacman -S hevi
    reference: https://github.com/Arnau478/hevi#installation
  arch/yay:
    cmd: yay -S hevi
    reference: https://aur.archlinux.org/packages/hevi
  /brew:
    cmd: brew install hevi
    reference: https://github.com/Arnau478/hevi#installation
  /nix:
    cmd: nix shell github:Arnau478/hevi
    reference: https://github.com/Arnau478/hevi#installation
  /eget:
    cmd: eget Arnau478/hevi
    reference: https://github.com/Arnau478/hevi#installation
binlist:
- hevi

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 134 KB
          rating: 1
          desc:
            cn: 安装 134 KB
            en: 134 KB install
        download:
          estimate: 134 KB
          desc:
            cn: 约 134 KB 下载 (linux/x64)
            en: ~134 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
