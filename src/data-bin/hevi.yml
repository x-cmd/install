lang: Zig
homepage: https://github.com/Arnau478/hevi
license: GPL-3.0
desc:
  cn: 一个简单的十六进制查看器。
  en: A simple hex viewer.
x:
  source: https://github.com/Arnau478/hevi
rule:
  arch/pacman:
    cmd: pacman -S hevi
    reference: https://github.com/Arnau478/hevi#installation
  arch/yay:
    cmd: yay -S hevi
    reference: https://aur.archlinux.org/packages/hevi
  /brew:
    cmd: brew install hevi
    reference: https://github.com/Arnau478/hevi#installation
  /nix:
    cmd: nix shell github:Arnau478/hevi
    reference: https://github.com/Arnau478/hevi#installation
  /eget:
    cmd: eget Arnau478/hevi
    reference: https://github.com/Arnau478/hevi#installation
binlist:
- hevi

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 134 KB
          rating: 1
          desc:
            cn: 安装 134 KB
            en: 134 KB install
        download:
          estimate: 134 KB
          desc:
            cn: 约 134 KB 下载 (linux/x64)
            en: ~134 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
