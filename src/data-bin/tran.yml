lang: Go
homepage: https://github.com/abdfnx/tran
license: MIT
desc:
  cn: 一个命令行工具和 TUI，允许在计算机之间安全地传输和发送文件和目录。
  en: A command line tool and TUI that allows secure transfer and sending of files and directories between computers.
x:
  source: https://github.com/abdfnx/tran
  eget: https://github.com/abdfnx/tran
rule:
  /eget:
    cmd: x eget abdfnx/tran
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSL https://cutt.ly/tran-cli | bash
    reference: https://github.com/abdfnx/tran?tab=readme-ov-file#using-script
  win/powershell:
    cmd: x pwsh iwr -useb https://cutt.ly/tran-win | iex
    reference: https://github.com/abdfnx/tran?tab=readme-ov-file#using-script
  darwin/brew:
    cmd: brew install abdfnx/tap/tran
    reference: https://github.com/abdfnx/tran?tab=readme-ov-file#homebrew
  linux/brew:
    cmd: brew install abdfnx/tap/tran
    reference: https://github.com/abdfnx/tran?tab=readme-ov-file#homebrew
binlist:
- tran

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
