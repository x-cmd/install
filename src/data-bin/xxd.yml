lang: C
homepage: https://github.com/ckormanyos/xxd
license: GPL-2.0
desc:
  cn: 十六进制型实用程序 xxd
  en: hex-dump-type utility xxd
x:
  source: https://github.com/ckormanyos/xxd
  eget: https://github.com/ckormanyos/xxd
rule:
  /eget:
    cmd: x eget ckormanyos/xxd
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install xxd
    reference: https://command-not-found.com/xxd
    dsnap: xxd
  ubuntu/apt:
    cmd: sudo apt install xxd
    reference: https://packages.ubuntu.com/search?keywords=xxd
    dsnap: xxd
  arch/pacman:
    cmd: sudo pacman -S xxd
    reference: https://command-not-found.com/xxd
  kali/apt:
    cmd: sudo apt-get install xxd
    reference: https://command-not-found.com/xxd
    dsnap: xxd
  centos/yum:
    cmd: sudo yum install xxd
    reference: https://command-not-found.com/xxd
  fedora/dnf:
    cmd: sudo dnf install vim-common-2
    reference: https://command-not-found.com/xxd
    dsnap: vim-common-2
binlist:
- xxd

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
