lang: C
homepage: https://github.com/ckormanyos/xxd
license: GPL-2.0
desc:
  cn: 十六进制型实用程序 xxd
  en: hex-dump-type utility xxd
x:
  source: https://github.com/ckormanyos/xxd
  eget: https://github.com/ckormanyos/xxd
rule:
  /eget:
    cmd: x eget ckormanyos/xxd
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install xxd
    reference: https://command-not-found.com/xxd
