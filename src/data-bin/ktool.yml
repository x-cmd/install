lang: Python
homepage: https://github.com/0cyn/ktool
license: MIT
desc:
  cn: MachO/ObjC 分析 + 编辑工具包
  en: MachO/ObjC Analysis + Editing toolkit.
x:
  source: https://github.com/0cyn/ktool
rule:
  /pip:
    cmd: pip3 install k2l
    reference: https://github.com/0cyn/ktool?tab=readme-ov-file#installation
    dsnap: k2l

binlist:
  - ktool
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
