lang: Go
homepage: https://github.com/dece2183/hexowl
license: GPL-3.0
desc:
  cn: 轻量级、灵活的程序员计算器，具有变量和函数
  en: Lightweight, flexible programmer's calculator with variables and functions
  cs: Lehký a flexibilní kalkulátor pro programátory s proměnnými a funkcemi
  de: Leichter, flexibler Programmierer-Rechner mit Variablen und Funktionen
  es: Calculadora ligera y flexible para programadores con variables y funciones
  fr: Calculatrice légère et flexible pour programmeurs avec variables et fonctions
  id: Kalkulator pemrogram yang ringan dan fleksibel dengan variabel dan fungsi
  it: Calcolatrice leggera e flessibile per programmatori con variabili e funzioni
  ja: 変数と関数を備えた軽量で柔軟なプログラマー用計算機
  ko: 변수와 함수를 갖춘 가볍고 유연한 프로그래머용 계산기
  pl: Lekki i elastyczny kalkulator dla programistów ze zmiennymi i funkcjami
  pt: Calculadora leve e flexível para programadores com variáveis e funções
  ro: Calculator ușor și flexibil pentru programatori, cu variabile și funcții
  ru: Лёгкий и гибкий калькулятор для программистов с переменными и функциями
  th: เครื่องคิดเลขสำหรับโปรแกรมเมอร์ที่เบาของเบา ยืดหยุ่น พร้อมตัวแปรและฟังก์ชัน
  tr: Değişkenler ve fonksiyonlarla hafif ve esnek bir programcı hesaplayıcısı
  uk: Легкий і гнучкий калькулятор для програмістів зі змінними та функціями
  vi: Máy tính cho lập trình viên nhẹ, linh hoạt, có biến và hàm
x:
  source: https://github.com/dece2183/hexowl
  eget: dece2183/hexowl
  yay: hexowl
  go: github.com/dece2183/hexowl@latest
rule:
  /eget:
    cmd: x eget dece2183/hexowl
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/dece2183/hexowl@latest
    reference: https://github.com/dece2183/hexowl?tab=readme-ov-file#installation
    dsnap: github.com/dece2183/hexowl@latest
  arch/yay:
    cmd: yay -S hexowl
    reference: https://aur.archlinux.org/packages/hexowl
binlist:
- hexowl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (deb)
            en: ~2 MB download (deb)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
