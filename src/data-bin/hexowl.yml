lang: Go
homepage: https://github.com/dece2183/hexowl
license: GPL-3.0
desc:
  cn: 轻量级、灵活的程序员计算器，具有变量和函数
  en: Lightweight, flexible programmer's calculator with variables and functions
x:
  source: https://github.com/dece2183/hexowl
  eget: https://github.com/dece2183/hexowl
rule:
  /eget:
    cmd: x eget dece2183/hexowl
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/dece2183/hexowl@latest
    reference: https://github.com/dece2183/hexowl?tab=readme-ov-file#installation
    dsnap: github.com/dece2183/hexowl@latest
  arch/yay:
    cmd: yay -S hexowl
    reference: https://aur.archlinux.org/packages/hexowl
binlist:
- hexowl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (deb)
            en: ~2 MB download (deb)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: none
