lang: C
homepage: https://sourceware.org/git/?p=elfutils.git;a=summary
desc:
  en: elfutils is a collection of utilities and libraries to read, create and modify ELF binary files, find and handle DWARF debug data, symbols, thread state and stacktraces for processes and core files on GNU/Linux
  cn: Elfutils 是一个实用程序和库的集合，用于读取、创建和修改 ELF 二进制文件，查找和处理 GNU/Linux 上进程和核心文件的 DWARF 调试数据、符号、线程状态和堆栈跟踪
rule:
  darwin/brew:
    cmd: brew install elfutils
    reference: https://formulae.brew.sh/formula/elfutils#default
  arch/yay:
    cmd: yay -S elfutils-git
    reference: https://aur.archlinux.org/packages/elfutils-git
binlist:
- elfutils
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
