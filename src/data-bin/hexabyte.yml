lang: Python
homepage: https://github.com/thetacom/hexabyte
license: GPL-3.0
desc:
  cn: 一个现代化、模块化且强大的 TUI 十六进制编辑器。
  en: A modern, modular, and robust TUI hex editor.
x:
  source: https://github.com/thetacom/hexabyte
  eget: https://github.com/thetacom/hexabyte
rule:
  /eget:
    cmd: x eget thetacom/hexabyte
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S hexabyte
    reference: https://github.com/thetacom/hexabyte#installation
  arch/yay:
    cmd: yay -S hexabyte
    reference: https://aur.archlinux.org/packages/hexabyte
  /pip:
    cmd: pip install hexabyte
    reference: https://github.com/thetacom/hexabyte#install
    dsnap: hexabyte
binlist:
- hexabyte
