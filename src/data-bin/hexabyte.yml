lang: Python
homepage: https://github.com/thetacom/hexabyte
license: GPL-3.0
desc:
  cn: 一个现代化、模块化且强大的 TUI 十六进制编辑器。
  en: A modern, modular, and robust TUI hex editor.
x:
  source: https://github.com/thetacom/hexabyte
  eget: https://github.com/thetacom/hexabyte
rule:
  /eget:
    cmd: x eget thetacom/hexabyte
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S hexabyte
    reference: https://github.com/thetacom/hexabyte#installation
  arch/yay:
    cmd: yay -S hexabyte
    reference: https://aur.archlinux.org/packages/hexabyte
  /pip:
    cmd: pip install hexabyte
    reference: https://github.com/thetacom/hexabyte#install
    dsnap: hexabyte
binlist:
- hexabyte

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
