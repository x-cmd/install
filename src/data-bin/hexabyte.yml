lang: Python
homepage: https://github.com/thetacom/hexabyte
license: GPL-3.0
desc:
  cn: 一个现代化、模块化且强大的 TUI 十六进制编辑器。
  en: A modern, modular, and robust TUI hex editor.
  cs: Moderní, modulární a robustní TUI hexadecimální editor.
  de: Ein moderner, modularer und robuster TUI-Hex-Editor.
  es: Un editor hexadecimal TUI moderno, modular y robusto.
  fr: Un éditeur hexadécimal TUI moderne, modulaire et robuste.
  id: Editor heksadesimal TUI modern, modular, dan kuat.
  it: Un editor esadecimale TUI moderno, modulare e robusto.
  ja: モダンでモジュール式の堅牢な TUI 十六進エディタ。
  ko: 현대적이고 모듈식이며 안정적인 TUI 16진수 편집기.
  pl: Nowoczesny, modularny i solidny edytor szesnastkowy TUI.
  pt: Um editor hexadecimal TUI moderno, modular e robusto.
  ro: Un editor hexazecimal TUI modern, modular și robust.
  ru: Современный, модульный и надёжный TUI-редактор в шестнадцатеричном виде.
  th: ตัวแก้ไขเลขฐานสิบหกแบบ TUI ที่ทันสมัย โมดูลาร์ และทนทาน
  tr: Modern, modüler ve sağlam bir TUI onaltılık düzenleyici.
  uk: Сучасний, модульний і надійний TUI-редактор шістнадцяткового вигляду.
  vi: Trình chỉnh sửa hex TUI hiện đại, mô-đun và mạnh mẽ.
x:
  source: https://github.com/thetacom/hexabyte
  eget: thetacom/hexabyte
  pacman: hexabyte
  yay: hexabyte
  pip: hexabyte
rule:
  /eget:
    cmd: x eget thetacom/hexabyte
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: pacman -S hexabyte
    reference: https://github.com/thetacom/hexabyte#installation
  arch/yay:
    cmd: yay -S hexabyte
    reference: https://aur.archlinux.org/packages/hexabyte
  /pip:
    cmd: pip install hexabyte
    reference: https://github.com/thetacom/hexabyte#install
    dsnap: hexabyte
binlist:
- hexabyte

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 69 KB
          rating: 1
          desc:
            cn: 安装 69 KB
            en: 69 KB install
        download:
          estimate: 69 KB
          desc:
            cn: 约 69 KB 下载 (whl)
            en: ~69 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
