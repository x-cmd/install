  yay: bcal
rule:
  /eget:
    cmd: x eget jarun/bcal
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install bcal
    reference: https://command-not-found.com/bcal
    dsnap: bcal
  ubuntu/apt:
    cmd: sudo apt-get install bcal
    reference: https://command-not-found.com/bcal
    dsnap: bcal
  kali/apt:
    cmd: sudo apt-get install bcal
    reference: https://command-not-found.com/bcal
    dsnap: bcal
  fedora/dnf:
    cmd: sudo dnf install bcal
    reference: https://command-not-found.com/bcal
    dsnap: bcal
  darwin/brew:
    cmd: brew install bcal
    reference: https://formulae.brew.sh/formula/bcal#default
  arch/yay:
    cmd: yay -S bcal
    reference: https://aur.archlinux.org/packages/bcal
binlist:
- bcal

