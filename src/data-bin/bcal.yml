lang: C
homepage: https://github.com/jarun/bcal
license: GPL-3.0
desc:
  cn: bcal ( 字节 CALculator ) 是一个 REPL CLI 实用程序，用于存储表达式（例如 "(2GiB * 2) / (2KiB >> 2)" ）评估、SI/IEC 转换、字节地址计算、基数转换和 LBA/CHS 计算。
  en: bcal (Byte CALculator) is a REPL CLI utility for storage expression (e.g. "(2GiB * 2) / (2KiB >> 2)") evaluation, SI/IEC conversion, byte address calculation, base conversion and LBA/CHS calculation.
x:
  source: https://github.com/jarun/bcal
  eget: https://github.com/jarun/bcal
rule:
  /eget:
    cmd: x eget jarun/bcal
    reference: https://x-cmd.com/mod/eget
  debian/apt:
    cmd: sudo apt-get install bcal
    reference: https://command-not-found.com/bcal
    dsnap: bcal
  ubuntu/apt:
    cmd: sudo apt-get install bcal
    reference: https://command-not-found.com/bcal
    dsnap: bcal
  kali/apt:
    cmd: sudo apt-get install bcal
    reference: https://command-not-found.com/bcal
    dsnap: bcal
  fedora/dnf:
    cmd: sudo dnf install bcal
    reference: https://command-not-found.com/bcal
    dsnap: bcal
  darwin/brew:
    cmd: brew install bcal
    reference: https://formulae.brew.sh/formula/bcal#default
  arch/yay:
    cmd: yay -S bcal
    reference: https://aur.archlinux.org/packages/bcal
binlist:
- bcal

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 128 KB
          rating: 1
          desc:
            cn: 约 128 KB（估算）
            en: ~128 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
