lang: Rust
homepage: https://github.com/Etto48/HexPatch
license: MIT
desc:
  cn: 使用 Rust 编写的具有终端用户界面（TUI）的二进制修补器和编辑器。
  en: A binary patcher and editor written in Rust with terminal user interface (TUI).
  cs: Binární patcher a editor napsaný v Rustu s terminálovým uživatelským rozhraním (TUI).
  de: Ein in Rust geschriebener Binär-Patcher und -Editor mit Terminal-Benutzeroberfläche (TUI).
  es: Un parcheador y editor de binarios escrito en Rust con interfaz de usuario de terminal (TUI).
  fr: Un patcheur et éditeur de binaires écrit en Rust avec interface utilisateur en terminal (TUI).
  id: Patcher dan editor biner yang ditulis dengan Rust dengan antarmuka pengguna terminal (TUI).
  it: Un patcher e editor di binari scritto in Rust con interfaccia utente a terminale (TUI).
  ja: Rust で書かれた、ターミナルユーザーインターフェース (TUI) 付きのバイナリパッチャー兼エディター。
  ko: 터미널 사용자 인터페이스(TUI)를 갖춘 Rust로 작성된 바이너리 패처와 편집기.
  pl: Program do łatania i edytor plików binarnych napisany w Rust z terminalowym interfejsem użytkownika (TUI).
  pt: Um patcher e editor de binários escrito em Rust com interface de usuário de terminal (TUI).
  ro: Un patcher și editor de binare scris în Rust cu interfață de utilizator în terminal (TUI).
  ru: Патчер и редактор двоичных файлов, написанный на Rust с терминальным пользовательским интерфейсом (TUI).
  th: ตัวแก้ไขและเครื่องมือปรับแพตชไบนารีเขียนด้วย Rust พร้อมส่วนติดต่อผู้ใช้แบบเทอร์มินัล (TUI)
  tr: Terminal kullanıcı arayüzüne (TUI) sahip, Rust ile yazılmış ikili dosya yamayıcı ve düzenleyici.
  uk: Патчер і редактор бінарних файлів, написаний на Rust з термінальним користувацьким інтерфейсом (TUI).
  vi: Trình vá và chỉnh sửa tệp nhị phân viết bằng Rust với giao diện người dùng trên terminal (TUI).
x:
  source: https://github.com/Etto48/HexPatch
  eget: Etto48/HexPatch
  pacman: hexpatch
  yay: hexpatch-git
  cargo: hex-patch
rule:
  /eget:
    cmd: x eget Etto48/HexPatch
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install hex-patch
    reference: https://github.com/Etto48/HexPatch?tab=readme-ov-file#using-cargo
    dsnap: hex-patch
  netbsd/pkgin:
    cmd: pkgin install hexpatch
    reference: https://github.com/Etto48/HexPatch?tab=readme-ov-file#netbsd
  arch/pacman:
    cmd: pacman -S hexpatch
    reference: https://github.com/Etto48/HexPatch?tab=readme-ov-file#arch-linux
  arch/yay:
    cmd: yay -S hexpatch-git
    reference: https://aur.archlinux.org/packages/hexpatch-git
binlist:
- hexpatch

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 安装 30 MB
            en: 30 MB install
        download:
          estimate: 30 MB
          desc:
            cn: 约 30 MB 下载 (linux/arm64)
            en: ~30 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
