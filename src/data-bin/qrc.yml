lang: 'Go'
homepage: 'https://github.com/fumiyas/qrc'
license: 'MIT'
desc:
  cn: 文本终端的二维码生成器，支持 ANSI 彩色、Unicode 与 Sixel
  en: 'QR code generator for text terminals (ANSI color, Unicode, Sixel)'
x:
  source: https://github.com/fumiyas/qrc
  eget: https://github.com/fumiyas/qrc
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/fumiyas/qrc
  /eget:
    cmd: x eget fumiyas/qrc
    reference: https://github.com/fumiyas/qrc
binlist:
  - 'qrc'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 91 KB
          rating: 1
          desc:
            cn: 约 91 KB（估算）
            en: ~91 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
