lang: 'Go'
homepage: 'https://github.com/fumiyas/qrc'
license: 'MIT'
desc:
  cn: 文本终端的二维码生成器，支持 ANSI 彩色、Unicode 与 Sixel
  en: 'QR code generator for text terminals (ANSI color, Unicode, Sixel)'
x:
  source: https://github.com/fumiyas/qrc
  eget: https://github.com/fumiyas/qrc
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/fumiyas/qrc
  /eget:
    cmd: x eget fumiyas/qrc
    reference: https://github.com/fumiyas/qrc
binlist:
  - 'qrc'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
