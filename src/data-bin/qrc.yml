lang: 'Go'
homepage: 'https://github.com/fumiyas/qrc'
license: 'MIT'
desc:
  cn: 文本终端的二维码生成器，支持 ANSI 彩色、Unicode 与 Sixel
  en: 'QR code generator for text terminals (ANSI color, Unicode, Sixel)'
x:
  source: https://github.com/fumiyas/qrc
  eget: https://github.com/fumiyas/qrc
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/fumiyas/qrc
  /eget:
    cmd: x eget fumiyas/qrc
    reference: https://github.com/fumiyas/qrc
binlist:
- 'qrc'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 853 KB
          rating: 1
          desc:
            cn: 安装 853 KB
            en: 853 KB install
        download:
          estimate: 853 KB
          desc:
            cn: 约 853 KB 下载 (linux/x64)
            en: ~853 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
