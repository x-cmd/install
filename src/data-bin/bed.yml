lang: Go
homepage: https://github.com/itchyny/bed
license: MIT
desc:
  cn: 用 Go 编写的二进制编辑器
  en: Binary editor written in Go
x:
  pkg:
    exist: true
  source: https://github.com/itchyny/bed
  eget: https://github.com/itchyny/bed
rule:
  /x:
    cmd: x pkg use bed
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget itchyny/bed
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install itchyny/tap/bed
    reference: https://github.com/itchyny/bed?tab=readme-ov-file#homebrew
  /go:
    cmd: go install github.com/itchyny/bed/cmd/bed@latest
    reference: https://github.com/itchyny/bed?tab=readme-ov-file#build-from-source
    dsnap: github.com/itchyny/bed/cmd/bed@latest
  arch/yay:
    cmd: yay -S bed-bin
    reference: https://aur.archlinux.org/packages/bed-bin
binlist:
- bed

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
