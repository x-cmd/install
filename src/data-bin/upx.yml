lang: C++
homepage: https://github.com/upx/upx
desc:
  cn: UPX 是一款免费、安全、便携、可扩展、高性能的可执行文件打包工具，适用于多种可执行文件格式。
  en: UPX is a free, secure, portable, extendable, high-performance executable packer for several executable formats.
x:
  pkg:
    exist: true
  source: https://github.com/upx/upx
  eget: https://github.com/upx/upx
  dnf: upx
  pacman: upx
  apk: upx
rule:
  /x:
    cmd: x pkg use upx
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget upx/upx
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use upx
    reference: https://github.com/jimmidyson/asdf-upx
  alpine/apk:
    cmd: sudo apk add upx
    reference: https://command-not-found.com/zstd
    dsnap: upx
  arch/pacman:
    cmd: sudo pacman -S upx
    reference: https://command-not-found.com/zstd
  arch/yay:
    cmd: yay -S upx-git
    reference: https://aur.archlinux.org/packages/upx-git
  fedora/dnf:
    cmd: sudo dnf install upx
    reference: https://command-not-found.com/zstd
    dsnap: upx
binlist:
- upx
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.5 MB
          rating: 1
          desc:
            cn: 约 5.5 MB（估算）
            en: ~5.5 MB estimated
        download:
          estimate: 648 KB
          desc:
            cn: 约 648 KB 下载 (linux/x64)
            en: ~648 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
