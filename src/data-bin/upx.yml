lang: C++
homepage: https://github.com/upx/upx
desc:
  cn: UPX 是一款免费、安全、便携、可扩展、高性能的可执行文件打包工具，适用于多种可执行文件格式。
  en: UPX is a free, secure, portable, extendable, high-performance executable packer for several executable formats.
x:
  pkg:
    exist: true
  source: https://github.com/upx/upx
  eget: https://github.com/upx/upx
rule:
  /x:
    cmd: x pkg use upx
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget upx/upx
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use upx
    reference: https://github.com/jimmidyson/asdf-upx
  alpine/apk:
    cmd: sudo apk add upx
    reference: https://command-not-found.com/zstd
    dsnap: upx
  arch/pacman:
    cmd: sudo pacman -S upx
    reference: https://command-not-found.com/zstd
  arch/yay:
    cmd: yay -S upx-git
    reference: https://aur.archlinux.org/packages/upx-git
  fedora/dnf:
    cmd: sudo dnf install upx
    reference: https://command-not-found.com/zstd
    dsnap: upx
binlist:
- upx
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
