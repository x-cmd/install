homepage: https://github.com/bytecodealliance/wasmtime
license: Apache-2.0
desc:
  cn: 一个快速、安全的 WebAssembly 运行时
  en: A fast and secure runtime for WebAssembly
lang: Rust
x:
  pkg:
    exist: true
  source: https://github.com/bytecodealliance/wasmtime
  eget: https://github.com/bytecodealliance/wasmtime
  brew: wasmtime
rule:
  /x:
    cmd: x pkg use wasmtime
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget bytecodealliance/wasmtime
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use wasmtime
    reference: https://github.com/tachyonicbytes/asdf-wasmtime
  /curl:
    cmd: curl https://wasmtime.dev/install.sh -sSf | bash
    reference: https://wasmer.io/
  darwin/brew:
    cmd: brew install wasmtime
    reference: https://formulae.brew.sh/formula/wasmtime#default
  arch/yay:
    cmd: yay -S wasmtime-git
    reference: https://aur.archlinux.org/packages/wasmtime-git
binlist:
- wasmtime

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 36 MB
          rating: 2
          desc:
            cn: 约 36 MB（估算）
            en: ~36 MB estimated
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
