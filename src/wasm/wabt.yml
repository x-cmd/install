lang: C++
homepage: https://github.com/WebAssembly/wabt
license: Apache-2.0
desc:
  cn: WABT（我们发音为“wabbit”）是一套用于 WebAssembly 的工具
  en: WABT (we pronounce it "wabbit") is a suite of tools for WebAssembly
x:
  pkg:
    exist: true
  source: https://github.com/WebAssembly/wabt
  eget: https://github.com/WebAssembly/wabt
rule:
  /eget:
    cmd: x eget WebAssembly/wabt
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use wabt
    reference: https://x-cmd.com/install/
  darwin/wabt:
    cmd: brew install wabt
    reference: https://formulae.brew.sh/formula/wabt#default
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/wabt
    reference: https://scoop.sh/#/apps?q=wabt
  /nix-shell:
    cmd: nix-shell -p wabt
    reference: https://search.nixos.org/packages?channel=unstable&show=wabt&from=0&size=50&sort=relevance&type=packages&query=wabt
  /nix-env:
    cmd: nix-env -iA nixos.wabt
    reference: https://search.nixos.org/packages?channel=unstable&show=wabt&from=0&size=50&sort=relevance&type=packages&query=wabt
  debian/apt:
    cmd: sudo apt-get install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-apt-get
    dsnap: wabt
  ubuntu/apt:
    cmd: sudo apt-get install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-apt-get
    dsnap: wabt
  kali/apt:
    cmd: sudo apt-get install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-apt-get
    dsnap: wabt
  raspbian/apt:
    cmd: sudo apt-get install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-apt-get
  /aptitude:
    cmd: sudo aptitude -y install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-aptitude
  arch/yay:
    cmd: yay -S wabt-git
    reference: https://aur.archlinux.org/packages/wabt-git
binlist:
- wabt

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
