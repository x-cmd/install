lang: C++
homepage: https://github.com/WebAssembly/wabt
license: Apache-2.0
desc:
  cn: WABT（我们发音为“wabbit”）是一套用于 WebAssembly 的工具
  en: WABT (we pronounce it "wabbit") is a suite of tools for WebAssembly
  cs: WABT (vyslovujeme to „wabbit“) je sada nástrojů pro WebAssembly
  de: WABT (wir sprechen es „wabbit“ aus) ist eine Sammlung von Werkzeugen für WebAssembly
  es: WABT (lo pronunciamos «wabbit») es un conjunto de herramientas para WebAssembly
  fr: WABT (nous le prononçons « wabbit ») est une suite d'outils pour WebAssembly
  id: WABT (kami ucapkannya "wabbit") adalah rangkaian alat untuk WebAssembly
  it: WABT (lo pronunciamo "wabbit") è una suite di strumenti per WebAssembly
  ja: WABT（読み方は「wabbit」）は WebAssembly のためのツール群です
  ko: WABT(우리는 "wabbit"로 발음합니다)는 WebAssembly용 도구 모음입니다
  pl: WABT (czytamy to „wabbit”) to zestaw narzędzi dla WebAssembly
  pt: WABT (pronunciamos "wabbit") é um conjunto de ferramentas para WebAssembly
  ro: WABT (îl pronunțăm „wabbit”) este o suită de unelte pentru WebAssembly
  ru: WABT (мы произносим это как «wabbit») — это набор инструментов для WebAssembly
  th: WABT (เราออกเสียงว่า "wabbit") คือชุดเครื่องมือสำหรับ WebAssembly
  tr: WABT (bunu "wabbit" olarak okuyoruz) WebAssembly için bir araç paketidir
  uk: WABT (ми читаємо це як «wabbit») — це набір інструментів для WebAssembly
  vi: WABT (chúng tôi đọc là "wabbit") là một bộ công cụ cho WebAssembly
x:
  source: https://github.com/WebAssembly/wabt
  eget: WebAssembly/wabt
  apt: wabt
  brew: wabt
  apt-get: wabt
  scoop: extras/wabt
  yay: wabt-git
rule:
  /eget:
    cmd: x eget WebAssembly/wabt
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use wabt
    reference: https://x-cmd.com/install/
  darwin/wabt:
    cmd: brew install wabt
    reference: https://formulae.brew.sh/formula/wabt#default
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install extras/wabt
    reference: https://scoop.sh/#/apps?q=wabt
  /nix-shell:
    cmd: nix-shell -p wabt
    reference: https://search.nixos.org/packages?channel=unstable&show=wabt&from=0&size=50&sort=relevance&type=packages&query=wabt
  /nix-env:
    cmd: nix-env -iA nixos.wabt
    reference: https://search.nixos.org/packages?channel=unstable&show=wabt&from=0&size=50&sort=relevance&type=packages&query=wabt
  debian/apt:
    cmd: sudo apt-get install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-apt-get
    dsnap: wabt
  ubuntu/apt:
    cmd: sudo apt-get install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-apt-get
    dsnap: wabt
  kali/apt:
    cmd: sudo apt-get install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-apt-get
    dsnap: wabt
  raspbian/apt:
    cmd: sudo apt-get install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-apt-get
  /aptitude:
    cmd: sudo aptitude -y install wabt
    reference: https://installati.one/install-wabt-ubuntu-22-04/#install-wabt-using-aptitude
  arch/yay:
    cmd: yay -S wabt-git
    reference: https://aur.archlinux.org/packages/wabt-git
binlist:
- wabt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
