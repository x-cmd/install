lang: C++
homepage: https://github.com/WasmEdge/WasmEdge
license: Apache-2.0
desc:
  cn: WasmEdge 是一个轻量级、高性能和可扩展的 WebAssembly 运行时，适用于云原生、边缘和去中心化应用程序
  en: WasmEdge is a lightweight, high-performance, and extensible WebAssembly runtime for cloud-native, edge, and decentralized applications
  cs: WasmEdge je lehký, vysoce výkonný a rozšiřitelný runtime WebAssembly pro cloud-native, edge a decentralizované aplikace
  de: WasmEdge ist eine schlanke, hochleistungsfähige und erweiterbare WebAssembly-Laufzeit für Cloud-Native-, Edge- und dezentrale Anwendungen
  es: WasmEdge es un runtime de WebAssembly ligero, de alto rendimiento y extensible para aplicaciones nativas de la nube, perimetrales y descentralizadas
  fr: WasmEdge est un runtime WebAssembly léger, haute performance et extensible pour les applications cloud-native, edge et décentralisées
  id: WasmEdge adalah runtime WebAssembly yang ringan, berkinerja tinggi, dan dapat diperluas untuk aplikasi cloud-native, edge, dan terdesentralisasi
  it: WasmEdge è un runtime WebAssembly leggero, ad alte prestazioni ed estensibile per applicazioni cloud-native, edge e decentralizzate
  ja: WasmEdge は、クラウドネイティブ、エッジ、分散型アプリケーション向けの軽量で高性能かつ拡張可能な WebAssembly ランタイムです
  ko: WasmEdge는 클라우드 네이티브, 엣지 및 분산형 애플리케이션을 위한 가볍고 고성능이며 확장 가능한 WebAssembly 런타임입니다
  pl: WasmEdge to lekka, wysoce wydajna i rozszerzalna środowisko uruchomieniowe WebAssembly dla aplikacji chmurowych, brzegowych i zdecentralizowanych
  pt: WasmEdge é um runtime WebAssembly leve, de alto desempenho e extensível para aplicativos nativos de nuvem, de borda e descentralizados
  ro: WasmEdge este un runtime WebAssembly ușor, de înaltă performanță și extensibil pentru aplicații cloud-native, edge și descentralizate
  ru: WasmEdge — это лёгкий, высокопроизводительный и расширяемый рантайм WebAssembly для облачных, периферийных и децентрализованных приложений
  th: WasmEdge เป็นรันไทม์ WebAssembly ที่มีน้ำหนักเบา ประสิทธิภาพสูง และขยายได้ สำหรับแอปแบบ cloud-native, edge และ decentralized
  tr: WasmEdge, bulut tabanlı, uç ve merkezi olmayan uygulamalar için hafif, yüksek performanslı ve genişletilebilir bir WebAssembly çalışma zamanıdır
  uk: WasmEdge — це легкий, високопродуктивний і розширюваний рантайм WebAssembly для хмарних, периферійних і децентралізованих застосунків
  vi: WasmEdge là runtime WebAssembly nhẹ, hiệu năng cao và có thể mở rộng cho các ứng dụng cloud-native, edge và phi tập trung
x:
  source: https://github.com/WasmEdge/WasmEdge
  eget: WasmEdge/WasmEdge
  dnf: wasmedge
  winget: wasmedge
  yay: wasmedge
rule:
  /eget:
    cmd: x eget WasmEdge/WasmEdge
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use wasmedge
    reference: https://x-cmd.com/install/
  linux/curl:
    cmd: curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash
    reference: https://wasmedge.org/docs/start/install#generic-linux-and-macos
  darwin/curl:
    cmd: curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash
    reference: https://wasmedge.org/docs/start/install#generic-linux-and-macos
  (win|wsl2)/winget:
    cmd: x winget install wasmedge
    reference: https://wasmedge.org/docs/start/install#windows
  fedora/dnf:
    cmd: sudo dnf install wasmedge
    reference: https://wasmedge.org/docs/start/install#fedora-and-red-hat-linux
  arch/yay:
    cmd: yay -S wasmedge
    reference: https://aur.archlinux.org/packages/wasmedge
binlist:
- wasmedge

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 101 MB
          rating: 3
          desc:
            cn: 安装 101 MB
            en: 101 MB install
        download:
          estimate: 101 MB
          desc:
            cn: 约 101 MB 下载 (linux/x64)
            en: ~101 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
