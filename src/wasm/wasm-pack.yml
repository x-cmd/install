lang: Rust
homepage: https://github.com/rustwasm/wasm-pack
license: Apache-2.0
desc:
  en: wasm-pack is a tool for building and using Rust-generated WebAssembly that can be easily integrated with JavaScript.
  cn: wasm-pack 是一个用于构建和使用由 Rust 生成的 WebAssembly 的工具，可以轻松地与 JavaScript 集成。
x:
  source: https://github.com/rustwasm/wasm-pack
  brew: wasm-pack
  yay: wasm-pack-bin
  npm: wasm-pack
  cargo: wasm-pack
  curl: curl
rule:
  /curl:
    cmd: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    reference: https://rustwasm.github.io/wasm-pack/installer/
  darwin/brew:
    cmd: brew install wasm-pack
    reference: https://formulae.brew.sh/formula/wasm-pack#default
  /npm:
    cmd: npm install -g wasm-pack
    reference: https://rustwasm.github.io/wasm-pack/installer/
  /cargo:
    cmd: cargo install wasm-pack
    reference: https://rustwasm.github.io/wasm-pack/installer/
    dsnap: wasm-pack
  /yarn:
    cmd: yarn global add wasm-pack
    reference: https://rustwasm.github.io/wasm-pack/installer/
  arch/yay:
    cmd: yay -S wasm-pack-bin
    reference: https://aur.archlinux.org/packages/wasm-pack-bin
binlist:
- wasm-pack

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 257 KB
          rating: 1
          desc:
            cn: 约 257 KB（估算）
            en: ~257 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
