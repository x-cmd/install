lang: Rust
homepage: https://github.com/bytecodealliance/jco
license: Apache-2.0
desc:
  cn: 用于使用 WebAssembly 组件的 JavaScript 工具
  en: JavaScript tooling for working with WebAssembly Components
x:
  pkg:
    exist: true
  source: https://github.com/bytecodealliance/jco
  eget: https://github.com/bytecodealliance/jco
rule:
  /eget:
    cmd: x eget bytecodealliance/jco
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use jco
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install @bytecodealliance/jco
    reference: https://github.com/bytecodealliance/jco?tab=readme-ov-file#installation
    dsnap: '@bytecodealliance/jco'
binlist:
- jco

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
