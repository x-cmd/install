lang: Rust
homepage: https://github.com/bytecodealliance/jco
license: Apache-2.0
desc:
  cn: 用于使用 WebAssembly 组件的 JavaScript 工具
  en: JavaScript tooling for working with WebAssembly Components
x:
  source: https://github.com/bytecodealliance/jco
  eget: bytecodealliance/jco
  npm: "@bytecodealliance/jco"
rule:
  /eget:
    cmd: x eget bytecodealliance/jco
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use jco
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install @bytecodealliance/jco
    reference: https://github.com/bytecodealliance/jco?tab=readme-ov-file#installation
    dsnap: '@bytecodealliance/jco'
binlist:
- jco

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 193 KB
          rating: 1
          desc:
            cn: 约 193 KB（估算）
            en: ~193 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
