homepage: https://github.com/wasmerio/wasmer
license: MIT
desc:
  cn: Wasmer 是一个快速和安全的 WebAssembly 运行时
  en: Wasmer is a blazing fast and secure WebAssembly runtime
  cs: Wasmer je mimořádně rychlý a bezpečný runtime WebAssembly
  de: Wasmer ist eine blitzschnelle und sichere WebAssembly-Laufzeit
  es: Wasmer es un runtime de WebAssembly extremadamente rápido y seguro
  fr: Wasmer est un runtime WebAssembly extrêmement rapide et sécurisé
  id: Wasmer adalah runtime WebAssembly yang sangat cepat dan aman
  it: Wasmer è un runtime WebAssembly velocissimo e sicuro
  ja: Wasmer は超高速で安全な WebAssembly ランタイムです
  ko: Wasmer는 매우 빠르고 안전한 WebAssembly 런타임입니다
  pl: Wasmer to bardzo szybkie i bezpieczne środowisko uruchomieniowe WebAssembly
  pt: Wasmer é um runtime WebAssembly extremamente rápido e seguro
  ro: Wasmer este un runtime WebAssembly extrem de rapid și sigur
  ru: Wasmer — это сверхбыстрый и безопасный рантайм WebAssembly
  th: Wasmer เป็นรันไทม์ WebAssembly ที่เร็วมากและปลอดภัย
  tr: Wasmer, çok hızlı ve güvenli bir WebAssembly çalışma zamanıdır
  uk: Wasmer — це надзвичайно швидкий і безпечний рантайм WebAssembly
  vi: Wasmer là runtime WebAssembly cực nhanh và an toàn
lang: Rust
x:
  source: https://github.com/wasmerio/wasmer
  eget: wasmerio/wasmer
  brew: wasmer
  scoop: wasmer
  choco: wasmer
  yay: wasmer-git
  cargo: wasmer-cli
  asdf: wasmer
rule:
  /eget:
    cmd: x eget wasmerio/wasmer
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use wasmer
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use wasmer
    reference: https://github.com/tachyonicbytes/asdf-wasmer
  /curl:
    cmd: curl https://get.wasmer.io -sSfL | sh
    reference: https://wasmer.io/
  (win|wsl2)/scoop:
    cmd: x scoop install wasmer
    reference: https://github.com/wasmerio/wasmer-install?tab=readme-ov-file#install-via-package-manager
  (win|wsl2)/choco:
    cmd: x choco install wasmer
    reference: https://github.com/wasmerio/wasmer-install?tab=readme-ov-file#install-via-package-manager
  /cargo:
    cmd: cargo install wasmer-cli --features singlepass,cranelift
    reference: https://github.com/wasmerio/wasmer-install?tab=readme-ov-file#install-via-package-manager
    dsnap: wasmer-cli
  darwin/brew:
    cmd: brew install wasmer
    reference: https://formulae.brew.sh/formula/wasmer#default
  arch/yay:
    cmd: yay -S wasmer-git
    reference: https://aur.archlinux.org/packages/wasmer-git
binlist:
- wasmer

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 292 MB
          rating: 4
          desc:
            cn: 安装 292 MB
            en: 292 MB install
        download:
          estimate: 292 MB
          desc:
            cn: 约 292 MB 下载 (linux/x64)
            en: ~292 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
