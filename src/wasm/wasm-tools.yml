lang: Rust
homepage: https://github.com/bytecodealliance/wasm-tools
license: Apache-2.0
desc:
  cn: 用于 WebAssembly 模块低级操作的 CLI 和 Rust 库
  en: CLI and Rust libraries for low-level manipulation of WebAssembly modules
x:
  pkg:
    exist: true
  source: https://github.com/bytecodealliance/wasm-tools
  eget: https://github.com/bytecodealliance/wasm-tools
rule:
  /x:
    cmd: x pkg use wasm-tools
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget bytecodealliance/wasm-tools
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install wasm-tools
    reference: https://github.com/bytecodealliance/wasm-tools?tab=readme-ov-file#installation
    dsnap: wasm-tools
  arch/yay:
    cmd: yay -S wasm-tools-git
    reference: https://aur.archlinux.org/packages/wasm-tools-git
binlist:
- wasm-tools

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.0 MB
          rating: 1
          desc:
            cn: 约 9.0 MB（估算）
            en: ~9.0 MB estimated
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
