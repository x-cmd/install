lang: Rust
homepage: https://github.com/bytecodealliance/wasm-tools
license: Apache-2.0
desc:
  cn: 用于 WebAssembly 模块低级操作的 CLI 和 Rust 库
  en: CLI and Rust libraries for low-level manipulation of WebAssembly modules
  cs: CLI a knihovny Rust pro nízkoúrovňovou manipulaci s moduly WebAssembly
  de: CLI und Rust-Bibliotheken für die Low-Level-Manipulation von WebAssembly-Modulen
  es: CLI y bibliotecas de Rust para la manipulación de bajo nivel de módulos WebAssembly
  fr: CLI et bibliothèques Rust pour la manipulation de bas niveau des modules WebAssembly
  id: CLI dan pustaka Rust untuk manipulasi tingkat rendah pada modul WebAssembly
  it: CLI e librerie Rust per la manipolazione a basso livello dei moduli WebAssembly
  ja: WebAssembly モジュールの低レベル操作のための CLI と Rust ライブラリ
  ko: WebAssembly 모듈의 저수준 조작을 위한 CLI 및 Rust 라이브러리
  pl: CLI i biblioteki Rust do niskopoziomowej manipulacji modułami WebAssembly
  pt: CLI e bibliotecas Rust para manipulação de baixo nível de módulos WebAssembly
  ro: CLI și biblioteci Rust pentru manipularea la nivel scăzut a modulelor WebAssembly
  ru: CLI и библиотеки Rust для низкоуровневой работы с модулями WebAssembly
  th: CLI และไลบรารี Rust สำหรับการจัดการโมดูล WebAssembly ระดับต่ำ
  tr: WebAssembly modüllerinin düşük seviyede manipülasyonu için CLI ve Rust kütüphaneleri
  uk: CLI та бібліотеки Rust для низькорівневої роботи з модулями WebAssembly
  vi: CLI và thư viện Rust để thao tác mức thấp với các module WebAssembly
x:
  source: https://github.com/bytecodealliance/wasm-tools
  eget: bytecodealliance/wasm-tools
  yay: wasm-tools-git
  cargo: wasm-tools
rule:
  /x:
    cmd: x pkg use wasm-tools
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget bytecodealliance/wasm-tools
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install wasm-tools
    reference: https://github.com/bytecodealliance/wasm-tools?tab=readme-ov-file#installation
    dsnap: wasm-tools
  arch/yay:
    cmd: yay -S wasm-tools-git
    reference: https://aur.archlinux.org/packages/wasm-tools-git
binlist:
- wasm-tools

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.0 MB
          rating: 1
          desc:
            cn: 约 9.0 MB（估算）
            en: ~9.0 MB estimated
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/x64)
            en: ~6 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
