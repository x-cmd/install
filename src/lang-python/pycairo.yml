lang: Python
homepage: https://github.com/pygobject/pycairo
desc:
  cn: Pycairo 是一个为 cairo 图形库提供绑定的 Python 模块
  en: Pycairo is a Python module providing bindings for the cairo graphics library
x:
  source: https://github.com/pygobject/pycairo
  apt: libcairo2-dev
  dnf: cairo-devel
  pacman: cairo
rule:
  /pip3:
    cmd: pip3 install pycairo
    reference: https://pycairo.readthedocs.io/en/latest/getting_started.html
  debian/apt:
    cmd: sudo apt install libcairo2-dev pkg-config python3-dev
    reference: https://pycairo.readthedocs.io/en/latest/getting_started.html
  ubuntu/apt:
    cmd: sudo apt install libcairo2-dev pkg-config python3-dev
    reference: https://pycairo.readthedocs.io/en/latest/getting_started.html
  fedora/dnf:
    cmd: sudo dnf install cairo-devel pkg-config python3-devel
    reference: https://pycairo.readthedocs.io/en/latest/getting_started.html
  arch/pacman:
    cmd: sudo pacman -S cairo pkgconf
    reference: https://pycairo.readthedocs.io/en/latest/getting_started.html
  opensue/zypper:
    cmd: sudo zypper install cairo-devel pkg-config python3-devel
    reference: https://pycairo.readthedocs.io/en/latest/getting_started.html
binlist:
- pycairo
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 704 KB
          rating: 1
          desc:
            cn: 约 704 KB（估算）
            en: ~704 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
