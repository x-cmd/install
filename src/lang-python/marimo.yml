lang: Python
homepage: https://github.com/marimo-team/marimo
license: Apache-2.0
desc:
  cn: Marimo 是一款响应式 Python 笔记本：运行单元格可与 UI 元素交互，marimo 会自动更新依赖于它的单元格（或将其标记为过时单元格），从而保持代码和输出的一致性。marimo 笔记本以纯 Python 格式存储，可作为脚本执行，也可作为应用程序部署。
  en: 'marimo is a reactive Python notebook: run a cell or interact with a UI element, and marimo automatically runs dependent cells (or marks them as stale), keeping code and outputs consistent'
x:
  pkg:
    exist: true
  source: https://github.com/marimo-team/marimo
rule:
  /x:
    cmd: x pkg use marimo
    reference: https://x-cmd.com/install/
  /pip:
    cmd: 'pip install marimo && \

      marimo tutorial intro

      '
    reference: https://github.com/marimo-team/marimo/blob/main/README.md#quickstart
    dsnap: marimo
  /conda:
    cmd: 'conda install -c conda-forge marimo && \

      marimo tutorial intro

      '
    reference: https://github.com/marimo-team/marimo/blob/main/README.md#quickstart
  arch/yay:
    cmd: yay -S marimo
    reference: https://aur.archlinux.org/packages/marimo
binlist:
- marimo

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
