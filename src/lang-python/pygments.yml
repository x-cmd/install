lang: Python
homepage: https://github.com/pygments/pygments
license: BSD-2-Clause
desc:
  cn: Pygments 是用 Python 编写的通用语法高亮工具
  en: Pygments is a generic syntax highlighter written in Python
x:
  pkg:
    exist: true
  source: https://github.com/pygments/pygments
rule:
  /x:
    cmd: x pkg use pygments
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install Pygments
    reference: https://github.com/pygments/pygments?tab=readme-ov-file#installing
    dsnap: Pygments
binlist:
- pygments

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 325 KB
          rating: 1
          desc:
            cn: 约 325 KB（估算）
            en: ~325 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
