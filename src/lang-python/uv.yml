lang: Rust
desc:
  cn: 一个用 Rust 开发的极其快速的 Python 包和项目管理器
  en: An extremely fast Python package and project manager, written in Rust.
  cs: Extrémně rychlý správce Python balíčků a projektů, napsaný v Rustu.
  de: Ein äußerst schneller Python-Paket- und Projektmanager, geschrieben in Rust.
  es: Un gestor de paquetes y proyectos de Python extremadamente rápido, escrito en Rust.
  fr: Un gestionnaire de paquets et de projets Python extrêmement rapide, écrit en Rust.
  id: Manajer paket dan proyek Python yang sangat cepat, ditulis dalam Rust.
  it: Un gestore di pacchetti e progetti Python estremamente veloce, scritto in Rust.
  ja: Rust で書かれた极其高速な Python パッケージ兼プロジェクトマネージャー。
  ko: Rust로 작성된 매우 빠른 Python 패키지 및 프로젝트 관리자.
  pl: Wyjątkowo szybki menedżer pakietów i projektów Pythona, napisany w Rust.
  pt: Um gerenciador de pacotes e projetos Python extremamente rápido, escrito em Rust.
  ro: Un manager de pachete și proiecte Python extrem de rapid, scris în Rust.
  ru: Чрезвычайно быстрый менеджер пакетов и проектов Python, написанный на Rust.
  th: ตัวจัดการแพ็กเกจและโปรเจกต์ Python ที่รวดเร็วมาก เขียนด้วย Rust
  tr: Rust ile yazılmış son derece hızlı bir Python paket ve proje yöneticisi.
  uk: Надзвичайно швидкий менеджер пакетів і проєктів Python, написаний на Rust.
  vi: Trình quản lý gói và dự án Python cực kỳ nhanh, viết bằng Rust.
homepage: https://github.com/astral-sh/uv
license: Apache-2.0
x:
  source: https://github.com/astral-sh/uv
  brew: uv
  pip: uv
  cargo: uv
rule:
  /x:
    cmd: x pkg use uv
    reference: https://x-cmd.com/install/
  (linux|darwin)/curl:
    cmd: curl -LsSf https://astral.sh/uv/install.sh | sh
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
  win/:
    cmd: powershell -c "irm https://astral.sh/uv/install.ps1 | iex"
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
  /pipx:
    cmd: pipx install uv
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
  /pip:
    cmd: pip install uv
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
    dsnap: uv
  /cargo:
    cmd: cargo install uv
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
    dsnap: uv
  /brew:
    cmd: brew install uv
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
binlist:
- uv

# already profiled
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 47 MB
          rating: 2
          desc:
            cn: 安装 47 MB
            en: 47 MB install
        download:
          estimate: 18 MB
          desc:
            cn: 约 18 MB 下载 (linux/x64)
            en: ~18 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 14 MB
        desc:
          cn: 14 MB
          en: 14 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
