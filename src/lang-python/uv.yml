lang: Rust
desc:
  cn: 一个用 Rust 开发的极其快速的 Python 包和项目管理器
  en: An extremely fast Python package and project manager, written in Rust.
homepage: https://github.com/astral-sh/uv
license: Apache-2.0
x:
  pkg:
    exist: true
  source: https://github.com/astral-sh/uv
rule:
  /x:
    cmd: x pkg use uv
    reference: https://x-cmd.com/install/
  (linux|darwin)/curl:
    cmd: curl -LsSf https://astral.sh/uv/install.sh | sh
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
  win/:
    cmd: powershell -c "irm https://astral.sh/uv/install.ps1 | iex"
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
  /pipx:
    cmd: pipx install uv
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
  /pip:
    cmd: pip install uv
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
    dsnap: uv
  /cargo:
    cmd: cargo install uv
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
    dsnap: uv
  /brew:
    cmd: brew install uv
    reference: https://docs.astral.sh/uv/getting-started/installation/#installing-uv
binlist:
- uv

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 19 MB
          rating: 2
          desc:
            cn: 约 19 MB（估算）
            en: ~19 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
