lang: Python
homepage: https://github.com/PyCQA/isort
license: MIT
desc:
  cn: 用于对导入进行排序的 Python 实用程序/库
  en: isort is a Python utility / library to sort imports alphabetically, and automatically separated into sections and by type
x:
  pkg:
    exist: true
  source: https://github.com/PyCQA/isort
rule:
  /x:
    cmd: x pkg use isort
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip3 install isort
    reference: https://pycqa.github.io/isort/docs/quick_start/1.-install.html
    dsnap: isort
  /poetry:
    cmd: poetry add isort
    reference: https://pycqa.github.io/isort/docs/quick_start/1.-install.html
  /pipenv:
    cmd: pipenv install isort
    reference: https://pycqa.github.io/isort/docs/quick_start/1.-install.html
  /pipx:
    cmd: pipx install isort
    reference: https://pycqa.github.io/isort/docs/quick_start/1.-install.html
binlist:
- isort

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 447 KB
          rating: 1
          desc:
            cn: 安装 447 KB
            en: 447 KB install
        download:
          estimate: 447 KB
          desc:
            cn: 约 447 KB 下载 (whl)
            en: ~447 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
