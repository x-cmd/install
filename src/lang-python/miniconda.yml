lang: Python
homepage: https://github.com/conda/conda
desc:
  cn: Anaconda Distribution 的精简版本，包含 `conda`、`Python` 以及少量的软件包，适用于数据科学和机器学习领域
  en: A streamlined version of Anaconda Distribution, featuring `conda`, `Python`, and a curated selection of packages, designed specifically for the fields of data science and machine learning.
x:
  pkg:
    exist: true
  source: https://github.com/conda/conda
  eget: https://github.com/conda/conda
rule:
  /eget:
    cmd: x eget conda/conda
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use miniconda
    reference: https://x-cmd.com/install/
  win/curl:
    cmd: 'x pwsh curl https://repo.anaconda.com/miniconda/Miniconda3-latest-Windows-x86_64.exe -o miniconda.exe \

      && x pwsh start /wait "" miniconda.exe /S \

      && x pwsh del miniconda.exe

      '
    reference: https://docs.conda.io/projects/miniconda/en/latest/#quick-command-line-install
  darwin/curl:
    cmd: 'mkdir -p ~/miniconda3 \

      && curl https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh -o ~/miniconda3/miniconda.sh \

      && bash ~/miniconda3/miniconda.sh -b -u -p ~/miniconda3 \

      && rm -rf ~/miniconda3/miniconda.sh

      '
    reference: https://docs.conda.io/projects/miniconda/en/latest/#quick-command-line-install
  linux/wget:
    cmd: 'mkdir -p ~/miniconda3 \

      && wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O ~/miniconda3/miniconda.sh \

      && bash ~/miniconda3/miniconda.sh -b -u -p ~/miniconda3 \

      && rm -rf ~/miniconda3/miniconda.sh

      '
    reference: https://docs.conda.io/projects/miniconda/en/latest/#quick-command-line-install
  darwin/brew:
    cmd: brew install --cask miniconda
    reference: https://formulae.brew.sh/cask/miniconda#default
  arch/yay:
    cmd: yay -S miniconda3
    reference: https://aur.archlinux.org/packages/miniconda3
binlist:
- conda
- python
- python3
- pip
- pip3
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
