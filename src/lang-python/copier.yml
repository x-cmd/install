lang: Python
homepage: https://github.com/copier-org/copier
license: MIT
desc:
  cn: 用于渲染项目模板的库和命令行实用程序
  en: A library and CLI app for rendering project templates
x:
  pkg:
    exist: true
  source: https://github.com/copier-org/copier
rule:
  /x:
    cmd: x pkg use copier
    reference: https://x-cmd.com/install/
  /pipx:
    cmd: pipx install copier
    reference: https://github.com/copier-org/copier?tab=readme-ov-file#installation
  /pip:
    cmd: pip install copier
    reference: https://github.com/copier-org/copier?tab=readme-ov-file#installation
    dsnap: copier
  arch/yay:
    cmd: yay -S python-copier
    reference: https://aur.archlinux.org/packages/python-copier
binlist:
- copier

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
