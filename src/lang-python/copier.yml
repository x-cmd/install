lang: Python
homepage: https://github.com/copier-org/copier
license: MIT
desc:
  cn: 用于渲染项目模板的库和命令行实用程序
  en: A library and CLI app for rendering project templates
  cs: Knihovna a CLI aplikace pro vykreslování šablon projektů
  de: Eine Bibliothek und CLI-App zum Rendern von Projektvorlagen
  es: Una biblioteca y aplicación de CLI para renderizar plantillas de proyecto
  fr: Une bibliothèque et une application CLI pour le rendu de modèles de projet
  id: Pustaka dan aplikasi CLI untuk merender templat proyek
  it: Una libreria e un'app CLI per il rendering dei modelli di progetto
  ja: プロジェクトテンプレートを描画するためのライブラリと CLI アプリ
  ko: 프로젝트 템플릿을 렌더링하기 위한 라이브러리 및 CLI 앱
  pl: Biblioteka i aplikacja CLI do renderowania szablonów projektów
  pt: Uma biblioteca e aplicativo de CLI para renderizar modelos de projeto
  ro: O bibliotecă și o aplicație CLI pentru randarea șabloanelor de proiect
  ru: Библиотека и CLI-приложение для рендеринга шаблонов проектов
  th: ไลบรารีและแอป CLI สำหรับเรนเดอร์เทมเพลตโครงการ
  tr: Proje şablonlarını işlemek için bir kütüphane ve CLI uygulaması
  uk: Бібліотека та CLI-застосунок для рендерингу шаблонів проєктів
  vi: Thư viện và ứng dụng CLI để kết xuất mẫu dự án
x:
  source: https://github.com/copier-org/copier
  yay: python-copier
  pip: copier
rule:
  /x:
    cmd: x pkg use copier
    reference: https://x-cmd.com/install/
  /pipx:
    cmd: pipx install copier
    reference: https://github.com/copier-org/copier?tab=readme-ov-file#installation
  /pip:
    cmd: pip install copier
    reference: https://github.com/copier-org/copier?tab=readme-ov-file#installation
    dsnap: copier
  arch/yay:
    cmd: yay -S python-copier
    reference: https://aur.archlinux.org/packages/python-copier
binlist:
- copier

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 35 KB
          rating: 1
          desc:
            cn: 约 35 KB（估算）
            en: ~35 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
