lang: Python
homepage: https://github.com/copier-org/copier
license: MIT
desc:
  cn: 用于渲染项目模板的库和命令行实用程序
  en: A library and CLI app for rendering project templates
x:
  source: https://github.com/copier-org/copier
  yay: python-copier
  pip: copier
rule:
  /x:
    cmd: x pkg use copier
    reference: https://x-cmd.com/install/
  /pipx:
    cmd: pipx install copier
    reference: https://github.com/copier-org/copier?tab=readme-ov-file#installation
  /pip:
    cmd: pip install copier
    reference: https://github.com/copier-org/copier?tab=readme-ov-file#installation
    dsnap: copier
  arch/yay:
    cmd: yay -S python-copier
    reference: https://aur.archlinux.org/packages/python-copier
binlist:
- copier

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 35 KB
          rating: 1
          desc:
            cn: 约 35 KB（估算）
            en: ~35 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
