lang: Python
homepage: https://github.com/facebookexperimental/edencommon
license: MIT
desc:
  en: Edencommon is a shared library for Meta's source control filesystem tools (EdenFS and Watchman)
  cn: Edencommon 是 Meta 源代码控制系统工具（EdenFS 和 Watchman）的共享库
x:
  source: https://github.com/facebookexperimental/edencommon
  brew: edencommon
  yay: edencommon-git
rule:
  darwin/brew:
    cmd: brew install edencommon
    reference: https://formulae.brew.sh/formula/edencommon#default
  arch/yay:
    cmd: yay -S edencommon-git
    reference: https://aur.archlinux.org/packages/edencommon-git
binlist:
- edencommon

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1.6 MB
          rating: 1
          desc:
            cn: 约 1.6 MB（估算）
            en: ~1.6 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
