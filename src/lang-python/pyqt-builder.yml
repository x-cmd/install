lang: Python
homepage: https://www.riverbankcomputing.com/hg
desc:
  cn: PyQt 构建器是用于 PyQt 和扩展 PyQt 的项目的符合 PEP 517 的构建系统
  en: PyQt-builder is the PEP 517 compliant build system for PyQt and projects that extend PyQt
rule:
  darwin/brew:
    cmd: brew install pyqt-builder
    reference: https://formulae.brew.sh/formula/pyqt-builder#default
binlist:
- pyqt-builder
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
