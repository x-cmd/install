lang: Python
homepage: https://www.riverbankcomputing.com/hg
desc:
  cn: PyQt 构建器是用于 PyQt 和扩展 PyQt 的项目的符合 PEP 517 的构建系统
  en: PyQt-builder is the PEP 517 compliant build system for PyQt and projects that extend PyQt
rule:
  darwin/brew:
    cmd: brew install pyqt-builder
    reference: https://formulae.brew.sh/formula/pyqt-builder#default

x:
  brew: pyqt-builderbinlist:
- pyqt-builder
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
