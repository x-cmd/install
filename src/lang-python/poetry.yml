lang: Python
homepage: https://github.com/python-poetry/poetry
license: MIT
desc:
  cn: python 包和依赖管理工具 (python 3.8+)
  en: python package and dependency management tool (python 3.8+)
  cs: nástroj pro správu balíčků a závislostí Pythonu (python 3.8+)
  de: Python-Paket- und Abhängigkeitsverwaltungstool (Python 3.8+)
  es: herramienta de gestión de paquetes y dependencias de Python (python 3.8+)
  fr: outil de gestion des paquets et des dépendances Python (python 3.8+)
  id: alat manajemen paket dan dependensi Python (python 3.8+)
  it: strumento di gestione dei pacchetti e delle dipendenze Python (python 3.8+)
  ja: Python パッケージと依存関係の管理ツール (python 3.8+)
  ko: Python 패키지 및 의존성 관리 도구 (python 3.8+)
  pl: narzędzie do zarządzania pakietami i zależnościami Pythona (python 3.8+)
  pt: ferramenta de gerenciamento de pacotes e dependências Python (python 3.8+)
  ro: instrument de gestionare a pachetelor și dependențelor Python (python 3.8+)
  ru: инструмент управления пакетами и зависимостями Python (python 3.8+)
  th: เครื่องมือจัดการแพ็กเกจและการพึ่งพาของ Python (python 3.8+)
  tr: Python paket ve bağımlılık yönetim aracı (python 3.8+)
  uk: інструмент керування пакетами та залежностями Python (python 3.8+)
  vi: công cụ quản lý gói và phụ thuộc Python (python 3.8+)
x:
  source: https://github.com/python-poetry/poetry
  eget: python-poetry/poetry
  brew: poetry
  yay: python-poetry-git
  asdf: poetry
rule:
  /eget:
    cmd: x eget python-poetry/poetry
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use poetry
    reference: https://github.com/asdf-community/asdf-poetry
  /pipx:
    cmd: pipx install poetry
    reference: https://python-poetry.org/docs/#installing-with-pipx
  darwin/brew:
    cmd: brew install poetry
    reference: https://formulae.brew.sh/formula/poetry#default
  /curl:
    cmd: curl -sSL https://install.python-poetry.org | python3 -
    reference: https://python-poetry.org/docs/#installing-with-the-official-installer
  win/powershell:
    cmd: x pwsh (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | py -
    reference: https://python-poetry.org/docs/#installing-with-the-official-installer
  arch/yay:
    cmd: yay -S python-poetry-git
    reference: https://aur.archlinux.org/packages/python-poetry-git
binlist:
- poetry

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 287 KB
          rating: 1
          desc:
            cn: 安装 287 KB
            en: 287 KB install
        download:
          estimate: 287 KB
          desc:
            cn: 约 287 KB 下载 (whl)
            en: ~287 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
