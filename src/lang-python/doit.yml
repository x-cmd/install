lang: Python
homepage: https://github.com/doit/doit
desc:
  cn: 任务运行器和构建工具
  en: task management & automation tool
  cs: Nástroj pro správu úkolů a automatizaci
  de: Tool für Aufgabenmanagement und Automatisierung
  es: Herramienta de gestión de tareas y automatización
  fr: Outil de gestion des tâches et d'automatisation
  id: Alat manajemen tugas dan otomatisasi
  it: Strumento di gestione delle attività e di automazione
  ja: タスク管理と自動化のためのツール
  ko: 작업 관리 및 자동화 도구
  pl: Narzędzie do zarządzania zadaniami i automatyzacji
  pt: Ferramenta de gerenciamento de tarefas e automação
  ro: Instrument de gestionare a sarcinilor și automatizare
  ru: Инструмент управления задачами и автоматизации
  th: เครื่องมือจัดการงานและระบบอัตโนมัติ
  tr: Görev yönetimi ve otomasyon aracı
  uk: Інструмент керування завданнями та автоматизації
  vi: Công cụ quản lý tác vụ và tự động hóa
x:
  source: https://github.com/doit/doit
  pip: doit
rule:
  /x:
    cmd: x pkg use doit
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install doit
    reference: https://pydoit.org/install.html
    dsnap: doit
binlist:
- doit
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
