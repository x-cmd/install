lang: Python
homepage: https://github.com/doit/doit
desc:
  cn: 任务运行器和构建工具
  en: task management & automation tool
x:
  pkg:
    exist: true
  source: https://github.com/doit/doit
rule:
  /x:
    cmd: x pkg use doit
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install doit
    reference: https://pydoit.org/install.html
    dsnap: doit
binlist:
- doit
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
