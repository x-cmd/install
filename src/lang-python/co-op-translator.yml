lang: Python
homepage: https://github.com/Azure/co-op-translator
license: MIT
desc:
  cn: Co-op Translator 是一个 Python 包，旨在使用先进的大语言模型 ( LLM ) 技术和 Azure AI 服务自动为您的项目进行多语言翻译。
  en: Co-op Translator is a Python package designed to automate multilingual translations for your projects using advanced Large Language Model (LLM) technology and Azure AI Services.
x:
  source: https://github.com/Azure/co-op-translator
rule:
  /pip:
    cmd: pip install co-op-translator
    reference: https://github.com/Azure/co-op-translator?tab=readme-ov-file#install-via-pip
    dsnap: co-op-translator
  /poetry:
    cmd: poetry add co-op-translator
    reference: https://github.com/Azure/co-op-translator?tab=readme-ov-file#install-via-poetry
binlist:
- co-op-translator

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 52 KB
          rating: 1
          desc:
            cn: 约 52 KB（估算）
            en: ~52 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
