lang: Python
homepage: https://github.com/pypa/virtualenv
license: MIT
desc:
  cn: Viralenv 是创建独立 Python 环境的工具
  en: virtualenv is a tool to create isolated Python environments
x:
  source: https://github.com/pypa/virtualenv
  eget: https://github.com/pypa/virtualenv
rule:
  /eget:
    cmd: x eget pypa/virtualenv
    reference: https://x-cmd.com/mod/eget
  /pipx:
    cmd: pipx install virtualenv
    reference: https://virtualenv.pypa.io/en/latest/installation.html#via-pipx
  /pip:
    cmd: python -m pip install --user virtualenv
    reference: https://virtualenv.pypa.io/en/latest/installation.html#via-pip
    dsnap: virtualenv
  darwin/brew:
    cmd: brew install virtualenv
    reference: https://formulae.brew.sh/formula/virtualenv#default
  debian/apt:
    cmd: sudo apt-get install virtualenv
    reference: https://command-not-found.com/virtualenv
    dsnap: virtualenv
  ubuntu/apt:
    cmd: sudo apt-get install virtualenv
    reference: https://command-not-found.com/virtualenv
    dsnap: virtualenv
  arch/pacman:
    cmd: sudo pacman -S virtualenv
    reference: https://command-not-found.com/virtualenv
  kali/apt:
    cmd: sudo apt-get install virtualenv
    reference: https://command-not-found.com/virtualenv
    dsnap: virtualenv
  centos/yum:
    cmd: sudo yum install virtualenv
    reference: https://command-not-found.com/virtualenv
  fedora/dnf:
    cmd: sudo dnf install virtualenv
    reference: https://command-not-found.com/virtualenv
    dsnap: virtualenv
  raspbian/apt:
    cmd: sudo apt-get install virtualenv
    reference: https://command-not-found.com/virtualenv
binlist:
- virtualenv

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
