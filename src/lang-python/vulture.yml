lang: Python
homepage: https://github.com/jendrikseipp/vulture
license: MIT
desc:
  cn: 查找无效的 Python 代码
  en: Find dead Python code
x:
  source: https://github.com/jendrikseipp/vulture
  pip: vulture
rule:
  /x:
    cmd: x pkg use vulture
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install vulture
    reference: https://github.com/jendrikseipp/vulture?tab=readme-ov-file#installation
    dsnap: vulture
binlist:
- vulture

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 KB
          rating: 1
          desc:
            cn: 约 6 KB（估算）
            en: ~6 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
