lang: Python
homepage: https://github.com/wemake-services/wemake-python-styleguide
license: MIT
desc:
  cn: wemake-python-styleguide 实际上是一个 flake8 插件，其中包含一些其他插件作为依赖项
  en: wemake-python-styleguide is actually a flake8 plugin with some other plugins as dependencies
x:
  pkg:
    exist: true
  source: https://github.com/wemake-services/wemake-python-styleguide
rule:
  /x:
    cmd: x pkg use wemake-python-styleguide
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install wemake-python-styleguide
    reference: https://github.com/wemake-services/wemake-python-styleguide?tab=readme-ov-file#quickstart
    dsnap: wemake-python-styleguide
binlist:
- wemake-python-styleguide

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 65 KB
          rating: 1
          desc:
            cn: 约 65 KB（估算）
            en: ~65 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
