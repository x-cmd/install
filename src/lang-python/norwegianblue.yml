lang: Python
homepage: https://github.com/hugovk/norwegianblue
license: MIT
desc:
  cn: CLI 显示许多产品的生命周期结束日期。如 Python、Ubuntu、Centos。
  en: CLI to show end-of-life dates for a number of products. Such as Python, Ubuntu, Centos.
x:
  pkg:
    exist: true
  source: https://github.com/hugovk/norwegianblue
rule:
  /x:
    cmd: x pkg use norwegianblue
    reference: https://x-cmd.com/install/
  /pip:
    cmd: python3 -m pip install --upgrade norwegianblue
    reference: https://github.com/hugovk/norwegianblue?tab=readme-ov-file#from-pypi
    dsnap: norwegianblue
  /pipx:
    cmd: pipx install norwegianblue
    reference: https://github.com/hugovk/norwegianblue?tab=readme-ov-file#with-pipx
binlist:
- norwegianblue

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
