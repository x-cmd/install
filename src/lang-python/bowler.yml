lang: Python
homepage: https://github.com/facebookincubator/Bowler
license: MIT
desc:
  cn: Bowler 是在语法树级别操纵 python 的重构工具
  en: Bowler is a refactoring tool for manipulating Python at the syntax tree level
x:
  source: https://github.com/facebookincubator/Bowler
  pip: bowler
rule:
  /x:
    cmd: x pkg use bowler
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install bowler
    reference: https://pybowler.io/docs/basics-setup
    dsnap: bowler
binlist:
- bowler

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 KB
          rating: 1
          desc:
            cn: 约 6 KB（估算）
            en: ~6 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
