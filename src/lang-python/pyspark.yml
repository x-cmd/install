lang: Python
homepage: https://github.com/apache/spark
license: Apache-2.0
desc:
  cn: Spark 是一个用于大规模数据处理的统一分析引擎
  en: Spark is a unified analytics engine for large-scale data processing
x:
  source: https://github.com/apache/spark
rule:
  /pip:
    cmd: pip install pyspark
    reference: https://pypi.org/project/pyspark/
    dsnap: pyspark
binlist:
- pyspark

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
