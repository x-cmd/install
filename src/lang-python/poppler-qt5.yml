lang: Python
homepage: https://github.com/frescobaldi/python-poppler-qt5
desc:
  en: A Python binding for libpoppler-qt5 that aims for completeness and for being actively maintained
  cn: 针对 libpoppler-qt5 的 Python 绑定，其目标是完整性和主动维护
x:
  source: https://github.com/frescobaldi/python-poppler-qt5
rule:
  darwin/brew:
    cmd: brew install poppler-qt5
    reference: https://formulae.brew.sh/formula/poppler-qt5#default
  arch/yay:
    cmd: yay -S poppler-qt5-git
    reference: https://aur.archlinux.org/packages/poppler-qt5-git
binlist:
- poppler-qt5
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
