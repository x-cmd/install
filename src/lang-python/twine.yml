lang: Python
homepage: https://github.com/pypa/twine
license: Apache-2.0
desc:
  cn: Twine 是一个将 Python 包发布到 PyPI 和其他存储库的实用程序
  en: Twine is a utility for publishing Python packages to PyPI and other repositories
x:
  source: https://github.com/pypa/twine
rule:
  /pip:
    cmd: pip install twine
    reference: https://twine.readthedocs.io/en/stable/#installation
    dsnap: twine
  darwin/brew:
    cmd: brew install --cask twine
    reference: https://formulae.brew.sh/cask/twine#default
  debian/apt:
    cmd: sudo apt-get install twine
    reference: https://command-not-found.com/twine
  ubuntu/apt:
    cmd: sudo apt-get install twine
    reference: https://command-not-found.com/twine
  arch/pacman:
    cmd: sudo pacman -S twine
    reference: https://command-not-found.com/twine
  kali/apt:
    cmd: sudo apt-get install twine
    reference: https://command-not-found.com/twine
    dsnap: twine
  fedora/dnf:
    cmd: sudo dnf install twine
    reference: https://command-not-found.com/twine
  raspbian/apt:
    cmd: sudo apt-get install twine
    reference: https://command-not-found.com/twine
binlist:
- twine

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 KB
          rating: 1
          desc:
            cn: 约 10 KB（估算）
            en: ~10 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
