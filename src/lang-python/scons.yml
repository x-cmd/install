lang: Python
homepage: https://github.com/SCons/scons
license: MIT
desc:
  cn: SCons 是一个开源软件构建工具
  en: SCons is an Open Source software construction tool
x:
  source: https://github.com/SCons/scons
  brew: scons
rule:
  /pip:
    cmd: python -m pip install scons
    reference: https://scons.org/doc/production/HTML/scons-user.html#sect-install-scons
    dsnap: scons
  darwin/brew:
    cmd: brew install scons
    reference: https://formulae.brew.sh/formula/scons#default
binlist:
- scons

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 472 KB
          rating: 1
          desc:
            cn: 约 472 KB（估算）
            en: ~472 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
