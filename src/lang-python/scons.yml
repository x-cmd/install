lang: Python
homepage: https://github.com/SCons/scons
license: MIT
desc:
  cn: SCons 是一个开源软件构建工具
  en: SCons is an Open Source software construction tool
x:
  source: https://github.com/SCons/scons
rule:
  /pip:
    cmd: python -m pip install scons
    reference: https://scons.org/doc/production/HTML/scons-user.html#sect-install-scons
    dsnap: scons
  darwin/brew:
    cmd: brew install scons
    reference: https://formulae.brew.sh/formula/scons#default
binlist:
- scons

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
