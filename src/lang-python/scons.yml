lang: Python
homepage: https://github.com/SCons/scons
license: MIT
desc:
  cn: SCons 是一个开源软件构建工具
  en: SCons is an Open Source software construction tool
  cs: SCons je open-source nástroj pro stavbu softwaru
  de: SCons ist ein Open-Source-Software-Bautool
  es: SCons es una herramienta de construcción de software de código abierto
  fr: SCons est un outil de construction de logiciels open source
  id: SCons adalah alat konstruksi perangkat lunak sumber terbuka
  it: SCons è un tool di costruzione software open source
  ja: SCons はオープンソースのソフトウェア構築ツールです
  ko: SCons는 오픈 소스 소프트웨어 빌드 도구입니다
  pl: SCons to narzędzie do budowania oprogramowania o otwartym kodzie źródłowym
  pt: SCons é uma ferramenta de construção de software de código aberto
  ro: SCons este un instrument de construire a software-ului open source
  ru: SCons — это инструмент сборки программного обеспечения с открытым исходным кодом
  th: SCons เป็นเครื่องมือสร้างซอฟต์แวร์โอเพนซอร์ส
  tr: SCons, açık kaynaklı bir yazılım oluşturma aracıdır
  uk: SCons — це інструмент збирання програмного забезпечення з відкритим кодом
  vi: SCons là công cụ xây dựng phần mềm mã nguồn mở
x:
  source: https://github.com/SCons/scons
  brew: scons
  pip: scons
rule:
  /pip:
    cmd: python -m pip install scons
    reference: https://scons.org/doc/production/HTML/scons-user.html#sect-install-scons
    dsnap: scons
  darwin/brew:
    cmd: brew install scons
    reference: https://formulae.brew.sh/formula/scons#default
binlist:
- scons

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 472 KB
          rating: 1
          desc:
            cn: 约 472 KB（估算）
            en: ~472 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
