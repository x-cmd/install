lang: Python
homepage: https://github.com/pyinvoke/invoke
license: BSD-2-Clause
desc:
  cn: 用于管理面向 shell 的子进程并将可执行 Python 代码组织成 CLI 可调用任务的工具
  en: Invoke is a Python (2.7 and 3.4+) library for managing shell-oriented subprocesses and organizing executable Python code into CLI-invokable tasks
x:
  pkg:
    exist: true
  source: https://github.com/pyinvoke/invoke
rule:
  /x:
    cmd: x pkg use invoke
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install invoke
    reference: https://www.pyinvoke.org/installing.html#basic-installation
    dsnap: invoke
binlist:
- invoke

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 35 KB
          rating: 1
          desc:
            cn: 约 35 KB（估算）
            en: ~35 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
