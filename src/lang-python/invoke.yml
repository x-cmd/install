lang: Python
homepage: https://github.com/pyinvoke/invoke
license: BSD-2-Clause
desc:
  cn: 用于管理面向 shell 的子进程并将可执行 Python 代码组织成 CLI 可调用任务的工具
  en: Invoke is a Python (2.7 and 3.4+) library for managing shell-oriented subprocesses and organizing executable Python code into CLI-invokable tasks
x:
  pkg:
    exist: true
  source: https://github.com/pyinvoke/invoke
rule:
  /x:
    cmd: x pkg use invoke
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install invoke
    reference: https://www.pyinvoke.org/installing.html#basic-installation
    dsnap: invoke
binlist:
- invoke
