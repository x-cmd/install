lang: Python
homepage: https://github.com/cookiecutter/cookiecutter
license: BSD-3-Clause
desc:
  cn: 一个命令行实用程序，可从 cookiecutter（项目模板）创建项目
  en: Create projects swiftly from cookiecutters (project templates) with this command-line utility
x:
  source: https://github.com/cookiecutter/cookiecutter
  pip: --user
rule:
  /x:
    cmd: x pkg use cookiecutter
    reference: https://x-cmd.com/install/
  /pipx:
    cmd: pipx install cookiecutter
    reference: https://github.com/cookiecutter/cookiecutter?tab=readme-ov-file#installation
  /pip:
    cmd: python -m pip install --user cookiecutter
    reference: https://github.com/cookiecutter/cookiecutter?tab=readme-ov-file#installation
    dsnap: cookiecutter
binlist:
- cookiecutter

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 KB
          rating: 1
          desc:
            cn: 约 15 KB（估算）
            en: ~15 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
