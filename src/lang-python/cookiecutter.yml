lang: Python
homepage: https://github.com/cookiecutter/cookiecutter
license: BSD-3-Clause
desc:
  cn: 一个命令行实用程序，可从 cookiecutter（项目模板）创建项目
  en: Create projects swiftly from cookiecutters (project templates) with this command-line utility
x:
  pkg:
    exist: true
  source: https://github.com/cookiecutter/cookiecutter
rule:
  /x:
    cmd: x pkg use cookiecutter
    reference: https://x-cmd.com/install/
  /pipx:
    cmd: pipx install cookiecutter
    reference: https://github.com/cookiecutter/cookiecutter?tab=readme-ov-file#installation
  /pip:
    cmd: python -m pip install --user cookiecutter
    reference: https://github.com/cookiecutter/cookiecutter?tab=readme-ov-file#installation
    dsnap: cookiecutter
binlist:
- cookiecutter

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
