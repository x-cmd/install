lang: Python
homepage: https://github.com/pypa/pipx
license: MIT
desc:
  cn: 在隔离环境中安装和运行 Python 应用程序
  en: Install and Run Python Applications in Isolated Environments
  cs: Instalovat a spouštět aplikace Python v izolovaných prostředích
  de: Python-Anwendungen in isolierten Umgebungen installieren und ausführen
  es: Instalar y ejecutar aplicaciones Python en entornos aislados
  fr: Installer et exécuter des applications Python dans des environnements isolés
  id: Memasang dan menjalankan aplikasi Python di lingkungan terisolasi
  it: Installa ed esegui applicazioni Python in ambienti isolati
  ja: 隔離された環境で Python アプリケーションをインストールして実行します
  ko: 격리된 환경에서 Python 애플리케이션을 설치하고 실행합니다
  pl: Instalowanie i uruchamianie aplikacji Pythona w izolowanych środowiskach
  pt: Instalar e executar aplicativos Python em ambientes isolados
  ro: Instalează și rulează aplicații Python în medii izolate
  ru: Установка и запуск приложений Python в изолированных средах
  th: ติดตั้งและรันแอปพลิเคชัน Python ในสภาพแวดล้อมที่แยกขาด
  tr: Python uygulamalarını izole ortamlarda kurmak ve çalıştırmak
  uk: Встановлення та запуск застосунків Python в ізольованих середовищах
  vi: Cài đặt và chạy các ứng dụng Python trong môi trường cô lập
x:
  source: https://github.com/pypa/pipx
  eget: pypa/pipx
  apt: pipx
  brew: pipx
  apt-get: pipx
  asdf: pipx
rule:
  /x:
    cmd: x pkg use pipx
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget pypa/pipx
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use pipx
    reference: https://github.com/joe733/asdf-pipx
  darwin/brew:
    cmd: brew install pipx
    reference: https://pipx.pypa.io/latest/#on-macos
  debian/apt:
    cmd: sudo apt-get install pipx
    reference: https://command-not-found.com/pipx
  ubuntu/apt:
    cmd: sudo apt-get install pipx
    reference: https://command-not-found.com/pipx
  kali/apt:
    cmd: sudo apt-get install pipx
    reference: https://command-not-found.com/pipx
    dsnap: pipx
binlist:
- pipx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 55 KB
          rating: 1
          desc:
            cn: 约 55 KB（估算）
            en: ~55 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
