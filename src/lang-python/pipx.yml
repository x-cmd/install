lang: Python
homepage: https://github.com/pypa/pipx
license: MIT
desc:
  cn: 在隔离环境中安装和运行 Python 应用程序
  en: Install and Run Python Applications in Isolated Environments
x:
  pkg:
    exist: true
  source: https://github.com/pypa/pipx
  eget: https://github.com/pypa/pipx
rule:
  /x:
    cmd: x pkg use pipx
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget pypa/pipx
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use pipx
    reference: https://github.com/joe733/asdf-pipx
  darwin/brew:
    cmd: brew install pipx
    reference: https://pipx.pypa.io/latest/#on-macos
  debian/apt:
    cmd: sudo apt-get install pipx
    reference: https://command-not-found.com/pipx
  ubuntu/apt:
    cmd: sudo apt-get install pipx
    reference: https://command-not-found.com/pipx
  kali/apt:
    cmd: sudo apt-get install pipx
    reference: https://command-not-found.com/pipx
    dsnap: pipx
binlist:
- pipx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
