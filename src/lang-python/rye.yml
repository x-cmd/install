lang: Rust
desc:
  cn: 一个全面的 Python 项目和包管理解决方案
  en: A comprehensive Python project and package management solution.
  cs: Komplexní řešení pro správu projektů a balíčků v Pythonu.
  de: Eine umfassende Lösung für die Verwaltung von Python-Projekten und -Paketen.
  es: Una solución integral para la gestión de proyectos y paquetes de Python.
  fr: Une solution complète de gestion de projets et de paquets Python.
  id: Solusi menyeluruh untuk manajemen proyek dan paket Python.
  it: Una soluzione completa per la gestione di progetti e pacchetti Python.
  ja: Python のプロジェクトとパッケージを管理するための包括的なソリューションです。
  ko: Python 프로젝트와 패키지 관리를 위한 종합적인 솔루션입니다.
  pl: Kompleksowe rozwiązanie do zarządzania projektami i pakietami Pythona.
  pt: Uma solução abrangente para gerenciamento de projetos e pacotes Python.
  ro: O soluție cuprinzătoare pentru gestionarea proiectelor și pachetelor Python.
  ru: Комплексное решение для управления проектами и пакетами Python.
  th: โซลูชันครอบคลุมสำหรับการจัดการโปรเจกต์และแพ็กเกจ Python
  tr: Python projeleri ve paketleri yönetimi için kapsamlı bir çözüm.
  uk: Комплексне рішення для керування проєктами та пакетами Python.
  vi: Giải pháp toàn diện cho quản lý dự án và gói Python.
homepage: https://github.com/astral-sh/rye
license: MIT
x:
  source: https://github.com/astral-sh/rye
  yay: rye-git
rule:
  /x:
    cmd: x pkg use rye
    reference: https://x-cmd.com/install/
  (linux|darwin)/curl:
    cmd: curl -sSf https://rye.astral.sh/get | bash
    reference: https://rye.astral.sh/guide/installation/
  arch/yay:
    cmd: yay -S rye-git
    reference: https://aur.archlinux.org/packages/rye-git
binlist:
- rye

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
