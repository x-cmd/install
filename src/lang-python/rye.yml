lang: Rust
desc:
  cn: 一个全面的 Python 项目和包管理解决方案
  en: A comprehensive Python project and package management solution.
homepage: https://github.com/astral-sh/rye
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/astral-sh/rye
rule:
  /x:
    cmd: x pkg use rye
    reference: https://x-cmd.com/install/
  (linux|darwin)/curl:
    cmd: curl -sSf https://rye.astral.sh/get | bash
    reference: https://rye.astral.sh/guide/installation/
  arch/yay:
    cmd: yay -S rye-git
    reference: https://aur.archlinux.org/packages/rye-git
binlist:
- rye

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
