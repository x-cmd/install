lang: Python
homepage: https://github.com/google/pytype
desc:
  cn: Python 代码的静态类型分析器，检查并推断 Python 代码的类型 - 无需类型注释
  en: A static type analyzer for Python code, checks and infers types for your Python code - without requiring type annotations
x:
  pkg:
    exist: true
  source: https://github.com/google/pytype
  apt: build-essential
rule:
  /x:
    cmd: x pkg use pytype
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install pytype
    reference: https://github.com/google/pytype?tab=readme-ov-file#installing
    dsnap: pytype
  (win|wsl2)/apt:
    cmd: sudo apt install build-essential python3-dev libpython3-dev
    reference: https://github.com/google/pytype?tab=readme-ov-file#installing-on-wsl
  arch/yay:
    cmd: yay -S pytype
    reference: https://aur.archlinux.org/packages/pytype
binlist:
- pytype
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 253 KB
          rating: 1
          desc:
            cn: 约 253 KB（估算）
            en: ~253 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
