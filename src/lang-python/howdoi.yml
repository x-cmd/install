lang: Python
homepage: https://github.com/gleitz/howdoi
license: MIT
desc:
  cn: 通过命令行即时编码答案
  en: instant coding answers via the command line
x:
  pkg:
    exist: true
  source: https://github.com/gleitz/howdoi
rule:
  /x:
    cmd: x pkg use howdoi
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install howdoi
    reference: https://github.com/gleitz/howdoi#installation
    dsnap: howdoi
  darwin/brew:
    cmd: brew install howdoi
    reference: https://github.com/gleitz/howdoi#installation
  debian/apt:
    cmd: sudo apt-get install howdoi
    reference: https://command-not-found.com/howdoi
    dsnap: howdoi
  ubuntu/apt:
    cmd: sudo apt-get install howdoi
    reference: https://command-not-found.com/howdoi
    dsnap: howdoi
  kali/apt:
    cmd: sudo apt-get install howdoi
    reference: https://command-not-found.com/howdoi
    dsnap: howdoi
  raspbian/apt:
    cmd: sudo apt-get install howdoi
    reference: https://command-not-found.com/howdoi
  mint/apt:
    cmd: sudo apt-get install howdoi
    reference: https://command-not-found.com/howdoi
  opensuse/zypper:
    cmd: sudo zypper install howdoi
    reference: https://software.opensuse.org//download.html?project=home%3Athomas-schraitle&package=howdoi
  arch/yay:
    cmd: yay -S howdoi
    reference: https://aur.archlinux.org/packages/howdoi
binlist:
- howdoi

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 KB
          rating: 1
          desc:
            cn: 约 3 KB（估算）
            en: ~3 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
