x:
  source: https://github.com/python-lsp/python-lsp-server
  brew: python-lsp-server
  pip: python-lsp-server
rule:
  /pip:
    cmd: pip install python-lsp-server
    reference: https://github.com/python-lsp/python-lsp-server?tab=readme-ov-file#installation
    dsnap: python-lsp-server
  darwin/brew:
    cmd: brew install python-lsp-server
    reference: https://formulae.brew.sh/formula/python-lsp-server#default
binlist:
- python-lsp-server

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 18 KB
          rating: 1
          desc:
            cn: 约 18 KB（估算）
            en: ~18 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
