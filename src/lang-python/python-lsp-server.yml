lang: Python
homepage: https://github.com/python-lsp/python-lsp-server
license: MIT
desc:
  cn: Python 3.8 + 语言服务器协议的实现
  en: A Python 3.8+ implementation of the Language Server Protocol
x:
  source: https://github.com/python-lsp/python-lsp-server
rule:
  /pip:
    cmd: pip install python-lsp-server
    reference: https://github.com/python-lsp/python-lsp-server?tab=readme-ov-file#installation
    dsnap: python-lsp-server
  darwin/brew:
    cmd: brew install python-lsp-server
    reference: https://formulae.brew.sh/formula/python-lsp-server#default
binlist:
- python-lsp-server

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
