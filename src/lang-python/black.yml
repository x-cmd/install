lang: Python
homepage: https://github.com/psf/black
license: MIT
desc:
  cn: 毫不妥协的 Python 代码格式化程序
  en: Black is a PEP 8 compliant opinionated formatter with its own style
  cs: Black je formátovač dodržující PEP 8, který má vlastní styl
  de: Black ist ein PEP-8-konformer, eigenwilliger Formatierer mit eigenem Stil
  es: Black es un formateador con opiniones propio que cumple con PEP 8
  fr: Black est un formateur respectant PEP 8, avec son propre style
  id: Black adalah formatter yang patuh PEP 8 dengan gayanya sendiri
  it: Black è un formattatore conforme a PEP 8 con opinioni proprie e un proprio stile
  ja: Black は独自のスタイルを持つ PEP 8 準拠の Opinionated フォーマッタです
  ko: Black은 자체 스타일을 가진 PEP 8 준수 opinionated 포매터입니다
  pl: Black to narzędzie do formatowania zgodne z PEP 8, z własnym stylem
  pt: O Black é um formatador opinativo que está em conformidade com o PEP 8 e tem seu próprio estilo
  ro: Black este un formatator care respectă PEP 8, cu propriul stil
  ru: Black — форматтер, соответствующий PEP 8, со своим собственным стилем
  th: Black เป็นตัวจัดรูปแบบที่ยึดตาม PEP 8 พร้อมสไตล์ของตัวเอง
  tr: Black, kendi stili olan PEP 8 uyumlu, kuralcıl bir biçimlendiricidir
  uk: Black — форматувальник, що відповідає PEP 8, зі власним стилем
  vi: Black là trình định dạng tuân thủ PEP 8 với phong cách riêng
x:
  source: https://github.com/psf/black
  yay: python-black-git
  pip: black
rule:
  /x:
    cmd: x pkg use black
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install black
    reference: https://github.com/psf/black?tab=readme-ov-file#installation-and-usage
    dsnap: black
  arch/yay:
    cmd: yay -S python-black-git
    reference: https://aur.archlinux.org/packages/python-black-git
binlist:
- black

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 26 MB
          rating: 2
          desc:
            cn: 安装 26 MB
            en: 26 MB install
        download:
          estimate: 26 MB
          desc:
            cn: 约 26 MB 下载 (linux/arm64)
            en: ~26 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
