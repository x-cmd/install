lang: Python
homepage: https://github.com/psf/black
license: MIT
desc:
  cn: 毫不妥协的 Python 代码格式化程序
  en: Black is a PEP 8 compliant opinionated formatter with its own style
x:
  pkg:
    exist: true
  source: https://github.com/psf/black
rule:
  /x:
    cmd: x pkg use black
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install black
    reference: https://github.com/psf/black?tab=readme-ov-file#installation-and-usage
    dsnap: black
  arch/yay:
    cmd: yay -S python-black-git
    reference: https://aur.archlinux.org/packages/python-black-git
binlist:
- black

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
