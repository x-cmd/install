lang: Python
homepage: https://github.com/psf/black
license: MIT
desc:
  cn: 毫不妥协的 Python 代码格式化程序
  en: Black is a PEP 8 compliant opinionated formatter with its own style
x:
  pkg:
    exist: true
  source: https://github.com/psf/black
rule:
  /x:
    cmd: x pkg use black
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install black
    reference: https://github.com/psf/black?tab=readme-ov-file#installation-and-usage
    dsnap: black
  arch/yay:
    cmd: yay -S python-black-git
    reference: https://aur.archlinux.org/packages/python-black-git
binlist:
- black

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 26 MB
          rating: 2
          desc:
            cn: 安装 26 MB
            en: 26 MB install
        download:
          estimate: 26 MB
          desc:
            cn: 约 26 MB 下载 (linux/arm64)
            en: ~26 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
