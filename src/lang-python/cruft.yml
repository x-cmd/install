homepage: https://github.com/cruft/cruft
license: MIT
lang: Python
desc:
  cn: 用于将打包和构建项目所必需的内容与其他代码分开（基于 CookieCutter）
  en: Allows you to maintain all the necessary cruft for packaging and building projects separate from the code you intentionally write. Built on-top of CookieCutter.
  cs: Umožňuje udržovat veškerý potřebný cruft pro balíčkování a sestavování projektů odděleně od kódu, který záměrně píšete. Postaveno na CookieCutter.
  de: Ermöglicht die Pflege aller für das Packen und Bauen von Projekten nötigen Bestandteile getrennt vom bewusst geschriebenen Code. Aufgebaut auf CookieCutter.
  es: Permite mantener todo el cruft necesario para empaquetar y compilar proyectos separado del código que escribes intencionalmente. Construido sobre CookieCutter.
  fr: Permet de conserver tout le cruft nécessaire à l'empaquetage et à la construction des projets séparé du code que vous écrivez intentionnellement. Construit sur CookieCutter.
  id: Memungkinkan Anda menyimpan semua cruft yang diperlukan untuk pemaketan dan pembangunan proyek secara terpisah dari kode yang Anda tulis dengan sengaja. Dibangun di atas CookieCutter.
  it: Permette di mantenere tutto il cruft necessario per il packaging e la build dei progetti separato dal codice che scrivi intenzionalmente. Costruito su CookieCutter.
  ja: 意図的に書くコードとは別に、パッケージングとプロジェクト構築に必要なすべての cruft を管理できます。CookieCutter を土台に構築されています。
  ko: 의도적으로 작성한 코드와 분리하여 패키징 및 프로젝트 빌드에 필요한 모든 cruft를 관리할 수 있게 합니다. CookieCutter를 기반으로 구축되었습니다.
  pl: Pozwala oddzielnie od świadomie piszego kodu utrzymywać cały niezbędny cruft do pakowania i budowania projektów. Zbudowane na CookieCutter.
  pt: Permite manter todo o cruft necessário para empacotamento e construção de projetos separado do código que você escreve intencionalmente. Construído sobre o CookieCutter.
  ro: Permite păstra toată cruft-ul necesar pentru împachetarea și construirea proiectelor separat de codul pe care îl scrii intenționat. Construit pe CookieCutter.
  ru: Позволяет поддерживать все необходимые вспомогательные файлы для упаковки и сборки проектов отдельно от кода, который вы пишете намеренно. Построено на CookieCutter.
  th: ช่วยให้คุณแยกดูแล cruft ทั้งหมดที่จำเป็นสำหรับการแพ็กและสร้างโครงการออกจากโค้ดที่คุณเขียนอย่างตั้งใจ สร้างบนพื้นฐานของ CookieCutter
  tr: Paketleme ve proje derleme için gereken tüm cruft'i, bilerek yazdığınız koddan ayrı olarak tutmanıza olanak tanır. CookieCutter üzerine kurulmuştur.
  uk: Дозволяє підтримувати весь необхідний cruft для пакування та збирання проєктів окремо від коду, який ви свідомо пишете. Побудовано на CookieCutter.
  vi: Cho phép bạn duy trì toàn bộ cruft cần thiết cho việc đóng gói và xây dựng dự án tách biệt khỏi mã nguồn bạn viết có chủ đích. Được xây dựng trên CookieCutter.
x:
  source: https://github.com/cruft/cruft
  apt: cruft
  brew: cruft
  apt-get: cruft
  scoop: extras/cruft
  yay: cruft
  pip: cruft
rule:
  /x:
    cmd: x pkg use cruft
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install cruft
    reference: https://cruft.github.io/cruft/#installation
  /poetry:
    cmd: poetry add cruft
    reference: https://cruft.github.io/cruft/#installation
  /pipenv:
    cmd: pipenv install cruft
    reference: https://cruft.github.io/cruft/#installation
  darwin/brew:
    cmd: brew install cruft
    reference: https://formulae.brew.sh/formula/cruft#default
  debian/apt:
    cmd: sudo apt-get install cruft
    reference: https://command-not-found.com/cruft
    dsnap: cruft
  ubuntu/apt:
    cmd: sudo apt-get install cruft
    reference: https://command-not-found.com/cruft
    dsnap: cruft
  kali/apt:
    cmd: sudo apt-get install cruft
    reference: https://command-not-found.com/cruft
    dsnap: cruft
  raspbian/apt:
    cmd: sudo apt-get install cruft
    reference: https://command-not-found.com/cruft
  (win|wsl2)/scoop:
    cmd: x scoop install extras/cruft
    reference: https://scoop.sh/#/apps?q=cruft
  arch/yay:
    cmd: yay -S cruft
    reference: https://aur.archlinux.org/packages/cruft
binlist:
- cruft

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
