homepage: https://github.com/cruft/cruft
license: MIT
lang: Python
desc:
  cn: 用于将打包和构建项目所必需的内容与其他代码分开（基于 CookieCutter）
  en: Allows you to maintain all the necessary cruft for packaging and building projects separate from the code you intentionally write. Built on-top of CookieCutter.
x:
  pkg:
    exist: true
  source: https://github.com/cruft/cruft
  apt: cruft
  brew: cruft
rule:
  /x:
    cmd: x pkg use cruft
    reference: https://x-cmd.com/install/
  /pip3:
    cmd: pip3 install cruft
    reference: https://cruft.github.io/cruft/#installation
  /poetry:
    cmd: poetry add cruft
    reference: https://cruft.github.io/cruft/#installation
  /pipenv:
    cmd: pipenv install cruft
    reference: https://cruft.github.io/cruft/#installation
  darwin/brew:
    cmd: brew install cruft
    reference: https://formulae.brew.sh/formula/cruft#default
  debian/apt:
    cmd: sudo apt-get install cruft
    reference: https://command-not-found.com/cruft
    dsnap: cruft
  ubuntu/apt:
    cmd: sudo apt-get install cruft
    reference: https://command-not-found.com/cruft
    dsnap: cruft
  kali/apt:
    cmd: sudo apt-get install cruft
    reference: https://command-not-found.com/cruft
    dsnap: cruft
  raspbian/apt:
    cmd: sudo apt-get install cruft
    reference: https://command-not-found.com/cruft
  (win|wsl2)/scoop:
    cmd: x scoop install extras/cruft
    reference: https://scoop.sh/#/apps?q=cruft
  arch/yay:
    cmd: yay -S cruft
    reference: https://aur.archlinux.org/packages/cruft
binlist:
- cruft

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
