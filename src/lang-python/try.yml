lang: Python
homepage: https://github.com/timofurrer/try
license: MIT
desc:
  cn: try 是一个易于使用的 CLI 工具，可以尝试 Python 软件包
  en: try is an easy-to-use cli tool to try out Python packages
x:
  source: https://github.com/timofurrer/try
rule:
  /pip:
    cmd: pip3 install trypackage
    reference: https://github.com/timofurrer/try?tab=readme-ov-file#installation
    dsnap: trypackage
binlist:
- try

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
