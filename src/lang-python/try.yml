lang: Python
homepage: https://github.com/timofurrer/try
license: MIT
desc:
  cn: try 是一个易于使用的 CLI 工具，可以尝试 Python 软件包
  en: try is an easy-to-use cli tool to try out Python packages
  cs: try je snadno použitelný nástroj CLI pro vyzkoušení Python balíčků
  de: try ist ein einfach zu verwendendes CLI-Werkzeug zum Ausprobieren von Python-Paketen
  es: try es una herramienta de CLI fácil de usar para probar paquetes de Python
  fr: try est un outil en ligne de commande facile à utiliser pour essayer des paquets Python
  id: try adalah alat CLI mudah digunakan untuk mencoba paket Python
  it: try è un utile strumento CLI facile da usare per provare i pacchetti Python
  ja: try は Python パッケージを試すための使いやすい CLI ツールです
  ko: try는 Python 패키지를 체험하기 쉽게 하는 CLI 도구입니다
  pl: try to łatwy w użyciu narzędzie CLI do wypróbowywania pakietów Pythona
  pt: try é uma ferramenta de CLI fácil de usar para experimentar pacotes Python
  ro: try este un instrument CLI ușor de utilizat pentru testarea pachetelor Python
  ru: try — простой в использовании CLI-инструмент для пробы пакетов Python
  th: try เป็นเครื่องมือ CLI ที่ใช้งานง่ายสำหรับการทดลองแพ็กเกจ Python
  tr: try, Python paketlerini denemek için kullanımı kolay bir CLI aracıdır
  uk: try — простий у використанні CLI-інструмент для перевірки пакетів Python
  vi: try là công cụ CLI dễ sử dụng để thử các gói Python
x:
  source: https://github.com/timofurrer/try
  pip: trypackage
rule:
  /pip:
    cmd: pip3 install trypackage
    reference: https://github.com/timofurrer/try?tab=readme-ov-file#installation
    dsnap: trypackage
binlist:
- try

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
