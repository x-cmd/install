lang: Python
homepage: https://github.com/timofurrer/try
license: MIT
desc:
  cn: try 是一个易于使用的 CLI 工具，可以尝试 Python 软件包
  en: try is an easy-to-use cli tool to try out Python packages
x:
  source: https://github.com/timofurrer/try
rule:
  /pip:
    cmd: pip3 install trypackage
    reference: https://github.com/timofurrer/try?tab=readme-ov-file#installation
    dsnap: trypackage
binlist:
- try

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
