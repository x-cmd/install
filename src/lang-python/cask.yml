lang: Emacs Lisp
homepage: https://github.com/cask/cask
license: GPL-3.0
desc:
  en: Project management tool for Emacs
  cn: Emacs 的项目管理工具
  cs: Nástroj pro správu projektů pro Emacs
  de: Projektmanagement-Werkzeug für Emacs
  es: Herramienta de gestión de proyectos para Emacs
  fr: Outil de gestion de projet pour Emacs
  id: Alat manajemen proyek untuk Emacs
  it: Strumento di gestione dei progetti per Emacs
  ja: Emacs 向けのプロジェクト管理ツール
  ko: Emacs를 위한 프로젝트 관리 도구
  pl: Narzędzie do zarządzania projektami dla Emacs
  pt: Ferramenta de gerenciamento de projetos para o Emacs
  ro: Instrument de gestionare a proiectelor pentru Emacs
  ru: Инструмент управления проектами для Emacs
  th: เครื่องมือจัดการโครงการสำหรับ Emacs
  tr: Emacs için proje yönetim aracı
  uk: Інструмент керування проєктами для Emacs
  vi: Công cụ quản lý dự án cho Emacs
x:
  source: https://github.com/cask/cask
  brew: cask
  yay: cask-git
rule:
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/cask/cask/master/go | python
    reference: https://cask.readthedocs.io/en/latest/guide/installation.html#manual-installation
  darwin/brew:
    cmd: brew install cask
    reference: https://cask.readthedocs.io/en/latest/guide/installation.html#package-managers
  arch/yay:
    cmd: yay -S cask-git
    reference: https://aur.archlinux.org/packages/cask-git
binlist:
- cask

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 101 KB
          rating: 1
          desc:
            cn: 约 101 KB（估算）
            en: ~101 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
