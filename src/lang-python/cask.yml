lang: Emacs Lisp
homepage: https://github.com/cask/cask
license: GPL-3.0
desc:
  en: Project management tool for Emacs
  cn: Emacs 的项目管理工具
x:
  source: https://github.com/cask/cask
  brew: cask
rule:
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/cask/cask/master/go | python
    reference: https://cask.readthedocs.io/en/latest/guide/installation.html#manual-installation
  darwin/brew:
    cmd: brew install cask
    reference: https://cask.readthedocs.io/en/latest/guide/installation.html#package-managers
  arch/yay:
    cmd: yay -S cask-git
    reference: https://aur.archlinux.org/packages/cask-git
binlist:
- cask

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 101 KB
          rating: 1
          desc:
            cn: 约 101 KB（估算）
            en: ~101 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
