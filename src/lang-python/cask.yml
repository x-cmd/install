lang: Emacs Lisp
homepage: https://github.com/cask/cask
license: GPL-3.0
desc:
  en: Project management tool for Emacs
  cn: Emacs 的项目管理工具
x:
  source: https://github.com/cask/cask
rule:
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/cask/cask/master/go | python
    reference: https://cask.readthedocs.io/en/latest/guide/installation.html#manual-installation
  darwin/brew:
    cmd: brew install cask
    reference: https://cask.readthedocs.io/en/latest/guide/installation.html#package-managers
  arch/yay:
    cmd: yay -S cask-git
    reference: https://aur.archlinux.org/packages/cask-git
binlist:
- cask

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
