lang: Shell
homepage: https://github.com/pyenv/pyenv-installer
license: MIT
desc:
  cn: pyenv 用于安装 pyenv
  en: pyenv is used to install pyenv and friends
x:
  source: https://github.com/pyenv/pyenv-installer
rule:
  /curl:
    cmd: curl https://pyenv.run | bash
    reference: https://github.com/pyenv/pyenv-installer
  darwin/brew:
    cmd: brew install pyenv
    reference: https://formulae.brew.sh/formula/pyenv#default
binlist:
- pyenv

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 3 MB
        desc:
          cn: 3 MB（估算）
          en: 3 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
