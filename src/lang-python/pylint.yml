lang: Python
homepage: https://github.com/pylint-dev/pylint
license: GPL-2.0
desc:
  cn: Pylint 是 Python 2 或 3 的静态代码分析器
  en: Pylint is a static code analyser for Python 2 or 3
x:
  pkg:
    exist: true
  source: https://github.com/pylint-dev/pylint
rule:
  /x:
    cmd: x pkg use pylint
    reference: https://x-cmd.com/install/
  debian/apt:
    cmd: sudo apt-get install pylint
    reference: https://pylint.org/#install
    dsnap: pylint
  ubuntu/apt:
    cmd: sudo apt-get install pylint
    reference: https://pylint.org/#install
    dsnap: pylint
  fedora/dnf:
    cmd: sudo dnf install pylint
    reference: https://pylint.org/#install
    dsnap: pylint
  gentoo/emerge:
    cmd: sudo emerge pylint
    reference: https://pylint.org/#install
  opensuse/zypper:
    cmd: sudo zypper install python3-pylint
    reference: https://pylint.org/#install
  freebsd/portmaster:
    cmd: portmaster devel/pylint
    reference: https://pylint.org/#install
  arch/pacman:
    cmd: sudo pacman -S python-pylint
    reference: https://pylint.org/#install
  /pip:
    cmd: pip install pylint
    reference: https://pylint.org/#install
    dsnap: pylint
binlist:
- pylint

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
