lang: Python
homepage: https://github.com/Instagram/MonkeyType
desc:
  cn: 一个 Python 库，通过收集运行时类型生成静态类型注释
  en: A Python library that generates static type annotations by collecting runtime types
x:
  pkg:
    exist: true
  source: https://github.com/Instagram/MonkeyType
rule:
  /x:
    cmd: x pkg use monkeytype
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install MonkeyType
    reference: https://github.com/Instagram/MonkeyType?tab=readme-ov-file#installing
    dsnap: MonkeyType
  arch/yay:
    cmd: yay -S python-monkeytype
    reference: https://aur.archlinux.org/packages/python-monkeytype
binlist:
- monkeytype
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 12 KB
          rating: 1
          desc:
            cn: 约 12 KB（估算）
            en: ~12 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
