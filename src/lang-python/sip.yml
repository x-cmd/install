lang: Python
homepage: https://github.com/Python-SIP/sip
license: BSD-2-Clause
desc:
  cn: SIP 是一个非常容易为 C 和 C + + 库创建 Python 绑定的工具
  en: SIP is a tool that makes it very easy to create Python bindings for C and C++ libraries
x:
  source: https://github.com/Python-SIP/sip
rule:
  darwin/brew:
    cmd: brew install sip
    reference: https://formulae.brew.sh/formula/sip#default
  debian/apt:
    cmd: sudo apt-get install sip-devel
    reference: https://command-not-found.com/sip
    dsnap: sip-devel
  ubuntu/apt:
    cmd: sudo apt-get install sip-devel
    reference: https://command-not-found.com/sip
    dsnap: sip-devel
  arch/pacman:
    cmd: sudo pacman -S sip
    reference: https://command-not-found.com/sip
  kali/apt:
    cmd: sudo apt-get install sip-devel
    reference: https://command-not-found.com/sip
    dsnap: sip-devel
  centos/yum:
    cmd: sudo yum install sip-devel
    reference: https://command-not-found.com/sip
  fedora/dnf:
    cmd: sudo dnf install sip
    reference: https://command-not-found.com/sip
    dsnap: sip
  raspbian/apt:
    cmd: sudo apt-get install sip-devel
    reference: https://command-not-found.com/sip
binlist:
- sip

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 约 13 MB（估算）
            en: ~13 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
