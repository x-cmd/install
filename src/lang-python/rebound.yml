lang: C
homepage: https://rebound.readthedocs.io/en/latest/
desc:
  cn: REBOUND 是一个 N-body 积分器，即一个软件包，用于计算粒子在引力作用下的运动。
  en: REBOUND is an N-body integrator, i.e. a software package that can integrate the motion of particles under the influence of gravity.
rule:
  /pip:
    cmd: pip install rebound
    reference: https://rebound.readthedocs.io/en/latest/quickstart_installation/
    dsnap: rebound
binlist:
- rebound
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
