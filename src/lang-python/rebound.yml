lang: C
homepage: https://rebound.readthedocs.io/en/latest/
desc:
  cn: REBOUND 是一个 N-body 积分器，即一个软件包，用于计算粒子在引力作用下的运动。
  en: REBOUND is an N-body integrator, i.e. a software package that can integrate the motion of particles under the influence of gravity.
rule:
  /pip:
    cmd: pip install rebound
    reference: https://rebound.readthedocs.io/en/latest/quickstart_installation/
    dsnap: rebound
binlist:
- rebound
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
