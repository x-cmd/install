lang: Python
homepage: https://github.com/shobrook/rebound/
desc:
  cn: 抛出异常时立即获取 Stack Overflow 结果的命令行工具
  en: Command-line tool that instantly fetches Stack Overflow results when an exception is thrown
x:
  pkg:
    exist: true
  source: https://github.com/shobrook/rebound
rule:
  /x:
    cmd: x pkg use rebound-cli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install rebound-cli
    reference: https://github.com/shobrook/rebound/?tab=readme-ov-file#installation
    dsnap: rebound-cli
  debian/apt:
    cmd: sudo apt-get install rebound-cli
    reference: https://github.com/shobrook/rebound/?tab=readme-ov-file#installation
  ubuntu/apt:
    cmd: sudo apt-get install rebound-cli
    reference: https://github.com/shobrook/rebound/?tab=readme-ov-file#installation
  kali/apt:
    cmd: sudo apt-get install rebound-cli
    reference: https://github.com/shobrook/rebound/?tab=readme-ov-file#installation
    dsnap: rebound-cli
  raspbian/apt:
    cmd: sudo apt-get install rebound-cli
    reference: https://github.com/shobrook/rebound/?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S rebound
    reference: https://aur.archlinux.org/packages/rebound
binlist:
- rebound-cli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
