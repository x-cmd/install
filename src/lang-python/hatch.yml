lang: Python
homepage: https://github.com/pypa/hatch
desc:
  en: Modern, extensible Python project management
  cn: 现代、可扩展的 Python 项目管理
x:
  source: https://github.com/pypa/hatch
  eget: https://github.com/pypa/hatch
  apt: yt-dlp
  dnf: hatch
  brew: hatch
  port: hatch
  xbps: hatch
  yay: python-hatch-git
  pip: hatch
rule:
  /eget:
    cmd: x eget pypa/hatch
    reference: https://x-cmd.com/mod/eget
  /pip:
    cmd: pip install hatch
    reference: https://hatch.pypa.io/latest/install/#pip
    dsnap: hatch
  /pipx:
    cmd: pipx install hatch
    reference: https://hatch.pypa.io/latest/install/#pipx
  darwin/brew:
    cmd: brew install hatch
    reference: https://formulae.brew.sh/formula/hatch#default
  /conda:
    cmd: conda install -c conda-forge hatch
    reference: https://hatch.pypa.io/latest/install/#conda
  /mamba:
    cmd: mamba install hatch
    reference: https://hatch.pypa.io/latest/install/#conda
  debian/apt:
    cmd: 'sudo add-apt-repository ppa:tomtomtom/yt-dlp

      sudo apt update

      sudo apt install yt-dlp

      '
    reference: https://github.com/yt-dlp/yt-dlp/wiki/Installation#apt
  ubuntu/apt:
    cmd: 'sudo add-apt-repository ppa:tomtomtom/yt-dlp

      sudo apt update

      sudo apt install yt-dlp

      '
    reference: https://github.com/yt-dlp/yt-dlp/wiki/Installation#apt
  fedora/dnf:
    cmd: sudo dnf install hatch
    reference: https://hatch.pypa.io/latest/install/#fedora
    dsnap: hatch
  darwin/port:
    cmd: sudo port selfupdate && sudo port install hatch
    reference: https://hatch.pypa.io/latest/install/#macports
  void/xbps:
    cmd: sudo xbps-install hatch
    reference: https://hatch.pypa.io/latest/install/#void-linux
  arch/yay:
    cmd: yay -S python-hatch-git
    reference: https://aur.archlinux.org/packages/python-hatch-git
binlist:
- hatch
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 55 MB
          rating: 3
          desc:
            cn: 安装 55 MB
            en: 55 MB install
        download:
          estimate: 55 MB
          desc:
            cn: 约 55 MB 下载 (linux/x64)
            en: ~55 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
