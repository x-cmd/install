lang: Python
homepage: https://github.com/pytest-dev/pytest
license: MIT
desc:
  cn: Pytest 框架使得编写小型的、可读的测试变得容易，并且可以扩展以支持应用程序和库的复杂功能测试
  en: The pytest framework makes it easy to write small, readable tests, and can scale to support complex functional testing for applications and libraries.
x:
  source: https://github.com/pytest-dev/pytest
rule:
  /pip:
    cmd: pip install -U pytest
    reference: https://docs.pytest.org/en/7.4.x/getting-started.html#install-pytest
    dsnap: pytest
binlist:
- pytest

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
