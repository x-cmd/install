lang: Go
homepage: https://github.com/opentofu/opentofu
license: MPL-2.0
desc:
  cn: OpenTofu 是一种基础架构即代码工具，可让您在人类可读的配置文件中定义云资源和本地资源，您可以对其进行版本控制、重用和共享。它是 Terraform 0.11.14 的分叉，由 Linux 基金会支持。
  en: OpenTofu is an infrastructure-as-code tool that allows you to define cloud resources and on-premises resources in human-readable configuration files, which you can version control, reuse, and share. It is a fork of Terraform 0.11.14, supported by the Linux Foundation.
  cs: OpenTofu je nástroj infrastruktury jako kódu, který vám umožňuje definovat cloudové a lokální zdroje v lidsky čitelných konfiguračních souborech, které můžete verzi, opakovaně používat a sdílet. Je forkem Terraformu 0.11.14 a je podporován nadací Linux Foundation.
  de: OpenTofu ist ein Infrastructure-as-Code-Werkzeug, mit dem Sie Cloud-Ressourcen und lokale Ressourcen in lesbaren Konfigurationsdateien definieren können, die Sie versionieren, wiederverwenden und teilen können. Es ist ein Fork von Terraform 0.11.14 und wird von der Linux Foundation unterstützt.
  es: OpenTofu es una herramienta de infraestructura como código que le permite definir recursos de nube y recursos locales en archivos de configuración legibles por humanos, que puede versionar, reutilizar y compartir. Es un fork de Terraform 0.11.14, respaldado por la Linux Foundation.
  fr: OpenTofu est un outil d'infrastructure as code qui vous permet de définir des ressources cloud et locales dans des fichiers de configuration lisibles par l'humain, que vous pouvez versionner, réutiliser et partager. C'est un fork de Terraform 0.11.14, soutenu par la Linux Foundation.
  id: OpenTofu adalah alat infrastruktur sebagai kode yang memungkinkan Anda menentukan sumber daya awan dan sumber daya lokal di berkas konfigurasi yang dapat dibaca manusia, yang dapat Anda versioning, gunakan kembali, dan bagikan. Ini adalah fork dari Terraform 0.11.14, didukung oleh Linux Foundation.
  it: OpenTofu è uno strumento Infrastructure as Code che ti consente di definire risorse cloud e risorse locali in file di configurazione leggibili da umani, che puoi versionare, riutilizzare e condividere. È un fork di Terraform 0.11.14, supportato dalla Linux Foundation.
  ja: OpenTofu はインフラストラクチャ・アズ・コードのツールで、人間が読める設定ファイルにクラウドリソースやオンプレミスリソースを定義でき、バージョン管理・再利用・共有できます。Terraform 0.11.14 のフォークで、Linux Foundation の支援を受けています。
  ko: OpenTofu는 사람이 읽을 수 있는 구성 파일에 클라우드 및 온-premises 리소스를 정의할 수 있게 하는 인프라스트럭처-as-code 도구로, 버전 관리, 재사용, 공유가 가능합니다. Terraform 0.11.14의 포크이며 Linux Foundation의 지원을 받습니다.
  pl: OpenTofu jest narzędziem infrastruktury jako kodu, które pozwala definiować zasoby chmurowe i lokalne w czytelnych dla człowieka plikach konfiguracyjnych, które można wersjonować, ponownie używać i udostępniać. Jest to fork narzędzia Terraform 0.11.14 wspierany przez Linux Foundation.
  pt: OpenTofu é uma ferramenta de infraestrutura como código que permite definir recursos de nuvem e recursos locais em arquivos de configuração legíveis por humanos, que você pode versionar, reutilizar e compartilhar. É um fork do Terraform 0.11.14, com suporte da Linux Foundation.
  ro: OpenTofu este o unealtă de infrastructură ca cod care vă permite să definiți resurse cloud și resurse locale în fișiere de configurare lizibile de om, pe care le puteți versiona, reutiliza și partaja. Este un fork al Terraform 0.11.14, susținut de Linux Foundation.
  ru: OpenTofu — инструмент «инфраструктура как код», позволяющий определять облачные и локальные ресурсы в человекочитаемых конфигурационных файлах, которыми можно управлять версиями, повторно использовать и делиться. Это форк Terraform 0.11.14, поддерживаемый Linux Foundation.
  th: OpenTofu คือเครื่องมือโครงสร้างพื้นฐานในรูปแบบโค้ด ที่ให้คุณกำหนดทรัพยากรคลาวด์และทรัพยากรในสถานที่ตั้งในไฟล์การกำหนดค่าที่อ่านเข้าใจได้ ซึ่งคุณสามารถจัดการเวอร์ชัน ใช้ซ้ำ และแบ่งปันได้ มันเป็นฟอร์กของ Terraform 0.11.14 โดยได้รับการสนับสนุนจาก Linux Foundation
  tr: OpenTofu, insan tarafından okunabilen yapılandırma dosyalarında bulut ve şirket içi kaynakları tanımlamanıza olanak tanıyan, sürüm kontrolü yapabileceğiniz, yeniden kullanabileceğiniz ve paylaşabileceğiniz altyapı olarak kod aracıdır. Terraform 0.11.14'ün bir çatalıdır ve Linux Foundation tarafından desteklenir.
  uk: OpenTofu — інструмент «інфраструктура як код», який дозволяє визначати хмарні та локальні ресурси у зрозумілих для людини конфігураційних файлах, якими можна керувати версіями, повторно використовувати та розповсюджувати. Це форк Terraform 0.11.14, який підтримує Linux Foundation.
  vi: OpenTofu là công cụ hạ tầng dưới dạng mã cho phép bạn định nghĩa tài nguyên đám mây và tài nguyên tại chỗ trong các tệp cấu hình dễ đọc, bạn có thể quản lý phiên bản, tái sử dụng và chia sẻ. Đây là nhánh fork của Terraform 0.11.14, được Linux Foundation hỗ trợ.
