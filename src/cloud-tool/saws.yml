lang: Python
homepage: https://github.com/donnemartin/saws
desc:
  cn: 采用 python 编写的增强 aws-cli
  en: A supercharged AWS command line interface (CLI)
x:
  source: https://github.com/donnemartin/saws
rule:
  /pip:
    cmd: sudo pip install saws
    reference: https://github.com/donnemartin/saws?tab=readme-ov-file#pip-installation
    dsnap: saws
binlist:
- saws
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 KB
          rating: 1
          desc:
            cn: 约 6 KB（估算）
            en: ~6 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
