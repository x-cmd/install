lang: Python
homepage: https://github.com/donnemartin/saws
desc:
  cn: 采用 python 编写的增强 aws-cli
  en: A supercharged AWS command line interface (CLI)
x:
  source: https://github.com/donnemartin/saws
rule:
  /pip:
    cmd: sudo pip install saws
    reference: https://github.com/donnemartin/saws?tab=readme-ov-file#pip-installation
    dsnap: saws
binlist:
- saws
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
