lang: 'Go'
homepage: https://github.com/dhth/cueitup
license: 'MIT'
desc:
  cn: 简洁有序地查看 AWS SQS 队列中的消息
  en: 'Inspect messages in an AWS SQS queue in a simple and deliberate manner'
x:
  source: https://github.com/dhth/cueitup
  eget: https://github.com/dhth/cueitup
rule:
  /eget:
    cmd: x eget dhth/cueitup
    reference: https://github.com/dhth/cueitup
binlist:
  - 'cueitup'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
