lang: Python
homepage: https://github.com/bloomreach/s4cmd
license: Apache-2.0
desc:
  cn: 超级 S3 命令行工具
  en: Super S3 command line tool
x:
  pkg:
    exist: true
  source: https://github.com/bloomreach/s4cmd
rule:
  /x:
    cmd: x pkg use s4cmd
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install s4cmd
    reference: https://github.com/bloomreach/s4cmd#installation-and-setup
    dsnap: s4cmd
  darwin/brew:
    cmd: brew install s4cmd
    reference: https://formulae.brew.sh/formula/s4cmd#default
  debian/apt:
    cmd: sudo apt install s4cmd
    reference: https://command-not-found.com/s4cmd
    dsnap: s4cmd
  ubuntu/apt:
    cmd: sudo apt install s4cmd
    reference: https://command-not-found.com/s4cmd
    dsnap: s4cmd
  kali/apt:
    cmd: sudo apt install s4cmd
    reference: https://command-not-found.com/s4cmd
    dsnap: s4cmd
  raspbian/apt:
    cmd: sudo apt-get install s4cmd
    reference: https://command-not-found.com/s4cmd
binlist:
- s4cmd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 KB
          rating: 1
          desc:
            cn: 约 4 KB（估算）
            en: ~4 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
