lang: Python
homepage: https://github.com/bloomreach/s4cmd
license: Apache-2.0
desc:
  cn: 超级 S3 命令行工具
  en: Super S3 command line tool
x:
  pkg:
    exist: true
  source: https://github.com/bloomreach/s4cmd
rule:
  /x:
    cmd: x pkg use s4cmd
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install s4cmd
    reference: https://github.com/bloomreach/s4cmd#installation-and-setup
    dsnap: s4cmd
  darwin/brew:
    cmd: brew install s4cmd
    reference: https://formulae.brew.sh/formula/s4cmd#default
  debian/apt:
    cmd: sudo apt install s4cmd
    reference: https://command-not-found.com/s4cmd
    dsnap: s4cmd
  ubuntu/apt:
    cmd: sudo apt install s4cmd
    reference: https://command-not-found.com/s4cmd
    dsnap: s4cmd
  kali/apt:
    cmd: sudo apt install s4cmd
    reference: https://command-not-found.com/s4cmd
    dsnap: s4cmd
  raspbian/apt:
    cmd: sudo apt-get install s4cmd
    reference: https://command-not-found.com/s4cmd
binlist:
- s4cmd

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
