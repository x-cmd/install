lang: 'TypeScript'
homepage: 'https://github.com/elva-labs/awsesh'
license: 'MIT'
desc:
  cn: AWS 会话与凭证管理器及 SDK
  en: 'An AWS session and credential manager and SDK ✨'
x:
  source: https://github.com/elva-labs/awsesh
  eget: https://github.com/elva-labs/awsesh
rule:
  /eget:
    cmd: x eget elva-labs/awsesh
    reference: https://github.com/elva-labs/awsesh
binlist:
  - 'awsesh'

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
