lang: 'TypeScript'
homepage: 'https://github.com/elva-labs/awsesh'
license: 'MIT'
desc:
  cn: AWS 会话与凭证管理器及 SDK
  en: 'An AWS session and credential manager and SDK ✨'
x:
  source: https://github.com/elva-labs/awsesh
  eget: https://github.com/elva-labs/awsesh
rule:
  /eget:
    cmd: x eget elva-labs/awsesh
    reference: https://github.com/elva-labs/awsesh
binlist:
- 'awsesh'

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 52 MB
          rating: 3
          desc:
            cn: 安装 52 MB
            en: 52 MB install
        download:
          estimate: 52 MB
          desc:
            cn: 约 52 MB 下载 (linux/x64)
            en: ~52 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
