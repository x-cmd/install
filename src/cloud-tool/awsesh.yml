lang: 'TypeScript'
homepage: 'https://github.com/elva-labs/awsesh'
license: 'MIT'
desc:
  cn: AWS 会话与凭证管理器及 SDK
  en: 'An AWS session and credential manager and SDK ✨'
x:
  source: https://github.com/elva-labs/awsesh
  eget: https://github.com/elva-labs/awsesh
rule:
  /eget:
    cmd: x eget elva-labs/awsesh
    reference: https://github.com/elva-labs/awsesh
binlist:
  - 'awsesh'

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 KB
          rating: 1
          desc:
            cn: 约 15 KB（估算）
            en: ~15 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
