lang: Rust
homepage: https://github.com/googleworkspace/cli
license: Apache-2.0
desc:
  en: Google Workspace CLI — one command-line tool for Drive, Gmail, Calendar, Sheets, Docs, Chat, Admin, and more. Dynamically built from Google Discovery Service. Includes AI agent skills.
  cn: Google Workspace CLI——一款命令行工具，可用于管理云端硬盘、Gmail、日历、表格、文档、聊天、管理后台等。它基于 Google Discovery Service 动态构建，并包含 AI 代理功能
x:
  source: https://github.com/googleworkspace/cli
  eget: https://github.com/googleworkspace/cli
rule:
  /eget:
    cmd: x eget googleworkspace/cli
    reference: https://x-cmd.com/mod/eget
  /npm:
    cmd: npm install -g @googleworkspace/cli
    reference: https://github.com/googleworkspace/cli?tab=readme-ov-file#installation
    dsnap: '@googleworkspace/cli'
  arch/yay:
    cmd: yay -S googleworkspace-cli-bin
    reference: https://aur.archlinux.org/packages/googleworkspace-cli-bin
binlist:
  - gws

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
