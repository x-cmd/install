lang: Go
homepage: https://github.com/mrusme/planor
license: GPL-3.0
desc:
  cn: Planor 是一个针对云服务的文本用户界面
  en: Planor is a text user interface for cloud services.
x:
  source: https://github.com/mrusme/planor
  eget: https://github.com/mrusme/planor
rule:
  /eget:
    cmd: x eget mrusme/planor
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/mrusme/planor@latest
    reference: https://github.com/mrusme/planor
    dsnap: github.com/mrusme/planor
binlist:
- planor

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
