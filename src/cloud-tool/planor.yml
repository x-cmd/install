lang: Go
homepage: https://github.com/mrusme/planor
license: GPL-3.0
desc:
  cn: Planor 是一个针对云服务的文本用户界面
  en: Planor is a text user interface for cloud services.
  cs: Planor je textové uživatelské rozhraní pro cloudové služby.
  de: Planor ist eine textbasierte Benutzeroberfläche für Cloud-Dienste.
  es: Planor es una interfaz de usuario de texto para servicios en la nube.
  fr: Planor est une interface utilisateur textuelle pour les services cloud.
  id: Planor adalah antarmuka pengguna berbasis teks untuk layanan cloud.
  it: Planor è un'interfaccia utente testuale per i servizi cloud.
  ja: Planor はクラウドサービス向けのテキストユーザーインターフェースです。
  ko: Planor는 클라우드 서비스를 위한 텍스트 사용자 인터페이스입니다.
  pl: Planor to tekstowy interfejs użytkownika dla usług chmurowych.
  pt: Planor é uma interface de usuário de texto para serviços em nuvem.
  ro: Planor este o interfață utilizator bazată pe text pentru servicii cloud.
  ru: Planor — текстовый пользовательский интерфейс для облачных сервисов.
  th: Planor คือส่วนติดต่อผู้ใช้แบบข้อความสำหรับบริการคลาวด์
  tr: Planor, bulut hizmetleri için metin tabanlı bir kullanıcı arayüzüdür.
  uk: Planor — текстовий користувацький інтерфейс для хмарних сервісів.
  vi: Planor là giao diện người dùng dạng văn bản cho các dịch vụ đám mây.
x:
  source: https://github.com/mrusme/planor
  eget: mrusme/planor
  go: github.com/mrusme/planor@latest
rule:
  /eget:
    cmd: x eget mrusme/planor
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/mrusme/planor@latest
    reference: https://github.com/mrusme/planor
    dsnap: github.com/mrusme/planor
binlist:
- planor

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
