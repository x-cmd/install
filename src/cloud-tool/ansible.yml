lang: Python
homepage: https://github.com/ansible/ansible
license: GPL-3.0
desc:
  cn: Ansible 是一个极其简单的 IT 自动化平台，使您的应用程序和系统更易于部署和维护
  en: Ansible is a radically simple IT automation platform that makes your applications and systems easier to deploy and maintain
  cs: Ansible je mimořádně jednoduchá platforma automatizace IT, která usnadňuje nasazování a údržbu vašich aplikací a systémů
  de: Ansible ist eine radikal einfache IT-Automatisierungsplattform, die das Bereitstellen und Warten Ihrer Anwendungen und Systeme erleichtert
  es: Ansible es una plataforma de automatización de TI radicalmente simple que facilita el despliegue y el mantenimiento de sus aplicaciones y sistemas
  fr: Ansible est une plateforme d'automatisation informatique radicalement simple qui facilite le déploiement et la maintenance de vos applications et systèmes
  id: Ansible adalah platform otomasi TI yang sangat sederhana sehingga memudahkan Anda dalam menerapkan dan memelihara aplikasi serta sistem Anda
  it: Ansible è una piattaforma di automazione IT radicalmente semplice che rende più facili la distribuzione e la manutenzione delle tue applicazioni e dei tuoi sistemi
  ja: Ansible は、アプリケーションやシステムのデプロイとメンテナンスを容易にする、実に簡単な IT 自動化プラットフォームです
  ko: Ansible는 애플리케이션과 시스템의 배포 및 유지 관리를 훨씬 쉽게 만들어 주는 매우 단순한 IT 자동화 플랫폼입니다
  pl: Ansible to radykalnie prosta platforma automatyzacji IT, która ułatwia wdrażanie i utrzymanie aplikacji oraz systemów
  pt: O Ansible é uma plataforma de automação de TI radicalmente simples que facilita a implantação e a manutenção de seus aplicativos e sistemas
  ro: Ansible este o platformă de automatizare IT extrem de simplă, care facilitează implementarea și întreținerea aplicațiilor și sistemelor dvs.
  ru: Ansible — радикально простая платформа автоматизации ИТ, которая упрощает развертывание и сопровождение ваших приложений и систем
  th: Ansible คือแพลตฟอร์มอัตโนมัติระบบ IT ที่เรียบง่ายอย่างน่าทึ่ง ช่วยให้การติดตั้งและบำรุงรักษาแอปพลิเคชันและระบบของคุณง่ายขึ้น
  tr: Ansible, uygulamalarınızı ve sistemlerinizi dağıtmayı ve bakımını yapmayı kolaylaştıran son derece basit bir BT otomasyon platformudur
  uk: Ansible — надзвичайно проста платформа автоматизації ІТ, яка спрощує розгортання та супровід ваших застосунків і систем
  vi: Ansible là nền tảng tự động hóa IT cực kỳ đơn giản, giúp bạn triển khai và bảo trì các ứng dụng và hệ thống dễ dàng hơn
x:
  source: https://github.com/ansible/ansible
  apt: ansible
  dnf: ansible
  brew: ansible
  pacman: ansible
  apk: ansible
  apt-get: ansible
  yum: ansible
rule:
  /x:
    cmd: x pkg use ansible
    reference: https://x-cmd.com/install/
  /pip:
    cmd: python3 -m pip install --user ansible
    reference: https://docs.ansible.com/ansible/latest/installation_guide/intro_installation.html#pip-install
    dsnap: ansible
  /pipx:
    cmd: pipx install --include-deps ansible
    reference: https://docs.ansible.com/ansible/latest/installation_guide/intro_installation.html#installing-and-upgrading-ansible-with-pipx
  darwin/brew:
    cmd: brew install ansible
    reference: https://formulae.brew.sh/formula/ansible#default
  debian/apt:
    cmd: sudo apt-get install ansible
    reference: https://command-not-found.com/ansible
    dsnap: ansible
  ubuntu/apt:
    cmd: sudo apt-get install ansible
    reference: https://command-not-found.com/ansible
    dsnap: ansible
  alpine/apk:
    cmd: sudo apk add ansible
    reference: https://command-not-found.com/ansible
    dsnap: ansible
  arch/pacman:
    cmd: sudo pacman -S ansible
    reference: https://command-not-found.com/ansible
  kali/apt:
    cmd: sudo apt-get install ansible
    reference: https://command-not-found.com/ansible
    dsnap: ansible
  centos/yum:
    cmd: sudo yum install ansible
    reference: https://command-not-found.com/ansible
  fedora/dnf:
    cmd: sudo dnf install ansible
    reference: https://command-not-found.com/ansible
    dsnap: ansible
  raspbian/apt:
    cmd: sudo apt-get install ansible
    reference: https://command-not-found.com/ansible
binlist:
- ansible

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 546 KB
          rating: 1
          desc:
            cn: 约 546 KB（估算）
            en: ~546 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
