lang: Go
desc:
  cn: Cloudlist 是一个用于从云提供商获取资产的多云工具，只需很少的配置工作即可维护跨多个云的集中资产列表
  en: Cloudlist is a multi-cloud tool for getting Assets from Cloud Providers, maintaining a centralized list of assets across multiple clouds with very little configuration efforts
homepage: https://github.com/projectdiscovery/cloudlist
license: MIT
x:
  pkg:
    exist: true
  source: https://github.com/projectdiscovery/cloudlist
  eget: https://github.com/projectdiscovery/cloudlist
rule:
  /x:
    cmd: x pkg use cloudlist
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget projectdiscovery/cloudlist
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install cloudlist
    reference: https://formulae.brew.sh/formula/cloudlist
  arch/yay:
    cmd: yay -S cloudlist
    reference: https://aur.archlinux.org/packages/cloudlist
binlist:
- cloudlist

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
