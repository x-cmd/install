lang: Python
homepage: https://github.com/pyinfra-dev/pyinfra
license: MIT
desc:
  cn: 一个多功能的 CLI 工具和 python 库，用于自动化基础设施
  en: pyinfra automates infrastructure using Python. It’s fast and scales from one server to thousands
  cs: pyinfra automatizuje infrastrukturu pomocí Pythonu. Je rychlý a škáluje od jednoho serveru až po tisíce
  de: pyinfra automatisiert Infrastruktur mit Python. Es ist schnell und skaliert von einem Server bis zu Tausenden
  es: pyinfra automatiza la infraestructura con Python. Es rápido y escala desde un servidor hasta miles
  fr: pyinfra automatise l'infrastructure avec Python. Il est rapide et passe d'un serveur à des milliers
  id: pyinfra mengotomasi infrastruktur menggunakan Python. Cepat dan dapat diskalakan dari satu server hingga ribuan
  it: pyinfra automatizza l'infrastruttura usando Python. È veloce e si scala da un server a migliaia
  ja: pyinfra は Python を使ってインフラを自動化します。高速で、1 台から数千台までスケールします
  ko: pyinfra는 Python을 사용하여 인프라를 자동화합니다. 빠르며 서버 1대에서 수천 대까지 확장됩니다
  pl: pyinfra automatyzuje infrastrukturę przy użyciu Pythona. Jest szybki i skaluje się od jednego serwera do tysięcy
  pt: O pyinfra automatiza a infraestrutura usando Python. É rápido e escala de um servidor para milhares
  ro: pyinfra automatizează infrastructura folosind Python. Este rapid și scalabil de la un server la mii
  ru: pyinfra автоматизирует инфраструктуру с помощью Python. Он быстр и масштабируется от одного сервера до тысяч
  th: pyinfra ใช้ Python ในการทำระบบอัตโนมัติของโครงสร้างพื้นฐาน ทำงานได้เร็วและขยายตัวได้ตั้งแต่หนึ่งเซิร์ฟเวอร์ไปจนถึงหลายพันเครื่อง
  tr: pyinfra, Python kullanarak altyapıyı otomatikleştirir. Hızlıdır ve tek bir sunucudan binlerce sunucuya ölçeklenir
  uk: pyinfra автоматизує інфраструктуру за допомогою Python. Він швидкий і масштабується від одного сервера до тисяч
  vi: pyinfra tự động hóa hạ tầng bằng Python. Nhanh và có thể mở rộng từ một máy chủ đến hàng nghìn máy chủ
x:
  source: https://github.com/pyinfra-dev/pyinfra
  yay: pyinfra
  pip: pyinfra
rule:
  /x:
    cmd: x pkg use pyinfra
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install pyinfra
    reference: https://github.com/pyinfra-dev/pyinfra?tab=readme-ov-file#quickstart
    dsnap: pyinfra
  arch/yay:
    cmd: yay -S pyinfra
    reference: https://aur.archlinux.org/packages/pyinfra
binlist:
- pyinfra

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 70 KB
          rating: 1
          desc:
            cn: 约 70 KB（估算）
            en: ~70 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
