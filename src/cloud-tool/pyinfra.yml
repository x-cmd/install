lang: Python
homepage: https://github.com/pyinfra-dev/pyinfra
license: MIT
desc:
  cn: 一个多功能的 CLI 工具和 python 库，用于自动化基础设施
  en: pyinfra automates infrastructure using Python. It’s fast and scales from one server to thousands
x:
  pkg:
    exist: true
  source: https://github.com/pyinfra-dev/pyinfra
rule:
  /x:
    cmd: x pkg use pyinfra
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install pyinfra
    reference: https://github.com/pyinfra-dev/pyinfra?tab=readme-ov-file#quickstart
    dsnap: pyinfra
  arch/yay:
    cmd: yay -S pyinfra
    reference: https://aur.archlinux.org/packages/pyinfra
binlist:
- pyinfra

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
