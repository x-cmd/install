lang: Go
homepage: https://github.com/peak/s5cmd
license: MIT
desc:
  cn: 一款非常快速的 S3 和本地文件系统执行工具
  en: A very fast S3 and local filesystem execution tool.
  cs: Velmi rychlý nástroj pro spouštění operací nad S3 a místním systémem souborů.
  de: Ein sehr schnelles Werkzeug zur Ausführung von Operationen auf S3 und lokalen Dateisystemen.
  es: Una herramienta muy rápida para ejecutar operaciones sobre S3 y el sistema de archivos local.
  fr: Un outil très rapide pour exécuter des opérations sur S3 et le système de fichiers local.
  id: Alat eksekusi yang sangat cepat untuk S3 dan sistem berkas lokal.
  it: Uno strumento di esecuzione molto veloce per S3 e per il filesystem locale.
  ja: S3 とローカルファイルシステム向けの非常に高速な実行ツール。
  ko: S3 및 로컬 파일 시스템 작업을 위한 매우 빠른 실행 도구입니다.
  pl: Bardzo szybkie narzędzie wykonawcze dla S3 i lokalnego systemu plików.
  pt: Uma ferramenta de execução muito rápida para S3 e sistema de arquivos local.
  ro: Un instrument de execuție foarte rapid pentru S3 și sistemul de fișiere local.
  ru: Очень быстрый инструмент выполнения операций для S3 и локальной файловой системы.
  th: เครื่องมือประมวลผลที่รวดเร็วมากสำหรับ S3 และระบบไฟล์ในเครื่อง
  tr: S3 ve yerel dosya sistemi için çok hızlı bir çalıştırma aracı.
  uk: Дуже швидкий інструмент виконання для S3 і локальної файлової системи.
  vi: Công cụ thực thi rất nhanh cho S3 và hệ thống tệp cục bộ.
x:
  source: https://github.com/peak/s5cmd
  eget: peak/s5cmd
  brew: peak/tap/s5cmd
  port: s5cmd
  yay: s5cmd
  go: github.com/peak/s5cmd/v2@master
rule:
  /eget:
    cmd: x eget peak/s5cmd
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install peak/tap/s5cmd
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S s5cmd
    reference: https://aur.archlinux.org/packages/s5cmd
  darwin/port:
    cmd: |
      sudo port selfupdate
      sudo port install s5cmd
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
  /conda:
    cmd: conda install s5cmd
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
  freebsd/pkg:
    cmd: pkg install s5cmd
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/peak/s5cmd/v2@master
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
    dsnap: github.com/peak/s5cmd/v2@master

binlist:
- s5cmd

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/arm64)
            en: ~4 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
