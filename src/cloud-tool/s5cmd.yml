lang: Go
homepage: https://github.com/peak/s5cmd
license: MIT
desc:
  cn: 一款非常快速的 S3 和本地文件系统执行工具
  en: A very fast S3 and local filesystem execution tool.
x:
  source: https://github.com/peak/s5cmd
  eget: https://github.com/peak/s5cmd
rule:
  /eget:
    cmd: x eget peak/s5cmd
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install peak/tap/s5cmd
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S s5cmd
    reference: https://aur.archlinux.org/packages/s5cmd
  darwin/port:
    cmd: |
      sudo port selfupdate
      sudo port install s5cmd
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
  /conda:
    cmd: conda install s5cmd
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
  freebsd/pkg:
    cmd: pkg install s5cmd
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/peak/s5cmd/v2@master
    reference: https://github.com/peak/s5cmd?tab=readme-ov-file#installation
    dsnap: github.com/peak/s5cmd/v2@master

binlist:
  - s5cmd

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
