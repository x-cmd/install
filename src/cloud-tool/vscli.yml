lang: 'Rust'
homepage: https://github.com/michidk/vscli
license: 'MIT'
desc:
  cn: 简化 VSCode 项目启动的 CLI/TUI，专注开发容器
  en: 'A CLI/TUI that simplifies launching VSCode projects, with a focus on dev containers'
x:
  source: https://github.com/michidk/vscli
  eget: https://github.com/michidk/vscli
rule:
  /eget:
    cmd: x eget michidk/vscli
    reference: https://github.com/michidk/vscli
binlist:
  - 'vscli'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
