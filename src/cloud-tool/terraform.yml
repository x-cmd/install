lang: Go
homepage: https://github.com/hashicorp/terraform
desc:
  cn: 使用 Terraform 可以在任何云上实现基础架构自动化
  en: Automate infrastructure on any cloud with Terraform
x:
  pkg:
    exist: true
  source: https://github.com/hashicorp/terraform
rule:
  /x:
    cmd: x pkg use terraform
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use terraform
    reference: https://github.com/asdf-community/asdf-hashicorp
  darwin/brew:
    cmd: 'brew tap hashicorp/tap \

      && brew install hashicorp/tap/terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  debian/apt:
    cmd: 'wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg \

      && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list \

      && sudo apt update \

      && sudo apt install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
    dsnap: terraform
  ubuntu/apt:
    cmd: 'wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg \

      && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list \

      && sudo apt update \

      && sudo apt install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
    dsnap: terraform
  alpine/apk:
    cmd: sudo apk add terraform
    reference: https://command-not-found.com/terraform
    dsnap: terraform
  arch/pacman:
    cmd: sudo pacman -S terraform
    reference: https://command-not-found.com/terraform
  kali/apt:
    cmd: 'wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg \

      && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list \

      && sudo apt update \

      && sudo apt install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  fedora/dnf:
    cmd: 'sudo dnf install -y dnf-plugins-core \

      && sudo dnf config-manager --add-repo https://rpm.releases.hashicorp.com/fedora/hashicorp.repo \

      && sudo dnf -y install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
    dsnap: terraform
  raspbian/apt:
    cmd: 'wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg \

      && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list \

      && sudo apt update \

      && sudo apt install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  centos/yum:
    cmd: 'sudo yum install -y yum-utils \

      && sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo \

      && sudo yum -y install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  rhel/yum:
    cmd: 'sudo yum install -y yum-utils \

      && sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo \

      && sudo yum -y install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  amazon/yum:
    cmd: 'sudo yum install -y yum-utils shadow-utils \

      && sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo \

      && sudo yum -y install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
binlist:
- terraform
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
