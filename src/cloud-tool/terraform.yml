lang: Go
homepage: https://github.com/hashicorp/terraform
desc:
  cn: 使用 Terraform 可以在任何云上实现基础架构自动化
  en: Automate infrastructure on any cloud with Terraform
  cs: Automatizujte infrastrukturu na jakékoli cloudu pomocí Terraform
  de: Infrastruktur auf jeder Cloud mit Terraform automatisieren
  es: Automatiza la infraestructura en cualquier nube con Terraform
  fr: Automatisez votre infrastructure sur n'importe quel cloud avec Terraform
  id: Otomatiskan infrastruktur di cloud mana pun dengan Terraform
  it: Automatizza l'infrastruttura su qualsiasi cloud con Terraform
  ja: Terraform で任意クラウドのインフラストラクチャを自動化する
  ko: Terraform으로 어떤 클라우드에서든 인프라를 자동화하세요
  pl: Automatyzuj infrastrukturę w dowolnej chmurze za pomocą Terraform
  pt: Automatize a infraestrutura em qualquer nuvem com o Terraform
  ro: Automatizați infrastructura în orice cloud cu Terraform
  ru: Автоматизируйте инфраструктуру в любом облаке с помощью Terraform
  th: ทำให้อินฟราสตรักเจอร์บนคลาวด์ใดก็ได้อัตโนมัติด้วย Terraform
  tr: Terraform ile her bulutta altyapı otomasyonu yapın
  uk: Автоматизуйте інфраструктуру в будь-якій хмарі за допомогою Terraform
  vi: Tự động hóa hạ tầng trên mọi nền tảng đám mây với Terraform
x:
  source: https://github.com/hashicorp/terraform
  apt: terraform
  brew: hashicorp/tap/terraform
  pacman: terraform
  apk: terraform
  asdf: terraform
rule:
  /x:
    cmd: x pkg use terraform
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use terraform
    reference: https://github.com/asdf-community/asdf-hashicorp
  darwin/brew:
    cmd: 'brew tap hashicorp/tap \

      && brew install hashicorp/tap/terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  debian/apt:
    cmd: 'wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg \

      && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list \

      && sudo apt update \

      && sudo apt install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
    dsnap: terraform
  ubuntu/apt:
    cmd: 'wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg \

      && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list \

      && sudo apt update \

      && sudo apt install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
    dsnap: terraform
  alpine/apk:
    cmd: sudo apk add terraform
    reference: https://command-not-found.com/terraform
    dsnap: terraform
  arch/pacman:
    cmd: sudo pacman -S terraform
    reference: https://command-not-found.com/terraform
  kali/apt:
    cmd: 'wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg \

      && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list \

      && sudo apt update \

      && sudo apt install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  fedora/dnf:
    cmd: 'sudo dnf install -y dnf-plugins-core \

      && sudo dnf config-manager --add-repo https://rpm.releases.hashicorp.com/fedora/hashicorp.repo \

      && sudo dnf -y install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
    dsnap: terraform
  raspbian/apt:
    cmd: 'wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg \

      && echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list \

      && sudo apt update \

      && sudo apt install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  centos/yum:
    cmd: 'sudo yum install -y yum-utils \

      && sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo \

      && sudo yum -y install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  rhel/yum:
    cmd: 'sudo yum install -y yum-utils \

      && sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo \

      && sudo yum -y install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
  amazon/yum:
    cmd: 'sudo yum install -y yum-utils shadow-utils \

      && sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo \

      && sudo yum -y install terraform

      '
    reference: https://developer.hashicorp.com/terraform/install?product_intent=terraform
binlist:
- terraform
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 47 MB
          rating: 2
          desc:
            cn: 约 47 MB（估算）
            en: ~47 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
