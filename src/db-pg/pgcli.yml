lang: Python
homepage: https://github.com/dbcli/pgcli
license: BSD-3-Clause
desc:
  cn: postgres 的 CLI，具有自动补全和语法突出显示功能
  en: CLI for postgres with autocompletion and syntax highlighting
x:
  pkg:
    exist: true
  source: https://github.com/dbcli/pgcli
rule:
  /x:
    cmd: x pkg use pgcli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install -U pgcli
    reference: https://github.com/dbcli/pgcli#quick-start
    dsnap: pgcli
  darwin/brew:
    cmd: brew install pgcli
    reference: https://formulae.brew.sh/formula/pgcli#default
  debian/apt:
    cmd: sudo apt install pgcli
    reference: https://command-not-found.com/pgcli
    dsnap: pgcli
  ubuntu/apt:
    cmd: sudo apt install pgcli
    reference: https://command-not-found.com/pgcli
    dsnap: pgcli
  kali/apt:
    cmd: sudo apt install pgcli
    reference: https://command-not-found.com/pgcli
    dsnap: pgcli
  raspbian/apt:
    cmd: sudo apt-get install pgcli
    reference: https://command-not-found.com/pgcli
binlist:
- pgcli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 26 KB
          rating: 1
          desc:
            cn: 约 26 KB（估算）
            en: ~26 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
