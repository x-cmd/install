lang: Python
homepage: https://github.com/dbcli/pgcli
license: BSD-3-Clause
desc:
  cn: postgres 的 CLI，具有自动补全和语法突出显示功能
  en: CLI for postgres with autocompletion and syntax highlighting
  cs: CLI pro postgres s automatickým dokončováním a zvýrazňováním syntaxe
  de: CLI für postgres mit Autovervollständigung und Syntaxhervorhebung
  es: CLI para postgres con autocompletado y resaltado de sintaxis
  fr: CLI pour postgres avec complétion automatique et coloration syntaxique
  id: CLI untuk postgres dengan penyelesaian otomatis dan penyorotan sintaks
  it: CLI per postgres con completamento automatico ed evidenziazione della sintassi
  ja: postgres 用の CLI、自動補完と構文ハイライトに対応
  ko: 자동 완성과 구문 강조 표시를 지원하는 postgres용 CLI
  pl: CLI dla postgres z autouzupełnianiem i podświetlaniem składni
  pt: CLI para postgres com preenchimento automático e realce de sintaxe
  ro: CLI pentru postgres cu completare automată și evidențierea sintaxei
  ru: CLI для postgres с автодополнением и подсветкой синтаксиса
  th: CLI สำหรับ postgres พร้อมการเติมข้อความอัตโนมัติและการไฮไลต์ไวยากรณ์
  tr: Otomatik tamamlama ve sözdizimi vurgulama özellikleriyle postgres için CLI
  uk: CLI для postgres з автозавершенням та підсвічуванням синтаксису
  vi: CLI cho postgres với tính năng tự động hoàn thành và tô sáng cú pháp
x:
  source: https://github.com/dbcli/pgcli
  apt: pgcli
  brew: pgcli
  apt-get: pgcli
rule:
  /x:
    cmd: x pkg use pgcli
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install -U pgcli
    reference: https://github.com/dbcli/pgcli#quick-start
    dsnap: pgcli
  darwin/brew:
    cmd: brew install pgcli
    reference: https://formulae.brew.sh/formula/pgcli#default
  debian/apt:
    cmd: sudo apt install pgcli
    reference: https://command-not-found.com/pgcli
    dsnap: pgcli
  ubuntu/apt:
    cmd: sudo apt install pgcli
    reference: https://command-not-found.com/pgcli
    dsnap: pgcli
  kali/apt:
    cmd: sudo apt install pgcli
    reference: https://command-not-found.com/pgcli
    dsnap: pgcli
  raspbian/apt:
    cmd: sudo apt-get install pgcli
    reference: https://command-not-found.com/pgcli
binlist:
- pgcli

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 26 KB
          rating: 1
          desc:
            cn: 约 26 KB（估算）
            en: ~26 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
