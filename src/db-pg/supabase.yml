lang: Go
homepage: https://github.com/supabase/cli
desc:
  en: Manage postgres migrations, run Supabase locally, deploy edge functions. Postgres backups. Generating types from your database schema
  cn: 管理 postgres 迁移，本地运行 Supabase, 部署边缘函数。Postgres 备份。从数据库模式生成类型
  cs: Spravujte migrace postgres, spouštějte Supabase lokálně, nasazujte edge funkce. Zálohy Postgres. Generování typů ze schématu databáze
  de: Postgres-Migrationen verwalten, Supabase lokal ausführen, Edge Functions bereitstellen. Postgres-Backups. Typen aus dem Datenbankschema generieren
  es: Gestiona migraciones de postgres, ejecuta Supabase localmente, despliega funciones edge. Copias de seguridad de Postgres. Generar tipos a partir del esquema de la base de datos
  fr: Gérer les migrations postgres, exécuter Supabase localement, déployer des fonctions edge. Sauvegardes Postgres. Générer des types à partir du schéma de la base de données
  id: Kelola migrasi postgres, jalankan Supabase secara lokal, deploy edge function. Cadangan Postgres. Membuat tipe dari skema basis data
  it: Gestisci le migrazioni postgres, esegui Supabase localmente, distribuisci le edge function. Backup di Postgres. Generazione dei tipi dallo schema del database
  ja: postgres のマイグレーション管理、Supabase のローカル実行、edge 関数のデプロイ。Postgres のバックアップ。データベーススキーマから型の生成
  ko: postgres 마이그레이션 관리, Supabase 로컬 실행, edge 함수 배포. Postgres 백업. 데이터베이스 스키마에서 타입 생성
  pl: Zarządzaj migracjami postgres, uruchamiaj Supabase lokalnie, wdrażaj funkcje edge. Kopie zapasowe Postgres. Generowanie typów ze schematu bazy danych
  pt: Gerencie migrações do postgres, execute o Supabase localmente, implant edge functions. Backups do Postgres. Gerando tipos a partir do esquema do banco de dados
  ro: Gestionați migrările postgres, rulați Supabase local, deployați funcții edge. Copii de rezervă Postgres. Generarea tipurilor din schema bazei de date
  ru: Управление миграциями postgres, локальный запуск Supabase, развёртывание edge-функций. Резервные копии Postgres. Генерация типов из схемы базы данных
  th: จัดการการย้ายข้อมูล postgres, เรียกใช้ Supabase ในเครื่อง, ปล่อย edge functions. สำรองข้อมูล Postgres. สร้างชนิดข้อมูลจากสคีมาฐานข้อมูล
  tr: postgres geçişlerini yönetin, Supabase'i yerel olarak çalıştırın, edge fonksiyonları dağıtın. Postgres yedekleri. Veritabanı şemasından tür oluşturma
  uk: Керування міграціями postgres, локальний запуск Supabase, розгортання edge-функцій. Резервні копії Postgres. Генерація типів зі схеми бази даних
  vi: Quản lý migration postgres, chạy Supabase cục bộ, triển khai edge function. Sao lưu Postgres. Tạo kiểu dữ liệu từ schema cơ sở dữ liệu
x:
  source: https://github.com/supabase/cli
  eget: supabase/cli
  brew: supabase/tap/supabase
  scoop: supabase
  yay: supabase-bin
  npm: supabase
  go: github.com/supabase/cli@latest
rule:
  /eget:
    cmd: x eget supabase/cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install supabase/tap/supabase
    reference: https://github.com/supabase/cli?tab=readme-ov-file#install-the-cli
  /npm:
    cmd: npm install -g supabase
    reference: https://www.npmjs.com/package/supabase
    dsnap: supabase
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add supabase https://github.com/supabase/scoop-bucket.git && x scoop install supabase

      '
    reference: https://scoop.sh/#/apps?q=supabase
  /go:
    cmd: go install github.com/supabase/cli@latest
    reference: https://github.com/supabase/cli?tab=readme-ov-file#install-the-cli
    dsnap: github.com/supabase/cli
  /pkgx:
    cmd: pkgx install supabase
    reference: https://github.com/supabase/cli?tab=readme-ov-file#install-the-cli
  arch/yay:
    cmd: yay -S supabase-bin
    reference: https://aur.archlinux.org/packages/supabase-bin
binlist:
- supabase
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
