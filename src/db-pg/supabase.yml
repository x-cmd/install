lang: Go
homepage: https://github.com/supabase/cli
desc:
  en: Manage postgres migrations, run Supabase locally, deploy edge functions. Postgres backups. Generating types from your database schema
  cn: 管理 postgres 迁移，本地运行 Supabase, 部署边缘函数。Postgres 备份。从数据库模式生成类型
x:
  source: https://github.com/supabase/cli
  eget: https://github.com/supabase/cli
rule:
  /eget:
    cmd: x eget supabase/cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install supabase/tap/supabase
    reference: https://github.com/supabase/cli?tab=readme-ov-file#install-the-cli
  /npm:
    cmd: npm install -g supabase
    reference: https://www.npmjs.com/package/supabase
    dsnap: supabase
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add supabase https://github.com/supabase/scoop-bucket.git && x scoop install supabase

      '
    reference: https://scoop.sh/#/apps?q=supabase
  /go:
    cmd: go install github.com/supabase/cli@latest
    reference: https://github.com/supabase/cli?tab=readme-ov-file#install-the-cli
    dsnap: github.com/supabase/cli
  /pkgx:
    cmd: pkgx install supabase
    reference: https://github.com/supabase/cli?tab=readme-ov-file#install-the-cli
  arch/yay:
    cmd: yay -S supabase-bin
    reference: https://aur.archlinux.org/packages/supabase-bin
binlist:
- supabase
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
