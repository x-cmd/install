lang: Shell
homepage: https://github.com/Vonng/pigsty
license: Apache-2.0
desc:
  cn: Pigsty 是一个更好的本地开源 RDS for PostgreSQL 替代
  en: Pigsty is a Me-Better Open-Source RDS Alternative
  cs: Pigsty je lepší open source alternativa k RDS
  de: Pigsty ist die bessere quelloffene RDS-Alternative
  es: Pigsty es una alternativa de código abierto mejor que RDS
  fr: Pigsty est une alternative open source préférable à RDS
  id: Pigsty adalah alternatif RDS sumber terbuka yang lebih baik
  it: Pigsty è un'alternativa open source migliore di RDS
  ja: Pigsty はより優れたオープンソースの RDS 代替です
  ko: Pigsty는 더 나은 오픈 소스 RDS 대안입니다
  pl: Pigsty to lepsza otwartoźródłowa alternatywa dla RDS
  pt: Pigsty é uma alternativa de código aberto melhor que o RDS
  ro: Pigsty este o alternativă open source mai bună decât RDS
  ru: Pigsty — лучшая открытая альтернатива RDS
  th: Pigsty เป็นทางเลือกโอเพนซอร์สที่ดีกว่า RDS
  tr: Pigsty, RDS'den daha iyi bir açık kaynak alternatiftir
  uk: Pigsty — краща відкрита альтернатива RDS
  vi: Pigsty là lựa chọn thay thế RDS mã nguồn mở tốt hơn
x:
  source: https://github.com/Vonng/pigsty
rule:
  /curl:
    cmd: 'curl https://get.pigsty.cc/latest | bash

      '
    reference: https://pigsty.cc/zh/docs/install/
binlist:
- pigsty

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 GB
          rating: 5
          desc:
            cn: 安装 2 GB
            en: 2 GB install
        download:
          estimate: 2 GB
          desc:
            cn: 约 2 GB 下载 (macos/x64)
            en: ~2 GB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
