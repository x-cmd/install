lang: Shell
homepage: https://github.com/Vonng/pigsty
license: Apache-2.0
desc:
  cn: Pigsty 是一个更好的本地开源 RDS for PostgreSQL 替代
  en: Pigsty is a Me-Better Open-Source RDS Alternative
x:
  source: https://github.com/Vonng/pigsty
rule:
  /curl:
    cmd: 'curl https://get.pigsty.cc/latest | bash

      '
    reference: https://pigsty.cc/zh/docs/install/
binlist:
- pigsty

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 GB
          rating: 5
          desc:
            cn: 安装 2 GB
            en: 2 GB install
        download:
          estimate: 2 GB
          desc:
            cn: 约 2 GB 下载 (macos/x64)
            en: ~2 GB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
