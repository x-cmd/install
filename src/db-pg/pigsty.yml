lang: Shell
homepage: https://github.com/Vonng/pigsty
license: Apache-2.0
desc:
  cn: Pigsty 是一个更好的本地开源 RDS for PostgreSQL 替代
  en: Pigsty is a Me-Better Open-Source RDS Alternative
x:
  source: https://github.com/Vonng/pigsty
rule:
  /curl:
    cmd: 'curl https://get.pigsty.cc/latest | bash

      '
    reference: https://pigsty.cc/zh/docs/install/
binlist:
- pigsty

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
