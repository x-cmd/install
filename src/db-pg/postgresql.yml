lang: C
homepage: https://github.com/postgres/postgres
desc:
  cn: PostgreSQL 是一个功能强大的开源对象关系数据库系统
  en: PostgreSQL is a powerful, open source object-relational database system
  cs: PostgreSQL je výkonný open source objektově-relační databázový systém
  de: PostgreSQL ist ein leistungsfähiges Open-Source-Objekt-Relational-Datenbanksystem
  es: PostgreSQL es un potente sistema de base de datos objeto-relacional de código abierto
  fr: PostgreSQL est un système de base de données objet-relationnel open source puissant
  id: PostgreSQL adalah sistem basis data objek-relasional open source yang kuat
  it: PostgreSQL è un potente sistema di gestione di database relazionali a oggetti open source
  ja: PostgreSQL は強力なオープンソースのオブジェクトリレーショナルデータベースシステムです
  ko: PostgreSQL은 강력한 오픈 소스 객체 관계형 데이터베이스 시스템입니다
  pl: PostgreSQL to potężny, open source'owy obiektowo-relacyjny system baz danych
  pt: O PostgreSQL é um poderoso sistema de banco de dados objeto-relacional de código aberto
  ro: PostgreSQL este un puternic sistem de baze de date obiect-relational open source
  ru: PostgreSQL — мощная объектно-реляционная система управления базами данных с открытым исходным кодом
  th: PostgreSQL คือระบบฐานข้อมูลเชิงวัตถุ-สัมพันธ์แบบโอเพนซอร์สที่ทรงพลัง
  tr: PostgreSQL, güçlü, açık kaynaklı bir nesne-ilişkisel veritabanı sistemidir
  uk: PostgreSQL — потужна об'єктно-реляційна система керування базами даних з відкритим кодом
  vi: PostgreSQL là một hệ quản trị cơ sở dữ liệu quan hệ-đối tượng mã nguồn mở mạnh mẽ
x:
  source: https://github.com/postgres/postgres
  dnf: postgresql-server
  yum: postgresql-server
rule:
  debian/apt:
    cmd: 'sudo sh -c ''echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'' \

      && wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add - \

      && sudo apt-get update \

      && sudo apt-get -y install postgresql \

      '
    reference: https://www.postgresql.org/download/linux/debian/
    dsnap: postgresql
  ubuntu/apt:
    cmd: 'sudo sh -c ''echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'' \

      && wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add - \

      && sudo apt-get update \

      && sudo apt-get -y install postgresql

      '
    reference: https://www.postgresql.org/download/linux/ubuntu/
    dsnap: postgresql
  centos/yum:
    cmd: sudo yum install postgresql-server
    reference: https://command-not-found.com/postgresql-setup
  fedora/dnf:
    cmd: sudo dnf install postgresql-server
    reference: https://command-not-found.com/postgresql-setup
binlist:
- postgresql
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
