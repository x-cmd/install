lang: Python
homepage: https://github.com/dbcli/vcli
desc:
  cn: Vertica 是一个基于 pgcli 的自动完成和语法突显的客户端
  en: A Vertica client that does auto-completion and syntax highlighting, based on pgcli
x:
  source: https://github.com/dbcli/vcli
rule:
  /pip:
    cmd: pip install vcli
    reference: https://github.com/dbcli/vcli#installation
    dsnap: vcli
binlist:
- vcli
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 KB
          rating: 1
          desc:
            cn: 约 14 KB（估算）
            en: ~14 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
