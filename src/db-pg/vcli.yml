lang: Python
homepage: https://github.com/dbcli/vcli
desc:
  cn: Vertica 是一个基于 pgcli 的自动完成和语法突显的客户端
  en: A Vertica client that does auto-completion and syntax highlighting, based on pgcli
x:
  source: https://github.com/dbcli/vcli
rule:
  /pip:
    cmd: pip install vcli
    reference: https://github.com/dbcli/vcli#installation
    dsnap: vcli
binlist:
- vcli
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
