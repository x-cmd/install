lang: Go
homepage: https://github.com/redhat-developer/odo
license: Apache-2.0
desc:
  cn: Odo 是一个快速、迭代和直观的 CLI 工具，适用于在 Kubernetes 上编写、构建和部署应用程序的开发人员
  en: odo is a fast, iterative and straightforward CLI tool for developers who write, build, and deploy applications on Kubernetes
  cs: odo je rychlé, iterativní a přímé CLI nástroj pro vývojáře, kteří píší, sestavují a nasazují aplikace na Kubernetes
  de: odo ist ein schnelles, iteratives und unkompliziertes CLI-Tool für Entwickler, die Anwendungen auf Kubernetes schreiben, bauen und bereitstellen
  es: odo es una herramienta de CLI rápida, iterativa y sencilla para desarrolladores que escriben, compilan y despliegan aplicaciones en Kubernetes
  fr: odo est un outil CLI rapide, itératif et simple pour les développeurs qui écrivent, compilent et déploient des applications sur Kubernetes
  id: odo adalah alat CLI yang cepat, iteratif, dan sederhana bagi pengembang yang menulis, membangun, dan menerapkan aplikasi di Kubernetes
  it: odo è uno strumento CLI rapido, iterativo e intuitivo per sviluppatori che scrivono, compilano e distribuiscono applicazioni su Kubernetes
  ja: odo は Kubernetes 上でアプリケーションを書いて、ビルドして、デプロイする開発者向けの高速で反復的な CLI ツールです
  ko: odo는 Kubernetes에서 애플리케이션을 작성, 빌드 및 배포하는 개발자를 위한 빠르고 반복적인 CLI 도구입니다
  pl: odo to szybkie, iteracyjne i przejrzyste narzędzie CLI dla deweloperów, którzy tworzą, budują i wdrażają aplikacje na Kubernetes
  pt: odo é uma ferramenta de CLI rápida, iterativa e direta para desenvolvedores que escrevem, compilam e implantam aplicações no Kubernetes
  ro: odo este un instrument CLI rapid, iterativ și simplu pentru dezvoltatorii care scriu, construiesc și implementează aplicații pe Kubernetes
  ru: odo — быстрый, итеративный и простой CLI-инструмент для разработчиков, которые пишут, собирают и разворачивают приложения в Kubernetes
  th: odo เป็นเครื่องมือ CLI ที่รวดเร็ว วนซ้ำได้ และใช้งานง่าย สำหรับนักพัฒนาที่เขียน สร้าง และประสงค์แอปพลิเคชันบน Kubernetes
  tr: odo, Kubernetes üzerinde uygulama yazan, derleyen ve dağıtan geliştiriciler için hızlı, yinelemeli ve anlaşılır bir CLI aracıdır
  uk: odo — швидкий, ітеративний і простий CLI-інструмент для розробників, які пишуть, збирають і розгортають застосунки в Kubernetes
  vi: odo là công cụ CLI nhanh, lặp lại và trực quan dành cho các nhà phát triển viết, xây dựng và triển khai ứng dụng trên Kubernetes
x:
  source: https://github.com/redhat-developer/odo
  brew: odo-dev
  asdf: odo
rule:
  linux/curl:
    cmd: 'curl -L https://developers.redhat.com/content-gateway/rest/mirror/pub/openshift-v4/clients/odo/v3.15.0/odo-linux-amd64 -o odo \

      && curl -L https://developers.redhat.com/content-gateway/rest/mirror/pub/openshift-v4/clients/odo/v3.15.0/odo-linux-amd64.sha256 -o odo.sha256 \

      && echo "$(<odo.sha256)  odo" | shasum -a 256 --check \

      && sudo install -o root -g root -m 0755 odo /usr/local/bin/odo

      '
    reference: https://odo.dev/docs/overview/installation#linux
  darwin/brew:
    cmd: brew install odo-dev
    reference: https://odo.dev/docs/overview/installation#macos
  win/powershell:
    cmd: curl -L https://developers.redhat.com/content-gateway/rest/mirror/pub/openshift-v4/clients/odo/v3.15.0/odo-windows-amd64.exe -o odo.exe
    reference: https://odo.dev/docs/overview/installation#windows
  /asdf:
    cmd: x asdf use odo
    reference: https://github.com/asdf-community/asdf-odo?tab=readme-ov-file#install
binlist:
- odo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.1 MB
          rating: 1
          desc:
            cn: 约 9.1 MB（估算）
            en: ~9.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
