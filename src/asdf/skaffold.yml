lang: Go
homepage: https://github.com/GoogleContainerTools/skaffold
license: Apache-2.0
desc:
  cn: Skaffold 是一种命令行工具，可促进基于容器的＆ Kubernetes 应用程序的连续开发
  en: Skaffold is a command line tool that facilitates continuous development for container based & Kubernetes applications
x:
  source: https://github.com/GoogleContainerTools/skaffold
  eget: https://github.com/GoogleContainerTools/skaffold
rule:
  /eget:
    cmd: x eget GoogleContainerTools/skaffold
    reference: https://x-cmd.com/mod/eget
  linux/curl:
    cmd: 'curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 && \

      sudo install skaffold /usr/local/bin/

      '
    reference: https://skaffold.dev/docs/install/#standalone-binary
  darwin/curl:
    cmd: 'curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-darwin-arm64 && \

      sudo install skaffold /usr/local/bin/

      '
    reference: https://skaffold.dev/docs/install/#standalone-binary
  darwin/brew:
    cmd: brew install skaffold
    reference: https://skaffold.dev/docs/install/#homebrew
  darwin/port:
    cmd: sudo port install skaffold
    reference: https://skaffold.dev/docs/install/#macports
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install skaffold
    reference: https://skaffold.dev/docs/install/#scoop
  (win|wsl2)/choco:
    cmd: x choco install -y skaffold
    reference: https://skaffold.dev/docs/install/#chocolatey
  /asdf:
    cmd: x asdf use skaffold
    reference: https://github.com/nklmilojevic/asdf-skaffold?tab=readme-ov-file#install
binlist:
- skaffold

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
