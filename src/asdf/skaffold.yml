lang: Go
homepage: https://github.com/GoogleContainerTools/skaffold
license: Apache-2.0
desc:
  cn: Skaffold 是一种命令行工具，可促进基于容器的＆ Kubernetes 应用程序的连续开发
  en: Skaffold is a command line tool that facilitates continuous development for container based & Kubernetes applications
  cs: Skaffold je nástroj příkazové řádky, který usnadňuje průběžný vývoj aplikací založených na kontejnerech a Kubernetes
  de: Skaffold ist ein Kommandozeilenwerkzeug, das die kontinuierliche Entwicklung für containerbasierte und Kubernetes-Anwendungen erleichtert
  es: Skaffold es una herramienta de línea de comandos que facilita el desarrollo continuo de aplicaciones basadas en contenedores y en Kubernetes
  fr: Skaffold est un outil en ligne de commande qui facilite le développement continu des applications basées sur des conteneurs et Kubernetes
  id: Skaffold adalah alat baris perintah yang memfasilitasi pengembangan berkelanjutan untuk aplikasi berbasis container dan Kubernetes
  it: Skaffold è uno strumento da riga di comando che facilita lo sviluppo continuo per applicazioni basate su container e Kubernetes
  ja: Skaffold は、コンテナおよび Kubernetes アプリケーションの継続的開発を容易にするコマンドラインツールです
  ko: Skaffold는 컨테이너 기반 및 Kubernetes 애플리케이션의 지속적 개발을 지원하는 명령줄 도구입니다
  pl: Skaffold to narzędzie wiersza poleceń ułatwiające ciągły rozwój aplikacji opartych na kontenerach i Kubernetes
  pt: Skaffold é uma ferramenta de linha de comando que facilita o desenvolvimento contínuo de aplicações baseadas em contêineres e Kubernetes
  ro: Skaffold este o instrument de linie de comandă care facilitează dezvoltarea continuă pentru aplicații bazate pe containere și Kubernetes
  ru: Skaffold — инструмент командной строки, упрощающий непрерывную разработку контейнерных приложений и приложений на Kubernetes
  th: Skaffold คือเครื่องมือบรรทัดคำสั่งที่ช่วยให้การพัฒนาอย่างต่อเนื่องสำหรับแอปพลิเคชันบนพื้นฐานคอนเทนเนอร์และ Kubernetes ง่ายขึ้น
  tr: Skaffold, konteyner ve Kubernetes tabanlı uygulamalar için sürekli geliştirmeyi kolaylaştıran bir komut satırı aracıdır
  uk: Skaffold — інструмент командного рядка, що спрощує безперервну розробку застосунків на основі контейнерів і Kubernetes
  vi: Skaffold là công cụ dòng lệnh hỗ trợ phát triển liên tục cho các ứng dụng dựa trên container và Kubernetes
x:
  source: https://github.com/GoogleContainerTools/skaffold
  eget: GoogleContainerTools/skaffold
  brew: skaffold
  port: skaffold
  scoop: skaffold
  choco: skaffold
  asdf: skaffold
rule:
  /eget:
    cmd: x eget GoogleContainerTools/skaffold
    reference: https://x-cmd.com/mod/eget
  linux/curl:
    cmd: 'curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 && \

      sudo install skaffold /usr/local/bin/

      '
    reference: https://skaffold.dev/docs/install/#standalone-binary
  darwin/curl:
    cmd: 'curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-darwin-arm64 && \

      sudo install skaffold /usr/local/bin/

      '
    reference: https://skaffold.dev/docs/install/#standalone-binary
  darwin/brew:
    cmd: brew install skaffold
    reference: https://skaffold.dev/docs/install/#homebrew
  darwin/port:
    cmd: sudo port install skaffold
    reference: https://skaffold.dev/docs/install/#macports
  (win|wsl2)/scoop:
    cmd: x scoop bucket add extras && x scoop install skaffold
    reference: https://skaffold.dev/docs/install/#scoop
  (win|wsl2)/choco:
    cmd: x choco install -y skaffold
    reference: https://skaffold.dev/docs/install/#chocolatey
  /asdf:
    cmd: x asdf use skaffold
    reference: https://github.com/nklmilojevic/asdf-skaffold?tab=readme-ov-file#install
binlist:
- skaffold

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 124 MB
          rating: 3
          desc:
            cn: 安装 124 MB
            en: 124 MB install
        download:
          estimate: 124 MB
          desc:
            cn: 约 124 MB 下载 (linux/x64)
            en: ~124 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
