lang: Go
homepage: https://github.com/siderolabs/talos
license: MPL-2.0
desc:
  cn: Talos Linux 控制应用程序的设计和使用
  en: The design and use of the Talos Linux control application
x:
  source: https://github.com/siderolabs/talos
  eget: siderolabs/talos
  asdf: talosctl
rule:
  /eget:
    cmd: x eget siderolabs/talos
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use talosctl
    reference: https://github.com/bjw-s/asdf-talosctl?tab=readme-ov-file#install
binlist:
- talosctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
