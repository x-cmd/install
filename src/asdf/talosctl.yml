lang: Go
homepage: https://github.com/siderolabs/talos
license: MPL-2.0
desc:
  cn: Talos Linux 控制应用程序的设计和使用
  en: The design and use of the Talos Linux control application
x:
  source: https://github.com/siderolabs/talos
  eget: https://github.com/siderolabs/talos
rule:
  /eget:
    cmd: x eget siderolabs/talos
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use talosctl
    reference: https://github.com/bjw-s/asdf-talosctl?tab=readme-ov-file#install
binlist:
- talosctl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
