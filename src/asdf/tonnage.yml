lang: Go
homepage: https://github.com/elementalvoid/tonnage
license: Apache-2.0
desc:
  cn: Tonnage 是一个小型实用程序，用于总结 Kubernetes 集群的资源容量和分配
  en: Tonnage is a small utility to summarize the resource capacity and allocation of a Kubernetes cluster
x:
  source: https://github.com/elementalvoid/tonnage
  eget: https://github.com/elementalvoid/tonnage
rule:
  /eget:
    cmd: x eget elementalvoid/tonnage
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/elementalvoid/tonnage@latest
    reference: https://github.com/elementalvoid/tonnage?tab=readme-ov-file#source-install
    dsnap: github.com/elementalvoid/tonnage@latest
  /asdf:
    cmd: x asdf use tonnage
    reference: https://github.com/elementalvoid/asdf-tonnage?tab=readme-ov-file#install
binlist:
- tonnage

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 安装 12 MB
            en: 12 MB install
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
