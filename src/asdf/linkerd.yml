lang: Go
homepage: https://github.com/linkerd/linkerd2
license: Apache-2.0
desc:
  cn: Linkerd 是 Kubernetes 的服务网
  en: Linkerd is a service mesh for Kubernetes
x:
  source: https://github.com/linkerd/linkerd2
  eget: https://github.com/linkerd/linkerd2
rule:
  /eget:
    cmd: x eget linkerd/linkerd2
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -sSfL https://run.linkerd.io/install | sh
    reference: https://linkerd.io/2.14/getting-started/#step-1-install-the-cli
  /asdf:
    cmd: x asdf use linkerd
    reference: https://github.com/kforsthoevel/asdf-linkerd?tab=readme-ov-file#install
binlist:
- linkerd

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
