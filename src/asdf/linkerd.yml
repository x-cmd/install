lang: Go
homepage: https://github.com/linkerd/linkerd2
license: Apache-2.0
desc:
  cn: Linkerd 是 Kubernetes 的服务网
  en: Linkerd is a service mesh for Kubernetes
  cs: Linkerd je service mesh pro Kubernetes
  de: Linkerd ist ein Service Mesh für Kubernetes
  es: Linkerd es un service mesh para Kubernetes
  fr: Linkerd est un service mesh pour Kubernetes
  id: Linkerd adalah service mesh untuk Kubernetes
  it: Linkerd è un service mesh per Kubernetes
  ja: Linkerd は Kubernetes 用のサービスメッシュです
  ko: Linkerd는 Kubernetes용 서비스 메시입니다
  pl: Linkerd to siatka usług dla Kubernetes
  pt: Linkerd é uma service mesh para Kubernetes
  ro: Linkerd este un service mesh pentru Kubernetes
  ru: Linkerd — это service mesh для Kubernetes
  th: Linkerd คือ service mesh สำหรับ Kubernetes
  tr: Linkerd, Kubernetes için bir servis ağıdır
  uk: Linkerd — це сервісна сітка для Kubernetes
  vi: Linkerd là một service mesh cho Kubernetes
x:
  source: https://github.com/linkerd/linkerd2
  eget: linkerd/linkerd2
  asdf: linkerd
rule:
  /eget:
    cmd: x eget linkerd/linkerd2
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl --proto '=https' --tlsv1.2 -sSfL https://run.linkerd.io/install | sh
    reference: https://linkerd.io/2.14/getting-started/#step-1-install-the-cli
  /asdf:
    cmd: x asdf use linkerd
    reference: https://github.com/kforsthoevel/asdf-linkerd?tab=readme-ov-file#install
binlist:
- linkerd

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
