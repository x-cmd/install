lang: Go
homepage: https://github.com/aquasecurity/trivy-operator
license: Apache-2.0
desc:
  cn: kubernetes-native 安全工具包
  en: Kubernetes-native security toolkit
x:
  source: https://github.com/aquasecurity/trivy-operator
rule:
  /asdf:
    cmd: x adsf use starboard
    reference: https://github.com/zufardhiyaulhaq/asdf-starboard?tab=readme-ov-file#install
binlist:
- starboard

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
