lang: Go
homepage: https://github.com/aquasecurity/trivy-operator
license: Apache-2.0
desc:
  cn: kubernetes-native 安全工具包
  en: Kubernetes-native security toolkit
x:
  source: https://github.com/aquasecurity/trivy-operator
rule:
  /asdf:
    cmd: x adsf use starboard
    reference: https://github.com/zufardhiyaulhaq/asdf-starboard?tab=readme-ov-file#install
binlist:
- starboard

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
