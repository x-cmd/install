lang: Go
homepage: https://github.com/carvel-dev/kwt
license: Apache-2.0
desc:
  cn: Kwt (Kubernetes Workstation Tools) CLI 为应用程序开发人员用 Kubernetes 开发应用程序提供了一组有用的命令
  en: kwt (Kubernetes Workstation Tools) (pronounced spelled out) CLI provides helpful set of commands for application developers to develop applications with Kubernetes
x:
  source: https://github.com/carvel-dev/kwt
  eget: https://github.com/carvel-dev/kwt
rule:
  /eget:
    cmd: x eget carvel-dev/kwt
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use kwt
    reference: https://github.com/carvel-dev/asdf?tab=readme-ov-file#install
binlist:
- kwt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 34 MB
          rating: 2
          desc:
            cn: 安装 34 MB
            en: 34 MB install
        download:
          estimate: 34 MB
          desc:
            cn: 约 34 MB 下载 (linux/x64)
            en: ~34 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
