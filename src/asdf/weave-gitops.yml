lang: MDX
homepage: https://github.com/weaveworks/weave-gitops
license: Apache-2.0
desc:
  cn: Weave Gitops 是 Flux 的强大扩展，这是领先的 Gitops Engine and CNCF 项目
  en: Weave GitOps is a powerful extension to Flux, a leading GitOps engine and CNCF project
x:
  source: https://github.com/weaveworks/weave-gitops
  brew: weaveworks/tap/gitops
rule:
  /curl:
    cmd: 'curl --silent --location "https://github.com/weaveworks/weave-gitops/releases/download/v0.38.0/gitops-$(uname)-$(uname -m).tar.gz" | tar xz -C /tmp \

      && sudo mv /tmp/gitops /usr/local/bin \

      && gitops version

      '
    reference: https://docs.gitops.weave.works/docs/open-source/getting-started/install-OSS/#install-the-gitops-cli
  darwin/brew:
    cmd: 'brew tap weaveworks/tap \

      && brew install weaveworks/tap/gitops

      '
    reference: https://docs.gitops.weave.works/docs/open-source/getting-started/install-OSS/#install-the-gitops-cli
  /asdf:
    cmd: x asdf use weave-gitops
    reference: https://github.com/deas/asdf-weave-gitops?tab=readme-ov-file#install
binlist:
- weave-gitops

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7.1 MB
          rating: 1
          desc:
            cn: 约 7.1 MB（估算）
            en: ~7.1 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
