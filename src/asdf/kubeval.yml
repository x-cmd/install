lang: Go
homepage: https://github.com/instrumenta/kubeval
desc:
  cn: Kubeval 是用于验证 Kubernetes YAML 或 JSON 配置文件的工具
  en: kubeval is a tool for validating a Kubernetes YAML or JSON configuration file
x:
  source: https://github.com/instrumenta/kubeval
  eget: https://github.com/instrumenta/kubeval
rule:
  /eget:
    cmd: x eget instrumenta/kubeval
    reference: https://x-cmd.com/mod/eget
  linux/wget:
    cmd: 'wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz \

      && tar xf kubeval-linux-amd64.tar.gz \

      && sudo cp kubeval /usr/local/bin

      '
    reference: https://www.kubeval.com/installation/#linux
  darwin/wget:
    cmd: 'wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-darwin-amd64.tar.gz \

      && tar xf kubeval-darwin-amd64.tar.gz \

      && sudo cp kubeval /usr/local/bin

      '
    reference: https://www.kubeval.com/installation/#macos
  /berw:
    cmd: 'brew tap instrumenta/instrumenta \

      && brew install c

      '
    reference: https://www.kubeval.com/installation/#macos
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add instrumenta https://github.com/instrumenta/scoop-instrumenta \

      && x scoop install kubeval

      '
    reference: https://www.kubeval.com/installation/#windows
  /asdf:
    cmd: x asdf use kubeval
    reference: https://github.com/stefansedich/asdf-kubeval?tab=readme-ov-file#install
binlist:
- kubeval
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
