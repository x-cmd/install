lang: Go
homepage: https://github.com/instrumenta/kubeval
desc:
  cn: Kubeval 是用于验证 Kubernetes YAML 或 JSON 配置文件的工具
  en: kubeval is a tool for validating a Kubernetes YAML or JSON configuration file
  cs: kubeval je nástroj pro validaci konfiguračních souborů Kubernetes ve formátu YAML nebo JSON
  de: kubeval ist ein Werkzeug zum Validieren von Kubernetes-YAML- oder JSON-Konfigurationsdateien
  es: kubeval es una herramienta para validar archivos de configuración YAML o JSON de Kubernetes
  fr: kubeval est un outil pour valider un fichier de configuration YAML ou JSON de Kubernetes
  id: kubeval adalah alat untuk memvalidasi berkas konfigurasi YAML atau JSON pada Kubernetes
  it: kubeval è uno strumento per convalidare i file di configurazione YAML o JSON di Kubernetes
  ja: kubeval は Kubernetes の YAML または JSON 設定ファイルを検証するツールです
  ko: kubeval은 Kubernetes YAML 또는 JSON 구성 파일을 검증하는 도구입니다
  pl: kubeval to narzędzie do walidacji plików konfiguracyjnych Kubernetes w formacie YAML lub JSON
  pt: O kubeval é uma ferramenta para validar arquivos de configuração YAML ou JSON do Kubernetes
  ro: kubeval este un instrument pentru validarea fișierelor de configurare Kubernetes în format YAML sau JSON
  ru: kubeval — это инструмент для проверки конфигурационных файлов Kubernetes в формате YAML или JSON
  th: kubeval เป็นเครื่องมือสำหรับตรวจสอบไฟล์คอนฟิก YAML หรือ JSON ของ Kubernetes
  tr: kubeval, Kubernetes YAML veya JSON yapılandırma dosyalarını doğrulamak için bir araçtır
  uk: kubeval — це інструмент для перевірки конфігураційних файлів Kubernetes у форматі YAML або JSON
  vi: kubeval là công cụ để kiểm tra tệp cấu hình YAML hoặc JSON của Kubernetes
x:
  source: https://github.com/instrumenta/kubeval
  eget: instrumenta/kubeval
  brew: c
  scoop: kubeval
  asdf: kubeval
rule:
  /eget:
    cmd: x eget instrumenta/kubeval
    reference: https://x-cmd.com/mod/eget
  linux/wget:
    cmd: 'wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz \

      && tar xf kubeval-linux-amd64.tar.gz \

      && sudo cp kubeval /usr/local/bin

      '
    reference: https://www.kubeval.com/installation/#linux
  darwin/wget:
    cmd: 'wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-darwin-amd64.tar.gz \

      && tar xf kubeval-darwin-amd64.tar.gz \

      && sudo cp kubeval /usr/local/bin

      '
    reference: https://www.kubeval.com/installation/#macos
  /berw:
    cmd: 'brew tap instrumenta/instrumenta \

      && brew install c

      '
    reference: https://www.kubeval.com/installation/#macos
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add instrumenta https://github.com/instrumenta/scoop-instrumenta \

      && x scoop install kubeval

      '
    reference: https://www.kubeval.com/installation/#windows
  /asdf:
    cmd: x asdf use kubeval
    reference: https://github.com/stefansedich/asdf-kubeval?tab=readme-ov-file#install
binlist:
- kubeval
license: NOASSERTION

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7.1 MB
          rating: 1
          desc:
            cn: 安装 7.1 MB
            en: 7.1 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
