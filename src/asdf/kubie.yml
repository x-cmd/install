lang: Rust
homepage: https://github.com/kubie-org/kubie
license: Zlib
desc:
  cn: Kubie 是 kubectx、 kubens 和 k on 提示修改脚本的替代品
  en: kubie is an alternative to kubectx, kubens and the k on prompt modification script
  cs: kubie je alternativou k nástrojům kubectx, kubens a skriptu pro úpravu promptu k
  de: kubie ist eine Alternative zu kubectx, kubens und dem Skript zur Änderung der k-Prompt
  es: kubie es una alternativa a kubectx, kubens y el script de modificación del prompt k
  fr: kubie est une alternative à kubectx, kubens et au script de modification de l'invite k
  id: kubie adalah alternatif untuk kubectx, kubens, dan skrip modifikasi prompt k
  it: kubie è un'alternativa a kubectx, kubens e allo script di modifica del prompt k
  ja: kubie は kubectx、kubens および k プロンプト変更スクリプトの代替となるツールです
  ko: kubie는 kubectx, kubens 및 k 프롬프트 수정 스크립트의 대체재입니다
  pl: kubie to alternatywa dla kubectx, kubens oraz skryptu modyfikującego prompt k
  pt: O kubie é uma alternativa ao kubectx, ao kubens e ao script de modificação do prompt k
  ro: kubie este o alternativă pentru kubectx, kubens și scriptul de modificare a promptului k
  ru: kubie — альтернатива kubectx, kubens и скрипту изменения prompt k
  th: kubie เป็นทางเลือกแทน kubectx, kubens และสคริปต์แก้ไข prompt k
  tr: kubie, kubectx, kubens ve k prompt değiştirme betiğine bir alternatiftir
  uk: kubie — це альтернатива kubectx, kubens і скрипту зміни prompt k
  vi: kubie là lựa chọn thay thế cho kubectx, kubens và script sửa đổi prompt k
x:
  source: https://github.com/kubie-org/kubie
  eget: sbstp/kubie
  brew: kubie
  pacman: kubie
  port: kubie
  cargo: kubie
  asdf: kubie
rule:
  /eget:
    cmd: x eget sbstp/kubie
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install kubie
    reference: https://github.com/kubie-org/kubie?tab=readme-ov-file#cargo
    dsnap: kubie
  darwin/port:
    cmd: sudo port install kubie
    reference: https://github.com/kubie-org/kubie?tab=readme-ov-file#macports
  darwin/brew:
    cmd: brew install kubie
    reference: https://github.com/kubie-org/kubie?tab=readme-ov-file#homebrew
  arch/pacman:
    cmd: sudo pacman -S kubie
    reference: https://github.com/kubie-org/kubie?tab=readme-ov-file#arch-linux
  /asdf:
    cmd: x asdf use kubie
    reference: https://github.com/johnhamelink/asdf-kubie
binlist:
- kubie

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
