lang: Go
homepage: https://github.com/open-policy-agent/gatekeeper
license: Apache-2.0
desc:
  cn: Gatekeeper 是一个验证和变异的 Webhook，它强制执行由开放策略代理执行的基于 CRD 的策略，开放策略代理是 CNCF 作为毕业项目托管的云原生环境的策略引擎
  en: Gatekeeper is a validating and mutating webhook that enforces CRD-based policies executed by Open Policy Agent, a policy engine for Cloud Native environments hosted by CNCF as a graduated project
x:
  source: https://github.com/open-policy-agent/gatekeeper
  eget: https://github.com/open-policy-agent/gatekeeper
rule:
  /eget:
    cmd: x eget open-policy-agent/gatekeeper
    reference: https://x-cmd.com/mod/eget
  /helm:
    cmd: 'helm repo add gatekeeper https://open-policy-agent.github.io/gatekeeper/charts \

      && helm install gatekeeper/gatekeeper --name-template=gatekeeper --namespace gatekeeper-system --create-namespace

      '
    reference: https://open-policy-agent.github.io/gatekeeper/website/docs/install#deploying-via-helm
  /asdf:
    cmd: x asdf use gator
    reference: https://github.com/MxNxPx/asdf-gator?tab=readme-ov-file#install
binlist:
- gator

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
