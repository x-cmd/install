lang: Go
homepage: https://tlr.dev/
desc:
  cn: Teller 是支持云本地应用程序和多个云提供商的开发人员的生产力秘密管理器
  en: Teller is a productivity secret manager for developers supporting cloud-native apps and multiple cloud providers
rule:
  darwin/brew:
    cmd: brew tap spectralops/tap && brew install teller
    reference: https://tlr.dev/#install
  /asdf:
    cmd: x asdf use teller
    reference: https://github.com/pdemagny/asdf-teller?tab=readme-ov-file#install

x:
  brew: teller
  asdf: teller
binlist:
- teller
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
