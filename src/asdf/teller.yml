lang: Go
homepage: https://tlr.dev/
desc:
  cn: Teller 是支持云本地应用程序和多个云提供商的开发人员的生产力秘密管理器
  en: Teller is a productivity secret manager for developers supporting cloud-native apps and multiple cloud providers
rule:
  darwin/brew:
    cmd: brew tap spectralops/tap && brew install teller
    reference: https://tlr.dev/#install
  /asdf:
    cmd: x asdf use teller
    reference: https://github.com/pdemagny/asdf-teller?tab=readme-ov-file#install
binlist:
- teller
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
