lang: Go
homepage: https://github.com/pipe-cd/pipecd
license: Apache-2.0
desc:
  cn: 一个 gitOps 风格的持续交付平台，为任何应用程序提供一致的部署和操作体验
  en: A GitOps style continuous delivery platform that provides consistent deployment and operations experience for any applications
x:
  source: https://github.com/pipe-cd/pipecd
  eget: https://github.com/pipe-cd/pipecd
  asdf: pipectl
rule:
  /eget:
    cmd: x eget pipe-cd/pipecd
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use pipectl
    reference: https://github.com/pipe-cd/asdf-pipectl?tab=readme-ov-file#install
binlist:
- pipectl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
