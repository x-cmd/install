lang: Go
homepage: https://github.com/budimanjojo/talhelper
license: BSD-3-Clause
desc:
  cn: talhelper 是一种工具，可以声明地创建 Talos 配置文件
  en: talhelper is a tool to help creating Talos configuration files declaratively\
  cs: talhelper je nástroj, který pomáhá vytvářet konfigurační soubory Talos deklarativně
  de: talhelper ist ein Werkzeug, das dabei hilft, Talos-Konfigurationsdateien deklarativ zu erstellen
  es: talhelper es una herramienta que ayuda a crear archivos de configuración de Talos de forma declarativa
  fr: talhelper est un outil qui facilite la création déclarative de fichiers de configuration Talos
  id: talhelper adalah alat untuk membantu membuat berkas konfigurasi Talos secara deklaratif
  it: talhelper è uno strumento che aiuta a creare file di configurazione di Talos in modo dichiarativo
  ja: talhelper は Talos の設定ファイルを宣言的に作成するのを支援するツールです
  ko: talhelper는 Talos 구성 파일을 선언적으로 만드는 것을 돕는 도구입니다
  pl: talhelper to narzędzie ułatwiające deklaratywne tworzenie plików konfiguracji Talos
  pt: talhelper é uma ferramenta que ajuda a criar arquivos de configuração do Talos de forma declarativa
  ro: talhelper este un instrument care facilitează crearea declarativă a fișierelor de configurare Talos
  ru: talhelper — это инструмент, который помогает декларативно создавать конфигурационные файлы Talos
  th: talhelper เป็นเครื่องมือที่ช่วยสร้างไฟล์กำหนดค่า Talos ในแบบ declarative
  tr: talhelper, Talos yapılandırma dosyalarını bildirimsel olarak oluşturmanıza yardımcı olan bir araçtır
  uk: talhelper — це інструмент, який допомагає декларативно створювати конфігураційні файли Talos
  vi: talhelper là công cụ giúp tạo các tệp cấu hình Talos theo cách khai báo
x:
  source: https://github.com/budimanjojo/talhelper
  eget: budimanjojo/talhelper
  brew: talhelper
  pacman: talhelper
  scoop: talhelper
  yay: talhelper-bin
  asdf: talhelper
rule:
  /eget:
    cmd: x eget budimanjojo/talhelper
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use talhelper
    reference: https://github.com/bjw-s/asdf-talhelper?tab=readme-ov-file#install
  darwin/brew:
    cmd: brew install talhelper
    reference: https://budimanjojo.github.io/talhelper/latest/installation/#using-homebrew
  /pacman:
    cmd: sudo pacman -S talhelper
    reference: https://budimanjojo.github.io/talhelper/latest/installation/#using-pacman
  /yay:
    cmd: yay -S talhelper-bin
    reference: https://budimanjojo.github.io/talhelper/latest/installation/#using-aur
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add budimanjojo https://github.com/budimanjojo/talhelper.git \

      && x scoop install talhelper

      '
    reference: https://budimanjojo.github.io/talhelper/latest/installation/#using-scoop
  /curl:
    cmd: curl https://i.jpillora.com/budimanjojo/talhelper! | sudo bash
    reference: https://budimanjojo.github.io/talhelper/latest/installation/#using-one-liner-with-jpillora
binlist:
- talhelper

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 19 MB
          rating: 2
          desc:
            cn: 安装 19 MB
            en: 19 MB install
        download:
          estimate: 19 MB
          desc:
            cn: 约 19 MB 下载 (linux/x64)
            en: ~19 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
