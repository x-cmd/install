lang: Go
homepage: https://github.com/kubevela/velad
license: Apache-2.0
desc:
  cn: VelaD 是一个轻量级部署工具，能帮助你快速搭建 KubeVela 环境
  en: VelaD is lightweight deployment tool to set up KubeVela
x:
  source: https://github.com/kubevela/velad
  eget: https://github.com/kubevela/velad
rule:
  /eget:
    cmd: x eget kubevela/velad
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use velad
    reference: https://github.com/pdemagny/asdf-velad?tab=readme-ov-file#install
  linux/curl:
    cmd: 'curl -fsSl https://static.kubevela.net/script/install-velad.sh | bash \

      && velad install

      '
    reference: https://github.com/kubevela/velad?tab=readme-ov-file#installation
  darwin/curl:
    cmd: 'curl -fsSl https://static.kubevela.net/script/install-velad.sh | bash \

      && velad install

      '
    reference: https://github.com/kubevela/velad?tab=readme-ov-file#installation
  win/powershell:
    cmd: 'powershell -Command "iwr -useb https://static.kubevela.net/script/install-velad.ps1 | iex" \

      && velad install

      '
    reference: https://github.com/kubevela/velad?tab=readme-ov-file#installation
binlist:
- velad

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 262 KB
          rating: 1
          desc:
            cn: 约 262 KB（估算）
            en: ~262 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
