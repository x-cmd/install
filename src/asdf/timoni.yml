lang: Go
homepage: https://github.com/stefanprodan/timoni
license: Apache-2.0
desc:
  cn: Timoni 是 Kubernetes 的包管理器，由 CUE 提供支持并受到 Helm 的启发
  en: Timoni is a package manager for Kubernetes, powered by CUE and inspired by Helm
  cs: Timoni je správce balíčků pro Kubernetes, poháněný CUE a inspirovaný Helm
  de: Timoni ist ein Paketmanager für Kubernetes, angetrieben von CUE und inspiriert von Helm
  es: Timoni es un gestor de paquetes para Kubernetes, impulsado por CUE e inspirado en Helm
  fr: Timoni est un gestionnaire de paquets pour Kubernetes, propulsé par CUE et inspiré de Helm
  id: Timoni adalah package manager untuk Kubernetes, didukung oleh CUE dan terinspirasi oleh Helm
  it: Timoni è un package manager per Kubernetes, basato su CUE e ispirato a Helm
  ja: Timoni は CUE により動かし、Helm から着想を得た Kubernetes 向けパッケージマネージャーです
  ko: Timoni는 CUE로 구동되며 Helm에서 영감을 받은 Kubernetes용 패키지 매니저입니다
  pl: Timoni to menedżer pakietów dla Kubernetes, oparty na CUE i inspirowany przez Helm
  pt: O Timoni é um gerenciador de pacotes para Kubernetes, com o poder do CUE e inspirado no Helm
  ro: Timoni este un manager de pachete pentru Kubernetes, susținut de CUE și inspirat de Helm
  ru: Timoni — менеджер пакетов для Kubernetes, работающий на CUE и вдохновлённый Helm
  th: Timoni คือตัวจัดการแพ็กเกจสำหรับ Kubernetes ที่ขับเคลื่อนด้วย CUE และได้แรงบันดาลใจจาก Helm
  tr: Timoni, CUE ile çalışan ve Helm'den esinlenen Kubernetes için bir paket yöneticisidir
  uk: Timoni — менеджер пакетів для Kubernetes, що працює на CUE та натхненний Helm
  vi: Timoni là trình quản lý gói cho Kubernetes, được hỗ trợ bởi CUE và lấy cảm hứng từ Helm
x:
  source: https://github.com/stefanprodan/timoni
  eget: stefanprodan/timoni
  brew: stefanprodan/tap/timoni
  zypper: timoni
  yay: timoni
  go: github.com/stefanprodan/timoni/cmd/timoni@latest
  asdf: timoni
rule:
  /eget:
    cmd: x eget stefanprodan/timoni
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install stefanprodan/tap/timoni
    reference: https://timoni.sh/install/#__tabbed_1_1
  /arkade:
    cmd: arkade get timoni
    reference: https://timoni.sh/install/#__tabbed_1_2
  /nix-env:
    cmd: nix-env -i timoni
    reference: https://timoni.sh/install/#__tabbed_1_3
  arch/yay:
    cmd: yay -S timoni
    reference: https://timoni.sh/install/#__tabbed_1_4
  opensuse/zypper:
    cmd: sudo zypper install timoni
    reference: https://timoni.sh/install/#__tabbed_1_5
  /go:
    cmd: go install github.com/stefanprodan/timoni/cmd/timoni@latest
    reference: https://timoni.sh/install/#__tabbed_1_6
    dsnap: timoni
  /asdf:
    cmd: x asdf use timoni
    reference: https://github.com/Smana/asdf-timoni?tab=readme-ov-file#install
binlist:
- timoni

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 2
          desc:
            cn: 安装 20 MB
            en: 20 MB install
        download:
          estimate: 20 MB
          desc:
            cn: 约 20 MB 下载 (linux/x64)
            en: ~20 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
