lang: Go
homepage: https://github.com/rancher/rke
license: Apache-2.0
desc:
  cn: Rancher Kubernetes Engine（RKE），这是一种非常简单的快速 kubernetes 发动机，完全在容器内运行
  en: Rancher Kubernetes Engine (RKE), an extremely simple, lightning fast Kubernetes distribution that runs entirely within containers
x:
  source: https://github.com/rancher/rke
  eget: https://github.com/rancher/rke
rule:
  /eget:
    cmd: x eget rancher/rke
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x adsf use rke
    reference: https://github.com/particledecay/asdf-rke?tab=readme-ov-file#install
binlist:
- rke

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
