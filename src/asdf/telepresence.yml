lang: Go
homepage: https://github.com/telepresenceio/telepresence
license: Apache-2.0
desc:
  cn: Tepresence 是 Kubernetes 应用程序开发人员的开源工具，可让您在将该服务连接到远程 Kubernetes 群集时本地运行单个服务
  en: Telepresence is an open source tool for Kubernetes application developers that lets you run a single service locally while connecting that service to a remote Kubernetes cluster
x:
  source: https://github.com/telepresenceio/telepresence
  eget: https://github.com/telepresenceio/telepresence
  asdf: asdf
  curl: curl
rule:
  /eget:
    cmd: x eget telepresenceio/telepresence
    reference: https://x-cmd.com/mod/eget
  linux/curl:
    cmd: 'sudo curl -fL https://app.getambassador.io/download/tel2oss/releases/download/v2.17.0/telepresence-linux-amd64 -o /usr/local/bin/telepresence \

      && sudo chmod a+x /usr/local/bin/telepresence

      '
    reference: https://www.telepresence.io/docs/latest/quick-start/?os=gnu-linux
  darwin/curl:
    cmd: 'sudo curl -fL https://app.getambassador.io/download/tel2oss/releases/download/v2.17.0/telepresence-darwin-arm64 -o /usr/local/bin/telepresence \

      && sudo chmod a+x /usr/local/bin/telepresence

      '
    reference: https://www.telepresence.io/docs/latest/quick-start/?os=macos
  /asdf:
    cmd: x asdf use telepresence
    reference: https://github.com/pirackr/asdf-telepresence?tab=readme-ov-file#install
binlist:
- telepresence

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 约 12 MB（估算）
            en: ~12 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
