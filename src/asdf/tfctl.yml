lang: Go
homepage: https://github.com/weaveworks/tf-controller
license: Apache-2.0
desc:
  cn: Weave Gitops 的 Terraform 控制器（又名 Weave TF-Controller）是通量以 Gitops 方式调和 Terraform 资源的控制器
  en: Weave GitOps' Terraform Controller (aka Weave TF-Controller) is a controller for Flux to reconcile Terraform resources in the GitOps way
x:
  source: https://github.com/weaveworks/tf-controller
  eget: https://github.com/weaveworks/tf-controller
rule:
  /eget:
    cmd: x eget weaveworks/tf-controller
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use tfctl
    reference: https://github.com/deas/asdf-tfctl?tab=readme-ov-file#install
binlist:
- tfctl
