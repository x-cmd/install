lang: Go
homepage: https://github.com/FairwindsOps/polaris
license: Apache-2.0
desc:
  cn: Polaris 是 Kubernetes 的开源策略引擎，用于验证和补救资源配置
  en: Polaris is an open source policy engine for Kubernetes that validates and remediates resource configuration
  cs: Polaris je open-source policy engine pro Kubernetes, který ověřuje a opravuje konfiguraci zdrojů
  de: Polaris ist eine Open-Source-Policy-Engine für Kubernetes, die Ressourcenkonfigurationen validiert und behebt
  es: Polaris es un motor de políticas de código abierto para Kubernetes que valida y corrige la configuración de los recursos
  fr: Polaris est un moteur de politiques open source pour Kubernetes qui valide et corrige la configuration des ressources
  id: Polaris adalah mesin kebijakan sumber terbuka untuk Kubernetes yang memvalidasi dan memperbaiki konfigurasi sumber daya
  it: Polaris è un motore di policy open source per Kubernetes che convalida e rimedia la configurazione delle risorse
  ja: Polaris は Kubernetes 向けのオープンソースポリシーエンジンで、リソース構成を検証し修復します
  ko: Polaris는 리소스 구성을 검증하고 복구하는 Kubernetes용 오픈 소스 정책 엔진입니다
  pl: Polaris to otwartoźródłowy silnik polityk dla Kubernetes, który waliduje i naprawia konfigurację zasobów
  pt: Polaris é um mecanismo de políticas de código aberto para Kubernetes que valida e corrige a configuração de recursos
  ro: Polaris este un motor de politici open source pentru Kubernetes care validează și remediază configurația resurselor
  ru: Polaris — открытый движок политик для Kubernetes, который проверяет конфигурацию ресурсов и исправляет её
  th: Polaris คือเครื่องมือนโยบายแบบโอเพนซอร์สสำหรับ Kubernetes ที่ตรวจสอบและแก้ไขค่าคอนฟิกของทรัพยากร
  tr: Polaris, kaynak yapılandırmasını doğrulayan ve düzelten Kubernetes için açık kaynaklı bir politika motorudur
  uk: Polaris — відкритий движок політик для Kubernetes, який перевіряє та виправляє конфігурацію ресурсів
  vi: Polaris là công cụ chính sách mã nguồn mở cho Kubernetes, dùng để kiểm tra và khắc phục cấu hình tài nguyên
x:
  source: https://github.com/FairwindsOps/polaris
  eget: FairwindsOps/polaris
  brew: reactiveops/tap/polaris
  asdf: polaris
rule:
  /eget:
    cmd: x eget FairwindsOps/polaris
    reference: https://x-cmd.com/mod/eget
  /helm:
    cmd: 'helm repo add fairwinds-stable https://charts.fairwinds.com/stable \

      && helm upgrade --install polaris fairwinds-stable/polaris --namespace polaris --create-namespace \

      && kubectl port-forward --namespace polaris svc/polaris-dashboard 8080:80

      '
    reference: https://polaris.docs.fairwinds.com/dashboard/#helm
  darwin/brew:
    cmd: 'brew tap reactiveops/tap \

      && brew install reactiveops/tap/polaris \

      && polaris dashboard --port 8080

      '
    reference: https://polaris.docs.fairwinds.com/dashboard/#local-binary
  /asdf:
    cmd: x asdf use polaris
    reference: https://github.com/particledecay/asdf-polaris?tab=readme-ov-file#install
binlist:
- polaris

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
