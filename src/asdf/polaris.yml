lang: Go
homepage: https://github.com/FairwindsOps/polaris
license: Apache-2.0
desc:
  cn: Polaris 是 Kubernetes 的开源策略引擎，用于验证和补救资源配置
  en: Polaris is an open source policy engine for Kubernetes that validates and remediates resource configuration
x:
  source: https://github.com/FairwindsOps/polaris
  eget: https://github.com/FairwindsOps/polaris
  brew: reactiveops/tap/polaris
  asdf: asdf
rule:
  /eget:
    cmd: x eget FairwindsOps/polaris
    reference: https://x-cmd.com/mod/eget
  /helm:
    cmd: 'helm repo add fairwinds-stable https://charts.fairwinds.com/stable \

      && helm upgrade --install polaris fairwinds-stable/polaris --namespace polaris --create-namespace \

      && kubectl port-forward --namespace polaris svc/polaris-dashboard 8080:80

      '
    reference: https://polaris.docs.fairwinds.com/dashboard/#helm
  darwin/brew:
    cmd: 'brew tap reactiveops/tap \

      && brew install reactiveops/tap/polaris \

      && polaris dashboard --port 8080

      '
    reference: https://polaris.docs.fairwinds.com/dashboard/#local-binary
  /asdf:
    cmd: x asdf use polaris
    reference: https://github.com/particledecay/asdf-polaris?tab=readme-ov-file#install
binlist:
- polaris

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
