lang: Go
homepage: https://github.com/kubernetes-sigs/cluster-api-provider-aws
license: Apache-2.0
desc:
  cn: 用于 asdf 版本管理器的 Clusterawsadm 插件
  en: Clusterawsadm plugin for the asdf version manager
x:
  source: https://github.com/kubernetes-sigs/cluster-api-provider-aws
  eget: https://github.com/kubernetes-sigs/cluster-api-provider-aws
rule:
  /eget:
    cmd: x eget kubernetes-sigs/cluster-api-provider-aws
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use clusterawsadm
    reference: https://github.com/kahun/asdf-clusterawsadm?tab=readme-ov-file#install
binlist:
- clusterawsadm
# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false   # AWS API
    filesystem:
      read:
        desc:
          cn: 读取 ~/.aws/credentials
          en: Reads ~/.aws/credentials
        sensitive:
          - "$HOME/.aws/credentials"
  resource:
    disk:
      size:
        install:
          estimate: 89 MB
          rating: 3
          desc:
            cn: 安装 89 MB
            en: 89 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 62 MB
        desc:
          cn: 62 MB
          en: 62 MB
      peak:
        estimate: 80 MB
        desc:
          cn: ~80 MB
          en: ~80 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: AWS API 调用时短暂占用
          en: Brief spike on AWS API calls
