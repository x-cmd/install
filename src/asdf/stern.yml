lang: Go
homepage: https://github.com/stern/stern
license: Apache-2.0
desc:
  cn: STERN 使您可以在吊舱内的 Kubernetes 和多个容器上尾部多个 POD
  en: Stern allows you to tail multiple pods on Kubernetes and multiple containers within the pod
x:
  source: https://github.com/stern/stern
  eget: https://github.com/stern/stern
  brew: stern
  go: github.com/stern/stern@latest
  asdf: asdf
rule:
  /eget:
    cmd: x eget stern/stern
    reference: https://x-cmd.com/mod/eget
  /go:
    cmd: go install github.com/stern/stern@latest
    reference: https://github.com/stern/stern?tab=readme-ov-file#build-from-source
    dsnap: github.com/stern/stern@latest
  darwin/brew:
    cmd: brew install stern
    reference: https://github.com/stern/stern?tab=readme-ov-file#homebrew-linuxmacos
  /krew:
    cmd: kubectl krew install stern
    reference: https://github.com/stern/stern?tab=readme-ov-file#krew-linuxmacoswindows
  /asdf:
    cmd: x asdf use stern
    reference: https://github.com/looztra/asdf-stern?tab=readme-ov-file#install
binlist:
- stern

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 46 MB
          rating: 2
          desc:
            cn: 安装 46 MB
            en: 46 MB install
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
