lang: JavaScript
homepage: https://github.com/cloud66-oss/copper
license: Apache-2.0
desc:
  cn: Copper 是验证配置文件的简单工具
  en: Copper is a simple tool for validate your configuration files
x:
  source: https://github.com/cloud66-oss/copper
  eget: https://github.com/cloud66-oss/copper
rule:
  /eget:
    cmd: x eget cloud66-oss/copper
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use copper
    reference: https://github.com/vladlosev/asdf-copper?tab=readme-ov-file#install
binlist:
- copper

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
