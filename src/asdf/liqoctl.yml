lang: Go
homepage: https://github.com/liqotech/liqo
license: Apache-2.0
desc:
  cn: Liqo 是一个开源项目，支持动态和无缝的 Kubernetes 多集群拓扑，支持异构的内部、云和边缘基础设施
  en: Liqo is an open-source project that enables dynamic and seamless Kubernetes multi-cluster topologies, supporting heterogeneous on-premise, cloud and edge infrastructures
x:
  source: https://github.com/liqotech/liqo
  eget: https://github.com/liqotech/liqo
rule:
  /eget:
    cmd: x eget liqotech/liqo
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install liqoctl
    reference: https://docs.liqo.io/en/v0.10.1/installation/liqoctl.html#install-liqoctl-with-homebrew
  /asdf:
    cmd: x asdf use liqoctl
    reference: https://github.com/pdemagny/asdf-liqoctl?tab=readme-ov-file#install
binlist:
- liqoctl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
