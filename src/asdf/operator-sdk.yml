lang: Go
homepage: https://github.com/operator-framework/operator-sdk
license: Apache-2.0
desc:
  cn: 一个管理 Kubernetes 本地应用程序的开源工具包，称为 Operators，以一种有效的自动化方式
  en: An open source toolkit to manage Kubernetes native applications, called Operators, in an effective, automated
  cs: Open-source nástrojový balíček pro správu nativních aplikací Kubernetes, tzv. Operators, efektivním a automatizovaným způsobem
  de: Ein Open-Source-Toolkit zum effektiven, automatisierten Verwalten nativer Kubernetes-Anwendungen, sogenannter Operators
  es: Un kit de herramientas de código abierto para gestionar de forma eficaz y automatizada las aplicaciones nativas de Kubernetes, denominadas Operators
  fr: Une boîte à outils open source pour gérer de manière efficace et automatisée les applications natives Kubernetes, appelées Operators
  id: Toolkit sumber terbuka untuk mengelola aplikasi native Kubernetes, disebut Operators, secara efektif dan otomatis
  it: Un toolkit open source per gestire in modo efficace e automatizzato le applicazioni native Kubernetes, dette Operators
  ja: Kubernetes ネイティブアプリケーション (Operators) を効率的かつ自動化された方法で管理するオープンソースのツールキットです
  ko: Kubernetes 네이티브 애플리케이션인 Operators를 효과적이고 자동화된 방식으로 관리하는 오픈 소스 툴킷
  pl: Zestaw narzędzi open source do efektywnego i zautomatyzowanego zarządzania natywnymi aplikacjami Kubernetes, zwanymi Operators
  pt: Um kit de ferramentas de código aberto para gerenciar de forma eficaz e automatizada os aplicativos nativos do Kubernetes, chamados Operators
  ro: Un toolkit open source pentru gestionarea eficientă și automatizată a aplicațiilor native Kubernetes, numite Operators
  ru: Открытый набор инструментов для эффективного и автоматизированного управления нативными приложениями Kubernetes, называемыми Operators
  th: ชุดเครื่องมือโอเพนซอร์สสำหรับจัดการแอปพลิเคชันแบบเนทีฟของ Kubernetes ที่เรียกว่า Operators อย่างมีประสิทธิภาพและเป็นอัตโนมัติ
  tr: Operator olarak adlandırılan Kubernetes yerel uygulamalarını etkili ve otomatik bir şekilde yönetmek için açık kaynaklı bir araç seti
  uk: Відкритий набір інструментів для ефективного та автоматизованого керування нативними застосунками Kubernetes, які називаються Operators
  vi: Bộ công cụ mã nguồn mở để quản lý hiệu quả và tự động các ứng dụng native của Kubernetes, được gọi là Operators
x:
  source: https://github.com/operator-framework/operator-sdk
  eget: operator-framework/operator-sdk
  brew: operator-sdk
  asdf: operator-sdk
rule:
  /eget:
    cmd: x eget operator-framework/operator-sdk
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install operator-sdk
    reference: https://sdk.operatorframework.io/docs/installation/#install-from-homebrew-macos
  /asdf:
    cmd: x asdf use operator-sdk
    reference: https://github.com/Medium/asdf-operator-sdk?tab=readme-ov-file#install
binlist:
- operator-sdk

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 101 MB
          rating: 3
          desc:
            cn: 安装 101 MB
            en: 101 MB install
        download:
          estimate: 101 MB
          desc:
            cn: 约 101 MB 下载 (linux/x64)
            en: ~101 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
