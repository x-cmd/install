lang: Go
homepage: https://github.com/okteto/okteto
license: Apache-2.0
desc:
  cn: Okteto 是一个平台，它简化了启动云开发环境的过程，而不需要自己动手的专业知识
  en: Okteto is a platform that simplifies the process of launching cloud development environments without requiring the expertise to do this yourself
x:
  source: https://github.com/okteto/okteto
  eget: https://github.com/okteto/okteto
rule:
  /eget:
    cmd: x eget okteto/okteto
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl https://get.okteto.com -sSfL | sh
    reference: https://www.okteto.com/docs/get-started/install-okteto-cli/#macos--linux
  darwin/brew:
    cmd: brew install okteto
    reference: https://www.okteto.com/docs/get-started/install-okteto-cli/#macos--linux
  (win|wsl2)/scoop:
    cmd: x $ scoop install okteto
    reference: https://www.okteto.com/docs/get-started/install-okteto-cli/#windows
  /asdf:
    cmd: x asdf use okteto
    reference: https://github.com/BradenM/asdf-okteto?tab=readme-ov-file#install
binlist:
- okteto

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
