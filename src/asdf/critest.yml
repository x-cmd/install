lang: Go
homepage: https://github.com/kubernetes-sigs/cri-tools
license: Apache-2.0
desc:
  cn: Kubelet 容器运行时接口(CRI)的 CLI 和验证工具
  en: CLI and validation tools for Kubelet Container Runtime Interface (CRI)
  cs: CLI nástroje a nástroje pro validaci pro Kubelet Container Runtime Interface (CRI)
  de: CLI- und Validierungswerkzeuge für das Kubelet Container Runtime Interface (CRI)
  es: Herramientas de CLI y validación para la interfaz de tiempo de ejecución de contenedor de Kubelet (CRI)
  fr: Outils en ligne de commande et de validation pour l'interface de runtime de conteneur Kubelet (CRI)
  id: Alat CLI dan validasi untuk Kubelet Container Runtime Interface (CRI)
  it: Strumenti CLI e di validazione per il Kubelet Container Runtime Interface (CRI)
  ja: Kubelet Container Runtime Interface (CRI) 用の CLI と検証ツール
  ko: Kubelet Container Runtime Interface (CRI)를 위한 CLI 및 검증 도구
  pl: Narzędzia CLI i walidacji dla Kubelet Container Runtime Interface (CRI)
  pt: Ferramentas de linha de comando e validação para a interface de runtime de contêiner do Kubelet (CRI)
  ro: Instrumente CLI și de validare pentru Kubelet Container Runtime Interface (CRI)
  ru: CLI-инструменты и утилиты проверки для Kubelet Container Runtime Interface (CRI)
  th: เครื่องมือบรรทัดคำสั่งและการตรวจสอบสำหรับ Kubelet Container Runtime Interface (CRI)
  tr: Kubelet Container Runtime Interface (CRI) için CLI ve doğrulama araçları
  uk: CLI-інструменти та утиліти перевірки для Kubelet Container Runtime Interface (CRI)
  vi: Công cụ CLI và kiểm tra cho Kubelet Container Runtime Interface (CRI)
x:
  source: https://github.com/kubernetes-sigs/cri-tools
  eget: kubernetes-sigs/cri-tools
rule:
  /eget:
    cmd: x eget kubernetes-sigs/cri-tools
    reference: https://x-cmd.com/mod/eget
  /wget:
    cmd: 'VERSION="v1.28.0" \

      && wget https://github.com/kubernetes-sigs/cri-tools/releases/download/$VERSION/critest-$VERSION-linux-amd64.tar.gz \

      && sudo tar zxvf critest-$VERSION-linux-amd64.tar.gz -C /usr/local/bin \

      && rm -f critest-$VERSION-linux-amd64.tar.gz

      '
    reference: https://github.com/kubernetes-sigs/cri-tools?tab=readme-ov-file#install-critest
binlist:
- critest

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 38 MB
          rating: 2
          desc:
            cn: 安装 38 MB
            en: 38 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 51 MB
        desc:
          cn: 51 MB
          en: 51 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
