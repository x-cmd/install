lang: Go
homepage: https://github.com/tilt-dev/tilt
license: Apache-2.0
desc:
  cn: 用于解决微服务开发难题的工具包
  en: A toolkit for fixing the pains of microservice development
  cs: Sada nástrojů pro řešení potíží s vývojem mikroslužeb
  de: Ein Toolkit, das die Qualen der Microservice-Entwicklung behebt
  es: Un conjunto de herramientas para resolver las dificultades del desarrollo de microservicios
  fr: Une boîte à outils pour résoudre les difficultés du développement de microservices
  id: Kit alat untuk mengatasi kesulitan dalam pengembangan microservice
  it: Un toolkit per risolvere le difficoltà dello sviluppo di microservizi
  ja: マイクロサービス開発の難所を解決するためのツールキット
  ko: 마이크로서비스 개발의 골치를 해결하는 도구 모음
  pl: Zestaw narzędzi do rozwiązywania problemów z rozwojem mikroserwisów
  pt: Um conjunto de ferramentas para resolver as dores do desenvolvimento de microsserviços
  ro: Un set de instrumente pentru a rezolva dificultățile dezvoltării de microservicii
  ru: Набор инструментов для устранения проблем разработки микросервисов
  th: ชุดเครื่องมือสำหรับแก้ปัญหาความยากลำบากในการพัฒนาไมโครเซอร์วิส
  tr: Mikroservis geliştirmenin sıkıntılarını gidermek için bir araç seti
  uk: Інструментарій для усунення труднощів розробки мікросервісів
  vi: Bộ công cụ giải quyết những khó khăn trong phát triển vi dịch vụ vi mô
x:
  source: https://github.com/tilt-dev/tilt
  eget: tilt-dev/tilt
  brew: tilt-dev/tap/tilt
  scoop: tilt
  asdf: tilt
rule:
  /eget:
    cmd: x eget tilt-dev/tilt
    reference: https://x-cmd.com/mod/eget
  darwin/curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash
    reference: https://docs.tilt.dev/install.html#macos
  linux/curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash
    reference: https://docs.tilt.dev/install.html#linux
  win/powershell:
    cmd: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.ps1'))
    reference: https://docs.tilt.dev/install.html#windows
  darwin/brew:
    cmd: brew install tilt-dev/tap/tilt
    reference: https://docs.tilt.dev/install.html#homebrew-macos-or-linux
  (win|wsl2)/scoop:
    cmd: x scoop bucket add tilt-dev https://github.com/tilt-dev/scoop-bucket &&  x scoop install tilt
    reference: https://docs.tilt.dev/install.html#scoop-windows
  /conda:
    cmd: 'conda config --add channels conda-forge && conda install tilt

      '
    reference: https://docs.tilt.dev/install.html#conda-forge
  /asdf:
    cmd: x asdf use tilt
    reference: https://docs.tilt.dev/install.html#asdf
binlist:
- tilt

# already profiled
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 104 MB
          rating: 3
          desc:
            cn: 安装 104 MB
            en: 104 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
