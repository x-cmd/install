lang: Go
homepage: https://github.com/siderolabs/talos
license: MPL-2.0
desc:
  cn: Talos Linux 是为 Kubernetes 设计的 Linux - 安全，不可变和最少
  en: Talos Linux is Linux designed for Kubernetes – secure, immutable, and minimal
  cs: Talos Linux je Linux navržený pro Kubernetes – bezpečný, neměnný a minimalistický
  de: Talos Linux ist ein für Kubernetes konzipiertes Linux – sicher, unveränderlich und minimalistisch
  es: "Talos Linux es un Linux diseñado para Kubernetes: seguro, inmutable y minimalista"
  fr: Talos Linux est un Linux conçu pour Kubernetes – sécurisé, immuable et minimal
  id: Talos Linux adalah Linux yang dirancang untuk Kubernetes – aman, tidak dapat diubah, dan minimal
  it: Talos Linux è un Linux progettato per Kubernetes – sicuro, immutabile e minimale
  ja: Talos Linux は Kubernetes のために設計された Linux で、安全・不変・ミニマルです
  ko: Talos Linux은 Kubernetes를 위해 설계된 Linux로, 안전하고 불변이며 최소한입니다
  pl: Talos Linux to Linux zaprojektowany dla Kubernetes – bezpieczny, niezmienny i minimalistyczny
  pt: O Talos Linux é um Linux projetado para Kubernetes – seguro, imutável e minimalista
  ro: Talos Linux este un Linux conceput pentru Kubernetes – sigur, imutabil și minimalist
  ru: "Talos Linux — это Linux, созданный для Kubernetes: безопасный, неизменяемый и минималистичный"
  th: Talos Linux คือ Linux ที่ออกแบบมาสำหรับ Kubernetes – ปลอดภัย ไม่เปลี่ยนแปลง และมีขนาดเล็ก
  tr: Talos Linux, Kubernetes için tasarlanmış bir Linux'tur – güvenli, değişmez ve minimalist
  uk: "Talos Linux — це Linux, створений для Kubernetes: безпечний, незмінний і мінімалістичний"
  vi: Talos Linux là hệ điều hành Linux được thiết kế cho Kubernetes – an toàn, bất biến và tối giản
x:
  source: https://github.com/siderolabs/talos
  eget: siderolabs/talos
  asdf: talos
rule:
  /eget:
    cmd: x eget siderolabs/talos
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use talos
    reference: https://github.com/particledecay/asdf-talos?tab=readme-ov-file#install
binlist:
- talos

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 113 MB
          rating: 3
          desc:
            cn: 安装 113 MB
            en: 113 MB install
        download:
          estimate: 113 MB
          desc:
            cn: 约 113 MB 下载 (linux/x64)
            en: ~113 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
