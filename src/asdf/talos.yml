lang: Go
homepage: https://github.com/siderolabs/talos
license: MPL-2.0
desc:
  cn: Talos Linux 是为 Kubernetes 设计的 Linux - 安全，不可变和最少
  en: Talos Linux is Linux designed for Kubernetes – secure, immutable, and minimal
x:
  source: https://github.com/siderolabs/talos
  eget: https://github.com/siderolabs/talos
  asdf: talos
rule:
  /eget:
    cmd: x eget siderolabs/talos
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use talos
    reference: https://github.com/particledecay/asdf-talos?tab=readme-ov-file#install
binlist:
- talos

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 113 MB
          rating: 3
          desc:
            cn: 安装 113 MB
            en: 113 MB install
        download:
          estimate: 113 MB
          desc:
            cn: 约 113 MB 下载 (linux/x64)
            en: ~113 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
