lang: Go
homepage: https://github.com/ConduitIO/conduit
license: Apache-2.0
desc:
  cn: Conduit 是一个面向软件工程师的数据集成工具
  en: Conduit is a data integration tool for software engineers
  cs: Conduit je nástroj pro integraci dat určený softwarovým inženýrům
  de: Conduit ist ein Dataintegrationswerkzeug für Softwareentwickler
  es: Conduit es una herramienta de integración de datos para ingenieros de software
  fr: Conduit est un outil d'intégration de données pour les ingénieurs logiciels
  id: Conduit adalah alat integrasi data untuk para pengembang perangkat lunak
  it: Conduit è uno strumento di integrazione dati per gli ingegneri del software
  ja: Conduit はソフトウェアエンジニア向けのデータ統合ツールです
  ko: Conduit는 소프트웨어 엔지니어를 위한 데이터 통합 도구입니다
  pl: Conduit to narzędzie do integracji danych dla inżynierów oprogramowania
  pt: O Conduit é uma ferramenta de integração de dados para engenheiros de software
  ro: Conduit este un instrument de integrare a datelor pentru ingineri de software
  ru: Conduit — это инструмент интеграции данных для программистов
  th: Conduit เป็นเครื่องมือผสานข้อมูลสำหรับวิศวกรซอฟต์แวร์
  tr: Conduit, yazılım mühendisleri için bir veri entegrasyon aracıdır
  uk: Conduit — це інструмент інтеграції даних для інженерів програмного забезпечення
  vi: Conduit là công cụ tích hợp dữ liệu dành cho kỹ sư phần mềm
x:
  source: https://github.com/ConduitIO/conduit
  eget: ConduitIO/conduit
  brew: conduit
  asdf: conduit
rule:
  /eget:
    cmd: x eget ConduitIO/conduit
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install conduit
    reference: https://github.com/ConduitIO/conduit?tab=readme-ov-file#homebrew
  /asdf:
    cmd: x asdf use conduit
    reference: https://github.com/gmcabrita/asdf-conduit?tab=readme-ov-file#installation
binlist:
- conduit

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 72 MB
          rating: 3
          desc:
            cn: 安装 72 MB
            en: 72 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 38 MB
        desc:
          cn: 38 MB
          en: 38 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
