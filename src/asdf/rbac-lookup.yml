lang: Go
homepage: https://github.com/FairwindsOps/rbac-lookup
license: Apache-2.0
desc:
  cn: RBAC 查找是一个 CLI，可让您轻松找到与任何用户，服务帐户或组名称绑定的 Kubernetes 角色和集群角色。每个版本都用 goreleaser 生成二进制文件，以进行简单安装
  en: RBAC Lookup is a CLI that allows you to easily find Kubernetes roles and cluster roles bound to any user, service account, or group name. Binaries are generated with goreleaser for each release for simple installation
x:
  source: https://github.com/FairwindsOps/rbac-lookup
  eget: https://github.com/FairwindsOps/rbac-lookup
rule:
  /eget:
    cmd: x eget FairwindsOps/rbac-lookup
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install FairwindsOps/tap/rbac-lookup
    reference: https://github.com/FairwindsOps/rbac-lookup?tab=readme-ov-file#homebrew
  /asdf:
    cmd: x asdf use rbac-lookup
    reference: https://github.com/looztra/asdf-rbac-lookup?tab=readme-ov-file#install
binlist:
- rbac-lookup

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
