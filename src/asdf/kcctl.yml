lang: Java
homepage: https://github.com/kcctl/kcctl
license: Apache-2.0
desc:
  cn: Kafka Connect 的现代且直观的命令行客户端
  en: A modern and intuitive command line client for Kafka Connect
  cs: Moderní a intuitivní klient příkazové řádky pro Kafka Connect
  de: Ein moderner und intuitiver Kommandozeilen-Client für Kafka Connect
  es: Un cliente de línea de comandos moderno e intuitivo para Kafka Connect
  fr: Un client en ligne de commande moderne et intuitif pour Kafka Connect
  id: Klien baris perintah modern dan intuitif untuk Kafka Connect
  it: Un client da riga di comando moderno e intuitivo per Kafka Connect
  ja: Kafka Connect 向けのモダンで直感的なコマンドラインクライアント
  ko: Kafka Connect를 위한 현대적이고 직관적인 명령줄 클라이언트
  pl: Nowoczesny i intuicyjny klient wiersza poleceń dla Kafka Connect
  pt: Um cliente de linha de comando moderno e intuitivo para o Kafka Connect
  ro: Un client de linie de comandă modern și intuitiv pentru Kafka Connect
  ru: Современный и интуитивно понятный консольный клиент для Kafka Connect
  th: ไคลเอนต์บรรทัดคำสั่งที่ทันสมัยและใช้งานง่ายสำหรับ Kafka Connect
  tr: Kafka Connect için modern ve sezgisel bir komut satırı istemcisidir
  uk: Сучасний і інтуїтивно зрозумілий консольний клієнт для Kafka Connect
  vi: Client dòng lệnh hiện đại và trực quan dành cho Kafka Connect
x:
  source: https://github.com/kcctl/kcctl
  eget: kcctl/kcctl
  brew: kcctl/tap/kcctl
  asdf: kcctl
rule:
  /eget:
    cmd: x eget kcctl/kcctl
    reference: https://x-cmd.com/mod/eget
  /sdk:
    cmd: sdk install kcctl
    reference: https://github.com/kcctl/kcctl?tab=readme-ov-file#installation
  darwin/brew:
    cmd: brew install kcctl/tap/kcctl
    reference: https://github.com/kcctl/kcctl?tab=readme-ov-file#installation
  /wget:
    cmd: ". <(wget -O - https://raw.githubusercontent.com/kcctl/kcctl/main/kcctl_completion)"
    reference: https://github.com/kcctl/kcctl?tab=readme-ov-file#installation
  /asdf:
    cmd: x asdf use kcctl
    reference: https://github.com/joschi/asdf-kcctl?tab=readme-ov-file#install
binlist:
- kcctl

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 53 MB
          rating: 3
          desc:
            cn: 安装 53 MB
            en: 53 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 34 MB
        desc:
          cn: 34 MB
          en: 34 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
