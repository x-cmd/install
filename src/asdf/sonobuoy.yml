lang: Go
homepage: https://github.com/vmware-tanzu/sonobuoy
license: Apache-2.0
desc:
  cn: Sonobuoy 是一种诊断工具，可以通过以易于访问和无损的方式运行配置测试来更容易理解 Kubernetes 群集的状态
  en: Sonobuoy is a diagnostic tool that makes it easier to understand the state of a Kubernetes cluster by running a choice of configuration tests in an accessible and non-destructive manner
x:
  source: https://github.com/vmware-tanzu/sonobuoy
  eget: https://github.com/vmware-tanzu/sonobuoy
  brew: sonobuoy
rule:
  /eget:
    cmd: x eget vmware-tanzu/sonobuoy
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install sonobuoy
    reference: https://sonobuoy.io/docs/v0.57.1/#install-with-hombrew-macos
  /asdf:
    cmd: x asdf use sonobuoy
    reference: https://github.com/Nick-Triller/asdf-sonobuoy?tab=readme-ov-file#install
binlist:
- sonobuoy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 24 MB
          rating: 2
          desc:
            cn: 安装 24 MB
            en: 24 MB install
        download:
          estimate: 24 MB
          desc:
            cn: 约 24 MB 下载 (linux/x64)
            en: ~24 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
