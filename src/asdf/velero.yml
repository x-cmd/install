lang: Go
homepage: https://github.com/vmware-tanzu/velero
license: Apache-2.0
desc:
  cn: Velero 是安全备份和恢复，执行灾难恢复和迁移 Kubernetes 集群资源和持续量的开源工具
  en: Velero is an open source tool to safely backup and restore, perform disaster recovery, and migrate Kubernetes cluster resources and persistent volumes
x:
  source: https://github.com/vmware-tanzu/velero
  eget: https://github.com/vmware-tanzu/velero
rule:
  /eget:
    cmd: x eget vmware-tanzu/velero
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install velero
    reference: https://velero.io/docs/v1.13/basic-install/#install-the-cli
  (win|wsl2)/choco:
    cmd: x choco install velero
    reference: https://velero.io/docs/v1.13/basic-install/#install-the-cli
  /asdf:
    cmd: x asdf use velero
    reference: https://github.com/looztra/asdf-velero?tab=readme-ov-file#install
binlist:
- velero

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
  listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 55 MB
          rating: 3
          desc:
            cn: 安装 55 MB
            en: 55 MB install
        download:
          estimate: 55 MB
          desc:
            cn: 约 55 MB 下载 (linux/x64)
            en: ~55 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
