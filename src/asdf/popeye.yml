lang: Go
homepage: https://github.com/derailed/popeye
desc:
  cn: Popeye 是一个实用程序，它扫描实时 Kubernetes 集群，并报告已部署资源和配置的潜在问题
  en: Popeye is a utility that scans live Kubernetes cluster and reports potential issues with deployed resources and configurations
x:
  source: https://github.com/derailed/popeye
  eget: https://github.com/derailed/popeye
rule:
  /eget:
    cmd: x eget derailed/popeye
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install derailed/popeye/popeye
    reference: https://popeyecli.io/#installation
  /go:
    cmd: go install github.com/derailed/popeye@latest
    reference: https://popeyecli.io/#installation
    dsnap: github.com/derailed/popeye@latest
  /asdf:
    cmd: x asdf use popeye
    reference: https://github.com/nlamirault/asdf-popeye?tab=readme-ov-file#install
binlist:
- popeye
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.2 MB
          rating: 1
          desc:
            cn: 约 1.2 MB（估算）
            en: ~1.2 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
