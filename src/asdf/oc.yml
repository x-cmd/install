lang: Go
homepage: https://github.com/openshift/oc
license: Apache-2.0
desc:
  cn: OpenShift 命令行，OKD 的一部分
  en: The OpenShift Command Line, part of OKD
x:
  source: https://github.com/openshift/oc
rule:
  /asdf:
    cmd: x asdf use oc
    reference: https://github.com/sqtran/asdf-oc?tab=readme-ov-file#install
binlist:
- oc

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
