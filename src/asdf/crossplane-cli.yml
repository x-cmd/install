lang: Go
homepage: https://github.com/crossplane/crossplane
license: Apache-2.0
desc:
  cn: Crossplane 是一个构建云本地控制平面的框架，不需要编写代码
  en: Crossplane is a framework for building cloud native control planes without needing to write code
  cs: Crossplane je framework pro budování cloudově nativních řídicích rovin bez nutnosti psát kód
  de: Crossplane ist ein Framework zum Erstellen cloudnativer Steuerungsebenen, ohne Code schreiben zu müssen
  es: Crossplane es un framework para crear planos de control nativos de la nube sin necesidad de escribir código
  fr: Crossplane est un framework pour construire des plans de contrôle cloud native sans avoir à écrire de code
  id: Crossplane adalah framework untuk membangun control plane cloud native tanpa perlu menulis kode
  it: Crossplane è un framework per costruire control plane cloud native senza scrivere codice
  ja: Crossplane は、コードを書くことなくクラウドネイティブのコントロールプレーンを構築するためのフレームワークです
  ko: Crossplane은 코드를 작성하지 않고 클라우드 네이티브 제어 평면을 구축할 수 있는 프레임워크입니다
  pl: Crossplane to framework do budowania natywnie chmurowych płaszczyzn sterowania bez konieczności pisania kodu
  pt: O Crossplane é um framework para construir planos de controle nativos de nuvem sem precisar escrever código
  ro: Crossplane este un cadru pentru construirea planurilor de control cloud-native fără a scrie cod
  ru: Crossplane — это фреймворк для создания облачно-нативных систем управления без написания кода
  th: Crossplane เป็นเฟรมเวิร์กสำหรับสร้าง control plane แบบ cloud native โดยไม่ต้องเขียนโค้ด
  tr: Crossplane, kod yazmaya gerek kalmadan bulut tabanlı kontrol düzlemleri kurmak için bir çerçevedir
  uk: Crossplane — це фреймворк для створення хмарно-орієнтованих систем керування без написання коду
  vi: Crossplane là framework để xây dựng control plane cloud native mà không cần viết mã
x:
  source: https://github.com/crossplane/crossplane
  asdf: crossplane-cli
rule:
  /helm:
    cmd: helm repo add crossplane-stable https://charts.crossplane.io/stable
    reference: https://docs.crossplane.io/latest/software/install/
  /asdf:
    cmd: x asdf use crossplane-cli
    reference: https://github.com/joke/asdf-crossplane-cli?tab=readme-ov-file#install
binlist:
- crossplane-cli

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
