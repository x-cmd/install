lang: Go
homepage: https://github.com/crossplane/crossplane
license: Apache-2.0
desc:
  cn: Crossplane 是一个构建云本地控制平面的框架，不需要编写代码
  en: Crossplane is a framework for building cloud native control planes without needing to write code
x:
  source: https://github.com/crossplane/crossplane
rule:
  /helm:
    cmd: helm repo add crossplane-stable https://charts.crossplane.io/stable
    reference: https://docs.crossplane.io/latest/software/install/
  /asdf:
    cmd: x asdf use crossplane-cli
    reference: https://github.com/joke/asdf-crossplane-cli?tab=readme-ov-file#install
binlist:
- crossplane-cli

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
