lang: Go
homepage: https://github.com/kubevela/kubevela
license: Apache-2.0
desc:
  cn: KubeVela 是一个现代化的软件交付平台，它使得在当今的混合、多云环境中部署和操作应用程序更加容易、快速和可靠
  en: KubeVela is a modern software delivery platform that makes deploying and operating applications across today's hybrid, multi-cloud environments easier, faster and more reliable
x:
  source: https://github.com/kubevela/kubevela
  eget: https://github.com/kubevela/kubevela
rule:
  /eget:
    cmd: x eget kubevela/kubevela
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: curl -fsSl https://kubevela.io/script/install-velad.sh | bash
    reference: https://kubevela.io/docs/installation/standalone/#2-install-velad-and-setup-kubevela-1
  /asdf:
    cmd: x asdf use kubevela
    reference: https://github.com/gustavclausen/asdf-kubevela?tab=readme-ov-file#install
binlist:
- kubevela
