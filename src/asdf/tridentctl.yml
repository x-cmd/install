lang: Go
homepage: https://github.com/NetApp/trident
license: Apache-2.0
desc:
  cn: 容器的存储编排
  en: Storage orchestrator for containers
x:
  source: https://github.com/NetApp/trident
  eget: https://github.com/NetApp/trident
rule:
  /eget:
    cmd: x eget NetApp/trident
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use tridentctl
    reference: https://github.com/asdf-community/asdf-tridentctl?tab=readme-ov-file#install
binlist:
- tridentctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
