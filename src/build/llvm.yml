lang: C
homepage: https://github.com/llvm/llvm-project
desc:
  cn: LLVM 项目是模块化和可重用的编译器和工具链技术的集合
  en: The LLVM Project is a collection of modular and reusable compiler and toolchain technologies
x:
  source: https://github.com/llvm/llvm-project
  eget: https://github.com/llvm/llvm-project
rule:
  /eget:
    cmd: x eget llvm/llvm-project
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install llvm
    reference: https://formulae.brew.sh/formula/llvm#default
  /apt:
    cmd: sudo apt-get install llvm-dev
    reference: https://apt.llvm.org/
  alpine/apk:
    cmd: sudo apk add llvm
    reference: https://command-not-found.com/llvm-extract
    dsnap: llvm
  arch/pacman:
    cmd: sudo pacman -S llvm
    reference: https://archlinux.org/packages/extra/x86_64/llvm/
  kali/apt:
    cmd: sudo apt-get install llvm-dev
    reference: https://apt.llvm.org/
    dsnap: llvm-dev
  centos/yum:
    cmd: sudo yum install llvm
    reference: https://command-not-found.com/llvm-extract
  fedora/dnf:
    cmd: sudo dnf install llvm
    reference: https://command-not-found.com/llvm-extract
    dsnap: llvm
binlist:
- llvm
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
