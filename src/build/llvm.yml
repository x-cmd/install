lang: C
homepage: https://github.com/llvm/llvm-project
desc:
  cn: LLVM 项目是模块化和可重用的编译器和工具链技术的集合
  en: The LLVM Project is a collection of modular and reusable compiler and toolchain technologies
  cs: Projekt LLVM je sbírka modulárních a znovu použitelných technologií pro kompilátory a toolchain
  de: Das LLVM-Projekt ist eine Sammlung modularer und wiederverwendbarer Compiler- und Toolchain-Technologien
  es: El Proyecto LLVM es una colección de tecnologías modulares y reutilizables de compilador y cadena de herramientas
  fr: Le projet LLVM est un ensemble de technologies modulaires et réutilisables pour les compilateurs et les chaînes d'outils
  id: Proyek LLVM adalah kumpulan teknologi kompilator dan toolchain yang modular serta dapat digunakan kembali
  it: Il progetto LLVM è una raccolta di tecnologie modulari e riutilizzabili per compilatori e toolchain
  ja: LLVM Project は、モジュール式で再利用できるコンパイラおよびツールチェーン技術の集合です
  ko: LLVM Project는 모듈식이며 재사용 가능한 컴파일러 및 툴체인 기술의 모음입니다
  pl: Projekt LLVM to zbiór modularnych i wielokrotnie używalnych technologii kompilatorów i łańcuchów narzędzi
  pt: O Projeto LLVM é uma coleção de tecnologias modulares e reutilizáveis de compilador e cadeia de ferramentas
  ro: Proiectul LLVM este o colecție de tehnologii modulare și reutilizabile pentru compilatoare și lanțuri de instrumente
  ru: Проект LLVM — это набор модульных и переиспользуемых технологий компиляторов и инструментальных средств
  th: โครงการ LLVM คือคอลเลกชันของเทคโนโลยีคอมไพเลอร์และ toolchain แบบโมดูลาร์ที่นำกลับมาใช้ซ้ำได้
  tr: LLVM Projesi, derleyici ve araç zinciri teknolojilerinin modüler ve yeniden kullanılabilir bir koleksiyonudur
  uk: Проєкт LLVM — це набір модульних і повторно використовуваних технологій компіляторів та інструментальних ланцюжків
  vi: LLVM Project là tập hợp các công nghệ trình biên dịch và toolchain dạng mô-đun, có thể tái sử dụng
x:
  source: https://github.com/llvm/llvm-project
  eget: llvm/llvm-project
  apt: llvm-dev
  dnf: llvm
  brew: llvm
  pacman: llvm
  apk: llvm
  apt-get: llvm-dev
  yum: llvm
rule:
  /eget:
    cmd: x eget llvm/llvm-project
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install llvm
    reference: https://formulae.brew.sh/formula/llvm#default
  /apt:
    cmd: sudo apt-get install llvm-dev
    reference: https://apt.llvm.org/
  alpine/apk:
    cmd: sudo apk add llvm
    reference: https://command-not-found.com/llvm-extract
    dsnap: llvm
  arch/pacman:
    cmd: sudo pacman -S llvm
    reference: https://archlinux.org/packages/extra/x86_64/llvm/
  kali/apt:
    cmd: sudo apt-get install llvm-dev
    reference: https://apt.llvm.org/
    dsnap: llvm-dev
  centos/yum:
    cmd: sudo yum install llvm
    reference: https://command-not-found.com/llvm-extract
  fedora/dnf:
    cmd: sudo dnf install llvm
    reference: https://command-not-found.com/llvm-extract
    dsnap: llvm
binlist:
- llvm
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
