lang: TypeScript
homepage: https://github.com/vitejs/vite
license: MIT
desc:
  cn: Vite 是一种新的前端构建工具，可显着改善前端开发体验
  en: Vite is a new breed of frontend build tooling that significantly improves the frontend development experience
x:
  source: https://github.com/vitejs/vite
rule:
  /npm:
    cmd: npm install -g vite
    reference: https://vitejs.dev/guide/#scaffolding-your-first-vite-project
    dsnap: vite
  darwin/brew:
    cmd: brew install vite
    reference: https://formulae.brew.sh/formula/vite#default
binlist:
- vite

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
