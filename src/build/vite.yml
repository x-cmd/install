lang: TypeScript
homepage: https://github.com/vitejs/vite
license: MIT
desc:
  cn: Vite 是一种新的前端构建工具，可显着改善前端开发体验
  en: Vite is a new breed of frontend build tooling that significantly improves the frontend development experience
x:
  source: https://github.com/vitejs/vite
rule:
  /npm:
    cmd: npm install -g vite
    reference: https://vitejs.dev/guide/#scaffolding-your-first-vite-project
    dsnap: vite
  darwin/brew:
    cmd: brew install vite
    reference: https://formulae.brew.sh/formula/vite#default
binlist:
- vite

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 127 KB
          rating: 1
          desc:
            cn: 约 127 KB（估算）
            en: ~127 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
