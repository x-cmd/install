lang: TypeScript
homepage: https://github.com/vitejs/vite
license: MIT
desc:
  cn: Vite 是一种新的前端构建工具，可显着改善前端开发体验
  en: Vite is a new breed of frontend build tooling that significantly improves the frontend development experience
  cs: Vite je nová generace nástrojů pro sestavování frontendu, která výrazně zlepšuje zážitek z vývoje frontendu
  de: Vite ist eine neue Art von Frontend-Build-Tools, die die Entwicklungserfahrung im Frontend erheblich verbessert
  es: Vite es una nueva generación de herramientas de compilación de frontend que mejora significativamente la experiencia de desarrollo frontend
  fr: Vite est une nouvelle génération d'outils de build frontend qui améliore considérablement l'expérience de développement frontend
  id: Vite adalah jenis baru perangkat build frontend yang secara signifikan meningkatkan pengalaman pengembangan frontend
  it: Vite è una nuova generazione di strumenti di build per il frontend che migliora significativamente l'esperienza di sviluppo frontend
  ja: Vite は新しい世代フロントエンドビルドツールで、フロントエンド開発体験を大幅に改善します
  ko: Vite는 새로운 세대의 프론트엔드 빌드 도구로, 프론트엔드 개발 경험을 크게 개선합니다
  pl: Vite to nowa generacja narzędzi do budowania frontendu, która znacząco poprawia doświadczenie pracy z frontendem
  pt: Vite é uma nova geração de ferramentas de build de frontend que melhora significativamente a experiência de desenvolvimento frontend
  ro: Vite este o nouă generație de instrumente de build pentru frontend, care îmbunătățește semnificativ experiența de dezvoltare frontend
  ru: Vite — новое поколение инструментов сборки фронтенда, значительно улучшающее опыт фронтенд-разработки
  th: Vite คือเครื่องมือ build สำหรับ frontend รุ่นใหม่ที่ช่วยปรับปรุงประสบการณ์การพัฒนา frontend อย่างมีนัยสำคัญ
  tr: Vite, frontend geliştirme deneyimini önemli ölçüde iyileştiren yeni bir nesil frontend derleme aracıdır
  uk: Vite — нове покоління інструментів складання фронтенду, що значно покращує досвід фронтенд-розробки
  vi: Vite là thế hệ mới các công cụ build frontend giúp cải thiện đáng kể trải nghiệm phát triển frontend
x:
  source: https://github.com/vitejs/vite
  brew: vite
  npm: vite
rule:
  /npm:
    cmd: npm install -g vite
    reference: https://vitejs.dev/guide/#scaffolding-your-first-vite-project
    dsnap: vite
  darwin/brew:
    cmd: brew install vite
    reference: https://formulae.brew.sh/formula/vite#default
binlist:
- vite

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 127 KB
          rating: 1
          desc:
            cn: 约 127 KB（估算）
            en: ~127 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
