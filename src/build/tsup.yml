lang: JavaScript
homepage: https://github.com/egoist/tsup
license: MIT
desc:
  cn: 由 Esbuild 提供支持, 捆绑您的 TypeScript 库
  en: Bundler for your TypeScript library, powered by esbuild
x:
  source: https://github.com/egoist/tsup
rule:
  /npm:
    cmd: npm install -g tsup
    reference: https://github.com/egoist/tsup?tab=readme-ov-file#%EF%B8%8F-install
    dsnap: tsup
binlist:
- tsup

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
