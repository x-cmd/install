lang: JavaScript
homepage: https://github.com/egoist/tsup
license: MIT
desc:
  cn: 由 Esbuild 提供支持, 捆绑您的 TypeScript 库
  en: Bundler for your TypeScript library, powered by esbuild
x:
  source: https://github.com/egoist/tsup
rule:
  /npm:
    cmd: npm install -g tsup
    reference: https://github.com/egoist/tsup?tab=readme-ov-file#%EF%B8%8F-install
    dsnap: tsup
binlist:
- tsup

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 6 KB
          rating: 1
          desc:
            cn: 约 6 KB（估算）
            en: ~6 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
