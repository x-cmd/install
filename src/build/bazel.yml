lang: Java
homepage: https://github.com/bazelbuild/bazel
license: Apache-2.0
desc:
  cn: Bazel 是一款与 Make、Maven 和 Gradle 类似的开源构建和测试工具
  en: Bazel is an open-source build and test tool similar to Make, Maven, and Gradle
  cs: Bazel je open source nástroj pro sestavování a testování podobný Make, Maven a Gradle
  de: Bazel ist ein quelloffenes Build- und Testwerkzeug ähnlich wie Make, Maven und Gradle
  es: Bazel es una herramienta de compilación y pruebas de código abierto similar a Make, Maven y Gradle
  fr: Bazel est un outil open source de build et de test similaire à Make, Maven et Gradle
  id: Bazel adalah alat build dan tes sumber terbuka mirip dengan Make, Maven, dan Gradle
  it: Bazel è uno strumento open source per la compilazione e i test simile a Make, Maven e Gradle
  ja: Bazel は Make、Maven、Gradle に似たオープンソースのビルドとテストツールです
  ko: Bazel은 Make, Maven, Gradle과 유사한 오픈 소스 빌드 및 테스트 도구입니다
  pl: Bazel to narzędzie do budowania i testowania o otwartym kodzie, podobne do Make, Maven i Gradle
  pt: O Bazel é uma ferramenta de build e teste de código aberto semelhante a Make, Maven e Gradle
  ro: Bazel este un instrument de build și test cu sursă deschisă, similar cu Make, Maven și Gradle
  ru: Bazel — инструмент сборки и тестирования с открытым исходным кодом, похожий на Make, Maven и Gradle
  th: Bazel เป็นเครื่องมือสร้างและทดสอบแบบโอเพนซอร์สคล้ายกับ Make, Maven และ Gradle
  tr: Bazel, Make, Maven ve Gradle'a benzer bir açık kaynaklı derleme ve test aracıdır
  uk: Bazel — інструмент збірки та тестування з відкритим кодом, подібний до Make, Maven та Gradle
  vi: Bazel là công cụ build và test mã nguồn mở tương tự Make, Maven và Gradle
x:
  source: https://github.com/bazelbuild/bazel
  eget: bazelbuild/bazel
  apt: apt-transport-https
  brew: bazel
  zypper: bazel
  scoop: bazel
  choco: bazel
rule:
  /eget:
    cmd: x eget bazelbuild/bazel
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install bazel
    reference: https://bazel.build/install/os-x
  (win|wsl2)/scoop:
    cmd: x scoop install bazel
    reference: https://bazel.build/install/windows#scoop
  (win|wsl2)/choco:
    cmd: x choco install bazel
    reference: https://bazel.build/install/windows#chocolately
  ubuntu/apt:
    cmd: 'sudo apt install apt-transport-https curl gnupg -y && \

      curl -fsSL https://bazel.build/bazel-release.pub.gpg | gpg --dearmor >bazel-archive-keyring.gpg && \

      sudo mv bazel-archive-keyring.gpg /usr/share/keyrings && \

      echo "deb [arch=amd64 signed-by=/usr/share/keyrings/bazel-archive-keyring.gpg] https://storage.googleapis.com/bazel-apt stable jdk1.8" | sudo tee /etc/apt/sources.list.d/bazel.list  && \

      sudo apt update && sudo apt install bazel

      '
    reference: https://bazel.build/install/ubuntu#install-on-ubuntu
    dsnap: bazel
  opensuse/zypper:
    cmd: sudo zypper install bazel
    reference: https://bazel.build/install/suse#install-opensuse
binlist:
- bazel

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 63 MB
          rating: 3
          desc:
            cn: 安装 63 MB
            en: 63 MB install
        download:
          estimate: 63 MB
          desc:
            cn: 约 63 MB 下载 (linux/x64)
            en: ~63 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
