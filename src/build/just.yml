lang: Rust
homepage: https://github.com/casey/just
license: CC0-1.0
desc:
  cn: just 是保存和运行项目特定命令的便捷方法
  en: just is a handy way to save and run project-specific commands
  cs: just je pohodlný způsob, jak ukládat a spouštět projektové příkazy
  de: just ist ein praktischer Weg, projektspezifische Befehle zu speichern und auszuführen
  es: just es una forma práctica de guardar y ejecutar comandos específicos del proyecto
  fr: just est un moyen pratique de enregistrer et d'exécuter des commandes propres à un projet
  id: just adalah cara praktis untuk menyimpan dan menjalankan perintah khusus proyek
  it: just è un modo comodo per salvare ed eseguire comandi specifici del progetto
  ja: just はプロジェクト固有のコマンドを保存して実行する手軽な方法です
  ko: just는 프로젝트별 명령을 저장하고 실행하는 편리한 방법입니다
  pl: just to wygodny sposób na zapisywanie i uruchamianie poleceń specyficznych dla projektu
  pt: just é uma maneira prática de salvar e executar comandos específicos do projeto
  ro: just este o modalitate practică de a salva și a rula comenzi specifice proiectului
  ru: just — удобный способ сохранять и выполнять проектные команды
  th: just เป็นวิธีที่สะดวกในการบันทึกและรันคำสั่งเฉพาะของโปรเจกต์
  tr: just, projeye özgü komutları kaydedip çalıştırmanın kullanışlı bir yoludur
  uk: just — зручний спосіб зберігати та виконувати проєктні команди
  vi: just là cách tiện lợi để lưu và chạy các lệnh riêng của dự án
x:
  source: https://github.com/casey/just
  eget: casey/just
  apt: just
  dnf: just
  brew: just
  pacman: just
  apk: just
  port: just
  xbps: just
  eopkg: just
  scoop: just
  choco: just
  cargo: just
  asdf: just
rule:
  /x:
    cmd: x pkg use just
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget casey/just
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install just
    reference: https://just.systems/man/zh/chapter_4.html
    dsnap: just
  (win|wsl2)/scoop:
    cmd: x scoop install just
    reference: https://just.systems/man/zh/chapter_4.html
  darwin/brew:
    cmd: brew install just
    reference: https://just.systems/man/zh/chapter_4.html
  darwin/port:
    cmd: sudo port install just
    reference: https://just.systems/man/zh/chapter_4.html
  arch/pacman:
    cmd: sudo pacman -S just
    reference: https://just.systems/man/zh/chapter_4.html
  /nix-env:
    cmd: nix-env -iA nixpkgs.just
    reference: https://just.systems/man/zh/chapter_4.html
  solus/eopkg:
    cmd: sudo eopkg install just
    reference: https://just.systems/man/zh/chapter_4.html
  void/xbps:
    cmd: xbps-install -S just
    reference: https://just.systems/man/zh/chapter_4.html
  freebsd/pkg:
    cmd: pkg install just
    reference: https://just.systems/man/zh/chapter_4.html
  alpine/apk:
    cmd: apk add just
    reference: https://just.systems/man/zh/chapter_4.html
  fedora/dnf:
    cmd: sudo dnf install just
    reference: https://just.systems/man/zh/chapter_4.html
  gentoo/emerge:
    cmd: "eselect repository enable guru && \

      emerge --sync guru && \

      emerge sys-devel/just

      "
    reference: https://just.systems/man/zh/chapter_4.html
  /conda:
    cmd: conda install -c conda-forge just
    reference: https://just.systems/man/zh/chapter_4.html
  (win|wsl2)/choco:
    cmd: x choco install just
    reference: https://just.systems/man/zh/chapter_4.html
  /snap:
    cmd: sudo snap install --edge --classic just
    reference: https://just.systems/man/zh/chapter_4.html
  /asdf:
    cmd: x asdf use just
    reference: https://github.com/olofvndrhr/asdf-just
  debian/make:
    cmd: 'git clone https://mpr.makedeb.org/just && \

      cd just && \

      makedeb -si

      '
    reference: https://just.systems/man/zh/chapter_4.html
  ubuntu/make:
    cmd: 'git clone https://mpr.makedeb.org/just && \

      cd just && \

      makedeb -si

      '
    reference: https://just.systems/man/zh/chapter_4.html
  debian/apt:
    cmd: sudo apt install just
    reference: https://just.systems/man/zh/chapter_4.html
  ubuntu/apt:
    cmd: sudo apt install just
    reference: https://just.systems/man/zh/chapter_4.html
binlist:
- just

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6.3 MB
          rating: 1
          desc:
            cn: 安装 6.3 MB
            en: 6.3 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
