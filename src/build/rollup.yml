lang: JavaScript
homepage: https://github.com/rollup/rollup
desc:
  cn: 将多个小型 JavaScript 模块打包成一个大型应用或库
  en: Packaging multiple small JavaScript modules into a large application or library
x:
  source: https://github.com/rollup/rollup
  yay: rollup
rule:
  /npm:
    cmd: npm install --global rollup
    reference: https://rollupjs.org/introduction/#installation
    dsnap: rollup
  arch/yay:
    cmd: yay -S rollup
    reference: https://aur.archlinux.org/packages/rollup
binlist:
- rollup
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 477 KB
          rating: 1
          desc:
            cn: 约 477 KB（估算）
            en: ~477 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
