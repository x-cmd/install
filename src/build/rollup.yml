lang: JavaScript
homepage: https://github.com/rollup/rollup
desc:
  cn: 将多个小型 JavaScript 模块打包成一个大型应用或库
  en: Packaging multiple small JavaScript modules into a large application or library
x:
  source: https://github.com/rollup/rollup
rule:
  /npm:
    cmd: npm install --global rollup
    reference: https://rollupjs.org/introduction/#installation
    dsnap: rollup
  arch/yay:
    cmd: yay -S rollup
    reference: https://aur.archlinux.org/packages/rollup
binlist:
- rollup
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
