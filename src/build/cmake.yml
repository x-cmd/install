lang: C
homepage: https://github.com/Kitware/CMake
license: BSD-3-Clause
desc:
  en: CMake is a tool to manage building of source code. Originally, CMake was designed as a generator for various dialects of Makefile, today CMake generates modern buildsystems such as Ninja as well as project files for IDEs such as Visual Studio and Xcode.
  cn: CMake 是一种管理源代码构建的工具。最初，CMake 被设计为各种 Makefile 方言的生成器，如今 CMake 生成现代构建系统，比如 Ninja，以及用于诸如 Visual Studio 和 Xcode 等集成开发环境的项目文件。
  cs: CMake je nástroj pro správu sestavování zdrojového kódu. Původně byl CMake navržen jako generátor různých dialektů Makefile, dnes CMake generuje moderní sestavovací systémy, jako je Ninja, a také projektové soubory pro IDE, jako je Visual Studio a Xcode.
  de: CMake ist ein Werkzeug zur Verwaltung des Build-Prozesses von Quellcode. ursprünglich wurde CMake als Generator für verschiedene Makefile-Dialekte entworfen, heute erzeugt CMake moderne Build-Systeme wie Ninja sowie Projektdateien für IDEs wie Visual Studio und Xcode.
  es: CMake es una herramienta para gestionar la compilación de código fuente. Originalmente, CMake se diseñó como un generador para varios dialectos de Makefile; hoy CMake genera sistemas de compilación modernos como Ninja, así como archivos de proyecto para IDE como Visual Studio y Xcode.
  fr: CMake est un outil de gestion de la compilation de code source. À l'origine, CMake a été conçu comme un générateur pour différents dialectes de Makefile ; aujourd'hui, CMake génère des systèmes de build modernes comme Ninja, ainsi que des fichiers de projet pour les EDI comme Visual Studio et Xcode.
  id: CMake adalah alat untuk mengelola pembangunan kode sumber. Awalnya, CMake dirancang sebagai generator untuk berbagai dialek Makefile, kini CMake menghasilkan sistem build modern seperti Ninja serta berkas proyek untuk IDE seperti Visual Studio dan Xcode.
  it: CMake è uno strumento per gestire la compilazione del codice sorgente. In origine CMake è stato progettato come generatore per diversi dialetti di Makefile; oggi CMake genera moderni sistemi di build come Ninja, oltre a file di progetto per IDE come Visual Studio e Xcode.
  ja: CMake はソースコードのビルドを管理するツールです。当初はさまざまな Makefile 方言のジェネレータとして設計されましたが，如今は Ninja のような現代的なビルドシステムや、Visual Studio や Xcode のような IDE のプロジェクトファイルを生成します。
  ko: CMake는 소스 코드 빌드를 관리하는 도구입니다. 처음에는 CMake는 다양한 Makefile 방언을 위한 생성기로 설계되었지만, 현재는 Ninja와 같은 현대적인 빌드 시스템과 Visual Studio 및 Xcode 같은 IDE의 프로젝트 파일을 생성합니다.
  pl: CMake to narzędzie do zarządzania kompilacją kodu źródłowego. Początkowo CMake zaprojektowano jako generator różnych dialektów Makefile, dziś generuje nowoczesne systemy budowania, takie jak Ninja, a także pliki projektów dla IDE, takich jak Visual Studio i Xcode.
  pt: CMake é uma ferramenta para gerenciar a compilação de código-fonte. Originalmente, o CMake foi projetado como um gerador para vários dialetos de Makefile; hoje, o CMake gera sistemas de build modernos como o Ninja, além de arquivos de projeto para IDEs como Visual Studio e Xcode.
  ro: CMake este un instrument pentru gestionarea compilării codului sursă. Inițial, CMake a fost conceput ca un generator pentru diverse dialecte de Makefile, astăzi CMake generează sisteme moderne de build precum Ninja, precum și fișiere de proiect pentru IDE-uri precum Visual Studio și Xcode.
  ru: CMake — это инструмент для управления сборкой исходного кода. Изначально CMake был создан как генератор различных диалектов Makefile, а сегодня он генерирует современные системы сборки, такие как Ninja, а также файлы проектов для IDE, таких как Visual Studio и Xcode.
  th: CMake เป็นเครื่องมือสำหรับจัดการการคอมไพล์ซอร์สโค้ด เดิมที CMake ถูกออกแบบให้เป็นตัวสร้างสำหรับ Makefile หลายแบบ แต่ในปัจจุบัน CMake สร้างระบบบิลด์สมัยใหม่ เช่น Ninja รวมถึงไฟล์โปรเจกต์สำหรับ IDE เช่น Visual Studio และ Xcode
  tr: CMake, kaynak kodun derlenmesini yönetmek için bir araçtır. Başlangıçta CMake, çeşitli Makefile lehçeleri için bir üretici olarak tasarlanmıştı; bugün CMake, Ninja gibi modern derleme sistemlerini ve Visual Studio ile Xcode gibi IDE'ler için proje dosyalarını üretir.
  uk: CMake — це інструмент для керування складанням вихідного коду. Спочатку CMake був створений як генератор різних діалектів Makefile, а сьогодні він генерує сучасні системи складання, такі як Ninja, а також файли проєктів для IDE, таких як Visual Studio та Xcode.
  vi: CMake là công cụ để quản lý việc biên dịch mã nguồn. Ban đầu, CMake được thiết kế như trình tạo cho nhiều phương diện Makefile, ngày nay CMake tạo ra các hệ thống build hiện đại như Ninja, cũng như tệp dự án cho IDE như Visual Studio và Xcode.
x:
  source: https://github.com/Kitware/CMake
  eget: Kitware/CMake
  brew: cmake
  scoop: cmake
  asdf: cmake
rule:
  /eget:
    cmd: x eget Kitware/CMake
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use cmake
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use cmake
    reference: https://github.com/asdf-community/asdf-cmake
  darwin/brew:
    cmd: brew install cmake
    reference: https://formulae.brew.sh/formula/cmake#default
  (win|wsl2)/scoop:
    cmd: x scoop install cmake
    reference: https://scoop.sh/#/apps?q=cmake
binlist:
- cmake
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 CMakeLists.txt 和源码文件
          en: Reads CMakeLists.txt and source files
        sensitive: []
      write:
        desc:
          cn: 生成 build/ 目录、CMakeCache、Makefile
          en: Generates build/ dir, CMakeCache, Makefiles
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 62 MB
          rating: 3
          desc:
            cn: 安装 62 MB
            en: 62 MB install
        download:
          estimate: 62 MB
          desc:
            cn: 约 62 MB 下载 (linux/x64)
            en: ~62 MB download (linux/x64)
      paths:
        data: []
        config:
        - "$HOME/.cmake"
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
      peak:
        estimate: 500 MB
        desc:
          cn: 大型项目配置时可达数百 MB
          en: Several hundred MB on large project configure
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: cmake --build 时调度编译器
          en: Schedules compilers during cmake --build
  platform:
    win: full
    linux: full
    darwin: full
