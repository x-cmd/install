lang: C
homepage: https://github.com/Kitware/CMake
license: BSD-3-Clause
desc:
  en: CMake is a tool to manage building of source code. Originally, CMake was designed as a generator for various dialects of Makefile, today CMake generates modern buildsystems such as Ninja as well as project files for IDEs such as Visual Studio and Xcode.
  cn: CMake 是一种管理源代码构建的工具。最初，CMake 被设计为各种 Makefile 方言的生成器，如今 CMake 生成现代构建系统，比如 Ninja，以及用于诸如 Visual Studio 和 Xcode 等集成开发环境的项目文件。
x:
  source: https://github.com/Kitware/CMake
  eget: https://github.com/Kitware/CMake
  brew: cmake
  scoop: cmake
  asdf: asdf
rule:
  /eget:
    cmd: x eget Kitware/CMake
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use cmake
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use cmake
    reference: https://github.com/asdf-community/asdf-cmake
  darwin/brew:
    cmd: brew install cmake
    reference: https://formulae.brew.sh/formula/cmake#default
  (win|wsl2)/scoop:
    cmd: x scoop install cmake
    reference: https://scoop.sh/#/apps?q=cmake
binlist:
- cmake
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 CMakeLists.txt 和源码文件
          en: Reads CMakeLists.txt and source files
        sensitive: []
      write:
        desc:
          cn: 生成 build/ 目录、CMakeCache、Makefile
          en: Generates build/ dir, CMakeCache, Makefiles
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 62 MB
          rating: 3
          desc:
            cn: 安装 62 MB
            en: 62 MB install
        download:
          estimate: 62 MB
          desc:
            cn: 约 62 MB 下载 (linux/x64)
            en: ~62 MB download (linux/x64)
      paths:
        data: []
        config:
        - "$HOME/.cmake"
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
      peak:
        estimate: 500 MB
        desc:
          cn: 大型项目配置时可达数百 MB
          en: Several hundred MB on large project configure
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: cmake --build 时调度编译器
          en: Schedules compilers during cmake --build
  platform:
    win: none
    linux: full
    darwin: full
