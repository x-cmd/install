lang: JavaScript
homepage: https://github.com/jakejs/jake
license: Apache-2.0
desc:
  cn: JavaScript 构建工具, 类似于 Make 或 Rake。与 Node.js 一起构建
  en: JavaScript build tool, similar to Make or Rake. Built to work with Node.js
x:
  source: https://github.com/jakejs/jake
rule:
  /npm:
    cmd: npm install -g jake
    reference: https://jakejs.com/docs-page.html#item-overview-installation
    dsnap: jake
binlist:
- jake

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
