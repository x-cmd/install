lang: JavaScript
homepage: https://github.com/appium/appium
license: Apache-2.0
desc:
  en: Appium is an open-source, cross-platform test automation tool for native, hybrid, mobile web and desktop apps
  cn: Appium 是用于本机，混合，移动网络和桌面应用的开源，跨平台测试自动化工具
x:
  source: https://github.com/appium/appium
rule:
  darwin/brew:
    cmd: brew install appium
    reference: https://formulae.brew.sh/formula/appium#default
  /npm:
    cmd: npm i --location=global appium
    reference: https://appium.io/docs/en/2.2/quickstart/install/
    dsnap: appium
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras && x scoop install extras/appium

      '
    reference: https://scoop.sh/#/apps?q=Appium+
binlist:
- appium

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
