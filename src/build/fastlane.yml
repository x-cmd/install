lang: Ruby
homepage: https://github.com/fastlane/fastlane
license: MIT
desc:
  en: Fastlane is a tool for iOS and Android developers to automate tedious tasks like generating screenshots, dealing with provisioning profiles, and releasing your application
  cn: Fastlane 是 iOS 和 Android 开发人员的一个工具，可以自动完成诸如生成屏幕截图、处理配置文件和发布应用程序等乏味的任务
x:
  source: https://github.com/fastlane/fastlane
  eget: https://github.com/fastlane/fastlane
rule:
  /eget:
    cmd: x eget fastlane/fastlane
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install fastlane
    reference: https://formulae.brew.sh/formula/fastlane#default
  arch/yay:
    cmd: yay -S fastlane
    reference: https://aur.archlinux.org/packages/fastlane
binlist:
- fastlane
