lang: C
homepage: https://github.com/prkgconf/pkgconf
desc:
  en: pkgconf is a program which helps to configure compiler and linker flags for development libraries
  cn: pkgconf 是一个帮助配置开发库的编译器和链接器标志的程序。
x:
  source: https://github.com/prkgconf/pkgconf
rule:
  darwin/brew:
    cmd: brew install pkgconf
    reference: https://formulae.brew.sh/formula/pkgconf#default
  arch/yay:
    cmd: yay -S pkgconf-git
    reference: https://aur.archlinux.org/packages/pkgconf-git
binlist:
- pkgconf
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
