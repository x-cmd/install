lang: C
homepage: https://github.com/prkgconf/pkgconf
desc:
  en: pkgconf is a program which helps to configure compiler and linker flags for development libraries
  cn: pkgconf 是一个帮助配置开发库的编译器和链接器标志的程序。
x:
  source: https://github.com/prkgconf/pkgconf
rule:
  darwin/brew:
    cmd: brew install pkgconf
    reference: https://formulae.brew.sh/formula/pkgconf#default
  arch/yay:
    cmd: yay -S pkgconf-git
    reference: https://aur.archlinux.org/packages/pkgconf-git
binlist:
- pkgconf
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
