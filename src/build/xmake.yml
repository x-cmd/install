lang: Lua
homepage: https://github.com/xmake-io/xmake
license: Apache-2.0
desc:
  cn: Xmake 是一个基于 Lua 的轻量级跨平台构建工具
  en: Xmake is a cross-platform build utility based on the Lua scripting language
x:
  source: https://github.com/xmake-io/xmake
rule:
  /curl:
    cmd: curl -fsSL https://xmake.io/shget.text | bash
    reference: https://github.com/xmake-io/xmake?tab=readme-ov-file#with-curl
  /wget:
    cmd: wget https://xmake.io/shget.text -O - | bash
    reference: https://github.com/xmake-io/xmake?tab=readme-ov-file#with-wget
  win/powershell:
    cmd: Invoke-Expression (Invoke-Webrequest 'https://xmake.io/psget.text' -UseBasicParsing).Content
    reference: https://github.com/xmake-io/xmake?tab=readme-ov-file#with-powershell
binlist:
- xmake

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3 MB
          rating: 1
          desc:
            cn: 安装 3 MB
            en: 3 MB install
        download:
          estimate: 3 MB
          desc:
            cn: 约 3 MB 下载 (linux/x64)
            en: ~3 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
