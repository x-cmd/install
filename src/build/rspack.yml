lang: Rust
homepage: https://github.com/web-infra-dev/rspack
license: MIT
desc:
  cn: 基于 Rust 的高性能 Web 构建工具
  en: A fast Rust-based web bundler
x:
  source: https://github.com/web-infra-dev/rspack
rule:
  /npm:
    cmd: npm install -g @rspack/cli
    reference: https://www.rspack.dev/guide/quick-start.html
    dsnap: '@rspack/cli'
binlist:
- rspack

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
