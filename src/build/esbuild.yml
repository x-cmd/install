lang: Go
homepage: https://github.com/evanw/esbuild
license: MIT
desc:
  en: Extremely fast JavaScript bundler and minifier
  cn: 极快的 JavaScript 打包器和压缩器
  cs: Extremně rychlý JavaScript bundler a minifikátor
  de: Extrem schneller JavaScript-Bundler und Minifier
  es: Empaquetador y minificador de JavaScript extremadamente rápido
  fr: Bundler et minifieur JavaScript extrêmement rapide
  id: Bundler dan minifier JavaScript yang sangat cepat
  it: Bundler e minificatore JavaScript estremamente veloce
  ja: 超高速な JavaScript バンドラーおよびミニフィカー
  ko: 극도로 빠른 JavaScript 번들러 및 미니파이터
  pl: Wyjątkowo szybki bundler i minifikator JavaScript
  pt: Empacotador e minificador de JavaScript extremamente rápido
  ro: Bundler și minificator JavaScript extrem de rapid
  ru: Очень быстрый бандлер и минификатор JavaScript
  th: ตัวรวมและตัวย่อขนาด JavaScript ที่เร็วมาก
  tr: Son derece hızlı JavaScript paketleyici ve küçültücü
  uk: Надзвичайно швидкий бандлер і мініфікатор JavaScript
  vi: Trình đóng gói và nén cực nhanh cho JavaScript
x:
  source: https://github.com/evanw/esbuild
  brew: esbuild
  yay: esbuild-git
  npm: esbuild
rule:
  /npm:
    cmd: npm install -g esbuild
    reference: https://esbuild.github.io/getting-started/#install-esbuild
    dsnap: esbuild
  darwin/brew:
    cmd: brew install esbuild
    reference: https://formulae.brew.sh/formula/esbuild#default
  arch/yay:
    cmd: yay -S esbuild-git
    reference: https://aur.archlinux.org/packages/esbuild-git
binlist:
- esbuild

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 约 16 MB（估算）
            en: ~16 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
