lang: Go
homepage: https://github.com/evanw/esbuild
license: MIT
desc:
  en: Extremely fast JavaScript bundler and minifier
  cn: 极快的 JavaScript 打包器和压缩器
x:
  source: https://github.com/evanw/esbuild
rule:
  /npm:
    cmd: npm install -g esbuild
    reference: https://esbuild.github.io/getting-started/#install-esbuild
    dsnap: esbuild
  darwin/brew:
    cmd: brew install esbuild
    reference: https://formulae.brew.sh/formula/esbuild#default
  arch/yay:
    cmd: yay -S esbuild-git
    reference: https://aur.archlinux.org/packages/esbuild-git
binlist:
- esbuild

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
