lang: Go
homepage: https://github.com/evanw/esbuild
license: MIT
desc:
  en: Extremely fast JavaScript bundler and minifier
  cn: 极快的 JavaScript 打包器和压缩器
x:
  source: https://github.com/evanw/esbuild
rule:
  /npm:
    cmd: npm install -g esbuild
    reference: https://esbuild.github.io/getting-started/#install-esbuild
    dsnap: esbuild
  darwin/brew:
    cmd: brew install esbuild
    reference: https://formulae.brew.sh/formula/esbuild#default
  arch/yay:
    cmd: yay -S esbuild-git
    reference: https://aur.archlinux.org/packages/esbuild-git
binlist:
- esbuild

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 约 16 MB（估算）
            en: ~16 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
