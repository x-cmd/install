lang: JavaScript
homepage: https://github.com/vercel/pkg
license: MIT
desc:
  en: Package your Node.js project into an executable that can be run even on devices without Node.js installed
  cn: 将您的 Node.js 项目打包成可执行文件，即使在没有安装 Node.js 的设备上也可以运行
x:
  source: https://github.com/vercel/pkg
rule:
  /npm:
    cmd: npm install -g pkg
    reference: https://github.com/vercel/pkg?tab=readme-ov-file#usage
    dsnap: pkg
binlist:
- pkg
