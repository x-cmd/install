lang: JavaScript
homepage: https://github.com/vercel/pkg
license: MIT
desc:
  en: Package your Node.js project into an executable that can be run even on devices without Node.js installed
  cn: 将您的 Node.js 项目打包成可执行文件，即使在没有安装 Node.js 的设备上也可以运行
x:
  source: https://github.com/vercel/pkg
rule:
  /npm:
    cmd: npm install -g pkg
    reference: https://github.com/vercel/pkg?tab=readme-ov-file#usage
    dsnap: pkg
binlist:
- pkg

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
