lang: C++
homepage: https://github.com/ninja-build/ninja
license: Apache-2.0
desc:
  cn: Ninja 是一个注重速度的小型构建系统
  en: Ninja is a small build system with a focus on speed
  cs: Ninja je malý build systém zaměřený na rychlost
  de: Ninja ist ein kleines Buildsystem mit Fokus auf Geschwindigkeit
  es: Ninja es un sistema de compilación pequeño y enfocado en la velocidad
  fr: Ninja est un petit système de build axé sur la vitesse
  id: Ninja adalah sistem build kecil dengan fokus pada kecepatan
  it: Ninja è un piccolo sistema di build con un focus sulla velocità
  ja: Ninja は速度重視の小さなビルドシステムです
  ko: Ninja는 속도에 중점을 둔 작은 빌드 시스템입니다
  pl: Ninja to mały system budowania nastawiony na szybkość
  pt: Ninja é um pequeno sistema de build com foco em velocidade
  ro: Ninja este un sistem de build mic, cu accent pe viteză
  ru: Ninja — небольшая система сборки, ориентированная на скорость
  th: Ninja คือระบบบิลด์ขนาดเล็กที่เน้นความเร็ว
  tr: Ninja, hıza odaklanan küçük bir derleme sistemidir
  uk: Ninja — невелика система складання, зосереджена на швидкості
  vi: Ninja là hệ thống build nhỏ gọn tập trung vào tốc độ
x:
  source: https://github.com/ninja-build/ninja
  eget: ninja-build/ninja
  apt: ninja-build
  dnf: ninja-build
  brew: ninja
  pacman: ninja
  apk: ninja
  apt-get: ninja-build
  zypper: ninja
  port: ninja
  emerge: dev-util/ninja
  xbps: ninja
  scoop: ninja
  choco: ninja
  pip: ninja
rule:
  /eget:
    cmd: x eget ninja-build/ninja
    reference: https://x-cmd.com/mod/eget
  arch/pacman:
    cmd: sudo pacman -S ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#linux
  debian/apt:
    cmd: sudo apt-get install ninja-build
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#linux
    dsnap: ninja-build
  ubuntu/apt:
    cmd: sudo apt-get install ninja-build
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#linux
    dsnap: ninja-build
  fedora/dnf:
    cmd: sudo dnf install ninja-build
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#linux
    dsnap: ninja-build
  gentoo/emerge:
    cmd: sudo emerge dev-util/ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#linux
  opensuse/zypper:
    cmd: sudo zypper in ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#linux
  alpine/apk:
    cmd: sudo apk add ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#linux
    dsnap: ninja
  void/xbps:
    cmd: sudo xbps-install -S ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#linux
  darwin/brew:
    cmd: brew install ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#mac
  darwin/port:
    cmd: sudo port install ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#mac
  freebsd/pkg:
    cmd: pkg install ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#freebsd
  (win|wsl2)/scoop:
    cmd: x scoop install ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#windows
  (win|wsl2)/choco:
    cmd: x choco install ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#windows
  /conda:
    cmd: conda install -c conda-forge ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#user-level-package-managers
  /pip:
    cmd: python -m pip install ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#user-level-package-managers
  /spack:
    cmd: spack install ninja
    reference: https://github.com/ninja-build/ninja/wiki/Pre-built-Ninja-packages#user-level-package-managers
binlist:
- ninja

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.3 MB
          rating: 1
          desc:
            cn: 约 1.3 MB（估算）
            en: ~1.3 MB estimated
        download:
          estimate: 123 KB
          desc:
            cn: 约 123 KB 下载 (linux/arm64)
            en: ~123 KB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
