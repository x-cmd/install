lang: C++
homepage: https://github.com/ccache/ccache
desc:
  en: Ccache is a compiler cache.
  cn: CCACHE 是编译器缓存
x:
  source: https://github.com/ccache/ccache
  eget: https://github.com/ccache/ccache
rule:
  /eget:
    cmd: x eget ccache/ccache
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use ccache
    reference: https://github.com/asdf-community/asdf-ccache
  darwin/brew:
    cmd: brew install ccache
    reference: https://formulae.brew.sh/formula/ccache#default
  (win|wsl2)/scoop:
    cmd: x scoop install ccache
    reference: https://scoop.sh/#/apps?q=Ccache
  (win|wsl2)/choco:
    cmd: x choco install ccache
    reference: https://community.chocolatey.org/packages/ccache
binlist:
- ccache
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2.2 MB
          rating: 1
          desc:
            cn: 约 2.2 MB（估算）
            en: ~2.2 MB estimated
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
