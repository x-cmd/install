lang: JavaScript
homepage: https://github.com/webpack/webpack
license: MIT
desc:
  en: A bundler for javascript and friends. Packs many modules into a few bundled assets.
  cn: 一个用于 JavaScript 和友好的资源打包工具
x:
  source: https://github.com/webpack/webpack
  brew: webpack
  yay: nodejs-webpack
  npm: webpack
rule:
  /npm:
    cmd: npm install -g webpack
    reference: https://github.com/webpack/webpack?tab=readme-ov-file#install
    dsnap: webpack
  darwin/brew:
    cmd: brew install webpack
    reference: https://formulae.brew.sh/formula/webpack#default
  arch/yay:
    cmd: yay -S nodejs-webpack
    reference: https://aur.archlinux.org/packages/nodejs-webpack
binlist:
- webpack

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 804 KB
          rating: 1
          desc:
            cn: 约 804 KB（估算）
            en: ~804 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
