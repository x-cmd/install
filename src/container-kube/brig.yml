lang: Go
homepage: https://github.com/brigadecore/brigade
license: Apache-2.0
desc:
  cn: Brigade 是一个建立在 Kubernetes 之上的功能齐全、事件驱动的脚本平台
  en: Brigade is a full-featured, event-driven scripting platform built on top of Kubernetes
  cs: Brigade je plnohodnotná, událostmi řízená skriptovací platforma postavená na Kubernetes
  de: Brigade ist eine voll ausgestattete, ereignisgesteuerte Skripting-Plattform auf Basis von Kubernetes
  es: Brigade es una plataforma de scripts completa y orientada a eventos construida sobre Kubernetes
  fr: Brigade est une plateforme de scripting complète et pilotée par les événements, construite au-dessus de Kubernetes
  id: Brigade adalah platform skrip berbasis event yang lengkap, dibangun di atas Kubernetes
  it: Brigade è una piattaforma di scripting completa e basata su eventi, costruita su Kubernetes
  ja: Brigade は、Kubernetes の上に構築された高性能なイベント駆動型スクリプトプラットフォームです。
  ko: Brigade는 Kubernetes 위에 구축된 완전 featured 이벤트 기반 스크립팅 플랫폼입니다
  pl: Brigade to pełnofunkcjonalna, sterowana zdarzeniami platforma skryptowa zbudowana na Kubernetes
  pt: Brigade é uma plataforma de script completa, orientada a eventos, construída sobre o Kubernetes
  ro: Brigade este o platformă de scripting completă, bazată pe evenimente, construită deasupra Kubernetes
  ru: Brigade — это полнофункциональная событийно-ориентированная платформа скриптинга, построенная поверх Kubernetes
  th: Brigade คือแพลตฟอร์มสคริปต์แบบเต็มรูปแบบและขับเคลื่อนด้วยเหตุการณ์ ที่สร้างบน Kubernetes
  tr: Brigade, Kubernetes üzerine kurulmuş tam özellikli, olay güdümlü bir betik platformudur
  uk: Brigade — це повнофункціональна подієва платформа скриптингу, побудована поверх Kubernetes
  vi: Brigade là nền tảng script đầy đủ tính năng, hướng sự kiện, xây dựng trên Kubernetes
x:
  source: https://github.com/brigadecore/brigade
  asdf: brig
rule:
  /asdf:
    cmd: x asdf use brig
    reference: https://github.com/Ibotta/asdf-brig?tab=readme-ov-file#installation
binlist:
- brig

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 9.2 MB
          rating: 1
          desc:
            cn: 安装 9.2 MB
            en: 9.2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
