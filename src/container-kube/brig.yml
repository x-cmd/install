lang: Go
homepage: https://github.com/brigadecore/brigade
license: Apache-2.0
desc:
  cn: Brigade 是一个建立在 Kubernetes 之上的功能齐全、事件驱动的脚本平台
  en: Brigade is a full-featured, event-driven scripting platform built on top of Kubernetes
x:
  source: https://github.com/brigadecore/brigade
rule:
  /asdf:
    cmd: x asdf use brig
    reference: https://github.com/Ibotta/asdf-brig?tab=readme-ov-file#installation
binlist:
- brig

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
