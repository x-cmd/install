lang: Go
homepage: https://github.com/k3s-io/k3s
license: Apache-2.0
desc:
  cn: K3s 是轻量级的 Kubernetes
  en: K3s is Lightweight Kubernetes
  cs: K3s je lehký Kubernetes
  de: K3s ist leichtgewichtiges Kubernetes
  es: K3s es un Kubernetes ligero
  fr: K3s est un Kubernetes léger
  id: K3s adalah Kubernetes ringan
  it: K3s è un Kubernetes leggero
  ja: K3s は軽量な Kubernetes です
  ko: K3s는 경량 Kubernetes입니다
  pl: K3s to lekki Kubernetes
  pt: K3s é um Kubernetes leve
  ro: K3s este un Kubernetes ușor
  ru: K3s — это лёгкий Kubernetes
  th: K3s คือ Kubernetes ขนาดเบา
  tr: K3s hafif bir Kubernetes'tir
  uk: K3s — це легкий Kubernetes
  vi: K3s là Kubernetes nhẹ
x:
  source: https://github.com/k3s-io/k3s
  eget: k3s-io/k3s
  yay: k3s-bin
rule:
  /eget:
    cmd: x eget k3s-io/k3s
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S k3s-bin
    reference: https://aur.archlinux.org/packages/k3s-bin
  /curl:
    cmd: "if [ \"$___X_CMD_WEBSRC_REGION\" = \"cn\" ]; then\n  curl -sfL https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | INSTALL_K3S_MIRROR=cn sh -\nelse\n  curl -sfL https://get.k3s.io | sh -\nfi\n"
    reference: https://docs.k3s.io/zh/quick-start
binlist:
- k3s

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 186 MB
          rating: 3
          desc:
            cn: 安装 186 MB
            en: 186 MB install
        download:
          estimate: 186 MB
          desc:
            cn: 约 186 MB 下载 (macos/x64)
            en: ~186 MB download (macos/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
