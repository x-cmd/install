lang: Go
homepage: https://github.com/k3s-io/k3s
license: Apache-2.0
desc:
  cn: K3s 是轻量级的 Kubernetes
  en: K3s is Lightweight Kubernetes
x:
  source: https://github.com/k3s-io/k3s
  eget: https://github.com/k3s-io/k3s
rule:
  /eget:
    cmd: x eget k3s-io/k3s
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S k3s-bin
    reference: https://aur.archlinux.org/packages/k3s-bin
  /curl:
    cmd: "if [ \"$___X_CMD_WEBSRC_REGION\" = \"cn\" ]; then\n  curl -sfL https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | INSTALL_K3S_MIRROR=cn sh -\nelse\n  curl -sfL https://get.k3s.io | sh -\nfi\n"
    reference: https://docs.k3s.io/zh/quick-start
binlist:
- k3s

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4.9 MB
          rating: 1
          desc:
            cn: 约 4.9 MB（估算）
            en: ~4.9 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
