lang: Go
homepage: https://github.com/k3d-io/k3d
license: MIT
desc:
  cn: k3d 是一个轻量级封装工具，用于在 Docker 中运行 k3s（Rancher Lab 的精简 Kubernetes 发行版）
  en: k3d is a lightweight wrapper to run k3s (Rancher Lab’s minimal Kubernetes distribution) in docker
x:
  pkg:
    exist: true
  source: https://github.com/k3d-io/k3d
  eget: https://github.com/k3d-io/k3d
rule:
  /x:
    cmd: x pkg use k3d
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget k3d-io/k3d
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S rancher-k3d-bin
    reference: https://aur.archlinux.org/packages/rancher-k3d-bin
  /asdf:
    cmd: x asdf use k3d
    reference: https://github.com/spencergilbert/asdf-k3d
  darwin/brew:
    cmd: brew install k3d
    reference: https://formulae.brew.sh/formula/k3d#default
  debian/apt:
    cmd: sudo apt-get install k3d
    reference: https://command-not-found.com/k3d
    dsnap: k3d
  ubuntu/apt:
    cmd: sudo apt-get install k3d
    reference: https://command-not-found.com/k3d
    dsnap: k3d
  fedora/dnf:
    cmd: sudo dnf install k3d
    reference: https://command-not-found.com/k3d
    dsnap: k3d
  raspbian/apt:
    cmd: sudo apt-get install k3d
    reference: https://command-not-found.com/k3d
  kali/apt:
    cmd: sudo apt-get install k3d
    reference: https://command-not-found.com/k3d
    dsnap: k3d
binlist:
- k3d

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
