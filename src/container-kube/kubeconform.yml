lang: Go
homepage: https://github.com/yannh/kubeconform
license: Apache-2.0
desc:
  cn: KubeConform 是 Kubernetes 清单验证工具
  en: Kubeconform is a Kubernetes manifest validation tool
x:
  source: https://github.com/yannh/kubeconform
  eget: https://github.com/yannh/kubeconform
rule:
  /eget:
    cmd: x eget yannh/kubeconform
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install kubeconform
    reference: https://github.com/yannh/kubeconform?tab=readme-ov-file#installation
  (win|wsl2)/winget:
    cmd: x winget install YannHamon.kubeconform
    reference: https://github.com/yannh/kubeconform?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/yannh/kubeconform/cmd/kubeconform@latest
    reference: https://github.com/yannh/kubeconform?tab=readme-ov-file#installation
    dsnap: github.com/yannh/kubeconform/cmd/kubeconform@latest
  /asdf:
    cmd: x asdf use kubeconform
    reference: https://github.com/lirlia/asdf-kubeconform?tab=readme-ov-file#usage
binlist:
- kubeconform

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
