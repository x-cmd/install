lang: Go
homepage: https://github.com/yannh/kubeconform
license: Apache-2.0
desc:
  cn: KubeConform 是 Kubernetes 清单验证工具
  en: Kubeconform is a Kubernetes manifest validation tool
  cs: Kubeconform je nástroj pro validaci manifestů Kubernetes
  de: Kubeconform ist ein Kubernetes-Manifestvalidierungswerkzeug
  es: Kubeconform es una herramienta de validación de manifiestos de Kubernetes
  fr: Kubeconform est un outil de validation des manifestes Kubernetes
  id: Kubeconform adalah alat validasi manifes Kubernetes
  it: Kubeconform è uno strumento di validazione dei manifest Kubernetes
  ja: Kubeconform は Kubernetes マニフェスト検証ツールです
  ko: Kubeconform는 Kubernetes 매니페스트 검증 도구입니다
  pl: Kubeconform to narzędzie do walidacji manifestów Kubernetes
  pt: Kubeconform é uma ferramenta de validação de manifestos do Kubernetes
  ro: Kubeconform este un instrument de validare a manifestelor Kubernetes
  ru: Kubeconform — это инструмент валидации манифестов Kubernetes
  th: Kubeconform คือเครื่องมือตรวจสอบความถูกต้องของไฟล์ manifest ของ Kubernetes
  tr: Kubeconform, Kubernetes manifest doğrulama aracıdır
  uk: Kubeconform — це інструмент валідації манifestів Kubernetes
  vi: Kubeconform là công cụ xác thực manifest Kubernetes
x:
  source: https://github.com/yannh/kubeconform
  eget: yannh/kubeconform
  brew: kubeconform
  winget: YannHamon.kubeconform
  go: github.com/yannh/kubeconform/cmd/kubeconform@latest
  asdf: kubeconform
rule:
  /eget:
    cmd: x eget yannh/kubeconform
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install kubeconform
    reference: https://github.com/yannh/kubeconform?tab=readme-ov-file#installation
  (win|wsl2)/winget:
    cmd: x winget install YannHamon.kubeconform
    reference: https://github.com/yannh/kubeconform?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/yannh/kubeconform/cmd/kubeconform@latest
    reference: https://github.com/yannh/kubeconform?tab=readme-ov-file#installation
    dsnap: github.com/yannh/kubeconform/cmd/kubeconform@latest
  /asdf:
    cmd: x asdf use kubeconform
    reference: https://github.com/lirlia/asdf-kubeconform?tab=readme-ov-file#usage
binlist:
- kubeconform

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 安装 13 MB
            en: 13 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 43 MB
        desc:
          cn: 43 MB
          en: 43 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
