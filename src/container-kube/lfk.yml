lang: 'Go'
homepage: 'https://github.com/janosmiko/lfk'
license: 'Apache-2.0'
desc:
  cn: 受 yazi 启发的极速键盘操作 Kubernetes TUI，三栏 Miller 布局
  en: '⚡ LFK is a lightning-fast, keyboard-focused, yazi-inspired terminal user interface for navigating and managing Kubernetes clusters. Built for speed and efficiency, it brings a three-column Miller c...'
x:
  source: https://github.com/janosmiko/lfk
  eget: https://github.com/janosmiko/lfk
rule:
  /eget:
    cmd: x eget janosmiko/lfk
    reference: https://github.com/janosmiko/lfk
binlist:
- 'lfk'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 29 MB
          rating: 2
          desc:
            cn: 约 29 MB（估算）
            en: ~29 MB estimated
        download:
          estimate: 20 MB
          desc:
            cn: 约 20 MB 下载 (linux/x64)
            en: ~20 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
