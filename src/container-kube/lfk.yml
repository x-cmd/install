lang: 'Go'
homepage: 'https://github.com/janosmiko/lfk'
license: 'Apache-2.0'
desc:
  cn: 受 yazi 启发的极速键盘操作 Kubernetes TUI，三栏 Miller 布局
  en: '⚡ LFK is a lightning-fast, keyboard-focused, yazi-inspired terminal user interface for navigating and managing Kubernetes clusters. Built for speed and efficiency, it brings a three-column Miller c...'
x:
  source: https://github.com/janosmiko/lfk
  eget: https://github.com/janosmiko/lfk
rule:
  /eget:
    cmd: x eget janosmiko/lfk
    reference: https://github.com/janosmiko/lfk
binlist:
  - 'lfk'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
