lang: 'Rust'
homepage: 'https://github.com/fioletoven/b4n'
license: 'MIT'
desc:
  cn: Rust 编写的 Kubernetes API 终端界面 (TUI)
  en: 'Terminal user interface (TUI) for Kubernetes API written in Rust'
x:
  source: https://github.com/fioletoven/b4n
  eget: https://github.com/fioletoven/b4n
rule:
  /eget:
    cmd: x eget fioletoven/b4n
    reference: https://github.com/fioletoven/b4n
binlist:
  - 'b4n'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
