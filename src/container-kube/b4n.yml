lang: 'Rust'
homepage: 'https://github.com/fioletoven/b4n'
license: 'MIT'
desc:
  cn: Rust 编写的 Kubernetes API 终端界面 (TUI)
  en: 'Terminal user interface (TUI) for Kubernetes API written in Rust'
x:
  source: https://github.com/fioletoven/b4n
  eget: https://github.com/fioletoven/b4n
rule:
  /eget:
    cmd: x eget fioletoven/b4n
    reference: https://github.com/fioletoven/b4n
binlist:
- 'b4n'

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.2 MB
          rating: 1
          desc:
            cn: 安装 9.2 MB
            en: 9.2 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 7 MB
        desc:
          cn: 7 MB
          en: 7 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
