lang: 'Rust'
homepage: 'https://github.com/fioletoven/b4n'
license: 'MIT'
desc:
  cn: Rust 编写的 Kubernetes API 终端界面 (TUI)
  en: 'Terminal user interface (TUI) for Kubernetes API written in Rust'
  cs: Terminálové uživatelské rozhraní (TUI) pro Kubernetes API napsané v Rustu
  de: Terminal-Benutzeroberfläche (TUI) für die Kubernetes-API, geschrieben in Rust
  es: Interfaz de usuario de terminal (TUI) para la API de Kubernetes escrita en Rust
  fr: Interface utilisateur en terminal (TUI) pour l'API Kubernetes écrite en Rust
  id: Antarmuka pengguna terminal (TUI) untuk Kubernetes API yang ditulis dengan Rust
  it: Interfaccia utente a terminale (TUI) per la Kubernetes API scritta in Rust
  ja: Rust で書かれた Kubernetes API 用のターミナルユーザーインターフェース (TUI) です。
  ko: Rust로 작성된 Kubernetes API용 터미널 사용자 인터페이스(TUI)
  pl: Terminalowy interfejs użytkownika (TUI) dla Kubernetes API napisany w Rust
  pt: Interface de usuário de terminal (TUI) para a API do Kubernetes escrita em Rust
  ro: Interfață de utilizator în terminal (TUI) pentru API-ul Kubernetes scrisă în Rust
  ru: Терминальный пользовательский интерфейс (TUI) для Kubernetes API, написанный на Rust
  th: อินเทอร์เฟซผู้ใช้แบบเทอร์มินัล (TUI) สำหรับ Kubernetes API ที่เขียนด้วย Rust
  tr: Rust ile yazılmış Kubernetes API için terminal kullanıcı arayüzü (TUI)
  uk: Термінальний інтерфейс користувача (TUI) для Kubernetes API, написаний на Rust
  vi: Giao diện người dùng dạng terminal (TUI) cho Kubernetes API viết bằng Rust
x:
  source: https://github.com/fioletoven/b4n
  eget: fioletoven/b4n
rule:
  /eget:
    cmd: x eget fioletoven/b4n
    reference: https://github.com/fioletoven/b4n
binlist:
- 'b4n'

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 9.2 MB
          rating: 1
          desc:
            cn: 安装 9.2 MB
            en: 9.2 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 7 MB
        desc:
          cn: 7 MB
          en: 7 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
