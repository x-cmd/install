lang: Go
homepage: https://github.com/fluxcd/flux2
license: Apache-2.0
desc:
  cn: Flux 是一套开放、可扩展的 Kubernetes 持续渐进式交付解决方案
  en: Flux is a set of continuous and progressive delivery solutions for Kubernetes that are open and extensible
  cs: Flux je sada průběžných a postupných řešení doručování pro Kubernetes, která jsou otevřená a rozšiřitelná
  de: Flux ist eine Sammlung offener und erweiterbarer kontinuierlicher und progressiver Lösungen für die Bereitstellung auf Kubernetes
  es: Flux es un conjunto de soluciones de entrega continua y progresiva para Kubernetes que son abiertas y extensibles
  fr: Flux est un ensemble de solutions de livraison continue et progressive pour Kubernetes, ouvertes et extensibles
  id: Flux adalah serangkaian solusi pengiriman kontinu dan progresif untuk Kubernetes yang bersifat terbuka dan dapat diperluas
  it: Flux è un insieme di soluzioni di distribuzione continua e progressiva per Kubernetes aperte ed estensibili
  ja: Flux は Kubernetes 向けの継続的・段階的デリバリーのソリューション群で、オープンで拡張可能です
  ko: Flux는 Kubernetes를 위한 지속적이고 점진적 배포 솔루션 모음으로, 개방형이며 확장 가능합니다
  pl: Flux to zestaw otwartych i rozszerzalnych rozwiązań do ciągłego i postępowego wdrażania w Kubernetes
  pt: O Flux é um conjunto de soluções de entrega contínua e progressiva para Kubernetes que são abertas e extensíveis
  ro: Flux este o suită de soluții de livrare continuă și progresivă pentru Kubernetes, deschise și extensibile
  ru: Flux — это набор открытых и расширяемых решений для непрерывной и прогрессивной доставки в Kubernetes
  th: Flux คือชุดโซลูชันการส่งมอบแบบต่อเนื่องและแบบก้าวหน้าสำหรับ Kubernetes ที่เป็นโอเพนและขยายตัวได้
  tr: Flux, Kubernetes için açık ve genişletilebilir sürekli ve kademeli dağıtım çözümleri kümesidir
  uk: Flux — це набір відкритих і розширюваних рішень для безперервної та прогресивної доставки в Kubernetes
  vi: Flux là bộ giải pháp triển khai liên tục và tiến bộ cho Kubernetes, mã nguồn mở và có thể mở rộng
x:
  source: https://github.com/fluxcd/flux2
  eget: fluxcd/flux2
  brew: fluxcd/tap/flux
  scoop: main/flux
  choco: flux
  yay: flux-bin
  asdf: flux2
rule:
  /eget:
    cmd: x eget fluxcd/flux2
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install fluxcd/tap/flux
    reference: https://fluxcd.io/flux/installation/#install-the-flux-cli
  /curl:
    cmd: curl -s https://fluxcd.io/install.sh | sudo bash
    reference: https://fluxcd.io/flux/installation/#install-the-flux-cli
  /nix-env:
    cmd: nix-env -i fluxcd
    reference: https://fluxcd.io/flux/installation/#install-the-flux-cli
  /yay:
    cmd: yay -S flux-bin
    reference: https://fluxcd.io/flux/installation/#install-the-flux-cli
  (win|wsl2)/choco:
    cmd: x choco install flux
    reference: https://fluxcd.io/flux/installation/#install-the-flux-cli
  (win|wsl2)/scoop:
    cmd: x scoop install main/flux
    reference: https://scoop.sh/#/apps?q=flux
  /asdf:
    cmd: x asdf use flux
    reference: https://github.com/tablexi/asdf-flux2?tab=readme-ov-file#install
binlist:
- flux2

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 24 MB
          rating: 2
          desc:
            cn: 安装 24 MB
            en: 24 MB install
        download:
          estimate: 24 MB
          desc:
            cn: 约 24 MB 下载 (linux/x64)
            en: ~24 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
