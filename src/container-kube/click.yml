lang: Rust
homepage: https://github.com/databricks/click
license: Apache-2.0
desc:
  cn: Click 是 Kubernetes 的命令行交互控制器。它的目的是快速有效地管理大量的 Kubernetes 集群/对象
  en: Click is the Command Line Interactive Controller for Kubernetes. Its purpose is to manage a large number of Kubernetes clusters/objects quickly and efficiently
x:
  source: https://github.com/databricks/click
  eget: https://github.com/databricks/click
rule:
  /eget:
    cmd: x eget databricks/click
    reference: https://x-cmd.com/mod/eget
  /cargo:
    cmd: cargo install click
    reference: https://github.com/databricks/click?tab=readme-ov-file#installing
    dsnap: click
  darwin/brew:
    cmd: brew install click
    reference: https://formulae.brew.sh/formula/click#default
binlist:
- click

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
