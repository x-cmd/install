lang: Go
homepage: https://github.com/sighupio/furyctl
license: Apache-2.0
desc:
  cn: Furyctl 是 Kubernetes Fury 发行版的命令行伴侣，用于管理 Kubernetes Fury 集群的整个生命周期
  en: furyctl is the command line companion for the Kubernetes Fury Distribution to manage the full lifecycle of your Kubernetes Fury clusters
x:
  source: https://github.com/sighupio/furyctl
  eget: sighupio/furyctl
  asdf: furyctl
rule:
  /eget:
    cmd: x eget sighupio/furyctl
    reference: https://x-cmd.com/mod/eget
  /curl:
    cmd: 'curl -L "https://github.com/sighupio/furyctl/releases/latest/download/furyctl-$(uname -s)-amd64.tar.gz" -o /tmp/furyctl.tar.gz && tar xfz /tmp/furyctl.tar.gz -C /tmp \

      && chmod +x /tmp/furyctl \

      && sudo mv /tmp/furyctl /usr/local/bin/furyctl

      '
    reference: https://github.com/sighupio/furyctl?tab=readme-ov-file#installing-from-binaries
  /asdf:
    cmd: x asdf use furyctl
    reference: https://github.com/sighupio/asdf-furyctl?tab=readme-ov-file#install
binlist:
- furyctl
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # k8s API
    filesystem:
      read:
        desc:
          cn: 读取 furyctl.yaml 配置
          en: Reads furyctl.yaml config
        sensitive:
          - "furyctl.yaml"
  resource:
    disk:
      size:
        install:
          estimate: 7.1 MB
          rating: 1
          desc:
            cn: 约 7.1 MB（估算）
            en: ~7.1 MB estimated

      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
      peak:
        estimate: 100 MB
        desc:
          cn: ~100 MB
          en: ~100 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 集群 provision 时短暂占用
          en: Brief spike on cluster provision
