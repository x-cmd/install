lang: Go
homepage: https://github.com/bitnami-labs/sealed-secrets
license: Apache-2.0
desc:
  cn: Kubeseal 是一个 Kubernetes 控制器和工具，用于加密和解密 Kubernetes Secrets
  en: A Kubernetes controller and tool for one-way encrypted Secrets
  cs: Kubeseal je Kubernetes controller a nástroj pro jednosměrné šifrování Secrets
  de: Ein Kubernetes-Controller und Werkzeug für einseitig verschlüsselte Secrets
  es: Kubeseal es un controlador de Kubernetes y una herramienta para cifrar Secrets de forma unidireccional
  fr: Kubeseal est un contrôleur Kubernetes et un outil pour le chiffrement à sens unique de Secrets
  id: Kubeseal adalah controller Kubernetes dan alat untuk enkripsi Secrets satu arah
  it: Kubeseal è un controller Kubernetes e uno strumento per la cifratura monodirezionale dei Secret
  ja: Kubeseal は一方向暗号化 Secrets 用の Kubernetes コントローラーおよびツールです
  ko: Kubeseal은 단방향 암호화된 Secrets를 위한 Kubernetes 컨트롤러이자 도구입니다
  pl: Kubeseal to kontroler Kubernetes i narzędzie do jednokierunkowego szyfrowania Secretów
  pt: O Kubeseal é um controlador do Kubernetes e uma ferramenta para criptografia unidirecional de Secrets
  ro: Kubeseal este un controler Kubernetes și un instrument pentru criptarea unidirecțională a Secret-urilor
  ru: Kubeseal — это контроллер Kubernetes и инструмент для одностороннего шифрования Secret
  th: Kubeseal คือคอนโทรลเลอร์ Kubernetes และเครื่องมือสำหรับการเข้ารหัสแบบทางเดียวของ Secrets
  tr: Kubeseal, tek yönlü şifrelenmiş Secrets için bir Kubernetes denetleyicisi ve aracıdır
  uk: Kubeseal — це контролер Kubernetes та інструмент для одностороннього шифрування Secret
  vi: Kubeseal là một controller Kubernetes và công cụ để mã hóa Secret theo một chiều
x:
  source: https://github.com/bitnami-labs/sealed-secrets
  eget: bitnami-labs/sealed-secrets
  brew: kubeseal
  port: kubeseal
  go: github.com/bitnami-labs/sealed-secrets/cmd/kubeseal@main
  asdf: kubeseal
rule:
  /eget:
    cmd: x eget bitnami-labs/sealed-secrets
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use kubeseal
    reference: https://github.com/stefansedich/asdf-kubeseal?tab=readme-ov-file#install
  /helm:
    cmd: 'helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets \

      && helm install sealed-secrets -n kube-system --set-string fullnameOverride=sealed-secrets-controller sealed-secrets/sealed-secrets

      '
    reference: https://github.com/bitnami-labs/sealed-secrets?tab=readme-ov-file#helm-chart
  darwin/brew:
    cmd: brew install kubeseal
    reference: https://github.com/bitnami-labs/sealed-secrets?tab=readme-ov-file#homebrew
  darwin/port:
    cmd: sudo port install kubeseal
    reference: https://github.com/bitnami-labs/sealed-secrets?tab=readme-ov-file#macports
  /nixpkgs:
    cmd: nix-env -iA nixpkgs.kubeseal
    reference: https://github.com/bitnami-labs/sealed-secrets?tab=readme-ov-file#nixpkgs
  /go:
    cmd: go install github.com/bitnami-labs/sealed-secrets/cmd/kubeseal@main
    reference: https://github.com/bitnami-labs/sealed-secrets?tab=readme-ov-file#installation-from-source
    dsnap: github.com/bitnami-labs/sealed-secrets/cmd/kubeseal@main
binlist:
- kubeseal

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
