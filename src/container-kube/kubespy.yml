lang: Go
homepage: https://github.com/pulumi/kubespy
license: Apache-2.0
desc:
  cn: kubespy 是一个小工具，可以轻松观察 Kubernetes 资源如何实时变化，源自我们在 Pulumi 的 CLI 中使 Kubernetes 部署可预测的工作
  en: kubespy is a small tool that makes it easy to observe how Kubernetes resources change in real time, derived from the work we did to make Kubernetes deployments predictable in Pulumi's CLI
x:
  source: https://github.com/pulumi/kubespy
  eget: https://github.com/pulumi/kubespy
rule:
  /eget:
    cmd: x eget pulumi/kubespy
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kubespy
    reference: https://aur.archlinux.org/packages/kubespy
  darwin/brew:
    cmd: brew install kubespy
    reference: https://github.com/pulumi/kubespy?tab=readme-ov-file#homebrew-mac
  /go:
    cmd: go install github.com/pulumi/kubespy@latest
    reference: https://github.com/pulumi/kubespy?tab=readme-ov-file#via-golang
    dsnap: kubespy
  /asdf:
    cmd: x asdf use kubespy
    reference: https://github.com/jfreeland/asdf-kubespy?tab=readme-ov-file#install
binlist:
- kubespy

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 95 KB
          rating: 1
          desc:
            cn: 约 95 KB（估算）
            en: ~95 KB estimated
        download:
          estimate: 26 MB
          desc:
            cn: 约 26 MB 下载 (linux/x64)
            en: ~26 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
