lang: 'Python'
homepage: https://github.com/skypilot-org/skypilot
license: 'Apache-2.0'
desc:
  cn: 在任意 AI 基础设施上运行、管理和扩展 AI 工作负载的统一系统
  en: 'Run, manage, and scale AI workloads on any AI infrastructure. Use one system to access & manage all AI compute (Kubernetes, Slurm, 20+ clouds, on-prem).'
x:
  source: https://github.com/skypilot-org/skypilot
rule:
  /pip:
    cmd: pip install skypilot
    reference: https://pypi.org/project/skypilot/
    dsnap: skypilot
binlist:
  - 'skypilot'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
