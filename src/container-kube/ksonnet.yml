lang: Go
homepage: https://github.com/ksonnet/ksonnet
license: Apache-2.0
desc:
  cn: 一个 CLI 支持的框架，可简化 Kubernetes 配置向多个集群的写入和部署
  en: A CLI-supported framework that streamlines writing and deployment of Kubernetes configurations to multiple clusters
x:
  source: https://github.com/ksonnet/ksonnet
  eget: https://github.com/ksonnet/ksonnet
rule:
  /eget:
    cmd: x eget ksonnet/ksonnet
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S ksonnet-bin
    reference: https://aur.archlinux.org/packages/ksonnet-bin
  darwin/brew:
    cmd: brew install ksonnet/tap/ks
    reference: https://github.com/ksonnet/ksonnet?tab=readme-ov-file#install
  /asdf:
    cmd: x asdf use ksonnet
    reference: https://github.com/Banno/asdf-ksonnet?tab=readme-ov-file#install
binlist:
- ksonnet

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
