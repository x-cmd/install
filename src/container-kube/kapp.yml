lang: Go
homepage: https://github.com/vmware-tanzu/carvel-kapp
license: Apache-2.0
desc:
  cn: kapp 是一个简单的部署工具，专注于“Kubernetes 应用程序”的概念——一组具有相同标签的资源
  en: kapp is a simple deployment tool focused on the concept of "Kubernetes application" — a set of resources with the same label
x:
  source: https://github.com/vmware-tanzu/carvel-kapp
  eget: https://github.com/vmware-tanzu/carvel-kapp
rule:
  /eget:
    cmd: x eget vmware-tanzu/carvel-kapp
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kapp
    reference: https://aur.archlinux.org/packages/kapp
  /curl:
    cmd: 'mkdir local-bin/ \

      && curl -L https://carvel.dev/install.sh | K14SIO_INSTALL_BIN_DIR=local-bin bash \

      && export PATH=$PWD/local-bin/:$PATH

      '
    reference: https://carvel.dev/kapp/docs/v0.59.x/install/#via-script-macos-or-linux
  /wget:
    cmd: 'wget -O- https://carvel.dev/install.sh > install.sh \

      &&  sudo bash install.sh

      '
    reference: https://carvel.dev/kapp/docs/v0.59.x/install/#via-script-macos-or-linux
  darwin/brew:
    cmd: 'brew tap carvel-dev/carvel \

      && brew install kapp

      '
    reference: https://carvel.dev/kapp/docs/v0.59.x/install/#via-homebrew-macos-or-linux
  /asdf:
    cmd: x asdf use kapp
    reference: https://github.com/carvel-dev/asdf?tab=readme-ov-file#install
binlist:
- kapp
