lang: Go
homepage: https://github.com/Azure/draft
license: MIT
desc:
  cn: Draft 是一个工具，为用户谁是刚刚开始与 Kubernetes，或用户谁想简化他们的经验与 Kubernetes
  en: Draft is a tool made for users who are just getting started with Kubernetes, or users who want to simplify their experience with Kubernetes
x:
  source: https://github.com/Azure/draft
  eget: https://github.com/Azure/draft
rule:
  /eget:
    cmd: x eget Azure/draft
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S draft-bin
    reference: https://aur.archlinux.org/packages/draft-bin
  darwin/brew:
    cmd: 'brew tap azure/draft \

      && brew install draft

      '
    reference: https://github.com/Azure/draft?tab=readme-ov-file#install-with-homebrew
  /curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/Azure/draft/main/scripts/install.sh | bash
    reference: https://github.com/Azure/draft?tab=readme-ov-file#installation-using-script
  /asdf:
    cmd: x asdf use draft
    reference: https://github.com/kristoflemmens/asdf-draft?tab=readme-ov-file#install
binlist:
- draft
