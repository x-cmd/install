lang: Go
homepage: https://github.com/cert-manager/cert-manager
license: Apache-2.0
desc:
  cn: 在 Kubernetes 中自动配置和管理 TLS 证书
  en: Automatically provision and manage TLS certificates in Kubernetes
x:
  pkg:
    exist: true
  source: https://github.com/cert-manager/cert-manager
rule:
  /x:
    cmd: x pkg use cmctl
    reference: https://x-cmd.com/install/
  /asdf:
    cmd: x asdf use cmctl
    reference: https://github.com/asdf-community/asdf-cmctl
  /curl:
    cmd: 'OS=$(go env GOOS); ARCH=$(go env GOARCH); curl -fsSL -o cmctl.tar.gz https://github.com/cert-manager/cert-manager/releases/download/v1.9.2/cmctl-$OS-$ARCH.tar.gz \

      && tar xzf cmctl.tar.gz \

      && sudo mv cmctl /usr/local/bin

      '
    reference: https://cert-manager.io/v1.9-docs/usage/cmctl/#installation
binlist:
- cmctl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
