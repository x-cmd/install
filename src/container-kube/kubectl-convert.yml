lang: Go
homepage: https://github.com/kubernetes/kubectl
license: Apache-2.0
desc:
  cn: 在不同的 API 版本之间转换配置文件
  en: Convert config files between different API versions
x:
  source: https://github.com/kubernetes/kubectl
rule:
  arch/yay:
    cmd: yay -S kubectl-convert-bin
    reference: https://aur.archlinux.org/packages/kubectl-convert-bin
  /asdf:
    cmd: x asdf use kubectl-convert
    reference: https://github.com/iul1an/asdf-kubectl-convert?tab=readme-ov-file#install
binlist:
- kubectl-convert

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
