lang: Go
homepage: https://github.com/kubernetes/kubectl
license: Apache-2.0
desc:
  cn: 在不同的 API 版本之间转换配置文件
  en: Convert config files between different API versions
x:
  source: https://github.com/kubernetes/kubectl
  yay: kubectl-convert-bin
  asdf: asdf
rule:
  arch/yay:
    cmd: yay -S kubectl-convert-bin
    reference: https://aur.archlinux.org/packages/kubectl-convert-bin
  /asdf:
    cmd: x asdf use kubectl-convert
    reference: https://github.com/iul1an/asdf-kubectl-convert?tab=readme-ov-file#install
binlist:
- kubectl-convert

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
