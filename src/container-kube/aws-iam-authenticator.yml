lang: Go
homepage: https://github.com/kubernetes-sigs/aws-iam-authenticator
license: Apache-2.0
desc:
  cn: 使用 AWS IAM 凭据对 Kubernetes 集群进行身份验证的工具
  en: A tool to use AWS IAM credentials to authenticate to a Kubernetes cluster
x:
  source: https://github.com/kubernetes-sigs/aws-iam-authenticator
  eget: https://github.com/kubernetes-sigs/aws-iam-authenticator
rule:
  /eget:
    cmd: x eget kubernetes-sigs/aws-iam-authenticator
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S aws-iam-authenticator
    reference: https://aur.archlinux.org/packages/aws-iam-authenticator
  /asdf:
    cmd: x asdf use aws-iam-authenticator
    reference: https://github.com/zekker6/asdf-aws-iam-authenticator?tab=readme-ov-file#install
binlist:
- aws-iam-authenticator
