lang: 'Go'
homepage: 'https://github.com/brunoluiz/xpdig'
license: 'Apache-2.0'
desc:
  cn: 通过 TUI 深入查看 Crossplane 追踪信息
  en: '🧰 Dig into Crossplane traces via TUI (a là k9s)'
x:
  source: https://github.com/brunoluiz/xpdig
  eget: https://github.com/brunoluiz/xpdig
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/brunoluiz/xpdig
  /eget:
    cmd: x eget brunoluiz/xpdig
    reference: https://github.com/brunoluiz/xpdig
binlist:
- 'xpdig'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
