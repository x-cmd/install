lang: 'Go'
homepage: 'https://github.com/brunoluiz/xpdig'
license: 'Apache-2.0'
desc:
  cn: 通过 TUI 深入查看 Crossplane 追踪信息
  en: '🧰 Dig into Crossplane traces via TUI (a là k9s)'
x:
  source: https://github.com/brunoluiz/xpdig
  eget: https://github.com/brunoluiz/xpdig
rule:
  /go:
    cmd: 'go install'
    reference: https://github.com/brunoluiz/xpdig
  /eget:
    cmd: x eget brunoluiz/xpdig
    reference: https://github.com/brunoluiz/xpdig
binlist:
  - 'xpdig'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 183 KB
          rating: 1
          desc:
            cn: 约 183 KB（估算）
            en: ~183 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
