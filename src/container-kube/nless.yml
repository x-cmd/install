lang: 'Python'
homepage: https://github.com/mpryor/nothing-less
license: 'MIT'
desc:
  cn: 支持表格数据、分隔符推断与实时事件解析的 TUI 分页器
  en: 'A TUI pager with advanced support for tabular data, inferring/swapping delimiters, and real-time event parsing.'
x:
  source: https://github.com/mpryor/nothing-less
  eget: https://github.com/mpryor/nothing-less
rule:
  /pip:
    cmd: 'pip install nothing-less'
    reference: https://github.com/mpryor/nothing-less
  /eget:
    cmd: x eget mpryor/nothing-less
    reference: https://github.com/mpryor/nothing-less
binlist:
  - 'nless'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
