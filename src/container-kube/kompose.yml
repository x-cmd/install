lang: Go
homepage: https://github.com/kubernetes/kompose
license: Apache-2.0
desc:
  cn: Kompose 是 Docker Compose 到 Kubernetes（或 OpenShift）等容器编排器的转换工具
  en: Kompose is a conversion tool for Docker Compose to container orchestrators such as Kubernetes (or OpenShift)
x:
  source: https://github.com/kubernetes/kompose
  eget: https://github.com/kubernetes/kompose
  brew: kompose
  choco: kubernetes-kompose
  winget: Kubernetes.kompose
  powershell: kubernetes-kompose
  yay: kompose-git
  go: github.com/kubernetes/kompose@latest
  asdf: asdf
  curl: curl
rule:
  /eget:
    cmd: x eget kubernetes/kompose
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kompose-git
    reference: https://aur.archlinux.org/packages/kompose-git
  linux/curl:
    cmd: 'curl -L https://github.com/kubernetes/kompose/releases/download/v1.31.2/kompose-linux-amd64 -o kompose \

      && chmod +x kompose \

      && sudo mv ./kompose /usr/local/bin/kompose

      '
    reference: https://kompose.io/installation/#installation
  darwin/curl:
    cmd: 'curl -L https://github.com/kubernetes/kompose/releases/download/v1.31.2/kompose-darwin-amd64 -o kompose \

      && chmod +x kompose \

      && sudo mv ./kompose /usr/local/bin/kompose

      '
    reference: https://kompose.io/installation/#installation
  /go:
    cmd: go install github.com/kubernetes/kompose@latest
    reference: https://kompose.io/installation/#installation
    dsnap: github.com/kubernetes/kompose@latest
  centos/yum:
    cmd: sudo yum -y install kompose
    reference: https://kompose.io/installation/#installation
  darwin/brew:
    cmd: brew install kompose
    reference: https://kompose.io/installation/#installation
  (win|wsl2)/choco:
    cmd: x choco install kubernetes-kompose
    reference: https://kompose.io/installation/#installation
  (win|wsl2)/winget:
    cmd: x winget install Kubernetes.kompose
    reference: https://kompose.io/installation/#installation
  /asdf:
    cmd: x asdf use kompose
    reference: https://github.com/technikhil314/asdf-kompose?tab=readme-ov-file#install
binlist:
- kompose

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 24 MB
          rating: 2
          desc:
            cn: 安装 24 MB
            en: 24 MB install
        download:
          estimate: 24 MB
          desc:
            cn: 约 24 MB 下载 (linux/x64)
            en: ~24 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
