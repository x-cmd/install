lang: Go
homepage: https://github.com/stackrox/kube-linter
license: Apache-2.0
desc:
  cn: Kubernetes YAML 文件和 Helm charts 的静态分析工具
  en: Static analysis tool for Kubernetes YAML files and Helm charts
  cs: Nástroj statické analýzy pro soubory YAML Kubernetes a Helm charty
  de: Werkzeug zur statischen Analyse für Kubernetes-YAML-Dateien und Helm-Charts
  es: Herramienta de análisis estático para archivos YAML de Kubernetes y charts de Helm
  fr: Outil d'analyse statique pour les fichiers YAML Kubernetes et les charts Helm
  id: Alat analisis statis untuk file YAML Kubernetes dan chart Helm
  it: Strumento di analisi statica per file YAML di Kubernetes e chart Helm
  ja: Kubernetes の YAML ファイルと Helm チャートの静的解析ツール
  ko: Kubernetes YAML 파일과 Helm 차트를 위한 정적 분석 도구
  pl: Narzędzie do analizy statycznej plików YAML Kubernetes i wykresów Helm
  pt: Ferramenta de análise estática para arquivos YAML do Kubernetes e charts do Helm
  ro: Instrument de analiză statică pentru fișiere YAML Kubernetes și charturi Helm
  ru: Инструмент статического анализа для YAML-файлов Kubernetes и чартов Helm
  th: เครื่องมือวิเคราะห์แบบคงที่สำหรับไฟล์ YAML ของ Kubernetes และ Helm chart
  tr: Kubernetes YAML dosyaları ve Helm chartları için statik analiz aracı
  uk: Інструмент статичного аналізу для YAML-файлів Kubernetes і чартів Helm
  vi: Công cụ phân tích tĩnh cho các tệp YAML của Kubernetes và chart Helm
x:
  source: https://github.com/stackrox/kube-linter
  eget: stackrox/kube-linter
  brew: kube-linter
  asdf: kube-linter
rule:
  /x:
    cmd: x pkg use kube-linter
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget stackrox/kube-linter
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use kube-linter
    reference: https://github.com/devlincashman/asdf-kube-linter
  darwin/brew:
    cmd: brew install kube-linter
    reference: https://formulae.brew.sh/formula/kube-linter#default
binlist:
- kube-linter

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 1.7 MB
          rating: 1
          desc:
            cn: 约 1.7 MB（估算）
            en: ~1.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
