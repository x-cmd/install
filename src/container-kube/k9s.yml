lang: Go
homepage: https://github.com/derailed/k9s
license: Apache-2.0
desc:
  cn: K9s 是一个基于终端的 UI，用于与 Kubernetes 集群交互
  en: K9s is a terminal based UI to interact with your Kubernetes clusters
x:
  pkg:
    exist: true
  source: https://github.com/derailed/k9s
  eget: https://github.com/derailed/k9s
rule:
  /x:
    cmd: x pkg use k9s
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget derailed/k9s
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install derailed/k9s/k9s
    reference: https://k9scli.io/topics/install/
  darwin/port:
    cmd: sudo port install k9s
    reference: https://k9scli.io/topics/install/
  /pacman:
    cmd: sudo pacman -S k9s
    reference: https://k9scli.io/topics/install/
  (win|wsl2)/scoop:
    cmd: x scoop install k9s
    reference: https://k9scli.io/topics/install/
  (win|wsl2)/choco:
    cmd: x choco install k9s
    reference: https://k9scli.io/topics/install/
  /asdf:
    cmd: x asdf use k9s
    reference: https://github.com/looztra/asdf-k9s?tab=readme-ov-file#install
binlist:
- k9s

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
