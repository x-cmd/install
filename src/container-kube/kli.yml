lang: 'Go'
homepage: 'https://github.com/bjarneo/ku'
license: 'MIT'
desc:
  cn: 快速的键盘驱动 Kubernetes TUI，可浏览资源、编辑对象、跟踪日志并进入 pod shell
  en: 'A fast, keyboard-driven Kubernetes TUI. Browse any resource, edit objects, follow logs, and shell into pods.'
x:
  source: https://github.com/bjarneo/ku
  eget: https://github.com/bjarneo/ku
rule:
  /eget:
    cmd: x eget bjarneo/ku
    reference: https://github.com/bjarneo/ku
binlist:
  - 'kli'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
