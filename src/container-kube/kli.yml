lang: 'Go'
homepage: 'https://github.com/bjarneo/ku'
license: 'MIT'
desc:
  cn: 快速的键盘驱动 Kubernetes TUI，可浏览资源、编辑对象、跟踪日志并进入 pod shell
  en: 'A fast, keyboard-driven Kubernetes TUI. Browse any resource, edit objects, follow logs, and shell into pods.'
x:
  source: https://github.com/bjarneo/ku
  eget: https://github.com/bjarneo/ku
rule:
  /eget:
    cmd: x eget bjarneo/ku
    reference: https://github.com/bjarneo/ku
binlist:
  - 'kli'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
