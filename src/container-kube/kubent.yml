lang: Go
homepage: https://github.com/doitintl/kube-no-trouble
license: MIT
desc:
  cn: 轻松检查集群是否使用了已弃用的 API
  en: Easily check your clusters for use of deprecated APIs
  cs: Snadno zkontrolovat, zda vaše clustery nepoužívají zastarané API
  de: Einfach prüfen, ob Ihre Cluster veraltete APIs verwenden
  es: Comprueba fácilmente si tus clústeres usan API obsoletas
  fr: Vérifiez facilement si vos clusters utilisent des API obsolètes
  id: Mudah memeriksa apakah klaster Anda menggunakan API yang telah usang
  it: Controlla facilmente se i tuoi cluster usano API deprecate
  ja: クラスターが非推奨の API を使用していないか簡単に確認できます
  ko: 클러스터가 더 이상 사용되지 않는 API를 사용하는지 쉽게 확인할 수 있습니다
  pl: Łatwo sprawdź, czy Twoje klastry używają przestarzałych API
  pt: Verifique facilmente se os seus clusters usam APIs obsoletas
  ro: Verifică cu ușurință dacă clusterele tale folosesc API-uri depreciate
  ru: Легко проверить, используют ли ваши кластеры устаревшие API
  th: ตรวจสอบได้ง่ายว่าคลัสเตอร์ของคุณใช้ API ที่เลิกรองรับหรือไม่
  tr: Kümelerinizin kullanımdan kaldırılmış API'ler kullanıp kullanmadığını kolayca kontrol edin
  uk: Легко перевірити, чи ваші кластери використовують застарілі API
  vi: Dễ dàng kiểm tra xem cụm của bạn có sử dụng API lỗi thời hay không
x:
  source: https://github.com/doitintl/kube-no-trouble
  eget: doitintl/kube-no-trouble
  brew: kubent
  yay: kubent-bin
  asdf: kubent
rule:
  /eget:
    cmd: x eget doitintl/kube-no-trouble
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kubent-bin
    reference: https://aur.archlinux.org/packages/kubent-bin
  /asdf:
    cmd: x asdf use kubent
    reference: https://github.com/virtualstaticvoid/asdf-kubent?tab=readme-ov-file#install
  /curl:
    cmd: sh -c "$(curl -sSL https://git.io/install-kubent)"
    reference: https://github.com/doitintl/kube-no-trouble?tab=readme-ov-file#install
  darwin/brew:
    cmd: brew install kubent
    reference: https://github.com/doitintl/kube-no-trouble?tab=readme-ov-file#homebrew
binlist:
- kubent

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
