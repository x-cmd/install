lang: Go
homepage: https://github.com/doitintl/kube-no-trouble
license: MIT
desc:
  cn: 轻松检查集群是否使用了已弃用的 API
  en: Easily check your clusters for use of deprecated APIs
x:
  source: https://github.com/doitintl/kube-no-trouble
  eget: https://github.com/doitintl/kube-no-trouble
rule:
  /eget:
    cmd: x eget doitintl/kube-no-trouble
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kubent-bin
    reference: https://aur.archlinux.org/packages/kubent-bin
  /asdf:
    cmd: x asdf use kubent
    reference: https://github.com/virtualstaticvoid/asdf-kubent?tab=readme-ov-file#install
  /curl:
    cmd: sh -c "$(curl -sSL https://git.io/install-kubent)"
    reference: https://github.com/doitintl/kube-no-trouble?tab=readme-ov-file#install
  darwin/brew:
    cmd: brew install kubent
    reference: https://github.com/doitintl/kube-no-trouble?tab=readme-ov-file#homebrew
binlist:
- kubent

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
