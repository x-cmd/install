  en: 'An interactive Kubernetes log viewer for your terminal.'
  cs: Interaktivní prohlížeč logů Kubernetes pro váš terminál
  de: Ein interaktiver Kubernetes-Log-Viewer für Ihr Terminal
  es: Un visor interactivo de registros de Kubernetes para tu terminal
  fr: Un visualiseur de journaux Kubernetes interactif pour votre terminal
  id: Penampil log Kubernetes interaktif untuk terminal Anda
  it: Un visualizzatore di log Kubernetes interattivo per il tuo terminale
  ja: ターミナル用のインタラクティブな Kubernetes ログビューア
  ko: 터미널을 위한 대화형 Kubernetes 로그 뷰어
  pl: Interaktywna przeglądarka logów Kubernetes dla Twojego terminala
  pt: Um visualizador interativo de logs do Kubernetes para o seu terminal
  ro: Un vizualizator interactiv de jurnale Kubernetes pentru terminalul tău
  ru: Интерактивный просмотрщик логов Kubernetes для вашего терминала
  th: ตัวดูบันทึก Kubernetes แบบโต้ตอบสำหรับเทอร์มินัลของคุณ
  tr: Terminaliniz için etkileşimli bir Kubernetes günlük görüntüleyici
  uk: Інтерактивний переглядач журналів Kubernetes для вашого термінала
  vi: Trình xem log Kubernetes tương tác cho terminal của bạn
x:
  source: https://github.com/robinovitch61/kl
  eget: robinovitch61/kl
rule:
  /eget:
    cmd: x eget robinovitch61/kl
    reference: https://github.com/robinovitch61/kl
binlist:
- 'kl'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 安装 13 MB
            en: 13 MB install
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
