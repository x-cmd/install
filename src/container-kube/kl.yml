lang: 'Go'
homepage: 'https://github.com/robinovitch61/kl'
license: 'MIT'
desc:
  cn: 终端中的交互式 Kubernetes 日志查看器
  en: 'An interactive Kubernetes log viewer for your terminal.'
x:
  source: https://github.com/robinovitch61/kl
  eget: https://github.com/robinovitch61/kl
rule:
  /eget:
    cmd: x eget robinovitch61/kl
    reference: https://github.com/robinovitch61/kl
binlist:
- 'kl'

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 825 KB
          rating: 1
          desc:
            cn: 约 825 KB（估算）
            en: ~825 KB estimated
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
