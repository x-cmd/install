lang: 'Go'
homepage: 'https://github.com/robinovitch61/kl'
license: 'MIT'
desc:
  cn: 终端中的交互式 Kubernetes 日志查看器
  en: 'An interactive Kubernetes log viewer for your terminal.'
x:
  source: https://github.com/robinovitch61/kl
  eget: https://github.com/robinovitch61/kl
rule:
  /eget:
    cmd: x eget robinovitch61/kl
    reference: https://github.com/robinovitch61/kl
binlist:
  - 'kl'

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
