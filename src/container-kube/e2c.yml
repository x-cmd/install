lang: 'Go'
homepage: 'https://github.com/nlamirault/e2c'
license: 'Apache-2.0'
desc:
  cn: 管理 AWS EC2 实例的终端 UI 应用
  en: 'A terminal-based UI application for managing AWS EC2 instances.'
  cs: Terminálová aplikace UI pro správu instancí AWS EC2.
  de: Eine terminalbasierte UI-Anwendung zur Verwaltung von AWS EC2-Instanzen.
  es: Una aplicación de UI basada en terminal para gestionar instancias de AWS EC2.
  fr: Une application à interface en ligne de commande pour gérer les instances AWS EC2.
  id: Aplikasi UI berbasis terminal untuk mengelola instance AWS EC2.
  it: Un'applicazione UI basata su terminale per gestire le istanze AWS EC2.
  ja: AWS EC2 インスタンスを管理するためのターミナルベースの UI アプリケーション。
  ko: AWS EC2 인스턴스를 관리하기 위한 터미널 기반 UI 애플리케이션.
  pl: Terminalowa aplikacja UI do zarządzania instancjami AWS EC2.
  pt: Um aplicativo de UI baseado em terminal para gerenciar instâncias do AWS EC2.
  ro: O aplicație UI bazată pe terminal pentru gestionarea instanțelor AWS EC2.
  ru: Терминальное UI-приложение для управления экземплярами AWS EC2.
  th: แอปพลิเคชัน UI บนเทอร์มินัลสำหรับจัดการอินสแตนซ์ AWS EC2
  tr: AWS EC2 örneklerini yönetmek için terminal tabanlı bir UI uygulaması.
  uk: Термінальний UI-застосунок для керування екземплярами AWS EC2.
  vi: Ứng dụng UI chạy trên terminal để quản lý các phiên bản AWS EC2.
x:
  source: https://github.com/nlamirault/e2c
  eget: nlamirault/e2c
rule:
  /eget:
    cmd: x eget nlamirault/e2c
    reference: https://github.com/nlamirault/e2c
binlist:
- 'e2c'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
