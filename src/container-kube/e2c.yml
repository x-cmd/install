lang: 'Go'
homepage: 'https://github.com/nlamirault/e2c'
license: 'Apache-2.0'
desc:
  cn: 管理 AWS EC2 实例的终端 UI 应用
  en: 'A terminal-based UI application for managing AWS EC2 instances.'
x:
  source: https://github.com/nlamirault/e2c
  eget: https://github.com/nlamirault/e2c
rule:
  /eget:
    cmd: x eget nlamirault/e2c
    reference: https://github.com/nlamirault/e2c
binlist:
  - 'e2c'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
