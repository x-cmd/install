lang: 'Go'
homepage: 'https://github.com/nlamirault/e2c'
license: 'Apache-2.0'
desc:
  cn: 管理 AWS EC2 实例的终端 UI 应用
  en: 'A terminal-based UI application for managing AWS EC2 instances.'
x:
  source: https://github.com/nlamirault/e2c
  eget: nlamirault/e2c
rule:
  /eget:
    cmd: x eget nlamirault/e2c
    reference: https://github.com/nlamirault/e2c
binlist:
- 'e2c'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
