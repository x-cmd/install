lang: Go
homepage: https://github.com/kubernetes-retired/kubefed
license: Apache-2.0
desc:
  cn: 用来管理和协调多个 kubernetes 集群的联邦（federation）
  en: Federation for managing and coordinating multiple Kubernetes clusters
  cs: Federace pro správu a koordinaci více clusterů Kubernetes
  de: Federation zum Verwalten und Koordinieren mehrerer Kubernetes-Cluster
  es: Federación para gestionar y coordinar varios clústeres de Kubernetes
  fr: Fédération pour gérer et coordonner plusieurs clusters Kubernetes
  id: Federasi untuk mengelola dan mengoordinasikan beberapa klaster Kubernetes
  it: Federazione per gestire e coordinare più cluster Kubernetes
  ja: 複数の Kubernetes クラスターを管理・調整するためのフェデレーション
  ko: 여러 Kubernetes 클러스터를 관리하고 조정하기 위한 연합
  pl: Federacja do zarządzania i koordynacji wieloma klastrami Kubernetes
  pt: Federação para gerenciar e coordenar vários clusters do Kubernetes
  ro: Federație pentru gestionarea și coordonarea mai multor clustere Kubernetes
  ru: Федерация для управления и координации нескольких кластеров Kubernetes
  th: สหพันธ์สำหรับจัดการและประสานงานคลัสเตอร์ Kubernetes หลายชุด
  tr: Birden çok Kubernetes kümesini yönetmek ve koordine etmek için federasyon
  uk: Федерація для керування та координації кількох кластерів Kubernetes
  vi: Liên bang để quản lý và phối hợp nhiều cụm Kubernetes
x:
  source: https://github.com/kubernetes-retired/kubefed
  asdf: kubefedctl
rule:
  /asdf:
    cmd: x asdf use kubefedctl
    reference: https://github.com/kvokka/asdf-kubefedctl?tab=readme-ov-file#install
binlist:
- kubefedctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
