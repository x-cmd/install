lang: Go
homepage: https://github.com/kubernetes-retired/kubefed
license: Apache-2.0
desc:
  cn: 用来管理和协调多个 kubernetes 集群的联邦（federation）
  en: Federation for managing and coordinating multiple Kubernetes clusters
x:
  source: https://github.com/kubernetes-retired/kubefed
rule:
  /asdf:
    cmd: x asdf use kubefedctl
    reference: https://github.com/kvokka/asdf-kubefedctl?tab=readme-ov-file#install
binlist:
- kubefedctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
