lang: Go
homepage: https://github.com/particledecay/kconf
license: MIT
desc:
  cn: 一种用于管理多个 kubeconfigs 的有用命令行工具
  en: An opinionated command line tool for managing multiple kubeconfigs
  cs: Nástroj příkazové řádky s jasným názorem pro správu více kubeconfigů
  de: Ein Meinungsfreudiges Kommandozeilenwerkzeug zum Verwalten mehrerer kubeconfigs
  es: Una herramienta de línea de comandos con opinión propia para gestionar múltiples kubeconfigs
  fr: Un outil de ligne de commande dogmatique pour gérer plusieurs kubeconfigs
  id: Alat baris perintah berpendirian untuk mengelola beberapa kubeconfig
  it: Un'utilità da riga di comando con opinioni ferme per gestire più kubeconfig
  ja: 複数の kubeconfig を管理するための Opinionated コマンドラインツール
  ko: 여러 kubeconfig를 관리하기 위한 opinionated 커맨드라인 도구
  pl: Narzędzie wiersza poleceń o wyraźnych poglądach do zarządzania wieloma kubeconfigami
  pt: Uma ferramenta de linha de comando com opiniões fortes para gerenciar vários kubeconfigs
  ro: Un instrument de linie de comandă cu opinii bine definite pentru gestionarea mai multor kubeconfig-uri
  ru: Утилита командной строки с собственным мнением для управления несколькими kubeconfig
  th: เครื่องมือบรรทัดคำสั่งที่มีความคิดเห็นชัดเจนสำหรับการจัดการ kubeconfig หลายชุด
  tr: Birden fazla kubeconfig yönetmek için kendi felsefesine sahip bir komut satırı aracı
  uk: Утиліта командного рядка з власною думкою для керування кількома kubeconfig
  vi: Công cụ dòng lệnh có chủ đích dành cho quản lý nhiều kubeconfig
x:
  source: https://github.com/particledecay/kconf
  eget: particledecay/kconf
  yay: kconf
  asdf: kconf
rule:
  /eget:
    cmd: x eget particledecay/kconf
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kconf
    reference: https://aur.archlinux.org/packages/kconf
  /asdf:
    cmd: x asdf use kconf
    reference: https://github.com/particledecay/asdf-kconf?tab=readme-ov-file#install
binlist:
- kconf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
