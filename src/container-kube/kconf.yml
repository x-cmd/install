lang: Go
homepage: https://github.com/particledecay/kconf
license: MIT
desc:
  cn: 一种用于管理多个 kubeconfigs 的有用命令行工具
  en: An opinionated command line tool for managing multiple kubeconfigs
x:
  source: https://github.com/particledecay/kconf
  eget: https://github.com/particledecay/kconf
rule:
  /eget:
    cmd: x eget particledecay/kconf
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kconf
    reference: https://aur.archlinux.org/packages/kconf
  /asdf:
    cmd: x asdf use kconf
    reference: https://github.com/particledecay/asdf-kconf?tab=readme-ov-file#install
binlist:
- kconf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
