lang: 'Go'
homepage: 'https://github.com/unkn0wn-root/resterm'
license: 'Apache-2.0'
desc:
  cn: 支持 HTTP/GraphQL/gRPC、SSH 隧道、WebSocket、SSE、OpenAPI 及 K8s 端口转发的终端 API 客户端
  en: 'Terminal API client for HTTP/GraphQL/gRPC with support for SSH tunnels, WebSockets, SSE, Workflows, Profiling, OpenAPI, Kubernetes port-forwarding and headless API.'
x:
  source: https://github.com/unkn0wn-root/resterm
  eget: https://github.com/unkn0wn-root/resterm
rule:
  darwin/brew:
    cmd: 'brew install jq'
    reference: https://github.com/unkn0wn-root/resterm
  debian/apt:
    cmd: 'sudo apt install jq'
    reference: https://github.com/unkn0wn-root/resterm
  /eget:
    cmd: x eget unkn0wn-root/resterm
    reference: https://github.com/unkn0wn-root/resterm
binlist:
- 'resterm'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 17 MB
          rating: 2
          desc:
            cn: 约 17 MB（估算）
            en: ~17 MB estimated
        download:
          estimate: 83 MB
          desc:
            cn: 约 83 MB 下载 (linux/x64)
            en: ~83 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
