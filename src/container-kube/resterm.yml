lang: 'Go'
homepage: 'https://github.com/unkn0wn-root/resterm'
license: 'Apache-2.0'
desc:
  cn: 支持 HTTP/GraphQL/gRPC、SSH 隧道、WebSocket、SSE、OpenAPI 及 K8s 端口转发的终端 API 客户端
  en: 'Terminal API client for HTTP/GraphQL/gRPC with support for SSH tunnels, WebSockets, SSE, Workflows, Profiling, OpenAPI, Kubernetes port-forwarding and headless API.'
x:
  source: https://github.com/unkn0wn-root/resterm
  eget: https://github.com/unkn0wn-root/resterm
rule:
  darwin/brew:
    cmd: 'brew install jq'
    reference: https://github.com/unkn0wn-root/resterm
  debian/apt:
    cmd: 'sudo apt install jq'
    reference: https://github.com/unkn0wn-root/resterm
  /eget:
    cmd: x eget unkn0wn-root/resterm
    reference: https://github.com/unkn0wn-root/resterm
binlist:
  - 'resterm'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
