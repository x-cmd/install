lang: Go
homepage: https://github.com/FairwindsOps/pluto
license: Apache-2.0
desc:
  en: Pluto is a utility to help users find deprecated Kubernetes apiVersions in their code repositories and their helm releases
  cn: Pluto 是一个实用工具，可以帮助用户在他们的代码库和舵手版本中找到不推荐的 Kubernetes apiVersions
x:
  source: https://github.com/FairwindsOps/pluto
  eget: https://github.com/FairwindsOps/pluto
rule:
  /eget:
    cmd: x eget FairwindsOps/pluto
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install pluto
    reference: https://formulae.brew.sh/formula/pluto#default
  /asdf:
    cmd: x asdf use pluto
    reference: https://github.com/FairwindsOps/asdf-pluto?tab=readme-ov-file#install
binlist:
- pluto

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
