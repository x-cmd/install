lang: Go
homepage: https://github.com/FairwindsOps/pluto
license: Apache-2.0
desc:
  en: Pluto is a utility to help users find deprecated Kubernetes apiVersions in their code repositories and their helm releases
  cn: Pluto 是一个实用工具，可以帮助用户在他们的代码库和舵手版本中找到不推荐的 Kubernetes apiVersions
x:
  source: https://github.com/FairwindsOps/pluto
  eget: https://github.com/FairwindsOps/pluto
rule:
  /eget:
    cmd: x eget FairwindsOps/pluto
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install pluto
    reference: https://formulae.brew.sh/formula/pluto#default
  /asdf:
    cmd: x asdf use pluto
    reference: https://github.com/FairwindsOps/asdf-pluto?tab=readme-ov-file#install
binlist:
- pluto

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
