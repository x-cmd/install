lang: Go
homepage: https://github.com/hidetatz/kubecolor
license: MIT
desc:
  cn: KubeColor 会着色您的 Kubectl 命令输出，而无需做任何其他事情
  en: kubecolor colorizes your kubectl command output and does nothing else
x:
  source: https://github.com/hidetatz/kubecolor
  eget: https://github.com/hidetatz/kubecolor
rule:
  /eget:
    cmd: x eget hidetatz/kubecolor
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kubecolor
    reference: https://aur.archlinux.org/packages/kubecolor
  darwin/brew:
    cmd: brew install hidetatz/tap/kubecolor
    reference: https://github.com/hidetatz/kubecolor?tab=readme-ov-file#mac-and-linux-users-via-homebrew
  /go:
    cmd: go install github.com/hidetatz/kubecolor/cmd/kubecolor@latest
    reference: https://github.com/hidetatz/kubecolor?tab=readme-ov-file#manually-via-go-command
    dsnap: kubecolor
  /asdf:
    cmd: x asdf use kubecolor
    reference: https://github.com/dex4er/asdf-kubecolor?tab=readme-ov-file#install
binlist:
- kubecolor

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 790 KB
          rating: 1
          desc:
            cn: 安装 790 KB
            en: 790 KB install
        download:
          estimate: 790 KB
          desc:
            cn: 约 790 KB 下载 (linux/x64)
            en: ~790 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
