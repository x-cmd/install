lang: Go
homepage: https://github.com/projectcalico/calico
license: Apache-2.0
desc:
  cn: Calico 是一个网络和安全解决方案，使 Kubernetes 工作负载和非 Kubernetes/遗留工作负载能够无缝和安全地通信
  en: Calico is a networking and security solution that enables Kubernetes workloads and non-Kubernetes/legacy workloads to communicate seamlessly and securely
x:
  source: https://github.com/projectcalico/calico
rule:
  arch/yay:
    cmd: yay -S calicoctl
    reference: https://aur.archlinux.org/packages/calicoctl
  /asdf:
    cmd: x asdf use calicoctl
    reference: https://github.com/TheCubicleJockey/asdf-calicoctl?tab=readme-ov-file#install
binlist:
- calicoctl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
