lang: Go
homepage: https://github.com/fission/fission
license: Apache-2.0
desc:
  cn: Fission 是 Kubernetes 上无服务器功能的框架
  en: Fission is a framework for serverless functions on Kubernetes
x:
  source: https://github.com/fission/fission
  eget: https://github.com/fission/fission
rule:
  /eget:
    cmd: x eget fission/fission
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S fission-bin
    reference: https://aur.archlinux.org/packages/fission-bin
  darwin/curl:
    cmd: 'curl -Lo fission https://github.com/fission/fission/releases/download/v1.20.1/fission-v1.20.1-darwin-amd64 \

      && chmod +x fission && sudo mv fission /usr/local/bin/

      '
    reference: https://fission.io/docs/installation/#install-fission-cli
  linux/curl:
    cmd: 'curl -Lo fission https://github.com/fission/fission/releases/download/v1.20.1/fission-v1.20.1-linux-amd64 \

      && chmod +x fission && sudo mv fission /usr/local/bin/

      '
    reference: https://fission.io/docs/installation/#install-fission-cli
  /nix-env:
    cmd: nix-env -iA nixos.fission
    reference: https://fission.io/docs/installation/#install-fission-cli
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/fission/fission/releases/download/v1.20.1/fission-v1.20.1-windows-amd64.exe -OutFile fission-v1.20.1-windows-amd64.exe
    reference: https://fission.io/docs/installation/#install-fission-cli
  /asdf:
    cmd: x asdf use fission
    reference: https://github.com/virtualstaticvoid/asdf-fission?tab=readme-ov-file#install
  darwin/brew:
    cmd: brew install --cask fission
    reference: https://formulae.brew.sh/cask/fission#default
  (win|wsl2)/scoop:
    cmd: x scoop install main/fission-cli
    reference: https://scoop.sh/#/apps?q=fission
binlist:
- fission

footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
