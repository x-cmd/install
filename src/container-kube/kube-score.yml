lang: Go
homepage: https://github.com/zegl/kube-score
license: MIT
desc:
  cn: kube-score 是一个对 Kubernetes 对象定义执行静态代码分析的工具
  en: kube-score is a tool that performs static code analysis of your Kubernetes object definitions
x:
  source: https://github.com/zegl/kube-score
  eget: https://github.com/zegl/kube-score
  brew: kube-score
  yay: kube-score-bin
  asdf: kube-score
rule:
  /x:
    cmd: x pkg use kube-score
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget zegl/kube-score
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kube-score-bin
    reference: https://aur.archlinux.org/packages/kube-score-bin
  /asdf:
    cmd: x asdf use kube-score
    reference: https://github.com/bageljp/asdf-kube-score
  darwin/brew:
    cmd: brew install kube-score
    reference: https://formulae.brew.sh/formula/kube-score#default
  /krew:
    cmd: kubectl krew install score
    reference: https://github.com/zegl/kube-score?tab=readme-ov-file#installation
binlist:
- kube-score

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
