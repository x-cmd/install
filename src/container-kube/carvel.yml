lang: Go
homepage: https://github.com/vmware-tanzu/carvel
license: Apache-2.0
desc:
  cn: Carvel 提供了一组可靠、单一用途、可组合的工具，可帮助您构建、配置应用程序并将其部署到 Kubernetes
  en: Carvel provides a set of reliable, single-purpose, composable tools that aid in your application building, configuration, and deployment to Kubernetes
x:
  source: https://github.com/vmware-tanzu/carvel
rule:
  arch/yay:
    cmd: yay -S carvel-tools
    reference: https://aur.archlinux.org/packages/carvel-tools
  /wget:
    cmd: wget -O- https://carvel.dev/install.sh | bash
    reference: https://carvel.dev/
  /curl:
    cmd: curl -L https://carvel.dev/install.sh | bash
    reference: https://carvel.dev/
  darwin/brew:
    cmd: 'brew tap carvel-dev/carvel \

      && brew install ytt kbld kapp imgpkg kwt vendir kctrl

      '
    reference: https://github.com/carvel-dev/homebrew?tab=readme-ov-file#homebrew-tap
  /asdf:
    cmd: x asdf use carvel
    reference: https://github.com/carvel-dev/asdf?tab=readme-ov-file#install
binlist:
- carvel

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
