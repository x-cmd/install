lang: Go
homepage: https://kubemq.io/
desc:
  cn: KubeMQ 是 Kubernetes 消息队列代理
  en: KubeMQ is a Kubernetes Message Queue Broker
rule:
  /curl:
    cmd: sudo curl -sL https://get.kubemq.io/install | sudo sh
    reference: https://docs.kubemq.io/getting-started/quick-start#install-kubemqctl-cli-tool
  win/powershell:
    cmd: 'x pwsh New-Item -ItemType Directory ''C:\Program Files\kubemqctl'' \

      && x pwsh Invoke-WebRequest https://github.com/kubemq-io/kubemqctl/releases/download/latest/kubemqctl.exe -OutFile ''C:\Program Files\kubemqctl\kubemqctl.exe'' \

      && x pwsh  $env:Path += '';C:\Program Files\kubemqctl''

      '
    reference: https://docs.kubemq.io/getting-started/quick-start#option-2
  /asdf:
    cmd: x asdf use kubemqctl
    reference: https://github.com/johnlayton/asdf-kubemqctl
  darwin/curl:
    cmd: 'curl -L https://github.com/kubemq-io/kubemqctl/releases/download/latest/kubemqctl_darwin_amd64 -o /usr/local/bin/kubemqctl \

      && chmod +x /usr/local/bin/kubemqctl

      '
    reference: https://github.com/kubemq-io/kubemqctl?tab=readme-ov-file#mac-os
  linux/curl:
    cmd: 'curl -L https://github.com/kubemq-io/kubemqctl/releases/download/latest/kubemqctl_linux_amd64 -o /usr/local/bin/kubemqctl \

      && chmod +x /usr/local/bin/kubemqctl

      '
    reference: https://github.com/kubemq-io/kubemqctl?tab=readme-ov-file#linux-64-bits
binlist:
- kubemqctl
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
