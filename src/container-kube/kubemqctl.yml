lang: Go
homepage: https://kubemq.io/
desc:
  cn: KubeMQ 是 Kubernetes 消息队列代理
  en: KubeMQ is a Kubernetes Message Queue Broker
  cs: KubeMQ je zprostředkovatel fronty zpráv pro Kubernetes
  de: KubeMQ ist ein Message-Queue-Broker für Kubernetes
  es: KubeMQ es un intermediario de cola de mensajes para Kubernetes
  fr: KubeMQ est un broker de file de messages pour Kubernetes
  id: KubeMQ adalah broker antrean pesan untuk Kubernetes
  it: KubeMQ è un broker di code di messaggi per Kubernetes
  ja: KubeMQ は Kubernetes 向けのメッセージキューブローカーです
  ko: KubeMQ는 Kubernetes용 메시지 큐 브로커입니다
  pl: KubeMQ to broker kolejki wiadomości dla Kubernetes
  pt: KubeMQ é um corretor de fila de mensagens para Kubernetes
  ro: KubeMQ este un broker de coadă de mesaje pentru Kubernetes
  ru: KubeMQ — это брокер очереди сообщений для Kubernetes
  th: KubeMQ คือตัวกลางคิวข้อความสำหรับ Kubernetes
  tr: KubeMQ, Kubernetes için bir mesaj kuyruğu aracısıdır
  uk: KubeMQ — це брокер черги повідомлень для Kubernetes
  vi: KubeMQ là bộ môi giới hàng đợi tin nhắn cho Kubernetes
rule:
  /curl:
    cmd: sudo curl -sL https://get.kubemq.io/install | sudo sh
    reference: https://docs.kubemq.io/getting-started/quick-start#install-kubemqctl-cli-tool
  win/powershell:
    cmd: 'x pwsh New-Item -ItemType Directory ''C:\Program Files\kubemqctl'' \

      && x pwsh Invoke-WebRequest https://github.com/kubemq-io/kubemqctl/releases/download/latest/kubemqctl.exe -OutFile ''C:\Program Files\kubemqctl\kubemqctl.exe'' \

      && x pwsh  $env:Path += '';C:\Program Files\kubemqctl''

      '
    reference: https://docs.kubemq.io/getting-started/quick-start#option-2
  /asdf:
    cmd: x asdf use kubemqctl
    reference: https://github.com/johnlayton/asdf-kubemqctl
  darwin/curl:
    cmd: 'curl -L https://github.com/kubemq-io/kubemqctl/releases/download/latest/kubemqctl_darwin_amd64 -o /usr/local/bin/kubemqctl \

      && chmod +x /usr/local/bin/kubemqctl

      '
    reference: https://github.com/kubemq-io/kubemqctl?tab=readme-ov-file#mac-os
  linux/curl:
    cmd: 'curl -L https://github.com/kubemq-io/kubemqctl/releases/download/latest/kubemqctl_linux_amd64 -o /usr/local/bin/kubemqctl \

      && chmod +x /usr/local/bin/kubemqctl

      '
    reference: https://github.com/kubemq-io/kubemqctl?tab=readme-ov-file#linux-64-bits

x:
  asdf: kubemqctl
binlist:
- kubemqctl
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: true
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
