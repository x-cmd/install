lang: Go
homepage: https://github.com/vmware-archive/buildkit-cli-for-kubectl
desc:
  cn: Kubectl 的 BuildKit CLI 是使用 Kubernetes 群集构建 OCI 和 Docker 图像的工具
  en: BuildKit CLI for kubectl is a tool for building OCI and Docker images with your kubernetes cluster
  cs: BuildKit CLI pro kubectl je nástroj pro sestavování OCI a Docker obrazů pomocí vašeho clusteru Kubernetes
  de: Die BuildKit CLI für kubectl ist ein Werkzeug zum Erstellen von OCI- und Docker-Images mit Ihrem Kubernetes-Cluster
  es: BuildKit CLI para kubectl es una herramienta para crear imágenes OCI y Docker con tu clúster de Kubernetes
  fr: BuildKit CLI pour kubectl est un outil pour construire des images OCI et Docker avec votre cluster Kubernetes
  id: BuildKit CLI untuk kubectl adalah alat untuk membangun image OCI dan Docker dengan klaster Kubernetes Anda
  it: BuildKit CLI per kubectl è uno strumento per costruire immagini OCI e Docker con il tuo cluster Kubernetes
  ja: kubectl 用の BuildKit CLI は、Kubernetes クラスターで OCI イメージと Docker イメージを構築するためのツールです
  ko: kubectl용 BuildKit CLI는 Kubernetes 클러스터로 OCI 및 Docker 이미지를 빌드하는 도구입니다
  pl: BuildKit CLI dla kubectl to narzędzie do budowania obrazów OCI i Docker przy użyciu klastra Kubernetes
  pt: O BuildKit CLI para kubectl é uma ferramenta para construir imagens OCI e Docker com o seu cluster Kubernetes
  ro: BuildKit CLI pentru kubectl este un instrument pentru construirea imaginilor OCI și Docker cu clusterul tău Kubernetes
  ru: BuildKit CLI для kubectl — это инструмент для сборки OCI- и Docker-образов с помощью вашего кластера Kubernetes
  th: BuildKit CLI สำหรับ kubectl เป็นเครื่องมือสร้างอิมเมจ OCI และ Docker ด้วยคลัสเตอร์ Kubernetes ของคุณ
  tr: kubectl için BuildKit CLI, Kubernetes kümenizle OCI ve Docker imajları oluşturmak için bir araçtır
  uk: BuildKit CLI для kubectl — це інструмент для збору OCI- та Docker-образів за допомогою вашого кластеру Kubernetes
  vi: BuildKit CLI cho kubectl là công cụ để build ảnh OCI và Docker với cụm Kubernetes của bạn
x:
  source: https://github.com/vmware-archive/buildkit-cli-for-kubectl
  eget: vmware-archive/buildkit-cli-for-kubectl
  brew: vmware-tanzu/buildkit-cli-for-kubectl/kubectl-buildkit
  asdf: kubectl-buildkit
rule:
  /eget:
    cmd: x eget vmware-archive/buildkit-cli-for-kubectl
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap vmware-tanzu/buildkit-cli-for-kubectl https://github.com/vmware-tanzu/buildkit-cli-for-kubectl \

      && brew install kubectl-buildkit

      '
    reference: https://github.com/vmware-archive/buildkit-cli-for-kubectl?tab=readme-ov-file#installing-on-macos-and-linux-with-homebrew
  (win|wsl2)/choco:
    cmd: x choco install .\kubectl-buildkit*.nupkg
    reference: https://github.com/vmware-archive/buildkit-cli-for-kubectl?tab=readme-ov-file#installing-on-windows
  /asdf:
    cmd: x asdf use kubectl-buildkit
    reference: https://github.com/ezcater/asdf-kubectl-buildkit?tab=readme-ov-file#install
binlist:
- kubectl-buildkit
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
