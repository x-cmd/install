lang: Go
homepage: https://github.com/vmware-archive/buildkit-cli-for-kubectl
desc:
  cn: Kubectl 的 BuildKit CLI 是使用 Kubernetes 群集构建 OCI 和 Docker 图像的工具
  en: BuildKit CLI for kubectl is a tool for building OCI and Docker images with your kubernetes cluster
x:
  source: https://github.com/vmware-archive/buildkit-cli-for-kubectl
  eget: https://github.com/vmware-archive/buildkit-cli-for-kubectl
rule:
  /eget:
    cmd: x eget vmware-archive/buildkit-cli-for-kubectl
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap vmware-tanzu/buildkit-cli-for-kubectl https://github.com/vmware-tanzu/buildkit-cli-for-kubectl \

      && brew install kubectl-buildkit

      '
    reference: https://github.com/vmware-archive/buildkit-cli-for-kubectl?tab=readme-ov-file#installing-on-macos-and-linux-with-homebrew
  (win|wsl2)/choco:
    cmd: x choco install .\kubectl-buildkit*.nupkg
    reference: https://github.com/vmware-archive/buildkit-cli-for-kubectl?tab=readme-ov-file#installing-on-windows
  /asdf:
    cmd: x asdf use kubectl-buildkit
    reference: https://github.com/ezcater/asdf-kubectl-buildkit?tab=readme-ov-file#install
binlist:
- kubectl-buildkit
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
