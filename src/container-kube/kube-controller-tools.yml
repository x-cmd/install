lang: Go
homepage: https://github.com/kubernetes-sigs/controller-tools
license: Apache-2.0
desc:
  cn: Kubernetes 控制器工具项目是一套用于建筑控制器的 GO 库
  en: The Kubernetes controller-tools Project is a set of go libraries for building Controllers
x:
  source: https://github.com/kubernetes-sigs/controller-tools
  eget: https://github.com/kubernetes-sigs/controller-tools
rule:
  /eget:
    cmd: x eget kubernetes-sigs/controller-tools
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use kube-controller-tools
    reference: https://github.com/jimmidyson/asdf-kube-controller-tools?tab=readme-ov-file#install
binlist:
- kube-controller-tools

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
