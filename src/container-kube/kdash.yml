lang: Rust
homepage: https://github.com/kdash-rs/kdash
license: MIT
desc:
  cn: 使用 Rust 构建的 Kubernetes 简单终端仪表板
  en: A simple terminal dashboard for Kubernetes built with Rust
x:
  source: https://github.com/kdash-rs/kdash
  eget: https://github.com/kdash-rs/kdash
  brew: kdash
  scoop: kdash
  choco: kdash
  powershell: kdash
  yay: kdash
  cargo: kdash
rule:
  /eget:
    cmd: x eget kdash-rs/kdash
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kdash
    reference: https://aur.archlinux.org/packages/kdash
  darwin/brew:
    cmd: 'brew tap kdash-rs/kdash && \

      brew install kdash

      '
    reference: https://github.com/kdash-rs/kdash?tab=readme-ov-file#homebrew-mac--linux
  linux/brew:
    cmd: 'brew tap kdash-rs/kdash && \

      brew install kdash

      '
    reference: https://github.com/kdash-rs/kdash?tab=readme-ov-file#homebrew-mac--linux
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add kdash-bucket https://github.com/kdash-rs/scoop-kdash && \

      x scoop install kdash

      '
    reference: https://github.com/kdash-rs/kdash?tab=readme-ov-file#scoop-windows---recommended-way
  (win|wsl2)/choco:
    cmd: x choco install kdash
    reference: https://github.com/kdash-rs/kdash?tab=readme-ov-file#chocolatey-windows
  /cargo:
    cmd: cargo install kdash
    reference: https://github.com/kdash-rs/kdash?tab=readme-ov-file#cargo
    dsnap: kdash
  nix/run:
    cmd: nix run nixpkgs#kdash
    reference: https://github.com/kdash-rs/kdash?tab=readme-ov-file#nix-maintained-by-third-party
  /curl:
    cmd: curl https://raw.githubusercontent.com/kdash-rs/kdash/main/deployment/getLatest.sh | bash
    reference: https://github.com/kdash-rs/kdash?tab=readme-ov-file#install-script
binlist:
- kdash

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 6 MB
          rating: 1
          desc:
            cn: 安装 6 MB
            en: 6 MB install
        download:
          estimate: 6 MB
          desc:
            cn: 约 6 MB 下载 (linux/arm64)
            en: ~6 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
