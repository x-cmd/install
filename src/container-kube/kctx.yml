lang: JavaScript
homepage: https://github.com/krix38/kctx
license: MIT
desc:
  cn: Kubernetes 上下文工具
  en: Kubernetes context tool
x:
  source: https://github.com/krix38/kctx
rule:
  /npm:
    cmd: npm install -g kctx
    reference: https://github.com/krix38/kctx?tab=readme-ov-file#installation
    dsnap: kctx
binlist:
- kctx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
