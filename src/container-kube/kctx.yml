lang: JavaScript
homepage: https://github.com/krix38/kctx
license: MIT
desc:
  cn: Kubernetes 上下文工具
  en: Kubernetes context tool
x:
  source: https://github.com/krix38/kctx
rule:
  /npm:
    cmd: npm install -g kctx
    reference: https://github.com/krix38/kctx?tab=readme-ov-file#installation
    dsnap: kctx
binlist:
- kctx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
