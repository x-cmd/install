lang: Go
homepage: https://github.com/kubernetes/minikube
license: Apache-2.0
desc:
  cn: minikube 是一个用于在本地计算机上运行单节点 Kubernetes 集群的工具
  en: minikube is a tool for running single-node Kubernetes clusters on your local machine
x:
  pkg:
    exist: true
  source: https://github.com/kubernetes/minikube
  eget: https://github.com/kubernetes/minikube
rule:
  /x:
    cmd: x pkg use minikube
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget kubernetes/minikube
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use minikube
    reference: https://github.com/alvarobp/asdf-minikube
  darwin/brew:
    cmd: brew install minikube
    reference: https://formulae.brew.sh/formula/minikube#default
  (win|wsl2)/choco:
    cmd: x choco install minikube
    reference: https://minikube.sigs.k8s.io/docs/start/
  win/winget:
    cmd: x winget install minikube
    reference: https://minikube.sigs.k8s.io/docs/start/
binlist:
- minikube

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 136 MB
          rating: 3
          desc:
            cn: 安装 136 MB
            en: 136 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 75 MB
        desc:
          cn: 75 MB
          en: 75 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
