lang: 'Go'
homepage: https://github.com/vladimirvivien/ktop
license: 'Apache-2.0'
desc:
  cn: Kubernetes 集群指标的 top 类监控工具
  en: 'A top-like tool for your Kubernetes cluster metrics'
x:
  source: https://github.com/vladimirvivien/ktop
  eget: https://github.com/vladimirvivien/ktop
rule:
  /eget:
    cmd: x eget vladimirvivien/ktop
    reference: https://github.com/vladimirvivien/ktop
binlist:
  - 'ktop'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.7 MB
          rating: 1
          desc:
            cn: 约 1.7 MB（估算）
            en: ~1.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
