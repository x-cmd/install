lang: 'Go'
homepage: https://github.com/vladimirvivien/ktop
license: 'Apache-2.0'
desc:
  cn: Kubernetes 集群指标的 top 类监控工具
  en: 'A top-like tool for your Kubernetes cluster metrics'
x:
  source: https://github.com/vladimirvivien/ktop
  eget: https://github.com/vladimirvivien/ktop
rule:
  /eget:
    cmd: x eget vladimirvivien/ktop
    reference: https://github.com/vladimirvivien/ktop
binlist:
- 'ktop'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 13 MB
          rating: 2
          desc:
            cn: 安装 13 MB
            en: 13 MB install
        download:
          estimate: 13 MB
          desc:
            cn: 约 13 MB 下载 (linux/x64)
            en: ~13 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
