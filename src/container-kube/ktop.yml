lang: 'Go'
homepage: https://github.com/vladimirvivien/ktop
license: 'Apache-2.0'
desc:
  cn: Kubernetes 集群指标的 top 类监控工具
  en: 'A top-like tool for your Kubernetes cluster metrics'
x:
  source: https://github.com/vladimirvivien/ktop
  eget: https://github.com/vladimirvivien/ktop
rule:
  /eget:
    cmd: x eget vladimirvivien/ktop
    reference: https://github.com/vladimirvivien/ktop
binlist:
  - 'ktop'

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
