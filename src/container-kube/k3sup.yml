lang: Go
homepage: https://github.com/alexellis/k3sup
desc:
  cn: k3sup 是一个轻量级实用程序，可在任何本地或远程虚拟机上使用 k3s 从零到 KUBECONFIG
  en: k3sup is a light-weight utility to get from zero to KUBECONFIG with k3s on any local or remote VM
x:
  source: https://github.com/alexellis/k3sup
rule:
  arch/yay:
    cmd: yay -S k3sup
    reference: https://aur.archlinux.org/packages/k3sup
  /curl:
    cmd: 'curl -sLS https://get.k3sup.dev | sh \

      && sudo install k3sup /usr/local/bin/

      '
    reference: https://github.com/alexellis/k3sup?tab=readme-ov-file#download-k3sup-tldr
  /asdf:
    cmd: x asdf use k3sup
    reference: https://github.com/cgroschupp/asdf-k3sup?tab=readme-ov-file#install
binlist:
- k3sup
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8 MB
          rating: 1
          desc:
            cn: 安装 8 MB
            en: 8 MB install
        download:
          estimate: 8 MB
          desc:
            cn: 约 8 MB 下载 (macos/arm64)
            en: ~8 MB download (macos/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: none
    darwin: full
