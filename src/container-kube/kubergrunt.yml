lang: Go
homepage: https://github.com/gruntwork-io/kubergrunt
license: Apache-2.0
desc:
  cn: Kubergrunt 是一个独立的 go 二进制文件，包含一系列命令来填补 Terraform、Helm 和 Kubectl 之间的空白
  en: Kubergrunt is a standalone go binary with a collection of commands to fill in the gaps between Terraform, Helm, and Kubectl
x:
  source: https://github.com/gruntwork-io/kubergrunt
  eget: https://github.com/gruntwork-io/kubergrunt
rule:
  /eget:
    cmd: x eget gruntwork-io/kubergrunt
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kubergrunt
    reference: https://aur.archlinux.org/packages/kubergrunt
  /gruntwork:
    cmd: gruntwork-install --binary-name "kubergrunt" --repo "https://github.com/gruntwork-io/kubergrunt" --tag "v0.5.13"
    reference: https://github.com/gruntwork-io/kubergrunt?tab=readme-ov-file#installation
  (win|wsl2)/choco:
    cmd: x choco install kubergrunt
    reference: https://github.com/gruntwork-io/kubergrunt?tab=readme-ov-file#3rd-party-package-managers
  /go:
    cmd: go build -o bin/kubergrunt ./cmd
    reference: https://github.com/gruntwork-io/kubergrunt?tab=readme-ov-file#building-from-source
    dsnap: kubergrunt
  /asdf:
    cmd: x asdf use kubergrunt
    reference: https://github.com/NeoHsu/asdf-kubergrunt?tab=readme-ov-file#install
binlist:
- kubergrunt

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 56 MB
          rating: 3
          desc:
            cn: 安装 56 MB
            en: 56 MB install
        download:
          estimate: 56 MB
          desc:
            cn: 约 56 MB 下载 (linux/x64)
            en: ~56 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
