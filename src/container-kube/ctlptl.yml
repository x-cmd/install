lang: Go
homepage: https://github.com/tilt-dev/ctlptl
license: Apache-2.0
desc:
  cn: ctlptl 是一个用于声明性地设置本地 Kubernetes 集群的 CLI
  en: ctlptl is a CLI for declaratively setting up local Kubernetes clusters
x:
  source: https://github.com/tilt-dev/ctlptl
rule:
  arch/yay:
    cmd: yay -S ctlptl-bin
    reference: https://aur.archlinux.org/packages/ctlptl-bin
  /asdf:
    cmd: x asdf use ctlptl
    reference: https://github.com/ezcater/asdf-ctlptl?tab=readme-ov-file#install
binlist:
- ctlptl

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
