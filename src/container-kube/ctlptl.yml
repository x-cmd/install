lang: Go
homepage: https://github.com/tilt-dev/ctlptl
license: Apache-2.0
desc:
  cn: ctlptl 是一个用于声明性地设置本地 Kubernetes 集群的 CLI
  en: ctlptl is a CLI for declaratively setting up local Kubernetes clusters
x:
  source: https://github.com/tilt-dev/ctlptl
rule:
  arch/yay:
    cmd: yay -S ctlptl-bin
    reference: https://aur.archlinux.org/packages/ctlptl-bin
  /asdf:
    cmd: x asdf use ctlptl
    reference: https://github.com/ezcater/asdf-ctlptl?tab=readme-ov-file#install
binlist:
- ctlptl

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 52 MB
          rating: 3
          desc:
            cn: 安装 52 MB
            en: 52 MB install
        download:
          estimate: 16 MB
          desc:
            cn: 约 16 MB 下载 (linux/x64)
            en: ~16 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 61 MB
        desc:
          cn: 61 MB
          en: 61 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
