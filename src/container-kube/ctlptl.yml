lang: Go
homepage: https://github.com/tilt-dev/ctlptl
license: Apache-2.0
desc:
  cn: ctlptl 是一个用于声明性地设置本地 Kubernetes 集群的 CLI
  en: ctlptl is a CLI for declaratively setting up local Kubernetes clusters
  cs: ctlptl je CLI pro deklarativní nastavení lokálních clusterů Kubernetes
  de: ctlptl ist eine CLI zum deklarativen Einrichten lokaler Kubernetes-Cluster
  es: ctlptl es una CLI para configurar de forma declarativa clústeres locales de Kubernetes
  fr: ctlptl est une CLI pour configurer de manière déclarative des clusters Kubernetes locaux
  id: ctlptl adalah CLI untuk menyiapkan cluster Kubernetes lokal secara deklaratif
  it: ctlptl è una CLI per configurare in modo dichiarativo cluster Kubernetes locali
  ja: ctlptl はローカル Kubernetes クラスタを宣言的にセットアップする CLI です
  ko: ctlptl은 로컬 Kubernetes 클러스터를 선언적으로 설정하는 CLI입니다
  pl: ctlptl to CLI do deklaratywnego konfigurowania lokalnych klastrów Kubernetes
  pt: O ctlptl é uma CLI para configurar de forma declarativa clusters Kubernetes locais
  ro: ctlptl este o interfață CLI pentru configurarea declarativă a clusterelor locale Kubernetes
  ru: ctlptl — это CLI для декларативной настройки локальных кластеров Kubernetes
  th: ctlptl คือ CLI สำหรับตั้งค่าคลัสเตอร์ Kubernetes ในเครื่องแบบประกาศ
  tr: ctlptl, yerel Kubernetes kümelerini bildirimsel olarak kurmak için bir CLI'dır
  uk: ctlptl — це CLI для декларативного налаштування локальних кластерів Kubernetes
  vi: ctlptl là CLI để thiết lập cụm Kubernetes cục bộ theo kiểu khai báo
x:
  source: https://github.com/tilt-dev/ctlptl
  yay: ctlptl-bin
  asdf: ctlptl
rule:
  arch/yay:
    cmd: yay -S ctlptl-bin
    reference: https://aur.archlinux.org/packages/ctlptl-bin
  /asdf:
    cmd: x asdf use ctlptl
    reference: https://github.com/ezcater/asdf-ctlptl?tab=readme-ov-file#install
binlist:
- ctlptl

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 52 MB
          rating: 3
          desc:
            cn: 安装 52 MB
            en: 52 MB install
        download:
          estimate: 16 MB
          desc:
            cn: 约 16 MB 下载 (linux/x64)
            en: ~16 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 61 MB
        desc:
          cn: 61 MB
          en: 61 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: none
