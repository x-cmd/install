lang: TyperScript
homepage: https://github.com/containers/podman-desktop
license: Apache-2.0
desc:
  cn: Podman Desktop 是开发人员使用容器和 Kubernetes 的最佳免费开源工具
  en: Podman Desktop is the best free and open source tool to work with Containers and Kubernetes for developers
x:
  source: https://github.com/containers/podman-desktop
rule:
  /flatpak:
    cmd: flatpak install flathub io.podman_desktop.PodmanDesktop
    reference: https://flathub.org/apps/io.podman_desktop.PodmanDesktop
  darwin/brew:
    cmd: brew install --cask podman-desktop
    reference: https://formulae.brew.sh/cask/podman-desktop#default
  (win|wsl2)/winget:
    cmd: x winget install -e --id RedHat.Podman-Desktop
    reference: https://podman-desktop.io/downloads
  win/powershell:
    cmd: 'x curl -L https://github.com/containers/podman-desktop/releases/download/v1.13.3/podman-desktop-1.13.3-setup-x64.exe -o ''podman-desktop-1.13.3-setup-x64.exe'' && \

      x pwsh Start-Process ''podman-desktop-1.13.3-setup-x64.exe'' -Wait install

      '
    reference: https://podman-desktop.io/downloads
binlist:
- podman-desktop

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
