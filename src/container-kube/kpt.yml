lang: Go
homepage: https://github.com/kptdev/kpt
license: Apache-2.0
desc:
  cn: 自动化 Kubernetes 配置编辑
  en: Automate Kubernetes Configuration Editing
x:
  source: https://github.com/kptdev/kpt
  eget: https://github.com/kptdev/kpt
  brew: kpt
rule:
  /eget:
    cmd: x eget kptdev/kpt
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kpt-bin
    reference: https://aur.archlinux.org/packages/kpt-bin
  /gcloud:
    cmd: gcloud components install kpt
    reference: https://kpt.dev/installation/kpt-cli?id=gcloud
  darwin/brew:
    cmd: 'brew tap GoogleContainerTools/kpt https://github.com/GoogleContainerTools/kpt.git \

      && brew install kpt

      '
    reference: https://kpt.dev/installation/kpt-cli?id=homebrew
  /go:
    cmd: go install -v github.com/GoogleContainerTools/kpt@main
    reference: https://kpt.dev/installation/kpt-cli?id=source
    dsnap: github.com/GoogleContainerTools/kpt@main
  /asdf:
    cmd: x asdf use kpt
    reference: https://github.com/nlamirault/asdf-kpt?tab=readme-ov-file#install
binlist:
- kpt

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 65 MB
          rating: 3
          desc:
            cn: 安装 65 MB
            en: 65 MB install
        download:
          estimate: 63 MB
          desc:
            cn: 约 63 MB 下载 (linux/x64)
            en: ~63 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
