lang: Go
homepage: https://github.com/loft-sh/devspace
license: Apache-2.0
desc:
  cn: DevSpace 是一个面向 Kubernetes 的开源开发工具，可以让您更快地开发和部署云本地软件
  en: DevSpace is an open-source developer tool for Kubernetes that lets you develop and deploy cloud-native software faster
x:
  source: https://github.com/loft-sh/devspace
  eget: https://github.com/loft-sh/devspace
rule:
  /eget:
    cmd: x eget loft-sh/devspace
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S devspace-bin
    reference: https://aur.archlinux.org/packages/devspace-bin
  /npm:
    cmd: npm install -g devspace
    reference: https://www.devspace.sh/docs/getting-started/installation
    dsnap: devspace
  /yarn:
    cmd: yarn global add devspace
    reference: https://www.devspace.sh/docs/getting-started/installation
  darwin/brew:
    cmd: brew install devspace
    reference: https://www.devspace.sh/docs/getting-started/installation
  darwin/curl:
    cmd: curl -L -o devspace "https://github.com/loft-sh/devspace/releases/latest/download/devspace-darwin-arm64" && sudo install -c -m 0755 devspace /usr/local/bin
    reference: https://www.devspace.sh/docs/getting-started/installation
  linux/curl:
    cmd: curl -L -o devspace "https://github.com/loft-sh/devspace/releases/latest/download/devspace-linux-amd64" && sudo install -c -m 0755 devspace /usr/local/bin
    reference: https://www.devspace.sh/docs/getting-started/installation
  (win|wsl2)/scoop:
    cmd: x scoop install devspace
    reference: https://www.devspace.sh/docs/getting-started/installation
  win/powershell:
    cmd: 'x pwsh md -Force "$Env:APPDATA\devspace"; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]''Tls,Tls11,Tls12''; \

      && x pwsh Invoke-WebRequest -URI "https://github.com/loft-sh/devspace/releases/latest/download/devspace-windows-amd64.exe" -o $Env:APPDATA\devspace\devspace.exe; \

      && x pwsh $env:Path += ";" + $Env:APPDATA + "\devspace"; \

      && x pwsh [Environment]::SetEnvironmentVariable("Path", $env:Path, [System.EnvironmentVariableTarget]::User);

      '
    reference: https://www.devspace.sh/docs/getting-started/installation
  /asdf:
    cmd: x asdf use devspace
    reference: https://github.com/NeoHsu/asdf-devspace?tab=readme-ov-file#install
binlist:
- devspace
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true   # k8s API + image registry
    filesystem:
      read:
        desc:
          cn: 读取 ~/.kube/config 和 devspace.yaml
          en: Reads ~/.kube/config and devspace.yaml
        sensitive:
          - "$HOME/.kube/config"
      write: []
  resource:
    disk:
      size:
        install:
          estimate: 80 MB
          rating: 3
          desc:
            cn: 安装 ~80 MB
            en: ~80 MB install
      paths:
        data: []
        config:
          - "$HOME/.kube/config"
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: ~50 MB
          en: ~50 MB
      peak:
        estimate: 200 MB
        desc:
          cn: ~200 MB（构建镜像时）
          en: ~200 MB (during image build)
    cpu:
      workload: [io, compute]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 5
        desc:
          cn: 同步代码/构建时占用
          en: Spike during sync/build
