lang: Go
homepage: https://github.com/loft-sh/devspace
license: Apache-2.0
desc:
  cn: DevSpace 是一个面向 Kubernetes 的开源开发工具，可以让您更快地开发和部署云本地软件
  en: DevSpace is an open-source developer tool for Kubernetes that lets you develop and deploy cloud-native software faster
  cs: DevSpace je open-source vývojářský nástroj pro Kubernetes, který vám umožňuje rychleji vyvíjet a nasazovat cloud-native software
  de: DevSpace ist ein quelloffenes Entwicklerwerkzeug für Kubernetes, mit dem Sie Cloud-native Software schneller entwickeln und bereitstellen können
  es: DevSpace es una herramienta de desarrollo de código abierto para Kubernetes que le permite desarrollar y desplegar software nativo de la nube más rápido
  fr: DevSpace est un outil de développement open source pour Kubernetes qui vous permet de développer et de déployer plus rapidement des logiciels cloud native
  id: DevSpace adalah alat pengembang sumber terbuka untuk Kubernetes yang memungkinkan Anda mengembangkan dan menerapkan perangkat lunak cloud-native lebih cepat
  it: DevSpace è uno strumento di sviluppo open source per Kubernetes che ti permette di sviluppare e distribuire software cloud-native più velocemente
  ja: DevSpace は Kubernetes 向けのオープンソース開発ツールで、クラウドネイティブなソフトウェアをより速く開発・デプロイできます
  ko: DevSpace는 Kubernetes를 위한 오픈소스 개발 도구로, 클라우드 네이티브 소프트웨어를 더 빠르게 개발하고 배포할 수 있게 해줍니다
  pl: DevSpace to narzędzie deweloperskie o otwartym kodzie dla Kubernetes, które pozwala szybciej tworzyć i wdrażać oprogramowanie cloud-native
  pt: O DevSpace é uma ferramenta de desenvolvimento de código aberto para Kubernetes que permite desenvolver e implantar software cloud-native mais rápido
  ro: DevSpace este un instrument de dezvoltare open source pentru Kubernetes care vă permite să dezvoltați și să implementați software cloud-native mai rapid
  ru: DevSpace — это инструмент разработки с открытым исходным кодом для Kubernetes, позволяющий быстрее разрабатывать и развёртывать облачно-ориентированное ПО
  th: DevSpace เป็นเครื่องมือพัฒนาแบบโอเพนซอร์สสำหรับ Kubernetes ที่ช่วยให้คุณพัฒนาและติดตั้งซอฟต์แวร์แบบคลาวด์เนทีฟได้เร็วขึ้น
  tr: DevSpace, bulut tabanlı yazılımları daha hızlı geliştirmenizi ve dağıtmanızı sağlayan Kubernetes için açık kaynaklı bir geliştirici aracıdır
  uk: DevSpace — це інструмент розробки з відкритим кодом для Kubernetes, який дозволяє швидше розробляти та розгортати хмарно-орієнтоване ПЗ
  vi: DevSpace là công cụ phát triển mã nguồn mở cho Kubernetes, giúp bạn phát triển và triển khai phần mềm cloud-native nhanh hơn
x:
  source: https://github.com/loft-sh/devspace
  eget: loft-sh/devspace
  brew: devspace
  scoop: devspace
  yay: devspace-bin
  npm: devspace
  asdf: devspace
rule:
  /eget:
    cmd: x eget loft-sh/devspace
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S devspace-bin
    reference: https://aur.archlinux.org/packages/devspace-bin
  /npm:
    cmd: npm install -g devspace
    reference: https://www.devspace.sh/docs/getting-started/installation
    dsnap: devspace
  /yarn:
    cmd: yarn global add devspace
    reference: https://www.devspace.sh/docs/getting-started/installation
  darwin/brew:
    cmd: brew install devspace
    reference: https://www.devspace.sh/docs/getting-started/installation
  darwin/curl:
    cmd: curl -L -o devspace "https://github.com/loft-sh/devspace/releases/latest/download/devspace-darwin-arm64" && sudo install -c -m 0755 devspace /usr/local/bin
    reference: https://www.devspace.sh/docs/getting-started/installation
  linux/curl:
    cmd: curl -L -o devspace "https://github.com/loft-sh/devspace/releases/latest/download/devspace-linux-amd64" && sudo install -c -m 0755 devspace /usr/local/bin
    reference: https://www.devspace.sh/docs/getting-started/installation
  (win|wsl2)/scoop:
    cmd: x scoop install devspace
    reference: https://www.devspace.sh/docs/getting-started/installation
  win/powershell:
    cmd: 'x pwsh md -Force "$Env:APPDATA\devspace"; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]''Tls,Tls11,Tls12''; \

      && x pwsh Invoke-WebRequest -URI "https://github.com/loft-sh/devspace/releases/latest/download/devspace-windows-amd64.exe" -o $Env:APPDATA\devspace\devspace.exe; \

      && x pwsh $env:Path += ";" + $Env:APPDATA + "\devspace"; \

      && x pwsh [Environment]::SetEnvironmentVariable("Path", $env:Path, [System.EnvironmentVariableTarget]::User);

      '
    reference: https://www.devspace.sh/docs/getting-started/installation
  /asdf:
    cmd: x asdf use devspace
    reference: https://github.com/NeoHsu/asdf-devspace?tab=readme-ov-file#install
binlist:
- devspace
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # k8s API + image registry
    filesystem:
      read:
        desc:
          cn: 读取 ~/.kube/config 和 devspace.yaml
          en: Reads ~/.kube/config and devspace.yaml
        sensitive:
        - "$HOME/.kube/config"
      write:
        desc:
          cn: 无文件系统读写
          en: No filesystem reads or writes
  resource:
    disk:
      size:
        install:
          estimate: 68 MB
          rating: 3
          desc:
            cn: 安装 68 MB
            en: 68 MB install
        download:
          estimate: 68 MB
          desc:
            cn: 约 68 MB 下载 (linux/x64)
            en: ~68 MB download (linux/x64)
      paths:
        data: []
        config:
        - "$HOME/.kube/config"
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
      peak:
        estimate: 200 MB
        desc:
          cn: ~200 MB（构建镜像时）
          en: ~200 MB (during image build)
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: 同步代码/构建时占用
          en: Spike during sync/build
  platform:
    win: full
    linux: full
    darwin: full
