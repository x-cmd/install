lang: Go
homepage: https://github.com/sunny0826/kubecm
license: Apache-2.0
desc:
  cn: 列表，切换，添加，删除和更多的交互式操作来管理 KubeConfig
  en: List, switch, add, delete and more interactive operations to manage kubeconfig
  cs: Seznam, přepínání, přidávání, mazání a další interaktivní operace pro správu kubeconfigu
  de: Auflisten, Wechseln, Hinzufügen, Löschen und weitere interaktive Operationen zur Verwaltung der kubeconfig
  es: Listar, cambiar, añadir, eliminar y más operaciones interactivas para gestionar kubeconfig
  fr: Lister, changer, ajouter, supprimer et autres opérations interactives pour gérer kubeconfig
  id: Daftar, berpindah, menambah, menghapus, dan operasi interaktif lainnya untuk mengelola kubeconfig
  it: Elenca, cambia, aggiungi, elimina e altre operazioni interattive per gestire kubeconfig
  ja: kubeconfig を管理するためのリスト、切り替え、追加、削除などのインタラクティブな操作
  ko: kubeconfig 관리를 위한 목록, 전환, 추가, 삭제 및 기타 대화형 작업
  pl: Listowanie, przełączanie, dodawanie, usuwanie i inne operacje interaktywne do zarządzania kubeconfig
  pt: Listar, alternar, adicionar, excluir e outras operações interativas para gerenciar o kubeconfig
  ro: Listare, comutare, adăugare, ștergere și alte operațiuni interactive pentru gestionarea kubeconfig
  ru: Просмотр, переключение, добавление, удаление и другие интерактивные операции для управления kubeconfig
  th: รายการ สลับ เพิ่ม ลบ และการดำเนินการแบบโต้ตอบอื่น ๆ เพื่อจัดการ kubeconfig
  tr: kubeconfig yönetmek için listeleme, değiştirme, ekleme, silme ve diğer etkileşimli işlemler
  uk: Перегляд, перемикання, додавання, видалення та інші інтерактивні операції для керування kubeconfig
  vi: Liệt kê, chuyển đổi, thêm, xóa và các thao tác tương tác khác để quản lý kubeconfig
x:
  source: https://github.com/sunny0826/kubecm
  eget: sunny0826/kubecm
  brew: kubecm
  asdf: kubecm
rule:
  /eget:
    cmd: x eget sunny0826/kubecm
    reference: https://x-cmd.com/mod/eget
  /krew:
    cmd: kubectl krew install kc
    reference: https://kubecm.cloud/en-us/introduction?id=install
  darwin/brew:
    cmd: brew install kubecm
    reference: https://kubecm.cloud/en-us/introduction?id=install
  /asdf:
    cmd: x asdf use kubecm
    reference: https://github.com/samhvw8/asdf-kubecm?tab=readme-ov-file#install
binlist:
- kubecm

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
