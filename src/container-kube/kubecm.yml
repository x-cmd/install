lang: Go
homepage: https://github.com/sunny0826/kubecm
license: Apache-2.0
desc:
  cn: 列表，切换，添加，删除和更多的交互式操作来管理 KubeConfig
  en: List, switch, add, delete and more interactive operations to manage kubeconfig
x:
  source: https://github.com/sunny0826/kubecm
  eget: https://github.com/sunny0826/kubecm
  brew: kubecm
  asdf: asdf
rule:
  /eget:
    cmd: x eget sunny0826/kubecm
    reference: https://x-cmd.com/mod/eget
  /krew:
    cmd: kubectl krew install kc
    reference: https://kubecm.cloud/en-us/introduction?id=install
  darwin/brew:
    cmd: brew install kubecm
    reference: https://kubecm.cloud/en-us/introduction?id=install
  /asdf:
    cmd: x asdf use kubecm
    reference: https://github.com/samhvw8/asdf-kubecm?tab=readme-ov-file#install
binlist:
- kubecm

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
