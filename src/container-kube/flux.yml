lang: Go
homepage: https://github.com/fluxcd/flux2
license: Apache-2.0
desc:
  en: Flux is a set of continuous and progressive delivery solutions for Kubernetes that are open and extensible
  cn: Flux 是一套连续和渐进的交付解决方案，是开放和可扩展的 Kubernetes
x:
  source: https://github.com/fluxcd/flux2
  eget: https://github.com/fluxcd/flux2
rule:
  /eget:
    cmd: x eget fluxcd/flux2
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install fluxcd/tap/flux
    reference: https://fluxcd.io/flux/get-started/#install-the-flux-cli
binlist:
- flux

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
