lang: Go
homepage: https://github.com/Azure/aks-engine
license: MIT
desc:
  cn: Azure 上的 Kubernetes 旧版工具（查看状态）
  en: legacy tool for Kubernetes on Azure (see status)
x:
  source: https://github.com/Azure/aks-engine
rule:
  /asdf:
    cmd: x asdf use aks-engine
    reference: https://github.com/robsonpeixoto/asdf-aks-engine?tab=readme-ov-file#install
binlist:
- aks-engine

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
