lang: Go
homepage: https://github.com/Azure/aks-engine
license: MIT
desc:
  cn: Azure 上的 Kubernetes 旧版工具（查看状态）
  en: legacy tool for Kubernetes on Azure (see status)
x:
  source: https://github.com/Azure/aks-engine
rule:
  /asdf:
    cmd: x asdf use aks-engine
    reference: https://github.com/robsonpeixoto/asdf-aks-engine?tab=readme-ov-file#install
binlist:
- aks-engine

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 43 MB
          rating: 2
          desc:
            cn: 安装 43 MB
            en: 43 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 22 MB
        desc:
          cn: 22 MB
          en: 22 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
