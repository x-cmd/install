lang: Go
homepage: https://github.com/Ladicle/kubectl-rolesum
license: MIT
desc:
  cn: 总结指定主题的 RBAC 角色（ServiceAccount，用户和组）
  en: Summarize RBAC roles for the specified subject (ServiceAccount, User and Group)
  cs: Shrnout role RBAC pro zadaný subjekt (ServiceAccount, User a Group)
  de: RBAC-Rollen für das angegebene Subjekt (ServiceAccount, Benutzer und Gruppe) zusammenfassen
  es: Resumir los roles RBAC para el sujeto especificado (ServiceAccount, usuario y grupo)
  fr: Résumer les rôles RBAC pour le sujet spécifié (ServiceAccount, utilisateur et groupe)
  id: Ringkas peran RBAC untuk subjek tertentu (ServiceAccount, User, dan Group)
  it: Riassumi i ruoli RBAC per il soggetto specificato (ServiceAccount, utente e gruppo)
  ja: 指定した主体 (ServiceAccount、User、Group) の RBAC ロールを要約する
  ko: 지정된 주체(ServiceAccount, User, Group)의 RBAC 역할을 요약합니다
  pl: Podsumuj role RBAC dla wskazanego podmiotu (ServiceAccount, użytkownik i grupa)
  pt: Resumir as funções RBAC para o sujeito especificado (ServiceAccount, utilizador e grupo)
  ro: Rezuma rolurile RBAC pentru subiectul specificat (ServiceAccount, utilizator și grup)
  ru: Сводка ролей RBAC для указанного субъекта (ServiceAccount, пользователь и группа)
  th: สรุปบทบาท RBAC สำหรับ subject ที่ระบุ (ServiceAccount, User และ Group)
  tr: Belirtilen özne (ServiceAccount, Kullanıcı ve Grup) için RBAC rollerini özetler
  uk: Підсумок ролей RBAC для вказаного суб'єкта (ServiceAccount, користувач і група)
  vi: Tóm tắt các vai trò RBAC cho chủ thể được chỉ định (ServiceAccount, User và Group)
x:
  source: https://github.com/Ladicle/kubectl-rolesum
  eget: Ladicle/kubectl-rolesum
  brew: Ladicle/kubectl-bindrole/kubectl-rolesum
rule:
  /eget:
    cmd: x eget Ladicle/kubectl-rolesum
    reference: https://x-cmd.com/mod/eget
  /krew:
    cmd: kubectl krew install rolesum
    reference: https://github.com/Ladicle/kubectl-rolesum?tab=readme-ov-file#krew
  darwin/brew:
    cmd: brew install Ladicle/kubectl-bindrole/kubectl-rolesum
    reference: https://github.com/Ladicle/kubectl-rolesum?tab=readme-ov-file#homebrew-for-macos
  /asdf:
    cmd: x sdf use kubectl-bindrole
    reference: https://github.com/looztra/asdf-kubectl-bindrole
binlist:
- kubectl-bindrole

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
