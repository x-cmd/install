lang: Go
homepage: https://github.com/Ladicle/kubectl-rolesum
license: MIT
desc:
  cn: 总结指定主题的 RBAC 角色（ServiceAccount，用户和组）
  en: Summarize RBAC roles for the specified subject (ServiceAccount, User and Group)
x:
  source: https://github.com/Ladicle/kubectl-rolesum
  eget: https://github.com/Ladicle/kubectl-rolesum
rule:
  /eget:
    cmd: x eget Ladicle/kubectl-rolesum
    reference: https://x-cmd.com/mod/eget
  /krew:
    cmd: kubectl krew install rolesum
    reference: https://github.com/Ladicle/kubectl-rolesum?tab=readme-ov-file#krew
  darwin/brew:
    cmd: brew install Ladicle/kubectl-bindrole/kubectl-rolesum
    reference: https://github.com/Ladicle/kubectl-rolesum?tab=readme-ov-file#homebrew-for-macos
  /asdf:
    cmd: x sdf use kubectl-bindrole
    reference: https://github.com/looztra/asdf-kubectl-bindrole
binlist:
- kubectl-bindrole

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
