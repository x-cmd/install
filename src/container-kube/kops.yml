lang: Go
homepage: https://github.com/kubernetes/kops
license: Apache-2.0
desc:
  cn: Kubernetes 运营（KOPS） - 生产 K8S 的安装，升级和管理
  en: Kubernetes Operations (kOps) - Production Grade k8s Installation, Upgrades and Management
  cs: Kubernetes Operations (kOps) – instalace, aktualizace a správa k8s v produkční kvalitě
  de: Kubernetes Operations (kOps) – Installation, Upgrades und Management von k8s auf Produktionsniveau
  es: "Kubernetes Operations (kOps): instalación, actualización y gestión de k8s de nivel de producción"
  fr: Kubernetes Operations (kOps) – Installation, mises à niveau et gestion de k8s de qualité production
  id: Kubernetes Operations (kOps) - Instalasi, peningkatan, dan manajemen k8s kelas produksi
  it: Kubernetes Operations (kOps) - Installazione, aggiornamenti e gestione di k8s di livello di produzione
  ja: Kubernetes Operations (kOps) - 本番品質の k8s のインストール、アップグレード、管理
  ko: Kubernetes Operations (kOps) - 프로덕션 수준의 k8s 설치, 업그레이드 및 관리
  pl: Kubernetes Operations (kOps) – instalacja, aktualizacja i zarządzanie k8s na poziomie produkcyjnym
  pt: Kubernetes Operations (kOps) - Instalação, atualizações e gerenciamento de k8s com qualidade de produção
  ro: Kubernetes Operations (kOps) - Instalare, actualizare și gestionare k8s de calitate producție
  ru: Kubernetes Operations (kOps) — установка, обновление и управление k8s промышленного уровня
  th: Kubernetes Operations (kOps) - การติดตั้ง อัปเกรด และจัดการ k8s ระดับโปรดักชัน
  tr: Kubernetes Operations (kOps) - Üretim kalitesinde k8s kurulumu, yükseltme ve yönetimi
  uk: Kubernetes Operations (kOps) — встановлення, оновлення та керування k8s промислового рівня
  vi: Kubernetes Operations (kOps) - Cài đặt, nâng cấp và quản lý k8s chất lượng sản xuất
x:
  source: https://github.com/kubernetes/kops
  eget: kubernetes/kops
  brew: kops
  yay: kops-bin
  asdf: kops
rule:
  /eget:
    cmd: x eget kubernetes/kops
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kops-bin
    reference: https://aur.archlinux.org/packages/kops-bin
  darwin/brew:
    cmd: brew update && brew install kops
    reference: https://kops.sigs.k8s.io/getting_started/install/#macos-and-linux-from-homebrew
  linux/curl:
    cmd: 'curl -Lo kops https://github.com/kubernetes/kops/releases/download/$(curl -s https://api.github.com/repos/kubernetes/kops/releases/latest | grep tag_name | cut -d ''"'' -f 4)/kops-linux-amd64 \

      && chmod +x kops \

      && sudo mv kops /usr/local/bin/kops

      '
    reference: https://kops.sigs.k8s.io/getting_started/install/#linux
  darwin/curl:
    cmd: 'curl -Lo kops https://github.com/kubernetes/kops/releases/download/$(curl -s https://api.github.com/repos/kubernetes/kops/releases/latest | grep tag_name | cut -d ''"'' -f 4)/kops-darwin-amd64 \

      && chmod +x kops \

      && sudo mv kops /usr/local/bin/kops

      '
    reference: https://kops.sigs.k8s.io/getting_started/install/#macos
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/kubernetes/kops/releases/download/v1.28.2/kops-windows-amd64 -OutFile kops-windows-amd64
    reference: https://github.com/kubernetes/kops/releases/tag/v1.28.2\
  /asdf:
    cmd: x asdf use kops
    reference: https://github.com/Antiarchitect/asdf-kops?tab=readme-ov-file#install
binlist:
- kops

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 165 MB
          rating: 3
          desc:
            cn: 安装 165 MB
            en: 165 MB install
        download:
          estimate: 165 MB
          desc:
            cn: 约 165 MB 下载 (linux/x64)
            en: ~165 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
