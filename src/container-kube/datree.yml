lang: Go
homepage: https://github.com/datreeio/datree
license: Apache-2.0
desc:
  cn: Datree 通过阻止配置错误的资源的部署来保护您的 Kubernetes
  en: Datree secures your Kubernetes by blocking the deployment of misconfigured resources
x:
  source: https://github.com/datreeio/datree
rule:
  /helm:
    cmd: helm repo add datree-webhook https://datreeio.github.io/admission-webhook-datree
    reference: https://hub.datree.io/#install-datree-using-the-tool-of-your-choice
  /asdf:
    cmd: x asdf use datree
    reference: https://github.com/lukeab/asdf-datree?tab=readme-ov-file#install
binlist:
- datree

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 18 MB
          rating: 2
          desc:
            cn: 安装 18 MB
            en: 18 MB install
        download:
          estimate: 18 MB
          desc:
            cn: 约 18 MB 下载 (linux/x64)
            en: ~18 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
