lang: Go
homepage: https://github.com/datreeio/datree
license: Apache-2.0
desc:
  cn: Datree 通过阻止配置错误的资源的部署来保护您的 Kubernetes
  en: Datree secures your Kubernetes by blocking the deployment of misconfigured resources
x:
  source: https://github.com/datreeio/datree
rule:
  /helm:
    cmd: helm repo add datree-webhook https://datreeio.github.io/admission-webhook-datree
    reference: https://hub.datree.io/#install-datree-using-the-tool-of-your-choice
  /asdf:
    cmd: x asdf use datree
    reference: https://github.com/lukeab/asdf-datree?tab=readme-ov-file#install
binlist:
- datree

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
