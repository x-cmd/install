lang: Go
homepage: https://github.com/ahmetb/kubectx
license: Apache-2.0
desc:
  cn: 可以轻松切换 kubectl 上下文并创建别名的工具
  en: Tool that can switch between kubectl contexts easily and create aliases
  cs: Nástroj pro snadné přepínání mezi kontexty kubectl a vytváření aliasů
  de: Werkzeug zum einfachen Wechseln zwischen kubectl-Kontexten und zum Erstellen von Aliasen
  es: Herramienta que cambia fácilmente entre contextos de kubectl y crea alias
  fr: Outil permettant de basculer facilement entre les contextes kubectl et de créer des alias
  id: Alat yang dapat dengan mudah berpindah antar konteks kubectl dan membuat alias
  it: Strumento che consente di passare facilmente tra contesti kubectl e creare alias
  ja: kubectl コンテキストを簡単に切り替えられる比亚丝的を作成できるツール
  ko: kubectl 컨텍스트를 쉽게 전환하고 별칭을 만들 수 있는 도구
  pl: Narzędzie do łatwego przełączania się między kontekstami kubectl i tworzenia aliasów
  pt: Ferramenta que alterna facilmente entre contextos do kubectl e cria apelidos
  ro: Instrument care permite comutarea ușoară între contextele kubectl și crearea de aliasuri
  ru: Инструмент для лёгкого переключения между контекстами kubectl и создания псевдонимов
  th: เครื่องมือที่สลับบริบทของ kubectl ได้อย่างง่ายดายและสร้างนามแฝด
  tr: kubectl bağlamları arasında kolayca geçiş yapan ve takma adlar oluşturan araç
  uk: Інструмент для легкого перемикання між контекстами kubectl та створення псевдонімів
  vi: Công cụ dễ dàng chuyển đổi giữa các context kubectl và tạo bí danh
x:
  source: https://github.com/ahmetb/kubectx
  eget: ahmetb/kubectx
  apt: kubectx
  brew: kubectx
  pacman: kubectx
  port: kubectx
  scoop: main/kubens
  choco: kubens
  winget: ahmetb.kubectx
  asdf: kubectx
rule:
  /x:
    cmd: x pkg use kubectx
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget ahmetb/kubectx
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use kubectx
    reference: https://gitlab.com/wt0f/asdf-kubectx
  darwin/brew:
    cmd: brew install kubectx
    reference: https://formulae.brew.sh/formula/kubectx#default
  darwin/port:
    cmd: sudo port selfupdate && sudo port install kubectx
    reference: https://github.com/ahmetb/kubectx#macports-macos
  (win|wsl2)/choco:
    cmd: x choco install kubens kubectx
    reference: https://github.com/ahmetb/kubectx#windows-installation-using-chocolatey
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add main \

      && x scoop install main/kubens main/kubectx

      '
    reference: https://github.com/ahmetb/kubectx#windows-installation-using-scoop
  (win|wsl2)/winget:
    cmd: 'x winget install --id ahmetb.kubectx \

      && x winget install --id ahmetb.kubens

      '
    reference: https://github.com/ahmetb/kubectx#windows-installation-using-winget
  debian/apt:
    cmd: sudo apt install kubectx
    reference: https://github.com/ahmetb/kubectx#apt-debian
  arch/pacman:
    cmd: sudo pacman -S kubectx
    reference: https://github.com/ahmetb/kubectx#pacman-arch-linux
binlist:
- kubectx

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
        download:
          estimate: 5 MB
          desc:
            cn: 约 5 MB 下载 (linux/x64)
            en: ~5 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
