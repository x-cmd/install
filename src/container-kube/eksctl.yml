lang: Go
homepage: https://github.com/eksctl-io/eksctl
desc:
  cn: Eksctl 是一个简单的 CLI 工具，用于在 EKS 上创建集群——亚马逊为 EC2 提供的新的托管 Kubernetes 服务
  en: eksctl is a simple CLI tool for creating clusters on EKS - Amazon's new managed Kubernetes service for EC2
x:
  source: https://github.com/eksctl-io/eksctl
  eget: https://github.com/eksctl-io/eksctl
  brew: weaveworks/tap/eksctl
  scoop: eksctl
  choco: eksctl
  powershell: eksctl
  yay: eksctl-latest
  asdf: eksctl
rule:
  /eget:
    cmd: x eget eksctl-io/eksctl
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S eksctl-latest
    reference: https://aur.archlinux.org/packages/eksctl-latest
  /asdf:
    cmd: x asdf use eksctl
    reference: https://github.com/elementalvoid/asdf-eksctl?tab=readme-ov-file#install
  darwin/brew:
    cmd: 'brew tap weaveworks/tap \

      && brew install weaveworks/tap/eksctl

      '
    reference: https://eksctl.io/installation/#for-macos
  (win|wsl2)/scoop:
    cmd: x scoop install eksctl
    reference: https://eksctl.io/installation/#for-windows_1
  (win|wsl2)/choco:
    cmd: x choco install eksctl
    reference: https://eksctl.io/installation/#for-windows_1
binlist:
- eksctl
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 25 MB
          rating: 2
          desc:
            cn: 约 25 MB（估算）
            en: ~25 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
