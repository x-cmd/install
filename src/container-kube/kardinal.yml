lang: Go
homepage: https://kardinal.dev/
desc:
  cn: Kardinal 是一个用于在共享 Kubernetes 集群中创建极其轻量级的临时开发环境的框架
  en: Kardinal is a framework for creating extremely lightweight ephemeral development environments within a shared Kubernetes cluster
rule:
  /curl:
    cmd: curl get.kardinal.dev -sL | sh
    reference: https://github.com/kurtosis-tech/kardinal?tab=readme-ov-file#step-1-install-kardinal
binlist:
- kardinal
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
