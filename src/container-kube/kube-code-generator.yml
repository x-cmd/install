lang: Go
homepage: https://github.com/slok/kube-code-generator
desc:
  cn: Kubernetes 代码生成器容器，该容器更容易生成 CRD 清单及其 GO 客户端
  en: A kubernetes code generator container that makes easier to generate CRD manifests and its Go clients
x:
  source: https://github.com/slok/kube-code-generator
rule:
  /asdf:
    cmd: x asdf use kube-code-generator
    reference: https://github.com/jimmidyson/asdf-kube-code-generator?tab=readme-ov-file#install
binlist:
- kube-code-generator
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
