lang: Go
homepage: https://github.com/slok/kube-code-generator
desc:
  cn: Kubernetes 代码生成器容器，该容器更容易生成 CRD 清单及其 GO 客户端
  en: A kubernetes code generator container that makes easier to generate CRD manifests and its Go clients
x:
  source: https://github.com/slok/kube-code-generator
rule:
  /asdf:
    cmd: x asdf use kube-code-generator
    reference: https://github.com/jimmidyson/asdf-kube-code-generator?tab=readme-ov-file#install
binlist:
- kube-code-generator
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 95 KB
          rating: 1
          desc:
            cn: 约 95 KB（估算）
            en: ~95 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
