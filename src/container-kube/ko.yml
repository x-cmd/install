lang: Go
homepage: https://github.com/ko-build/ko
license: Apache-2.0
desc:
  cn: ko 是用于 GO 应用程序的简单快速的容器图像构建器
  en: ko is a simple, fast container image builder for Go applications.
x:
  source: https://github.com/ko-build/ko
  eget: https://github.com/ko-build/ko
rule:
  /eget:
    cmd: x eget ko-build/ko
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use ko
    reference: https://github.com/zasdaym/asdf-ko?tab=readme-ov-file#install
binlist:
- ko

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 12 MB
          rating: 2
          desc:
            cn: 安装 12 MB
            en: 12 MB install
        download:
          estimate: 12 MB
          desc:
            cn: 约 12 MB 下载 (linux/x64)
            en: ~12 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
