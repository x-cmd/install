lang: Go
homepage: https://github.com/ko-build/ko
license: Apache-2.0
desc:
  cn: ko 是用于 GO 应用程序的简单快速的容器图像构建器
  en: ko is a simple, fast container image builder for Go applications.
x:
  source: https://github.com/ko-build/ko
  eget: https://github.com/ko-build/ko
rule:
  /eget:
    cmd: x eget ko-build/ko
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use ko
    reference: https://github.com/zasdaym/asdf-ko?tab=readme-ov-file#install
binlist:
- ko

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.0 MB
          rating: 1
          desc:
            cn: 约 1.0 MB（估算）
            en: ~1.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
