lang: Go
homepage: https://github.com/kubernetes-sigs/kubebuilder
license: Apache-2.0
desc:
  cn: Kubebuilder 是一个使用自定义资源定义 (CRD) 构建 Kubernetes API 的框架
  en: Kubebuilder is a framework for building Kubernetes APIs using custom resource definitions (CRDs)
x:
  source: https://github.com/kubernetes-sigs/kubebuilder
rule:
  arch/yay:
    cmd: yay -S kubebuilder-bin
    reference: https://aur.archlinux.org/packages/kubebuilder-bin
  /curl:
    cmd: 'curl -L -o kubebuilder "https://go.kubebuilder.io/dl/latest/$(go env GOOS)/$(go env GOARCH)" \

      && chmod +x kubebuilder \

      && mv kubebuilder /usr/local/bin/

      '
    reference: https://book.kubebuilder.io/quick-start#installation
  /asdf:
    cmd: x asdf use kubebuilder
    reference: https://github.com/virtualstaticvoid/asdf-kubebuilder?tab=readme-ov-file#install
binlist:
- kubebuilder
