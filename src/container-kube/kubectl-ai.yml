lang: Go
homepage: https://github.com/GoogleCloudPlatform/kubectl-ai
license: apache-2.0
desc:
  cn: AI 驱动的 Kubernetes 助手
  en: AI powered Kubernetes Assistant
x:
  source: https://github.com/GoogleCloudPlatform/kubectl-ai
  eget: https://github.com/GoogleCloudPlatform/kubectl-ai
rule:
  /eget:
    cmd: x eget GoogleCloudPlatform/kubectl-ai
    reference: https://github.com/GoogleCloudPlatform/kubectl-ai
binlist:
- kubectl-ai

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.7 MB
          rating: 1
          desc:
            cn: 约 1.7 MB（估算）
            en: ~1.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
