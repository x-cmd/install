lang: Python
homepage: https://github.com/cloudnativelabs/kube-shell
license: Apache-2.0
desc:
  cn: 一个非常简单的 CLI 来尝试 python 包 - 从未如此简单
  en: An integrated shell for working with the Kubernetes CLI
x:
  source: https://github.com/cloudnativelabs/kube-shell
rule:
  arch/yay:
    cmd: yay -S kube-shell
    reference: https://aur.archlinux.org/packages/kube-shell
  /pip:
    cmd: pip install kube-shell
    reference: https://github.com/cloudnativelabs/kube-shell?tab=readme-ov-file#installation
    dsnap: kube-shell
binlist:
- kube-shell

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
