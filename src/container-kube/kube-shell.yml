lang: Python
homepage: https://github.com/cloudnativelabs/kube-shell
license: Apache-2.0
desc:
  cn: 一个非常简单的 CLI 来尝试 python 包 - 从未如此简单
  en: An integrated shell for working with the Kubernetes CLI
  cs: Integrovaná shell pro práci s nástrojem příkazové řádky Kubernetes
  de: Eine integrierte Shell für die Arbeit mit der Kubernetes-CLI
  es: Un shell integrado para trabajar con la CLI de Kubernetes
  fr: Un shell intégré pour travailler avec la CLI Kubernetes
  id: Shell terintegrasi untukayette dengan CLI Kubernetes
  it: Una shell integrata per lavorare con la CLI di Kubernetes
  ja: Kubernetes CLI を操作するための統合シェル
  ko: Kubernetes CLI로 작업하기 위한 통합 셸
  pl: Zintegrowana powłoka do pracy z CLI Kubernetes
  pt: Um shell integrado para trabalhar com a CLI do Kubernetes
  ro: Un shell integrat pentru lucrul cu CLI-ul Kubernetes
  ru: Встроенная оболочка для работы с CLI Kubernetes
  th: เชลล์แบบรวมสำหรับทำงานกับ Kubernetes CLI
  tr: Kubernetes CLI ile çalışmak için entegre bir kabuk
  uk: Вбудована оболонка для роботи з CLI Kubernetes
  vi: Shell tích hợp để làm việc với CLI Kubernetes
x:
  source: https://github.com/cloudnativelabs/kube-shell
  yay: kube-shell
  pip: kube-shell
rule:
  arch/yay:
    cmd: yay -S kube-shell
    reference: https://aur.archlinux.org/packages/kube-shell
  /pip:
    cmd: pip install kube-shell
    reference: https://github.com/cloudnativelabs/kube-shell?tab=readme-ov-file#installation
    dsnap: kube-shell
binlist:
- kube-shell

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 31 KB
          rating: 1
          desc:
            cn: 安装 31 KB
            en: 31 KB install
        download:
          estimate: 31 KB
          desc:
            cn: 约 31 KB 下载 (whl)
            en: ~31 KB download (whl)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
