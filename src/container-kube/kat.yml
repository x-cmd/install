lang: 'Go'
homepage: 'https://github.com/MacroPower/kat'
license: 'Apache-2.0'
desc:
  cn: Kubernetes 清单的 TUI 与基于规则的渲染引擎
  en: 'TUI and rule-based rendering engine for Kubernetes manifests'
x:
  source: https://github.com/MacroPower/kat
  eget: https://github.com/MacroPower/kat
rule:
  /eget:
    cmd: x eget MacroPower/kat
    reference: https://github.com/MacroPower/kat
binlist:
  - 'kat'

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
