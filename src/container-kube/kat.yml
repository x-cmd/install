lang: 'Go'
homepage: 'https://github.com/MacroPower/kat'
license: 'Apache-2.0'
desc:
  cn: Kubernetes 清单的 TUI 与基于规则的渲染引擎
  en: 'TUI and rule-based rendering engine for Kubernetes manifests'
x:
  source: https://github.com/MacroPower/kat
  eget: https://github.com/MacroPower/kat
rule:
  /eget:
    cmd: x eget MacroPower/kat
    reference: https://github.com/MacroPower/kat
binlist:
- 'kat'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
