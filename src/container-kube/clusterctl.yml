lang: Go
homepage: https://github.com/kubernetes-sigs/cluster-api
license: Apache-2.0
desc:
  cn: 集群 API 是一个 Kubernetes 子项目，主要提供声明性 API 和工具来简化多个 Kubernetes 集群的供应、升级和操作
  en: Cluster API is a Kubernetes subproject focused on providing declarative APIs and tooling to simplify provisioning, upgrading, and operating multiple Kubernetes clusters
x:
  source: https://github.com/kubernetes-sigs/cluster-api
rule:
  arch/yay:
    cmd: yay -S clusterctl
    reference: https://aur.archlinux.org/packages/clusterctl
  /asdf:
    cmd: x asdf use clusterctl
    reference: https://github.com/pfnet-research/asdf-clusterctl?tab=readme-ov-file#install
binlist:
- clusterctl
