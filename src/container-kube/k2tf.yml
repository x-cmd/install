lang: Go
homepage: https://github.com/sl1pm4t/k2tf
license: MPL-2.0
desc:
  cn: 用于将 Kubernetes API 对象（YAML 格式）转换为 HashiCorp 的 Terraform 配置语言的工具
  en: A tool for converting Kubernetes API Objects (in YAML format) into HashiCorp's Terraform configuration language
x:
  source: https://github.com/sl1pm4t/k2tf
  eget: https://github.com/sl1pm4t/k2tf
  brew: k2tf
  yay: k2tf
  asdf: k2tf
rule:
  /eget:
    cmd: x eget sl1pm4t/k2tf
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S k2tf
    reference: https://aur.archlinux.org/packages/k2tf
  darwin/brew:
    cmd: brew install k2tf
    reference: https://github.com/sl1pm4t/k2tf?tab=readme-ov-file#installation
  /asdf:
    cmd: x asdf use k2tf
    reference: https://github.com/carlduevel/asdf-k2tf?tab=readme-ov-file#install
binlist:
- k2tf

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 安装 15 MB
            en: 15 MB install
        download:
          estimate: 15 MB
          desc:
            cn: 约 15 MB 下载 (linux/x64)
            en: ~15 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
