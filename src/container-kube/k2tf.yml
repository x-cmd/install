lang: Go
homepage: https://github.com/sl1pm4t/k2tf
license: MPL-2.0
desc:
  cn: 用于将 Kubernetes API 对象（YAML 格式）转换为 HashiCorp 的 Terraform 配置语言的工具
  en: A tool for converting Kubernetes API Objects (in YAML format) into HashiCorp's Terraform configuration language
x:
  source: https://github.com/sl1pm4t/k2tf
  eget: https://github.com/sl1pm4t/k2tf
rule:
  /eget:
    cmd: x eget sl1pm4t/k2tf
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S k2tf
    reference: https://aur.archlinux.org/packages/k2tf
  darwin/brew:
    cmd: brew install k2tf
    reference: https://github.com/sl1pm4t/k2tf?tab=readme-ov-file#installation
  /asdf:
    cmd: x asdf use k2tf
    reference: https://github.com/carlduevel/asdf-k2tf?tab=readme-ov-file#install
binlist:
- k2tf

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
