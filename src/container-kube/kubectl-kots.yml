lang: Go
homepage: https://github.com/replicatedhq/kots
license: Apache-2.0
desc:
  cn: KOTS 是一个 kubectl 插件和管理控制台，以帮助管理 Kubernetes 现成的软件
  en: KOTS is a kubectl plugin and admin console to help manage Kubernetes Off-The-Shelf software
  cs: KOTS je plugin kubectl a administrační konzole, které pomáhají spravovat hotový software pro Kubernetes
  de: KOTS ist ein kubectl-Plugin und eine Administrationskonsole zur Verwaltung von Kubernetes-Off-The-Shelf-Software
  es: KOTS es un complemento de kubectl y una consola de administración que ayuda a gestionar software Off-The-Shelf de Kubernetes
  fr: KOTS est un plugin kubectl et une console d'administration qui facilite la gestion des logiciels Kubernetes Off-The-Shelf
  id: KOTS adalah plugin kubectl dan konsol admin untuk membantu mengelola software Kubernetes Off-The-Shelf
  it: KOTS è un plugin kubectl e una console di amministrazione che aiuta a gestire software Kubernetes Off-The-Shelf
  ja: KOTS は Kubernetes のオフ-the-shelf ソフトウェアを管理するための kubectl プラグイン兼管理コンソールです
  ko: KOTS는 Kubernetes Off-The-Shelf 소프트웨어 관리를 돕는 kubectl 플러그인 및 관리 콘솔입니다
  pl: KOTS to wtyczka kubectl i konsola administratora ułatwiająca zarządzanie oprogramowaniem Kubernetes Off-The-Shelf
  pt: O KOTS é um plugin do kubectl e um console de administração que ajuda a gerenciar software Kubernetes Off-The-Shelf
  ro: KOTS este un plugin kubectl și o consolă de administrare care ajută la gestionarea software-ului Kubernetes Off-The-Shelf
  ru: KOTS — это плагин kubectl и административная консоль для управления готовым ПО Kubernetes Off-The-Shelf
  th: KOTS เป็นปลั๊กอินของ kubectl และคอนโซลผู้ดูแลระบบเพื่อช่วยจัดการซอฟต์แวร์ Kubernetes Off-The-Shelf
  tr: KOTS, Kubernetes Off-The-Shelf yazılımını yönetmeye yardımcı olan bir kubectl eklentisi ve yönetim konsoludur
  uk: KOTS — це плагін kubectl і адміністративна консоль для керування готовим ПЗ Kubernetes Off-The-Shelf
  vi: KOTS là plugin kubectl và bảng quản trị giúp quản lý phần mềm Kubernetes Off-The-Shelf
x:
  source: https://github.com/replicatedhq/kots
  yay: kubectl-kots-bin
  asdf: kubectl-kots
rule:
  arch/yay:
    cmd: yay -S kubectl-kots-bin
    reference: https://aur.archlinux.org/packages/kubectl-kots-bin
  /curl:
    cmd: curl https://kots.io/install | bash
    reference: https://docs.replicated.com/reference/kots-cli-getting-started#install
  /asdf:
    cmd: x asdf use kubectl-kots
    reference: https://github.com/ganta/asdf-kubectl-kots?tab=readme-ov-file#install
binlist:
- kubectl-kots

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
