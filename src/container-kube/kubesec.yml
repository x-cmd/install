lang: Go
homepage: https://github.com/shyiko/kubesec
license: Apache-2.0
desc:
  cn: Kubernetes 的安全秘密管理（使用 gpg、Google Cloud KMS 和 AWS KMS 后端）
  en: Secure Secret management for Kubernetes (with gpg, Google Cloud KMS and AWS KMS backends)
x:
  source: https://github.com/shyiko/kubesec
  eget: https://github.com/shyiko/kubesec
rule:
  /eget:
    cmd: x eget shyiko/kubesec
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use kubesec
    reference: https://github.com/vitalis/asdf-kubesec?tab=readme-ov-file#install
  darwin/curl:
    cmd: curl -sSL https://github.com/shyiko/kubesec/releases/download/0.9.2/kubesec-0.9.2-darwin-amd64 -o kubesec && chmod a+x kubesec && sudo mv kubesec /usr/local/bin/
    reference: https://github.com/shyiko/kubesec?tab=readme-ov-file#macos
  darwin/brew:
    cmd: brew install shyiko/kubesec/kubesec
    reference: https://github.com/shyiko/kubesec?tab=readme-ov-file#-with-homebrew
  linux/curl:
    cmd: curl -sSL https://github.com/shyiko/kubesec/releases/download/0.9.2/kubesec-0.9.2-linux-amd64 -o kubesec && chmod a+x kubesec && sudo mv kubesec /usr/local/bin/
    reference: https://github.com/shyiko/kubesec?tab=readme-ov-file#linux
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/shyiko/kubesec/releases/download/0.9.2/kubesec-0.9.2-windows-amd64.exe -OutFile kubesec-0.9.2-windows-amd64.exe
    reference: https://github.com/shyiko/kubesec?tab=readme-ov-file#windows
binlist:
- kubesec

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
