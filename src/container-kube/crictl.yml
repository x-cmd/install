lang: Go
homepage: https://github.com/kubernetes-sigs/cri-tools
license: Apache-2.0
desc:
  cn: Kubelet 容器运行时接口(CRI)的 CLI 和验证工具
  en: CLI and validation tools for Kubelet Container Runtime Interface (CRI)
  cs: CLI a validační nástroje pro rozhraní Kubelet Container Runtime Interface (CRI)
  de: CLI- und Validierungstools für das Kubelet Container Runtime Interface (CRI)
  es: Herramientas de CLI y validación para la interfaz de tiempo de ejecución de contenedores de Kubelet (CRI)
  fr: Outils CLI et de validation pour l'interface Container Runtime Interface de Kubelet (CRI)
  id: Alat CLI dan validasi untuk Kubelet Container Runtime Interface (CRI)
  it: Strumenti CLI e di validazione per Kubelet Container Runtime Interface (CRI)
  ja: Kubelet Container Runtime Interface (CRI) の CLI と検証ツール
  ko: Kubelet Container Runtime Interface(CRI)를 위한 CLI 및 검증 도구
  pl: Narzędzia CLI i walidacji dla Kubelet Container Runtime Interface (CRI)
  pt: Ferramentas de CLI e validação para a interface de runtime de contêineres do Kubelet (CRI)
  ro: Instrumente CLI și de validare pentru Kubelet Container Runtime Interface (CRI)
  ru: CLI-инструменты и утилиты валидации для Kubelet Container Runtime Interface (CRI)
  th: เครื่องมือ CLI และการตรวจสอบสำหรับ Kubelet Container Runtime Interface (CRI)
  tr: Kubelet Container Runtime Interface (CRI) için CLI ve doğrulama araçları
  uk: CLI-інструменти та утиліти валідації для Kubelet Container Runtime Interface (CRI)
  vi: Công cụ CLI và xác thực cho Kubelet Container Runtime Interface (CRI)
x:
  source: https://github.com/kubernetes-sigs/cri-tools
  eget: kubernetes-sigs/cri-tools
  asdf: crictl
rule:
  /eget:
    cmd: x eget kubernetes-sigs/cri-tools
    reference: https://x-cmd.com/mod/eget
  /wget:
    cmd: 'VERSION="v1.28.0" \

      && wget https://github.com/kubernetes-sigs/cri-tools/releases/download/$VERSION/crictl-$VERSION-linux-amd64.tar.gz  \

      && sudo tar zxvf crictl-$VERSION-linux-amd64.tar.gz -C /usr/local/bin  \

      && rm -f crictl-$VERSION-linux-amd64.tar.gz

      '
    reference: https://github.com/kubernetes-sigs/cri-tools?tab=readme-ov-file#install-crictl
  /asdf:
    cmd: x asdf use crictl
    reference: https://github.com/FairwindsOps/asdf-crictl?tab=readme-ov-file#install
binlist:
- crictl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 15 MB
          rating: 2
          desc:
            cn: 约 15 MB（估算）
            en: ~15 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 25 MB
        desc:
          cn: 25 MB（估算）
          en: 25 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
