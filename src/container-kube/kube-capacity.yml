lang: Go
homepage: https://github.com/robscott/kube-capacity
license: Apache-2.0
desc:
  cn: 一个简单的命令行界面（CLI），用于提供 Kubernetes 集群中资源请求、限制和利用率的概览
  en: A simple CLI that provides an overview of the resource requests, limits, and utilization in a Kubernetes cluster
  cs: Jednoduché CLI poskytující přehled požadavků, limitů a využití zdrojů v clusteru Kubernetes
  de: Ein einfaches CLI mit einer Übersicht über Ressourcenanforderungen, Limits und Auslastung in einem Kubernetes-Cluster
  es: Una CLI sencilla que ofrece una vista general de las solicitudes, los límites y la utilización de recursos en un clúster de Kubernetes
  fr: Une CLI simple qui fournit un aperçu des requêtes, des limites et de l'utilisation des ressources dans un cluster Kubernetes
  id: CLI sederhana yang memberi ikhtisar permintaan, batas, dan utilisasi sumber daya dalam kluster Kubernetes
  it: Una CLI semplice che fornisce una panoramica delle richieste, dei limiti e dell'utilizzo delle risorse in un cluster Kubernetes
  ja: Kubernetes クラスター内のリソース要求、制限、利用状況の概要を提供するシンプルな CLI
  ko: Kubernetes 클러스터의 리소스 요청, 제한 및 사용률에 대한 개요를 제공하는 간단한 CLI
  pl: Prosty CLI dający przegląd żądań, limitów i wykorzystania zasobów w klastrze Kubernetes
  pt: Uma CLI simples que fornece uma visão geral das solicitações, limites e utilização de recursos em um cluster Kubernetes
  ro: Un CLI simplu care oferă o privire de ansamblu asupra cererilor, limitelor și utilizării resurselor într-un cluster Kubernetes
  ru: Простой CLI, дающий обзор запросов, лимитов и использования ресурсов в кластере Kubernetes
  th: CLI อย่างง่ายที่ให้ภาพรวมของคำขอทรัพยากร ขีดจำกัด และการใช้ทรัพยากรในคลัสเตอร์ Kubernetes
  tr: Bir Kubernetes kümesinde kaynak isteklerine, limitlere ve kullanıma genel bir bakış sağlayan basit bir CLI
  uk: Простий CLI, що дає огляд запитів, лімітів та використання ресурсів у кластері Kubernetes
  vi: CLI đơn giản cung cấp tổng quan về yêu cầu, giới hạn và mức sử dụng tài nguyên trong cụm Kubernetes
x:
  source: https://github.com/robscott/kube-capacity
  eget: robscott/kube-capacity
  brew: robscott/tap/kube-capacity
  yay: kube-capacity-bin
rule:
  /x:
    cmd: x pkg use kube-capacity
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget robscott/kube-capacity
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kube-capacity-bin
    reference: https://aur.archlinux.org/packages/kube-capacity-bin
  darwin/brew:
    cmd: 'brew tap robscott/tap 、 \

      && brew install robscott/tap/kube-capacity

      '
    reference: https://github.com/robscott/kube-capacity?tab=readme-ov-file#homebrew
  /krew:
    cmd: kubectl krew install resource-capacity
    reference: https://github.com/robscott/kube-capacity?tab=readme-ov-file#krew
binlist:
- kube-capacity

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 11 MB
          desc:
            cn: 约 11 MB 下载 (linux/x64)
            en: ~11 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
