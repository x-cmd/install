    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 43 MB
        desc:
          cn: 43 MB
          en: 43 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
