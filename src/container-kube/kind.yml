lang: Go
homepage: https://github.com/kubernetes-sigs/kind/
license: Apache-2.0
desc:
  cn: kind 是一个使用 Docker 容器 "nodes" 运行本地 Kubernetes 集群的工具
  en: kind is a tool for running local Kubernetes clusters using Docker container "nodes"
x:
  pkg:
    exist: true
  source: https://github.com/kubernetes-sigs/kind
  eget: https://github.com/kubernetes-sigs/kind
rule:
  /x:
    cmd: x pkg use kind
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget kubernetes-sigs/kind
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S kind-bin
    reference: https://aur.archlinux.org/packages/kind-bin
  /asdf:
    cmd: x asdf use kind
    reference: https://github.com/johnlayton/asdf-kind
  darwin/brew:
    cmd: brew install kind
    reference: https://formulae.brew.sh/formula/kind#default
binlist:
- kind

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 安装 10 MB
            en: 10 MB install
        download:
          estimate: 10 MB
          desc:
            cn: 约 10 MB 下载 (linux/x64)
            en: ~10 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 43 MB
        desc:
          cn: 43 MB
          en: 43 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 1
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
