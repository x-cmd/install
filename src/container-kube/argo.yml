lang: Go
homepage: https://github.com/argoproj/argo-cd
license: Apache-2.0
desc:
  cn: 适用于 Kubernetes 的开源工具，用于运行工作流、管理集群和正确执行 GitOps
  en: Open source tools for Kubernetes to run workflows, manage clusters, and do GitOps right
x:
  source: https://github.com/argoproj/argo-cd
  eget: https://github.com/argoproj/argo-cd
rule:
  /eget:
    cmd: x eget argoproj/argo-cd
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S argo-bin
    reference: https://aur.archlinux.org/packages/argo-bin
  /asdf:
    cmd: x asdf use argo
    reference: https://github.com/sudermanjr/asdf-argo
  darwin/brew:
    cmd: brew install argo
    reference: https://formulae.brew.sh/formula/argo#default
  (win|wsl2)/scoop:
    cmd: x scoop install argo
    reference: https://scoop.sh/#/apps?q=argo
binlist:
- argo

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
