lang: Go
homepage: https://github.com/Azure/kubelogin
license: MIT
desc:
  cn: kubelogin 是一个实现 azure 身份验证的客户端凭证 (exec) 插件
  en: kubelogin is a client-go credential (exec) plugin implementing azure authentication
  cs: kubelogin je plugin pro přihlašovací údaje (exec) client-go, který implementuje ověřování azure
  de: kubelogin ist ein client-go-Anmeldeinformations-Plugin (exec), das die Azure-Authentifizierung implementiert
  es: kubelogin es un complemento de credenciales (exec) de client-go que implementa la autenticación de azure
  fr: kubelogin est un plugin d'identifiants (exec) de client-go implémentant l'authentification azure
  id: kubelogin adalah plugin kredensial (exec) client-go yang mengimplementasikan autentikasi azure
  it: kubelogin è un plugin per le credenziali (exec) di client-go che implementa l'autenticazione azure
  ja: kubelogin は azure 認証を実装する client-go の資格情報 (exec) プラグインです
  ko: kubelogin은 azure 인증을 구현하는 client-go 자격 증명(exec) 플러그인입니다
  pl: kubelogin to wtyczka poświadczeń (exec) client-go implementująca uwierzytelnianie azure
  pt: kubelogin é um plugin de credenciais (exec) do client-go que implementa a autenticação azure
  ro: kubelogin este un plugin de credențiale (exec) pentru client-go care implementează autentificarea azure
  ru: kubelogin — это плагин учётных данных (exec) для client-go, реализующий аутентификацию azure
  th: kubelogin เป็นปลั๊กอินข้อมูลรับรอง (exec) ของ client-go ที่ทำหน้าที่ยืนยันตัวตนของ azure
  tr: kubelogin, azure kimlik doğrulamasını gerçekleyen bir client-go kimlik bilgisi (exec) eklentisidir
  uk: kubelogin — це плагін облікових даних (exec) для client-go, що реалізує автентифікацію azure
  vi: kubelogin là plugin thông tin xác thực (exec) của client-go, thực hiện xác thực azure
x:
  source: https://github.com/Azure/kubelogin
  eget: Azure/kubelogin
  brew: Azure/kubelogin/kubelogin
  scoop: kubectl
  choco: kubernetes-cli
  asdf: kubelogin
rule:
  /eget:
    cmd: x eget Azure/kubelogin
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install Azure/kubelogin/kubelogin
    reference: https://azure.github.io/kubelogin/install.html#homebrew
  /asdf:
    cmd: x asdf use kubelogin
    reference: https://azure.github.io/kubelogin/install.html#linux
  (win|wsl2)/scoop:
    cmd: x scoop install kubectl azure-kubelogin
    reference: https://azure.github.io/kubelogin/install.html#using-scoop
  (win|wsl2)/choco:
    cmd: x choco install kubernetes-cli azure-kubelogin
    reference: https://azure.github.io/kubelogin/install.html#using-chocolatey
  (win|wsl2)/winget:
    cmd: 'x winget install --id=Kubernetes.kubectl  -e \

      && x winget install --id=Microsoft.Azure.Kubelogin  -e

      '
    reference: https://azure.github.io/kubelogin/install.html#using-winget
binlist:
- kubelogin

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 23 MB
          rating: 2
          desc:
            cn: 安装 23 MB
            en: 23 MB install
        download:
          estimate: 23 MB
          desc:
            cn: 约 23 MB 下载 (linux/x64)
            en: ~23 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
