homepage: https://github.com/helm/helm
license: Apache-2.0
desc:
  cn: helm 是 Kubernetes 的包管理器
  en: helm is the package manager for Kubernetes
lang: Go
x:
  source: https://github.com/helm/helm
  eget: https://github.com/helm/helm
  dnf: helm
  brew: helm
  pacman: helm
  snap: helm
  scoop: helm
  choco: kubernetes-helm
  powershell: kubernetes-helm
  asdf: helm
  pkg: helm
rule:
  /x:
    cmd: x pkg use helm
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget helm/helm
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use helm
    reference: https://github.com/Antiarchitect/asdf-helm
  /curl:
    cmd: 'curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \

      && chmod 700 get_helm.sh \

      && ./get_helm.sh

      '
    reference: https://helm.sh/docs/intro/install/#from-script
  darwin/brew:
    cmd: brew install helm
    reference: https://formulae.brew.sh/formula/helm#default
  arch/pacman:
    cmd: sudo pacman -S helm
    reference: https://command-not-found.com/helm
  fedora/dnf:
    cmd: sudo dnf install helm
    reference: https://helm.sh/docs/intro/install/#from-dnfyum-fedora
  (win|wsl2)/scoop:
    cmd: x scoop install helm
    reference: https://helm.sh/docs/intro/install/#from-scoop-windows
  (win|wsl2)/choco:
    cmd: x choco install kubernetes-helm
    reference: https://helm.sh/docs/intro/install/#from-chocolatey-windows
  /snap:
    cmd: sudo snap install helm --classic
    reference: https://helm.sh/docs/intro/install/#from-snap
  freebsd/pkg:
    cmd: sudo pkg install helm
    reference: https://helm.sh/docs/intro/install/#from-pkg-freebsd
binlist:
- helm

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 7.7 MB
          rating: 1
          desc:
            cn: 约 7.7 MB（估算）
            en: ~7.7 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
