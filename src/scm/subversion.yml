lang: Java
homepage: https://github.com/apache/subversion
license: Apache-2.0
desc:
  cn: 面向大众的企业级集中版本控制
  en: Enterprise-level centralized version control for the masses
x:
  source: https://github.com/apache/subversion
rule:
  darwin/brew:
    cmd: brew install subversion
    reference: https://formulae.brew.sh/formula/subversion#default
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras \

      && x scoop install extras/smartsvn

      '
    reference: https://scoop.sh/#/apps?q=subversion
binlist:
- subversion

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 50 MB
          rating: 1
          desc:
            cn: 安装 50 MB
            en: 50 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 100 MB
        desc:
          cn: 100 MB
          en: 100 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
