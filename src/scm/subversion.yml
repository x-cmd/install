lang: Java
homepage: https://github.com/apache/subversion
license: Apache-2.0
desc:
  cn: 面向大众的企业级集中版本控制
  en: Enterprise-level centralized version control for the masses
  cs: Podniková verze správy zdrojového kódu na podnikové úrovni pro širokou veřejnost
  de: Unternehmensweites zentralisiertes Versionskontrollsystem für die Allgemeinheit
  es: Control de versiones centralizado de nivel empresarial para las masas
  fr: Gestion de versions centralisée de niveau entreprise pour le grand public
  id: Kontrol versi terpusat kelas perusahaan untuk masyarakat luas
  it: Controllo versione centralizzato di livello aziendale per il grande pubblico
  ja: 一般公众のためのエンタープライズ向け集中バージョン管理
  ko: 일반인을 위한 엔터프라이즈급 중앙 집중식 버전 관리
  pl: Centralne zarządzanie wersjami na poziomie korporacyjnym dla mas
  pt: Controle de versão centralizado de nível empresarial para o público em geral
  ro: Control versiuni centralizat de nivel enterprise pentru mase
  ru: Централизованный корпоративный контроль версий для широкой аудитории
  th: การควบคุมเวอร์ชันแบบรวมศูนย์ระดับองค์กรสำหรับผู้ใช้ทั่วไป
  tr: Geniş kullanıcı kitlesi için kurumsal düzeyde merkezi sürüm kontrolü
  uk: Централізований корпоративний контроль версій для широкої аудиторії
  vi: Quản lý phiên bản tập trung cấp doanh nghiệp cho mọi người
x:
  source: https://github.com/apache/subversion
  brew: subversion
  scoop: extras/smartsvn
rule:
  darwin/brew:
    cmd: brew install subversion
    reference: https://formulae.brew.sh/formula/subversion#default
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras \

      && x scoop install extras/smartsvn

      '
    reference: https://scoop.sh/#/apps?q=subversion
binlist:
- subversion

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 38 MB
          rating: 2
          desc:
            cn: 约 38 MB（估算）
            en: ~38 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
