lang: Java
homepage: https://github.com/apache/subversion
license: Apache-2.0
desc:
  cn: 面向大众的企业级集中版本控制
  en: Enterprise-level centralized version control for the masses
x:
  source: https://github.com/apache/subversion
rule:
  darwin/brew:
    cmd: brew install subversion
    reference: https://formulae.brew.sh/formula/subversion#default
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add extras \

      && x scoop install extras/smartsvn

      '
    reference: https://scoop.sh/#/apps?q=subversion
binlist:
- subversion

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 38 MB
          rating: 2
          desc:
            cn: 约 38 MB（估算）
            en: ~38 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
