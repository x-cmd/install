lang: Python
homepage: https://github.com/barry-scott/scm-workbench
license: Apache-2.0
desc:
  cn: SCM WorkBench 是一个 GUI，可以方便地以 PySVN WorkBench 的风格使用 Git、 Mercurial (hg)和 Subversion (svn)存储库
  en: SCM Workbench is a GUI to easily work with Git, Mercurial (hg) and Subversion (svn) repositories in the style of PySVN WorkBench
x:
  source: https://github.com/barry-scott/scm-workbench
rule:
  fedora/dnf:
    cmd: 'sudo dnf copr enable barryascott/tools \

      && sudo dnf install scm-workbench

      '
    reference: https://scm-workbench.barrys-emacs.org/
    dsnap: scm-workbench
binlist:
- scm-workbench
