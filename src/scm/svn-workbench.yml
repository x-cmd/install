lang: Python
homepage: http://pysvn.tigris.org/
desc:
  cn: Pysvn-workbench 是用 Python 语言编写的 Subversion 修订控制系统的工作台(图形客户机)
  en: pysvn-workbench is a workbench (graphical client) for the Subversion revision control system, written in the Python language
rule:
  debian/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
    dsnap: svn-workbench
  ubuntu/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
    dsnap: svn-workbench
  kali/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
    dsnap: svn-workbench
  raspbian/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
binlist:
- svn-workbench
license: NOASSERTION
footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: true   # svn operations remote
    filesystem:
      read:
        desc:
          cn: 读取 SVN working copy（.svn/, .entries）
          en: Reads SVN working copy (.svn/, .entries)
        sensitive: []
      write:
        desc:
          cn: 修改 SVN working copy
          en: Modifies SVN working copy
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 ~5 MB
            en: ~5 MB install
      paths:
        data: []
        config:
          - "$HOME/.config/svn-workbench"
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: ~50 MB GUI
          en: ~50 MB GUI
      peak:
        estimate: 150 MB
        desc:
          cn: ~150 MB
          en: ~150 MB
    cpu:
      workload: [io]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 3
        desc:
          cn: diff 视图时短暂占用
          en: Brief spike on diff view
