lang: Python
homepage: http://pysvn.tigris.org/
desc:
  cn: Pysvn-workbench 是用 Python 语言编写的 Subversion 修订控制系统的工作台(图形客户机)
  en: pysvn-workbench is a workbench (graphical client) for the Subversion revision control system, written in the Python language
  cs: pysvn-workbench je pracovní prostředí (grafický klient) pro systém správy verzí Subversion, napsané v jazyce Python
  de: pysvn-workbench ist eine Workbench (grafischer Client) für das Versionskontrollsystem Subversion, geschrieben in der Sprache Python
  es: pysvn-workbench es un banco de trabajo (cliente gráfico) para el sistema de control de versiones Subversion, escrito en el lenguaje Python
  fr: pysvn-workbench est un atelier (client graphique) pour le système de gestion de versions Subversion, écrit en langage Python
  id: pysvn-workbench adalah workbench (klien grafis) untuk sistem kontrol versi Subversion, ditulis dalam bahasa Python
  it: pysvn-workbench è una workbench (client grafico) per il sistema di controllo versione Subversion, scritta in linguaggio Python
  ja: pysvn-workbench は Python 言語で書かれた Subversion 版管理システムのワークベンチ（グラフィカルクライアント）です
  ko: pysvn-workbench는 Python 언어로 작성된 Subversion 버전 관리 시스템의 워크벤치(그래픽 클라이언트)입니다
  pl: pysvn-workbench to środowisko pracy (klient graficzny) dla systemu kontroli wersji Subversion, napisane w języku Python
  pt: pysvn-workbench é um ambiente de trabalho (cliente gráfico) para o sistema de controle de versão Subversion, escrito na linguagem Python
  ro: pysvn-workbench este un mediu de lucru (client grafic) pentru sistemul de control al versiunilor Subversion, scris în limbajul Python
  ru: pysvn-workbench — это рабочая среда (графический клиент) для системы контроля версий Subversion, написанная на языке Python
  th: pysvn-workbench เป็นเวิร์กเบนช์ (ไคลเอนต์กราฟิก) สำหรับระบบควบคุมเวอร์ชัน Subversion เขียนด้วยภาษา Python
  tr: pysvn-workbench, Python dilinde yazılmış Subversion sürüm kontrol sistemi için bir çalışma tezgahıdır (grafik istemci)
  uk: pysvn-workbench — це робоче середовище (графічний клієнт) для системи контролю версій Subversion, написана мовою Python
  vi: pysvn-workbench là workbench (trình khách hàng đồ họa) cho hệ thống quản lý phiên bản Subversion, được viết bằng ngôn ngữ Python
rule:
  debian/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
    dsnap: svn-workbench
  ubuntu/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
    dsnap: svn-workbench
  kali/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
    dsnap: svn-workbench
  raspbian/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench

x:
  apt: svn-workbench
  apt-get: svn-workbench
binlist:
- svn-workbench
license: NOASSERTION
# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # svn operations remote
    filesystem:
      read:
        desc:
          cn: 读取 SVN working copy（.svn/, .entries）
          en: Reads SVN working copy (.svn/, .entries)
        sensitive: []
      write:
        desc:
          cn: 修改 SVN working copy
          en: Modifies SVN working copy
        sensitive: []
  platform:
    win: none
    linux: full
    darwin: none
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config:
          - "$HOME/.config/svn-workbench"
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
      peak:
        estimate: 150 MB
        desc:
          cn: ~150 MB
          en: ~150 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 3
        desc:
          cn: diff 视图时短暂占用
          en: Brief spike on diff view
