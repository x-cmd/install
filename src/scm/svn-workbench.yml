lang: Python
homepage: http://pysvn.tigris.org/
desc:
  cn: Pysvn-workbench 是用 Python 语言编写的 Subversion 修订控制系统的工作台(图形客户机)
  en: pysvn-workbench is a workbench (graphical client) for the Subversion revision control system, written in the Python language
rule:
  debian/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
    dsnap: svn-workbench
  ubuntu/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
    dsnap: svn-workbench
  kali/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
    dsnap: svn-workbench
  raspbian/apt:
    cmd: sudo apt-get install svn-workbench
    reference: https://command-not-found.com/svn-workbench
binlist:
- svn-workbench
license: NOASSERTION
# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      localhost: true
      lan: false
      internet: true
      # needs-review: confirm lan=false   # svn operations remote
    filesystem:
      read:
        desc:
          cn: 读取 SVN working copy（.svn/, .entries）
          en: Reads SVN working copy (.svn/, .entries)
        sensitive: []
      write:
        desc:
          cn: 修改 SVN working copy
          en: Modifies SVN working copy
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config:
          - "$HOME/.config/svn-workbench"
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
      peak:
        estimate: 150 MB
        desc:
          cn: ~150 MB
          en: ~150 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 3
        desc:
          cn: diff 视图时短暂占用
          en: Brief spike on diff view
