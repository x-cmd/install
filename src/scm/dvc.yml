lang: Python
homepage: https://github.com/iterative/dvc
license: Apache-2.0
desc:
  cn: DVC 是利用现有软件工程工具集的数据科学工具
  en: DVC is a tool for data science that takes advantage of existing software engineering toolset
x:
  pkg:
    exist: true
  source: https://github.com/iterative/dvc
rule:
  /x:
    cmd: x pkg use dvc
    reference: https://x-cmd.com/install/
  darwin/brew:
    cmd: brew install dvc
    reference: https://dvc.org/doc/install/macos#install-with-brew
  /pip:
    cmd: pip install dvc
    reference: https://dvc.org/doc/install/macos#install-with-pip
    dsnap: dvc
  (win|wsl2)/choco:
    cmd: x choco install dvc
    reference: https://dvc.org/doc/install/windows#install-with-choco
  /conda:
    cmd: 'conda install -c conda-forge mamba \

      && mamba install -c conda-forge dvc

      '
    reference: https://dvc.org/doc/install/windows#install-with-conda
  /snap:
    cmd: sudo snap install --classic dvc
    reference: https://dvc.org/doc/install/linux#install-with-snap
  debian/apt:
    cmd: sudo apt install ./dvc_0.62.1_amd64.deb
    reference: https://dvc.org/doc/install/linux#from-pkg-on-debian-ubuntu
  ubuntu/apt:
    cmd: sudo apt install ./dvc_0.62.1_amd64.deb
    reference: https://dvc.org/doc/install/linux#from-pkg-on-debian-ubuntu
  fedora/yum:
    cmd: sudo yum install dvc-0.62.1-1.x86_64.rpm
    reference: https://dvc.org/doc/install/linux#from-pkg-on-fedora-centos
  centos/yum:
    cmd: sudo yum install dvc-0.62.1-1.x86_64.rpm
    reference: https://dvc.org/doc/install/linux#from-pkg-on-fedora-centos
  arch/yay:
    cmd: yay -S dvc
    reference: https://aur.archlinux.org/packages/dvc
binlist:
- dvc

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
