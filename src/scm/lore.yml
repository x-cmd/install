lang: Rust
homepage: https://github.com/epicgames/lore
license: MIT

desc:
  cn: Lore 是一个开源版本控制系统，旨在实现数据和团队前所未有的可扩展性。
  en: Lore is an open source version control system designed for unprecedented scalability of both data and teams.
  cs: Lore je open source systém správy verzí navržený pro bezprecedentní škálovatelnost dat i týmů.
  de: Lore ist ein Open-Source-Versionsverwaltungssystem, das für beispiellose Skalierbarkeit von Daten und Teams entwickelt wurde.
  es: Lore es un sistema de control de versiones de código abierto diseñado para una escalabilidad sin precedentes de datos y equipos.
  fr: Lore est un système de gestion de versions open source conçu pour une évolutivité sans précédent des données et des équipes.
  id: Lore adalah sistem kontrol versi open source yang dirancang untuk skalabilitas data dan tim yang belum pernah sebelumnya.
  it: Lore è un sistema di controllo versione open source progettato per una scalabilità senza precedenti di dati e team.
  ja: Loreは、データとチームの両方面で前例のない拡張性を実現するために設計されたオープンソースのバージョン控制系统です。
  ko: Lore는 데이터와 팀 모두에 대한 전례 없는 확장성을 위해 설계된 오픈 소스 버전 제어 시스템입니다.
  pl: Lore to system kontroli wersji o otwartym kodzie źródłowym, zaprojektowany z myślą o bezprecedensowej skalowalności danych i zespołów.
  pt: Lore é um sistema de controle de versão de código aberto projetado para escalabilidade incomparável de dados e equipes.
  ro: Lore este un sistem de control al versiunilor open source, proiectat pentru o scalabilitate fără precedent atât a datelor, cât și a echipelor.
  ru: Lore — это система контроля версий с открытым исходным кодом, созданная для беспрецедентной масштабируемости данных и команд.
  th: Lore คือระบบควบคุมเวอร์ชันโอเพนซอร์สที่ออกแบบมาเพื่อความสามารถในการขยายขนาดที่ไม่เคยมีมาก่อนทั้งข้อมูลและทีม
  tr: Lore, hem veri hem de ekipler için eşi görülmemiş ölçeklenebilirlik için tasarlanmış açık kaynaklı bir sürüm kontrol sistemidir.
  uk: Lore — це система контролю версій з відкритим кодом, створена для безпрецедентної масштабованості даних і команд.
  vi: Lore là hệ thống kiểm soát phiên bản mã nguồn mở, được thiết kế để đạt khả năng mở rộng chưa từng có cho cả dữ liệu lẫn đội ngũ.
x:
  source: https://github.com/epicgames/lore
  eget: epicgames/lore
rule:
  /eget:
    cmd: x eget epicgames/lore
    reference: https://github.com/epicgames/lore/releases
  darwin/curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/EpicGames/lore/main/scripts/install.sh | bash -s -- --demo
    reference: https://github.com/epicgames/lore
  linux/curl:
    cmd: curl -fsSL https://raw.githubusercontent.com/EpicGames/lore/main/scripts/install.sh | bash -s -- --demo
    reference: https://github.com/epicgames/lore
  win/powershell:
    cmd: x pwsh '$env:LORE_DEMO=1; irm https://raw.githubusercontent.com/EpicGames/lore/main/scripts/install.ps1 | iex'
    reference: https://github.com/epicgames/lore
binlist:
  - lore

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取 Lore 仓库与配置文件
          en: Reads Lore repository and config files
        sensitive: []
      write:
        desc:
          cn: 写入 Lore 仓库 working copy
          en: Writes Lore repository working copy
        sensitive: []
  platform:
    win: full
    linux: full
    darwin: full
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
