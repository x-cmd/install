lang: Python
homepage: https://www.mercurial-scm.org/repo/hg
desc:
  cn: Mercurial 是一款免费的分布式源代码控制管理工具
  en: Mercurial is a free, distributed source control management tool
rule:
  debian/apt:
    cmd: sudo apt-get install mercurial
    reference: https://mercurial-scm.org/downloads
    dsnap: mercurial
  ubuntu/apt:
    cmd: sudo apt-get install mercurial
    reference: https://mercurial-scm.org/downloads
    dsnap: mercurial
  fedora/dnf:
    cmd: sudo dnf install mercurial
    reference: https://mercurial-scm.org/downloads
    dsnap: mercurial
  gentoo/emerge:
    cmd: sudo emerge mercurial
    reference: https://mercurial-scm.org/downloads
  darwin/brew:
    cmd: sudo brew install mercurial
    reference: https://mercurial-scm.org/downloads
  freebsd/apt:
    cmd: 'cd /usr/ports/devel/mercurial && \

      make install

      '
    reference: https://mercurial-scm.org/downloads
  solaris/pkg:
    cmd: sudo pkg install SUNWmercurial
    reference: https://mercurial-scm.org/downloads
  /pip:
    cmd: pip install mercurial
    reference: https://pypi.org/project/mercurial/
    dsnap: mercurial
  arch/yay:
    cmd: yay -S mercurial-hg
    reference: https://aur.archlinux.org/packages/mercurial-hg

x:
  apt: mercurial
  apt-get: mercurial
  dnf: mercurial
  emerge: mercurial
  pkg: SUNWmercurial
  brew: mercurial
  yay: mercurial-hg
  pip: mercurial
  make: make
binlist:
- mercurial
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: gui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
