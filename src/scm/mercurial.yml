lang: Python
homepage: https://www.mercurial-scm.org/repo/hg
desc:
  cn: Mercurial 是一款免费的分布式源代码控制管理工具
  en: Mercurial is a free, distributed source control management tool
rule:
  debian/apt:
    cmd: sudo apt-get install mercurial
    reference: https://mercurial-scm.org/downloads
    dsnap: mercurial
  ubuntu/apt:
    cmd: sudo apt-get install mercurial
    reference: https://mercurial-scm.org/downloads
    dsnap: mercurial
  fedora/dnf:
    cmd: sudo dnf install mercurial
    reference: https://mercurial-scm.org/downloads
    dsnap: mercurial
  gentoo/emerge:
    cmd: sudo emerge mercurial
    reference: https://mercurial-scm.org/downloads
  darwin/brew:
    cmd: sudo brew install mercurial
    reference: https://mercurial-scm.org/downloads
  freebsd/apt:
    cmd: 'cd /usr/ports/devel/mercurial && \

      make install

      '
    reference: https://mercurial-scm.org/downloads
  solaris/pkg:
    cmd: sudo pkg install SUNWmercurial
    reference: https://mercurial-scm.org/downloads
  /pip:
    cmd: pip install mercurial
    reference: https://pypi.org/project/mercurial/
    dsnap: mercurial
  arch/yay:
    cmd: yay -S mercurial-hg
    reference: https://aur.archlinux.org/packages/mercurial-hg
binlist:
- mercurial
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: gui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
