lang: Go
homepage: https://github.com/itchyny/gojo
license: MIT
desc:
  cn: jo 的另一个 Go 实现
  en: Yet another Go implementation of jo
x:
  pkg:
    exist: true
  source: https://github.com/itchyny/gojo
  eget: https://github.com/itchyny/gojo
rule:
  /x:
    cmd: x pkg use gojo
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget itchyny/gojo
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install itchyny/tap/gojo
    reference: https://github.com/itchyny/gojo?tab=readme-ov-file#homebrew
  /go:
    cmd: go install github.com/itchyny/gojo/cmd/gojo@latest
    reference: https://github.com/itchyny/gojo?tab=readme-ov-file#build-from-source
    dsnap: github.com/itchyny/gojo/cmd/gojo@latest
binlist:
- gojo

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1001 KB
          rating: 1
          desc:
            cn: 安装 1001 KB
            en: 1001 KB install
        download:
          estimate: 1001 KB
          desc:
            cn: 约 1001 KB 下载 (linux/x64)
            en: ~1001 KB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
