lang: Go
homepage: https://github.com/itchyny/gojq
license: MIT
desc:
  cn: 纯用 Go 实现的 jq
  en: Pure Go implementation of jq
x:
  pkg:
    exist: true
  source: https://github.com/itchyny/gojq
  eget: https://github.com/itchyny/gojq
rule:
  /x:
    cmd: x pkg use gojq
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget itchyny/gojq
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install gojq
    reference: https://github.com/itchyny/gojq?tab=readme-ov-file#homebrew
  /0install:
    cmd: 0install add gojq https://apps.0install.net/utils/gojq.xml
    reference: https://github.com/itchyny/gojq?tab=readme-ov-file#zero-install
  /go:
    cmd: go install github.com/itchyny/gojq/cmd/gojq@latest
    reference: https://github.com/itchyny/gojq?tab=readme-ov-file#build-from-source
    dsnap: github.com/itchyny/gojq/cmd/gojq@latest
  /docker:
    cmd: docker run -i --rm ghcr.io/itchyny/gojq
    reference: https://github.com/itchyny/gojq?tab=readme-ov-file#docker
  arch/yay:
    cmd: yay -S gojq
    reference: https://aur.archlinux.org/packages/gojq
binlist:
- gojq

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
