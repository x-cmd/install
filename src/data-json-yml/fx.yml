lang: Go
homepage: https://github.com/antonmedv/fx
license: MIT
desc:
  cn: Fx 是为 JSON 量身定制的双重用途命令行工具，它提供了基于终端的 JSON 查看器和 JSON 处理实用程序
  en: Fx is a dual-purpose command-line tool tailored for JSON, providing both a terminal-based JSON viewer and a JSON processing utility
x:
  pkg:
    exist: true
  source: https://github.com/antonmedv/fx
  eget: https://github.com/antonmedv/fx
rule:
  /x:
    cmd: x pkg use fx
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget antonmedv/fx
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use fx
    reference: https://gitlab.com/wt0f/asdf-fx
  darwin/brew:
    cmd: brew install fx
    reference: https://fx.wtf/install
  /snap:
    cmd: snap install fx
    reference: https://fx.wtf/install
  (win|wsl2)/scoop:
    cmd: x scoop install fx
    reference: https://fx.wtf/install
  /pacman:
    cmd: sudo pacman -S fx
    reference: https://fx.wtf/install
  /pkg:
    cmd: pkg install fx
    reference: https://fx.wtf/install
  /go:
    cmd: go install github.com/antonmedv/fx@latest
    reference: https://fx.wtf/install
    dsnap: github.com/antonmedv/fx@latest
binlist:
- fx

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
