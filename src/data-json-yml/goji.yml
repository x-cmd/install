lang: 'Go'
homepage: 'https://github.com/muandane/goji'
license: 'Apache-2.0'
desc:
  cn: Go 编写的类 Commitizen Emoji 提交工具与 AI 提交信息生成器
  en: 'Commitizen-like Emoji Commit Tool written in Go and AI commit message generator (think cz-emoji and other commitizen adapters but in go) 🚀'
x:
  source: https://github.com/muandane/goji
  eget: https://github.com/muandane/goji
rule:
  /eget:
    cmd: x eget muandane/goji
    reference: https://github.com/muandane/goji
binlist:
  - 'goji'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 601 KB
          rating: 1
          desc:
            cn: 约 601 KB（估算）
            en: ~601 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
