lang: C
homepage: https://github.com/jqlang/jq
desc:
  cn: jq 是一个轻量级且灵活的命令行 JSON 处理器
  en: jq is a lightweight and flexible command-line JSON processor
x:
  pkg:
    exist: true
  source: https://github.com/jqlang/jq
  eget: https://github.com/jqlang/jq
rule:
  /x:
    cmd: x pkg use jq
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget jqlang/jq
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use jq
    reference: https://github.com/lsanwick/asdf-jq
  debian/apt:
    cmd: sudo apt-get install jq
    reference: https://command-not-found.com/jq
    dsnap: jq
  ubuntu/apt:
    cmd: sudo apt-get install jq
    reference: https://command-not-found.com/jq
    dsnap: jq
  alpine/apk:
    cmd: sudo apk add jq
    reference: https://command-not-found.com/jq
    dsnap: jq
  fedora/dnf:
    cmd: sudo dnf install jq
    reference: https://command-not-found.com/jq
    dsnap: jq
  arch/pacman:
    cmd: sudo pacman -S jq
    reference: https://command-not-found.com/jq
  darwin/brew:
    cmd: brew install jq
    reference: https://formulae.brew.sh/formula/jq#default
  kali/apt:
    cmd: sudo apt-get install jq
    reference: https://command-not-found.com/jq
    dsnap: jq
  raspbian/apt:
    cmd: sudo apt-get install jq
    reference: https://command-not-found.com/jq
binlist:
- jq
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
