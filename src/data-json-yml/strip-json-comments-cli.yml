lang: JavaScript
homepage: https://github.com/sindresorhus/strip-json-comments-cli
license: MIT
desc:
  cn: 从 JSON 中删除注释。允许您在 JSON 文件中使用注释
  en: Strip comments from JSON. Lets you use comments in your JSON files
x:
  pkg:
    exist: true
  source: https://github.com/sindresorhus/strip-json-comments-cli
rule:
  /x:
    cmd: x pkg use strip-json-comments-cli
    reference: https://x-cmd.com/install/
  /npm:
    cmd: npm install --global strip-json-comments-cli
    reference: https://github.com/sindresorhus/strip-json-comments-cli?tab=readme-ov-file#install
    dsnap: strip-json-comments-cli
binlist:
- strip-json-comments-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 1
          desc:
            cn: 安装 30 MB
            en: 30 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
