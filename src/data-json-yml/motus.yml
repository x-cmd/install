lang: 'Rust'
homepage: 'https://github.com/oleiade/motus'
license: 'AGPL-3.0'
desc:
  cn: 极简密码生成器
  en: 'A dead simple password generator'
x:
  source: https://github.com/oleiade/motus
  eget: https://github.com/oleiade/motus
rule:
  /eget:
    cmd: x eget oleiade/motus
    reference: https://github.com/oleiade/motus
binlist:
  - 'motus'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 55 KB
          rating: 1
          desc:
            cn: 约 55 KB（估算）
            en: ~55 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
