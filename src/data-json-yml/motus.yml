lang: 'Rust'
homepage: 'https://github.com/oleiade/motus'
license: 'AGPL-3.0'
desc:
  cn: 极简密码生成器
  en: 'A dead simple password generator'
  cs: Velmi jednoduchý generátor hesel
  de: Ein denkbar einfacher Passwortgenerator
  es: Un generador de contraseñas muy sencillo
  fr: Un générateur de mots de passe extrêmement simple
  id: Pembuat kata sandi yang sangat sederhana
  it: Un generatore di password semplicissimo
  ja: とても簡単なパスワード生成器
  ko: 아주 간단한 비밀번호 생성기
  pl: Zwykle prosty generator haseł
  pt: Um gerador de senhas bem simples
  ro: Un generator de parole extrem de simplu
  ru: Предельно простой генератор паролей
  th: เครื่องมือสร้างรหัสผ่านที่เรียบง่ายมาก
  tr: Oldukça basit bir parola üreticisi
  uk: Максимально простий генератор паролів
  vi: Trình tạo mật khẩu cực kỳ đơn giản
x:
  source: https://github.com/oleiade/motus
  eget: oleiade/motus
rule:
  /eget:
    cmd: x eget oleiade/motus
    reference: https://github.com/oleiade/motus
binlist:
- 'motus'

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 14 MB
          rating: 2
          desc:
            cn: 安装 14 MB
            en: 14 MB install
        download:
          estimate: 14 MB
          desc:
            cn: 约 14 MB 下载 (linux/x64)
            en: ~14 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
