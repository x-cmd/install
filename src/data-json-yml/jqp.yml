lang: Go
homepage: https://github.com/noahgorstein/jqp
license: MIT
desc:
  cn: 用于试验 jq 的 TUI
  en: a TUI playground for exploring jq
x:
  pkg:
    exist: true
  source: https://github.com/noahgorstein/jqp
  eget: https://github.com/noahgorstein/jqp
rule:
  /x:
    cmd: x pkg use jqp
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget noahgorstein/jqp
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use jqp
    reference: https://gitlab.com/wt0f/asdf-jqp
  darwin/brew:
    cmd: brew install noahgorstein/tap/jqp
    reference: https://github.com/noahgorstein/jqp?tab=readme-ov-file#installation
  darwin/port:
    cmd: sudo port install jqp
    reference: https://github.com/noahgorstein/jqp?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S jqp-bin
    reference: https://github.com/noahgorstein/jqp?tab=readme-ov-file#installation
binlist:
- jqp

# already profiled
footprint:
  behavior:
    runtime:
      type: tui
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 11 MB
          rating: 2
          desc:
            cn: 安装 11 MB
            en: 11 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 16 MB
        desc:
          cn: 16 MB
          en: 16 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
