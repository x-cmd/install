lang: Go
homepage: https://github.com/fiatjaf/jiq
license: MIT
desc:
  cn: 使用 jq 表达式的交互式 JSON 查询工具
  en: interactive JSON query tool using jq expressions
x:
  pkg:
    exist: true
  source: https://github.com/fiatjaf/jiq
  eget: https://github.com/fiatjaf/jiq
rule:
  /eget:
    cmd: x eget fiatjaf/jiq
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use jiq
    reference: https://x-cmd.com/install/
  /go:
    cmd: go install github.com/fiatjaf/jiq/cmd/jiq@latest
    reference: https://github.com/fiatjaf/jiq?tab=readme-ov-file#installation
    dsnap: github.com/fiatjaf/jiq/cmd/jiq@latest
  arch/yay:
    cmd: yay -S jiq-bin
    reference: https://aur.archlinux.org/packages/jiq-bin
binlist:
- jiq

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
