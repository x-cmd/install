lang: Go
homepage: https://github.com/fiatjaf/jiq
license: MIT
desc:
  cn: 使用 jq 表达式的交互式 JSON 查询工具
  en: interactive JSON query tool using jq expressions
x:
  source: https://github.com/fiatjaf/jiq
  eget: https://github.com/fiatjaf/jiq
  yay: jiq-bin
  go: github.com/fiatjaf/jiq/cmd/jiq@latest
rule:
  /eget:
    cmd: x eget fiatjaf/jiq
    reference: https://x-cmd.com/mod/eget
  /x:
    cmd: x pkg use jiq
    reference: https://x-cmd.com/install/
  /go:
    cmd: go install github.com/fiatjaf/jiq/cmd/jiq@latest
    reference: https://github.com/fiatjaf/jiq?tab=readme-ov-file#installation
    dsnap: github.com/fiatjaf/jiq/cmd/jiq@latest
  arch/yay:
    cmd: yay -S jiq-bin
    reference: https://aur.archlinux.org/packages/jiq-bin
binlist:
- jiq

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
