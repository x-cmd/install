lang: Rust
homepage: https://github.com/ynqa/jnv
license: MIT
desc:
  cn: jnv 专为浏览 JSON 而设计，提供了一个交互式的 JSON 查看器和 jq 过滤器编辑器
  en: jnv is designed for navigating JSON, offering an interactive JSON viewer and jq filter editor
x:
  source: https://github.com/ynqa/jnv
  eget: https://github.com/ynqa/jnv
rule:
  /eget:
    cmd: x eget ynqa/jnv
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install ynqa/tap/jnv
    reference: https://github.com/ynqa/jnv?tab=readme-ov-file#homebrew
  darwin/port:
    cmd: sudo port install jnv
    reference: https://github.com/ynqa/jnv?tab=readme-ov-file#macports
  /cargo:
    cmd: cargo install jnv
    reference: https://github.com/ynqa/jnv?tab=readme-ov-file#cargo
    dsnap: jnv
binlist:
- jnv

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
