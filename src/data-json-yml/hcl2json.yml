lang: Go
homepage: https://github.com/tmccombs/hcl2json
license: Apache-2.0
desc:
  cn: 将 hcl2 转换为 json
  en: Convert hcl2 to json
  cs: Převede hcl2 na json
  de: Konvertiert hcl2 in json
  es: Convierte hcl2 en json
  fr: Convertit hcl2 en json
  id: Mengubah hcl2 menjadi json
  it: Converte hcl2 in json
  ja: hcl2 を json に変換する
  ko: hcl2를 json으로 변환
  pl: Konwertuje hcl2 na json
  pt: Converte hcl2 em json
  ro: Convertește hcl2 în json
  ru: Конвертирует hcl2 в json
  th: แปลง hcl2 เป็น json
  tr: hcl2'yi json'a dönüştürür
  uk: Конвертує hcl2 у json
  vi: Chuyển đổi hcl2 thành json
x:
  source: https://github.com/tmccombs/hcl2json
  eget: tmccombs/hcl2json
  brew: hcl2json
  port: hcl2json
rule:
  /x:
    cmd: x pkg use hcl2json
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget tmccombs/hcl2json
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install hcl2json
    reference: https://github.com/tmccombs/hcl2json?tab=readme-ov-file#mac-os
  darwin/port:
    cmd: sudo port install hcl2json
    reference: https://github.com/tmccombs/hcl2json?tab=readme-ov-file#mac-os
binlist:
- hcl2json

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
