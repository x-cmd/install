lang: Go
homepage: https://github.com/tmccombs/hcl2json
license: Apache-2.0
desc:
  cn: 将 hcl2 转换为 json
  en: Convert hcl2 to json
x:
  pkg:
    exist: true
  source: https://github.com/tmccombs/hcl2json
  eget: https://github.com/tmccombs/hcl2json
rule:
  /x:
    cmd: x pkg use hcl2json
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget tmccombs/hcl2json
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install hcl2json
    reference: https://github.com/tmccombs/hcl2json?tab=readme-ov-file#mac-os
  darwin/port:
    cmd: sudo port install hcl2json
    reference: https://github.com/tmccombs/hcl2json?tab=readme-ov-file#mac-os
binlist:
- hcl2json

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
