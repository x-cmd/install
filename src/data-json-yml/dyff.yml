lang: Go
homepage: https://github.com/homeport/dyff
license: MIT
desc:
  cn: 用于 YAML 文件（有时也用于 JSON）的 diff 工具
  en: A diff tool for YAML files, and sometimes JSON
  cs: Nástroj pro diff souborů YAML a někdy i JSON.
  de: Ein Diff-Werkzeug für YAML-Dateien und manchmal auch JSON.
  es: Una herramienta de diff para archivos YAML y a veces también JSON.
  fr: Un outil de diff pour les fichiers YAML, et parfois aussi JSON.
  id: Alat diff untuk berkas YAML, dan kadang juga JSON.
  it: Uno strumento diff per file YAML e talvolta anche JSON.
  ja: YAML ファイル（および JSON）のための diff ツール。
  ko: YAML 파일, 그리고 때때로 JSON 파일을 위한 diff 도구입니다.
  pl: Narzędzie do porównywania plików YAML, a czasem także JSON.
  pt: Uma ferramenta de diff para arquivos YAML e às vezes JSON.
  ro: Un instrument de diff pentru fișiere YAML și uneori și JSON.
  ru: Инструмент сравнения файлов YAML, а иногда и JSON.
  th: เครื่องมือ diff สำหรับไฟล์ YAML และบางครั้งก็สำหรับ JSON
  tr: YAML dosyaları, bazen de JSON için bir diff aracı.
  uk: Інструмент порівняння файлів YAML, а іноді й JSON.
  vi: Công cụ diff cho các tệp YAML, và đôi khi cả JSON.
x:
  source: https://github.com/homeport/dyff
  eget: homeport/dyff
  brew: homeport/tap/dyff
  port: dyff
  yay: dyff
  go: github.com/homeport/dyff/cmd/dyff@latest
rule:
  /x:
    cmd: x pkg use dyff
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget homeport/dyff
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install homeport/tap/dyff
    reference: https://github.com/homeport/dyff?tab=readme-ov-file#homebrew
  /port:
    cmd: sudo port install dyff
    reference: https://github.com/homeport/dyff?tab=readme-ov-file#macports
  /curl:
    cmd: curl --silent --location https://git.io/JYfAY | bash
    reference: https://github.com/homeport/dyff?tab=readme-ov-file#curl-to-shell-convenience-script
  /go:
    cmd: go install github.com/homeport/dyff/cmd/dyff@latest
    reference: https://github.com/homeport/dyff?tab=readme-ov-file#build-from-source
    dsnap: dyff
  arch/yay:
    cmd: yay -S dyff
    reference: https://aur.archlinux.org/packages/dyff
binlist:
- dyff

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
