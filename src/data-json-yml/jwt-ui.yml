lang: Rust
homepage: https://github.com/jwt-rs/jwt-ui
license: MIT
desc:
  en: A Terminal UI for decoding/encoding JSON Web Tokens
  cn: 用于解码/编码 JSON Web Token 的终端用户界面
x:
  source: https://github.com/jwt-rs/jwt-ui
  eget: jwt-rs/jwt-ui
  brew: jwt-rs/jwt-ui/jwt-ui
  pacman: jwt-ui
  scoop: jwt-ui
  cargo: jwt-ui
rule:
  /eget:
    cmd: x eget jwt-rs/jwt-ui
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap jwt-rs/jwt-ui

      brew install jwt-ui

      '
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add jwt-ui-bucket https://github.com/jwt-rs/scoop-jwt-ui

      x scoop install jwt-ui

      '
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install jwt-ui --locked
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
    dsnap: jwt-ui
  arch/pacman:
    cmd: pacman -S jwt-ui
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
  /curl:
    cmd: curl https://raw.githubusercontent.com/jwt-rs/jwt-ui/main/deployment/getLatest.sh | bash
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
binlist:
- jwt-ui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/arm64)
            en: ~1 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
