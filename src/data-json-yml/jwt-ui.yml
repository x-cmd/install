lang: Rust
homepage: https://github.com/jwt-rs/jwt-ui
license: MIT
desc:
  en: A Terminal UI for decoding/encoding JSON Web Tokens
  cn: 用于解码/编码 JSON Web Token 的终端用户界面
  cs: Terminalové rozhraní pro kódování a dekódování JSON Web Tokenů
  de: Eine Terminal-Benutzeroberfläche zum Dekodieren und Kodieren von JSON Web Tokens
  es: Una interfaz de usuario de terminal para decodificar y codificar JSON Web Tokens
  fr: Une interface utilisateur terminal pour décoder et encoder les JSON Web Tokens
  id: Antarmuka pengguna terminal untuk mendekode dan mengodekan JSON Web Token
  it: Un'interfaccia utente da terminale per decodificare e codificare i JSON Web Token
  ja: JSON Web Token をデコード/エンコードするためのターミナル UI
  ko: JSON Web Token을 디코딩/인코딩하기 위한 터미널 UI
  pl: Terminalowy interfejs użytkownika do dekodowania i kodowania tokenów JSON Web Token
  pt: Uma interface de usuário de terminal para decodificar e codificar JSON Web Tokens
  ro: O interfață de utilizator în terminal pentru decodificarea și codificarea JSON Web Token
  ru: Терминальный интерфейс для декодирования и кодирования JSON Web Token
  th: ส่วนติดต่อผู้ใช้แบบเทอร์มินัลสำหรับการถอดรหัสและเข้ารหัส JSON Web Token
  tr: JSON Web Token'larını çözmek ve kodlamak için bir terminal kullanıcı arayüzü
  uk: Термінальний інтерфейс користувача для декодування та кодування JSON Web Token
  vi: Giao diện người dùng trên terminal để giải mã và mã hóa JSON Web Token
x:
  source: https://github.com/jwt-rs/jwt-ui
  eget: jwt-rs/jwt-ui
  brew: jwt-rs/jwt-ui/jwt-ui
  pacman: jwt-ui
  scoop: jwt-ui
  cargo: jwt-ui
rule:
  /eget:
    cmd: x eget jwt-rs/jwt-ui
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap jwt-rs/jwt-ui

      brew install jwt-ui

      '
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
  (win|wsl2)/scoop:
    cmd: 'x scoop bucket add jwt-ui-bucket https://github.com/jwt-rs/scoop-jwt-ui

      x scoop install jwt-ui

      '
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
  /cargo:
    cmd: cargo install jwt-ui --locked
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
    dsnap: jwt-ui
  arch/pacman:
    cmd: pacman -S jwt-ui
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
  /curl:
    cmd: curl https://raw.githubusercontent.com/jwt-rs/jwt-ui/main/deployment/getLatest.sh | bash
    reference: https://github.com/jwt-rs/jwt-ui?tab=readme-ov-file#installation
binlist:
- jwt-ui

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/arm64)
            en: ~1 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
