lang: Go
homepage: https://github.com/JFryy/qq
license: MIT
desc:
  cn: jq，但具有许多互操作配置格式转换和交互式查询。
  en: jq, but with many interoperable configuration format transcodings and interactive querying.
  cs: jq, ale s mnoha interoperabilními převody konfiguračních formátů a interaktivním dotazováním.
  de: jq, aber mit vielen interoperablen Konfigurationsformat-Umwandlungen und interaktiven Abfragen.
  es: jq, pero con muchas transcodificaciones interoperables de formatos de configuración y consultas interactivas.
  fr: jq, mais avec de nombreuses transcodifications de formats de configuration interopérables et des requêtes interactives.
  id: jq, tetapi dengan banyak transcoding format konfigurasi yang interoperabel dan kueri interaktif.
  it: jq, ma con molte transcodifiche interoperabili di formati di configurazione e query interattive.
  ja: jq ですが、相互運用可能な設定形式の変換と対話的クエリを多数備えています。
  ko: jq이지만, 상호 운용 가능한 설정 형식 transcoding과 대화형 쿼리를 많이 제공합니다.
  pl: jq, ale z wieloma interoperacyjnymi konwersjami formatów konfiguracji i interaktywnymi zapytaniami.
  pt: jq, mas com muitas transcodificações interoperáveis de formatos de configuração e consultas interativas.
  ro: jq, dar cu multe transcodificări interoperabile ale formatelor de configurație și interogări interactive.
  ru: jq, но с множеством совместимых преобразований форматов конфигурации и интерактивными запросами.
  th: jq แต่มีการแปลงรูปแบบการตั้งค่าที่ทำงานร่วมกันได้หลายแบบและการสืบค้นแบบโต้ตอบ
  tr: jq, ancak çok sayıda birliktelik uyumlu yapılandırma biçimi dönüşümü ve etkileşimli sorgulama içerir.
  uk: jq, але з багатьма сумісними перетвореннями форматів конфігурації та інтерактивними запитами.
  vi: jq, nhưng có nhiều khả năng chuyển đổi định dạng cấu hình tương thích và truy vấn tương tác.
x:
  source: https://github.com/JFryy/qq
  eget: JFryy/qq
  brew: jfryy/tap/qq
  go: github.com/JFryy/qq/cli@latest
rule:
  /eget:
    cmd: x eget JFryy/qq
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay qq-git
    reference: https://github.com/JFryy/qq/?tab=readme-ov-file#installation
  /brew:
    cmd: brew install jfryy/tap/qq
    reference: https://github.com/JFryy/qq/?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/JFryy/qq/cli@latest
    reference: https://github.com/JFryy/qq/?tab=readme-ov-file#installation
    dsnap: qq/cli
binlist:
- qq

# complicated
footprint:
  behavior:
    runtime:
      type: interactive
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 25 MB
          rating: 2
          desc:
            cn: 安装 25 MB
            en: 25 MB install
        download:
          estimate: 25 MB
          desc:
            cn: 约 25 MB 下载 (linux/x64)
            en: ~25 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
