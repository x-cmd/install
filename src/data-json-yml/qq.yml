lang: Go
homepage: https://github.com/JFryy/qq
license: MIT
desc:
  cn: jq，但具有许多互操作配置格式转换和交互式查询。
  en: jq, but with many interoperable configuration format transcodings and interactive querying.
x:
  source: https://github.com/JFryy/qq
  eget: https://github.com/JFryy/qq
rule:
  /eget:
    cmd: x eget JFryy/qq
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay qq-git
    reference: https://github.com/JFryy/qq/?tab=readme-ov-file#installation
  /brew:
    cmd: brew install jfryy/tap/qq
    reference: https://github.com/JFryy/qq/?tab=readme-ov-file#installation
  /go:
    cmd: go install github.com/JFryy/qq/cli@latest
    reference: https://github.com/JFryy/qq/?tab=readme-ov-file#installation
    dsnap: qq/cli
binlist:
- qq

footprint:
  behavior:
    runtime:
      type: interactive
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
