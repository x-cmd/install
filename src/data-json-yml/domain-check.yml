lang: Rust
homepage: https://github.com/saidutt46/domain-check
desc:
  cn: 支持 1200+ TLD 的通用域名可用性查询器，含 RDAP/WHOIS 回退及 MCP 服务
  en: Fast, universal domain availability checker - 1,200+ TLDs, pattern generation, RDAP with WHOIS fallback. CLI + Rust library + MCP server for AI agents.
x:
  source: https://github.com/saidutt46/domain-check
  eget: https://github.com/saidutt46/domain-check
rule:
  /cargo:
    cmd: cargo install domain-check
    reference: https://github.com/saidutt46/domain-check
  /eget:
    cmd: x eget saidutt46/domain-check
    reference: https://github.com/saidutt46/domain-check
binlist:
- domain-check
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: daemon
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 431 KB
          rating: 1
          desc:
            cn: 约 431 KB（估算）
            en: ~431 KB estimated
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
