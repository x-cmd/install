lang: Python
homepage: https://github.com/adbar/trafilatura
license: Apache-2.0
desc:
  cn: 将 json 数据格式化表格进行查看
  en: Format json into table view
  cs: Formátuje json do tabulkového zobrazení
  de: Formatiert JSON als Tabellenansicht
  es: Formatea json en una vista de tabla
  fr: Formate le json en vue tableau
  id: Memformat json menjadi tampilan tabel
  it: Formatta json in una vista tabellare
  ja: jsonをテーブル表示に整形します
  ko: json을 테이블 보기로 변환합니다
  pl: Formatuje json do widoku tabeli
  pt: Formata json em uma visualização de tabela
  ro: Formatează json într-o vedere de tabel
  ru: Форматирует json в табличное представление
  th: จัดรูปแบบ json เป็นมุมมองแบบตาราง
  tr: json verisini tablo görünümüne biçimlendirir
  uk: Форматує json у вигляді таблиці
  vi: Định dạng json thành chế độ xem bảng
x:
  source: https://github.com/adbar/trafilatura
  brew: uzimaru0000/tap/tv
  cargo: tv-cli
rule:
  /cargo:
    cmd: cargo install tv-cli
    reference: https://github.com/uzimaru0000/tv?tab=readme-ov-file#use-cargo
    dsnap: tv-cli
  darwin/brew:
    cmd: brew install uzimaru0000/tap/tv
    reference: https://github.com/uzimaru0000/tv?tab=readme-ov-file#for-macos
binlist:
- tv-cli

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
