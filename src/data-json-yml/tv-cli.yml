lang: Python
homepage: https://github.com/adbar/trafilatura
license: Apache-2.0
desc:
  cn: 将 json 数据格式化表格进行查看
  en: Format json into table view
x:
  source: https://github.com/adbar/trafilatura
rule:
  /cargo:
    cmd: cargo install tv-cli
    reference: https://github.com/uzimaru0000/tv?tab=readme-ov-file#use-cargo
    dsnap: tv-cli
  darwin/brew:
    cmd: brew install uzimaru0000/tap/tv
    reference: https://github.com/uzimaru0000/tv?tab=readme-ov-file#for-macos
binlist:
- tv-cli

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
