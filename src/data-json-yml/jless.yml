lang: Rust
homepage: https://github.com/PaulJuliusMartinez/jless
license: MIT
desc:
  cn: Jless 是一个命令行 JSON 查看器，用于读取、探索和搜索 JSON 数据
  en: jless is a command-line JSON viewer designed for reading, exploring, and searching through JSON data
  cs: jless je prohlížeč JSON pro příkazovou řádku navržený ke čtení, průzkumu a vyhledávání v datech JSON
  de: jless ist ein JSON-Viewer für die Kommandozeile, der zum Lesen, Erkunden und Durchsuchen von JSON-Daten entwickelt wurde
  es: jless es un visor de JSON de línea de comandos diseñado para leer, explorar y buscar en datos JSON
  fr: jless est une visionneuse JSON en ligne de commande conçue pour lire, explorer et parcourir des données JSON
  id: jless adalah penampil JSON untuk baris perintah yang dirancang untuk membaca, menjelajahi, dan mencari data JSON
  it: jless è un visualizzatore JSON da riga di comando progettato per leggere, esplorare e cercare nei dati JSON
  ja: jless は、JSON データの読み取り・探索・検索のために設計されたコマンドライン JSON ビューアです
  ko: jless는 JSON 데이터를 읽고, 탐색하고, 검색하기 위해 설계된 명령줄 JSON 뷰어입니다
  pl: jless to przeglądarka JSON dla wiersza poleceń, zaprojektowana do czytania, eksploracji i przeszukiwania danych JSON
  pt: jless é um visualizador de JSON de linha de comando projetado para ler, explorar e pesquisar dados JSON
  ro: jless este un vizualizator JSON pentru linia de comandă, conceput pentru citirea, explorarea și căutarea în datele JSON
  ru: jless — это просмотрщик JSON для командной строки, созданный для чтения, исследования и поиска по данным JSON
  th: jless เป็น JSON viewer สำหรับบรรทัดคำสั่ง ที่ออกแบบมาเพื่ออ่าน สำรวจ และค้นหาข้อมูล JSON
  tr: jless, JSON verilerini okumak, keşfetmek ve aramak için tasarlanmış komut satırı JSON görüntüleyicisidir
  uk: jless — це переглядач JSON для командного рядка, створений для читання, дослідження та пошуку даних JSON
  vi: jless là trình xem JSON dòng lệnh được thiết kế để đọc, khám phá và tìm kiếm trong dữ liệu JSON
x:
  source: https://github.com/PaulJuliusMartinez/jless
  eget: PaulJuliusMartinez/jless
  brew: jless
  pacman: jless
  port: jless
  xbps: jless
  cargo: jless
  asdf: jless
rule:
  /x:
    cmd: x pkg use jless
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget PaulJuliusMartinez/jless
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use jless
    reference: https://github.com/jc00ke/asdf-jless
  darwin/brew:
    cmd: brew install jless
    reference: https://formulae.brew.sh/formula/jless
  darwin/port:
    cmd: sudo port install jless
    reference: https://ports.macports.org/port/jless/
  arch/pacman:
    cmd: sudo pacman -S jless
    reference: https://jless.io/
  void/xbps:
    cmd: sudo xbps-install jless
    reference: https://jless.io/
  netbsd/pkgin:
    cmd: pkgin install jless
    reference: https://pkgsrc.se/textproc/jless/
  freebsd/pkg:
    cmd: pkg install jless
    reference: https://jless.io/
  /cargo:
    cmd: cargo install jless
    reference: https://jless.io/
    dsnap: jless
binlist:
- jless

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
