lang: Rust
homepage: https://github.com/PaulJuliusMartinez/jless
license: MIT
desc:
  cn: Jless 是一个命令行 JSON 查看器，用于读取、探索和搜索 JSON 数据
  en: jless is a command-line JSON viewer designed for reading, exploring, and searching through JSON data
x:
  pkg:
    exist: true
  source: https://github.com/PaulJuliusMartinez/jless
  eget: https://github.com/PaulJuliusMartinez/jless
rule:
  /x:
    cmd: x pkg use jless
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget PaulJuliusMartinez/jless
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use jless
    reference: https://github.com/jc00ke/asdf-jless
  darwin/brew:
    cmd: brew install jless
    reference: https://formulae.brew.sh/formula/jless
  darwin/port:
    cmd: sudo port install jless
    reference: https://ports.macports.org/port/jless/
  arch/pacman:
    cmd: sudo pacman -S jless
    reference: https://jless.io/
  void/xbps:
    cmd: sudo xbps-install jless
    reference: https://jless.io/
  netbsd/pkgin:
    cmd: pkgin install jless
    reference: https://pkgsrc.se/textproc/jless/
  freebsd/pkg:
    cmd: pkg install jless
    reference: https://jless.io/
  /cargo:
    cmd: cargo install jless
    reference: https://jless.io/
    dsnap: jless
binlist:
- jless

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
        download:
          estimate: 1 MB
          desc:
            cn: 约 1 MB 下载 (linux/x64)
            en: ~1 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
