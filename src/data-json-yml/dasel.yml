lang: Go
homepage: https://github.com/tomwright/dasel
license: MIT
desc:
  cn: 使用单个工具从 JSON、TOML、YAML、XML 和 CSV 文件中选择、放置和删除数据。支持格式之间的转换，可以作为 Go 包使用。
  en: Select, put and delete data from JSON, TOML, YAML, XML and CSV files with a single tool. Supports conversion between formats and can be used as a Go package.
x:
  pkg:
    exist: true
  source: https://github.com/tomwright/dasel
  eget: https://github.com/tomwright/dasel
rule:
  /x:
    cmd: x pkg use dasel
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget tomwright/dasel
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use dasel
    reference: https://github.com/asdf-community/asdf-dasel
  darwin/brew:
    cmd: brew install dasel
    reference: https://formulae.brew.sh/formula/dasel#default
  arch/yay:
    cmd: yay -S dasel
    reference: https://aur.archlinux.org/packages/dasel
binlist:
- dasel
