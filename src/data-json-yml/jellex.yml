lang: Python
homepage: https://github.com/kellyjonbrazil/jellex
license: MIT
desc:
  cn: 一个使用 Python 语法过滤 JSON 和 JSON Lines 数据的 TUI
  en: A TUI to filter JSON and JSON Lines data with Python syntax.
  cs: TUI pro filtrování dat JSON a JSON Lines pomocí syntaxe Python.
  de: Eine TUI zum Filtern von JSON- und JSON-Lines-Daten mit Python-Syntax.
  es: Una TUI para filtrar datos JSON y JSON Lines con sintaxis de Python.
  fr: Une TUI pour filtrer des données JSON et JSON Lines avec une syntaxe Python.
  id: TUI untuk memfilter data JSON dan JSON Lines dengan sintaks Python.
  it: Una TUI per filtrare dati JSON e JSON Lines con sintassi Python.
  ja: Python 構文で JSON と JSON Lines データをフィルタリングする TUI です。
  ko: Python 구문으로 JSON 및 JSON Lines 데이터를 필터링하는 TUI
  pl: TUI do filtrowania danych JSON i JSON Lines za pomocą składni Pythona.
  pt: Uma TUI para filtrar dados JSON e JSON Lines com sintaxe Python.
  ro: O interfață TUI pentru filtrarea datelor JSON și JSON Lines cu sintaxă Python.
  ru: TUI для фильтрации данных JSON и JSON Lines с использованием синтаксиса Python.
  th: TUI สำหรับกรองข้อมูล JSON และ JSON Lines ด้วยไวยากรณ์ Python
  tr: JSON ve JSON Lines verilerini Python sözdizimiyle filtrelemek için bir TUI.
  uk: TUI для фільтрації даних JSON і JSON Lines із синтаксисом Python.
  vi: Một TUI để lọc dữ liệu JSON và JSON Lines bằng cú pháp Python.
x:
  source: https://github.com/kellyjonbrazil/jellex
  yay: jellex
  pip: jellex
rule:
  /pip:
    cmd: pip install jellex
    reference: https://github.com/kellyjonbrazil/jellex?tab=readme-ov-file#install
    dsnap: jellex
  arch/yay:
    cmd: yay -S jellex
    reference: https://aur.archlinux.org/packages/jellex
binlist:
- jellex

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
