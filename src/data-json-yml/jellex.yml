lang: Python
homepage: https://github.com/kellyjonbrazil/jellex
license: MIT
desc:
  cn: 一个使用 Python 语法过滤 JSON 和 JSON Lines 数据的 TUI
  en: A TUI to filter JSON and JSON Lines data with Python syntax.
x:
  source: https://github.com/kellyjonbrazil/jellex
rule:
  /pip:
    cmd: pip install jellex
    reference: https://github.com/kellyjonbrazil/jellex?tab=readme-ov-file#install
    dsnap: jellex
  arch/yay:
    cmd: yay -S jellex
    reference: https://aur.archlinux.org/packages/jellex
binlist:
- jellex

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 80 MB
        desc:
          cn: 80 MB
          en: 80 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
