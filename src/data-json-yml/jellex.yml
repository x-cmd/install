lang: Python
homepage: https://github.com/kellyjonbrazil/jellex
license: MIT
desc:
  cn: 一个使用 Python 语法过滤 JSON 和 JSON Lines 数据的 TUI
  en: A TUI to filter JSON and JSON Lines data with Python syntax.
x:
  source: https://github.com/kellyjonbrazil/jellex
rule:
  /pip:
    cmd: pip install jellex
    reference: https://github.com/kellyjonbrazil/jellex?tab=readme-ov-file#install
    dsnap: jellex
  arch/yay:
    cmd: yay -S jellex
    reference: https://aur.archlinux.org/packages/jellex
binlist:
- jellex

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
