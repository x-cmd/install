lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: D2Coding 字体
  en: D2Coding font
  cs: D2Coding písmo
  de: D2Coding Schrift
  es: Fuente D2Coding
  fr: Police D2Coding
  id: Font D2Coding
  it: Carattere D2Coding
  ja: D2Coding フォント
  ko: D2Coding 폰트
  pl: Czcionka D2Coding
  pt: Fonte D2Coding
  ro: Fontul D2Coding
  ru: Шрифт D2Coding
  th: ฟอนต์ D2Coding
  tr: D2Coding yazı tipi
  uk: Шрифт D2Coding
  vi: Phông chữ D2Coding
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install D2Coding
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/D2Coding.zip -OutFile D2Coding.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/D2Coding.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/D2Coding.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- D2Coding-Nerd-Font
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: partial
    linux: full
    darwin: partial
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
