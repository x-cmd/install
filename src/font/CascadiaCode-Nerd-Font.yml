lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: CascadiaCode 字体
  en: CascadiaCode font
  cs: CascadiaCode písmo
  de: CascadiaCode Schrift
  es: Fuente CascadiaCode
  fr: Police CascadiaCode
  id: Font CascadiaCode
  it: Carattere CascadiaCode
  ja: CascadiaCode フォント
  ko: CascadiaCode 폰트
  pl: Czcionka CascadiaCode
  pt: Fonte CascadiaCode
  ro: Fontul CascadiaCode
  ru: Шрифт CascadiaCode
  th: ฟอนต์ CascadiaCode
  tr: CascadiaCode yazı tipi
  uk: Шрифт CascadiaCode
  vi: Phông chữ CascadiaCode
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install CascadiaCode
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/CascadiaCode.zip -OutFile CascadiaCode.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/CascadiaCode.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/CascadiaCode.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- CascadiaCode-Nerd-Font
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: partial
    linux: full
    darwin: partial
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
