lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: 0xProto 字体
  en: 0xProto font
  cs: Font 0xProto
  de: 0xProto-Schriftart
  es: Fuente 0xProto
  fr: Police 0xProto
  id: Font 0xProto
  it: Carattere 0xProto
  ja: 0xProto フォント
  ko: 0xProto 글꼴
  pl: Czcionka 0xProto
  pt: Fonte 0xProto
  ro: Fontul 0xProto
  ru: Шрифт 0xProto
  th: ฟอนต์ 0xProto
  tr: 0xProto yazı tipi
  uk: Шрифт 0xProto
  vi: Phông chữ 0xProto
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install 0xProto
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/0xProto.zip -OutFile 0xProto.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/0xProto.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/0xProto.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- 0xProto-Nerd-Font
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: partial
    linux: full
    darwin: partial
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
