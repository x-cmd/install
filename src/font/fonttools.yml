lang: Python
homepage: https://github.com/fonttools/fonttools
license: MIT
desc:
  cn: fontTools 是用 Python 编写的操纵字体的库
  en: fontTools is a library for manipulating fonts, written in Python
x:
  source: https://github.com/fonttools/fonttools
rule:
  /pip:
    cmd: pip install fonttools
    reference: https://github.com/fonttools/fonttools?tab=readme-ov-file#installation
    dsnap: fonttools
  darwin/brew:
    cmd: brew install fonttools
    reference: https://formulae.brew.sh/formula/fonttools#default
binlist:
- fonttools

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 351 KB
          rating: 1
          desc:
            cn: 约 351 KB（估算）
            en: ~351 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
