lang: C
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: Fontforge 是 Windows 的免费（Libre）字体编辑器，Mac OS X 和 GNU+Linux
  en: FontForge is a free (libre) font editor for Windows, Mac OS X and GNU+Linux
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  darwin/brew:
    cmd: brew install fontforge
    reference: https://github.com/ryanoasis/nerd-fonts?tab=readme-ov-file#font-patcher
binlist:
- font-patcher
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 5.0 MB
          rating: 1
          desc:
            cn: 约 5.0 MB（估算）
            en: ~5.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
