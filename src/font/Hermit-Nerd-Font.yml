lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: Hermit 字体
  en: Hermit font
  cs: Písmo Hermit
  de: Schriftart Hermit
  es: Fuente Hermit
  fr: Police Hermit
  id: Font Hermit
  it: Carattere Hermit
  ja: Hermit フォント
  ko: Hermit 폰트
  pl: Czcionka Hermit
  pt: Fonte Hermit
  ro: Fontul Hermit
  ru: Шрифт Hermit
  th: ฟอนต์ Hermit
  tr: Hermit yazı tipi
  uk: Шрифт Hermit
  vi: Phông chữ Hermit
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install Hermit
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Hermit.zip -OutFile Hermit.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Hermit.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Hermit.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- Hermit-Nerd-Font
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: partial
    linux: full
    darwin: partial
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
