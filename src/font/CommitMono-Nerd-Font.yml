lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: CommitMono 字体
  en: CommitMono font
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install CommitMono
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/CommitMono.zip -OutFile CommitMono.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/CommitMono.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/CommitMono.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- CommitMono-Nerd-Font
license: NOASSERTION
