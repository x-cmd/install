lang: Shell
homepage: https://github.com/alexmyczko/fnt
desc:
  en: apt for fonts, the missing font manager for macOS/linux
  cn: 适用于字体的缺失字体管理器，适用于 macOS 和 Linux
x:
  source: https://github.com/alexmyczko/fnt
rule:
  darwin/brew:
    cmd: brew install fnt
    reference: https://repology.org/project/fnt/versions
  arch/pacman:
    cmd: pacman -S fnt
    reference: https://repology.org/project/fnt/versions
  ubuntu/apt:
    cmd: apt install fnt
    reference: https://repology.org/project/fnt/versions
    dsnap: fnt
  debian/apt:
    cmd: apt install fnt
    reference: https://repology.org/project/fnt/versions
    dsnap: fnt
binlist:
- fnt
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 MB
          rating: 1
          desc:
            cn: 安装 1 MB
            en: 1 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
