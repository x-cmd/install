lang: Shell
homepage: https://github.com/alexmyczko/fnt
desc:
  en: apt for fonts, the missing font manager for macOS/linux
  cn: 适用于字体的缺失字体管理器，适用于 macOS 和 Linux
x:
  source: https://github.com/alexmyczko/fnt
rule:
  darwin/brew:
    cmd: brew install fnt
    reference: https://repology.org/project/fnt/versions
  arch/pacman:
    cmd: pacman -S fnt
    reference: https://repology.org/project/fnt/versions
  ubuntu/apt:
    cmd: apt install fnt
    reference: https://repology.org/project/fnt/versions
    dsnap: fnt
  debian/apt:
    cmd: apt install fnt
    reference: https://repology.org/project/fnt/versions
    dsnap: fnt
binlist:
- fnt
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
