lang: Python
homepage: https://github.com/IdreesInc/Monocraft
license: OFL-1.1
desc:
  cn: Monocraft 是一款专为太喜欢 Minecraft 的开发者设计的字体
  en: Monocraft is a font for developers who like Minecraft a little too much
  cs: Monocraft je písmo pro vývojáře, kteří mají Minecraftu až moc rádi
  de: Monocraft ist eine Schrift für Entwickler, die Minecraft ein bisschen zu mögen lieben
  es: Monocraft es una fuente para desarrolladores a los que les gusta Minecraft un poco demasiado
  fr: Monocraft est une police pour les développeurs qui aiment un peu trop Minecraft
  id: Monocraft adalah font untuk pengembang yang menyukai Minecraft sedikit berlebihan
  it: Monocraft è un carattere per sviluppatori che amano Minecraft un po' troppo
  ja: Monocraft は Minecraft が少し好きすぎる開発者向けのフォントです
  ko: Monocraft는 Minecraft를 너무 좋아하는 개발자를 위한 폰트입니다
  pl: Monocraft to czcionka dla deweloperów, którzy uwielbiają Minecraft trochę za bardzo
  pt: Monocraft é uma fonte para desenvolvedores que gostam de Minecraft um pouco demais
  ro: Monocraft este un font pentru dezvoltatori care iubesc Minecraft puțin cam prea mult
  ru: Monocraft — это шрифт для разработчиков, которые слишком уж любят Minecraft
  th: Monocraft เป็นฟอนต์สำหรับนักพัฒนาที่ชอบ Minecraft มากเป็นพิเศษ
  tr: Monocraft, Minecraft'i fazla seven geliştiriciler için bir yazı tipidir
  uk: Monocraft — це шрифт для розробників, які надто вже люблять Minecraft
  vi: Monocraft là phông chữ dành cho các nhà phát triển yêu Minecraft hơi quá mức
x:
  source: https://github.com/IdreesInc/Monocraft
  eget: IdreesInc/Monocraft
  brew: homebrew/cask-fonts/--cask
rule:
  /eget:
    cmd: x eget IdreesInc/Monocraft
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: 'brew tap homebrew/cask-fonts \

      && brew install --cask font-monocraft

      '
    reference: https://github.com/IdreesInc/Monocraft?tab=readme-ov-file#mac
  /curl:
    cmd: curl -OL https://github.com/IdreesInc/Monocraft/releases/download/v3.0/Monocraft.ttf
    reference: https://github.com/IdreesInc/Monocraft?tab=readme-ov-file#linux
  /wget:
    cmd: wget https://github.com/IdreesInc/Monocraft/releases/download/v3.0/Monocraft.ttf
    reference: https://github.com/IdreesInc/Monocraft?tab=readme-ov-file#linux
binlist:
- Monocraft-Nerd-Font

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
