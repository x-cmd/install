lang: Python
homepage: https://github.com/IdreesInc/Monocraft
license: OFL-1.1
desc:
  cn: Monocraft 是一款专为太喜欢 Minecraft 的开发者设计的字体
  en: Monocraft is a font for developers who like Minecraft a little too much
x:
  source: https://github.com/IdreesInc/Monocraft
  eget: https://github.com/IdreesInc/Monocraft
rule:
  /eget:
    cmd: x eget IdreesInc/Monocraft
    reference: https://x-cmd.com/mod/eget
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/IdreesInc/Monocraft/releases/download/v3.0/Monocraft.ttf -OutFile Monocraft.ttf
    reference: https://github.com/IdreesInc/Monocraft?tab=readme-ov-file#windows
  darwin/brew:
    cmd: 'brew tap homebrew/cask-fonts \

      && brew install --cask font-monocraft

      '
    reference: https://github.com/IdreesInc/Monocraft?tab=readme-ov-file#mac
  /curl:
    cmd: curl -OL https://github.com/IdreesInc/Monocraft/releases/download/v3.0/Monocraft.ttf
    reference: https://github.com/IdreesInc/Monocraft?tab=readme-ov-file#linux
  /wget:
    cmd: wget https://github.com/IdreesInc/Monocraft/releases/download/v3.0/Monocraft.ttf
    reference: https://github.com/IdreesInc/Monocraft?tab=readme-ov-file#linux
binlist:
- Monocraft-Nerd-Font

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
