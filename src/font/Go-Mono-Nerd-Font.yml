lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: Go-Mono 字体
  en: Go-Mono font
  cs: Písmo Go-Mono
  de: Schriftart Go-Mono
  es: Fuente Go-Mono
  fr: Police Go-Mono
  id: Font Go-Mono
  it: Carattere Go-Mono
  ja: Go-Mono フォント
  ko: Go-Mono 폰트
  pl: Czcionka Go-Mono
  pt: Fonte Go-Mono
  ro: Fontul Go-Mono
  ru: Шрифт Go-Mono
  th: ฟอนต์ Go-Mono
  tr: Go-Mono yazı tipi
  uk: Шрифт Go-Mono
  vi: Phông chữ Go-Mono
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install Go-Mono
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Go-Mono.zip -OutFile Go-Mono.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Go-Mono.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Go-Mono.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- Go-Mono-Nerd-Font
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: partial
    linux: full
    darwin: partial
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
