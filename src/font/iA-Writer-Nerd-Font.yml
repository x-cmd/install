lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: iA-Writer 字体
  en: iA-Writer font
  cs: Písmo iA-Writer
  de: iA-Writer-Schriftart
  es: Fuente iA-Writer
  fr: Police iA-Writer
  id: Font iA-Writer
  it: Carattere iA-Writer
  ja: iA-Writer フォント
  ko: iA-Writer 폰트
  pl: Czcionka iA-Writer
  pt: Fonte iA-Writer
  ro: Fontul iA-Writer
  ru: Шрифт iA-Writer
  th: ฟอนต์ iA-Writer
  tr: iA-Writer yazı tipi
  uk: Шрифт iA-Writer
  vi: Phông chữ iA-Writer
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install iA-Writer
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/iA-Writer.zip -OutFile 32iA-Writer70.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/iA-Writer.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/iA-Writer.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- iA-Writer-Nerd-Font
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: partial
    linux: full
    darwin: partial
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
