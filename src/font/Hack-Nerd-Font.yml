lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: Hack 字体
  en: Hack font
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install Hack
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Hack.zip -OutFile Hack.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Hack.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Hack.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- Hack-Nerd-Font
license: NOASSERTION
footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 提供字体文件
          en: Provides font files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 30 MB
          rating: 2
          desc:
            cn: 字体 ~30 MB
            en: ~30 MB fonts
      paths:
        data:
          - "$HOME/.local/share/fonts/Hack"
        config: []
    memory:
      idle:
        estimate: 0
        desc:
          cn: 字体不消耗运行时内存
          en: Fonts don't consume runtime memory
    cpu:
      workload: [compute]
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 0
        desc:
          cn: 字体加载不占 CPU
          en: Font loading uses no CPU
