lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: Noto 字体
  en: Noto font
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install Noto
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Noto.zip -OutFile Noto.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Noto.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Noto.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- Noto-Nerd-Font
# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 无文件系统读写
          en: No filesystem reads or writes
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data:
          - "$HOME/.local/share/fonts/Noto"
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 0
        desc:
          cn: 字体加载不占 CPU
          en: Font loading uses no CPU
license: NOASSERTION
