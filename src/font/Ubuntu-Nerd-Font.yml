lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: Ubuntu 字体
  en: Ubuntu font
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install Ubuntu
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Ubuntu.zip -OutFile Ubuntu.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Ubuntu.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Ubuntu.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- Ubuntu-Nerd-Font
license: NOASSERTION
