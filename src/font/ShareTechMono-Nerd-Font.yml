lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: ShareTechMono 字体
  en: ShareTechMono font
  cs: ShareTechMono písmo
  de: ShareTechMono Schrift
  es: Fuente ShareTechMono
  fr: Police ShareTechMono
  id: Font ShareTechMono
  it: Carattere ShareTechMono
  ja: ShareTechMono フォント
  ko: ShareTechMono 폰트
  pl: Czcionka ShareTechMono
  pt: Fonte ShareTechMono
  ro: Fontul ShareTechMono
  ru: Шрифт ShareTechMono
  th: ฟอนต์ ShareTechMono
  tr: ShareTechMono yazı tipi
  uk: Шрифт ShareTechMono
  vi: Phông chữ ShareTechMono
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install ShareTechMono
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/327ShareTechMono0.zip -OutFile ShareTechMono.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/ShareTechMono.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/ShareTechMono.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- ShareTechMono-Nerd-Font
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: partial
    linux: full
    darwin: partial
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
