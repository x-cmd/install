lang: Ruby
homepage: https://github.com/Homebrew/homebrew-cask-fonts
desc:
  cn: 字体桶
  en: Casks of fonts
x:
  source: https://github.com/Homebrew/homebrew-cask-fonts
rule:
  darwin/brew:
    cmd: 'brew tap homebrew/cask-fonts && brew install font-inconsolata

      '
    reference: https://github.com/Homebrew/homebrew-cask-fonts?tab=readme-ov-file#lets-try-it
binlist:
- homebrew-cask-fonts
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 1 KB
          rating: 1
          desc:
            cn: 约 1 KB（估算）
            en: ~1 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
