lang: Ruby
homepage: https://github.com/Homebrew/homebrew-cask-fonts
desc:
  cn: 字体桶
  en: Casks of fonts
x:
  source: https://github.com/Homebrew/homebrew-cask-fonts
rule:
  darwin/brew:
    cmd: 'brew tap homebrew/cask-fonts && brew install font-inconsolata

      '
    reference: https://github.com/Homebrew/homebrew-cask-fonts?tab=readme-ov-file#lets-try-it
binlist:
- homebrew-cask-fonts
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 1
          desc:
            cn: 安装 10 MB
            en: 10 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
