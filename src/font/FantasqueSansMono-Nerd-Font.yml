lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: FantasqueSansMono 字体
  en: FantasqueSansMono font
  cs: Písmo FantasqueSansMono
  de: Schriftart FantasqueSansMono
  es: Fuente FantasqueSansMono
  fr: Police FantasqueSansMono
  id: Font FantasqueSansMono
  it: Carattere FantasqueSansMono
  ja: FantasqueSansMono フォント
  ko: FantasqueSansMono 폰트
  pl: Czcionka FantasqueSansMono
  pt: Fonte FantasqueSansMono
  ro: Fontul FantasqueSansMono
  ru: Шрифт FantasqueSansMono
  th: ฟอนต์ FantasqueSansMono
  tr: FantasqueSansMono yazı tipi
  uk: Шрифт FantasqueSansMono
  vi: Phông chữ FantasqueSansMono
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install FantasqueSansMono
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/FantasqueSansMono.zip -OutFile FantasqueSansMono.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/FantasqueSansMono.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/FantasqueSansMono.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- FantasqueSansMono-Nerd-Font
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: partial
    linux: full
    darwin: partial
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
