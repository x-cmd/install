lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: 3270 字体
  en: 3270 font
  cs: 3270 písmo
  de: 3270 Schrift
  es: Fuente 3270
  fr: Police 3270
  id: Font 3270
  it: Carattere 3270
  ja: 3270 フォント
  ko: 3270 폰트
  pl: Czcionka 3270
  pt: Fonte 3270
  ro: Fontul 3270
  ru: Шрифт 3270
  th: ฟอนต์ 3270
  tr: 3270 yazı tipi
  uk: Шрифт 3270
  vi: Phông chữ 3270
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install 3270
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/3270.zip -OutFile 3270.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/3270.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/3270.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- 3270-Nerd-Font
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  platform:
    win: partial
    linux: full
    darwin: partial
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 2
          desc:
            cn: 约 10 MB（估算）
            en: ~10 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 20 MB
        desc:
          cn: 20 MB（估算）
          en: 20 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
