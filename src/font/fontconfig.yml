lang: C
homepage: https://gitlab.freedesktop.org/fontconfig/fontconfig
desc:
  en: Fontconfig is a library for configuring and customizing font access
  cn: Fontconfig 是一个用于配置和自定义字体访问的库
rule:
  darwin/brew:
    cmd: brew install fontconfig
    reference: https://formulae.brew.sh/formula/fontconfig#default
  debian/apt:
    cmd: sudo apt-get install fontconfig
    reference: https://command-not-found.com/fc-cache
  ubuntu/apt:
    cmd: sudo apt-get install fontconfig
    reference: https://command-not-found.com/fc-cache
  kali/apt:
    cmd: sudo apt-get install fontconfig
    reference: https://command-not-found.com/fc-cache
  alpine/apk:
    cmd: sudo apk add fontconfig
    reference: https://command-not-found.com/fc-cache
  arch/pacman:
    cmd: pacman -S fontconfig
    reference: https://command-not-found.com/fc-cache
  centos/yum:
    cmd: sudo yum install fontconfig
    reference: https://command-not-found.com/fc-cache
  fedora/dnf:
    cmd: sudo dnf install fontconfig
    reference: https://command-not-found.com/fc-cache
binlist:
- fontconfig
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: library
    network:
      local: false
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB
          en: 10 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
