lang: CSS
homepage: https://github.com/ryanoasis/nerd-fonts
desc:
  cn: HeavyData 字体
  en: HeavyData font
x:
  source: https://github.com/ryanoasis/nerd-fonts
rule:
  (linux|darwin|wsl2)/:
    cmd: x font nerd install HeavyData
    reference: https://x-cmd.com/mod/font
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -Uri https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/3HeavyData70.zip -OutFile HeavyData.zip
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /curl:
    cmd: curl -OL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/HeavyData.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
  /wget:
    cmd: wget https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/HeavyData.tar.xz
    reference: https://github.com/ryanoasis/nerd-fonts/releases/
binlist:
- HeavyDataMono-Nerd-Font
license: NOASSERTION
