lang: Python
homepage: https://github.com/openstack/python-openstackclient
license: Apache-2.0
desc:
  cn: OpenStack 的命令行客户端
  en: 'OpenStackClient (aka OSC) is a command-line client for OpenStack '
x:
  pkg:
    exist: true
  source: https://github.com/openstack/python-openstackclient
rule:
  /x:
    cmd: x pkg use python-openstackclient
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install python-openstackclient
    reference: https://docs.openstack.org/zh_CN/user-guide/common/cli-install-openstack-command-line-clients.html
    dsnap: python-openstackclient
binlist:
- python-openstackclient
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      localhost: true
      lan: true
      internet: true   # OpenStack API
    filesystem:
      read:
        desc:
          cn: 读取 ~/.config/openstack
          en: Reads ~/.config/openstack
        sensitive:
          - "$HOME/.config/openstack/clouds.yaml"
      write: []
  resource:
    disk:
      size:
        install:
          estimate: 321 KB
          rating: 1
          desc:
            cn: 约 321 KB（估算）
            en: ~321 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 150 MB
        desc:
          cn: ~150 MB
          en: ~150 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: API 调用时短暂占用
          en: Brief spike on API calls
