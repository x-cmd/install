lang: Python
homepage: https://github.com/openstack/python-openstackclient
license: Apache-2.0
desc:
  cn: OpenStack 的命令行客户端
  en: 'OpenStackClient (aka OSC) is a command-line client for OpenStack '
  cs: OpenStackClient (aka OSC) je klient příkazové řádky pro OpenStack
  de: OpenStackClient (alias OSC) ist ein Kommandozeilen-Client für OpenStack
  es: OpenStackClient (también conocido como OSC) es un cliente de línea de comandos para OpenStack
  fr: OpenStackClient (alias OSC) est un client en ligne de commande pour OpenStack
  id: OpenStackClient (disebut OSC) adalah klien baris perintah untuk OpenStack
  it: OpenStackClient (aka OSC) è un client da riga di comando per OpenStack
  ja: OpenStackClient (別名 OSC) は OpenStack 用のコマンドラインクライアントです
  ko: OpenStackClient(OSC라고도 함)는 OpenStack용 명령줄 클라이언트입니다
  pl: OpenStackClient (aka OSC) to klient wiersza poleceń dla OpenStack
  pt: O OpenStackClient (também conhecido como OSC) é um cliente de linha de comando para o OpenStack
  ro: OpenStackClient (cunoscut și ca OSC) este un client de linie de comandă pentru OpenStack
  ru: OpenStackClient (также известный как OSC) — это командный клиент для OpenStack
  th: OpenStackClient (หรือที่รู้จักในชื่อ OSC) คือไคลเอนต์บรรทัดคำสั่งสำหรับ OpenStack
  tr: OpenStackClient (OSC olarak da bilinir), OpenStack için bir komut satırı istemcisidir
  uk: OpenStackClient (також відомий як OSC) — це командний клієнт для OpenStack
  vi: OpenStackClient (hay OSC) là dòng lệnh cho OpenStack
x:
  source: https://github.com/openstack/python-openstackclient
  pip: python-openstackclient
rule:
  /x:
    cmd: x pkg use python-openstackclient
    reference: https://x-cmd.com/install/
  /pip:
    cmd: pip install python-openstackclient
    reference: https://docs.openstack.org/zh_CN/user-guide/common/cli-install-openstack-command-line-clients.html
    dsnap: python-openstackclient
binlist:
- python-openstackclient
# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: true
        internet: true   # OpenStack API
    filesystem:
      read:
        desc:
          cn: 读取 ~/.config/openstack
          en: Reads ~/.config/openstack
        sensitive:
          - "$HOME/.config/openstack/clouds.yaml"
      write:
        desc:
          cn: 无文件系统读写
          en: No filesystem reads or writes
  resource:
    disk:
      size:
        install:
          estimate: 321 KB
          rating: 1
          desc:
            cn: 约 321 KB（估算）
            en: ~321 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
      peak:
        estimate: 150 MB
        desc:
          cn: ~150 MB
          en: ~150 MB
    cpu:
      workload: ['compute']
      processes: 1
      idle:
        rating: 0
        desc:
          cn: 几乎为零
          en: Near-zero
      peak:
        rating: 2
        desc:
          cn: API 调用时短暂占用
          en: Brief spike on API calls
