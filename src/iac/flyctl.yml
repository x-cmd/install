lang: Go
homepage: https://github.com/superfly/flyctl
license: Apache-2.0
desc:
  en: flyctl is a command-line interface for fly.io
  cn: Flyctl 是 fly.io 的命令行界面
  cs: flyctl je rozhraní příkazové řádky pro fly.io
  de: flyctl ist eine Kommandozeilenschnittstelle für fly.io
  es: flyctl es una interfaz de línea de comandos para fly.io
  fr: flyctl est une interface de ligne de commande pour fly.io
  id: flyctl adalah antarmuka baris perintah untuk fly.io
  it: flyctl è un'interfaccia a riga di comando per fly.io
  ja: flyctl は fly.io のコマンドラインインターフェースです
  ko: flyctl는 fly.io의 명령줄 인터페이스입니다
  pl: flyctl to interfejs wiersza poleceń dla fly.io
  pt: flyctl é uma interface de linha de comando para o fly.io
  ro: flyctl este o interfață de linie de comandă pentru fly.io
  ru: flyctl — интерфейс командной строки для fly.io
  th: flyctl คืออินเทอร์เฟซบรรทัดคำสั่งสำหรับ fly.io
  tr: flyctl, fly.io için bir komut satırı arayüzüdür
  uk: flyctl — інтерфейс командного рядка для fly.io
  vi: flyctl là giao diện dòng lệnh cho fly.io
x:
  source: https://github.com/superfly/flyctl
  eget: superfly/flyctl
  brew: flyctl
  yay: flyctl
rule:
  /eget:
    cmd: x eget superfly/flyctl
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install flyctl
    reference: https://github.com/superfly/flyctl?tab=readme-ov-file#homebrew-macos-linux-wsl
  /curl:
    cmd: curl -L https://fly.io/install.sh | sh
    reference: https://github.com/superfly/flyctl?tab=readme-ov-file#install-script
  win/powershell:
    cmd: x pwsh iwr https://fly.io/install.ps1 -useb | iex
    reference: https://github.com/superfly/flyctl?tab=readme-ov-file#windows
  arch/yay:
    cmd: yay -S flyctl
    reference: https://aur.archlinux.org/packages/flyctl
binlist:
- flyctl

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 48 MB
          rating: 2
          desc:
            cn: 安装 48 MB
            en: 48 MB install
        download:
          estimate: 48 MB
          desc:
            cn: 约 48 MB 下载 (linux/x64)
            en: ~48 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
