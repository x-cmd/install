lang: 'Rust'
homepage: 'https://github.com/jvanbuel/flowrs'
license: 'MIT'
desc:
  cn: Apache Airflow 的 TUI 应用,可在终端监控、检查并触发 Airflow DAG
  en: 'Flowrs is a TUI application for Apache Airflow that allows you to monitor, inspect and trigger Airflow DAGs from the comforts of your terminal.'
x:
  source: https://github.com/jvanbuel/flowrs
  eget: jvanbuel/flowrs
rule:
  /eget:
    cmd: x eget jvanbuel/flowrs
    reference: https://github.com/jvanbuel/flowrs
binlist:
- 'flowrs'

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 7 MB
          rating: 1
          desc:
            cn: 安装 7 MB
            en: 7 MB install
        download:
          estimate: 7 MB
          desc:
            cn: 约 7 MB 下载 (linux/x64)
            en: ~7 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: none
    linux: full
    darwin: full
