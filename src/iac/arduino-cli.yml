lang: Go
homepage: https://github.com/arduino/arduino-cli
license: GPL-3.0
desc:
  cn: Arduino CLI 是一个一体化的解决方案，它提供了 Boards/Library Manager、草图生成器、板检测、上传器以及许多其他工具，这些工具可以通过命令行或机器界面使用任何与 Arduino 兼容的板和平台
  en: Arduino CLI is an all-in-one solution that provides Boards/Library Managers, sketch builder, board detection, uploader, and many other tools needed to use any Arduino compatible board and platform from command line or machine interfaces
  cs: Arduino CLI je kompletní řešení, které poskytuje správce desek a knihoven, sestavovač náčrtů, detekci desek, nahrávač a mnoho dalších nástrojů potřebných k použití jakékoli kompatibilní desky a platformy Arduino z příkazové řádky nebo rozhraní pro stroje
  de: Arduino CLI ist eine Komplettlösung, die Board-/Library-Manager, Sketch-Builder, Board-Erkennung, Uploader und viele weitere Werkzeuge bereitstellt, die benötigt werden, um jede Arduino-kompatible Karte und Plattform über die Kommandozeile oder Maschinenschnittstellen zu nutzen
  es: Arduino CLI es una solución integral que ofrece gestores de placas y bibliotecas, generador de bocetos, detección de placas, cargador y muchas otras herramientas necesarias para usar cualquier placa y plataforma compatible con Arduino desde la línea de comandos o interfaces de máquina
  fr: Arduino CLI est une solution tout-en-un qui fournit des gestionnaires de cartes et de bibliothèques, un générateur de croquis, la détection de cartes, un téléverseur et de nombreux autres outils nécessaires pour utiliser toute carte et plateforme compatible Arduino depuis la ligne de commande ou des interfaces machine
  id: Arduino CLI adalah solusi lengkap yang menyediakan pengelola Papan/Perpustakaan, pembuat sketsa, deteksi papan, pengunggah, dan banyak alat lain yang diperlukan untuk menggunakan papan dan platform yang kompatibel dengan Arduino dari baris perintah atau antarmuka mesin
  it: Arduino CLI è una soluzione completa che fornisce gestori di schede/biblioteche, generatore di sketch, rilevamento delle schede, uploader e molti altri strumenti necessari per usare qualsiasi scheda e piattaforma compatibile con Arduino dalla riga di comando o dalle interfacce macchina
  ja: Arduino CLI は、ボード/ライブラリマネージャー、スケッチビルダー、ボード検出、アップロード、そしてコマンドラインや機械インターフェースから Arduino 互換のボードやプラットフォームを使うために必要な多数のツールを備えたオールインワンのソリューションです
  ko: Arduino CLI는 보드/라이브러리 관리자, 스케치 빌더, 보드 감지, 업로더 및 명령줄이나 기계 인터페이스에서 Arduino 호환 보드와 플랫폼을 사용하는 데 필요한 다양한 도구를 제공하는 올인원 솔루션입니다
  pl: Arduino CLI to kompletne rozwiązanie, które zapewnia menedżery płyt i bibliotek, generator szkiców, wykrywanie płyt, uploader oraz wiele innych narzędzi potrzebnych do używania dowolnej płytki i platformy zgodnej z Arduino z wiersza poleceń lub interfejsów maszynowych
  pt: Arduino CLI é uma solução completa que fornece gerenciadores de placas/bibliotecas, construtor de esboços, detecção de placas, uploader e muitas outras ferramentas necessárias para usar qualquer placa e plataforma compatível com Arduino a partir da linha de comando ou interfaces de máquina
  ro: Arduino CLI este o soluție completă care oferă manageri de plăci/biblioteci, generator de schițe, detectarea plăcilor, uploader și multe alte instrumente necesare pentru a folosi orice placă și platformă compatibilă cu Arduino din linia de comandă sau interfețe de mașină
  ru: Arduino CLI — это комплексное решение, предоставляющее менеджеры плат и библиотек, редактор скетчей, определение плат, загрузчик и множество других инструментов, необходимых для работы с любой совместимой с Arduino платой и платформой из командной строки или машинных интерфейсов
  th: Arduino CLI เป็นโซลูชันครบวงจรที่มีตัวจัดการบอร์ด/ไลบรารี ตัวสร้างสเก็ตช์ การตรวจจับบอร์ด ตัวอัปโหลด และเครื่องมืออื่น ๆ อีกมากที่จำเป็นในการใช้บอร์ดและแพลตฟอร์มใด ๆ ที่เข้ากันได้กับ Arduino จากบรรทัดคำสั่งหรืออินเทอร์เฟซเครื่อง
  tr: Arduino CLI, komut satırından veya makine arayüzlerinden herhangi bir Arduino uyumlu kart ve platformu kullanmak için gereken pano/kütüphane yöneticileri, sketch oluşturucu, pano algılama, yükleyici ve daha birçok araç sunan hepsi bir arada bir çözümdür
  uk: Arduino CLI — це комплексне рішення, що надає менеджери плат і бібліотек, редактор скетчів, визначення плат, завантажувач і багато інших інструментів, потрібних для роботи з будь-якою сумісною з Arduino платою та платформою з командного рядка чи машинних інтерфейсів
  vi: Arduino CLI là giải pháp tất cả trong một, cung cấp trình quản lý board/thư viện, trình tạo sketch, phát hiện board, trình tải lên cùng nhiều công cụ khác cần thiết để dùng mọi board và nền tảng tương thích Arduino từ dòng lệnh hoặc giao diện máy
x:
  source: https://github.com/arduino/arduino-cli
  eget: arduino/arduino-cli
  brew: arduino-cli
  scoop: arduino-cli
rule:
  /eget:
    cmd: x eget arduino/arduino-cli
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install arduino-cli
    reference: https://formulae.brew.sh/formula/arduino-cli#default
  (win|wsl2)/scoop:
    cmd: x scoop install arduino-cli
    reference: https://scoop.sh/#/apps?q=arduino-cli
binlist:
- arduino-cli

# complicated
footprint:
  behavior:
    runtime:
      type: library
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
  resource:
    disk:
      size:
        install:
          estimate: 16 MB
          rating: 2
          desc:
            cn: 安装 16 MB
            en: 16 MB install
        download:
          estimate: 16 MB
          desc:
            cn: 约 16 MB 下载 (linux/arm64)
            en: ~16 MB download (linux/arm64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
