lang: Go
homepage: https://github.com/leg100/pug
license: MPL-2.0
desc:
  cn: 用于高级 Terraform 用户的 TUI 工具。
  en: A terminal user interface for terraform power users.
  cs: Terminálové uživatelské rozhraní pro pokročilé uživatele Terraformu.
  de: Eine Terminal-Benutzeroberfläche für erfahrene Terraform-Nutzer.
  es: Una interfaz de usuario de terminal para usuarios avanzados de Terraform.
  fr: Une interface utilisateur en terminal pour les experts de Terraform.
  id: Antarmuka pengguna terminal untuk pengguna ahli Terraform.
  it: Un'interfaccia utente da terminale per utenti esperti di Terraform.
  ja: Terraform の上級者向けのターミナルユーザーインターフェース。
  ko: Terraform 숙련자를 위한 터미널 사용자 인터페이스입니다.
  pl: Terminalowy interfejs użytkownika dla zaawansowanych użytkowników Terraform.
  pt: Uma interface de usuário de terminal para usuários avançados do Terraform.
  ro: O interfață utilizator în terminal pentru utilizatori avansați de Terraform.
  ru: Терминальный интерфейс для опытных пользователей Terraform.
  th: ส่วนติดต่อผู้ใช้แบบเทอร์มินัลสำหรับผู้ใช้ Terraform ระดับสูง
  tr: Terraform uzmanları için bir terminal kullanıcı arayüzü.
  uk: Термінальний інтерфейс користувача для досвідчених користувачів Terraform.
  vi: Giao diện người dùng trên terminal cho người dùng Terraform nâng cao.
x:
  source: https://github.com/leg100/pug
  eget: leg100/pug
  brew: leg100/tap/pug
  yay: terraform-pug-bin
  go: github.com/leg100/pug@latest
rule:
  /eget:
    cmd: x eget leg100/pug
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S terraform-pug-bin
    reference: https://aur.archlinux.org/packages/terraform-pug-bin
  /go:
    cmd: go install github.com/leg100/pug@latest
    reference: https://github.com/leg100/pug?tab=readme-ov-file#install-instructions
    dsnap: github.com/leg100/pug@latest
  /brew:
    cmd: brew install leg100/tap/pug
    reference: https://github.com/leg100/pug?tab=readme-ov-file#install-instructions
binlist:
- pug

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
