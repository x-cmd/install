lang: Go
homepage: https://github.com/leg100/pug
license: MPL-2.0
desc:
  cn: 用于高级 Terraform 用户的 TUI 工具。
  en: A terminal user interface for terraform power users.
x:
  source: https://github.com/leg100/pug
  eget: https://github.com/leg100/pug
  brew: leg100/tap/pug
rule:
  /eget:
    cmd: x eget leg100/pug
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S terraform-pug-bin
    reference: https://aur.archlinux.org/packages/terraform-pug-bin
  /go:
    cmd: go install github.com/leg100/pug@latest
    reference: https://github.com/leg100/pug?tab=readme-ov-file#install-instructions
    dsnap: github.com/leg100/pug@latest
  /brew:
    cmd: brew install leg100/tap/pug
    reference: https://github.com/leg100/pug?tab=readme-ov-file#install-instructions
binlist:
- pug

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 4 MB
          rating: 1
          desc:
            cn: 安装 4 MB
            en: 4 MB install
        download:
          estimate: 4 MB
          desc:
            cn: 约 4 MB 下载 (linux/x64)
            en: ~4 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
