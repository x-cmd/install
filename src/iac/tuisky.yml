lang: Rust
homepage: https://github.com/sugyan/tuisky
license: MIT
desc:
  cn: 用于 Bluesky 的 TUI 客户端。
  en: TUI client for Bluesky.
x:
  source: https://github.com/sugyan/tuisky
rule:
  /cargo:
    cmd: cargo install tuisky
    reference: https://github.com/sugyan/tuisky?tab=readme-ov-file#installation
    dsnap: tuisky
  arch/paru:
    cmd: paru -S tuisky
    reference: https://github.com/sugyan/tuisky?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S tuisky
    reference: https://aur.archlinux.org/packages/tuisky
binlist:
- tuisky

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
