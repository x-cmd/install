lang: Rust
homepage: https://github.com/sugyan/tuisky
license: MIT
desc:
  cn: 用于 Bluesky 的 TUI 客户端。
  en: TUI client for Bluesky.
x:
  source: https://github.com/sugyan/tuisky
rule:
  /cargo:
    cmd: cargo install tuisky
    reference: https://github.com/sugyan/tuisky?tab=readme-ov-file#installation
    dsnap: tuisky
  arch/paru:
    cmd: paru -S tuisky
    reference: https://github.com/sugyan/tuisky?tab=readme-ov-file#installation
  arch/yay:
    cmd: yay -S tuisky
    reference: https://aur.archlinux.org/packages/tuisky
binlist:
- tuisky

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 174 KB
          rating: 1
          desc:
            cn: 约 174 KB（估算）
            en: ~174 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
