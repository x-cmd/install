lang: Rust
homepage: https://tiron.run/
desc:
  cn: Tiron 是一种易于使用的自动化工具，其目标是尽可能快
  en: Tiron is an automation tool that's easy to use and aims to be as fast as possible
rule:
  /curl:
    cmd: curl -sL https://tiron.run/install.sh | sh
    reference: https://tiron.run/docs/getting-started/overview/
binlist:
- tiron
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 8.0 MB
          rating: 1
          desc:
            cn: 约 8.0 MB（估算）
            en: ~8.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 15 MB
        desc:
          cn: 15 MB（估算）
          en: 15 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
