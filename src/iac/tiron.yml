lang: Rust
homepage: https://tiron.run/
desc:
  cn: Tiron 是一种易于使用的自动化工具，其目标是尽可能快
  en: Tiron is an automation tool that's easy to use and aims to be as fast as possible
rule:
  /curl:
    cmd: curl -sL https://tiron.run/install.sh | sh
    reference: https://tiron.run/docs/getting-started/overview/
binlist:
- tiron
license: NOASSERTION

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 5 MB
          rating: 1
          desc:
            cn: 安装 5 MB
            en: 5 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
