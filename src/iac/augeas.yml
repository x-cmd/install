lang: Augeas
homepage: https://github.com/hercules-team/augeas
license: LGPL-2.1
desc:
  cn: Augeas 是一个配置编辑工具
  en: Augeas is a configuration editing tool
  cs: Augeas je nástroj pro úpravu konfigurace
  de: Augeas ist ein Konfigurations-Editor
  es: Augeas es una herramienta de edición de configuración
  fr: Augeas est un outil d'édition de configuration
  id: Augeas adalah alat untuk mengedit konfigurasi
  it: Augeas è uno strumento di modifica della configurazione
  ja: Augeas は設定編集ツールです
  ko: Augeas는 구성 편집 도구입니다
  pl: Augeas to narzędzie do edycji konfiguracji
  pt: Augeas é uma ferramenta de edição de configuração
  ro: Augeas este un instrument de editare a configurației
  ru: Augeas — инструмент для редактирования конфигурации
  th: Augeas เป็นเครื่องมือแก้ไขการตั้งค่า
  tr: Augeas, yapılandırma düzenleme aracıdır
  uk: Augeas — інструмент для редагування конфігурації
  vi: Augeas là công cụ chỉnh sửa cấu hình
x:
  source: https://github.com/hercules-team/augeas
  eget: hercules-team/augeas
  brew: augeas
rule:
  /eget:
    cmd: x eget hercules-team/augeas
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install augeas
    reference: https://formulae.brew.sh/formula/augeas#default
binlist:
- augeas

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 1.4 MB
          rating: 1
          desc:
            cn: 约 1.4 MB（估算）
            en: ~1.4 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
