lang: Augeas
homepage: https://github.com/hercules-team/augeas
license: LGPL-2.1
desc:
  cn: Augeas 是一个配置编辑工具
  en: Augeas is a configuration editing tool
x:
  source: https://github.com/hercules-team/augeas
  eget: https://github.com/hercules-team/augeas
rule:
  /eget:
    cmd: x eget hercules-team/augeas
    reference: https://x-cmd.com/mod/eget
  darwin/brew:
    cmd: brew install augeas
    reference: https://formulae.brew.sh/formula/augeas#default
binlist:
- augeas

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
