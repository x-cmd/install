lang: Go
homepage: https://github.com/magodo/pipeform
license: MPL-2.0
desc:
  cn: pipeform 是 Terraform 运行时 TUI。
  en: A TUI for Terraform runtime progress.
  cs: TUI pro průběh běhu Terraformu.
  de: Eine TUI für den Fortschritt der Terraform-Laufzeit.
  es: Una TUI para el progreso de la ejecución de Terraform.
  fr: Une TUI pour suivre la progression de l'exécution de Terraform.
  id: TUI untuk kemajuan proses runtime Terraform.
  it: Una TUI per monitorare l'avanzamento dell'esecuzione di Terraform.
  ja: Terraform 実行の進捗を表示する TUI。
  ko: Terraform 실행 진행 상황을 보여주는 TUI입니다.
  pl: TUI pokazujący postęp działania Terraform.
  pt: Uma TUI para o progresso da execução do Terraform.
  ro: O interfață TUI pentru progresul execuției Terraform.
  ru: TUI для отображения хода выполнения Terraform.
  th: TUI สำหรับแสดงความคืบหน้าของการทำงาน Terraform
  tr: Terraform çalışma ilerlemesi için bir TUI.
  uk: TUI для відображення прогресу виконання Terraform.
  vi: Giao diện TUI để theo dõi tiến trình chạy Terraform.
x:
  source: https://github.com/magodo/pipeform
  eget: magodo/pipeform
  yay: pipeform
  go: github.com/magodo/pipeform@main
rule:
  /eget:
    cmd: x eget magodo/pipeform
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S pipeform
    reference: https://aur.archlinux.org/packages/pipeform
  /go:
    cmd: go install github.com/magodo/pipeform@main
    reference: https://github.com/magodo/pipeform#installation
    dsnap: github.com/magodo/pipeform@main
binlist:
- pipeform

# complicated
footprint:
  behavior:
    runtime:
      type: tui
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 2 MB
          rating: 1
          desc:
            cn: 安装 2 MB
            en: 2 MB install
        download:
          estimate: 2 MB
          desc:
            cn: 约 2 MB 下载 (linux/x64)
            en: ~2 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
