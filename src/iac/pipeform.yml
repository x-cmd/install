lang: Go
homepage: https://github.com/magodo/pipeform
license: MPL-2.0
desc:
  cn: pipeform 是 Terraform 运行时 TUI。
  en: A TUI for Terraform runtime progress.
x:
  source: https://github.com/magodo/pipeform
  eget: https://github.com/magodo/pipeform
rule:
  /eget:
    cmd: x eget magodo/pipeform
    reference: https://x-cmd.com/mod/eget
  arch/yay:
    cmd: yay -S pipeform
    reference: https://aur.archlinux.org/packages/pipeform
  /go:
    cmd: go install github.com/magodo/pipeform@main
    reference: https://github.com/magodo/pipeform#installation
    dsnap: github.com/magodo/pipeform@main
binlist:
- pipeform

footprint:
  behavior:
    runtime:
      type: tui
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
