lang: Go
homepage: https://github.com/dagger/dagger
license: Apache-2.0
desc:
  cn: Dagger 是一个集成平台，从头到尾协调应用程序到云的交付
  en: Dagger is an integrated platform to orchestrate the delivery of applications to the cloud from start to finish
  cs: Dagger je integrovaná platforma pro řízení doručování aplikací do cloudu od začátku do konce
  de: Dagger ist eine integrierte Plattform, die die Bereitstellung von Anwendungen in die Cloud von Anfang bis Ende orchestriert
  es: Dagger es una plataforma integrada para orquestar la entrega de aplicaciones a la nube de principio a fin
  fr: Dagger est une plateforme intégrée qui orchestre la livraison d'applications vers le cloud de bout en bout
  id: Dagger adalah platform terpadu untuk mengorkestrasi pengiriman aplikasi ke cloud dari awal hingga akhir
  it: Dagger è una piattaforma integrata per orchestrare il rilascio delle applicazioni al cloud dall'inizio alla fine
  ja: Dagger は、アプリケーションのクラウドへの配信を一貫して調整する統合プラットフォームです
  ko: Dagger는 애플리케이션을 클라우드에 처음부터 끝까지 배포하는 통합 플랫폼입니다
  pl: Dagger to zintegrowana platforma do orkiestracji dostarczania aplikacji do chmury od początku do końca
  pt: Dagger é uma plataforma integrada para orquestrar a entrega de aplicativos à nuvem de ponta a ponta
  ro: Dagger este o platformă integrată pentru orchestrarea livrării aplicațiilor către cloud de la început până la final
  ru: Dagger — интегрированная платформа для оркестрации доставки приложений в облако от начала до конца
  th: Dagger เป็นแพลตฟอร์มแบบรวมที่ประสานการส่งมอบแอปพลิเคชันไปยังคลาวด์ตั้งแต่ต้นจนจบ
  tr: Dagger, uygulamaların buluta baştan sona teslimatını düzenleyen entegre bir platformdur
  uk: Dagger — інтегрована платформа для оркестрації доставки застосунків у хмару від початку до кінця
  vi: Dagger là nền tảng tích hợp để điều phối việc triển khai ứng dụng lên cloud từ đầu đến cuối
x:
  source: https://github.com/dagger/dagger
  eget: dagger/dagger
  brew: dagger/tap/dagger
  scoop: dagger
  yay: dagger-bin
  asdf: dagger
rule:
  /x:
    cmd: x pkg use dagger
    reference: https://x-cmd.com/install/
  /eget:
    cmd: x eget dagger/dagger
    reference: https://x-cmd.com/mod/eget
  /asdf:
    cmd: x asdf use dagger
    reference: https://github.com/virtualstaticvoid/asdf-dagger
  darwin/brew:
    cmd: brew install dagger/tap/dagger
    reference: https://docs.dagger.io/quickstart/729236/cli
  (win|wsl2)/scoop:
    cmd: x scoop install dagger
    reference: https://scoop.sh/#/apps?q=dagger
  linux/curl:
    cmd: curl -L https://dl.dagger.io/dagger/install.sh | sh
    reference: https://docs.dagger.io/quickstart/729236/cli
  win/powershell:
    cmd: x pwsh Invoke-WebRequest -UseBasicParsing -Uri https://dl.dagger.io/dagger/install.ps1 | x pwsh Invoke-Expression
    reference: https://docs.dagger.io/quickstart/729236/cli
  arch/yay:
    cmd: yay -S dagger-bin
    reference: https://aur.archlinux.org/packages/dagger-bin
binlist:
- dagger

# already profiled
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: true
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 63 MB
          rating: 3
          desc:
            cn: 安装 63 MB
            en: 63 MB install
        download:
          estimate: 21 MB
          desc:
            cn: 约 21 MB 下载 (linux/x64)
            en: ~21 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB
          en: 5 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
