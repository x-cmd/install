lang: Ruby
homepage: https://github.com/puppetlabs/puppet
license: Apache-2.0
desc:
  cn: Puppet 是太阳系中最强大的配置管理工具
  en: Puppet is the most powerful configuration management tool in the solar system
x:
  source: https://github.com/puppetlabs/puppet
rule:
  /rpm:
    cmd: sudo rpm -Uvh https://yum.puppet.com/puppet8-release-el-8.noarch.rpm
    reference: https://www.puppet.com/docs/puppet/8/install_puppet#enable_the_puppet_platform_yum
  /deb:
    cmd: 'wget https://apt.puppet.com/puppet8-release-focal.deb && \

      sudo dpkg -i puppet8-release-focal.deb && \

      sudo apt-get update

      '
    reference: https://www.puppet.com/docs/puppet/8/install_puppet#enable_the_puppet_platform_apt
binlist:
- puppet

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: localhost
      connect:
        localhost: true
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 635 KB
          rating: 1
          desc:
            cn: 约 635 KB（估算）
            en: ~635 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
