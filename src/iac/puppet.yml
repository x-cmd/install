lang: Ruby
homepage: https://github.com/puppetlabs/puppet
license: Apache-2.0
desc:
  cn: Puppet 是太阳系中最强大的配置管理工具
  en: Puppet is the most powerful configuration management tool in the solar system
  cs: Puppet je nejvýkonnější nástroj správy konfigurací na světě
  de: Puppet ist das leistungsfähigste Konfigurationsmanagement-Tool der Welt
  es: Puppet es la herramienta de gestión de configuración más potente del mundo
  fr: Puppet est l'outil de gestion de configuration le plus puissant au monde
  id: Puppet adalah alat manajemen konfigurasi terkuat di dunia
  it: Puppet è lo strumento di gestione della configurazione più potente al mondo
  ja: Puppet は太陽系で最も強力な構成管理ツールです
  ko: Puppet는 세계에서 가장 강력한 구성 관리 도구입니다
  pl: Puppet jest najpotężniejszym narzędziem do zarządzania konfiguracją na świecie
  pt: O Puppet é a ferramenta de gerenciamento de configuração mais poderosa do mundo
  ro: Puppet este cel mai puternic instrument de management al configurației din lume
  ru: Puppet — самый мощный инструмент управления конфигурациями в мире
  th: Puppet คือเครื่องมือจัดการการตั้งค่าที่ทรงพลังที่สุดในระบบสุริยะ
  tr: Puppet, dünyanın en güçlü yapılandırma yönetimi aracıdır
  uk: Puppet — найпотужніший інструмент керування конфігурацією у світі
  vi: Puppet là công cụ quản lý cấu hình mạnh nhất thế giới
x:
  source: https://github.com/puppetlabs/puppet
rule:
  /rpm:
    cmd: sudo rpm -Uvh https://yum.puppet.com/puppet8-release-el-8.noarch.rpm
    reference: https://www.puppet.com/docs/puppet/8/install_puppet#enable_the_puppet_platform_yum
  /deb:
    cmd: 'wget https://apt.puppet.com/puppet8-release-focal.deb && \

      sudo dpkg -i puppet8-release-focal.deb && \

      sudo apt-get update

      '
    reference: https://www.puppet.com/docs/puppet/8/install_puppet#enable_the_puppet_platform_apt
binlist:
- puppet

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 635 KB
          rating: 1
          desc:
            cn: 约 635 KB（估算）
            en: ~635 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
