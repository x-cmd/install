lang: Ruby
homepage: https://github.com/chef/chef
license: Apache-2.0
desc:
  cn: Chef Infra 是一个功能强大的自动化平台，可将基础设施转换为代码
  en: Chef Infra is a powerful automation platform that transforms infrastructure into code
  cs: Chef Infra je výkonná automatizační platforma, která převádí infrastrukturu na kód
  de: Chef Infra ist eine leistungsstarke Automatisierungsplattform, die Infrastruktur in Code umwandelt
  es: Chef Infra es una potente plataforma de automatización que transforma la infraestructura en código
  fr: Chef Infra est une plateforme d'automatisation puissante qui transforme l'infrastructure en code
  id: Chef Infra adalah platform otomatisasi yang kuat untuk mengubah infrastruktur menjadi kode
  it: Chef Infra è una potente piattaforma di automazione che trasforma l'infrastruttura in codice
  ja: Chef Infra はインフラストラクチャをコードに変換する強力な自動化プラットフォームです
  ko: Chef Infra는 인프라를 코드로 변환하는 강력한 자동화 플랫폼입니다
  pl: Chef Infra to potężna platforma automatyzacji, która zamienia infrastrukturę w kod
  pt: Chef Infra é uma plataforma de automação poderosa que transforma a infraestrutura em código
  ro: Chef Infra este o platformă puternică de automatizare care transformă infrastructura în cod
  ru: Chef Infra — мощная платформа автоматизации, превращающая инфраструктуру в код
  th: Chef Infra เป็นแพลตฟอร์มอัตโนมัติอันทรงพลังที่เปลี่ยนโครงสร้างพื้นฐานให้เป็นโค้ด
  tr: Chef Infra, altyapıyı koda dönüştüren güçlü bir otomasyon platformudur
  uk: Chef Infra — потужна платформа автоматизації, яка перетворює інфраструктуру на код
  vi: Chef Infra là nền tảng tự động hóa mạnh mẽ biến hạ tầng thành mã
x:
  source: https://github.com/chef/chef
  apt: apt-transport-https
  apt-get: apt-transport-https
rule:
  debian/wget:
    cmd: 'sudo apt-get install apt-transport-https && \

      wget -qO - https://packages.chef.io/chef.asc | sudo apt-key add - && \

      echo "deb https://packages.chef.io/repos/apt/stable bullseye main" > chef-stable.list && \

      sudo mv chef-stable.list /etc/apt/sources.list.d/ && \

      sudo apt-get update

      '
    reference: https://docs.chef.io/packages/#debian--ubuntu
  ubuntu/wget:
    cmd: 'sudo apt-get install apt-transport-https && \

      wget -qO - https://packages.chef.io/chef.asc | sudo apt-key add - && \

      echo "deb https://packages.chef.io/repos/apt/stable bullseye main" > chef-stable.list && \

      sudo mv chef-stable.list /etc/apt/sources.list.d/ && \

      sudo apt-get update

      '
    reference: https://docs.chef.io/packages/#debian--ubuntu
  /curl:
    cmd: curl -L https://omnitruck.chef.io/install.sh | sudo bash
    reference: https://docs.chef.io/packages/#unix-and-linux
  win/powershell:
    cmd: x pwsh . { iwr -useb https://omnitruck.chef.io/install.ps1 } | iex; install
    reference: https://docs.chef.io/packages/#windows
binlist:
- chef

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 496 KB
          rating: 1
          desc:
            cn: 约 496 KB（估算）
            en: ~496 KB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 5 MB
        desc:
          cn: 5 MB（估算）
          en: 5 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
