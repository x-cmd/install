lang: Ruby
homepage: https://github.com/chef/chef
license: Apache-2.0
desc:
  cn: Chef Infra 是一个功能强大的自动化平台，可将基础设施转换为代码
  en: Chef Infra is a powerful automation platform that transforms infrastructure into code
x:
  source: https://github.com/chef/chef
rule:
  debian/wget:
    cmd: 'sudo apt-get install apt-transport-https && \

      wget -qO - https://packages.chef.io/chef.asc | sudo apt-key add - && \

      echo "deb https://packages.chef.io/repos/apt/stable bullseye main" > chef-stable.list && \

      sudo mv chef-stable.list /etc/apt/sources.list.d/ && \

      sudo apt-get update

      '
    reference: https://docs.chef.io/packages/#debian--ubuntu
  ubuntu/wget:
    cmd: 'sudo apt-get install apt-transport-https && \

      wget -qO - https://packages.chef.io/chef.asc | sudo apt-key add - && \

      echo "deb https://packages.chef.io/repos/apt/stable bullseye main" > chef-stable.list && \

      sudo mv chef-stable.list /etc/apt/sources.list.d/ && \

      sudo apt-get update

      '
    reference: https://docs.chef.io/packages/#debian--ubuntu
  /curl:
    cmd: curl -L https://omnitruck.chef.io/install.sh | sudo bash
    reference: https://docs.chef.io/packages/#unix-and-linux
  win/powershell:
    cmd: x pwsh . { iwr -useb https://omnitruck.chef.io/install.ps1 } | iex; install
    reference: https://docs.chef.io/packages/#windows
binlist:
- chef

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 10 MB
          rating: 1
          desc:
            cn: 安装 10 MB
            en: 10 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 50 MB
        desc:
          cn: 50 MB
          en: 50 MB
    cpu:
      workload: ['io']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
