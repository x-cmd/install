lang: Python
homepage: https://repo.saltproject.io/
desc:
  cn: Salt 是世界上最快，最聪明，最可扩展的自动化引擎
  en: Salt is the world's fastest, most intelligent and scalable automation engine
  cs: Salt je nejrychlejší, nejinteligentnější a nejškálovatelnější automatizační engine na světě
  de: Salt ist die schnellste, intelligenteste und skalierbarste Automatisierungs-Engine der Welt
  es: Salt es el motor de automatización más rápido, más inteligente y más escalable del mundo
  fr: Salt est le moteur d'automatisation le plus rapide, le plus intelligent et le plus évolutif au monde
  id: Salt adalah mesin otomatisasi tercepat, paling cerdas, dan paling skalabel di dunia
  it: Salt è il motore di automazione più veloce, più intelligente e più scalabile al mondo
  ja: Salt は世界最速・最高性能・最も拡張性の高い自動化エンジンです
  ko: Salt는 세계에서 가장 빠르고 가장 똑똑하며 가장 확장성이 높은 자동화 엔진입니다
  pl: Salt to najszybszy, najinteligentniejszy i najbardziej skalowalny silnik automatyzacji na świecie
  pt: O Salt é o motor de automação mais rápido, mais inteligente e mais escalável do mundo
  ro: Salt este cel mai rapid, cel mai inteligent și cel mai scalabil motor de automatizare din lume
  ru: Salt — самый быстрый, самый умный и самый масштабируемый движок автоматизации в мире
  th: Salt คือเอนจินอัตโนมัติที่เร็วที่สุด ฉลาดที่สุด และปรับขยายได้มากที่สุดในโลก
  tr: Salt, dünyanın en hızlı, en zeki ve en ölçeklenebilir otomasyon motorudur
  uk: Salt — найшвидший, найрозумніший і наймасштабованіший рушій автоматизації у світі
  vi: Salt là công cụ tự động hóa nhanh nhất, thông minh nhất và mở rộng tốt nhất thế giới
rule:
  linux/curl:
    cmd: 'curl -o quick.sh -L https://raw.githubusercontent.com/saltstack/salt-bootstrap/develop/salt-quick-start.sh \

      && bash ./quick.sh

      '
    reference: https://docs.saltproject.io/salt/install-guide/en/latest/topics/quickstart.html#install-salt-with-the-quickstart-script
  darwin/curl:
    cmd: 'curl -o quick.sh -L https://raw.githubusercontent.com/saltstack/salt-bootstrap/develop/salt-quick-start.sh \

      && bash ./quick.sh

      '
    reference: https://docs.saltproject.io/salt/install-guide/en/latest/topics/quickstart.html#install-salt-with-the-quickstart-script
  win/curl:
    cmd: 'Set-ExecutionPolicy RemoteSigned -Scope Process -Force \

      && [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]''Tls12'' \

      && Invoke-WebRequest -Uri https://raw.githubusercontent.com/saltstack/salt-bootstrap/develop/salt-quick-start.ps1 -OutFile .\quick.ps1 \

      && .\quick.ps1

      '
    reference: https://docs.saltproject.io/salt/install-guide/en/latest/topics/quickstart.html#install-salt-with-the-quickstart-script
binlist:
- saltstack
license: NOASSERTION

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 3.0 MB
          rating: 1
          desc:
            cn: 约 3.0 MB（估算）
            en: ~3.0 MB estimated
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
