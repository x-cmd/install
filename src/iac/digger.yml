lang: Go
homepage: https://github.com/diggerhq/digger
license: MIT
desc:
  en: Digger is an open-source IaC automation and collaboration software for Terraform and OpenTofu
  cn: Digger 是用于 Terraform 和 OpenTofu 的开源 IaC 自动化和协作软件
  cs: Digger je open-source automatizační a kolaborační software pro IaC pro Terraform a OpenTofu
  de: Digger ist eine quelloffene IaC-Automatisierungs- und Zusammenarbeitssoftware für Terraform und OpenTofu
  es: Digger es un software de automatización y colaboración de IaC de código abierto para Terraform y OpenTofu
  fr: Digger est un logiciel libre d'automatisation et de collaboration IaC pour Terraform et OpenTofu
  id: Digger adalah perangkat lunak otomatisasi dan kolaborasi IaC sumber terbuka untuk Terraform dan OpenTofu
  it: Digger è un software open source di automazione e collaborazione IaC per Terraform e OpenTofu
  ja: Digger は Terraform と OpenTofu のためのオープンソース IaC 自動化およびコラボレーションソフトウェアです
  ko: Digger는 Terraform 및 OpenTofu를 위한 오픈소스 IaC 자동화 및 협업 소프트웨어입니다
  pl: Digger to oprogramowanie open source do automatyzacji i współpracy IaC dla Terraform i OpenTofu
  pt: Digger é um software de automação e colaboração de IaC de código aberto para Terraform e OpenTofu
  ro: Digger este un software open source de automatizare și colaborare IaC pentru Terraform și OpenTofu
  ru: Digger — программное обеспечение с открытым исходным кодом для автоматизации и совместной работы над IaC с Terraform и OpenTofu
  th: Digger คือซอฟต์แวร์โอเพนซอร์สสำหรับการทำ IaC อัตโนมัติและการทำงานร่วมกันสำหรับ Terraform และ OpenTofu
  tr: Digger, Terraform ve OpenTofu için açık kaynaklı IaC otomasyon ve işbirliği yazılımıdır
  uk: Digger — програмне забезпечення з відкритим кодом для автоматизації та спільної роботи над IaC з Terraform і OpenTofu
  vi: Digger là phần mềm tự động hóa và cộng tác IaC mã nguồn mở cho Terraform và OpenTofu
x:
  source: https://github.com/diggerhq/digger
  eget: diggerhq/digger
rule:
  /eget:
    cmd: x eget diggerhq/digger
    reference: https://x-cmd.com/mod/eget
  /docker:
    cmd: docker pull ghcr.io/diggerhq/digger/digger-backend-ee:v0.1.7.29
    reference: https://github.com/diggerhq/digger?tab=readme-ov-file#getting-started
binlist:
- digger

# complicated
footprint:
  behavior:
    runtime:
      type: cli
    network:
      listen: none
      connect:
        localhost: false
        lan: false
        internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 82 MB
          rating: 3
          desc:
            cn: 安装 82 MB
            en: 82 MB install
        download:
          estimate: 82 MB
          desc:
            cn: 约 82 MB 下载 (linux/x64)
            en: ~82 MB download (linux/x64)
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 10 MB
        desc:
          cn: 10 MB（估算）
          en: 10 MB estimated
    cpu:
      workload: ['compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
  platform:
    win: full
    linux: full
    darwin: full
