lang: Go
homepage: https://github.com/diggerhq/digger
license: MIT
desc:
  en: Digger is an open-source IaC automation and collaboration software for Terraform and OpenTofu
  cn: Digger 是用于 Terraform 和 OpenTofu 的开源 IaC 自动化和协作软件
x:
  source: https://github.com/diggerhq/digger
  eget: https://github.com/diggerhq/digger
rule:
  /eget:
    cmd: x eget diggerhq/digger
    reference: https://x-cmd.com/mod/eget
  /docker:
    cmd: docker pull ghcr.io/diggerhq/digger/digger-backend-ee:v0.1.7.29
    reference: https://github.com/diggerhq/digger?tab=readme-ov-file#getting-started
binlist:
- digger

footprint:
  behavior:
    runtime:
      type: cli
    network:
      local: true
      internet: false
    filesystem:
      read:
        desc:
          cn: 读取配置文件
          en: Reads config files
        sensitive: []
  resource:
    disk:
      size:
        install:
          estimate: 20 MB
          rating: 1
          desc:
            cn: 安装 20 MB
            en: 20 MB install
      paths:
        data: []
        config: []
    memory:
      idle:
        estimate: 30 MB
        desc:
          cn: 30 MB
          en: 30 MB
    cpu:
      workload: ['io', 'compute']
      processes: 1
      peak:
        rating: 2
        desc:
          cn: 极低
          en: Negligible
