name: "update: update existing entry"
description: Report a problem with an existing entry in x-cmd/install
title: "update: <short tool name> — <one-line summary>"
labels: ["update"]
body:
  - type: markdown
    attributes:
      value: |
        All fields are optional — an AI will verify the rest. Just tell us
        **which package** and **where the problem is**.

  - type: input
    id: package
    attributes:
      label: Package
      description: Paste the x-cmd install page URL (https://x-cmd.com/install/<tool>), the GitHub repo URL, or just the tool name. Any one is enough.
      placeholder: "https://x-cmd.com/install/jq  |  https://github.com/jqlang/jq  |  jq"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Where the problem is
      description: Which field is wrong / what behavior is broken. Quote the line if you can.
      placeholder: |
        homepage points to https://... (404)
        rule./eget cmd is `x eget use jqlang/jq` but the latest release asset name is …
        desc.en says "JSON parser" but the project is now archived
    validations:
      required: false
