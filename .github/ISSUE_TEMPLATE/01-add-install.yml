name: "rec: add install"
description: Suggest a new package to add to x-cmd/install
title: "rec: <short tool name>"
labels: ["rec", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        All fields are optional — an AI will verify the rest from the URL
        you provide. Fill in only what you actually know.

  - type: input
    id: project_url
    attributes:
      label: Project URL
      description: GitHub / GitLab / Codeberg / Gitea / SourceHut / self-hosted URL of the project.
      placeholder: "https://github.com/<owner>/<repo>"
    validations:
      required: false

  - type: input
    id: homepage
    attributes:
      label: Homepage (optional)
      description: Official homepage if it differs from the project URL above.
      placeholder: "https://example.com"
    validations:
      required: false

  - type: input
    id: description
    attributes:
      label: One-line description (optional)
      description: What the tool does, in your own words.
      placeholder: "A command-line JSON processor."
    validations:
      required: false

  - type: textarea
    id: recommendation
    attributes:
      label: Why you'd recommend it (optional)
      description: Anything personal — what you use it for, what problem it solves, why it deserves a spot here.
      placeholder: |
        I use this daily to … It's the only tool that does … Beats <other-tool> at …
    validations:
      required: false
