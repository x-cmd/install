name: Build data artifacts

on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Build each format script
        run: |
          set -e
          shopt -s nullglob
          for script in .x-cmd/v*.yml2tsv.py; do
            N=$(basename "$script" .yml2tsv.py | sed 's/^v//')
            echo "::group::Building format v$N"
            python3 "$script" src -o "v${N}.all.tsv"
            tar -cJf "v${N}.all.tar.xz" "v${N}.all.tsv" src/
            echo "::endgroup::"
          done

      - name: List built artifacts
        run: ls -la v*.all.tsv v*.all.tar.xz

      - name: Set today's date (UTC)
        run: echo "TODAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Upload to today's release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TODAY }}
          name: "v${{ env.TODAY }} — x-cmd install data"
          body: |
            Daily snapshot of the x-cmd install package index.
            Each release `vYYYYMMDD` is immutable — assets reflect the
            build state at the time of creation.
          files: |
            v*.all.tsv
            v*.all.tar.xz
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: true