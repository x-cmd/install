name: Build data artifacts

on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Build each supported format
        run: |
          set -e
          while IFS= read -r N; do
            # skip blanks and comments
            case "$N" in ''|\#*) continue ;; esac
            script=".x-cmd/v${N}.yml2tsv.py"
            if [ ! -f "$script" ]; then
              echo "::error::missing script for format v$N: $script"
              exit 1
            fi
            echo "::group::Building format v$N"
            python3 "$script" src -o "v${N}.all.tsv"
            tar -cJf "v${N}.all.tar.xz" "v${N}.all.tsv" src/
            echo "::endgroup::"
          done < .format-versions-supported

      - name: List built artifacts
        run: ls -la v*.all.tsv v*.all.tar.xz

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data
          target_commitish: main
          name: "x-cmd install data"
          body: |
            Daily auto-rebuilt package index for `x install`.
            Each format version has its own tsv + tarball, continuously
            rebuilt in parallel. New formats are added by appending to
            `.format-versions-supported` and dropping a matching
            `.x-cmd/vN.yml2tsv.py` script.
          files: |
            v*.all.tsv
            v*.all.tar.xz
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: true