name: Build data artifacts

on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Convert yml to all.tsv
        run: python3 .x-cmd/yml2tsv.py src -o all.tsv

      - name: Build all.tar.xz
        run: tar -cJf all.tar.xz all.tsv src/

      - name: Upload to v1.0.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "v1.0.0 — x-cmd install data"
          body: |
            Daily auto-rebuilt package index for `x install`.
            - `all.tsv` — TSV index (name, category, lang, source, desc_cn/en, binlist, rule, other)
            - `all.tar.xz` — TSV + full `src/` yml tree
          files: |
            all.tsv
            all.tar.xz
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: true