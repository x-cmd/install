name: Build data artifacts

on:
  schedule:
    # 12:00 UTC daily = 20:00 Asia/Shanghai (UTC+8)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Daily path: schedule → immutable v<YYYYMMDD>
      - name: Set TODAY (daily release tag)
        if: github.event_name == 'schedule'
        run: echo "TODAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Publish daily release
        if: github.event_name == 'schedule'
        uses: ./.github/actions/release-data
        with:
          tag: v${{ env.TODAY }}
          name: 'v${{ env.TODAY }} — x-cmd install data'
          body: |
            Daily snapshot of the x-cmd install package index.
            Each release `vYYYYMMDD` is immutable — assets reflect the
            build state at the time of creation (12:00 UTC).
          prerelease: 'false'
          make_latest: 'true'

      # Dev path: manual trigger → replaceable 'dev' release
      - name: Publish dev release
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/release-data
        with:
          tag: dev
          name: 'dev — x-cmd install data (latest manual build)'
          body: |
            Latest **manual** build of x-cmd install data.

            Assets get **replaced on every workflow_dispatch run** — this
            release is a moving target. For stable, immutable daily
            snapshots, use the `v<YYYYMMDD>` releases (12:00 UTC daily).
          prerelease: 'true'
          make_latest: 'false'