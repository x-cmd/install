name: Build data artifacts

on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Convert yml to all.tsv
        run: |
          python3 << 'PYEOF'
          import os, sys, json, subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed

          SRC = "src"
          OUT = "all.tsv"
          COMBINED = (
              '{"lang": (.lang // ""), "homepage": (.homepage // ""), '
              '"desc_cn": (.desc.cn // ""), "desc_en": (.desc.en // ""), '
              '"binlist": .binlist, "rule": .rule, "license": .license, "x": .x}'
          )
          HEADER = ["name", "category", "lang", "source", "desc_cn", "desc_en", "binlist", "rule", "other"]

          def escape_tsv(v):
              if not v:
                  return ""
              v = v.replace('\\', '\\\\')
              v = v.replace('"', '\\"')
              v = v.replace('\n', '\\n')
              v = v.replace('\r', '\\r')
              v = v.replace('\t', '\\t')
              return v

          def process(f):
              name = os.path.basename(f)[:-4]
              cat = os.path.basename(os.path.dirname(f))
              d = {}
              try:
                  r = subprocess.run(
                      ['yq', '-o=json', COMBINED, f],
                      capture_output=True, text=True, timeout=10,
                  )
                  if r.returncode == 0 and r.stdout.strip():
                      d = json.loads(r.stdout)
              except Exception as e:
                  print(f"yq fail {f}: {e}", file=sys.stderr)
              lang = (d.get("lang") or "").strip()
              hp = (d.get("homepage") or "").strip()
              dcn = escape_tsv((d.get("desc_cn") or "").strip())
              den = escape_tsv((d.get("desc_en") or "").strip())
              bl_raw = d.get("binlist")
              bl = ",".join(str(x) for x in bl_raw) if bl_raw else name
              rl_raw = d.get("rule")
              rl = json.dumps(rl_raw, separators=(',', ':')) if rl_raw else ""
              other = {}
              for k in ("homepage", "license", "x"):
                  v = d.get(k)
                  if v is not None and v != "":
                      other[k] = v
              o = escape_tsv(json.dumps(other, ensure_ascii=False, separators=(',', ':')))
              return [name, cat, lang, hp, dcn, den, bl, rl, o]

          ymls = []
          for root, _, files in os.walk(SRC):
              for f in files:
                  if f.endswith('.yml'):
                      ymls.append(os.path.join(root, f))

          rows = []
          with ThreadPoolExecutor() as ex:
              futures = {ex.submit(process, f): f for f in ymls}
              for fut in as_completed(futures):
                  try:
                      rows.append(fut.result())
                  except Exception as e:
                      print(f"err {futures[fut]}: {e}", file=sys.stderr)

          with open(OUT, 'w') as out:
              out.write('\t'.join(HEADER) + '\n')
              for r in rows:
                  out.write('\t'.join(r) + '\n')

          print(f"Wrote {len(rows)} rows to {OUT}")
          PYEOF

      - name: Build all.tar.xz
        run: tar -cJf all.tar.xz all.tsv src/

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all.tsv all.tar.xz
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): rebuild all.tsv + all.tar.xz"
            git push
          fi