name: Release today

on:
  schedule:
    # 12:00 UTC daily = 20:00 Asia/Shanghai (UTC+8)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Empty trigger-anchor so workflow_dispatch can fire this workflow.
  # GitHub rejects dispatch when every job has a `needs:` dep.
  preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - run: echo "preflight ok"

  # Inlined lint — release cannot use `needs: <other-workflow-job>`
  # via workflow_dispatch (GitHub's static validator rejects it).
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install x-cmd
        run: |
          curl -sf https://get.x-cmd.com | sh -s -- -y
          echo "$HOME/.x-cmd.root/bin" >> "$GITHUB_PATH"

      - name: ajv schema check
        run: |
          diff -q .vscode/install.schema.json .x-cmd/install-yml-check.schema.json
          x ajv -s .vscode/install.schema.json src/

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno field linter
        run: deno run --allow-read .x-cmd/lint-yml.deno.ts

  build:
    needs: [preflight, lint]
    runs-on: ubuntu-slim
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set TODAY + YESTERDAY
        run: |
          echo "TODAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "YESTERDAY=$(date -u -d 'yesterday' +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/release-data
        with:
          tag: v${{ env.TODAY }}
          name: v${{ env.TODAY }}
          body: |
            Daily snapshot of the x-cmd install package index.
            Each release `vYYYYMMDD` is immutable — assets reflect the
            build state at the time of creation (12:00 UTC).

            If today's build is identical to `v${{ env.YESTERDAY }}`, this
            release is skipped (no empty duplicate).
          prerelease: 'false'
          make_latest: 'true'
          if_changed_since: v${{ env.YESTERDAY }}