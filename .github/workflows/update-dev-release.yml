name: Update dev release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Empty trigger-anchor so workflow_dispatch can fire this workflow.
  # GitHub rejects dispatch when every job has a `needs:` dep.
  preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - run: echo "preflight ok"
  build:
    needs: [preflight, lint]
    runs-on: ubuntu-slim
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-data
        with:
          tag: dev
          name: dev
          body: |
            Latest **manual** build of x-cmd install data.

            Assets get **replaced on every workflow_dispatch run** — this
            release is a moving target. For stable, immutable daily
            snapshots, use the `v<YYYYMMDD>` releases (12:00 UTC daily).
          prerelease: 'true'
          make_latest: 'false'