name: Update dev release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Empty trigger-anchor so workflow_dispatch can fire this workflow.
  # GitHub rejects dispatch when every job has a `needs:` dep.
  preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - run: echo "preflight ok"

  # Inlined lint — see comment in release-today.yml.
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install x-cmd
        run: |
          curl -sf https://get.x-cmd.com | sh -s -- -y
          echo "$HOME/.x-cmd.root/bin" >> "$GITHUB_PATH"

      - name: ajv schema check
        run: |
          diff -q .vscode/install.schema.json .x-cmd/install-yml-check.schema.json
          x ajv -s .vscode/install.schema.json src/

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno field linter
        run: deno run --allow-read .x-cmd/lint-yml.deno.ts

  build:
    needs: [preflight, lint]
    runs-on: ubuntu-slim
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-data
        with:
          tag: dev
          name: dev
          body: |
            Latest **manual** build of x-cmd install data.

            Assets get **replaced on every workflow_dispatch run** — this
            release is a moving target. For stable, immutable daily
            snapshots, use the `v<YYYYMMDD>` releases (12:00 UTC daily).
          prerelease: 'true'
          make_latest: 'false'