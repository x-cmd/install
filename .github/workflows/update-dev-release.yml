name: Update dev release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-data
        with:
          tag: dev
          name: dev
          body: |
            Latest **manual** build of x-cmd install data.

            Assets get **replaced on every workflow_dispatch run** — this
            release is a moving target. For stable, immutable daily
            snapshots, use the `v<YYYYMMDD>` releases (12:00 UTC daily).
          prerelease: 'true'
          make_latest: 'false'