name: 'release-data'
description: 'Build every .x-cmd/v*.yml2tsv.py format and publish to a GitHub Release'

inputs:
  tag:
    description: 'Git tag (and release name suffix) to attach the release to'
    required: true
  name:
    description: 'Display name of the release'
    required: true
  body:
    description: 'Release notes / description (markdown)'
    required: false
    default: ''
  prerelease:
    description: 'Mark as pre-release (dev/snapshot channels)'
    required: false
    default: 'false'
  make_latest:
    description: 'Mark as Latest stable release'
    required: false
    default: 'true'
  if_changed_since:
    description: |
      Reference release tag to diff against. If every built `v*.all.tsv`
      matches the reference exactly, the upload step is skipped (the
      release is not created/updated). Empty = always upload.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install yq
      shell: bash
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
        yq --version

    - name: Build each format script
      shell: bash
      run: |
        set -e
        shopt -s nullglob
        for script in .x-cmd/v*.yml2tsv.py; do
          N=$(basename "$script" .yml2tsv.py | sed 's/^v//')
          echo "::group::Building format v$N"
          python3 "$script" src -o "v${N}.all.tsv"
          tar -cJf "v${N}.all.tar.xz" "v${N}.all.tsv" src/
          echo "::endgroup::"
        done

    - name: List built artifacts
      shell: bash
      run: ls -la v*.all.tsv v*.all.tar.xz

    - name: Compare with reference release
      if: inputs.if_changed_since != ''
      id: compare
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        ref_dir=/tmp/release-ref
        rm -rf "$ref_dir"
        mkdir -p "$ref_dir"

        if gh release download "${{ inputs.if_changed_since }}" \
             --pattern "v*.all.tsv" \
             --dir "$ref_dir" >/dev/null 2>&1; then
          : # downloaded successfully
        else
          echo "::notice::Reference release '${{ inputs.if_changed_since }}' not found — will upload today."
          echo "changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        for tsv in v*.all.tsv; do
          if [ ! -f "$ref_dir/$tsv" ]; then
            echo "::notice::$tsv is new (no counterpart in ${{ inputs.if_changed_since }}) — uploading."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! diff -q "$ref_dir/$tsv" "$tsv" >/dev/null 2>&1; then
            echo "::notice::$tsv differs from ${{ inputs.if_changed_since }} — uploading."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        echo "changed=false" >> "$GITHUB_OUTPUT"
        echo "::notice::No changes since ${{ inputs.if_changed_since }} — skipping release."

    - name: Upload to release
      if: inputs.if_changed_since == '' || steps.compare.outputs.changed == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.name }}
        body: ${{ inputs.body }}
        files: |
          v*.all.tsv
          v*.all.tar.xz
        fail_on_unmatched_files: false
        prerelease: ${{ inputs.prerelease == 'true' }}
        make_latest: ${{ inputs.make_latest == 'true' }}